  related_work_outline:
  - 'Mainstream direction: End-to-end autonomous research agents that generate hypotheses
    or experimental ideas, execute code or experiments, verify results, and draft
    reports; examples include AutoResearchClaw, SAGE, EvoMaster, and AI CFD Scientist.'
  - 'Shared research pattern: Coupling idea generation with validity or verification
    gates, executable artifacts, and human or formal checks to turn open-ended hypotheses
    into defensible results.'
  - 'Key differences: Verification strategy varies from vision-language physics checks
    and formal Lean proofs to structured failure attribution and human-in-the-loop
    checkpoints; evaluation ranges from domain benchmarks to AI-judged case studies.'
  - 'Trend evolution: Within the 2025–2026 frontier evidence, systems are moving from
    broad agent surveys and benchmark probes toward self-correcting, self-evolving,
    domain-specialized research loops with stronger reproducibility claims.'
  - 'Open questions: Whether generated hypotheses generalize beyond narrow benchmarks,
    how proxy metrics map to real discovery, and how to close gaps between formal/informal
    claims and between human oversight and autonomy.'
  related_work_outline_zh:
  - 主流方向：端到端自主研究智能体，生成假设或实验方向并执行、验证和撰写报告；代表性工作包括 AutoResearchClaw、SAGE、EvoMaster 和
    AI CFD Scientist。
  - 研究共性：把想法生成与有效性验证或验证门控、可执行产物以及人工或形式化检查耦合，使开放假设变成可辩护结果。
  - 关键差异：验证策略不同，包括视觉-语言物理检查、Lean 形式化证明、结构化失败归因和人机协同检查点；评测范围从领域基准到 AI 专家判断的案例研究。
  - 趋势演进：在 2025–2026 前沿证据中，系统正从宽泛的智能体综述和基准探测转向自纠正、自演化、领域专门的研究循环，并强调可复现性。
  - 开放问题：生成的假设能否泛化到窄基准之外，代理指标如何映射真实科学发现，以及如何缩小形式化/非形式化声明和人工监督/自主性之间的差距。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Turning a research idea into an executable experimental or theoretical
        workflow with generated artifacts and reports.
      what_remains_open: Domain generality and whether idea novelty can be separated
        from execution quality remain unevaluated beyond small case sets.
    - line: Validity-gated and self-correcting research loops
      what_it_solves: Recovering from experiment or proof failures through verification,
        failure attribution, and grounded reporting.
      what_remains_open: Verification gates are incomplete; for example, one physics
        gate missed 2 of 16 planted failures, and formal proofs do not guarantee informal
        claims align.
    - line: Scientific discovery benchmarks and human baselines
      what_it_solves: Making AI scientist claims comparable through tasks, baselines,
        metrics, and human expert scores.
      what_remains_open: Benchmarks use proxy outcomes such as multiple-choice or
        case-study preference; real discovery utility and coverage are unresolved.
    - line: Formal verification for theoretical hypothesis generation
      what_it_solves: Producing machine-checked theorem and proof artifacts for causal
        inference and auditing statement alignment.
      what_remains_open: Formal correctness is assumption-bound; statement audits
        and human inspection still leave an untested alignment gap.
    - line: Conceptual surveys and organizational frameworks
      what_it_solves: Mapping agentic discovery capabilities, evaluation metrics,
        datasets, and challenges across disciplines.
      what_remains_open: Categories are largely descriptive and lack direct empirical
        validation that they predict system behavior or reliability.
    consensus:
    - Hypothesis generation is treated as useful only when connected to executable
      validation, measured evidence, and artifact or report production rather than
      free-text suggestion.
    - Current systems still depend on some human, formal, or learned gate to catch
      fabricated numbers, silent failures, or misaligned claims.
    - Evaluation is strongest when it includes baselines, ablations, metrics, and
      human or expert judgments; missing citation or prestige signals in this packet
      are separate from methodology evidence.
    disagreements:
    - 'Verification mechanisms differ: some use domain-specific perception such as
      rendered flow fields, some use formal proof assistants, and others use structured
      failure attribution or human-in-the-loop checkpoints.'
    - 'Supervision and evaluation targets differ: one line benchmarks on real omics
      data with graduate-level human baselines, while others use AI-judged case studies
      or broad research benchmarks, changing what discovery success means.'
    - 'Interaction and deployment setting differ: some systems are closed autonomous
      loops, some are interactive platforms with rollback/resume and customizable
      teams, and others formally verify theoretical claims rather than run empirical
      experiments.'
    open_questions:
    - Do reported improvements from validity gates, self-evolution, or self-correction
      transfer to unseen scientific domains and real discovery, or mostly to benchmark
      execution quality?
    - How should evaluation balance task-specific metrics, human baselines, and AI-judged
      novelty when current evidence shows different systems winning under different
      criteria?
    - Can silent-failure detectors, statement audits, or formal verification become
      complete enough to justify reducing human oversight without increasing the risk
      of plausible but wrong results?
    - What reproducibility evidence is missing? Several papers report repository or
      artifact signals, but the packet does not include actual links, datasets, or
      independent replication results.
