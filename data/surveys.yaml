  related_work_outline_zh:
  - 主流方向：构建端到端自主科学发现流水线，将想法生成、代码或实验执行、分析、论文撰写与验证、评审或记忆组件整合到智能体闭环中。
  - 研究共性：把科研流程分解为规划、执行、评估、修订等模块阶段，并用任务指标、自动评审或生成论文形成闭环。
  - 关键差异：系统从完整论文生成延伸到消融规划、失败感知记忆等子任务；评测设置包括合成发现任务、内部AI案例研究、基准套件和工作坊投稿。
  - 趋势演进：2024年前沿更强调广义端到端框架；后续工作转向可靠性机制、专项基准、交互监控和接近同行评审的验证，但可用时间跨度较窄且属于当前前沿。
  - 开放问题：自动指标和评审能否迁移到真实实验室或广泛同行评审科学；哪些组件真正提升发现能力；如何扩展到所选ML、PDE和模拟任务之外。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery pipelines
      what_it_solves: Coordinating idea generation, code or experiment execution,
        analysis, and manuscript drafting in a single agentic workflow
      what_remains_open: Domain coverage is narrow, output quality is inconsistent,
        and validation often depends on automated LLM review rather than broad human
        or real-world evidence
    - line: Discovery environment and benchmark design
      what_it_solves: Making agent capabilities comparable through controlled tasks
        and metrics that require hypothesis formation, experiment design, analysis,
        and conclusion
      what_remains_open: Synthetic or virtual tasks may not transfer to physical lab
        experimentation, and current baselines fail without clear component-level
        diagnostics
    - line: Experiment planning and failure-aware memory
      what_it_solves: Improving experiment selection by capturing failed attempts
        or identifying missing ablation choices for future agent decisions
      what_remains_open: Evidence is limited to selected AI, benchmark, or PDE settings,
        leaving generalization to broader experiment workflows unresolved
    - line: Interactive orchestration and monitoring systems
      what_it_solves: Transforming autonomous agents into inspectable, human-controllable
        research teams with customizable roles, dashboards, and local code harnesses
      what_remains_open: Evaluation is based on small internal case studies, and standardized
        validation across hardware, datasets, and user settings is missing
    - line: Automated verification and review loops
      what_it_solves: Using internal verification, simulated reviewers, or metric-based
        judges to detect logical errors and score generated results
      what_remains_open: LLM judges may inherit bias, human agreement is not always
        established, and calibration of these validation signals remains unresolved
    consensus:
    - 'Most systems model experiment automation as closed-loop decomposition: propose
      a next experiment or hypothesis, execute or simulate it, collect feedback, then
      revise.'
    - Automated evaluation is a central scaffold, using task success metrics or LLM-based
      judges to estimate result quality.
    - Current agents still lag behind or only partially match human scientific judgment,
      especially on hypothesis and ablation selection.
    - Architectures tend to be modular, separating experiment management, review,
      memory, or verification rather than using one monolithic model.
    disagreements:
    - 'Evaluation target differs: some systems optimize manuscript or workshop acceptance,
      while others optimize synthetic task completion or ablation recall.'
    - 'Interaction mode differs: some systems are fully autonomous, while others emphasize
      rollback, live monitoring, and human-in-the-loop control.'
    - 'Feedback signal differs: some rely on success or task metrics, some introduce
      failure-aware memory, and others use VLM-assisted reviewer feedback.'
    - 'Deployment setting differs: some target applied mathematics or theory generation,
      others target empirical machine learning, and others cover simulated physics
      or proteomics tasks.'
    open_questions:
    - Do LLM-based review scores and synthetic task metrics predict whether generated
      experiments or papers are scientifically valid in real settings?
    - Can workshop-level acceptance be converted into stable conference-level or broad
      peer-reviewed scientific discovery?
    - How should failure memory and ablation planning generalize beyond AI, benchmark,
      and PDE cases to broader lab experiments?
    - What is the separable contribution of verification loops, experiment managers,
      code harnesses, and memory layers to reported improvements?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现流水线
      解决的问题: 将想法生成、代码或实验执行、分析、论文撰写整合到单一智能体工作流中
      尚未覆盖: 领域覆盖较窄，输出质量不稳定，验证常依赖自动LLM评审而非广泛人类或真实世界证据
    - 路线: 发现环境与基准设计
      解决的问题: 通过受控任务和指标，评估智能体在假设、实验设计、分析、结论等完整发现能力上的表现
      尚未覆盖: 合成或虚拟任务可能无法迁移到实体实验，当前基线失败但缺少组件级诊断
    - 路线: 实验规划与失败感知记忆
      解决的问题: 通过记录失败尝试或发现缺失消融，改进后续实验选择
      尚未覆盖: 证据仅限于AI、基准或PDE设置，向更广泛实验工作流的推广尚未验证
    - 路线: 交互式编排与监控系统
      解决的问题: 将自主智能体变为可检查、可人工控制的研究团队，支持自定义角色、仪表盘和本地代码工具
      尚未覆盖: 评估依赖小规模内部案例研究，缺少跨硬件、数据集和用户设置的标准化验证
    - 路线: 自动验证与评审回路
      解决的问题: 使用内部验证、模拟评审或指标判定来发现逻辑错误并评估生成结果
      尚未覆盖: LLM评审可能带有偏见，人类一致性不总是建立，验证信号的校准仍不明确
    共识:
    - 多数系统将实验自动化视为闭环分解：提出下一实验或假设，执行或模拟，收集反馈，再修订。
    - 自动评估是核心支撑，常用任务成功指标或LLM评审来估计结果质量。
    - 当前智能体在假设和消融选择等任务上仍低于或仅部分匹配人类科学判断。
    - 架构趋于模块化，常将实验管理、评审、记忆或验证组件分开，而非使用单一模型完成全流程。
    分歧:
    - 评测目标不同：有的系统优化论文或工作坊接受度，有的优化合成任务完成度或消融召回。
    - 交互模式不同：有的系统完全自主，有的强调回滚、实时监控和人类参与控制。
    - 反馈信号不同：有的依赖成功信号或任务指标，有的引入失败感知记忆，有的使用VLM辅助评审反馈。
    - 部署设置不同：有的面向应用数学或理论生成，有的面向实证机器学习，有的覆盖模拟物理或蛋白组学任务。
    开放问题:
    - 基于LLM的评审分数和合成任务指标能否预测真实科学实验或论文的有效性？
    - 工作坊级接受能否转化为稳定的会议级或广泛同行评审级科学发现能力？
    - 失败记忆和消融规划如何扩展到AI、基准和PDE之外的更广泛实验室实验？
    - 验证循环、实验管理器、代码工具和记忆层对性能提升的可分离贡献是什么？
