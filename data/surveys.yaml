    分歧:
    - 交互模式不同：有的作为人在环写作辅导者，有的尝试端到端自动生成稿件。
    - 评测目标不同：评审可靠性、复现成功和多模态传播质量是不同结果。
    - 人类控制程度不同：以人为中心的辅助保留作者判断，自动化写作和复现流程则减少或移除直接人工监督。
    - 集成范围不同：Overleaf编辑、海报生成、文献检索和复现管道对应不同部署场景。
    开放问题:
    - 在数据集、基线、指标和局限性字段不可见时，这些智能体如何被评价？
    - 流畅的自动写作能否同时保持方法可靠性和事实正确性？
    - AI评审和复现判断与专家人工决策及真实复现结果的一致性如何？
    - 失败如何在检索、写作、评审和复现等多智能体子任务之间传播？
    - 论文生成的多模态制品能否在领域专家判断下保持技术准确性？
