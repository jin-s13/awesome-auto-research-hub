    can reliably design controlled, falsifiable, externally valid experiments.'
  related_work_outline_zh:
  - 主流方向：构建端到端自主研究智能体，把构思、代码执行、实验、分析、验证和论文生成串联为一个工作流，并以LLM/VLM评审作为默认质量信号。
  - 研究共性：将科学发现拆解为模块化智能体角色或路径，用验证器或评审器对输出把关，并通过生成论文、盲发现任务或外部同行评审进行评估。
  - 关键差异：验证机制不同，包括逻辑验证循环、物理感知视觉门控、LLM审稿和真实研讨会同行评审；评测目标也从机器学习论文到领域修正和证据成熟度任务不等。
  - 趋势演进：在2024-2026前沿内，研究从通用机器学习论文自动生成转向领域特定的科学智能体和基于证据的基准，以暴露对照、稳健性和可证伪性缺失。
  - 开放问题：自动评审是否能衡量真实科学效用，验证是否能跨领域和跨基座模型泛化，以及智能体是否可靠地设计对照、可证伪且可外部验证的实验。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end general research agents
      what_it_solves: Covers the full research cycle from ideation through code, experiments,
        analysis, visualization, manuscript writing, and simulated review without
        requiring a domain-specific solver.
      what_remains_open: Acceptance and result quality are inconsistent; validation
        relies heavily on LLM reviewers or low-cost simulations, and conference-level
        reproducibility remains sparse.
    - line: Domain-specific scientific agents with verification gates
      what_it_solves: Adds field-aware validation such as logical proof auditing or
        physics-based visual inspection of flow fields to catch errors before a result
        is accepted or written up.
      what_remains_open: The verification gate can miss planted silent failures, and
        the approach is demonstrated mainly in one domain, so cross-domain generality
        and human-standard validity are unproven.
    - line: Evidence-grounded discovery benchmarks
      what_it_solves: Reframes evaluation from reproduction of hidden studies to blind
        claim formation from frozen data, scoring evidentiary maturity with an automated
        LLM judge.
      what_remains_open: Evidence is from a single frozen base model; agents plateau
        around similar scores and lack controls, robustness, falsifiability, and cross-dataset
        generalization.
    - line: Agentic tree search and reviewer feedback loops
      what_it_solves: Replaces fixed or human-coded templates with progressive search
        over hypotheses and experiments, using visual reviewer feedback to iteratively
        refine figures and papers.
      what_remains_open: Demonstrated acceptance is low and workshop-level; the search
        improves coverage but does not yet guarantee stable, externally defensible
        scientific claims.
    - line: Virtual environments for discovery-agent development
      what_it_solves: Provides reusable tasks that require full discovery cycles—hypothesis
        formation, experiment design, analysis, and conclusion—so agent abilities
        can be benchmarked across topics and difficulty levels.
      what_remains_open: Strong prior baselines still struggle, and the environment
        measures task completion rather than whether the discovered knowledge transfers
        to real scientific decision utility.
    consensus:
    - A complete research cycle should be decomposed into ideation, execution, analysis,
      verification, and writing stages rather than solved as a single prompt.
    - Automated reviewers or judges are widely used as quality signals, but they are
      proxies for scientific validity and do not replace external evidence.
    - Verification and validity gates are necessary because autonomous pipelines can
      produce plausible-looking outputs that fail under logical, physical, or experimental
      scrutiny.
    - Current systems are stronger at executing and documenting analyses than at designing
      controlled, robust, falsifiable scientific claims.
    disagreements:
    - Some systems target domain-agnostic ML research, while others specialize in
      applied mathematics or computational fluid dynamics and use field-specific validity
      checks.
    - 'Validation differs: simulated LLM review versus real workshop peer review versus
      internal logical verification versus vision-language physical inspection.'
    - 'Evaluation targets differ: generated paper acceptance, benchmark completion
      in a virtual environment, blind claim formation from frozen data, or domain-specific
      error reduction.'
    - 'Interaction and autonomy differ: human-as-PI collaboration, fully autonomous
      tree search, and benchmarked coding agents each assume different levels of human
      oversight.'
    - 'Reproducibility signals differ: some works provide open-source artifacts or
      code links, while others report results without visible limitation or artifact
      evidence, creating verification gaps.'
    open_questions:
    - Can automated LLM/VLM judges be calibrated against external scientific validity
      rather than surface plausibility or prior acceptance thresholds?
    - Which verification mechanisms generalize across domains, base models, and failure
      modes without missing critical silent errors?
    - What evaluation designs can measure whether agents produce controls, robustness
      checks, falsifiability, and cross-dataset generalization?
    - How do evidence-maturity scores relate to real discovery utility when performance
      plateaus across different coding agents?
    - Can end-to-end research agents move beyond workshop-level or simulated acceptance
      to externally reproducible, conference-level or field-facing contributions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端通用研究智能体
      解决的问题: 覆盖从构思到代码、实验、分析、可视化、论文写作和模拟评审的完整研究循环，不依赖领域特定求解器。
      尚未覆盖: 接受率和结果质量不稳定；验证高度依赖LLM评审或低成本模拟，会议级可复现性仍然不足。
    - 路线: 带验证门控的领域特定科学智能体
      解决的问题: 加入领域感知验证，如逻辑证明审计或流动场的物理视觉检查，在结果被接受或撰写前捕获错误。
      尚未覆盖: 验证门控会漏掉植入的静默失败，且主要在单一领域展示，跨领域泛化与人类标准有效性尚未证明。
    - 路线: 证据锚定发现基准
      解决的问题: 将评测从复现隐藏研究转为基于冻结数据形成盲主张，并用自动LLM评判器对证据成熟度打分。
      尚未覆盖: 证据仅来自单个冻结基座模型；智能体得分趋近且缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 路线: 智能体树搜索与审稿反馈闭环
      解决的问题: 用渐进式假设和实验搜索替代固定或人类编码模板，通过视觉审稿反馈迭代改进图表和论文。
      尚未覆盖: 展示的接受率为工作坊级别且不稳定；搜索扩大了覆盖，但尚不能保证稳定、可外部辩护的科学主张。
    - 路线: 面向发现智能体开发的虚拟环境
      解决的问题: 提供需要完整发现循环的可复用任务，包括假设形成、实验设计、分析和结论，以便跨主题基准测试智能体能力。
      尚未覆盖: 强基线仍表现困难，且环境测量任务完成度而非发现知识能否迁移到真实科学决策效用。
    共识:
    - 完整研究循环应拆解为构思、执行、分析、验证和写作阶段，而不是作为单次提示解决。
    - 自动评审器或评判器被广泛用作质量信号，但它们只是科学有效性的代理，不能替代外部证据。
    - 验证和有效性门控是必要的，因为自主流水线可能生成看似合理但无法通过逻辑、物理或实验审查的输出。
    - 当前系统在执行和记录分析方面较强，但在设计对照、稳健、可证伪的科学主张方面仍较弱。
    分歧:
    - 一些系统面向领域无关的机器学习研究，另一些则专攻应用数学或计算流体动力学，并使用领域特定有效性检查。
    - 验证方式不同：模拟LLM评审、真实研讨会同行评审、内部逻辑验证和视觉-语言物理检查并存。
    - 评测目标不同：生成论文接受率、虚拟环境基准完成度、冻结数据盲主张形成或领域误差降低。
    - 交互与自主程度不同：人类作为首席研究员、全自主树搜索和被基准测试的编码智能体预设了不同的人类监督水平。
    - 可复现信号不同：一些工作提供开源工件或代码链接，另一些缺少可见限制或工件证据，形成验证缺口。
    开放问题:
    - 自动LLM/VLM评判器能否校准到外部科学有效性，而非表面合理性或先前接受阈值？
    - 哪些验证机制能够跨领域、跨基座模型和跨失败模式泛化，同时不漏掉关键静默错误？
    - 何种评测设计能测量智能体是否产生对照、稳健性检查、可证伪性和跨数据集泛化？
    - 当不同编码智能体得分趋同时，证据成熟度评分如何关联真实发现效用？
    - 端到端研究智能体能否从工作坊级或模拟接受推进到可外部复现的会议级或领域级贡献？
