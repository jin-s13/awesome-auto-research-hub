  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agents
      what_it_solves: Completing the full research cycle from ideation through code/experiment
        execution, analysis, visualization, and manuscript writing with limited human
        intervention.
      what_remains_open: Output quality is inconsistent; full peer-review acceptance
        is rare, autonomy may still depend on templates or human oversight, and long-term
        contribution is unclear.
    - line: Domain-specific AI scientists with internal verification
      what_it_solves: Adding logical-consistency or physics-validity checks for theory-heavy
        or physics-intensive discovery so unsupported or silently failed results are
        filtered before human inspection.
      what_remains_open: Curated domain validators still miss some silent failures,
        transfer beyond the demonstrated domain is not established, and validation
        gates may not cover all analysis paths.
    - line: Virtual environments for discovery agent benchmarking
      what_it_solves: Providing repeatable tasks that require agents to form hypotheses,
        run experiments, analyze results, and act, enabling systematic comparison
        across discovery behaviors.
      what_remains_open: Synthetic or task-specific success may not correspond to
        real scientific utility; strong baseline agents still struggle on many tasks
        but the metrics may not capture evidence quality.
    - line: Evidence-grounded evaluation of scientific claims
      what_it_solves: Assessing whether an agent's claim is supported by data, controls,
        robustness, falsifiability, novelty, auditability, and cross-dataset generalization
        rather than mere paper reproduction.
      what_remains_open: Current coding agents plateau below trustworthy claim maturity
        and lack discriminating scientific judgment; evaluations are reported on a
        single frozen base model, so cross-model generality is missing.
    - line: Automated review and peer-review integration
      what_it_solves: Scaling paper quality assessment with LLM or VLM reviewers and
        using acceptance thresholds to signal whether generated manuscripts approach
        human-reviewed work.
      what_remains_open: Automated review alignment with human scientific judgment
        is partial; one accepted workshop manuscript does not establish conference-level
        reliability or stable quality.
