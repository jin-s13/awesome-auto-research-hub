  related_work_outline_zh:
  - 主流方向：基于LLM的端到端研究智能体，串联创意、实验执行、分析和论文撰写，并越来越多加入自动评审或验证环节。
  - 研究共性：系统将发现流程模块化，利用LLM评审、领域特定门控或模拟同行评审来筛选或评分生成的科学主张。
  - 关键差异：通用机器学习发现与具备物理或逻辑验证的领域系统；基于生成论文的评分与基于任务证据成熟度的评估；开源可复现性和基线覆盖不同。
