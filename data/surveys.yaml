  related_work_outline:
  - 'Mainstream direction: Most evidence centers on autonomous research agents that
    turn generated hypotheses into executed experiments and reported results, with
    closed-loop verification and self-correction, spanning domain-specific discovery
    and general research pipelines.'
  - 'Shared research pattern: Papers converge on a loop: generate candidate directions
    from literature or data diagnostics, execute code or experiments, verify outputs,
    attribute failures, and revise; many add verification gates or human checkpoints
    to reduce hallucinated results and silent failures.'
  - 'Key differences: Systems differ by verification mode: physics-aware visual gates,
    deterministic program authorities, verifiable reporting, or human-in-the-loop
    oversight. Evaluation varies from domain benchmarks to ML testbeds, proxy metrics,
    and AI-expert judgement. Some optimize research insight; others achieve mostly
    engineering gains.'
  - 'Trend evolution: Years are mostly 2025-2026, so the trend is within the current
    frontier: from single-shot autonomous pipelines toward multi-agent, human-collaborative,
    and self-correcting systems, with growing emphasis on benchmarks that test defensible
    evidence rather than leaderboard rank.'
  - 'Open questions: Can agents produce domain-level research insight rather than
    engineering tricks? How broadly do domain-specific verifiers transfer? Are proxy
    metrics aligned with real scientific utility? Are code and independent validation
    sufficient? Fully autonomous writing remains unsolved.'
  related_work_outline_zh:
  - 主流方向：证据主要集中在自主研究智能体上，它们把假设生成、执行实验、结果验证和报告连接成闭环，并加入自纠正或人机协作，覆盖领域特定发现和通用研究流水线。
  - 研究共性：多篇工作共享同一模式：从文献或数据诊断生成候选方向，执行实验或代码，验证输出，归因失败并修订；许多系统加入验证门控或人类检查点以减少幻觉结果和静默失败。
  - 关键差异：验证机制不同：物理感知视觉门控、确定性程序权威、可验证报告或人机监督；评测也由领域基准、ML 测试床、代理指标或 AI 专家判断等构成；有些追求研究洞察，有些主要获得工程改进。
  - 趋势演进：证据年份主要集中在 2025–2026 的当前前沿，显示从单次自主流水线走向多智能体、人机协作和自纠正系统，并更强调验证证据可信而不是单纯榜单排名。
  - 开放问题：智能体能否产出领域级研究洞察而非仅工程技巧？领域验证器能否跨任务泛化？代理指标是否与真实科研效用一致？代码与独立验证是否足够？全自动写作仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific autonomous discovery agents
      what_it_solves: Close the loop from hypothesis generation to executed domain
        experiments with physics-aware, biological, or forecasting-specific verification.
      what_remains_open: Generalization beyond narrow domains or tasks and coverage
        of silent failures; for example, a physics gate missed 2 of 16 planted failures.
    - line: Self-correcting research agent architectures
      what_it_solves: Turn failed experiments into revised hypotheses or code through
        multi-hypothesis failure attribution and evidence-grounded reporting.
      what_remains_open: Fully autonomous conference-ready writing and end-to-end
        scientific reasoning are still unsolved; reporting constraints reduce but
        do not eliminate hallucination risk.
    - line: Human-AI collaborative and multi-agent research platforms
      what_it_solves: Orchestrate customizable roles, debate, execution, monitoring,
        and human intervention at high-leverage decision points.
      what_remains_open: Evaluation is often limited to small internal case studies
        or single baselines, so cross-field and user-setting generalization is not
        established.
    - line: Benchmarks and testbeds for scientific ML and AI scientists
      what_it_solves: Provide comparable tasks, baselines, metrics, and human baselines
        for cell annotation, scientific discovery questions, or improving published
        ML models.
      what_remains_open: Proxy metrics and expert preferences do not yet establish
        real scientific decision utility; agents often gain through engineering tricks
        rather than research insight.
    - line: Surveys and conceptual taxonomies of agentic discovery
      what_it_solves: Organize systems by domain and capability, catalog evaluation
        frameworks, datasets, and open challenges.
      what_remains_open: Proposed categories lack direct empirical validation that
        they predict model behavior or reliability; literature review automation and
        ethical concerns remain unresolved.
    consensus:
    - Autonomous research systems need explicit validation or verification gates to
      prevent silent failures and hallucinated numbers.
    - Hypothesis generation alone is insufficient; executed evidence and failure feedback
      are necessary for credible improvement.
    - Human collaboration placed at high-leverage decision points outperforms both
      full autonomy and exhaustive step-by-step oversight.
    - Current AI scientists show potential but remain below fully autonomous scientific
      discovery, especially in producing defensible claims and reliable scientific
      writing.
    disagreements:
    - 'Verification is instantiated differently: physics-aware visual inspection of
      rendered fields, deterministic program-enforced evaluation, or human/LLM expert
      judgement.'
    - 'Evaluation target differs: domain-specific physical or biological metrics,
      baseline comparison on benchmarks, or qualitative preference for novelty, completeness,
      and presentation.'
    - 'Autonomy design differs: fully autonomous loops, cognition-authority separation,
      interactive multi-agent teams, or targeted human-in-the-loop intervention.'
    - Some systems prioritize research insight, while others measure aggregate performance
      gains that are largely attributed to ML engineering tricks rather than novel
      hypotheses.
    open_questions:
    - What evidence would show that an agent produced a domain-level research insight
      rather than a parameter or engineering improvement?
    - Can domain-specific verification gates detect out-of-distribution silent failures
      without relying on the same assumptions as training cases?
    - Are benchmark metrics and expert judgments aligned with real scientific decision
      utility, reproducibility, and long-term discovery?
    - How well do systems transfer across datasets, hardware, and research fields
      when external code or data release is not confirmed?
    - What minimal human intervention mode is required to keep autonomous research
      reliable and ethically acceptable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域特定自主发现智能体
      解决的问题: 在 CFD、单细胞组学、预测等任务中闭合从假设生成到执行实验并用领域验证反馈修订的回路。
      尚未覆盖: 跨领域或跨任务泛化和静默失败覆盖不足；例如物理门控在植入失败中漏检 2/16。
    - 路线: 自纠正研究智能体架构
      解决的问题: 通过多假设失败归因和基于测量值的报告，把失败实验转化为修订后的假设或代码。
      尚未覆盖: 全自动会议级写作和端到端科研仍未解决；报告约束降低但不能完全消除幻觉风险。
    - 路线: 人机协作与多智能体研究平台
      解决的问题: 编排可定制角色、辩论、执行、监控和高杠杆决策点的人类干预。
      尚未覆盖: 评测常限于小规模内部案例或单一基线，跨领域和用户场景的泛化证据不足。
    - 路线: 科学 ML 与 AI 科学家的基准/测试床
      解决的问题: 为细胞注释、科学发现问题或改进已发表模型提供可比较任务、基线、指标和人类基线。
      尚未覆盖: 代理指标和专家偏好尚未对齐真实科研决策效用；智能体收益多来自工程技巧而非研究洞察。
    - 路线: 智能体科学发现的综述与概念分类
      解决的问题: 按领域和能力整理系统，汇总评估框架、数据集和开放挑战。
      尚未覆盖: 所提分类能否预测模型行为或可靠性缺乏实证验证；文献综述自动化和伦理问题仍未解决。
    共识:
    - 自主研究系统需要显式验证或验证门控来防止静默失败和幻觉数字。
    - 仅生成假设不够；执行证据和失败反馈是可信改进的必要部分。
    - 将人类协作放在高杠杆决策点优于完全自主和逐步详尽监督。
    - 当前 AI 科学家有潜力，但距离完全自主科学发现仍有差距，尤其在可辩护主张和可靠科学写作上。
    分歧:
    - 验证方式不同：渲染流场的物理感知视觉检查、确定性程序执行评估，或人类/LLM 专家判断。
    - 评测目标不同：领域物理或生物指标、基准上的基线对比，或对新颖性、完整性和呈现的定性偏好。
    - 自主设计不同：全自主闭环、认知-权威分离、交互式多智能体团队或精准人机干预。
    - 有些系统追求研究洞察，有些则衡量总体性能提升，但增益多被归因于 ML 工程技巧而非新颖假设。
    开放问题:
