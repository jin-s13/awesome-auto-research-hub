      解决的问题: 用确定性程序权威、规范评估和晋升决策约束开放式LLM行为，提高实现成功率并降低智能体成本。
      尚未覆盖: 主要在迭代式预测架构演化中展示，其权威边界能否迁移到其他研究工作流尚未验证。
    共识:
    - 自主研究系统日益把生成与验证分离：模型提出假设，执行环境运行实验，外部门控或评判器进行评估。
