  related_work_outline:
  - 'Mainstream direction: Building and evaluating AI agent systems that autonomously
    conduct the full scientific discovery loop, with growing emphasis on reliability,
    verification, and reproducibility.'
  - 'Shared research pattern: Modular decomposition of the scientific workflow (ideation,
    coding, experimentation, verification, write-up) into LLM-driven pipelines, paired
