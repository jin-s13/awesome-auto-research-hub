    - 'Verification strategy differs: internal logical audit, vision-language physics
      gates on rendered fields, or code execution without specialized validity gates.'
    - 'Autonomy and supervision differ: human principal-investigator-student collaboration
      versus fully automated open-ended loops.'
    - General-purpose systems emphasize manuscript generation, while domain-specific
      systems emphasize measurable domain corrections such as turbulence model improvement.
    open_questions:
