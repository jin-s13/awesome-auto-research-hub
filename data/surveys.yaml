  - 趋势演进：2024年出现端到端自动发现与评测环境，2025年智能体树搜索使AI生成工作坊论文通过评审，2026年转向领域验证与证据锚定评测，更强调可信性。
  - 开放问题：LLM评审或接收是否代表真实科学贡献；当前智能体是否具备对照、稳健性与可证伪性；静默失败能否被有效检测；跨基座模型、跨领域与跨层级泛化仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end discovery pipelines
      what_it_solves: Automates idea generation, code implementation, experiment execution,
        visualization, manuscript writing, and often review, reducing the human effort
        and per-paper cost of running a complete research loop.
      what_remains_open: Success is inconsistent and mainly demonstrated at workshop
        level or under automated judges; limitations and evidence of genuine novelty
        or real scientific contribution are often underreported.
    - line: Domain-constrained verification agents
      what_it_solves: Improves the validity of generated results by coupling discovery
        to domain-specific checks, such as internal logical coherence in applied mathematics
        or vision-language inspection of rendered flow fields in CFD.
      what_remains_open: Verification gates still miss some planted silent failures,
        and transfer beyond the demonstrated domain, solver, or reasoning style is
        not established.
    - line: Discovery evaluation environments
      what_it_solves: Provides controlled tasks for measuring whether agents can form
        hypotheses, design and run experiments, analyze results, and act on conclusions
        across many science-like scenarios.
      what_remains_open: Strong prior baselines still struggle, and it remains unclear
        whether synthetic or abstract task completion aligns with real-world scientific
        discovery utility.
    - line: Evidence-grounded benchmarking
      what_it_solves: Evaluates the evidentiary maturity of open-ended discovery claims
        by exposing blind, peer-derived tasks and scoring controls, robustness, falsifiability,
        auditability, and cross-dataset generalization.
      what_remains_open: Reported results use only one frozen base model; evaluated
        coding agents plateau and lack the discriminating scientific acts needed for
        trustworthy claims.
    consensus:
    - Scientific discovery is represented as a multi-step loop connecting ideation,
      experimentation, analysis, writing, and evaluation.
    - LLM agents are the core execution mechanism, with growing use of tree search,
      retrieval, and verification modules.
    - The field is converging on the need for validity or evidence checks rather than
      treating generated manuscripts as sufficient output.
    - Evaluation is moving beyond prose quality toward task completion, evidence maturity,
      auditability, and reproducibility signals.
    disagreements:
    - 'Evaluation anchors differ: one line uses formal peer-review outcomes, another
      uses synthetic discovery task completion, and another uses blind evidence-maturity
      rubrics.'
    - 'Verification timing differs: some systems enforce domain-specific checks before
      accepting or writing results, while others rely on post-hoc automated review.'
    - 'Domain posture differs: general-purpose discovery systems coexist with narrowly
      constrained systems for applied mathematics and computational fluid dynamics.'
    - 'Success evidence differs: systems report high LLM-rubric scores or a single
      workshop acceptance, while benchmark results show coding agents plateau and
      lack controls and robustness.'
    open_questions:
    - Do LLM-judged paper scores or workshop acceptance reflect scientific contribution
      rather than presentation quality?
    - Can discovery agents consistently produce claims with controls, robustness,
      falsifiability, and cross-dataset generalization?
    - How can domain-specific validity gates reduce missed silent failures without
      overly narrowing the discovery space?
    - How stable are current rankings and behaviors across different base models,
      scientific domains, and full conference venues?
    - Which missing limitation statements and artifact details hide reproducibility
      gaps in the current evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端发现流水线
      解决的问题: 自动完成想法生成、代码实现、实验执行、可视化、论文写作，并常包含自动评审，从而减少完整科研循环的人力投入和单篇成本。
      尚未覆盖: 成功率不稳定，主要在工作坊或自动评审下展示；真实新颖性、科学贡献和系统局限性往往缺乏充分证据。
    - 路线: 领域约束验证型智能体
      解决的问题: 通过领域专用检查提高生成结果的有效性，例如应用数学中的逻辑一致性审计，或计算流体力学中对渲染流场的视觉-语言检查。
      尚未覆盖: 验证门仍会漏检部分植入的静默失败，且在已展示的领域、求解器或推理模式之外的迁移能力尚未证实。
    - 路线: 科学发现评测环境
      解决的问题: 通过可控任务测量智能体是否能形成假设、设计和运行实验、分析结果并基于结论行动，覆盖多种类科学场景。
      尚未覆盖: 先前表现较强的基线仍然困难，且抽象或合成任务完成度与真实科学发现效用之间的一致性尚不明确。
    - 路线: 证据锚定基准
      解决的问题: 利用盲评的同行研究任务，从对照、稳健性、可证伪性、可审计性和跨数据集泛化等维度评估开放式发现声明的证据成熟度。
      尚未覆盖: 当前结果仅基于一个冻结基座模型；受评编码智能体普遍停滞，缺乏建立可信声明所需的判别性科学行为。
    共识:
    - 科学发现被普遍建模为连接想法生成、实验、分析、写作与评测的多步骤闭环。
    - LLM智能体是核心执行单元，近年逐步加入树搜索、检索和验证模块。
    - 领域正在从只看生成论文转向要求有效性检查或证据质量，不再把生成稿件视为充分结果。
    - 评测正在从语言质量扩展到任务完成、证据成熟度、可审计性与可复现性信号。
    分歧:
    - 评测锚点不同：一类采用同行评审结果，一类采用合成任务完成度，另一类采用盲评证据成熟度评分。
    - 验证时点不同：部分系统在接收或写入结果前执行领域专用检查，部分系统依赖事后自动评审。
    - 领域定位不同：通用科研发现系统与面向应用数学、计算流体力学的窄域约束系统同时存在。
    - 成功证据不同：有的报告高LLM评分或单项工作坊接收，有的基准结果却显示编码智能体得分停滞，缺少对照与科学判断。
    开放问题:
    - LLM评审分数或工作坊接收在多大程度上代表科学贡献，而非写作和图表质量？
    - 发现智能体能否稳定产出具有对照、稳健性、可证伪性和跨数据集泛化的声明？
    - 如何设计领域验证门，在减少漏检静默失败的同时不过度压缩发现空间？
    - 当前结果在不同基座模型、科学领域和完整会议层级上的稳定性与排序关系是否会改变？
    - 现有证据中缺失的局限性说明和工件细节是否隐藏了可复现性缺口？
