    - 路线: 分类体系与层级组织生成
      解决的问题: 将检索到的论文组织为与专家综述分类法可比的结构化类别树和论文-类别映射
      尚未覆盖: 对齐评估常依赖单一专家参考；模型分类体系仍存在兄弟重叠、MECE违反和结构不平衡
