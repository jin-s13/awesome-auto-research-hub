  - 关键差异：评测目标分为虚拟发现任务、盲测证据成熟度任务、领域物理验证和工作坊同行评审；监督信号与交互模式也有所不同。
  - 趋势演进：从2024年端到端发现框架，演进到2025-2026年强调隐藏目标、证据成熟度和领域特定验证的基准。
