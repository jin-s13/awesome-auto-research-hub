    - Evaluation targets center on complete scientific discovery cycles and multi-step
      experimental reasoning rather than isolated prediction or single-step control
      tasks.
    - Human roles are shifting toward principal investigator, reviewer, curator, or
      monitor rather than directly performing every experimental step.
