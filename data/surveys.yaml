  related_work_outline:
  - 'Mainstream direction: The dominant line is long-horizon autonomous research agents
    that move durable search state out of conversation context and evaluate on benchmarked
    discovery tasks with explicit efficiency budgets.'
  - 'Shared research pattern: Most works structure research as propose, run, audit,
    and update loops; they use held-out or sparse high-fidelity feedback, reusable
    experience or skills, and efficiency metrics such as token, oracle, or force-call
    costs.'
  - 'Key differences: They differ in where research state lives, who assigns experiments,
    when high-fidelity feedback is queried, and whether evaluation targets software/ML
    engineering, materials discovery, molecular relaxation, or deep research question
    answering.'
  - 'Trend evolution: Available high-ranked evidence is concentrated in 2026, so the
    trend is within the current frontier: from monolithic context-growing agents toward
    harness state, stateless workers, surrogate repair, experience/skill libraries,
    and recursive self-improving audits.'
  - 'Open questions: Generalization beyond current benchmarks, attribution of performance
    gains, proxy-metric alignment with real research utility, and verification gaps
    from missing limitation fields or low reproducibility signals remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以长程自主研究智能体为主，强调将持久研究状态从对话上下文中外置，并在具有显式效率预算的基准任务上进行评测。
