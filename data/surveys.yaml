  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research manuscript systems
      what_it_solves: Compresses idea generation, code execution, experiments, visualization,
        and write-up into one agentic pipeline that can produce a complete paper.
      what_remains_open: Peer-review consistency, long-horizon reliability, and reproducible
        artifacts beyond workshop-level or rubric-based acceptance remain uncertain.
    - line: Domain-embedded verification-gated writing
      what_it_solves: Validates intermediate results before writing so generated papers
        do not silently misreport physics, logic, or experimental outcomes.
      what_remains_open: Verification gates may miss failures outside planted cases
        and depend on domain-specific checks that may not transfer across topics.
    - line: Human-in-the-loop research collaboration and intervention routing
      what_it_solves: Allocates human oversight to high-leverage decision points,
        reducing failure rates compared with full autonomy or exhaustive supervision.
      what_remains_open: Optimal intervention points, expert availability, and transfer
        of benefits to less technical communication are not established.
    - line: Self-correction and failure-attribution pipelines
      what_it_solves: Diagnoses experiment failures and constrains reports to measured
        values, reducing hallucinated numbers and incomplete outputs.
      what_remains_open: Conference-ready writing quality and complex theoretical
        or interdisciplinary writing still exceed current systems.
    - line: Automated review and evaluation of generated manuscripts
      what_it_solves: Provides cheap, scalable quality signals for generated papers
        through LLM reviewers or workshop peer review.
      what_remains_open: Reviewer alignment with human judgment, robustness to gaming,
        and standardized external validation are insufficiently tested.
    consensus:
    - All systems treat manuscript generation as part of an executable research loop,
      requiring evidence production before or alongside drafting.
    - Generated claims need verification, grounded reporting, or reviewer checks to
      reduce fabricated numbers, invalid results, and silent failures.
    - Human-AI interaction improves outcomes when placed at high-leverage decision
      points rather than being all-or-nothing.
    - Current evaluation relies heavily on LLM review rubrics, benchmark scores, or
      small workshop submissions; direct human peer-review acceptance remains rare
      and inconsistent.
    - Full autonomy still produces unstable success rates, with only a subset of generated
      papers completing or passing quality thresholds.
    disagreements:
    - 'Architecture differs: single end-to-end agentic loops, progressive tree search,
      structured multi-agent debate, and domain-specific physics or reasoning pipelines.'
    - 'Supervision differs: fully autonomous generation, PI-agent collaboration, or
      human intervention at selected decision points.'
    - 'Verification target differs: logical and theorem coherence, visual or physics
      plausibility, executable code and measured metrics, or citation and report groundedness.'
    - 'Domain and evaluation setting differ: applied mathematics, computational fluid
      dynamics, and ML subfields use different validity gates and benchmarks.'
    - 'Reporting strategy differs: some systems emphasize figure-grounded writing,
      others verifiable metric reporting, failure-attribution-driven correction, or
      reviewer-feedback loops.'
    open_questions:
    - Do LLM reviewer scores and rubric thresholds predict human peer-review decisions
      and real scientific value?
    - How do verification and failure attribution transfer from narrow planted failure
      tests to real open-ended research errors?
    - What is the minimal and optimal human intervention schedule for reliable manuscript
      quality across domains?
    - Can generated papers be trusted on code, dataset, metric, baseline, and limitation
      reproducibility when artifact signals are absent or incomplete?
    - How can systems avoid overfitting to review rubrics while improving citation,
      reference, and reporting accuracy?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究手稿系统
      解决的问题: 把想法生成、代码执行、实验、可视化和写稿压缩进同一条智能体流水线，能生成完整论文。
      尚未覆盖: 同行评审一致性、长时程可靠性、可复现工件仍停留在工作坊或量规级接受，缺少更强验证。
    - 路线: 领域嵌入式验证门控写作
      解决的问题: 在写作前验证中间结果，避免生成论文静默误报物理、逻辑或实验结论。
      尚未覆盖: 验证门控可能漏掉非植入的真实失败，且依赖领域特定检查，跨主题迁移能力不明确。
    - 路线: 人机协作研究与干预路由
      解决的问题: 把人类监督分配到高杠杆决策点，相比全自主或逐步监督降低失败率。
      尚未覆盖: 最优干预点、专家可用性，以及向非技术写作迁移的收益仍不明确。
    - 路线: 自我纠正与失败归因流水线
      解决的问题: 诊断实验失败并将报告约束为实际测量值，减少幻觉数字和不完整输出。
      尚未覆盖: 会议级写作质量和理论或跨学科复杂写作仍未解决。
    - 路线: 自动评审与生成手稿评估
      解决的问题: 通过LLM评审或工作坊同行评审为生成论文提供低成本、可扩展的质量信号。
      尚未覆盖: 评审与人类判断的一致性、对抗刷分和标准外部验证不足。
    共识:
    - 几乎所有系统都把论文生成嵌入可执行研究流程，要求草稿生成之前或同时产生证据。
    - 生成主张需要通过验证、基于事实的报告或评审检查，以减少伪造数字、无效结果和静默失败。
    - 在关键决策点引入人类协作优于全自主或逐步监督，这已被部分消融证据支持。
    - 当前评估主要依赖LLM评审量规、基准分数或少量工作坊投稿，直接人类同行评审接受仍然稀少且不稳定。
    - 完全自主的成功率仍不稳定，只有部分生成论文能完成管道或通过质量阈值。
    分歧:
    - 实现架构不同：单条端到端智能体循环、渐进树搜索、结构化多智能体辩论，以及领域特定的物理或推理管道。
    - 监督模式不同：完全自主生成、PI-代理协作，或仅在选定决策点引入人类干预。
    - 验证对象不同：逻辑与定理一致性、视觉或物理合理性、可执行代码与测量指标，或引用与报告依据。
    - 领域与评测设置不同：应用数学、计算流体动力学和机器学习子领域采用不同的有效性门控与基准。
    - 报告策略不同：有的强调基于图表的写作，有的强调可验证指标报告、失败归因修正或评审反馈循环。
    开放问题:
    - LLM评审分数和量规阈值是否预测人类同行评审决定与真实科学价值？
    - 验证和失败归因如何从狭窄的植入失败测试迁移到真实开放研究错误？
    - 在不同领域，何种人类干预计划对可靠手稿质量最有效且成本最低？
    - 当代码、数据集、指标、基线和局限性证据缺失或不完整时，能否信任生成论文的可复现性？
    - 系统如何避免过度拟合评审量规，同时改善引用、参考和报告准确性？
