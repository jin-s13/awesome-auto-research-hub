  - 主流方向：端到端LLM/多智能体系统自主提出假设、实现代码、执行实验、分析结果并撰写论文，同时评估环境和失败感知记忆受到更多关注。
  - 研究共性：多数系统将实验执行与内部验证或自动评审循环耦合，在人类判断前捕获错误，并使用自动评分或任务指标评估。
