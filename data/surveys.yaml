  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery workflow systems
      what_it_solves: Turns LLM-driven idea generation, code writing, experiment execution,
        visualization, paper writing, and simulated review into a continuous research
        pipeline.
      what_remains_open: Workflow completeness does not guarantee defensible claims;
        peer-review pass rates remain inconsistent and verification gates are missing
        or domain-specific.
    - line: Blind and peer-reviewed-derived benchmark environments for discovery agents
      what_it_solves: Provides tasks from real or simulated scientific studies with
        hidden conclusions, fixed scorers, and task-completion or evidence-maturity
        metrics for repeatable agent evaluation.
      what_remains_open: Task coverage and difficulty do not yet show that metric
        improvements correspond to real scientific utility; base-model generalization
        is not established.
    - line: Reliability and verification controls in agentic research systems
      what_it_solves: Adds physics-aware visual gates, deterministic program authority,
        or source-edit boundaries to detect silent failures and constrain autonomous
        modifications.
      what_remains_open: Verification is imperfect and may depend on domain-specific
        priors; validation across hardware, datasets, and user settings remains a
        gap.
    - line: Human-aligned and review-simulated evaluation
      what_it_solves: Uses automated reviewers or graduate-level human baselines to
        calibrate generated paper scores and task performance.
      what_remains_open: Automated and human-aligned scores may not capture controls,
        robustness, falsifiability, or long-term validity of scientific claims.
    consensus:
    - Autonomous execution and documentation alone are not enough; the field increasingly
      requires evidence, verification, or review gates before claims are considered
      defensible.
    - Blind tasks drawn from peer-reviewed work or large virtual task suites help
      scale evaluation, but they mostly show that current agents plateau in scientific
      judgment.
    - Current agents can perform competent analyses and produce audit-friendly records,
      yet they systematically lack controls, robustness, falsifiability, and cross-dataset
      generalization.
    - Verification and reproducibility signals are treated as part of trustworthiness,
      although the way they are measured varies across systems.
    disagreements:
    - 'Supervision differs: some rely on a fixed LLM evidence-maturity judge, others
      on deterministic program authority, vision-language physics gates, human baselines,
      or simulated conference review.'
    - 'Deployment setting differs: text-based simulated discovery, computational fluid
      dynamics, single-cell transcriptomics, time-series forecasting, and broader
      machine learning domains shape different failure modes.'
    - 'Evaluation target differs: one line targets complete open-ended discovery,
      another targets blind evidence claims, another targets task-specific architecture
      improvement, and another targets human-aligned annotation and discovery.'
    - 'Success criterion differs: peer-review acceptance, benchmark score, RMSE improvement,
      implementation success and token-time cost, or human-relative performance.'
    open_questions:
    - Which verification or authority mechanism generalizes across base models and
      domains without overfitting to a narrow evaluation task?
    - How can proxy metrics such as documentation quality or task completion be validated
      against the epistemic quality of scientific claims?
    - Why do otherwise competent coding agents plateau at similar evidence-maturity
      scores and lack discriminating acts such as controls and robustness checks?
    - How should external validation be standardized across datasets, simulators,
      and user settings when artifacts and baselines are not yet fully reported?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现工作流系统
      解决的问题: 将基于LLM的构思、代码编写、实验执行、可视化、论文写作和模拟评审整合为持续科研流程。
      尚未覆盖: 流程完整不保证结论可辩护；同行评审通过率不稳定，验证门控缺失或仅限特定领域。
    - 路线: 面向发现智能体的盲测与同行评审派生基准
      解决的问题: 提供来自真实或模拟科学研究、隐藏结论的任务，并用固定评分器、任务完成度或证据成熟度指标实现可重复评估。
      尚未覆盖: 任务覆盖和难度尚未证明指标提升对应真实科学效用；跨基座模型泛化性未建立。
    - 路线: 智能体科研系统中的可靠性与验证控制
      解决的问题: 加入物理感知视觉门控、确定性程序权威或源码编辑边界，以检测静默失败并约束自主修改。
      尚未覆盖: 验证并不完美且可能依赖领域先验；跨硬件、数据集和用户设置的验证仍缺失。
    - 路线: 人类对齐与模拟评审式评估
      解决的问题: 用自动评审器或研究生级人类基线校准生成论文评分和任务表现。
      尚未覆盖: 自动或人类对齐分数未必能反映对照、稳健性、可证伪性和科学结论的长期有效性。
    共识:
    - 仅具备自主执行和文档记录还不够；该领域越来越要求证据、验证或评审门控，结论才被视为可辩护。
    - 来自同行评审工作的盲任务或大规模虚拟任务套件有助于扩展评估，但主要表明当前智能体在科学判断上进入平台期。
    - 当前智能体能胜任分析执行并产出便于审计的记录，但普遍缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 验证和可复现信号被视为可信度的一部分，但各系统测量方式不同。
    分歧:
    - 监督信号不同：有的依赖固定LLM证据成熟度裁判，有的依赖确定性程序权威、视觉-语言物理门控、人类基线或模拟会议评审。
    - 部署场景不同：基于文本的模拟发现、计算流体动力学、单细胞转录组、时间序列预测和更广泛机器学习领域塑造了不同失败模式。
    - 评测目标不同：一脉评估完整开放式发现，一脉评估盲证据结论，一脉评估任务特定架构改进，还有一脉关注人类对齐的注释与发现。
    - 成功标准不同：同行评审接受、基准分数、RMSE改善、实现成功率与token/时间成本，或相对人类表现。
    开放问题:
    - 哪种验证或权威机制能跨基座模型和领域泛化，而不只是过拟合到狭窄的评测任务？
    - 如何验证文档质量或任务完成度等代理指标与科学主张的认知质量一致？
    - 为什么能力尚可的编码智能体会在相近证据成熟度分数上停滞，并缺乏对照和稳健性检查等判别性行为？
    - 在工件和基线尚未完整报告的情况下，应如何跨数据集、仿真器和用户设置标准化外部验证？
