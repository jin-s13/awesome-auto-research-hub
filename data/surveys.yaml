  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: Converts research ideas into executed experiments, figures,
        and full papers, with simulated or peer review providing a quality signal.
      what_remains_open: Reliability and consistency across tasks and domains; only
        a subset of generated manuscripts pass peer review or complete the full pipeline.
    - line: Verification and grounded scientific reporting
      what_it_solves: Reduces fabricated numbers and silent failures by auditing logical
        coherence, constraining drafts to measured values, or inspecting domain-specific
        outputs such as flow fields.
      what_remains_open: Verification gates can miss planted failures and have not
        been shown to generalize beyond narrow domain settings.
    - line: Human-AI collaboration and failure-driven self-correction
      what_it_solves: Recovers from failed experiments through failure attribution,
        self-healing execution, structured debate, and targeted human intervention.
      what_remains_open: Optimal interaction granularity, memory and context degradation,
        and weak scientific taste remain unresolved over long horizons.
    - line: Evaluation and reproducibility infrastructure
      what_it_solves: Creates benchmarks, rubrics, and peer-review-like signals for
        comparing autonomous research and writing agents.
      what_remains_open: Proxy scores and workshop acceptance are not yet linked to
        long-term scholarly validity or broad external replication.
    consensus:
    - Autonomous writing is framed as closed-loop scientific research, coupling idea
      generation, code execution, visualization, and manuscript drafting.
    - Verification or review gates are treated as necessary for making generated claims
      defensible, not as optional post-processing.
    - Multi-agent decomposition, tree search, or stage-wise pipelines dominate over
      single-pass text generation.
