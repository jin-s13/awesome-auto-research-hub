      formation through experimentation, analysis, and manuscript writing.
    - Automatic verification, review, or evidence judgment is treated as necessary
      for filtering or scoring generated claims.
    - Current evaluated agents are more reliable at executing and documenting analysis
      than at producing trustworthy, falsifiable scientific conclusions.
    - Evaluation should measure evidence quality or discovery competence rather than
      only task completion or paper production.
