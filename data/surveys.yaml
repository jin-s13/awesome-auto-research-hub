  - 研究共性：多数系统采用LLM智能体流水线或树搜索，集成代码执行和验证门控，并通过自动指标、模拟评审或真实同行评审进行评测。
  - 关键差异：评测目标从通用ML任务到领域特定发现（CFD、组学）；架构从单智能体到多智能体；自我纠正在深度上不同（单次反思 vs. 多假设归因）。
