  - 主流方向：构建端到端 LLM 智能体流水线，覆盖提出想法、执行实验、验证结果和撰写论文。
  - 研究共性：引入自动验证、评审或基准反馈闭环，以捕获无效声明并改进智能体。
  - 关键差异：通用机器学习流程、领域专用物理/逻辑验证系统与评测环境在验证目标和领域范围上不同。
  - 趋势演进：从 2024 年的全流程框架和虚拟任务，到 2025 年树搜索和同行评审输出，再到 2026 年领域感知验证与证据成熟度基准。
