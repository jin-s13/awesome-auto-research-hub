  related_work_outline:
  - 'Mainstream direction: Autonomous multi-agent research workflows that integrate
    literature synthesis, knowledge retrieval, internal verification, and paper generation,
    with a parallel push toward evidence-grounded benchmarks for scientific discovery.'
  - 'Shared research pattern: Systems pair LLM agents with human or automated review,
    evaluate via LLM judges or domain-specific tasks, and use blind/frozen data or
    end-to-end paper writing as the testbed.'
  - 'Key differences: One branch targets end-to-end manuscript generation from minimal
    prompts; another audits whether data support a claim. Evaluation ranges from curated
    paper-quality rubrics to evidence-maturity scores to human-equivalent domain baselines;
    architectures range from self-evolving frameworks to fixed pipelines with post
    hoc failure analysis.'
  - 'Trend evolution: Within the 2025-2026 frontier, work is moving from domain-specific
    AI scientist benchmarks and surveys toward unified self-evolving agents and blind
    evidence-grounded evaluation; recurring results show coding agents plateau and
    lack discriminating scientific controls.'
  - 'Open questions: How well proxy LLM-judge scores track real discovery or literature-gap
    utility; whether results generalize across base models and domains; and whether
    literature search, citation analysis, and review synthesis are directly evaluated
    rather than downstream paper generation.'
  related_work_outline_zh:
  - 主流方向：以自主多智能体研究工作流为主，集成文献综合、知识检索、内部验证与论文生成，同时出现面向证据成熟度的科学发现评测。
  - 研究共性：系统普遍将LLM代理与人工或自动评审结合，使用LLM裁判或领域任务，并以盲化/冻结数据或端到端论文写作作为测试方式。
  - 关键差异：一路面向从最小提示生成完整手稿，另一路审计数据是否支持主张；评测从论文质量评分、证据成熟度到领域人类基线；架构从自演化到固定流水线。
  - 趋势演进：在2025–2026前沿期内，研究从领域专用AI科学家基准和综述，走向统一自演化智能体与盲化证据评测；反复出现智能体分数趋同、科学判断不足。
  - 开放问题：LLM代理指标与真实发现/文献缺口效用的一致性；跨基座模型与领域泛化；文献搜索、引文分析和综述综合是否被直接评估，而非仅下游论文生成。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end multi-agent scientific discovery workflows
      what_it_solves: Integrating literature synthesis, knowledge retrieval, internal
        verification, and paper generation into a single agent pipeline.
      what_remains_open: Evaluation depends on curated LLM-based rubrics, and the
        evidence packet lacks external human review, code/data artifacts, and cross-domain
        validation.
    - line: Evidence-grounded benchmark design for discovery claims
      what_it_solves: Comparing agents on blind tasks from peer-reviewed studies via
        deterministic LLM-judged evidence maturity, reducing need for instance-level
        human scoring.
      what_remains_open: Only one frozen base model is tested; agents score near one
        another without reliable separation, and true discovery remains far.
    - line: Domain-specific AI scientist benchmarking
      what_it_solves: Grounding evaluation in expert-labeled real datasets and human
        bioinformatician baselines for annotation and study-derived questions.
      what_remains_open: Task format is limited to cell annotation and multiple-choice
        questions; literature search, review synthesis, and gap discovery are not
        directly covered.
    - line: Survey and taxonomy of agentic scientific discovery
      what_it_solves: Organizing agent systems by domain and capability, and cataloging
        metrics, frameworks, datasets, and challenges such as literature review automation.
      what_remains_open: The taxonomy remains descriptive; no direct evidence shows
        categories predict model behavior or literature-intelligence outcomes.
    - line: Failure-mode analysis and design principles for autonomous research
      what_it_solves: Mapping LLM agents to scientific workflow stages and documenting
        recurring failure modes that prevent trustworthy autonomous research.
      what_remains_open: Results come from a small number of end-to-end attempts;
        design principles are not systematically evaluated on literature search, citation
        analysis, or survey synthesis.
    consensus:
    - LLM agents can execute and document analyses and generated papers, but do not
      yet demonstrate fully autonomous trustworthy scientific discovery.
    - Evidence auditing, verification loops, and human review remain necessary because
      agents omit controls, robustness checks, and falsifiability.
    - Literature review automation and knowledge retrieval are recognized as unresolved
      bottlenecks in agentic scientific workflows.
    - Benchmarks need blind tasks and explicit evidence dimensions beyond final answer
      accuracy.
    disagreements:
    - 'Evaluation target differs: final manuscript quality versus evidence maturity
      of claims versus domain-task accuracy against human baselines.'
    - 'System scope differs: domain-agnostic self-evolving frameworks versus domain-specific
      expert-labeled benchmarks versus fixed pipeline case studies.'
    - 'Interaction mode differs: human-principal-investigator/agent-graduate-student
      collaboration versus autonomous coding agents with automated judging versus
      human baseline comparison.'
    - 'Claim strength differs: one branch reports state-of-the-art benchmark gains,
      while another reports plateau with no statistically reliable pairwise separation.'
    - 'Coverage differs: some systems treat literature synthesis and retrieval as
      an integrated component, while most do not evaluate literature intelligence
      separately.'
    open_questions:
    - How well do LLM-judged evidence maturity and paper-quality scores track human
      expert judgment and real discovery utility?
    - Can literature search, citation analysis, and research-gap discovery be evaluated
      separately from downstream empirical paper generation?
    - Do current multi-agent and self-evolving architectures generalize across base
      models, scientific domains, and reproducible infrastructure?
    - What evidence is sufficient to certify that a synthesized literature review
      is complete, unbiased, and logically grounded?
    - Are current blind discovery benchmarks measuring genuine discovery or competent
      analysis and documentation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端多智能体科学发现工作流
      解决的问题: 将文献综合、知识检索、内部验证与论文生成整合到单一代理流水线。
      尚未覆盖: 评测依赖精心设计的LLM评分；证据包未显示外部人工评审、代码数据工件和跨领域验证。
    - 路线: 面向发现主张的证据锚定基准设计
      解决的问题: 通过来自同行评审研究的盲任务和确定性LLM评判，比较代理的证据成熟度，减少逐例人工评分。
      尚未覆盖: 仅测试一个冻结基座模型；代理得分接近且缺乏可靠区分，真正科学发现仍远未实现。
    - 路线: 领域专用AI科学家基准测试
      解决的问题: 以专家标注的真实数据和人类生物信息学家基线，评估细胞注释和从研究提取的问题。
      尚未覆盖: 任务形式限于细胞注释和选择题；未直接覆盖文献搜索、综述综合和研究缺口发现。
    - 路线: 智能体科学发现的综述与分类
      解决的问题: 按领域和能力组织智能体系统，并梳理指标、框架、数据集及文献综述自动化等挑战。
      尚未覆盖: 分类仍是描述性的；尚缺直接证据表明其分类能预测模型行为或文献智能结果。
    - 路线: 自主研究的失败模式分析与设计原则
      解决的问题: 将LLM代理映射到科学工作流阶段，记录阻碍可信自主研究的重复失败模式。
      尚未覆盖: 仅基于少量端到端尝试；设计原则未在文献搜索、引文分析和综述综合上系统评估。
    共识:
    - LLM代理能够执行和记录分析并生成论文，但尚未展示完全自主、可信的科学发现。
    - 证据审计、验证循环与人工评审仍必要，因为代理常缺少对照、稳健性和可证伪性。
    - 文献综述自动化与知识检索被视为智能体科学工作流中尚未解决的关键瓶颈。
    - 基准需要盲任务和超越最终答案准确性的证据维度。
    分歧:
    - 评测目标不同：最终手稿质量、主张的证据成熟度、或与人类基线对比的领域任务准确率。
    - 系统范围不同：领域无关的自演化框架、领域专用专家标注基准、以及固定流水线案例研究。
    - 交互模式不同：人类PI/代理研究生式协作、自主编码代理自动判分、以及人类基线比较。
    - 结论强度不同：一方报告相对基线的最新结果，另一方报告代理得分趋同且无统计可靠差异。
    - 覆盖不同：部分系统将文献综合与检索作为集成组件，但多数并未单独评估文献智能。
    开放问题:
    - LLM评判的证据成熟度与论文质量分数，在多大程度上与人类专家判断和真实发现效用一致？
    - 文献搜索、引文分析和研究缺口发现，能否与下游经验论文生成分开进行评估？
    - 当前多智能体与自演化架构能否跨基座模型、科学领域和可复现基础设施泛化？
    - 需要多少证据才能证明一份综合文献综述是完整、无偏且逻辑上成立的？
    - 当前盲发现基准衡量的是真正发现，还是熟练的分析和文档记录？
