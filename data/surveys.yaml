  related_work_outline_zh:
  - 主流方向：端到端自主研究智能体，能生成假设、运行代码实验并撰写论文，越来越强调验证、记忆和交互式平台。
  - 研究共性：多智能体架构结合迭代优化循环，依赖LLM评估和代码执行沙箱；多数系统自动化从想法到论文的完整流程。
  - 关键差异：范围从完整论文生成到消融规划等子任务各异；评价方式从LLM模拟评审到真实同行评审不等；领域聚焦于ML、应用数学或通用科学；记忆机制不同（外部检索
    vs. 内部失败记忆）。
  - 趋势演进：2024至2026年，从最初的全自动框架（2024）发展到引入树搜索和同行评审的改进版（2025），再到领域专用系统和具备失败感知记忆的交互式平台（2026）。
  - 开放问题：如何在多样科学领域实现一致高质量输出；弥合模拟评估与真实实验验证的差距；集成物理实验室自动化；确保长期可复现性与可信度。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Complete automation of idea generation, code execution, experiment
        management, and manuscript writing for scientific discovery
      what_remains_open: Reliability, domain generalization beyond narrow ML and theoretical
        math, and alignment with genuine scientific novelty and impact
    - line: Benchmark-driven evaluation of scientific discovery agents
      what_it_solves: Standardized tasks and metrics for measuring agent capabilities
        in hypothesis testing, experiment design, and result interpretation
      what_remains_open: Coverage of real-world complexity, alignment of proxy metrics
        with real scientific utility, and the gap between simulated and physical lab
        experimentation
    - line: Experiment planning and design automation
      what_it_solves: Automated selection of ablation studies and experimental conditions
        to validate scientific claims
      what_remains_open: Current LMs underperform humans, lack grounding to understand
        method implications, and need better agent architectures for planning subtasks
    - line: Memory and failure-aware learning for iterative research
      what_it_solves: Leveraging records of past failures to improve future experiment
        proposals and reduce computational cost
      what_remains_open: Scalability to long-term discovery across diverse scientific
        fields, and how to structure negative knowledge for effective transfer
    - line: Agent infrastructure for interactive and reproducible experimentation
      what_it_solves: Turning isolated research workflows into monitorable, rollback-capable,
        and reproducible pipelines with customizable roles
      what_remains_open: Maturity and external validation beyond limited internal
        case studies; standardized integration with diverse codebases and lab equipment
    consensus:
    - LM-based agents can automate significant parts of the scientific discovery loop,
      including experiment design, code execution, and paper drafting.
    - Multi-agent architectures with iterative refinement and internal verification
      loops are a common design pattern.
    - LLM-based evaluation is widely used as a proxy for output quality, though its
      realism is debated.
    - Code execution sandboxes are essential infrastructure across all systems.
    disagreements:
    - Fully automated end-to-end paper generation vs. focused automation of subtasks
      like ablation planning.
    - Evaluation methods vary from simulated LLM reviews to actual peer review and
      task-completion metrics.
    - 'Domain specialization differs: some target ML, others applied math, while benchmarks
      aim for generic science.'
    - Memory mechanisms range from external knowledge retrieval to internal negative
      knowledge banks, with no consensus on the most effective approach.
    - Degree of human-in-the-loop interaction varies from fully autonomous to interactive
      platforms where humans act as PI.
    open_questions:
    - How to systematically evaluate the scientific quality and novelty of AI-generated
      research beyond proxy metrics?
    - Can these agents transfer to physical laboratory experimentation and handle
      real-world constraints?
    - What are the failure modes of autonomous research agents in long-term iterative
      discovery, and how can they be mitigated?
    - How to ensure that knowledge generated by autonomous agents is reproducible
      and trustworthy across different environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流水线
      解决的问题: 全自动化科学发现流程：想法生成、代码执行、实验管理和论文撰写
      尚未覆盖: 可靠性、在狭窄ML和理论数学之外的领域泛化，以及与真实科学新颖性和影响力的对齐
    - 路线: 基于基准的科学发现智能体评估
      解决的问题: 通过标准化任务和指标衡量智能体在假设检验、实验设计和结果解释方面的能力
      尚未覆盖: 真实世界复杂性的覆盖，代理指标与真实科学效用的对齐，以及模拟与物理实验之间的差距
    - 路线: 实验规划与设计自动化
      解决的问题: 自动选择消融研究和实验条件以验证科学主张
      尚未覆盖: 当前语言模型表现低于人类，缺乏对方法含义的理解，需要更好的规划子任务智能体架构
    - 路线: 面向迭代研究的记忆与失败感知学习
      解决的问题: 利用过去失败记录改进未来实验提案并降低计算成本
      尚未覆盖: 在多样化科学领域长期发现中的可扩展性，以及如何结构化负知识以实现有效迁移
    - 路线: 用于交互式可复现实验的智能体基础设施
      解决的问题: 将孤立的研究工作流转化为可监控、可回滚、可复现的流水线，并支持自定义角色
      尚未覆盖: 在有限内部案例研究之外的成熟度和外部验证；与多样化代码库和实验室设备的标准化集成
    共识:
    - 基于LM的智能体能够自动化科学发现流程的重要部分，包括实验设计、代码执行和论文草稿撰写。
    - 多智能体架构结合迭代优化和内部验证循环是常见设计模式。
    - 基于LLM的评估被广泛用作输出质量的代理，尽管其真实性存在争议。
    - 代码执行沙箱是所有系统的基础设施。
    分歧:
    - 全自动端到端论文生成 vs. 专注于消融规划等子任务的自动化。
    - 评估方法从模拟LLM评审到实际同行评审和任务完成指标各不相同。
    - 领域专业化差异：部分针对ML，部分针对应用数学，而基准测试则瞄准通用科学。
    - 记忆机制从外部知识检索到内部负知识库，尚未就最有效方法达成共识。
    - 人在回路中的交互程度从完全自主到人类担任PI的交互式平台不等。
    开放问题:
    - 如何系统评估AI生成研究的科学质量和新颖性，超越代理指标？
    - 这些智能体能否迁移到物理实验室实验并处理真实世界约束？
