        of human ablations and show inconsistent author/reviewer behavior
    - line: Virtual evaluation environments for scientific discovery
      what_it_solves: providing standardized task suites for hypothesis formation,
        experiment execution, analysis, and conclusion
      what_remains_open: transfer from simulated tasks to real lab work and long-running
        discovery remains unclear
    - line: Memory and failure-aware iteration
      what_it_solves: recording failed attempts so later research cycles avoid repeated
        errors and use fewer tokens
      what_remains_open: evidence is limited to a few benchmarks and PDE tasks; curation
