    writing, with growing emphasis on reliability through benchmarking, failure diagnosis,
    and verification gates.'
  - 'Shared research pattern: All systems decompose the research process into agentic
    pipelines, rely on LLM reasoning and code execution, and surface the need for
    external validation layers—whether automated reviewers, human baselines, or task-based
    metrics—to make claims comparable.'
  - 'Key differences: The primary split is between general-purpose frameworks (AI
