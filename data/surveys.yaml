    研究路线矩阵:
    - 路线: 端到端自主实验智能体
      解决的问题: 在单一回路中自动完成假设或想法生成、代码编写、实验执行、结果分析和论文撰写。
      尚未覆盖: 在LLM评审或个别工作坊接收之外是否可靠，以及真正研究洞察与工程改进的区别。
    - 路线: 模拟与基准评测环境
      解决的问题: 提供可重复任务和指标，对完整发现循环或科学ML改进进行可比评估。
      尚未覆盖: 模拟发现、任务完成或排行榜提升能否代表真实科学效用并迁移到实验室或现场。
    - 路线: 失败感知记忆与自我改进
      解决的问题: 把失败尝试转化为可复用的负知识，引导后续实验并避免跨任务重复错误。
      尚未覆盖: 证据限于重试和PDE类科学任务，尚未展示向更广泛实验类型的迁移。
    - 路线: 带人监督的多智能体验证与编排
      解决的问题: 把研究工作分解为规划、验证、检索、监控和工件检查等角色，减少专家干预同时保留控制。
      尚未覆盖: 证据多来自小型内部案例或LLM评分标准，缺少外部验证和成熟控制界面。
    - 路线: 在野科学ML改进智能体
      解决的问题: 评估前沿编码智能体在多个领域中修改已发表最佳模型的能力，并揭示其增益和失败模式。
      尚未覆盖: 智能体主要通过ML工程技巧获得提升，领域研究洞察仍未得到证明。
    共识:
    - 智能体可覆盖实验的多个阶段，从想法或问题构建、代码执行到结果分析和论文或报告撰写。
    - 闭环验证、评审或记忆被认为是纠正自主研究中首轮错误所必需的机制。
    - 评测仍主要基于LLM、基准或内部案例，尚未建立共享的外部发现质量标准。
    - 近期系统偏好将工作流分解为专用智能体或记忆组件，而不是单一整体生成。
    分歧:
    - 系统面向不同任务类型：虚拟发现任务、科学ML基准改进、应用数学推导或完整论文写作。
    - 人类参与程度从全自动运行，到人工PI、实时仪表板、回滚与恢复和工件检查不等。
    - 成功证据不同：基准完成、对已发表最佳模型的改进、LLM评审分数或单篇通过同行评审的工作坊论文。
    - 纠错机制不同：内部逻辑验证、负知识记忆、带实验管理器的渐进树搜索或插件技能。
    开放问题:
    - 当基准增益主要来自工程修改时，如何分离新研究洞察与ML工程技巧？
