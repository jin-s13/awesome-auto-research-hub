  related_work_outline_zh:
  - 主流方向：端到端LLM/多智能体系统自主提出假设、执行实验并撰写完整研究手稿，越来越多地在意成文前加入领域特定验证门控。
  - 研究共性：写作被嵌入科学工作流闭环：构思、代码执行、结果检查、论文起草与评审；验证、自我纠正或有依据的报告在最终交流前介入。
  - 关键差异：系统的验证对象不同，如逻辑一致性、流场物理合理性、实测指标约束、引用可验证性；自主程度、领域范围和评测目标也不同。
  - 趋势演进：证据显示从2024年的通用自动发现与写作，走向2025–2026年的失败归因、物理/逻辑感知验证、可核验报告和精准人机协作；本证据包主要覆盖当前前沿。
  - 开放问题：LLM评审或基准成功能否转化为外部科学价值，领域验证能多完整，何种人类监督粒度最优，以及质量提升多少来自模型、脚手架或自我纠正仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research writing
      what_it_solves: Converts research idea generation, code execution, experiment
        results, and visualization into a complete manuscript with automated review,
        reducing per-paper cost and removing dependence on human-authored templates.
      what_remains_open: 'Success is inconsistent: only one of three submitted papers
        passed peer review in one system; conference-level quality and independent
        external validation remain unproven.'
    - line: Domain-grounded discovery-to-writing pipelines
      what_it_solves: Adds discipline-specific checks to generated claims before writing,
        such as logical auditing for reasoning-centric applied mathematics and vision-language
        inspection of rendered flow fields for CFD.
      what_remains_open: Coverage is narrow and case-specific; verification gates
        can still miss silent failures, and evidence is concentrated in selected benchmarks
        or geometries.
    - line: Failure attribution and grounded reporting
      what_it_solves: Diagnoses why experiments fail and constrains manuscript statements
        to actually measured values, improving metrics-bearing outputs and artifact
        quality relative to reflection baselines.
      what_remains_open: Fully conference-ready autonomous writing remains unresolved;
        failure attribution depends on trajectory features and may not transfer to
        unseen failure modes.
    - line: Human-AI collaboration and oversight design
      what_it_solves: Introduces targeted human intervention at high-leverage decision
        points, showing that focused collaboration can outperform both full autonomy
        and exhaustive step-by-step oversight.
      what_remains_open: Optimal intervention granularity is not standardized across
        domains and likely depends on task complexity and available expertise.
    - line: Evaluation and peer-review instrumentation for generated research
      what_it_solves: Creates LLM rubrics, multi-AI review, benchmark comparisons,
        and peer-review submission channels to compare machine-generated manuscripts.
      what_remains_open: Evidence relies heavily on proxy scores and limited workshop
        acceptance; agreement with real decision utility, reproducibility, and long-term
        scientific impact is missing.
    consensus:
    - Multiple systems couple hypothesis formation, code execution, result inspection,
      and manuscript drafting into one loop rather than treating writing as a separate
      summarization task.
    - 'Verification has become a prerequisite for credible scientific communication:
      unchecked generated outputs often lack defensible claims, while gated or grounded
      pipelines produce more trustworthy drafts.'
    - LLM-based review or automated scoring is commonly used as a fast evaluation
      proxy for generated papers, but peer acceptance remains a narrow success signal.
    - Internal self-correction through logical audit, measured-value constraints,
      or figure inspection is widely treated as necessary for research communication
      quality.
    disagreements:
    - 'Verification object differs: some systems audit logical or theoretical coherence,
      some inspect physical realism in rendered flow fields, and some constrain claims
      to measured metrics or verifiable citations.'
    - 'Autonomy stance differs: some pipelines pursue full autonomy, while others
      argue that targeted human collaboration at high-leverage points outperforms
      both full autonomy and exhaustive oversight.'
    - 'Evaluation evidence differs: LLM-rubric acceptance thresholds, workshop peer
      review, task benchmark gains, and single-domain physical error reductions are
      not directly comparable and may measure different capabilities.'
    - 'Domain scope differs: general machine-learning research writing pipelines contrast
      with applied-mathematics or CFD-specific workflows that encode domain knowledge
      and validation gates.'
    open_questions:
    - Are LLM-review scores or single workshop acceptance predictive of reproducible,
      externally validated scientific contributions?
    - Can domain-specific verification gates extend to diverse tasks without missing
      silent failures, unmeasured baselines, or hallucinated citations?
    - What is the right human intervention granularity and timing for autonomous writing
      pipelines, and how does it transfer across disciplines?
    - How should generated manuscripts be grounded in code, data, metrics, and citation
      evidence rather than fluent prose alone?
    - How much of the reported improvement comes from stronger backbone models, better
      scaffolding, self-correction, or domain priors remains unidentified because
      ablations are sparse or narrow.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研写作流水线
      解决的问题: 把研究想法生成、代码执行、实验可视化和审稿整合为完整论文草稿，降低单篇成本并减少对人类写模板的依赖。
      尚未覆盖: 成功率不稳定；有系统三篇提交中仅一篇通过同行评审，会议级质量和独立外部验证仍未证明。
    - 路线: 领域感知的发现到写作验证流水线
      解决的问题: 在生成声明前加入学科特定检查，例如对应用数学中偏推理的内容做逻辑审计，对CFD渲染流场做视觉语言校验。
      尚未覆盖: 覆盖范围窄且偏案例；验证门仍可漏检静默失败，证据主要来自选定基准或几何。
    - 路线: 失败归因与有依据的报告生成
      解决的问题: 诊断实验失败原因，并把论文表述约束到实际测量值，提高带指标输出与工件质量。
      尚未覆盖: 完全会议级自主写作仍未解决；归因依赖轨迹特征，未知失败模式可能不适用。
    - 路线: 人机协作与介入方式设计
      解决的问题: 在高杠杆决策点引入精准人类干预，显示聚焦式协作可优于完全自主和逐步监督。
      尚未覆盖: 最优干预粒度未标准化，跨领域是否成立取决于任务复杂度和专家资源。
    - 路线: 生成式科研论文的评价与同行评审仪表化
      解决的问题: 用LLM评审标准、多AI评审、基准对比和工作坊投稿通道比较机器生成论文。
      尚未覆盖: 证据依赖代理分数和有限的工作坊录用；与真实决策效用、可复现性和长期科学影响之间的对应不足。
    共识:
    - 多个系统把假设形成、代码执行、结果检查和论文起草放进同一个闭环，而不是把写作当作后续总结任务。
    - 验证已成为可信科学交流的前提：未经验证门的生成输出较难产生可辩护声明，而经过门控或有依据报告的流程更可信。
    - LLM评审或自动评分被广泛用作评价生成论文的快速代理，但同行录用仍只是很窄的成功信号。
    - 通过逻辑审计、测量值约束或图形检查等方式进行内部自纠，被普遍视为提升科研交流质量的必要手段。
    分歧:
    - 验证对象不同：有的审计逻辑或理论一致性，有的检查渲染流场物理合理性，有的约束论文只写实测指标或可验证引用。
    - 自主程度不同：部分流水线追求全自动，另一些系统显示精准人机协作在关键节点优于全自主和逐步监督。
    - 评价证据不同：LLM评分门槛、工作坊同行录用、任务基准提升和单领域物理误差降低并不等价，测量重点不同。
    - 适用范围不同：通用机器学习科研写作管线与嵌入应用数学或CFD领域知识的管线在假设和验证方式上存在差异。
    开放问题:
    - 自动评审或LLM评分和单次工作坊录用能否预测可复现且外部有效的科学贡献？
    - 领域验证门能否扩展到多样任务，同时不遗漏静默失败、未测基线和幻觉引用？
    - 自主写作管线应在什么粒度上引入人类干预，以及如何跨学科迁移？
    - 机器生成论文如何从流利的文本转向由代码、数据、指标和引用证据支撑？
    - 报告提升有多少来自更强基础模型、脚手架、自纠或领域先验，目前消融证据不足而难以判断。
