    - 路线: 可审计研究问题形成
      解决的问题: 通过结构化工件记录假设、可证伪假设、测试和失败更新规则，使科学问题形成过程可显式检查。
      尚未覆盖: 评估依赖LLM评审且属于初步结果；缺少人类领域专家验证和下游发现影响的证据。
    - 路线: 接地执行基础设施
      解决的问题: 提供经过验证的代码库或可重用执行经验，使智能体生成的实验更准确、完整且可执行。
      尚未覆盖: 泛化主要在一个领域内展示；LLM-as-a-judge一致性仅中等，外部可复现性未验证。
    - 路线: 安全感知智能体控制
      解决的问题: 在发现循环中整合累积风险跟踪与轨迹级检查，降低组合工具链逃逸和湿实验室安全事件。
      尚未覆盖: 基线和局限信息不完整；跨广泛领域或物理实验室的安全与输出质量权衡未得到验证。
    共识:
    - 科学发现智能体被评估为多步循环，包括问题形成、实验设计或分析以及主张生成。
    - 当前智能体能胜任分析执行与文档记录，但其主张普遍缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 自动化评估很常见，但基于LLM的评审与领域专家一致性仅中等，尚不能作为可靠代理指标。
    - 经过验证的代码库、情景记忆或结构化证书等接地机制被视为提升可靠性、可复现性或安全性的手段。
    - 安全正在成为仿真和湿实验室发现场景中的一等需求。
    分歧:
    - 优化目标不同：仿真发现中的完整任务完成、盲任务上的证据成熟度、资源限制下的端到端ML训练质量，以及湿实验室任务的安全执行。
    - 评估对象不同：一类使用合成虚拟发现任务，一类使用隐藏结论的冻结同行研究数据，另一类使用受限ML训练脚本。
    - 接地策略不同：通过研究问题证书实现可审计性、通过情景记忆复用经验、通过仓库蒸馏代码库，以及通过轨迹级累积风险检查。
    - 有些方法无需训练即可保持安全，有些方法在智能体每个阶段内化安全推理，说明对安全应内嵌还是外挂存在不同假设。
    - 证据质量不一：有些论文报告基线和局限，有些省略明确基线或依赖较窄的LLM评审结果。
    开放问题:
    - 虚拟或盲任务上的代理指标能否预测真实世界科学发现价值或实验室成功？
    - 当LLM评审与领域专家一致性仅为中等时，能否替代专家评估？
    - 安全与可审计约束能否在提升科学可信度的同时不抑制新颖但初始不合理的研究假设？
    - 结果如何跨科学领域、基座模型、硬件预算和湿实验室设置迁移？
    - 蒸馏代码、情景经验、结构化证书或轨迹感知安全中，哪一种接地机制对发现质量最关键？
