  - 趋势演进：从2024年的通用框架演进到2025–2026年的工作坊级发表和领域专用科学家，越来越关注自愈、辩论和人机协作模式。
  - 开放问题：如何保证跨领域生成主张的新颖性和正确性，如何在高杠杆决策点平衡自主性与人类监督，以及基于基准的评估是否与真实科学影响力相关。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery frameworks
      what_it_solves: Complete automation from idea generation and code execution
        to paper writing, removing manual scaffolding and template dependence.
      what_remains_open: Cross-domain novelty and correctness are not guaranteed;
        only one of three submitted papers passed real peer review, and no evidence
        shows these frameworks can consistently produce impactful, non-incremental
        results.
    - line: Domain-specific AI scientists
      what_it_solves: Seamless integration of domain knowledge, verification gates,
        and toolchains (e.g., CFD solvers, mathematical proof checkers) to produce
        physically or logically valid discoveries.
      what_remains_open: Verification gates still miss some silent failures (e.g.,
        2 of 16 planted failures missed in CFD); transfer of the domain-specific verification
        logic to other fields is unproven.
    - line: Human-AI collaborative research systems
      what_it_solves: Improving result reliability and alignment with scientific standards
        by allowing targeted human intervention at high-leverage points, outperforming
        both fully autonomous and exhaustive step-by-step oversight in benchmarks.
      what_remains_open: Optimal intervention modes and timing are not yet formalized;
        human-in-the-loop reliance introduces variability that is not measured across
        diverse scientific communities.
    - line: Benchmark and evaluation environments
      what_it_solves: Standardized task suites and metrics (e.g., task completion,
        action relevance, multiple-choice questions) to compare AI scientists across
        diverse scientific challenges.
      what_remains_open: Current benchmarks are simplified abstractions; strong baselines
        fail on them, but it is unclear whether improvements on these benchmarks translate
        to real-world discovery utility.
    consensus:
    - Large language models serve as the central reasoning and planning engine across
      all systems.
    - A multi-step pipeline covering literature survey, hypothesis generation, experiment
      execution, and paper authoring is the de facto architecture.
    - Validation or verification components are necessary to filter out invalid or
      hallucinated results, though their implementations vary widely.
    - Evaluation is moving from internal automated reviewers toward external benchmarks
      and real peer review to increase credibility.
    disagreements:
    - Fully autonomous operation without human intervention versus human-in-the-loop
      collaboration with multiple intervention modes.
    - General-purpose applicability across machine learning subfields versus deep
      integration with a single scientific domain (applied math, CFD, biology).
    - Verification through internal logical coherence or physics-aware vision gates
      versus reliance on external benchmark suites and human expert judges.
    - Targeting workshop-level acceptance as a milestone versus treating the system
      as a research assistant that does not require formal publication.
    open_questions:
    - Can verification gates be made provably complete for a given domain, given that
      the CFD vision gate missed 2 of 16 planted silent failures?
    - What is the optimal balance between human intervention and full autonomy, and
      does the optimal point shift across different scientific disciplines?
    - Do improvements on simplified benchmark tasks like DISCOVERYWORLD or BAISBench
      predict the ability to produce real, peer-reviewed scientific advances?
    - How can the systems be extended to handle long-term, iterative research programs
      rather than single-shot paper generation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现框架
      解决的问题: 从想法生成、代码执行到论文撰写的全自动化，消除人工支架和模板依赖。
      尚未覆盖: 跨领域的新颖性和正确性无法保证；三篇提交论文中仅一篇通过真实同行评审，缺乏证据表明这些框架能持续产生有影响力的非增量性结果。
    - 路线: 领域专用AI科学家
      解决的问题: 将领域知识、验证门控和工具链（如CFD求解器、数学证明检查器）无缝集成，以产生物理或逻辑上有效的发现。
      尚未覆盖: 验证门控仍会遗漏部分静默故障（如CFD中16个植入故障漏检2个）；领域专用验证逻辑向其他领域的迁移能力未经证实。
    - 路线: 人机协作研究系统
      解决的问题: 通过在关键决策点精准引入人工干预来提高结果可靠性和与科学标准的一致性，在基准测试中优于完全自主和详尽逐步监督。
      尚未覆盖: 最优干预模式与时机尚未形式化；对人机交互的依赖引入变异性，且未在不同科学社区中测量。
    - 路线: 基准与评测环境
      解决的问题: 通过标准化任务集和指标（如任务完成度、动作相关性、选择题）在不同科学挑战上比较AI科学家。
      尚未覆盖: 当前基准是简化抽象；强基线在其上表现不佳，但基准上的改进是否转化为真实世界发现效用尚不清楚。
    共识:
    - 大语言模型是所有系统的核心推理和规划引擎。
    - 涵盖文献调研、假设生成、实验执行和论文撰写的多步骤流水线是事实上的架构。
    - 验证或校验组件对于过滤无效或幻觉结果必不可少，但实现方式差异很大。
    - 评估正从内部自动评审转向外部基准和真实同行评审，以提升可信度。
    分歧:
    - 完全自主运行无人工干预，对比支持多种干预模式的人机协同。
    - 横跨机器学习子领域的通用性，对比与单一科学领域（应用数学、计算流体动力学、生物学）的深度集成。
    - 通过内部逻辑融贯或物理感知视觉门控进行验证，对比依赖外部基准套件和人类专家评判。
    - 以工作坊级接受为里程碑，对比将系统视为无需正式发表的研究助手。
    开放问题:
    - 鉴于CFD视觉门控遗漏了16个植入故障中的2个，能否使验证门控在给定领域内被证明是完备的？
    - 人工干预与完全自主之间的最优平衡是什么？该最优点是否会因科学领域不同而偏移？
    - 在DISCOVERYWORLD或BAISBench等简化基准任务上的改进，能否预测产生真实同行评审科学进展的能力？
    - 如何将系统扩展以处理长期迭代式研究项目，而非仅生成单篇论文？
