  related_work_outline:
  - 'Mainstream direction: Building multi-agent LLM systems that automate scholarly
    literature review, survey generation, and scientific discovery, with increasing
    emphasis on iterative refinement, verification, and self-evolution.'
  - 'Shared research pattern: Agentic workflows where specialized LLMs take roles
    (researcher, reviewer, planner) and interact through structured processes (tree-based
    search, rubric-guided feedback, evolutionary loops) to generate or evaluate literature.'
  - 'Key differences: Stages of the literature intelligence pipeline vary—automated
    survey paper generation (ARISE), literature synthesis for broader discovery (ReasFlow,
    EvoMaster), capability benchmarking (BAISBench), and failure analysis (Why LLMs
    Aren''t Scientists Yet). Evaluation methods differ: LLM-based rubrics, human expert
    comparisons, or domain-specific benchmarks.'
  - 'Trend evolution: From 2023–2024, the field moved from isolated LLM literature
    tools to integrated agentic systems; 2025–2026 papers show maturation into multi-agent,
    self-improving frameworks with explicit verification and scalability benchmarks.'
  - 'Open questions: How to ensure factual accuracy and avoid hallucination in generated
    literature; whether LLM-based rubrics align with human scientific judgment; robustness
    across diverse scientific domains; and ethical implications of autonomous literature
    generation.'
  related_work_outline_zh:
  - 主流方向：构建多智能体LLM系统以自动化文献综述、综述生成和科学发现，越来越强调迭代优化、验证和自我演化。
  - 研究共性：采用智能体工作流，由专业化LLM扮演角色（研究员、评审员、规划者），通过结构化过程（树搜索、评分准则引导反馈、进化循环）生成或评估文献。
  - 关键差异：工作聚焦于文献情报流程的不同阶段——自动综述生成（ARISE）、文献综合融入更广泛科学发现（ReasFlow、EvoMaster）、能力基准测试（BAISBench）和失败分析（Why
    LLMs Aren't Scientists Yet）。评估方法不同：基于LLM的评分准则、人类专家对比或领域特定基准。
  - 趋势演进：2023–2024年，领域从孤立的LLM文献工具转向集成智能体系统；2025–2026年论文显示向多智能体、自我改进框架，并伴随显式验证和可扩展性基准的成熟化发展。
  - 开放问题：如何在生成文献中确保事实准确性并避免幻觉；基于LLM的评分准则是否与人类科学判断一致；跨不同科学领域的鲁棒性；以及自主文献生成的伦理问题。
  literature_review:
    line_of_work_matrix:
    - line: Scientific knowledge representation and retrieval for literature synthesis
      what_it_solves: Turning unstructured paper collections into structured, retrievable
        knowledge that guides generation.
      what_remains_open: Whether retrieved knowledge is sufficient for novel insight
        beyond training data, and how to handle contradictions across sources.
    - line: Agentic planning and iterative refinement for automated literature review
      what_it_solves: Producing high-quality, coherent survey papers by orchestrating
        multiple specialized agents with feedback loops.
      what_remains_open: The extent to which planning mechanisms can improve scientific
        depth versus surface-level formatting, and scalability to long-horizon tasks
        without memory degradation.
    - line: Benchmarking and evaluation design for literature intelligence systems
      what_it_solves: Providing standardized tasks and metrics (cell annotation, multiple-choice
        questions, rubric scores) to compare AI scientist capabilities.
      what_remains_open: Coverage of diverse scientific literature tasks beyond narrow
        domains, and the gap between proxy metrics and genuine scientific contribution.
    - line: End-to-end agentic systems for literature synthesis and survey generation
      what_it_solves: Turning isolated model ideas into runnable, reproducible pipelines
        that can autonomously generate literature.
      what_remains_open: Standardized validation across different scientific fields
        and ensuring reproducibility of agent outputs given non-deterministic LLM
        behaviors.
    - line: Taxonomy of failure modes and design principles for autonomous literature
        research
      what_it_solves: Organizing observed failures (bias, implementation drift, memory
        degradation) into design principles for robust AI scientists.
      what_remains_open: Empirical validation that these principles improve system
        reliability across diverse tasks, and the absence of a unified theory of scientific
        quality in machine-generated literature.
    consensus:
    - Multi-agent LLM systems can automate parts of the literature review process,
      but fully autonomous literature intelligence remains unsolved.
    - Iterative refinement (via rubrics, verification, or evolutionary steps) is essential
      for improving output quality.
    - Human evaluation or expert-designed benchmarks are necessary to assess output
      quality.
    disagreements:
    - Some works focus on generating full survey papers with rubric-based quality
      assessment, while others integrate literature synthesis as a sub-step in broader
      scientific discovery workflows.
    - 'Evaluation targets differ: domain-specific scientific discovery tasks (e.g.,
      cell annotation) versus general survey quality judged by LLM rubrics.'
    - 'Verification strategies vary: internal logical verification loops versus external
      reviewer agents scoring against rubrics.'
    - Domain scope ranges from domain-agnostic frameworks to systems tailored to applied
      mathematics or omics.
    open_questions:
    - How to verify the factual accuracy of AI-generated literature reviews, especially
      when handling contradictory or outdated sources.
    - Whether LLM-based evaluation rubrics can replace human peer review for assessing
      scientific quality.
    - The scalability of these agentic systems to very large literature corpora and
      long-horizon research projects without memory degradation.
    - The ethical implications of fully automated scientific literature generation,
      including plagiarism and accountability.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 科学知识表示与检索用于文献合成
      解决的问题: 将非结构化论文集转化为结构化的、可检索的知识，以指导生成。
      尚未覆盖: 检索到的知识是否足以产生超越训练数据的新见解，以及如何处理来源间的矛盾。
    - 路线: 智能体规划与迭代优化用于自动文献综述
      解决的问题: 通过编排多个专业化智能体及其反馈回路，生成高质量、连贯的综述论文。
      尚未覆盖: 规划机制能在多大程度上提升科学深度而非仅表面格式，以及长周期任务下无记忆退化的可扩展性。
    - 路线: 文献情报系统的基准测试与评估设计
      解决的问题: 提供标准化任务和指标（细胞注释、选择题、评分准则分数）以比较AI科学家能力。
      尚未覆盖: 覆盖窄领域之外的多样科学文献任务，以及代理指标与真实科学贡献之间的差距。
    - 路线: 端到端智能体系统用于文献合成与综述生成
      解决的问题: 将孤立的模型构想转化为可运行、可复现的流水线，自主生成文献。
      尚未覆盖: 跨不同科学领域的标准化验证，以及在LLM非确定性行为下确保智能体输出的可复现性。
    - 路线: 自主文献研究的失败模式与设计原则分类
      解决的问题: 将观察到的失败（偏向、实现漂移、记忆退化）组织为构建鲁棒AI科学家的设计原则。
      尚未覆盖: 实证验证这些原则能提升跨任务的系统可靠性，以及缺乏机器生成文献科学质量的统一理论。
    共识:
    - 多智能体LLM系统可以自动化文献综述过程的部分环节，但完全自主的文献情报仍未解决。
    - 迭代优化（通过评分准则、验证或进化步骤）对提升输出质量至关重要。
    - 需要人类评估或专家设计的基准来评估输出质量。
    分歧:
    - 部分工作聚焦于生成完整综述论文并以评分准则评估质量，而其他工作将文献合成作为更广泛科学发现流程的子步骤。
    - 评估目标不同：领域特定的科学发现任务（如细胞注释）与LLM评分准则判断的通用综述质量。
    - 验证策略各异：内部逻辑验证循环与外部评审智能体根据评分准则打分。
    - 领域范围从领域无关框架到针对应用数学或组学定制的系统。
    开放问题:
    - 如何验证AI生成文献综述的事实准确性，特别是在处理矛盾或过时来源时。
    - 基于LLM的评估评分准则能否替代人类同行评审以评估科学质量。
    - 这些智能体系统在极大规模文献库和长周期研究项目中的可扩展性，且不发生记忆退化。
    - 全自动科学文献生成的伦理问题，包括抄袭和问责。
