  related_work_outline:
  - 'Mainstream direction: Multi-agent frameworks that decompose literature review
    into specialized subtasks (outlining, writing, editing, reviewing) to automate
    survey generation with improved readability and citation quality.'
  - 'Shared research pattern: LLM-based agents are organized into workflows—iterative
    retrieval, hierarchical organization, or peer review simulation—to handle scientific
    literature at scale, with a focus on role specialization and process decomposition.'
  - 'Key differences: The target task splits into full review generation, study organization
    support, and peer review automation; evaluation metrics range from surface similarity
    to human reviews to adversarial robustness, with no agreed standard.'
  - 'Trend evolution: From static hierarchical organization (2024) to multi-agent
    generation and iterative workflows (2025), then toward robustness analysis and
    self-evolving retrieval (2026), indicating a shift toward dynamic, resilient,
    and adaptive review agents.'
  - 'Open questions: Factual accuracy and hallucination in generated reviews remain
    unverified; cross-domain generalization is untested; standardized benchmarks and
    reproducibility are largely absent; adversarial vulnerabilities are only beginning
    to be explored.'
  related_work_outline_zh:
  - 主流方向：多智能体框架将文献综述分解为大纲、写作、编辑、审阅等专用子任务，以自动化生成综述，提升可读性和引用质量。
  - 研究共性：基于LLM的智能体被组织为迭代检索、层次化组织或同行评审模拟等工作流，以规模化处理科学文献，强调角色专业化和流程分解。
  - 关键差异：目标任务分为完整综述生成、文献组织支持和同行评审自动化；评测指标从与人类综述的表面相似度到对抗鲁棒性不等，缺乏统一标准。
  - 趋势演进：从静态层次化组织（2024）到多智能体生成和迭代工作流（2025），再到鲁棒性分析和自进化检索（2026），显示向动态、鲁棒和自适应综述智能体的转变。
  - 开放问题：生成综述的事实准确性和幻觉问题尚未验证；跨领域泛化未测试；标准化基准和可复现性普遍缺失；对抗脆弱性仅初步探索。
  literature_review:
    line_of_work_matrix:
    - line: Multi-agent review generation
      what_it_solves: Automates end-to-end literature review writing by assigning
        outlining, drafting, editing, and reviewing to specialized agents, improving
        readability and citation quality over single-pass generation.
      what_remains_open: Factual accuracy beyond surface similarity to human reviews
        is unverified; evaluation is limited to a few datasets; reproducibility signals
        are weak (code and artifacts not fully available).
    - line: Iterative and hierarchical literature structuring
      what_it_solves: Organizes large collections of scientific studies into hierarchical
        or iteratively refined structures to support deeper survey automation and
        easier human navigation.
      what_remains_open: No empirical evidence or methodology details are provided
        in the packet; effectiveness, scalability, and comparison to simpler retrieval-augmented
        generation remain unknown.
    - line: Peer review simulation and robustness
      what_it_solves: Simulates peer review dynamics with LLM agents to understand
        vulnerabilities, gaming, and reliability of automated review systems under
        adversarial inputs.
      what_remains_open: Lack of standardized benchmarks for peer review quality;
        no evidence on how these simulations correlate with real human review outcomes;
        adversarial defenses are not yet proposed.
    - line: Self-evolving retrieval agents
      what_it_solves: Enables literature retrieval agents that adapt and improve their
        search strategies over time without manual redesign.
      what_remains_open: No implementation or evaluation evidence is available; the
        concept of self-evolution in retrieval is not validated against static retrieval
        baselines.
    - line: Benchmarking research automation agents
      what_it_solves: Provides task suites to measure LLM agents' ability to automate
        research workflows, such as post-training pipelines, which could extend to
        literature review tasks.
      what_remains_open: Direct relevance to literature review is unclear; no results
        or analysis are included; the benchmark's coverage of review-specific subtasks
        is not demonstrated.
    consensus:
    - LLM-based agents are the dominant approach for automating literature review
      and related scholarly tasks.
    - Decomposing the review process into multiple steps or specialized roles is a
      shared design principle.
    - There is a common goal of improving the efficiency and quality of scientific
      literature synthesis through automation.
    disagreements:
    - 'The scope of automation varies: some systems target full survey writing, others
      focus on study organization or peer review, with no unified task definition.'
    - 'Evaluation practices diverge: one line uses similarity to human-written reviews,
      another examines adversarial robustness, and most systems lack reported empirical
      results.'
    - The degree of human involvement and the definition of 'review quality' remain
      unsettled, leading to different design choices in agent workflows and success
      criteria.
    open_questions:
    - How can the factual accuracy of generated literature reviews be systematically
      verified beyond surface-level similarity metrics?
    - What evaluation protocols and benchmarks can capture the true utility of a review
      for researchers across different domains?
    - What are the failure modes and adversarial vulnerabilities of multi-agent review
      systems, and how can they be mitigated?
    - How can retrieval and synthesis agents be made self-evolving while maintaining
      reliability and avoiding concept drift?
    - The evidence packet lacks reproducibility details and large-scale validation
      for most systems, leaving many claims unsubstantiated.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多智能体综述生成
      解决的问题: 通过将大纲、起草、编辑和审阅分配给专用智能体，自动化端到端的文献综述写作，相比单次生成提升了可读性和引用质量。
      尚未覆盖: 除与人类综述的表面相似度外，事实准确性未经验证；评估仅限于少数数据集；可复现性信号弱（代码和工件未完全公开）。
    - 路线: 迭代与层次化文献组织
      解决的问题: 将大量科学研究组织为层次化或迭代优化的结构，以支持更深入的自动化综述和更便捷的人工导航。
      尚未覆盖: 证据包中未提供实证证据或方法细节；有效性、可扩展性以及与更简单的检索增强生成的对比尚不清楚。
    - 路线: 同行评审模拟与鲁棒性
      解决的问题: 用LLM智能体模拟同行评审动态，以理解自动化评审系统在对抗输入下的脆弱性、可操纵性和可靠性。
      尚未覆盖: 缺乏同行评审质量的标准化基准；没有证据表明这些模拟与真实人类评审结果的相关性；尚未提出对抗防御方案。
    - 路线: 自进化检索智能体
      解决的问题: 使文献检索智能体能够随时间自适应地改进搜索策略，无需人工重新设计。
      尚未覆盖: 没有可用的实现或评估证据；自进化检索的概念未与静态检索基线进行验证。
    - 路线: 研究自动化智能体基准
      解决的问题: 提供任务套件以衡量LLM智能体自动化研究工作流（如后训练流程）的能力，可能扩展至文献综述任务。
      尚未覆盖: 与文献综述的直接相关性不明确；未包含结果或分析；基准对综述特定子任务的覆盖未得到证明。
    共识:
    - 基于LLM的智能体是自动化文献综述及相关学术任务的主流方法。
    - 将综述过程分解为多个步骤或专用角色是共同的设计原则。
    - 普遍目标是通过自动化提升科学文献合成的效率和质量。
    分歧:
    - 自动化范围不一：有的系统瞄准完整综述写作，有的聚焦文献组织或同行评审，缺乏统一的任务定义。
    - 评测实践分化：一条路线使用与人类综述的相似度，另一条考察对抗鲁棒性，多数系统缺少报告的实证结果。
    - 人类参与程度和“综述质量”的定义尚未统一，导致智能体工作流和成功标准的设计选择不同。
    开放问题:
    - 如何超越表面相似度指标，系统验证生成文献综述的事实准确性？
    - 什么样的评测协议和基准能捕捉综述对不同领域研究者的真实效用？
    - 多智能体综述系统的失败模式和对抗脆弱性是什么，如何缓解？
    - 如何使检索与合成智能体实现自进化，同时保持可靠性并避免概念漂移？
    - 证据包中多数系统缺乏可复现细节和大规模验证，许多主张尚未得到证实。
