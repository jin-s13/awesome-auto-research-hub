  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous manuscript generation
      what_it_solves: Producing full scientific manuscripts from minimal prompts by
        chaining ideation, code, experiments, visualization, and writing.
      what_remains_open: Reliability is inconsistent; only some submissions pass peer
        review, and generated conference-ready papers remain difficult.
    - line: Verification and evidence-grounding for scientific writing
      what_it_solves: Reducing unsupported claims and silent failures by auditing
        logical coherence, inspecting rendered physical fields, or constraining reporting
        to measured values.
      what_remains_open: Domain-specific gates still miss planted failures, and logical
        or numeric verification is not shown to generalize across fields.
    - line: Human-AI collaboration and oversight in research writing
      what_it_solves: Placing human intervention at high-leverage decision points
        rather than requiring full autonomy or exhaustive step-by-step supervision.
      what_remains_open: Which intervention modes transfer across different research
        domains and team settings is not established.
    - line: Evaluation and benchmarking of AI-generated research
      what_it_solves: Making claims comparable through automated reviewers, peer-review
        submission, benchmark success such as ARC-Bench, and cost thresholds.
      what_remains_open: Proxy LLM/rubric scores are not yet aligned with broader
        human peer review, and benchmark coverage remains narrow.
    - line: Self-correction and failure attribution for research agents
      what_it_solves: Diagnosing experiment or implementation failures through multi-hypothesis
        attribution and routing interventions to the correct stage.
      what_remains_open: Even with improved metrics-bearing outputs and artifact quality,
        fully autonomous conference-ready scientific writing remains unsolved.
    consensus:
    - Multi-agent or end-to-end LLM pipelines are treated as the primary mechanism
      for moving from research ideation to manuscript drafting.
    - Verification or grounding is necessary because raw LLM output can contain hallucinated
      citations, fabricated numbers, or physically/logically invalid claims.
    - Evaluation should combine quantitative task or benchmark performance with some
      form of reviewer or rubric assessment of manuscript quality.
    - Autonomous research writing is not yet dependable enough to remove all human
      judgment, especially for conference-ready scientific claims.
    disagreements:
    - 'Systems choose different autonomy modes: fully autonomous generation and review
      simulation versus targeted human collaboration at high-leverage decision points.'
    - 'Verification signals differ across lines: internal logical coherence checks
      versus vision-language physical plausibility gates versus grounded numeric reporting
      constrained to measured values.'
    - 'Evaluation targets differ: LLM-based rubric scores, workshop peer-review acceptance,
      or benchmark success such as ARC-Bench are not interchangeable evidence.'
    - 'Domain assumptions differ: some systems target narrow formal or physical domains
      where validity gates can be defined, while others target general ML writing
      without domain-specific checks.'
    - 'Failure handling differs: one-shot reflection versus multi-hypothesis causal
      attribution, leading to different recovery ability and measured improvement.'
    open_questions:
    - How well do LLM-based review rubrics and simulated reviewers predict human peer-review
      acceptance, and what evidence would close that gap?
    - Can verification gates be built for domains beyond applied mathematics and computational
      fluid dynamics without relying on domain-specific visual or symbolic checks?
    - Why do only a minority of fully generated manuscripts pass peer review, and
      which failure modes arise from writing versus experimentation?
    - What standardized external validation, open datasets, code, metrics, and limitation
      reporting are needed to compare autonomous research-writing systems?
    - What is the optimal granularity and timing of human intervention for improving
      manuscript quality without adding exhaustive oversight cost?
