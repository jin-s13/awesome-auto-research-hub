  related_work_outline:
  - 'Mainstream direction: Autonomous scientific discovery agents increasingly combine
    literature retrieval, knowledge synthesis, reasoning, verification, and manuscript
    generation into end-to-end agent workflows with human experts as reviewers or
    principal investigators.'
  - 'Shared research pattern: Work is shifting from reproducing known results toward
    evaluating whether generated claims are evidence-supported, using blinded tasks,
    rubrics, human baselines, and evidence-maturity dimensions.'
  - 'Key differences: Studies differ in evaluation target—generated paper quality,
    blinded discovery claims, or domain-specific multiple-choice performance—and in
    supervision mode—human expert, fixed LLM judge, or human baseline.'
  - 'Trend evolution: Available years 2023–2026 cluster at the current frontier; recent
    work moves from single-task agents toward self-evolving frameworks, and from demonstration
    papers toward failure analysis and benchmark construction.'
  - 'Open questions: Do rubric and benchmark gains reflect true discovery, do automated
    judges align with human scientific judgment, and which mechanisms reduce documented
    failure modes in long-horizon research workflows?'
  related_work_outline_zh:
  - 主流方向：自主科学发现智能体趋向把文献检索、知识综合、推理、验证和论文生成整合为端到端智能体流程，人类专家担任评审或首席研究员角色。
  - 研究共性：研究从复现已知结果转向评估生成主张是否有证据支撑，采用盲任务、评分标准、人类基线和证据成熟度维度。
  - 关键差异：评测目标不同，包括生成论文质量、盲发现任务、领域选择题；监督方式包括人类专家、固定LLM评判器、人类基线。
  - 趋势演进：2023—2026年证据集中在前沿区间；近期从单任务智能体转向自演化框架，并从演示性论文转向失败分析与基准建设。
  - 开放问题：评分提升是否代表真正科学发现；自动评判器与人类判断是否一致；哪些机制能减少长程研究中的重复失败模式。
  literature_review:
    line_of_work_matrix:
    - line: Multi-agent research workflow orchestration
      what_it_solves: Coordinates literature synthesis, knowledge retrieval, verification,
        derivation, and manuscript generation within an end-to-end autonomous assistant.
      what_remains_open: Claims are mainly validated by LLM-based rubrics; external
        validation across disciplines, code release, and human-expert utility are
        not established.
    - line: Evidence-grounded scientific discovery benchmarking
      what_it_solves: Creates blinded peer-reviewed tasks that score whether an agent's
        claims have controls, robustness, falsifiability, and cross-dataset generalization.
      what_remains_open: Reported results use one frozen base model; generalizability
        across base models and alignment between automated judges and human scientific
        judgment remain open.
    - line: Human-baseline domain discovery evaluation
      what_it_solves: Measures AI scientists against human experts on real domain
        data tasks and multiple-choice questions derived from published studies.
      what_remains_open: The autonomy gap is not decomposed into literature, reasoning,
        or execution limitations, and evaluated domains are concentrated in single-cell
        biology.
    - line: Autonomous research failure analysis
      what_it_solves: Documents recurring failure modes in end-to-end autonomous research
        attempts and derives design principles for more robust systems.
      what_remains_open: Evidence comes from a small number of attempts in one research
        domain; the derived design principles lack systematic controlled evaluation.
    - line: Taxonomy and survey synthesis of agentic scientific discovery
      what_it_solves: Organizes systems, capabilities, metrics, frameworks, and datasets
        across scientific domains and identifies critical challenges.
      what_remains_open: Taxonomy remains descriptive; literature review automation,
        system reliability, and ethical concerns are named but not resolved empirically.
    consensus:
    - End-to-end agent workflows share a multi-stage structure spanning literature
      retrieval, reasoning or derivation, execution/documentation, and evaluation.
    - Evaluation is shifting from completion or reproduction of known results toward
      evidence-maturity checks such as controls, robustness, falsifiability, and auditability.
    - Current systems are positioned as human-in-the-loop assistants or partial AI
      scientists rather than fully autonomous discovery engines.
    - Literature synthesis and knowledge retrieval are recognized bottlenecks, with
      verification or self-critique added to reduce cascading errors.
    disagreements:
    - 'Evaluation target differs: one line scores final generated papers with LLM
      review rubrics, another scores blinded evidence maturity on open-ended tasks,
      and another uses human-baseline multiple-choice questions.'
    - 'Supervision signal differs: human expert as principal investigator, fixed LLM
      judge, and graduate-level human baseline imply different validity criteria.'
    - 'System scope differs: some operate as domain-specific assistants in applied
      mathematics or omics biology, while others aim for domain-agnostic self-evolving
      frameworks.'
    - Reported success criteria differ between headline benchmark scores and detailed
      failure-mode analysis, leading to different claims about current capability.
    open_questions:
    - Does improved rubric or benchmark score indicate genuine scientific discovery,
      or only more polished documentation and self-consistency?
    - How do automated LLM judges generalize across base models, scientific domains,
      and peer-review contexts when current evidence is limited to a single frozen
      model?
    - Which design components reduce documented failure modes such as bias toward
      training-data defaults, implementation drift, memory degradation, and weak scientific
      taste?
    - Can literature review automation and citation analysis become reliable enough
      for expert synthesis without introducing unverified references or shallow gap
      discovery?
    - What external validation across hardware, datasets, and user settings would
      establish reproducibility beyond reported repository and artifact signals?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多智能体研究工作流编排
      解决的问题: 在端到端自主助手中协调文献综合、知识检索、验证、推导和论文生成。
      尚未覆盖: 主要依赖LLM评分标准验证；跨学科、代码与人类专家效用等外部验证尚不明确。
    - 路线: 证据锚定的科学发现基准
      解决的问题: 通过盲审同行研究任务，评估智能体主张是否具备对照、稳健性、可证伪性和跨数据集泛化。
      尚未覆盖: 当前仅在一个冻结基座模型上报告；跨基座模型泛化以及自动裁判与人类科学判断的一致性仍未解决。
    - 路线: 基于人类基线的领域发现评测
      解决的问题: 用真实领域数据任务和来自已发表研究的题目，将AI科学家与人类专家表现进行对比。
      尚未覆盖: 自主性差距未被分解为文献、推理或执行限制；评测领域集中于单细胞生物学。
    - 路线: 自主研究失败分析
      解决的问题: 记录端到端自主研究尝试中的重复失败模式，并为更稳健系统提炼设计原则。
      尚未覆盖: 样本尝试次数少且领域单一；设计原则缺乏系统控制评估。
    - 路线: 智能体科学发现的综述与分类
      解决的问题: 跨科学领域组织系统、能力、指标、框架和数据集，并识别关键挑战。
      尚未覆盖: 分类仍偏描述性；文献综述自动化、系统可靠性与伦理问题未被实证解决。
    共识:
    - 端到端智能体工作流普遍采用多阶段结构，涵盖文献检索、推理或推导、执行/记录与评估。
    - 评测正从完成或复现已知结果，转向对照、稳健性、可证伪性与可审计性等证据成熟度检查。
    - 当前系统被定位为人机协同助手或部分AI科学家，而非完全自主发现引擎。
    - 文献综合与知识检索被识别为瓶颈；系统普遍引入验证或自我批判以减少级联错误。
    分歧:
    - 评测目标不同：一条路线用LLM评审打分生成论文，另一条评估盲任务上的证据成熟度，第三条采用人类基线选择题。
    - 监督信号不同：人类首席研究员、固定LLM裁判和研究生水平人类基线隐含不同效度标准。
    - 系统范围不同：部分系统面向应用数学或组学领域，另一类则追求领域无关的自演化框架。
    - 成功判据不同：有的报告基准高分，有的侧重失败模式分析，导致对当前能力判断存在分歧。
    开放问题:
    - 基准或评分提升是否代表真正科学发现，还是仅表示文档更完善、自洽性更强？
    - 自动LLM裁判在基座模型、科学领域和同行评审情境间的泛化性如何，当前证据是否充分？
    - 哪些设计能减少训练数据默认偏好、实现漂移、记忆退化和科学品味薄弱等重复失败模式？
    - 文献综述自动化能否在引用核验、证据溯源和真实缺口发现上达到专家综合的可靠性？
    - 需要哪些跨硬件、数据集和用户设置的外部验证，才能确立可复现性，而不只是显示仓库或工件信号？
