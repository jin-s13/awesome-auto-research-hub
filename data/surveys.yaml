      尚未覆盖: 输出是否稳定且具备真正科学新颖性，自动评审通过能否迁移到更广泛同行或实际验证，仍缺少直接证据。
    - 路线: 发现与实验评测平台
      解决的问题: 通过结构化任务、基线和指标，评测智能体完成发现循环或提升已发表科学ML模型的能力。
      尚未覆盖: 任务完成和benchmark提升是否代理真实科研洞察或决策效用尚不确定；模拟任务和窄域覆盖不足。
    - 路线: 面向科研智能体的知识与失败记忆
