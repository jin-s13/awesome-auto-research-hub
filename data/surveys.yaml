  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous experimentation and manuscript generation
      what_it_solves: Automating the full cycle from hypothesis/idea, code implementation,
        experiment execution, analysis and visualization to paper writing or mathematical
        derivation.
      what_remains_open: Consistency and acceptance beyond small case sets; reliance
        on self-review or simulated review; limited evidence for open-ended generalization
        and full peer review.
    - line: Structured evaluation environments for discovery agents
      what_it_solves: Providing repeatable tasks and metrics for hypothesis formation,
        experiment design, result analysis, and discovered knowledge, making agent
        performance comparable.
      what_remains_open: Coverage of real scientific utility and agreement between
        task/LLM-judge metrics and expert judgment; strong prior agents still struggle
        on these tasks.
    - line: Interactive multi-agent research platforms and workflow orchestration
      what_it_solves: Turning isolated experiment scripts into customizable role-based
        teams with code harnesses, monitoring, artifact inspection, rollback/resume,
        and execution feedback.
      what_remains_open: External validation across hardware, datasets, users, and
        domains; current evidence is early and limited to few internal AI case studies.
    - line: Failure-aware memory and experiment planning scaffolds
      what_it_solves: Recording prior failed attempts or planning ablations so downstream
        agents can avoid repeated mistakes and propose more informative experiments.
      what_remains_open: Recall remains below human level, author/reviewer grounding
        patterns differ, and transfer is shown on narrow PDE/AI retry and planning
        tasks.
    - line: Evaluation and verification scaffolds
      what_it_solves: Introducing automated review, rubric-based scoring, VLM feedback,
        or LLM judges to assess generated papers, figures, and experimental decisions.
      what_remains_open: Automatic scores may not equate to scientific correctness;
        peer-review success is inconsistent and only workshop-level in evidence.
    consensus:
    - Current systems agree on framing experiment automation as a loop of ideation,
      execution, analysis, and reporting rather than a single prediction task.
    - 'Automatic evaluation is treated as necessary for scaling: simulated reviewers,
      LLM judges, task-completion metrics, and expert-preference comparisons all appear
      as evidence mechanisms.'
    - Evidence consistently shows agents are not yet reliable enough for fully unsupervised
      scientific work, requiring either human oversight, verification, memory, or
      constrained tasks.
    - The available evidence is concentrated in small case studies and narrow domains,
      leaving open whether findings transfer to broader experimental science.
    disagreements:
    - Interaction mode differs from fully autonomous pipelines to human-in-the-loop
      platforms, with some systems emphasizing customizable roles and real-time control.
    - 'Evaluation targets differ: some work scores generated manuscripts, some measures
      task completion in simulated worlds, some measures ablation recall, and some
      uses expert preference.'
    - 'Representation and supervision differ: some systems use internal verification
      or negative memory, while others rely on simulated reviewer feedback or benchmark
      metrics.'
    - Deployment setting differs from applied mathematics and PDE tasks to machine-learning
      codebases and virtual laboratory experiments, changing the required action space
      and prior knowledge.
    open_questions:
    - Do LLM-judge or simulated-reviewer scores track scientific correctness, novelty,
      and experimental completeness closely enough to replace expert gatekeeping?
    - Can end-to-end systems move beyond five-paper, three-subfield, or five-case
      demonstrations to robust performance across unseen experimental domains?
    - Does negative knowledge transfer remain useful outside ScienceAgentBench and
      nonlinear PDE retries, and under what conditions does it mislead downstream
      agents?
    - 'What reproducibility gaps exist: several top papers lack visible OpenAlex/citation
      evidence or full limitation details, and code/data availability is only partially
      inferred from links.'
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主实验与论文生成
      解决的问题: 自动化从假设/想法、代码实现、实验执行、分析和可视化到论文撰写或数学推导的完整循环。
      尚未覆盖: 在小样本集之外的一致性和接受度；依赖自我评审或模拟评审；开放域泛化和完整同行评审证据有限。
    - 路线: 面向发现智能体的结构化评测环境
      解决的问题: 提供可重复的任务和指标，用于评估假设形成、实验设计、结果分析和发现的解释性知识，使智能体性能可比较。
      尚未覆盖: 真实科学效用覆盖以及任务/LLM评判指标与专家判断之间的一致性；强基线智能体仍普遍难以完成这些任务。
    - 路线: 交互式多智能体研究平台与工作流编排
      解决的问题: 把孤立实验脚本转化为可定制角色团队，并提供代码工具、监控、工件检查、回滚/恢复和执行反馈。
      尚未覆盖: 跨硬件、数据集、用户和领域的外部验证；现有证据仍早期，仅限于少量内部AI案例研究。
    - 路线: 失败感知记忆与实验规划脚手架
      解决的问题: 记录既往失败尝试或规划消融实验，使下游智能体避免重复错误并提出更有信息量的实验。
      尚未覆盖: 召回仍低于人类水平，作者/审稿人的基础模式存在差异，迁移仅在狭窄的PDE/AI重试和规划任务上得到展示。
    - 路线: 评测与验证脚手架
      解决的问题: 引入自动评审、基于评分标准的评分、VLM反馈或LLM判断，用于评估生成论文、图表和实验决策。
      尚未覆盖: 自动分数未必等同于科学正确性；同行评审成功不稳定，证据中仅达到工作坊级别。
    共识:
    - 现有系统的共识是将实验自动化视为提出想法、执行、分析和报告的循环，而不是单一预测任务。
    - 自动评测被视为规模化必需机制：模拟评审、LLM判断、任务完成指标和专家偏好比较都被用作证据手段。
    - 证据一致表明智能体尚不足以承担完全无人监督的科学工作，仍需人类监督、验证、记忆或受限任务。
    - 可用证据集中在少量案例和狭窄领域，无法确认这些发现是否能迁移到更广泛的实验科学。
    分歧:
    - 交互模式不同：从全自主流程到人类在回环平台，部分系统强调可定制角色和实时控制。
    - 评测目标不同：有的对生成论文评分，有的测量模拟世界中的任务完成，有的测量消融召回，有的采用专家偏好。
    - 表征与监督不同：一些系统使用内部验证或负知识记忆，另一些依赖模拟评审反馈或基准指标。
    - 部署场景不同：从应用数学与PDE任务到机器学习代码库和虚拟实验室实验，所需的动作空间和先验知识不同。
    开放问题:
    - LLM评判或模拟评审分数是否足够接近科学正确性、新颖性和实验完整性，以替代专家把关？
    - 端到端系统能否超越五篇论文、三个子领域或五个案例的演示，在未见过的实验领域取得稳健表现？
    - 负知识在ScienceAgentBench和非线性PDE重试之外是否仍然有用，在何种条件下会误导下游智能体？
    - 存在哪些可复现性缺口：若干高排名论文缺少可见的OpenAlex/引用证据或完整局限性描述，代码/数据可用性也多为链接推断。
