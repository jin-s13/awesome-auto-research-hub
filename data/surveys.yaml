  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research workflows
      what_it_solves: Integrates ideation, code execution, experiment design, result
        analysis, visualization, and manuscript generation into one automated loop,
        reducing the cost and manual overhead of producing a complete research artifact.
      what_remains_open: Inconsistent success across submissions and domains; validation
        remains mostly demonstration-level rather than broad external reproducibility
        or full conference-level evidence.
    - line: Verification-gated discovery systems
      what_it_solves: Adds logical or physics-aware checks before accepting runtime
        modifications or generated conclusions, aiming to catch silent failures that
        solver-level or textual checks miss.
      what_remains_open: Known false negatives exist, such as missed planted silent
        failures, and the verification is evaluated only inside specific simulation
        or formal-domain settings.
    - line: Knowledge-based multi-agent reasoning systems
      what_it_solves: Targets theory-driven formal discovery by combining retrieval,
        multi-agent roles, internal proof or logic auditing, and human-PI collaboration
        rather than relying only on open-ended coding.
      what_remains_open: Evaluation rests on an LLM-based review rubric with missing
