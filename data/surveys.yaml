  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: Covers idea generation, code and experiment execution, result
        visualization, and full paper drafting from a minimal prompt.
      what_remains_open: Success is inconsistent outside constrained domains or workshop-level
        venues; long-horizon implementation drift and weak scientific taste remain
        unresolved.
    - line: Verification and self-correction during research generation
      what_it_solves: Catches logical errors, invalid physical results, fabricated
        numbers, hallucinated citations, or silent failures before they enter the
        manuscript.
      what_remains_open: Verification gates still miss planted failures, and evidence
        is limited to ablation cases or selected domains rather than broad external
        validity.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Positions human experts at high-leverage decision points instead
        of requiring full autonomy or exhaustive step-by-step oversight.
      what_remains_open: Optimal intervention granularity and transfer across domains
        or user expertise levels are not established.
    - line: Agentic planning and search for iterative research
      what_it_solves: Manages long-horizon experiment iteration through tree search,
        multi-agent debate, or failure-attribution routing.
      what_remains_open: The contribution of planning and search versus base model
        capability and domain-specific scaffolding is not isolated.
    - line: Automated review and evaluation of generated papers
      what_it_solves: Provides low-cost, near-human scoring or peer-review simulation
        for generated manuscripts.
      what_remains_open: Automated reviewers may reward style or threshold crossing
        rather than scientific validity; genuine peer acceptance is rare and narrow.
    - line: Failure analysis and design principles for autonomous research agents
      what_it_solves: Documents recurring failure modes and converts them into reusable
        design guidance.
      what_remains_open: Taxonomies are based on few end-to-end attempts and are not
        yet shown to predict downstream system performance.
    consensus:
    - Current systems converge on decomposing the full research and writing cycle
      into LLM agents for ideation, execution, analysis, writing, and review.
    - Reliability requires verification or self-correction loops rather than single-pass
      generation.
    - Evaluation commonly uses automated reviewers or benchmarks, while human or peer
      review remains a stricter but rarely achieved standard.
    - Full autonomy remains brittle; some human involvement or targeted oversight
      tends to improve outcomes.
    disagreements:
    - 'Verification target differs: mathematical logical coherence, physics-based
      field validity, measured-value grounding, and citation or result traceability.'
    - 'Autonomy versus oversight differs: fully autonomous agents, principal investigator
      and graduate-student collaboration, and multi-mode human-in-the-loop control.'
    - 'Planning and search mechanism differs: agentic tree search, multi-agent debate,
      multi-hypothesis failure attribution, and fixed pipeline workflows.'
    - 'Evaluation standard differs: LLM review rubric, ARC-Bench relative improvement,
      blind scoring, and real workshop peer review.'
    - 'Domain scope differs: general ML subfields, applied mathematics, and computational
      fluid dynamics.'
    open_questions:
    - Can these systems move beyond workshop-level or domain-specific case studies
      to regular full conference publications and external replication?
    - Which verification signals are sufficient to prevent generated manuscripts from
      containing plausible but false claims?
    - How should human collaboration be allocated to improve reliability without undermining
      scalable autonomy?
    - Are automated review metrics aligned with scientific value, or do they mainly
      reward threshold artifacts and style?
    - Do improvements on ARC-Bench or blind scores transfer to robust long-horizon
      research in unseen domains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究与论文生成
      解决的问题: 从最小提示出发，覆盖想法生成、代码和实验执行、结果可视化以及完整论文撰写。
      尚未覆盖: 在受控领域或工作坊之外成功率不稳定；长程实现漂移和薄弱科学品味仍是缺口。
    - 路线: 研究生成过程中的验证与自我纠正
      解决的问题: 在错误进入论文之前捕获逻辑错误、无效物理结果、伪造数字、幻觉引用或静默失败。
      尚未覆盖: 验证门控仍会漏掉植入失败，证据仅限于消融案例或特定领域，缺少广泛外部验证。
    - 路线: 人机协作与干预设计
      解决的问题: 将人类专家置于高杠杆决策点，而非依赖完全自主或逐步人工监督。
      尚未覆盖: 最佳干预粒度以及跨领域、跨用户专业水平的迁移尚未建立。
    - 路线: 面向迭代研究的智能体规划与搜索
      解决的问题: 通过树搜索、多智能体辩论或失败归因路由管理长程实验迭代。
      尚未覆盖: 规划与搜索的收益尚未与基座模型能力、领域专用脚手架分离开来。
    - 路线: 生成论文的自动评审与评测
      解决的问题: 为生成手稿提供低成本、接近人类的评分或模拟同行评审。
      尚未覆盖: 自动评审可能奖励风格或过线表现而非科学有效性；真实同行接收仍稀少且范围狭窄。
    - 路线: 自主研究智能体的失败分析与设计原则
      解决的问题: 记录重复出现的失败模式，并将其转化为可复用的设计指南。
      尚未覆盖: 分类体系来自少量端到端尝试，尚不能预测后续系统性能。
    共识:
    - 当前系统趋同于将完整科研和写作循环分解为构思、执行、分析、写作和评审等LLM智能体。
    - 仅靠单次生成不够，系统通常引入验证、自我纠正或审稿回路。
    - 评测常用自动评审或基准，但人类或同行评审仍是更严格、少见的最终证据。
    - 完全自主仍不稳定，部分人类参与或针对高杠杆点的监督常带来提升。
    分歧:
    - 验证目标不同：数学逻辑一致性、基于物理的场有效性、实测值真实性、引用与结果可溯源性。
    - 自主程度与人机分工不同：完全自主、首席研究员-研究生式协作、多模式人机闭环控制。
    - 规划与搜索机制不同：智能体树搜索、多智能体辩论、多假设失败归因、固定流水线。
    - 评测标准不同：LLM评审标准、ARC-Bench相对提升、盲评分数、真实工作坊同行评审。
    - 适用范围不同：通用ML子领域、应用数学、计算流体动力学等。
    开放问题:
    - 能否从工作坊级或领域案例扩展到常规会议论文和外部复现？
    - 哪些验证信号足以防止生成论文出现貌似合理但错误的主张？
    - 如何分配人类协作以在保持可扩展自主性的同时提高可靠性？
    - 自动评审指标是否与科学价值一致，还是主要反映过线阈值与风格？
    - ARC-Bench或盲评提升能否迁移到未见领域的长期科研质量？
