  related_work_outline_zh:
  - 主流方向：构建自动研究智能体，并以证据锚定的评测、验证门控和治理机制评估其科学可靠性与可复现性。
  - 研究共性：智能体提出假设、执行实验并记录结果，再由盲测任务、人类基线、自动裁判或验证门控判断其证据成熟度。
  - 关键差异：评测目标从通用机器学习论文生成延伸到流体力、组学、预测等领域发现；控制机制从事后评审到确定性权限控制和物理感知门控不等；成功标准与可靠性证据也不同。
  - 趋势演进：在当前 2024-2026 前沿内，研究从通用论文生成走向虚拟任务环境和工作坊级同行评审，再走向领域特定验证门控与基于证据的盲测；重点由产出论文转向可信性。
  - 开放问题：代理指标能否预测真实可复现性；验证门控能否在植入失败和单一基座模型之外泛化；编码智能体为何在证据成熟度上平台化；以及如何区分真正发现与胜任性执行。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end automated research agent systems
      what_it_solves: Turns LLM-driven ideation, code implementation, experiment execution,
        and manuscript writing into runnable autonomous workflows with some acceptance
        or verification signal.
      what_remains_open: Verification can still miss silent failures, peer-review
        acceptance is inconsistent, and domain-specific generality remains unclear.
    - line: Evidence-grounded evaluation benchmarking
      what_it_solves: Makes autonomous discovery claims comparable through blind or
        held-out tasks, human baselines, and automated judges that score evidence
        maturity.
      what_remains_open: Proxy metrics and results based on a single frozen base model
        may not generalize across scientific domains, evaluators, or deployment settings.
    - line: Reliability gates and authority separation
      what_it_solves: Constrains agent-generated hypotheses, source-code edits, and
        result promotion using deterministic checks, program-level authority, or domain-specific
        validity gates.
      what_remains_open: Gates can miss planted failures and lack external validation
        beyond a few case studies; reported improvements may not separate gate quality
        from task-specific tuning.
    - line: Automated review and evidence-maturity judging
      what_it_solves: Provides scalable post-hoc assessment of paper or claim quality
        using LLM/VLM reviewers and rubric-based evidence scoring.
      what_remains_open: Automated review correlation with downstream scientific validity
        is not established, and judged capability may plateau while core scientific
        controls remain absent.
    consensus:
    - Automated research agents can now execute multi-step experiment cycles and document
      findings, but evaluation is still immature relative to scientific validity.
    - Evaluations increasingly use blind tasks, human baselines, or automated judges
      to measure more than final accuracy.
    - Verification or control mechanisms are considered necessary because agents can
      produce plausible but not defensible claims.
    - There is a recurring gap between competent analysis execution and trustworthy
      scientific judgment, especially around controls, robustness, falsifiability,
      and cross-dataset generalization.
    disagreements:
    - 'Evaluation target differs: some work assesses broad machine-learning paper
      generation while other work assesses domain-specific discovery in fluid dynamics,
      omics, or forecasting contexts.'
    - 'Control timing and mechanism differ: some systems allow open-ended generation
      with after-the-fact review or judging, while others enforce deterministic program
      authority or domain-specific visual/physics gates before promotion.'
    - 'Success criteria differ: peer-review acceptance, benchmark score, human-baseline
      comparison, and task-specific metric improvement are not interchangeable evidence
      of reliability.'
    - 'Reliability evidence differs: some systems report gate or authority benefits,
      while benchmark evidence shows coding agents plateau with no statistically reliable
      pairwise separation and still lack discriminating scientific acts.'
    open_questions:
    - Do automated judges and task-completion metrics predict downstream reproducibility
      and real scientific validity?
    - Can verification gates catch silent failures beyond planted ablations and across
      different base models and domains?
    - Why do coding agents plateau on evidence-maturity scores and consistently lack
      controls, robustness, falsifiability, and cross-dataset generalization?
    - What additional evidence is needed to distinguish genuine discovery from competent
      execution and documentation?
