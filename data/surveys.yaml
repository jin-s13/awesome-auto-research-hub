  literature_review:
    line_of_work_matrix:
    - line: Retrieval-grounded literature and evidence access
      what_it_solves: Converts literature databases into queryable evidence layers
        so review agents can retrieve, verify, and cite source material without relying
        only on parametric knowledge or open web search.
      what_remains_open: Coverage beyond life-sciences corpora and whether improved
        citation-level metrics generalize to broader expert review quality is not
        established.
    - line: Multi-agent and iterative review generation workflows
      what_it_solves: Automates structuring, writing, editing, and review using specialized
        or iterative agent roles to improve readability, citation quality, and similarity
        to human surveys.
      what_remains_open: Evidence is tied to limited benchmark datasets and baselines;
        the contribution of each agent stage and robustness across domains remain
        underexamined.
    - line: Evaluation and leaderboard certification for review agents
      what_it_solves: Defines fair comparison conditions and compositional controllability
        for biomedical literature-review agents, exposing when leaderboard comparisons
        are admissible.
      what_remains_open: The provided packet lacks detailed methodology and results,
        so whether the controllability framework transfers beyond biomedical reviews
        and which metrics certify real utility is unknown.
    - line: Conceptual surveys and scientific-agent integration
      what_it_solves: Frames literature review as one component inside broader AI
        scientist systems, using historical systems such as Adam and Eve as an organizing
        lens for automation and integration challenges.
      what_remains_open: Integration of literature evidence with hypothesis-experiment
        loops remains unsolved; claims are largely qualitative and long-term.
    consensus:
    - Recent systems treat literature review as a compound task requiring retrieval,
      source grounding, structured organization, drafting, and evaluation rather than
      a single LLM call.
    - They emphasize citation-level or expert-aligned evidence as a central quality
      target, even when exact metrics differ.
    - 'There is convergence on using LLM agents as orchestrators: decomposing queries,
      calling live databases or search, and aggregating evidence.'
    disagreements:
    - One line grounds review quality in live literature database retrieval and expert-consensus
      verification, while another focuses on role-specialized multi-agent writing
      workflows judged by similarity and citation quality.
    - 'Evaluation designs differ: some use fixed review benchmarks with established
      baselines, while leaderboard certification work questions whether many comparisons
      are admissible due to controllability constraints.'
    - Scope differs between domain-specific biomedical/life-science systems and general
      literature-review automation, with different assumptions about domain-specific
      metadata and evaluation.
    open_questions:
    - Does improving Citation F1 and expert consensus on literature-probing benchmarks
      translate into more reliable and useful full literature reviews for researchers?
    - Which review-agent components, such as retrieval, planning, source extraction,
      writing, and editing, causally drive gains, and what failure modes remain outside
      current benchmarks?
    - What evaluation conditions make literature-review agent comparisons fair and
      externally valid beyond the biomedical/life-science settings represented in
      the evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 检索支撑的文献与证据访问
      解决的问题: 将文献数据库转化为可查询的证据层，使综述代理能够实时检索、抽取并佐证来源，而不仅依赖参数化知识或网页搜索。
      尚未覆盖: 除生命科学语料外，能否覆盖更多领域；Citation F1等引用级指标改善是否转化为专家级综述质量仍缺少验证。
    - 路线: 多代理与迭代式综述生成工作流
      解决的问题: 通过专用或迭代角色完成提纲、子节写作、编辑和评审，以提升可读性、引用质量以及与人类综述的相似度。
      尚未覆盖: 证据主要来自SciReviewGen和ScienceDirect等少数基准；各代理阶段的独立贡献和跨领域鲁棒性尚未充分消融。
    - 路线: 综述代理的评测与排行榜认证
      解决的问题: 定义公平比较条件与组合可控性，判断生物医学文献综述代理的排行榜比较是否可采纳。
      尚未覆盖: 证据包缺乏详细方法与结果；该框架能否扩展至生物医学之外的场景并证明真实效用仍未知。
    - 路线: 科学智能体概念综述与集成
      解决的问题: 将文献综述视为更广泛AI科学家系统中的一环，以Adam、Eve等历史系统为线索组织自动化科学与集成挑战。
      尚未覆盖: 文献证据与假设-实验闭环的集成仍未解决；多数主张为定性、长期目标。
    共识:
    - 近期系统把文献综述视为检索、来源落地、结构化组织、撰写和评测共同构成的复合任务，而不是单次LLM调用。
    - 普遍以引用级或专家对齐的证据质量为中心目标，即使具体指标不同。
    - 系统设计上倾向将LLM作为编排器，分解查询、调用实时数据库或搜索并聚合证据。
    分歧:
    - 一类工作将综述质量建立在实时文献数据库检索与专家共识验证上，另一类工作侧重角色专用多代理写作流程，并以与人类综述的相似度和引用质量评判。
    - 评测设计不同：有的在固定综述基准上与既定基线比较，排行榜认证工作则质疑许多比较因可控性约束而不可采纳。
    - 范围不同：部分系统绑定生物医学/生命科学特定数据和评测，其他工作面向更通用的文献综述自动化。
    开放问题:
    - 文献探测基准上的Citation F1和专家共识提升能否转化为研究者实际需要的高质量完整综述？
    - 检索、规划、来源抽取、写作和编辑环节中，哪些组件带来因果性性能增益，当前基准未覆盖哪些失败模式？
    - 在生物医学/生命科学之外，什么评测条件能使文献综述代理的比较公平且外部有效？
