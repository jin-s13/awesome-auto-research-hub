  related_work_outline_zh:
  - 主流方向：端到端的自主AI科学家系统，将创意生成、实验执行、验证和论文写作整合到一个流程中，以最少的人工干预产出可投稿的完整论文。
  - 研究共性：多智能体或模块化架构，包含专门的验证、自我纠错和报告组件；以大型语言模型为核心推理引擎；通过结构化反馈循环进行迭代改进。
  - 关键差异：验证方式（逻辑审计 vs. 视觉-语言物理门控 vs. 多假设失败归因）、人类参与程度（完全自主 vs. 人机混合协作与明确定义的干预模式）以及领域通用性（通用机器学习
    vs. 面向数学或流体力学的领域专用系统）。
  - 趋势演进：从2024年AI Scientist框架展示可行性，到2025年AI Scientist-v2产出首篇被工作坊接收的AI生成论文，再到2026年出现具备更强自我修正能力（SAGE,
    AutoResearchClaw）、领域专用化（ReasFlow, AI CFD Scientist）和人在回路设计的系统。
  - 开放问题：跨不同科学领域的标准化评估；对理论错误的全面验证；最优人机协作策略；以及在不发生记忆退化情况下的可靠长程推理。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous scientific discovery and paper generation
      what_it_solves: Automates the full research lifecycle—from ideation and experiment
        to manuscript writing—reducing human cost and enabling rapid iteration.
      what_remains_open: Output quality is inconsistent; acceptance at rigorous peer-reviewed
        venues remains rare; systems lack robust recovery from experimental failures
        and deep theoretical reasoning.
    - line: Verification and self-correction mechanisms
      what_it_solves: Reduces hallucination, logical errors, and fabricated results
        by incorporating internal auditing, physics-based visual checks, or causal
        failure attribution before writing.
      what_remains_open: Verification gates still miss subtle failures (e.g., 2 of
        16 planted silent failures missed in one study); abstract or theoretical validity
        remains unchecked; formal guarantees of correctness are absent.
    - line: Human-AI collaboration and intervention strategies
      what_it_solves: Balances autonomy and reliability by allowing human experts
        to intervene at high-leverage decision points, improving overall research
        quality over fully autonomous pipelines.
      what_remains_open: Optimal timing and granularity of human intervention are
        not yet quantified; the trade-off between human cognitive load and system
        autonomy is underexplored.
    - line: Evaluation and benchmarking for AI scientists
      what_it_solves: Provides comparable metrics (e.g., automated reviewer scores,
        benchmark success rates) to assess progress across different systems and tasks.
      what_remains_open: Existing benchmarks cover limited domains and tasks; alignment
        between proxy metrics and true scientific impact is not validated; lack of
        standardized protocols for open-ended research.
    consensus:
    - Current LLM-based systems can accelerate scientific writing and experimentation
      but cannot yet reliably produce high-quality, publication-ready papers without
      verification and iterative refinement.
    - Structured internal verification and error correction loops are essential for
      reducing hallucinations and improving the factual accuracy of generated content.
    - Fully autonomous systems still fall short of human scientists in tasks requiring
      deep domain insight, creative hypothesis generation, and critical paper reviewing.
    disagreements:
    - 'The optimal verification strategy is contested: logic-based internal auditing
      versus domain-specific physics-aware visual inspection versus multi-hypothesis
      causal failure attribution.'
    - Systems differ in their stance on human involvement—some pursue full autonomy
      while others advocate structured human-AI collaboration with defined intervention
      modes, leading to different performance trade-offs.
    - General-purpose AI scientist frameworks (e.g., AI Scientist) target broad ML
      domains, whereas specialized systems (e.g., ReasFlow for applied math, AI CFD
      Scientist for fluid dynamics) argue that domain-specific knowledge and verification
      are necessary for defensible results.
    open_questions:
    - Can a unified evaluation protocol be designed to compare AI scientists across
      diverse scientific fields, given the varying nature of evidence and validity?
    - How can verification mechanisms be extended to cover theoretical derivation
      errors, experimental design flaws, and subtle scientific inconsistencies beyond
      obvious factual mistakes?
    - Under what conditions does human-AI collaboration significantly outperform full
      autonomy, and how should the collaboration interface be designed to minimize
      human effort while maximizing output quality?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科学发现与论文生成
      解决的问题: 自动化从创意、实验到论文写作的完整科研流程，降低人力成本并实现快速迭代。
      尚未覆盖: 输出质量不稳定；在严格同行评审会议上被接收的情况仍然稀少；系统缺乏从实验失败中稳健恢复和进行深层理论推理的能力。
    - 路线: 验证与自我纠错机制
      解决的问题: 通过在写作前引入内部审计、基于物理的视觉检查或因果失败归因，减少幻觉、逻辑错误和捏造结果。
      尚未覆盖: 验证门控仍会遗漏细微失败（如一项研究中植入的16个静默失败被漏检2个）；抽象或理论有效性仍未得到检验；缺乏形式化的正确性保证。
    - 路线: 人机协作与干预策略
      解决的问题: 通过允许人类专家在高杠杆决策点进行干预，平衡自主性与可靠性，从而比完全自主流程获得更高的研究质量。
      尚未覆盖: 人类干预的最佳时机和粒度尚未量化；人类认知负荷与系统自主性之间的权衡尚未充分探索。
    - 路线: AI科学家的评估与基准测试
      解决的问题: 提供可比较的指标（如自动审稿人评分、基准成功率），以衡量不同系统和任务的进展。
      尚未覆盖: 现有基准覆盖的领域和任务有限；代理指标与真实科学影响之间的一致性尚未验证；缺乏面向开放式研究的标准化协议。
    共识:
    - 当前基于LLM的系统能够加速科学写作和实验，但若无验证和迭代改进，仍无法可靠地生成高质量、可发表的论文。
    - 结构化的内部验证和纠错循环对于减少幻觉和提高生成内容的事实准确性至关重要。
    - 在需要深度领域洞察、创造性假设生成和批判性论文评审的任务中，全自主系统仍不及人类科学家。
    分歧:
    - 最佳验证策略存在争议：基于逻辑的内部审计 vs. 领域特定的物理感知视觉检查 vs. 多假设因果失败归因。
    - 不同系统在人类参与程度上立场不同——一些追求完全自主，另一些则倡导具有明确定义干预模式的结构化人机协作，导致不同的性能权衡。
    - 通用AI科学家框架（如AI Scientist）面向广泛的机器学习领域，而专用系统（如ReasFlow用于应用数学，AI CFD Scientist用于流体动力学）则认为领域特定知识和验证对于获得可靠结果必不可少。
    开放问题:
    - 能否设计一个统一的评估协议，在考虑到不同科学领域证据和有效性的差异的情况下，比较不同领域的AI科学家？
    - 验证机制如何扩展到覆盖理论推导错误、实验设计缺陷以及超越明显事实错误的细微科学不一致？
    - 在什么条件下人机协作显著优于全自主模式，协作界面应如何设计以最小化人工负担并最大化产出质量？
