  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: Produces complete papers from minimal prompts by coupling idea
        generation, code execution, experiment design, visualization, and writing.
      what_remains_open: 'Output quality is uneven: one of three workshop submissions
        passed peer review, and conference-level or domain-general acceptance is not
        demonstrated.'
    - line: Verification and evidence-grounded reporting
      what_it_solves: Reduces fabricated numbers, hallucinated citations, invalid
        physics, and premature success claims before results enter a manuscript.
      what_remains_open: Verification gates are incomplete; a vision-language physics
        gate missed 2 of 16 planted failures, and cross-domain validity remains untested.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Improves research outcomes by placing human oversight at high-leverage
        decision points rather than using exhaustive step-by-step control.
      what_remains_open: Intervention modes are benchmark-specific and do not yet
        show how minimal human guidance scales across diverse scientific writing tasks.
    - line: Self-correction and failure attribution
      what_it_solves: Converts failed runs into corrections by attributing errors
        to hypotheses, experimental design, or implementation and routing interventions.
      what_remains_open: Gains are measured on small topic sets; fully autonomous
        conference-ready writing remains unresolved.
    - line: Simulated review, evaluation, and failure-mode analysis
      what_it_solves: Creates comparable signals for generated papers via LLM reviewers,
        workshop submission, artifact scores, and failure-mode checklists.
      what_remains_open: Proxy review scores and acceptance thresholds are not validated
        against broader scientific peer review or real-world influence.
    consensus:
    - Manuscript writing is embedded in an autonomous research pipeline rather than
      treated as isolated drafting.
    - Verification, grounded reporting, or review feedback is seen as necessary because
      agents otherwise fabricate content or declare false success.
    - Structured multi-stage designs such as tree search, debate, and failure attribution
      are favored over single-pass generation.
    - Evaluation uses LLM rubrics or workshop/benchmark outcomes, while human peer-review
      evidence remains limited.
    disagreements:
    - 'Autonomy stance differs: full autonomy, selective human collaboration, and
      step-by-step oversight are treated differently by the evidence.'
    - 'Verification modality differs: domain-specific physics inspection, logical
      coherence auditing, and reporting constraints target different failure sources.'
    - 'Failure response differs: some systems use reflection, while others use causal
      multi-hypothesis attribution with deterministic intervention routing.'
    - 'Evaluation standards differ: workshop acceptance, rubric scores, benchmark
      improvements, and artifact quality are not interchangeable.'
    open_questions:
    - Do LLM reviewers and rubric scores align with human peer-review acceptance and
      scientific value?
    - Can domain-specific verification generalize to other experimental fields without
      missing invalid results?
    - What minimal human interaction schedule preserves rigor across broad research
      writing settings?
    - Do current autonomous systems produce reproducible artifacts and stable acceptance
      beyond small curated benchmarks?
