  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research systems
      what_it_solves: Turning large language models into complete scientific pipelines
        that handle idea generation, coding, experimentation, and paper writing without
        per-task human intervention.
      what_remains_open: Cross-domain reliability and consistency; most systems are
        demonstrated on narrow domains or a small set of papers, and failure modes
        like silent experimental errors remain only partially addressed.
    - line: Domain-specific verification and reliability gates
      what_it_solves: Ensuring the physical or logical validity of autonomously generated
        experiments by incorporating domain-aware checks, such as vision-based flow
        field inspection for CFD or internal proof verification for mathematics.
      what_remains_open: Verification gates are not perfect (e.g., missed 2 of 16
        silent failures in CFD), and their design is tightly coupled to the target
        domain, limiting transfer to new scientific fields.
    - line: Benchmarks and evaluation for AI scientists
      what_it_solves: Providing standardized tasks and metrics to compare AI scientist
        agents, moving beyond ad-hoc paper reviews to structured environments like
        DISCOVERYWORLD, BAISBench, and ARC-Bench.
      what_remains_open: Existing benchmarks cover only a fraction of scientific disciplines;
        the correlation between benchmark scores and real-world scientific contribution
        is unvalidated, and human baselines are often small or not representative.
    - line: Human-AI collaboration models
      what_it_solves: Integrating human expertise at critical decision points to improve
        research quality while maintaining high automation, as demonstrated by structured
        intervention modes and cross-run learning.
      what_remains_open: Optimal intervention granularity and timing are not yet understood;
        the trade-off between human effort and research output quality needs systematic
        study across varied scientific domains.
    consensus:
    - Current AI scientist systems are not yet capable of fully autonomous, reliable
      scientific discovery and require some form of verification or human oversight.
    - Large language models serve as the central orchestrator, but their raw outputs
      need grounding through code execution, formal verification, or domain-specific
      simulators.
    - Automated paper generation alone is insufficient; the validity of the underlying
      experiments and reasoning is the primary concern, driving the inclusion of internal
      validation loops and physical checks.
    disagreements:
    - 'The necessity of domain specialization: general systems like AI Scientist target
      broad ML subfields, while ReasFlow and AI CFD Scientist argue that deep domain
      knowledge and verification are essential for meaningful contributions.'
    - 'The role of human input: AI Scientist and AI Scientist-v2 aim for full autonomy,
      whereas AutoResearchClaw shows that targeted human collaboration at high-leverage
      points outperforms both full autonomy and exhaustive oversight.'
    - 'Evaluation methodology: Some works rely on simulated LLM reviewers or workshop
      peer review, while others introduce task-based benchmarks (DISCOVERYWORLD, BAISBench,
      ARC-Bench) with specific metrics, leading to different claims about system capability.'
    open_questions:
    - Can the verification components designed for one domain (e.g., vision-based
      physics checks) be generalized to other scientific fields without losing effectiveness?
    - How should the research community establish a consensus evaluation protocol
      that balances automated scoring with expert human judgment and covers both experimental
      and theoretical sciences?
    - What is the minimal set of human interventions needed to guarantee the correctness
      of an AI-generated scientific paper, and how does this vary across disciplines?
