  related_work_outline_zh:
  - 主流方向：构建端到端的自主研究流程，由基于LLM的智能体迭代提出假设、设计并执行实验、分析结果并撰写论文，重点集中在代码驱动的机器学习和数学领域。
  - 研究共性：一个以想法生成、实验执行和自我批判为核心的中心循环，并常通过失败记忆、自动验证或模拟同行评审来增强，以筛选和优化输出。
  - 关键差异：领域从应用数学到ML子领域和虚拟科学任务不等；智能体架构包括单智能体链式和多智能体角色分工；评估目标涵盖基准任务完成度、自动评审分数和人类同行评审接收。
  - 趋势演进：2023–2026年间，前沿从单次论文生成转向迭代式、失败感知和多智能体系统，越来越强调可复现性，基准覆盖范围扩大，并出现了首篇经同行评审的完全AI生成的工作坊论文。
  - 开放问题：这些流程能否从模拟或代码实验推广到湿实验和物理环境；如何确保全自主实验决策的科学有效性和安全性；代理指标与真实科学贡献之间如何对齐。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research frameworks
      what_it_solves: automating the full scientific discovery cycle from hypothesis
        generation, experimental execution, and result analysis to manuscript writing,
        reducing human involvement to a minimal PI-like role.
      what_remains_open: generalization beyond code-based ML or math domains; consistent
        quality across multiple runs (only one of three AI Scientist-v2 submissions
        passed peer review); and handling of safety-critical physical experiments.
    - line: Benchmarks and environments for experiment automation
      what_it_solves: providing standardized tasks and metrics to evaluate how well
        agents plan experiments, test hypotheses, and interpret results, enabling
        reproducible comparisons across different automation approaches.
      what_remains_open: coverage of diverse scientific disciplines beyond the eight
        virtual topics and ML ablation planning; the gap between proxy metrics like
        task completion or reviewer scores and real-world scientific impact; and the
        low 45% recall of current LMs on ablation identification.
    - line: Memory and knowledge mechanisms for iterative experimentation
      what_it_solves: improving the efficiency of experimental loops by storing and
        reusing past failures (negative knowledge), allowing agents to avoid repeating
        mistakes and to solve tasks that naive baselines cannot.
      what_remains_open: extending beyond bounded typed failure records to richer
        forms of scientific knowledge, such as partial successes, qualitative insights,
        or cross-project transfer; and whether the approach scales to long-running,
        multi-month research campaigns.
    - line: Multi-agent collaboration and human-in-the-loop interaction
      what_it_solves: structuring research teams as customizable multi-agent systems
        with specialized roles (e.g., experiment manager, coder, reviewer) and dashboards
        for real-time monitoring, intervention, and artifact inspection.
      what_remains_open: maturity of the platform for real-world deployment; evaluation
        limited to a few internal case studies; and how to integrate physical lab
        equipment and human experimenters in the loop beyond code-based artifacts.
    consensus:
    - LLM-based agents are the primary engine for automating experiment design, execution,
      and analysis in current research.
    - Iterative loops that combine hypothesis generation, experimental feedback, and
      self-critique outperform single-shot generation.
    - Automated evaluation (simulated reviewers, benchmark tasks) is necessary to
      scale the assessment of autonomous research quality.
    - Memory of past attempts, whether positive or negative, improves the efficiency
      and success rate of automated experimentation.
    disagreements:
    - 'The scope of automation: some limit it to code-based ML experiments, while
      others target applied mathematics theorem proving, or text-based virtual science
      tasks.'
    - 'Agent architecture: single-agent chain-of-thought prompting can outperform
      multi-agent setups on ablation planning, yet multi-agent systems are preferred
      for end-to-end research generation.'
    - 'Evaluation philosophy: some rely on automated reviewer scores, others on human
      peer-review acceptance or benchmark task completion, and the correlation between
      these measures remains unclear.'
    - 'Role of human input: ranging from participant as PI who gives high-level guidance,
      to platforms that only allow monitoring and rollback, or completely hands-off
      generation.'
    open_questions:
    - Can these systems be extended to physical laboratory settings where experiments
      involve real-world materials, safety constraints, and long time horizons?
    - How can we verify that a fully AI-generated paper contains genuine scientific
      contributions rather than plausible-sounding but flawed reasoning?
    - What is the minimal human supervision required to ensure the reliability and
      safety of autonomous scientific discovery across different domains?
    - To what extent do the findings from virtual environments or benchmark tasks
      transfer to the actual practice of scientific research?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究框架
      解决的问题: 自动化从假设生成、实验执行、结果分析到论文撰写的完整科学发现循环，将人类参与降至类似PI的指导角色。
      尚未覆盖: 在代码驱动的ML或数学领域之外的泛化；跨多次运行的稳定质量（AI Scientist-v2提交的三篇中仅一篇通过同行评审）；安全关键物理实验的处理。
    - 路线: 实验自动化的基准与环境
      解决的问题: 提供标准化任务和指标，以评估智能体规划实验、检验假设和解释结果的能力，使不同自动化方法之间可复现比较。
      尚未覆盖: 覆盖除八个虚拟主题和ML消融规划之外的多种科学学科；任务完成度或审稿分数等代理指标与真实科学影响之间的差距；当前语言模型在消融识别上仅45%的召回率。
    - 路线: 面向迭代实验的记忆与知识机制
      解决的问题: 通过存储和重用过去的失败（负知识）来提高实验循环效率，使智能体避免重复错误并解决简单基线无法解决的任务。
      尚未覆盖: 从有界类型失败记录扩展到更丰富的科学知识形式，如部分成功、定性洞察或跨项目迁移；方法能否扩展到长期、跨月的研究活动。
    - 路线: 多智能体协作与人机交互
      解决的问题: 构建可定制角色的多智能体研究团队（如实验管理器、编码员、审稿人），并提供仪表板实现实时监控、干预和工件检查。
      尚未覆盖: 平台在实际部署中的成熟度；评估仅限于少数内部案例研究；如何将物理实验室设备和人类实验者整合到循环中，而非仅限于代码工件。
    共识:
    - 基于LLM的智能体是当前自动化实验设计、执行和分析的主要引擎。
    - 结合假设生成、实验反馈和自我批判的迭代循环优于单次生成。
    - 自动评估（模拟审稿人、基准任务）对于规模化评估自主研究质量是必要的。
    - 存储过去尝试（无论是正面还是负面）的记忆能提高自动化实验的效率和成功率。
    分歧:
    - 自动化范围：一些工作限于代码驱动的ML实验，另一些瞄准应用数学中的定理证明，或基于文本的虚拟科学任务。
    - 智能体架构：在消融规划中，单智能体思维链提示优于多智能体设置，但端到端研究生成中多智能体系统更受青睐。
    - 评估理念：有的依赖自动审稿人分数，有的依赖人类同行评审接收或基准任务完成度，这些度量之间的相关性尚不明确。
    - 人类输入的角色：从作为PI提供高层指导的参与者，到仅允许监控和回滚的平台，再到完全无人工干预的生成。
    开放问题:
    - 这些系统能否扩展到物理实验室环境，其中实验涉及真实材料、安全约束和长时间跨度？
    - 如何验证完全由AI生成的论文包含真正的科学贡献，而非听起来合理但有缺陷的推理？
    - 在不同领域确保自主科学发现可靠性和安全性所需的最低人类监督是多少？
    - 虚拟环境或基准任务中的发现在多大程度上能迁移到实际的科学研究实践中？
