  - 主流方向：自主端到端研究智能体，覆盖提出想法、执行实验、分析结果、撰写或评审论文；多采用多智能体角色、验证循环、记忆、树搜索或交互式仪表板。
  - 研究共性：智能体在“假设—设计—执行—分析—报告”闭环中运行，评估主要依赖自动评审、基准任务、专家偏好或同行评审，而非统一的科学效用指标。
