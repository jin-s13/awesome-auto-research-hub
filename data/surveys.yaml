  related_work_outline:
  - 'Mainstream direction: Building end-to-end AI agent systems that autonomously
    generate scientific research ideas, execute experiments, and produce complete
    manuscripts with minimal human intervention.'
  - 'Shared research pattern: All systems decompose the scientific workflow into stages
    (ideation, coding, experimentation, writing, reviewing) and orchestrate one or
    more LLM agents; they incorporate some form of verification or feedback loop to
    catch errors and improve output quality.'
  - 'Key differences: Systems differ in the degree of autonomy (fully autonomous vs.
    human-in-the-loop collaboration), the granularity and mechanism of error correction
    (logical verification, physics-based visual checks, multi-hypothesis failure attribution),
    the domain specificity (general-purpose vs. specialized for mathematics or fluid
    dynamics), and the evaluation criteria (simulated LLM review vs. real peer review
    vs. benchmark scores).'
  - 'Trend evolution: The field moved from demonstrating feasibility of fully automated
    writing (2024) to achieving workshop-level peer acceptance (2025), and then toward
    domain-specialized agents with robust verification, self-correction, and structured
    human-AI collaboration (2026). The trajectory shows increasing emphasis on reliability
    and scientific rigor beyond surface-level paper generation.'
  - 'Open questions: Whether current systems can produce genuinely novel and impactful
    science rather than plausible-looking papers; how to guarantee factual correctness,
    reproducibility, and absence of hallucinated results; what is the optimal interaction
    mode between human scientists and AI research agents; and how to scale beyond
    a few successful examples to consistent performance across diverse research domains.'
  related_work_outline_zh:
  - 主流方向：构建端到端的AI代理系统，自主生成科研想法、执行实验并撰写完整论文，尽量减少人工干预。
  - 研究共性：所有系统均将科学工作流分解为构思、编码、实验、写作、评审等阶段，并编排一个或多个LLM代理；均采用某种验证或反馈回路来捕捉错误并提升输出质量。
  - 关键差异：系统在自主程度上存在差异（全自动 vs. 人机协作），在纠错机制的粒度和方法上不同（逻辑验证、物理视觉检查、多假设失败归因），在领域专一性上区分（通用
    vs. 数学或流体力学专用），以及在评估标准上各异（模拟LLM评审 vs. 真实同行评审 vs. 基准分数）。
  - 趋势演进：领域从2024年展示全自动写作的可行性，发展到2025年实现工作坊级别的同行接受，再到2026年关注具有稳健验证、自我纠正和结构化人机协作的领域专用代理。演变趋势表明越来越强调超越表面论文生成之上的可靠性和科学严谨性。
  - 开放问题：当前系统能否产生真正新颖且有影响力的科学发现，而不仅仅是看似合理的论文；如何保证事实正确性、可复现性和无幻觉结果；人类科学家与AI研究代理之间的最佳交互模式是什么；以及如何从少数成功案例扩展到跨领域的一致性能。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end fully automated manuscript generation
      what_it_solves: Demonstrates the feasibility of using LLM agents to autonomously
        perform the full research cycle—from idea generation to paper writing and
        simulated review—without human-authored templates.
      what_remains_open: Inconsistent paper quality; only a fraction pass real peer
        review, and the generated science may lack depth, novelty, or reproducibility;
        reliance on simulated review may not align with human expert judgment.
    - line: Domain-specialized AI scientists with built-in verification
      what_it_solves: Improves reliability of generated results by embedding domain-specific
        verification gates (e.g., logical coherence checks in mathematics, physics-aware
        visual inspection in CFD) and automating knowledge retrieval, making the system
        more trustworthy for specialized scientific writing.
      what_remains_open: Verification gates can miss edge-case failures; the approach
        is tightly coupled to the target domain, and it is unclear whether the verification
        mechanisms generalize to other fields without substantial redesign.
    - line: Self-correcting and failure-attribution frameworks
      what_it_solves: Addresses the brittleness of autonomous research by introducing
        structured multi-hypothesis failure diagnosis that routes errors to the correct
        intervention level (hypothesis, design, implementation), increasing the rate
        of metrics-bearing outputs and artifact quality.
      what_remains_open: Even with self-correction, the system does not fully overcome
        the challenges of writing conference-ready papers; the attribution mechanism
        has only been tested on a limited set of topics, and its effectiveness on
        more complex, open-ended research is unknown.
    - line: Human-AI collaborative research writing
      what_it_solves: Shows that strategic human intervention at high-leverage decision
        points can outperform both fully autonomous and exhaustive step-by-step oversight,
        balancing autonomy with expert guidance for more robust research outcomes.
      what_remains_open: The optimal collaboration mode and intervention granularity
        remain underexplored; the cost and scalability of human involvement are not
        quantified; the model may not be feasible for researchers without domain expertise
        to provide effective guidance.
    - line: Failure analysis and design principles
      what_it_solves: Systematically documents recurring failure modes (e.g., training
        data bias, implementation drift, memory degradation, overexcitement) in autonomous
        LLM-based research, providing actionable design principles for future systems.
      what_remains_open: The identified failure modes are derived from a small number
        of attempts; design principles are proposed but not yet validated through
        direct implementation and controlled experiments; the list may not be exhaustive
        for all scientific domains.
    consensus:
    - All approaches agree that LLM agents can partially automate the scientific writing
      pipeline, but none can yet produce consistently high-quality, impactful papers
      without some form of human oversight or verification.
    - There is a shared recognition that error detection and correction are critical;
      every system includes at least one feedback loop—whether from simulated reviewers,
      domain-specific validators, or failure attribution modules.
    - 'Evaluation remains a challenge: automatic metrics and LLM judges are used as
      proxies, but their correlation with genuine scientific merit is unproven, and
      the community has not converged on a standard evaluation protocol.'
    disagreements:
    - 'Autonomy level: some systems pursue full end-to-end automation without human
      intervention, while others advocate for human-in-the-loop collaboration, arguing
      that strategic human input at key decision points yields better results.'
    - 'Verification mechanism: approaches range from logical consistency checks in
      formal reasoning, to physics-based vision-language gates for simulation results,
      to multi-hypothesis causal attribution of experiment failures—each targeting
      different failure modes and requiring different domain assumptions.'
    - 'Domain scope: general-purpose systems aim for broad applicability across machine
      learning subfields, whereas domain-specific agents (applied mathematics, CFD)
      incorporate deep domain knowledge and validation, leading to a trade-off between
      generality and reliability.'
    - 'Evaluation target: some papers are evaluated by simulated LLM reviewers, others
      by genuine workshop peer review, and others by artifact quality benchmarks;
      the lack of a common evaluation yardstick makes direct comparison difficult.'
    open_questions:
    - Can the current generation of AI research agents generate genuinely novel scientific
      insights, or are they limited to recombination of known patterns and incremental
      improvements?
    - How can we ensure the factual correctness and reproducibility of AI-generated
      papers, given that hallucinated citations, fabricated numbers, and unreproducible
      experiments are documented failure modes?
    - What is the optimal division of labor between human scientists and AI agents—should
      the human act as a principal investigator, a reviewer, or a collaborator at
      specific stages—and does this depend on the researcher's domain expertise?
    - Do the verification and self-correction mechanisms that work in specialized
      domains (mathematics, CFD) port to less structured, empirical sciences, or do
      they require fundamentally different architectures?
    - The current evidence is based on a small number of successful demonstrations
      and case studies; how can we scale evaluation to a statistically meaningful
      set of diverse research tasks to measure robustness and generalizability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端全自动论文生成
      解决的问题: 展示使用LLM代理自主完成从想法生成到论文写作和模拟评审的完整研究循环的可行性，无需人类编写代码模板。
      尚未覆盖: 论文质量不一致，仅少数通过真实同行评审，且生成的科学内容可能缺乏深度、新颖性或可复现性；依赖模拟评审可能与人类专家判断不一致。
    - 路线: 带有内置验证的领域专用AI科学家
      解决的问题: 通过嵌入领域特定的验证门控（如数学中的逻辑一致性检查、CFD中的物理感知视觉检查）和自动化知识检索，提高生成结果的可靠性，使系统在专业科学写作中更可信。
      尚未覆盖: 验证门控可能遗漏边缘情况失败；该方法与目标领域紧密耦合，验证机制能否泛化到其他领域而不需大幅重新设计尚不清楚。
    - 路线: 自我纠正与失败归因框架
      解决的问题: 通过引入结构化多假设失败诊断，将错误路由到正确的干预级别（假设、设计、实现），从而解决自主研究的脆弱性，提高包含指标输出的比例和工件质量。
      尚未覆盖: 即使有自我纠正，系统仍未能完全克服撰写可提交会议论文的挑战；归因机制仅在有限主题集上测试过，其在更复杂、开放式研究中的有效性未知。
    - 路线: 人机协作研究写作
      解决的问题: 表明在高杠杆决策点进行战略性人工干预可以优于完全自主和详尽的逐步监督，在自主性与专家指导之间取得平衡，获得更稳健的研究成果。
      尚未覆盖: 最佳协作模式和干预粒度仍未充分探索；人类参与的成本和可扩展性未被量化；对于没有领域专长以提供有效指导的研究者，该模式可能不可行。
    - 路线: 失败分析与设计原则
      解决的问题: 系统性地记录了基于LLM的自主研究中重复出现的失败模式（如训练数据偏差、实现漂移、记忆退化、过度兴奋），为未来系统提供可操作的设计原则。
      尚未覆盖: 识别的失败模式源自少量尝试；设计原则已提出，但尚未通过直接实现和可控实验进行验证；该清单可能无法涵盖所有科学领域的失败模式。
    共识:
    - 所有方法都认为LLM代理可以部分自动化科学写作流程，但尚无系统能在没有某种形式的人工监督或验证的情况下，持续产出高质量、有影响力的论文。
    - 普遍认识到错误检测和纠正至关重要；每个系统都包含至少一个反馈回路，无论是来自模拟评审员、领域特定验证器，还是失败归因模块。
    - 评估仍是一个挑战：自动指标和LLM评判被用作代理，但它们与真实科学价值的关联性未经验证，且社区尚未就标准评估协议达成一致。
    分歧:
    - 自主程度：一些系统追求完全无需人工干预的端到端自动化，而另一些则主张人机协作，认为在关键决策点引入战略性人工输入可获得更好结果。
    - 验证机制：方法从形式推理中的逻辑一致性检查，到针对仿真结果的基于物理的视觉-语言门控，再到实验失败的多假设因果归因，各自针对不同的失败模式，需要不同的领域假设。
    - 领域范围：通用系统旨在跨机器学习子领域广泛适用，而领域专用代理（如应用数学、CFD）融入了深厚的领域知识和验证，导致通用性与可靠性之间的权衡。
    - 评估目标：部分论文通过模拟LLM评审员评估，其他通过真实工作坊同行评审，还有通过工件质量基准评估；缺乏统一评估标准使得直接比较困难。
    开放问题:
    - 当前一代AI研究代理能否产生真正新颖的科学见解，还是仅限于已知模式的重新组合和增量改进？
    - 鉴于有记录的幻觉引用、伪造数字和不可复现实验等失败模式，如何确保AI生成论文的事实正确性和可复现性？
    - 人类科学家与AI代理之间的最佳分工是什么——人类应充当首席研究员、评审员还是特定阶段的合作者——这是否取决于研究者的领域专长？
    - 在专业领域（数学、CFD）中有效的验证和自我纠正机制，能否移植到结构性较弱的实证科学，还是需要根本不同的架构？
    - 当前证据基于少量成功演示和案例研究；如何将评估扩展到具有统计意义的不同研究任务集合，以衡量鲁棒性和泛化性？
