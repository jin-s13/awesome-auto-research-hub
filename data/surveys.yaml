  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research workflows
      what_it_solves: Operationalizes the full research cycle from idea generation
        to manuscript preparation with minimal human input.
      what_remains_open: Consistent success, reduced dependence on human-authored
        code templates or narrow tasks, and peer-review-level robustness beyond isolated
        examples.
    - line: Domain-constrained discovery and verification
      what_it_solves: Embeds logical, physical, or knowledge-retrieval constraints
        to filter invalid results before they enter reports.
      what_remains_open: Verification gates still miss silent failures; evidence from
        a CFD study shows 2 of 16 planted failures were missed, and transfer to open-ended
        domains is unclear.
    - line: Evaluation benchmarks and evidence design
      what_it_solves: Makes discovery-agent capabilities comparable through tasks,
        baselines, metrics, and human performance baselines.
      what_remains_open: Synthetic or single-domain tasks may not represent real scientific
        discovery, and proxy metrics may not align with true discovery utility.
    - line: Human-AI collaboration and oversight pipelines
      what_it_solves: Integrates expert judgment at selected decision points to improve
        autonomy while reducing fabricated or unsupported results.
      what_remains_open: Optimal intervention granularity and timing remain uncertain
        and not yet replicated across diverse tasks.
    - line: Automated review and manuscript generation
      what_it_solves: Generates full manuscripts and iterates on them through LLM/VLM-based
        review or feedback loops.
      what_remains_open: Whether LLM-based review scores correlate with human scientific
        validity, long-term contribution, or full conference-level acceptance.
    consensus:
    - Autonomous research systems usually decompose discovery into hypothesis ideation,
      experiment execution, analysis, verification, and writing.
    - Verification and review loops are treated as essential for producing defensible
      claims, although their targets and implementations vary.
    - Current evaluation relies on LLM/VLM judges, domain-specific checks, or benchmark
      scores rather than long-term scientific validity.
    - Human expertise still appears necessary for domain judgment, oversight, or targeted
      intervention, even in systems described as fully automated.
    disagreements:
    - Some systems maximize full autonomy, while others argue that targeted human
      collaboration at high-leverage decision points outperforms both full autonomy
      and step-by-step oversight.
    - 'Verification targets differ: logical coherence in mathematical reasoning, physical
      validity in simulation, result-reporting integrity, and review quality in machine-learning
      papers.'
    - Evaluation settings range from synthetic discovery environments to real single-cell
      transcriptomic data and domain simulators, so reported success metrics are not
      directly comparable.
    - Success is measured by LLM review rubrics, peer-review acceptance, benchmark
      completion, or domain-specific metric gains; these do not encode the same scientific
      value.
    open_questions:
    - Can automated reviewers and verification gates detect enough silent failures
      to support fully autonomous submission?
    - Do high scores on generated-paper rubrics or virtual discovery tasks transfer
