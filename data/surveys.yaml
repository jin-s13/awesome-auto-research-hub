  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery loops, such as The AI Scientist and The
        AI Scientist-v2
      what_it_solves: Closing the full cycle from hypothesis formation, code and experiment
        execution, analysis, visualization, to manuscript generation.
      what_remains_open: Consistency and externally accepted validity remain limited;
        only one of three workshop submissions passed peer review, and generated papers
        rely heavily on automated or simulated review.
    - line: Verification-gated domain discovery, such as ReasFlow and AI CFD Scientist
      what_it_solves: Adding logical audits, physics-aware visual inspection, or review
        feedback to block invalid or silently wrong results before they become claims.
      what_remains_open: 'Gates still miss failures: a CFD ablation showed 2 of 16
        planted silent failures went undetected, so recall and domain coverage are
        unresolved.'
    - line: Discovery benchmarking and evidence evaluation, such as DISCOVERYWORLD
        and TruthInsightBench
      what_it_solves: Providing task suites, blind peer-derived data, rubrics, and
        metrics that compare agents on complete discovery cycles and evidentiary quality.
      what_remains_open: Evidence is based on one frozen base model or simulated tasks;
        proxy metrics have not been tied to real-world scientific utility or human
        peer acceptance.
    - line: Domain-grounded reproducible experiment interfaces, such as OpenFOAM/Foam-Agent
        workflows
      what_it_solves: Turning generic agent loops into runnable physical or mathematical
        workflows with inspectable modifications and domain-specific actions.
      what_remains_open: External validation across hardware, datasets, solvers, and
        user settings is still sparse, and many reproducibility signals remain partial
        rather than standardized.
    consensus:
    - Scientific discovery is widely modeled as an iterative closed loop rather than
      a single generation step.
    - Verification or review feedback is introduced to reject invalid outputs before
      they become written claims.
    - Current agents can execute and document analyses competently, but they plateau
      on controls, robustness, falsifiability, and cross-dataset generalization.
    - LLM-based reviewers or judges are accepted as scalable evaluation signals, but
      they remain proxy measures of scientific quality.
    disagreements:
    - 'Evaluation target differs: generated paper quality versus virtual task completion
      versus blind evidence maturity.'
    - 'Interaction mode differs: fully automated loops, simulated review, and human-PI-with-agent-graduate-student
      collaboration.'
    - 'Validation mechanism differs: logical consistency auditing, physics-aware visual
      gating, and VLM-based figure feedback encode different failure assumptions.'
    - 'Deployment setting differs: general ML experimentation versus OpenFOAM/CFD
      modeling versus applied-math theory workflows.'
    open_questions:
    - How well do LLM-based judges align with human peer review and actual scientific
      validity?
    - Can verification gates achieve reliable silent-failure recall when current evidence
      shows missed failures?
    - Do current agent capabilities transfer across base models and domains beyond
      the limited settings evaluated?
    - What evidence would demonstrate genuine discovery rather than competent code
      execution and manuscript documentation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现闭环，如 The AI Scientist、The AI Scientist-v2
      解决的问题: 将假设形成、代码与实验执行、分析、可视化和论文生成整合为单一自动化流程。
      尚未覆盖: 一致性和外部可接受性仍有限；三篇工作坊投稿仅一篇通过同行评审，生成论文较依赖自动或模拟评审。
    - 路线: 验证门控的领域发现，如 ReasFlow、AI CFD Scientist
      解决的问题: 在成文前通过逻辑审查、物理视觉检查或评审反馈拦截无效或静默错误结果。
      尚未覆盖: 门控仍会漏报；CFD 消融中 16 个植入静默失败漏掉 2 个，说明召回率和领域覆盖不足。
    - 路线: 发现能力基准与证据评测，如 DISCOVERYWORLD、TruthInsightBench
      解决的问题: 用任务集、盲同侪研究数据、评分矩阵和指标比较智能体的完整发现周期与证据质量。
      尚未覆盖: 证据多来自单一冻结模型或仿真任务；代理指标与真实科学效用、人类同侪接受度之间尚未对齐。
    - 路线: 领域可复现实验接口，如 OpenFOAM/Foam-Agent 工作流
      解决的问题: 将通用智能体循环接入可运行的物理或数学工作流，形成可检查的领域特定修改与行动。
      尚未覆盖: 跨硬件、数据集、求解器和用户设置的外部验证仍稀少，复现信号多为局部而非标准化。
    共识:
    - 科学发现被普遍建模为迭代闭环，而不是单步生成。
    - 验证或评审反馈被广泛引入，用于在主张形成前拦截无效输出。
    - 当前智能体能胜任分析和记录，但在对照、稳健性、可证伪性和跨数据集泛化上明显不足。
    - LLM 评审器被作为可扩展评估信号，但仍只是科学质量的代理指标。
    分歧:
    - 评测目标不同：生成论文质量、虚拟任务完成度与盲数据证据成熟度。
    - 交互模式不同：全自动闭环、模拟评审、人类 PI 与智能体研究生式协作。
    - 验证机制不同：逻辑一致性审计、物理感知视觉门控、VLM 图表反馈。
    - 部署场景不同：通用 ML 实验、OpenFOAM/CFD 建模、应用数学理论工作流。
    开放问题:
