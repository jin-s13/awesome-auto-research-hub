  related_work_outline:
  - 'Mainstream direction: Agentic LLM pipelines are being built to automate literature
    synthesis, knowledge retrieval, verification, experiment/analysis, and manuscript
    drafting as a continuous research workflow, rather than isolated search or summarization
    tools.'
  - 'Shared research pattern: Papers combine multi-agent orchestration, LLM-based
    judging or self-verification, and benchmark tasks derived from published studies
    to measure whether systems can produce evidence-grounded claims.'
  - 'Key differences: Generative workflow papers report high LLM-rubric scores for
    complete paper generation, while evidence benchmarks find coding agents plateau
    and lack controls, robustness, falsifiability, and cross-dataset generalization;
    evaluation target, domain scope, and interaction mode differ.'
  - 'Trend evolution: Within 2025-2026, the frontier moves from survey-style capability
    mapping and domain benchmarks toward end-to-end autonomous systems, plus dedicated
    failure-mode and evidence-maturity evaluation.'
  - 'Open questions: Whether LLM-judge scores track human review or true discovery,
    whether systems generalize beyond a frozen base model or curated domains, and
    how to validate literature review automation and research gap discovery remain
    unresolved.'
  related_work_outline_zh:
  - 主流方向：LLM智能体流水线正被推向自动化文献综合、知识检索、验证、实验/分析和手稿生成，形成连续研究工作流，而非孤立的搜索或摘要工具。
  - 研究共性：论文普遍结合多智能体编排、基于LLM的评审或自验证，以及来自已发表研究的基准任务，衡量系统是否能产出证据锚定的主张。
  - 关键差异：生成式工作流论文报告完整论文生成在LLM评分下表现较高，而证据基准发现编码智能体得分平台化，缺乏对照、稳健性、可证伪性和跨数据集泛化；评测目标、领域范围与交互模式不同。
  - 趋势演进：2025-2026年内，前沿从综述式能力梳理和领域基准，转向端到端自主系统，并出现专门的失败模式与证据成熟度评测。
  - 开放问题：LLM评审分数是否与人类评审或真实发现一致，系统能否跨冻结基座模型或策划领域泛化，以及如何验证自动化文献综述与研究空白发现，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous literature-to-manuscript workflows (e.g., ReasFlow)
      what_it_solves: Integrates knowledge retrieval, internal logical verification,
        theorem derivation, experiment execution, and paper drafting into a single
        multi-agent pipeline for literature synthesis and scientific writing.
      what_remains_open: Reported success relies on an LLM-based review rubric; independent
        human or disciplinary validation is absent, and limitation evidence is not
        provided.
    - line: Evidence-grounded benchmarking of open-ended research claims (e.g., TruthInsightBench,
        BAISBench)
      what_it_solves: Tests whether agents can determine what claims frozen data support,
        rather than reproduce hidden target studies; operationalizes evidence maturity,
        auditability, novelty, and domain-specific discovery tasks.
      what_remains_open: TruthInsightBench uses one frozen base model, and agents
        plateau with weak controls, robustness, falsifiability, and cross-dataset
        generalization; BAISBench is limited to single-cell transcriptomic tasks.
    - line: Survey-based conceptual taxonomy of agentic scientific workflows (e.g.,
        Agentic AI for Scientific Discovery)
      what_it_solves: Maps existing agentic systems by scientific domain and capability
        such as literature review, hypothesis generation, experimentation, and analysis;
        inventories metrics, frameworks, and datasets.
      what_remains_open: Literature review automation, system reliability, and ethical
        concerns remain unresolved; the proposed categories are not yet directly validated
        as predictors of model behavior.
    - line: Failure-mode analysis and design principles for autonomous research pipelines
        (e.g., Why LLMs Aren't Scientists Yet)
      what_it_solves: Documents recurring failure modes including training-data-default
        bias, implementation drift, memory degradation, overexcitement, insufficient
        domain intelligence, and weak scientific taste.
      what_remains_open: Evidence is derived from four end-to-end ML research attempts;
        broader replication and design validation across disciplines are still missing.
    - line: Evolving domain-agnostic agent infrastructure (e.g., EvoMaster)
      what_it_solves: Provides reusable self-evolution mechanisms for hypothesis refinement,
        self-critique, and knowledge accumulation across arbitrary disciplines.
      what_remains_open: Benchmark gains on general science and ML tasks do not yet
        establish improved literature search, evidence synthesis, or research gap
        discovery; limitation details are not reported.
    consensus:
    - LLM agents can execute and document literature-facing research workflows, but
      current systems still fall short of fully autonomous, trustworthy scientific
      discovery.
    - Automated LLM judges and blind, evidence-anchored tasks are emerging as the
      main instruments for evaluating agent outputs.
    - Verification, retrieval, literature review automation, and system reliability
      remain identified challenges across evaluations, surveys, and failure studies.
    - Human expertise is still treated as necessary for oversight, grounding, or scientific
      taste.
    disagreements:
    - Generative workflow studies report high-quality autonomous paper generation
      under LLM rubrics, while benchmark and case-study evidence reports plateaued
      agents that lack scientific judgment and fail under implementation pressure.
    - 'Evaluation targets differ: complete manuscript quality versus evidence maturity
      on held-out data versus domain-specific multiple-choice discovery versus general
      science/ML benchmark scores.'
    - 'System design differs: one pipeline uses internal verification and knowledge
      retrieval within a principal-investigator/student collaboration, another uses
      continuous self-evolution, and others study coding agents or multi-agent scaffolding.'
    - Domain and data grounding range from applied mathematics paper generation to
      single-cell transcriptomic discovery, ML research attempts, and domain-agnostic
      infrastructure.
    open_questions:
    - Do LLM-rubric scores correlate with human expert review, publication decisions,
      or true discovery utility?
    - Can these systems maintain evidence-grounded claims across base models, domains,
      and data distributions beyond the frozen model or curated datasets used?
    - What evaluation design can separate novel discovery from reproduction and detect
      training-data-default or overexcitement failures?
    - Which infrastructure and metrics can make literature review automation, citation
      analysis, and research gap discovery reliable enough for scientific workflows?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主文献到论文的工作流（例如 ReasFlow）
      解决的问题: 将知识检索、内部逻辑验证、定理推导、实验执行和论文撰写整合到单一多智能体流水线中，用于文献综合与科学写作。
      尚未覆盖: 报告成功依赖基于 LLM 的评审标准；缺少独立人工或学科验证，且未提供局限性证据。
    - 路线: 面向开放式研究主张的证据锚定基准（例如 TruthInsightBench、BAISBench）
      解决的问题: 测试智能体能否判断冻结数据支持何种主张，而非复现隐藏目标研究；操作化证据成熟度、可审计性、新颖性和领域特定发现任务。
      尚未覆盖: TruthInsightBench 仅使用一个冻结基座模型，智能体在对照、稳健性、可证伪性和跨数据集泛化上表现不足；BAISBench 局限于单细胞转录组任务。
    - 路线: 基于综述的智能体科学工作流概念分类（例如 Agentic AI for Scientific Discovery）
      解决的问题: 按科学领域和能力（如文献综述、假设生成、实验、分析）整理现有智能体系统；盘点指标、框架和数据集。
      尚未覆盖: 文献综述自动化、系统可靠性和伦理问题仍未解决；所提分类尚未被直接验证为能预测模型行为。
    - 路线: 面向自主研究流水线的失败模式分析与设计原则（例如 Why LLMs Aren't Scientists Yet）
      解决的问题: 记录重复失败模式：训练数据默认偏好、实现漂移、记忆退化、过度兴奋、领域智能不足和科学品味薄弱。
      尚未覆盖: 证据来自四次端到端机器学习研究尝试；跨学科复制和设计验证仍然缺失。
    - 路线: 领域无关的演化智能体基础设施（例如 EvoMaster）
      解决的问题: 提供可复用的自我演化机制，用于假设优化、自我批判和跨学科知识积累。
      尚未覆盖: 在通用科学和机器学习任务上的基准提升尚不能证明其改善文献检索、证据综合或研究空白发现；局限性细节未报告。
    共识:
    - LLM 智能体能够执行并记录面向文献的研究工作流，但当前系统仍达不到完全自主、可信赖的科学发现。
    - 自动化 LLM 评审与盲态、证据锚定任务是评估智能体输出的主要手段。
    - 验证、检索、文献综述自动化和系统可靠性在评测、综述与失败研究中仍是常见挑战。
    - 人类专业知识仍被视为监督、依据基础或科学品味所必需。
    分歧:
    - 生成式工作流研究在 LLM 评审标准下报告高质量自主论文生成，而基准与案例证据则显示编码智能体得分平台化，并缺乏科学判断，在执行压力下失败。
    - 评测目标不同：完整手稿质量、盲态数据的证据成熟度、领域特定选择题发现、通用科学与机器学习基准分数各不相同。
    - 系统设计不同：一条流水线在 PI/学生协作中使用内部验证和知识检索，另一条使用持续自我演化，还有研究聚焦编码智能体或多智能体搭建。
    - 领域与数据接地范围从应用数学论文生成，到单细胞转录组发现、机器学习研究尝试和领域无关基础设施不等。
    开放问题:
    - LLM 评审分数是否与人类专家评审、发表决策或真实发现效用相关？
    - 这些系统能否在冻结基座模型或策划数据集之外，跨基座模型、领域和数据分布保持证据锚定主张？
    - 何种评测设计能区分新发现与复现，并检测训练数据默认偏好或过度兴奋等失败？
    - 哪些基础设施和指标能让文献综述自动化、引文分析和研究空白发现可靠地进入科学工作流？
