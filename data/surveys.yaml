  related_work_outline_zh:
  - 主流方向：端到端自主研究写作管线，把构思、实验执行、验证和论文生成串联起来，并用自动评审或工件质量作为评估信号。
  - 研究共性：形成“提出—执行—失败检测—受限报告”的闭环；为减少虚构结果或引用，普遍加入验证、报告门控或人工监督。
