  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端研究闭环系统
      解决的问题: 自动化从选题、实验执行到论文撰写与评审的完整研究循环
      尚未覆盖: 生成论文和自我评估的接受信号是否对应稳健、可外部验证的科学贡献尚不明确
    - 路线: 领域验证型发现智能体
      解决的问题: 通过物理、逻辑或文献依据检查来捕捉专门领域自主发现中的静默失败
      尚未覆盖: 验证门控仍会漏检；所展示的改进范围较窄，跨案例和跨领域泛化证据有限
    - 路线: 科学发现评测环境与基准
      解决的问题: 通过任务套件、完成度和证据成熟度评分使发现智能体可比较
      尚未覆盖: 评测常基于单一基座模型，代理指标与真实科学效用之间的对应关系仍不确定
    - 路线: 自动评审与迭代改进闭环
      解决的问题: 在不完全依赖人类评审的情况下扩大学术论文或科学主张的质量控制与反馈
      尚未覆盖: 自动评审与人类判断的一致性及提交波动下的稳定性尚未充分验证，目前仅展示工作坊级通过
    共识:
    - 端到端系统普遍将科学研究拆解为选题、执行、分析、写作和评审等阶段。
    - 自动评测已成为核心研究对象，覆盖任务完成、动作相关性和证据成熟度等层面。
    - 论文普遍认为能执行代码、撰写文档和生成论文只是必要条件，不足以构成可信科学主张。
    - 验证、可复现性和基准覆盖正在成为第一等关注，而不是事后补充。
    分歧:
    - 评测目标不同：有的用 LLM 评审评分完整论文，有的在虚拟环境中看任务完成度，有的基于同行评审研究做盲测证据成熟度评分。
    - 验证策略不同：内部逻辑审计、基于渲染流场的视觉语言物理门控，或没有专门有效性门控的代码执行。
    - 自主程度与监督方式不同：人类首席研究员-研究生式协作与全自动开放循环并存。
    - 通用系统侧重论文生成，而领域系统强调可测量的领域修正，例如湍流模型改进。
    开放问题:
    - 这些系统能否从生成合理论文和胜任分析，推进到具备对照、稳健性和可证伪性的新科学主张？
    - 自动评审、任务完成分数和证据成熟度评分在多大程度上能跨基座模型和领域预测真实科学有效性？
    - 不同失败模式需要哪些验证门控，如何系统审计被漏检的静默失败？
    - 领域特定结果能否在展示案例之外复现，外部验证应如何标准化？
