  related_work_outline:
  - 'Mainstream direction: Agentic AI systems are being built to automate literature
    synthesis, evidence-grounded reasoning, and research generation; current work
    centers on autonomous discovery agents rather than isolated retrieval or summarization
    tools.'
  - 'Shared research pattern: Systems combine retrieval, verification or self-critique,
    and generation; evaluation increasingly uses automated LLM judges, blind tasks,
    or domain-specific benchmarks with human baselines.'
  - 'Key differences: Papers differ in target—end-to-end manuscript generation, domain-specific
    discovery, general self-evolving frameworks—and in evidence design—blind evidence-maturity
    rubrics, real domain data, or broad benchmark suites.'
  - 'Trend evolution: The available top-paper evidence is concentrated in 2025-2026,
    so only a current-frontier trend is visible: from diagnostic benchmarks and case
    studies toward integrated self-evolving agent systems joining search, synthesis,
    verification, and generation.'
  - 'Open questions: Alignment of LLM judges with human review, robustness outside
    curated tasks, transfer across domains, and reproducibility gaps remain unresolved.'
  related_work_outline_zh:
  - 主流方向：智能体AI系统正被用于自动化科学文献综合、证据推理与研究生成；当前工作重心是自主发现智能体，而非孤立的检索或摘要工具。
  - 研究共性：系统组合检索、验证/自我批判与生成；评测越来越多使用自动LLM裁判、盲测任务或带人类基线的领域基准。
  - 关键差异：论文在目标上不同——端到端手稿生成、领域特定发现、通用自演化框架；在证据设计上不同——盲测证据成熟度、真实领域数据或广泛基准套件。
  - 趋势演进：现有重要论文证据集中在2025-2026年，只能看到当前前沿趋势：从诊断性基准和案例研究，走向连接检索、综合、验证与生成的集成自演化智能体系统。
  - 开放问题：LLM裁判与人类评审的一致性、策展任务之外的稳健性、跨领域迁移以及可复现性缺口仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Agentic literature synthesis and manuscript generation
      what_it_solves: Automates retrieval, synthesis, verification, and drafting of
        research papers from a minimal prompt.
      what_remains_open: Whether generated papers remain logically correct and original
        outside curated LLM-rubric evaluations.
    - line: Evidence-grounded evaluation of discovery agents
      what_it_solves: Makes open-ended agent claims comparable through blind tasks
        and automated evidence-maturity scoring.
      what_remains_open: Single-base-model results and proxy-rubric alignment with
        human scientific judgment.
    - line: Domain-specific scientific discovery benchmarking
      what_it_solves: Tests agent performance on real domain data with human baselines
        and published-study-derived discovery questions.
      what_remains_open: Whether domain-specific performance transfers to novel, open-ended
        literature and research questions.
    - line: Self-evolving agent infrastructure
      what_it_solves: Provides domain-agnostic loops for hypothesis refinement, self-critique,
        and knowledge accumulation.
      what_remains_open: External validation beyond reported benchmark gains and connection
        to literature review quality.
    - line: Survey-based challenge and taxonomy synthesis
      what_it_solves: Organizes progress, metrics, frameworks, datasets, and failure
        modes across agentic science.
      what_remains_open: Direct empirical validation that proposed categories predict
        reliable literature intelligence or discovery behavior.
    consensus:
    - Current agentic systems can execute and document analyses, but they plateau
      on tasks requiring controls, robustness, falsifiability, and scientific taste.
    - Automated evaluation, including LLM judges and human baselines, is now treated
      as necessary for comparing open-ended discovery agents.
    - Verification loops, retrieval, and self-critique are recurring design choices
      intended to reduce logical errors and missing knowledge.
    - Literature review automation and reliable reasoning over evidence remain unresolved
      bottlenecks.
    disagreements:
    - 'Evaluation target differs: evidence maturity of open-ended claims versus task
      success on domain-specific discovery questions versus broad benchmark performance.'
    - 'System boundary differs: end-to-end manuscript generation with human oversight
      versus domain-agnostic self-evolving frameworks versus benchmark-only studies.'
    - 'Evidence setting differs: real single-cell transcriptomic datasets with human
      baselines versus blind peer-reviewed tasks versus multiple general science benchmarks.'
    - 'Interaction mode differs: human-as-principal-investigator collaboration versus
      fully autonomous open-ended execution versus retrospective case analysis.'
    open_questions:
    - Do LLM-judge evidence-maturity scores align with human peer review across different
      base models?
    - Can current verification and self-critique loops maintain logical coherence
      outside curated tasks and narrow domains?
    - How can literature-to-discovery systems be evaluated for novelty, falsifiability,
      and cross-dataset generalization rather than documentation quality?
    - What missing code, dataset, metric, and limitation details most affect reproducibility
      of these agentic literature systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 智能体文献综合与手稿生成
      解决的问题: 从最小提示自动完成检索、综合、验证和论文初稿生成。
      尚未覆盖: 生成论文在策展LLM评分之外是否仍保持逻辑正确与原创性尚未证明。
    - 路线: 发现智能体的证据锚定评测
      解决的问题: 通过盲任务和自动化证据成熟度评分，使开放式智能体声明可比较。
      尚未覆盖: 结果仅基于单一基座模型，代理评分与人类科学判断的一致性仍未知。
    - 路线: 领域特定科学发现基准
      解决的问题: 用真实领域数据和人类基线测试智能体在注释与发现选择题上的表现。
      尚未覆盖: 领域特定表现能否迁移到新的开放式文献与研究问题尚未覆盖。
    - 路线: 自演化智能体基础设施
      解决的问题: 提供领域无关的假设优化、自我批判与知识积累循环。
      尚未覆盖: 除报告基准提升外，缺少与文献综述质量相关的外部验证。
    - 路线: 基于综述的挑战与分类综合
      解决的问题: 整理智能体科学中的进展、指标、框架、数据集与失败模式。
      尚未覆盖: 所提分类能否预测文献智能或发现行为的可靠性缺少直接实证。
    共识:
    - 当前智能体系统能够执行并记录分析，但在需要对照、稳健性、可证伪性与科学品味的任务上出现平台期。
    - 自动评测，包括LLM裁判与人类基线，被视为比较开放式发现智能体的必要条件。
    - 验证循环、检索与自我批判是反复出现的设计选择，旨在减少逻辑错误与知识遗漏。
    - 文献综述自动化与基于证据的可靠推理仍是未解决的瓶颈。
    分歧:
    - 评测目标不同：开放式声明的证据成熟度、领域发现选择题成功率、或广泛基准性能。
    - 系统边界不同：带人类监督的端到端手稿生成、领域无关自演化框架、或仅基准研究。
    - 证据设置不同：真实单细胞转录组数据配人类基线、盲测同行评审任务、或多个通用科学基准。
    - 交互模式不同：人类作为首席研究员协作、全自主开放式执行、或回顾式案例分析。
    开放问题:
    - LLM裁判的证据成熟度评分能否在不同基座模型上与人类同行评审保持一致？
    - 现有验证与自我批判循环能否在策展任务和狭窄领域之外保持逻辑一致性？
    - 文献到发现系统如何评测新颖性、可证伪性与跨数据集泛化，而不仅是文档质量？
    - 缺失的代码、数据集、指标与局限性细节在多大程度上影响这些智能体文献系统的可复现性？
