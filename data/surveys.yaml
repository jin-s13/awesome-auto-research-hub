  related_work_outline:
  - 'Mainstream direction: End-to-end autonomous research pipelines that integrate
    LLM-driven ideation, code generation, experiment execution, and manuscript drafting
    into a single agentic workflow.'
  - 'Shared research pattern: All systems decompose scientific discovery into modular
