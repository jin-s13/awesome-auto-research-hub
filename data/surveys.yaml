    研究路线矩阵:
    - 路线: 端到端自主科研智能体
      解决的问题: 将假设生成、代码执行、实验运行、可视化和论文写作整合为一个LLM驱动的循环，降低完整研究周期的时间和成本。
      尚未覆盖: 结果一致性与可靠性仍不确定；部分自主投稿仅少数通过同行评审，许多评估依赖系统自身评审循环或有限任务。
    - 路线: 带验证门控的领域化发现智能体
      解决的问题: 增加逻辑或物理感知检查，以发现无效推导或仿真中的静默失败，特别针对应用数学和计算流体力学。
      尚未覆盖: 门控仍会漏检静默失败，且尚未证明能在多个领域或实验设置中广泛迁移。
    - 路线: 面向发现的基准与环境
      解决的问题: 提供需要假设形成、实验设计、分析和结论的标准化任务，以区分科学发现与对已知结果的复现。
      尚未覆盖: 虚拟或盲测任务上的成功未必对应真实发现；现有证据限于特定基座模型和领域。
    - 路线: 自动评审与证据评分
      解决的问题: 用模型评委或审查器评估生成稿件和证据成熟度，减少完全依赖人工评审。
      尚未覆盖: 自动评分即使部分接近人工评审，也常暴露出缺少对照、稳健性、可证伪性和跨数据集泛化的问题。
    - 路线: 人机协作科研流程
      解决的问题: 将专家判断作为首席研究员或最终权威，而把推导、实现和写作交由智能体完成。
      尚未覆盖: 最终有效性和解释仍依赖人类专家；减少专家介入的证据多为定性，缺乏标准化。
    共识:
    - 基于LLM的智能体被用于覆盖完整科研循环：构思、实验或推导、分析、论文写作。
    - 自动验证或评估被视为扩展人类评审的必要手段，包括LLM评委、树搜索、物理门控或基准评分。
    - 当前系统能较熟练地执行分析并记录过程，但生成的主张常缺少对照、稳健性、可证伪性或跨数据集证据。
    分歧:
    - 验证策略不同：有的系统通过模拟同行评审优化会议接收，有的通过虚拟或盲测基准中的任务完成度来评价。
    - 领域范围不同：通用机器学习发现智能体处理以代码为主的实验，而领域化智能体依赖定理证明或物理仿真检查。
    - 人类交互不同：有的方法从最小提示出发追求全自主，有的方法要求人类首席研究员或专家在环检查。
    - 进步信号不同：有的把生成论文评分视为进展，有的把工作坊接收、发现结果修正或基准完成度作为主要信号。
    开放问题:
    - 自动评判和验证门控能否跨领域可靠捕获静默失败、逻辑错误和无效科学主张？
