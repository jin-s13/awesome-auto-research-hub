  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: Produces research ideas, experiments, and full paper drafts
        in a single LLM-driven workflow, reducing cost and manual effort.
      what_remains_open: Inconsistent success rates; evidence is often workshop-level;
        direct measurement of writing quality separate from experimental validity
        is limited.
    - line: Domain-specific verification and validity-gated writing
      what_it_solves: Checks physical or logical plausibility before claims are written,
        preventing silent failures in simulation-based or theory-heavy results.
      what_remains_open: Verification can still miss planted failures; generalization
        beyond a single domain or simulation stack is not established.
    - line: Failure diagnosis and self-correcting experimentation
      what_it_solves: Attributes failed runs to hypothesis, design, or implementation
        and routes interventions, raising the share of metric-bearing outputs.
      what_remains_open: Conference-ready writing remains unsolved; attribution evidence
        is benchmark-bounded and code or data artifacts may be scarce.
    - line: Human-AI collaboration and oversight
      what_it_solves: Balances autonomous execution with expert intervention at high-leverage
        decision points, improving benchmark outcomes over full autonomy.
      what_remains_open: Optimal intervention points are not standardized across domains;
        some papers report no limitations, making boundary assessment hard.
    - line: Automated review and evaluation infrastructure
      what_it_solves: Uses LLM or VLM reviewers, acceptance thresholds, and benchmark
        suites to compare generated papers and artifacts.
      what_remains_open: Proxy review scores are not yet validated against broader
        expert judgments of clarity, novelty, correctness, or communication utility.
    consensus:
    - Systems couple experimentation with manuscript drafting rather than treating
      writing as an isolated final step.
    - Some verification or reporting constraint is considered necessary before generated
      results are exposed as scientific claims.
    - Evaluation relies on automated or human review thresholds, benchmark completion,
      or domain metric improvement rather than on direct writing-ability tests alone.
    - Multi-agent decomposition and failure feedback are common mechanisms for improving
      pipeline reliability.
    disagreements:
    - 'Verification style differs: domain-specific visual or physics plausibility
      gates versus general grounded-reporting or verifiable-result constraints.'
    - 'Human involvement differs: full autonomy, stepwise oversight, and targeted
      high-leverage intervention produce different claims about the best operating
      mode.'
    - 'Evaluation target differs: peer or workshop acceptance, benchmark scores on
      ARC-Bench, blind review scores, and downstream domain error reduction are not
      interchangeable.'
    - Success criteria differ between generating a defensible claim, passing a review
      threshold, and improving a physical or task-specific metric.
    open_questions:
    - How well do LLM or VLM review scores predict expert evaluation of manuscript
      clarity and scientific soundness outside workshop settings?
    - Can domain-specific verification gates be transferred to new tasks without rebuilding
      the validity prior?
    - What direct evidence connects each system's writing module to clearer, more
      faithful research communication rather than only to acceptance or benchmark
      gains?
    - What are the missing limitation, dataset, and code details needed to reproduce
      or bound the reported claims?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究与论文生成
      解决的问题: 在单条LLM驱动流程中完成研究构思、实验和完整论文草稿，降低人工成本与工作量。
      尚未覆盖: 成功率不一致；证据多停留在工作坊级别；写作质量的直接测量仍与实验有效性混杂。
    - 路线: 领域特定验证与受控写作
      解决的问题: 在撰写主张前检查物理或逻辑合理性，防止仿真或理论结果中的静默失败。
      尚未覆盖: 验证门控仍会漏掉植入失败；跨领域和跨仿真栈的泛化能力未被充分验证。
    - 路线: 失败诊断与自纠正实验
      解决的问题: 将失败归因到假设、实验设计或实现，并将修正路由到相应层级，提高产生指标输出的比例。
      尚未覆盖: 可提交会议的论文写作仍难以稳定达成；归因证据受限于基准，代码或数据工件可能缺失。
    - 路线: 人机协作与监督
      解决的问题: 在自主执行和高杠杆决策点的人类干预之间取得平衡，提升相对全自主的基准表现。
      尚未覆盖: 最优干预时机尚未标准化；部分论文未给出局限说明，难以评估适用边界。
    - 路线: 自动评审与评测基础设施
      解决的问题: 使用LLM或VLM评审、接收阈值和基准套件比较生成论文与工件。
      尚未覆盖: 代理评审分数与专家对清晰性、新颖性、正确性和沟通效用的判断尚未充分对齐。
    共识:
    - 系统将实验执行与论文起草结合，而不是把写作视为最后一步。
    - 在将生成结果作为科学主张之前，普遍引入某种验证或报告约束。
    - 评估依赖自动或人工评审阈值、基准完成度或领域指标提升，而非单纯的写作能力测试。
    - 多智能体分解和失败反馈是提高流程可靠性的常见机制。
    分歧:
    - 验证方式不同：领域特定的视觉或物理合理性门控与通用的事实约束报告各有侧重。
    - 人机介入程度不同：全自主、逐步监督与精准高杠杆干预对最佳模式的判断不同。
    - 评测目标不同：工作坊接收、ARC-Bench基准分数、盲评分数和下游领域误差降低不能互换。
    - 对成功的定义不同：生成可辩护主张、通过评审阈值与改进物理或任务指标并不等同。
    开放问题:
    - LLM或VLM评审分数能否在工作坊之外预测专家对清晰性和科学可信度的判断？
    - 领域特定验证门控能否迁移到新任务而不重建有效性先验？
    - 有什么直接证据能表明写作模块改善了科学沟通，而不只是提升接收率或基准分数？
    - 多篇论文未披露的局限、数据集和代码细节如何影响对报告结论的复现与边界判断？
