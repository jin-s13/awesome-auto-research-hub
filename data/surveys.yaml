      尚未覆盖: 跨领域覆盖，以及任务成功与真实科学效用之间的一致性。
    - 路线: 证据成熟度与自动评审评估
      解决的问题: 在不依赖标准答案的情况下，对智能体主张是否具备对照、稳健性、可证伪性和可审计性进行评分。
      尚未覆盖: 跨基座模型的泛化性、评审稳健性，以及对风格或工件博弈的敏感性。
    - 路线: 领域特定有效性门控与验证
      解决的问题: 通过任务感知检查（如物理感知视觉-语言验证）检测生成分析或仿真中的静默失败。
      尚未覆盖: 漏检率，以及此类门控能否迁移到新领域或新任务。
    - 路线: 交互式多智能体研究基础设施
      解决的问题: 提供人工监督、角色定制、代码执行工具和实时监控，用于可检查的多智能体实验。
      尚未覆盖: 在有限的内部案例之外仍缺乏外部验证，可复现信号不完整。
    共识:
    - 自动化研究智能体已能生成看似合理的论文式输出并执行基本分析，但尚未展示完全可信的自主发现能力。
    - 评估正在转向隐藏目标结论的盲测或基于证据的设定，以防止简单复现。
    - 自动评审器或评论模型被用作可扩展的质量代理，但其区分效度仍需更多验证。
    - 代码、数据集和任务套件等可复现工件受到重视，但当前证据不完整。
    分歧:
