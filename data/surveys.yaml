    early autonomous scientists, while 2026 systems add reliability mechanisms such
    as cognition-authority separation, self-healing execution, and verifiable reporting.'
  - 'Open questions: How to guarantee factual accuracy, scale beyond tested cycle
    counts, transfer benchmark gains to real discovery utility, and standardize provenance,
    reproducibility, and weak-direction rejection.'
  related_work_outline_zh:
  - 主流方向：自主多智能体系统与智能体流水线，根据反馈循环生成假设、执行实验并迭代优化，同时越来越强调可验证证据和人机协作监督。
  - 研究共性：将科学发现分解为假设形成、实验或代码执行、评估和报告综合，并在长时间跨度内反复迭代。
  - 关键差异：交互模式从完全自主到精准人机协作；搜索策略从结构化树与进化选择到并行世界模型循环；评测领域涵盖生物学、预测、方程发现和优化。
  - 趋势演进：2025年主要综述智能体科学发现并出现早期AI科学家，2026年系统加入认知-权威分离、自愈执行和可验证报告等可靠性机制。
