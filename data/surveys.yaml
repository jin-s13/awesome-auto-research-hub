  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery pipelines
      what_it_solves: Close the loop from hypothesis generation through code execution,
        experiment management, visualization, and manuscript writing without human-coded
        templates.
      what_remains_open: Output is inconsistent under peer review; reported success
        is often workshop-level or rubric-level, not full conference-quality discovery,
        and limitations are frequently unspecified.
    - line: Domain-grounded verification and validity gates
      what_it_solves: Detect logical or physical silent failures before a claim is
        written by auditing reasoning or inspecting rendered domain artifacts.
      what_remains_open: Gates still miss planted failures and have only been shown
        in selected domains; transfer to new reasoning domains or simulators is not
        established.
    - line: Evidence-oriented discovery benchmarks
      what_it_solves: Turn scientific discovery into comparable tasks with automatic
        metrics for task completion, action relevance, explicable knowledge, or evidence
        maturity.
      what_remains_open: Current agents plateau near 60/100 and lack controls, robustness,
        falsifiability, and cross-dataset generalization; judge metrics are not calibrated
        to real discovery utility.
    - line: Collaborative multi-agent research workflows
      what_it_solves: Coordinate knowledge retrieval, derivation, experiment management,
        and manuscript drafting under either a human principal investigator or an
        experiment-manager agent.
      what_remains_open: Human–agent contribution boundaries remain unclear and evaluations
        rely on LLM rubrics or single-domain case studies rather than reproducible
        multi-domain evidence.
    consensus:
    - The discovery loop is commonly decomposed into ideation, experiment execution,
      analysis, paper writing, and automated review.
    - Automated evaluation or review is used as a scalable substitute for human assessment,
      but it still inherits LLM-judge limitations.
    - Current systems execute and document analyses competently, but they do not yet
      reliably produce trustworthy scientific claims with controls and robustness.
    - Verification or validity gates improve claim quality, yet published gate miss
      rates and benchmark plateaus show they remain partial.
    disagreements:
    - 'Evaluation target: simulated virtual tasks versus blind evidence-from-data
      tasks versus domain-specific solver discovery versus conference-style peer review.'
    - 'Verification mechanism: logical coherence auditing versus vision-language inspection
      of rendered flow fields versus a general automated reviewer without domain-specific
      validity gates.'
    - 'Deployment setting: fully autonomous generation versus human PI–agent collaboration;
      some systems output manuscripts, others stop at analysis actions.'
    - 'Domain and supervision: theory-driven applied mathematics, CFD physics, ML
      subfields, or multi-domain blind studies; supervision ranges from open-ended
      hypothesis search to frozen data from peer-reviewed studies.'
    - 'Accepted evidence of success: rubric score, task completion, RMSE improvement
      on a particular simulation, or peer-review acceptance, making cross-system comparison
      difficult.'
    open_questions:
    - Can agents move from competent analysis execution to producing controls, robustness
      checks, falsification, and cross-dataset generalization?
    - How do logic-based and physics-based verification gates transfer to unseen domains
      or solvers when they already miss planted failures?
    - Are LLM-judge scores or workshop peer-review acceptance calibrated to real scientific
      contribution and reproducibility?
    - How does discovery-agent performance generalize across base models when the
      benchmark evidence uses only one frozen base model?
    - What is the actual human expert contribution in PI–agent workflows and how should
      autonomy be measured?
    - Which missing baselines, datasets, limitations, or code signals in the evidence
      packet create verification gaps rather than confirmed weaknesses?
