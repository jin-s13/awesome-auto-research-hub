  related_work_outline_zh:
  - 主流方向：构建虚拟或盲审式证据基准和评分量规，评估科学发现智能体，尤其以编码智能体为主要对象。
  - 研究共性：智能体经历问题形成、假设、实验/分析、结论等多阶段循环，用自动指标或LLM裁判对输出评分。
  - 关键差异：评测对象涵盖模拟发现完成度、开放式声称的证据成熟度、资源受限机器学习实现、安全实验/工具执行。
  - 趋势演进：从2024年宽泛的虚拟发现任务，到2025-2026年更偏证据审计、可复现工具和安全性/具身机制。
  - 开放问题：代理指标能否预测真实新发现，LLM裁判如何用专家验证，以及结果是否跨基座模型和领域泛化。
  literature_review:
    line_of_work_matrix:
    - line: Virtual scientific discovery task simulation and benchmarking
      what_it_solves: Standardizes complete discovery cycles in a controllable environment
        with tasks across science topics and automatic completion metrics.
      what_remains_open: Whether simulated task completion transfers to real scientific
        discovery and generalizes beyond the fixed task set and topics.
    - line: Evidence-grounded evaluation for open-ended discovery claims
      what_it_solves: Blinds peer-reviewed source conclusions and scores agents on
        evidentiary maturity, auditability, and novelty via deterministic LLM-judge
        rubrics.
      what_remains_open: LLM-judge alignment with domain experts and generalization
        beyond a single frozen base model remain unproven.
    - line: Auditable research question formation
      what_it_solves: Forces agents to make assumptions, mechanisms, hypothesis, tests,
        and failure-update rules explicit in a structured certificate before research
        proceeds.
      what_remains_open: Evaluation is preliminary and relies on LLM judge agreement,
        without human expert validation or downstream discovery success.
    - line: Coding-agent infrastructure and resource-constrained benchmarks
      what_it_solves: Generates vetted domain code libraries and tests end-to-end
        ML implementation under single-GPU, no-internet, and time-budget constraints.
      what_remains_open: Domain coverage is narrow, external resource use is prohibited,
        and proxy LLM-as-judge agreement with experts is only moderate.
    - line: Safe, grounded execution and episodic experience evolution
      what_it_solves: Integrates safety checks, cumulative risk state, and reusable
        execution memory to improve wet-lab or tool-chain task completion while reducing
        unsafe actions.
      what_remains_open: Reported baselines and safety evaluation details are incomplete,
        and evidence for generalization beyond selected lab/ALFWorld tasks is limited.
    consensus:
    - Scientific discovery is operationalized as an iterative agentic loop from question
      or objective to hypothesis, experiment, analysis, and conclusion.
    - Current agents execute and document analyses better than they produce trustworthy
      scientific claims; they lack controls, robustness, falsifiability, and cross-dataset
      generalization.
    - Automated evaluation is necessary for scale, but proxy metrics and LLM judges
      are treated as uncertain relative to human domain experts.
    - Auditability, safety, reproducibility infrastructure, and evidence maturity
      are becoming first-class evaluation dimensions beyond raw task success.
    disagreements:
    - 'Evaluation target differs: complete discovery in simulated environments versus
      evidence maturity of blind open-ended claims versus implementation quality under
      compute constraints versus physical lab task success.'
    - 'Interaction and deployment setting differs: text-based simulated tasks, coding-only
      training scripts with no internet, robotic wet-lab execution, and multi-stage
      tool-chain safety monitoring.'
    - 'Supervision and judging differ: automatic task-completion metrics, rubric-based
      LLM judges, domain expert comparisons, and safety-gate intercepts are not interchangeable.'
    - 'Representational strategy differs: unstructured agent trajectories, structured
      research-question certificates, episodic reusable memory, and cumulative joint
      task-safety risk state each encode different aspects of discovery.'
    open_questions:
    - Do gains on simulated task completion or evidence-maturity scores translate
      to novel, externally valid scientific discoveries?
    - How can LLM judges be calibrated or supplemented by domain experts when current
      agreement is only moderate?
    - Are current findings robust across different base models, scientific domains,
      and resource or deployment settings?
    - What safety evidence, failure cases, and baseline specifications are needed
      to validate grounded lab and tool-chain agents?
    - Which missing code, data, metric, and limitation details currently block reproducible
      external validation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 虚拟科学发现任务模拟与基准
      解决的问题: 在可控环境中把完整发现循环标准化，并提供跨科学主题的自动完成度指标。
      尚未覆盖: 模拟任务完成是否迁移到真实科学发现，以及能否泛化到固定任务和主题之外。
    - 路线: 面向开放式发现主张的证据基准评测
      解决的问题: 隐藏同行评审来源结论，通过确定性LLM裁判量规对证据成熟度、可审计性和新颖性评分。
      尚未覆盖: LLM裁判与领域专家的一致性，以及跨单一冻结基座模型的泛化能力。
    - 路线: 可审计研究问题形成
      解决的问题: 在研究推进前让智能体显式记录假设、机制、可证伪假设、测试和失败更新规则。
      尚未覆盖: 评测仍属初步，依赖LLM裁判一致性，缺少人类专家验证和下游发现成功证据。
    - 路线: 编码智能体基础设施与资源受限基准
      解决的问题: 生成经检验的领域代码库，并在单GPU、无互联网和时间预算条件下测试端到端机器学习实现。
      尚未覆盖: 领域覆盖较窄，禁用外部资源，且LLM-as-judge与专家一致性仅中等。
    - 路线: 安全、具身执行与情景经验演化
      解决的问题: 整合安全检查、累积风险状态和可复用执行记忆，以提高湿实验室或工具链任务完成并减少不安全动作。
      尚未覆盖: 基线设置与安全评测细节不完整，所选实验室/ALFWorld任务之外泛化证据有限。
    共识:
    - 科学发现被操作化为从问题或目标到假设、实验、分析和结论的迭代智能体循环。
    - 当前智能体执行和记录分析的能力强于提出可信科学主张的能力，普遍缺少对照、稳健性、可证伪性和跨数据集泛化。
    - 自动评测对规模扩展必要，但代理指标和LLM裁判相对人类领域专家仍被视为不确定。
    - 可审计性、安全性、可复现基础设施和证据成熟度正在成为原始任务成功率之外的一级评测维度。
    分歧:
    - 评测目标不同：模拟环境中的完整发现、盲审开放式声称的证据成熟度、资源受限实现质量、物理实验任务成功。
    - 交互与部署设置不同：文本模拟任务、无网络的编码脚本、机器人湿实验执行、多阶段工具链安全监控。
    - 监督与评判方式不同：自动完成度指标、量规式LLM裁判、领域专家对比、安全门拦截不能互相替代。
    - 表示策略不同：非结构化智能体轨迹、结构化研究问题证书、情景化可复用记忆、联合任务-安全累积风险状态编码了不同方面。
    开放问题:
    - 模拟任务完成度或证据成熟度分数的提升，能否转化为真实、具有外部效度的科学发现？
    - 在LLM裁判与专家仅中等一致的情况下，如何校准或补充领域专家判断？
    - 当前发现在不同基座模型、科学领域和资源/部署条件下是否稳健？
    - 需要哪些安全证据、失败案例和基线规格，来验证具身实验室与工具链智能体？
    - 哪些缺失的代码、数据、指标和局限性细节正在阻碍可复现的外部验证？
