    - 路线: 端到端自主研究流水线
      解决的问题: 把想法生成、代码实现、实验执行、结果分析、论文撰写和模拟或自动评审整合到同一个研究闭环中。
      尚未覆盖: 生成论文和实验的一致性与严谨性在不同领域仍不确定，目前主要在有限工作坊、内部或自动评审场景中得到验证。
    - 路线: 面向发现智能体的模拟环境评估
      解决的问题: 用可重复的任务套件和自动指标评估完整的假设、设计、实验、结论循环，包括任务完成度和可解释发现知识。
      尚未覆盖: 任务完成度和解释性知识等指标是否能预测真实科学、代码或实验室决策效用仍不清楚。
    - 路线: 失败感知记忆与迭代反馈机制
      解决的问题: 把失败实验或评审反馈转化为可复用的负知识，以改善同任务重试和跨任务迁移。
      尚未覆盖: 跨更广研究领域和任务类型的迁移证据不足；有界类型化失败记录和策展代理的假设尚未规模化验证。
    - 路线: 交互式多智能体实验平台
      解决的问题: 支持可定制研究角色、实时监控、工件检查、回滚恢复和代码工具接入，形成人在环研究流程。
      尚未覆盖: 仅在少量内部案例中验证，外部验证和平台成熟度仍然有限。
    - 路线: 实验设计与消融规划评测
      解决的问题: 评估智能体是否能提出和识别实证研究所需的消融控制条件或缺失的实验控制。
      尚未覆盖: 当前系统在消融识别上仍低于人类召回水平，作者与评审视角的 grounding 差异尚未解决。
    共识:
    - 该主题把实验自动化视为从假设或任务设置到执行、分析、报告的研究闭环，而不是孤立的代码生成。
    - LLM自动评审或模拟评审常被作为评测信号，但其与人类判断和真实决策效用的对齐证据仍然有限。
    - 多智能体角色拆分和显式反馈或记忆机制比单次生成更能改善研究型智能体工作流。
    - 当前前沿证据集中在代码或模拟实验，物理实验自动化在本证据包中尚未体现。
    分歧:
    - 评测目标不同：完整论文级发现对比单一实验设计子任务，如消融规划。
    - 部署场景不同：模拟文本发现环境、本地代码工具与仪表板、直接工作坊投稿评审。
    - 交互与记忆机制不同：端到端树搜索、人在环仪表板控制、共享失败记忆分别强调不同的控制点和反馈方式。
    - 性能证据不同：有的系统报告接近人类评审分数或通过工作坊论文，有的系统报告实验规划召回低于人类。
    开放问题:
    - LLM评审分数和模拟评测指标是否能在已经展示的领域之外对齐人类同行评审和真实实验效用？
    - 当只有部分生成结果通过同行评审或消融召回低于人类时，如何保证生成论文和实验设计的一致严谨性？
    - 本证据包中若干工作的公共代码、数据集、局限性和外部验证证据不完整，这一验证缺口如何缩小？
