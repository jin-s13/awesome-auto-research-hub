  related_work_outline_zh:
  - 主流方向：面向文献综合与科学发现的自主智能体系统，整合检索、验证、论文生成与评测。
  - 研究共性：多智能体或流水线协同，结合知识检索、内部验证、自我批评和LLM评审评分。
  - 关键差异：生成导向、评测导向与自演化框架并存；监督模式、领域任务和证据标准不同。
  - 趋势演进：证据集中在2025-2026年，从综述分类走向证据锚定基准、失败分析和可扩展框架，属于当前前沿内部演变。
  - 开放问题：来源可靠性、评分与人类判断一致性、跨基座与跨领域泛化、可复现性仍未被证明。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous research writing and literature synthesis agents
      what_it_solves: Integrating retrieval, verification, reasoning, and manuscript
        generation to reduce human effort in survey- or theory-oriented papers.
      what_remains_open: Source grounding, falsifiable claims, and direct evidence
        of literature search quality; available reports lack limitation and reproducibility
        details.
    - line: Evidence-grounded evaluation design for discovery and review claims
      what_it_solves: Makes agent-generated scientific or literature claims comparable
        through blinded tasks, evidence-maturity rubrics, and human baselines.
      what_remains_open: Evidence is based on a single frozen base model; LLM-judge
        alignment with expert review is unknown; blind tasks do not directly target
        literature retrieval.
    - line: Self-evolving and foundational agent frameworks
      what_it_solves: Provides domain-agnostic infrastructure for iterative hypothesis
        refinement, self-critique, and knowledge accumulation at scale.
      what_remains_open: Benchmark gains are not tied to literature review utility;
        external validation across domains, hardware, and user settings is missing.
    - line: Failure analysis and design principles for autonomous research workflows
      what_it_solves: Documents recurrent failure modes and design constraints for
        long-horizon autonomous scientific or literature workflows.
      what_remains_open: Evidence comes from a single pipeline case; design principles
        are not yet validated across broader settings.
    consensus:
    - Current systems can execute and document analyses competently, but do not yet
      achieve fully autonomous reliable scientific or literature discovery.
    - Multi-agent orchestration with retrieval, internal verification, and LLM-based
      rubric scoring is a shared pattern.
    - Evidence auditability and novelty are comparatively achievable, while controls,
      robustness, falsifiability, and cross-dataset generalization remain weak.
    - Human baselines and expert review remain important for calibrating system claims.
    disagreements:
    - Some work targets end-to-end paper generation from minimal prompts, while other
      work measures evidentiary maturity rather than generation quality.
    - Evaluation targets differ across theory-driven mathematics papers, omics data
      discovery, general frontier-science benchmarks, and machine-learning research
      pipelines.
    - 'Human-AI collaboration assumptions differ: human principal investigator plus
      agent, largely autonomous pipelines with minimal intervention, or fixed coding
      agents on a frozen base model.'
    - Agent organization differs among knowledge-based domain-specific multi-agent
      systems, domain-agnostic self-evolving frameworks, and fixed coding agents.
    open_questions:
    - Can automated literature synthesis preserve source traceability and distinguish
      supported claims from plausible but unsupported text?
    - Do LLM-based review rubrics align with human expert judgment across domains?
    - Does self-evolution improve real literature discovery or mainly raise benchmark
      scores?
    - How do systems generalize beyond one frozen base model and specific scientific
      domains?
    - How much do missing code, dataset, baseline, and limitation details limit verification
      of the reported results?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主科研写作与文献综合智能体
      解决的问题: 将检索、验证、推理和手稿生成整合，减少综述或理论导向论文中的人工干预。
      尚未覆盖: 来源依据、可证伪声明和文献检索质量；现有报告缺少局限性与可复现细节。
    - 路线: 面向发现与综述声明的证据锚定评测设计
      解决的问题: 通过盲任务、证据成熟度评分和人类基线，使智能体产出的科学或文献声明可比较。
      尚未覆盖: 证据仅基于单一冻结基座模型；LLM评判与专家评审一致性未知；盲任务未直接覆盖文献检索。
    - 路线: 自演化与基础智能体框架
      解决的问题: 提供领域无关基础设施，支持迭代假设优化、自我批评和知识积累。
      尚未覆盖: 基准提升是否转化为文献综述效用未知；跨领域、硬件和用户设置的外部验证缺失。
    - 路线: 自主研究工作流的失败分析与设计原则
      解决的问题: 记录长周期自主科研或文献工作中反复出现的失败模式，并提出系统设计原则。
      尚未覆盖: 证据来自单一流水线案例；设计原则尚未在更广泛设置中验证。
    共识:
    - 当前系统能胜任执行和记录分析，但尚未实现完全自主且可靠的科研或文献发现。
    - 多智能体编排与检索、内部验证和LLM评分是共享模式。
    - 证据可审计性和新颖性相对可达成，但对照、稳健性、可证伪性和跨数据集泛化仍然薄弱。
    - 人类基线和专家评审仍是校准系统声明的重要手段。
    分歧:
    - 有研究以最小提示生成完整论文为目标，另一些研究则更关注评估证据成熟度而非生成质量。
    - 评测对象不同：理论驱动的数学论文、组学数据发现、通用前沿科学基准和机器学习研究流水线。
    - 人机协作假设不同：人类PI与智能体协作、几乎无人工干预的自主流水线、或冻结基座模型上的编码智能体。
    - 智能体组织方式不同：基于知识的领域多智能体、领域无关自演化框架、固定编码智能体。
    开放问题:
    - 自动化文献综合能否保持来源可追溯，并区分有依据声明与看似合理但无证据支持的文本？
    - 基于LLM的评审量规是否与跨领域人类专家判断一致？
    - 自演化机制是否能改善真实文献发现，而不只是提升基准分数？
    - 在单一冻结基座模型和特定科学领域之外，系统泛化性如何？
    - 缺失的代码、数据集、基线和局限性说明在多大程度上限制了对结果的验证？
