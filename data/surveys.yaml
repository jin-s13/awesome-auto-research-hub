  related_work_outline:
  - 'Mainstream direction: Evaluating autonomous research agents through long-horizon,
    closed-loop benchmarks that measure downstream task success, transfer, and feedback
    efficiency across scientific and ML domains.'
  - 'Shared research pattern: Agents generate proposals or evidence-collection steps;
    feedback from surrogate, high-fidelity, or benchmark signals is used to update
    search, skills, or state, with results captured as held-out or benchmark metrics.'
  - 'Key differences: Target tasks and domains differ—materials endpoints, ML engineering,
    deep research QA/survey, and academic rebuttal; supervision ranges from dense
    surrogate feedback to sparse high-fidelity oracles and held-out validation; agent
    designs may use distilled skills, recursive self-improvement, or frozen holdout
    search.'
  - 'Trend evolution: Within the provided 2024–2026 span, the frontier is moving from
    isolated leaderboard scores toward reusable operational skills, decision-relevant
    feedback cost, and held-out transfer to expose overfitting.'
  - 'Open questions: Whether proxy metrics align with real research utility, whether
    skills and architectures transfer across domains, and how to validate reproducibility
    when code, data, or limitation details are missing.'
  related_work_outline_zh:
  - 主流方向：通过长时程闭环基准评估自主研究智能体，衡量其在下游任务成功、迁移和反馈效率上的表现，涵盖科学与 ML 领域。
  - 研究共性：智能体提出提案或证据收集步骤；代理、高保真或基准反馈被用于更新搜索、技能或状态，结果以留出或基准指标呈现。
  - 关键差异：目标任务与领域不同，包括材料端点、ML 工程、深度研究问答/综述和学术 rebuttal；监督信号从稠密代理反馈到稀疏高保真 oracle 与留出验证不等；智能体设计可能使用蒸馏技能、递归自改进或冻结留出搜索。
  - 趋势演进：在所提供的 2024–2026 区间内，前沿正从单一榜单分数走向可复用操作技能、决策相关反馈成本和留出迁移，以暴露过拟合。
  - 开放问题：代理指标是否与真实研究效用一致，技能与架构能否跨领域迁移，以及代码、数据或局限说明缺失时如何验证可复现性。
  literature_review:
    line_of_work_matrix:
    - line: Closed-loop decision and feedback efficiency
      what_it_solves: Connects agent search to interventions, policies, and closed-loop
        decision quality under limited high-fidelity feedback.
      what_remains_open: How much improvement comes from the agent or search policy
        rather than the surrogate, acquisition rule, or task-specific prior.
    - line: Evaluation and evidence design
      what_it_solves: Makes research-agent claims comparable through held-out transfer,
        benchmark tasks, baselines, metrics, and decision-cost measures.
      what_remains_open: Coverage across diverse tasks and agreement between proxy
        metrics and real-world research utility.
    - line: Systems and reusable infrastructure
      what_it_solves: Turns isolated agent capabilities into reusable skills, compressed
        context, and runnable ML research workflows.
      what_remains_open: Standardized external validation across hardware, datasets,
        user settings, and missing reproducibility artifacts.
    - line: Autonomous research workflow architecture
      what_it_solves: Organizes recursive self-improvement, evidence gathering, and
        constraint-wise verification into long-horizon research loops.
      what_remains_open: Whether the architecture remains robust when selected decisions
        fail on unseen data and when feedback is sparse or noisy.
    consensus:
    - Multiple works evaluate agents by downstream success rather than final answer
      accuracy, using held-out improvement, oracle query count, and benchmark score
      metrics.
    - 'Closed-loop search and feedback reuse are common: agents propose, evaluate,
      and update based on surrogate, high-fidelity, or benchmark signals.'
    - Reusable operational knowledge or state compression is treated as important
      for improving long-horizon agent performance.
    disagreements:
    - 'Evaluation domains differ: materials discovery endpoints, ML engineering tasks,
      deep research QA/survey, and academic rebuttal workflows provide non-interchangeable
      evidence.'
    - 'Supervision differs: dense surrogate feedback, sparse high-fidelity oracle
      repair, held-out internal folds, and final benchmark labels emphasize different
      failure modes.'
    - 'Agent designs differ: some augment a fixed agent with distilled skills, others
      use recursive self-improvement, and others search over modeling changes with
      frozen holdout validation.'
    - 'Reported evidence is uneven: some works give quantitative method details and
      limitations, while others lack visible analysis or limitation statements, making
      comparison partial.'
    open_questions:
    - 'Which evaluation signals best predict transfer to unseen scientific or engineering
      tasks: benchmark scores, held-out improvements, regret, or oracle query cost?'
    - How robust are selected agent interventions when one of the selected changes
      does not remain best on held-out data?
    - Do distilled skills and context-update mechanisms transfer across domains and
      model backbones without per-task redesign?
    - What is the impact of missing code, datasets, and limitation reporting on the
      reproducibility and comparability of research-agent evaluations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 闭环决策与反馈效率
      解决的问题: 在有限高保真反馈下，将智能体搜索连接到干预、策略和闭环决策质量。
      尚未覆盖: 性能提升有多少来自智能体或搜索策略，而不是代理模型、采集规则或任务先验。
    - 路线: 评测与证据设计
      解决的问题: 通过留出迁移、基准任务、基线、指标和决策成本度量，使研究智能体的主张具有可比性。
      尚未覆盖: 跨领域任务覆盖不足，代理指标与真实研究效用之间的一致性仍不明确。
    - 路线: 系统与可复用基础设施
      解决的问题: 将孤立智能体能力转化为可复用技能、压缩上下文和可运行的 ML 研究工作流。
      尚未覆盖: 跨硬件、数据集、用户设置以及缺失复现工件时的标准化外部验证不足。
    - 路线: 自主研究工作流架构
      解决的问题: 把递归自改进、证据收集和约束验证组织为长时程研究循环。
      尚未覆盖: 当所选决策在未见数据上失败或反馈稀疏/有噪声时，架构是否仍鲁棒尚不清楚。
    共识:
    - 多项工作以下游成功作为评测目标，而非只看最终答案准确率，常用留出改进、oracle 查询数和基准分数等指标。
    - 闭环搜索与反馈复用在多条路线中反复出现：智能体提出、评估并基于代理、高保真或基准信号进行更新。
    - 可复用操作知识或状态压缩被视为提升长时程任务表现的重要因素。
    分歧:
    - 评测领域不同：材料发现端点、ML 工程任务、深度研究问答/综述和学术 rebuttal 工作流提供了不可互换的证据。
    - 监督信号不同：稠密代理反馈、稀疏高保真 oracle 修复、留出内部折和最终基准标签强调不同的失败模式。
    - 智能体设计不同：有的通过蒸馏技能增强固定智能体，有的使用递归自改进，有的在冻结留出验证下搜索建模改动。
    - 证据报告不平衡：部分工作给出了定量方法细节与局限，另一些缺少可见分析或局限说明，使比较不完整。
    开放问题:
    - 哪类评测信号（基准分数、留出改进、regret 或 oracle 查询成本）最能预测智能体在未见科学/工程任务上的迁移能力？
    - 当所选干预中有一项未能在留出数据上保持最优时，智能体选择的鲁棒性如何？
    - 蒸馏技能和上下文更新机制能否跨领域和模型主干迁移，而无需逐任务重新设计？
    - 代码、数据集与局限报告缺失会对研究智能体评测的可复现性和可比性产生什么影响？
