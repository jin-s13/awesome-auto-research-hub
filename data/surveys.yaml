      what_remains_open: Proxy metrics and simulated tasks may not align with real
        research utility; strong baseline agents still struggle, and task coverage
        is limited.
    - line: Human-AI collaborative research orchestration
      what_it_solves: Balances full autonomy with targeted intervention modes, verifiable
        reporting, and self-healing execution.
      what_remains_open: Optimal intervention points are shown only on one experiment-stage
        benchmark; cross-domain and longitudinal evidence is absent.
