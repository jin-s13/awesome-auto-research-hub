  related_work_outline:
  - 'Mainstream direction: Building autonomous multi-agent systems that automate the
    full scientific research pipeline, from literature synthesis and hypothesis generation
    through experimental execution to paper drafting, with a strong emphasis on verification
    and self-improvement loops.'
  - 'Shared research pattern: Decomposing the scientific workflow into specialized
    LLM-based agents that take on roles such as ideation, literature retrieval, execution,
    critique, and writing, and then orchestrating them through structured workflows,
    iterative refinement, or evolutionary search.'
  - 'Key differences: Some systems focus on end-to-end paper generation within a specific
    domain (e.g., applied mathematics, survey writing), while others target domain-agnostic
    agent frameworks for scalable scientific discovery. Another divide is between
    systems that emphasize internal logical verification and those that rely on external
    benchmarks or human baselines for evaluation.'
  - 'Trend evolution: Within the 2023–2026 window, the field is moving from conceptual
    surveys and single-task benchmarks toward integrated, self-evolving agent frameworks
    that claim state-of-the-art performance across diverse scientific reasoning and
    discovery benchmarks, though deep domain-specific validation remains nascent.'
  - 'Open questions: Can these systems move beyond mimicking known research patterns
    to producing genuinely novel, impactful scientific insights? What is the gap between
    proxy metrics like rubric scores or benchmark accuracy and actual scientific contribution?
    How do we ensure reliability and reproducibility when agents operate over long,
    multi-step research trajectories?'
  related_work_outline_zh:
  - 主流方向：构建自主多智能体系统，自动化从文献综合、假设生成到实验执行和论文撰写的完整科研流程，并强调验证和自我改进循环。
  - 研究共性：将科学工作流分解为扮演构思、文献检索、执行、批判和写作等不同角色的专门化LLM智能体，并通过结构化工作流、迭代优化或进化搜索进行编排。
  - 关键差异：部分系统聚焦于特定领域（如应用数学、综述撰写）的端到端论文生成，而其他系统则追求领域无关、可扩展的智能体框架。另一分歧在于，一些系统强调内部逻辑验证，而另一些则依赖外部基准或人类基线进行评估。
  - 趋势演进：在2023至2026年窗口内，领域正从概念性综述和单一任务基准，转向声称在多样化科学推理和发现基准上达到最先进性能的一体化、自演化智能体框架，但深入的领域特定验证仍处于早期阶段。
  - 开放问题：这些系统能否超越模仿已知研究模式，产生真正新颖且有影响力的科学洞见？评分准则分数或基准准确率等代理指标与真实科学贡献之间的差距有多大？当智能体在长周期、多步骤的研究轨迹中运行时，如何确保其可靠性和可复现性？
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents for specific domains
      what_it_solves: Automating the complete scientific discovery pipeline—literature
        synthesis, hypothesis generation, theoretical derivation, experimentation,
        and manuscript writing—within a constrained domain such as applied mathematics
        or survey generation.
      what_remains_open: Evaluation is largely based on LLM-judged rubrics and lacks
        independent human expert validation of the generated scientific claims; the
        systems have not demonstrated the ability to produce novel, impactful discoveries
        beyond the patterns present in their training data.
    - line: Domain-agnostic self-evolving agent frameworks for scientific discovery
      what_it_solves: Providing a generalizable architecture that allows researchers
        to build self-improving scientific agents across disciplines by continuously
        refining hypotheses, accumulating knowledge, and adapting through execution
        feedback.
      what_remains_open: Current evidence is limited to performance on existing reasoning
        and ML benchmarks, leaving unclear whether the framework genuinely accelerates
        novel scientific insight or merely optimizes for known benchmark tasks.
    - line: Benchmarking and failure analysis of AI scientists
      what_it_solves: Establishing measurement protocols to compare AI research agents
        against human experts and to systematically document failure modes such as
        implementation drift, memory degradation, and weak scientific taste.
      what_remains_open: The benchmarks capture only a narrow slice of scientific
        practice (e.g., multiple-choice questions from published studies, single-attempt
        paper generation), and the human baselines are often limited to graduate students,
        leaving the gap to expert scientists unmeasured.
    consensus:
    - Decomposing the scientific workflow into specialized LLM-based agents is a viable
      and productive approach to automating parts of research.
    - Iterative refinement, whether through internal verification, evolutionary search,
      or rubric-guided critique, is essential for improving the quality of generated
      research outputs.
    - Current AI systems are not yet capable of fully autonomous, reliable scientific
      discovery and require careful human oversight or collaboration.
    disagreements:
    - 'The primary evaluation mechanism varies: some rely on LLM-based rubrics to
      score generated papers, while others use established benchmark task performance
      or human baseline comparisons, leading to tension between perceived quality
      and measured capability.'
    - 'The level of domain specificity differs: one line embeds domain knowledge into
      a multi-agent system for a single field, whereas another advocates for a minimal,
      general-purpose framework that can be instantiated for any field with minimal
      code, reflecting different assumptions about transferability.'
    - 'The role of memory and evolution over long research trajectories is contested:
      some frameworks incorporate explicit self-evolution and knowledge accumulation,
      while others reset agents for each experiment, treating each research cycle
      as independent.'
    open_questions:
    - To what extent do rubric-based or LLM-judged evaluations of generated papers
      correlate with genuine scientific novelty, correctness, and impact as assessed
      by human domain experts?
    - Can self-evolving agent frameworks avoid performance collapse or drift when
      operating over extended research campaigns spanning weeks or months, given documented
      failure modes in long-horizon tasks?
    - How can the research community establish standardized, multi-dimensional benchmarks
      that capture the full scientific process, including hypothesis novelty, experimental
      rigor, and reproducibility, beyond current narrow task performance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向特定领域的端到端自主研究智能体
      解决的问题: 在受限领域（如应用数学或综述生成）内自动化完整的科学发现流程，包括文献综合、假设生成、理论推导、实验和手稿撰写。
      尚未覆盖: 评估主要依赖LLM判定的评分准则，缺乏独立的人类专家对生成科学主张的验证；系统尚未证明能产生超越训练数据中已有模式的、新颖且有影响力的发现。
    - 路线: 面向科学发现的领域无关自演化智能体框架
      解决的问题: 提供一种可泛化的架构，使研究人员能够通过持续优化假设、积累知识和根据执行反馈进行适应，来构建跨学科的自改进科学智能体。
      尚未覆盖: 现有证据仅限于在现有推理和机器学习基准上的性能，尚不清楚该框架是否真正加速了新颖的科学洞见，还是仅针对已知基准任务进行了优化。
    - 路线: AI科学家的基准测试与失败分析
      解决的问题: 建立测量协议，用于比较AI研究智能体与人类专家，并系统地记录如实现漂移、记忆退化和科学品味薄弱等失败模式。
      尚未覆盖: 基准仅捕捉了科学实践的一小部分（如已发表研究的选择题、单次论文生成尝试），且人类基线往往局限于研究生，与专家科学家之间的差距尚未被测量。
    共识:
    - 将科学工作流分解为专门的LLM智能体是自动化部分研究工作的可行且富有成效的方法。
    - 无论是通过内部验证、进化搜索还是评分准则引导的批判，迭代优化对于提高生成研究成果的质量至关重要。
    - 当前AI系统尚无法进行完全自主、可靠的科学发现，需要谨慎的人类监督或协作。
    分歧:
    - 主要评估机制不同：一些依赖LLM评分准则对生成论文打分，另一些使用已建立的基准任务性能或人类基线比较，导致感知质量与测量能力之间存在张力。
    - 领域特异性程度不同：一条路线将领域知识嵌入到面向单一领域的多智能体系统中，而另一条则倡导一种通用的、最小化的框架，可用极少代码为任何领域实例化，反映了对可迁移性的不同假设。
    - 记忆与演化在长程研究轨迹中的作用存在争议：一些框架融入了显式的自演化和知识积累，而其他框架则在每个实验时重置智能体，将每个研究周期视为独立过程。
    开放问题:
    - 基于评分准则或LLM判定的生成论文评估，在多大程度上与人类领域专家评估的真实科学新颖性、正确性和影响力相关？
    - 鉴于在长程任务中已记录的失败模式，自演化智能体框架在跨越数周或数月的扩展研究活动中，能否避免性能崩溃或漂移？
    - 研究社区如何建立标准化的、多维度的基准，以捕捉完整的科学过程，包括假设新颖性、实验严谨性和可复现性，而不仅仅是当前狭隘的任务性能？
