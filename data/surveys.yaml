  literature_review:
    line_of_work_matrix:
    - line: Evaluation and evidence design
      what_it_solves: Provides benchmarks (e.g., DISCOVERYWORLD, BAISBench) and metrics
        (task completion, multiple-choice questions) to make AI scientist capabilities
        comparable and to identify failure modes.
      what_remains_open: Whether these benchmarks cover the full complexity of real
        scientific discovery and whether proxy metrics correlate with true novelty
        or downstream scientific utility.
    - line: Systems and reproducible infrastructure
      what_it_solves: Turns the concept of autonomous research into runnable stacks
        (AI Scientist v1/v2, Claw AI Lab, AI CFD Scientist) with code release, artifact
        generation, and verification gates, enabling repeatable demonstrations.
      what_remains_open: Standardized external validation across unseen domains, hardware,
        and datasets; current systems show inconsistent performance (e.g., only 1
        of 3 papers passed peer review) and lack rigorous reproducibility outside
        their original settings.
    - line: Conceptual taxonomy and theory
      what_it_solves: Organizes failure modes (e.g., implementation drift, memory
        degradation, overexcitement) and design principles from case studies, providing
        a vocabulary for debugging and improving AI research systems.
      what_remains_open: Direct empirical validation that these taxonomies predict
        performance or guide systematic improvements; the failure modes are documented
        but not yet formalized into preventive tools.
    consensus:
    - LLM-based agents can generate plausible research ideas, run experiments, and
      produce manuscript drafts, but current systems are not fully autonomous scientists.
    - Verification mechanisms (vision-language gates, execution feedback) are necessary
      to reduce silent failures and improve the credibility of generated results.
    - Evaluation must combine automated metrics with human or expert judgment, as
      automated reviewers alone may miss subtle validity issues.
    - Domain-specific knowledge and constraints (e.g., physics laws, biological context)
      are critical for producing meaningful discoveries, and generic systems struggle
      without them.
    disagreements:
    - 'Evaluation strategy: some rely on simulated peer review (AI Scientist v1, CLAW),
      others target real conference acceptance (AI Scientist-v2), and others use predefined
      benchmarks with human baselines (BAISBench, DISCOVERYWORLD).'
    - 'System architecture: single-agent pipelines vs. multi-agent teams (Claw AI
      Lab) vs. tree search (AI Scientist-v2) vs. self-correcting with attribution
      (SAGE).'
    - 'Scope of autonomy: general-purpose ML research vs. domain-specific discovery
      (CFD, single-cell biology), leading to different assumptions about required
      background knowledge and toolchains.'
    - 'Failure handling: simple reflection-based correction vs. structured multi-hypothesis
      failure attribution; the depth of diagnostic reasoning varies.'
    open_questions:
    - How can we verify that an auto-generated scientific claim is not merely plausible
      but empirically sound and novel, especially when the system can hallucinate
      results?
    - What benchmarks or protocols can assess the long-term scientific impact of AI-generated
      discoveries, rather than short-term task completion?
    - How can these systems be made robust to domain shift, preventing catastrophic
      failures when applied outside their training or demonstration domains?
    - To what extent do current verification gates (e.g., visual inspection of flow
      fields) generalize to less visually interpretable scientific domains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 评测与证据设计
      解决的问题: 通过基准（如 DISCOVERYWORLD、BAISBench）和指标（任务完成度、选择题）使 AI 科学家能力可比较，并识别失败模式。
      尚未覆盖: 这些基准是否覆盖真实科学发现的全部复杂性，以及代理指标是否与真正的新颖性或下游科学效用相关。
    - 路线: 系统与可复现基础设施
      解决的问题: 将自主研究概念转化为可运行堆栈（AI Scientist v1/v2、Claw AI Lab、AI CFD Scientist），提供代码发布、工件生成和验证门控，实现可重复的演示。
      尚未覆盖: 跨未知领域、硬件和数据集的标准化外部验证；当前系统性能不一致（例如，仅 1/3 论文通过同行评审），且缺乏原始设置之外的严格可复现性。
    - 路线: 概念分类与理论
      解决的问题: 从案例研究中组织失败模式（如实现漂移、记忆退化、过度兴奋）和设计原则，为调试和改进 AI 研究系统提供词汇。
      尚未覆盖: 直接实证验证这些分类是否能预测性能或指导系统改进；失败模式已被记录，但尚未形式化为预防工具。
    共识:
    - 基于 LLM 的智能体可以生成看似合理的研究想法、运行实验并产出论文草稿，但当前系统尚非完全自主的科学家。
    - 验证机制（视觉-语言门控、执行反馈）对于减少静默失败和提高生成结果的可信度是必要的。
    - 评估必须结合自动指标与人类或专家判断，因为仅靠自动评审可能会遗漏微妙的有效性问题。
    - 领域特定知识和约束（如物理定律、生物学背景）对于产生有意义的发现至关重要，缺少这些时通用系统表现不佳。
    分歧:
    - 评估策略：部分依赖模拟同行评审（AI Scientist v1、CLAW），部分以真实会议接收为目标（AI Scientist-v2），另一些使用预定义基准配合人类基线（BAISBench、DISCOVERYWORLD）。
    - 系统架构：单智能体流水线 vs. 多智能体团队（Claw AI Lab）vs. 树搜索（AI Scientist-v2）vs. 带归因的自我纠正（SAGE）。
    - 自主范围：通用 ML 研究 vs. 领域特定发现（CFD、单细胞生物学），导致对所需背景知识和工具链的不同假设。
    - 失败处理：基于简单反思的纠正 vs. 结构化多假设失败归因；诊断推理的深度不同。
