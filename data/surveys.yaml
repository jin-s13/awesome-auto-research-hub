  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous scientific writing pipelines
      what_it_solves: Automates the research-to-manuscript workflow from hypothesis
        generation through code, experiments, visualization, and paper writing.
      what_remains_open: Consistent success beyond selected examples and whether generated
        papers can repeatedly pass independent human peer review.
    - line: Verification and self-correction for generated manuscripts
      what_it_solves: Reduces fabricated numbers, silent execution failures, and logical
        incoherence by checking outputs before writing or reporting.
      what_remains_open: False negatives remain visible in planted-failure tests,
        and verification boundaries across domains are not well established.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Improves reliability by inserting human judgment at selected
        decision points instead of requiring full autonomy or exhaustive oversight.
      what_remains_open: The optimal intervention granularity and how such designs
        scale to larger research workloads are not yet determined.
    - line: Evaluation, benchmark, and peer-review automation
      what_it_solves: Makes AI-generated research outputs comparable through rubrics,
        benchmark tasks, workshop submissions, and simulated review.
      what_remains_open: Proxy metrics and small evaluation sets leave open whether
        scores align with long-term scientific utility.
    - line: Failure analysis and design principles
      what_it_solves: Maps observed autonomous-research failures to diagnostic categories
        and proposed system design principles.
      what_remains_open: Evidence comes from very few case attempts, and it is not
        yet shown that the categories predict future system behavior.
    consensus:
    - LLM agents can produce complete manuscripts, but end-to-end generation alone
      is insufficient for scientific trustworthiness.
    - Verification, grounding, or human oversight is needed to reduce hallucinated
      numbers, silent failures, and overexcitement.
    - Fully autonomous papers currently pass peer review only intermittently, so reliability
      remains the central bottleneck.
    - Targeted human collaboration at high-leverage decision points appears more effective
      than either full autonomy or step-by-step oversight.
    disagreements:
    - 'Verification is placed differently across work: logical coherence auditing,
      vision-language physical checks, causal failure attribution, or result-level
      reporting constraints.'
    - Human involvement ranges from minimal prompting to principal-investigator-style
      supervision to multiple explicit intervention modes.
    - 'Success is measured by different targets: LLM rubric scores, workshop acceptance,
      benchmark improvement, or proportion of metrics-bearing outputs.'
    - Domain reliability is pursued through explicit knowledge retrieval and domain-specific
      gates in some systems, while others rely on general agentic workflow improvements.
    open_questions:
    - Do LLM-based reviewer scores and rubric gains predict human peer-review decisions
      and longer-term scientific impact?
    - How can verification mechanisms detect the silent failures they currently miss
      without rejecting valid results?
    - Which minimal human intervention points are necessary and sufficient for trustworthy
      autonomous manuscript production?
    - Can these systems generalize across more topics while releasing reproducible
      code, datasets, and experiment artifacts?
    - Missing code, dataset, metric, baseline, or limitation details in the evidence
      create verification gaps rather than proof of absence.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科学写作流水线
      解决的问题: 自动化从假设生成、代码、实验、可视化到论文写作与手稿生成的研究闭环。
      尚未覆盖: 在少数示例之外的稳定成功率，以及生成论文能否重复通过独立人类同行评审。
    - 路线: 面向生成稿件的验证与自校正
      解决的问题: 在结果写入或报告前检查输出，减少编造数字、静默执行失败和逻辑不连贯。
      尚未覆盖: 植入失败测试中仍存在漏报，且跨领域的验证边界尚未系统确立。
    - 路线: 人机协作与干预设计
      解决的问题: 在关键决策点引入人类判断，避免完全自主或逐步监督的缺点。
      尚未覆盖: 最优干预粒度和在更大规模研究负载下的可扩展性仍不明确。
    - 路线: 评测、基准与同行评审自动化
      解决的问题: 让AI生成的研究成果可通过评分标准、基准任务、工作坊投稿和模拟评审进行比较。
      尚未覆盖: 代理指标与小型评测集无法确认分数是否与长期科学效用一致。
    - 路线: 失败分析与设计原则
      解决的问题: 将自主研究失败归纳为可诊断类别，并提炼系统设计原则。
      尚未覆盖: 证据仅来自极少量案例，且未证明这些类别能预测后续系统行为。
    共识:
    - LLM智能体可以生成完整论文，但仅靠端到端生成不足以支撑科学可信度。
    - 需要验证、事实约束或人工把关来减少幻觉数字、静默失败和过早宣称成功。
    - 当前完全自主论文通过同行评审的比例不稳定，可靠性是主要瓶颈。
    - 在高杠杆决策点进行精准人机协作，比完全自主或逐步监督更有效。
    分歧:
    - 验证被放在不同层级：逻辑一致性审计、视觉-语言物理检查、因果失败归因或结果级报告约束。
    - 人类参与程度不同：最小提示、首席研究员式监督或多种显式干预模式。
    - 成功标准不同：LLM评审分数、工作坊录用、基准提升或包含指标输出的比例。
    - 领域可靠性来源不同：显式知识检索与领域专用门控，或通用智能体工作流改进。
    开放问题:
    - LLM评审分数和评分提升能否预测人类同行评审决定及长期科学影响？
    - 验证机制如何在减少漏检静默失败的同时避免拒绝有效结果？
    - 哪些最小人工干预点对于可信的自主论文生产是必要且充分的？
    - 这些系统能否在更多主题上泛化，并发布可复现的代码、数据集和实验工件？
    - 证据中缺少代码、数据集、指标、基线或局限细节，只能作为验证缺口，不能等同不存在。
