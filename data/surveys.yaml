    - line: Benchmarks and evaluation frameworks for discovery capabilities
      what_it_solves: making claims comparable through tasks, baselines, metrics,
        and difficulty measurement
      what_remains_open: alignment between proxy task accuracy and real scientific
        utility, and broader domain coverage, still lack evidence
    - line: Domain-specific end-to-end discovery systems
      what_it_solves: producing experimentally or symbolically validated hypotheses
        in settings such as biology or equation discovery
      what_remains_open: cross-domain generalization, reproducibility, and validation
        depth beyond demonstrated cases are limited
    consensus:
    - Most systems treat hypothesis generation as part of an iterative loop linking
      literature or data analysis with experimental feedback or code execution.
    - Multi-agent decomposition is common, with separate roles for literature search,
      data analysis, ideation, execution, and verification.
    - Human oversight is often most useful at targeted high-leverage decision points
      rather than exhaustive step-by-step supervision.
    - Traceable reporting and benchmark tasks are emerging as core mechanisms for
      evaluating autonomous research systems.
    - Current systems are considered more credible in structured, executable, and
      rapidly verifiable settings than in less controllable environments.
    disagreements:
    - 'Human role differs: some systems target full autonomy, others emphasize multiple
      human intervention modes, and surveys frame autonomy as domain-conditioned.'
    - 'Exploration mechanisms differ: structured multi-agent debate, evolutionary-systematic
