    or experiment execution, result checking, and paper drafting, with some form of
    internal verification or reporting constraint.'
  - 'Key differences: Systems vary in verification strategy, human intervention design,
    search or failure-attribution mechanism, and evaluation target such as benchmark
    scores, LLM rubrics, blind review, or workshop peer review.'
  - 'Trend evolution: Work is shifting from general-purpose automated discovery toward
    domain-grounded, verification-aware, and human-collaborative systems that prioritize
    defensible results over text generation alone.'
  - 'Open questions: Whether generated claims generalize beyond controlled benchmarks,
    how well verification gates catch real silent failures, and where human judgment
    remains necessary for scientific quality.'
