  related_work_outline:
  - 'Mainstream direction: Multi-agent LLM systems are being used to automate literature
    synthesis, scholarly drafting, review, and scientific discovery workflows, with
    iterative self-critique and verification loops as the dominant mechanism.'
  - 'Shared research pattern: Scholarly work is decomposed into specialized roles
    such as retrieval, topic expansion, drafting, reviewing, and revision; outputs
    are evaluated through rubric-like or standardized scoring, often with LLM judges
    or baseline comparisons.'
  - 'Key differences: Systems target different outputs, from survey papers to proof-based
    or experimental discovery papers, and differ in interaction mode, from human-as-principal-investigator
    collaboration to fully autonomous evolutionary or tree-search agents.'
  - 'Trend evolution: The 2025-2026 frontier shows movement from descriptive surveys
    of agentic science toward autonomous generation benchmarks, failure-mode analysis,
    and general domain-agnostic frameworks; broader temporal trends are not visible
    from this evidence.'
  - 'Open questions: Whether rubric and standardized scores reflect real literature
    quality, how to guarantee citation and factual reliability, and how much human
    domain intelligence remains necessary for trustworthy autonomous review.'
  related_work_outline_zh:
  - 主流方向：多智能体LLM系统被用于自动化文献综合、学术写作、评审和科学发现流程，迭代式自我批判与验证循环是主导机制。
  - 研究共性：将学术工作分解为检索、主题扩展、起草、评审和修订等专门角色，并通过评分准则或标准化评分，常用LLM评委或基线比较进行评估。
  - 关键差异：系统目标不同，有的生成综述论文，有的生成证明型论文或实验发现；交互模式也不同，从人类作为首席研究员的协作到完全自主的进化或树搜索智能体。
  - 趋势演进：2025-2026年前沿显示从对智能体科学的描述性综述，走向自主生成基准、失败模式分析和领域无关框架；由于证据年份较窄，更长时间趋势不可见。
  - 开放问题：评分准则和标准化分数是否反映真实文献质量，如何保证引用与事实可靠性，以及可信自主综述仍需要多少人类领域智能。
  literature_review:
    line_of_work_matrix:
    - line: Automated survey generation and rubric-guided revision
      what_it_solves: Transforms retrieved literature into structured surveys by assigning
        scholarly roles and iteratively reviewing drafts against criteria.
      what_remains_open: Long-term factual and citation reliability and external human
        validation remain unproven; success is mainly measured by LLM rubric scores.
    - line: End-to-end autonomous scientific paper generation with verification
      what_it_solves: Covers literature synthesis, derivation or proof, experimentation,
        and manuscript drafting in a unified agentic workflow with internal consistency
        checks.
      what_remains_open: Evidence is limited to applied mathematics and LLM-based
        review; no independent replication or cross-domain transfer evidence is provided.
    - line: Benchmark-based evaluation of AI scientists
      what_it_solves: Provides real-data tasks and human baselines to measure whether
        AI agents can annotate data and answer discovery-oriented questions.
      what_remains_open: Multiple-choice discovery tasks may not capture open-ended
        literature review or novel research gap discovery; current systems still fall
        short of full autonomy.
    - line: Failure analysis and design principles for autonomous research agents
      what_it_solves: Documents recurring failure modes such as implementation drift,
        memory degradation, and overexcitement, and translates them into system design
        guidance.
      what_remains_open: Based on a small number of end-to-end attempts in ML research;
        generalizability to other fields and literature-focused workflows is not established.
    - line: General evolving agent frameworks and structured search
      what_it_solves: Supplies domain-agnostic self-evolution or tree-based backtracking
        mechanisms intended to scale AI-assisted scientific exploration across disciplines.
      what_remains_open: Reported standardized test gains do not isolate contribution
        to literature understanding versus planning and search, and no limitations
        or external validation are provided.
    - line: Survey mapping of agentic scientific discovery
      what_it_solves: Organizes agentic systems, metrics, frameworks, datasets, and
        challenges across scientific domains.
      what_remains_open: Literature review automation is explicitly identified as
        a remaining challenge; the taxonomy is not empirically validated against model
        behavior.
    consensus:
    - Multi-agent orchestration is the default architecture for decomposing scholarly
      literature and discovery tasks into specialized roles.
    - Iterative self-review, verification, or reflection loops are widely used to
      refine generated scientific or survey text.
    - 'Evaluation is typically proxy-based: LLM rubric scores, standardized test scores,
      human baselines, or acceptance as a success signal.'
    - Current systems are not yet fully autonomous scientists; human oversight, domain
      intelligence, and reliability remain recurring concerns.
    - 'Reproducibility evidence is uneven: code and artifact signals appear for some
      systems, but independent external validation and explicit limitations are frequently
      absent.'
    disagreements:
    - 'Target task differs: automated survey generation and structured review versus
      end-to-end discovery with proof or experimental results.'
    - 'Supervision signal differs: rubric-guided reviewer feedback, internal logical
      verification, benchmark questions with human baselines, or success and failure
      of complete research attempts.'
    - 'Interaction mode differs: human-as-principal-investigator collaboration, fully
      autonomous multi-agent pipelines, evolutionary or tree-search exploration, and
      modular scholarly role delegation.'
    - 'Evaluation target differs: rubric-aligned survey quality, real-data annotation
      and discovery accuracy, general standardized test scores, or peer acceptance
      of a generated paper.'
    - 'Domain scope differs: applied mathematics, single-cell biology, ML research,
      and domain-agnostic frameworks; this affects what counts as evidence and how
      easily results transfer.'
    open_questions:
    - Do LLM-based rubric scores and multiple-choice discovery benchmarks predict
      real literature synthesis quality, factual citation reliability, or research
      impact?
    - Can current agent architectures prevent documented failure modes such as memory
      degradation, implementation drift, and premature success declarations in long-horizon
      literature workflows?
    - What level of human domain intelligence and scientific taste is necessary to
      supervise autonomous survey or discovery systems without undermining automation?
    - How well do systems validated in applied mathematics or single-cell biology
      transfer to broader scholarly literature search, review, and gap discovery?
    - What independent evaluation protocols can replace or complement LLM judges and
      curated benchmarks when generated papers involve novel claims or missing ground
      truth?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动化综述生成与评分准则引导修订
      解决的问题: 将检索到的文献转化为结构化综述，分配学术角色，并按准则迭代评审与修改草稿。
      尚未覆盖: 长期事实与引用可靠性以及外部人工验证仍未证明，成功主要由LLM评分准则分数衡量。
    - 路线: 带验证的端到端自主论文生成
      解决的问题: 在统一智能体工作流中完成文献综合、推导或证明、实验和手稿撰写，并进行内部一致性检查。
      尚未覆盖: 证据仅限于应用数学和LLM评审，未提供独立复现或跨领域迁移证据。
    - 路线: 基于基准的AI科学家评测
      解决的问题: 提供真实数据任务和人类基线，衡量AI智能体能否进行数据注释并回答发现导向问题。
      尚未覆盖: 选择题式发现任务可能无法捕捉开放式文献综述或新研究缺口发现，当前系统仍不够完全自主。
    - 路线: 自主研究智能体的失败分析与设计原则
      解决的问题: 记录实现漂移、记忆退化和过度兴奋等重复失败模式，并将其转化为系统设计指导。
      尚未覆盖: 仅基于机器学习研究中的少量端到端尝试，向其他领域和文献工作流的泛化性不明确。
    - 路线: 通用演化智能体框架与结构化搜索
      解决的问题: 提供领域无关的自我演化或树搜索回溯机制，旨在跨学科扩展AI辅助科学探索。
      尚未覆盖: 报告的标准化测试提升未分离对文献理解的贡献与规划或搜索的贡献，缺少局限性或外部验证。
    - 路线: 智能体科学发现的综述映射
      解决的问题: 整理跨科学领域的智能体系统、指标、框架、数据集与挑战。
      尚未覆盖: 文献综述自动化被明确列为仍待解决的挑战，分类映射未直接实证验证模型行为。
    共识:
    - 多智能体编排是将学术文献与发现任务分解为专门角色的默认架构。
    - 迭代式自我评审、验证或反思循环被广泛用于改进生成的科学文本或综述文本。
    - 评测通常依赖代理指标：LLM评分准则分数、标准化测试分数、人类基线或论文被接收作为成功信号。
    - 当前系统尚不能完全自主地充当科学家，人类监督、领域智能与可靠性仍是反复出现的问题。
    - 可复现证据不均衡：部分系统有代码和工件信号，但独立外部验证和明确局限性经常缺失。
    分歧:
    - 目标任务不同：自动化综述生成与结构化评审，对比包含证明或实验结果的端到端发现。
    - 监督信号不同：评分准则引导的评审反馈、内部逻辑验证、带人类基线的基准问题，或完整研究尝试的成功与失败。
    - 交互模式不同：人类作为首席研究员协作、完全自主多智能体流水线、进化或树搜索探索，以及模块化学术角色委派。
    - 评测目标不同：综述质量与评分准则对齐、真实数据注释与发现准确率、通用标准化测试分数，或生成论文的同行接收。
    - 领域范围不同：应用数学、单细胞生物学、机器学习研究和领域无关框架；这影响什么算证据以及结果迁移的难易。
    开放问题:
    - LLM评分准则分数和选择题式发现基准能否预测真实文献综合质量、引用事实可靠性和研究影响？
    - 当前智能体架构能否在长周期文献工作流中防止记忆退化、实现漂移和过早宣布成功等失败模式？
    - 需要多少人类领域智能和科学品味，才能在不损害自动化的情况下监督自主综述或发现系统？
    - 在应用数学或单细胞生物学中验证的系统，能否迁移到更广泛的学术文献检索、综述与缺口发现？
    - 当生成论文涉及新颖主张或缺少真值时，哪些独立评测协议可以替代或补充LLM评委与精选基准？
