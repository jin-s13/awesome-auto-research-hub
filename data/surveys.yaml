  related_work_outline:
  - 'Mainstream direction: Autonomous scientific discovery agents are being paired
    with evaluation and governance infrastructure, shifting from raw task completion
    toward evidence-grounded validity checks and reproducible benchmarks.'
  - 'Shared research pattern: Systems generate hypotheses, execute code or simulations,
    verify outputs, and write or review claims; evaluation separates execution competence
    from the evidentiary controls needed for trustworthy conclusions.'
  - 'Key differences: Verification mechanisms vary from vision-language physics gates
    and deterministic edit authority to LLM judges and peer review; targets range
    from benchmark task completion and domain metric gains to workshop acceptance.'
  - 'Trend evolution: Available 2024-2026 evidence shows broad end-to-end agents and
    virtual discovery environments emerging first, then domain-specific verification,
    blinded evidence-maturity benchmarks, authority separation, and explicit reliability
    limits.'
  - 'Open questions: Whether proxy metrics align with real scientific utility, how
    verification gates generalize beyond planted or domain-specific failures, and
    how to enforce controls, robustness, falsifiability, and cross-domain reproducibility.'
  related_work_outline_zh:
  - 主流方向：自主科学发现智能体与评测和治理基础设施正在结合，重点从任务完成转向证据锚定的有效性检查与可复现基准。
  - 研究共性：系统生成假设、执行代码或仿真、验证输出并撰写或评审主张；评估把执行能力与可信结论所需的证据控制相区分。
  - 关键差异：验证机制包括视觉-语言物理门、确定性编辑权威、LLM裁判和同行评审；评测目标从基准任务完成、领域指标提升到工作坊接收不等。
  - 趋势演进：现有2024-2026年证据显示，先出现通用端到端智能体与虚拟发现环境，随后加入领域特定验证、盲测证据成熟度、权限分离和更明确的可靠性边界。
  - 开放问题：代理指标是否对齐真实科研效用，验证门能否泛化到植入失败或领域特定失败之外，以及如何落实对照、稳健性、可证伪性与跨域复现。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research workflows
      what_it_solves: Compresses hypothesis generation, code writing, experiment execution,
        visualization, and manuscript composition into an agent loop, reducing per-paper
        cost and enabling iterative discovery.
      what_remains_open: 'Reliability is uneven: only a subset of generated papers
        pass peer review or produce defensible claims, and several records lack explicit
        limitation analysis.'
    - line: Verification-gated and authority-separated research agents
      what_it_solves: Adds rejection gates or deterministic control over source edits
        and promotion to catch silent failures before they become accepted results.
      what_remains_open: Gates can miss planted failures, and evidence is concentrated
        in specific domains such as fluid dynamics or time-series forecasting, leaving
        external validation unclear.
    - line: Benchmark environments and blinded evaluation suites
      what_it_solves: Creates repeatable tasks and fixed metrics across discovery
        stages, including task completion, explanatory knowledge, cell annotation,
        and evidence maturity scoring.
      what_remains_open: 'Construct validity is still uncertain: strong agents can
        plateau with no statistically reliable separation, and one-base-model settings
        limit cross-model generalization.'
    - line: Automated review and evidence maturity assessment
      what_it_solves: Provides scalable scoring of generated papers or discovery claims
        through simulated review or fixed LLM judges, reducing dependence on manual
        instance-level grading.
      what_remains_open: Judge alignment with human or governance standards is only
        partially shown; agents may exceed an acceptance threshold while still lacking
        controls, robustness, and falsifiability.
    consensus:
    - Autonomous agents can execute and document multi-step scientific workflows,
      but execution competence is not equivalent to trustworthy discovery.
    - Evaluation increasingly hides target conclusions or uses fixed judges so agents
      cannot exploit seen answers, reflecting a shared shift toward evidence-grounded
      claims.
    - Current systems are not yet reliable enough for fully autonomous conclusions
      because they generally lack controls, robustness checks, falsifiability, cross-dataset
      generalization, or complete verification coverage.
    - Code, datasets, and task suites are treated as central to comparing agents,
      though missing limitation fields should be read as verification gaps rather
      than proof of completeness.
    disagreements:
    - 'Reliability mechanism: physics-aware vision gates reject invalid simulations,
      deterministic authority constrains code edits and promotion, while LLM review
      and fixed judges score claim maturity after execution.'
    - 'Evaluation target: some work optimizes downstream domain metrics or architecture
      performance; other work judges task completion, evidence maturity, or peer-review
      acceptance.'
    - 'Supervision signal: automated reviewer scores, fixed LLM evidence rubrics,
      human bioinformatician baselines, and actual peer review are used, with different
      cost and validity tradeoffs.'
    - 'Autonomy boundary: end-to-end systems reduce human intervention, while authority-separated
      systems retain deterministic external controls; reports differ on which boundary
      improves reliability.'
    - 'Success evidence: one route reports a generated paper passing workshop peer
      review, while another finds coding agents statistically indistinguishable, showing
      no converged standard for sufficient evidence.'
    open_questions:
    - Do LLM-judge or simulated-review scores predict real scientific utility, human
      peer review, or governance decisions outside the benchmark?
    - Can verification gates reduce false negatives and generalize beyond the planted
      or domain-specific failures reported so far?
    - How should controls, robustness tests, falsifiability, and cross-dataset generalization
      be built into agent workflows and evaluators?
    - What minimum evidence is required before an autonomous discovery claim is considered
      defensible across multiple base models, datasets, and domains?
    - Where should authority boundaries sit between LLM-generated modifications and
      deterministic review or human oversight in self-modifying research systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究工作流
      解决的问题: 把假说生成、代码编写、实验执行、可视化和论文写作压缩到智能体循环中，降低单篇论文成本并支持迭代发现。
      尚未覆盖: 可靠性不均衡：只有部分生成论文能通过评审或产生可辩护主张，若干记录缺少明确的限制分析。
    - 路线: 验证门控与权限分离的研究智能体
      解决的问题: 通过拒绝门控或对源代码编辑与晋升的确定性控制，在静默失败成为被接受结果之前将其拦截。
      尚未覆盖: 门控可能漏掉部分植入失败，并且证据集中在流体力学或时间序列预测等特定领域，外部验证仍不清楚。
    - 路线: 发现智能体基准与盲测评估套件
      解决的问题: 用可重复任务和固定指标覆盖发现各阶段，包括任务完成、解释性知识、细胞注释和证据成熟度评分。
      尚未覆盖: 构念效度仍不确定：强智能体可能分数接近且无显著差异；单基座模型设置限制了跨模型泛化。
    - 路线: 自动评审与证据成熟度评估
      解决的问题: 通过模拟评审或固定LLM裁判对生成论文或发现主张批量评分，减少逐实例人工打分依赖。
      尚未覆盖: 裁判与人类或治理标准的一致性只得到部分验证；智能体可能超过阈值，但仍缺乏对照、稳健性和可证伪性。
    共识:
    - 自主智能体能执行并记录多步科研工作流，但执行能力不等于可信发现。
    - 评估越来越多地隐藏目标结论或使用固定裁判，防止智能体利用已见答案，这是共享的证据锚定策略。
    - 当前系统尚不足以支撑完全自主结论，因为普遍缺乏对照、稳健性检查、可证伪性、跨数据集泛化或完整验证覆盖。
    - 代码、数据集和任务套件被视为比较智能体的核心，但缺失的局限性字段应视为验证差距，而非完整性证据。
    分歧:
    - 可靠性机制不同：物理感知视觉门拒绝无效仿真，确定性权限限制代码编辑与晋升，LLM评审和固定裁判在事后对主张成熟度打分。
    - 评测目标不同：部分工作优化下游领域指标或架构性能，其他工作侧重任务完成、证据成熟度或同行评审接收。
    - 监督信号不同：自动评审分数、固定LLM证据量规、人类生物信息学家基线和真实同行评审并存，各有成本与效度差异。
    - 自主边界不同：端到端系统减少人工干预，权限分离系统保留确定性外部控制，但哪种边界更能提升可靠性仍无定论。
    - 成功证据不同：一路线报告生成论文通过工作坊评审，另一路线发现编码智能体统计上不可区分，说明充分证据的标准尚未收敛。
    开放问题:
    - LLM裁判或模拟评审的分数能否预测真实科研效用、人类同行评审或基准之外的治理决策？
    - 验证门能否降低漏检率，并泛化到目前报告的植入失败或领域特定失败之外？
