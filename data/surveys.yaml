  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Integrates idea generation, code implementation, experiment
        execution, result analysis, manuscript drafting, and simulated or automated
        review into one closed loop.
      what_remains_open: Consistency and rigor of generated papers and experiments
        remain uncertain across fields; success is demonstrated mainly in limited
        workshop, internal, or automated-review settings.
    - line: Simulated discovery environments for agent evaluation
      what_it_solves: Provides reproducible task suites and automatic metrics for
        complete hypothesis-design-experiment-conclusion cycles, including task completion
        and discovered explanatory knowledge.
      what_remains_open: Whether completion and explanation metrics predict real scientific,
        code, or lab decision utility outside the simulated environment.
    - line: Failure-aware memory and iterative feedback mechanisms
      what_it_solves: Converts failed experiments or reviewer feedback into reusable
        negative knowledge to improve same-task retries and cross-task transfer.
      what_remains_open: Transfer across broader research domains and task types is
        underevidenced; bounded typed failure records and curator assumptions remain
        unvalidated at scale.
    - line: Interactive multi-agent experiment platforms
      what_it_solves: Supports customizable research roles, real-time monitoring,
        artifact inspection, rollback/resume control, and code harness integration
        for human-in-the-loop research workflows.
      what_remains_open: Generalization beyond a small set of internal case studies;
        external validation and platform maturity are still limited.
    - line: Experimental design and ablation planning evaluation
      what_it_solves: Assesses whether agents can propose and identify necessary ablation
        controls or missing experimental controls in empirical research.
      what_remains_open: Current systems remain below human recall on ablation identification,
        and author-versus-reviewer grounding differences are unresolved.
    consensus:
    - The field treats experiment automation as a closed loop from hypothesis or task
      setup through execution, analysis, and reporting, rather than as isolated code
      generation.
    - LLM-based automated judges or simulated review are commonly used as evaluation
      signals, although evidence for alignment with human judgment and real decision
      utility is limited.
    - Multi-agent role decomposition and explicit feedback or memory improve agentic
      research workflows over single-pass generation.
    - The top evidence focuses on code-based or simulated experimentation; physical
      lab automation is not represented in this packet.
    disagreements:
