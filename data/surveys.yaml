  related_work_outline:
  - 'Mainstream direction: Research-agent evaluation surfaces range from scientist-curated
    coding/survey tasks to ML and deep-research suites; the strongest evidence emphasizes
    closed-loop agents improving on these surfaces rather than static question answering.'
  - 'Shared research pattern: Evaluations rely on downstream task scores or held-out
    generalization, with agents decomposing work into searchable or auditable components
    such as evidence, code, model changes, and skills.'
  - 'Key differences: Evaluation targets span scientific materials modeling, ML engineering,
    deep research reasoning, academic surveys, and research coding; control and supervision
    differ across workflow search, skill distillation, and RL-trained recursive loops.'
  - 'Trend evolution: From 2024 scientist-curated coding benchmarks to 2025 survey-task
    evaluation and 2026 autonomous workflows with skills and recursive self-improvement;
    the window is narrow and within the current frontier.'
  - 'Open questions: Generalization beyond reported domains, marginal contribution
    of components, metric-to-research-utility alignment, and missing reproducibility
    or limitation evidence for many top-ranked entries.'
  related_work_outline_zh:
  - 主流方向：研究智能体评测表面从科学家策展的编程/综述任务扩展到ML与深度研究套件；最强证据强调闭环智能体在这些表面上的改进，而非静态问答。
  - 研究共性：评测依赖下游任务分或留出泛化；智能体将工作分解为可搜索或可审计组件，如证据、代码、模型变化与技能。
  - 关键差异：评测目标横跨科学材料建模、ML工程、深度研究推理、学术综述与研究编程；控制/监督在工作流搜索、技能蒸馏、RL递归循环之间不同。
  - 趋势演进：从2024年科学家策展的编程基准，到2025年综述任务评测，再到2026年带技能与递归自改进的自主工作流；时间窗较窄，处于当前前沿。
  - 开放问题：跨领域泛化、组件边际贡献、指标与研究效用对齐，以及多个高排序条目缺少可复现性与局限性证据。
  literature_review:
    line_of_work_matrix:
    - line: Held-out auditable evaluation for autonomous research workflows
      what_it_solves: Tests whether agent-chosen model, feature, representation, or
        training-data changes survive unseen data and produce reusable code.
      what_remains_open: Evidence is limited to ten Matbench endpoints; one selected
        intervention failed on holdout; external data screening added little for composition
        tasks.
    - line: Repository-to-skill distillation for ML research agents
      what_it_solves: Extracts operational know-how from GitHub repositories into
        compact verified skills that improve research-agent performance on benchmark
        suites.
      what_remains_open: No limitations are reported; gains are measured against a
        no-skill agent with fixed backbone, framework, and execution budget, so cross-domain
        and cross-benchmark transfer remains open.
    - line: Recursive self-improving deep research agent architecture
      what_it_solves: Alternates evidence gathering with constraint-wise auditing
        and follow-up research, compressing interaction history via a learned context-update
        tool.
      what_remains_open: No limitation text is present in the packet; evidence rests
        on comparable-scale benchmark comparisons, with limited reproducibility details
        and unclear generalization beyond reported tasks.
    - line: Research coding and academic survey benchmark construction
      what_it_solves: Provides scientist-curated or survey-style evaluation tasks
        for coding agents and deep research agents.
      what_remains_open: No abstract or analysis evidence is available in the packet
        for these entries; metrics, baselines, and task coverage are verification
        gaps.
    - line: Autonomous long-horizon research execution
      what_it_solves: Frames long-horizon engineering or mathematics research as system-level
        tasks with repository and artifact signals.
      what_remains_open: Only titles and reproducibility links exist without methodology,
        result, or limitation text, so capability and failure modes cannot be assessed.
    consensus:
    - Evaluation emphasizes downstream task performance and held-out or unseen data,
      not only development-set accuracy.
    - 'Research workflows are decomposed into searchable or auditable components:
      evidence, code, model/representation changes, and skills.'
    - Closed-loop verification, whether through held-out transfer, skill verification,
      or constraint-wise auditing, is treated as central.
    - 'Reproducibility is uneven: some entries provide method and limitation evidence
      while others expose only title and link signals.'
    disagreements:
    - 'Evaluation target differs: scientific materials modeling, ML engineering benchmarks,
      deep research/reasoning suites, academic survey tasks, and research coding tasks.'
    - 'Supervision and training differ: fixed held-out workflow feedback, repository-derived
      skill retrieval, or long-horizon reinforcement learning with emphasized key
      steps.'
    - 'Interaction mode differs: search over modeling changes, skill retrieval during
      research, or an outer self-improvement audit loop.'
    - 'Deployment setting differs: domain-specific materials tasks, general ML research
      and engineering, or broad deep-research and reasoning contexts.'
    open_questions:
    - Do held-out transfer gains in one scientific domain generalize to noisy, multi-objective,
      or less benchmark-like research settings?
    - What is the marginal contribution of skill libraries when backbone, research
      harness, and downstream execution budget are all fixed?
    - Are recursive self-improvement agents robust to failure cases not captured by
      comparable-scale baseline comparisons?
    - Which research-agent benchmark metrics align with real research utility, and
      do scientist-curated coding or survey tasks cover enough diversity?
    - Can missing reproducibility and limitation details for high-ranking benchmark
      entries be resolved with code, datasets, and failure analyses?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向自主研究工作流的留出审计式评估
      解决的问题: 测试智能体选择的模型/特征/表示/训练数据变化能否在未见数据上存续并产出可复用代码。
      尚未覆盖: 证据仅涵盖十个 Matbench 端点；一个干预在留出集上失效；外部数据筛选对成分任务贡献很小。
    - 路线: 面向 ML 研究智能体的仓库到技能蒸馏
      解决的问题: 从 GitHub 仓库提取操作知识并压缩为已验证技能，以提升研究智能体在基准上的表现。
      尚未覆盖: 未报告局限性；增益是在固定主干、框架和执行预算下与无技能版本相比得出，跨领域与跨基准迁移仍开放。
    - 路线: 递归自改进深度研究智能体架构
      解决的问题: 在证据收集与逐约束审计之间交替，并通过学习到的上下文更新工具压缩交互历史。
      尚未覆盖: 数据包中无局限性文本；证据依赖同尺度基线和已报告任务，可复现细节有限，泛化边界不清。
    - 路线: 研究编程与学术综述任务基准构建
      解决的问题: 为编程智能体和深度研究智能体提供科学家策展或综述型评测任务。
      尚未覆盖: 数据包缺少摘要或分析证据；指标、基线和任务覆盖均为验证空白。
    - 路线: 自主长程研究执行
      解决的问题: 将长程工程或数学研究构造为系统级任务，并给出仓库与工件信号。
      尚未覆盖: 仅有标题和可复现链接，没有方法/结果/局限性文本，能力与失败模式无法评估。
    共识:
    - 评测强调下游任务表现与留出/未见数据，而非仅开发集精度。
    - 研究工作流被分解为可搜索或可审计组件：证据、代码、模型/表示变化与技能。
    - 闭环验证被视为核心，包括留出迁移、技能验证或逐约束审计。
    - 可复现性证据不均：部分条目提供方法与局限性证据，其他仅暴露标题和链接信号。
    分歧:
    - 评测目标不同：科学材料建模、ML 工程基准、深度研究/推理套件、学术综述任务与研究编程任务。
    - 监督与训练不同：固定留出工作流反馈、仓库派生技能检索、或带关键步强调的长程强化学习。
    - 交互模式不同：在建模变化上搜索、在研究过程中检索技能、或外部自改进审计循环。
    - 部署场景不同：领域专用材料任务、通用 ML 研究与工程、或广泛深度研究与推理上下文。
    开放问题:
    - 一个科学领域的留出迁移收益能否推广到噪声大、多目标或非基准式研究场景？
    - 当主干、研究框架和下游执行预算都固定时，技能库的边际贡献是什么？
