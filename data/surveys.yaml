  related_work_outline:
  - 'Mainstream direction: The field is converging on benchmarkable end-to-end scientific
    discovery agents, using environments and evidence-grounded tasks such as DISCOVERYWORLD,
    TruthInsightBench, and 1GC-7RC to expose coding-agent limits.'
  - 'Shared research pattern: Most work decomposes discovery into question or hypothesis
    formation, experimental execution, evidence interpretation, and safety or audit
    checks, then evaluates results through automated or LLM-judge metrics.'
  - 'Key differences: Contributions differ in focus: some build blind discovery tasks
    and evaluation coverage, others create auditable question certificates, trajectory-aware
    safety reasoning, experience evolution, or vetted code libraries.'
  - 'Trend evolution: The available top-paper evidence is concentrated in 2024-2026;
    work is shifting from broad virtual discovery environments toward evidence-maturity
    evaluation, auditability, safety, and reproducible scientific infrastructure.'
  - 'Open questions: Whether proxy metrics and LLM judges align with domain experts;
    how to ensure controls, robustness, falsifiability, and cross-domain generalization;
    and how safety guarantees hold for compositional tool chains and wet-lab actions.'
  related_work_outline_zh:
  - 主流方向：领域正汇聚到可基准化的端到端科学发现智能体，通过 DISCOVERYWORLD、TruthInsightBench、1GC-7RC 等环境与证据锚定任务暴露编码智能体的局限。
  - 研究共性：多数工作把发现流程分解为问题或假设形成、实验执行、证据解释以及安全或审计检查，并用自动指标或 LLM 裁判评估结果。
  - 关键差异：各工作侧重点不同：有的构建盲态发现任务与评测覆盖，有的做可审计问题证书、轨迹感知安全、经验演化或经验证代码库。
  - 趋势演进：可见重点论文集中在 2024-2026 年，当前趋势从宽泛的虚拟发现环境转向强调证据成熟度、可审计性、安全性和可复现基础设施。
  - 开放问题：代理指标与领域专家是否一致；如何保证对照、稳健性、可证伪性与跨域泛化；组合工具链和湿实验动作的安全保证仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark and environment design for end-to-end discovery
      what_it_solves: Creates controlled tasks requiring hypothesis formation, experiment
        design, execution, analysis, and conclusions, making discovery-agent capability
        comparable by task completion or evidence maturity.
      what_remains_open: Automated and LLM-judge evaluation may not align with domain-expert
        judgment; single model, blind task, and limited-domain settings leave cross-domain
        validity unproven.
    - line: Auditable question and claim scaffolding
      what_it_solves: Makes agent-generated research questions and conclusions inspectable
        through structured artifacts such as research question certificates and evidence
        scoring rubrics.
      what_remains_open: Current evidence relies on preliminary LLM judges and restricted
        LLM-agent topics; human expert validation and sensitivity to base models are
        missing.
    - line: Safety-grounded and experience-based execution
      what_it_solves: Integrates safety checks or reusable execution experience into
        agent loops to reduce unsafe tool-chain actions and improve wet-lab task completion.
      what_remains_open: Compositional risk detection may still be incomplete; evidence
        covers selected robotic, wet-lab, or tool-risk tasks without formal safety
        guarantees or broad hardware validation.
    - line: Scientific code and infrastructure distillation
      what_it_solves: Turns external scientific repositories into vetted domain-specific
        code examples that downstream discovery agents can use to produce more complete
        and scientifically sound experiments.
      what_remains_open: Validation is mainly on materials science repositories; LLM-as-judge
        agreement with experts is only moderate, leaving multi-domain coverage and
        judge reliability open.
    consensus:
    - Automated agents can execute and document analyses, but they plateau when tasks
      require controls, robustness, falsifiability, and cross-dataset generalization.
    - Scientific discovery requires more than code generation or task completion;
      evidence maturity, auditability, and safety must be explicitly evaluated.
    - Strong baselines that perform well in prior generic environments struggle on
      discovery-specific tasks, indicating that scientific discovery introduces distinct
      challenges.
    disagreements:
    - 'Works differ in primary evaluation target: task completion and action relevance
      versus blind evidence maturity versus end-to-end ML training under resource
      constraints.'
    - 'They differ in supervision and judgment signal: some use fixed automated metrics,
      some use LLM judges, and some augment with domain-expert judgment while others
      do not.'
    - Deployment assumptions vary from text-based virtual environments and coding-agent
      workflows to wet-lab robotic execution and safety-critical tool chains.
    - Some systems treat safety and auditability as structured artifacts or pipeline
      stages, while others treat them as trajectory-level feedback or reusable execution
      experience.
    open_questions:
    - Do current automated and LLM-judge metrics track domain-expert scientific quality
      well enough to guide agent development?
    - What evaluation designs can measure whether an agent produces trustworthy claims,
      including controls, robustness, falsifiability, and cross-domain generalization?
    - How can safety reasoning and experience evolution transfer across different
      laboratories, hardware, scientific domains, and base models?
    - What infrastructure is needed to generate and validate domain-specific code
      libraries beyond materials science without losing scientific soundness?
