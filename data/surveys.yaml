    - Do simulated task scores, LLM review rubrics, and evidence-maturity scores predict
      real discovery utility or downstream scientific impact?
    - Can results observed on one frozen base model, one physical case, or one workshop
      submission transfer to new base models, domains, and deployment settings?
    - What human oversight or control boundaries are necessary as these systems move
