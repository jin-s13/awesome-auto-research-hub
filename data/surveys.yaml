  related_work_outline:
  - 'Mainstream direction: autonomous AI-scientist systems are moving from separate
    idea generation toward closed-loop research agents that propose hypotheses, execute
    experiments, inspect results, and self-correct, with increasing use of verification
    gates and targeted human oversight.'
  - 'Shared research pattern: most systems couple LLM or multi-agent reasoning with
    executable experiments, then treat measured outcomes and failure traces as feedback
    for revising hypotheses; several add validity gates, grounded reporting, or deterministic
    authority to reduce fabricated claims.'
  - 'Key differences: they differ in supervision mode (full autonomy, deterministic
    authority, targeted human collaboration), failure handling (single reflection
    versus multi-hypothesis causal attribution), evaluation target (domain-specific
    discovery versus general benchmark improvement), and verification mechanism (vision-language
    physics checks, verifiable reporting, code harness constraints).'
  - 'Trend evolution: visible top papers are concentrated in 2025-2026, within the
    current frontier; early survey and benchmark work is followed by 2026 systems
    emphasizing reliability, self-correction, and human-AI collaboration.'
  - 'Open questions: how much improvement comes from scientific insight rather than
    engineering tricks; whether verification gates catch silent failures across domains;
    how proxy benchmarks relate to real discovery utility; what human oversight ratio
    is optimal.'
  related_work_outline_zh:
  - 主流方向：自主AI科研系统正从孤立想法生成走向可执行、可验证的闭环研究智能体，并加入验证门控和精准人工监督。
  - 研究共性：多智能体或单智能体提出假设后执行实验，将测量结果与失败轨迹作为反馈来修正假设；多个系统加入有效性门控、可验证报告或确定性控制以减少幻觉。
  - 关键差异：监督方式（完全自主、确定性权威、精准人工协作）、失败处理（单次反思 vs 多假设因果归因）、评测目标（领域发现 vs 通用基准提升）、验证机制（视觉-语言物理检查、可验证报告、代码约束）各有不同。
  - 趋势演进：可见高分论文集中在2025-2026当前前沿；先有综述和基准，2026年系统更强调可靠性、自纠正与人机协作。
  - 开放问题：改进多少来自科学洞察而非工程技巧；验证门控能否跨领域捕获静默失败；代理指标是否反映真实科研效用；何种人工监督比例最优。
  literature_review:
    line_of_work_matrix:
    - line: Closed-loop autonomous research agents with multi-agent ideation and human
        oversight, e.g., AutoResearchClaw and Claw AI Lab
      what_it_solves: Turns hypothesis generation into executable experiments with
        debate, self-healing execution, verifiable reporting, and targeted human intervention
        at high-leverage decision points.
      what_remains_open: Whether targeted human collaboration generalizes beyond limited
        case studies and internal AI research topics; the optimal amount and placement
        of human oversight remain undefined.
    - line: Reliability and self-correction mechanisms for research agents, e.g.,
        SAGE and EvoCast
      what_it_solves: Converts experiment failures into evidence-grounded revisions
        using structured causal attribution, deterministic routing, and grounded reporting
        that constrains outputs to measured values.
      what_remains_open: Whether gains reflect scientific insight or local implementation
        fixes; autonomous writing and conference-ready paper generation remain unresolved.
    - line: Domain-grounded ideation with domain-specific verification gates, e.g.,
        AI CFD Scientist
      what_it_solves: Generates physically or biologically plausible hypotheses by
        coupling literature-grounded ideation to code execution and domain-specific
        checks such as vision-language flow-field verification.
      what_remains_open: Verification gates can still miss silent failures; transfer
        to other domains without rebuilding domain-specific checks is unproven.
    - line: Benchmarks and controlled evaluation of AI scientists, e.g., BAISBench,
        Agent4Sci, and ARC-Bench
      what_it_solves: Provides tasks, human baselines, and in-the-wild settings to
        measure hypothesis-driven discovery and expose failure modes such as novelty
        miscalibration and engineering-only gains.
      what_remains_open: Proxy benchmarks may not predict real scientific utility;
        coverage is limited to selected domains, topics, and internal case studies.
    - line: Surveys and conceptual organization of agentic scientific discovery, e.g.,
        Agentic AI for Scientific Discovery
      what_it_solves: Organizes agent capabilities, evaluation metrics, implementation
        frameworks, and challenges across chemistry, biology, and materials science.
      what_remains_open: Direct empirical validation that these categories predict
        agent behavior is lacking; system reliability and ethical concerns remain
        unresolved.
    consensus:
    - Grounded execution and domain-specific checks help distinguish defensible hypotheses
      from unsupported claims.
    - Current AI-scientist systems can support discovery but do not yet achieve fully
      autonomous scientific research.
    - Human judgment or expert comparison remains important for evaluating novelty,
      completeness, and safety.
    - Benchmarks and ablations are used to expose failure modes rather than only ranking
      agents.
    disagreements:
    - 'Supervision mode: targeted human collaboration at high-leverage points versus
      full autonomy versus step-by-step human oversight.'
    - 'Failure attribution: simple reflection versus structured multi-hypothesis causal
      diagnosis with routed interventions.'
    - 'Evaluation target: domain-specific metrics such as flow error or forecasting
      performance versus general research benchmark scores versus expert preference.'
    - 'Verification strategy: vision-language physical checks, verifiable reporting,
      deterministic source-edit boundaries, or benchmark validity gates.'
    - 'Deployment scope: domain-specific scientific agents versus general-purpose
      AI research teams.'
    open_questions:
    - Can current benchmark gains be decomposed into novel research insight versus
      ML-engineering tricks?
    - How can verification gates be made robust enough to catch silent failures across
      domains without missing unacceptable cases?
    - Do proxy benchmarks predict real scientific utility or publication-grade discovery?
    - What is the optimal placement and amount of human collaboration across different
      research phases?
    - Can domain-specific systems transfer to new scientific domains without rebuilding
      verification and evaluation infrastructure?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 闭环自主科研智能体与多智能体协作，如 AutoResearchClaw、Claw AI Lab
      解决的问题: 将假设生成转化为可执行实验，并通过辩论、自愈执行、可验证报告和决策点人工干预形成闭环
      尚未覆盖: 这些系统在有限案例外的泛化能力，以及最优人工监督比例仍不明确
    - 路线: 科研智能体可靠性与自纠正机制，如 SAGE、EvoCast
      解决的问题: 将实验失败转化为有证据支持的因果归因，并约束输出到测量值，降低虚假报告
      尚未覆盖: 改进是否来自科学洞察还是局部实现修复；自主论文写作仍未被完全解决
    - 路线: 领域特定验证门控与发现系统，如 AI CFD Scientist
      解决的问题: 通过文献构思、代码执行和视觉-语言物理检查生成物理上可辩护的假设
      尚未覆盖: 验证门控仍会遗漏静默失败，跨领域迁移缺乏证据
    - 路线: AI科学家基准与受控评测，如 BAISBench、Agent4Sci、ARC-Bench
      解决的问题: 用任务、人类基线和在野评测来衡量发现能力，并暴露纯工程改进的失败模式
      尚未覆盖: 代理基准与真实科研效用的关系仍不清楚，话题和领域覆盖有限
    - 路线: 智能体科学发现的综述与概念组织，如 Agentic AI for Scientific Discovery 综述
      解决的问题: 整理跨领域能力、指标、框架和挑战，为假设生成与实验提供分类
      尚未覆盖: 这些分类能否预测智能体行为缺乏直接实证验证；伦理和可靠性问题仍未解决
    共识:
    - 执行反馈和领域检查有助于区分可辩护假设与无支撑主张。
    - 当前AI科学家系统能辅助发现，但尚未实现完全自主科研。
    - 人类判断或专家对比对评估新颖性、完整性和安全性仍很重要。
    - 基准和消融被用于暴露失败模式，而不仅是排名。
    分歧:
    - 监督方式：高杠杆点精准人工协作、完全自主、逐步人工监督之间存在差异。
