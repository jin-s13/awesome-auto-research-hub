  related_work_outline_zh:
  - 主流方向：以LLM智能体为核心，覆盖想法生成、实验执行、分析、写作与自动评审的端到端自主科研系统；近期进一步分化为专业验证型系统与证据基准评测。
  - 研究共性：将科学发现建模为从假设或目标到实验、书面声明与评审的多步闭环；LLM智能体承担主要执行，逐步引入检索、树搜索和有效性检查。
