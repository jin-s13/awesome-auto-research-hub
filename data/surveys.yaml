  - 主流方向：构建LLM驱动的自主科研智能体，覆盖想法生成、实验执行和论文撰写；可靠性与治理通过验证门控、实时监控和基于事实的报告体现。
  - 研究共性：多阶段智能体流程运行实验，用基线、人类或评审信号评估任务成功率、工件质量或论文式接受度；部分系统加入有效性门控以捕获静默失败。
