    - line: Domain-specific discovery agents with verification gates
      what_it_solves: Adds field-specific validity checks, such as logical proof audits
        or physics-aware flow inspection, before accepting results or writing conclusions.
      what_remains_open: Gate coverage is domain-bound and imperfect; demonstrated
        failures still escape, and transfer to other scientific domains or problem
        types is not shown.
    - line: Evaluation and evidence design for discovery agents
      what_it_solves: Provides tasks and evidence-grounded metrics for comparing whether
        agents complete discovery cycles, produce explanatory knowledge, and form
        defensible claims.
      what_remains_open: Automated judges and completion metrics are proxy signals;
        task coverage, base-model generalization, and alignment with real scientific
        utility remain unresolved.
    - line: Iterative search, self-improvement, and manuscript generation
      what_it_solves: Improves hypothesis selection and report quality through tree
        search, feedback loops, knowledge retrieval, and reduced human code-template
        reliance.
      what_remains_open: Pass rates are inconsistent, improvement is not clearly separated
        from backbone-model or task-specific priors, and evidence is concentrated
        at workshop-level or LLM-rubric evaluation.
