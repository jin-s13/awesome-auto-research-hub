  related_work_outline:
  - 'Mainstream direction: Autonomous LLM-based research agents dominate the evidence,
    emphasizing end-to-end scientific workflows from research synthesis and reasoning
    to paper generation, with evaluation increasingly framed as evidence maturity
    for open-ended discovery.'
  - 'Shared research pattern: Multi-agent or self-evolving systems are paired with
    curated benchmarks and automated LLM judges; outputs are scored for analytical
    execution, auditability, and novelty while human baselines or review remain limited.'
  - 'Key differences: One stream optimizes generation pipelines and self-evolution,
    another builds blind evidence-grounded benchmarks in general or biological domains,
    and a third organizes taxonomies of agentic scientific capabilities and challenges.'
  - 'Trend evolution: Within 2025-2026, the frontier has moved from domain surveys
    and human-baseline benchmarks toward self-evolving frameworks and failure-mode
    case studies; dedicated literature search, citation analysis, and gap-discovery
    evidence is still sparse.'
  - 'Open questions: Whether automated rubric rankings predict trustworthy conclusions,
    whether single-base-model and narrow-domain findings generalize, and how to independently
    evaluate literature search, citation analysis, and research gap discovery.'
  related_work_outline_zh:
  - 主流方向：自主 LLM 研究智能体占据证据主导，强调从研究综合、推理到论文生成的端到端科研流程，评测越来越偏向开放发现的证据成熟度。
  - 研究共性：多智能体或自进化系统常与精选基准和自动 LLM 评判配对；输出主要按分析执行、可审计性和新颖性评分，人类基线或评审仍然有限。
  - 关键差异：一类工作优化生成流水线与自进化，另一类构建通用或生物领域的盲测证据基准，还有一类对智能体科研能力和挑战进行综述分类。
  - 趋势演进：2025–2026 的前沿已从领域综述和人类基线基准演进到自进化框架与失败模式案例；专门的文献搜索、引文分析和研究空白发现证据仍稀缺。
  - 开放问题：自动评分排序是否能预测可信结论，单一基座模型与窄领域发现是否能泛化，以及如何独立评测文献搜索、引文分析与研究空白发现。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research generation systems
      what_it_solves: Automating multi-stage research workflows from literature synthesis
        and reasoning to experiment and manuscript generation, often through multi-agent
        collaboration, internal verification, or self-evolution.
      what_remains_open: Reliability under long-horizon execution and scientific taste;
        recurring failure modes include implementation drift, memory degradation,
        overexcitement, insufficient domain intelligence, and weak falsification controls.
    - line: Evidence-grounded evaluation benchmarks for discovery agents
      what_it_solves: Producing comparable tasks, frozen hidden evidence, automated
        rubric scoring, and sometimes human baselines to assess how well agents justify
        open-ended scientific claims.
      what_remains_open: Coverage across domains and base models is limited; evaluated
        agents cluster near a plateau and lack discriminating controls, robustness,
        falsifiability, and cross-dataset generalization.
    - line: Taxonomies and challenge synthesis for agentic scientific workflows
      what_it_solves: Organizing systems by scientific domain and capability, cataloging
        metrics, frameworks, datasets, and open challenges such as literature review
        automation and ethical reliability.
      what_remains_open: Direct empirical validation that these categories predict
        system behavior; literature review automation remains an unresolved challenge
        rather than a demonstrated capability.
    consensus:
    - The evidence centers on autonomous LLM-based research agents rather than standalone
      literature search, citation analysis, or review-synthesis systems.
    - Automation improves analysis execution, documentation, and paper assembly, but
      current evidence does not show it confers trustworthy scientific judgment or
      discriminating controls.
    - Automated evaluation still depends on frozen hidden evidence, curated rubrics,
      human baselines, or expert review to make claims comparable.
    disagreements:
    - 'Evaluation target differs: general evidence maturity for open-ended discovery
      versus domain-specific cell-annotation and discovery questions versus generated-paper
      rubric scoring.'
    - 'Interaction mode differs: collaborative principal-investigator and graduate-student
      setups versus fully autonomous coding agents versus survey-based taxonomies.'
    - 'Validation strategy differs: internal verification and self-evolution versus
      fixed LLM judges with hidden evidence versus human and multi-AI review.'
    - 'Deployment scope differs: domain-agnostic scalable frameworks compete with
      domain-specific benchmarks and single-base-model evaluations.'
    open_questions:
    - Which evaluation signals predict trustworthy literature conclusions or genuine
      scientific contribution beyond automated rubric rank?
    - Can current systems independently perform literature search, citation analysis,
      and research gap discovery, and what metrics would isolate those abilities?
    - How well do findings from single-base-model or narrow-domain benchmarks generalize
      across base models, scientific domains, and open-ended review tasks?
    - Several top entries lack reported limitations or cross-model evidence; these
      are verification gaps, not proof that missing checks are absent.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究生生成系统
      解决的问题: 从文献综合、推理论证到实验和论文生成的自动化多阶段研究流程，常依赖多智能体协作、内部验证或自进化机制。
      尚未覆盖: 长周期执行下的可靠性与科学品味；反复出现的失败模式包括实现漂移、记忆衰减、过度宣称、领域智能不足和证伪控制不足。
    - 路线: 面向发现智能体的证据级评测基准
      解决的问题: 通过可比较任务、冻结隐藏证据、自动评分规则以及有时人类基线，评估智能体为开放科学主张提供的证据成熟度。
      尚未覆盖: 领域和基座模型覆盖有限；受评智能体分数接近平台期，缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 路线: 智能体科研工作流的综述与挑战归纳
      解决的问题: 按科学领域和能力组织系统，梳理指标、框架、数据集以及文献综述自动化和伦理可靠性等开放挑战。
      尚未覆盖: 分类是否能预测系统行为缺乏直接实证；文献综述自动化仍是被识别出的挑战，而非已展示的能力。
    共识:
    - 证据集中在自主 LLM 研究智能体，而非独立的文献搜索、引文分析或综述合成系统。
    - 自动化提升了分析执行、文档记录和论文组装水平，但现有证据未显示其具备可信科学判断或判别性对照能力。
    - 自动评估仍需依赖冻结隐藏证据、精选评分规则、人类基线或专家评审，才能让主张具有可比性。
    分歧:
    - 评测目标不同：通用开放发现的证据成熟度、领域特定的细胞注释与发现题、或生成论文的评分标准。
    - 交互模式不同：首席研究员与研究生式协作、完全自主编码智能体、以及综述式分类框架并存。
    - 验证策略不同：内部验证与自进化机制、带隐藏证据的固定 LLM 评判、或人类与多 AI 评审各有侧重。
    - 部署范围不同：领域无关的可扩展框架与领域特定基准、单基座模型评估形成对比。
    开放问题:
    - 哪些评估信号能预测可信的文献结论或真实科学贡献，而不只是自动评分排序？
    - 当前系统能否独立完成文献搜索、引文分析和研究空白发现，需要什么指标来分离这些能力？
    - 基于单基座模型或窄领域基准的发现，在跨基座模型、跨科学领域和开放综述任务中如何泛化？
    - 多个头部条目缺少明确限制说明或跨模型证据，这属于验证缺口而非证明缺失的检查不存在。
