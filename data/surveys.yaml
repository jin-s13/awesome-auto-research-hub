  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery systems
      what_it_solves: Automates the full research cycle—ideation, coding, experimentation,
        and paper writing—reducing the cost and cycle time of producing paper-level
        scientific claims.
      what_remains_open: The generated claims often lack rigorous validation against
        real-world physical or biological ground truth; cross-domain generalization
        and reproducibility beyond the original demo scenarios are unverified.
    - line: Domain-embedded AI scientists with physical/logical verification
      what_it_solves: Adapts the autonomous pipeline to specialized sciences (applied
        math, CFD, bioinformatics) by embedding domain-specific verification gates,
        theoretical proof checkers, or physics-aware visual inspection.
      what_remains_open: Verification gates still miss a non-trivial fraction of silent
        failures (e.g., 2 of 16 in CFD); the approach assumes access to high-quality
        simulators or formal knowledge bases that are not available in many scientific
        fields.
    - line: Benchmarking and evaluation environments for AI scientists
      what_it_solves: Provides standardized tasks and metrics (task completion, explanation
        quality, domain-specific accuracy) to compare different AI scientist systems
        in a controlled setting.
      what_remains_open: Existing benchmarks simulate isolated discovery steps and
        do not capture the longitudinal, open-ended nature of true scientific progress;
        alignment between benchmark scores and real-world scientific impact is unknown.
    consensus:
    - Large language models serve as the central orchestration component for hypothesis
      generation, experimental design, and manuscript synthesis.
    - A built-in verification or review stage is necessary because raw model outputs
      are prone to hallucinations, logical errors, or silent experimental failures.
    - Current systems are not yet fully autonomous; they either require selective
      human intervention or exhibit high variance in output quality, as shown by inconsistent
      peer-review success rates.
    disagreements:
    - 'Human role: systems like AutoResearchClaw and ReasFlow assume a human principal
      investigator making high-level decisions, while The AI Scientist and AI Scientist-v2
      aim for full autonomy without loop-in human guidance.'
    - 'Verification strategy: approaches differ in whether they rely on automated
      LLM-based review, formal logical verification, vision-language physics gates,
      or verifiable result sanitization.'
    - 'Evaluation scope: some works evaluate via internal automated reviewers or workshop
      acceptance, while others use external benchmarks with predefined tasks and human
      baselines, making cross-system comparison difficult.'
    open_questions:
    - What is the minimal set of verification gates needed to guarantee the correctness
      of a multi-step scientific discovery pipeline?
    - How can we build an evaluation framework that captures the novelty, reproducibility,
      and long-term impact of AI-generated research, rather than just paper-level
      metrics?
    - Can domain-embedded AI scientists be extended to fields where reliable simulators
      or formal knowledge bases do not exist, such as parts of social sciences or
      clinical medicine?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现系统
      解决的问题: 自动化从构思、编码、实验到论文撰写的完整研究周期，降低产生论文级科学主张的成本和周期。
      尚未覆盖: 生成的主张通常缺乏对真实物理或生物真值的严格验证；跨领域泛化能力和原始演示场景之外的可复现性尚未证实。
    - 路线: 嵌入领域验证的AI科学家
      解决的问题: 将自主流水线适配到特定科学领域（应用数学、计算流体动力学、生物信息学），通过嵌入领域特定的验证门控、理论证明检查器或物理感知视觉检查来保证输出质量。
      尚未覆盖: 验证门控仍会漏检相当比例的静默失败（如CFD中16个失败漏检2个）；该方法假设能获取高质量仿真器或形式化知识库，但许多科学领域不具备此条件。
    - 路线: AI科学家评估基准与环境
      解决的问题: 提供标准化任务和指标（任务完成度、解释质量、领域准确率），以便在受控环境中比较不同AI科学家系统。
      尚未覆盖: 现有基准模拟孤立的发现步骤，无法捕捉真实科学进步的长期、开放式性质；基准分数与真实世界科学影响力之间的一致性未知。
    共识:
    - 大型语言模型是假设生成、实验设计和论文合成的核心编排组件。
    - 内置验证或评审阶段是必要的，因为原始模型输出容易产生幻觉、逻辑错误或静默实验失败。
    - 当前系统尚未实现完全自主；它们要么需要选择性人类干预，要么输出质量波动较大，这体现在同行评审接受率不一致上。
    分歧:
    - 人类角色：AutoResearchClaw和ReasFlow预设人类首席研究员进行高层决策，而The AI Scientist和AI Scientist-v2旨在实现无人类指导的全自主。
    - 验证策略：各系统分别依赖基于LLM的自动评审、形式逻辑验证、视觉-语言物理门控或可验证结果净化，方式明显不同。
    - 评估范围：部分工作通过内部自动评审或工作坊接受度评估，另一些使用带有预定义任务和人类基线的外部基准，导致跨系统比较困难。
    开放问题:
    - 要保证多步骤科学发现流水线的正确性，最少需要哪些验证门控？
    - 如何构建一个评估框架，既能捕捉AI生成研究的新颖性、可复现性和长期影响力，又不局限于论文级别的指标？
    - 在缺乏可靠仿真器或形式化知识库的领域（如部分社会科学或临床医学），如何扩展嵌入领域的AI科学家？
