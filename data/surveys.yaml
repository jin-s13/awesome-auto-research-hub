  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research-to-manuscript systems
      what_it_solves: Converting minimal research direction into paper drafts with
        code execution, visualizations, and self-evaluation; examples include fully
        automated discovery frameworks.
      what_remains_open: Workshop-level or rubric acceptance is inconsistent, with
        only one of three workshop submissions passing in evidence; full conference
        generalization is unproven.
    - line: Domain-specific discovery-to-writing systems
      what_it_solves: Embedding domain knowledge and physical or logical verification
        into paper generation for applied math and computational fluid dynamics.
      what_remains_open: 'Verification gates are incomplete: missed two of sixteen
        planted silent failures, and reliance on curated LLM-based rubrics limits
        external comparability.'
    - line: Verification, grounding, and self-correction for research reporting
      what_it_solves: Reducing fabricated metrics, hallucinated citations, and invalid
        execution before results are written; attributes failures to hypothesis, design,
        or implementation.
      what_remains_open: Gains are concentrated in code development and execution
        while conference-ready writing remains difficult; code and data artifact signals
        are inconsistent.
    - line: Human-AI collaborative research authoring
      what_it_solves: Placing human intervention at selected high-leverage decision
        points instead of full autonomy or exhaustive oversight.
      what_remains_open: The chosen intervention points are evaluated on a single
        experiment-stage benchmark; cross-domain generality and long-horizon authoring
        remain open.
    - line: Automated review and failure-mode analysis of generated scientific communication
      what_it_solves: Evaluating generated manuscripts at scale and documenting recurring
        failure modes to derive design principles.
      what_remains_open: Whether simulated or multi-AI review aligns with human expert
        judgment and whether documented failure categories predict future behavior
        lacks direct validation.
    consensus:
    - LLM-based rubrics, simulated peer review, or targeted benchmarks are the primary
      evaluation evidence for generated scientific writing.
    - Decomposing the research-to-writing workflow into multiple agents or modules
      is common and treats verification as a necessary stage before reporting.
    - Generated metrics and citations must be grounded to measured values to avoid
      hallucination and unverifiable reports.
    - Full autonomy remains inconsistent, and domain-specific gates or selective human
      involvement improve results.
    - Reproducibility evidence is uneven across code, dataset, and artifact availability,
      leaving verification gaps.
    disagreements:
    - 'Autonomy setting: some systems pursue minimal human intervention while others
      show targeted human collaboration outperforms full autonomy and exhaustive oversight.'
    - 'Verification signal: internal logical coherence checks, physics-based visual
      inspection, causal multi-hypothesis failure attribution, and grounded reporting
      differ in what they catch.'
    - 'Evaluation target: evidence uses simulated acceptance thresholds, workshop
      peer review, LLM rubric scores, and experiment-stage benchmark success, which
      are not interchangeable.'
    - 'Domain scope: general machine-learning research pipelines contrast with domain-specific
      applied mathematics and CFD systems where domain verification is required.'
    - 'Reporting rigor: outcomes range from full manuscripts judged by LLM or peer
      review to metric-bearing outputs and artifact-quality improvements.'
    open_questions:
    - Can autonomous writing systems reliably pass full conference peer review rather
      than isolated workshop acceptance?
    - Which verification signals generalize beyond domain-specific physics or mathematics
      contexts without missing silent failures?
    - How well do LLM-based or multi-AI reviewers align with human expert judgment
      on scientific communication quality?
    - What reproducibility claims can be supported when code, dataset, or artifact
      links are missing or incomplete?
    - How much of the observed improvement is attributable to the underlying model
      capability rather than the agent, verification, or collaboration architecture?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自动科研到论文生成系统
      解决的问题: 将简要研究提示转化为包含代码运行、可视化和自我评估的完整论文草案。
      尚未覆盖: 接受表现不稳定：证据中三篇工作坊提交仅一篇通过；完整会议泛化未被证明。
    - 路线: 领域专用发现到写作系统
      解决的问题: 在论文生成中嵌入领域知识、物理或逻辑验证，用于应用数学与计算流体动力学等场景。
      尚未覆盖: 验证门控仍遗漏部分静默失败，且依赖受限 LLM 评审基准，外部可比性不足。
    - 路线: 验证、事实约束与自我纠正
      解决的问题: 减少虚构指标、幻觉引用和无效执行，并将失败归因于假设、实验设计或实现。
      尚未覆盖: 改进主要集中在代码开发与执行，会议级写作仍有困难；代码和数据工件信号不一致。
    - 路线: 人机协作科研写作
      解决的问题: 在选定的高杠杆决策点加入人类干预，以替代全自动或逐步人工监督。
      尚未覆盖: 当前证据来自单一实验阶段基准，干预点在跨领域与长周期写作中的泛化未知。
    - 路线: 自动评审与失败模式分析
      解决的问题: 大规模评估生成论文，记录重复失败模式并提炼设计原则。
      尚未覆盖: 模拟或多 AI 评审与人类专家判断的一致性、失败分类能否预测行为尚缺验证。
    共识:
    - LLM 评审标准、模拟同行评审或专项基准是当前评估生成科研写作的主要证据。
    - 将科研到写作流程拆分为多智能体或多模块是共同做法，并普遍在报告前加入验证阶段。
    - 生成指标和引用需要与实测结果绑定，以避免幻觉和不可验证的报告。
    - 完全自主仍不稳定，领域门控或有选择的人类介入能提升结果质量。
    - 代码、数据集和工件可复现性证据不均衡，存在验证空白。
    分歧:
    - 自主设置：一些系统追求最少人类干预，另一些证据显示精准人机协作优于全自动和逐步监督。
    - 验证信号：内部逻辑一致性、物理视觉检查、多假设失败归因和事实约束报告各有差异。
    - 评测目标：模拟接受阈值、工作坊同行评审、LLM 评分和实验阶段基准成功率不可互换。
    - 领域范围：通用机器学习流程与领域专用的应用数学和 CFD 系统存在差异。
    - 报告严谨性：有的生成完整论文并由 LLM 或同行评审，有的只报告带指标的输出和工件质量。
    开放问题:
    - 自主写作系统能否稳定通过完整会议同行评审，而不只是孤立的工作坊接收？
    - 哪些验证信号可泛化到领域专用物理或数学场景之外，并避免漏检静默失败？
    - LLM 或多 AI 评审与人类专家对科学表达质量的判断是否一致？
    - 当代码、数据集或工件链接缺失或不完整时，可复现性如何验证？
    - 所观察到的提升中，多少来自底层模型能力，多少来自智能体、验证或协作架构？
