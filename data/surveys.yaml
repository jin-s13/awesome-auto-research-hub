  literature_review:
    line_of_work_matrix:
    - line: State and representation modeling for long-horizon hypothesis search
      what_it_solves: Turns fragmented literature and data-analysis signals into a
        shared predictive state so agents can sustain coherent cycles of hypothesis
        generation and reporting.
      what_remains_open: Whether the shared state remains sufficient outside the tested
        domains, objectives, and 20-cycle horizon.
    - line: Action-conditioned control and planning for agentic research workflows
      what_it_solves: Connects hypothesis proposals to concrete next actions such
        as branching, backtracking, code execution, self-healing, and targeted human
        intervention.
      what_remains_open: How much improvement comes from the workflow or planner versus
        the base model, tools, or task-specific feedback loop.
    - line: Evaluation and evidence design
      what_it_solves: Makes automated discovery claims comparable through benchmarks,
        baselines, accuracy ratings, and task-difficulty or error analysis.
      what_remains_open: Whether benchmark performance and statement accuracy align
        with scientific validity, reproducibility, and real discovery utility across
        domains.
    - line: Systems and reproducible infrastructure
      what_it_solves: Packages literature search, data analysis, code interpreters,
        report synthesis, and cross-run evolution into runnable multi-agent stacks
        with artifact signals.
      what_remains_open: Standardized external validation across hardware, datasets,
        lab settings, and independent reproduction of claimed discoveries.
    - line: Conceptual taxonomy and theory
      what_it_solves: Organizes autonomous research into workflow stages, autonomy
        conditions, and evaluation dimensions rather than isolated system descriptions.
      what_remains_open: Direct empirical evidence that the proposed autonomy conditions
        and evaluation dimensions predict system reliability or discovery quality.
    consensus:
    - Hypothesis generation is treated as an iterative loop in which literature or
      data evidence is used to propose, test, and refine hypotheses rather than as
      a single inference step.
    - Most systems separate responsibility across literature search, data analysis,
      execution, and reporting roles, with traceability of claims to code or sources.
    - Autonomy is more credible in structured, executable, and quickly verifiable
      settings, while embodied, delayed, ethical, or institutionally accountable contexts
      remain limited.
    disagreements:
    - 'Hypothesis generation mechanisms differ: structured debate versus tree-based
      branching and backtracking versus evolutionary-systematic ideation versus direct
      iterative LLM optimization.'
    - Success is evaluated in different settings, including general research benchmarks,
      laboratory biological validation, symbolic equation recovery, and algorithm
      or control performance.
    - 'Human oversight is treated differently: full autonomy, targeted collaboration
      at high-leverage decision points, or semi-autonomous lab-in-the-loop workflows.'
    - 'Evidence strength differs: some work reports benchmark deltas, some expert-rated
      statement accuracy, some experimental validation, and the disclosed limitations
      or artifacts vary.'
    open_questions:
    - Can statement accuracy, currently rated around 79.4% in one long-horizon setup,
      be improved while retaining autonomous discovery breadth?
    - Do scaling gains observed up to 20 cycles continue without degradation, and
      under what conditions?
    - How should evaluation metrics be redesigned so benchmark scores and accuracy
      ratings predict genuine scientific validity and reproducibility?
    - Which human intervention points are both necessary and sufficient to catch weak
      hypotheses without falling back to exhaustive step-by-step oversight?
    - How can systems reject weak directions earlier and preserve evidence, provenance,
      and reproducibility across diverse domains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向长周期假设搜索的状态与表征建模
      解决的问题: 把文献搜索和数据分析信号整合为共享预测状态，使智能体能在假设生成、验证和报告之间维持连贯循环。
      尚未覆盖: 该共享状态在已测领域、目标和20轮循环之外的适用性未知。
    - 路线: 面向智能体研究工作流的动作条件控制与规划
      解决的问题: 将假设提案转化为分支、回溯、代码执行、自愈和精准人工干预等具体动作。
      尚未覆盖: 性能提升中有多少来自工作流设计而非基座模型、工具或任务反馈，尚未分离。
    - 路线: 评测与证据设计
      解决的问题: 通过基准、基线、准确率评价和难度分析，使自动化发现主张具备可比性。
      尚未覆盖: 基准指标和陈述准确率是否等同于科学有效性、可复现性与真实发现效用仍存疑。
    - 路线: 系统与可复现基础设施
      解决的问题: 把文献搜索、数据分析、代码解释器、报告合成和跨轮演化集成为可运行的智能体系统与工件。
      尚未覆盖: 跨硬件、数据集、实验室条件及独立复现的外部验证仍缺乏统一标准。
    - 路线: 概念分类与理论
      解决的问题: 将自主研究组织为工作流阶段、自主性条件和评估维度，避免孤立的系统描述。
      尚未覆盖: 这些分类和评估维度能否真实预测系统可靠性或发现质量，仍缺乏直接实证。
    共识:
    - 假设生成被普遍视为迭代循环：从文献或数据证据中提出假设，通过实验或代码执行获得反馈并持续修正。
    - 多数系统将文献搜索、数据分析、执行和报告模块化，并强调结论可追溯到代码或来源。
    - 研究普遍承认自动自主性在结构化、可执行且快速可验证的场景中更可靠，在具身或伦理约束场景中仍受限。
    分歧:
    - 假设生成机制存在差异：结构化辩论、树形分支与回溯、进化-系统化构思、直接迭代式LLM优化。
    - 成功评测场景不同：通用研究基准、实验室生物验证、符号方程恢复、算法或控制性能等。
    - 人类监督力度不同：完全自主、高杠杆点定向协作、半自主实验室在环等。
    - 证据强度不同：有些报告基准分数，有些报告专家评分准确率或实验验证，局限性和工件公开程度也不一致。
    开放问题:
    - 当前长周期场景中约79.4%的报告陈述准确率如何在保持发现广度的同时继续提升？
    - 已观察到的发现数量随20轮循环线性增长是否会在更长周期下退化？
    - 如何让基准分数和准确率评价更好地对应于真实科学有效性与可复现性？
    - 哪些人类干预点能必要且充分地拦截弱假设，同时避免退化为逐步监督？
    - 系统如何在早期拒绝弱方向，并在跨领域研究中保存证据和来源追踪？
