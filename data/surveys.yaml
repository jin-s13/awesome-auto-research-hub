  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous manuscript generation and experimental research
        pipelines (e.g., The AI Scientist, AI Scientist-v2)
      what_it_solves: Automates research idea generation, code execution, result visualization,
        manuscript drafting, and review simulation for full scientific papers.
      what_remains_open: Verification gates and failure detection remain incomplete,
        and success is often judged by LLM-based review or selective workshop acceptance
        rather than broad external validation.
    - line: Domain-aware verification and knowledge-based discovery systems (e.g.,
        ReasFlow, AI CFD Scientist)
      what_it_solves: Uses domain-specific logic, physics, or mathematical verification
        so generated papers contain more defensible theoretical or empirical claims.
      what_remains_open: Evidence is limited to selected domains such as applied mathematics
        and fluid dynamics, and even domain-specific gates still miss some silent
        failures.
    - line: Human-AI collaborative and self-correcting research workflows (e.g., AutoResearchClaw,
        SAGE)
      what_it_solves: Reduces autonomous research failures through targeted human
        intervention, structured debate, self-healing execution, failure attribution,
        and grounded reporting.
      what_remains_open: Which intervention points safely generalize across research
        stages and how to keep human effort low without losing reliability are not
        established.
    - line: Evaluation and diagnostic evidence design for automated research writing
        (e.g., Why LLMs Aren't Scientists Yet)
      what_it_solves: Makes claims about automated research comparable through reviewer
        rubrics, failure-mode case studies, task success rates, artifact quality scores,
        and peer-review attempts.
      what_remains_open: Samples are small, LLM-reviewer bias is not separated from
        human judgment, and standardized external validation across datasets, domains,
        and reviewers is missing.
    consensus:
    - Large language model agents can now produce complete manuscripts and operate
      over at least part of the experimental research process.
    - A validity or reporting gate is needed to reduce fabricated numbers, hallucinated
      citations, and premature success claims.
    - Fully autonomous systems remain brittle; domain-specific verification or targeted
      human collaboration improves defensibility.
    - Evaluation of generated papers is still dominated by LLM-based rubrics, small
      peer-review attempts, or narrow task evidence rather than standardized external
      evidence.
    disagreements:
    - Autonomy level differs from fully autonomous pipelines to systems with multiple
      human intervention modes or targeted high-leverage human decisions.
    - 'Verification mechanisms differ: internal logical auditing, visual-language
      physics inspection, multi-hypothesis causal failure attribution, and fact-constrained
      reporting.'
    - Success criteria differ from domain-specific physical error reduction to experiment-stage
      success rate, artifact quality, LLM reviewer scores, or peer-review acceptance.
    - Generality strategy differs between general machine-learning research workflows
      and systems constrained by mathematical or physical knowledge.
    open_questions:
    - Do LLM-based review rubrics and automated reviewers track human peer-review
      acceptance across domains?
    - Which verification mechanisms can generalize beyond engineered domain-specific
      logic or physics checks?
    - How much of the reported gain comes from the underlying large model, human-in-the-loop
      intervention, or system architecture?
    - Which long-horizon failure modes remain unresolved beyond implementation drift,
      memory degradation, overexcitement, and weak scientific taste?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自动论文生成与实验研究管线（如 The AI Scientist、AI Scientist-v2）
      解决的问题: 自动完成研究构思、代码执行、结果可视化、论文起草与评审模拟。
      尚未覆盖: 验证门控和失败检测仍不完整，成功常由LLM评审或选择性工作坊接收判断，缺乏广泛外部验证。
    - 路线: 领域感知验证与基于知识的发现系统（如 ReasFlow、AI CFD Scientist）
      解决的问题: 用领域逻辑、物理或数学验证，使生成论文中的理论或实证结论更具可辩护性。
      尚未覆盖: 证据集中在应用数学和流体动力学等少数领域，领域专用门控仍会遗漏部分静默失败。
    - 路线: 人机协作与自纠正研究工作流（如 AutoResearchClaw、SAGE）
      解决的问题: 通过目标化人工干预、结构化辩论、自愈执行、失败归因和事实约束报告来降低自主研究失败。
      尚未覆盖: 哪些干预点能跨研究阶段泛化，以及如何在保持可靠性同时控制人力成本仍不明确。
    - 路线: 面向自动研究写作的评测与诊断证据设计（如 Why LLMs Aren't Scientists Yet）
      解决的问题: 通过评审评分、失败模式案例、任务成功率、工件质量评分和同行评审尝试，让自动研究主张可比较。
      尚未覆盖: 样本量小，LLM评审偏差尚未与人类判断分离，缺少跨数据集、跨领域和跨评审者的标准化外部验证。
    共识:
    - 大语言模型智能体已能生成完整手稿，并至少能运行部分实验研究过程。
    - 需要有效性或事实约束门控来减少编造数字、幻觉引用和过早宣布成功。
    - 完全自主系统仍脆弱；领域专用验证或目标化人类协作能提高可辩护性。
    - 生成论文评测仍以LLM评分标准、小规模同行评审或窄任务证据为主，缺少标准化外部证据。
    分歧:
    - 自主程度从完全自主流水线到多模式人机协作或目标化高杠杆人工决策不等。
    - 验证机制不同，包括内部逻辑审计、视觉语言物理检查、多假设因果失败归因和事实约束报告。
    - 成功标准不同，包括领域物理误差下降、实验阶段成功率、工件质量、LLM评审分数或同行评审接受。
    - 通用性策略不同：通用机器学习研究流程与受数学或物理知识约束的领域系统存在差异。
    开放问题:
    - LLM评审评分与自动化评审员能否跨领域预测人类同行评审接受？
    - 哪些验证机制能超越工程化的领域专用逻辑或物理检查而泛化？
    - 报告的性能提升中有多少来自底层大模型、人机协作或系统架构本身？
    - 除了实现漂移、记忆退化、过度兴奋和科学品味薄弱，还有哪些长周期失败模式尚未被解决？
