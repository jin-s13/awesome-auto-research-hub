  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation agents
      what_it_solves: Compresses ideation, code execution, experiment analysis, visualization,
        and scientific writing into a single agentic pipeline, reducing per-paper
        cost and manual effort.
      what_remains_open: Success is uneven and long-horizon reliability remains weak;
        fully autonomous conference-ready papers are still exceptions rather than
        a validated general capability.
    - line: Verification and self-correction loops
      what_it_solves: Detect logical inconsistency, physically implausible results,
        hallucinated metrics, or failed executions before they enter the manuscript.
      what_remains_open: Verification is incomplete and domain-specific; silent failures
        can still pass, and transfer across fields is not established.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Inserts human judgment at selected decision points to improve
        research quality without exhaustive step-by-step supervision.
      what_remains_open: The optimal intervention granularity and its benefit across
        topics are not standardized or sufficiently measured beyond limited benchmarks.
    - line: Benchmarking and automated review for AI researchers
      what_it_solves: Provides task suites, rubrics, or peer-review-style evaluations
        to compare autonomous research pipelines.
      what_remains_open: Automated and workshop-level metrics may not capture novelty,
        reproducibility, domain correctness, or long-term scientific value.
    - line: Failure-mode analysis and design principles
      what_it_solves: Systematizes recurring failure patterns in autonomous research,
        such as implementation drift, memory degradation, and premature success claims.
      what_remains_open: The proposed design principles lack direct empirical evidence
        that they predict improved downstream research outcomes across domains.
    consensus:
    - Agentic workflows consistently cover ideation, experiment execution, validation,
      and manuscript drafting rather than treating paper writing as an isolated step.
    - Some form of verification, review, or gatekeeping is considered necessary to
      guard against fabricated or unsupported results.
    - Fully autonomous systems remain fragile; recent designs add self-correction,
      targeted human oversight, or failure diagnosis to improve robustness.
    - Evaluation relies on automated reviewers, curated rubrics, or benchmark scores,
      but peer-review acceptance is still rare and narrow.
    - Reproducibility signals such as open-source artifacts, code, or benchmarks are
      uneven and should not be conflated with methodological quality.
    disagreements:
