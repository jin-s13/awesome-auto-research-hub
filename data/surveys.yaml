  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: Automates the full research loop from hypothesis generation
        and execution to paper writing and reviewing.
      what_remains_open: Inconsistent acceptance; only some outputs pass human peer
        review, and full conference-ready generation remains unresolved.
    - line: Domain-specific verification-gated writing
      what_it_solves: Adds logical or physics-aware checks before writing so reported
        results resist silent execution errors.
      what_remains_open: Verification gates still miss failures, as in the 2-of-16
        missed silent-failure ablation, and generalization across domains is unproven.
    - line: Human-AI collaborative research communication
      what_it_solves: Introduces expert intervention at high-leverage points to improve
        reliability over full autonomy or step-by-step oversight.
      what_remains_open: Intervention modes and timing are evaluated on a limited
        benchmark; real expert cost and scalability are unclear.
    - line: Failure attribution and self-correction
      what_it_solves: Diagnoses why experiments fail and routes corrections to hypothesis,
        design, or implementation while grounding reports in measured values.
      what_remains_open: Fully autonomous, conference-ready scientific writing is
        still difficult, and long-horizon robustness is not established.
    - line: Automated review and generated-paper evaluation
      what_it_solves: Uses LLM review rubrics, blind scores, benchmark rankings, or
        workshop peer review to compare generated manuscripts.
      what_remains_open: Alignment between proxy review signals and human peer-review
        or long-term research utility is not yet demonstrated.
    consensus:
    - Manuscript writing is embedded as the final reporting stage of an autonomous
      research pipeline rather than addressed as a standalone drafting tool.
    - Systems commonly decompose work into multi-agent modules covering ideation,
      execution, verification, and reporting.
    - Internal verification or reflection is treated as necessary before claims are
      written, though the verification target varies.
    - Human oversight or targeted intervention can improve reliability over fully
      autonomous loops.
    - LLM-based review and workshop acceptance are recurring evaluation signals, but
      consistency and alignment evidence remain limited.
    disagreements:
    - General-purpose ML research generation differs from domain-specific systems
      that add mathematical or physical validity checks before writing.
    - Full autonomy and human-in-the-loop designs differ in how much expert intervention
      is assumed or desired.
    - 'Reporting style differs: some systems constrain text to measured values, while
      others generate rubric-scored full manuscripts.'
    - 'Evaluation settings differ: simulated LLM reviewers, benchmark rankings, blind
      scores, and workshop peer review emphasize different acceptance signals.'
    - Verification mechanisms differ, including logical coherence, rendered flow-field
      inspection, and causal failure attribution, so different silent failures are
      covered.
    open_questions:
    - To what extent do LLM-based review scores predict human peer-review acceptance
      and long-term scientific utility?
    - Can domain-specific verification gates generalize beyond the demonstrated tasks,
      such as a CFD correction evaluated on one flow configuration?
    - Which human intervention modes and frequency points most improve research writing
      reliability without excessive expert load?
    - How can documented failure modes such as implementation drift, memory degradation,
      and training-data bias be reduced across long-horizon writing?
    - Do current benchmarks separate execution failure, verification failure, and
      writing quality clearly enough to guide system improvement?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究与论文生成
      解决的问题: 将假设生成、实验执行、论文撰写和评审整合为自动化研究闭环
      尚未覆盖: 输出接受率不稳定，完整会议级论文生成尚未解决
    - 路线: 领域特定验证门控写作
      解决的问题: 在成文前加入逻辑或物理检查，减少静默执行错误进入报告
      尚未覆盖: 验证门仍会漏检，如16个植入失败中漏掉2个，跨领域泛化未证明
    - 路线: 人机协作研究沟通
      解决的问题: 在高杠杆节点引入专家干预，提升全自主或逐步监督之外的可靠性
      尚未覆盖: 干预模式与时机仅在有限基准上评估，真实专家成本和规模化不明确
    - 路线: 失败归因与自纠正
      解决的问题: 诊断实验失败原因并路由到假设、设计或实现，同时把报告约束到实测值
      尚未覆盖: 完全自主、可投会议的写作仍困难，长周期稳健性尚未建立
    - 路线: 自动评审与生成论文评估
      解决的问题: 用LLM评审、盲评、基准排名或工作坊同行评审比较生成论文
      尚未覆盖: 代理评审与人类同行评审或长期研究效用之间的一致性未验证
    共识:
    - 论文写作被嵌入自主研究流程的最终报告阶段，而非独立草稿工具
    - 系统普遍采用多智能体模块化分解，覆盖构思、执行、验证和报告
    - 在写入结论前引入内部验证或反思被认为是必要的，但验证对象不同
    - 人类监督或精准干预相对全自主流程能提升可靠性
    - LLM评审和工作坊接收是常见评估信号，但其一致性和对齐证据有限
    分歧:
    - 通用机器学习研究生成与领域专用系统在写前加入数学或物理校验的路径不同
    - 全自主与人机回路设计对专家干预程度的假设不同
    - 报告方式不同：有的约束到实测值，有的按评分生成完整论文
    - 评估设置不同：模拟LLM评审、基准排名、盲评、工作坊同行评审强调不同接受信号
    - 验证机制不同：逻辑一致性、渲染流场检查、因果失败归因覆盖不同静默失败
