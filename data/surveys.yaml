  related_work_outline:
  - 'Mainstream direction: Agentic systems that generate hypotheses, execute experiments,
    verify results, and report findings in closed scientific workflows.'
  - 'Shared research pattern: Coupling LLM-driven ideation with execution feedback,
    validity or verification gates, and baselines to turn proposals into measurable
    artifacts.'
  - 'Key differences: Interaction mode ranges from full autonomy to targeted human
    oversight; verification uses physics-aware visual gates, deterministic program
    authorities, or grounded reporting; evaluation spans domain-specific discovery
    and general engineering benchmarks.'
  - 'Trend evolution: The 2025-2026 frontier shifts from surveying agentic scientific
    discovery and building benchmarks toward operational research agents with self-correction,
    verifiable reporting, and human collaboration.'
  - 'Open questions: Whether gains reflect true domain insight versus engineering
    tricks, how well benchmark scores predict real scientific utility, and how to
    generalize beyond narrow case studies and silent-failure detection gaps.'
  related_work_outline_zh:
  - 主流方向：以智能体生成假设、执行实验、验证结果并报告发现的闭环科研工作流。
  - 研究共性：将LLM驱动的构思与执行反馈、有效性或验证门控和基线比较结合，把想法转化为可测量的工件。
  - 关键差异：交互模式从完全自主到精准人机监督；验证依赖物理感知视觉门控、确定性程序权威或事实约束报告；评测覆盖领域发现与通用工程基准。
  - 趋势演进：从2025年的综述与基准建设，转向2026年具备自我纠正、可验证报告和人机协作的自主研究智能体。
  - 开放问题：提升是否来自真正领域洞见还是工程技巧，基准分数能否代表真实科研效用，以及能否超越狭窄案例和静默失败检测缺口。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous ideation and experiment loops
      what_it_solves: Turns an initial research goal into executable experiments,
        code modifications, and empirical findings without manual step-by-step control.
      what_remains_open: Validation outside task-specific domains; proof that proposed
        hypotheses carry domain insight rather than local engineering gains.
    - line: Verification, failure attribution, and grounded reporting
      what_it_solves: Reduces fabricated or physically invalid results by adding visual,
        deterministic, or measurement-based checks and by tracing failures to intervention
        levels.
      what_remains_open: Detectors still miss silent failures; failure attribution
        has not been shown to generalize across domains or hardware settings.
    - line: Human-AI collaborative research platforms
      what_it_solves: Provides oversight modes, dashboards, and interactive control
        so human judgment can shape idea selection, execution, and result interpretation.
      what_remains_open: Optimal intervention granularity and external validation
        beyond small internal case studies.
    - line: Benchmarks and human-comparison testbeds
      what_it_solves: Makes AI scientist claims comparable through curated datasets,
        baselines, multi-domain tasks, and human performance baselines.
      what_remains_open: Proxy scores do not yet establish real discovery utility;
        benchmark coverage is limited and often domain-specific.
    - line: Surveys and organization of agentic discovery capabilities
      what_it_solves: Organizes systems, metrics, frameworks, and challenges across
        scientific domains to expose common failure modes and directions.
      what_remains_open: Category-based claims lack direct empirical validation that
        taxonomies predict reliability or discovery outcomes.
    consensus:
    - Executed feedback is necessary for research agents to produce meaningful artifacts;
      ideation alone is insufficient.
    - Verification gates and grounded reporting improve reliability and reduce hallucinated
      or fabricated results.
    - Targeted human involvement at high-leverage decisions can outperform both full
      autonomy and exhaustive step-by-step oversight.
    - Current agents make stronger gains on implementation, code execution, and engineering
      metrics than on autonomous scientific insight.
    - Evaluation is still narrow in domain coverage and lacks standardized external
      validation across scientific settings.
    disagreements:
    - 'Systems differ in interaction mode: fully autonomous or self-correcting loops
      versus interactive human oversight.'
    - 'Verification approaches differ: physics-aware visual inspection, deterministic
      program authorities and evaluation, and measurement-constrained reporting.'
    - 'Evaluation targets differ: domain-specific scientific discovery tasks, general
      scientific ML engineering benchmarks, and qualitative expert preference on case
      studies.'
    - Methods disagree on whether gains are due to generated hypotheses or primarily
      to ML engineering tricks and local sweeps.
    - Benchmarks and human baselines differ in scope, creating separate evidence standards
      for scientific competence.
    open_questions:
    - Can validity gates be made reliable enough to detect all silent failures, given
      evidence that some planted failures were missed?
    - How can evaluation separate domain-level scientific insight from engineering
      overfitting and novelty miscalibration?
    - What is the optimal granularity and timing of human collaboration for different
      research stages and domains?
    - Do existing experiment-stage, single-cell, and best-model improvement benchmarks
      predict real scientific discovery utility?
    - How well do these systems transfer across datasets, hardware, and scientific
      domains beyond the narrow cases reported?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主构思与实验循环
      解决的问题: 把初始研究目标转化为可执行实验、代码修改和经验发现，无需逐步人工控制。
      尚未覆盖: 在任务特定领域之外缺乏验证；难以证明假设带来的是领域洞见而非局部工程提升。
    - 路线: 验证、失败归因与事实约束报告
      解决的问题: 通过视觉、确定性或测量约束检查，以及把失败追溯到干预层级，减少伪造或物理无效结果。
      尚未覆盖: 门控仍会漏掉静默失败；失败归因尚未在跨领域、跨硬件设置中证明可泛化。
    - 路线: 人机协作研究平台
      解决的问题: 提供监督模式、仪表板和交互控制，使人的判断参与想法选择、执行和结果解释。
      尚未覆盖: 最优干预粒度和外部验证仍不明确，现有证据多来自小规模内部案例。
    - 路线: 基准与人类对比测试集
      解决的问题: 通过精选数据集、基线、多领域任务和人类基线，使AI科学家主张可比。
      尚未覆盖: 代理分数尚未证明真实发现效用；覆盖范围有限且多为领域特定。
    - 路线: 智能体发现能力综述与分类
      解决的问题: 按领域和能力组织系统、指标、框架与挑战，揭示常见失败模式和方向。
      尚未覆盖: 分类是否预测可靠性或发现结果缺乏直接实证验证。
    共识:
    - 执行反馈对研究智能体产出有效工件是必要的，仅有想法生成不够。
    - 验证门控和事实约束报告可提高可靠性，减少幻觉或伪造结果。
    - 在高杠杆决策点的精准人类参与可优于完全自主和逐步详尽监督。
    - 当前智能体在实现、代码执行和工程指标上的提升强于自主科学洞见。
    - 评估仍受领域覆盖狭窄限制，缺乏跨科学设置的标准化外部验证。
    分歧:
    - 系统在交互模式上不同：完全自主或自纠正循环，对比交互式人类监督。
    - 验证方式不同：物理感知视觉检查、确定性程序权威与规范评估、以及测量约束报告。
    - 评测目标不同：领域特定科学发现任务、通用科学ML工程基准和定性专家偏好。
    - 对提升来源存在分歧：是生成假设本身带来科学进展，还是主要是ML工程技巧和局部调优。
    - 基准和人类基线范围不同，形成不同的科学能力证据标准。
    开放问题:
    - 门控能否可靠检测所有静默失败，鉴于已有证据显示部分植入失败被漏检？
    - 如何区分领域级科学洞见与工程过拟合、新颖性误判？
    - 人类协作在何种粒度和时间点对不同研究阶段和领域最优？
    - 现有多主题实验基准、单细胞问答基准和最优模型改进基准是否预测真实科学发现效用？
    - 这些系统在数据集、硬件和科学领域之间的可迁移性如何，现有报告是否过于狭窄？
