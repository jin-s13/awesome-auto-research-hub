    - 路线: 评测与证据设计
      解决的问题: 创建基准测试、任务和基线比较，使自主研究智能体的主张可测试和可比较，包括人类表现基线以锚定能力声明。
      尚未覆盖: 多样科学领域的覆盖，以及代理指标（如自动评审分数、任务完成率）与生成研究的实际下游效用之间的一致性。
    - 路线: 概念分类与理论
      解决的问题: 将自主研究智能体的失败模式、设计原则和纠正策略组织为结构化的理解，解释为什么当前系统不可靠，以及如何改进。
      尚未覆盖: 直接实证验证所提出的分类法（如失败模式、干预级别）能否预测和改善智能体在新的、未见任务中的行为。
    共识:
    - 当前基于LLM的自主研究智能体尚无法在没有人类干预的情况下完成完全可靠、端到端的科学发现。
    - 外部验证机制——无论是自动评审、人类基线比较还是基于物理的检查——对于防止静默失败和使声明可信至关重要。
    - 基准测试和标准化的评估环境对于衡量进展至关重要，虚拟环境和领域特定数据集的创建证明了这一点。
    - 研究社区需要更好的可复现基础设施，包括代码发布、工件管理和沙箱化执行。
    分歧:
    - 评估目标的选择：一些工作依赖自动评审或任务完成分数，而另一些要求人类专家判断或领域特定的物理有效性检查。
    - 智能体的范围：通用框架假设单一系统可以处理多个研究领域，而领域专用智能体则嵌入物理或生物学约束以提高可靠性。
    - 失败的处理方式：事后分析在事实发生后记录失败模式，而主动自我纠正机制试图在研究循环中诊断和修复错误。
    - 自主化程度：一些系统旨在完全自主生成论文，而另一些则专注于交互式人机协同平台，支持而非取代研究人员。
    开放问题:
