  - 'Mainstream direction: Closed-loop agentic research pipelines that turn hypotheses
    into executable experiments, evidence-grounded iteration, and report generation,
    with verification, self-healing, and graded human oversight.'
  - 'Shared research pattern: Structured LLM agents generate hypotheses from dataset
    diagnostics or literature, execute code or experiments, evaluate against baselines,
    and feed failures back to refine subsequent research directions.'
  - 'Key differences: Autonomy-control split varies from deterministic program authority
    to targeted human intervention; search structure varies from evolutionary tree/backtracking
    to parallel iterative cycles; evaluation ranges from domain tasks to broad benchmarks.'
  - 'Trend evolution: The 2025-2026 frontier is shifting from isolated LLM hypothesis
    proposers toward multi-agent autonomous research systems with traceable reporting,
    evidence grounding, and benchmark-based comparison.'
  - 'Open questions: Whether report accuracy and fact provenance can improve, how
    findings scale beyond short run-lengths, and whether proxy benchmarks align with
    real scientific utility remain underspecified.'
  related_work_outline_zh:
  - 主流方向：闭环智能体研究流水线，将假设转化为可执行实验、证据驱动的迭代与报告生成，并加入验证、自愈和分级人类监督。
  - 研究共性：结构化LLM智能体从数据诊断或文献中生成假设，执行代码或实验，对照基线评估，并将失败反馈用于细化后续研究方向。
  - 关键差异：自主-控制分离方式不同，从确定性程序权威到精准人类干预；搜索结构从进化树/回溯到并行迭代循环；评测从领域任务到通用基准。
  - 趋势演进：2025-2026前沿正从孤立LLM假设提出器转向多智能体自主研究系统，强调可追溯报告、证据基础和基准比较。
  - 开放问题：报告准确性和来源追踪能否改进、发现能否在更长周期扩展、代理基准是否对应真实科学效用，这些问题仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Shared evidence-state representation across agents
      what_it_solves: Maintains a coherent structured representation linking data
        analysis and literature search so long-horizon discovery can accumulate and
        trace evidence.
      what_remains_open: Sufficiency of the shared state for out-of-distribution hypotheses
        and domains beyond the evaluated cases is unknown.
    - line: Closed-loop hypothesis-to-experiment research agents
      what_it_solves: Turn open-ended objectives and datasets into iterative hypothesis
        generation, code execution, evaluation, and traceable scientific reports.
      what_remains_open: Report statement accuracy, provenance, weak-direction rejection,
        and scaling beyond short runs are only partially evidenced.
    - line: Structured search and evolutionary research-direction exploration
      what_it_solves: Organize hypothesis generation into trees, evolutionary selection,
        backtracking, and reflection to avoid unguided LLM exploration.
      what_remains_open: Whether improvement comes from search discipline, task-specific
        diagnostics, or the underlying models and baselines is not isolated.
    - line: Human-in-the-loop and authority-control systems
      what_it_solves: Balance autonomy with oversight through deterministic source-edit
        authority or selective human interventions to reduce fabricated results and
        uncontrolled execution.
      what_remains_open: Optimal intervention granularity, oversight cost, and reliability
        across diverse scientific workflows remain unmeasured.
    - line: Evaluation benchmarks and reproducible harnesses
      what_it_solves: Provide tasks, metrics, datasets, and harnesses for comparing
        AI research capabilities and quantifying difficulty gaps.
      what_remains_open: Coverage across disciplines is limited, and agreement between
        proxy metrics and real scientific decision utility is not established.
    - line: Conceptual taxonomies and workflow surveys
      what_it_solves: Organize autonomous research systems by workflow conditions,
        autonomy levels, and evaluation dimensions, and identify systemic challenges.
      what_remains_open: Proposed categories lack direct empirical validation that
        they predict model behavior or system failure modes.
    consensus:
    - Across systems, hypothesis generation is coupled to execution and evaluation
      rather than treated as a standalone proposal step.
    - Structured control, whether via trees, deterministic program authority, or graded
      human intervention, is used to keep LLM research trajectories inspectable and
      to reduce hallucinated or fabricated outputs.
    - Evaluation tends to combine task-specific success with evidence of reliability,
      comparing against strong baselines or benchmark thresholds.
    - Papers agree that current agents need better evidence preservation, provenance
      tracking, and weaker-direction rejection, though they differ on how to implement
      these.
    disagreements:
    - 'Representation: some systems use a shared structured world model or evidence
      state across agents, while others organize exploration as branching trees or
      source-code-level control boundaries.'
    - 'Supervision and interaction mode: approaches span fully autonomous runs with
      deterministic authority, targeted human intervention at high-leverage points,
      and exhaustive step-by-step oversight.'
    - 'Evaluation target: claims are grounded in different evidence, including benchmark
      accuracy drops, task-specific predictive or algorithmic performance, human-rated
      report accuracy, or implementation success.'
    - 'Deployment setting: evidence ranges from general research pipelines and survey
      taxonomies to domain-specific forecasting, biology tasks, equation discovery,
      and optimization.'
    - 'Search/control strategy: evolutionary tree with backtracking differs from parallel
      iterative cycles and self-healing pivot/refine loops.'
    open_questions:
    - Can report accuracy and provenance be improved beyond the reported 79.4% statement
      accuracy without losing discovery throughput?
    - How do multi-cycle systems scale beyond 20 cycles, and does the linear growth
      of findings continue or saturate?
    - Which human intervention granularity minimizes oversight burden while preserving
      reliability across domains?
    - Do benchmarks such as ARC-Bench and LABBench2 align with real-world scientific
      utility, or do model-specific accuracy drops only reflect surface difficulty?
    - How should weak-direction rejection be measured, and can current systems abandon
      unpromising hypotheses early without discarding useful anomalies?
    - What reproducibility gaps remain given that several top papers lack visible
      code, dataset, or artifact signals, and how should those gaps be validated externally?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 共享证据状态表示与长周期发现
      解决的问题: 维护连接数据分析与文献搜索的结构化表示，使长周期发现能够积累证据并追踪来源。
      尚未覆盖: 共享状态在训练或评估分布之外的假设和领域上是否足够仍未知。
    - 路线: 闭环假设到实验的研究智能体
      解决的问题: 把开放式目标和数据集转化为迭代式假设生成、代码执行、评估与可追溯科学报告。
      尚未覆盖: 报告陈述准确性、来源追踪、弱方向拒绝以及长周期扩展仅有部分证据支持。
    - 路线: 结构化搜索与进化式研究方向探索
      解决的问题: 将假设生成组织为树、进化选择、回溯和反思，避免无约束的LLM探索。
      尚未覆盖: 提升来自搜索纪律、任务特定诊断还是底层模型或基线，尚未被分离验证。
    - 路线: 人机协作与权威控制系统
      解决的问题: 通过确定性源码编辑权威或选择性人类干预平衡自主性与监督，减少虚假结果和失控执行。
      尚未覆盖: 最优干预粒度、监督成本以及跨科学工作流的可靠性仍缺少测量。
    - 路线: 评测基准与可复现工具
      解决的问题: 提供任务、指标、数据集和评估工具，用于比较AI研究能力并量化难度差距。
      尚未覆盖: 学科覆盖有限，代理指标与真实科学决策效用之间的一致性尚未确立。
    - 路线: 概念分类与工作流综述
      解决的问题: 按工作流条件、自主水平和评估维度组织自主研究系统，并识别系统挑战。
      尚未覆盖: 所提出的分类是否预测模型行为或系统失败模式仍缺少直接实证验证。
    共识:
    - 各系统都将假设生成与执行评估耦合，而非把假设提议作为独立步骤。
    - 通过树、确定性程序权威或分级人类干预施加结构化控制，以保持LLM研究轨迹可检查并减少幻觉或伪造输出。
    - 评估普遍结合任务成功与可靠性证据，并对照强基线或基准阈值。
    - 当前研究普遍承认需要更好的证据保存、来源追踪和弱方向拒绝，但实现方式不同。
    分歧:
    - 表示方式：部分系统在智能体之间使用共享结构化世界模型或证据状态，另一些则把探索组织为分支树或源码级控制边界。
    - 监督与交互模式：包括全自主运行加确定性权威、在高杠杆点进行精准人类干预、以及逐步监督等多种方式。
    - 评测目标：不同工作依赖不同证据，如基准准确率下降、领域任务性能、人工评级报告准确率或实现成功率。
    - 部署场景：证据覆盖通用研究流水线、综述分类，以及预测、生物任务、方程发现和优化等特定领域。
    - 搜索或控制策略：带回溯的进化树不同于并行迭代循环和自愈Pivot/Refine循环。
    开放问题:
    - 报告准确性和来源追踪能否在保持发现吞吐量的前提下提高到超过已报告的79.4%陈述准确率？
    - 多周期系统在超过20个周期后如何扩展，发现量的线性增长是否持续或趋于饱和？
    - 哪种人类干预粒度能最低限度降低监督负担，同时在不同领域保持可靠性？
    - ARC-Bench、LABBench2等基准是否与真实科学效用一致，还是模型特定准确率下降只反映表面难度？
    - 弱方向拒绝应如何衡量，当前系统能否在早期放弃无前景假设而不丢失有用异常？
    - 部分高排名论文缺少可见代码、数据集或工件信号，这些可复现性缺口应如何通过外部验证来弥补？
