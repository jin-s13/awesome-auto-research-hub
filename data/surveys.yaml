  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery pipelines
      what_it_solves: Integrates ideation, code execution, experiment management,
        visualization, and manuscript writing into one agent loop, removing human-authored
        templates in later systems.
      what_remains_open: Acceptance is inconsistent and results are demonstrated mainly
        in machine learning or generated-paper settings; external scientific validity
        is not established.
    - line: Domain-constrained discovery agents with verification gates
      what_it_solves: Reduce silent failures and invalid claims in applied mathematics
        and computational fluid dynamics by adding logical internal review or physics-aware
        vision-language gates before writing.
      what_remains_open: 'Gates remain incomplete: the CFD gate missed 2 of 16 planted
        failures; transfer beyond the demonstrated domain is unproven.'
    - line: Benchmark environments and evidence-maturity evaluation
      what_it_solves: Provide repeatable tasks and automated judging for complete
        discovery cycles, including blind tasks with hidden source conclusions and
        rubric-based evidence maturity.
      what_remains_open: Agents plateau with no reliable separation and lack controls,
        robustness, falsifiability, and cross-dataset generalization; only one frozen
        base model is reported.
    - line: Human-agent role design and knowledge retrieval
      what_it_solves: Maintain alignment with expert standards by casting the human
        as principal investigator and the agent as graduate student, with automated
        knowledge retrieval for facts and procedural heuristics.
      what_remains_open: Evidence is limited to generated papers scored by an LLM-based
        review rubric; expert intervention reduction lacks external human validation.
    - line: Open-source reproducible stacks
      what_it_solves: Turn isolated agent ideas into inspectable, reusable code and
        artifact workflows, including open-source CFD agents and later template-free
        discovery systems.
      what_remains_open: Standardized external validation across hardware, datasets,
        and user settings is not yet demonstrated.
