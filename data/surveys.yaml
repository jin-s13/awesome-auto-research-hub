  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research paper generation
      what_it_solves: Converts broad research goals into ideas, experiments, results,
        and full manuscripts with little human intervention.
      what_remains_open: Publication-level quality is unstable; evaluation often stops
        at automated rubrics or workshop-level acceptance, and robust domain validity
        gates are not guaranteed.
    - line: Domain-specific verification and validity gating
      what_it_solves: Rejects physically or logically invalid intermediate results
        before they enter manuscripts, such as visual physics checks or internal logical
        audits.
      what_remains_open: Planted-failure detection is imperfect, and gates are often
        bespoke to a domain, so silent errors outside the designed checks may still
        pass.
    - line: Self-correction and failure attribution
      what_it_solves: Recovers from failed experiments by attributing root causes
        to hypothesis, design, or implementation, and constrains reporting to measured
        values.
      what_remains_open: Fully autonomous conference-ready writing remains difficult;
        observed gains concentrate in code development and execution rather than scientific
        argument quality.
    - line: Human-AI collaboration and oversight
      what_it_solves: Decides when and where human judgment is most valuable inside
        an otherwise autonomous research pipeline.
      what_remains_open: Optimal intervention points are not standardized, and evidence
        is limited to specific benchmarks such as ARC-Bench.
    - line: Automated review and quality assessment
      what_it_solves: Scales the review of generated papers and provides iterative
        improvement signals for research-writing agents.
      what_remains_open: LLM-based review scores may not align with real peer-review
        quality or long-term scientific utility; direct human validation remains limited.
    consensus:
    - The field agrees that fully autonomous scientific writing should be decomposed
      into ideation, execution, verification, and manuscript drafting stages.
    - Multi-agent or modular agent designs are converging as the default instead of
      a single monolithic model for end-to-end research writing.
    - Verification and grounded reporting are treated as necessary safeguards to prevent
      fabricated numbers, invalid results, or hallucinated citations from entering
      generated papers.
    - Human or automated review remains a key evaluation signal, but no single evaluation
      protocol is yet dominant across systems.
    disagreements:
    - 'Where to place human oversight: one line favors full autonomy with simulated
      review, while another shows targeted human collaboration at high-leverage decision
      points outperforms both full autonomy and exhaustive oversight.'
    - 'Verification mechanism: internal logical verification, vision-language physics
      gates, and multi-hypothesis failure attribution differ in which errors they
      can catch and how they decide to accept, rerun, or write results.'
    - 'Evaluation target and evidence: some systems are judged by LLM rubrics or automated
      reviewer scores, others by domain metrics such as RMSE improvements, and one
      by actual peer-review acceptance; these are not interchangeable.'
    - 'Reporting constraint strength: some systems explicitly constrain drafting to
      measured values, while others do not state this safeguard, leaving unknown risk
      of hallucinated results.'
    - 'Domain scope: systems are demonstrated in applied mathematics, computational
      fluid dynamics, or machine learning, and it remains unresolved whether design
      choices transfer across fields.'
    open_questions:
    - Can autonomous research writers consistently pass human peer review at conference
      level, beyond a single workshop acceptance?
    - How well do current verification gates detect silent failures outside planted-failure
      ablation sets and across longer or less constrained research workflows?
    - What level and mode of human collaboration maximizes scientific validity without
      reintroducing excessive manual effort?
    - Do LLM-based review rubrics and blind scores align with real peer-review quality
      and downstream scientific impact?
    - What verification gaps remain in reproducibility evidence, including missing
      code, datasets, and complete metrics for several systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究论文生成
      解决的问题: 将研究目标转化为想法、实验、结果和完整手稿，减少人工干预
      尚未覆盖: 发表级质量不稳定，评测常停留在自动评审或工作坊层面，缺乏稳定的领域有效性门控
    - 路线: 领域特定验证与有效性门控
      解决的问题: 在中间结果进入手稿前拒绝物理或逻辑无效的结果，如视觉物理检查或逻辑审计
      尚未覆盖: 对植入失败的检测并不完美，门控通常为领域定制，可能漏掉设计检查之外的静默错误
    - 路线: 自纠错与失败归因
      解决的问题: 通过将失败原因归因到假设、设计或实现，并将报告约束在测量值上，恢复实验失败
      尚未覆盖: 完全自主的会议级写作仍困难，提升集中在代码执行而非科学论证质量
    - 路线: 人机协作与监督
      解决的问题: 在自主研究流程中判断何时何地引入人类判断最有价值
      尚未覆盖: 最优干预点未标准化，证据局限于ARC-Bench等特定基准
    - 路线: 自动评审与质量评估
      解决的问题: 规模化评审生成论文，并提供迭代改进信号
      尚未覆盖: 自动评审与真实同行评审及长期科学效用的对齐仍缺少直接验证
    共识:
    - 领域普遍同意将完全自主科学写作分解为构思、执行、验证和手稿起草等阶段。
    - 多智能体或模块化智能体设计成为主流，而非单一模型完成端到端研究写作。
    - 验证和基于事实的报告被视为必要，以防止伪造数字、无效结果或幻觉引用进入生成论文。
    - 人工或自动评审仍是关键评估信号，但尚未形成唯一主导的评估协议。
    分歧:
    - 人工监督的位置不同：一条路线主张全自动加模拟评审，另一条路线表明在高杠杆决策点进行精准人机协作优于全自动和逐步监督。
    - 验证机制不同：内部逻辑验证、视觉-语言物理门控与多假设失败归因能捕获的错误类型和接受、重跑或写入决策不同。
    - 评测目标与证据不同：一些用LLM评审标准或自动评审分数，一些用领域指标如RMSE改进，个别以真实同行评审接收为证据。
    - 报告约束强度不同：部分系统明确将起草限制在测量值上，其他系统未说明这一安全措施。
    开放问题:
    - 自主研究写作能否稳定通过会议级人类同行评审，而不仅是单次工作坊接收？
    - 当前验证门控在超出植入失败消融集和更长研究流程时，检测静默失败的能力如何？
    - 何种人机协作粒度能最大化科学有效性，同时避免人工负担过高？
    - LLM评审标准和盲审分数是否与真实同行评审质量及下游科学影响对齐？
    - 若干系统在代码、数据集和完整指标上的可复现证据仍不完整，缺失部分如何补足？
