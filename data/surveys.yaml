  - 关键差异：验证方式从逻辑审计、物理感知视觉检查到有依据的报告和人在环监督不等；自主程度与领域专用性也不同。
  - 趋势演进：从2024年通用AI Scientist框架，演进到2025-2026年强调自我纠正、失败归因、同行评审接受与领域有效性门控的系统；证据集中在当前前沿。
  - 开放问题：自动评审与人类同行评审的一致性、漏检静默失败和不稳定接受率、以及何种人工干预能提升论文质量仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: Turns vague research prompts into full papers by coupling idea
        generation, code execution, experiment management, visualization, and manuscript
        drafting.
      what_remains_open: Acceptance is inconsistent and often validated on narrow
        ML or workshop tasks; full conference-level reliability is not demonstrated.
    - line: Domain-specific scientific writing with verification gates
      what_it_solves: Adds mathematical logic audits or physics-aware visual checks
        before results enter the paper, reducing silent errors in applied mathematics
        and CFD.
      what_remains_open: A verifier still missed 2 of 16 planted silent failures in
        one ablation, and generalization beyond the tested domain is unclear.
    - line: Grounded reporting and self-correction from failures
      what_it_solves: Attributes failed experiments to hypothesis, design, or implementation
        causes and constrains report content to measured values to avoid fabricated
        numbers.
      what_remains_open: Fully autonomous conference-ready writing remains unsolved
        and available code or dataset signals are uneven across systems.
    - line: Human-AI collaboration and oversight modes
      what_it_solves: Frames humans as principal investigators or inserts targeted
        human checks at high-leverage decision points instead of using full autonomy
        or step-by-step review.
      what_remains_open: The best intervention mode is shown on one benchmark but
        not established across domains, long-horizon runs, or different expert roles.
    - line: Automated review and evaluation of generated papers
      what_it_solves: Provides LLM-based review rubrics, workshop peer review, or
        experiment benchmarks such as ARC-Bench to compare generated paper quality.
      what_remains_open: Automated review is near-human but not equivalent to peer
        review; benchmark success does not yet cover diverse scientific reporting
        tasks.
    consensus:
    - Multiple systems agree that manuscript generation must be embedded in an execute-and-verify
      loop rather than isolated text generation.
    - There is shared emphasis on verifiable outputs, whether through logic audits,
      visual physics gates, or grounded reporting constrained to measured values.
    - Evaluation uses LLM reviewers or benchmark scores as a practical proxy for paper
      quality, but these are treated as evidence rather than full replacement for
      human review.
    disagreements:
    - 'Systems differ on verification: internal logical coherence checks versus domain-specific
      visual or physics validity versus measurement-grounded report generation.'
    - 'They differ on human involvement: full autonomy, principal-investigator-style
      collaboration, or targeted high-leverage human intervention.'
    - 'They differ on evaluation target: LLM rubric scores, workshop peer review,
      benchmark improvements such as ARC-Bench, or domain metric gains such as wall
      Cf RMSE.'
    - 'They differ on generality: one general-purpose ML pipeline contrasts with domain-specific
      applied mathematics and CFD systems.'
    open_questions:
    - Can automated reviewers be calibrated to predict human peer-review acceptance
      across fields and venues?
    - What verification coverage is needed to catch silent failures that current gates
      miss?
    - Which human-AI collaboration modes improve long-horizon autonomy without adding
      excessive expert burden?
    - How do systems claiming autonomous paper writing perform on diverse scientific
      writing tasks beyond ML, applied mathematics, and CFD?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究与手稿生成
      解决的问题: 将粗略研究提示转化为完整论文，串联想法生成、代码执行、实验管理、可视化和手稿起草。
      尚未覆盖: 接受结果不稳定，常在较窄的ML或工作坊任务上验证；尚未证明能达到完整会议级可靠性。
    - 路线: 带验证门控的领域科学写作
      解决的问题: 在结果进入论文前加入数学逻辑审计或物理感知视觉检查，减少应用数学和CFD中的静默错误。
      尚未覆盖: 一项消融中验证器漏检16个植入静默失败中的2个；超出已测领域的泛化仍不明确。
    - 路线: 失败归因与有依据报告
      解决的问题: 把实验失败归因到假设、设计或实现原因，并将报告内容约束到实测值，避免捏造数字。
      尚未覆盖: 完全自主的会议级写作仍未解决；各系统的代码或数据集信号参差不齐。
    - 路线: 人机协作与监督模式
      解决的问题: 将人类设为首席研究员，或在高杠杆决策点插入人工检查，避免完全自主或逐步审查。
      尚未覆盖: 最佳干预模式仅在一个基准上显示优势，尚未跨领域、长程运行和不同专家角色验证。
    - 路线: 生成论文的自动评审与评测
      解决的问题: 用LLM评审量表、工作坊同行评审或ARC-Bench等实验基准比较生成论文质量。
      尚未覆盖: 自动评测接近人类但不等同于同行评审；基准成功还不能覆盖多样科学报告任务。
    共识:
    - 多个系统都认为手稿生成应嵌入执行-验证循环，而不是孤立文本生成。
    - 都强调输出可验证性，手段包括逻辑审计、视觉物理门控或约束到实测值的有依据报告。
    - 都用LLM评审或基准分数作为论文质量的实用代理，但并非完全替代人类评审。
    分歧:
    - 验证方式不同：内部逻辑一致性检查、领域专用视觉或物理有效性，或基于测量结果的有依据报告生成。
    - 人工参与程度不同：完全自主、首席研究员式协作，或在高杠杆决策点进行精准人工干预。
    - 评测目标不同：LLM量表分、工作坊同行评审、ARC-Bench基准提升，或如壁面Cf RMSE的领域指标增益。
    - 泛化设定不同：通用机器学习流水线与面向应用数学和CFD的领域专用系统并存。
    开放问题:
    - 自动评审是否能在不同领域和投稿场合预测人类同行评审接受？
    - 需要多高的验证覆盖率才能捕捉当前门控漏检的静默失败？
    - 哪些人机协作模式能提升长程自主研究而不增加过多专家负担？
    - 声称能自主写作论文的系统在ML、应用数学和CFD之外的多样科学写作任务上表现如何？
