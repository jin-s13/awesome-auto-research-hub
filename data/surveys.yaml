  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于智能体的评分准则引导综述生成
      解决的问题: 通过专门LLM智能体分解检索、草稿和评审任务，以评分准则或多LLM迭代优化生成完整学术综述草稿。
