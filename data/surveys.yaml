  related_work_outline_zh:
  - 主流方向：构建端到端自主科研智能体，将实验变为“提出假设-生成代码-运行实验-分析结果-撰写论文”的闭环，主要集中在代码型科学发现，并引入树搜索、失败记忆、多智能体评审和评测基准。
  - 研究共性：智能体迭代提出假设、执行实验、分析结果，并通过验证器、评审或负知识等反馈修正后续动作；评测多采用自动指标、LLM 评委或同行评审。
  - 关键差异：目标从生成完整论文、虚拟发现任务到改进已发表科学 ML 基线不等；人类参与程度从全自动、仪表板监督到 PI/研究生式协作不同；成功证据也存在差异。
  - 趋势演进：可见证据从2024年端到端论文生成，到2025年工作坊同行评审，再到2026年多智能体控制、失败记忆和评测基准；焦点从展示自主性转向审查进展是否真正科学。
  - 开放问题：数据包中缺少真实实验室自动化证据；生成一致性、新颖性与工程技巧提升的区分、自动评审与科学效用的一致性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous experiment loops
      what_it_solves: Couples idea generation, code execution, result analysis, and
        manuscript authoring into a closed loop that produces complete research artifacts
        without turn-by-turn human control.
      what_remains_open: Whether generated artifacts reflect domain novelty or mostly
        local engineering improvements, and whether quality is consistent across multiple
        submissions.
    - line: Evaluation environments and evidence design
      what_it_solves: Provides tasks, automatic metrics, and review protocols for
        comparing discovery-agent progress across varied scientific domains.
      what_remains_open: Task completion or LLM-judge scores are not yet validated
        against long-term scientific utility or external reproducibility.
    - line: Failure-aware memory and self-correction
      what_it_solves: Encodes rejected attempts as reusable negative knowledge so
        downstream iterations avoid repeated failures and save computation.
      what_remains_open: Current evidence covers same-task retry and a few PDE tasks;
        cross-domain transfer and interaction with verification loops remain underexplored.
    - line: Interactive multi-agent research infrastructure
      what_it_solves: Provides experiment managers, dashboards, code harnesses, and
        modular agent roles for human oversight and artifact inspection.
      what_remains_open: Public validation is limited to small internal case studies
        or platform-level comparisons, leaving generalization across hardware, datasets,
        and user settings unproven.
    consensus:
    - Automated research agents can improve benchmark results or generate complete
      manuscripts by combining LLM-driven planning, code execution, and iterative
      feedback.
    - Scalable evaluation depends on automatic metrics or reviewer agents to reduce
      manual human burden.
    - Failure memory, verification loops, and tree search improve downstream experiment
      quality over simple single-shot agent loops.
    - Frontier-agent benchmark improvement does not by itself establish original scientific
      insight.
    disagreements:
    - 'Evaluation targets differ: complete paper generation, virtual-environment task
      completion, or improving published scientific ML baselines.'
    - 'Human involvement differs: fully autonomous operation, dashboard supervision,
      or PI/graduate-student collaboration.'
    - 'Success evidence differs: LLM rubric scores, simulated review, peer-review
      acceptance, or automatic task metrics.'
    - 'Bottleneck emphasis differs: generation consistency, novelty miscalibration
      and engineering-only gains, or missing physical-lab coverage.'
    open_questions:
    - How can evaluation distinguish research-level domain insight from ML engineering
      sweeps when frontier agents improve published best models?
    - Are LLM-judge and automatic metric scores calibrated with human peer review
      and reproducibility outside curated benchmarks?
    - Does failure-aware memory transfer beyond the studied PDE tasks and ScienceAgentBench?
    - Can code-based automation be extended to lab-based experimentation requiring
      physical execution, safety, and instrumentation?
    - What consistency threshold is appropriate when only one of several generated
      manuscripts passes peer review?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主实验闭环
      解决的问题: 把想法生成、代码执行、结果分析和论文撰写耦合成无需逐轮人工控制的研究流程。
      尚未覆盖: 生成物是否代表领域新颖性而非局部工程改进，以及多次提交的质量一致性。
    - 路线: 评测环境与证据设计
      解决的问题: 用任务、自动指标和评审协议比较不同科学领域发现智能体的进展。
      尚未覆盖: 任务完成度或 LLM 评委分数与长期科学效用、外部可复现性之间的对齐。
    - 路线: 失败感知记忆与自纠正
      解决的问题: 将失败尝试编码为可复用的负知识，帮助后续迭代避免重复失败并节省计算。
      尚未覆盖: 现有证据限于同任务重试和少量 PDE 任务，跨领域类型覆盖和与验证循环的交互不足。
    - 路线: 交互式多智能体研究基础设施
      解决的问题: 提供实验管理器、仪表板、代码工具和模块化角色，以支持人类监督和工件检查。
      尚未覆盖: 公开验证仍局限于小型内部案例或平台比较，跨硬件、数据集和用户设置的外推未证实。
    共识:
    - 自动科研智能体通过 LLM 规划、代码执行和迭代反馈，能够在基准上取得提升或生成完整论文。
    - 可扩展评测依赖自动指标或评审智能体来减少人工负担。
    - 失败记忆、验证循环和树搜索比简单单轮智能体更能提升后续实验质量。
    - 前沿智能体的基准提升本身不足以证明原创科学洞见。
    分歧:
    - 评测目标不同：生成完整论文、在虚拟环境中完成任务、或改进已发表科学 ML 基线。
    - 人在回路的参与模式不同：全自动、仪表板监督或 PI/研究生式协作。
    - 成功证据不同：LLM 评审分数、同行评审录用或自动任务指标。
    - 瓶颈判断不同：生成一致性、新颖性误判和工程化提升，或物理/实验自动化覆盖不足。
    开放问题:
    - 如何区分研究级领域洞见与 ML 工程扫描带来的基准提升？
    - LLM 评审和自动指标是否与人类同行评审及任务外可复现性一致？
    - 失败感知记忆能否在现有 PDE 和 ScienceAgentBench 之外跨领域迁移？
    - 基于代码的自动化在多大程度上能扩展到需要物理执行、安全和仪器的实验室实验？
    - 当多篇生成论文中仅一篇通过同行评审时，应设定怎样的质量一致性阈值？
