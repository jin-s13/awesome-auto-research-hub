  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Automating the complete scientific workflow from hypothesis
        or idea to code, experiments, visualization, and manuscript generation.
      what_remains_open: Inconsistent acceptance and scientific defensibility; generated
        papers may pass rubrics but lack robust controls, falsifiability, and cross-task
        generalization.
    - line: Domain-embedded discovery systems with verification
      what_it_solves: Adding logical or physics-aware validity gates to catch silent
        errors in derivations and simulations before claims are written.
      what_remains_open: Verification gates still miss failure modes and are demonstrated
        in narrow domains; transfer to other disciplines and hardware is unproven.
    - line: Virtual environments and evidence-grounded benchmarks
      what_it_solves: Providing reproducible task suites and blind evidence tasks
        to compare discovery agents on exploration, experiment design, and evidentiary
        maturity.
      what_remains_open: Current agents plateau and lack discriminating scientific
        judgment; benchmark scores based on one frozen base model and proxy metrics
        may not reflect real discovery utility.
    - line: Automated review and reflective feedback loops
      what_it_solves: Scaling manuscript evaluation and iterative improvement through
        simulated reviewers, VLM-based figure feedback, or LLM rubrics.
      what_remains_open: Human alignment is only partially validated; rubric favorability
        does not guarantee workshop-level consistency or broader publication quality.
    - line: Open-source agentic infrastructure
      what_it_solves: Turning isolated research-agent ideas into runnable stacks,
        code artifacts, and reproducible workflows for subsequent study.
      what_remains_open: Standardized external validation across models, datasets,
        compute budgets, and research domains is missing; artifact completeness varies.
    consensus:
    - The field converges on decomposing scientific discovery into ideation, execution,
      analysis, and writing, with LLM agents orchestrating each stage.
    - Automated evaluation is treated as necessary for scaling discovery, whether
      through LLM rubrics, simulated peer review, virtual tasks, or evidence-maturity
      scoring.
    - Pure execution and documentation are no longer sufficient; systems increasingly
      add verification or evidence requirements to distinguish defensible claims from
      generated text.
    - Reproducibility signals, such as code or benchmark artifacts, are valued but
      unevenly reported across the papers.
    disagreements:
    - General-purpose systems aim for broad ML discovery, while domain-specific systems
      embed structured validators such as logical proof checks or physics-aware visual
      inspection; this changes failure coverage and transferability.
    - 'Evaluation targets differ: some judge complete generated manuscripts against
      review rubrics, others benchmark task completion or evidentiary maturity from
      frozen data; these are not interchangeable.'
    - Verification strategy ranges from internal LLM-based logical review to external
      simulation-based visual gates; the evidence for missed failures differs across
      approaches.
    - Interaction modes range from fully autonomous pipelines to human-as-PI collaborative
      loops, implying different assumptions about expert oversight and error correction.
    open_questions:
    - Do LLM-based reviewers and evidence-maturity judges predict whether a claim
      would survive independent replication or expert scrutiny?
    - Can agents move beyond competent analysis execution to produce controls, robustness
      checks, falsifiable hypotheses, and cross-dataset generalization in open-ended
      settings?
    - How do domain-specific validity gates generalize beyond narrow examples such
      as computational fluid dynamics or applied mathematics, and what is their false-negative
      rate on valid but unconventional discoveries?
    - Are current benchmarks measuring discovery ability or merely auditability and
      novelty, given that evaluated coding agents plateaued with no statistically
      reliable pairwise separation?
