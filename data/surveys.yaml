  related_work_outline:
  - 'Mainstream direction: Building multi-agent autonomous research systems that can
    generate hypotheses, design and execute experiments, and self-improve through
    iterative refinement, with recent integration of domain-specific verification
    and human collaboration.'
  - 'Shared research pattern: All systems decompose the research process into distinct
    stages (ideation, execution, verification, reporting) orchestrated by multiple
    agents, and rely on feedback loops—either from environment, simulations, or human
    input—to correct failures and improve idea quality.'
  - 'Key differences: Systems diverge in their degree of autonomy (fully autonomous
    vs. human-in-the-loop), scope of domain knowledge (general-purpose frameworks
    vs. domain-specialized agents with physics or biology verification), and failure
    recovery mechanisms (multi-hypothesis causal attribution vs. evolutionary or tree-based
    search).'
  - 'Trend evolution: From 2023 to 2026, the trajectory moves from early single-agent
    pipelines toward self-evolving, agentic architectures that incorporate external
    verification gates and structured human collaboration, indicating a shift toward
    reliability and scalability in scientific discovery.'
  - 'Open questions: How to ensure generated hypotheses lead to genuine scientific
    insights rather than statistical artifacts; how to verify causal correctness of
    failure attribution; whether current benchmarks proxy real scientific utility;
    and what collaboration strategies maximize human-AI synergy without overburdening
    researchers.'
  related_work_outline_zh:
  - 主流方向：构建能够自主生成假设、设计实验并自我改进的多智能体研究系统，近期趋势是融合领域特定验证与人机协作以提高可靠性。
  - 研究共性：所有系统均将研究过程分解为构思、执行、验证、报告等阶段，由多智能体协同完成，并利用环境、仿真或人类反馈形成闭环，以纠正失败并提升想法质量。
  - 关键差异：系统在自主程度（完全自主 vs. 人机协同）、领域知识范围（通用框架 vs. 集成物理/生物学验证的领域专用智能体）、失败恢复机制（多假设因果归因
    vs. 进化或树形搜索）上存在分歧。
  - 趋势演进：2023至2026年间，研究从早期单智能体流水线向自演化、多智能体架构演进，引入外部验证门控和结构化人机协作，体现了从原型验证向可靠、可扩展科学发现的转变。
  - 开放问题：如何确保生成假设带来真实科学洞察而非统计假象；失败归因的因果正确性如何验证；当前基准能否代理真实科学效用；何种人机协作策略能在不增加认知负荷的前提下最大化协同效应。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automating the full cycle from hypothesis generation, experiment
        execution, to result verification and reporting, reducing manual intervention.
      what_remains_open: Reliability of fully automated execution, generalizability
        beyond narrow domains, and the gap between system outputs and human-level
        scientific quality.
    - line: Self-evolving and failure-correction mechanisms
      what_it_solves: Enabling agents to learn from failed experiments through multi-hypothesis
        causal attribution, evolutionary search, or structured backtracking to refine
        ideas and improve success rates.
      what_remains_open: Whether these mechanisms can handle fundamentally novel scientific
        unknowns, the accuracy of causal diagnosis in complex environments, and transfer
        of knowledge across different research tasks.
    - line: Domain-specific verification and knowledge integration
      what_it_solves: Embedding domain-specific validity gates (e.g., physics-based
        flow verification, expert-labeled biological data) to ensure generated hypotheses
        are physically plausible or biologically sound.
      what_remains_open: Scalability to new scientific domains lacking structured
        verifiers, and whether such gates can cover all silent failure modes without
        missing critical errors.
    - line: Human-AI collaboration and interactive research platforms
      what_it_solves: Integrating human judgment at high-leverage decision points
        (hypothesis selection, experimental design) through configurable intervention
        modes or interactive dashboards to improve research outcomes.
      what_remains_open: Optimal granularity and timing of human intervention, avoiding
        cognitive overload, and demonstration of collaborative superiority over fully
        autonomous or fully manual workflows at scale.
    consensus:
    - Multi-agent architectures are the dominant paradigm for orchestrating complex
      research workflows involving hypothesis generation, execution, and verification.
    - Feedback-driven iteration—whether from execution results, environment simulations,
      or human input—is essential for improving the quality and reliability of generated
      ideas.
    - Robust verification mechanisms (automated gates, benchmark metrics, or human
      review) are necessary to detect and correct failures such as hallucinated results
      or physically implausible outputs.
    - Current AI scientists still fall short of fully autonomous scientific discovery,
      but show significant potential as support tools for data-driven research.
    disagreements:
    - 'Autonomy level: One line favors fully autonomous operation with self-evolution,
      while another advocates for structured human-AI collaboration, arguing that
      targeted human input at critical junctures outperforms both full autonomy and
      exhaustive step-by-step oversight.'
    - 'Domain generality: Some systems are designed as domain-agnostic frameworks
      requiring minimal adaptation, whereas others tightly integrate domain-specific
      physics or biology verification gates, which may improve validity but limit
      transferability.'
    - 'Failure recovery strategy: Approaches differ in using multi-hypothesis causal
      attribution to diagnose and route intervention, versus evolutionary or tree-based
      search that relies on population-level selection and backtracking, reflecting
      different assumptions about the nature of experimental failures.'
    - 'Evaluation target: Benchmarks measure different aspects—some assess paper-quality
      or artifact completeness, others test raw scientific discovery capability on
      real data, and some evaluate agentic reasoning on curated exams—making cross-system
      comparison difficult.'
    open_questions:
    - How can we ascertain that an AI-generated hypothesis represents a genuine scientific
      advance rather than a clever recombination of existing knowledge?
    - What causal attribution methods are needed to correctly diagnose failure modes
      in complex, multi-step experiments without introducing new errors?
    - Do current benchmarks (e.g., ARC-Bench, BAISBench, Humanity's Last Exam) reliably
      predict real-world scientific utility, or are they merely proxy tasks that can
      be overfitted?
    - Under what conditions does human-in-the-loop collaboration significantly enhance
      hypothesis quality, and can the optimal interaction strategy be learned or adapted
      dynamically?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流水线
      解决的问题: 自动化从假设生成、实验执行到结果验证和报告的全流程，减少人工干预。
      尚未覆盖: 全自动执行的可靠性、在狭窄领域之外的泛化能力，以及系统输出与人类科学家水平之间的质量差距。
    - 路线: 自我演化与纠错机制
      解决的问题: 通过多假设因果归因、进化搜索或结构化回溯，使智能体从失败实验中学习，迭代优化想法并提高成功率。
      尚未覆盖: 能否处理根本性科学未知，复杂环境中因果诊断的准确性，以及跨研究任务的知识迁移。
    - 路线: 领域特定验证与知识集成
      解决的问题: 嵌入领域效度门控（如基于物理的流场验证、专家标注生物数据）以确保生成假设在物理或生物学上合理。
      尚未覆盖: 向缺乏结构化验证器的新科学领域扩展的可行性，以及此类门控能否覆盖所有静默失败模式而不遗漏关键错误。
    - 路线: 人机协作与交互式研究平台
      解决的问题: 通过可配置的干预模式或交互式仪表板，在高杠杆决策点（假设选择、实验设计）整合人类判断，提升研究产出。
      尚未覆盖: 人类干预的最佳粒度和时机，避免认知过载，以及在大规模下证明协作优于完全自主或完全人工工作流的证据。
    共识:
    - 多智能体架构是编排复杂研究工作流（包括假设生成、执行和验证）的主导范式。
    - 基于反馈的迭代，无论来自执行结果、环境仿真还是人类输入，对于提高生成想法的质量和可靠性至关重要。
    - 鲁棒的验证机制（自动门控、基准指标或人类审核）是检测和纠正失败（如幻觉结果或物理上不可信的输出）所必需的。
    - 当前AI科学家尚未实现完全自主的科学发现，但作为数据驱动研究的辅助工具已展现出巨大潜力。
    分歧:
    - 自主程度：一条路线主张完全自主运行与自我演化，另一条则倡导结构化人机协作，认为在关键节点进行精准的人类干预优于完全自主或详尽的逐步监督。
    - 领域通用性：部分系统设计为领域无关框架，只需极少适配，而其他系统则紧密集成领域特定的物理或生物学验证门控，这虽可能提高效度，但限制了可迁移性。
    - 失败恢复策略：方法差异体现在使用多假设因果归因诊断并路由干预，抑或依赖基于群体选择和回溯的进化或树形搜索，反映了对实验失败本质的不同假设。
    - 评估目标：不同基准测量不同维度，有的评估论文质量或工件完整性，有的测试在真实数据上的原始科学发现能力，有的评估在策展考试上的智能体推理能力，导致跨系统比较困难。
    开放问题:
    - 如何判断AI生成的假设是真正的科学进步，而非现有知识的巧妙重组？
    - 需要何种因果归因方法，才能在不引入新错误的情况下正确诊断复杂多步实验中的失败模式？
    - 当前基准（如ARC-Bench、BAISBench、Humanity's Last Exam）能否可靠预测真实世界的科学效用，还是仅为可被过拟合的代理任务？
    - 在什么条件下人机闭环协作能显著提高假设质量，最优交互策略能否被动态学习或适应？
