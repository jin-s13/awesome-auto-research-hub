  related_work_outline:
  - 'Mainstream direction: The frontier is shifting from fully automated paper generation
    toward evidence-grounded evaluation, reliability gates, and benchmark infrastructure
    for automated research. Representative systems include The AI Scientist and AI
    Scientist-v2 for end-to-end discovery, plus TruthInsightBench, DISCOVERYWORLD,
    BAISBench, EvoCast, and AI CFD Scientist for domain-specific verification and
    scoring.'
  - 'Shared research pattern: LLM-based agents propose hypotheses, write or modify
    code, run experiments, and produce claims; an evaluator or gate then scores task
    completion, evidence maturity, peer-review likelihood, or domain-specific validity.
    The strongest papers separate execution/documentation from reliability by adding
    automated judges, human baselines, or deterministic safeguards.'
  - 'Key differences: Evaluation targets differ sharply: synthetic task completion
    versus blinded evidence maturity versus end-to-end peer-review acceptance. Verification
    differs too: vision-language physics gates, simulated review, LLM evidence judges,
    and deterministic source-control authority. Domain coverage ranges from generic
    machine learning to CFD, omics, and forecasting, so generalization claims carry
    different evidence strength.'
  - 'Trend evolution: From 2024 generic autonomous-science frameworks and sandbox
    benchmarks, the topic is moving toward 2025-2026 domain-specific reliability:
    blind peer-reviewed tasks, physics-aware verification, cognition-authority separation,
    and human test subjects. The evidence window is narrow, so this trend is best
    read as within the current frontier.'
  - 'Open questions: Whether automated judges or gate metrics align with real scientific
    validity; how to detect silent failures and missing controls; whether results
    transfer across base models and domains; and what governance, safety, and reproducibility
    standards should apply to autonomous research outputs.'
  related_work_outline_zh:
  - 主流方向：从全自动论文生成转向证据锚定的评估、可靠性门控和基准基础设施。代表性工作包括 The AI Scientist、AI Scientist-v2、TruthInsightBench、DISCOVERYWORLD、BAISBench、EvoCast
    和 AI CFD Scientist。
  - 研究共性：以LLM智能体提出假设、编写或修改代码、运行实验并产出结论，再用评估器或门控对任务完成、证据成熟度、评审可能性或领域有效性打分；强证据论文会在执行与文档能力之外加入自动裁判、人类基线或确定性防护。
  - 关键差异：评测目标不同，从合成任务完成、盲测证据成熟度到端到端评审接受；验证机制不同，包括视觉-语言物理门控、模拟评审、LLM证据裁判和确定性源控边界；领域从通用机器学习到计算流体力学、组学和预测，因此泛化证据强度不同。
  - 趋势演进：从2024年通用自主科学框架和沙箱基准，走向2025-2026年领域特定可靠性：盲测同行评审任务、物理感知验证、认知-权威分离和人类基线。证据窗口较窄，趋势应视为当前前沿内部变化。
  - 开放问题：自动裁判或门控指标是否与真实科学效用一致；如何检测静默失败和缺失对照；结果能否跨基座模型与领域迁移；以及自主研究需要何种治理、安全与可复现标准。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agents
      what_it_solves: Full workflows from hypothesis and code generation to experiment
        execution and paper writing without human-authored templates.
      what_remains_open: Consistency and reliability; only one of three AI Scientist-v2
        submissions passed peer review, and general agents can lack defensible validity
        gates.
    - line: Benchmark environments and tasks for discovery agents
      what_it_solves: Standardized evaluation of complete discovery cycles via task
        completion, action relevance, and explanatory knowledge or blind evidence-maturity
        scoring.
      what_remains_open: Coverage across domains and base models; fixed LLM judges
        and task suites may not capture real scientific utility or cross-model generalization.
    - line: Domain-grounded research agents with verification gates
      what_it_solves: Reliable autonomous modification and discovery in specific workflow
        such as CFD, forecasting, or omics, using physics-aware vision checks, deterministic
        source-control authorities, or human baselines.
      what_remains_open: Gates still miss some silent failures, and demonstrations
        are limited to selected domains or one frozen foundation model.
    - line: Automated review and evidence audit
      what_it_solves: Scalable evaluation of generated papers and claims through simulated
        peer review or rubric-based LLM judges.
      what_remains_open: Near-human scoring is not human-equivalent; automated judges
        may reward documentation and novelty while under-crediting controls, robustness,
        and falsifiability.
    consensus:
    - LLM-based agents can handle experiment execution, code modification, visualization,
      and manuscript writing at low cost, but this does not establish trustworthy
      scientific claims.
    - 'Evaluation infrastructure is treated as central: tasks, baselines, metrics,
      human baselines, reviewer thresholds, and verification gates are introduced
      to make claims comparable.'
    - Current automated research systems are strong on execution and documentation
      but weak on controls, robustness, falsifiability, cross-dataset generalization,
      or silent-failure detection.
    - Domain-specific validity gates and deterministic evaluation boundaries improve
      reliability over fully open-ended generation.
    disagreements:
    - 'Evaluation target differs: some work scores task completion in virtual or domain
      task suites, while others score blind evidence maturity or peer-review acceptance.'
    - 'Verification style differs: simulated automated review, LLM rubric judges,
      vision-language physics inspection, and deterministic program authorities impose
      different reliability constraints.'
    - 'Domain emphasis differs: generic machine-learning discovery, computational
      fluid dynamics, single-cell omics, and time-series forecasting provide variable
      evidence for cross-domain generalization.'
    - 'Success signals differ: domain-specific metric improvement, reviewer acceptance
      thresholds, and benchmark scores may give different judgments about progress.'
    open_questions:
    - Do automated evaluation metrics and LLM judges align with real-world scientific
      validity and practical decision utility?
    - How can verification gates detect the remaining silent failures and missing
      controls that current systems overlook?
    - Do conclusions transfer across other foundation models, datasets, and domains
      when current results often rely on one frozen base model or one domain?
    - What governance and safety standards should apply to autonomous research artifacts
      when peer-review acceptance, benchmark scores, and domain metrics can diverge?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现智能体
      解决的问题: 在没有人类编写模板的情况下，覆盖从假设、代码生成、实验执行到论文写作的完整研究流程
      尚未覆盖: 可靠性与一致性仍不足；例如 AI Scientist-v2 三篇投稿中仅一篇通过同行评审，通用智能体可能缺少可辩护的有效性门控
    - 路线: 发现智能体的基准环境与任务
      解决的问题: 通过任务完成、动作相关性、解释性知识或盲测证据成熟度，对完整发现循环进行标准化评测
      尚未覆盖: 跨领域和跨基座模型的覆盖不足；固定 LLM 裁判和任务集可能无法真正反映科学效用或跨模型泛化
    - 路线: 带验证门控的领域锚定研究智能体
      解决的问题: 在计算流体力学、科学预测或组学等具体工作流中，通过物理感知视觉检查、确定性源控边界或人类基线提高自治研究与修改可靠性
      尚未覆盖: 门控仍会漏掉部分静默失败；验证演示常局限于选定领域或单个冻结基座模型
    - 路线: 自动评审与证据审计
      解决的问题: 通过模拟同行评审或基于评分项的 LLM 裁判，对生成论文和结论进行可扩展评估
      尚未覆盖: 接近人类评分并不等于人类等效；自动裁判可能奖励文档和新颖性，却低估对照、稳健性与可证伪性
    共识:
    - LLM 智能体能够以低成本完成实验执行、代码修改、可视化和论文写作，但这并不自动构成可信的科学主张。
    - 评估基础设施被视为核心：任务、基线、指标、人类基线、接收阈值和验证门控被用来增强可比性。
    - 当前自动研究系统在执行与文档记录方面较强，在对照、稳健性、可证伪性、跨数据集泛化或静默失败检测方面较弱。
    - 领域特定有效性门控和确定性评测边界比完全开放式生成更能提升可靠性。
    分歧:
    - 评测目标不同：有的以虚拟环境或领域任务中的任务完成度打分，有的以盲测证据成熟度或同行评审接受度打分。
    - 验证方式不同：模拟自动评审、LLM 评分项裁判、视觉-语言物理检查和确定性程序权威施加了不同的可靠性约束。
    - 领域侧重不同：通用机器学习发现、计算流体力学、单细胞组学和时间序列预测给出了强度不一的跨领域泛化证据。
    - 成功信号不同：领域指标提升、评审接受阈值或基准分数可能给出不同的好坏判断。
    开放问题:
    - 自动评测指标和 LLM 裁判是否与真实科学有效性和实际决策效用一致？
    - 验证门控如何捕捉当前系统仍会遗漏的静默失败和缺失对照？
    - 当现有结果常依赖单个冻结基座模型或单一领域时，结论是否能迁移到其他基座模型、数据集和领域？
    - 自主研究产物需要何种治理和安全标准，尤其是在评审接受度、基准分数和领域指标可能分歧的情况下？
