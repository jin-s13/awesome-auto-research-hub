  - 主流方向：构建端到端LLM研究智能体，覆盖想法生成、代码实验、结果分析、论文撰写和自动评审或验证闭环。
  - 研究共性：将科学发现流程分解为生成、执行、验证、记忆/检索和评测模块，并通过案例或基准任务评估整体能力。
