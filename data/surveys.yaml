  related_work_outline_zh:
  - 主流方向：以LLM智能体为核心的端到端综述生成流水线覆盖检索、组织、起草、评估与迭代优化；评估正从单一质量分转向针对检索、组织和引用可靠性的结构化基准。
  - 研究共性：将综述生成拆分为检索、层级组织、起草和评审子任务，使用专门LLM智能体或模块，并依据明确质量信号进行迭代优化。
  - 关键差异：各系统主要优化目标不同，分别侧重整篇综述质量、分类体系对齐、引用证据可靠性或受管控研究流程；评测参照、语料规模和交互模式也存在差异。
