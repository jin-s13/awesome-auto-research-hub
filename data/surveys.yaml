  literature_review:
    line_of_work_matrix:
    - line: Autonomous end-to-end discovery pipelines
      what_it_solves: Produces complete research cycles from ideation, code or derivation,
        experiments, analysis, and manuscript writing, lowering per-paper cost and
        human effort.
      what_remains_open: Reliability is uneven; passing an automated or workshop review
        does not show generalizable, controlled, falsifiable, or cross-domain scientific
        discovery.
    - line: Domain-specific verification and validity gating
      what_it_solves: Adds logic, knowledge, physics, or vision-language checks to
        catch silent failures before claims are accepted or papers are written.
      what_remains_open: Verification coverage is incomplete; one reported gate missed
        2 of 16 planted failures, and whether such gates transfer across domains remains
        unclear.
    - line: Discovery benchmarking and virtual environments
      what_it_solves: Provides complete discovery-cycle tasks and metrics so agent
        weaknesses can be measured beyond single paper demonstrations.
      what_remains_open: Existing baselines still struggle, and reported performance
        is based on limited base models or selected topics; task completion may not
        equal defensible scientific evidence.
    - line: Automated evidence review and manuscript evaluation
      what_it_solves: Scales scoring of generated papers and evidentiary maturity
        through LLM judges or rubric dimensions.
      what_remains_open: Judges may reward competent execution, auditability, and
        novelty while systems lack controls, robustness checks, falsifiability, and
        independent scientific judgment.
    consensus:
    - Autonomous research agents should cover hypothesis formation, experimentation
      or derivation, analysis, and writing as one loop.
    - Raw code or text generation is insufficient; verification, review, or benchmark
      signals are needed before accepting claims.
    - Current systems are closer to competent analysis and documentation than to trustworthy,
      independently discovered scientific knowledge.
    - Domain-specific constraints or blind evidence tasks expose weaknesses that generic
      paper-quality evaluation misses.
    disagreements:
    - General-purpose discovery workflows prioritize breadth across machine learning
      topics, while domain-specific systems impose mathematical, physical, or simulation
      constraints to make results checkable.
    - 'Evaluation targets differ: paper acceptance or reviewer scores versus task
      completion versus evidence maturity such as controls, robustness, and falsifiability.'
    - 'Human interaction differs: some systems treat a human as principal investigator
      overseeing an agent, while others pursue fully automated open-ended discovery.'
    - 'Validation mechanisms differ: LLM-based review, internal logical verification,
      and vision/physics gates make different assumptions about what counts as a valid
      scientific claim.'
    open_questions:
    - Can automated judges or verification gates evaluate evidential validity rather
      than surface auditability and novelty?
    - Do improvements transfer across base models, domains, and benchmarking environments
      when only a frozen model or narrow domain has been tested?
    - What failure rate is acceptable for verification gates designed to catch silent
      computational or physical errors?
    - What supervision or human role is necessary to move from automated execution
      and writing toward defensible, novel scientific discovery?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主端到端发现流程
      解决的问题: 把构思、编码或推导、实验、分析和论文写作串成一个完整研究闭环，降低单篇论文成本与人工负担。
      尚未覆盖: 可靠性不稳定；通过自动评审或工作坊审稿不能证明其具有可泛化、受控、可证伪和跨领域科学发现能力。
    - 路线: 领域专用验证与有效性门控
      解决的问题: 通过逻辑、知识、物理或视觉-语言检查，在主张被接受或写入论文前捕获静默失败。
      尚未覆盖: 验证覆盖不完整；有报告显示门控遗漏了16个注入失败中的2个，且其跨领域可迁移性尚未证实。
    - 路线: 发现基准与虚拟环境
      解决的问题: 提供完整发现循环的任务和指标，使智能体弱点能超越单篇论文演示被测量。
      尚未覆盖: 现有基线仍表现困难，且结果常基于有限基座模型或主题；任务完成不等于得到可辩护的科学证据。
    - 路线: 自动证据评审与论文评估
      解决的问题: 用LLM评审或量表维度扩大生成论文和证据成熟度的评分规模。
      尚未覆盖: 评审可能奖励执行能力、可审计性和新颖性，但系统仍缺乏对照、稳健性、可证伪性和独立科学判断。
    共识:
    - 自主研究智能体应把假设提出、实验或推导、分析和写作作为一个闭环处理。
    - 仅靠代码或文本生成不够；在采信主张前需要验证、评审或基准信号。
    - 当前系统更接近能胜任分析和记录，而不是可信赖的独立科学发现。
    - 领域约束或盲证据任务暴露了通用论文质量评估忽略的弱点。
