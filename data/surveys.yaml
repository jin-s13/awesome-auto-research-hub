      beyond toy examples and surface silent failures.
    - End-to-end paper generation is technically feasible but often produces outputs
      that are not scientifically sound or reproducible.
    - Incorporating some form of feedback loop or reflection improves the quality
      of outputs compared to single-pass generation.
    disagreements:
    - Whether the primary evaluation should be through internal automated reviewers,
      external benchmark tasks, or real-world peer review; choices affect what constitutes
      success.
    - 'Architecture: fully autonomous single-agent pipelines vs. multi-agent platforms
      with human-in-the-loop oversight, reflecting different assumptions about the
      necessity of human collaboration.'
    - 'Verification strategy: domain-specific physics or visual checks vs. general-purpose
      self-reflection or multi-hypothesis failure attribution; the first relies on
      domain knowledge, the second on the agent''s reasoning.'
    - 'Scope: systems designed for narrow ML subfields vs. those aiming for cross-domain
      generalizability, leading to different reproducibility and robustness expectations.'
    open_questions:
    - What constitutes a valid and sufficient evaluation of an AI scientist's ability
      to produce novel, meaningful scientific contributions?
    - How can we ensure that autonomous agents do not fabricate results or cherry-pick
      data, and can such safeguards be automated?
    - What is the minimal set of verification gates and human oversight needed to
      deploy AI scientists safely in high-stakes domains?
    - Can self-correction mechanisms trained on a few failure modes generalize to
      novel scientific domains, or does each domain require bespoke verification?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科学发现系统
      解决的问题: 利用LLM智能体全自动完成从想法生成、代码实现、实验执行到论文写作的完整研究流程。
      尚未覆盖: 跨运行的一致性可靠性；避免静默失败、结果捏造和实现漂移；在非模板任务上生成新颖且可辩护的主张。
    - 路线: AI科学家基准与评测环境
      解决的问题: 提供标准化任务、指标和基线，量化评估自主发现智能体在多个科学领域的能力。
      尚未覆盖: 这些基准是否捕捉了真实世界发现的复杂性，以及代理指标是否与真正的科学效用和长期进步相关。
    - 路线: 自主研究中的失败分析与自纠正
      解决的问题: 诊断重复出现的失败模式（如记忆退化、过度兴奋、科学品味薄弱），并引入在研究循环中归因和纠正错误的机制。
      尚未覆盖: 自纠正是否提升下游科学有效性的实证证据；失败分类法在ML以外领域的泛化性；与人类严谨性的差距。
    - 路线: 多智能体与人机协同研究平台
      解决的问题: 编排多个具有可定制角色的LLM智能体，并提供实时人类监督，实现迭代实验和工件检查。
      尚未覆盖: 在小规模案例研究之外的可扩展性；与外部验证和真实数据的集成；在开放式环境中对想法新颖性和实验完整性的评估。
    - 路线: 领域特定验证与物理感知门控
      解决的问题: 结合视觉-语言检查或因果推理来验证实验结果的物理合理性，防止计算科学中的错误主张。
      尚未覆盖: 对植入例子之外失败模式的覆盖；扩展到具有不同有效性标准的其他科学学科；门控设计的自动化。
    共识:
    - 当前基于LLM的智能体能够执行部分科学工作流，但尚非完全可靠的自主科学家。
    - 需要更好的评估基准和验证机制，以超越玩具示例并暴露静默失败。
    - 端到端论文生成在技术上可行，但往往产出科学上不健全或不可复现的结果。
    - 引入某种反馈循环或反思相较于单次生成能提升输出质量。
    分歧:
    - 主要评估方式应为内部自动评审、外部基准任务还是真实同行评审，决定了成功的定义不同。
    - 架构选择：全自动单智能体流水线 vs. 有人类监督的多智能体平台，反映了对人类协作必要性的不同假设。
    - 验证策略：领域特定的物理或视觉检查 vs. 通用自反思或多假设失败归因，前者依赖领域知识，后者依赖智能体推理能力。
    - 范围：针对狭窄ML子领域的系统 vs. 追求跨领域泛化的系统，导致对可复现性和鲁棒性的期望不同。
    开放问题:
    - 什么构成对AI科学家产生新颖、有意义科学贡献能力的有效且充分的评估？
    - 如何确保自主智能体不捏造结果或选择性挑选数据，且此类保障措施能否自动化？
    - 在高风险领域安全部署AI科学家所需的最小验证门控和人类监督组合是什么？
    - 在少数失败模式上训练的自纠正机制能否泛化到新的科学领域，还是每个领域都需要定制验证？
