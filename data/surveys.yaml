      采用带有 pivot/refine 循环和可验证结果报告的自愈执行器。
    - 自主性与协作：The AI Scientist 和 AI Scientist-v2 追求完全自动化的工作流，而 ReasFlow 将人类设定为首席研究员，AutoResearchClaw
      则明确比较了七种人机回路干预模式，主张精准协作优于完全自主。
    - 领域特异性：AI CFD Scientist 和 ReasFlow 分别针对计算流体动力学和应用数学进行定制，而 The AI Scientist、DISCOVERYWORLD
      和 BAISBench 面向通用或多领域评估，形成了深度与广度之间的不同权衡。
    开放问题:
    - 需要哪些最少的验证门控来保证 AI 生成的论文不包含根本的逻辑或经验错误，以及如何验证这些门控本身？
    - 如何设计能够捕捉科学发现完整循环（包括假设细化和范式转变）的基准，而非仅测量孤立任务完成？
    - 在什么条件下人类干预能显著提升 AI 生成研究的质量，最优协作模式能否根据任务特征自动学习？
