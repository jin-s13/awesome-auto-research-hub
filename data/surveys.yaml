  literature_review:
    line_of_work_matrix:
    - line: End-to-end automated research frameworks
      what_it_solves: Generating novel ideas, implementing code, running experiments,
        and composing full papers with minimal human intervention, demonstrating the
        feasibility of closed-loop scientific discovery.
      what_remains_open: Consistency in producing peer-review-accepted results; reliance
        on human-authored code templates or controlled environments; handling of long-horizon
        context degradation and overexcitement about spurious successes.
    - line: Domain-specific scientist agents with physics or biology verification
      what_it_solves: Embedding domain constraints (e.g., CFD vision-language gates,
        single-cell transcriptomic benchmarks) into the discovery loop to catch silent
        failures that code-level checks miss.
      what_remains_open: Verification gates may miss a subset of failures (2 out of
        16 in ablation); generalizability beyond the specific physical or biological
        domain; human baseline comparison only at graduate-student level.
    - line: Benchmark environments and evaluation suites for AI scientists
      what_it_solves: Providing standardized tasks, metrics, and human baselines that
        reveal the gap between current agents and human scientific reasoning, covering
        diverse topics and parametric variations.
      what_remains_open: Whether task completion and multiple-choice questions correlate
        with real-world discovery impact; coverage of the full scientific cycle beyond
        annotation and question answering; validation of automated metrics against
        expert panel judgments.
    - line: Failure diagnosis and self-correction for autonomous research
      what_it_solves: Identifying root causes of experiment failures (hypothesis,
        implementation, or design) and deterministically routing interventions, thereby
        increasing the yield of metrics-bearing outputs and improving artifact quality.
      what_remains_open: Fully autonomous scientific writing and conference-ready
        papers remain unsolved; the approach is demonstrated on a 12-topic benchmark
        but does not yet reach acceptance in full conference peer review; multi-hypothesis
        attribution may still propagate errors if the causal model is misspecified.
    consensus:
    - 'All systems adopt LLM-based agents that decompose the research workflow into
      discrete stages: ideation, implementation, execution, and writing.'
    - Evaluation is moving beyond output-only scoring to mid-process checks, such
      as vision-based verification gates, failure attribution loops, and real-time
      dashboards.
    - Current AI scientists are not yet reliable enough for fully unsupervised discovery;
      they exhibit recurring failure modes like implementation drift, memory degradation,
      and declaring success despite obvious errors.
    - Reproducibility and artifact availability (code, dataset, log) are increasingly
      recognized as necessary components of a credible autonomous research system.
    disagreements:
    - General-purpose frameworks assume that a single LLM backbone can handle diverse
      ML domains, while domain-specific agents require hand-crafted verifiers (e.g.,
      OpenFOAM fluid dynamics, single-cell biology) that may not transfer.
    - Some systems use simulated automated reviewers to judge paper quality, while
      others submit to real human peer review, and the alignment between these two
      evaluation signals remains contested.
    - 'Verification strategies differ: one line uses a vision-language gate to inspect
      rendered flow fields, another uses multi-hypothesis causal attribution on execution
      traces, and a third relies on static benchmark metrics without runtime validity
      checks.'
    - Interaction modes range from fully autonomous end-to-end pipelines to interactive
      dashboards with human-in-the-loop rollback, suggesting disagreement on the right
      level of human oversight.
    open_questions:
    - How can automated reviewers and proxy metrics be calibrated to predict actual
      human peer-review outcomes and long-term scientific impact?
    - What is the minimal set of domain-specific verification gates needed to make
      AI scientists safe and reliable across physics, biology, and other scientific
      fields?
    - Can self-correction mechanisms recover from errors that stem from the agent's
      own biased training data defaults, or will they amplify those biases?
    - How do we design benchmarks that test the full cycle of scientific discovery,
      including hypothesis revision, experimental design, and theory building, rather
      than just task completion or question answering?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自动化研究框架
      解决的问题: 以最少人类干预生成新颖想法、实现代码、运行实验并撰写完整论文，证明闭环科学发现的可行性。
      尚未覆盖: 产生同行评审可接受结果的一致性；对人类编写代码模板或受控环境的依赖；长周期情境退化和对虚假成功的过度兴奋的处理。
    - 路线: 具有物理或生物验证的领域专用科学家智能体
      解决的问题: 将领域约束（如CFD视觉-语言门控、单细胞转录组基准）嵌入发现循环，以捕获代码级检查遗漏的静默失败。
      尚未覆盖: 验证门控可能遗漏部分失败（消融中16个遗漏2个）；在特定物理或生物领域之外的泛化能力；人类基线仅限定在研究生水平。
    - 路线: AI科学家的基准环境和评估套件
      解决的问题: 提供标准化任务、指标和人类基线，揭示当前智能体与人类科学推理之间的差距，涵盖多样主题和参数变化。
      尚未覆盖: 任务完成度和选择题是否与真实世界发现影响力相关；覆盖超出注释和问答的完整科学循环；自动指标与专家小组判断的验证。
    - 路线: 自主研究的失败诊断与自我纠正
      解决的问题: 识别实验失败的根本原因（假设、实现或设计），并确定性路由干预，从而提高包含指标的输出比例和工件质量。
      尚未覆盖: 完全自主的科学写作和可提交会议论文仍未解决；该方法在12主题基准上展示，但未达到完整会议同行评审的接受水平；如果因果模型设定错误，多假设归因仍可能传播错误。
    共识:
    - 所有系统均采用基于LLM的智能体，将研究工作流分解为离散阶段：构思、实施、执行和写作。
    - 评估正从仅关注最终输出转向过程中检查，如基于视觉的验证门控、失败归因循环和实时仪表板。
    - 当前AI科学家尚不足以实现完全无人监督的发现；它们表现出反复出现的失败模式，如实现漂移、记忆退化和在明显错误时宣称成功。
    - 可复现性和工件可用性（代码、数据集、日志）越来越被视为可信自主研究系统的必要组成部分。
    分歧:
    - 通用框架假设单一LLM骨干可以处理多种ML领域，而领域专用智能体需要手工制作的验证器（如OpenFOAM流体动力学、单细胞生物学），这些验证器可能无法迁移。
    - 一些系统使用模拟自动评审器评判论文质量，另一些则提交给真实人类同行评审，这两种评估信号的一致性仍存在争议。
    - 验证策略各不相同：一条路线使用视觉-语言门控检查渲染流场，另一条使用执行轨迹上的多假设因果归因，第三条则依赖静态基准指标而不进行运行时有效性检查。
    - 交互模式从完全自主的端到端流水线到具有人类回溯的交互式仪表板，反映了对适当人类监督水平的不同看法。
    开放问题:
    - 如何校准自动评审器和代理指标，以预测实际人类同行评审结果和长期科学影响力？
    - 使AI科学家在物理、生物和其他科学领域安全可靠所需的最小领域专用验证门控集是什么？
    - 自我纠正机制能否从源于智能体自身有偏训练数据默认值的错误中恢复，还是会放大这些偏差？
    - 如何设计测试完整科学发现周期的基准，包括假设修正、实验设计和理论构建，而不仅仅是任务完成或问答？
