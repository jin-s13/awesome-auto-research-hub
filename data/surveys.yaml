    研究路线矩阵:
    - 路线: 端到端自主科研工作流系统
      解决的问题: 在单一智能体流程中自动化构思、代码或实验执行、分析、可视化和论文撰写。
      尚未覆盖: 外部验证仍限于自生成论文、工作坊评审或大模型评审阈值，完整会议与真实世界可靠性未证明。
    - 路线: 领域专用发现智能体与验证关卡
      解决的问题: 以逻辑或物理感知检查在主张写入前发现无效推导和静默仿真失败。
      尚未覆盖: 已有关卡仍漏掉16个植入失败中的2个，跨领域或跨求解器迁移未建立。
    - 路线: 完整发现循环的基准环境
      解决的问题: 提供结构化发现任务和自动指标，衡量任务完成、相关动作或可解释知识。
      尚未覆盖: 强基线智能体表现困难，但仿真任务指标尚未与真实科学决策效用及新颖性有效性对齐。
    - 路线: 基于证据的主张评估
      解决的问题: 通过盲测同行研究任务和基于规则的LLM评审，对证据成熟度、可审计性、对照、稳健性和新颖性评分。
      尚未覆盖: 仅使用一个冻结基座模型；受评编码智能体得分接近且缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 路线: 渐进搜索与评审反馈的论文改进
      解决的问题: 以智能体树搜索和实验管理器减少对固定模板的依赖，并迭代改进论文和图表。
      尚未覆盖: 三篇提交论文仅一篇通过同行评审，性能不稳定，且仅工作坊级证据。
    共识:
    - 科研发现被表述为从构思、执行到论文或报告生成的端到端智能体循环。
    - 系统越来越多地加入自动关卡：逻辑一致性、物理感知可视化检查、模拟评审或基于规则的证据评分。
    - 现有证据显示智能体能够执行分析并写出合理论文，但尚不能稳定产生可信的新科学发现。
    - 可复现证据不一致；部分系统提供代码、基准或任务工件，其他仅报告论文或评审结果，形成验证缺口。
    分歧:
