  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automates hypothesis generation, code writing, experiment execution,
        result analysis, and manuscript drafting as one iterative scientific workflow.
      what_remains_open: 'Reliability is inconsistent: only one of three workshop
        submissions passed peer review in one system, and validation remains narrow
        rather than full conference or multi-domain evidence.'
    - line: Benchmark and evaluation design for discovery agents
      what_it_solves: Creates tasks and metrics for hypothesis testing, experiment
        design, result interpretation, and ablation planning to compare agent capabilities
        with humans and baselines.
      what_remains_open: Best models still identify only 45% of original ablations
        on average, and proxy metrics have not been shown to align with real scientific
        utility or lab-based discovery.
    - line: Failure-aware memory and process improvement
      what_it_solves: Converts failed attempts into structured negative knowledge
        that downstream agents can adopt or reject, improving retry success and cross-task
        transfer while reducing token use.
      what_remains_open: Evidence is limited to ScienceAgentBench and nonlinear PDE
        tasks; broader failure modes, memory noise, and long-horizon scientific workflows
        are not covered.
    - line: Interactive multi-agent research infrastructure
      what_it_solves: Turns isolated model ideas into runnable research stacks with
        customizable roles, real-time monitoring, code harnesses, artifact inspection,
        and rollback/resume control.
      what_remains_open: Evaluation relies on five internal AI case studies and expert
        preference, leaving external standardization across hardware, datasets, and
        user settings unproven.
    consensus:
    - Work treats experiment automation as an iterative agentic loop spanning ideation,
      execution, analysis, and reporting rather than isolated model inference.
    - Evaluation relies on task completion, ablation recall, LLM-based review scores,
      peer review, or expert preference, usually against baseline agents in narrow
      domains.
    - Structured memory, verification loops, or monitoring are added to reduce failure
      and improve reproducibility, but their isolated contribution is not fully measured.
    - 'Reproducibility signals vary: some systems report code or artifact availability,
      while several top papers lack explicit limitation or external validation details.'
    disagreements:
    - 'Evaluation targets differ: full paper generation versus isolated experiment
      planning versus complete discovery tasks in simulated environments.'
    - 'Interaction modes differ: fully autonomous systems versus human-in-the-loop
      platforms with customizable roles and real-time monitoring.'
    - 'Failure handling differs: internal logical verification, negative-failure memory
      banks, or experiment-manager tree search.'
    - 'Supervision signals differ: LLM judges, peer reviewers, expert preference,
      or task-completion metrics.'
    - 'Domain focus differs: empirical machine learning, applied mathematics or theory-driven
      work, and simulated science topics.'
    open_questions:
    - How do LLM-judge and proxy metrics align with peer-review acceptance and longer-term
      scientific impact when one submitted manuscript passes and ablation recall remains
      below human level?
    - Can end-to-end systems transfer beyond narrow ML, applied mathematics, or simulated
      tasks to lab-based experimentation and broader scientific domains?
    - How much of reported success comes from infrastructure, search, memory, or verification
      scaffolding rather than the underlying model's scientific reasoning?
    - Are negative knowledge banks robust across failure types and task families beyond
      same-task retries and PDE transfer cases shown in the packet?
    - Missing limitations, code, datasets, or external baselines leave reproducibility
      and standardization as verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流水线
      解决的问题: 将假设生成、代码编写、实验执行、结果分析和论文起草整合为一个迭代科研工作流。
      尚未覆盖: 可靠性不稳定：某系统三篇工作坊投稿中仅一篇通过同行评审，验证仍较窄，未达到完整会议或多领域证据。
    - 路线: 发现智能体的基准与评测设计
      解决的问题: 通过任务和指标评估假设检验、实验设计、结果解释与消融规划能力，并与人类或基线比较。
      尚未覆盖: 最佳模型平均仅识别45%的原始消融项；代理指标尚未证明与真实科研效用或实验室发现一致。
    - 路线: 失败感知记忆与过程改进
      解决的问题: 将失败尝试转化为结构化负知识，供下游智能体采纳或拒绝，以提升重试和跨任务迁移效果，同时减少token消耗。
      尚未覆盖: 证据限于ScienceAgentBench和非线性PDE任务；更广泛失败模式、记忆噪声和长周期科研工作流尚未覆盖。
    - 路线: 交互式多智能体研究基础设施
      解决的问题: 将单点模型想法转化为可运行研究栈，提供可定制角色、实时监控、代码工具、工件检查和回滚/恢复。
      尚未覆盖: 评估依赖五个内部AI案例和专家偏好，尚未在硬件、数据集和用户设置上进行外部标准化验证。
    共识:
    - 工作将实验自动化视为覆盖想法、执行、分析和报告的迭代智能体循环，而不是孤立模型推理。
    - 评估依赖任务完成、消融召回、LLM评审分数、同行评审或专家偏好，且通常在狭窄领域内对比基线智能体。
    - 结构化记忆、验证循环或监控被引入以减少失败并提升可复现性，但其单独贡献尚未充分测量。
    - 可复现性信号不一：部分系统报告代码或工件，若干高排名论文缺少明确局限或外部验证细节。
    分歧:
    - 评测目标不同：全论文生成、单独消融规划与模拟环境中的完整发现任务并存。
    - 交互模式不同：全自主系统与可定制角色、人在回路的实时监控平台并存。
    - 失败处理不同：内部逻辑验证、负失败记忆库或实验管理器树搜索。
    - 监督信号不同：LLM评审、同行评审、专家偏好或任务完成指标。
    - 领域侧重不同：实证机器学习、应用数学或理论驱动工作与模拟科学主题。
    开放问题:
    - LLM评审和代理指标在多大程度上与同行评审接受和长期科学影响一致？现有证据显示一篇通过同行评审且消融召回仍低于人类水平。
    - 端到端系统能否从狭窄的机器学习、应用数学或模拟任务迁移到实验室实验和更广泛科学领域？
    - 报告的成功有多少来自基础设施、搜索、记忆或验证脚手架，而非底层模型的科学推理能力？
    - 负知识库能否在已展示的同任务重试和PDE迁移之外，对更多失败类型和任务族保持稳健？
    - 部分论文缺少局限性、代码、数据集或外部基线，使可复现性和标准化仍是验证缺口。
