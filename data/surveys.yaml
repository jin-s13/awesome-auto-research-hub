      尚未覆盖: 验证局限于特定模态，仪器模型失配仍存在，未展示超出显微镜或颜色混合场景的迁移。
    - 路线: 自驱动实验室噪声特征检测与恢复
      解决的问题: 基于kNN工作流分析数据集大小、噪声强度、噪声类型和特征分布，检测并纠正实验数据中的噪声特征。
