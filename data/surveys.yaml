      尚未覆盖: 构建的任务是否捕捉了真实世界科学发现的全部复杂性尚不确定；任务完成分数与长期科学影响之间的差距未被测量；这些基准上的表现可能无法迁移到开放式研究中。
    - 路线: 可靠性诊断与自我纠正
      解决的问题: 识别自主研究流程中反复出现的故障模式，并提出设计原则或结构化失败归因方法，以提高输出的可信度和实验鲁棒性。
      尚未覆盖: 分析基于少量案例，泛化性有限；自我纠正机制可能引入新的偏差或对诊断过程的过拟合；可恢复失败与不可恢复科学错误之间的边界尚未定义。
    共识:
    - 评估自主研究系统不能仅依赖任务完成度，必须纳入对科学有效性、可复现性和静默错误鲁棒性的检查。
    - 评估基础设施正从临时内部判断转向标准化基准和自动化或锚定于人类的评分规则。
    - 失败分析被公认为系统构建的必要补充，但当前分析仍处于初步阶段，覆盖范围有限。
    分歧:
    - 评估模态不同：模拟AI评审、领域特定物理验证、人类专家小组和基于任务的指标各自强调科学质量的不同侧面。
    - 系统架构从单智能体管道到多智能体团队，从完全自主操作到人机协同监控，反映了对人类监督应置于何处假设的不同。
    - 评估目标从生成论文的可接受性到基础发现过程的正确性，导致对何为成功AI科学家的定义不一致。
    开放问题:
