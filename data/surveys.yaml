  related_work_outline:
  - 'Mainstream direction: The evidence frames literature intelligence as a subcapability
    of agentic scientific discovery, with LLM-agent workflows embedding literature
    search, synthesis, knowledge retrieval, and manuscript generation inside autonomous
    research loops.'
  - 'Shared research pattern: Systems combine multi-agent orchestration with verification
    or self-critique loops and automated retrieval; evaluation is shifting toward
    evidence-grounded benchmarks, blinded tasks, and rubric-based or human-anchored
    judgments.'
  - 'Key differences: Work differs in supervision mode, domain scope, and evaluation
    target—final generated-paper quality, evidence maturity from blinded data, or
    domain task accuracy with human baselines.'
  - 'Trend evolution: From 2025 surveys and domain-specific benchmarks toward 2026
    self-evolving frameworks and failure analyses; the narrow year span places this
    within the current frontier, with reliability and evidence maturity gaining emphasis.'
  - 'Open questions: Whether automated judges catch hallucinated literature and unsupported
    gaps, whether results generalize across base models and domains, and which design
    principles reduce long-horizon failure modes remain unresolved.'
  related_work_outline_zh:
  - 主流方向：证据将文献智能定位为智能体科学发现的子能力，由LLM智能体工作流在自主研究中嵌入文献检索、综合、知识检索和论文生成。
  - 研究共性：系统普遍采用多智能体编排、验证或自我批判循环和自动检索；评测正转向证据基准、盲任务以及基于评分或人类锚定的判断。
  - 关键差异：监督模式、领域范围和评测目标不同；目标是最终生成论文质量、盲数据证据成熟度，或带人类基线的领域任务精度。
  - 趋势演进：从2025年的综述与领域基准，转向2026年的自演化框架和失败分析；年份较窄，属当前前沿，可靠性与证据成熟度更受重视。
  - 开放问题：自动评审能否识别幻觉文献与无证据缺口、结果是否跨基座模型和领域泛化、哪些设计原则能减少长周期失败模式，仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end research and literature synthesis agents
      what_it_solves: Integrates literature retrieval, synthesis, verification, derivation
        or proof writing, experimentation, and manuscript generation into one agentic
        workflow.
      what_remains_open: Generated-paper rubric scores do not yet prove faithful citation,
        literature understanding, or discovery beyond the curated evaluation setting.
    - line: Evidence-grounded evaluation and benchmarking
      what_it_solves: Measures whether agents produce claims supported by evidence
        using blinded tasks, automated LLM judges, and human baselines.
      what_remains_open: Generalizability across base models and domains is unproven;
        agents still lack controls, robustness, falsifiability, and cross-dataset
        generalization.
    - line: Self-evolving agent infrastructure
      what_it_solves: Provides domain-agnostic frameworks that iteratively refine
        hypotheses, self-critique, and accumulate knowledge across experimental cycles.
      what_remains_open: Benchmark gains are reported on four challenge sets, but
        evidence for literature review automation and external validation across settings
        is absent.
    - line: Failure analysis and research-process design
      what_it_solves: Identifies recurring failure modes in autonomous research and
        turns them into design principles for more robust agents.
      what_remains_open: Evidence comes from a small case study; whether design principles
        causally reduce failures or improve literature synthesis is not established.
    consensus:
    - LLM-based research agents can execute retrieval, analysis, and writing workflows,
      but autonomous literature synthesis and discovery remain unreliable.
    - Verification loops, self-critique, and evidence-grounded scoring are recurring
      mechanisms aimed at reducing unsupported claims.
    - Current agents plateau or fail on controls, robustness, falsifiability, and
      cross-dataset generalization rather than showing consistent scientific judgment.
    - Human review or human baselines remain a key anchor for assessing generated
      research and discovery outputs.
    disagreements:
    - 'Evaluation targets differ: final generated-paper quality under an LLM rubric
      versus evidence maturity inferred from blinded data and artifacts versus domain
      task accuracy with human baselines.'
    - 'Interaction modes differ: human principal investigator directing an agent,
      self-evolving autonomous agent loops, and staged multi-agent pipelines.'
    - Domain scope and evidence type differ across applied mathematics, single-cell
      omics, and general scientific challenge suites, which changes what literature
      and discovery failures are visible.
    - 'Claims diverge on current capability: some works emphasize state-of-the-art
      benchmark gains, while others emphasize plateauing and missing scientific taste.'
    open_questions:
    - Can automated evidence-grounded judges detect hallucinated citations or unsupported
      literature gaps without leaking hidden conclusions?
    - Do rubric and benchmark scores predict trusted literature reviews and gap discovery
      outside the specific domains and base models studied?
    - Which mechanisms reduce failure modes such as implementation drift, memory degradation,
      and overexcitement in long-horizon literature workflows?
    - How can self-evolving scientific agents be externally validated across hardware,
      datasets, literature corpora, and user settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端研究与文献综合智能体
      解决的问题: 将文献检索、综合、验证、推导或证明、实验和论文生成整合到单一智能体工作流中。
      尚未覆盖: 生成论文评分尚未证明引用忠实、文献理解或在受控评测之外的科学发现能力。
    - 路线: 证据锚定的评测与基准
      解决的问题: 通过盲任务、自动LLM裁判和人类基线，衡量智能体主张是否由证据支持。
      尚未覆盖: 跨基座模型和领域的泛化性未证实；智能体仍缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 路线: 自演化智能体基础设施
      解决的问题: 提供领域无关框架，在实验周期中迭代优化假设、自我批判并积累知识。
      尚未覆盖: 仅在四个基准上报告提升，缺少文献综述自动化与跨设置外部验证证据。
    - 路线: 失败分析与研究流程设计
      解决的问题: 识别自主研究中的反复失败模式，并转化为更稳健智能体的设计原则。
      尚未覆盖: 证据来自小规模案例，设计原则能否因果减少失败并改善文献综合尚未建立。
    共识:
    - 基于LLM的研究智能体能执行检索、分析和写作流程，但自主文献综合与发现仍不可靠。
    - 验证循环、自我批判和证据锚定评分是减少无支撑主张的反复出现机制。
    - 当前智能体在对照、稳健性、可证伪性和跨数据集泛化上停留或失败，而非展示一致的科学判断。
    - 人类评审或人类基线仍是评估生成研究与发现产出的关键锚点。
    分歧:
    - 评测目标不同：LLM评分下的最终生成论文质量、基于盲数据和工件推断的证据成熟度、带人类基线的领域任务精度。
    - 交互模式不同：人类首席研究员指挥智能体、自演化自主循环、分阶段多智能体流水线。
    - 领域范围与证据类型不同：应用数学、单细胞组学和通用科学挑战，导致可见的文献与发现失败不同。
    - 能力判断不同：部分工作强调最先进基准提升，部分工作强调平台期和科学品味缺失。
    开放问题:
    - 自动化证据评测能否识别幻觉引用或无证据的文献缺口，且不泄漏隐藏结论？
    - 评分和基准成绩能否预测在特定领域与基座模型之外的文献综述和缺口发现可信度？
    - 哪些机制能在长周期文献工作流中减少实现漂移、记忆退化和过度乐观？
    - 自演化科学智能体如何在硬件、数据集、文献语料和用户设置中进行外部验证？
