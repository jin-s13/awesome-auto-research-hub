  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流程
      解决的问题: 把想法生成、代码实现、实验执行、可视化和论文撰写串成无需人工模板的自动化闭环。
      尚未覆盖: 同行评审通过的一致性不足；生成的创新是否属于研究级洞察还是局部工程扫描不清。
    - 路线: 基准环境与真实场景智能体评测
      解决的问题: 通过多任务模拟环境或科学ML基准，用任务完成、轨迹动作或可解释知识等指标让自动化发现能力具备可比性。
      尚未覆盖: 自动或LLM评分与人类科学效用是否一致；当前证据更多覆盖代码和模拟任务，实验室实验不足。
    - 路线: 失败感知与多智能体协调基础设施
      解决的问题: 把失败尝试转化为可复用的负知识，并通过团队角色、监控、回滚和可执行实验工具支撑可运行流程。
      尚未覆盖: 评估集中在少量案例研究；失败知识跨领域、跨任务迁移的证据仍有限。
    - 路线: 领域专用形式化推理与验证系统
      解决的问题: 在应用数学等理论驱动场景中自动进行推导、证明和手稿准备，并用内部验证循环审计逻辑一致性。
      尚未覆盖: 证据依赖LLM评审量规且局限性记录稀疏；向其他形式化或实证领域的泛化未验证。
    共识:
    - 自主智能体已经能执行实验生命周期中的大部分环节，包括想法生成、代码运行、可视化和论文生成。
    - 内部验证、模拟评审或失败记忆是减少基础错误和复用实验经验的共同机制。
    - 评测目标围绕完整科学发现循环和多步实验推理展开，而不是孤立预测或单步控制任务。
    - 人类角色正在从直接执行每个实验步骤转向首席研究员、评审者、策展者或监控者。
    分歧:
    - 评测重点不同：基准任务完成与轨迹质量、生成论文评审分数、相对已发表最优模型的改进程度等取向并存。
    - 系统组织方式不同：单一条自动化流水线、多智能体团队看板、策展者与研究者共享负记忆等架构各有侧重。
    - 价值证据不同：有的用LLM或工作坊评审证明质量，有的显示提升主要来自ML工程经验而非研究级领域洞察。
    - 领域范围不同：形式化应用数学、机器学习子领域、模拟发现任务和科学ML基准之间缺少统一的外部验证。
    开放问题:
    - 如何区分自主智能体的真正科研洞察与局部工程扫描或配置调优收益？
    - 自动评分和LLM评审是否能预测人类同行判断或下游科研决策效用？
    - 失败感知记忆与多智能体协调能否在更长任务时间和不同学科之间迁移？
    - 当前证据中代码、数据集、基线和局限信息缺失之处，哪些属于验证缺口而非能力缺口的直接证明？
    - 代码式实验自动化在多大程度上能扩展到证据中缺失的湿实验或实验室自动化全流程？
