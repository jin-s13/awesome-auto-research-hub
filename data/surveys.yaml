    - What is the optimal mode and granularity of human intervention for autonomous
      research writing across domains?
    - Can verification gates reduce observed missed-failure rates while remaining
      general across visual, mathematical, and empirical evidence?
    - Do improvements on experiment-stage benchmarks transfer to full manuscript generation
      and domain-specific scientific discovery?
    - Are missing limitation statements, baseline details, and code artifacts in some
      papers evaluation gaps or only documentation gaps?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研论文生成流水线
      解决的问题: 从轻量提示生成可提交的研究工件，包括想法、代码、实验、图表和论文，降低写作与实验成本。
      尚未覆盖: 在工作坊或单一领域之外的一致接收，以及长时间执行中对静默失败的鲁棒性。
    - 路线: 验证、自我纠正与失败归因
      解决的问题: 通过评审门控、失败归因和实证报告约束，在最终成稿前捕获逻辑错误、幻觉数字和无效声明。
      尚未覆盖: 根因覆盖和漏检率，尤其是在视觉、数学和领域专用证据上的稳定性。
    - 路线: 人机协作与干预设计
      解决的问题: 在高杠杆决策点引入专家判断，提升研究质量和可信度，优于完全自主执行。
      尚未覆盖: 最优干预粒度、人类负担及跨领域任务迁移。
    - 路线: 自动评审与生成论文评测
      解决的问题: 通过模拟评审或同行评审代理，规模化评估AI生成论文。
      尚未覆盖: 自动评分是否与人类接收结果及长期科学价值一致。
    - 路线: 领域专用AI科学家与可信科研写作
      解决的问题: 将论文声明约束到经过领域验证的结果，如定理验证或CFD物理感知检查。
      尚未覆盖: 跨出内置验证环境的泛化能力，以及植入或静默失败的覆盖范围。
    共识:
    - 端到端系统已从单纯的实验执行扩展到论文起草、自动评审和某种形式的验证。
    - 多智能体分解和内部验证循环被用于提升生成声明的可信度。
    - 生成论文能在自动评审或工作坊同行评审下达到或接近接收阈值，但一致性仍有限。
    - 人机协作常被设计为首席研究员-代理或定向干预模式，而非完全自动化的替代。
    - 代码和仓库工件越来越多地用于支持可复现性，但部分论文仍缺少完整局限性说明。
    分歧:
    - 验证信号不同：逻辑一致性审计、物理感知视觉门控、多假设失败归因、结构化辩论和自愈执行并存。
    - 交互模式不同：完全自主加模拟评审、高杠杆点人工定向干预、以及PI-代理协作模式相互竞争。
    - 评测目标不同：LLM评审标准、工作坊同行评审、实验阶段基准、盲评分数和领域指标被分别采用。
    - 领域侧重不同：从通用机器学习子领域到应用数学、计算流体动力学和多领域实验基准不等。
    - 报告保证不同：部分系统将声明约束到实测值或验证引用，其他系统未展示可见的局限性证据。
    开放问题:
    - 自动评审分数与人类同行评审接受度及长期科学价值之间的一致性如何？
    - 在不同领域中，人机干预的最优模式和粒度是什么？
    - 验证门控能否在保持通用性的同时降低已观察到的漏检率？
    - 实验阶段基准上的提升能否迁移到完整论文生成和领域科学发现？
    - 部分论文缺失局限性、基线或代码细节，是评价缺口还是仅为文档缺口？
