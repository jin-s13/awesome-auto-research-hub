  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research workflows
      what_it_solves: Automates the full pipeline from idea generation, code writing,
        experiment execution, visualization, and manuscript drafting to paper review.
      what_remains_open: Reliability remains inconsistent; available evidence shows
        workshop-level acceptance or rubric-based success, not broad full-conference
        or multi-domain validation.
    - line: Failure-aware shared memory and self-correction
      what_it_solves: Records failed attempts as bounded structured memories that
        downstream agents can adopt or reject, reducing wasted effort and token cost
        on retry and transfer tasks.
      what_remains_open: Evidence is limited to ScienceAgentBench and PDE-style tasks;
        transfer to diverse lab or experimental science remains unverified.
    - line: Evaluation environments and experiment planning benchmarks
      what_it_solves: Offers virtual discovery tasks and ablation planning instances
        so agent capabilities can be measured on hypothesis formation, experiment
        execution, and missing-experiment identification.
      what_remains_open: Automatic metrics and LM judges are proxies; demonstrated
        coverage is limited, and current systems still underperform human-level ablation
        identification.
    - line: Interactive multi-agent research platforms
      what_it_solves: Provides configurable roles, real-time monitoring, artifact
        inspection, rollback/resume control, and code-harness integration for runnable
        experiment loops.
      what_remains_open: Validation comes from five internal AI case studies, so external
        reproducibility across hardware, datasets, and user settings is not established.
    - line: Automated review and verification
      what_it_solves: Adds LLM/VLM reviewers, rubric scoring, and internal logical
        coherence checks to catch errors and evaluate generated manuscripts before
        human inspection.
      what_remains_open: Reviewer-calibration evidence is only approximate; long-term
        validity and ability to substitute human peer review across venues remain
        open.
    consensus:
    - LLM-based agents can already automate multiple experiment/research stages, from
      hypothesis generation and coding to execution, analysis, and manuscript writing.
    - Current evaluation relies heavily on LLM judges, simulated review, internal
      case studies, or benchmark metrics as proxies for scientific quality.
    - 'The available results are early-stage: success is demonstrated in narrow domains,
      limited case studies, or workshop-level reviews rather than broad external validation.'
    disagreements:
    - 'The target scope differs: some systems pursue complete manuscript generation
      and peer review, while others focus on ablation experiment planning, virtual
      discovery tasks, or interactive research orchestration.'
    - 'Interaction and control modes differ: fully autonomous pipelines, human-as-principal-investigator
      collaboration with rollback controls, and shared-memory systems curated by a
      separate agent.'
    - 'Feedback signals differ: simulated or VLM-based review, internal logical verification,
      failure records, or LLM expert preference judges.'
    - 'Evaluation targets differ: paper acceptance thresholds, task completion and
      interpretable knowledge, ablation recall, or expert preference over platform
      outputs.'
    open_questions:
    - How well do LLM-based reviewers, rubric scores, and task metrics align with
      real scientific validity or lab decision utility?
    - Do failure-aware memory and verification loops transfer from PDE/ScienceAgentBench-style
      settings to diverse experimental science domains?
    - What is needed to move from inconsistent workshop-level acceptance to reliable
      full peer review across conferences or fields?
    - Can interactive platforms be reproduced and compared without standardized external
      validation across hardware, codebases, datasets, and user settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究工作流
      解决的问题: 自动完成从想法生成、代码编写、实验执行、可视化和论文写作到评审的完整流程。
      尚未覆盖: 可靠性不稳定；现有证据多为工作坊级接受或基于评分标准的成功，缺少多领域和完整会议水平验证。
    - 路线: 失败感知共享记忆与自我纠正
      解决的问题: 把失败尝试转化为有界结构化记忆，供下游智能体采纳或拒绝，从而减少重试和迁移任务中的无效计算与令牌成本。
      尚未覆盖: 证据限于ScienceAgentBench和PDE类任务；向多样实验科学迁移尚未被充分验证。
    - 路线: 评测环境与实验规划基准
      解决的问题: 提供虚拟发现任务和消融规划实例，衡量智能体在假设形成、实验执行和缺失实验识别上的能力。
      尚未覆盖: 自动指标和LLM裁判只是代理指标；当前覆盖有限，且系统在消融识别上仍低于人类水平。
    - 路线: 交互式多智能体研究平台
      解决的问题: 提供可配置角色、实时监控、工件检查、回滚/恢复控制和代码工具集成，支持可运行的实验循环。
      尚未覆盖: 验证来自五个内部AI案例，跨硬件、数据集和用户设置的外部可复现性尚未建立。
    - 路线: 自动评审与验证
      解决的问题: 加入LLM/VLM评审、评分标准和内部逻辑一致性检查，在人工检查前发现错误并评估生成论文。
      尚未覆盖: 评审校准证据仅为近似；其长期有效性和在不同评审场合替代人工同行评审的能力仍不明确。
    共识:
    - LLM智能体已经能够自动化科研/实验的多个阶段，包括提出假设、编写代码、执行实验、分析结果和撰写论文。
    - 当前评估高度依赖LLM评审、模拟评审、内部案例或基准指标作为科学质量的代理。
    - 现有结果仍处于早期：成功多在狭窄领域、少量案例或工作坊级评审，缺乏广泛外部验证。
    分歧:
    - 目标范围不同：有的追求完整论文生成和同行评审，有的聚焦消融实验规划、虚拟发现任务或交互式研究编排。
    - 交互与控制模式不同：存在全自动流程、人类作为首席研究员配合回滚控制的协作，以及由单独智能体管理的共享记忆系统。
    - 反馈信号不同：包括模拟或VLM评审、内部逻辑验证、失败记录或LLM专家偏好评判。
    - 评测目标不同：包括论文接受阈值、任务完成和可解释知识、消融召回率或专家对平台输出的偏好。
    开放问题:
    - LLM评审、评分标准和任务指标与真实科学有效性或实验决策效用之间的一致性如何？
    - 失败感知记忆和验证循环能否从PDE/ScienceAgentBench类设置迁移到多样的实验科学领域？
    - 从不稳定工作坊级通过到稳定通过完整同行评审，还需要解决哪些问题？
    - 在没有跨硬件、代码库、数据集和用户设置的标准化外部验证时，交互式平台能否被复现和比较？
