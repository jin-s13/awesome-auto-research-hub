  related_work_outline:
  - 'Mainstream direction: Building closed-loop autonomous research agents that generate
    hypotheses or research ideas, execute experiments, and revise from empirical feedback,
    with reliability gates and selective human oversight.'
  - 'Shared research pattern: Separating generative idea proposal from verifiable
    execution and evaluation; using failed runs as feedback; tying reported claims
    to measured results.'
  - 'Key differences: Full autonomy versus human-in-the-loop orchestration, domain-specific
    validity gates versus general frameworks, and benchmark scores versus expert case-study
    preference versus task-specific improvement.'
  - 'Trend evolution: Within the available top-paper evidence concentrated in 2025-2026,
    systems are moving from survey and benchmark framing toward self-correcting, self-evolving,
    and human-collaborative closed-loop agents.'
  - 'Open questions: Whether short-run benchmark or case-study improvements transfer
    to real discovery, how to optimize human intervention, how robust verification
    gates are, and how well systems reproduce across domains.'
  related_work_outline_zh:
  - 主流方向：构建闭环自主研究智能体，生成假设或研究思路，执行实验并根据经验反馈修正，同时加入可靠性门控和选择性人类监督。
  - 研究共性：把生成式思路提出与可验证执行/评估分离；将失败运行作为反馈；让报告主张可追溯到测量结果。
  - 关键差异：完全自主与人在环编排、领域专用验证门控与跨领域通用框架、以及基准分数与专家案例偏好/任务改进之间的证据差异。
  - 趋势演进：可用的高排名证据集中在 2025-2026 年；系统正从综述与基准构建走向自我纠正、自我演化和人机协作的闭环智能体。
  - 开放问题：短期基准或案例改进是否迁移到真实发现，如何优化人类干预，验证门控的鲁棒性，以及跨领域可复现性。
  literature_review:
    line_of_work_matrix:
    - line: Closed-loop autonomous research agents
      what_it_solves: Proposing hypotheses and converting them into executable experiments,
        then using execution results to revise subsequent ideas.
      what_remains_open: Long-horizon discovery claims rely mostly on curated benchmarks
        and narrow case studies; transfer to broader scientific workflows is not established.
    - line: Reliability, verification, and self-correction
      what_it_solves: Suppressing hallucinated findings, silent execution failures,
        and invalid hypotheses through deterministic gates, verifiable reporting,
        and failure attribution.
      what_remains_open: 'Verification is partial: explicit gates can miss planted
        failures, and no common standard says which failures require human review.'
    - line: Evaluation and benchmarking for AI scientists
      what_it_solves: Providing tasks, baselines, metrics, and human reference points
        for comparing hypothesis-generation and discovery performance.
      what_remains_open: Proxy metrics and case-study judgments are not yet linked
        to real scientific outcome quality or reproducibility across settings.
    - line: Human-AI research orchestration
      what_it_solves: Deciding where human judgment should enter an otherwise automated
        research loop, especially at high-leverage decision points.
      what_remains_open: The optimal granularity, mode, and cost of human intervention
        are underexplored across domains and team configurations.
    - line: Domain-grounded discovery and survey organization
      what_it_solves: Embedding domain-specific constraints and organizing agentic-science
        capabilities into frameworks for chemistry, biology, materials, or expert-defined
        domains.
      what_remains_open: Cross-domain portability and empirical validation of proposed
        taxonomies remain open; categories are descriptive rather than predictive.
    consensus:
    - Research systems increasingly close the loop from hypothesis generation to executed
      experiments rather than stopping at textual ideation.
    - Verification and self-correction are treated as central, with generated claims
      expected to trace back to measured or executed evidence.
    - 'Human collaboration is not rejected but repositioned: targeted intervention
      at high-leverage decisions can outperform both full autonomy and exhaustive
      oversight.'
    - Evaluation is moving toward benchmarks and task-specific case studies with baseline
      comparisons, though evidence remains concentrated in narrow deployments.
    disagreements:
    - 'Autonomy level differs: some systems emphasize fully autonomous loops, while
      others make interactive monitoring and human intervention a core control surface.'
    - 'Verification mechanism differs: some rely on domain validity gates or visual
      inspection, others on deterministic source-edit and promotion authority, and
      others on failure-attribution routing.'
    - 'Evaluation target differs: benchmark scores, expert preference on case studies,
      and task-specific performance improvements are not interchangeable evidence.'
    - 'Domain scope differs: some work embeds physics or biological constraints, while
      other work pursues domain-agnostic frameworks across disciplines.'
    open_questions:
    - Do benchmark gains such as those on ARC-Bench or BAISBench predict real scientific
      discovery utility, or only execution quality on curated tasks?
    - How should verification boundaries be set when a vision-language gate misses
      some planted silent failures?
    - When and at what granularity is human intervention genuinely necessary, given
      evidence that targeted collaboration can outperform both full autonomy and exhaustive
      oversight?
    - Can domain-specific research agents transfer across domains without rebuilding
      verification and evaluation for each field?
    - Does short-horizon architecture or parameter search constitute open-ended discovery,
      or only local task adaptation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 闭环自主研究智能体
      解决的问题: 把假设转化为可执行实验，并利用执行结果修正后续研究思路。
      尚未覆盖: 长期发现的证据多来自精心设计的基准和狭窄案例；向更广泛科学工作流的迁移尚未建立。
    - 路线: 可靠性、验证与自我纠正
      解决的问题: 通过确定性门控、可验证报告和失败归因抑制幻觉结论、静默执行失败和无效假设。
      尚未覆盖: 验证仍不完整：显式门控也会漏掉植入失败，且缺少哪种失败需人工复核的通用标准。
    - 路线: AI科学家评估与基准
      解决的问题: 用任务、基线、指标和人类参照点比较假设生成与发现能力。
      尚未覆盖: 代理指标和案例判断尚未关联到真实科学成果质量或跨设置可复现性。
    - 路线: 人机研究编排
      解决的问题: 决定人类判断应在自动研究循环的何处介入，尤其是高杠杆决策点。
      尚未覆盖: 人类干预的最优粒度、模式和成本在不同领域与团队配置下仍不清楚。
    - 路线: 领域约束的发现与综述组织
      解决的问题: 嵌入领域特定约束，并将智能体科学能力组织到化学、生物学、材料或专家定义领域的框架中。
      尚未覆盖: 跨领域迁移和分类体系的实证预测力仍开放；现有分类多为描述性而非预测性。
    共识:
    - 研究系统越来越多地在假设生成之后继续闭环执行实验，而不是停留在文本构思阶段。
    - 验证和自我纠正被视为核心，生成的研究主张需要追溯到可测量或已执行的证据。
    - 人类协作被重新定位：在高杠杆决策点精准介入常优于完全自主和逐步详尽监督。
    - 评估向基准和案例研究集中，但证据仍多来自狭窄部署。
    分歧:
    - 自主程度不同：部分系统以完全自主为主，部分将交互式监控与人工介入作为核心控制面。
    - 验证机制不同：有的依赖领域有效性格控或视觉检查，有的采用确定性源码编辑与晋升权限，有的使用失败归因路由。
    - 评测目标不同：基准分数、专家对案例的偏好、以及任务性能改进并非同一类证据。
    - 领域范围不同：部分工作嵌入物理或生物约束，部分追求跨学科通用框架。
    开放问题:
    - ARC-Bench、BAISBench 等基准提升能否预测真实科学发现效用，还是仅反映受控任务的执行质量？
    - 当视觉-语言门控漏掉植入静默失败时，验证边界应如何设置？
    - 既然精准人类协作可同时优于完全自主和详尽监督，如何确定最优干预粒度与时机？
    - 领域专用研究智能体是否必须为每个领域重建验证与评估，还是能形成跨领域标准？
    - 现有短周期搜索改进是否足以称为开放式发现，如何区分局部任务适配与真正的新科学问题生成？
