  related_work_outline:
  - 'Mainstream direction: Agentic systems are being built to automate scientific
    workflows that span literature retrieval, synthesis, reasoning, experimentation,
    and manuscript generation, with verification loops and evaluation benchmarks as
    core components.'
  - 'Shared research pattern: Multi-stage agents retrieve knowledge, generate analyses
    or papers, and are judged by human baselines, LLM rubrics, or blinded peer-reviewed
    tasks; current work emphasizes evidence quality and failure diagnosis over raw
    task success.'
  - 'Key differences: Evaluation targets vary from open-ended evidence maturity and
    domain-specific biological questions to broad benchmark scores; systems differ
    in autonomy, domain specificity, and whether they self-evolve or use fixed pipelines.'
  - 'Trend evolution: The 2025 evidence is mostly survey and domain-specific benchmarking;
    2026 shifts toward blind evidence-grounded evaluation, failure-mode case studies,
    and self-evolving agent frameworks, indicating a current-frontier move from capability
    claims to reliability assessment.'
  - 'Open questions: How to validate LLM-judge evidence scores against scientific
    validity; how to make literature synthesis source-grounded; how to transfer failure-mode
    principles across domains; and whether self-evolving agents generalize beyond
    reported benchmark gains.'
  related_work_outline_zh:
  - 主流方向：构建能自动完成文献检索、综合、推理、实验和论文初稿的科学智能体系统，并加入验证循环和评测基准作为核心组件。
  - 研究共性：多阶段智能体检索知识并生成分析或手稿；评估使用人类基线、LLM评分或盲审任务，当前重点从任务成功转向证据质量与失败诊断。
  - 关键差异：评测目标涵盖开放证据成熟度、领域生物问题和广泛基准分数；系统在自主程度、领域专用性与是否自我演化上不同。
  - 趋势演进：2025年以综述和领域基准为主，2026年转向盲评证据基准、失败模式案例与自演化框架，显示当前前沿正从能力声明走向可靠性评估。
  - 开放问题：LLM证据分数能否反映科学有效性；文献综合如何做到来源可靠；失败模式原则能否跨领域迁移；自演化智能体是否能超越基准分数提升。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end literature and manuscript synthesis agents
      what_it_solves: Automates retrieval, synthesis, derivation, experiment design,
        and paper drafting with internal verification and self-improvement loops.
      what_remains_open: Scientific validity beyond curated LLM-rubric scores; missing
        limitation statements and external validation; source-grounding reliability.
    - line: Evidence-grounded evaluation of open-ended discovery agents
      what_it_solves: Creates blinded tasks and automated evidence-maturity scoring
        to compare agent claims without reproducing hidden target studies.
      what_remains_open: Evaluation based on one frozen base model; LLM-judge alignment
        with human scientific validity; limited domain and task coverage.
    - line: Domain-specific scientific discovery benchmarking
      what_it_solves: Measures AI scientists on real biological data using annotation
        and multiple-choice discovery questions with a human baseline.
      what_remains_open: Narrow biological domain; multiple-choice format may not
        capture open-ended discovery; no visible limitation analysis.
    - line: Conceptual surveys and failure-mode analysis
      what_it_solves: Organizes agentic scientific discovery systems, metrics, frameworks,
        datasets, and documents recurring failure modes and design principles.
      what_remains_open: Proposed categories are not empirically validated; design
        principles are derived from few attempts and their cross-domain transfer is
        untested.
    - line: Self-evolving domain-agnostic agent frameworks
      what_it_solves: Scales agentic science through iterative hypothesis refinement,
        self-critique, and knowledge accumulation across domains.
      what_remains_open: Validation rests on broad benchmark scores; external reproducibility
        across hardware, datasets, and user settings is not established.
    consensus:
    - Agentic systems are used across scientific workflows including literature retrieval,
      synthesis, analysis, experimentation, and writing, not only single-step tasks.
    - Current agents are not yet fully autonomous scientists and still rely on human
      baselines, expert oversight, or external evaluation.
    - Evaluation is shifting toward evidence quality, auditability, controls, robustness,
      and falsifiability rather than final-answer accuracy alone.
    - Internal verification, self-critique, retrieval augmentation, and knowledge
      accumulation are recurring mechanisms intended to improve reliability.
    disagreements:
    - 'Evaluation target: some work scores open-ended evidence maturity from blinded
      tasks, while other work uses domain-specific annotation and multiple-choice
      questions or broad benchmark scores.'
    - 'Supervision signal: hidden peer-reviewed conclusions with frozen data differ
      from human baseline comparisons and from curated LLM review rubrics.'
    - 'Interaction mode: human-as-PI collaborative generation contrasts with fully
      autonomous pipelines and self-evolving multi-agent ecosystems.'
    - 'Deployment setting: domain-specific applied mathematics or omics workflows
      differ from domain-agnostic general scientific agent frameworks.'
    open_questions:
    - How well do automated evidence-maturity scores and LLM rubrics predict real
      scientific validity and reproducibility?
    - Can literature retrieval and synthesis be made source-grounded enough to avoid
      hallucinated or shallow coverage?
    - Do failure modes identified in a small set of autonomous research attempts transfer
      to other scientific domains and agent designs?
    - What evaluation setups can close the gap between competent analysis execution
      and scientific judgment such as controls, robustness, falsifiability, and cross-dataset
      generalization?
    - Can self-evolving agent frameworks demonstrate utility beyond overlapping benchmark
      score improvements and across external deployment settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端文献与手稿合成智能体
      解决的问题: 把检索、综合、推导、实验设计和论文起草组织成带内部验证与自我改进环的可运行流程。
      尚未覆盖: 在精选LLM评分之外的真实科学有效性；缺少局限性说明与外部验证；来源可靠性不足。
    - 路线: 面向开放式发现智能体的证据化评测
      解决的问题: 通过盲任务和自动化证据成熟度评分比较智能体主张，而无需复现隐藏的目标研究。
      尚未覆盖: 仅基于一个冻结基座模型；LLM评判与人类科学有效性的一致性；领域和任务覆盖有限。
    - 路线: 领域专用科学发现基准
      解决的问题: 在真实生物数据上以注释和选择题形式结合人类基线评估AI科学家。
      尚未覆盖: 领域较窄；选择题格式可能无法反映开放式发现；缺少可见的局限分析。
    - 路线: 概念综述与失败模式分析
      解决的问题: 整理智能体科学发现系统、指标、框架和数据集，并记录重复出现的失败模式与设计原则。
      尚未覆盖: 分类缺乏直接实证验证；设计原则来自少量尝试，跨领域迁移未经验证。
    - 路线: 自我演化的领域无关智能体框架
      解决的问题: 通过迭代假设优化、自我批判和知识积累扩展跨领域智能体科学。
      尚未覆盖: 验证依赖广泛基准分数；跨硬件、数据集和用户设置的外部可复现性尚未确立。
    共识:
    - 智能体系统被用于检索、综合、分析、实验和写作等科学工作流，而不仅是单步任务。
    - 当前智能体尚未成为完全自主的科学家，仍依赖人类基线、专家监督或外部评估。
    - 评测正从只看最终答案正确性，转向证据质量、可审计性、对照、稳健性和可证伪性。
    - 内部验证、自我批判、检索增强和知识积累是提升可靠性的常见机制。
    分歧:
    - 评测目标：有的工作对盲任务的开放证据成熟度评分，有的使用领域注释和选择题，有的使用广泛基准分数。
    - 监督信号：隐藏同行评审结论和冻结数据不同于人类基线比较，也不同于精选LLM评审量表。
    - 交互模式：人类担任首席研究员的协作式生成，与完全自主流水线和自演化多智能体系统存在差异。
    - 部署场景：特定应用数学或组学工作流不同于领域无关的通用科学智能体框架。
    开放问题:
    - 自动化证据成熟度分数和LLM评分量表能在多大程度上预测真实科学有效性与可复现性？
    - 文献检索与综合能否做到足够来源可靠，以避免幻觉引用或浅层覆盖？
    - 从少量自主研究尝试中识别的失败模式，能否迁移到其他科学领域和智能体设计？
    - 何种评测设置能弥补熟练分析执行与科学判断之间的差距，例如对照、稳健性、可证伪性和跨数据集泛化？
    - 自演化智能体框架能否在重叠基准分数之外，展示外部部署环境中的效用？
