      解决的问题: 自动完成从想法生成、代码执行、结果分析到论文撰写的发现循环，减少人工干预。
      尚未覆盖: 输出是否稳定且具备真正科学新颖性，自动评审通过能否迁移到更广泛同行或实际验证，仍缺少直接证据。
    - 路线: 发现与实验评测平台
      解决的问题: 通过结构化任务、基线和指标，评测智能体完成发现循环或提升已发表科学ML模型的能力。
      尚未覆盖: 任务完成和benchmark提升是否代理真实科研洞察或决策效用尚不确定；模拟任务和窄域覆盖不足。
    - 路线: 面向科研智能体的知识与失败记忆
      解决的问题: 记录检索到的知识和失败尝试，帮助智能体避免重复错误、减少token消耗并跨关联任务迁移经验。
      尚未覆盖: 在足够不同的科学领域间迁移、记忆整理质量，以及提升多少来自记忆层而非任务先验仍缺少充分证据。
    - 路线: 交互式多智能体科研基础设施与代码工具
      解决的问题: 将单个研究模型转化为可定制团队，提供监控、回滚和本地代码库、数据集、checkpoint的可执行连接。
      尚未覆盖: 平台成熟度和外部验证有限，现有评估集中在少量内部案例，跨硬件和用户设置的标准验证缺失。
    共识:
    - 多数工作围绕迭代实验循环展开：提出假设或想法、执行实验、分析结果、修改后继续，并以论文、任务完成或benchmark提升作为证据。
    - 自动评审器、任务指标和专家偏好被用作主要评价手段，但当前系统普遍需要更广的外部验证。
    - 研究者认识到知识检索、失败记忆、代码工具和监控等基础设施对提升智能体成功率有价值。
