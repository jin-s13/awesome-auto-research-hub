  related_work_outline_zh:
  - 主流方向：构建并评估能自主完成完整科学发现循环的AI智能体系统，重点日益转向可靠性、验证和可复现性。
  - 研究共性：将科学工作流（构思、编码、实验、验证、写作）模块化分解为由LLM驱动的流水线，并搭配某种形式的验证或自我纠正机制。
  - 关键差异：验证策略（基于物理的视觉门控、VLM审稿反馈、多假设因果归因）、评估范式（基准任务、模拟同行评审、人类专家判断）以及领域范围（通用ML vs. 特定领域如CFD或组学）。
  - 趋势演进：2024–2026年间，前沿从最初端到端框架（2024）发展到引入物理验证、自我纠正和多智能体协作的系统（2025–2026），出现首篇通过同行评审的AI生成论文，并涌现出领域特定基准。
  - 开放问题：如何弥合自动评估指标与真实科学价值之间的差距；如何缓解长程自主运行中的记忆退化和错误级联；如何建立覆盖发现固有开放性的标准化跨领域验证。
  literature_review:
    line_of_work_matrix:
    - line: Systems and reproducible infrastructure
      what_it_solves: Connects LLM agents into end-to-end scientific pipelines that
        generate ideas, write and execute code, verify results, and compose manuscripts,
        with recent additions of self-correction and physics-informed validation to
        improve reliability.
      what_remains_open: Cross-domain generalization and stability over long research
        horizons; even dedicated verification gates can miss failure modes (e.g.,
        AI CFD Scientist's vision gate missed 2 of 16 planted silent failures).
    - line: Evaluation and evidence design
      what_it_solves: Provides standardized tasks, difficulty levels, and automatic
        metrics to compare AI scientists' capabilities and quantify performance gaps
        relative to human baselines, as seen in DISCOVERYWORLD and BAISBench.
      what_remains_open: Whether benchmark task completion and automatic metrics align
        with real scientific utility, novelty, and reproducibility; coverage of diverse
        scientific domains remains limited.
    - line: Conceptual taxonomy and theory
      what_it_solves: Categorizes recurring failure modes (e.g., training data bias,
        implementation drift, memory degradation, weak scientific taste) and derives
        design principles for building more robust autonomous research agents.
      what_remains_open: Direct empirical validation that these categories predict
        new system behavior, and translation of the taxonomy into automated, actionable
        recovery mechanisms.
    consensus:
    - Current AI scientist systems are not yet capable of fully autonomous, reliable
      scientific discovery and require multiple layers of verification and error correction.
    - Modular decomposition of the scientific process improves system design and diagnosability.
    - Benchmarks and automated evaluation are essential infrastructure for measuring
      progress, but must be complemented by human or real-world validation.
    disagreements:
    - 'Validation mechanism: some systems rely on physics-based vision inspection
      of results, others on VLM-augmented reviewer feedback, and others on multi-hypothesis
      causal attribution of failures.'
    - 'Evaluation standard: no unified approach exists—papers use simulated reviewer
      scores, workshop peer review acceptance, task completion rates on virtual benchmarks,
      or human expert panel judgments.'
    - 'Domain scope: a few systems are tailored to a single scientific domain (CFD,
      single-cell transcriptomics), while others target general ML, leading to differing
      claims about generalization.'
    open_questions:
    - How can verification mechanisms detect and correct their own blind spots, given
      that even dedicated gates miss a fraction of failures?
    - Do current benchmarks capture the open-endedness, novelty, and intellectual
      depth of real scientific discovery, and how can proxy metrics be validated against
      downstream scientific impact?
    - What systematic mitigation strategies can address context window limitations
      and memory degradation during long-horizon autonomous research runs?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 系统与可复现基础设施
      解决的问题: 将LLM智能体连接成端到端的科学流水线，实现想法生成、代码编写与执行、结果验证和论文撰写，近期工作还加入了自我纠正和物理感知验证以提升可靠性。
      尚未覆盖: 跨领域泛化与长周期研究中的稳定性；即使专用的验证门控也可能遗漏失败模式（如AI CFD Scientist的视觉门控在16个植入静默失败中遗漏了2个）。
    - 路线: 评测与证据设计
      解决的问题: 提供标准化的任务、难度分级和自动度量，以比较不同AI科学家的能力，并量化相对于人类基线的表现差距，如DISCOVERYWORLD和BAISBench所示。
      尚未覆盖: 基准任务完成率和自动度量是否与真实科学效用、新颖性和可复现性一致；多样科学领域的覆盖度仍然有限。
    - 路线: 概念分类与理论
      解决的问题: 归纳自主研究系统中反复出现的失败模式（如训练数据偏差、实现漂移、记忆退化、科学品味薄弱），并提炼出构建更稳健AI科学家的设计原则。
      尚未覆盖: 这些分类能否预测新系统的行为，以及能否转化为可操作的自动修复机制，尚缺乏直接实证验证。
    共识:
    - 当前的AI科学家系统尚不能实现完全自主、可靠的科学发现，需要多层验证和错误纠正。
    - 科学过程的模块化分解有助于系统设计和可诊断性。
    - 基准测试和自动评估是衡量进展的必要基础设施，但必须辅以人类或真实世界的验证。
    分歧:
    - 验证机制的选择：有的依赖基于物理的视觉检验，有的使用VLM增强的审稿反馈，有的采用多假设因果归因，各有侧重。
    - 评估标准尚未统一：论文分别使用模拟评审分数、工作坊同行评审接收、虚拟基准任务完成率或人类专家小组评判。
    - 领域范围：部分系统针对特定科学领域（CFD、单细胞转录组学），而另一些面向通用ML，导致对泛化性的论断存在差异。
    开放问题:
    - 如何设计能检测并纠正自身盲区的验证机制，鉴于专用门控仍会遗漏一部分失败？
    - 现有基准是否真正捕捉了科学发现的开放性、新颖性和智力深度，代理指标如何在科学影响力上得到验证？
    - 在长程自主研究运行中，如何系统性地缓解上下文窗口限制和记忆退化问题？
