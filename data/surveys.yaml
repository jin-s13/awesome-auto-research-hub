      尚未覆盖: 现有智能体得分接近且无可靠两两分离；代理指标未必反映真实发现效用。
    - 路线: 领域特定科学发现系统
      解决的问题: 将自主研究适配到应用数学或计算流体等场景，并加入领域知识和物理感知检查。
      尚未覆盖: 领域指标改进依赖有限案例，缺少跨硬件、跨案例或跨用户设置的广泛外部验证。
    - 路线: 自动论文生成与评审
      解决的问题: 生成完整论文，并利用评审反馈（有时包括视觉-语言反馈）进行修改和筛选。
      尚未覆盖: 接受分数或工作坊接收尚不能证明科学有效性；写作质量与发现质量可能被混淆。
    共识:
    - 自主发现被构建为想法—实验—分析—写作的完整闭环，而非孤立的预测任务。
    - 仅执行成功不够；验证门、有效性检查或基于证据的评测越来越被视为必要组件。
    - 基于LLM的评判与评审正在成为可扩展的评估层，但其有效性仍是核心关切。
    - 当前系统能产出有前景的工件，但可靠性仍有限：漏检、接受不稳定和基准得分集中反复出现。
    分歧:
    - 验证信号不同：部分系统审计逻辑或数学一致性，部分检查渲染的物理场，部分依赖对执行输出的LLM评审。
    - 评测目标不同：论文接受阈值、虚拟任务完成和盲任务证据成熟度测量发现过程的不同阶段。
    - 交互模式不同：有的采用人类首席研究员与智能体研究生协作，有的追求全自动端到端研究。
    - 部署场景不同：有的面向应用数学或计算流体动力学，有的面向通用机器学习子领域或模拟科学任务。
    - 成功度量不同：每篇成本、接受阈值、领域指标改善和基准分数分离度被用于不同系统，缺乏统一校准。
