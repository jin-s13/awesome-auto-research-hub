  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery workflows
      what_it_solves: Automates hypothesis generation, code execution, experiment
        design, and manuscript or architecture production in a continuous research
        loop.
      what_remains_open: 'Reliability remains inconsistent: acceptance rates, silent-failure
        detection, and repeatable scientific validity are not established across tasks.'
    - line: Benchmark-driven evaluation design
      what_it_solves: Makes discovery-agent claims comparable through tasks, blind
        peer-study settings, human baselines, and automatic evidence-maturity metrics.
      what_remains_open: Proxy metrics and LLM judges are not yet shown to align with
        human scientific judgment, and base-model or domain coverage is narrow.
    - line: Verification, authority, and governance mechanisms
      what_it_solves: Constrains open-ended generation with review gates, physics-aware
        visual checks, or deterministic program-side authority.
      what_remains_open: Automated gates are incomplete and can miss silent failures;
        their false-negative and false-positive behavior is not yet characterized.
    - line: Domain-grounded validation
      what_it_solves: Tests agents against real or simulated domain tasks such as
