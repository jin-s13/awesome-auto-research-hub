  related_work_outline_zh:
  - 主流方向：构建内嵌验证和自我纠正的自主AI科学家系统，并建立标准化评估基准以衡量其可靠性和科学产出质量。
  - 研究共性：以LLM代理为核心，结合实验环境、代码执行、验证模块和评审环节，通过迭代或流水线方式生成研究成果，并借助人类或自动评估进行检验。
