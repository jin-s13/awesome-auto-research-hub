    研究路线矩阵:
    - 路线: 编辑器内写作、辅导与编辑助手系统（如 PaperDebugger、PaperMentor）
      解决的问题: 尝试在 Overleaf 等现有学术写作环境中支持草拟、审阅和编辑。
      尚未覆盖: 对提升作者生产力、保持作者意图和学科特有写作质量的直接证据，在本证据包中不可见。
    - 路线: 端到端多智能体研究论文写作框架（如 PaperOrchestra）
      解决的问题: 尝试协调多个智能体从研究工作中生成学术稿件。
      尚未覆盖: 生成稿件是否在流畅文本之外满足方法可靠性和事实依据，仍未验证。
    - 路线: AI评审与可靠性评估（如 PaperCritic）
      解决的问题: 尝试训练或部署用于判断论文可靠性的评审智能体。
      尚未覆盖: 与专家审稿决策的一致性，以及跨语言、跨发表文化的覆盖，缺乏可见证据。
    - 路线: 检索、复现与证据谱系智能体（如 PaSa、AutoReproduce、PaperBench）
      解决的问题: 尝试定位相关文献、复现实验，并借助论文谱系评估复制能力。
      尚未覆盖: 跨领域鲁棒性以及与真实复现结果的一致性，在现有元数据中未显示。
    - 路线: 多模态科学传播生成（如 Paper2Poster）
      解决的问题: 尝试把科学论文转换为海报等多模态制品。
      尚未覆盖: 生成视觉的技术准确性，以及领域专家对这些制品的评估，仍然开放。
    共识:
    - 现有工作汇聚于以LLM为基础的智能体，分别面向学术生产的不同环节，而不是单一通用写作模型。
    - 学术工作流常被拆分为检索、写作、编辑、评审、复现或海报生成等模块化子任务。
    - 多个系统嵌入现有学术工具或评测场景，而不是只作为孤立文本生成器出现。
    - 证据包中的排序和组件分数属于检索信号，不等于方法质量证据；方法字段大多为空。
    分歧:
    - 交互模式不同：有的作为人在环写作辅导者，有的尝试端到端自动生成稿件。
    - 评测目标不同：评审可靠性、复现成功和多模态传播质量是不同结果。
    - 人类控制程度不同：以人为中心的辅助保留作者判断，自动化写作和复现流程则减少或移除直接人工监督。
    - 集成范围不同：Overleaf编辑、海报生成、文献检索和复现管道对应不同部署场景。
    开放问题:
    - 在数据集、基线、指标和局限性字段不可见时，这些智能体如何被评价？
    - 流畅的自动写作能否同时保持方法可靠性和事实正确性？
    - AI评审和复现判断与专家人工决策及真实复现结果的一致性如何？
    - 失败如何在检索、写作、评审和复现等多智能体子任务之间传播？
    - 论文生成的多模态制品能否在领域专家判断下保持技术准确性？
