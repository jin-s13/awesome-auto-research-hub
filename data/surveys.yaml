  literature_review:
    line_of_work_matrix:
    - line: Closed-loop ideation-execution-verification pipelines
      what_it_solves: Converting proposed hypotheses into runnable experiments and
        validated physical or experimental claims.
      what_remains_open: Verification gates still miss failure modes, and case evaluations
        are narrow; one vision gate missed 2 of 16 planted silent failures.
    - line: Multi-agent debate and human-in-the-loop idea generation
      what_it_solves: Improving hypothesis and experiment decisions through structured
        debate, self-healing execution, and targeted human oversight.
      what_remains_open: Optimal interaction level is shown on limited internal benchmarks;
        targeted collaboration outperformed exhaustive oversight in one ablation but
        lacks external validation.
    - line: Self-evolving and self-correcting research-agent frameworks
      what_it_solves: Iteratively refining hypotheses, attributing failures, and accumulating
        knowledge across research runs.
      what_remains_open: Evidence is mostly benchmark-score gains or case studies;
        missing limitation details or external reproducibility signals leave transfer
        and reliability unclear.
    - line: Formal or domain-specific hypothesis generation systems
      what_it_solves: Producing machine-checked or physically constrained hypotheses
        where correctness is verifiable against formal or domain checks.
      what_remains_open: Machine-checked proofs only guarantee correctness under formal
        assumptions; formalization may not faithfully capture the intended scientific
        claim.
    - line: Benchmarking and evaluation design for AI scientists
      what_it_solves: Making AI-generated discoveries comparable through tasks, human
        baselines, and controlled comparisons across systems.
      what_remains_open: Current systems still fall short of fully autonomous discovery,
        and available benchmarks cover only selected domains or internal case studies.
    consensus:
    - Systems converge on a closed loop from hypothesis or idea proposal to execution,
      validation, and reporting.
    - Verification and grounded reporting are treated as essential to avoid fabricated
      numbers, hallucinated citations, or unsupported claims.
    - Current agentic systems show substantial potential but are not yet fully autonomous;
      human oversight or audit remains important.
    - Progress is measured through benchmarks, ablations, or expert preference, but
      evaluation coverage is limited.
    disagreements:
    - 'Verification grounding differs: rendered flow-field checks, formal Lean proofs,
      report-level fact checking, and benchmark scoring represent different validity
      criteria.'
    - 'Target output differs: experimental model improvements, formal theoretical
      artifacts, general research case studies, and domain-specific discovery answers
      are evaluated separately.'
    - 'Human involvement differs: targeted high-leverage collaboration, interactive
      customizable teams, and autonomous runs followed by human audit define different
      interaction modes.'
    - 'System setting differs: domain-specific CFD, omics, and causal inference systems
      coexist with domain-agnostic evolutionary frameworks.'
    open_questions:
    - Can current validity gates extend to failure modes beyond planted ablations
      when one gate missed 2 of 16 silent failures?
    - Does machine-checked formal correctness ensure that theorems capture the intended
      scientific hypothesis without a faithful-formalization gap?
    - Do small internal benchmarks, multiple-choice omics questions, and expert-preference
      case studies predict real laboratory discovery utility?
    - Which human intervention mode generalizes beyond current ablations and internal
      case studies?
    - Can self-evolving frameworks transfer improvements across formal, experimental,
      and data-driven disciplines without task-specific priors?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 闭环式构思-执行-验证流水线
      解决的问题: 将提出的假设转化为可运行实验，并形成物理或实验上可验证的结论。
      尚未覆盖: 验证门控仍会遗漏静默失败，案例评估较窄；一个视觉门控漏检了16个植入静默失败中的2个。
    - 路线: 多智能体辩论与人机协作的假设生成
      解决的问题: 通过结构化辩论、自愈式执行和精准人工监督提升科研决策质量。
      尚未覆盖: 最佳协作模式仅在有限内部基准上验证；一项消融显示精准介入优于逐步监督，但缺乏外部验证。
    - 路线: 自我纠正与演化的科研智能体框架
      解决的问题: 在多次研究运行中迭代修正假设、归因失败并积累知识。
      尚未覆盖: 证据主要为基准得分或案例研究；部分系统缺少局限性说明或外部可复现细节，迁移性和可靠性仍不明确。
    - 路线: 领域专用或形式化假设生成系统
      解决的问题: 产生可由机器证明或物理约束验证的假设，提高正确性可验证程度。
      尚未覆盖: 机器证明只保证形式化假设下正确，形式化可能未忠实表达原科学主张。
    - 路线: AI科学家与假设生成的基准评测设计
      解决的问题: 通过真实数据任务、人类基线和系统对比，使AI科学发现可比较。
      尚未覆盖: 当前系统仍未达到完全自主发现，现有基准只覆盖少数领域或内部案例。
    共识:
    - 系统普遍采用从假设提出到执行、验证、报告的闭环。
    - 验证和基于事实的报告被视为防止捏造数字、幻觉引用或不可靠主张的关键机制。
    - 当前智能体系统显示出潜力，但尚未完全自主开展科学发现，人工监督或审计仍重要。
