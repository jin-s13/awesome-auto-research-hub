  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agents (e.g., The AI Scientist, The AI
        Scientist-v2)
      what_it_solves: 'Automates the full scientific experimentation cycle: ideation,
        code and experiment execution, analysis, visualization, and manuscript generation.'
      what_remains_open: Peer-review success is inconsistent and validated mainly
        at workshop level; domain breadth, failure modes, and missing limitation evidence
        remain open.
    - line: Benchmarks and task environments for experimentation agents (e.g., DISCOVERYWORLD,
        AblationBench)
      what_it_solves: Provides standardized tasks and metrics for comparing discovery,
        experiment, and ablation-planning capabilities.
      what_remains_open: Current models underperform humans on ablation recall and
        strong baselines struggle on discovery tasks; proxy metrics are not yet tied
        to real scientific utility.
    - line: Iterative failure memory and experiment planning (e.g., Negative Knowledge
        as Failure-aware Shared Memory)
      what_it_solves: Records failed attempts as structured negative knowledge to
        reduce token use and improve retry or cross-task experimentation.
      what_remains_open: Cross-task evidence is limited to PDE problems; the generality
        and memory quality criteria are not fully established.
    - line: Interactive multi-agent orchestration and human oversight (e.g., Claw
        AI Lab, ReasFlow)
      what_it_solves: Enables customizable research roles, real-time monitoring, artifact
        inspection, rollback/resume, and code/dataset integration under human guidance.
      what_remains_open: Evaluated on small internal case studies or domain-specific
        paper generation; platform maturity and external reproducibility are still
        unproven.
    consensus:
    - Systems are organized as closed-loop experiment cycles rather than individual
      prediction components.
    - Verification or review loops are treated as necessary to catch logical or experimental
      failures.
    - Evaluation commonly relies on LLM-based judges, simulated task metrics, or expert
      preferences rather than fully independent real-world validation.
    - Reproducibility evidence is uneven; several papers report artifact signals but
      many lack visible code, dataset, or limitation details.
    disagreements:
    - Some systems pursue full autonomy end to end, while others make human supervision
      or interactive control a core design requirement.
    - 'Evaluation targets differ: virtual discovery tasks, workshop peer review, internal
      AI case studies, and ablation planning benchmarks create incomparable success
      criteria.'
    - 'Planning mechanisms differ: agentic tree search, failure-aware shared memory,
      and chain-of-thought prompting are used as alternative refinement strategies.'
    - One ablation-planning benchmark finds chain-of-thought prompting outperforms
      an agent-based setup, suggesting that added agency is not uniformly beneficial.
    open_questions:
    - Can autonomous experiment agents remain reliable beyond workshop-level, narrow
      PDE, or small case-study settings?
    - Do discovery-simulation and LLM-judge scores predict real experimental reproducibility
      or scientific peer-review utility?
    - How does failure-aware memory transfer across heterogeneous scientific domains
      and experimental modalities?
    - What minimum human verification or oversight is needed to prevent silent errors
      in generated experiments and papers?
    - Many top entries have empty limitation fields and unavailable citation metadata,
      so which reported gaps are verification artifacts rather than measured weaknesses?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现智能体（如 The AI Scientist、The AI Scientist-v2）
      解决的问题: 自动化完整科学实验循环：提出想法、实现并执行实验、分析结果、绘图和撰写论文。
      尚未覆盖: 同行评审成功不稳定，主要只在 workshop 层面验证；领域广度、失败模式和缺失的局限性证据仍不清楚。
    - 路线: 面向实验智能体的基准与任务环境（如 DISCOVERYWORLD、AblationBench）
      解决的问题: 提供标准化任务和指标，用于比较科学发现、实验和消融规划能力。
      尚未覆盖: 当前模型在消融召回上低于人类，强基线在发现任务上表现困难；代理指标尚未与真实科学效用对齐。
    - 路线: 迭代失败记忆与实验规划（如 Negative Knowledge as Failure-aware Shared Memory）
      解决的问题: 将失败尝试记录为结构化负知识，减少 token 消耗并改善重试或跨任务实验。
      尚未覆盖: 跨任务证据仅限于 PDE 问题；负知识质量和记忆泛化条件尚未充分建立。
    - 路线: 交互式多智能体编排与人类监督（如 Claw AI Lab、ReasFlow）
      解决的问题: 支持可定制研究角色、实时监控、工件检查、回滚/恢复以及代码和数据集集成。
      尚未覆盖: 仅在少量内部案例或领域论文生成上评估；平台成熟度和外部可复现性仍未被证明。
    共识:
    - 系统围绕闭环实验迭代组织，而不是只作为单个预测组件。
    - 验证或评审循环被视为捕捉逻辑和实验失败的必要机制。
    - 评测常依赖 LLM 评审、模拟任务指标或专家偏好，而非完全独立的现实世界验证。
    - 可复现证据不均衡；部分论文报告了工件信号，但许多论文缺少可见代码、数据集或局限性细节。
    分歧:
    - 一些系统追求端到端完全自主，另一些系统将人类监督或交互控制作为核心设计。
    - 评测目标不同：虚拟发现任务、workshop 同行评审、内部 AI 案例研究和消融规划基准带来不可直接比较的成功标准。
    - 规划机制不同：智能体树搜索、失败感知共享记忆和思维链提示被用作不同的优化策略。
    - 消融规划基准显示思维链提示优于基于智能体的设置，说明增加智能体不必然带来一致收益。
    开放问题:
    - 自主实验智能体在超出 workshop、窄领域 PDE 或小规模案例研究后是否仍可靠？
    - 发现模拟和 LLM 评委得分能否预测真实实验可复现性或同行评审效用？
    - 失败感知记忆如何跨异构科学领域和实验模态迁移？
    - 需要哪些最低人类验证或监督来防止生成实验和论文中的静默错误？
    - 许多顶层条目缺少局限性字段且引用元数据不可用，哪些报告缺口属于验证工件而非已测量弱点？
