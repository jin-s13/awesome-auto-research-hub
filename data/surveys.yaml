    and citation-verification layers, with newer benchmarks exposing retrieval and
    alignment gaps.'
  - 'Open questions: How to close the large retrieval recall gap, improve weak semantic
    relation extraction, align generated taxonomies with expert judgment, run matched-backend
    end-to-end comparisons, and convert proxy metrics into real researcher utility.'
  related_work_outline_zh:
  - 主流方向：以LLM智能体为核心的自动综述生成系统，结合检索、迭代规划、起草、优化和结构化评估，近期进一步引入知识图谱或分类法表示以及证据门控引用校验。
  - 研究共性：把综述生成拆为检索、大纲/分类组织、分节综合与质量评审，并以覆盖度、结构、引用忠实度和分类对齐度进行评分，而非一次性生成。
  - 关键差异：表示方式从扁平检索文档到方法-实体图和层次分类法不等；评测目标从评分准则、成对偏好到专家分类对齐；交互模式从自主循环到受管控的人在环系统不等。
  - 趋势演进：在2025-2026前沿窗口内，研究从检索增强和迭代智能体流程走向结构化知识/分类组织与引用核实层，新基准开始暴露检索和对齐缺陷。
  - 开放问题：如何缩小较大检索召回差距、改善弱语义关系抽取、与专家判断对齐、进行匹配后端的端到端比较，以及将代理指标转化为真实研究效用。
  literature_review:
    line_of_work_matrix:
    - line: Agentic iterative survey generation
      what_it_solves: Automates retrieval, outline expansion, section drafting, and
        rubric/reviewer-driven refinement to produce organized, long-form literature
        surveys.
      what_remains_open: Many evaluations use proxy coverage/structure/citation metrics;
        matched-backend end-to-end comparisons and rigorous cross-domain external
        validation are missing.
    - line: Structured knowledge and taxonomy organization
      what_it_solves: Replaces flat paper/document views with methods-entity relations
        or hierarchical taxonomies to improve retrieval, outlining, and topic organization.
      what_remains_open: Semantic relation support is incomplete, with relation types
        such as extends weakest; alignment to a single expert taxonomy remains low
        and assumes that reference taxonomy is valid.
    - line: Evidence-gated citation and synthesis verification
      what_it_solves: Uses full-text extraction, citation graph expansion, hybrid
        filtering, semantic evidence gates, and multi-agent verification to reduce
        unsupported claims.
      what_remains_open: Audits still report partial or unsupported citations and
        semantic edges; evidence gates achieve moderate AUC and do not ensure statement-level
        correctness across all topics.
    - line: Evaluation and benchmarking for survey quality
      what_it_solves: Provides benchmarks, taxonomies, pairwise arenas, and metrics
        for retrieval, taxonomy structure, content coverage, and citation quality
        comparisons.
      what_remains_open: Reference-based alignment scores disagree with reference-free
        capability gaps; benchmarks often depend on single expert-authored taxonomies
        or narrow proxy metrics.
    - line: Governed end-to-end research infrastructure
      what_it_solves: Orchestrates proposal review, execution planning, governed computation,
        reproducible workflows, and scientist-in-the-loop oversight; demonstrated
        on a biomedical GWAS case.
      what_remains_open: Evidence is domain-specific and aggregate-only; generalizability
        to survey generation across topics, institutions, and hardware remains unverified.
    consensus:
    - LLM-based agentic systems are the dominant way to automate survey generation,
      with retrieval, iterative planning, and multi-stage refinement as core components.
    - Survey quality is evaluated through coverage, structure, citation fidelity,
      and taxonomy or outline alignment rather than any single surface-level score.
    - Citation reliability and retrieval quality are treated as primary failure modes,
      prompting evidence gates, citation filters, and paper-level grounding.
    - Structured organization, especially hierarchical taxonomy or method-entity relation
      modeling, is considered central to producing expert-like surveys.
    - Automated metrics and LLM/human judgment are used together, but results show
      expert alignment remains difficult.
    disagreements:
    - 'Representation differs: some systems operate over flat retrieved documents
      while others build methods-entity knowledge graphs or expert-like taxonomies.'
    - 'Evaluation target differs: rubric-aligned quality, pairwise human-preference
      comparisons, expert taxonomy alignment, and citation precision/recall are optimized
      by different lines of work.'
    - 'Interaction mode differs: fully autonomous generation pipelines contrast with
      governed scientist-in-the-loop or aggregate-only research orchestration.'
    - 'Task scope differs: some work targets end-to-end survey drafting, others focus
      narrowly on taxonomy organization, retrieval evaluation, or research workflow
      orchestration.'
    - 'Evidence enforcement differs: some systems use semantic evidence gates and
      citation graph constraints, while others rely on iterative LLM reviewer or rubric
      feedback without statement-level evidence gating.'
    open_questions:
    - Why does the best deep research agent retrieve only 20.92% of expert-cited papers,
      and how much of that is retrieval failure versus legitimate expert curation
      mismatch?
    - Can methods-entity knowledge graphs improve weak semantic relation types such
      as extends, which were supported at only 52.8% in human adjudication?
    - Do rubric scores, semantic path similarity, and citation metrics predict actual
      researcher utility or expert acceptance of a generated survey?
    - How do these systems perform in matched-backend end-to-end comparisons rather
      than bounded-context concurrent-system comparisons?
    - Can governed end-to-end research systems generalize from a hypertension GWAS
      case to diverse survey-generation topics while preserving institutional privacy
      and reproducibility?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于智能体的迭代综述生成
      解决的问题: 通过检索、大纲扩展、分节起草和评分准则/评审驱动的迭代优化，自动生成结构清晰的长篇文献综述。
      尚未覆盖: 多数评估使用覆盖度、结构、引用等代理指标；缺少匹配后端的端到端比较和严格的跨领域外部验证。
    - 路线: 结构化知识与分类法组织
      解决的问题: 用方法-实体关系或层次分类法替代扁平论文视图，以改进检索、大纲生成和主题组织。
      尚未覆盖: 语义关系支持不完整，extends 等关系类型最弱；与单一专家分类法的对齐度较低，并假设该参考分类法本身有效。
    - 路线: 证据门控引用与综合验证
      解决的问题: 通过全文抽取、引文图扩展、混合过滤、语义证据门控和多智能体验证，减少无证据支撑的主张。
      尚未覆盖: 审计仍显示部分引用或语义边无支撑；证据门控 AUC 中等，不能保证所有主题下句级正确性。
    - 路线: 综述质量评测与基准构建
      解决的问题: 提供基准、分类法、成对评测和指标，用于比较检索、分类结构、内容覆盖和引用质量。
      尚未覆盖: 基于参考的对齐分数与无参考能力缺口存在分歧；基准常依赖单一专家分类法或狭窄代理指标。
    - 路线: 受管控的端到端科研基础设施
      解决的问题: 编排提案评审、执行规划、受管控计算、可重复工作流和科学家在环监督；在生物医学 GWAS 案例中验证。
      尚未覆盖: 证据集中在特定领域且仅聚合数据；能否推广到跨主题、跨机构和跨硬件的综述生成仍未知。
    共识:
    - 基于LLM的智能体系统是自动综述生成的主流方式，检索、迭代规划与多阶段优化是核心组件。
    - 综述质量从覆盖度、结构、引用忠实度和分类/大纲对齐度等维度评估，而非只看单一表面分数。
    - 引用可靠性和检索质量被视为主要失败模式，因此引入证据门控、引用过滤和论文级约束。
    - 层次分类或方法-实体关系建模等结构化组织被认为是产出近似专家综述的关键。
    - 自动指标与LLM/人工判断常被结合使用，但结果表明与专家判断的对齐仍然困难。
    分歧:
    - 表示方式不同：部分系统在扁平检索文档上工作，另一些构建方法-实体知识图谱或专家式分类法。
    - 评测目标不同：不同路线分别优化评分准则质量、成对人工偏好、专家分类对齐全度和引用精确率/召回率。
    - 交互模式不同：全自主生成流程与受管控的科学家在环或仅聚合数据研究编排形成对比。
    - 任务范围不同：部分工作面向端到端综述起草，另一些只关注分类组织、检索评测或科研工作流编排。
    - 证据执行方式不同：有的系统使用语义证据门控和引文图约束，有的依赖迭代LLM评审或评分准则反馈，缺少句级证据门控。
    开放问题:
    - 为何最佳深度研究智能体仅检索到 20.92% 的专家引用论文，其中多少是检索失败，多少是合理的专家收录差异？
    - 方法-实体知识图谱能否改善 extends 等弱语义关系类型，该类型在人工判定中支持率仅 52.8%？
    - 评分准则分数、语义路径相似度和引用指标能否预测实际研究效用或专家对生成综述的接受度？
    - 这些系统在匹配后端的端到端比较中表现如何，而不是仅在有限上下文的并发系统比较中？
    - 受管控端到端研究系统能否从高血压 GWAS 案例推广到多样综述主题，同时保持机构隐私与可重复性？
