  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research generation systems
      what_it_solves: Closes the loop from idea generation and code/derivation execution
        to analysis, visualization, and manuscript creation.
      what_remains_open: Inconsistent acceptance; trustworthiness evidence such as
        controls, robustness, falsifiability, and cross-dataset generalization remains
        weak.
    - line: Domain-embedded discovery agents with explicit verification
      what_it_solves: Reduces unreliable claims in specialized scientific domains
        by adding logical audit or visual-language verification gates before results
        are accepted.
      what_remains_open: Verification gates can still miss planted silent failures,
        and standardized external validation across domains is not established.
    - line: Discovery-cycle benchmark environments
      what_it_solves: Creates repeatable, automatically scored tasks requiring agents
        to form hypotheses, run experiments, analyze results, and act on conclusions.
      what_remains_open: Strong baselines still struggle or cluster in a narrow score
        range; synthetic task performance may not yet transfer to real discovery utility.
    - line: Evidence-maturity evaluation and review protocols
      what_it_solves: Provides automated, deterministic scoring of whether an agent's
        conclusions are supported by sufficient evidence rather than merely executing
        a known pipeline.
      what_remains_open: Current evidence comes from a single frozen base model without
        reliable pairwise separation; proxy metrics are not yet proven to predict
        real scientific judgment.
    consensus:
    - Most systems model scientific discovery as an iterative loop of hypothesis formation,
      experimentation or derivation, result analysis, and manuscript or report generation.
    - Automated evaluation is widely used for scalability, but current LLM reviewers,
      task metrics, and evidence scores remain proxy measures rather than established
      scientific utility.
    - Agents can competently execute and document analyses, but producing defensible
      claims requires stronger controls, robustness, falsifiability, and generalization
      behavior.
    disagreements:
    - 'Representation and verification mechanisms differ: some systems use multi-agent
      knowledge retrieval and internal logical audit, some use agentic tree search,
      and some use domain-specific visual-language physics gates.'
    - 'Supervision and interaction mode differ: one line uses human principal investigator
      and agent collaboration, another attempts fully autonomous generation, and benchmark-based
      lines evaluate frozen agents with minimal feedback.'
    - 'Evaluation targets differ: simulated or workshop peer review, task completion
      in virtual discovery environments, and blind evidence-maturity scoring assess
      different capabilities.'
    open_questions:
    - How can systems detect the silent failures that current logical audit and visual-language
      verification gates still miss?
    - Do LLM-based review scores and benchmark task metrics measure defensible scientific
      discovery rather than competent execution and documentation?
    - Can autonomous discovery agents generalize across different base models, scientific
      domains, and deployment settings beyond specialized demonstrations?
    - How can controls, robustness, falsifiability, and cross-dataset generalization
      be embedded as first-class agent behaviors?
