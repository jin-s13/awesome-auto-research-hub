  related_work_outline:
  - 'Mainstream direction: Building multi-agent LLM pipelines that automate literature
    search, survey synthesis, and paper generation, with iterative refinement and
    rubric-based evaluation.'
  - 'Shared research pattern: Decomposing scholarly workflows into specialized agent
    roles (retrieval, summarization, drafting, reviewing) and closing the loop via
    self-critique or reviewer feedback.'
  - 'Key differences: Systems target either complete research paper generation from
    minimal prompts or survey paper generation from a topic; evaluation relies on
    LLM-based rubrics, human baselines, or venue acceptance, leading to different
    claims about scientific quality.'
  - 'Trend evolution: From 2023–2026, the frontier moved from isolated tool use to
    integrated agentic frameworks, adding self-evolution and systematic failure analysis,
    though evaluation remains nascent.'
  - 'Open questions: Factual accuracy and long-context memory in generated surveys,
    detecting genuine novelty versus rearranging known facts, and generalizing across
    disciplines without task-specific tuning.'
  related_work_outline_zh:
  - 主流方向：构建多智能体LLM流水线，自动化文献搜索、综述合成与论文生成，配合迭代优化和基于评分准则的评估。
  - 研究共性：将学术工作流分解为专门的智能体角色（检索、总结、起草、审阅），并通过自我批判或审稿反馈形成闭环。
  - 关键差异：系统目标分为从最小提示生成完整研究论文，或从主题生成综述论文；评估方式依赖LLM评分准则、人类基线或会议接收，由此产生不同的科学质量主张。
  - 趋势演进：2023–2026年间，前沿从孤立工具应用转向集成式智能体框架，增加自我演化和系统化失败分析，但评估体系仍处于早期阶段。
  - 开放问题：生成综述的事实准确性、长上下文记忆，检测真正的新颖性而非已知事实重排，以及在无任务特定调优的前提下跨学科泛化。
  literature_review:
    line_of_work_matrix:
    - line: Systems and reproducible infrastructure
      what_it_solves: Automating the end-to-end creation of academic surveys and research
        papers, integrating literature retrieval, synthesis, drafting, and iterative
        refinement into runnable agent pipelines.
      what_remains_open: Factual verification of generated content beyond model-based
        rubrics, robust handling of long-tail references, and maintaining context
        over thousands of sources without memory degradation.
    - line: Evaluation and evidence design
      what_it_solves: Making claims about AI literature assistants comparable through
        curated benchmarks, human baselines, and failure-mode analysis, revealing
        where current systems fall short of human expert performance.
      what_remains_open: Proxy metrics (LLM-based rubric scores, multiple-choice question
        accuracy) may not align with real scientific discovery utility, and no benchmark
        comprehensively covers literature search, gap analysis, and novelty detection.
    - line: Conceptual taxonomy and theory
      what_it_solves: Organizing the fragmented landscape of agentic AI for scientific
        discovery into capability categories and challenge taxonomies, highlighting
        literature review automation as a critical bottleneck.
      what_remains_open: The proposed taxonomies lack direct empirical validation
        that they predict system behavior or guide the design of more effective literature
        intelligence tools.
    consensus:
    - Multi-agent architectures with specialized roles and iterative feedback loops
      produce higher-quality literature outputs than single-pass generation.
    - LLM-based evaluation rubrics provide a scalable, repeatable way to assess survey
      and paper quality, but they are not yet a substitute for expert human judgment.
    - Current systems still require human oversight for verification, domain-specific
      reasoning, and correcting factual errors that agents fail to self-correct.
    disagreements:
    - 'Level of autonomy: some systems aim for fully automated end-to-end paper generation
      with minimal human input, while others keep the human in the loop as a principal
      investigator who directs and verifies each step.'
    - 'Evaluation target: works differ in whether they assess the final product via
      rubric scores, compare against human expert baselines on domain-specific tasks,
      or rely on external acceptance in a workshop, making cross-system comparisons
      difficult.'
    - 'What constitutes a scientific contribution: one line emphasizes generating
      novel hypotheses and proofs, another focuses on organizing and synthesizing
      existing literature into high-quality surveys.'
    open_questions:
    - How can we verify factual accuracy and logical coherence in generated literature
      surveys without relying on the same LLMs that produced them?
    - What metrics capture the utility of a literature intelligence tool for real
      researchers, beyond surface-level rubric scores?
    - Can agentic systems maintain coherent memory and reasoning when synthesizing
      hundreds of papers, and how do we detect when they drift into hallucination?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 系统与可复现基础设施
      解决的问题: 将文献检索、综合、起草和迭代优化集成为可运行的智能体流水线，自动化端到端的学术综述和研究论文创建。
      尚未覆盖: 生成内容的事实核查超越基于模型的评分准则，鲁棒处理长尾参考文献，以及在不产生记忆退化的前提下维持上千篇文献的上下文连贯性。
    - 路线: 评测与证据设计
      解决的问题: 通过精心构建的基准、人类基线和失败模式分析，使关于AI文献助手的主张具有可比性，揭示当前系统与人类专家表现的差距。
      尚未覆盖: 代理指标（LLM评分准则得分、选择题准确率）可能与真实科学发现效用不一致，且尚无基准全面覆盖文献搜索、问题空白分析和新颖性检测。
    - 路线: 概念分类与理论
      解决的问题: 将面向科学发现的智能体AI碎片化图景组织为能力类别和挑战分类，指出文献综述自动化是关键的瓶颈。
      尚未覆盖: 这些分类缺乏直接实证验证，无法证明它们能预测系统行为或指导更有效的文献智能工具设计。
    共识:
    - 具有专门角色和迭代反馈回路的多智能体架构比单次生成产生更高质量的文献输出。
    - 基于LLM的评估评分准则提供了一种可扩展、可重复的评估综述和论文质量的方法，但尚不能替代专家的人类判断。
    - 当前系统仍需要人类监督来进行验证、领域特定推理以及纠正智能体无法自纠的事实错误。
    分歧:
    - 自主程度：一些系统旨在以最少人工输入实现完全自动化的端到端论文生成，而另一些系统则将人类作为首席研究员保持在循环中，指导和验证每一步。
    - 评估目标：不同工作分别通过评分准则得分评估最终产品、与人类专家基线在领域特定任务上对比，或依赖外部会议接收作为质量信号，这使得跨系统比较困难。
    - 科学贡献的定义：一条路线强调生成新颖假设和证明，另一条路线侧重于将现有知识组织和综合成高质量综述。
    开放问题:
    - 如何在不依赖生成它们的同一LLM的情况下，验证生成文献综述中的事实准确性和逻辑一致性？
    - 哪些指标能捕捉文献智能工具对真实研究者的效用，超越表面的评分准则得分？
    - 智能体系统在综合数百篇论文时能否维持连贯的记忆和推理，以及如何检测它们何时漂移到幻觉？
