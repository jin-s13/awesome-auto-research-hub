  - 开放问题：这些智能体能否稳定产出超过工作坊接收水平的科学有效结果；失败经验和知识如何跨领域迁移；代理评估指标与真实人类专家判断之间的鸿沟如何弥合。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous scientific discovery pipelines
      what_it_solves: Automating the full research cycle from idea generation, coding,
        and experiment execution to paper writing and simulated review.
      what_remains_open: Performance consistency across diverse domains and runs;
        most evaluations are limited to ML subfields or workshop-level acceptance,
        and reliability in theory-heavy sciences is underexplored.
    - line: Benchmarks and evaluation suites for automated experimentation
      what_it_solves: Providing standardized tasks and metrics to measure the planning
        and execution capabilities of AI agents in scientific discovery, such as ablation
        planning and multi-step experiment design.
      what_remains_open: Current language models fall significantly short of human
        performance on these benchmarks; the alignment between automated judges and
        human expert evaluation remains uncertain.
    - line: Memory and knowledge management for iterative research agents
      what_it_solves: Capturing failed experiments as structured negative knowledge
        to prevent repetition and guide future hypotheses, and retrieving relevant
        domain facts to reduce expert intervention.
      what_remains_open: The transferability of failure memories across different
        scientific problems and the scalability of the curator strategy to large,
        noisy failure logs have not been tested.
    - line: Interactive multi-agent research platforms
      what_it_solves: Enabling human researchers to customize agent roles, monitor
        experiments in real time, and inject local codebases into the research loop,
        blending human oversight with agent autonomy.
      what_remains_open: Maturity of the platform is early; evaluations are limited
        to a small number of internal case studies, and external validation across
        diverse user groups and hardware setups is missing.
    consensus:
    - Large language models are the core engine for hypothesis generation, code writing,
      and result interpretation across all systems.
    - Some form of automated feedback loop—whether an internal verifier, a simulated
      reviewer, or a failure memory—is essential to move beyond one-shot generation.
    - The cost of running a full discovery cycle is already low enough to enable large-scale
      experimentation (under $15 per paper in some cases).
    - Current agents still lack the reliability of human scientists, particularly
      when evaluated on complex, multi-step tasks that require grounding in physical
      or domain-specific constraints.
    disagreements:
    - 'Domain accessibility: some pipelines are designed exclusively for code-based
      ML experiments, while others incorporate symbolic reasoning for applied mathematics,
      creating divergent assumptions about the required toolchain and verification
      strategies.'
    - 'Human involvement: systems range from fully autonomous (no human in the loop
      after initial prompt) to interactive dashboards where humans monitor, rollback,
      and guide the research process, reflecting different visions of the human–AI
      collaboration model.'
    - 'Memory design: one line of work relies on a shared bank of negative knowledge
      to avoid past failures, while others discard history after each run or rely
      solely on the model''s context window, implying different assumptions about
      the value of long-term experimental memory.'
    - 'Evaluation grounding: some works validate outputs through real peer review
      at workshops, others use LLM-based judges, and still others employ structured
      benchmarks with automatically computed metrics, leading to incomparable claims
      about agent performance.'
    open_questions:
    - Can the failure-knowledge approaches developed in isolated PDE tasks generalize
      to the broader scientific discovery environments benchmarked by DISCOVERYWORLD?
    - Why does chain-of-thought prompting outperform agent-based setups for ablation
      planning, and what does this imply for the architectural choices in automated
      research agents?
    - How can we verify that the internal logical consistency checks used in theory-heavy
      agents (e.g., ReasFlow) cover the open-ended exploration required in empirical
      sciences where no ground-truth proof exists?
    - What is the minimal set of human feedback signals needed to move from workshop-level
      to full-conference-level acceptance in fully automated paper generation?
