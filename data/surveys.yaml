  related_work_outline_zh:
  - 主流方向：面向科学写作的全自动化端到端智能体，将想法生成、代码/实验执行、验证和手稿起草串联，并在近期加入领域验证或逻辑/物理感知检查。
  - 研究共性：多智能体或智能体流水线把论文写作作为自主研究闭环的最终阶段，通过LLM评分标准、基准对比或有限同行评审节点来评测。
  - 关键差异：验证信号与插入位置、人类参与程度、成功标准定义以及领域约束强度各不相同。
  - 趋势演进：从2024年通用全自动发现框架，到2025年工作坊级同行评审接收和树搜索，再到2026年强调验证门控、自校正与精准人机协作。
