  - 主流方向：构建自主闭环研究智能体，对研究决策进行搜索、审计或验证，并在留出数据或基准证据上评估。
  - 研究共性：将廉价代理反馈与昂贵高保真评估解耦，在最终验证前冻结或审计所选输出。
  - 关键差异：评测场景分为领域科学发现、通用 ML 研究智能体基准与深度研究/推理；改进机制分为技能提炼、递归自改进或代理模型引导搜索。
  - 趋势演进：2025 年出现学术综述任务评测；2026 年转向可复用技能、递归自改进、领域 AI 科学家工作流和更长周期工程/数学研究。
  - 开放问题：证据包中多个条目缺少可见方法或结果；基准提升能否迁移到科学效用、未见领域、后悔指标和可复现性仍未知。
  literature_review:
    line_of_work_matrix:
    - line: Closed-loop discovery with held-out transfer
      what_it_solves: Turns automated modeling changes into auditable research decisions
        by evaluating selections on untouched data and reusable code.
      what_remains_open: Reported evaluation covers ten Matbench endpoints; one selected
        change failed on holdout, and external data screening added little for composition
        tasks.
    - line: Efficient high-fidelity feedback for closed-loop search
      what_it_solves: Uses sparse high-fidelity labels and acquisition rules to update
        surrogates during long searches, reducing oracle or laboratory query cost.
      what_remains_open: Fixed surrogate errors can persist and be amplified by optimization;
        custom laboratory automation is costly; explicit method limitations are not
        stated.
    - line: Operational knowledge distillation into agent skills
      what_it_solves: Converts GitHub repository know-how into verified reusable skills,
        improving research agent performance on multiple ML benchmarks.
      what_remains_open: No limitations are reported; attribution of benchmark gains
        to the skill layer remains unclear beyond fixed-backbone comparisons.
    - line: Recursive self-improvement and context compression
      what_it_solves: Alternates evidence gathering with constraint-wise auditing
        and compresses interaction history to preserve verified evidence and unresolved
        claims.
      what_remains_open: Evaluation mainly compares comparable-scale baselines on
        listed benchmarks; no explicit limitations or failure cases are provided.
    - line: Benchmark and task design for research agents
      what_it_solves: Creates evaluation surfaces such as academic survey tasks, long-horizon
        engineering, mathematics research, and academic rebuttal.
      what_remains_open: Several visible top entries have no methodology, results,
        or limitations in the packet, leaving claim verification open.
    consensus:
    - Research agents are evaluated by whether chosen interventions survive validation
      outside the development loop or improve benchmark performance.
    - Cheap proxy signals are treated as insufficient on their own; papers introduce
      held-out data, high-fidelity queries, or constraint-wise audits.
    - Operational artifacts such as reusable code, skills, or context-update tools
      are treated as part of the research output rather than external scaffolding.
    - The field prioritizes agentic closed-loop workflows over single-step model predictions.
    disagreements:
    - 'Evaluation targets differ: materials discovery uses domain endpoints and held-out
      MAE/classification; ML research agents use benchmark suites such as MLE-bench;
      deep research uses reasoning and survey-style benchmarks; some artifacts lack
      explicit evaluation.'
    - 'Improvement mechanisms differ: distilling repository skills, recursive self-improvement
      via long-horizon reinforcement learning, and online surrogate repair with acquisition
      rules.'
    - 'Feedback and supervision differ: sparse high-fidelity labels for surrogate
      updates, validated synthetic tasks and high-quality trajectories for reinforcement
      learning, and fixed backbone, harness, and execution budgets for skill comparisons.'
    - 'Reproducibility evidence varies widely: several entries show repository or
      artifact signals but no visible methodology or results; others report limitations
      with differing completeness.'
    open_questions:
    - Do held-out gains on ten Matbench endpoints and MADE transfer to broader scientific
      and discovery domains?
    - Which component—skill library, controller, backbone budget, or evaluation scaffold—explains
      benchmark improvements?
    - How do proxy metrics such as regret, benchmark score, and held-out MAE align
      with real research utility?
    - What are the failure modes and cost boundaries of recursive self-improvement
      and online surrogate repair outside the reported settings?
    - What verification evidence is missing for entries with repository or artifact
      signals but no visible methodology or results?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带留出迁移的闭环发现
      解决的问题: 将自动建模改动转化为可审计的研究决策，在未接触数据上验证并生成可复用代码。
      尚未覆盖: 评估仅覆盖十个 Matbench 端点；一个改动在留出集失效，外部数据筛选对成分任务收益有限。
    - 路线: 面向闭环搜索的高保真反馈采样
      解决的问题: 用稀疏高保真标注和采集规则更新代理模型，降低长周期搜索中的 oracle 或实验室查询成本。
      尚未覆盖: 固定代理模型误差可能持续并被优化放大；定制实验室自动化成本高；未给出明确方法局限。
    - 路线: 面向研究智能体的操作知识提炼与技能化
      解决的问题: 将 GitHub 仓库中的操作知识压缩为可复用已验证技能，提升多个 ML 基准上的智能体表现。
      尚未覆盖: 原文未报告局限；在固定主干和预算对比之外，技能层对增益的因果作用仍不够清晰。
    - 路线: 递归自改进与上下文压缩
      解决的问题: 交替进行证据收集与按约束审计，并将交互历史压缩为保留已验证证据和未解决约束的改进状态。
      尚未覆盖: 主要与同等规模基线比较；未提供明确局限或失败案例，领域外泛化仍未知。
    - 路线: 研究智能体的基准与任务设计
      解决的问题: 构造学术综述、长周期工程、数学研究和学术 rebuttal 等评估面，使研究智能体主张可比较。
      尚未覆盖: 若干条目在证据包中没有可见方法、结果或局限，主张验证存在缺口。
    共识:
    - 研究智能体被要求证明所选干预能在开发循环之外存续，或能在基准上带来可比较提升。
    - 廉价代理信号不被单独采信；论文引入留出数据、高保真查询或按约束审计。
    - 可复用代码、技能或上下文更新工具被视为研究输出的一部分。
    - 主流关注闭环智能体工作流，而非单步模型预测。
    分歧:
    - 评测目标不同：材料发现用领域端点、留出 MAE 和分类；ML 研究智能体用 MLE-bench 等基准；深度研究用推理和综述类基准；部分条目缺少显式评测。
    - 改进机制不同：提炼仓库技能、基于长程强化学习的递归自改进，以及基于采集规则的在线代理修复。
    - 反馈与监督不同：稀疏高保真标签用于代理更新，验证过的合成任务和高质量轨迹用于强化学习，固定主干和预算用于技能对比。
    - 可复现证据差异明显：部分条目只有仓库或工件信号而缺少可见方法或结果；部分报告局限但完整度不同。
    开放问题:
    - 材料发现上的留出提升能否迁移到更广泛的科研和发现领域？
    - 技能库、控制器、主干预算或评测脚手架中哪一环节解释了基准提升？
    - 后悔值、基准分数和留出 MAE 等代理指标与现实研究效用是否一致？
    - 递归自改进和在线代理修复在报告设置之外的失败模式与成本边界是什么？
    - 对只有仓库或工件信号而缺少可见方法或结果的条目，仍缺少哪些验证证据？
