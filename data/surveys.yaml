  literature_review_zh:
    研究路线矩阵:
    - 路线: 评测与证据设计
      解决的问题: 通过任务、基线和评分规则，使自主科研智能体的主张可比较、可审计。
      尚未覆盖: 代理指标与真实科研效用之间是否一致；跨领域与盲评覆盖仍不完整。
    - 路线: 系统与可复现基础设施
      解决的问题: 把单点智能体能力转化为可运行的代码执行、工件检查、监控、评审循环和工作流。
      尚未覆盖: 跨硬件、数据集和用户设置的标准化验证；可复现证据常仅限于案例研究或未完整报告。
    - 路线: 动作条件控制与规划
      解决的问题: 通过智能体搜索、实验管理器和验证门把规划与实验接入闭环决策。
      尚未覆盖: 可靠性提升是否来自控制或验证层而非基座模型或任务先验；植入失败审计仍暴露漏检。
    - 路线: 概念分类与理论
      解决的问题: 把可审计性、新颖性、对照、稳健性、可证伪性等组织为证据成熟度评分维度。
      尚未覆盖: 这些维度能否预测智能体行为缺乏直接验证；当前结果仅来自单一冻结基座模型。
    共识:
    - 自主科研智能体能执行并记录分析，但尚不能稳定产生可信的科学结论。
    - 自动评审和基于评分规则的证据成熟度被用于可重复评估，但其公正性与有效性仍在检验。
    - 基准和验证基础设施对比较智能体输出之外的可信度至关重要。
    - 当前系统在执行与可审计性上较强，在对照、稳健性和可证伪性等科学判别上较弱。
    分歧:
    - 评测目标不同：任务完成、盲测证据成熟度、或CFD与组学等领域发现性能。
    - 评分信号不同：完成度指标、自动LLM评分维度、专家或人类基线、物理感知视觉检查。
    - 部署方式不同：全自动论文生成、带人工监控的交互式多智能体平台、领域专用验证门控求解器。
    - 性能证据不同：三篇投稿仅一篇通过评审、内部案例偏好基线、智能体间无统计可靠差异。
    开放问题:
    - 证据成熟度评分和自动评委是否预测长期科研效用，还是仅反映所选任务上的内部一致性？
    - 验证门控能否跨领域泛化，并以可接受的漏检率捕捉静默失败？
    - 当现有结果依赖单一冻结模型或有限内部案例时，智能体能力在不同基座模型、数据集和领域上如何变化？
    - 由于若干论文未完整报告代码、数据集、指标或局限细节，可复现证据有哪些缺口？
