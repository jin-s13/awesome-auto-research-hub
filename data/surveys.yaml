    - 路线: 评测环境与证据锚定基准
      解决的问题: 通过受控任务、盲数据、自动指标和 LLM 评判器，在不复现隐藏目标研究的情况下比较智能体声明。
      尚未覆盖: 任务完成或证据成熟度评分能否预测真实发现效用仍未验证；跨模型和跨领域泛化证据有限。
    - 路线: 领域特定验证与人类基线校准
      解决的问题: 通过物理感知视觉语言检查发现静默实验失败，或通过真实生物数据中的人类专家表现标定难度。
      尚未覆盖: 物理验证门控仍会漏掉部分植入失败；人类基线样本较小或依赖窄问题格式，无法覆盖完整开放式发现。
