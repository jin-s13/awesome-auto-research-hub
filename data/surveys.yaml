  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automates the full scientific loop—literature grounding, hypothesis
        generation, code-level experimentation, and manuscript writing—reducing the
        manual effort in research ideation and execution.
      what_remains_open: Systems struggle with fully autonomous high-quality paper
        writing; the novelty of generated hypotheses is often limited to incremental
        improvements, and generalization to out-of-distribution scientific tasks is
        unverified.
    - line: Multi-agent collaboration and structured decision-making
      what_it_solves: Improves the quality of generated research plans and results
        by introducing debate, tree-based branching, and role specialization among
        agents, mimicking team-based scientific reasoning.
      what_remains_open: The added complexity of multi-agent coordination has not
        been shown to consistently outperform simpler single-agent loops with strong
        self-critique; the optimal granularity of agent roles remains an open design
        question.
    - line: Self-correction and failure attribution
      what_it_solves: Detects and diagnoses experimental failures (e.g., code bugs,
        invalid results, hallucinated numbers) and routes corrective actions to the
        appropriate stage, boosting the reliability of autonomous research.
      what_remains_open: Current failure detection is not exhaustive (e.g., missed
        silent failures in physics simulations) and may not generalize to novel failure
        modes outside the training distribution of the verifier.
    - line: Benchmarking and evaluation design
      what_it_solves: Provides standardized tasks (cell annotation, multi-choice questions
        from published studies, experiment-stage benchmarks) and comparison baselines
        (human experts, prior AI scientists) to measure progress.
      what_remains_open: Existing benchmarks are narrow in domain coverage and proxy
        metrics (e.g., blind human preference scores) have not been validated against
        long-term scientific impact or real-world discovery utility.
    - line: Domain-agnostic and self-evolving frameworks
      what_it_solves: Enables rapid construction of AI scientists for arbitrary disciplines
        via reusable agent architectures that accumulate knowledge and refine hypotheses
        across experimental cycles, broadening applicability.
      what_remains_open: The claim of domain-agnosticism is only tested on a limited
        set of benchmarks; the ability to genuinely transfer knowledge across disparate
        scientific fields without catastrophic forgetting or negative transfer is
        not evidenced.
    consensus:
    - Large language models acting as agents are the default backbone for hypothesis
      generation, experiment planning, and code synthesis in autonomous research systems.
    - Some form of verification or self-critique (e.g., physics-aware gate, report
      grounding, multi-hypothesis failure analysis) is necessary to prevent fabricated
      results and silent failures.
    - Structured workflows—whether through multi-agent debate, tree search, or evolutionary
      loops—provide more inspectable and controllable research trajectories than flat,
      single-pass generation.
    - Human evaluation (expert judges or bioinformatician baselines) remains the primary
      measure of output quality, though standardized benchmarks are beginning to emerge.
    - The current systems are more effective at code-level experimentation and parameter
      tuning than at generating paradigm-shifting scientific hypotheses.
    disagreements:
    - 'Optimal human involvement: some systems advocate full autonomy with targeted
      human intervention only at high-stakes decisions (AutoResearchClaw), while others
      provide dashboards for continuous monitoring and rollback (Claw AI Lab) or rely
      on human-defined tasks from the start (BAISBench).'
    - 'Error handling granularity: vision-language verification gates that inspect
      visual output (AI CFD Scientist) versus causal multi-hypothesis failure attribution
      that traces errors to the hypothesis, design, or implementation level (SAGE)
      versus self-healing executors that pivot and refine on failure (AutoResearchClaw).'
    - 'Generality versus depth: domain-agnostic frameworks (EvoMaster) claim broad
      applicability across disciplines, while specialized systems (AI CFD Scientist,
      BAISBench) incorporate domain-specific verification that yields more defensible
      claims within their niche.'
    - 'Evaluation target: some works report quantitative benchmark scores (EvoMaster,
      AutoResearchClaw), others emphasize qualitative expert judgment (Claw AI Lab),
      and one provides a human performance baseline from graduate-level experts (BAISBench),
      making cross-system comparison difficult.'
    open_questions:
    - What constitutes a truly novel scientific contribution, and how can we benchmark
      the generative novelty of AI scientists beyond incremental metric improvements?
    - How can failure detection and correction mechanisms be made robust to previously
      unseen error types, especially in safety-critical scientific domains?
    - To what extent do structured multi-agent debates and tree search generalize
      beyond the specific LLM backbone and prompt configurations used in the reported
      experiments?
    - Can the self-evolution mechanisms that accumulate knowledge across cycles lead
      to overfitting to the problem class or dataset, and how would this be detected
      in an open-ended discovery setting?
    - What are the minimal reproducibility requirements (code, data, environment)
      for AI scientist systems, given that many top-ranked papers lack complete artifact
      releases?
