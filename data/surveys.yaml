  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research platforms
      what_it_solves: Integrates idea generation, code implementation, experiment
        execution, result visualization, and manuscript authoring into a single agentic
        workflow, reducing manual intervention in the research cycle.
      what_remains_open: Generated paper quality is unstable (only a fraction passes
        peer review); verification in theory-heavy domains like mathematics is shallow;
        optimal human-AI role boundaries and intervention strategies are undefined.
    - line: Experiment planning and ablation benchmarking
      what_it_solves: Provides standardized tasks and metrics to assess how well language
        models can propose ablation studies or identify missing experiments in empirical
        AI research.
      what_remains_open: Best LM systems achieve only 45% recall on ablation identification,
        far below human performance; grounding discrepancies between author and reviewer
        roles cause inconsistent behavior; extension to other scientific fields or
        more complex experimental designs is missing.
    - line: Failure-aware memory for iterative improvement
      what_it_solves: Records failed experimental attempts into a shared memory bank,
        allowing downstream agents to avoid repeating errors and to solve previously
        unsolvable tasks with fewer tokens.
      what_remains_open: Transferability of failure knowledge across different research
        domains and task types is unverified; abstracting generalizable principles
        from task-specific failure records remains unexplored.
    - line: Virtual environment evaluation of discovery agents
      what_it_solves: Offers a controlled simulation environment with diverse tasks
        to measure an agent's full capability in forming hypotheses, designing experiments,
        and interpreting results.
      what_remains_open: Strong baseline agents still struggle on most tasks, and
        the environment is text-based without realistic physical noise; the correlation
        between task completion metrics and real-world scientific output is not established.
    consensus:
    - Automating scientific discovery requires integrating experimental design, execution,
      and analysis into a single LLM-driven agent framework.
    - Current systems are evaluated through some form of simulation, benchmark, or
      peer review, and all acknowledge that reliability and generalization remain
      insufficient.
    - Multi-agent architectures that decompose the research process into specialized
      roles (e.g., experiment manager, reviewer, curator) show promise in handling
      complex workflows.
    disagreements:
    - 'Autonomy level: Some systems target fully autonomous discovery without human
      intervention, while others frame the human as a principal investigator and the
      agent as an assistant, emphasizing interactive collaboration.'
    - 'Memory mechanism: One line introduces a shared negative knowledge bank to explicitly
      record and reuse failures, whereas others rely solely on the agent''s immediate
      context or a simple retry loop.'
    - 'Evaluation target: Validation ranges from LLM-simulated review scores, to actual
      workshop peer-review acceptance, to task completion on a predefined benchmark,
      leading to different claims about system capability.'
    - 'Domain focus: Some platforms are demonstrated on general machine learning tasks,
      while others are specialized to reasoning-centric discovery in applied mathematics,
      affecting the generality of the approach.'
    open_questions:
    - Can the experimental plans generated by these agents remain robust when transferred
      to unseen scientific domains or when the underlying model is swapped?
    - Does a failure memory layer generalize beyond identical task retries, and can
      it capture abstract experimental principles rather than instance-specific mistakes?
    - How well do proxy evaluation metrics (task completion, automated reviewer scores)
      predict genuine scientific impact or eventual human peer-review outcomes?
    - What is the trade-off between full automation and human-in-the-loop collaboration
      in terms of research novelty, error recovery, and resource efficiency?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自动化研究平台
      解决的问题: 将想法生成、代码实现、实验执行、结果可视化和论文撰写整合为单一智能体工作流，减少研究循环中的人工干预。
      尚未覆盖: 生成论文质量不稳定，仅部分通过同行评审；对理论密集型领域（如数学）的验证较浅；最佳人机角色边界和干预策略尚未明确。
    - 路线: 实验规划与消融基准
      解决的问题: 提供标准化任务和指标，评估语言模型在规划消融实验或发现实证AI论文中缺失实验方面的能力。
      尚未覆盖: 最佳语言模型系统在消融识别上仅达到45%召回率，远低于人类水平；作者与审稿人角色之间的基础差异导致行为不一致；尚未扩展到其他科学领域或更复杂的实验设计。
    - 路线: 失败感知记忆与迭代改进
      解决的问题: 将失败的实验尝试记录到共享记忆库中，使下游智能体能够避免重复错误，并以更少的令牌解决先前无法解决的任务。
      尚未覆盖: 失败知识在不同研究领域和任务类型上的可迁移性未经验证；从任务特定失败记录中抽象出可泛化原则的方法尚未探索。
    - 路线: 虚拟环境评估发现智能体
      解决的问题: 提供具有多样化任务的可控模拟环境，衡量智能体在形成假设、设计实验和解释结果方面的完整能力。
      尚未覆盖: 强基线智能体在多数任务上仍表现困难，且环境为文本模拟，缺少真实物理噪声；任务完成指标与真实世界科学产出之间的相关性尚未建立。
    共识:
    - 自动化科学发现需要将实验设计、执行和分析整合到单一的LLM驱动智能体框架中。
    - 当前系统通过某种形式的模拟、基准或同行评审来评估，且都承认可靠性和泛化能力仍不足。
    - 将研究过程分解为专门角色（如实验管理器、评审员、策展员）的多智能体架构在应对复杂工作流方面展现出潜力。
    分歧:
    - 自主程度：部分系统追求无需人工干预的完全自主发现，而其他系统将人类定位为首席研究员、智能体为助手，强调交互式协作。
    - 记忆机制：一条路线引入共享负知识库以显式记录和重用失败，而其他路线仅依赖智能体的即时上下文或简单重试循环。
    - 评估目标：验证方式从LLM模拟评审分数、实际工作坊同行评审接收，到预定义基准上的任务完成度，导致对系统能力的不同声称。
    - 领域聚焦：一些平台在通用机器学习任务上展示，而另一些专用于应用数学中基于推理的发现，影响方法的普适性。
    开放问题:
    - 这些智能体生成的实验计划在迁移到未知科学领域或更换底层模型时是否仍能保持鲁棒性？
    - 失败记忆层能否泛化至相同任务重试之外，并能捕获抽象实验原则而非特定实例的错误？
    - 代理评估指标（任务完成度、自动评审分数）能够在多大程度上预测真实的科学影响力或最终人类同行评审结果？
    - 在完全自动化与人机协作之间，如何权衡研究新颖性、错误恢复和资源效率？
