  related_work_outline:
  - 'Mainstream direction: Building autonomous or multi-agent scientific research
    pipelines that propose ideas, execute experiments, verify outputs, and report
    results; dominant sub-directions include domain-specific discovery engines and
    general evolving research frameworks.'
  - 'Shared research pattern: Most systems separate ideation, execution, verification,
    and reporting, then add self-correction, grounded reporting, or human review to
    reduce failed, hallucinated, or fabricated claims.'
  - 'Key differences: Evaluation targets range from real CFD or single-cell tasks
    to general research benchmarks and small internal case studies; verification spans
    formal proof, vision-language physics gates, and report-level fact grounding;
    human roles vary from selective intervention to dashboard monitoring to final
    inspection.'
  - 'Trend evolution: The available top-paper evidence is concentrated in 2025-2026,
    so the trend is within the current frontier; work is moving from benchmarks and
    surveys identifying feasibility gaps toward 2026 systems with failure attribution,
    self-evolution, formal grounding, and open-ended domain discovery.'
  - 'Open questions: Whether proxy benchmarks predict real discovery utility, whether
    validity gates can catch all silent failures, and whether formal or learned verification
    can validate hypotheses outside their training or assumption distribution remain
    open.'
  related_work_outline_zh:
  - 主流方向：构建自主或多智能体科研流程，提出想法、执行实验、验证输出并报告结果；领域专用发现引擎和通用演化框架是主要子方向。
  - 研究共性：多数系统将构思、执行、验证、报告分离，并通过自我纠正、有据可依的报告或人工审查来降低失败、幻觉或虚假主张。
  - 关键差异：评测目标跨真实CFD、单细胞任务、通用研究基准和小规模内部案例；验证方式从形式化证明、视觉-语言物理门控到报告级事实约束不等；人类参与包括选择性介入、仪表板监控和最终检查。
  - 趋势演进：主要证据集中在2025-2026，属于当前前沿趋势；正从基准和综述识别可行性差距，转向2026年的失败归因、自我演化、形式化基础和开放式领域发现系统。
  - 开放问题：代理基准是否能预测真实发现效用、验证门控能否捕获所有静默失败、形式化或学习式验证能否泛化到训练和假设分布之外，仍有待验证。
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific autonomous discovery loops
      what_it_solves: Generating, executing, and summarizing ideas within one domain,
        using domain-specific checks such as physics-based visual verification or
        single-cell annotation.
      what_remains_open: Whether discovered corrections generalize beyond the chosen
        domain case, and whether domain-specific checks still miss silent failures.
    - line: Self-correcting research pipelines
      what_it_solves: Attributing failed experiments to hypothesis, experimental design,
        or implementation and routing corrections; constraining reports to measured
        values.
      what_remains_open: Fully autonomous conference-ready writing remains unsolved,
        and failure attribution may still miss some invalid or misleading results.
    - line: Human-AI research collaboration
      what_it_solves: Enabling targeted human interventions at high-leverage decision
        points or interactive monitoring to improve idea quality and result trustworthiness.
      what_remains_open: Optimal intervention timing and granularity across research
        phases remain unresolved; evidence is limited to internal case studies.
    - line: Benchmarks and evaluation designs
      what_it_solves: Creating task suites, baseline comparisons, and human baselines
        for data-driven discovery and general research abilities.
      what_remains_open: Task coverage is narrow and proxy metrics may not correspond
        to real scientific discovery utility or downstream decision quality.
    - line: Domain-agnostic evolving frameworks
      what_it_solves: Providing reusable scaffolding for self-evolving scientific
        agents across disciplines with reduced custom-code burden.
      what_remains_open: Benchmark gains do not yet show standardized external validation
        across hardware, datasets, or user settings.
    - line: Formal grounding for theory generation
      what_it_solves: Using machine-checked proofs and libraries to ground ideation
        in formal assumptions, with audits comparing formal theorems and informal
        claims.
      what_remains_open: Formal correctness does not ensure faithful scientific meaning,
        and final artifacts still require human inspection.
    consensus:
    - Autonomous research pipelines should separate ideation, execution, validation,
      and reporting rather than relying on a single end-to-end loop.
    - Verification gates and grounded reporting are necessary to reduce fabricated
      numbers, hallucinated citations, or silent experimental failures.
    - Targeted human collaboration can outperform both full autonomy and exhaustive
      step-by-step oversight at high-leverage decision points.
    - Current systems remain assistants for hypothesis generation and experimentation
      rather than fully autonomous discovery engines.
    disagreements:
    - 'Verification strategy differs: formal machine-checked proof, learned vision-language
      physics checks, report-level fact grounding, and systems without validity gates
      accept different failure modes.'
    - 'Evaluation target differs: real domain-specific tasks, broad research benchmarks,
      and small internal case studies make reported improvements not directly comparable.'
    - 'Supervision and interaction differ: no human intervention, selective human-in-the-loop,
      interactive monitoring, or final human inspection imply different trust and
      control assumptions.'
    - 'Deployment setting differs: fixed-domain discovery, domain-agnostic framework
      reuse, and theoretically formalized pipelines make different portability and
      external-validation claims.'
    open_questions:
    - How well do current benchmark metrics predict real-world scientific discovery
      or downstream decision utility?
    - Can verification mechanisms combine formal or physics-based checks to reduce
      known silent-failure gaps, such as a visual gate missing 2 of 16 planted failures?
    - Does targeted human collaboration remain effective in high-cost or weakly supervised
      scientific domains?
    - Can formal proof audits be scaled so scientific claim alignment is verified
      without full human inspection of every artifact?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域专用自主发现回路
      解决的问题: 在单一领域内生成、执行并总结想法，并用领域特定检查（如物理视觉验证或单细胞注释）过滤无效结果。
      尚未覆盖: 发现是否泛化到所选领域案例之外，以及领域检查是否仍会漏掉静默失败。
    - 路线: 自我纠正研究流水线
      解决的问题: 将失败归因到假设、实验设计或实现，并路由纠正；同时将报告限制在实际测量值上。
      尚未覆盖: 完全自主的会议级写作仍未解决，失败归因仍可能漏掉部分无效或误导性结果。
    - 路线: 人机科研协作
      解决的问题: 在高杠杆决策点或交互式监控中引入精准人类干预，以提升想法质量和结果可信度。
      尚未覆盖: 不同研究阶段的最优干预时机和粒度仍未解决；证据主要来自内部案例研究。
    - 路线: 基准与评测设计
      解决的问题: 通过任务集、基线对比和人类基线，评估数据驱动发现和通用研究能力。
      尚未覆盖: 任务覆盖较窄，代理指标可能无法对应真实科学发现效用或下游决策质量。
    - 路线: 领域无关演化框架
      解决的问题: 提供可复用的自演化科研智能体脚手架，降低跨学科定制代码成本。
      尚未覆盖: 基准性能提升尚未证明跨硬件、数据集和用户设置的标准化外部验证。
    - 路线: 理论生成的形式化基础
      解决的问题: 用机器检查证明和库将想法建立在形式化假设上，并以审计比较形式化定理和非形式化主张。
