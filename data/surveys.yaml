  related_work_outline_zh:
  - 主流方向：端到端自主研究智能体正在与基准和验证基础设施结合，以评估证据可靠性、可复现性和治理能力。
  - 研究共性：系统闭环完成假设、代码、实验和论文/报告工件；评估向可追溯证据、任务完成度或专家/同行判断转变。
  - 关键差异：评测目标包括任务完成、证据成熟度、领域指标或同行评审接受；可靠性机制包括物理感知门控、权限分离或模拟评审。
  - 趋势演进：从2024年前后的通用自动化科学家框架，转向2025–2026年领域特定基准、盲任务和证据锚定评测。
