    - 自动化综述生成被普遍视为多阶段问题：检索、组织、草稿生成和评估。
    - 迭代优化和基于LLM的评审是提高覆盖度、结构性和格式质量的常见机制。
    - 引用落地和证据支持被视作核心质量维度，并通过检索、过滤或门控组件强化。
