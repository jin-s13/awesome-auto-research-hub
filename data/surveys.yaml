  related_work_outline:
  - 'Mainstream direction: Building multi-agent LLM systems that automate literature
    review, survey generation, and research paper writing, with iterative self-improvement
    and verification loops.'
  - 'Shared research pattern: Decomposing the literature intelligence workflow into
    specialized agent roles (search, curation, synthesis, review) and applying iterative
    refinement guided by feedback signals.'
  - 'Key differences: The scope of autonomy ranges from fully autonomous paper generation
    to human-in-the-loop assistance; evaluation designs vary from LLM-based rubrics
    to domain-specific benchmarks and human studies; planning strategies include tree-based
    evolutionary search, rubric-guided iteration, and internal verification cycles.'
  - 'Trend evolution: From 2023 to 2026, the field moved from isolated components
    (citation recommendation, summarization) to end-to-end agentic systems capable
    of generating entire survey papers and identifying research gaps, with growing
    emphasis on self-evolution and multi-agent coordination.'
  - 'Open questions: How to ensure factual reliability and avoid subtle hallucinations
    in generated literature reviews; how to scale beyond narrow domains while maintaining
    depth; how to ground evaluation in real scientific impact rather than proxy metrics.'
  related_work_outline_zh:
  - 主流方向：构建多智能体LLM系统，自动化文献综述、综述生成和研究论文撰写，并具备迭代自我改进和验证循环。
  - 研究共性：将文献智能工作流分解为专门的智能体角色（搜索、策展、综合、审阅），并应用由反馈信号引导的迭代优化。
  - 关键差异：自主范围从完全自主生成论文到人机协同辅助不等；评测设计从基于LLM的评分准则到领域特定基准和人类研究；规划策略包括树形进化搜索、基于评分准则的迭代和内部验证循环。
  - 趋势演进：2023至2026年，领域从孤立组件（引文推荐、摘要）发展到能够生成整篇综述论文并发现研究空白的端到端智能体系统，日益强调自我演化和多智能体协调。
  - 开放问题：如何确保生成文献综述的事实可靠性并避免微妙幻觉；如何在保持深度的同时扩展到狭窄领域之外；如何将评测建立在真实科学影响而非代理指标之上。
  literature_review:
    line_of_work_matrix:
    - line: Evaluation and evidence design
      what_it_solves: Providing benchmarks, failure analysis, and metrics to assess
        the quality of automated literature systems and AI scientists, comparing them
        against human performance.
      what_remains_open: Standardized tasks covering diverse literature domains, and
        alignment between proxy evaluation metrics and real scholarly utility.
    - line: Systems and reproducible infrastructure
      what_it_solves: Turning LLM agents into runnable workflows for automated survey
        generation, research paper synthesis, and literature review with verification,
        self-improvement, and multi-agent collaboration.
      what_remains_open: Reproducibility across different topics, dependency on human-in-the-loop
        settings, and bridging from code artifacts to generalized deployment beyond
        original experimental settings.
    - line: Action-conditioned control and planning
      what_it_solves: Enabling iterative refinement, branch exploration, and backtracking
        in literature survey and research generation pipelines to improve plan quality
        and coherence.
      what_remains_open: How much improvement comes from the planning strategy versus
        the underlying LLM capabilities, and robustness to noisy or incomplete literature
        databases.
    - line: Conceptual taxonomy and theory
      what_it_solves: Organizing the space of AI scientist systems into categories,
        identifying recurring failure modes, and proposing design principles for literature
        intelligence.
      what_remains_open: Direct empirical validation that the proposed taxonomies
        and design principles predict system behavior on new literature tasks.
    consensus:
    - Multi-agent architectures with specialized roles (search, synthesis, verification,
      review) are the dominant paradigm for automating literature review and survey
      generation.
    - Iterative refinement with external feedback loops (rubric-guided, verification,
      or self-critique) is critical for achieving high-quality outputs.
    - Current systems still rely on human evaluation or LLM-based rubrics; real-world
      scholarly impact and factual reliability remain untested outside controlled
      experiments.
    disagreements:
    - 'Approaches differ in planning strategy: tree-based evolutionary search with
      backtracking versus iterative rubric-guided refinement versus internal verification
      loops.'
    - Autonomy scope varies from fully autonomous paper generation to human-in-the-loop
      assistance and benchmarking analysis.
    - Evaluation methodology ranges from LLM-as-judge rubrics to human expert panels
      and task-completion metrics on specialized domain benchmarks.
    - 'Domain specificity: some systems target narrow scientific fields (applied mathematics,
      single-cell biology), while others pursue domain-agnostic frameworks.'
    open_questions:
    - Can automated literature systems produce novel, impactful insights beyond recombining
      existing knowledge?
    - How to verify factual accuracy and citation correctness in generated surveys
      without extensive human effort?
    - What evaluation frameworks can reliably measure the scientific quality of AI-generated
      literature reviews across disciplines?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 评测与证据设计
      解决的问题: 提供基准、失败分析和指标，以评估自动化文献系统和AI科学家的质量，并将其与人类表现进行比较。
      尚未覆盖: 覆盖多样化文献领域的标准化任务，以及代理评测指标与真实学术效用之间的对齐。
    - 路线: 系统与可复现基础设施
      解决的问题: 将LLM智能体转化为可运行的工作流，用于自动化综述生成、研究论文综合和文献综述，并具备验证、自我改进和多智能体协作能力。
      尚未覆盖: 跨不同主题的可复现性，对人机协同设置的依赖，以及从代码工件到超越原始实验环境的通用部署的桥梁。
    - 路线: 动作条件控制与规划
      解决的问题: 在文献综述和研究生成流水线中实现迭代优化、分支探索和回溯，以提高计划质量和连贯性。
      尚未覆盖: 性能提升有多少来自规划策略本身，而不是底层LLM能力，以及对嘈杂或不完整文献数据库的鲁棒性。
    - 路线: 概念分类与理论
      解决的问题: 将AI科学家系统的空间组织为类别，识别反复出现的失败模式，并提出文献智能的设计原则。
      尚未覆盖: 直接实证验证所提出的分类和设计原则能够预测新文献任务上的系统行为。
    共识:
    - 具有专门角色（搜索、综合、验证、审阅）的多智能体架构是自动化文献综述和综述生成的主要范式。
    - 由外部反馈循环（评分准则引导、验证或自我批判）驱动的迭代优化对于实现高质量输出至关重要。
    - 当前系统仍依赖人类评估或基于LLM的评分准则；在受控实验之外，真实世界的学术影响和事实可靠性尚未得到检验。
    分歧:
    - 规划策略存在差异：基于树形进化搜索与回溯、迭代式评分准则引导优化和内部验证循环。
    - 自主范围从完全自主生成论文到人机协同辅助和基准分析不等。
    - 评测方法涵盖LLM作为评判者的评分准则、人类专家小组和专门领域基准的任务完成指标。
    - 领域特异性：一些系统专注于狭窄的科学领域（应用数学、单细胞生物学），而其他系统则追求领域无关的框架。
    开放问题:
    - 自动化文献系统能否在重组现有知识之外，产生新颖且有影响力的见解？
    - 如何在无需大量人工劳动的情况下，验证生成综述中的事实准确性和引文正确性？
    - 什么样的评测框架能够可靠地衡量跨学科AI生成文献综述的科学质量？
