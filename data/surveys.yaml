  related_work_outline:
  - 'Mainstream direction: The available evidence centers on autonomous scientific-discovery
    and literature-synthesis agents that couple retrieval, reasoning, verification,
    experimentation, and paper generation into multi-agent workflows.'
  - 'Shared research pattern: Systems combine knowledge access with iterative planning,
    execution, and explicit evaluation, treating evidence maturity, auditability,
    and human alignment as core requirements rather than performing isolated citation
    search.'
  - 'Key differences: Evaluation targets range from full generated-paper quality and
    blind data-analysis tasks to multiple-choice questions derived from published
    studies; supervision includes LLM rubrics, human baselines, and review acceptance,
    while interaction modes differ.'
  - 'Trend evolution: Within the narrow 2025–2026 frontier evidence, work shifts from
    survey and single-domain benchmarking toward blind-task evaluation, end-to-end
    paper generation, failure analysis, and self-evolving agent infrastructure.'
  - 'Open questions: No dedicated measurement of literature search, citation analysis,
    or review synthesis is visible; reliability, scientific judgment, and evidence
    faithfulness of generated reviews remain unresolved.'
  related_work_outline_zh:
  - 主流方向：现有证据集中在面向科学发现与文献综述生成的自主智能体，常以多智能体闭环整合检索、推理、验证、实验和论文撰写。
  - 研究共性：各系统都把知识获取、迭代规划、执行和显式评测耦合起来，将证据成熟度、可审计性和人类目标对齐视为核心，而非只做孤立检索或引用分析。
  - 关键差异：评测对象从完整论文生成、盲数据分析任务到已发表研究衍生的选择题不等；监督信号包括LLM评分、人类基线和评审接收，交互模式也有明显区别。
  - 趋势演进：在2025至2026较窄前沿窗口内，工作从综述和单域基准转向盲任务评测、端到端论文生成、失败分析和自演化基础设施。
  - 开放问题：仍缺少专门针对文献搜索、引文分析和综述综合的测量；系统可靠性、科学判断力与生成综述的证据忠实度尚未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and literature synthesis systems
      what_it_solves: Integrating retrieval, reasoning, verification, experimentation,
        and manuscript generation into multi-agent workflows to reduce human intervention
        in theory-driven research.
      what_remains_open: Long-horizon reliability, pre-human logical verification,
        control of implementation or evaluation errors, and domain-level scientific
        judgment are not assured.
    - line: Evidence-grounded evaluation and benchmark design for discovery agents
      what_it_solves: Making open-ended scientific claims comparable through peer-review-derived
        blind tasks, frozen data, automated LLM judging, and human baselines.
      what_remains_open: Generalization across base models and domains, coverage beyond
        single-domain omics or selected benchmarks, and separation of evidence-auditable
        analysis from genuine discovery remain unclear.
    - line: Survey and conceptual taxonomy of agentic scientific workflows
      what_it_solves: Organizing fragmented systems by capability, domain, metrics,
        frameworks, datasets, and challenges such as literature review automation
        and ethics.
      what_remains_open: Direct empirical validation that the taxonomy predicts system
        behavior is missing, and literature review automation remains an identified
        bottleneck.
    - line: Reusable self-evolving agent infrastructure
      what_it_solves: Providing domain-agnostic scaffolding for continuous hypothesis
        refinement, self-critique, and knowledge accumulation across experimental
        cycles.
      what_remains_open: External validation across disciplines, hardware, data sources,
        and base models is lacking; benchmark gains may not isolate literature-intelligence
        capability.
    consensus:
    - Current work couples knowledge acquisition with planning, execution, and writing
      rather than treating literature search as a standalone tool.
    - Evaluation increasingly uses peer-review-derived tasks, frozen data, and automated
      or human baselines to constrain open-ended discovery claims.
    - Autonomous scientific workflows still show limited reliable discovery; reported
      value is primarily in supporting human researchers.
    - Literature review automation is repeatedly identified as a key unresolved challenge.
    disagreements:
    - 'Evaluation target: complete generated paper quality versus evidence maturity
      on blind data-analysis tasks versus multiple-choice questions derived from published
      studies.'
    - 'Interaction mode: human principal-investigator and agent collaboration differs
      from fully autonomous coding agents and self-evolving frameworks.'
    - 'Supervision signal: LLM rubric judging, human expert baselines, workshop acceptance,
      and broad benchmark scores have different validity and comparability.'
    - 'Evidence domain: applied mathematics paper generation, single-cell transcriptomics,
      and multi-domain scientific tasks make results difficult to align.'
    open_questions:
    - How can literature-specific capabilities such as search, citation analysis,
      and review synthesis be separated from broad scientific discovery in evaluation?
    - Can automated LLM judges substitute for human expert judgment in open-ended
      literature synthesis and discovery tasks?
    - Are reported benchmark improvements due to base model strength, agent scaffolding,
      or domain-specific priors?
    - Do verification loops improve evidence faithfulness across long-horizon multi-paper
      synthesis and review generation?
    - How can systems be prevented from defaulting to training-data patterns or declaring
      success despite failed implementation or evaluation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研与文献综合系统
      解决的问题: 将检索、推理、验证、实验和论文生成整合到多智能体流程中，以减少理论驱动研究中的人工干预。
      尚未覆盖: 长程可靠性、人工审查前的逻辑验证、实现或评估错误控制以及领域级科学判断尚未得到保证。
    - 路线: 面向发现智能体的证据锚定评测与基准设计
      解决的问题: 通过同行评审盲任务、冻结数据、自动LLM评判和人类基线，让开放式科学主张具备可比性。
      尚未覆盖: 跨基座模型与领域泛化不足，除单域组学或选定基准外覆盖有限，且难以区分证据可审计分析与真正发现。
    - 路线: 智能体科学工作流的综述与概念分类
      解决的问题: 按能力、领域、指标、框架、数据集和挑战组织分散系统，并指出文献综述自动化等瓶颈。
      尚未覆盖: 分类能否预测系统行为缺乏直接实证；文献综述自动化仍是被识别但未解决的瓶颈。
    - 路线: 可复用的自演化智能体基础设施
      解决的问题: 提供领域无关脚手架，使智能体持续优化假设、自我批判并在实验周期中积累知识。
      尚未覆盖: 跨学科、硬件、数据源和基座模型的外部验证不足；基准提升可能未隔离出文献智能能力。
    共识:
    - 当前工作把知识获取与规划、执行和写作耦合为端到端科研流程，而不是只做孤立文献搜索。
    - 评测越来越多使用来自同行评审研究的任务、冻结数据和自动或人工基线来约束开放发现。
    - 自主科研工作流仍未显示完全可靠的发现能力，报告价值主要在于支持人类研究者。
    - 文献综述自动化被重复识别为关键未解决问题。
    分歧:
    - 评测目标不同：完整生成论文质量、盲数据分析任务的证据成熟度、已发表研究衍生的选择题并列存在。
    - 交互模式不同：人类首席研究员与智能体协作、全自主编码智能体和自演化框架之间存在差异。
    - 监督信号不同：LLM评分表、人类专家基线、工作坊接收和跨基准分数各有不同效度与可比性。
    - 证据领域不同：应用数学论文生成、单细胞组学和多域科学任务使结果难以对齐。
    开放问题:
    - 如何把搜索、引文分析和综述综合等文献专属能力与广义科学发现评测分离？
    - 自动LLM评判能否在开放文献综合与发现任务中替代人类专家判断？
    - 报告的基准提升应归因于基座模型、智能体脚手架还是领域先验？
    - 验证循环能否在多篇论文合成和长程综述生成中持续提高证据忠实度？
    - 如何防止系统偏向训练数据默认模式，或在实现与评估失败时仍宣称成功？
