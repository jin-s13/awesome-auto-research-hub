  related_work_outline:
  - 'Mainstream direction: The selected evidence converges on agentic discovery loops
    that couple literature/knowledge retrieval, hypothesis formation, experimental
    execution, verification, and paper or review generation; ReasFlow and EvoMaster
    exemplify end-to-end systems, while TruthInsightBench and BAISBench represent
    evaluation-oriented artifacts.'
  - 'Shared research pattern: Multi-agent pipelines use self-critique or internal
    verification and external feedback to improve outputs, with evaluation focused
    on evidence maturity, task completion, or LLM/human review scores rather than
    search precision or citation coverage alone.'
  - 'Key differences: Systems differ by output target (full paper generation versus
    domain-specific annotation and discovery), evaluation design (blind peer-study
    tasks versus human bioinformatician baselines versus LLM review rubrics), and
    deployment domain (applied mathematics, single-cell biology, machine learning).'
  - 'Trend evolution: The available span is 2023–2026 but the top-ranked evidence
    is concentrated in 2025–2026, suggesting the current frontier is shifting from
    isolated LLM pipelines toward domain-agnostic evolving frameworks and failure-oriented
    evaluations that emphasize scientific judgment.'
  - 'Open questions: The packet lacks broad literature-search and citation-analysis
    benchmarks; current systems show weak controls, robustness, falsifiability, and
    cross-domain generalization, and several entries provide no visible code or limitation
    details, leaving reproducibility verification gaps.'
  related_work_outline_zh:
  - 主流方向：证据集中在智能体式发现循环，将文献/知识检索、假设形成、实验执行、验证与论文或综述生成耦合；ReasFlow、EvoMaster 代表端到端系统，TruthInsightBench、BAISBench
    代表评测导向工件。
  - 研究共性：多智能体流水线普遍采用自我批判或内部验证并结合外部反馈；评估多聚焦证据成熟度、任务完成或 LLM/人工评审分数，而非检索精度或引文覆盖率。
  - 关键差异：系统在输出目标（完整论文生成 vs 领域注释与发现）、评估设计（盲态同行任务 vs 人类基线 vs LLM 评审评分）和部署领域（应用数学、单细胞生物学、机器学习）上不同。
  - 趋势演进：年份跨度为 2023–2026，但高排名证据集中在 2025–2026，表明当前前沿正从孤立 LLM 流水线转向领域无关的演化框架与强调科学判断的失败案例评测。
  - 开放问题：证据包缺乏广泛文献检索与引文分析基准；现有系统在对照、稳健性、可证伪性和跨领域泛化上较弱；部分论文未显示代码或局限性说明，复现性仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research generation
      what_it_solves: Orchestrating retrieval, derivation, verification, manuscript
        generation, and self-improvement into a unified multi-agent workflow for producing
        scientific reports or papers.
      what_remains_open: Whether LLM-judged paper quality and generated derivations
        remain valid under human expert audit, broader domains, and repeated runs;
        reproduction artifacts are often not visible.
    - line: Evidence-grounded evaluation of discovery agents
      what_it_solves: Converting peer-reviewed scientific claims or data into blind
        tasks and scoreable evidentiary dimensions so agents can be compared without
        reproducing hidden target studies.
      what_remains_open: Current results are bounded to one frozen base model or one
        domain; agents still lack sufficient controls, robustness, falsifiability,
        and cross-dataset generalization.
    - line: Failure-mode analysis and design principles
      what_it_solves: Documenting recurring long-horizon agent failures such as implementation
        drift, memory degradation, overexcitement, and weak experimental design to
        derive design guidance.
      what_remains_open: Whether these principles generalize beyond machine-learning
        paper pipelines to literature review, citation analysis, and research gap
        discovery workflows.
    - line: Survey-based challenge mapping
      what_it_solves: Organizing agentic scientific discovery capabilities, evaluation
        metrics, implementation frameworks, and datasets across domains while identifying
        bottlenecks such as literature review automation and system reliability.
      what_remains_open: No direct empirical validation that proposed categories or
        challenge lists predict system performance or practical literature intelligence
        utility.
    - line: Literature synthesis and review automation as a subsystem
      what_it_solves: Embedding knowledge retrieval and paper or review generation
        inside broader discovery agents, with literature automation identified as
        a critical remaining challenge.
      what_remains_open: No dedicated benchmark is provided for literature search
        recall, citation correctness, survey coverage, or research gap discovery quality.
    consensus:
    - Autonomous scientific work requires more than generation; it must include verification,
      evidence support, and explicit evaluation to be trustworthy.
    - Current frontier systems are far from fully autonomous scientific or literature
      discovery and are better treated as assistants or partial pipelines.
    - Automated evaluation is needed, but LLM-based judges and proxy metrics remain
      weakly tied to human expert judgment and real-world scientific validity.
    - Multi-agent or pipeline architectures are the common substrate, but no single
      architecture dominates across domains.
    disagreements:
    - Some work targets end-to-end paper generation, while others evaluate only a
      slice of discovery such as cell annotation or multiple-choice scientific claims.
    - 'Evaluation signals differ: some use internally curated LLM review rubrics,
      others use blind peer-study tasks with fixed LLM judges, and others use graduate-level
      human baselines.'
    - 'Progress claims differ: system papers report high rubric scores or state-of-the-art
      benchmark scores, while failure analyses report that most attempts fail or still
      lack scientific judgment.'
    - 'Domain settings differ: applied mathematics theory generation, single-cell
      omics, and machine learning research imply different assumptions about what
      a scientific assistant should handle.'
    open_questions:
    - Do LLM-judged evidence maturity or paper quality scores align with literature
      review quality, citation accuracy, and research gap discovery value?
    - Can autonomous research systems generalize beyond one frozen base model, one
      domain, or one review rubric, and what artifacts are needed to verify generalizability?
    - How should systems balance autonomy with human scientific taste when current
      failure modes include prematurely declaring success and weak experimental design?
    - What benchmarks cover literature search recall, citation analysis, survey synthesis,
      and research gap discovery specifically? The current packet leaves this as a
      verification gap.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究生系统
      解决的问题: 将检索、推导、验证、论文生成和自我改进组织到统一多智能体工作流中，以生成科学报告或论文。
      尚未覆盖: LLM 评审判定的论文质量与生成推导是否能在人工专家审计、更广领域与重复运行中保持有效；复现工件常不可见。
    - 路线: 面向发现智能体的证据锚定评测
      解决的问题: 把同行评审科学主张或数据转化为盲态任务和可评分的证据成熟度维度，从而在不复现隐藏目标研究的情况下比较智能体。
      尚未覆盖: 当前结果限于单一冻结基座模型或单一领域；智能体在对照、稳健性、可证伪性和跨数据集泛化上仍不足。
    - 路线: 失败模式分析与设计原则
      解决的问题: 记录长周期智能体研究中的实现漂移、记忆退化、过早宣称成功和实验设计薄弱等重复失败模式，并提炼设计原则。
      尚未覆盖: 这些原则能否推广到文献综述、引文分析和研究缺口发现等工作流仍缺证据。
    - 路线: 基于综述的挑战映射
      解决的问题: 跨领域整理智能体科学发现系统的能力、评估指标、实施框架和数据集，并定位文献综述自动化与系统可靠性等瓶颈。
      尚未覆盖: 所提分类或挑战清单能否预测系统性能或真实文献智能效用尚无直接经验验证。
    - 路线: 作为子系统的文献综合与综述自动化
      解决的问题: 将知识检索和论文或综述生成嵌入更广泛的发现智能体，同时把文献自动化视为关键挑战。
      尚未覆盖: 缺少专门覆盖文献检索召回、引文准确性、综述覆盖率和研究缺口发现质量的基准。
    共识:
    - 自主科学工作不能只靠生成，还需要验证、证据支持和显式评估才能可信。
    - 当前前沿系统距离完全自主的科学或文献发现仍很远，更适合作为助手或局部流水线。
    - 自动化评估是必要方向，但基于 LLM 的评判和代理指标与人类专家判断及真实科学效用的对应关系仍然较弱。
    - 多智能体或流水线架构是共同基座，但没有单一架构跨领域占优。
    分歧:
    - 有些工作面向端到端论文生成，有些只评测发现过程的局部，如细胞注释或选择题式科学主张。
    - 评估信号不一致：有的使用内部 LLM 评审评分，有的使用盲态同行任务加固定 LLM 裁判，有的使用研究生级人类基线。
    - 对进展的判断不同：系统类论文报告高分或最优基准成绩，失败分析则指出多数尝试失败或科学判断仍缺失。
    - 领域设置不同：应用数学理论生成、单细胞组学和机器学习研究各自隐含不同的辅助需求与假设。
    开放问题:
    - LLM 评审判定的证据成熟度或论文分数是否与文献综述质量、引文准确性和研究缺口发现价值一致？
    - 自主研究系统能否跨单一冻结基座模型、单一领域或单一评审标准泛化？需要哪些工件才能验证？
    - 在失败模式包括过早宣称成功和实验设计薄弱的情况下，如何平衡自主性与人类科学品味？
    - 是否有基准专门覆盖文献检索召回、引文分析、综述综合和研究缺口发现？当前证据包将此留作验证缺口。
