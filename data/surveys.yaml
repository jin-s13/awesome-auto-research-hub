      attribution.'
    - Evaluation target differs across machine learning paper generation, applied
      mathematics proof-and-paper synthesis, and computational fluid dynamics discovery.
    - 'Success criteria differ: automated reviewer thresholds, workshop peer review,
      benchmark score gains, artifact quality, or blind review scores.'
    - Deployment scope differs between general open-ended research agents and domain-specific
      pipelines coupled to solvers or proof systems.
    open_questions:
    - Can verification and grounded reporting mechanisms eliminate hallucinated citations
      and fabricated numerical results outside the curated benchmarks shown here?
    - Do automated review scores and workshop acceptance thresholds align with reproducible,
      novel, and domain-correct scientific contributions?
    - How much of the reported improvement comes from domain-specific priors, such
      as OpenFOAM or applied mathematics structure, rather than from the general agentic
      architecture?
    - What is the smallest human intervention granularity that substantially improves
      long-horizon autonomous research without becoming exhaustive oversight?
    - Which failure-mode design principles transfer across machine learning, applied
      mathematics, and computational fluid dynamics workloads?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究与论文生成智能体
      解决的问题: 将想法生成、代码执行、实验分析、可视化和科学写作整合到单一智能体流程，降低单篇论文成本并减少人工介入。
      尚未覆盖: 成功不稳定，长程可靠性仍弱；完全自主且达到会议级论文仍属例外，未成为经过验证的通用能力。
    - 路线: 验证与自我纠正回路
      解决的问题: 在结果进入论文之前发现逻辑不一致、物理不合理、指标幻觉或执行失败。
      尚未覆盖: 验证不完整且依赖领域；静默失败仍可能通过，跨领域迁移尚未建立。
    - 路线: 人机协作与介入设计
      解决的问题: 在关键决策点引入人类判断，在不进行逐步监督的情况下提高研究质量。
      尚未覆盖: 最优介入粒度及其跨主题收益尚未标准化，也仅在有限基准上得到测量。
    - 路线: 面向AI研究者的基准与自动评审
      解决的问题: 提供任务集、评分标准或类同行评审评估，用来比较自主研究流水线。
      尚未覆盖: 自动化和工作坊级指标可能无法捕捉新颖性、可复现性、领域正确性或长期科学价值。
    - 路线: 失败模式分析与设计原则
      解决的问题: 系统化记录自主研究中的重复失败模式，例如实现漂移、记忆退化和过早宣称成功。
      尚未覆盖: 所提出的设计原则缺乏直接实证证据，证明其能预测不同领域的下游研究成功。
    共识:
    - 智能体工作流普遍覆盖问题提出、实验执行、验证和论文草拟，而不是把论文写作当作孤立步骤。
    - 某种形式的验证、评审或门控被认为对防止编造或无依据结果必不可少。
    - 完全自主系统仍脆弱；近期设计加入自我修正、有针对性的监督或失败诊断以提升稳健性。
    - 评估依赖自动评审、人工评分标准或基准分数，但同行评审接收仍然稀缺且范围较窄。
    - 开源工件、代码或基准等可复现信号参差不齐，不应等同于方法学质量。
    分歧:
    - 自主程度不同：从全自主执行到具备多种介入模式的人机协作。
    - 验证信号不同：有的使用内部逻辑审计，有的使用领域物理或视觉门控，有的使用结构化失败归因。
    - 评测目标不同：分别面向机器学习论文生成、应用数学证明与论文合成、计算流体动力学发现。
    - 成功标准不同：自动评审阈值、工作坊同行评审、基准分数提升、工件质量或盲审分数。
    - 部署范围不同：通用开放式研究智能体与耦合求解器或证明系统的领域专用流水线。
    开放问题:
    - 验证和基于事实的报告机制能否在现有基准之外消除幻觉引用和编造数值？
    - 自动评审分数和工作坊接收阈值能否代表可复现、新颖且领域正确的科学贡献？
    - 报告中的提升有多少来自OpenFOAM或应用数学等领域的先验结构，而非通用智能体架构？
    - 多大的人类介入粒度能显著改善长程自主研究，而不会退化为逐步监督？
    - 哪些失败模式设计原则可在机器学习、应用数学和计算流体动力学任务之间迁移？
