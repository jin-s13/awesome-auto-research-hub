    研究路线矩阵:
    - 路线: 端到端自主研究与论文生成
      解决的问题: 从最小提示生成完整论文，综合想法、代码、实验、可视化和写作。
      尚未覆盖: 输出质量不稳定；三篇工作坊投稿仅一篇通过同行评审，会议级或跨领域泛化尚未证明。
    - 路线: 验证与基于证据的报告
      解决的问题: 在结果进入论文前减少虚造数字、幻觉引用、无效物理结果和过早成功声明。
      尚未覆盖: 验证门仍有遗漏；一个视觉-语言物理门漏掉16个植入失败中的2个，跨领域有效性未知。
    - 路线: 人机协作与干预设计
      解决的问题: 在高杠杆决策点设置人工监督，而不是完全自主或逐步监督，改善研究结果。
      尚未覆盖: 干预模式依赖特定基准，缺少跨科学写作任务扩展最小人工指导的证据。
    - 路线: 自我纠正与失败归因
      解决的问题: 将失败运行转化为纠正，通过归因到假设、实验设计或实现并路由干预。
      尚未覆盖: 改进只在小主题集上测量；完全自主生成会议就绪论文仍未解决。
    - 路线: 模拟评审、评测与失败模式分析
      解决的问题: 通过LLM评审、工作坊投稿、工件评分和失败清单为生成论文建立可比较信号。
      尚未覆盖: 代理评审分数与接受阈值尚未在更广泛同行评审或真实影响力上得到验证。
    共识:
    - 论文写作被嵌入自主研究流程，而非作为孤立的草稿任务。
    - 验证、基于证据的报告或评审反馈被视为必要，因为智能体可能会虚造内容或过早宣布成功。
    - 多阶段结构化设计（树搜索、辩论、失败归因）优于单次生成。
    - 评估主要使用LLM评分或工作坊/基准结果，人类同行评审证据有限。
