  - 趋势演进：证据集中在2024-2026前沿：从端到端发现框架和虚拟任务环境，走向多智能体编排、树搜索、负知识记忆和更强的in-the-wild评测。
  - 开放问题：自动评审与任务指标是否代表真实科学发现，工程性提升与科研洞察难以分离，跨领域迁移和外部可复现性仍不确定。
  literature_review:
    line_of_work_matrix:
    - line: Closed-loop experiment planning and execution
      what_it_solves: Connecting hypotheses or generated ideas to executable experiments,
        code runs, and iterative revisions in simulated or in-the-wild conditions.
      what_remains_open: Whether success reflects transferable planning ability or
        task-specific engineering, and how well it generalizes to unseen experiment
        types.
    - line: End-to-end autonomous research generation systems
      what_it_solves: Automating the full discovery cycle from idea generation and
        code execution to result analysis and manuscript writing, reducing human intervention.
      what_remains_open: Whether outputs are consistent and scientifically novel,
        and whether automated review acceptance transfers to broader peer or real-world
        validation.
    - line: Discovery and experimentation testbeds
      what_it_solves: Providing structured tasks, baselines, and metrics for evaluating
        whether agents complete discovery cycles or improve published scientific ML
        models.
      what_remains_open: Whether task completion and benchmark gains proxy for research-level
        insight or real decision utility; simulated and narrow-domain coverage remains
        incomplete.
    - line: Knowledge and failure memory for research agents
      what_it_solves: Recording retrieved or failed knowledge so agents can avoid
        repeated errors, reduce token use, and transfer lessons across related experiments.
      what_remains_open: Transfer across sufficiently different scientific domains,
        curation quality, and how much improvement comes from the memory layer rather
        than task-specific priors.
    - line: Interactive multi-agent research infrastructure and code harnesses
      what_it_solves: Turning single-model research agents into customizable teams
        with monitoring, rollback, and executable connections to local codebases,
        datasets, and checkpoints.
      what_remains_open: Maturity and external validation are limited; evidence focuses
        on small internal case studies, and standardized deployment across hardware
        and user settings is missing.
    consensus:
    - 'The core shared pattern is an iterative research loop: propose hypotheses,
      execute experiments, inspect results, revise, and report; LLM-based agents are
      central to this loop.'
    - Evaluation relies on automated reviewers, task completion metrics, benchmark
      improvement, or expert preference, but most reported systems lack broad external
      validation.
    - 'There is convergence on supporting infrastructure: knowledge retrieval, failure
      memory, code harnesses, and monitoring are introduced to improve agent reliability.'
    - Reproducibility signals are uneven across the evidence; missing artifact details
      are verification gaps rather than proof that artifacts do not exist.
    disagreements:
    - Evaluation targets range from manuscript acceptance and automated review, to
      simulated discovery task completion, to improving published scientific ML benchmarks,
      to expert preference in case studies.
    - Interaction modes split between fully autonomous operation, human-principal-investigator
      collaboration, and interactive team management with monitoring and rollback.
    - 'Deployment settings differ: simulated virtual task environments, in-the-wild
      scientific ML codebases and benchmarks, and theory-driven applied mathematics.'
    - 'Improvement mechanisms differ: end-to-end agentic tree search, shared negative-knowledge
      memory, knowledge retrieval, and plug-in skills target different failure modes.'
    open_questions:
    - How well do automated reviewer scores and task completion metrics predict real
      scientific novelty, soundness, and downstream impact?
    - Can reported benchmark gains be separated into research-level insight versus
