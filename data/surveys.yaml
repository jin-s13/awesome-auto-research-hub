    mistakes.'
  related_work_outline_zh:
  - 主流方向：构建能够自主生成、执行和评估科学假设的端到端AI研究智能体，并重点强调可靠性、可验证性和自我纠正能力。
  - 研究共性：采用基于LLM智能体的闭环架构，生成想法、开展实验并撰写论文，再通过自动化或类人评审检测失败，迭代提升输出质量。
  - 关键差异：评估范式涵盖虚拟仿真环境、真实工作坊投稿和领域特定的物理验证；可靠性机制包括事后评审、在线失败归因与多智能体监督。
  - 趋势演进：从2024年的单一框架，发展到2025-2026年引入树搜索、多智能体协作和结构化失败诊断，重心从单纯自动化转向可信赖性与领域锚定。
  - 开放问题：现有基准能否捕捉真实科学的创造性新颖性；如何在LLM先验之外嵌入物理合理性与领域知识；自我纠正能否处理深层推理错误而非表面失误。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous scientific discovery pipelines
      what_it_solves: Automating the full research cycle from idea generation to paper
        writing, reducing human effort in routine experimentation.
      what_remains_open: The outputs often lack scientific correctness and reliability;
        domain-specific validation (e.g., physical plausibility) is not yet a standard
        component, and the systems can produce plausible-looking but flawed results.
    - line: Evaluation benchmarks and virtual environments for AI scientists
      what_it_solves: Providing standardized tasks and metrics to compare the capabilities
        of different AI research agents in a controlled setting.
      what_remains_open: Benchmark tasks are simplified proxies that may not reflect
        the complexity of real scientific discovery; the alignment between proxy metrics
        and genuine scientific utility remains unvalidated.
    - line: Failure analysis, self-correction, and reliability enhancement
      what_it_solves: Detecting and diagnosing errors in autonomous research workflows,
        then routing corrective interventions to improve output trustworthiness.
      what_remains_open: Coverage of failure modes is incomplete, especially for subtle
        scientific reasoning errors; the causal attribution of failures can be noisy
        and may not generalize across different experimental stacks.
    - line: Multi-agent collaboration and interactive research platforms
      what_it_solves: Enabling human oversight, role specialization, and real-time
        control over the research process, blending autonomy with user guidance.
      what_remains_open: The transition from assisted to fully autonomous operation
        is not characterized; the scalability and coherence of multi-agent teams across
        diverse scientific domains remain untested.
    consensus:
    - LLM-based agents can already perform parts of the scientific workflow but are
      not yet reliable enough for fully autonomous discovery.
    - Structured verification—whether via automated reviewers, vision-language gates,
      or failure attribution—is necessary to catch errors and improve output quality.
    - Iterative feedback loops that incorporate experiment results, reviews, or failure
      signals are critical for boosting performance across different system designs.
    disagreements:
    - 'Evaluation target: some systems are judged by virtual task completion (DISCOVERYWORLD,
      BAISBench), while others aim for real peer-review acceptance (AI Scientist-v2,
      AI CFD Scientist), creating different standards for what constitutes a successful
      research output.'
    - 'Reliability mechanism: post-hoc automated review contrasts with online, step-by-step
      failure attribution and physics-aware verification gates, implying different
      assumptions about when and how errors can be caught.'
    - 'System architecture: monolithic agent pipelines versus multi-agent teams with
      customizable roles, affecting how responsibility is distributed and how human
      feedback is integrated.'
    open_questions:
    - How can we verify physical or domain-specific validity in AI-generated research
      beyond what LLM priors offer, and what architectures allow external ground-truth
      signals to be integrated without breaking the closed-loop autonomy?
    - Do current evaluation benchmarks for AI scientists correlate with the long-term
      impact or novelty of real scientific discoveries, and what metrics would be
      needed to measure creativity?
    - Can self-correction mechanisms progress from fixing surface implementation errors
      to repairing conceptual flaws in hypotheses or experimental design, and what
      evidence would demonstrate such a capability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自动科学发现流水线
      解决的问题: 自动化从想法生成到论文撰写的完整研究循环，减少常规实验中的人力投入。
      尚未覆盖: 输出结果往往缺乏科学正确性和可靠性；领域特定的验证（如物理合理性）尚未成为标准组件，系统可能产生看似合理但有缺陷的结果。
    - 路线: 面向AI科学家的评估基准与虚拟环境
      解决的问题: 提供标准化任务和指标，在受控环境下比较不同AI研究智能体的能力。
      尚未覆盖: 基准任务是简化的代理，可能无法反映真实科学发现的复杂性；代理指标与真实科学效用之间的一致性尚未验证。
    - 路线: 失败分析、自我纠正与可靠性增强
      解决的问题: 检测并诊断自主研究工作流中的错误，然后引导纠正干预以提升输出的可信赖性。
      尚未覆盖: 失败模式的覆盖范围不完整，尤其是对微妙的科学推理错误；失败的因果归因可能存在噪声，且在跨实验栈时不一定能泛化。
    - 路线: 多智能体协作与交互式研究平台
      解决的问题: 实现人类监督、角色分工和对研究过程的实时控制，将自主性与用户指导相结合。
      尚未覆盖: 从辅助到完全自主运行的过渡未被刻画；多智能体团队在不同科学领域内的可扩展性和连贯性尚未得到验证。
    共识:
    - 基于LLM的智能体已经可以部分执行科学工作流，但仍不足以可靠地完成完全自主的科学发现。
    - 结构化的验证——无论是通过自动化评审、视觉-语言门控还是失败归因——对于捕获错误并提升输出质量是必要的。
    - 融合实验结果、评审意见或失败信号的迭代反馈循环，对不同系统设计下的性能提升至关重要。
    分歧:
    - 评估目标：部分系统通过虚拟任务完成度来评判（如DISCOVERYWORLD、BAISBench），而另一些则瞄准真实的同行评审接受（如AI Scientist-v2、AI
      CFD Scientist），这形成了对成功研究产出的不同标准。
    - 可靠性机制：事后自动化评审与在线、逐步的失败归因和物理感知验证门控形成对比，反映了在何时、如何捕获错误方面的不同假设。
    - 系统架构：单一智能体流水线与可定制角色的多智能体团队之间的差异，影响责任分配方式和人类反馈的整合方式。
    开放问题:
