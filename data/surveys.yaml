  related_work_outline:
  - 'Mainstream direction: Developing fully automated AI systems that can perform
    the entire scientific research cycle—from idea generation and experiment execution
    to paper writing—and building evaluation benchmarks to assess their reliability,
    scientific quality, and robustness.'
  - 'Shared research pattern: All systems decompose the scientific process into stages
    (hypothesis generation, experimental design, execution, analysis, reporting) and
    use large language models as the core reasoning engine, often augmented with tool
    use, multi-agent interaction, or verification gates to improve output quality.'
  - 'Key differences: Systems differ in their evaluation targets—some aim for end-to-end
    paper generation evaluated by automated reviewers or peer review, others focus
    on domain-specific physical validity (e.g., CFD), and still others provide task-based
    benchmarks. They also diverge in how they handle failures: reflection-based self-correction,
    multi-hypothesis failure attribution, or vision-language physics verification
    gates.'
  - 'Trend evolution: From 2024 to 2026, the trend moved from initial proof-of-concept
    frameworks (The AI Scientist) to systems with improved search and verification
    (AI Scientist-v2), domain-specific instantiations (AI CFD Scientist), multi-agent
    platforms (Claw AI Lab), and explicit failure analysis and self-correction methods
    (SAGE, Why LLMs Aren''t Scientists Yet). The focus is shifting from raw generation
    to robustness, reproducibility, and scientific validity.'
  - 'Open questions: Can these systems produce genuinely novel scientific insights
    beyond imitating paper structure? How well do automated evaluation metrics (e.g.,
    simulated reviewers) correlate with true scientific merit? What is the coverage
    of domain-specific verification gates for silent failures, and can they generalize
    to new domains? How to imbue agents with scientific taste and hypothesis discrimination?'
  related_work_outline_zh:
  - 主流方向：开发能够完成整个科学研究循环（从想法生成、实验执行到论文撰写）的全自动AI系统，并建立评估基准以衡量其可靠性、科学质量和鲁棒性。
  - 研究共性：所有系统都将科学过程分解为阶段（假设生成、实验设计、执行、分析、报告），并使用大型语言模型作为核心推理引擎，通常辅以工具使用、多智能体交互或验证门控来提升输出质量。
  - 关键差异：评估目标不同——有的致力于端到端论文生成并通过自动评审者或同行评审评价，有的专注于特定领域的物理有效性（如CFD），还有的提供基于任务的基准测试。在失败处理上也有分歧：基于反思的自我纠正、多假设失败归因，或视觉-语言物理验证门控。
  - 趋势演进：从2024到2026年，趋势从初始概念验证框架（AI Scientist）发展到具有改进搜索和验证的系统（AI Scientist-v2）、领域特化实例（AI
    CFD Scientist）、多智能体平台（Claw AI Lab），以及明确的失败分析与自我纠正方法（SAGE、Why LLMs Aren't Scientists
    Yet）。焦点正从原始生成转向鲁棒性、可复现性和科学有效性。
  - 开放问题：这些系统能否产生超越模仿论文结构的真正新颖科学洞察？自动化评估指标（如模拟评审者）与真实科学价值的相关性如何？针对静默失败的领域特定验证门控的覆盖范围如何，能否泛化到新领域？如何赋予智能体科学品味和假设辨别能力？
  literature_review:
    line_of_work_matrix:
    - line: End-to-end automated scientific discovery systems
      what_it_solves: Automating the full research pipeline—idea generation, code
        implementation, experiment execution, result visualization, and paper writing—to
        reduce human effort and explore open-ended research directions.
      what_remains_open: Inconsistent success rates (only a fraction of attempts produce
        valid results), reliance on pre-existing code templates, lack of physical
        validity checks in purely computation-based domains, and weak scientific taste
        leading to trivial or flawed hypotheses.
    - line: Domain-specific scientist agents with physical verification
      what_it_solves: Embedding domain knowledge (e.g., physics) into the autonomous
        discovery loop via vision-language gates that inspect simulated outcomes to
        detect silent failures not caught by solver-level checks.
      what_remains_open: Verification gates are not exhaustive and can miss failure
        modes (e.g., 2 out of 16 planted failures in ablation); the approach is tied
        to a specific domain (CFD) and its generalization to other physical sciences
        or unstructured domains is unproven.
    - line: Evaluation benchmarks and environments for AI scientists
      what_it_solves: Standardizing assessment of automated discovery agents through
        diverse tasks, metrics, and difficulty levels that go beyond simple code generation,
        capturing the full cycle of hypothesis formation and experimental design.
      what_remains_open: Whether the task set truly captures the novelty and complexity
        of real-world scientific discovery, and how well proxy metrics (task completion,
        extracted knowledge) align with actual scientific progress or human judgment.
    - line: Failure analysis and robustness enhancement
      what_it_solves: Systematically diagnosing why autonomous research agents fail
        (e.g., implementation drift, memory degradation, overexcitement) and designing
        mechanisms for self-correction, such as multi-hypothesis failure attribution
        or grounded reporting.
      what_remains_open: Self-correction improves but does not fully solve the challenge
        of producing conference-ready papers; failure taxonomies are based on limited
        case studies and may not cover all failure modes; the causal attribution of
        failures may be incomplete.
    consensus:
    - Large language model agents are the core building block for automating scientific
      discovery, with researchers converging on a pipeline or multi-agent decomposition
      of the scientific workflow.
    - There is a shared recognition that current systems are brittle and require explicit
      verification or self-critique mechanisms to improve output reliability, as naive
      generation often leads to silent failures or invalid claims.
    - Evaluation must go beyond simple code generation scores and consider the entire
      scientific process, including hypothesis quality, experimental rigor, and reporting
      accuracy, though the community has not yet settled on a unified metric.
    disagreements:
    - 'Evaluation target: Some works evaluate success by acceptance in human peer
      review (workshop or full conference), others by automated reviewer scores, and
      others by task completion on a predefined benchmark; the alignment between these
      targets is unclear.'
    - 'Verification strategy: Physics-aware systems use vision-language gates to inspect
      visual outputs, while general-purpose systems rely on execution feedback or
      self-reflection; no consensus on whether domain-specific verification is necessary
      for all fields.'
    - 'Interaction mode: Single-agent pipelines, multi-agent teams with specialized
      roles, and interactive platforms with human-in-the-loop monitoring represent
      different trade-offs between autonomy and control, with no clear winner.'
    - 'Deployment setting: Systems are demonstrated on machine learning subfields,
      computational fluid dynamics, or single-cell biology, but the extent to which
      they can generalize across disciplines without retooling remains a point of
      contention.'
    open_questions:
    - How can we endow AI scientists with the ability to distinguish promising from
      trivial hypotheses, i.e., scientific taste, which is currently observed as a
      key failure mode?
    - What is the minimal set of verification mechanisms needed to guarantee that
      an AI-generated research claim is reproducible and not a silent failure, especially
      in domains without a visual or physical oracle?
    - How well do automated reviewers or benchmark metrics predict the true scientific
      value of a discovery, and what are the risks of over-optimizing for these proxies?
    - Can the failure analysis and self-correction techniques developed in limited
      case studies be shown to generalize across a wider range of sciences and more
      complex research tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自动化科学发现系统
      解决的问题: 自动化完整研究流程——想法生成、代码实现、实验执行、结果可视化和论文撰写——以减少人工努力并探索开放式研究方向。
      尚未覆盖: 成功率不一致（仅部分尝试产生有效结果），依赖预先存在的代码模板，在纯计算领域缺乏物理有效性检查，科学品味薄弱导致琐碎或有缺陷的假设。
    - 路线: 带物理验证的领域特定科学家智能体
      解决的问题: 通过视觉-语言门控将领域知识（如物理）嵌入自主发现循环，检查仿真输出以检测求解器级检查遗漏的静默失败。
      尚未覆盖: 验证门控并非穷尽，可能遗漏失败模式（例如消融中16个植入失败漏检2个）；方法绑定到特定领域（CFD），其向其他物理科学或非结构化领域的泛化未经证实。
    - 路线: 用于AI科学家的评估基准与环境
      解决的问题: 通过超越简单代码生成的多样化任务、指标和难度级别，标准化评估自动化发现智能体，覆盖假设形成和实验设计的完整循环。
      尚未覆盖: 任务集是否真正捕捉到现实世界科学发现的新颖性和复杂性，代理指标（任务完成度、提取知识）与实际科学进步或人类判断的一致性如何。
    - 路线: 失败分析与鲁棒性增强
      解决的问题: 系统诊断自主研究智能体失败的原因（如实现漂移、记忆退化、过度兴奋），并设计自我纠正机制，例如多假设失败归因或基于事实的报告。
      尚未覆盖: 自我纠正有所改善，但未完全解决生成可提交会议论文的挑战；失败分类基于有限案例研究，可能未覆盖所有失败模式；失败的因果归因可能不完整。
    共识:
    - 大型语言模型智能体是自动化科学发现的核心构建块，研究者正汇聚于将科学工作流分解为流水线或多智能体协作的设计。
    - 普遍认识到当前系统脆弱，需要显式验证或自我批判机制来提高输出可靠性，因为朴素生成常导致静默失败或无效主张。
    - 评估必须超越简单的代码生成分数，考虑整个科学过程，包括假设质量、实验严谨性和报告准确性，但社区尚未就统一指标达成一致。
    分歧:
    - 评估目标：部分工作以人类同行评审（工作坊或会议）的接受为成功标准，其他以自动评审者分数或预定义基准的任务完成度衡量；这些目标之间的对齐尚不明确。
    - 验证策略：物理感知系统使用视觉-语言门控检查视觉输出，而通用系统依赖执行反馈或自我反思；是否所有领域都需要领域特定验证尚无共识。
    - 交互模式：单智能体流水线、具有专门角色的多智能体团队以及带有人工监控的交互式平台，代表了自主性与控制之间的不同权衡，无明确赢家。
    - 部署场景：系统在机器学习子领域、计算流体动力学或单细胞生物学上展示，但其在不同学科间无需重新工具化的泛化程度仍存在争议。
    开放问题:
    - 如何赋予AI科学家区分有前景假设与琐碎假设的能力，即科学品味，这被观察到是一个关键失败模式？
    - 保证AI生成的研究声明可复现且非静默失败所需的最小验证机制集是什么，特别是在缺乏视觉或物理神谕的领域？
    - 自动评审者或基准指标在多大程度上能预测一项发现的真实科学价值，以及过度优化这些代理指标的风险是什么？
    - 在有限案例研究中发展的失败分析和自我纠正技术能否被证明可泛化到更广泛的科学领域和更复杂的研究任务？
