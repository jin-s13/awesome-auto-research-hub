  related_work_outline:
  - 'Mainstream direction: Multi-agent autonomous research systems dominate, including
    generation-oriented examples like ReasFlow and EvoMaster; blind or domain-specific
    evaluation examples such as TruthInsightBench and BAISBench are emerging as complementary
    lines.'
  - 'Shared research pattern: Most work casts LLM agents as scientific workers that
    retrieve literature, perform analysis, self-critique, and draft outputs; evaluation
    often uses LLM judges or expert baselines targeting evidence maturity, auditability,
    and novelty.'
  - 'Key differences: Some contributions are end-to-end generation systems, others
    are blind discovery benchmarks, domain-specific omics evaluations, surveys, or
    failure-case studies; they differ in evaluation target, supervision mode, and
    domain specificity.'
  - 'Trend evolution: Within a narrow 2025-2026 frontier, work is expanding from isolated
    agent systems toward reusable evolving frameworks and standardized blind benchmarks
    that probe evidence rather than reproduction; failure and trustworthiness analysis
    is increasing.'
  - 'Open questions: Open issues include whether automated judges align with human
    scientific utility, whether literature search and gap discovery can be validated
    separately from paper generation, and how findings generalize across domains,
    base models, and settings.'
  related_work_outline_zh:
  - 主流方向：多智能体自主科研系统是主流，如 ReasFlow 和 EvoMaster 代表生成路线；TruthInsightBench 和 BAISBench
    等盲测或领域专用评测构成互补路线。
  - 研究共性：多数工作将 LLM 智能体视为科研执行者，负责检索文献、执行分析、自我批判和撰写输出；评估常采用 LLM 评审或专家基线，关注证据成熟度、可审计性和新颖性。
  - 关键差异：有的是端到端生成系统，有的是盲测发现基准、领域组学评测、综述或失败案例研究；它们在评估目标、监督方式、领域专用性和证据类型上存在差异。
  - 趋势演进：在 2025-2026 前沿期内，研究正从孤立智能体系统走向可复用演化框架和标准化盲测基准，更关注证据而非复现；对失败与可信度的反思也在增加。
  - 开放问题：自动评审分数是否与人类科学效用一致，文献搜索与研究缺口发现能否独立于论文生成评测，以及现有结果能否跨领域、基座模型和设置泛化，仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research synthesis and manuscript generation
      what_it_solves: Integrates literature synthesis, knowledge retrieval, verification,
        derivation, experimentation, and paper drafting in a single agent workflow.
      what_remains_open: Whether rubric-based evaluation of generated papers demonstrates
        trustworthy scientific contribution, and whether missing limitation reporting
        weakens verification.
    - line: Blind evidence-grounded discovery benchmarking
      what_it_solves: Evaluates agents on peer-reviewed tasks with frozen data and
        hidden source conclusions to measure evidence maturity rather than reproduction.
      what_remains_open: Reported results use one frozen base model; agents lack controls,
        robustness, falsifiability, and cross-dataset generalization.
    - line: Domain-specific biological discovery evaluation
      what_it_solves: Grounds AI scientist evaluation in real single-cell transcriptomic
        data and human expert baselines for annotation and discovery questions.
      what_remains_open: Multiple-choice discovery tasks and graduate-level human
        baselines may not fully represent open-ended biological research or general
        literature intelligence.
    - line: Survey-based capability and challenge mapping
      what_it_solves: Catalogs agentic AI systems, capabilities, metrics, frameworks,
        datasets, and challenges including literature review automation.
      what_remains_open: Literature review automation, system reliability, and ethics
        remain unresolved; categories lack direct empirical validation.
    - line: Failure-case analysis and design principles
      what_it_solves: Documents recurring failure modes from autonomous ML research
        attempts and derives design principles for more robust pipelines.
      what_remains_open: Evidence is limited to four attempts with one success; domain
        intelligence, implementation drift, and scientific taste remain weak.
    - line: Domain-agnostic self-evolving agent frameworks
      what_it_solves: Provides a reusable framework for iterative hypothesis refinement,
        self-critique, and knowledge accumulation across domains.
      what_remains_open: Benchmark gains do not directly isolate literature intelligence,
        review synthesis, or gap discovery; limitations are not reported, so trustworthiness
        boundaries are unclear.
    consensus:
    - Recent work frames scientific investigation as a multi-agent workflow in which
      agents retrieve knowledge, execute analysis, self-critique, and draft outputs.
    - Evaluation increasingly uses automated LLM judges or expert baselines, with
      recurring criteria around evidence maturity, auditability, and novelty.
    - Current systems are treated as assistive rather than fully autonomous scientists;
      reliability, human oversight, and literature review automation remain central
      concerns.
    disagreements:
    - 'Evaluation target differs: generated-paper rubric quality versus blind evidence-grounded
      discovery versus human-relative multiple-choice tasks.'
    - 'Interaction and supervision differ: human-as-PI with internal verification
      versus fully autonomous pipelines versus external benchmark judges.'
    - 'Scope and deployment differ: domain-agnostic evolving frameworks versus domain-specific
      omics benchmarks and applied mathematics workflows.'
    - 'Evidence type differs: some rely on state-of-the-art benchmark scores, others
      on failure modes, human baselines, or survey synthesis.'
    open_questions:
    - Can automated LLM judges and rubric scores detect the missing controls, robustness,
      and falsifiability that current agents do not exhibit?
    - How can literature search, reading, and gap discovery be evaluated independently
      of end-to-end paper generation quality?
    - How far do findings generalize beyond single frozen base models, one biological
      modality, or four autonomous ML attempts?
    - What minimum evidence maturity and failure documentation should an autonomous
      literature-intelligence system expose before expert trust is justified?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研综合与论文生成
      解决的问题: 在单一智能体流程中整合文献综合、知识检索、验证、推导、实验和论文撰写。
      尚未覆盖: 基于评分准则评估生成论文是否足以证明科学贡献值得信赖；缺少局限性报告可能削弱验证。
    - 路线: 盲测证据锚定发现基准
      解决的问题: 用同行评议任务、冻结数据和隐藏源结论评估智能体，衡量证据成熟度而非复现能力。
      尚未覆盖: 结果仅基于单一冻结基座模型；智能体普遍缺少对照、稳健性、可证伪性和跨数据集泛化。
    - 路线: 领域专用生物学发现评测
      解决的问题: 在真实单细胞转录组数据上，用人类专家基线评估细胞注释和科学发现选择题。
      尚未覆盖: 选择题发现任务与研究生级人类基线未必能覆盖开放式生物学研究或一般文献智能。
    - 路线: 基于综述的能力与挑战梳理
      解决的问题: 按领域和能力对智能体 AI 系统、指标、框架、数据集和挑战进行分类，包括文献综述自动化。
      尚未覆盖: 文献综述自动化、系统可靠性和伦理仍被列为未解决；分类缺乏直接实证验证。
    - 路线: 失败案例分析与设计原则
      解决的问题: 记录自主机器学习研究尝试的重复失败模式，推导更稳健流水线的设计原则。
      尚未覆盖: 证据仅来自四次尝试且一次成功；领域智能、实现漂移和科学品味仍薄弱。
    - 路线: 领域无关的自演化智能体框架
      解决的问题: 提供可复用框架，实现迭代假设精炼、自我批判和跨领域知识积累。
      尚未覆盖: 基准提升并未单独证明文献智能、综述综合或研究缺口发现；缺少局限性报告，可信边界不清。
    共识:
    - 近期工作将科学调查建模为多智能体流程，由智能体检索知识、执行分析、自我批判并撰写输出。
    - 评估越来越依赖自动 LLM 评审或专家基线，反复关注证据成熟度、可审计性和新颖性。
    - 当前系统被视为辅助性而非完全自主的科学家；可靠性、人类监督和文献综述自动化仍是核心关切。
    分歧:
    - 评估目标不同：生成论文的准则质量、盲测证据锚定发现、或相对人类的选择题表现。
    - 交互与监督方式不同：人类担任 PI 并带内部验证、全自主流水线、或外部基准评审。
    - 范围与部署不同：领域无关的自演化框架与领域专用的组学评测或应用数学工作流。
    - 证据类型不同：有的依赖最新基准分数，有的依赖失败模式、人类基线或综述综合。
    开放问题:
    - 自动 LLM 评审和准则分数能否发现当前智能体所缺少的对照、稳健性与可证伪性？
    - 文献搜索、阅读和研究缺口发现能否独立于端到端论文生成质量进行评测？
    - 研究发现能否跨单一冻结基座模型、单一生物模态或四次自主机器学习尝试而泛化？
    - 自主文献智能系统在获得专家信任前，至少应暴露哪些证据成熟度与失败记录？
