  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agents
      what_it_solves: Turns LLM agents into iterative scientific workflows that formulate
        ideas, write code, run experiments, visualize results, and author manuscripts
        in one loop.
      what_remains_open: Quality is unstable and domain-specific validity gates are
        still incomplete; peer-review-level reliability and consistent discovery remain
        unproven.
    - line: Benchmark environments for discovery skills
      what_it_solves: Provides standardized task suites for hypothesis formation,
        experimental design, result analysis, and conclusion, enabling reproducible
        comparison across agents.
      what_remains_open: Virtual and multiple-choice proxies may simplify discovery;
        strong agents still struggle, and human baselines are available only in narrow
        domains.
    - line: Evidence-grounded evaluation instruments
      what_it_solves: Assesses whether conclusions are supported by data through dimensions
        such as controls, robustness, falsifiability, auditability, and generalization.
      what_remains_open: Generalization across base models and scientific domains
        is not established, and fixed LLM judges may not yet verify trustworthy discovery.
    - line: Interactive multi-agent research platforms
      what_it_solves: Offers customizable roles, real-time monitoring, code harnesses,
        artifact inspection, and rollback/resume control for guided research workflows.
      what_remains_open: Current evidence comes from few internal case studies, so
        external validity, maturity, and scalability are unresolved.
    - line: Failure-mode analysis and design principles
      what_it_solves: Documents recurring failures such as implementation drift, context
        degradation, overexcitement, and weak scientific taste to derive more robust
        designs.
      what_remains_open: The failure taxonomy is based on a small number of end-to-end
        attempts and needs broader validation across domains and longer research horizons.
    consensus:
    - Autonomous research is treated as a closed-loop cycle connecting idea/hypothesis,
      coding, experiments, results, and reporting.
    - 'Evaluation is central: contributions introduce tasks, metrics, automated reviewers,
      judges, or review workflows rather than reporting only a single result.'
    - Execution and documentation are stronger than scientific judgment; current systems
      can run and record analyses but often miss controls, robustness, and falsifiability.
    - Code, artifacts, and benchmark infrastructure are recognized as reproducibility
      signals, but they do not by themselves guarantee evidence quality.
    disagreements:
    - 'Evaluation target differs: virtual task completion, workshop peer acceptance,
      blind evidence maturity, and domain-specific discovery questions emphasize different
      success criteria.'
    - 'Validity mechanism differs: physics-visual inspection, LLM review/judging,
      human and multi-AI review, and interactive dashboard monitoring provide different
      failure checks.'
    - 'Domain strategy differs: general ML workflows, physics-specific code generation
      and verification, and biology-specific real-data benchmarks are pursued separately.'
    - 'Interaction mode differs: fully automated pipelines, tree-search agent systems,
      and supervised multi-agent platforms imply different levels of human control.'
    open_questions:
    - Can automated validity gates and judges reliably catch silent failures outside
      known ablation cases when a physics-visual gate missed two of sixteen planted
      failures?
    - Do current agent rankings generalize across base models, scientific domains,
      and longer research cycles beyond one frozen base model or a small set of internal
