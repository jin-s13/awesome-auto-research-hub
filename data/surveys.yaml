  literature_review:
    line_of_work_matrix:
    - line: General end-to-end autonomous research frameworks
      what_it_solves: Automating the complete research cycle from idea generation
        through code, experiment execution, visualization, and manuscript writing
        without human-authored per-paper templates.
      what_remains_open: 'Reliability is inconsistent: only one of three submitted
        papers passed peer review, and early systems depended on code templates or
        automated reviewers rather than external scientific validation.'
    - line: Domain-embedded discovery agents with validity gates
      what_it_solves: Reducing silent errors in specialized domains such as applied
        mathematics and computational fluid dynamics by adding logical verification,
        physics-aware visual inspection, knowledge retrieval, and source-code modification.
      what_remains_open: Validity gates remain incomplete; a planted-failure ablation
        missed 2 of 16 silent failures, and evidence is limited to specific domains
        and task settings.
    - line: Evaluative environments and evidence design for discovery agents
      what_it_solves: Providing repeatable tasks, expert-labeled datasets, and human
        baselines to compare agents across complete discovery cycles and domain-specific
        questions.
      what_remains_open: Current agents still struggle on many benchmark tasks, and
        it is unclear whether task completion or multiple-choice answers align with
        real scientific discovery utility.
    - line: Human-in-the-loop collaborative research pipelines
      what_it_solves: Improving autonomous research by offering intervention modes,
        structured debate, self-healing execution, verifiable reporting, and cross-run
        learning.
      what_remains_open: Optimal human intervention granularity and generalization
        beyond a single benchmark remain underevidenced.
    consensus:
    - Autonomous research systems must include some verification or review mechanism
      to catch errors before final claims are accepted.
    - Current systems can produce plausible research artifacts but are not yet consistently
      reliable enough for full autonomy.
    - Evaluations increasingly combine task completion, generated-paper quality, and
      expert human baselines rather than a single score.
    - Transparency and reproducibility signals such as open-source code or artifacts
      are treated as part of system contribution.
    disagreements:
    - 'Verification signal differs: logical or physics-aware domain gates versus LLM/VLM
      reviewers versus expert-labeled task answers versus targeted human oversight.'
    - 'Deployment setting differs: general machine-learning workflows, applied mathematics,
      computational fluid dynamics, biological omics, and simulated text-based discovery
      tasks make different assumptions about execution and error modes.'
    - 'Evaluation target differs: manuscript quality and peer-review acceptance, benchmark
      task completion or metric improvement, and domain-discovery question accuracy
      are not interchangeable.'
    - 'Interaction mode differs: full autonomy, human principal investigator style,
      or selective human intervention at high-leverage decision points.'
    open_questions:
    - How can automated reviewers and validity gates be validated against human peer
      review outside the narrow settings reported?
    - What level of human intervention produces reliable scientific claims without
      losing the benefits of autonomy?
    - Do benchmark task completion and multiple-choice discovery accuracy predict
      real scientific utility or publishable findings?
    - How can systems detect silent failures beyond those explicitly planted in ablations?
    - What evidence would demonstrate generalization across domains beyond the specific
      math, CFD, omics, and machine-learning settings in the packet?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 通用端到端自主研究框架
      解决的问题: 自动化完整研究循环，从想法生成、代码实现、实验执行、可视化到论文撰写，减少每篇论文的人工模板依赖。
      尚未覆盖: 可靠性不稳定；三篇提交论文仅一篇通过同行评审，且早期系统依赖代码模板或自动评审，而非外部科学验证。
    - 路线: 嵌入领域的发现智能体与有效性门控
      解决的问题: 在应用数学和计算流体动力学等专业领域，通过逻辑验证、物理感知视觉检查、知识检索和源代码修改来减少静默错误。
      尚未覆盖: 有效性门控仍不完整；植入故障消融中16个静默故障漏检2个，证据局限于特定领域和任务设置。
    - 路线: 发现智能体的评测环境与证据设计
      解决的问题: 提供可重复任务、专家标注数据集和人类基线，以比较智能体在完整发现循环和领域问题上的表现。
      尚未覆盖: 当前智能体在许多任务上仍然困难，任务完成度或选择题得分是否与真实科学发现效用一致尚不清楚。
