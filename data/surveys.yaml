  literature_review:
    line_of_work_matrix:
    - line: Automated discovery agent architectures and end-to-end pipelines
      what_it_solves: Turning ideation, code execution, experiment writing, and review
        into repeatable agentic workflows for producing paper-like claims.
      what_remains_open: Whether generated claims survive external validity checks,
        domain-specific verification, and human or peer review beyond narrow case
        studies.
    - line: Benchmark environments for open-ended scientific discovery
      what_it_solves: Making discovery capabilities comparable through hidden tasks,
        baselines, completion metrics, and human performance anchors.
      what_remains_open: Coverage across domains and agreement between task success,
        process metrics, and real scientific utility.
    - line: Evidence-maturity and automated review evaluation
      what_it_solves: Scoring whether agent-produced claims have sufficient controls,
        robustness, falsifiability, and auditability without relying on target answers.
      what_remains_open: Generalizability across base models, judge robustness, and
        sensitivity to style or artifact gaming.
    - line: Domain-specific validity gates and verification
      what_it_solves: Detecting silent failures in generated analyses or simulations
        through task-aware checks such as physics-aware visual-language verification.
      what_remains_open: False negatives and transferability of such gates to new
        domains or tasks.
    - line: Interactive multi-agent research infrastructure
      what_it_solves: Providing human oversight, role customization, code harnesses,
        and real-time monitoring for inspectable multi-agent experiments.
      what_remains_open: Maturity and external validation beyond limited internal
        case studies; reproducibility signals remain incomplete.
    consensus:
    - Automated research agents can now produce plausible paper-like outputs and execute
      basic analyses, but they do not yet demonstrate fully trustworthy autonomous
      discovery.
    - Evaluation is shifting toward blind or evidence-based settings that hide target
      conclusions to prevent simple reproduction.
    - Automated judges or reviewer models are used as scalable proxies for quality,
      but papers agree their discriminative power needs more validation.
    - Reproducibility artifacts such as code, datasets, and task suites are valued,
      though available evidence is incomplete.
    disagreements:
    - 'Evaluation target differs: some measure task completion in virtual discovery
      environments, others measure evidence maturity of claims, domain-specific validity,
      or acceptance in workshop peer review.'
    - 'Supervision signals differ: automated LLM judges, visual-language physics gates,
