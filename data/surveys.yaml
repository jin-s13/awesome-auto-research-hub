    year: 2026
    score: 49.3
    url: https://arxiv.org/abs/2607.21461
  related_work_outline:
  - 'Mainstream direction: building long-horizon autonomous research agents that externalize
    durable state or knowledge and reduce costly feedback, token, or function-call
    budgets while improving final task outcomes.'
  - 'Shared research pattern: separate persistent research state from transient agent
    context, then add targeted verification, held-out transfer checks, reusable experience/skills,
    or sparse high-fidelity feedback.'
  - 'Key differences: where durable state/knowledge lives, how much high-fidelity
    feedback is required, whether evaluation targets narrow scientific domains or
    broad ML/software/deep-research suites, and whether the agent is stateless, self-improving,
    or skill-retrieving.'
  - 'Trend evolution: within the 2024-2026 window, available evidence clusters in
    2026 and moves from single-loop agents toward stateful harnesses with stateless
    workers, external memory, surrogate feedback, and recursive audit loops.'
  - 'Open questions: transfer beyond limited benchmarks, standardized long-horizon
    evaluation, agreement between proxy metrics and real research utility, robustness
    of surrogate feedback, and safety/calibration of self-auditing loops.'
  related_work_outline_zh:
  - 主流方向：构建长时程自主研究智能体，通过外部化持久状态或知识，并降低高保真反馈、token 或函数调用成本来提升最终任务表现。
  - 研究共性：将持久研究状态与智能体瞬时上下文分离，再引入定向验证、留出迁移检查、可复用经验/技能或稀疏高保真反馈。
  - 关键差异：持久状态/知识存放位置、所需高保真反馈量、评测目标偏窄域还是广泛 ML/软件/深度研究套件，以及智能体是无状态、自改进还是技能检索。
  - 趋势演进：在 2024-2026 时间窗内，现有证据集中在 2026 年，正从单循环智能体走向有状态 harness 加无状态 worker、外部记忆、代理反馈与递归审计。
  - 开放问题：有限基准之外的迁移、标准化长时程评测、代理指标与真实研究效用的一致性、代理反馈稳健性，以及自审计循环的安全性与校准。
  literature_review:
    line_of_work_matrix:
    - line: Long-horizon state and context management
      what_it_solves: Scaling research agents beyond short loops by externalizing
        durable research state and reconstructing focused per-role contexts, reducing
        history replay and duplicated work.
      what_remains_open: Whether stateless-context design transfers across task families
        and whether short-horizon evaluation still misjudges long-horizon systems.
    - line: Closed-loop experimental search and high-fidelity feedback allocation
      what_it_solves: Choosing what to try next under costly or sparse evaluation,
        using surrogate-guided search, admission gates, and acquisition rules to reduce
        oracle or DFT queries.
      what_remains_open: How much gain comes from the search or repair policy versus
        the surrogate or task-specific gate, and how fixed surrogate errors propagate
        over long searches.
    - line: Reusable experience, skills, and operational knowledge
      what_it_solves: Distilling prior experimental trajectories or code repositories
        into compact verified skills or experience so agents can reuse operational
        know-how instead of rediscovering it.
      what_remains_open: Coverage and verification of the skill or experience library
        outside tested benchmark suites, and standardized external validation across
        hardware, datasets, and user settings.
    - line: Evaluation protocols and evidence design for research-agent claims
      what_it_solves: Making research-agent claims comparable through held-out transfer,
        token or oracle budgets, multiple benchmark suites, and decision-relevant
        metrics.
      what_remains_open: Limited domain coverage and unclear agreement between proxy
        metrics such as benchmark scores or token counts and real research decision
        utility.
    - line: Recursive self-improvement and verification architectures
      what_it_solves: Auditing provisional answers, identifying unresolved claims,
        and launching targeted follow-up loops, often with learned context compression
        to retain verified evidence.
      what_remains_open: How well the audit and improvement loop generalizes beyond
        trained task distributions and whether gains come from reinforcement learning,
        architecture, or task-specific supervision.
    consensus:
    - Long-horizon research agents benefit from separating durable state or knowledge
      from the model's transient context.
    - Resource cost is treated as a first-class evaluation signal, usually tokens,
      oracle queries, or high-fidelity function calls.
    - Held-out or unseen evaluation is used to test whether discovered changes generalize
      rather than overfitting development feedback.
    - Inner search or execution is often combined with an outer filtering, verification,
      or assignment loop.
    - Reusing external evidence, whether as skills, experience, or repository knowledge,
      can improve performance without retraining backbones.
    disagreements:
    - 'Where durable state or knowledge should live: in a harness, in compressed agent
      context, in external skill or experience libraries, or in a recursively updated
      agent state.'
    - 'How much high-fidelity feedback is needed during search: full per-episode feedback,
      sparse surrogate repair, targeted pilot experiments, or admission-gated holdout
      checks.'
    - 'What evaluation objective should dominate: long-horizon final result under
      a token budget, held-out modeling or optimization improvement, benchmark-suite
      accuracy, or decision regret relative to oracle queries.'
    - Whether to evaluate on narrow domain-specific tasks such as materials endpoints
      or molecular relaxation, or on broad ML, software, and deep-research suites.
    - Whether the agent itself should be stateless, self-improving, or skill-retrieving;
      these interaction modes imply different failure recovery and scalability trade-offs.
    open_questions:
    - Which evaluation horizon and resource metric best predict real-world autonomous
      research utility across domains?
    - How far do harness-owned state and external skill or experience libraries transfer
      beyond the tasks and benchmarks used in the reported evaluations?
    - Can surrogate-guided feedback remain robust when fixed surrogate errors accumulate
      over long closed-loop searches?
    - Does recursive self-improvement remain safe and calibrated as the agent audits
      its own provisional claims?
    - What standardized research-agent evaluation suite would make token, oracle,
      and held-out transfer claims comparable across these systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 长时程状态与上下文管理
      解决的问题: 通过外部化持久研究状态并重建聚焦的角色上下文，扩大研究智能体在长时程任务中的有效搜索范围，减少历史重放和重复工作。
      尚未覆盖: 无状态上下文设计能否跨任务族迁移，以及短时程评估是否仍会误判长时程系统。
    - 路线: 闭环实验搜索与高保真反馈分配
      解决的问题: 在评估成本较高或反馈稀疏时，通过代理引导搜索、准入门控和采集规则决定下一步实验，减少 oracle 或 DFT 查询。
      尚未覆盖: 性能提升多少来自搜索或修复策略而非代理模型或任务特定门控，以及固定代理误差在长搜索中如何被放大。
    - 路线: 可复用经验、技能与操作知识
      解决的问题: 从历史实验轨迹或代码仓库中提炼紧凑且经过验证的技能或经验，使智能体复用操作知识而非重新发现。
      尚未覆盖: 技能或经验库在测试基准之外的覆盖度与验证，以及跨硬件、数据集和用户设置的标准化外部验证。
    - 路线: 面向研究智能体主张的评测协议与证据设计
      解决的问题: 通过留出迁移、token 或 oracle 预算、多基准套件和决策相关指标，使研究智能体的主张可比较。
      尚未覆盖: 领域覆盖有限，以及基准分数、token 数等代理指标与真实研究决策效用之间的一致性不明。
    - 路线: 递归自改进与验证架构
      解决的问题: 审计临时答案、定位未解决声明并启动针对性后续循环，常配合学习到的上下文压缩以保留已验证证据。
      尚未覆盖: 审计与改进循环能否在训练任务分布外泛化，以及提升来自强化学习、架构还是任务特定监督仍需分离。
    共识:
    - 长时程研究智能体普遍受益于将持久状态或知识与模型瞬时上下文分离。
    - 资源成本被作为首要评估信号，常见为 token、oracle 查询或高保真函数调用。
    - 留出或未见数据用于测试发现的改动是否泛化，而不是只拟合开发期反馈。
    - 内部搜索或执行常与外部过滤、验证或任务分配循环组合。
    - 复用外部证据（技能、经验或仓库知识）可在不重训主干模型的情况下提升性能。
    分歧:
    - 持久状态或知识应放在哪里：harness 中、压缩智能体上下文中、外部技能或经验库中，还是递归更新的智能体状态中。
    - 搜索期间需要多少高保真反馈：每回合高保真反馈、稀疏代理修复、目标试点实验，或经过准入门控的留出检查。
    - 主要评测目标应是什么：预算下的长时程最终结果、留出建模或优化改进、多基准套件分数，还是相对 oracle 查询的决策遗憾。
    - 在狭窄领域任务（如材料端点或分子弛豫）还是广泛 ML、软件与深度研究套件上评测更合适。
    - 智能体应是无状态、自改进还是技能检索；不同交互模式带来不同的失败恢复与可扩展性权衡。
    开放问题:
    - 哪种评测视界和资源指标最能预测跨领域的真实自主研究效用？
    - harness 持有的状态与外部技能或经验库能在多大程度上迁移到报告任务和基准之外？
    - 当固定代理误差在长时程闭环搜索中累积时，代理引导反馈如何保持稳健？
    - 递归自改进在智能体审计自身临时声明时能否保持安全与校准？
    - 什么样的标准化研究智能体评测套件能让 token、oracle 和留出迁移结果跨系统可比较？
