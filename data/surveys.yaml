  related_work_outline:
  - 'Mainstream direction: Agentic multi-agent systems are being built to automate
    literature synthesis, survey drafting, and end-to-end scientific discovery, with
    iterative review, retrieval, verification, and rubric-guided refinement as core
    mechanisms.'
  - 'Shared research pattern: Workflow decomposition into specialized LLM roles such
    as search, curation, drafting, verification, and review plus iterative critique
    loops; recent systems also add self-evolution or structured search.'
  - 'Key differences: Targets range from survey generation (ARISE) and literature-integrated
    discovery (ReasFlow) to domain biology benchmarks (BAISBench) and scalable agent
    frameworks (EvoMaster); evaluation, domain, and interaction mode vary.'
  - 'Trend evolution: The 2025-2026 frontier moves from survey papers and benchmark
    construction toward autonomous research attempts, failure analysis, and self-evolving
    frameworks, increasingly exposing reliability gaps beyond scoring.'
  - 'Open questions: Citation provenance, rubric alignment with real scholarly utility,
    cross-domain generalization, long-horizon reliability, and external validation
    beyond LLM judges remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建多智能体系统以自动化文献综合、综述撰写和端到端科学发现，核心机制包括迭代评审、检索、验证和评分准则引导优化。
  - 研究共性：工作流被分解为搜索、策展、起草、验证、评审等专门大模型角色，并通过迭代批评循环改进；部分系统进一步加入自演化和结构化搜索。
  - 关键差异：目标从综述生成（ARISE）、融合文献综合的发现（ReasFlow），到生物学基准（BAISBench）和可扩展智能体框架（EvoMaster）；评测对象、领域和交互模式不同。
  - 趋势演进：2025-2026前沿从综述和基准构建走向自主研究尝试、失败分析和自演化框架，逐渐暴露评分之外的可复现性与可靠性缺口。
  - 开放问题：引文溯源、评分准则与真实学术效用的一致性、跨领域泛化、长程可靠性以及超越大模型评审的外部验证仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Rubric-guided survey generation
      what_it_solves: Automates scholarly survey drafting through specialized agents,
        citation curation, and iterative reviewer feedback scored on a structured
        rubric.
      what_remains_open: Validation relies heavily on rubric-aligned LLM scores with
        no external scholarly or citation-accuracy audit; generalization across fields
        and non-rubric quality is unclear.
    - line: Taxonomic survey synthesis of agentic scientific discovery
      what_it_solves: Catalogues agentic scientific systems by domain and capability,
        including literature review, hypothesis generation, experimentation, and analysis.
      what_remains_open: It identifies literature review automation, reliability,
        and ethics challenges but does not provide direct empirical validation or
        reproducibility artifacts.
    - line: End-to-end literature-integrated discovery
      what_it_solves: Combines literature synthesis, knowledge retrieval, internal
        verification, and paper generation in one multi-agent workflow aimed at theory-driven
        domains.
      what_remains_open: Evidence uses LLM-based review rubrics and generated papers;
        no human expert comparison or stated limitations are provided.
    - line: Domain-specific AI scientist benchmarking
      what_it_solves: Grounds evaluation in real single-cell transcriptomic datasets
        and human graduate-level baselines for cell annotation and literature-derived
        multiple-choice discovery.
      what_remains_open: Single-domain and task-specific; it does not yet cover literature
        search, citation analysis, survey synthesis, or research gap discovery broadly.
    - line: Autonomous research failure analysis
      what_it_solves: Maps LLM agent pipelines to scientific workflow stages and documents
        recurring failure modes in autonomous ML research attempts.
      what_remains_open: Evidence is a small case study with one accepted output;
        design principles are observational rather than systematically validated.
    - line: Self-evolving foundational agent infrastructure
      what_it_solves: Provides a domain-agnostic framework for continuous hypothesis
        refinement, self-critique, and knowledge accumulation across scientific benchmarks.
      what_remains_open: Benchmark gains are not decomposed from task-specific assumptions,
        and no targeted literature-intelligence evaluation is reported.
    - line: Structured search for research trajectories
      what_it_solves: Organizes research as a branching tree with backtracking and
        evolutionary-systematic ideation for inspectable automated algorithm discovery.
      what_remains_open: Evaluated on optimization and cooperative driving rather
        than literature search, survey synthesis, or citation analysis; scholarly
        relevance remains open.
    consensus:
    - Agentic workflows decompose scientific and scholarly tasks into specialized
      LLM roles.
    - Iterative critique, rubric-guided review, verification, or self-reflection is
      used to improve outputs.
    - Current systems are promising for supporting literature- and discovery-oriented
      work but remain short of fully autonomous, reliable research.
    - Evaluation relies on LLM-based review rubrics, expert-labeled benchmarks, or
      proxy benchmark suites, with limited external validation.
    - Literature synthesis and paper generation are treated as integrated parts of
      broader scientific discovery rather than isolated reading tools.
    disagreements:
    - 'Evaluation target: scholarly survey quality rubrics, expert-labeled biological
      discovery tasks, or general AI/science benchmark suites.'
    - 'Architecture: fixed multi-role pipelines, tree-structured search with backtracking,
      evolutionary self-evolution, or rubric-guided reviewer loops.'
    - 'Domain focus: applied mathematics, single-cell biology, ML research, or domain-agnostic
      science; not all systems address literature search and review directly.'
    - 'Interaction and supervision: human principal-investigator collaboration, autonomous
      end-to-end attempts, or human baseline comparison.'
    - 'Success framing: some report state-of-the-art benchmark gains, while others
      emphasize failure modes and limited successful completions.'
    open_questions:
    - How well do LLM rubric scores and benchmark metrics align with real scholarly
      value, citation correctness, and actionable research gap discovery?
    - What external validation can confirm that generated surveys and literature syntheses
      preserve provenance and avoid hallucinated references?
    - Do self-evolving or domain-agnostic frameworks transfer across scientific fields
      without task-specific priors inflating benchmark gains?
    - How can long-horizon autonomous research avoid memory degradation, implementation
      drift, and overexcitement documented in case studies?
    - What evidence gaps remain because several papers lack code, datasets, or stated
      limitations for independent replication?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 评分准则引导的综述生成
      解决的问题: 通过专门智能体、引文策展和结构化评分准则下的迭代评审，自动生成学术综述草稿。
      尚未覆盖: 验证主要依赖对齐评分准则的大模型评分，缺少引文准确性与跨领域的外部审查。
    - 路线: 智能体科学发现的综述分类
      解决的问题: 按领域和能力对智能体科学系统进行归类，覆盖文献综述、假设生成、实验和分析。
      尚未覆盖: 指出文献综述自动化、可靠性与伦理挑战，但未提供直接实证验证或可复现工件。
    - 路线: 融合文献综合的端到端发现
      解决的问题: 将文献综合、知识检索、内部验证和论文生成集成到一个多智能体工作流，面向理论驱动领域。
      尚未覆盖: 证据使用大模型评审和生成论文，缺乏人类专家对比或明确的局限性说明。
    - 路线: 领域专用AI科学家基准评测
      解决的问题: 在真实单细胞转录组数据和研究生水平人类基线上，评测细胞注释和基于文献的选择题式科学发现。
      尚未覆盖: 仅覆盖单域且任务特定，尚未广泛覆盖文献搜索、引文分析、综述综合或研究缺口发现。
    - 路线: 自主研究失败分析
      解决的问题: 将大模型智能体流水线映射到科学工作流阶段，记录自主机器学习研究中的重复失败模式。
      尚未覆盖: 证据来自小规模案例研究，仅一个输出被接收，设计原则是观察性的，尚缺系统验证。
    - 路线: 自演化基础智能体设施
      解决的问题: 提供领域无关框架，让智能体持续优化假设、自我批判并跨实验周期积累知识。
      尚未覆盖: 基准提升未从任务先验中分离；未见针对文献智能任务的直接评估。
    - 路线: 结构化研究轨迹搜索
      解决的问题: 以带回溯的分支树和进化-系统化构思组织研究，提升自动化算法发现的可追踪性。
      尚未覆盖: 评测集中在优化和驾驶场景，未评估文献搜索、综述综合或引文分析。
    共识:
    - 智能体工作流普遍将学术任务分解为搜索、起草、评审、验证等专门的大模型角色。
    - 通过迭代批评、评分准则引导、自反思或验证来改进生成结果已成为共同做法。
    - 当前系统对文献和发现工作具有支持潜力，但距离完全自主可靠的研究仍有差距。
    - 评测主要依赖大模型评审、专家标注基准或代理基准套件，外部验证有限。
    - 文献综合与论文生成被视作更广泛科学发现流程的一部分，而非孤立的阅读工具。
    分歧:
    - 评测目标不同：学术综述质量评分准则、专家标注的生物学发现任务，或通用AI/科学基准套件。
    - 架构不同：固定多角色流水线、带回溯的树搜索、进化自演化，或评分准则引导的评审循环。
    - 领域侧重不同：应用数学、单细胞生物学、机器学习研究或领域无关科学；并非所有系统都直接处理文献搜索与综述。
    - 监督交互不同：人类首席研究员协作、端到端自主尝试，或人类基线对比。
    - 成功表述不同：有的报告最先进基准提升，有的强调失败模式和有限的成功完成。
    开放问题:
    - 大模型评分与基准指标在多大程度上与真实学术价值、引文正确性、可操作的研究缺口发现一致？
    - 如何外部验证生成式综述和文献综合能保留来源、避免虚构参考文献？
    - 自演化或领域无关框架是否能在没有任务特定先验的情况下跨科学领域迁移，而不夸大基准收益？
    - 长程自主研究如何避免案例研究中记录的记忆退化、实现漂移和过度乐观？
    - 由于部分论文未提供代码、数据集或局限性说明，独立复现还存在哪些证据缺口？
