    研究路线矩阵:
    - 路线: 端到端自动研究智能体系统
      解决的问题: 把基于 LLM 的想法生成、代码实现、实验执行和论文写作组织为可运行的自动工作流，并提供某种接受或验证信号。
      尚未覆盖: 验证仍可能漏掉静默失败，同行评审接受结果不稳定，跨领域通用性尚不清晰。
    - 路线: 证据锚定的评测基准
      解决的问题: 通过盲测/保留任务、人类基线和自动裁判，使自动科学发现主张可比较，并评估证据成熟度。
      尚未覆盖: 代理指标和仅基于单一冻结基座模型的结果，未必能跨科学领域、评测器或部署设置泛化。
    - 路线: 可靠性门控与权限分离
      解决的问题: 使用确定性检查、程序级权限或领域特定有效性门控，约束智能体生成的假设、源码修改和结果晋升。
      尚未覆盖: 门控仍可能漏检植入失败，且仅少量案例缺少外部验证；提升可能无法区分门控质量与任务特定调优。
    - 路线: 自动评审与证据成熟度裁判
      解决的问题: 利用 LLM/VLM 评审和基于评分标准的证据打分，对论文或主张质量进行可扩展的事后评估。
      尚未覆盖: 自动评审与下游科学有效性的相关性尚未确立；被评能力可能平台化，而核心科学对照、稳健性等仍缺失。
    共识:
    - 自动研究智能体已能执行多步实验循环并记录结果，但相对于科学有效性，其评估仍不成熟。
    - 评估越来越多使用盲测任务、人类基线或自动裁判，而非只评估最终准确率。
    - 验证或控制机制被认为必要，因为智能体可能产生看似合理但无法辩护的主张。
    - 从胜任执行与分析记录到可信科学判断之间存在一致缺口，尤其体现在对照、稳健性、可证伪性和跨数据集泛化方面。
    分歧:
    - 评测目标不同：有的评估通用机器学习论文生成，有的评估流体力学、组学或预测等领域特定的发现能力。
    - 控制时机和机制不同：有的系统允许开放式生成并依赖事后评审或裁判，有的在晋升前使用确定性程序权威或领域特定视觉/物理门控。
    - 成功标准不同：同行评审接受、基准分数、人类基线对比和任务特定指标改进之间不能互相替换。
    - 可靠性证据不同：有的报告门控或权限控制带来的收益，有的基准则显示编码智能体得分平台化，两两间没有统计上可靠的差异，仍缺少判别性科学行为。
    开放问题:
    - 自动裁判和任务完成度指标能否预测下游可复现性和真实科学有效性？
    - 验证门控能否在植入失败之外、跨不同基座模型和不同领域捕获静默失败？
    - 为何编码智能体在证据成熟度上平台化，并普遍缺乏对照、稳健性、可证伪性和跨数据集泛化？
    - 还需要哪些证据，才能区分真正发现与仅能力胜任的执行和记录？
