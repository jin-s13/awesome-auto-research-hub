      analysis/visualization, and manuscript or claim writing, with automated reviewers
      or rubrics as feedback.
    - Verification is moving from textual plausibility toward domain-specific evidence
      such as logical consistency checks, physics-aware inspection of flow fields,
      or evidence-maturity scoring.
    - 'Current evidence separates competent execution and documentation from trustworthy
      scientific judgment: agents can produce organized artifacts but often lack controls,
      robustness, and falsifiability.'
    - Automated evaluation is a common workaround for costly human review, but validation
      is usually limited to a small set of domains, tasks, base models, or generated
      papers.
    disagreements:
