    - 主导研究闭环围绕想法生成、实验执行或推导、分析可视化和论文/主张撰写展开，自动化评审或评分作为反馈信号。
    - 验证正在从文本合理性转向领域特定证据，如逻辑一致性检查、流场物理感知检查或证据成熟度评分。
    - 现有证据将执行与文档能力同真实科学判断分开：智能体可以产出较有条理的工件，但常常缺乏对照、稳健性和可证伪性。
    - 自动评估常被用来降低人工评审成本，但验证范围通常局限于少数领域、任务、基座模型或生成论文。
    分歧:
