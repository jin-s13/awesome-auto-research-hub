      解决的问题: 在高杠杆决策点引入专家监督，比完全自主或逐步人工检查更稳健。
      尚未覆盖: 最优干预层级、所需领域专长和成本权衡尚未在实验阶段基准之外得到确立。
    - 路线: 失败归因与自我纠正
      解决的问题: 区分假设、实验设计或实现等失败原因，并将修正路由到正确阶段。
      尚未覆盖: 它能提升包含指标的输出和工件质量，但未能解决生成完全可投会议论文的整体难题。
    - 路线: 自动化研究系统的评测与基准
      解决的问题: 为生成论文和发现工作流提供任务、指标、评分标准和模拟评审。
      尚未覆盖: 代理指标和LLM评审是否与人类科学效用一致尚缺乏证明，多样领域覆盖仍有限。
