  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous paper generation pipelines
      what_it_solves: integrates the full scientific workflow from idea generation
        to manuscript writing in a single automated system, reducing manual effort
        and cost per paper (e.g., under $15 per paper).
      what_remains_open: inconsistent acceptance rates, heavy reliance on templates
        or code scaffolds, and limited ability to pass rigorous peer review beyond
        workshop-level venues.
    - line: Verification and quality control mechanisms
      what_it_solves: prevents hallucinated results, fabricated numbers, and physically
        invalid claims by inserting internal logical checks, visual inspection of
        outputs, or physics-aware gates before manuscript finalization.
      what_remains_open: coverage of silent failures; some planted errors still evade
        detection, and the verification methods are often domain-specific and not
        easily transferable.
    - line: Human-AI collaboration and intervention strategies
      what_it_solves: defines when and how human experts should intervene in the autonomous
        writing process to improve outcomes, balancing full autonomy with targeted
        oversight.
      what_remains_open: the optimal intervention granularity and timing; evidence
        that strategic human collaboration outperforms both full autonomy and exhaustive
        step-by-step supervision is limited to a few benchmarks.
    - line: Failure analysis and self-improvement via memory
      what_it_solves: structures past failures (e.g., implementation drift, overexcitement)
        into a reusable knowledge base or causal attribution framework, enabling agents
        to self-correct and avoid repeating mistakes.
      what_remains_open: generalization across different scientific domains and long-term
        retention of negative knowledge; current systems show gains on specific tasks
        but may not scale to novel research questions.
    - line: Evaluation benchmarks and automated reviewing
      what_it_solves: provides standardized metrics and simulated reviewer agents
        to assess the quality of AI-generated papers, replacing human judgment in
        early-stage development.
      what_remains_open: alignment between automated reviewer scores and human expert
        evaluations; benchmark tasks may not capture originality, and real-world conference
        acceptance remains rare.
    consensus:
    - Large language models are the core engine for generating research content and
      composing manuscripts.
    - Verification steps are necessary because purely autonomous pipelines often produce
      plausible but incorrect or unverifiable claims.
    - No single system achieves consistently high success; all report some fraction
      of failed attempts or incomplete manuscripts.
    - Automated evaluation, whether via simulated reviewers or benchmark scores, is
      currently the primary way to measure progress, although its correlation with
      human judgment is unproven.
    - The community recognizes that full scientific writing autonomy is not yet solved;
      even the best systems require human oversight or specific domain constraints.
    disagreements:
    - 'Design philosophy: some systems maximize autonomy and minimize human input,
      while others explicitly incorporate human checkpoints and argue that targeted
      collaboration yields better results.'
    - 'Verification strategy: logic-based consistency checks, vision-language inspection
      of rendered figures, and physics-based validation gates represent fundamentally
      different quality assurance approaches.'
    - 'Error recovery: simple reflection loops, multi-hypothesis causal attribution,
      and shared negative knowledge banks differ in complexity and the type of past
      failures they can reuse.'
    - 'Domain specificity: systems like AI CFD Scientist are tightly coupled to a
      physical simulation engine, whereas others target general machine learning,
      making it unclear whether advances transfer across fields.'
    - 'Evaluation setting: real workshop submission under blind review, curated LLM
      review rubrics, and benchmark-based scoring are used interchangeably, preventing
      direct comparison of results.'
    open_questions:
    - Can automated writing systems ever reliably produce novel, high-impact papers,
      or are they limited to recombining existing knowledge?
    - What is the failure rate of verification gates in diverse scientific domains,
      and how can we build a universal validity checker?
    - How do we measure the long-term scientific value of AI-generated papers once
      they are published?
    - What is the minimal human intervention budget needed to lift autonomous research
      output to top-tier conference quality?
    - Do negative knowledge bases and self-correction mechanisms plateau as the number
      of recorded failures grows, or can they continuously improve?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端全自动论文生成流水线
      解决的问题: 将想法生成、实验执行和论文撰写整合为单一自动化系统，大幅降低每篇论文的人工和成本投入（例如每篇低于15美元）。
      尚未覆盖: 接受率不稳定，对代码模板或脚手架依赖较重，超越工作坊级别的严格同行评审能力有限。
    - 路线: 验证与质量控制机制
      解决的问题: 通过在论文最终定稿前插入内部逻辑检查、输出可视化检查或物理感知门控，防止幻觉结果、伪造数字和物理上无效的断言。
      尚未覆盖: 静默失败的覆盖面不足；部分植入的错误仍被遗漏，且验证方法往往领域特定，难以迁移。
    - 路线: 人机协作与干预策略
      解决的问题: 定义人类专家何时以及如何介入自主写作过程，以在完全自主和精准监督之间取得平衡，提升最终成果。
      尚未覆盖: 最优干预粒度和时机；战略性人类协作优于完全自主和详尽逐步监督的证据仅来自少数基准测试。
    - 路线: 基于记忆的失败分析与自我改进
      解决的问题: 将过去的失败（如实现漂移、过度兴奋）结构化为可复用的知识库或因果归因框架，使代理能够自我纠正并避免重复错误。
      尚未覆盖: 跨不同科学领域的泛化能力和负知识的长期保留；当前系统在特定任务上表现出改进，但未必能应对全新研究问题。
    - 路线: 评估基准与自动评审
      解决的问题: 提供标准化指标和模拟审稿人代理，用于评估AI生成论文的质量，在早期开发阶段替代人类判断。
      尚未覆盖: 自动评审分数与人类专家评估的一致性；基准任务可能无法捕捉原创性，现实会议接收仍属罕见。
    共识:
    - 大型语言模型是生成研究内容和撰写论文的核心引擎。
    - 验证步骤必不可少，因为纯自主流水线经常产生看似合理但错误或无法验证的断言。
    - 没有单一系统能实现持续高成功率；所有工作都报告了一定比例的失败尝试或未完成稿件。
    - 无论是通过模拟评审还是基准分数，自动评估是目前衡量进展的主要方式，但其与人类判断的相关性尚未证实。
    - 社区认识到完全自主的科学写作尚未解决；即使最好的系统也需要人类监督或特定领域约束。
    分歧:
    - 设计哲学：一些系统追求最大化自主性并最小化人类输入，而另一些系统明确引入人类检查点，并主张精准协作能带来更好结果。
    - 验证策略：基于逻辑的一致性检查、对渲染图形的视觉-语言检查以及基于物理的验证门控，代表了本质不同的质量保障方法。
    - 错误恢复：简单的反思循环、多假设因果归因和共享负知识库在复杂度及能复用的失败类型上存在差异。
    - 领域特异性：AI CFD科学家等系统与物理模拟引擎紧密耦合，而其他系统面向通用机器学习，导致进展能否跨领域迁移尚不明确。
    - 评估设置：盲审下的真实工作坊投稿、经过策划的LLM评审标准以及基于基准的评分被混用，阻碍了结果之间的直接比较。
    开放问题:
    - 自动写作系统能否可靠地产生具有高影响力的原创论文，还是仅限于重组现有知识？
    - 在不同科学领域中验证门控的失败率如何，以及如何构建通用的有效性检查器？
    - AI生成论文发表后，如何衡量其长期科学价值？
    - 将自主研究产出提升至顶级会议质量所需的最少人类干预预算是多少？
    - 随记录失败数量增长，负知识库和自我纠正机制是否会趋于平台期，还是能持续改进？
