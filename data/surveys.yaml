  literature_review:
    line_of_work_matrix:
    - line: End-to-end idea-to-manuscript research pipelines
      what_it_solves: Automates research ideation, code or experiment execution, result
        visualization, and manuscript writing to reduce human effort and cost per
        scientific output.
      what_remains_open: 'Reliability is still narrow: workshop-level acceptance was
        inconsistent, and full conference- or journal-level validity remains unproven.'
    - line: Domain-grounded verification and validity gating
      what_it_solves: Detects silent failures, logical errors, or physically invalid
        results before they are accepted, making generated claims or domain corrections
        more defensible.
      what_remains_open: Gates still miss failures, and the demonstrated improvements
        are limited to specific domain cases; cross-case or cross-domain generalization
        is unknown.
    - line: Discovery-capability benchmarks and virtual environments
      what_it_solves: Provides reproducible tasks, blinded data, and automatic metrics
        for comparing agents across complete scientific discovery cycles.
      what_remains_open: Coding agents plateau at low-to-moderate evidence-maturity
        scores without reliable pairwise differences; current performance evidence
        depends on a single frozen base model.
    - line: Automated review and evidence-maturity assessment
      what_it_solves: Scales evaluation of generated papers or empirical claims through
        automated reviewers and rubric-based scores.
      what_remains_open: Proxy scores have not been shown to align with human scientific
        judgment, real discovery utility, or consistent external validation.
    consensus:
    - The reviewed systems aim to automate multiple stages of the research loop, from
      hypothesis or idea generation through experiment execution and analysis to manuscript
      or report generation.
    - LLM-based agents can produce plausible research artifacts at low cost, but current
      evidence shows they do not yet consistently produce trustworthy or peer-ready
      claims.
    - Verification or review gates are treated as necessary components, appearing
      as internal LLM review, physics-aware visual checks, or evidence-maturity rubrics.
    - Evaluations rely on proxy signals such as automated reviewer scores, task completion,
      physical metric improvement, or rubric-based evidence maturity; real-world scientific
      validation remains sparse.
    disagreements:
    - 'Target setting differs: generic machine-learning research pipelines, simulated
      discovery tasks, applied mathematics, and computational fluid dynamics imply
      different execution tools and failure modes.'
    - 'Verification signal differs: some systems use LLM-based review or rubric judges,
      others use domain-specific visual and physics gates, while some depend on blind
      evidence-based scoring.'
    - 'Evaluation criterion differs: workshop paper acceptance, physical metric improvement,
      task completion, and evidence maturity are not interchangeable outcomes.'
    - 'Interaction and deployment differ: fully autonomous submission pipelines, human
      PI-agent collaboration, and coding agents acting on frozen data represent different
      divisions of labor.'
    open_questions:
