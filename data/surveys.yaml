  literature_review:
    line_of_work_matrix:
    - line: Held-out transfer and closed-loop discovery evaluation
      what_it_solves: Tests whether agent-selected modeling, feature, representation,
        or training-data changes survive unseen evaluation data and whether high-fidelity
        queries can be allocated more sparingly.
      what_remains_open: Whether gains persist beyond the tested Matbench endpoints
        or synthetic settings, and how oracle-query cost, robustness, and selected-intervention
        reliability scale.
    - line: Operational experience and skill reuse
      what_it_solves: Converts past experimental trajectories or GitHub repositories
        into reusable skills and experience so research agents can make better decisions
        without repeating costly experiments.
      what_remains_open: Limited evidence on cross-domain transfer and explicit failure
        modes; artifact coverage, metric comparability, and limitation details are
        not fully documented in the available text.
    - line: Long-horizon state management and recursive planning
      what_it_solves: Prevents context explosion, duplicated work, and stalled search
        by owning durable research state outside agent messages and by incrementally
        expanding or compressing task plans.
      what_remains_open: Stated limitations are sparse for several proposed architectures,
        and generalization beyond selected open-source backbones or benchmark families
        remains under-verified.
    - line: Reinforcement learning and credit assignment for deep research
      what_it_solves: Uses process-level or topology-based rewards to improve evidence
        gathering, plan expansion, answer auditing, and long-horizon research behavior
        instead of relying only on final answers.
      what_remains_open: Training data quality and stability beyond reported benchmarks
        are unclear; the isolated contribution of RL versus the agent architecture
        or backbone is not fully established.
    - line: Predictive-credit and explanation-benchmark evaluation
      what_it_solves: Measures whether scientific explanations or contextual records
        add decision value over descriptions or matched donor context, using prospective
        forecasts and preregistered checks.
      what_remains_open: Credit for natural explanations remains inconclusive at tested
        resolutions; proxy metrics and donor granularity may not align with real experimental
        utility.
    consensus:
    - Autonomous research agent claims are increasingly tested through held-out tasks
      or multi-suite benchmarks rather than demonstrations alone.
    - Efficient closed-loop search depends on when high-fidelity feedback is requested;
      improving global surrogate fit does not necessarily reduce decision-relevant
      regret.
    - Separating durable research state from conversational context and reusing verified
      knowledge or skills improves long-horizon research efficiency.
    - Evaluated systems generally improve over same-backbone or same-budget baselines,
      but gains are highly specific to the chosen benchmark family and metric.
    - 'Reproducibility evidence is incomplete across the packet: many records lack
      OpenAlex identifiers, and code, dataset, or limitation signals are often absent,
      creating verification gaps rather than proof of absence.'
    disagreements:
    - 'Evaluation domain differs: materials discovery uses Matbench endpoints, ML
      engineering uses suites such as MLE-bench, PaperBench, FrontierCS, and PassNet,
      while deep research uses BrowseComp-Plus, GAIA, and xbench-DeepSearch.'
    - 'Knowledge source differs: some approaches distill repository know-how into
      skills, others accumulate experimental trajectories into experience libraries,
      and others maintain compressed evidence states inside agent loops.'
    - 'Supervision differs: some agents are trained with reinforcement learning for
      planning or auditing, while other systems appear orchestrated or skill-equipped
      without explicit RL training evidence.'
    - 'Agent organization differs: designs include recursive self-improvement loops,
      DAG-based orchestration, stateless role workers, and closed-loop discovery with
      surrogate or held-out feedback.'
    - 'Primary evaluation target differs: predictive credit of explanations, benchmark
      Pass@1 or accuracy, held-out property error, or oracle query cost are emphasized
