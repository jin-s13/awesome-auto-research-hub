      or rubric evaluations?
    - Which verification mechanisms can catch the silent failures that current gates
      miss, such as 2 of 16 planted failures in one study?
    - Can these systems produce full conference or journal papers with reproducible
      code, data, baselines, and limitations, not just workshop-level acceptance?
    - What is the minimally sufficient human intervention pattern across disciplines
      and long-horizon research?
    - How can domain-specific knowledge be incorporated without losing transfer across
      new research areas?
