    - 路线: 自动发现工作流（例如 The AI Scientist、AI CFD Scientist、EvoCast）
      解决的问题: 将大语言模型驱动的假设生成转化为端到端研究循环，包括写代码、运行实验、记录发现，并可修改架构或物理模型。
      尚未覆盖: 在受评案例之外，输出是否科学可信仍未知；生成的主张仍普遍缺少对照、稳健性和有效性质控。
    - 路线: 发现评测环境（例如 DISCOVERYWORLD、BAISBench）
      解决的问题: 通过受控任务和人工或自动指标，在完整发现循环上比较智能体，包括真实数据任务。
      尚未覆盖: 任务完成度和评分项得分能否迁移为真实科学有效性，以及跨领域、跨隐藏研究类型的覆盖仍不清楚。
    - 路线: 证据成熟度评分工具（例如 TruthInsightBench）
      解决的问题: 评估智能体主张是否具备对照、稳健性、可证伪性和跨数据集泛化，而不仅仅是复现目标研究。
      尚未覆盖: 跨基座模型泛化、领域特定证据规范，以及固定 LLM 裁判的有效性尚未得到验证。
    - 路线: 可靠性门控与权威分离（例如 AI CFD Scientist、EvoCast）
      解决的问题: 通过确定性的或物理感知的验证，捕获无效或静默错误输出，并约束智能体的修改范围。
      尚未覆盖: 仍存在漏检的静默失败；为一个领域构建的门控能否迁移到更广泛的科学工作流尚未证明。
    - 路线: 开放可复现的智能体基础设施
      解决的问题: 通过开放代码和工件使智能体工作流可运行、可复用，支持外部重新执行和检查。
      尚未覆盖: 跨硬件、数据集和用户设置的标准化外部验证；仅有代码或工件并不能证明结果正确。
    共识:
    - 智能体能够执行和记录分析，但现有证据显示它们尚未达到可靠的完全自主科学发现。
    - 有效的评测不能只看任务成功，还需要包含对照、稳健性、可证伪性和泛化等证据质量维度。
    - 物理检查、权威分离或确定性评分等可靠性控制，被认为对捕获执行指标遗漏的无效输出是必要的。
    - 开放代码和工件信号较常见，但外部验证以及这些论文的引用或图谱证据仍有限或不可用。
    分歧:
    - 评测目标不同：开放式虚拟发现、领域特定真实数据分析和任务特定架构演化，使得科学能力主张难以直接比较。
    - 可靠性机制不同：视觉物理验证、确定性程序权威、自动同行评审和盲式证据成熟度判断依赖不同的失败假设。
    - 成功指标不同：物理误差降低、同行评审接受、任务完成加解释性知识、证据成熟度评分不可互换，并可能奖励不同的智能体行为。
    - 人类比较基线不同：一些评测使用人类评审或研究生，另一些依赖自动裁判或领域特定物理参照，这会影响解释性。
    开放问题:
    - 如何让证据成熟度评分在更多领域和基座模型上与人类科学判断对齐？
    - 能否让自主智能体稳定地产出对照、稳健性检查、可证伪证据和跨数据集泛化？
    - 如何结合领域特定验证门控和通用证据裁判，以减少静默失败漏检？
    - 当智能体分数接近且差异不显著时，如何建立可靠的成对比较？
