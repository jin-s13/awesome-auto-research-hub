  related_work_outline_zh:
  - 主流方向：构建并评测基于 LLM 的自主科研智能体及其可靠性基础设施，重点从端到端论文生成转向证据质量、有效性门控和可扩展评测。
  - 研究共性：智能体执行实验或完整发现流程，随后通过基准、自动评审、证据成熟度评分、物理检查或专家偏好来判断科研声明。
  - 关键差异：评测目标包括论文接受、任务完成、盲证据声明和领域有效性；任务设置涵盖虚拟任务、同行研究衍生任务、真实组学数据和 CFD 仿真；交互模式涵盖全自动、多智能体和人类监控。
  - 趋势演进：可见顶会证据集中在 2024-2026，从通用端到端发现框架和虚拟任务，走向工作坊级同行评审、领域基准、证据锚定盲评和物理感知验证。
  - 开放问题：自动评委是否追踪真实科学价值、学习到的验证门控能否泛化到分布外失败、以及基准指标与决策效用是否一致仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agent frameworks
      what_it_solves: Integrates idea generation, code writing, experiment execution,
        visualization, and paper authoring into a runnable discovery pipeline.
      what_remains_open: Inconsistent success and weak controls, robustness, and falsifiability;
        acceptance in one workshop or reviewer setting does not establish dependable
        conference-level scientific quality.
    - line: Evaluation environments and evidence-grounded benchmarks
      what_it_solves: Creates controlled tasks, blind data, automatic metrics, and
        LLM judges so agent claims can be compared without reproducing hidden target
        studies.
      what_remains_open: Whether task completion or evidence-maturity scores predict
        real discovery utility is not established; cross-model and cross-domain generalization
        evidence is limited.
    - line: Domain-specific validity and human baseline calibration
      what_it_solves: Detects silent experimental failures through physics-aware vision-language
        checks or anchors difficulty against human expert performance in real biological
        data.
      what_remains_open: A physics verification gate still missed some planted failures,
        and human baselines are small or tied to narrow question formats rather than
        full open-ended discovery.
    - line: Multi-agent interactive research platforms
      what_it_solves: Supports customizable roles, real-time monitoring, rollback/resume
        control, and iterative reviewer feedback to keep autonomous research inspectable
        and steerable.
      what_remains_open: Evidence comes mainly from internal case studies or workshop-level
        submission, so external validity, standardization, and mature deployment are
        not yet demonstrated.
    consensus:
    - Autonomous research agents can produce plausible analyses, code, and manuscripts,
      but competent execution does not yet equal trustworthy scientific judgment.
    - Automated evaluation is necessary because manual review cannot scale to many
      open-ended discovery runs.
    - Evidence auditability, task completion, and metric improvements are easier to
      assess than controls, robustness, falsifiability, and cross-dataset generalization.
    - Current systems perform better as research-support tools than as fully autonomous
      discoverers of reliable new knowledge.
    disagreements:
    - 'They differ in evaluation target: full manuscript acceptance, task completion
      in a virtual world, blind evidence maturity, physical validity, or expert preference.'
    - 'They differ in interaction and supervision: fully autonomous pipelines, human-monitored
      multi-agent dashboards, and domain-aware verification gates.'
    - 'They differ in task provenance and data realism: synthetic virtual tasks, peer-reviewed-study-derived
      blind tasks, real single-cell transcriptomic data, and CFD simulation cases.'
    - 'They differ in judgment mechanism: fixed LLM judge scoring rubrics, simulated
      AI reviewers, vision-language physics checks, task-specific completion metrics,
      or human expert baselines.'
    open_questions:
    - Do LLM-based judges and simulated reviewers measure evidence quality or mostly
      surface style, formatting, and superficial completeness?
    - Can physics-aware or domain-specific verification gates detect silent failures
      outside the specific distributions and planted failures used for ablation?
    - How should discovery be evaluated when there is no hidden target answer, rather
      than by reproducing or inferring conclusions from prior peer-reviewed studies?
    - Are current benchmark rankings stable across different frozen base models, domains,
      and research workflows?
