  related_work_outline:
  - 'Mainstream direction: Autonomous, LLM-based scientific discovery loops that integrate
    hypothesis generation, data analysis, literature search, and experimental validation
    within multi-agent frameworks.'
  - 'Shared research pattern: Systems decompose discovery into iterative cycles of
    hypothesis proposal, execution, and result analysis, often using structured workflows,
    debate, or evolutionary search to refine ideas.'
  - 'Key differences: Hypothesis generation mechanisms range from multi-agent debate
    and tree search to evolutionary optimization; human involvement varies from fully
    autonomous pipelines to strategic human-in-the-loop collaboration; evaluation
    targets include biology, chemistry, materials science, and combinatorial optimization.'
  - 'Trend evolution: The field is shifting from single-agent scripted pipelines (2023–2025)
    toward multi-agent, self-healing, and human-collaborative architectures (2025–2026),
    with benchmarks growing more realistic and difficult.'
  - 'Open questions: Verifiable accuracy of generated hypotheses, reproducibility
    across runs, optimal timing and mode of human intervention, and standardized evaluation
    that correlates with real-world scientific impact remain unresolved.'
  related_work_outline_zh:
  - 主流方向：基于LLM的自主科学发现闭环，在多智能体框架内整合假设生成、数据分析、文献检索和实验验证。
  - 研究共性：系统将发现过程分解为假设提出、执行和结果分析的迭代循环，通常采用结构化工作流、辩论或进化搜索来优化想法。
  - 关键差异：假设生成机制涵盖多智能体辩论、树搜索和进化优化；人类参与程度从完全自主到战略性人机协作；评测目标涉及生物学、化学、材料科学和组合优化等不同领域。
  - 趋势演进：该领域正从单智能体脚本化流水线（2023–2025）转向多智能体、自愈和人类协作架构（2025–2026），基准任务日趋真实且难度提升。
  - 开放问题：生成假设的可验证准确性、跨运行可复现性、人类介入的最佳时机与模式，以及能与真实科学影响对齐的标准化评估仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Multi-agent hypothesis generation workflows
      what_it_solves: Automating the full scientific discovery cycle by distributing
        tasks—hypothesis formation, data analysis, literature search, and experimental
        design—across specialized agents that iteratively refine candidate hypotheses
        with feedback.
      what_remains_open: Ensuring long-horizon hypothesis quality without error propagation,
        preventing hallucinated claims, and verifying that the final output meets
        scientific rigor beyond surface-level accuracy metrics.
    - line: Structured search and evolutionary hypothesis generation
      what_it_solves: Exploring large hypothesis spaces efficiently by combining tree-based
        backtracking, evolutionary pressure, and code-level optimization so that the
        system can discover equations, algorithms, or novel mechanisms without exhaustive
        enumeration.
      what_remains_open: Balancing exploration breadth with novelty, defining reliable
        novelty scores, and demonstrating that the proposed hypotheses generalize
        beyond the training distribution of the search algorithm.
    - line: Human-in-the-loop hypothesis co-creation
      what_it_solves: Mitigating the brittleness of fully autonomous systems by allowing
        human researchers to intervene at high-leverage decision points, preserving
        scientific intuition while reducing exhaustive oversight.
      what_remains_open: Optimal placement of human intervention, measuring the cognitive
        load on the researcher, and determining whether the collaboration scales to
        multiple domains without retraining the interaction policy.
    - line: Benchmarking and evaluation frameworks for hypothesis generation
      what_it_solves: Providing standardized tasks and metrics (e.g., ARC-Bench, LABBench2)
        to compare hypothesis quality, execution correctness, and end-to-end discovery
        performance across AI scientist systems.
      what_remains_open: Alignment between proxy metrics and real-world publication-
        or patent-level impact, coverage of diverse scientific disciplines, and the
        construction of negative controls that robustly reject weak hypotheses.
    - line: Conceptual taxonomies and theoretical organization
      what_it_solves: Mapping the emerging landscape of autonomous research through
        workflow conditions (e.g., literature grounding, hypothesis formation, verification)
        and evaluation dimensions (novelty, validity, impact, reliability, provenance)
        to guide system design.
      what_remains_open: Empirical validation that these taxonomies predict model
        behavior or failure modes, and translation of theoretical categories into
        actionable design constraints for next-generation discovery agents.
    consensus:
    - All systems treat large language models as the core reasoning engine for hypothesis
      generation and refinement.
    - 'Discovery is structured as an iterative closed loop: hypothesize, execute,
      analyze, and update, mirroring the scientific method.'
    - Multi-agent or modular decomposition is preferred over monolithic architectures
      to handle the complexity of research tasks.
    - Reproducibility, evidence traceability, and the risk of fabricated claims are
      recognized as central challenges.
    - Evaluation is moving toward realistic, multi-step benchmarks that test integrated
      capabilities rather than isolated component accuracy.
    disagreements:
    - 'Hypothesis generation mechanisms differ: some employ structured multi-agent
      debate, others use evolutionary search with backtracking, and a few rely on
      programmatic optimization with reinforcement learning.'
    - Human involvement ranges from fully autonomous operation to seven distinct intervention
      modes; there is no agreement on the optimal level or timing of human input.
    - 'Evaluation targets are domain-specific: biology, chemistry, materials science,
      combinatorial optimization, and equation discovery, each with incompatible success
      criteria.'
    - 'Architectural granularity varies: some systems share a structured world model
      across agents, while others keep agents independent with minimal shared state.'
    - Assessment of scientific validity is split between automated metrics and human
      expert judgment, with no consensus on how to weight accuracy, novelty, and reproducibility.
    open_questions:
    - Can generated hypotheses maintain 100% factual accuracy over long autonomy spans,
      or will error compounding always require human correction?
    - How should we design a unified evaluation protocol that spans biology, chemistry,
      and algorithm discovery while capturing real-world scientific utility?
    - What is the minimal set of human interventions needed to guarantee reliability
      without sacrificing the speed of autonomous discovery?
    - Do current taxonomies of autonomous research workflows have predictive power
      over system failure modes, and can they guide the design of safer, more robust
      agents?
