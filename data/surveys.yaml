    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automates ideation, implementation, experimentation, analysis,
        and manuscript writing across general machine learning or specific domains.
      what_remains_open: Acceptance is inconsistent, such as only one of three submitted
