  related_work_outline:
  - 'Mainstream direction: LLM-based multi-agent autonomous research systems that
    turn data and literature into hypotheses, then refine them through code execution,
    experiments, or structured feedback loops.'
  - 'Shared research pattern: Most systems embed hypothesis generation in an iterative
