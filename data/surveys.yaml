    whether results generalize across base models, domains, and deployment settings.'
  related_work_outline_zh:
  - 主流方向：端到端自动科研智能体与评测基础设施并行发展，重点从生成研究想法转向验证证据成熟度、任务完成度、同行评审或领域物理有效性。
  - 研究共性：普遍采用假设/想法、代码、实验、分析、撰写的循环，并引入外部判断；近期工作加入验证门控、监控或盲测任务以约束静默失败。
  - 关键差异：评测对象从模拟发现环境、领域盲任务到真实同行评审各不相同；交互从全自动到人工在环；验证从物理视觉门控到LLM证据评分各有侧重。
  - 趋势演进：2024年通用自动化科研框架先行，2025-2026年转向领域特定、开源可复现、带验证门控的系统，以及强调统计区分的证据锚定盲评。
  - 开放问题：自动化评审分数是否预测可复现科学价值；验证门控是否在领域外仍可靠；结论是否跨基座模型、领域与部署设置泛化。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agent workflows
      what_it_solves: Turns research goals into runnable cycles of hypothesis/idea
        generation, code, experiments, analysis, visualization, and manuscript writing
        with little or no human coding.
      what_remains_open: 'Demonstrated success is uneven: one workshop paper among
        three passed review, and general AI-scientist baselines could not produce
        defensible claims in a domain-specific CFD setting.'
    - line: Evaluation environments and evidence-maturity assessment
      what_it_solves: Makes discovery-agent claims comparable through blind tasks,
        task completion metrics, human baselines, multiple-choice discovery questions,
        and LLM-judged evidence maturity.
      what_remains_open: Existing results are limited to one frozen base model or
        selected domains; current agents plateau and lack controls, robustness, falsifiability,
        and cross-dataset generalization.
    - line: Domain-specific verification-gated research infrastructure
      what_it_solves: Couples autonomous research agents to executable domain tools
        such as OpenFOAM and physics-aware vision-language checks to detect silent
        failures before accepting results.
      what_remains_open: A planted-failure ablation missed 2 of 16 failures, so gate
        completeness and external validity remain unresolved.
    - line: Interactive multi-agent research orchestration
      what_it_solves: Provides human oversight, customizable roles, real-time monitoring,
        artifact inspection, rollback/resume, and code harness integration for automated
        experiments.
      what_remains_open: Evaluation is limited to five internal AI research case studies
        and judged by AI experts, leaving external generalization and maturity uncertain.
    consensus:
    - Agents can execute and document multi-step experiments and analyses competently,
      but current evidence shows they do not yet reliably produce fully autonomous,
      trustworthy discoveries.
    - Evaluation infrastructure increasingly emphasizes blind tasks, evidence maturity,
      validity gates, or peer review rather than only reporting a single aggregate
      success metric.
    - Several systems expose open-source code, benchmarks, or artifacts, but limitation
      reporting and external baselines are uneven.
    disagreements:
    - 'Evaluation target differs: simulated text environments for task completion,
      blind peer-reviewed study-derived data tasks, domain-specific CFD physical error,
      and peer-review acceptance are used as success criteria.'
    - 'Interaction mode differs: fully autonomous end-to-end pipelines contrast with
      interactive platforms offering human oversight, monitoring, rollback/resume,
      and customizable roles.'
    - 'Supervision signal differs: one line uses physics-aware vision-language verification
      against planted failures; another uses fixed LLM judges scoring evidence maturity;
      another uses task completion and explanatory knowledge metrics.'
    - 'Deployment setting differs: general machine-learning domains, single-cell transcriptomics,
      and computational fluid dynamics impose different tooling, data, and failure-mode
      requirements.'
    open_questions:
    - Do automated LLM-judge scores, workshop acceptance, or task completion metrics
      predict reproducibility, safety, and long-term scientific value?
    - How do verification gates and agent rankings generalize beyond the reported
      domains, internal case studies, and single frozen base model?
    - What minimum controls, robustness checks, falsifiability, and cross-dataset
      evidence are needed for an agent-generated claim to count as discovery?
    - Can evaluation benchmarks distinguish constrained reproduction or annotation
      support from open-ended discovery, and where does that boundary lie?
    - How should missing citation/graph evidence and uneven limitation reporting be
      treated when aggregating confidence in this research area?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现智能体工作流
      解决的问题: 将研究目标转化为假设/想法生成、代码、实验、分析、可视化和论文撰写的可运行循环，减少人工编码。
      尚未覆盖: 成功案例不稳定：三篇中仅一篇通过同行评审；在领域专用CFD设置中，通用AI科学家基线因缺少有效性门控无法产生可辩护结论。
    - 路线: 评测环境与证据成熟度评估
      解决的问题: 通过盲任务、任务完成指标、人类基线、选择题式发现问题和基于LLM的证据成熟度评分，使发现智能体的声明可比较。
      尚未覆盖: 现有结果仅基于一个冻结基座模型或部分领域；当前智能体表现停滞，缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 路线: 带验证门控的领域专用研究基础设施
      解决的问题: 将自主科研智能体接入可执行领域工具，如OpenFOAM，并用物理感知视觉-语言检查在接收结果前识别静默失败。
      尚未覆盖: 植入失败消融中漏掉16个失败中的2个，门控完备性和外部有效性仍未解决。
    - 路线: 交互式多智能体研究编排
      解决的问题: 提供人工监督、可定制角色、实时监控、工件检查、回滚/恢复，以及连接代码和实验的基础设施。
      尚未覆盖: 评估仅限五个内部AI研究案例，且由AI专家评审，外部泛化性和成熟度仍不确定。
    共识:
    - 智能体能够相对熟练地执行并记录多步实验和分析，但当前证据显示它们尚不能稳定地产生完全自主、可信的科学发现。
    - 评测基础设施越来越强调盲任务、证据成熟度、有效性门控或同行评审，而不是只报告单一汇总成功指标。
    - 部分工作公开代码、基准或工件，但局限说明和外部基线并不均衡。
    分歧:
    - 评测目标不同：模拟文本环境中的任务完成、源自同行评审研究的盲数据任务、领域专用CFD物理误差，以及真实同行评审接受度都被用作成功标准。
    - 交互模式不同：全自动端到端流程与提供人工监督、监控、回滚/恢复和可定制角色的交互式平台形成对比。
    - 监督信号不同：有的用物理感知视觉-语言验证检查植入失败，有的用固定LLM评判证据成熟度，有的用任务完成度和可解释知识指标。
    - 部署场景不同：通用机器学习领域、单细胞转录组学和计算流体动力学对工具、数据和失效模式的要求各不相同。
    开放问题:
    - 自动化LLM评审分数、工作坊接受度或任务完成指标能否预测可复现性、安全性与长期科学价值？
    - 验证门控和智能体排名在超出报告领域、内部案例和单一冻结基座模型后是否仍然成立？
    - 智能体生成的主张需要哪些最低限度的对照、稳健性、可证伪性和跨数据集证据，才能被认为是发现？
    - 现有基准能否区分受限复现或注释支持与开放式发现？
    - 在缺少引用/图谱证据且局限披露不均的情况下，应如何综合判断该领域的置信度？
