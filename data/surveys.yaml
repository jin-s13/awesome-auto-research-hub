  - 'Key differences: Systems differ in where they intervene—some focus on upgrading
    search infrastructure for AI agents, others on generating full review manuscripts,
    and still others on auditing the robustness of automated reviewers—leading to
    divergent evaluation metrics and interaction modes.'
  - 'Trend evolution: Work from 2024–2026 moves from hierarchical organization aids
    (2024) to multi-agent generation pipelines (2025) and then to integrated knowledge
    layers and robustness studies of review agents (2026), with a growing emphasis
    on factual reliability and safety.'
  - 'Open questions: Whether generated reviews reach expert-level factual accuracy
