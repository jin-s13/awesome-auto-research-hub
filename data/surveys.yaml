      what_it_solves: Creates task suites and metrics for measuring whether agents
        can plan hypotheses, experiments, ablations, and interpret results.
      what_remains_open: Coverage outside simulated or benchmark-specific tasks, and
        whether task completion or LLM-judge scores track real research usefulness.
    - line: 'Interactive multi-agent research platforms (short examples: Claw AI Lab,
        ReasFlow)'
      what_it_solves: Provides orchestration, customizable roles, monitoring, rollback/resume,
