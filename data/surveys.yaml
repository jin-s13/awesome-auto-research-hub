    verification; several add human oversight, self-healing execution, or verifiable
    reporting.'
  - 'Key differences: Workflow representation, supervision signal, evaluation target,
    and human interaction mode differ—structured debate, search tree, shared world-model,
    evolutionary search, and lab-in-the-loop; benchmarks span biology, equation discovery,
    optimization, and autonomous research.'
  - 'Trend evolution: Available evidence is concentrated in 2025-2026; 2025 work frames
    taxonomies and proof-of-concept systems, while 2026 work shifts toward harder
    realistic benchmarks, verifiable reporting, self-healing execution, and targeted
    human collaboration.'
  - 'Open questions: Transfer from proxy benchmarks to real scientific value, reliability
    and provenance over long runs, scalability beyond tested cycle limits, optimal
    human oversight, and domain-conditioned autonomy remain unresolved.'
  related_work_outline_zh:
  - 主流方向：基于LLM的多智能体自主研究系统，将数据和文献转化为假设，并通过代码执行、实验或结构化反馈不断细化。
  - 研究共性：多数工作将假设生成嵌入数据分析、文献检索、结果解释与证据验证的迭代循环；部分系统加入人工监督、自愈执行或可验证报告。
  - 关键差异：工作流表示、监督信号、评测目标和人工交互模式不同——包括结构化辩论、研究树、共享世界模型、进化搜索和实验室在环；评测覆盖生物学、方程发现、优化和自主研究。
  - 趋势演进：证据集中在2025-2026年；2025年主要提出分类体系和概念验证系统，2026年转向更真实的高难度基准、可验证报告、自愈执行与精准人类协作。
  - 开放问题：代理基准到真实科学价值的迁移、长流程可靠性与来源追踪、超出已测周期的扩展性、最优人工监督，以及按领域条件化的自主性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous multi-agent research pipelines
      what_it_solves: End-to-end conversion of open-ended research goals into hypothesis-experiment-update
        loops that integrate literature search, data analysis, and result interpretation.
      what_remains_open: Evidence preservation, weak-direction rejection, provenance
        tracking, and cross-domain robustness are cited as unresolved; autonomy appears
        credible mainly in structured, executable, rapidly verifiable settings.
    - line: Structured search and planning over hypothesis spaces
      what_it_solves: Branching, backtracking, and evolutionary idea selection make
        hypothesis generation inspectable and reduce unguided exploration.
      what_remains_open: Demonstrated on combinatorial optimization and cooperative
        driving; whether gains come from search structure, task priors, or agent reasoning
        is not isolated for broader scientific discovery.
    - line: Shared state and world-model representation
      what_it_solves: Maintains shared information between data analysis and literature
        search agents so long-horizon discovery remains coherent and traceable across
        many agent rollouts.
      what_remains_open: Report accuracy is partial and scaling is tested only to
        a limited cycle count; behavior beyond that range and under distribution shift
        remains unverified.
    - line: Evaluation and evidence design
      what_it_solves: Creates benchmarks, tasks, baselines, and evaluation harnesses
        to compare AI research capabilities and quantify difficulty gaps.
      what_remains_open: Proxy benchmarks may not capture real scientific utility;
        current evidence still shows substantial model accuracy drops and coverage
        is concentrated in selected disciplines.
    - line: Conceptual taxonomy and theory of research automation
      what_it_solves: Organizes research automation into workflow conditions, evaluation
        dimensions, and autonomy spectra such as human-steered versus AI-led systems.
      what_remains_open: Surveys identify reliability, ethical, literature review
        automation, and accountable scientific closure gaps, but do not provide direct
        empirical validation that the proposed categories predict system behavior.
    consensus:
    - Hypothesis generation is treated as part of an iterative loop with literature
      search, data analysis, experimentation, and hypothesis refinement rather than
      a one-shot output.
    - Agentic systems require external grounding through code execution, benchmark
      harnesses, or experimental validation to improve beyond unaided LLM proposal.
    - Full autonomy remains unreliable, so researchers use human oversight, verifiable
      reporting, or provenance constraints to mitigate fabricated evidence and weak
      directions.
    - Current evaluation is primarily task-specific or benchmark-specific, and reproducibility,
      evidence preservation, and metric-to-utility transfer are recognized gaps.
    disagreements:
    - 'Workflow control differs: structured debate, tree-based branching with backtracking,
      evolutionary search, shared world-model cycles, and lab-in-the-loop execution
      emphasize different mechanisms for hypothesis search.'
    - 'Supervision signal differs: some systems rely on self-reflection or optimization-inspired
      updates, while others use targeted human intervention at decision points or
      semi-autonomous laboratory feedback.'
    - 'Evaluation targets differ: general autonomous research benchmarks, biology
      protocol tasks, scientific equation discovery, classical optimization and driving
      scenarios, and clinical discovery evaluate different capabilities.'
    - Deployment settings differ along domain structure and verifiability, leading
      to different assumptions about whether autonomy is credible in embodied, delayed,
      heterogeneous, or institutionally accountable contexts.
    open_questions:
    - How well do improvements on research-capability benchmarks translate into real-world
      scientific discovery value?
    - Which mechanisms most reduce inaccurate statements, fabricated results, and
      weak-direction persistence over long agent runs?
    - Do structured workflows remain beneficial outside their demonstrated domains,
      or do task-specific priors and controllers explain the gains?
    - What is the right allocation of human oversight across autonomous research stages,
      and can it be standardized across disciplines?
    - Can evaluation suites maintain ecological validity and difficulty as frontier
      models improve while covering more diverse and delayed-feedback science?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主多智能体研究流水线
      解决的问题: 将开放式研究目标转化为假设-实验-更新循环，整合文献检索、数据分析与结果解释。
      尚未覆盖: 证据保存、弱方向拒绝、来源追踪和跨领域鲁棒性仍未解决；自主性在可执行、可快速验证的环境中更可信。
    - 路线: 假设空间的结构化搜索与规划
      解决的问题: 通过分支、回溯和进化式想法选择，使假设生成可检查并减少无引导探索。
      尚未覆盖: 当前主要在组合优化与协作驾驶上验证；收益来自搜索结构、任务先验还是智能体推理尚未分离。
    - 路线: 共享状态与世界模型表示
      解决的问题: 在数据分析与文献检索智能体之间维持共享信息，使长周期发现更连贯、可追溯。
      尚未覆盖: 报告准确性仍不完整，扩展性仅在有限周期内测试；分布外和更长流程行为未验证。
    - 路线: 评测与证据设计
      解决的问题: 构建基准、任务、基线和评估工具，以比较AI研究能力并量化难度差距。
      尚未覆盖: 代理指标未必反映真实科学效用；现有证据显示模型准确率仍大幅下降，覆盖领域有限。
    - 路线: 研究自动化的概念分类与理论
      解决的问题: 将研究自动化组织为工作流条件、评估维度和自主性谱系，如人类引导与AI主导。
      尚未覆盖: 综述指出可靠性、伦理、文献自动化与可问责科学闭环缺口，但缺少分类可预测系统行为的直接实证验证。
    共识:
    - 假设生成被视为迭代循环的一部分，与文献检索、数据分析、实验和假设细化相连，而非一次性输出。
    - 智能体系统需要通过代码执行、基准测试或实验验证获得外部锚定，以突破仅靠LLM生成假设的局限。
    - 完全自主仍不可靠，研究者采用人工监督、可验证报告或来源约束来缓解伪造证据和弱方向持续。
    - 当前评测主要基于特定任务或基准，可复现性、证据保存和指标到现实效用的迁移仍是公认缺口。
    分歧:
    - 工作流控制不同：结构化辩论、带回溯的树形分支、进化搜索、共享世界模型循环和实验室在环执行各自强调不同机制。
    - 监督信号不同：有的依赖自我反思或受优化启发的更新，有的在决策点引入精准人工干预，或采用半自主实验室反馈。
    - 评测目标不同：自主研究通用基准、生物实验任务、科学方程发现、经典优化与驾驶场景、临床发现评估不同能力。
    - 部署场景在领域结构性和可验证性上不同，导致对具身、延迟、异质或机构问责背景下自主性是否可信的假设不同。
    开放问题:
    - 研究能力基准上的提升能在多大程度上转化为真实世界的科学发现价值？
    - 哪些机制最能减少长流程中不准确陈述、伪造结果和弱方向持续？
    - 结构化工作流在其展示领域之外是否仍有益，还是任务先验和控制器解释了收益？
    - 如何在自主研究各阶段分配人工监督，并跨学科标准化？
    - 随着前沿模型能力提升，评测套件能否保持生态效度和难度，并覆盖更多样、延迟反馈的科学任务？
