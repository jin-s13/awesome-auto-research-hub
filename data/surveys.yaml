  related_work_outline:
  - 'Mainstream direction: Building multi-agent LLM systems that automate literature
    search, survey synthesis, and research paper generation, with integrated verification
    loops and knowledge retrieval.'
  - 'Shared research pattern: Iterative refinement cycles combining literature retrieval,
    hypothesis generation, and multi-faceted evaluation (human or rubric-based); systems
    adopt modular agent roles (retriever, writer, reviewer) and structured workflows.'
  - 'Key differences: Some systems use closed-loop world models linking literature
    and data analysis (Kosmos), while others rely on rubric-guided refinement for
    survey quality (ARISE). Evaluation targets range from full paper generation (ReasFlow)
    to benchmarked discovery (BAISBench) or failure analysis (Why LLMs Aren''t Scientists
    Yet). Architectures span tree-based evolutionary search (OR-Agent) to self-evolving
    frameworks (EvoMaster).'
  - 'Trend evolution: Within the 2025–2026 frontier, systems move from single-domain
    pipelines to domain-agnostic, self-evolving architectures; benchmarks grow more
    realistic (single-cell data, expert baselines); and attention to failure modes
    and scientific taste is rising.'
  - 'Open questions: Can these systems maintain factual accuracy beyond training data
    (Kosmos reports 20.6% inaccuracy)? How well do they scale past 20 cycles? How
    to standardize evaluation of novelty and correctness? Most works lack public code
    or datasets, hampering reproducibility.'
  related_work_outline_zh:
  - 主流方向：构建多智能体LLM系统，自动化文献检索、综述合成与研究论文生成，并集成验证循环和知识检索。
  - 研究共性：将文献检索、假设生成与多维度评估（人工或基于评分准则）结合的迭代优化循环；系统采用模块化智能体角色（检索者、撰写者、评审者）和结构化工作流。
  - 关键差异：部分系统利用闭环世界模型连接文献与数据分析（Kosmos），而其他系统依赖评分准则引导的优化以提升综述质量（ARISE）。评测目标涵盖生成完整论文（ReasFlow）、基准科学发现（BAISBench）或失败分析（Why
    LLMs Aren't Scientists Yet）。架构从树状进化搜索（OR-Agent）到自演化框架（EvoMaster）不等。
  - 趋势演进：在2025–2026前沿中，系统从单领域流水线转向领域无关的自演化架构；基准更趋真实（单细胞数据、专家基线）；对失败模式和科学品味的关注正在增加。
  - 开放问题：这些系统能否在训练数据外保持事实准确性（Kosmos报告20.6%不准确）？它们能多好地扩展到20个周期以上？如何标准化评估新颖性和事实正确性？多数工作未公开代码或数据集，阻碍可复现性。
  literature_review:
    line_of_work_matrix:
    - line: Knowledge representation and retrieval for literature
      what_it_solves: Constructing structured knowledge bases or world models that
        connect literature search with data analysis to enable coherent, traceable
        long-horizon discovery.
      what_remains_open: Whether the representation captures novel connections outside
        training distribution; the factual accuracy of retrieved and synthesized statements
        remains partial (Kosmos achieved 79.4% accuracy, leaving 20.6% potentially
        inaccurate).
    - line: Agentic workflow and planning for literature synthesis
      what_it_solves: Orchestrating iterative cycles of retrieval, drafting, and verification
        (rubric-based or reviewer-based) to automatically generate high-quality surveys
        or papers.
      what_remains_open: Scalability beyond 20 cycles is untested; handling of ambiguous
        or contradictory evidence is unresolved; self-critique loops can introduce
        failure modes like overexcitement, implementation drift, and context degradation.
    - line: Evaluation frameworks for literature intelligence
      what_it_solves: Providing benchmarks, rubrics, and human baselines to measure
        the quality of AI-generated literature outputs, including factual accuracy,
        comprehensiveness, and scholarly rigor.
      what_remains_open: No standardized proxy metric correlates well with real-world
        scientific utility; evaluating novelty remains an open challenge; current
        benchmarks may not cover the full diversity of literature tasks.
    - line: System infrastructure and reproducibility
      what_it_solves: Building modular, reusable agent frameworks that can be applied
        to literature tasks with minimal code, enabling rapid prototyping and domain
        adaptation.
      what_remains_open: Most systems lack public code, datasets, or detailed reproducibility
        artifacts; external validation across hardware, domains, and user settings
        is absent, limiting confidence in claimed performance and generalizability.
    - line: Taxonomy and failure analysis of AI scientists
      what_it_solves: Categorizing capabilities and failure modes of AI systems for
        literature-related discovery, and deriving design principles to improve robustness.
      what_remains_open: Whether the proposed taxonomies predict actual system behavior
        has not been empirically validated; the design principles have not been tested
        in a controlled, comparative setting.
    consensus:
    - LLM-based multi-agent systems can automate significant portions of literature
      review, survey writing, and paper drafting, but they require robust verification
      and human oversight to ensure quality.
    - Iterative refinement – through feedback loops, reviewer agents, or rubric checks
      – consistently improves the completeness, accuracy, and scholarly formatting
      of generated literature outputs.
    - A combination of literature retrieval, hypothesis generation, and structured
      writing is the dominant blueprint; most systems adopt modular agent roles (retriever,
      writer, reviewer) and generate traceable outputs.
    disagreements:
    - 'Information sharing architecture: Kosmos uses a structured world model to tightly
      couple literature search and data analysis, while ARISE and ReasFlow rely on
      separate agent roles with rubric-guided or validation-based feedback loops.'
    - 'Evaluation target: Some works evaluate the full pipeline by generating complete
      research papers (ReasFlow, ARISE), while others benchmark the literature intelligence
      component within a broader scientific discovery task (BAISBench, EvoMaster)
      or focus on qualitative failure analysis (Why LLMs Aren''t Scientists Yet).'
    - 'Supervision signal: Rubric-based evaluation (ARISE) contrasts with human expert
      judgment (Kosmos, BAISBench) and LLM-based review rubrics (ReasFlow), leading
      to different quality dimensions and potential biases.'
    - 'Deployment setting: Self-contained agent frameworks requiring minimal domain
      knowledge (EvoMaster, OR-Agent) differ from systems that expect a human principal
      investigator to guide the process (ReasFlow, Kosmos).'
    open_questions:
    - What is the effective upper bound on the number of iterative cycles before factual
      accuracy degrades or novel insight generation plateaus? (Kosmos tested only
      up to 20 cycles.)
    - How can we develop standardized, reproducible evaluation protocols that capture
      both factual correctness and scientific novelty for literature synthesis? Current
      studies rely on disparate human or LLM judgments.
    - To what extent can these systems generalize beyond the domains and datasets
      on which they were demonstrated, given the lack of released code and diverse
      benchmarks?
    - Can the identified failure modes (overexcitement, implementation drift, context
      degradation) be mitigated without reintroducing heavy human supervision, and
      do the proposed design principles actually improve robustness?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向文献的知识表示与检索
      解决的问题: 构建结构化知识库或世界模型，将文献检索与数据分析相连接，以支持连贯、可追溯的长周期发现。
      尚未覆盖: 表示能否捕捉训练分布之外的创新联系；检索与合成陈述的事实准确性仍不完整（Kosmos准确率79.4%，20.6%可能不准确）。
    - 路线: 面向文献合成的智能体工作流与规划
      解决的问题: 编排检索、起草与验证（基于评分准则或评审）的迭代循环，自动生成高质量综述或论文。
      尚未覆盖: 20个周期以上的可扩展性未测试；如何处理模糊或矛盾证据仍待解决；自批判循环可能引入过度兴奋、实现漂移等失败模式。
    - 路线: 文献智能的评测框架
      解决的问题: 提供基准、评分准则和人类基线，衡量AI生成文献成果的质量，包括事实准确性、全面性和学术严谨性。
      尚未覆盖: 尚无标准化代理指标与真实科学效用高度相关；评估新颖性仍是开放挑战；当前基准可能未覆盖文献任务的多样性。
    - 路线: 系统基础设施与可复现性
      解决的问题: 构建模块化、可复用的智能体框架，能以最少代码应用于文献任务，实现快速原型和领域适配。
      尚未覆盖: 多数系统缺少公开代码、数据集或详细复现工件；跨硬件、领域和用户设置的外部验证缺失，限制了性能声明的可信度。
    - 路线: AI科学家的分类与失败分析
      解决的问题: 对AI文献发现系统的能力和失败模式进行分类，并推导提升鲁棒性的设计原则。
      尚未覆盖: 所提出的分类能否预测实际系统行为尚未得到实证验证；设计原则未在受控对比实验中被检验。
    共识:
    - 基于LLM的多智能体系统能够自动化文献综述、论文撰写的大部分工作，但仍需强大的验证和人工监督来保证质量。
    - 通过反馈循环、评审智能体或评分准则检查进行的迭代优化，能持续提升生成文献成果的完整性、准确性和学术规范性。
    - 文献检索、假设生成与结构化写作的组合是主流蓝图；多数系统采用模块化智能体角色（检索者、撰写者、评审者）并生成可追溯的输出。
    分歧:
    - 信息共享架构：Kosmos使用结构化世界模型紧密耦合文献搜索与数据分析，而ARISE和ReasFlow依赖独立智能体角色与评分准则引导或验证驱动的反馈循环。
    - 评测目标：部分工作以生成完整研究论文来评估全流水线（ReasFlow、ARISE），另一些则在更广泛的科学发现任务中评测文献智能组件（BAISBench、EvoMaster），或专注于定性失败分析（Why
      LLMs Aren't Scientists Yet）。
    - 监督信号：基于评分准则的评估（ARISE）与人类专家判断（Kosmos、BAISBench）以及LLM评审准则（ReasFlow）不同，导致质量维度差异和潜在偏差。
    - 部署设置：需要最少领域知识的自包含智能体框架（EvoMaster、OR-Agent）与期望人类首席研究员指导的系统（ReasFlow、Kosmos）存在差异。
    开放问题:
    - 在事实准确性下降或新颖见解生成趋于平稳之前，迭代周期数的有效上限是多少？（Kosmos仅测试了20个周期。）
    - 如何开发标准化、可复现的评估协议，以同时捕捉文献合成的事实正确性和科学新颖性？当前研究依赖不同的人类或LLM判断。
    - 在缺乏公开代码和多样性基准的情况下，这些系统能在多大程度上超越所展示的领域和数据集进行泛化？
    - 能否在不重新引入大量人工监督的前提下缓解已识别的失败模式（过度兴奋、实现漂移、上下文退化），且所提出的设计原则是否真正提升了鲁棒性？
