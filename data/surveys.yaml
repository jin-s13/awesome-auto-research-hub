  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agent systems
      what_it_solves: Automating ideation, code implementation, experiment execution,
        analysis, and manuscript generation in open-ended research loops.
      what_remains_open: Inconsistent peer-review success, limited demonstrated venue
        or domain breadth, and incomplete detection of silent execution failures.
    - line: Evidence-grounded evaluation environments and benchmarks
      what_it_solves: Making discovery-agent claims comparable through blinded or
        frozen tasks, automatic evidence-maturity metrics, and human baselines.
      what_remains_open: Conclusions often rely on one base model, plateauing agents
        lack statistical separation, and proxy metrics may not align with real scientific
        utility.
    - line: Reliability-enforcing agent architectures
      what_it_solves: Constraining LLM-generated actions through verification gates
        or deterministic program authority to improve traceability and execution validity.
      what_remains_open: Verification gaps remain, such as missed silent failures,
        and there is no standardized external validation across domains and deployment
        settings.
    - line: Automated review and human-calibration
      what_it_solves: Scoring generated papers and discoveries via automated reviewers
        or expert human baselines to approximate peer judgment.
      what_remains_open: Validation is limited to workshop-level or near-human settings;
        full-conference and real-world governance evidence is missing.
    consensus:
    - LLM agents can execute and document analyses competently, but evidentiary maturity
      for trustworthy scientific claims remains low.
    - Reliable evaluation requires evidence-grounded artifacts and blinded or frozen
      target information, not only final-answer accuracy.
    - Explicit verification or deterministic authority boundaries improve traceability
      and reduce unsupported claims.
    - Multiple current agents cluster near an acceptance threshold or plateau without
      statistically reliable separation.
    - Human and peer baselines reveal a persistent gap between automation and autonomous
      scientific judgment.
    disagreements:
    - 'Evaluation target differs: open-ended general discovery versus domain-specific
      tasks and blinded peer-reviewed study tasks.'
    - 'Reliability mechanism differs: physics-aware visual verification, deterministic
      source-edit and evaluation authority, automated LLM judging, or simulated peer
      review.'
    - 'Success criteria differ: peer-review acceptance, benchmark score, percentage
      error improvement, implementation success, or token and time cost.'
    - 'Deployment setting differs: simulated text environments, real computational
      or experimental data, and workshop-level submission.'
    open_questions:
    - What evidence threshold demonstrates that an agent produced a defensible scientific
      claim rather than only a paper-like artifact?
    - How do automated judges generalize across base models, domains, and scoring
      rubrics beyond the single frozen setting?
    - Which verification failures remain underdetected, and what closed-loop checks
      would reduce silent-failure miss rates?
    - Do narrow-domain or workshop-level successes transfer to full peer-reviewed
      publication and real-world research governance?
    - Which proxy metrics best predict downstream reliability and epistemic trustworthiness
      in automated research?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现智能体系统
      解决的问题: 在开放式研究循环中自动化构思、代码实现、实验执行、分析和论文生成。
      尚未覆盖: 同行评审成功率不稳定，已验证的领域或发表层级范围有限，静默执行失败检测不完整。
    - 路线: 证据锚定评估环境与基准
      解决的问题: 通过盲任务或冻结任务、自动证据成熟度指标和人类基线，使科学发现智能体的主张可比较。
      尚未覆盖: 结论常依赖单一基座模型，智能体得分处于平台期且缺乏统计区分，代理指标与真实科学效用的一致性不确定。
    - 路线: 可靠性增强的智能体架构
      解决的问题: 通过验证门控或确定性程序权威约束 LLM 生成行为，以提升可追溯性和执行有效性。
      尚未覆盖: 仍存在验证缺口，例如漏检静默失败；缺少跨领域和部署环境的标准化外部验证。
    - 路线: 自动评审与人类校准
      解决的问题: 通过自动评审器或人类专家基线为生成论文和发现打分，以近似同行判断。
      尚未覆盖: 验证仅限工作坊级别或接近人类评分设置；缺少完整会议和真实世界治理证据。
    共识:
    - LLM 智能体能熟练执行并记录分析，但支持可信科学主张的证据成熟度仍然较低。
    - 可靠评估需要证据锚定工件与盲化或冻结的目标信息，而不能只看最终答案准确率。
    - 显式验证或确定性权威边界能提升可追溯性，并减少缺乏支持的主张。
    - 多个当前智能体集中在接受阈值附近或处于平台期，缺乏统计上可靠的分离。
    - 人类与同行评审基线表明，自动化与自主科学判断之间仍存在持续差距。
    分歧:
    - 评估目标不同：通用开放式发现对比领域特定任务和盲化同行评审研究任务。
    - 可靠性机制不同：物理感知视觉验证、确定性源码编辑与评估权威、自动 LLM 裁判或模拟同行评审。
    - 成功标准不同：同行评审接受、基准得分、误差率改善、实现成功率或 token 与时间成本。
    - 部署场景不同：模拟文本环境、真实计算或实验数据，以及工作坊级提交。
    开放问题:
    - 达到何种证据阈值才能证明智能体产出了可辩护的科学主张，而不只是类似论文的工件？
    - 自动裁判在单一冻结设置之外如何跨基座模型、领域和评分量表泛化？
    - 哪些验证失败仍未被充分检测，哪些闭环检查可降低静默失败漏检率？
    - 窄领域或工作坊级成功是否能迁移到完整同行评审发表和真实研究治理？
    - 哪些代理指标最能预测自动化研究的下游可靠性与认知可信度？
