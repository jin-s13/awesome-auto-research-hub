  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research-lab and pipeline automation
      what_it_solves: Framing entire research cycles, including ideation, literature
        analysis, experimental design, execution, interpretation, manuscript drafting,
        and provenance logging, as automatable workflows.
      what_remains_open: Governance, community coordination, implemented prototypes,
        and empirical validation are missing or unresolved.
    - line: Agentic experiment campaign orchestration
      what_it_solves: Maintaining persistent optimization state across computational
        or physical campaigns while separating LLM reasoning from repeated Bayesian
        optimization or code-editing loops.
      what_remains_open: Inference cost is substantial, domain coverage remains limited,
        and comparisons with human-led campaign efficiency are not standardized.
    - line: Predictive digital twins for instruments and samples
      what_it_solves: Forecasting outcomes, uncertainty, and risk of candidate operations
        by pairing sample-state representations with instrument or compute-infrastructure
        models.
      what_remains_open: Validation is modality-specific, instrument-model mismatch
        remains, and transfer beyond the demonstrated microscopy or color-mixing settings
        is not shown.
    - line: Noisy-feature detection and recovery for self-driving labs
      what_it_solves: Detecting and correcting noisy features in experimental datasets
        by analyzing dataset size, noise intensity, noise type, and feature distribution
        with kNN-based workflows.
      what_remains_open: Low-intensity noise, discrete or narrow feature distributions,
        and generalization beyond DFT and self-driving-lab datasets remain unresolved.
    - line: Reviews and agenda-setting frameworks for automated discovery
      what_it_solves: Synthesizing machine learning, AutoML, generative modeling,
        and autonomous experimentation approaches and setting community directions
        for evaluation and governance.
      what_remains_open: Direct empirical validation is limited; data quality, interpretability,
        and alignment between proxy metrics and real material or scientific utility
        remain open.
    consensus:
    - Multiple systems agree on closing an experiment loop that includes proposing
      changes, executing or simulating them, evaluating by constraints or fitness,
      and updating persistent state.
    - There is a shared shift from hyperparameter optimization toward higher-level
      experiment design, interpretation, and model or campaign management.
    - Physical and digital evaluations are used to demonstrate autonomy, but evidence
      quality varies and often lacks standardized baselines or released artifacts.
    - Human oversight is recognized as important for guidance, review, or governance,
      even in systems described as autonomous.
    disagreements:
    - 'Interaction modes differ: some propose fully autonomous research labs, while
      others keep human experts in the loop for novelty assessment, feedback, or campaign
      supervision.'
    - 'Representations differ: language agents that edit code or manage campaigns,
      learned predictive twins, and nearest-neighbor data correction rely on different
      assumptions about where intelligence and predictive modeling are needed.'
    - 'Evaluation targets differ: recommender-research automation, interatomic-potential
      training, microscopy, flow chemistry, color mixing, and data-cleaning benchmarks
      are not directly comparable.'
    - 'Deployment assumptions differ: HPC job management, nanoHUB infrastructure,
      physical instruments, and purely digital tasks impose different reproducibility
      and scaling requirements.'
    open_questions:
    - Which evaluation protocols would certify that an autonomous experiment system
      produces reproducible, governable, and scientifically meaningful results beyond
      task-specific scorecards?
    - How do predictive twins and agentic controllers transfer across instrument modalities,
      material systems, and lab infrastructures?
    - Can noise detection and closed-loop optimization remain reliable with small,
      narrow, or low-intensity-noise datasets?
    - What is the cost-benefit boundary for LLM inference in long-running physical
      campaigns, and when is human supervision necessary?
