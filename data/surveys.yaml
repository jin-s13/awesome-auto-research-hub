  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous manuscript generation pipelines
      what_it_solves: 'Automates the research-to-paper workflow: idea generation,
        code or experiment execution, result analysis, visualization, and paper writing.'
      what_remains_open: Reliability across domains and tasks; most systems produce
        only a fraction of submission-ready outputs or require curated demonstration
        settings.
    - line: Verification and failure-attribution loops
      what_it_solves: Catches invalid results, silent execution failures, hallucinated
        numbers, or logical errors before they enter manuscripts.
      what_remains_open: Verification is incomplete under planted or adversarial failures,
        and domain-specific gates may miss subtle errors outside their designed checks.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Positions human oversight at high-leverage decision points rather
        than requiring exhaustive step-by-step supervision or assuming full autonomy.
      what_remains_open: Which intervention points generalize across disciplines,
        and the cost-quality trade-offs of different collaboration modes, remain under-evidenced.
    - line: Automated review and evaluation assistance
      what_it_solves: Provides scalable proxy review for generated papers using LLM
        rubrics, simulated reviewers, blind scores, and visual-language feedback.
      what_remains_open: Agreement with human peer review and real decision utility
        is not fully established; workshop acceptance is limited evidence.
    - line: Domain-specific discovery-to-writing systems
      what_it_solves: Embeds domain validity checks and executable workflows, such
        as applied mathematics or computational fluid dynamics tasks, into scientific
        writing so claims are grounded in verified results.
      what_remains_open: Transfer across disciplines and coverage of theoretical or
        empirical claims beyond demonstrated cases remain open.
    consensus:
    - Multiple systems decompose scientific writing into ideation, execution, analysis,
      and drafting stages, often using specialized agents rather than a single monolithic
      model.
    - Verification or reflection is treated as a required stage for reducing hallucinated
      results, invalid experiments, or unsupported claims.
    - Automated reviewers and LLM-based rubrics are used as scalable evaluation proxies,
      but human peer review remains the external check.
    - Targeted human collaboration at high-leverage decision points is framed as more
      effective than both full autonomy and exhaustive oversight.
    - Paper generation is treated as inseparable from experiment execution and result
      verification, not as a standalone text-generation task.
    disagreements:
    - 'Verification mechanism differs: some rely on domain-specific physics or mathematical
      coherence checks, while others use generic causal failure attribution, debate,
      or reflection baselines.'
    - 'Level of autonomy differs: some systems push toward fully automated discovery,
      while others explicitly design multiple human-in-the-loop intervention modes.'
    - 'Evaluation target differs: workshop acceptance, benchmark success rates, LLM
      rubric scores, blind review scores, or domain metric improvement are not interchangeable
      evidence.'
    - 'Writing scope differs: some aim to produce complete manuscripts, whereas others
      focus on metrics-bearing reports or experiment-stage outputs and stop short
      of conference-ready writing.'
    - 'Domain grounding differs: systems specialized to applied mathematics or computational
      fluid dynamics impose task-specific validity gates, while general machine-learning
      systems emphasize cross-domain flexibility.'
    open_questions:
    - How well do automated verification gates generalize beyond curated or domain-specific
      failure cases, given an observed miss of planted silent failures?
    - Do LLM-based reviewer scores and benchmark success rates align with human scientific
      judgment and long-term research utility?
    - Can autonomous research-writing systems maintain coherent long-horizon memory
      and avoid implementation drift or premature success claims?
    - Which human intervention points most improve output quality without creating
      excessive oversight burden across different disciplines?
    - How should missing limitation details, external validation, code, or dataset
      evidence be integrated into comparisons of reported system performance?
