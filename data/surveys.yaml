  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research writing and paper generation
      what_it_solves: 'Automates the full idea-to-manuscript workflow: hypothesis
        formation, code, experiments, visualization, and paper drafting.'
      what_remains_open: Success is inconsistent and mostly demonstrated at workshop
        level or with targeted rubrics, not full conference-grade publication across
        fields.
    - line: Verification-gated and domain-aware manuscript generation
      what_it_solves: Adds logical coherence auditing, vision-based physics inspection,
        or knowledge retrieval before writing so generated claims are less likely
        to be silently wrong.
      what_remains_open: Verification gates still miss planted failures, and the strongest
        evidence is tied to specific domains such as applied mathematics or computational
        fluid dynamics.
    - line: Self-correction and failure-attribution-driven reporting
      what_it_solves: Diagnoses whether failures come from hypothesis, experimental
        design, or implementation, and constrains drafted results to measured values
        to reduce hallucinated numbers.
      what_remains_open: Improvements concentrate on code execution and artifact quality;
        fully autonomous conference-ready scientific writing is acknowledged as unsolved.
    - line: Human-AI collaborative research writing
      what_it_solves: Inserts human judgment at selected high-leverage decision points,
        ranging from PI-student collaboration to multiple intervention modes.
      what_remains_open: The cost-quality trade-off and optimal timing of human intervention
        are not standardized across tasks.
    - line: Evaluation and failure-case design for scientific writing
      what_it_solves: Constructs benchmarks, LLM-based review rubrics, peer-review
        submissions, and failure-mode case studies to make generated-paper quality
        comparable.
      what_remains_open: Alignment between automated proxy scores and real human peer-review
        or long-term scientific utility remains unclear.
    consensus:
    - Autonomous research writing systems converge on decomposing the scientific workflow
      into ideation, execution, validation, and reporting stages.
    - Verification loops, grounded reporting, or human checkpoints are treated as
      necessary because raw end-to-end generation can fabricate numbers or overclaim
      success.
    - Recent systems outperform earlier end-to-end baselines on targeted benchmarks,
      rubrics, or artifact-quality metrics.
    - Full conference-level autonomous scientific writing remains an open problem;
      current evidence is partial, domain-specific, or workshop-level.
    - Domain-specific validity gates improve defensible output but are not yet standardized
      across disciplines.
    disagreements:
    - 'Verification strategy differs: logical coherence auditing, vision-language
      physics inspection, measured-value grounding, and human audit are used as alternative
      or complementary credibility mechanisms.'
    - 'Autonomy differs: some systems pursue full automation, while others show targeted
      human collaboration at high-leverage points can outperform exhaustive oversight.'
    - 'Evaluation target differs: LLM-based review scores, benchmark success rates,
      artifact quality, and real peer-review outcomes are not equivalent evidence.'
    - 'Deployment setting differs: general machine-learning workflows assume different
      validity signals than applied mathematics or computational fluid dynamics workflows.'
    - 'Failure correction differs: some systems use single reflection, some use multi-hypothesis
      causal attribution, and some rely on multi-agent debate or self-healing execution.'
    open_questions:
    - Can generated manuscripts maintain factual, logical, and physical validity outside
      curated benchmarks and narrow domain tasks?
    - How well do LLM-based review rubrics and artifact benchmarks align with human
      peer review and eventual scientific impact?
    - What is the optimal placement and granularity of human intervention in autonomous
      research writing?
    - Can systems move from workshop-level acceptance to full conference publications
      across multiple scientific disciplines?
    - How complete are code, data, and artifact release signals in this literature,
      and what limitations are hidden by missing reproducibility evidence?
