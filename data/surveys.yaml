  - 'Shared research pattern: Systems decompose scholarly survey production into specialized
    agents or pipeline stages and use explicit review signals to improve structure,
    coverage, and citation grounding.'
  - 'Key differences: The main split is between end-to-end narrative quality optimization
    and focused organization/retrieval diagnosis; evaluation targets range from rubric
    scores to expert taxonomy alignment and citation fidelity.'
  - 'Trend evolution: Available top evidence is concentrated in 2025-2026, showing
