  - 主流方向：构建基于 LLM 的自主科研智能体，能够执行以代码为主的实验闭环，覆盖从假设/想法到实验执行、分析与论文写作。
  - 研究共性：多数系统将实验分解为规划、代码执行、验证/记忆、评测和报告等子任务，并用 LLM 评审、任务指标或工作坊/同行评审信号比较输出。
  - 关键差异：有的目标为完整论文生成，有的聚焦消融规划、模拟发现任务、人在环交互编排或失败感知记忆；领域覆盖代码型 AI 与推理导向应用数学。
  - 趋势演进：2024 年提出全自动发现框架和虚拟环境；2025 年出现消融规划和工作坊级接收；2026 年转向多智能体协作、交互监控与负知识记忆。时间窗窄，处于当前前沿。
  - 开放问题：可靠性仍低，三篇手稿中仅一篇通过同行评审，最佳消融召回约 45%；LLM 评审效度未定；向实验室或更广泛科学场景的迁移大多未证明。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end automated discovery agents
      what_it_solves: closing the loop from research idea to code, experiments, results,
        and paper generation
      what_remains_open: reliability across runs and domains; only partial success
        at workshop and peer-review level; lab-based discovery is not yet demonstrated
