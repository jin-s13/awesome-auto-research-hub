  - 趋势演进：2024至2026年，领域从初始自主框架（AI Scientist）走向提高可靠性（v2、工作坊接收）、多智能体协作（ReasFlow、Claw
    AI Lab）及专用组件（负知识、消融规划）。评测基准并行出现以衡量进展。
  - 开放问题：如何跨异质科学领域（超越ML和数学）泛化；如何使自主实验足够可靠以通过严格同行评审；如何整合领域特定的安全与伦理约束；人类科学家与AI智能体之间的最优分工模式是什么。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agent systems
      what_it_solves: Automating the complete scientific discovery pipeline from idea
        generation through experiment execution to manuscript writing, reducing human
        effort per discovery cycle.
      what_remains_open: Reliability under rigorous peer review (only one workshop
        paper accepted), generalization beyond ML or applied math, and handling of
        long-horizon safety and ethical review.
    - line: Experiment planning and execution optimization
      what_it_solves: Improving the efficiency of individual experiment steps by learning
        from past failures or by planning ablations systematically, aiming to reduce
        wasted computation and token usage.
      what_remains_open: LMs still identify only 45% of human-expected ablations;
        negative knowledge is shown only on PDE and ScienceAgentBench tasks, with
        unclear benefit on broader experiment types.
    - line: Benchmarks for scientific discovery agents
      what_it_solves: Providing standardized tasks and metrics to compare agent capabilities
        in hypothesis testing, experiment design, and discovery, thus highlighting
        current limitations.
      what_remains_open: Coverage of diverse scientific practices beyond text-based
        or simulated environments; agreement between automatic proxy metrics and real-world
        scientific utility.
    - line: Multi-agent collaborative research platforms
      what_it_solves: Enabling customizable role-based collaboration among agents
        to handle complex research workflows, with human oversight via dashboards
        and artifact inspection.
      what_remains_open: Lack of systematic validation of the added value of multi-agent
        coordination over single-agent baselines; platform maturity and reproducibility
        across different hardware and user settings.
    consensus:
    - LLM-based reasoning and code generation are the central engines for automating
      scientific experiments.
    - Decomposing the research loop into hypothesis, experiment, and analysis steps
      is a common architectural pattern.
    - Automated evaluation (simulated reviewers or benchmark tasks) is necessary for
      scalable assessment, but its correlation with human scientific judgment remains
      uncertain.
    - Current systems are most effective in domains where the experimental feedback
      loop can be fully simulated or executed in code (ML, math).
    disagreements:
    - 'The level of autonomy: some systems aim for fully automated paper generation
      with no human intervention, while others position the human as a principal investigator
      overseeing agent execution.'
    - 'Evaluation philosophy: one line uses simulated peer review (LLM judges) to
      gate system output, while another uses task completion metrics in synthetic
      environments, and a third submits to real workshops, creating tension between
      proxy and real-world validity.'
    - 'Failure handling: negative knowledge memory banks are contrasted with tree-search-based
      iterative refinement and with simple retry mechanisms, affecting memory footprint
      and exploration strategy.'
    - 'Domain specificity: systems like ReasFlow are designed for theory-heavy mathematical
      reasoning, whereas AI Scientist targets empirical ML; this specialization impacts
      the required verification and grounding components.'
    open_questions:
    - How can autonomous agents handle domains where experiments are costly, physical,
      or safety-critical, beyond purely simulated or code-based environments?
    - What is the minimal set of human feedback signals needed to keep an autonomous
      research agent aligned with scientific rigor over long discovery trajectories?
    - Can negative knowledge or similar failure-memory approaches generalize to capture
      common experimental pitfalls across different scientific fields?
    - How should the community standardize evaluation so that improvements in benchmark
      scores translate to higher-quality peer-reviewed scientific output?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究代理系统
      解决的问题: 从想法生成到实验执行再到论文撰写的完整科学发现流程自动化，减少每次发现循环的人工投入。
      尚未覆盖: 在严格同行评审下的可靠性（仅一篇工作坊论文被接收），超越ML或应用数学的泛化能力，以及长期安全与伦理审查的处理。
    - 路线: 实验规划与执行优化
      解决的问题: 通过从过往失败中学习或系统化消融规划提高单个实验步骤的效率，减少计算与令牌浪费。
      尚未覆盖: LM仅能识别45%的人类期望消融；负知识仅在PDE和ScienceAgentBench任务上展示，对更广泛实验类型的益处尚不明确。
    - 路线: 科学发现代理的评测基准
      解决的问题: 提供标准化任务与指标，比较代理在假设检验、实验设计和发现方面的能力，揭示当前局限。
      尚未覆盖: 对超越文本或模拟环境的多样化科学实践的覆盖；自动代理指标与真实科学效用之间的一致性。
    - 路线: 多智能体协作研究平台
      解决的问题: 实现基于角色的可定制代理协作，处理复杂研究流程，通过仪表板和工件检查提供人类监督。
      尚未覆盖: 缺乏对多智能体协调相对于单智能体基线的附加价值的系统验证；平台成熟度及跨硬件和用户环境的可复现性。
    共识:
    - 基于LLM的推理和代码生成是自动化科学实验的核心引擎。
    - 将研究循环分解为假设、实验和分析步骤是常见的架构模式。
    - 自动化评估（模拟评审或基准任务）对于可扩展评估是必要的，但其与人类科学判断的相关性仍不确定。
    - 当前系统在最能完全模拟实验反馈循环或在代码中执行的领域（ML、数学）最有效。
    分歧:
    - 自主程度：部分系统旨在完全自动生成论文，无人工干预；另一些则将人类定位为监督代理执行的首席研究员。
    - 评估理念：一个路线使用模拟同行评审（LLM裁判）评判系统输出，另一个使用合成环境中的任务完成指标，第三个则提交至真实工作坊，造成代理指标与真实有效性之间的张力。
    - 失败处理：负知识记忆库与基于树搜索的迭代改进以及简单重试机制形成对比，影响记忆占用和探索策略。
    - 领域特异性：ReasFlow等系统面向理论密集的数学推理设计，而AI Scientist则针对经验性ML，这种专门化影响所需的验证和基础组件。
    开放问题:
    - 自主代理如何处理昂贵、物理或安全关键的实验领域，超越纯模拟或基于代码的环境？
    - 在长期发现轨迹中，保持自主研究代理与科学严谨性对齐所需的最小人类反馈信号集是什么？
    - 负知识或类似失败记忆方法能否泛化，捕捉不同科学领域间常见的实验陷阱？
    - 社区应如何标准化评估，以便基准分数的提升能转化为更高质量的同行评审科研成果？
