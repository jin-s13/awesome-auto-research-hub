    研究路线矩阵:
    - 路线: 面向代理的检索增强知识层
      解决的问题: 将文献数据库升级为AI代理可访问的知识层，能分解自然语言查询、执行实时搜索并提取证据，提升检索准确性和下游任务表现。
      尚未覆盖: 在策划搜索引擎（如Europe PMC）之外的泛化能力，以及依赖单一LLM编排器的脆弱性；缺乏系统在模糊或跨领域查询下行为的证据。
    - 路线: 多代理文献综述生成
      解决的问题: 通过模拟人类工作流，使用专用代理进行大纲、写作、编辑和审阅，自动化生成结构化文献综述，提升可读性、引用质量和整体连贯性。
      尚未覆盖: 与专家综述相比的事实准确性和深度；评估依赖表面相似度和写作质量指标，而非下游效用或对合成主张的专家验证。
    - 路线: 自动同行评审与鲁棒性分析
      解决的问题: 研究LLM代理在同行评审中的行为和脆弱性，揭示表面修改可操纵评审结果，以及对抗性攻击能破坏评审模型。
      尚未覆盖: 构建针对此类操纵的防御，确保自动评审的公平性和一致性，验证模拟评审动态是否反映真实人类评审过程。
    - 路线: 迭代式与层次化文献组织
      解决的问题: 提供结构化或迭代的科学论文组织方式，通过层次聚类或迭代检索循环支持研究者导航和综合大量文献。
      尚未覆盖: 当前数据中缺乏详细的方法和评估证据；更好的组织方式能否直接转化为更高质量的文献综述这一假设尚未验证。
    共识:
    - 基于LLM的代理是实现文献综述任务自动化的可行主干，检索和生成步骤通过多步或多代理工作流进行编排。
    - 事实准确性和可靠性是所有系统共同面临的主要挑战，当前评估指标只能部分捕捉生成综述的质量。
    - 人类综述行为（如迭代精炼、组织和批判性评价）被用作代理工作流的设计模板。
    分歧:
    - 自动化的主要目标不同：有的工作旨在改善面向代理的检索接口（信息获取），有的聚焦于生成最终综述文章（内容创作），还有的着眼于审计评审过程本身（元评估）。
    - 评估实践各异——引用F1、写作质量、与人类综述的相似度、攻击下的鲁棒性被孤立使用，缺少覆盖所有方面的共识基准。
    - 交互模式不同：实时在线搜索 vs. 离线批量生成，单代理编排 vs. 多代理协作，人在回路 vs. 完全自主运行。
    开放问题:
    - 如何在不依赖易受表面修改影响的启发式方法的情况下，验证自动生成综述中的主张是否得到引用证据的支持？
    - 哪些防御机制能使自动评审代理对对抗性论文具有鲁棒性，且如何设计这些防御而不泄露评审标准？
    - 在现有基准上观察到的检索或生成质量提升，在部署到不同科学领域或不同底层搜索索引时能否保持？
    - 什么样的评估协议能同时捕捉生成综述对人类研究者的效用和其主张的事实可信度，超越写作风格和引用重叠？
