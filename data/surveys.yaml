  - 开放问题：自动评审分数是否反映真实同行评审和科研效用；如何可靠检测静默执行失败；人类监督粒度如何选择；能否稳定产出会议级完整论文而非仅工作坊级成果。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous manuscript generation
      what_it_solves: Transforms research ideas into code, experiments, figures, and
        full paper drafts with minimal human intervention.
      what_remains_open: Reliable conference-ready quality, easy corroboration of
        claims, and robustness beyond demonstrated ML or domain tasks.
    - line: Verification-gated writing and discovery
      what_it_solves: Reduces unsupported claims and silent execution failures before
        they enter a manuscript by auditing logic, physical plausibility, or measured
        outputs.
      what_remains_open: Verification gates still miss failure modes, and external
        validity across domains and failure types is not established.
    - line: Self-correcting failure attribution
      what_it_solves: Diagnoses why an experiment fails and routes revision to hypothesis,
        experimental design, or implementation instead of repeatedly reflecting.
      what_remains_open: Evidence that attribution improves full scientific writing,
        beyond code and execution, remains limited.
    - line: Human-in-the-loop research communication
      what_it_solves: Allocates scarce expert attention to high-leverage decision
        points in autonomous writing and discovery.
      what_remains_open: Optimal intervention modes and cost-quality trade-offs are
        not standardized.
    - line: Automated review and evaluation design
      what_it_solves: Creates rubric, workflow, or benchmark comparability for generated
        manuscripts and research artifacts.
      what_remains_open: Proxy scoring and workshop acceptance do not yet establish
        real peer-review utility or discovery value.
    - line: Failure-mode analysis and design principles
      what_it_solves: Documents recurring implementation drift, memory degradation,
        overexcitement, and weak scientific taste to derive design guidance.
      what_remains_open: These principles are not yet empirically validated to predict
        success across different autonomous research systems.
    consensus:
    - Autonomous writing systems converge on decomposing research into hypothesis
      or idea generation, implementation or experiment, verification, and manuscript
      drafting.
    - Explicit verification or grounded reporting is needed to prevent unsupported
      or hallucinated results in generated papers.
    - Automated review, whether LLM-based or human peer review, is treated as a necessary
      feedback signal for improving generated manuscripts.
    - Targeted human oversight at critical decision points can outperform fully autonomous
      workflows without requiring exhaustive step-by-step supervision.
    - Long-horizon autonomous research remains fragile due to implementation drift,
      memory degradation, and weak scientific taste.
    disagreements:
    - 'Verification strategy: some systems use internal logical audits, others constrain
      outputs to measured values, and others use domain-specific vision-language plausibility
      gates before writing.'
    - 'Evaluation target: systems are assessed by LLM rubric scores, workshop peer
      acceptance, experiment-stage benchmark accuracy, artifact quality, or blind
      review scores.'
    - 'Interaction mode: designs range from fully autonomous end-to-end generation
      to PI/graduate-student collaboration or multiple human intervention modes.'
    - 'Domain scope: some target broad ML subfields such as diffusion and language
      modeling, while others focus on applied mathematics or computational fluid dynamics,
      affecting what counts as valid evidence.'
    - 'Reproducibility and evidence: open-source artifacts are present in several
      systems, but some provide limited code or limitation reporting, leaving verification
      gaps.'
    open_questions:
    - Do LLM-based review rubrics and workshop acceptance align with real peer-review
      judgments and long-term scientific utility?
    - Can verification gates reliably detect silent execution or reasoning failures,
      given observed misses in a planted-failure ablation?
    - What level and timing of human intervention maximize quality while minimizing
      expert burden across different disciplines?
    - How can autonomous systems mitigate long-horizon memory degradation, implementation
      drift, and weak scientific taste beyond documenting them?
    - Can such pipelines move from generating workshop-level or benchmark-scoped papers
      to consistently producing rigorous, conference-ready manuscripts with transparent
      limitations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主手稿生成
      解决的问题: 把研究想法转化为代码、实验、图表和完整论文草稿，减少人工干预。
      尚未覆盖: 稳定达到会议级质量、主张可核验性，以及在展示领域之外的鲁棒性。
    - 路线: 验证门控下的写作与发现
      解决的问题: 在内容进入论文前审计逻辑、物理合理性或实测输出，减少无支撑主张和静默失败。
      尚未覆盖: 验证门仍会遗漏失败模式，跨领域和跨失败类型的外部效度未建立。
    - 路线: 自我纠正式失败归因
      解决的问题: 诊断实验失败原因并把修改路由到假设、实验设计或实现，而非反复泛泛反思。
      尚未覆盖: 失败归因对完整科学写作质量的提升证据仍有限，主要集中在代码和执行环节。
    - 路线: 人机协作式研究沟通
      解决的问题: 把稀缺专家注意力分配到高杠杆决策点，提高自主研究与写作产出质量。
      尚未覆盖: 最优干预模式、成本与质量权衡尚未标准化。
    - 路线: 自动评审与评测设计
      解决的问题: 通过评分标准、工作流和基准比较生成论文与研究工件，提供可比性。
      尚未覆盖: 代理评分与工作坊接受率尚未证明对应真实同行评审效用或科研价值。
    - 路线: 失败模式分析与设计原则
      解决的问题: 记录实现漂移、记忆退化、过度兴奋和科学品味不足，并转化为设计指导。
      尚未覆盖: 这些原则尚未被实证验证能否跨系统预测成功。
    共识:
    - 自主写作系统普遍将研究流程分解为想法生成、实验或实现、验证和手稿撰写。
    - 需要显式验证或基于实测结果的报告来防止生成论文中出现无支撑或幻觉内容。
    - 自动评审和人类同行评审都被视为改进生成论文的重要反馈信号。
    - 在关键决策点进行精准人类监督可优于完全自主，并优于逐步监督。
    - 长周期自主研究仍因实现漂移、记忆退化和科学品味不足而不稳定。
    分歧:
    - 验证策略：有的依赖内部逻辑审计，有的把输出约束为实测值，有的在写入前使用领域特定的视觉-语言物理门控。
    - 评测目标：采用LLM评分、工作坊同行接受、实验基准（如 ARC-Bench）、工件质量或盲审分数等不同标准。
    - 交互模式：从完全自主端到端生成，到PI/研究生式协作，再到多模式人类干预不等。
    - 领域范围：有的覆盖通用机器学习子领域，有的聚焦应用数学或计算流体动力学，因此有效证据标准不同。
    - 可复现与证据：部分系统开放代码，部分缺少代码或局限说明，形成验证缺口。
    开放问题:
    - LLM评分标准和工作坊接受率是否与真实同行评审及长期科学效用一致？
    - 在已观察到静默失败漏检的情况下，验证门控能否可靠检测逻辑或执行失败？
    - 何种人类干预粒度和时机能在不同学科中平衡质量与专家负担？
    - 除记录失败模式外，系统如何自动缓解记忆退化、实现漂移和科学品味不足？
    - 能否从工作坊级或基准范围论文走向稳定产出具有透明局限说明的会议级完整论文？
