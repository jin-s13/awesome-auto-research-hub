  related_work_outline_zh:
  - 主流方向：以多智能体或LLM为基础，把选题、实验、验证、写作和评审集成为自动科研论文生成系统，并以验证或评审循环提升可信度。
  - 研究共性：将论文生成视为多阶段工作流而非单次文本生成，普遍通过执行检查、反思、自纠正或人机干预减少静默失败。
  - 关键差异：验证机制不同，包括逻辑审计、视觉物理门控、实测值约束和模拟同行评审；人机协作程度与干预粒度不同；评测目标也不同。
  - 趋势演进：从通用端到端自动科学家转向领域专用验证、自纠正失败归因和高杠杆人机协作；证据主要集中在2024-2026前沿。
  - 开放问题：自动评审分数或基准成功能否预测真实科研质量，领域专用验证如何泛化，长期记忆、科学品味以及缺失工件和限制报告不足如何改进。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: turns an idea or minimal prompt into a complete paper spanning
        ideation, code, experiments, visualization, and writing
      what_remains_open: conference-ready reliability and consistency across topics
        because many runs still fail or produce non-defensible claims
    - line: Domain-specific verified writing and discovery agents
      what_it_solves: adds logic, physics, or retrieval checks to catch silent failures
        before generated text is accepted
      what_remains_open: verification gates remain task-specific and can miss planted
        failures, leaving generalization unproven
    - line: Human-AI collaborative research communication
      what_it_solves: uses human intervention at high-leverage decision points to
        improve autonomous research and reporting quality
      what_remains_open: which intervention granularity and modes transfer beyond
        a single benchmark or workflow remains unclear
    - line: Self-correcting failure attribution and grounded reporting
      what_it_solves: diagnoses failed experiments and ties generated claims to measured
        evidence instead of hallucinated numbers
      what_remains_open: long-horizon memory, implementation drift, and scientific
        taste still prevent full conference-ready writing
    - line: Automated peer review and manuscript evaluation
      what_it_solves: provides LLM/VLM reviewer signals to score and iteratively improve
        generated papers
      what_remains_open: alignment with human peer review and coverage of broader
        scientific communication tasks are not yet established
    consensus:
    - 'Automatic paper writing is treated as a multi-stage agentic pipeline: ideation,
      execution, verification, drafting, and reviewing.'
    - The dominant direction combines generation with a verification or review loop
      to make claims citable and defensible.
    - Full autonomy alone is brittle; self-correction, human collaboration, or domain-specific
      gates improve success rates and artifact quality.
    - Current evidence relies on proxy evaluations such as review rubrics, workshop
      acceptance, or benchmark success rather than robust external validation.
    disagreements:
    - Some systems embed domain-specific validity gates such as vision-language physics
      checks or logical consistency audits; others rely on general-purpose reviewer
      feedback.
    - Interaction mode differs from fully autonomous runs to human-in-the-loop interventions
      at selected decision points, with varying granularity.
    - 'Evaluation targets differ: LLM judge scores, benchmark success metrics, and
      peer review acceptance are used across systems, so reported improvements are
      not directly comparable.'
    - 'Reporting constraints differ: some systems enforce measured-value grounding,
      while others allow reviewer feedback or internal verification to shape the final
      manuscript.'
    open_questions:
    - Do automatic reviewer scores or workshop acceptance predict scientific correctness,
      reproducibility, or downstream research utility?
    - How can domain-aware verification be generalized without hand-built task-specific
      gates or prior knowledge?
    - What level and timing of human interaction maximize output quality without exhaustive
      oversight?
    - Which design can prevent long-horizon failures such as memory degradation, implementation
      drift, and overexcitement in paper generation?
    - How should limitations and missing artifacts be reported when many systems omit
      detailed failure evidence or release only partial code?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究与论文生成
      解决的问题: 从想法或最小提示生成覆盖选题、代码、实验、可视化和写作的完整论文
      尚未覆盖: 跨主题的会议级稳定性不足，多次运行仍会失败或产生不可辩护主张
    - 路线: 领域专用验证型写作与发现智能体
      解决的问题: 通过逻辑、物理或检索检查在生成文本被接受前捕获静默失败
      尚未覆盖: 验证门控仍依赖任务特定先验，并会漏掉植入失败，泛化未证明
    - 路线: 人机协作研究沟通
      解决的问题: 在高杠杆决策点引入人工干预，提升自主研究和报告质量
      尚未覆盖: 最优干预粒度与模式能否跨基准或工作流迁移尚未验证
    - 路线: 自纠正失败归因与事实约束报告
      解决的问题: 诊断实验失败并将生成主张绑定到实测证据，抑制幻觉数字
      尚未覆盖: 长跨度记忆、实现漂移和科学品味仍阻碍完整会议论文写作
    - 路线: 自动同行评审与稿件评估
      解决的问题: 用LLM/VLM评审信号评分并迭代改进生成论文
      尚未覆盖: 与人类同行评审对齐，以及更广科研沟通任务覆盖尚未建立
    共识:
    - 自动论文写作被视为多阶段代理管线：选题、执行、验证、起草和评审。
    - 主流方向在生成后加入验证或评审循环，以提高主张的可辩护性。
    - 完全自主仍然脆弱；自纠正、人机协作或领域专用门控能改善成功率和工件质量。
    - 现有证据依赖评审评分、工作坊接收或基准成功等代理指标，外部验证不足。
    分歧:
    - 验证方式不同：领域专用逻辑/物理检查与通用评审反馈路径并存。
    - 交互方式从完全自主到高杠杆人机干预不同，干预粒度也各异。
    - 评测目标不同：LLM评审分数、基准成功指标或同行评审接收，导致改进幅度不可直接比较。
    - 报告约束不同：部分系统强制绑定实测值，部分依赖评审反馈或内部验证塑造终稿。
    开放问题:
    - 自动评审分数或工作坊接收能否预测科学正确性、可复现性或下游研究效用？
    - 领域感知的验证如何在没有手工任务门控或先验知识的情况下泛化？
    - 何种人工交互层级与时机能在不增加详尽监督的情况下最大化输出质量？
    - 如何在论文生成中防止记忆退化、实现漂移和过早宣布成功等长跨度失败？
    - 当多篇系统缺少详细限制或仅部分发布代码时，应如何报告验证缺口与工件可用性？
