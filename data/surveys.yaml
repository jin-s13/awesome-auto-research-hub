  - 'Mainstream direction: building closed-loop autonomous research agents and evaluating
    them on domain or public benchmarks, with emphasis on feedback efficiency, reusable
    operational knowledge/experience, held-out validation, and recursive or DAG-based
    planning.'
  - 'Shared research pattern: compare a proposed agent or feedback mechanism against
    a fixed/no-skill/no-feedback baseline under controlled budgets, downstream benchmark
    scores, and resource metrics such as oracle queries, interaction overhead, or
    pass-rate gains.'
  - 'Key differences: evaluation targets span materials/chemistry endpoints, synthetic
    discovery benchmarks, ML engineering suites, deep research QA, and scientific
    explanation forecasting; feedback and reuse mechanisms, agent architectures, and
    validation strength also differ.'
  - 'Trend evolution: visible evidence is concentrated in 2026, so the apparent trend
    is within the current frontier: from single task accuracy toward longer-horizon
    closed-loop search, auditable held-out transfer, feedback-efficient surrogacy/experience
    reuse, and recursive planning.'
  - 'Open questions: generalization beyond tested endpoints and backbones, alignment
    of proxy metrics with real research utility, attribution of gains to planner/surrogate/skill/base
    model, cost-feedback trade-offs, and reproducibility gaps from missing code/data/limitations.'
  related_work_outline_zh:
  - 主流方向：构建闭环自主研究智能体，并在领域或公共基准上评估，重点包括反馈效率、可复用操作知识与经验、留出验证、递归或DAG规划。
  - 研究共性：在固定预算、下游基准分数和资源指标下，将所提出的智能体或反馈机制与固定基线或无技能/无反馈对照进行比较。
  - 关键差异：评测目标覆盖材料/化学端点、合成发现基准、ML工程套件、深度研究问答和科学解释预测；反馈与复用机制、智能体架构和验证强度不同。
  - 趋势演进：可见证据集中在2026年，趋势属于当前前沿内部：从单一任务精度走向更长程闭环搜索、可审计留出迁移、反馈高效代理/经验复用和递归规划。
  - 开放问题：跨端点和基座模型的泛化、代理指标与真实研究效用的一致性、增益归因、成本与反馈权衡，以及缺失代码/数据/局限性带来的可复现性缺口。
  literature_review:
    line_of_work_matrix:
    - line: Closed-loop experimental control and feedback-efficient search
      what_it_solves: Reduces expensive oracle or laboratory feedback during autonomous
        discovery and improves decision quality through surrogate repair, acquisition
        rules, or held-out transfer.
      what_remains_open: Generalization beyond limited domains such as ten Matbench
        endpoints or MADE is not established; fixed surrogate errors and infrastructure
        cost remain unresolved.
    - line: Experience and operational knowledge representation
      what_it_solves: Turns historical experimental trajectories or repository-level
        operational know-how into reusable experience libraries or verified skills,
        reducing interaction overhead and avoiding repeated costly trials.
      what_remains_open: Cross-task and cross-domain transfer, long-term value for
        real research utility, and coverage beyond the distilled repository set are
        not fully demonstrated.
    - line: Deep-research planning and recursive self-improvement
      what_it_solves: Improves long-horizon evidence gathering, constraint-wise verification,
        context compression, and credit assignment through recursive loops or DAG-based
        multi-agent planning.
      what_remains_open: Component-level attribution is unclear under sparse rewards;
        explicit limitations are missing, and benefits beyond tested open-source backbones
        and benchmarks need more evidence.
    - line: Evaluation protocols and predictive-credit measurement
      what_it_solves: Makes the added value of scientific explanations measurable
        through paired forecasts, preregistered checks, and controlled comparisons
        over outcomes such as Tox21 and OpenML.
      what_remains_open: The protocol's main credit decision is inconclusive, some
        preregistered tests are unmet, and sensitivity to donor context, forecaster,
        and resolution remains unresolved.
    - line: Benchmarked ML research agent systems
      what_it_solves: Evaluates research agents on standardized AI4AI-style benchmark
        tasks such as MLE-bench, PaperBench, FrontierCS, PassNet, GAIA, BrowseComp-Plus,
        and xbench-DeepSearch.
      what_remains_open: Reproducibility signals are uneven, long-horizon autonomous
        ML engineering evidence is sparse, and standardized external validation across
        hardware, datasets, and settings is absent.
    consensus:
    - Research agents are treated as closed-loop systems whose quality is not reducible
      to a single final score; evaluations also report query budgets, regret, interaction
      overhead, or relative benchmark gains.
    - Several works use fixed backbones, fixed execution budgets, no-skill/no-feedback
      baselines, frozen holdouts, or preregistered checks to isolate the proposed
      component from the underlying model.
    - Reuse and compression of prior knowledge, whether from code repositories, historical
      experiments, surrogate models, or accumulated context, is a common strategy
      to reduce expensive exploration.
    - 'Reproducibility evidence is incomplete across the packet: several papers lack
      explicit limitations, and code/dataset/artifact signals are weak or absent,
      making external verification uncertain.'
    disagreements:
    - 'Feedback and reuse mechanisms differ: sparse high-fidelity surrogate updates,
      historical experience libraries, repository-distilled skills, RL-based recursive
      self-improvement, and DAG-based planning make different assumptions about what
      should be learned or reused.'
    - 'Evaluation targets and metrics differ: some use domain MAE/accuracy or regret
      on materials and synthetic discovery tasks, others use ML engineering and deep
      research QA pass rates, and one uses preregistered forecast checks on Tox21/OpenML.'
    - 'Agent interaction modes differ: single skill-equipped agents, DAG multi-agent
      orchestration, recursive outer/inner loops, and closed-loop optimizers imply
      different credit assignment and context management.'
    - 'Claim strength differs: several methods report large positive relative gains,
      while one held-out intervention fails to remain best and the predictive-credit
      protocol remains inconclusive, so robustness claims are not uniform.'
    open_questions:
    - Which benchmark proxy best predicts real scientific or engineering utility for
      autonomous research agents?
    - Do reported gains generalize beyond the tested endpoints, benchmark suites,
      and open-source backbones without relying on task-specific priors?
    - How should budgets be allocated across expensive high-fidelity feedback, cheap
      surrogate/experience feedback, and verification or audit steps in long closed-loop
      searches?
    - How much does each component, such as planner, surrogate, skill library, experience
      library, or base model, independently contribute to final performance?
    - What minimal code, data, artifact, and limitation reporting would make these
      research-agent systems externally reproducible and comparable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 闭环实验控制与反馈高效搜索
      解决的问题: 在自主发现过程中减少昂贵的oracle或实验室反馈，通过代理修复、采集规则或留出迁移提升决策质量。
      尚未覆盖: 泛化性局限于十个Matbench端点或MADE等有限域；固定代理误差和基础设施成本仍未解决。
    - 路线: 经验与操作知识表示
      解决的问题: 把历史实验轨迹或代码仓库中的操作知识提炼为可复用经验库或已验证技能，降低交互开销并避免重复昂贵试验。
      尚未覆盖: 跨任务、跨领域迁移，以及技能/经验库对真实研究效用的长期价值尚未充分证明。
    - 路线: 深度研究规划与递归自改进
      解决的问题: 通过递归循环或DAG多智能体规划，改善长程证据收集、约束核查、上下文压缩与信用分配。
      尚未覆盖: 稀疏奖励下组件级归因不清；缺少显式局限性，且超出已测开源基座和基准的收益证据不足。
    - 路线: 评测协议与预测信用测量
      解决的问题: 通过配对预测、预注册检查和Tox21/OpenML等受控结果，衡量科学解释对实验预测的额外价值。
      尚未覆盖: 协议的主要结论无定论，部分预注册测试未满足，且对捐赠上下文、预测器和分辨率敏感。
    - 路线: 研究智能体系统基准
      解决的问题: 在MLE-bench、PaperBench、FrontierCS、PassNet、GAIA、BrowseComp-Plus、xbench-DeepSearch等标准化任务上评估研究智能体。
      尚未覆盖: 可复现信号不均衡，长时程自主ML工程证据稀缺，且缺少跨硬件、数据集和设置的标准化外部验证。
    共识:
    - 研究智能体被视作闭环系统，其质量不能只看单一最终分数；评估同时报告查询预算、后悔值、交互开销或相对基准增益。
    - 多项工作采用固定基座、固定执行预算、无技能/无反馈基线、冻结留出或预注册检查，以隔离所提组件与基座模型的作用。
    - 从代码仓库、历史实验、代理模型或累积上下文中复用和压缩已有知识，是降低昂贵探索的常见策略。
    - 证据包中可复现性不完整：若干部论文缺少显式局限性，代码/数据/工件信号较弱或缺失，使外部验证不确定。
    分歧:
    - 反馈与复用机制不同：稀疏高保真代理更新、历史经验库、仓库提炼技能、RL递归自改进和DAG规划对应该学习或复用什么的假设不同。
    - 评测目标与指标不同：有的用领域MAE/准确率或后悔值，有的用ML工程和深度研究问答通过率，还有的用Tox21/OpenML上的预注册预测核对。
    - 智能体交互方式不同：技能增强单智能体、DAG多智能体编排、递归内外循环和闭环优化器，意味着不同的信用分配和上下文管理。
    - 结论强度不同：多数方法报告显著提升，但一个留出干预未能保持最优，预测信用协议也无定论，因此鲁棒性主张并不一致。
    开放问题:
    - 哪类基准指标最能预测自主研究智能体的真实科研或工程效用？
    - 报告增益是否能跨端点、跨基准套件和跨开源基座泛化，而不依赖任务特定先验？
    - 在长程闭环搜索中，应如何在昂贵高保真反馈、廉价代理/经验反馈与验证审计之间分配预算？
    - 规划器、代理模型、技能库、经验库和基座模型各自对最终性能的独立贡献如何分离？
    - 怎样的最小代码、数据、工件和局限性报告，才能使这些研究智能体系统具备可复现性和外部可比性？
