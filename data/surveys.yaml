  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation, for example
        The AI Scientist
      what_it_solves: Compressing the full scientific workflow from idea to code,
        experiments, visualization, and paper into an agentic pipeline.
      what_remains_open: Consistency across domains and publication levels remains
        under-evidenced; most support is workshop-level acceptance or internal rubric
        scoring.
    - line: Verification and grounded reporting in research writing
      what_it_solves: Reducing hallucinated numbers, citations, and invalid physical
        or logical results before they enter manuscripts.
      what_remains_open: False-negative verification errors and transfer beyond the
        specific validation modality, such as visual flow inspection or logical proof
        audit.
    - line: Failure attribution and self-correction for experiment pipelines
      what_it_solves: Diagnosing why an autonomous research run fails and routing
        corrective action to hypothesis, experimental design, or implementation.
      what_remains_open: Whether attributed root causes align with human causal judgment
        and demonstrably improve final written output quality.
    - line: Human-AI collaboration placement in research generation
      what_it_solves: Identifying high-leverage human interventions that improve autonomous
        research quality without requiring step-by-step oversight.
      what_remains_open: Optimal intervention modes across tasks, cost budgets, scientific
        domains, and maturity levels are not standardized.
    - line: Evaluation and review of AI-generated scientific communication
      what_it_solves: Making generated papers comparable through automated reviewers,
        benchmark performance, and peer-review outcomes.
      what_remains_open: Standardized external validation is missing, and agreement
        between proxy metrics and real community acceptance is unresolved.
    consensus:
    - Multiple systems decompose research writing into idea generation, code or experiment
      execution, verification, result analysis, and manuscript drafting.
    - There is broad agreement that raw end-to-end generation alone is insufficient;
      some verification, reviewer, or reporting gate is needed to constrain invalid
      or fabricated claims.
    - Human input is treated as a practical quality lever, whether as a principal
      investigator-style collaborator, targeted intervention, or peer reviewer.
    - The evidence shifts paper generation from an isolated drafting task into one
      stage of an autonomous scientific discovery loop.
    disagreements:
