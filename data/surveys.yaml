    研究路线矩阵:
    - 路线: 端到端自主实验流水线
      解决的问题: 覆盖从假设或想法生成、代码执行、实验运行、分析到论文或报告撰写的完整循环。
      尚未覆盖: 验证主要靠LLM评审或工作坊同行评审；完整会议级、实验室级可靠性和校准仍缺乏证据。
    - 路线: 多智能体编排与人机协同实验管理
      解决的问题: 协调角色、监控运行、回滚或恢复实验，连接本地代码与工件，并支持验证或自我改进。
      尚未覆盖: 证据限于少量内部案例或AI和数学任务；规模化、外部可复现和真实实验室集成尚不成熟。
    - 路线: 面向端到端发现的虚拟评估环境
      解决的问题: 提供可复用模拟任务和自动指标，评估假设形成、实验设计、分析和结论驱动行动。
      尚未覆盖: 强基线智能体在多数任务上困难；代理指标和有限覆盖使真实科学效用仍不确定。
    - 路线: 自动消融与实验设计规划
      解决的问题: 评估模型从方法部分提出消融组合，或在完整论文中识别缺失消融的能力。
      尚未覆盖: 最佳LM系统平均仅召回约45%的原始消融，且作者任务与审稿人任务表现不一致。
    - 路线: 失败感知记忆与迭代实验复用
      解决的问题: 将失败尝试记录为类型化负知识，让下游研究智能体在提出下一次实验前采纳或拒绝这些记录。
      尚未覆盖: 在ScienceAgentBench和PDE任务上得到验证；跨领域迁移和长期记忆质量控制仍开放。
    共识:
    - 主流做法是把科学工作流拆解为想法或假设生成、实验执行、分析和撰写等阶段，并以模块或角色协同实现。
    - 由于可扩展的人工评审稀缺，普遍采用LLM评分、评审标准或AI专家评审来评估生成研究质量。
    - 验证、评审反馈、失败记忆或树搜索等迭代反馈被视为提升自主实验质量的关键机制。
    - 引入基准和虚拟环境是因为现有任务设置无法充分暴露长周期发现挑战。
    - 当前系统在消融规划和部分长周期发现任务上仍低于人类水平。
    分歧:
    - 研究范围不同：端到端研究生成、窄消融或实验规划、或模拟发现环境中的任务执行。
    - 评测目标不同：LLM评分论文质量、同行评审接受、虚拟任务完成度、或人类与AI专家案例偏好。
    - 交互模式不同：全自动流水线、人机协同可定制角色、或人类首席研究员与智能体协作。
    - 搜索与规划机制不同：智能体树搜索加实验管理器、失败感知负记忆、思维链提示、或多智能体验证。
    - 部署领域不同：应用数学、机器学习子领域、模拟科学主题、内部AI案例和PDE任务，带来不同泛化假设。
    开放问题:
    - 这些系统能否在LLM评审或工作坊级设置之外稳定通过严格同行评审？
    - 失败记录和负知识能否跨科学领域和实验模态迁移，而不依赖任务特定整理？
    - LLM评审、任务完成指标和专家偏好是否与真实科学有效性、可复现性和决策效用一致？
    - 当前证据中缺少哪些代码、数据集、工件、基线和局限性细节，这些缺口如何影响可比性？
    - 为什么前沿LM在消融规划和发现完成上低于人类，哪种规划或反馈机制能缩小差距？
    - 模拟或代码环境中的自动实验能否迁移到实验室和真实世界的实验设计与监控？
