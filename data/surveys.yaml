  related_work_outline_zh:
  - 主流方向：端到端多智能体AI科学家系统，将文献构思、代码执行、实验、验证和自动评审耦合起来，生成完整论文；写作被视为验证后结果的下游输出。
  - 研究共性：生成论文常用LLM评审标准、模拟评审或工作坊同行评审来评价；系统越来越多加入验证门控和基于实测的约束报告，以抑制幻觉数据或无效主张。
  - 关键差异：监督程度、验证目标和评测设置不同；完全自主与精准人类干预并存，验证覆盖逻辑/数学证明、物理视觉场或ML执行成功，评测从评分表到基准再到同行评审。
  - 趋势演进：2024年出现通用自主发现框架，2025年达到工作坊级同行评审接收，2026年转向专业领域与自纠正系统；重心从“能生成”转向“可验证、可复现、可审查”。
  - 开放问题：LLM评审与人类同行评审是否校准、领域特定验证能否泛化、全自动论文能否达到完整会议质量，以及基准提升是否反映真实科学贡献仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous manuscript generation
      what_it_solves: Combines ideation, code generation, experiments, visualization,
        and full paper drafting into a single agentic workflow, lowering per-paper
        cost and reducing dependence on manual writing.
      what_remains_open: Consistency across runs and disciplines; evidence is limited
        to workshop-level or rubric-based acceptance, not full conference publication,
        and full autonomy remains unreliable.
    - line: Verification-gated scientific writing
      what_it_solves: Adds domain-aware checks before accepting results or prose,
        such as logical proof auditing in mathematics or vision-language inspection
        of rendered flow fields.
      what_remains_open: Gates still miss some planted silent failures, and generalization
        beyond the demonstrated domains has not been shown; error-detection coverage
        is a verification gap.
    - line: Human-AI collaborative research and reporting
      what_it_solves: Places humans at high-leverage decision points or as principal
        investigators, improving benchmark outcomes and reducing failure modes from
        full autonomy.
      what_remains_open: Optimal intervention modes are not established across tasks,
        and the available evidence comes mainly from a single benchmark and case studies.
    - line: Self-correcting failure attribution and grounded reporting
      what_it_solves: Diagnoses failed experiments through multiple hypotheses and
        constrains drafted results to measured values, increasing metrics-bearing
        outputs and artifact quality.
      what_remains_open: Gains concentrate in execution and code development, while
        fully autonomous, conference-ready scientific writing remains unsolved; final
        prose quality is not fully evaluated.
    - line: Automated review and evaluation of generated manuscripts
      what_it_solves: Provides inexpensive simulation of peer review to evaluate generated
        papers, enabling iterative improvement before human submission.
      what_remains_open: Proxy reviewer calibration to human peer review is incomplete,
        and acceptance by automated or workshop review does not yet guarantee reproducibility
        or long-term scientific value.
    consensus:
    - Scientific writing is approached as part of an agentic research pipeline rather
      than isolated text generation.
    - Generated claims benefit from some form of verification, grounded reporting,
      or reviewer feedback to reduce hallucinated results and invalid conclusions.
    - Full autonomy remains inconsistent; either multiple attempts, targeted human
      collaboration, or domain-specific gates improve outcomes.
    - LLM-based review rubrics or simulated peer review are common evaluation tools,
      but current evidence mainly supports workshop-level or benchmark-level claims.
    disagreements:
    - Degree of human oversight ranges from end-to-end autonomy to principal-investigator-style
      or high-leverage intervention, with different assumptions about when human input
      is most useful.
    - 'Verification targets differ: some systems audit logical or theorem-level coherence,
      others inspect rendered physics fields, while others focus on ML execution success
      and code development.'
    - 'Reporting safeguards differ: grounded measurement constraints prevent fabricated
      numbers, verifiable citation checking targets hallucinated references, and reviewer
      feedback loops target presentation quality.'
    - Evaluation settings differ from curated LLM review rubrics, to benchmark blind
      scores and workshop peer review, making claims of success difficult to compare
      directly.
    open_questions:
    - How should automated reviewers and LLM rubrics be calibrated against human peer
      review for scientific writing and communication?
    - Can domain-specific verification gates, such as physics visual inspection or
      proof auditing, generalize across fields without missing silent failures?
    - What levels and modes of human intervention are sufficient to produce full conference-ready
      manuscripts while preserving autonomy?
    - Are generated manuscripts reproducible and grounded in real artifacts and citations
      beyond the reported benchmark or workshop evidence?
    - Does improved benchmark score or workshop acceptance indicate genuine scientific
      contribution rather than polished but shallow reporting?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主论文生成
      解决的问题: 将构思、代码生成、实验、可视化和完整论文起草整合到一个智能体工作流中，降低单篇论文成本并减少人工写作依赖。
      尚未覆盖: 运行一致性和跨学科泛化不足；现有证据主要限于工作坊级或评分表接收，尚未达到完整会议发表，完全自主仍不稳定。
    - 路线: 带验证门控的科学写作
      解决的问题: 在接受结果或正文前进行领域感知检查，例如数学证明逻辑审计或流场渲染的视觉-语言检查，以减少静默失败。
      尚未覆盖: 门控仍会遗漏部分植入静默失败；超出已展示领域后的泛化尚未证明，错误检测覆盖范围仍存在验证缺口。
    - 路线: 人机协作研究与报告
      解决的问题: 将人类置于高杠杆决策点或担任首席研究员，改善基准结果并减少完全自主的失败模式。
      尚未覆盖: 最优干预模式尚未在不同任务中确立；现有证据主要来自单一基准和案例研究。
    - 路线: 自纠正失败归因与基于事实的报告
      解决的问题: 通过多假设诊断失败实验，并将草稿结果约束为实测值，提高含指标输出和工件质量。
      尚未覆盖: 收益集中在代码开发和执行；完全自主、可提交会议的科学写作仍未解决，最终论文质量未被充分评估。
    - 路线: 自动评审与生成稿评价
      解决的问题: 提供低成本的同行评审模拟来评价生成论文，使系统能在提交人类前迭代改进。
      尚未覆盖: 代理评审与人类同行评审的校准尚不完整；自动或工作坊接收并不保证可复现性或长期科学价值。
    共识:
    - 科学写作被视为智能体研究流程的一部分，而不是孤立的文本生成。
    - 生成主张需要通过验证、基于事实的报告或评审反馈来减少幻觉结果和无效结论。
    - 完全自主仍不一致；多次尝试、精准人工协作或领域特定门控可以改善结果。
    - LLM评审标准或模拟同行评审是常用评价工具，但现有证据主要支持工作坊级或基准级结论。
    分歧:
    - 人类监督程度不同，从端到端自主到首席研究员式或高杠杆干预，对何时需要人工输入的假设不同。
    - 验证目标不同：有的系统审计逻辑或定理级一致性，有的检查渲染物理场，有的关注ML执行成功和代码开发。
    - 报告保障方式不同：基于实测约束防止数字造假，可验证引用检查针对幻觉参考文献，评审反馈循环则针对展示质量。
    - 评测设置不同，从人工LLM评审标准到基准盲评和工作坊同行评审，使成功声明难以直接比较。
    开放问题:
    - 自动评审和LLM评分表应如何针对科学写作与交流的人类同行评审进行校准？
    - 领域特定验证门控（如物理视觉检查或证明审计）能否在跨领域中泛化而不遗漏静默失败？
    - 何种水平和模式的人类干预足以生成完整会议级论文，同时保持自主性？
    - 在已报告的基准或工作坊证据之外，生成论文是否可复现并基于真实工件和引用？
    - 基准分数或工作坊接收是否意味着真正的科学贡献，而不仅仅是流畅但浅层的报告？
