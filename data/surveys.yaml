  related_work_outline:
  - 'Mainstream direction: Building end-to-end automated research pipelines that use
    large language models to generate hypotheses, design and execute experiments,
    analyze results, and produce full manuscripts with minimal human intervention.'
  - 'Shared research pattern: Most works adopt a multi-agent or agentic workflow where
    specialized modules handle planning, coding, evaluation, and knowledge retrieval,
    often with an internal feedback loop for self-correction.'
  - 'Key differences: Systems differ in the degree of human involvement (fully autonomous
    vs. human-in-the-loop PI-student collaboration), the use of persistent memory
    of failures (negative knowledge), the scope of target domains (theoretical math
    vs. ML experiments vs. general science), and evaluation strategy (internal LLM
    judges vs. external benchmark environments vs. real peer review).'
  - 'Trend evolution: Between 2024 and 2026, the topic moved from single large-model
    frameworks towards agentic tree search, multi-agent platforms, and memory-augmented
    architectures, along with a shift from self-contained LLM evaluation to real workshop
    submissions and standardized benchmarks for scientific discovery tasks.'
  - 'Open questions: Whether fully automated systems can consistently produce work
    that passes rigorous human peer review; how to verify the correctness and reproducibility
    of agent-executed experiments; and whether current benchmarks capture the open-ended
    nature of real scientific discovery.'
  related_work_outline_zh:
  - 主流方向：构建端到端的自动化研究流程，利用大型语言模型生成假设、设计并执行实验、分析结果并以最少人工干预生成完整论文。
  - 研究共性：多数工作采用多智能体或智能体工作流，由专门模块负责规划、编码、审核和知识检索，并常包含内部反馈循环用于自我纠错。
  - 关键差异：系统在人机协作程度（全自动 vs. 首席研究员-研究生式人机协同）、对失败经验的持久记忆（负知识）、目标领域范围（理论数学 vs. ML实验 vs.
