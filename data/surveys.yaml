    outside the original experimental sandbox.'
  related_work_outline_zh:
  - 主流方向：构建端到端基于LLM的自主研究智能体，覆盖从想法生成到论文撰写的完整科学工作流，并日益重视通过基准测试、失败诊断和验证门控来提升可靠性。
  - 研究共性：所有系统都将研究过程分解为智能体流水线，依赖LLM推理和代码执行，并普遍需要外部验证层（无论是自动评审、人类基线还是基于任务的指标）来使主张可比。
  - 关键差异：主要分歧在于通用框架（AI Scientist, Claw AI Lab）与领域专用智能体（AI CFD Scientist, BAISBench）之间；另一分歧在于如何处理失败——事后分析失败模式与通过多假设归因进行主动自我纠正；评估目标也不同，从自动评审分数到专家人类判断和物理验证不等。
  - 趋势演进：2024年的早期工作建立了基本的端到端流水线和通用基准（DISCOVERYWORLD）。到2025–2026年，重点转向更复杂的多智能体架构、领域驱动的指标以及显式的可靠性机制，如视觉-语言物理门控、失败归因和基于事实的报告，表明从概念验证向治理导向的评估演进。
