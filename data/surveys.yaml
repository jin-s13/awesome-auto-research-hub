  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous experiment agents
      what_it_solves: Automating hypothesis or idea generation, code writing, experiment
        execution, result analysis, and manuscript drafting as one loop.
      what_remains_open: Reliability beyond LLM-judged or isolated workshop acceptance,
        and separating genuine research insight from engineering improvements.
    - line: Simulated and benchmark-based evaluation environments
      what_it_solves: Providing repeatable tasks and metrics for complete discovery
        cycles or scientific ML improvement under comparable conditions.
      what_remains_open: Whether proxy task completion, leaderboard gains, or simulated
        discovery capture real scientific utility and transfer to lab or field settings.
    - line: Failure-aware memory and self-improvement
      what_it_solves: Converting failed attempts into reusable negative knowledge
        to guide later experiments and avoid repeated mistakes across tasks.
      what_remains_open: Evidence is limited to retry settings and PDE-style scientific
        tasks; transfer to broader experiment types is not shown.
    - line: Multi-agent verification and orchestration with human oversight
      what_it_solves: Decomposing research work into planning, verification, retrieval,
        monitoring, and artifact inspection roles to reduce expert intervention while
        retaining control.
      what_remains_open: Most evidence comes from small internal case studies or LLM-based
        rubrics; external validation and mature control interfaces are missing.
    - line: In-the-wild scientific ML improvement agents
      what_it_solves: Assessing how frontier coding agents modify published best models
        across many domains, revealing where gains and failure modes occur.
      what_remains_open: Agents largely improve through ML-engineering tricks and
        resource under-utilization, so research-level domain insight remains undemonstrated.
    consensus:
    - Agents can cover multiple stages of experimentation, from idea or problem framing
      through code execution, result analysis, and write-up.
    - Closed-loop verification, review, or memory is treated as necessary to correct
      first-pass errors in autonomous research.
    - Evaluation remains heavily LLM-based, benchmark-based, or internal case-study
      based; no shared external standard for discovery quality is established.
    - Recent systems prefer decomposing the workflow into specialized agents or memory
      components over monolithic generation.
    disagreements:
    - 'Systems target different task types: virtual discovery tasks, scientific ML
      benchmark improvement, applied mathematics derivation, or full paper authoring.'
    - Human involvement ranges from fully automatic operation to a human PI, real-time
      dashboard, rollback/resume, and artifact inspection.
    - 'Success evidence differs: benchmark completion, improvements over published
      best models, LLM reviewer scores, or a single peer-reviewed workshop paper.'
    - 'Correction mechanisms differ: internal logical verification, negative knowledge
      memory, progressive tree search with an experiment manager, or plug-in skills.'
    open_questions:
    - How can evaluation separate novel research insight from ML-engineering tricks
      when benchmark gains are dominated by engineering changes?
    - Do simulated discovery tasks and automated or LLM reviewers predict real-world
      scientific acceptance or lab deployment value?
    - Can failure-aware memory and verification loops transfer beyond ScienceAgentBench
      and PDE tasks to more diverse experiment automation settings?
    - Is fully autonomous research robust enough for broader use when only one of
      three workshop submissions passed peer review and many limitations are unreported?
