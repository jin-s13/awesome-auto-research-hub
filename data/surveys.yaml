      尚未覆盖: 合成或单一领域任务能否代表真实科学发现，以及代理指标与真实发现效用的一致性
    - 路线: 人机协作与监督流程
      解决的问题: 在关键决策点接入专家判断，以兼顾自主性和结果可信度
      尚未覆盖: 最优干预粒度和时机仍不确定，尚未在多样任务中复现
    - 路线: 自动评审与论文生成
      解决的问题: 生成完整手稿，并通过LLM/VLM评审反馈进行迭代
      尚未覆盖: LLM评审分数与人类科学有效性、长期贡献或完整会议级接受之间的相关证据不足
    共识:
    - 自主研究系统通常将发现过程分解为提出假设、执行实验、分析、验证和写作几个阶段。
    - 验证和评审循环被视为产出可辩护结果的重要环节，但具体验证对象和实现方式因系统而异。
    - 当前评测主要依赖LLM/VLM评审、领域专用检查或基准成绩，缺少长期科学效用的外部验证。
    - 即使在称为全自动的系统中，人类专家仍常在领域判断、监督或关键干预中发挥作用。
    分歧:
    - 一些系统追求完全自主，而另一些提出在高杠杆决策点进行精准人工协作优于完全自主和逐步监督。
    - 验证方式不同：数学推理关注逻辑自洽，CFD模拟关注物理有效性，部分系统关注结果报告完整性，机器学习论文关注评审质量。
    - 评测环境差异大：合成发现环境、真实单细胞数据、领域模拟器和机器学习实验分别衡量不同能力。
    - 成功标准包括LLM评审分数、同行评审通过、虚拟任务完成度或领域指标提升，这些标准并不等价。
    开放问题:
