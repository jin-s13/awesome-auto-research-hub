  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and writing systems
      what_it_solves: Automates the full scientific pipeline—hypothesis generation,
        code execution, result visualization, and manuscript drafting—to reduce human
        effort in routine research and paper writing.
      what_remains_open: Reliability across diverse domains, consistent factual accuracy,
        and the ability to produce manuscripts that meet rigorous human peer-review
        standards without extensive human intervention.
    - line: Evaluation and quality assessment of generated papers
      what_it_solves: Provides metrics, automated reviewers, and benchmarks (e.g.,
        LLM-based rubrics, blind scoring, workshop acceptance thresholds) to measure
        the quality and completeness of AI-generated scientific writing.
      what_remains_open: Alignment between automated metrics and true scientific contribution;
        generalizability of evaluation methods beyond the specific ML subfields or
        curated benchmarks used in development.
    - line: Failure analysis and self-correction mechanisms
      what_it_solves: Identifies and classifies failure modes (e.g., implementation
        drift, hallucinated numbers, memory degradation) and designs self-correction
        strategies such as multi-hypothesis attribution or internal verification loops
        to improve research robustness.
      what_remains_open: Whether these mechanisms can prevent all critical failure
        types in open-ended scientific exploration; how to handle complex, multi-step
        failures that involve intertwined logical and experimental errors.
    - line: Human-AI collaboration modalities
      what_it_solves: Explores different intervention granularities (from full autonomy
        to step-by-step oversight) to leverage human expertise at high-leverage decision
        points while maintaining automation efficiency.
      what_remains_open: Optimal interaction design that balances cognitive load,
        scalability, and writing quality; empirical validation of which collaboration
        mode benefits which type of scientific writing task.
    consensus:
    - Large language models can generate coherent research papers when combined with
      code execution environments and automated review loops.
    - Automated verification—whether through logic checks, physical simulations, or
      fact grounding—is essential to reduce hallucinated or fabricated results in
      generated manuscripts.
    - Current systems still frequently fail in long-horizon tasks, requiring either
      human intervention or iterative self-correction to produce defensible scientific
      output.
    - Workshop-level acceptance is emerging as a meaningful milestone, but conference-ready
      autonomous paper generation remains an unsolved challenge.
    disagreements:
    - 'The appropriate degree of autonomy: some works advocate fully autonomous pipelines
      (AI Scientist line), while others demonstrate that targeted human collaboration
      at key decision points outperforms both full autonomy and exhaustive oversight
      (AutoResearchClaw).'
    - 'The nature of verification: approaches range from internal logical coherence
      auditing (ReasFlow) and physics-based vision gates (AI CFD Scientist) to fact-grounded
      report generation that constrains claims to measured values (SAGE).'
    - 'The role of failure handling: some systems use a single-stage reflection loop,
      whereas SAGE proposes a multi-hypothesis causal attribution that deterministically
      routes corrections to the correct pipeline stage, implying a divergence in assumed
      failure complexity.'
    - 'Domain specificity: general machine learning frameworks (AI Scientist) assume
      broad applicability, while domain-specific agents (ReasFlow for applied math,
      AI CFD Scientist for fluid dynamics) argue that deep verification requires domain-aware
      gates and knowledge retrieval.'
    open_questions:
    - What verification methods can guarantee that an AI-generated paper contains
      no fabricated experimental data or hallucinated citations in open-ended scientific
      tasks?
    - How can we build evaluation benchmarks that measure the true scientific contribution
      of an AI-written paper, beyond surface-level writing quality and metric-bearing
      output?
    - What is the upper bound on self-correction when the underlying model lacks domain
      intelligence or scientific taste, and how can human feedback be integrated without
      becoming a bottleneck?
    - Can the design principles derived from failure analyses (e.g., Why LLMs Aren't
      Scientists Yet) be systematically translated into architectural constraints
      that prevent the most common failure modes?
