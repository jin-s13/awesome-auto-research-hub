  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research systems
      what_it_solves: Turning language-model research capabilities into executable
        discovery loops that include hypothesis generation, code execution, manuscript
        writing, and sometimes review feedback.
      what_remains_open: External validation is not standardized; some systems are
        tested only on small internal case studies or workshop-level submissions,
        and consistency across attempts is unresolved.
    - line: Evidence-centered evaluation and benchmark design
      what_it_solves: Making discovery agents comparable through tasks, metrics, blind
        data, human baselines, or fixed LLM judges that assess evidentiary maturity
        rather than only task completion.
      what_remains_open: Proxy metrics have not been shown to align with real scientific
        utility; reported results may be limited by a single frozen base model, narrow
        task coverage, or lack of statistically reliable separation.
    - line: Domain-aware verification and reliability gating
      what_it_solves: Grounding automated discovery in domain constraints, such as
        physics-aware visual checks, to catch silent failures that ordinary solver
        or execution checks miss.
      what_remains_open: The verification gate can still miss planted silent failures,
        and its applicability across domains or problem settings is not established
        from the available evidence.
    consensus:
    - 'Scientific discovery is treated as an inspectable loop: question formation,
      experiment execution, result interpretation, and written claim.'
    - Current agents can execute and document analyses competently, but they plateau
      on trustworthiness dimensions such as controls, robustness, falsifiability,
      and generalization.
    - Text generation or task completion alone is not accepted as sufficient for scientific
      claims; evidence maturity, validity gates, human baselines, or peer review are
      introduced as additional checks.
    - Open-source code and artifacts are common enabling conditions, but the evidence
      does not show they alone guarantee reliable scientific claims.
    disagreements:
    - 'Evaluation settings differ: some use simulated virtual tasks, while others
      use real domain data such as single-cell transcriptomics or CFD simulations.'
    - 'Supervision signals differ: domain-specific visual verification gates, fixed
      LLM evidence judges, graduate human baselines, or workshop peer review.'
    - Some systems optimize fully autonomous manuscript generation, while benchmarks
      focus on separating competent execution from scientifically defensible claims.
    - Coverage ranges from broad virtual task suites to narrow internal case studies,
      with no shared external validation set.
    open_questions:
    - Can automated judges provide statistically reliable separation and align with
      human peer review across different base models?
    - What additional checks are needed when domain-aware verification gates miss
      planted silent failures?
    - Do evidence-maturity scores predict real scientific utility, or only internal
      benchmark performance?
    - Can these systems generalize beyond one domain, one frozen base model, or a
      few internal case studies?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究系统
      解决的问题: 把大模型研究能力转化为可执行的发现循环，包括假设生成、代码运行、论文撰写以及可能的评审反馈。
      尚未覆盖: 外部验证缺乏统一标准；部分系统仅在小规模内部案例或工作坊级别验证，多次尝试的一致性仍不明确。
    - 路线: 以证据为中心的基准与评测设计
      解决的问题: 通过任务、指标、盲测数据、人类基线或固定LLM裁判，让科学发现智能体在证据成熟度上可比较，而不只看任务完成。
      尚未覆盖: 代理指标与真实科学效用的对齐尚未验证；结果可能受单一冻结基座模型、任务覆盖窄或统计不可靠区分限制。
    - 路线: 领域感知验证与可靠性门控
      解决的问题: 用物理或领域约束检查自动发现结果，例如物理感知视觉门控，以捕获普通执行检查遗漏的静默失败。
      尚未覆盖: 验证门控仍会漏检植入的静默失败；其跨领域或跨问题设置的适用性尚未从现有证据中确立。
    共识:
