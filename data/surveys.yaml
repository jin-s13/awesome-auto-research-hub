  related_work_outline_zh:
  - 主流方向：以 The AI Scientist 及其领域化后继为代表的端到端 LLM 研究智能体，自主完成提出想法、执行实验、分析结果和撰写论文。
  - 研究共性：多数系统将科学发现拆为想法生成、实验执行、分析、论文撰写，并通过内部验证或外部基准/评审信号增强可检查性。
