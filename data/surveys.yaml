    - 证据约束和迭代改进是否能在精选CS/LLM主题、大规模论文集合和有限全文访问的领域之外保持有效？
    - 哪些缺失的复现信号——代码、数据集、指标、基线和局限性说明——对独立验证综述生成声明最为关键？
