    - 路线: 智能体实验规划、执行与记忆
      解决的问题: 通过树搜索、失败感知记忆和经过整理的负知识提升实验决策的质量和效率，使智能体能避免重复错误并解决更困难的任务。
      尚未覆盖: 这些机制能否扩展到多样化的科学模态，以及观察到的增益有多少来自更好的规划，而不是更强的基座模型或任务特定的提示。
    - 路线: 自动化发现基准与评估环境
      解决的问题: 提供标准化任务和指标，衡量智能体形成假设、设计消融、运行实验和解释结果的能力，使不同系统之间的比较成为可能。
      尚未覆盖: 代理指标（任务完成率、LLM评分）与真实科学进展之间的对齐程度；对长尾科学领域和超越预定义任务的开放式发现的覆盖范围。
    共识:
    - 大型语言模型是自动化科学工作流的核心推理引擎，无论是作为单一主干还是在多智能体系统中。
    - 自动化流程通常包含假设形成、实验执行和结果综合等模块，并常带有用于迭代改进的反馈循环。
    - 评估仍是一个公认的瓶颈：工作要么依赖基于LLM的评判器、受控的模拟环境，要么依赖真实（工作坊级别）的同行评审来验证输出。
    分歧:
    - 人类参与程度不同：从完全自主、旨在消除人工模板的系统，到人类担任首席研究员、智能体扮演研究生角色的协作框架。
    - 评估理念不同：一些系统使用自定义的LLM评审标准进行内部评估，另一些使用外部基准如DISCOVERYWORLD或AblationBench，还有一项工作以真实同行评审接受为目标。
    - 领域特异性从聚焦于应用数学中的理论推理，到覆盖通用机器学习子领域，鲜有证据表明单一系统能在这些不同科学文化中同样良好地工作。
    开放问题:
    - 自动化实验系统如何在不依赖详尽人工验证的情况下保证生成代码和实验结果的正确性？
    - 对于一个超越脚本化任务的开放式科学发现，什么样的基准才能成为社区公认的有效基准？
    - 这些系统的性能在多大程度上依赖于底层语言模型的能力，而非智能体工作流的设计，我们如何消融这些因素？
