  related_work_outline:
  - 'Mainstream direction: Autonomous multi-agent systems that propose hypotheses,
    execute experiments or formal checks, and report validated results dominate; they
    are instantiated for CFD, biology, causal inference, and general agentic science.'
  - 'Shared research pattern: Ideation from literature or structured debate feeds
    execution loops with self-healing, verification, or proof checking; reporting
    is constrained to measured or machine-checked outputs and compared with baselines
    such as AI Scientist v2 or human experts.'
  - 'Key differences: Verification mechanisms range from vision-language physics gates
    and formal Lean proofs to factual reporting constraints and multi-hypothesis failure
    attribution; systems also differ in domain specificity, human intervention granularity,
    and evaluation strength.'
  - 'Trend evolution: Within the 2025–2026 frontier, work moves from broad surveys
    and single-domain benchmarks toward self-correcting, self-evolving, verifiable
    multi-agent frameworks with targeted human oversight at high-leverage decisions.'
  - 'Open questions: Open issues include verification gate false-negative rates, generalization
    beyond small case studies, separation of ideation quality from execution quality,
    formalization-to-claim gaps, and ethics/reliability of autonomous research.'
  related_work_outline_zh:
  - 主流方向：以自主多智能体系统为主，提出假设并执行实验或形式化检查，再报告经过验证的结果；覆盖CFD、生物学、因果推断和通用智能体科学。
  - 研究共性：从文献或结构化辩论产生想法，再进入自愈执行、验证或证明检查；报告被限制在实测或机器检查输出上，并与AI Scientist v2或人类专家等基线比较。
  - 关键差异：验证机制包括视觉-语言物理门控、Lean形式化证明、事实性报告约束和多假设失败归因；领域专一性、人类介入粒度和评估证据强度也不同。
  - 趋势演进：在2025–2026当前前沿内，工作从广泛综述和单领域基准转向自纠正、自演化、可验证的多智能体框架，并在高杠杆决策点引入精准人类监督。
  - 开放问题：验证门控漏报率、小规模案例研究的泛化、想法质量与执行质量分离、形式化到科学主张的语义差距，以及自主研究的伦理与可靠性。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous multi-agent research pipelines
      what_it_solves: End-to-end hypothesis generation, experiment execution, self-healing,
        and reporting for research tasks
      what_remains_open: Whether benchmark gains reflect ideation quality rather than
        execution, code harness, or base-model capability
    - line: Domain-specific AI scientist systems with embedded verification
      what_it_solves: Grounding candidate hypotheses in physical or formal validity
        checks before accepting results
      what_remains_open: Generalization of verification beyond planted failures and
        narrow domains; false-negative and false-positive boundaries
    - line: Benchmarks and human baseline evaluation for AI scientists
      what_it_solves: Standardized tasks, metrics, and human comparisons for cell
        annotation, discovery questions, and artifact quality
      what_remains_open: Coverage of open-ended scientific utility and agreement between
        benchmark performance and real discovery value
    - line: Self-evolving and domain-agnostic agent frameworks
      what_it_solves: Reusable ideation, self-critique, and knowledge accumulation
        across disciplines
      what_remains_open: Attribution of improvements to self-evolution versus task
        priors, base models, or scaffold design
    - line: Grounded reporting and failure attribution
      what_it_solves: Reducing hallucinated results and routing failures to hypothesis,
        design, or implementation levels
      what_remains_open: Fully autonomous scientific writing remains unsolved; formal
        proofs may not guarantee intended scientific claims
    - line: Survey and taxonomy of agentic scientific discovery
      what_it_solves: Organizing capabilities, metrics, frameworks, and challenges
        across domains
      what_remains_open: Direct empirical validation that proposed categories predict
        system reliability or discovery outcomes
    consensus:
    - Hypothesis generation must be coupled with execution, verification, and reporting
      loops to be useful for autonomous research.
    - Verification and grounded reporting reduce fabricated numbers, hallucinated
      citations, and invalid experimental claims.
    - Targeted human collaboration at high-leverage decision points outperforms both
      full autonomy and exhaustive step-by-step oversight.
    - Current AI scientists remain below fully autonomous scientific discovery but
      show substantial support potential.
    - Evaluation covers task success, artifact quality, metric-bearing outputs, benchmark
      scores, and human baseline comparisons.
    disagreements:
    - 'Verification type differs: physical vision-language inspection, formal machine-checked
      proof, factual output constraints, or multi-hypothesis failure attribution.'
    - 'Supervision and interaction differ: seven-mode human-in-the-loop collaboration,
      dashboard rollback/resume, targeted oversight, versus mostly autonomous loops
      with human inspection of artifacts.'
    - 'Deployment scope differs: domain-specific CFD, omics biology, or causal inference
      systems versus domain-agnostic evolving frameworks.'
    - 'Evaluation evidence differs: multi-topic benchmark ablations, small internal
      case studies with expert judges, or artifact-only assessments lacking quantitative
      metrics.'
    - 'Optimization target differs: physical discovery error reduction, benchmark
      score gains, artifact novelty and presentation quality, or proof-theoretic correctness.'
    open_questions:
    - How do verification gates perform beyond planted-failure ablations and small
      case studies?
    - Do benchmark gains reflect better hypothesis generation or stronger execution
      and base-model capability?
    - Can statement audits and formal proofs close the semantic gap between formal
      theorems and intended scientific claims?
    - What evaluation designs and human baselines can measure open-ended hypothesis
      quality rather than task completion?
    - How can autonomous research systems improve literature review automation, reliability,
      and ethical safeguards?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主多智能体研究流水线
      解决的问题: 端到端地生成假设、执行实验、自愈并报告研究任务
      尚未覆盖: 基准提升是否来自构思质量，而非执行、代码工具或基础模型能力
    - 路线: 带内置验证的领域专用AI科学家系统
      解决的问题: 在接受结果前，用物理或形式化有效性检查约束候选假设
      尚未覆盖: 验证在植入失败与狭窄领域之外是否泛化；漏报与误报边界不清
    - 路线: 面向AI科学家的基准与人类基线评测
      解决的问题: 为细胞注释、发现问题和工件质量提供标准化任务、指标和人类对比
      尚未覆盖: 开放科学效用的覆盖，以及基准表现与真实发现价值之间的一致性
    - 路线: 自演化与领域无关的智能体框架
      解决的问题: 跨学科复用构思、自我批判和知识积累能力
      尚未覆盖: 提升归因于自演化还是任务先验、基础模型或脚手架设计
    - 路线: 事实性报告与失败归因
      解决的问题: 减少幻觉结果，并将失败路由到假设、设计或实现层级
      尚未覆盖: 完全自主科学写作仍未解决；形式化证明不保证传达原始科学主张
    - 路线: 智能体科学发现的综述与分类
      解决的问题: 整理能力、指标、框架和跨领域挑战
      尚未覆盖: 这些分类能否预测系统可靠性或发现结果仍缺少直接实证验证
    共识:
    - 假设生成必须与执行、验证和报告回路耦合，才能真正用于自主研究。
    - 验证和事实性报告可减少编造数字、幻觉引用和无效实验主张。
    - 在高杠杆决策点进行精准人类协作优于完全自主和逐步穷尽监督。
    - 当前AI科学家尚未达到完全自主科学发现，但展示出辅助潜力。
    - 评估维度覆盖任务成功率、工件质量、带指标输出、基准分数和人类基线比较。
    分歧:
