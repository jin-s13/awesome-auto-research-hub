    研究路线矩阵:
    - 路线: 端到端自主科研智能体
      解决的问题: 将构思、代码或实验执行、结果分析、可视化和论文生成整合到单一自主工作流中，减少逐步人工控制。
      尚未覆盖: 多次运行的稳定性、超越演示领域的广度，以及达到完整会议级科学有效性而非孤立工作坊接受。
    - 路线: 领域感知验证门控发现
      解决的问题: 通过逻辑或理论验证、物理感知视觉检查等领域特定的有效性检查来减少静默失败。
      尚未覆盖: 验证门控仍会漏掉部分静默失败，领域特定假设未必能迁移到其他科学领域。
    - 路线: 证据锚定评测与基准环境
      解决的问题: 提供任务、冻结数据和指标，用于比较完整发现循环中的智能体，而非复现隐藏目标研究或仅依赖生成论文评审。
      尚未覆盖: 科学领域覆盖、跨基座模型泛化，以及代理指标与真实科学决策效用之间的一致性。
    - 路线: 自动评审与论文质量评估
      解决的问题: 通过模拟评审、基于LLM的评分标准或证据成熟度评分，在每次迭代中扩展对手稿的评估。
      尚未覆盖: 自动评审是否能把流畅文本与证据严谨性、新颖性和局限清晰度区分开，以及评分是否预示真实发现。
    共识:
    - 自主发现系统普遍将构思、执行、分析和写作串联，并通过自动评估或验证阶段判断输出质量。
    - 当前智能体在执行和记录分析方面相对较强，但在对照、稳健性、可证伪性和跨数据集泛化方面较弱。
    - 基准和自动评审被视为必要基础设施，因为真实同行评审和人工验证难以扩展到迭代式开放发现。
    分歧:
    - 评测目标不同：封闭虚拟发现任务、盲式证据锚定任务、基于LLM的论文评审或真实工作坊同行评审。
    - 验证策略不同：通用LLM或模拟评审，或内部逻辑验证、视觉语言物理合理性检查等领域特定验证。
    - 部署设置不同：通用机器学习研究工作流，或专用应用数学与计算流体动力学工具链。
    - 成功信号不同：任务完成和评分分数，或物理指标改进与同行评审接受。
    开放问题:
    - 哪些验证机制能跨领域泛化，并对未出现在人工植入消融中的静默失败保持有效？
    - 需要哪些额外脚手架，才能把较强的分析执行能力转化为包含对照、稳健性检查、可证伪假设和跨数据集泛化的可靠研究？
    - 如何在与人类同行评审对齐的自动评审中，避免把流畅的论文文本误当作证据成熟度？
    - 专用系统上的增益来自智能体设计、领域验证先验、基座模型能力还是工具访问？
