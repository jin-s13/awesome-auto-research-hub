  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery pipelines
      what_it_solves: Automating the full research cycle from hypothesis generation
        and experiment execution to paper writing, reducing per-paper cost and time.
      what_remains_open: Outputs are rarely validated by real peer review; systems
        struggle to generalize to theory-heavy domains and tend to produce hallucinated
        or unreliable claims.
    - line: Domain-specific verification and self-correction
      what_it_solves: Catching errors and hallucinations in the scientific process
        through internal logic checks, physics simulation inspection, or executable
        code tests.
      what_remains_open: Verification gates still miss domain-specific failures (e.g.,
        2/16 silent failures missed in CFD), and no general cross-domain verification
        framework exists.
    - line: Human–AI collaboration frameworks
      what_it_solves: Placing human experts at high-leverage decision points to improve
        reliability and steer the discovery process, while leveraging AI for search
        and generation.
      what_remains_open: Optimal intervention timing and mode remain unclear; studies
        are limited to small-scale ablations without large-scale real-world scientific
        deployment.
    - line: Benchmarking and evaluation environments
      what_it_solves: Providing standardized tasks and metrics to compare AI scientists
        and drive reproducible evaluation.
      what_remains_open: Current benchmarks (virtual environments, multiple-choice
        questions) do not capture the complexity of real scientific discovery, and
        the correlation between proxy metrics and real scientific utility is unvalidated.
    - line: Search and self-improvement strategies
      what_it_solves: Improving hypothesis space exploration and output quality via
        tree search, multi-agent debate, and cross-run evolution.
      what_remains_open: High computational cost; improvements are tightly coupled
        to the quality of the underlying verification signal, and there is no quantitative
        measure of discovery novelty.
    consensus:
    - All systems use large language models as the core reasoning and generation engine
      for scientific workflows.
    - Each incorporates an experimentation module that executes code or simulations
      and gathers results.
    - There is broad recognition that some form of verification or review is needed
      to catch errors and increase trustworthiness.
    - The final output is consistently a complete scientific manuscript, and cost
      per paper is measured as a practical metric.
    - Current systems remain brittle and face fundamental challenges in reliability
      and cross-domain generalization.
    disagreements:
    - 'Verification strategy: logic-based internal audit (ReasFlow) vs. physics-aware
      vision-language gate (AI CFD Scientist) vs. executable self-healing with pivot/refine
      (AutoResearchClaw).'
    - 'Automation stance: fully autonomous without human intervention (The AI Scientist,
      AI Scientist-v2) vs. structured human–AI collaboration with multiple intervention
      modes (AutoResearchClaw, ReasFlow).'
    - 'Evaluation anchor: LLM-based simulated review vs. real peer-review acceptance
      at a workshop vs. task completion on a benchmark (DISCOVERYWORLD, BAISBench,
      ARC-Bench).'
    - 'Domain scope: general machine learning (The AI Scientist and its v2) vs. specialized
      disciplines such as applied mathematics, computational fluid dynamics, and single-cell
      biology.'
    open_questions:
    - How can we build cross-domain verification gates that reliably catch subtle
      errors without requiring per-domain hand-engineering?
    - What is the optimal human–AI interaction protocol that maximizes scientific
      novelty while minimizing human cognitive load?
    - To what extent do current benchmarks and proxy metrics predict genuine scientific
      contributions or subsequent real-world impact?
    - How can AI scientists be extended to fields that require physical experiments,
      long-term empirical validation, or tacit hands-on skills?
    - What mechanisms could prevent the generation of plausible but meaningless studies
      and the pollution of the scientific record by low-quality automated papers?
