    - How can the reliability of verification gates be quantified and their false-negative
      rate reduced below operationally meaningful thresholds?
    - What are the failure boundaries of autonomous systems when faced with out-of-distribution
      tasks or data, and how can those boundaries be detected online?
    - How can long-horizon research agents maintain memory and context coherence to
      avoid cascading errors?
    - What is the causal effect of multi-agent role design and communication protocols
      on the final scientific quality of the output?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究系统基础设施
      解决的问题: 将LLM集成为可执行完整研究循环（想法生成、代码实现、实验执行、论文撰写）的智能体，减少人工干预。
      尚未覆盖: 跨领域泛化能力、长程任务中的记忆与上下文保真度、以及在不同条件下智能体生成实验的可重复性。
    - 路线: 科学发现智能体的基准与评测设计
      解决的问题: 提供标准化任务、难度级别和自动或人类评估指标，使自主研究智能体的性能可比较。
      尚未覆盖: 代理指标（任务完成度、评审分数）与真实科学影响力之间的对齐；基准任务覆盖度与真实研究多样性的差距。
    - 路线: 失败归因与可靠性提升
      解决的问题: 识别自主研究流水线中的重复失败模式，并通过结构化诊断或验证门控提高输出的可信度。
      尚未覆盖: 归因机制的因果验证；验证门控的残留漏检率（如16个静默失败中漏掉2个）；在复杂物理或生物领域的适用性。
    共识:
    - 当前基于LLM的智能体能够部分自动化研究流程，但完全端到端自主科学发现仍不稳定。
    - 自动评审或基于物理的验证等外部门控对于捕获明显错误是必要的，但现有门控仍会遗漏部分失败案例。
    - 标准化基准对衡量进展至关重要，但现有基准覆盖领域有限，且尚未保证与真实科学价值的对齐。
    - 自我纠正和多智能体协作是提升鲁棒性和输出质量的有前景方向。
    分歧:
    - 评估方法：有的依赖自动评审器评分，有的采用人类专家评判或真实同行评审，导致对可接受研究质量的判断标准不同。
    - 领域专用性：通用ML研究系统与嵌入了物理或生物先验的领域专用系统（如CFD、组学）在失败模式和泛化主张上难以直接比较。
    - 纠正深度：从简单反思循环到多假设因果失败归因，恢复过程的粒度和可解释性存在差距。
    - 交互模式：完全自主运行与提供可人工干预的交互式仪表板，导致对“自主”的定义和评测方式产生分歧。
    开放问题:
    - 何种跨领域统一基准既能衡量自主研究能力，又能预测真实科学效用？
    - 如何量化验证门控的可靠性，并将漏检率降低到操作上可接受的阈值以下？
    - 自主系统面对分布外任务或数据时的失败边界在哪里，如何在线检测这些边界？
    - 长程研究智能体如何维持记忆和上下文连贯性，避免级联错误？
    - 多智能体角色设计和通讯协议对最终科学质量的因果影响是什么？
