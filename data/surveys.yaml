    - line: Editor-integrated multi-agent writing and review assistants
      what_it_solves: Coordinates drafting, in-editor review, and editing to reduce
        authoring friction and improve paper quality.
      what_remains_open: Human-expert agreement, effect on author learning, and whether
        generated edits preserve technical soundness beyond the editor context.
    - line: Scholarly search and evidence acquisition agents
      what_it_solves: Provides comprehensive paper search and lineage-aware retrieval
        so authors or downstream agents can find and reuse relevant research.
      what_remains_open: Coverage under ambiguous queries, source authority verification,
        and integration with evidence-grounded writing remain unverified.
    - line: Automated peer review and soundness assessment
      what_it_solves: Trains AI reviewers to judge paper soundness, aiming to scale
        critical assessment of claims and methodology.
      what_remains_open: Calibration to expert reviews, fairness across fields, and
        whether proxy review scores predict real decision quality.
    - line: Reproduction and benchmarking of AI research replication
      what_it_solves: Tests AI ability to replicate research and automatically reproduce
        experiments from paper lineage.
      what_remains_open: Semantic equivalence of reproduced results, standardized
