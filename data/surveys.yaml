  literature_review:
    line_of_work_matrix:
    - line: Literature review generation workflows
      what_it_solves: Automates organizing, writing, editing, and reviewing a literature
        review through specialized or iterative agent roles, aiming for readable and
        citation-accurate output.
      what_remains_open: Generalization beyond evaluated datasets and baselines is
        not evidenced; several systems lack reported limitation details or code/dataset
        artifacts in the packet, leaving cross-system reproducibility a verification
        gap.
    - line: Literature database knowledge layers
      what_it_solves: Upgrades scientific literature databases into agent-accessible
        retrieval and evidence-extraction layers, enabling natural-language queries
        and evidence-supported responses.
      what_remains_open: Documented gains are tied to Europe PMC or specific biology/QA
        settings; coverage across other domains and standardized cross-domain validation
        remain unshown.
    - line: Integrated scientific agent orchestration
      what_it_solves: Frames automated scientific discovery as an integrated loop
        spanning hypothesis formation, experimentation, interpretation, and literature
        evidence, with component-level automation treated as the near-term target.
      what_remains_open: Full component integration remains unsolved, and the packet
        provides no quantitative discovery-level metric; the strongest claim is a
        2050 goal rather than an achieved result.
    - line: Reliability and adversarial evaluation
      what_it_solves: Assesses vulnerability or robustness of automated reviewing
        and nearby agent pipelines under adversarial text attacks or benchmark stress.
      what_remains_open: Adversarial robustness evidence is not yet connected to real-world
        review quality, expert acceptance, or decision utility; standardized evaluation
        across attacks and review outcomes is missing.
    consensus:
    - LLM-orchestrated agents are used to plan complementary subqueries, extract evidence,
      and synthesize outputs rather than relying on a single retrieval step.
    - Citation quality is a recurring evaluation target, measured through citation
      F1 or agreement with expert consensus.
    - Literature review automation is treated as an integration problem spanning retrieval,
      grounding, writing, and review, with component integration remaining a central
      challenge.
    disagreements:
    - 'System topology differs: single-LLM orchestration versus multi-agent role decomposition
      versus iterative or hierarchical organization.'
    - 'Output target differs: a database knowledge layer for downstream agents versus
      a complete review manuscript versus peer-review robustness.'
    - 'Evaluation settings differ: literature synthesis/claim verification/QA benchmarks,
      similarity to human-written reviews, and adversarial textual attacks are not
      directly comparable.'
    open_questions:
    - How do citation-precision improvements measured on specific benchmarks transfer
      to less curated or non-biomedical literature?
    - Which workflow choices beyond agent count and iteration depth contribute most
      to factual accuracy and readability?
    - What standardized protocol can compare evidence-grounded review generation with
      adversarial robustness and expert acceptance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 文献综述生成工作流
      解决的问题: 通过专用或迭代智能体角色自动完成文献综述的组织、写作、编辑和审阅，目标是生成可读且引用准确的输出。
