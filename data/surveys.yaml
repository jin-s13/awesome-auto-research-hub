  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研工作流（如 The AI Scientist、AI Scientist-v2）
      解决的问题: 自动完成创意生成、实验执行、可视化、分析和论文撰写，并用自动评审过滤低质量成果。
