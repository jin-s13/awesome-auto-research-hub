  related_work_outline:
  - 'Mainstream direction: autonomous multi-agent scientific workflows that couple
    literature synthesis, retrieval, verification, experimentation, and manuscript
    generation, with parallel evidence-grounded evaluation benchmarks.'
  - 'Shared research pattern: systems retrieve or ground knowledge, generate claims
    or derivations, run verification and self-critique, then score outputs through
    LLM judges or human baselines.'
  - 'Key differences: works divide into generation-oriented assistants, blind evidence-maturity
    benchmarks, domain-specific evaluations, failure-case analyses, and self-evolving
    frameworks; they differ in interaction mode and evaluation target.'
  - 'Trend evolution: within 2025-2026, the frontier moves from surveys and early
    autonomous attempts toward reusable benchmarks and self-evolving frameworks, but
    evidence remains narrow.'
  - 'Open questions: literature review automation, LLM-judge alignment with peer review,
    cross-model/domain generalization, and trustworthy scientific claim criteria remain
    unresolved.'
  related_work_outline_zh:
  - 主流方向：构建自主多智能体科研工作流，整合文献综合、检索、验证、实验与论文生成，同时发展基于证据的评测基准。
  - 研究共性：系统普遍采用检索或证据 grounding、假设或推导生成、验证与自我批判，再用 LLM 评审或人类基线评分。
  - 关键差异：工作分为生成导向助手、盲测证据成熟度基准、领域特定评测、失败案例分析和自演化框架，交互模式与评测目标不同。
  - 趋势演进：2025-2026 年内，前沿从综述和早期自主尝试走向可复用基准与自演化框架，但证据仍较窄。
  - 开放问题：文献综述自动化、自动评判与同行评审一致性、跨模型和跨领域泛化、可信科学主张标准仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous literature and manuscript synthesis agents
      what_it_solves: retrieval, verification, and paper generation from minimal prompts
        for reasoning-heavy domains
      what_remains_open: evaluation relies mainly on LLM-based rubrics; independent
        peer validation and limitations are not reported
    - line: Evidence-grounded evaluation benchmarks for discovery agents
      what_it_solves: comparable blinded tasks and automated evidence-maturity scoring
        without reproducing hidden target studies
      what_remains_open: only one frozen base model is used; LLM-judge validity and
        cross-domain generalization remain unverified
    - line: Domain-specific scientific discovery benchmarks
      what_it_solves: human-referenced evaluation on real single-cell data for annotation
        and discovery-oriented questions
      what_remains_open: agents are still not fully autonomous; coverage is limited
        to one data type and multiple-choice format
    - line: Survey-based conceptual taxonomy of agentic science
      what_it_solves: organizing systems, metrics, frameworks, datasets, and challenges
        across scientific domains
      what_remains_open: literature review automation, reliability, and ethical concerns
        remain survey-level unresolved challenges
    - line: Failure analysis and design principles for autonomous research pipelines
      what_it_solves: identifying recurring failure modes and deriving guardrails
        from end-to-end autonomous research attempts
      what_remains_open: findings are case-based; systematic comparison across pipelines
        and domains is missing
    - line: Self-evolving domain-agnostic agent frameworks
      what_it_solves: scalable agentic science through iterative hypothesis refinement
        and knowledge accumulation
      what_remains_open: limitations are not reported; independent validation beyond
        reported benchmarks is needed
    consensus:
    - Multi-agent pipelines are the shared substrate for automated scientific reasoning
      and manuscript generation.
    - Evaluation is moving toward evidence-grounded, blinded tasks and automated rubric-based
      scoring.
    - Current systems assist human experts but have not demonstrated fully autonomous
      trustworthy discovery.
    - Literature review automation is repeatedly identified as a bottleneck or unresolved
      challenge.
    disagreements:
    - 'Evaluation target: open-ended evidence claims from frozen data versus domain-specific
      annotation or multiple-choice questions versus broad knowledge or coding benchmarks.'
    - 'Interaction mode: human-in-the-loop collaboration versus self-evolving autonomous
      loops versus benchmarked agents without interactive supervision.'
    - 'Evidence basis: fixed LLM judges and human baselines are used inconsistently;
      some works report no limitations or external validation.'
    - Deployment setting ranges from applied mathematics and single-cell biology to
      domain-agnostic machine learning and general scientific workflows.
    open_questions:
    - How can automated literature review and research gap discovery produce evidence-grounded
      claims without hallucinated or missing citations?
    - How well do LLM-based judges and rubrics align with human peer review for evidence
      maturity, novelty, and scientific taste?
    - Do self-evolving agent frameworks remain reliable across unseen base models,
      domains, and longer research horizons?
    - Which controls, robustness checks, and falsifiability criteria can separate
      trustworthy discovery from competent analysis execution?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主文献与手稿合成智能体
      解决的问题: 从最小提示出发，完成检索、验证和论文生成，面向推理密集领域
      尚未覆盖: 评测主要依赖 LLM 评分表；独立同行验证和局限未报告
    - 路线: 基于证据的发现智能体评测基准
      解决的问题: 通过盲任务和自动证据成熟度评分提供可比较评测，而不复现隐藏研究
      尚未覆盖: 仅使用一个冻结基座模型；LLM 评判有效性与跨域泛化未验证
    - 路线: 领域特定科研发现基准
      解决的问题: 在真实单细胞数据上提供带人类基线的注释和发现题评测
      尚未覆盖: 智能体仍非完全自主；仅覆盖单一数据类型和选择题形式
    - 路线: 智能体科学综述与概念分类
      解决的问题: 组织跨科学领域的系统、指标、框架、数据集与挑战
      尚未覆盖: 文献综述自动化、可靠性与伦理问题仍停留在综述层面未解决
    - 路线: 自主研究流水线失败分析
      解决的问题: 识别端到端科研智能体的重复失败模式并提炼设计原则
      尚未覆盖: 发现基于案例；缺少跨流水线与领域的系统比较
    - 路线: 自演化领域无关智能体框架
      解决的问题: 以迭代假设优化和知识积累实现可扩展智能体科研
      尚未覆盖: 未报告局限；需要在报告基准之外进行独立验证
    共识:
    - 多智能体流水线是自动化科研推理与论文生成的共同基础。
    - 评测正在转向基于证据的盲任务和自动评分表。
    - 当前系统可辅助人类专家，但尚未展示完全自主且可信的发现。
    - 文献综述自动化被反复识别为瓶颈或未解决挑战。
    分歧:
    - 评测目标：基于冻结数据的开放证据主张、领域特定注释或选择题、或广泛知识或编码基准。
    - 交互模式：人机协作、自演化自主循环、无交互基准评测并存。
    - 证据依据：LLM 裁判与人类基线使用不一致；部分工作未报告局限或外部验证。
    - 部署场景从应用数学、单细胞生物学到领域无关机器学习或通用科研工作流不等。
    开放问题:
    - 自动文献综述与研究差距发现如何生成有证据依据的主张，并避免幻觉或缺失引用？
    - LLM 裁判和评分表在证据成熟度、新颖性与科研品味上与同行评审一致性如何？
    - 自演化智能体框架在未知基座模型、领域和更长科研周期中是否稳定？
    - 哪些对照、稳健性检查与可证伪性标准能区分可信发现与仅执行分析？
