    - Do current benchmark scores transfer to real decision utility in messy, cross-domain
      or out-of-distribution research settings?
    - How stable are agent rankings and evidence-maturity scores across base models,
      datasets, and repeated runs?
    - What governance, safety, and human-oversight criteria should be attached to
      autonomous research workflows, and how can they be benchmarked without becoming
      another proxy?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动化发现智能体架构与端到端流水线
