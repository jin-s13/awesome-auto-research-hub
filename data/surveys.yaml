      解决的问题: 引入逻辑或物理感知有效性门控，在主张写入之前捕获推导和仿真中的静默错误。
      尚未覆盖: 验证门控仍会漏过失败模式，且仅在狭窄领域得到展示；向其他学科和硬件迁移未验证。
    - 路线: 虚拟环境与证据锚定基准
      解决的问题: 提供可复现任务集和盲证据任务，比较智能体在探索、实验设计和证据成熟度上的表现。
      尚未覆盖: 当前智能体得分停滞且缺乏区分性科学判断；结果基于单一冻结基座模型，代理指标未必反映真实发现效用。
    - 路线: 自动评审与反思反馈循环
      解决的问题: 通过模拟评审、VLM图形反馈或LLM评分标准来规模化论文评估和迭代优化。
      尚未覆盖: 人类一致性仅部分验证；评分偏好不能保证工作坊级别一致性或更普遍发表质量。
    - 路线: 开源智能体基础设施
      解决的问题: 把孤立的研究智能体想法转化为可运行栈、代码工件和可重复工作流。
      尚未覆盖: 跨模型、数据集、算力预算和研究域的标准化外部验证缺失；工件完整度参差不齐。
    共识:
    - 领域一致将科学发现分解为构思、执行、分析和写作，并由LLM智能体协调各阶段。
    - 自动化评估被视为扩展发现能力的必要环节，形式包括LLM评分、模拟同行评审、虚拟任务或证据成熟度评分。
    - 仅能执行和记录分析已不够；系统日益加入验证或证据要求，以区隔可辩护主张与生成文本。
    - 代码或基准等可复现信号受到重视，但各论文报告完整性不一致。
    分歧:
    - 通用系统面向广泛的机器学习发现，领域系统嵌入结构化验证器，例如逻辑证明检查或物理感知视觉检查；这影响失败覆盖和可迁移性。
    - 评测目标不同：一些基于评审标准判断完整生成手稿，另一些基于任务完成度或冻结数据的证据成熟度；这些不可互换。
    - 验证策略从内部基于LLM的逻辑审查到外部基于仿真的视觉门控不等，关于漏检失败的证据各不相同。
    - 交互模式从全自动流水线到人类担任PI的协作回路不等，隐含着对专家监督和错误纠正的不同假设。
    开放问题:
    - 基于LLM的评审和证据成熟度评分是否能预测主张能够独立复现或通过专家审查？
    - 智能体能否超越合格的分析执行，在开放式环境中产生对照、稳健性检查、可证伪假设和跨数据集泛化？
    - 领域特定有效性门控在计算流体力学或应用数学之外的推广能力如何，对合法但非常规发现的假阴性率是多少？
