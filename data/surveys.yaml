  related_work_outline:
  - 'Mainstream direction: The visible frontier clusters around autonomous research
    agents that integrate literature search, synthesis, hypothesis generation, and
    paper drafting, with verification loops and evidence-quality benchmarking.'
  - 'Shared research pattern: Work decomposes scientific or literature workflows into
    modular stages, combines retrieval/knowledge modules with LLM agents, and compares
    systems through automated judges, task baselines, or human baselines.'
  - 'Key differences: Evaluation targets differ across blind evidence tasks, published-study
    questions, generated-paper rubrics, and broad benchmark suites; control structures
    range from fixed pipelines to structured search and self-evolution.'
  - 'Trend evolution: Available evidence clusters in 2025-2026: 2025 brings surveys
    and domain-specific benchmarks, while 2026 shifts toward blind evidence maturity,
    documented failure modes, self-evolving frameworks, and end-to-end generation.'
  - 'Open questions: Literature review automation remains difficult; cross-base-model
    generalization, LLM-judge alignment with real scientific utility, reliability,
    and ethics remain unresolved.'
  related_work_outline_zh:
  - 主流方向：可见前沿集中在自主科研智能体，将文献检索、综合、假设生成与论文撰写纳入闭环，并加入验证与证据质量评测。
  - 研究共性：将科研或文献工作流分解为模块化阶段，结合检索/知识模块与LLM智能体，并通过自动评委、任务基线或人工基线进行对比。
  - 关键差异：评测目标在盲测证据任务、已发表研究问答、生成论文评审量表和通用基准间不同；控制结构从固定流水线到结构化搜索和自演化不等。
  - 趋势演进：可见证据集中在2025-2026年，2025年以综述和领域专项基准为主，2026年转向盲测证据成熟度、失败模式记录、自演化框架和端到端生成。
  - 开放问题：文献综述自动化仍困难；跨基座模型泛化、LLM评委与真实科学效用的对齐、可靠性与伦理仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous research workflow systems
      what_it_solves: Orchestrates literature synthesis, hypothesis or algorithm generation,
        internal verification, and paper drafting into iterative agent workflows.
      what_remains_open: Whether gains come from workflow control or verification
        rather than the base model, and whether generated outputs hold outside the
        training or rubric context.
    - line: Evidence-grounded evaluation benchmarks
      what_it_solves: Compares discovery agents on blind scientific tasks, domain-specific
        questions, and human baselines across dimensions such as evidence maturity,
        auditability, and novelty.
      what_remains_open: Coverage remains narrow; several results rely on one frozen
        base model or show no reliable pairwise separation, so proxy metrics may not
        track real scientific utility.
    - line: Failure mode analysis and design principles
      what_it_solves: Identifies recurring failure modes in long-horizon autonomous
        research and converts them into design guidance for more robust systems.
      what_remains_open: Case-study scale is small, domain coverage is limited, and
        no controlled comparison isolates which design principle reduces which failure.
    - line: Self-evolving and structured search frameworks
      what_it_solves: Enables agents to iteratively refine hypotheses, self-critique,
        accumulate knowledge, and systematically backtrack during exploration.
      what_remains_open: Whether benchmark gains transfer to literature-heavy or theory-heavy
        discovery, and whether improvement comes from search structure rather than
        the underlying model.
    - line: Survey and conceptual taxonomy
      what_it_solves: Organizes agent capabilities, scientific workflows, datasets,
        metrics, challenges, and future directions into descriptive categories.
      what_remains_open: Categories are mostly descriptive; direct empirical validation
        that they predict system behavior or task success is absent.
    consensus:
    - Research decomposes scientific or literature workflows into modular agent stages
      covering search, synthesis, generation, and evaluation.
    - Automated evaluation is common, usually combining LLM judges, task baselines,
      or human comparison; current agents can execute documented analyses but are
      not yet trustworthy autonomous scientists.
    - Literature review automation, system reliability, and the need for human or
      internal verification recur as unresolved concerns.
    - Visible evidence maturity gaps include missing controls, robustness checks,
      falsifiability, and cross-dataset generalization.
    disagreements:
    - 'Evaluation target differs: blind evidence tasks with hidden conclusions, published-study
      multiple-choice questions, generated-paper rubrics, and broad benchmark suites
      coexist.'
    - 'Control structure differs: fixed stage pipelines, human-as-PI collaboration,
      tree-structured branching with backtracking, and self-evolving hypothesis refinement
      are used.'
    - 'Deployment setting differs: specialized systems target applied mathematics,
      single-cell omics, machine learning, or combinatorial optimization, while other
      frameworks claim domain-agnostic coverage.'
    - 'Supervision differs: some rely on internal verification and automated rubrics,
      while others use graduate-level human baselines or human review as the reference
      point.'
    open_questions:
    - Do blind benchmark scores or evidence-maturity ratings translate into valid
      discovery when data, domains, or base models change?
    - How should literature search, citation analysis, and review synthesis be evaluated
      separately from coding or experimental capability?
    - Are LLM-judge rubrics and multiple-choice questions reliable proxies for scientific
      validity and real decision utility?
    - Which minimal human-in-the-loop or verification signal is needed before generated
      literature reviews or discoveries become trustworthy?
    - How do failure modes such as implementation drift, memory degradation, and weak
      scientific taste change with base model scale or memory/verification interventions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主研究工作流系统
      解决的问题: 将文献综合、假设或算法生成、内部验证和论文起草编排为迭代智能体流程。
      尚未覆盖: 提升是否来自工作流控制或验证而非基座模型，生成结果能否在训练或评审量表之外成立。
    - 路线: 证据基准评测
      解决的问题: 通过盲式科学任务、领域特定问答和人工基线，比较发现智能体在证据成熟度、可审计性和新颖性等维度上的表现。
      尚未覆盖: 覆盖范围较窄；若干结果仅基于单一冻结基座模型或两两差异不显著，代理指标未必反映真实科研效用。
    - 路线: 失败模式分析与设计原则
      解决的问题: 识别长跨度自主研究中反复出现的失败模式，并将其转化为更稳健系统的设计指南。
      尚未覆盖: 案例规模小，领域覆盖有限，缺少受控比较来分离哪种设计原则能减少哪类失败。
    - 路线: 自演化与结构化搜索框架
      解决的问题: 让智能体迭代精炼假设、自我批判、积累知识，并在探索过程中系统回溯。
      尚未覆盖: 基准提升是否迁移到文献密集或理论密集任务，以及提升是否来自搜索结构而非底层模型。
    - 路线: 综述与概念分类
      解决的问题: 将智能体能力、科学工作流、数据集、指标、挑战和方向组织为描述性类别。
      尚未覆盖: 分类多为描述性，尚缺乏其能预测系统行为或任务成功的直接实证验证。
    共识:
    - 研究普遍把科学或文献工作流分解为检索、综合、生成、评测等模块化阶段，并引入LLM评委或人工基线。
    - 现有证据显示智能体能完成分析执行和文档记录，但缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 文献综述自动化、系统可靠性以及人工或内部验证需求仍是反复出现的未解决问题。
    - 可见证据成熟度缺口包括缺少对照、稳健性检验、可证伪性和跨数据集泛化能力。
    分歧:
    - 评测目标不同：盲式证据任务、已发表研究选择题、生成论文评审量表和广泛基准套件并存。
    - 控制结构不同：固定阶段流水线、人担任PI的协作、树状分支回溯和自演化假设精炼等方式被分别采用。
    - 部署设置不同：专用系统面向应用数学、单细胞组学、机器学习或组合优化，而另一些框架声称领域无关。
    - 监督方式不同：有些依赖内部验证和自动评审量表，有些以研究生水平人工基线或人类评审为参照。
    开放问题:
    - 盲式基准分数或证据成熟度评分能否在数据、领域或基座模型变化时转化为真实发现？
    - 文献搜索、引文分析和综述综合能力应如何与编码或实验能力分开评测？
    - LLM评审量表和选择题是否能可靠代表科学有效性与真实决策效用？
    - 在生成文献综述或发现被认为可信之前，需要哪些最低限度的人机闭环或验证信号？
    - 实现漂移、记忆退化和科学品味薄弱等失败模式如何随基座模型规模或记忆/验证干预变化？
