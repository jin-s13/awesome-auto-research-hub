  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous experimentation systems
      what_it_solves: Turns model ideas into runnable research loops that generate
        ideas, execute code, run experiments, analyze results, and write scientific
        manuscripts with reduced human intervention.
      what_remains_open: Validation beyond small case studies and selected machine
        learning or applied-math domains; reproducibility from code and data artifacts
        to external settings; stable paper quality across repeated runs.
    - line: Discovery evaluation environments and benchmark suites
      what_it_solves: Provides repeatable tasks, baselines, and metrics for scientific
        discovery behavior such as task completion, task-relevant actions, explanatory
        knowledge, and relative improvement over published models.
      what_remains_open: Proxy metrics may not capture real discovery utility; frontier
        agent gains can be engineering tricks rather than research-level domain insight;
        task coverage remains limited.
    - line: Failure-aware memory and self-correction
      what_it_solves: Captures structured negative results from failed attempts and
        lets downstream agents adopt or reject them when proposing next experiments,
        improving success and token efficiency on retry and cross-task settings.
      what_remains_open: Demonstrated mainly on ScienceAgentBench and PDE tasks; transfer
        to other science domains and long multi-step campaigns is not evidenced; curation
        reliability remains unquantified.
    - line: Multi-agent orchestration and oversight interfaces
      what_it_solves: Coordinates specialized roles, verification loops, real-time
        monitoring, artifact inspection, and rollback or resume controls so researchers
        can supervise and steer autonomous experiment workflows.
      what_remains_open: Current evidence is based on few internal case studies; platform
        maturity, cross-team usage, and standardized external validation across hardware,
        datasets, and user settings remain open.
    - line: Agentic search for experiment planning
      what_it_solves: Uses progressive tree search with experiment management and
        reviewer feedback to select hypotheses, experiments, and visual presentation
        choices during iterative manuscript generation.
      what_remains_open: The evidence shows inconsistent pass rates and only workshop-level
        validation; full conference-level publication and reliability across domains
        are not yet demonstrated.
    consensus:
    - Autonomous experimentation is converging on LLM-based agents that propose, implement,
      execute, analyze, and report experiments in a closed loop.
    - Evaluation now combines task success with report or paper quality, often using
      automatic metrics, LLM rubrics, or simulated and peer-review feedback.
    - Systems increasingly separate orchestration, coding, verification, retrieval,
      and review roles rather than relying on a single undifferentiated prompt.
    - Current evidence shows agents can improve benchmarks or generate passable drafts,
      but gains may stem from search, memory, or engineering tricks rather than new
      scientific insight.
    disagreements:
    - 'The primary target differs: some contributions are end-to-end discovery systems
      that produce papers, while others are testbeds or benchmarks that measure agent
      progress on predefined tasks.'
    - 'Evaluation standards differ: one line uses workshop peer-review acceptance
      or LLM-based reviewer scores, another uses task completion and action metrics
      in simulated environments, and another uses relative improvement over published
      best models.'
    - 'Interaction mode differs: some systems operate fully autonomously, others use
      human-in-the-loop supervision such as principal-investigator and graduate-student
      collaboration or interactive dashboards with rollback controls.'
    - 'Reported sources of progress differ: one evaluation finds gains almost entirely
      from machine-learning engineering tricks, while other systems emphasize verification
      loops and failure memory as key mechanisms.'
    open_questions:
    - How well do automated reviewers, LLM rubrics, and benchmark improvements align
      with human peer review and eventual scientific impact?
    - Can end-to-end systems move beyond workshop-level papers, narrow internal case
      studies, or local engineering sweeps to robust cross-domain discovery?
    - What is the causal contribution of verification loops, failure memory, tree
      search, and plug-in skills once model scale and task-specific priors are controlled?
    - How should evaluation environments be extended across lab-based experimentation,
      long-horizon experiments, and real-world resource constraints?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主实验系统
      解决的问题: 把模型想法转化为可运行的研究闭环，自动生成想法、执行代码、运行实验、分析结果并撰写论文，减少人工干预。
      尚未覆盖: 仅有小规模案例和特定机器学习或应用数学领域验证；从代码和数据工件到外部环境的可复现性，以及多次运行中的论文质量稳定性仍缺乏证据。
    - 路线: 科学发现评测环境与基准套件
      解决的问题: 提供可重复任务、基线和指标，衡量任务完成、任务相关动作、可解释知识，以及相对已发布模型的提升。
      尚未覆盖: 代理指标可能无法反映真实发现效用；前沿智能体增益可能只是工程技巧而非领域洞见；任务覆盖仍有限。
    - 路线: 失败感知记忆与自校正
      解决的问题: 将失败尝试转化为结构化负面结果，供下游智能体在提出新实验时采纳或拒绝，提高重试与跨任务成功率和令牌效率。
      尚未覆盖: 主要在ScienceAgentBench和PDE任务上展示；向其他科学领域与长流程多步实验的迁移尚无证据；策展可靠性未被量化。
    - 路线: 多智能体编排与人工监督界面
      解决的问题: 协调专用角色、验证循环、实时监控、工件检查和回滚/恢复控制，使研究者能监督并引导自主实验流程。
      尚未覆盖: 现有证据来自少数内部案例；平台成熟度、跨团队使用，以及跨硬件、数据集和用户设置的标准化外部验证仍缺失。
    - 路线: 面向实验规划的智能体搜索
      解决的问题: 通过渐进式树搜索、实验管理者和评审反馈，在迭代生成论文过程中选择假设、实验和可视化方案。
      尚未覆盖: 证据显示通过率不稳定；只在工作坊层级验证，尚缺完整会议发表级别的可靠性证据。
    共识:
    - 自主实验正在收敛到基于LLM的智能体闭环，智能体提出、实现、执行、分析并报告实验。
    - 评测越来越多地结合任务成功与报告或论文质量，使用自动指标、LLM评分标准或模拟与同行评审反馈。
    - 系统普遍把编排、编码、验证、检索和评审角色分开，而不是依赖单一无差别提示。
    - 现有证据显示智能体能改进基准或生成可接受的初稿，但增益可能来自搜索、记忆或工程技巧，而非新的科学洞见。
    分歧:
    - 主要目标不同：一些贡献是产出论文的端到端发现系统，另一些是在预定义任务上衡量智能体进展的测试床或基准。
    - 评测标准不同：一条路线使用工作坊同行评审接收或LLM评审分数，另一条使用模拟环境中的任务完成和动作指标，还有一条使用相对已发布最佳模型的提升。
    - 交互模式不同：有的系统完全自主，有的采用首席研究员/研究生式的人类在环协作，或带监控与回滚控制的交互式仪表板。
    - 对增益来源的判断不同：一项评测发现增益几乎全部来自机器学习工程技巧，而其他系统强调验证循环和失败记忆是关键机制。
    开放问题:
    - 自动评审、LLM评分标准和基准提升在多大程度上与人类同行评审及最终科学影响力一致？
    - 端到端系统能否超越工作坊论文、窄内部案例或局部工程调优，实现跨领域的稳健发现？
    - 在控制模型规模与任务先验后，验证循环、失败记忆、树搜索和插件技能各自对性能的因果贡献是什么？
    - 如何把评测环境扩展到实验室实验、长周期实验和真实资源约束？
