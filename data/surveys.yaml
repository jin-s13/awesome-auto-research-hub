  related_work_outline_zh:
  - 主流方向：评估和治理自动化科学发现智能体，依靠基准环境、盲测证据裁判、领域有效门控和受控迭代搜索，而非只评估生成能力。
  - 研究共性：采用提出假设-执行实验-分析结果-撰写论文的智能体闭环，并设置独立验证或评估层以捕捉无效主张。
  - 关键差异：一些系统面向CFD、时间序列预测、组学等领域发现，另一些构建通用基准或端到端智能体；评估信号覆盖任务完成、自动评审、证据成熟度和下游性能。
  - 趋势演进：2024年侧重端到端论文生成和通用发现环境；2025-2026年引入物理门控、权限分离、领域基准和证据成熟度评分。
