  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Automating ideation, code or experiment execution, visualization,
        and manuscript generation in closed scientific discovery loops.
      what_remains_open: Reliability across runs and venues, human-expert agreement,
        and whether generated papers correspond to reproducible results.
    - line: Scientific discovery task environments
      what_it_solves: Providing controllable multi-domain tasks and metrics for hypothesis
        formation, experiment design, analysis, and conclusion use.
      what_remains_open: Whether task completion and proxy metrics capture research-level
        insight rather than surface behavior or engineering tricks.
    - line: Failure-aware memory for research agents
      what_it_solves: Converting failed attempts into reusable negative evidence to
        improve retry and cross-task experimentation while reducing token cost.
      what_remains_open: Granularity of typed failure records, transfer outside PDE
        and ScienceAgentBench settings, and integration with larger research workflows.
    - line: Interactive multi-agent research infrastructure
      what_it_solves: Providing customizable teams, role-based workflows, code harnesses,
        dashboards, monitoring, and rollback to make autonomous research controllable.
      what_remains_open: Maturity, standardization, and external validation across
        hardware, datasets, teams, and research domains.
    - line: Reasoning-centric formal discovery with verification
      what_it_solves: Automating math-oriented reasoning, knowledge retrieval, theorem
        or proof steps, and paper drafting with verification to correct logical errors.
      what_remains_open: Evidence is limited to LLM-based review rubrics, and visible
        records lack explicit limitations and code or dataset signals.
    consensus:
    - Autonomous systems can cover idea generation, experiment execution, analysis,
      and manuscript writing as a continuous loop, but human oversight or verification
      remains common.
    - Agents benefit from structured memory, verification, or failure records rather
      than treating each run as isolated from past attempts.
    - Evaluation of generated scientific work relies on automated reviewers, expert
      preference, task-success metrics, or workshop peer review, but these proxies
      are not fully aligned with reproducible scientific value.
    - Current scientific agent environments show that strong general-purpose agents
      struggle or make progress mainly through implementation-level tricks, revealing
      a gap between engineering and discovery.
    disagreements:
    - 'Task and evaluation target differs: full manuscript generation and venue acceptance
      versus virtual discovery tasks versus improving published scientific ML models
      versus solving PDE problems.'
    - 'Interaction and supervision differ: fully automated execution, principal-investigator
      and graduate-student guidance, human dashboard rollback, and curator and researcher
      shared-memory architectures.'
    - 'Control mechanism differs: progressive agentic tree search, role-specialized
      multi-agent teams, failure-record adoption, and code-harness execution loops.'
    - 'Validation strength differs: some evidence uses LLM review rubrics, some uses
      AI expert judging on case studies, one uses workshop peer review acceptance,
      and task suites use completion metrics.'
    - 'Deployment settings differ: text-based simulated lab tasks, local ML codebases,
      applied mathematics derivation and theory, and scientific ML benchmarks across
      multiple domains.'
    open_questions:
    - How can automated research agents move beyond local engineering sweeps and produce
      genuine domain-level research insights?
    - Do automated reviewer rubrics and expert-preference comparisons predict human
      peer review, reproducibility, and long-term scientific impact?
    - Can negative knowledge captured from failures transfer robustly across scientific
      domains, tasks, and experimental infrastructures beyond the exhibited PDE cases?
    - What evidence is needed to validate autonomous research infrastructure outside
      small internal case studies and curated task suites?
    - What is the value of end-to-end paper generation when limitations, code, datasets,
      and external reproducibility details are missing or weakly evidenced?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究智能体
      解决的问题: 自动完成想法生成、代码或实验执行、可视化和论文撰写，形成科学发现闭环。
      尚未覆盖: 跨运行和场景的稳定性、与人类专家判断的一致性，以及生成论文与可复现结果之间的一致性。
    - 路线: 科学发现任务环境
      解决的问题: 提供多领域任务和指标，覆盖假设形成、实验设计、分析与结论使用。
      尚未覆盖: 任务完成度和代理指标是否捕捉研究洞察，而不只是表面行为或工程技巧。
    - 路线: 面向研究智能体的失败感知记忆
      解决的问题: 把失败尝试转化为可复用的负向证据，提升重试和跨任务实验表现并降低令牌开销。
      尚未覆盖: 类型化失败记录的粒度、在 PDE 和 ScienceAgentBench 之外的迁移，以及与更大规模研究流程的集成。
    - 路线: 交互式多智能体研究基础设施
      解决的问题: 提供可定制团队、角色化工作流、代码工具、仪表板、监控和回滚，使自主研究可控。
      尚未覆盖: 成熟度、标准化，以及跨硬件、数据集、团队和研究领域的外部验证。
    - 路线: 带验证的推理主导形式化发现系统
      解决的问题: 自动化数学推理、知识检索、定理或证明步骤与论文起草，并通过验证纠正逻辑错误。
      尚未覆盖: 证据主要来自基于 LLM 的评审标准，公开信息缺少明确局限性与代码或数据集信号。
    共识:
    - 自主系统能覆盖想法生成、实验执行、分析和论文撰写连续闭环，但通常仍需人类监督或验证。
    - 相比孤立运行，智能体在有结构记忆、验证或失败记录时更容易复用过去尝试。
    - 生成科学工作的评估依赖自动评审、专家偏好、任务成功指标或工作坊同行评审，但这些代理信号与可复现科学价值尚未完全对齐。
    - 现有科学发现环境显示，强通用智能体要么表现困难，要么主要靠实现层面技巧取得进展，暴露出工程与发现之间的差距。
    分歧:
    - 任务和评估目标不同：完整论文生成与投稿接受、虚拟发现任务、改进已发表科学 ML 模型、求解 PDE 问题。
    - 交互和监督方式不同：全自动执行、首席研究员与研究生式引导、人类仪表板回滚、策展者与研究者共享记忆架构。
    - 控制机制不同：渐进式智能体树搜索、角色专业化多智能体团队、失败记录采纳、代码工具执行循环。
    - 验证强度不同：有的用 LLM 评审标准，有的用 AI 专家评审案例，有的用工作坊同行评审接受，任务套件用完成度指标。
    - 部署场景不同：文本模拟实验室任务、本地 ML 代码库、应用数学推导与理论、跨领域科学 ML 任务。
    开放问题:
    - 自动化研究智能体如何超越局部工程调优，产出真正的领域级研究洞察？
    - 自动评审标准和专家偏好比较能否预测人类同行评审、可复现性和长期科学影响？
    - 从失败中捕获的负知识能否在 PDE 案例之外的不同科学领域、任务和实验基础设施间稳健迁移？
    - 需要什么证据才能证明自主研究基础设施在小型内部案例和策划任务套件之外有效？
    - 当局限性、代码、数据集和外部可复现细节缺失或证据不足时，端到端论文生成的价值如何评估？
