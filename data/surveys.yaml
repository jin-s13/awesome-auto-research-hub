  related_work_outline:
  - 'Mainstream direction: Building autonomous AI research agents that propose hypotheses,
    execute experiments, and produce reports, with emphasis on verification and self-correction
    rather than idea generation alone.'
  - 'Shared research pattern: LLM-driven multi-agent loops ground ideation in literature,
    diagnostics, or prior failures, execute code, apply validity or reporting gates,
    and compare against baseline agents or human judges.'
  - 'Key differences: Systems split between domain-specific validity gates and general-purpose
    self-correction, full autonomy versus human-in-the-loop intervention, and task-specific
    discovery metrics versus broad benchmark improvement.'
  - 'Trend evolution: 2025 evidence provides surveys and benchmarks for scientific
    discovery agents; 2026 evidence shifts toward reliable execution, failure attribution,
    verifiable reporting, and targeted human collaboration.'
  - 'Open questions: Whether current evaluations capture research insight rather than
    engineering tricks, how to generalize beyond narrow case studies, and how to ensure
    verification gates catch silent failures without missing errors.'
  related_work_outline_zh:
  - 主流方向：构建自主AI研究智能体，提出假设、执行实验并生成报告，重点从单纯产生想法转向验证与自我纠正。
  - 研究共性：基于LLM的多智能体循环，将文献、诊断或失败记录作为构思依据，执行代码，设置有效性或报告门控，并与基线智能体或人类评审比较。
  - 关键差异：系统分为领域特定有效性门控与通用自我纠正、完全自主与人在回路、任务特定发现指标与广泛基准提升。
  - 趋势演进：2025年证据以综述和基准为主；2026年证据转向可靠执行、失败归因、可验证报告和精准人机协作。
  - 开放问题：当前评测能否区分研究洞察与工程技巧，如何跨出窄案例推广，以及验证门控如何减少静默失败中的漏检。
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific autonomous discovery agents with validity gates
      what_it_solves: Turn literature-grounded hypotheses and code modifications into
        domain-validated experimental results, such as computational fluid dynamics
        flow-field verification.
      what_remains_open: Verification gates can miss silent failures; results are
        often shown in a single domain or case and lack external generalization evidence.
    - line: Self-correcting execution and failure attribution
      what_it_solves: Convert failed or non-metric-bearing experiments into diagnostic
        evidence and route interventions to hypothesis, experimental design, or implementation
        levels.
      what_remains_open: Gains may concentrate in code execution rather than hypothesis
        quality; fully autonomous scientific writing remains unresolved.
    - line: Human-AI collaborative research platforms
      what_it_solves: Make autonomous research inspectable and steerable through customizable
        roles, monitoring, and high-leverage human interventions.
      what_remains_open: Evaluations are often limited to internal case studies; optimal
        intervention granularity is not standardized across settings.
    - line: Benchmarks and testbeds for AI scientists
      what_it_solves: Provide tasks, human baselines, or long-horizon trajectories
        to compare agent outputs and expose failure modes.
      what_remains_open: Proxy metrics may not equal discovery utility; agents can
        improve published models mainly through engineering tricks rather than research
        insight.
    - line: Survey and taxonomy of agentic scientific discovery
      what_it_solves: Organize capabilities, domains, metrics, implementation frameworks,
        and challenges across fragmented agentic discovery systems.
      what_remains_open: Categories lack direct empirical validation for predicting
        model behavior; literature automation, system reliability, and ethics remain
        unresolved.
    consensus:
    - Systems embed hypothesis generation inside executable experiment loops with
      verification or grounded reporting rather than treating ideation as isolated
      text generation.
    - Reliability mechanisms such as validity gates, self-healing loops, deterministic
      source-control boundaries, and factual reporting are seen as necessary to reduce
      silent failures and hallucinated results.
    - Evaluation increasingly combines task-specific metrics, baseline comparisons,
      ablation studies, artifact quality, or expert/human judgment, but coverage remains
      narrow and case-based.
    disagreements:
    - 'Validity signals differ: some systems rely on domain-specific physical or biological
      verification, while others use general-purpose self-correction and multi-agent
      debate without domain-specific checks.'
    - 'Interaction mode differs: fully autonomous loops contrast with human-in-the-loop
      designs that intervene only at selected high-leverage decision points.'
    - 'Evaluation targets differ: single-cell biological discovery, computational
      fluid dynamics, forecasting architecture evolution, and broad scientific ML
      benchmark improvement are not directly comparable.'
    - 'Interpretation of improvement differs: one testbed reports gains mostly from
      ML-engineering tricks, while several agent papers attribute progress to autonomous
      hypothesis or architecture discovery.'
    - 'Supervision and authority differ: some systems separate cognition from deterministic
      program authority, while others allow LLM agents broader source-control or workflow
      customization.'
    open_questions:
    - How can verifiers be designed to reduce missed silent failures without adding
      excessive false rejections in domain-specific autonomous discovery?
    - Do current AI-scientist benchmarks measure genuine hypothesis quality, or do
      they mainly reward implementation and engineering sweeps?
    - What human intervention granularity best balances autonomy, reliability, and
      evaluation validity across scientific domains?
    - How do domain-specific autonomous discovery systems generalize beyond the limited
      datasets, case studies, and internal benchmarks reported?
    - What standardized external validation would make claims about autonomous research
      systems comparable across hardware, data, and user settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域特定的自主发现智能体与有效性门控
      解决的问题: 将基于文献的假设和代码修改转化为经过领域验证的实验结果，例如计算流体动力学的流场验证。
      尚未覆盖: 验证门控可能漏掉静默失败；结果通常只在单一领域或案例中展示，缺少外部泛化证据。
    - 路线: 自我纠正执行与失败归因
      解决的问题: 把失败或缺少指标输出的实验转化为诊断证据，并将干预路由到假设、实验设计或实现层。
      尚未覆盖: 提升可能集中在代码执行而非假设质量；完全自主的科学写作仍未解决。
    - 路线: 人机协作研究平台
      解决的问题: 通过可定制角色、监控和高杠杆人工干预，使自主研究可检查、可引导。
      尚未覆盖: 评估常限于内部案例研究；最优干预粒度尚未跨设置标准化。
    - 路线: AI科学家基准与测试床
      解决的问题: 提供任务、人类基线或长时间轨迹，比较智能体输出并暴露失败模式。
      尚未覆盖: 代理指标未必等于发现效用；智能体可能主要通过工程技巧而非研究洞察改进已发布模型。
    - 路线: 智能体科学发现的综述与分类
      解决的问题: 组织碎片化系统的能力、领域、指标、实施框架和挑战。
      尚未覆盖: 分类缺乏预测模型行为的直接实证验证；文献自动化、系统可靠性和伦理问题未解决。
    共识:
    - 系统将假设生成嵌入可执行的实验循环，并加入验证或基于事实的报告，而不是把构思当作孤立的文本生成。
