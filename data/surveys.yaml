  related_work_outline_zh:
  - 主流方向：构建端到端自主实验智能体，生成假设、执行代码、分析结果并撰写报告或论文，用LLM评审或基准任务评测。
  - 研究共性：将工作流拆分为模块或智能体角色，通过验证、评审、失败记忆或树搜索进行迭代反馈，并在选定发现任务或案例上测试。
