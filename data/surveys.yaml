    - 自主系统可以生成看似合理的科学论文，但必须加入显式验证步骤以避免事实错误和无效主张。
    - 多智能体架构（构思、执行、写作分工）能提升输出论文的连贯性和完整性。
    - 自动评审（模拟或真实）是有效的反馈信号，但不足以保证论文的科学贡献。
    分歧:
    - 一路线主张全自主并以模拟评审器评测，另一路线则坚持在关键决策点进行战略性人工干预可获得更高质量论文。
    - 验证策略不同：有的依赖文本逻辑一致性检查，有的使用特定领域的物理仿真检查，还有的采用因果失败归因来纠正错误。
