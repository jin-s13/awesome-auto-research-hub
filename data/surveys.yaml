  related_work_outline_zh:
  - 主流方向：以多智能体LLM系统为主，将研究构思、实验执行、验证与完整论文撰写整合到同一流水线，并越来越强调验证门控和人机协作。
  - 研究共性：系统把科研写作拆分为构思、实现、实验执行、验证和报告等阶段，由LLM代理生成论文草稿，并用模拟评审或基准信号做验证。
  - 关键差异：领域从通用机器学习到应用数学和计算流体力学；自主程度从全自动到人在环路；验证包括逻辑、物理感知、失败归因和事实约束；成功标准包括评审分数、基准提升、盲审或同行评审接收。
  - 趋势演进：2024年通用自动化发现，2025年树搜索与工作坊接收，到2026年领域专用验证与人机协作；整体处于2024-2026前沿内，重点转向可靠性和失败恢复。
  - 开放问题：论文能否稳定达到会议级同行评审、代理评审是否与科学效用一致、验证门控跨领域是否完整、哪种人类介入方式最可泛化。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research writing pipelines (e.g., The AI Scientist,
        AI Scientist-v2)
      what_it_solves: Converts research ideation, code writing, experiment execution,
        visualization, and manuscript drafting into a single LLM-driven loop, reducing
        per-paper cost and enabling open-ended generation.
      what_remains_open: 'Acceptance is inconsistent: one workshop paper passed peer
        review while other submissions failed; full conference-level quality and cross-domain
        generalization remain undemonstrated.'
    - line: Verification-gated generation and grounded reporting (e.g., ReasFlow,
        AI CFD Scientist)
      what_it_solves: Adds internal logical checks, knowledge retrieval, physics-aware
        vision gates, or measured-value constraints to prevent hallucinated results
        and silent failures from entering drafts.
      what_remains_open: Gates can miss planted failures or domain-specific errors;
        evidence is concentrated in applied math and computational fluid dynamics,
        so completeness across scientific writing genres is unclear.
    - line: Failure attribution and self-correcting research agents (e.g., SAGE)
      what_it_solves: Diagnoses failed experiments by attributing causes to hypothesis,
        design, or implementation and routes corrections to the appropriate stage,
        improving the rate of metrics-bearing outputs.
      what_remains_open: Gains are measured on a 12-topic benchmark and blind scores
        remain modest; fully autonomous conference-ready scientific writing is still
        unsolved.
    - line: Human-AI collaboration and intervention routing (e.g., AutoResearchClaw)
      what_it_solves: Embeds human decisions at selected high-leverage points instead
        of full autonomy or exhaustive oversight, improving benchmark performance
        on experimental research tasks.
      what_remains_open: The seven intervention modes and ARC-Bench improvement may
        not generalize to other workflows, domains, or writing-heavy tasks without
        stronger external validation.
    - line: Evaluation, review simulation, and failure-mode studies for generated
        papers
      what_it_solves: Provides LLM rubrics, automated reviewers, blind scoring, and
        case-study failure taxonomies to compare generated papers and to expose design
        flaws.
      what_remains_open: Proxy evaluation may not align with real scientific contribution;
        current evidence includes workshop acceptance and one human/multi-AI review,
        not a broad peer-review standard.
    consensus:
    - Multi-stage LLM agent pipelines are the dominant architecture, spanning ideation,
      implementation, execution, verification, and manuscript writing.
    - Verification and grounded reporting are treated as necessary because autonomous
      drafts otherwise contain fabricated numbers, citations, or unsupported success
      claims.
    - Human judgment remains part of the process; systems either include reviewers,
      human-in-the-loop intervention, or human/multi-AI review to judge output.
    - 'Evaluation is heterogeneous: rubric scores, blind review, benchmark success,
      and peer-review acceptance are all used, but none is standardized.'
    disagreements:
    - 'Autonomy differs: some systems pursue fully automated end-to-end generation,
      while others argue targeted human collaboration or principal investigator-agent
      division is safer and more effective.'
    - 'Verification strategy differs: one line uses domain-specific visual/physics
      gates, another uses internal logic and knowledge retrieval, another uses causal
      failure attribution and grounded reporting.'
    - 'Evaluation target differs: some optimize benchmark metrics or LLM-rubric scores,
      others seek workshop/conference peer-review acceptance, and at least one reports
      failure-mode case studies rather than acceptance claims.'
    - 'Domain breadth differs: general ML, diffusion, and language-modeling pipelines
      contrast with specialized applied mathematics and computational fluid dynamics
      pipelines that embed domain constraints.'
    open_questions:
    - Do automated reviewer and LLM-rubric scores predict real peer-review quality,
      novelty, or reproducibility of generated manuscripts?
    - Can verification gates catch domain-specific silent failures beyond the tested
      cases in applied mathematics and computational fluid dynamics?
    - Can fully autonomous systems achieve consistent conference-level publication
      across multiple fields rather than isolated workshop acceptance or benchmark
      gains?
    - Which human intervention points generalize across research workflows, and what
      evidence would validate the intervention-mode taxonomies?
    - How should generated writing be scored separately from artifact availability,
      recency, and popularity signals that may mask methodological weaknesses?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究写作流水线（如 The AI Scientist、AI Scientist-v2）
      解决的问题: 将研究构思、代码编写、实验执行、可视化和论文草稿整合到单一LLM驱动循环，降低单篇论文成本并支持开放式生成。
      尚未覆盖: 接收成功率不稳定，仅一篇工作坊论文通过同行评审而其他提交失败；完整会议级质量和跨领域泛化仍未得到证实。
    - 路线: 验证门控生成与事实约束报告（如 ReasFlow、AI CFD Scientist）
      解决的问题: 引入内部逻辑检查、知识检索、物理感知视觉门控或实测值约束，防止幻觉结果和静默失败进入论文草稿。
      尚未覆盖: 门控会遗漏植入失败或领域特定错误；证据集中在应用数学和计算流体力学，覆盖其他科研写作类型的完整性不明确。
    - 路线: 失败归因与自纠正研究代理（如 SAGE）
      解决的问题: 通过将失败归因到假设、实验设计或实现，并把纠正路由到适当阶段，提高含指标输出的比例。
      尚未覆盖: 提升主要来自12主题基准，盲审分数仍有限；全自动生成会议级科研论文仍未解决。
    - 路线: 人机协作与干预路由（如 AutoResearchClaw）
      解决的问题: 在高杠杆决策点嵌入人类判断，避免完全自主或逐步监督，提高实验研究任务上的基准表现。
      尚未覆盖: 七种干预模式和ARC-Bench提升能否推广到其他工作流、领域或写作密集型任务，还缺少外部验证。
    - 路线: 生成论文的评测、评审模拟与失败模式研究
      解决的问题: 通过LLM评审标准、自动评审器、盲评和失败分类案例，比较生成论文质量并暴露设计缺陷。
      尚未覆盖: 代理评测未必与真实科学贡献一致；现有证据包括工作坊接收和一次人类/多AI评审，尚未形成广泛同行评审标准。
    共识:
    - 多阶段LLM智能体流水线是主流架构，覆盖构思、实现、执行、验证与论文写作。
    - 验证和基于事实的报告被视为必要，因为自主草稿可能包含捏造数字、引用或未被支持的成功声明。
    - 人类判断仍部分保留，系统通过评审器、人在环路干预或人类/多AI评审来判定输出质量。
    - 评测方式不统一，包括评分标准、盲审、基准成功和同行评审接收，尚无标准化方法。
    分歧:
    - 自主程度不同：一类追求端到端全自动生成，另一类认为定向人机协作或首席研究员与研究生分工更安全有效。
    - 验证策略不同：一类用领域专用的视觉或物理门控，一类用内部逻辑与知识检索，另一类用因果失败归因和事实约束报告。
    - 评测目标不同：有的优化基准指标或LLM评分，有的追求工作坊或会议同行评审接收，有的报告失败模式案例而非接收结论。
    - 领域广度不同：面向通用机器学习、扩散或语言建模的流水线，与嵌入领域约束的应用数学和计算流体力学流水线存在差异。
    开放问题:
    - 自动评审器和LLM评分能否预测生成论文的真实同行评审质量、新颖性或可复现性？
    - 验证门控能否在应用数学和计算流体力学之外捕获领域特有的静默失败？
    - 全自主系统能否在多个领域稳定达到会议级发表，而不是孤立的工作坊接收或基准提升？
    - 哪些人类干预点在跨研究工作流中可泛化，如何验证干预模式体系？
    - 如何把生成论文的质量与代码可得性、时新性和热度信号分开，避免掩盖方法学缺陷？
