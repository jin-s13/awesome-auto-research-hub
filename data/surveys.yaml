      prediction, architecture evolution, and annotation or discovery.'
    - 'Verification signals differ: automated peer review, fixed LLM evidence judges,
      vision-language physics gates, and deterministic authority separation.'
    - 'Supervision differs: some studies use human expert baselines, while others
