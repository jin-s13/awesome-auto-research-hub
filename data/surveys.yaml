    - 路线: 迭代式多智能体综述撰写流程
      解决的问题: 将检索、主题组织、起草和评审分解为多阶段流程，通过迭代优化生成结构化综述。
      尚未覆盖: 大规模人类专家验证有限；质量提升依赖LLM评测器，工件公开与复现验证仍存在缺口。
    - 路线: 证据约束的检索与引用可靠性
      解决的问题: 通过全文分析、跨论文建模、引文图扩展和证据约束引用，使综述观点与来源论文对齐。
      尚未覆盖: 跨领域可扩展性和检索完整性未解决；代码和实现层面的可复现性未被系统证明。
    - 路线: 分类法与层次组织合成
      解决的问题: 生成或评估体现专家概念结构的文献分类法和论文-类别映射。
      尚未覆盖: 对齐度量依赖单一专家参考分类；替代性有效组织及分类法的直接预测价值仍缺乏探索。
    - 路线: 综述评测与基准设计
      解决的问题: 通过基准、成对比较、层次指标和多智能体LLM评分准则，使综述生成主张具有可比性。
      尚未覆盖: 代理指标尚未验证其与专家决策效用的一致性；精选CS/LLM主题及大规模论文集合之外的覆盖有限。
    共识:
    - 综述生成被视为多阶段过程，包含检索、组织、起草和评测等独立模块，而非一次性生成。
    - 通过LLM评审反馈或评分准则进行迭代优化是提升结构、覆盖和引用一致性的常见机制。
    - 将生成观点与引用论文对齐被视为核心可靠性挑战，多类方法引入证据约束和引用控制。
    - LLM评测广泛用于衡量覆盖度、相关性、结构和引用质量，但作者普遍承认评测覆盖有限。
    分歧:
