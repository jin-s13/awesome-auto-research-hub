  related_work_outline:
  - 'Mainstream direction: End-to-end autonomous research and science-discovery agents
    that generate papers or claims from literature, data, or minimal prompts, with
    internal verification and knowledge retrieval.'
  - 'Shared research pattern: Multi-agent pipelines decompose search, synthesis, verification,
    execution, and writing; evaluation increasingly uses evidence-grounded benchmarks
    and LLM judges rather than reproduction-only metrics.'
  - 'Key differences: Some work improves the agent through self-evolution, some audits
    existing coding agents via blind evidence tasks, and some diagnoses failure modes;
    supervision ranges from human PI-agent collaboration to fully autonomous pipelines;
    evaluation targets range from paper quality to claim evidence maturity.'
  - 'Trend evolution: Within the 2025-2026 frontier, work moves from domain-specific
    AI-scientist benchmarking and surveys toward evidence-grounded open-ended evaluation
    and general self-evolving research agents; pure citation analysis remains underrepresented
    in this evidence.'
  - 'Open questions: Whether benchmark or paper-quality gains reflect reliable literature
    search, citation analysis, and gap discovery; how to validate synthesis beyond
    LLM judges; how to reduce documented failure modes across domains.'
  related_work_outline_zh:
  - 主流方向：端到端自主科研与科学发现智能体，从文献、数据或少量提示生成论文或主张，并引入内部验证与知识检索。
  - 研究共性：多智能体流水线把搜索、综合、验证、执行与写作拆分；评测从复现型指标转向基于证据的基准和LLM评判。
  - 关键差异：一类改进智能体自身演化，一类通过盲证据任务审计，一类诊断失败模式；监督方式从人机首席研究员协作到全自主流水线；评测目标从论文质量到证据成熟度各不相同。
  - 趋势演进：在2025-2026前沿窗口内，从领域专用AI科学家基准与综述转向证据锚定的开放评测和通用自演化研究智能体；纯引文分析在本批证据中代表性不足。
  - 开放问题：基准或论文质量提升能否反映可靠文献搜索、引文分析与差距发现；如何超越LLM评判来验证综述；如何跨领域减少已文档化的失败模式。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous multi-agent literature and research synthesis, exemplified
        by ReasFlow
      what_it_solves: Turns literature, internal verification, and knowledge retrieval
        into multi-stage paper or claim generation with reduced expert intervention.
      what_remains_open: Whether generated reviews or papers remain logically sufficient
        outside the verification loop, and whether literature retrieval quality is
        directly measured.
    - line: Evidence-grounded evaluation benchmarks for discovery or research agents,
        exemplified by TruthInsightBench and BAISBench
      what_it_solves: Measures evidence maturity, claim validity, and human-aligned
        performance through blind tasks, frozen data, and LLM judges.
      what_remains_open: TruthInsightBench reports only one frozen base model; domain
        coverage, LLM-judge alignment, and the gap to real scientific discovery remain
        unresolved.
    - line: Failure analysis and design principles for autonomous research workflows,
        exemplified by Why LLMs Aren't Scientists Yet
      what_it_solves: Documents recurring failure modes in long-horizon autonomous
        research and derives design principles for more robust AI-scientist systems.
      what_remains_open: Conclusions come from a small case study; the design principles
        have not been systematically validated on literature search, review, or citation
        analysis tasks.
    - line: General self-evolving agent frameworks for agentic science, exemplified
        by EvoMaster
      what_it_solves: Provides domain-agnostic iterative hypothesis refinement, self-critique,
        and knowledge accumulation across multiple benchmarks.
      what_remains_open: Lacks external validation on literature-specific tasks, and
        benchmark gains may not indicate better literature reading, citation grounding,
        or gap discovery.
    - line: Survey and conceptual organization of agentic scientific discovery, exemplified
        by Agentic AI for Scientific Discovery
      what_it_solves: Catalogs agentic AI systems, evaluation metrics, implementation
        frameworks, datasets, and critical challenges across scientific fields.
      what_remains_open: The proposed categories are not directly validated against
        literature intelligence behavior, and literature review automation is explicitly
        listed as an unsolved challenge.
    consensus:
    - Multiple systems adopt multi-agent or staged workflows that separate retrieval,
      synthesis, verification, and writing steps.
    - Evaluation is moving toward evidence-grounded tasks that withhold source conclusions,
      use LLM judges, and measure claim maturity rather than only reproducing known
      answers.
    - Current evidence agrees that autonomous scientific and literature discovery
      is far from solved; agents can execute and document work but lack practices
      such as controls, robustness, falsifiability, and scientific taste.
    - Internal verification and knowledge retrieval are treated as necessary components
      for reducing logical errors and improving grounding in published or expert knowledge.
    disagreements:
    - 'Intervention target: some work improves the generative agent through verification
      and self-evolution, while other work fixes the evaluation environment and audits
      existing coding agents.'
    - 'Evaluation target: generated paper quality under an LLM rubric versus evidence
      maturity and claim validity on blind tasks versus human-aligned domain questions
      versus broad benchmark scores.'
    - 'Interaction mode: human PI-agent collaboration, fully autonomous six-agent
      research pipelines, or domain-agnostic self-evolving frameworks imply different
      assumptions about expert oversight and autonomy.'
    - 'Generalization strategy: domain-specific omics benchmarks use expert-labeled
      real data, while general frameworks rely on cross-domain benchmarks and self-critique,
      leaving different coverage gaps.'
    open_questions:
    - Do gains on discovery benchmarks or paper-generation rubrics transfer to reliable
      literature search, reading, citation analysis, and research gap discovery?
    - How can automated literature review and survey synthesis be validated without
      relying on LLM-as-judge scores or narrow benchmark proxy metrics?
    - Which blind tasks and evidence-maturity criteria are sufficient for measuring
      research gap discovery when source conclusions and expected values are withheld?
    - How generalizable are current findings across base models and scientific domains
      when the available evidence mainly covers one frozen base model or selected
      benchmark suites?
    - Which design principles can reduce documented failure modes such as implementation
      drift, memory degradation, overexcitement, and weak scientific taste in long-horizon
      literature workflows?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主多智能体文献与研究综合，如 ReasFlow
      解决的问题: 把文献、内部验证和知识检索转化为多阶段论文或主张生成，减少专家干预。
      尚未覆盖: 生成综述或论文在验证循环之外是否逻辑充分，文献检索质量是否被直接测量。
    - 路线: 基于证据的研究/发现智能体评测基准，如 TruthInsightBench、BAISBench
      解决的问题: 通过盲任务、冻结数据、人类基线和 LLM 评判测量证据成熟度、主张有效性与人类对齐表现。
      尚未覆盖: TruthInsightBench 仅报告一个冻结基座模型；领域覆盖、LLM 评判一致性与真实科学发现的差距仍未解决。
    - 路线: 自主研究工作流的失败分析与设计原则，如 Why LLMs Aren't Scientists Yet
      解决的问题: 记录长程自主研究流水线中重复出现的失败模式，并提出更稳健 AI 科学家系统的设计原则。
      尚未覆盖: 结论来自少量案例；这些设计原则尚未在文献搜索、综述或引文分析任务上被系统验证。
    - 路线: 通用自演化科学智能体框架，如 EvoMaster
      解决的问题: 以领域无关方式迭代优化假设、自我批判并在多个基准上积累知识。
      尚未覆盖: 缺少文献特定任务的外部验证；基准得分提升是否代表更好的文献阅读、引文依据或差距发现仍不清楚。
    - 路线: 智能体科学发现的综述与概念组织，如 Agentic AI for Scientific Discovery
      解决的问题: 对跨学科智能体 AI 系统、评测指标、实施框架、数据集和关键挑战进行分类。
      尚未覆盖: 分类是否能预测文献智能体行为缺乏直接实证验证，文献综述自动化被明确列为未解决问题。
    共识:
    - 多个系统采用多智能体或分阶段工作流，将检索、综合、验证与写作分离。
    - 评测正从复现已知答案转向证据锚定任务，隐藏来源结论并以 LLM 评判测量主张成熟度。
    - 现有证据一致认为自主科学与文献发现远未解决；智能体能执行和记录分析，但缺乏对照、稳健性、可证伪性与科学品味。
    - 内部验证与知识检索被视为减少逻辑错误和增强与已发表或专家知识一致性的必要组件。
    分歧:
    - 干预目标不同：一些工作通过验证与自演化改进生成智能体自身，另一些则固定评测环境并审计现有编码智能体。
    - 评测目标不同：LLM rubric 下的生成论文质量、盲任务上的证据成熟度与主张有效性、人类对齐领域问答、以及跨基准分数分别作为主要指标。
    - 交互模式不同：人机首席研究员-智能体协作、全自主六智能体流水线、领域无关自演化框架隐含不同的专家监督与自主性假设。
    - 泛化策略不同：领域专用组学基准依赖专家标注真实数据，通用框架依赖跨领域基准与自我批判，留下不同覆盖缺口。
    开放问题:
    - 发现基准或论文生成分数的提升能否迁移到可靠的文献搜索、阅读、引文分析与研究差距发现？
    - 如何在不依赖 LLM-as-judge 分数或窄基准代理指标的情况下验证自动文献综述与调研综合？
    - 在隐藏源结论和预期值的条件下，哪些盲任务与证据成熟度标准足以测量研究差距发现？
    - 当现有证据主要覆盖一个冻结基座模型或选定基准套件时，当前结论在基座模型和科学领域上能多大程度泛化？
    - 哪些设计原则可在长程文献工作流中减少实现漂移、记忆退化、过度兴奋与科学品味薄弱等已记录失败模式？
