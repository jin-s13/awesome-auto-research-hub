  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现智能体
      解决的问题: 把宽泛研究目标转化为可执行的提出、实验、可视化和论文写作流程，减少人工模板干预。
      尚未覆盖: 一致性未验证：AI Scientist-v2 三篇中只有一篇通过工作坊同行评审，且多数评估依赖自动化或工作坊级接受标准。
    - 路线: 带有效性门控的领域专用智能体
      解决的问题: 在结果被接受前进行领域有效性检查，减少求解器或仿真中的静默失败。
      尚未覆盖: 视觉-语言物理门控仍漏掉16个植入静默失败中的2个，且仅在一个CFD案例上验证，覆盖和泛化未解决。
    - 路线: 虚拟发现基准环境
      解决的问题: 在受控模拟环境中对完整发现循环提供可重复、任务化的评估。
      尚未覆盖: 强基线失败，但模拟任务完成度能否迁移到真实科学发现效用尚未建立。
    - 路线: 证据锚定的盲评量规
      解决的问题: 通过盲化目标和冻结数据，评估开放式研究主张的证据成熟度，避免复现隐藏目标研究。
      尚未覆盖: 仅在单一冻结基座模型上测试；智能体普遍缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 路线: 领域专用人类基线基准
      解决的问题: 在真实单细胞组学数据上，通过细胞注释和发现问答比较AI科学家与人类专家。
      尚未覆盖: 当前智能体仍达不到完全自主生物学发现，任务设置可能未覆盖更广泛的实验室推理。
    - 路线: 交互式多智能体研究平台
      解决的问题: 通过可定制角色、代码工具和实验反馈，提供可运行、可监控的研究工作流。
      尚未覆盖: 仅基于五个内部案例和专家偏好判断，外部泛化性与成熟度未验证。
    共识:
    - 当前AI研究智能体可胜任分析执行和文档记录，但证据显示它们尚未成为完全自主或可信的科学发现者。
    - 评测正从任务完成转向证据成熟度、盲测任务、有效性门控和人类或专家对比。
    - 静默失败、对照、稳健性、可证伪性和跨域泛化仍是普遍验证缺口。
    - 自动评审、专家评审和人类基线互为补充，但仍是外部效度尚未确立的代理信号。
    分歧:
    - 评测目标不同：虚拟发现任务、真实单细胞组学数据、盲态同行研究声明和计算流体动力学仿真并存。
    - 干预阶段不同：有的在接受结果前加有效性门控，有的做事后证据量规，有的依赖交互式监控和回滚。
    - 成功标准不同：自动评审接受阈值、同行评审接受、领域指标提升或专家偏好各有侧重。
