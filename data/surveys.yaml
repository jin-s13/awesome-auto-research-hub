      artifact quality, blind reviewer score, or human baseline comparison.'
    - Interaction mode varies from fully autonomous single-agent or tree-search pipelines
      to human-monitored multi-agent platforms with custom roles and rollback control.
    open_questions:
    - How well do benchmark task completion and simulated review scores predict actual
      scientific validity or downstream decision utility?
    - Can domain-specific verification gates and failure-attribution mechanisms generalize
      beyond the CFD, omics, and ML settings represented in the evidence?
    - What reproducibility and governance standards should govern autonomous systems
      that can write, execute, and submit papers with minimal human intervention?
    - How can systems avoid documented failure modes such as overexcitement, implementation
      drift, and weak scientific taste?
    - Which missing code, dataset, baseline, or limitation details in the evidence
      are material verification gaps for the strongest claims?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究工作流
      解决的问题: 在一个流程中自动化想法生成、实验实现与执行、分析以及论文写作或模拟评审。
      尚未覆盖: 跨领域一致性成功仍无保证；多次运行在实现或评估阶段失败，会议级完整成果仍较稀少。
    - 路线: 基准环境与领域评估套件
      解决的问题: 通过标准化任务、数据集、基线、指标和人类基线，让发现智能体的主张具备可比性。
      尚未覆盖: 覆盖范围限于选定领域或内部案例；任务完成等代理指标可能与真实科研或决策效用不一致。
    - 路线: 自我纠正与失败归因
      解决的问题: 诊断自主实验失败原因，并将修正路由到假设、实验设计或实现，以提高带指标输出的比例。
      尚未覆盖: 尚未缩小到可靠自主写作或会议级论文的差距；归因效果受可用诊断轨迹证据限制。
    - 路线: 验证与有效性门控
      解决的问题: 增加物理感知或视觉检查，在结果被接受或报告前捕获静默实验失败。
      尚未覆盖: 门控可能漏检植入失败；当前证据主要集中在CFD式仿真任务，跨领域验证有限。
    - 路线: 多智能体协作研究平台
      解决的问题: 提供可定制角色、实时监控、本地代码和数据集集成、回滚/恢复以及工件检查能力。
      尚未覆盖: 评估规模较小且为内部案例，并由AI专家评判；平台成熟度和外部泛化性仍未解决。
    共识:
    - 自主发现系统收敛到从假设或想法形成到执行、分析和报告的多阶段闭环。
    - 评估越来越要求明确的工件、指标以及基线或人类对照，而不是不可验证的主张。
    - 当前系统尚不够稳定可靠；失败常出现在实现、评估或静默结果验证阶段。
    - 验证、专家评审和自我纠错被视为形成可辩护结果的必要组件。
    分歧:
    - 通用机器学习研究工作流与需要专门物理或生物有效性检查的领域特定工作流存在差异。
    - 纠错策略不同：单轮反思、结构化因果失败归因或环境特定有效性门控。
    - 评估目标不同：同行评审接受、基准任务完成、工件质量、盲审分数或人类基线对照。
    - 交互模式从全自主单智能体或树搜索流水线，到带自定义角色和回滚控制的人监控多智能体平台不等。
    开放问题:
    - 基准任务完成度和模拟评审分数能在多大程度上预测真实科学有效性或下游决策效用？
    - 领域专用验证门控和失败归因机制能否泛化到证据中CFD、组学和机器学习之外的环境？
    - 当自主系统能在极少人类干预下写作、执行和提交论文时，应适用哪些可复现性与治理标准？
    - 如何避免已记录的过度兴奋、实现漂移和科学品味不足等失败模式？
    - 证据中缺失的代码、数据集、基线或局限性细节，哪些是最强主张的关键验证缺口？
