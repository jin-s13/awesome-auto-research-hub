    consensus:
    - Autonomous research systems increasingly cover the full loop from idea generation
      through experimentation and manuscript drafting.
    - Verification or review loops are common mechanisms for improving reliability,
      though their forms range from automated reviewers to domain-specific physics
      or logic checks.
    - Current systems are evaluated with benchmark tasks, baseline agents, and domain
      metrics, but human-level autonomous scientific discovery is not consistently
      reached.
    - Recent systems expose reproducibility signals such as code and artifacts, but
      detailed limitation and failure evidence remain incomplete.
    disagreements:
    - 'Supervision differs: some systems pursue full autonomy, while others argue
      targeted human collaboration outperforms both full autonomy and step-by-step
      oversight.'
    - Evaluation targets differ across general machine-learning research loops, physics
      simulation discovery, applied mathematics reasoning, and omics data analysis.
    - 'Validity signals differ: LLM-based review scores, virtual environment completion,
