    ability alone.'
  - 'Shared research pattern: Agentic closed-loop science covering hypothesis generation,
    code and experiment execution, analysis, and manuscript generation, with independent
    verification or evaluation layers intended to catch invalid claims.'
  - 'Key differences: Some work targets domain-specific discovery with physical, forecasting,
    or biological validators; other work builds general discovery environments or
    end-to-end agents. Evaluation signals split across task completion, automated
    review, evidence maturity, and downstream performance.'
  - 'Trend evolution: 2024 evidence focuses on end-to-end paper generation and broad
    discovery environments; 2025-2026 evidence shifts toward validity gates, authority
    separation, domain benchmarks, and evidence-maturity scoring.'
  - 'Open questions: Whether automated review/judges match real scientific validity;
