  related_work_outline:
  - 'Mainstream direction: Build end-to-end autonomous research agents that propose
    hypotheses, execute experiments, and report results, with selective human oversight
    at high-leverage points; AutoResearchClaw, SAGE, and EvoMaster illustrate this
    pattern.'
  - 'Shared research pattern: Large model reasoning is coupled with iterative execution,
    verification, or self-correction loops, often through multi-agent debate or self-evolution,
    and compared with AI Scientist-style baselines.'
  - 'Key differences: Systems differ in domain grounding, such as physics simulation
    in AI CFD Scientist or Lean proofs in CausalForge, in verification mechanism,
    human-in-the-loop placement, and evaluation targets.'
  - 'Trend evolution: The available evidence sits mainly in 2025-2026 and shows a
    shift from isolated ideation toward verifiable, self-correcting, domain-grounded
    pipelines, with human baselines and benchmark-style evaluation emerging.'
  - 'Open questions: Whether generated hypotheses remain scientifically meaningful
    outside their evaluation setting, how to generalize verification, and what level
    of human oversight is required.'
  related_work_outline_zh:
  - 主流方向：构建端到端自主研究智能体，使其提出假设、执行实验并报告结果，在高杠杆节点引入选择性人类监督；AutoResearchClaw、SAGE 和 EvoMaster
    是典型例子。
  - 研究共性：将大模型推理与迭代执行、验证或自我纠正循环结合，常采用多智能体辩论或自我演化，并与 AI Scientist 类基线比较。
  - 关键差异：系统在领域约束上存在不同，如 AI CFD Scientist 采用物理仿真、CausalForge 采用 Lean 证明，验证机制、人类介入位置和评测目标也不同。
  - 趋势演进：现有证据主要集中在 2025-2026 年，显示从孤立构思走向可验证、可自我纠正、领域约束的流水线，并开始出现人类基线与基准化评测。
  - 开放问题：生成假设在其评测设置之外是否仍具科学意义，验证如何泛化，以及需要何种程度的人类监督。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Converting research goals into generated hypotheses, executable
        experiments, and reports, often with multi-agent debate or self-evolution.
      what_remains_open: Evidence relies on limited internal case studies or aggregate
        task scores; cross-discipline generalization and human oversight placement
        are not yet established.
    - line: Verification and self-correction mechanisms
      what_it_solves: Detecting failed experiments, invalid outputs, hallucinated
        citations, or physical/formal inconsistencies before accepting results.
      what_remains_open: Verification gates can miss silent failures, and formal proofs
        do not guarantee that formalization matches intended scientific claims.
    - line: Domain-grounded hypothesis generation
      what_it_solves: Constraining hypotheses within physics, causal inference, or
        biological data constraints using simulators, proof assistants, or expert-labeled
        data.
      what_remains_open: Demonstrations are narrow; scaling to open-ended hypothesis
        spaces and external validity remain unresolved.
    - line: Benchmarks and human-baseline evaluation
      what_it_solves: Creating tasks, datasets, baseline comparisons, and human performance
        references for AI scientists.
      what_remains_open: Proxy metrics may not capture real discovery utility; task
        diversity and external validation are limited.
    - line: Surveys and organizational frameworks
      what_it_solves: Categorizing agentic scientific discovery capabilities, evaluation
        metrics, implementation frameworks, and challenges.
      what_remains_open: Categories are largely descriptive, and direct empirical
        validation that they predict system behavior is lacking.
    consensus:
    - These systems treat hypothesis generation as an iterative loop of proposal,
      execution, and revision rather than one-shot generation.
    - They agree that autonomous research needs verification or validity gates to
      reduce silent failures and fabricated claims.
    - They commonly evaluate via benchmark or case-study comparisons and emphasize
      human involvement at high-leverage points rather than full autonomy or exhaustive
      oversight.
    - They agree that domain constraints improve plausibility but do not by themselves
      ensure full scientific validity.
    disagreements:
    - 'They differ in grounding: some rely on physics simulators or formal proof assistants,
      while others use general task suites or biological expert labels.'
    - 'They differ in verification target: vision-language physical checks, machine-checked
      formal proofs, failure attribution, or verifiable reporting.'
    - 'They differ in interaction mode: from nearly autonomous operation with optional
      oversight to human-AI collaboration with multiple intervention modes.'
    - 'They differ in evaluation target: domain-specific discovery metrics, formal
      artifact correctness, or aggregate task-score improvements.'
    open_questions:
    - What evidence shows generated hypotheses remain scientifically meaningful beyond
      the simulator, benchmark, or proof environment that produced them?
    - How can verification coverage be extended when silent failures and formalization
      gaps are known to persist?
    - What level and placement of human intervention yields the best trade-off between
      autonomy and reliability?
    - Do current agentic research pipelines transfer across life sciences, physical
      sciences, and formal theory without task-specific re-engineering?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究智能体
      解决的问题: 把研究目标转化为生成式假设、可执行实验与报告，常包含多智能体辩论或自我演化。
      尚未覆盖: 证据多来自有限内部案例或聚合任务分数；跨学科泛化与人类监督位置尚未充分验证。
    - 路线: 验证与自我纠正机制
      解决的问题: 在接收结果前检测失败实验、无效输出、幻觉引用或物理/形式不一致。
      尚未覆盖: 验证门控可能漏检静默失败；形式证明无法保证形式化与原始科学主张一致。
    - 路线: 领域约束下的假设生成
      解决的问题: 借助模拟器、证明助手或专家标注数据，将假设限制在物理、因果推断或生物数据约束内。
      尚未覆盖: 展示范围较窄，向开放假设空间扩展与外部有效性仍不明确。
    - 路线: 基准与人类基线评测
      解决的问题: 为 AI 科学家提供任务、数据集、基线对比和人类表现参考。
      尚未覆盖: 代理指标未必反映真实发现效用，任务多样性不足，外部验证有限。
    - 路线: 综述与组织性框架
      解决的问题: 对智能体科学发现的能力、评估指标、实现框架和挑战进行分类。
      尚未覆盖: 分类多为描述性，缺少分类能预测系统行为的直接实证验证。
    共识:
    - 这些系统一致将假设生成分解为提案、执行和修正的迭代循环，而非一次性输出。
    - 它们都认为自主研究需要验证或有效性门控，以减少静默失败和伪造结果。
    - 它们多采用基准或案例研究比较，并强调在高杠杆决策点引入人类参与，而非完全自主或逐步监督。
    - 它们都认同领域约束能提升假设合理性，但尚不能保证完整科学有效性。
