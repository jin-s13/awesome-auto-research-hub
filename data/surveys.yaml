    - 路线: 有效性门控与自纠正研究循环
      解决的问题: 通过验证、失败归因和基于事实的报告，从实验或证明失败中恢复。
      尚未覆盖: 验证门控不完整；例如有物理门控遗漏 16 个植入失败中的 2 个，形式化证明也不保证非形式化主张对齐。
    - 路线: 科学发现基准与人类基线
      解决的问题: 通过任务、基线和人类专家评分使 AI 科学家声明可比较。
      尚未覆盖: 基准使用选择题或案例偏好等代理结果；真实发现效用和覆盖范围仍未解决。
    - 路线: 面向理论假设生成的形式化验证
      解决的问题: 为因果推断生成机器可验证的定理或证明产物，并审计陈述对齐。
      尚未覆盖: 形式化正确性受假设约束；陈述审计和人工检查仍留下未测试的对齐缺口。
    - 路线: 概念综述与组织框架
      解决的问题: 跨学科梳理智能体发现能力、评估指标、数据集和挑战。
      尚未覆盖: 分类多为描述性，缺乏能预测系统行为或可靠性的直接实证验证。
    共识:
    - 假设生成只有在与可执行验证、测量证据和产物或报告生产连接时才被视为有用，而不是自由文本建议。
    - 当前系统仍依赖人工、形式化或学习到的门控来捕捉伪造数字、静默失败或声明错位。
    - 当评测包含基线、消融、指标和人类或专家判断时最强；本数据包中缺失的引用或声望信号与方法学证据是分开的。
    分歧:
    - 验证机制不同：有的使用渲染流场等域特定感知，有的使用形式化证明助手，还有的使用结构化失败归因或人机协同检查点。
    - 监督信号与评测目标不同：一个路线在真实组学数据上以研究生水平人类基线为基准，另一些则使用 AI 评审判例研究或广泛研究基准；这改变了“发现成功”的含义。
    - 交互或部署设置不同：有些是封闭自主循环，有些是带回滚或恢复和可定制团队的交互式平台，还有些形式化验证理论主张而不是运行实验。
    开放问题:
    - 有效性门控、自演化或自纠正带来的改进能否迁移到未知科学领域和真实发现，还是主要提升基准执行质量？
    - 评测应如何平衡任务特定指标、人类基线和 AI 评审判据，而当前证据显示不同系统在不同标准下各有所胜？
    - 静默失败检测器、陈述审计或形式化验证能否完备到足以在减少人工监督的同时降低看似合理但错误结果的风险？
    - 可复现性证据仍缺什么？若干论文报告了仓库或工件信号，但数据包未提供实际链接、数据集或独立复现结果，因此只能标记为验证缺口。
