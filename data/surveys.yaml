  related_work_outline_zh:
  - 主流方向：以自主研究智能体为核心，贯通科研构思、代码或实验执行、验证和完整论文撰写，代表工作包括 The AI Scientist、The AI Scientist-v2、ReasFlow
    和 AI CFD Scientist。
  - 研究共性：将科学写作拆成流水线阶段，并在论文输出前引入评审或验证循环，以抑制幻觉结果、无效执行或不可验证主张。
  - 关键差异：验证策略、监督方式、评测目标和领域专化不同；系统分别依赖 LLM 评审分数、物理感知门控、失败归因或针对性人机协作。
  - 趋势演进：从2024年通用自动发现框架，到2025年工作坊级树搜索与同行评审接收，再到2026年领域专化与强验证系统，重心转向可靠性、自纠错和人机协同。
  - 开放问题：生成论文的科学可靠性如何验证；自主或人机协同工作流在何种条件下跨领域推广；现有评测是否捕捉真实贡献而非代理分数。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: 'Automates the full research-to-writing cycle: literature synthesis,
        hypothesis generation, code and experiment execution, visualization, and manuscript
        composition.'
      what_remains_open: Consistency and defensibility of generated claims remain
        limited; evidence shows only partial peer-review success and no full conference-grade
        validation.
    - line: Domain-specific scientific discovery and writing agents
      what_it_solves: Couples literature-grounded ideation, domain tooling, and figure-grounded
        writing for constrained fields such as applied mathematics or computational
        fluid dynamics.
      what_remains_open: Residual silent failures in domain verification and transfer
        beyond the narrow physical or mathematical settings used for evaluation.
    - line: Verification, self-correction, and failure attribution
      what_it_solves: Detects invalid outputs, hallucinated numbers, and failed experiments
        through logic audits, vision-language gates, or multi-hypothesis causal diagnosis
        before reporting results.
      what_remains_open: Automated gates still miss planted failures, and attribution
        quality has not been validated across diverse long-horizon research tasks.
    - line: Human-AI collaboration and oversight strategies
      what_it_solves: Optimizes division of labor between human experts and autonomous
        agents, from principal-investigator-style roles to targeted high-leverage
        intervention points.
      what_remains_open: The necessary intervention granularity and domain knowledge
        level for reliable manuscript production across disciplines remains unresolved.
    - line: Evaluation and failure-mode analysis for research-writing systems
      what_it_solves: Makes research-writing agents comparable through benchmarks,
        reviewer rubrics, acceptance thresholds, and documented failure taxonomies.
      what_remains_open: Proxy metrics and small case studies have not been shown
        to predict real scientific contribution, novelty, or long-term reproducibility.
    consensus:
    - Autonomous research-writing systems converge on decomposing scientific work
      into ideation, execution, analysis, verification, and manuscript drafting stages
      coordinated by LLM agents.
    - Generated papers are treated as the final communication artifact and are evaluated
      with reviewer-like scoring or peer acceptance thresholds.
    - Raw generation without validation is treated as insufficient for defensible
      claims; verification or failure correction is increasingly required before reporting
      results.
    - Human review, simulated review, or automated evaluators remain the primary quality
      signal, but their alignment with true scientific contribution is not established.
    disagreements:
    - 'Verification strategy differs: retrospective review scoring, logic and coherence
      auditing, vision-language physical plausibility checking, or causal failure
      attribution with self-correction.'
    - 'Supervision mode differs: full autonomy, domain-specific human principal-investigator
      and graduate-student roles, or targeted human intervention at high-leverage
      decision points.'
    - 'Evaluation target differs: curated LLM rubrics, ARC-Bench experiment-stage
      tasks, blind review scores, workshop acceptance, or domain metric improvement
      such as wall Cf RMSE.'
    - 'Deployment setting differs: general machine learning research versus domain-constrained
      applied mathematics or computational fluid dynamics.'
    open_questions:
    - Do automated reviewer scores and workshop acceptance thresholds align with scientific
      validity and communication quality beyond the small number of papers generated
      in these studies?
    - Why do self-correction and verification systems still miss silent failures,
      such as the two planted failures not detected by one physics-aware gate?
    - How should human oversight be allocated when targeted high-leverage intervention
      outperformed exhaustive step-by-step oversight in one ablation?
    - Can domain-specific writing agents transfer to other scientific domains without
      hand-built physics or knowledge retrieval infrastructure?
    - What verification evidence is absent from current papers, including open datasets,
      standardized baselines, or external replications, and how should those gaps
      be closed?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究与论文生成系统
      解决的问题: 自动化从文献综合、假设生成、代码与实验执行、可视化到论文撰写的完整研究与写作周期。
      尚未覆盖: 生成主张的一致性与可辩护性仍然有限；证据显示仅部分通过同行评审，尚无完整会议级验证。
    - 路线: 领域专用的科学发现与写作智能体
      解决的问题: 把文献驱动构思、领域工具和基于图表的写作耦合起来，服务应用数学或计算流体力学等限定场景。
      尚未覆盖: 领域验证仍存在残留静默失败，且未证明能迁移到评估使用的狭窄物理或数学设置之外。
    - 路线: 验证、自纠错与失败归因
      解决的问题: 通过逻辑审计、视觉-语言门控或多假设因果诊断，在报告结果前检测无效输出、幻觉数字和失败实验。
      尚未覆盖: 自动门控仍会漏掉植入失败，归因质量尚未在多样化长程研究任务中得到验证。
    - 路线: 人机协作与监督策略
      解决的问题: 优化人类专家与自主代理之间的分工，从首席研究员式角色到针对性高杠杆干预点。
      尚未覆盖: 可靠论文生产需要何种干预粒度与领域知识水平，跨学科仍无定论。
    - 路线: 写作研究系统的评测与失败模式分析
      解决的问题: 通过基准、评审量表、接收阈值和失败分类法，让研究写作智能体具备可比性。
      尚未覆盖: 代理指标和小规模案例研究尚未被证明能预测真实科学贡献、新颖性或长期可复现性。
    共识:
    - 自主研究写作系统普遍将科学工作分解为构思、执行、分析、验证和手稿起草等阶段，并由 LLM 智能体协调。
    - 生成论文被视为最终沟通产物，并通过类评审打分或同行接收阈值进行评测。
    - 仅生成文本或图表已不足以支撑可辩护主张；系统越来越需要在报告结果前引入验证或纠错。
    - 人类评审、模拟评审或自动评审仍是主要质量信号，但它们与真实科学贡献的一致性尚未建立。
    分歧:
    - 验证策略不同：有的侧重逻辑一致性审计，有的使用视觉-语言物理合理性检查，有的采用多假设失败归因与自纠错。
    - 监督方式不同：包括完全自主、领域专家担任首席研究员与研究生式角色，以及在高杠杆决策点进行针对性人工干预。
    - 评测目标不同：包括 LLM 评审分数、ARC-Bench 实验阶段任务、盲审分数、工作坊接收或领域指标改善如壁面 Cf RMSE。
    - 部署场景不同：从通用机器学习研究到应用数学、计算流体力学等限定领域。
    开放问题:
    - 自动评审分数和工作坊接收阈值能否在少量生成论文之外反映科学有效性、新颖性和沟通质量，仍未得到证明。
    - 为什么自纠错和验证系统仍会漏掉静默失败，例如某个物理感知门控未检测到两个植入失败。
    - 当一项消融显示针对性高杠杆干预优于逐步监督时，应如何分配人工监督才能跨领域复用。
    - 领域专用写作智能体能否在缺少手工构建物理或知识检索基础的条件下迁移到其他科学领域。
    - 当前论文缺少哪些可复现证据，如开放数据、标准化基线和外部复制，这些缺口应如何补足。
