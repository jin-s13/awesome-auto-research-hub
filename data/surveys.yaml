  literature_review:
    line_of_work_matrix:
    - line: Systems and reproducible infrastructure
      what_it_solves: Turning LLM-driven ideas into runnable autonomous research workflows
        that generate code, experiments, and papers, with inspectable artifacts and
        verification hooks for reproducibility.
      what_remains_open: Cross-domain generalization, long-horizon stability, systematic
        handling of scientific taste, and verification gate reliability (e.g., physics-aware
        gates may still miss silent failures).
    - line: Evaluation and evidence design
      what_it_solves: Enabling comparison of AI scientist capabilities through standardized
        tasks, benchmarks, metrics, and human baselines, and constraining outputs
        to measured values to reduce hallucination.
      what_remains_open: The gap between simulated environments and real-world scientific
        discovery, whether task coverage reflects scientific breadth, and alignment
        between proxy metrics and expert human judgment.
    - line: Conceptual taxonomy of failure and design principles
      what_it_solves: Providing systematic classification of failure modes (e.g.,
        implementation drift, memory degradation, overexcitement) and deriving design
        principles to guide more robust AI scientist development.
      what_remains_open: Whether these taxonomies predict behavior of new systems,
        and whether the proposed design principles consistently improve empirical
        performance, as direct validation is still lacking.
    consensus:
    - Current LLM-based AI scientists remain significantly limited in fully autonomous,
      end-to-end scientific discovery, especially in experimental design, scientific
      taste, and reliability.
    - Standardized evaluation environments and benchmarks are critical for measuring
      progress, but existing benchmarks do not yet capture the full complexity of
      real scientific inquiry.
    - Reproducibility and verification mechanisms (code execution, physics sanity
      checks, grounded reporting) are essential directions for improving the trustworthiness
      of AI-generated science.
    - Human expert review or baselines are still the primary reference for judging
      the quality of AI-produced scientific outputs.
    disagreements:
    - 'Evaluation scope: some works target narrow, domain-specific verification (e.g.,
      CFD wall shear stress, single-cell annotation), while others aim for general-purpose
      ML or multi-domain benchmarks.'
    - 'Verification strategy: pre-hoc validity gates (vision-language physics checks)
      versus post-hoc multi-hypothesis failure attribution and self-correction, versus
      purely analytic failure mode documentation without corrective action.'
    - 'Interaction model: single-agent pipelines, configurable multi-agent teams with
      real-time dashboards, and human-in-the-loop monitoring represent different assumptions
      about how research should be orchestrated.'
    - 'Success criteria: accepted workshop paper, improvement over baselines, metrics-bearing
      output rate, artifact quality scores, and blind expert preference are used without
      a common definition of what constitutes a meaningful scientific contribution.'
    open_questions:
    - How can we evaluate whether an AI scientist produces genuinely novel discoveries
      rather than recombining known patterns or overfitting to benchmark metrics?
    - To what extent do existing verification gates and self-correction mechanisms
      transfer to unstructured, interdisciplinary research settings far from their
      training domains?
    - What would a multi-disciplinary, real-world benchmark for AI scientists look
      like, and how could it balance standardization with the open-ended nature of
      science?
    - How can we systematically address the identified fundamental limitations—scientific
      taste, domain intelligence, long-horizon context degradation—that currently
      prevent robust autonomous research?
