  related_work_outline:
  - 'Mainstream direction: autonomous agentic pipelines for scientific discovery dominate,
    combining literature synthesis, code execution, internal verification, and paper
    drafting; evaluation is moving toward blind, evidence-grounded benchmarks built
    from peer-reviewed studies.'
  - 'Shared research pattern: systems decompose discovery into workflows and use LLM-based
    judges or human baselines to assess evidentiary maturity, novelty, and auditability;
    peer-reviewed studies often serve as hidden targets to reduce data leakage.'
  - 'Key differences: papers differ on whether they build generation systems, evaluation
    benchmarks, or failure-mode case studies; targets range from applied mathematics
    paper generation and single-cell omics to ML research and general science benchmarks.'
  - 'Trend evolution: evidence concentrates in 2025–2026, shifting from broad surveys
    and domain benchmarks toward blind evidence evaluation, failure-mode taxonomies,
    and self-evolving frameworks; this remains within the current frontier.'
  - 'Open questions: whether LLM-judge scores can replace human review for open-ended
    discovery; whether systems generalize across base models and domains; whether
    self-evolving frameworks improve scientific judgment rather than benchmark scores.'
  related_work_outline_zh:
  - 主流方向：自主智能体流水线用于科学发现，通常整合文献综合、代码执行、内部验证与论文撰写；评测正转向基于同行评审研究的盲测、证据锚定基准。
  - 研究共性：系统把发现流程分解为工作流，并以LLM评判或人类基线评估证据成熟度、新颖性与可审计性；同行评审研究常被用作隐藏目标以减少数据泄漏。
  - 关键差异：研究分别构建生成系统、评测基准或失败模式案例；评测目标涵盖应用数学论文生成、单细胞组学、机器学习发现与通用科学基准。
  - 趋势演进：证据集中在2025–2026年，从综述和领域基准转向盲测证据评测、失败模式分类与自演化框架；仍在当前前沿内。
  - 开放问题：LLM评判分数能否替代开放发现中的人类评审；系统能否跨基座模型与领域泛化；自演化框架是否提升科学判断而非仅提高基准分。
  literature_review:
    line_of_work_matrix:
    - line: Evidence-grounded evaluation of open-ended discovery agents
      what_it_solves: Creates blind tasks from peer-reviewed studies and fixed LLM
        rubric dimensions to compare whether agents support claims with adequate evidence.
      what_remains_open: Evaluation is currently tied to one frozen base model; agents
        lack controls, robustness, falsifiability, and cross-dataset generalization;
        LLM-judge alignment with human review is not established.
    - line: Literature synthesis and paper generation agents
      what_it_solves: Automates retrieval, reasoning, verification, and manuscript
        preparation in a human-principal-investigator plus agent workflow.
      what_remains_open: Reported success depends on curated LLM review rubrics; no
        external citation or code artifact is evidenced; limitations are not stated;
        generalization beyond applied mathematics is unclear.
    - line: Domain-specific scientific discovery benchmarks
      what_it_solves: Provides expert-labeled biological datasets and published-study-derived
        questions to compare AI scientists against human bioinformaticians.
      what_remains_open: Current systems fall short of fully autonomous discovery;
        the human baseline is narrowly described; no limitation section is provided
        to bound conclusions.
    - line: Failure-mode and design-principle analysis
      what_it_solves: Maps LLM-agent pipeline stages to a scientific workflow and
        documents recurring failure modes from end-to-end research attempts.
      what_remains_open: Evidence comes from four attempts with one success, so failure
        frequencies are not statistically established; design principles are not yet
        validated across domains.
    - line: Self-evolving domain-agnostic agent infrastructure
      what_it_solves: Provides reusable mechanisms for hypothesis refinement, self-critique,
        and knowledge accumulation across disciplines with minimal per-domain code.
      what_remains_open: Benchmark gains over a single baseline may not reflect trustworthy
        scientific discovery; limitations and external reproducibility artifacts are
        absent from the packet.
    consensus:
    - Agentic systems can execute and document analyses competently but remain below
      fully autonomous discovery.
    - Human oversight, verification loops, and evidence-grounded evaluation are recurring
      mechanisms to reduce failure.
    - Literature review automation is identified as a critical unresolved challenge
      within scientific agent workflows.
    - Peer-reviewed studies are used as hidden evidence sources to strengthen evaluation
      validity.
    disagreements:
    - Some studies generate complete papers via human-agent collaboration, while others
      measure open-ended agents through blind evidence tasks or multiple-choice domain
      questions.
    - 'Success criteria differ: LLM-judge rubric scores, workshop acceptance, comparison
      with graduate-level human performance, or broad benchmark accuracy.'
    - Evaluation targets differ across applied mathematics, single-cell transcriptomics,
      machine-learning research, and general science benchmarks.
    - Interaction modes differ from a human principal investigator directing an agent
      to fully autonomous coding agents.
    - Evidence representation differs between auditability dimensions such as controls,
      robustness, and falsifiability, and task-specific annotation accuracy.
    open_questions:
    - How well do fixed LLM-judge rubrics track human scientific review for open-ended
      claims?
    - Can current literature-synthesis agents avoid hallucination and produce trustworthy
      surveys beyond curated generation examples?
    - Do gains on broad science benchmarks transfer to domain-specific discovery tasks
      and real-world research utility?
    - What controls, robustness checks, and cross-dataset validations would turn agent
      outputs into defensible scientific evidence?
    - How do self-evolving agents balance knowledge accumulation with memory and context
      degradation across long-horizon tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 开放式发现智能体的证据锚定评测
      解决的问题: 基于同行评审研究构造盲任务，并用固定LLM评分维度比较智能体是否以充分证据支撑主张。
      尚未覆盖: 评测目前依赖单一冻结基座模型；智能体缺乏对照、稳健性、可证伪性与跨数据集泛化；LLM评判与人类评审的一致性尚未确立。
    - 路线: 文献综合与论文生成智能体
      解决的问题: 在“人类首席研究员 + 智能体”工作流中自动完成检索、推理、验证和论文撰写。
      尚未覆盖: 性能依赖人工设计的LLM评审标准；证据包未提供外部引用或代码工件；未说明局限性；能否推广到应用数学之外仍不清楚。
    - 路线: 领域特定的科学发现基准
      解决的问题: 使用专家标注的生物学数据与已发表研究衍生问题，对比AI科学家和人类生信分析人员。
      尚未覆盖: 当前系统尚未达到完全自主发现；人类基线描述较窄；缺少局限性说明以约束结论。
    - 路线: 失败模式与设计原则分析
      解决的问题: 将LLM智能体流水线映射到科学工作流各阶段，从端到端研究尝试中记录重复失败模式。
      尚未覆盖: 证据来自四次尝试且仅一次成功，失败频率缺乏统计可靠性；设计原则尚未跨领域验证。
    - 路线: 领域无关的自演化智能体基础设施
      解决的问题: 提供可复用的假设优化、自我批判与知识积累机制，用少量领域代码适配不同学科。
      尚未覆盖: 相对单一基线的基准提升未必反映可信科学发现；证据包缺少局限性和外部可复现工件。
    共识:
    - 智能体系统能够执行并记录分析，但仍未达到完全自主的科学发现。
    - 人工监督、验证循环和证据锚定评测是减少失败的常见机制。
    - 文献综述自动化被视为科学智能体工作流中的关键未解挑战。
    - 同行评审研究常被用作隐藏证据来源，以增强评测有效性。
    分歧:
    - 有的研究通过人机协作生成完整论文，有的则通过盲测证据任务或领域选择题评测智能体。
    - 成功标准不同：LLM评判分数、研讨会接收、与研究生水平人类表现对比，或广泛基准精度。
    - 评测目标涵盖应用数学、单细胞转录组、机器学习研究和一般科学基准。
    - 交互模式从人类首席研究员指导智能体到完全自主编码智能体不等。
    - 证据表示存在差异：有的强调对照、稳健性与可证伪性等审计维度，有的强调任务特定的注释精度。
    开放问题:
    - 固定LLM评判标准在多大程度上能追踪人类对开放式科学主张的评审？
    - 当前文献综合智能体能否避免幻觉，并在精选生成样例之外产生可信综述？
    - 广泛科学基准上的提升能否迁移到领域特定发现任务和真实研究效用？
    - 哪些对照、稳健性检查和跨数据集验证能把智能体输出转化为可辩护的科学证据？
    - 自演化智能体如何在长周期任务中平衡知识积累与记忆或上下文退化？
