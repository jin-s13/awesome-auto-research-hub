      what_remains_open: Coverage of domains is limited, and agreement between proxy
        metrics or automated reviewers and real scientific utility is not established.
    - line: Failure-aware memory and self-verification
      what_it_solves: Recording rejected or failed attempts and auditing logical coherence
        so agents can correct errors and avoid repeating unsuccessful experiments.
      what_remains_open: Evidence centers on PDE and science-agent settings; long-horizon
