    - 'Control strategy differs: agentic tree search, failure-aware memory, internal
      verification loops, and role-based multi-agent workflows are used as alternative
      reliability mechanisms.'
    open_questions:
    - How should LLM-based judges be validated against real scientific utility when
      several papers report only simulated review scores?
    - What explains the inverse author/reviewer ablation-planning performance, and
      how can that grounding gap be closed?
    - Can systems designed for code-based ML experiments transfer to lab-based or
      theory-driven experiment automation without new environment-specific scaffolding?
    - What are the minimal reproducibility signals needed to trust autonomous research
      agents across hardware, datasets, and user settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自动发现智能体
      解决的问题: 关联合从研究想法到代码、实验、结果与论文生成的全流程
      尚未覆盖: 多次运行和跨领域可靠性有限，工作坊级仅部分通过，尚未证明可支持实验室发现
    - 路线: 实验规划与消融设计
      解决的问题: 决定应运行哪些实验或消融来验证方法
      尚未覆盖: 封闭世界评测；现有智能体只识别出人类消融的一部分，作者/审稿人行为不一致
    - 路线: 面向科学发现的虚拟评测环境
      解决的问题: 提供标准任务集，评测假设形成、实验执行、分析与结论
      尚未覆盖: 从模拟任务到真实实验室工作和长期发现的迁移仍不清楚
    - 路线: 记忆与失败感知迭代
      解决的问题: 记录失败尝试，使后续研究循环避免重复错误并减少 token 消耗
      尚未覆盖: 证据限于少量基准和 PDE 任务；失败知识整理质量与迁移边界尚未完全确定
    - 路线: 交互式多智能体研究基础设施
      解决的问题: 支持人类监控的团队编排、代码与数据集集成、回滚和工件检查
      尚未覆盖: 仅有小型内部案例研究；在 AI 工作流之外的成熟度与泛化未被证明
    共识:
    - LLM 智能体能够生成看似合理的实验工件，并管理多步研究工作流。
    - 自动评审或 LLM 评判已成为常见评估捷径，但其效度仍依赖与人类判断的一致性。
    - 显式验证、树搜索或失败感知记忆通常能改善单次直通式研究智能体的表现。
    - 当前系统在开放式科学发现和实验规划上仍不如人类可靠。
    分歧:
    - 评测目标不同：有的优化论文整篇接受，有的优化任务完成、消融召回或新颖性/完整性/呈现偏好。
    - 交互模式不同：全自动端到端流水线与人类在环仪表盘、首席研究员-研究生式协作形成对比。
    - 领域重点不同：基于代码的实证 AI 实验是主流，而推理驱动的应用数学被视为单独的自动化前沿。
    - 控制策略不同：智能体树搜索、失败感知记忆、内部验证循环和角色多智能体流程被用作不同的可靠性增强机制。
    开放问题:
    - 当多篇论文仅报告模拟评审得分时，应如何验证 LLM 评判器相对真实科学效用的可靠性？
    - 消融规划的作者/审稿人性能出现反向差异，其背后的原因是什么，如何消除这一基础性差距？
    - 为基于代码的 ML 实验设计的系统，能否在没有环境专用脚手架的情况下迁移到实验室或理论驱动实验自动化？
    - 需要哪些最小可复现信号，才能使自主研究智能体跨硬件、数据集和用户设置被信任？
