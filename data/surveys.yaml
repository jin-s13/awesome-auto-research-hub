    - 交互模式不同：全自动发现、人类作为PI的协作、以及可定制多智能体仪表板等模式并存。
    - 部署场景不同：模拟文本环境、真实科学ML基准、应用数学理论推导等场景存在差异。
    - 改进机制不同：端到端树搜索、负知识记忆、知识检索和插件式技能分别针对不同瓶颈。
