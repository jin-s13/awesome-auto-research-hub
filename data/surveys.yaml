  literature_review:
    line_of_work_matrix:
    - line: Autonomous multi-agent hypothesis generation and iterative refinement
        workflows
      what_it_solves: turning literature and data into hypotheses that are updated
        through experimental feedback, code execution, and result interpretation
      what_remains_open: report statement accuracy, weak-direction rejection, and
