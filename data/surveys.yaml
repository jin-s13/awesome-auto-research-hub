  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agents
      what_it_solves: Turning a broad research objective into executable ideation,
        experimentation, visualization, and manuscript writing with minimal human
        templates.
      what_remains_open: 'Consistency and reliability remain unproven: only one of
        three v2 submissions passed, and many results rely on automated or workshop-level
        acceptance rather than full peer consensus.'
    - line: Domain-specific agents with verification gates
      what_it_solves: Grounding autonomous research in domain validity checks before
        results are accepted, reducing silent solver or simulation failures.
      what_remains_open: A vision-language physics gate still missed 2 of 16 planted
        silent failures, so coverage and generalization beyond a single fluid dynamics
        case are unresolved.
    - line: Virtual discovery benchmark environments
      what_it_solves: Providing repeatable, task-based evaluation of complete discovery
        cycles in controlled simulated settings.
      what_remains_open: Strong prior baselines fail, but transfer from simulated
        task completion to real-world scientific discovery utility is not established.
    - line: Evidence-grounded blind evaluation rubrics
      what_it_solves: Scoring open-ended research claims by evidentiary maturity with
        blinded objectives and frozen data, avoiding reproduction of hidden target
        studies.
      what_remains_open: Performance was tested on one frozen base model, and agents
        lacked controls, robustness, falsifiability, and cross-dataset generalization.
    - line: Domain-specific human-baseline benchmarks
      what_it_solves: Comparing AI scientists against human experts on real data tasks
        such as cell annotation and discovery questions.
      what_remains_open: Current agents still fall short of fully autonomous biological
        discovery, and the multiple-choice/discovery split may not cover broader lab
        reasoning.
    - line: Interactive multi-agent research platforms
      what_it_solves: Providing runnable, monitorable research workflows with customizable
        roles, a code harness, and experiment feedback.
      what_remains_open: Evidence is limited to five internal case studies and expert
        preference judgments, leaving external generalizability and maturity unverified.
    consensus:
    - Current AI research agents can execute and document analyses competently, but
      the evidence shows they are not yet fully autonomous or trustworthy scientific
      discoverers.
    - Evaluation is moving beyond task completion toward evidence maturity, blind
      tasks, validity gates, and human or expert comparison.
    - Verification gaps persist around silent failures, controls, robustness, falsifiability,
      and cross-domain generalization.
    - Automated reviewers, expert judges, and human baselines are complementary but
      remain proxy signals whose external validity is not yet established.
    disagreements:
