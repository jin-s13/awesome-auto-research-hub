  related_work_outline:
  - 'Mainstream direction: The strongest available evidence points to autonomous scientific
    research agents that fold literature synthesis, hypothesis generation, analysis,
    and manuscript writing into one multi-agent pipeline; evaluation is shifting toward
    evidence-grounded, domain-specific benchmarks and LLM-judged rubrics.'
  - 'Shared research pattern: Systems decompose discovery into stages and use retrieval,
    self-critique or verification, and LLM-based judging; most works report scores
    on curated tasks or generated outputs, while also noting limited generalization
    and missing human-level scientific judgment.'
  - 'Key differences: Works differ in evaluation target: blind evidence interpretation,
    domain-specific annotation and questions, complete paper generation, or general
    science benchmark scaling; supervision also differs from human baselines to automated
    judges to peer review acceptance.'
  - 'Trend evolution: The bounded top evidence spans mainly 2025-2026, so the trend
    is within the current frontier: from surveys of agentic science toward concrete
    multi-agent frameworks and evidence-grounded evaluation; earlier years are not
    visible in this packet.'
  - 'Open questions: Whether automated judges and proxy metrics measure true discovery
    or literature intelligence, whether claims generalize across models and domains,
    and what verification or artifact gaps must be closed before trust in autonomous
    synthesis is justified.'
  related_work_outline_zh:
  - 主流方向：现有证据集中于自主科研智能体，将文献综合、假设生成、分析、验证和论文撰写纳入多智能体流水线；评测向证据锚定、领域相关的基准与基于LLM的评分标准转变。
  - 研究共性：多数工作采用检索、自批评或验证循环以及LLM裁判；它们报告生成物或基准任务上的分数，但也指出泛化有限、科学判断仍不足。
  - 关键差异：评估目标不同，包括冻结数据的盲证据解释、领域标注与选择题、完整论文生成或通用科学基准扩展；监督信号也不同于人类基线、自动裁判或同行评审接受。
  - 趋势演进：可见证据主要集中于2025至2026年，趋势主要体现在当前前沿：从智能体科学综述走向具体多智能体框架与证据驱动评测；更早年份的证据不足以判断长期演变。
  - 开放问题：自动裁判与代理指标能否衡量真正的发现或文献智能，结论能否跨模型和领域泛化，以及需要补足哪些验证与工件缺口才能信任自主综述。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous multi-agent research and literature-synthesis pipelines
      what_it_solves: Transforms literature search, derivation, analysis, and manuscript
        generation into staged agent workflows with human-in-the-loop or fully autonomous
        operation.
      what_remains_open: Long-horizon memory degradation, implementation drift, weak
        scientific taste, and uncertain logical or citation correctness without expert
        intervention.
    - line: Evidence-grounded benchmark design for open-ended discovery
      what_it_solves: Creates blind tasks from peer-reviewed studies or published
        datasets, freezing data while withholding conclusions to assess whether agents
        can infer what the data support.
      what_remains_open: Current evidence comes from a single frozen base model or
        narrow domains; proxy rubrics are not yet calibrated to real discovery or
        peer review.
    - line: Verification and knowledge-retrieval loops
      what_it_solves: Adds internal audits, self-critique, and automated retrieval
        of declarative facts and procedural heuristics to correct errors before human
        review.
      what_remains_open: Missing evidence on how retrieval and verification fail outside
        training distributions or under ambiguous interdisciplinary literature.
    - line: Survey and taxonomy formation for agentic science
      what_it_solves: Organizes capabilities, domains, evaluation metrics, frameworks,
        and challenges such as literature review automation and system reliability.
      what_remains_open: Categories remain largely descriptive; direct empirical validation
        that a taxonomy predicts system behavior is still absent.
    - line: Self-evolving domain-agnostic agent frameworks
      what_it_solves: Provides reusable scaffolding for agents to refine hypotheses,
        accumulate knowledge, and scale across scientific disciplines.
      what_remains_open: Unclear how much benchmark gain comes from base model, framework
        design, or task-specific prior; external reproducibility is still limited.
    consensus:
    - Multi-agent workflows are preferred over single-model systems for research and
      literature synthesis because they separate retrieval, reasoning, generation,
      and verification.
    - Automated evaluation with LLM-based judges or rubrics is common, but these are
      treated as proxies rather than replacements for human scientific judgment.
    - Current systems can execute and document analyses, yet they consistently lack
      controls, robustness, falsifiability, and cross-dataset generalization in open-ended
      discovery.
    - Verification, self-critique, or knowledge-retrieval loops are seen as necessary
      to reduce logical and evidentiary errors.
    - Domain-specific and evidence-grounded assessment is emerging as more informative
      than generic task success for scientific claims.
    disagreements:
    - 'Evaluation target differs: blind evidence interpretation from frozen data versus
      rubric-scored generated papers versus domain-specific annotation and multiple-choice
      questions.'
    - 'Supervision signal differs: some compare against graduate-level human baselines,
      others use fixed LLM judges, and others rely on human or multi-AI review acceptance.'
    - 'System scope differs: end-to-end theory and manuscript generation, coding-agent
      scientific analyses, domain-specific biological discovery, and general self-evolving
      benchmark systems.'
    - 'Interaction mode differs: human principal investigator with agent graduate
      student, autonomous coding agents executing analyses, or self-evolving agents
      refining hypotheses.'
    - Deployment setting differs across applied mathematics, omics data-driven biology,
      ML research workflows, and general science benchmark suites, which changes evidence
      type and failure modes.
    open_questions:
    - Can LLM-based rubrics be calibrated to human peer review for literature synthesis
      and open-ended discovery claims?
    - Do current evidence-grounded benchmarks measure literature intelligence and
      discovery, or mainly task-specific analysis and coding ability?
    - How do conclusions generalize across frozen base models, scientific domains,
      and datasets when current evidence uses only one base model or narrow domains?
    - What retrieval and verification mechanisms are sufficient to prevent citation,
      logical, and implementation errors in long-horizon literature-to-manuscript
      workflows?
    - Which absent artifacts such as code, data, evaluation rubrics, reproducible
      baselines, and limitation disclosures are verification gaps versus actual method
      limitations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主多智能体研究与文献综合流水线
      解决的问题: 将文献检索、推导、分析和论文生成组织为分阶段智能体工作流，支持人机协作或自主运行。
      尚未覆盖: 长程记忆退化、实现漂移、科学品味不足，以及无人工干预时逻辑与引用正确性不确定。
    - 路线: 面向开放式发现的证据锚定基准设计
      解决的问题: 用同行评审研究中的冻结数据构建盲任务，隐藏结论以评估智能体从数据推断证据主张的能力。
      尚未覆盖: 当前证据仅覆盖单一冻结基座模型或狭窄领域；代理评分标准尚未对标真实发现或同行评审。
    - 路线: 验证与知识检索循环
      解决的问题: 通过内部审计、自批评以及陈述性事实和过程性启发式检索，在人工审查前纠正错误。
      尚未覆盖: 检索与验证在训练分布外或模糊跨学科文献中的失败模式缺乏证据。
    - 路线: 智能体科学综述与分类体系
      解决的问题: 组织能力、领域、评估指标、框架以及文献综述自动化、系统可靠性等挑战。
      尚未覆盖: 分类仍偏描述性，能否预测系统行为缺少直接实证验证。
    - 路线: 领域无关的自我演化智能体框架
      解决的问题: 提供可复用脚手架，使智能体迭代假设、积累知识并跨学科扩展。
      尚未覆盖: 基准提升中有多少来自基座模型、框架设计或任务先验尚不清楚；外部可复现性仍有限。
    共识:
    - 多智能体工作流在研究与文献综合中比单一模型更常见，因为它将检索、推理、生成和验证分离。
    - 基于LLM的裁判或评分标准被广泛用于自动评估，但通常仅作为人类科学判断的替代指标。
    - 当前系统能执行并记录分析，但在开放式发现中普遍缺少对照、稳健性、可证伪性和跨数据集泛化。
    - 验证、自批评或知识检索循环被认为是减少逻辑与证据错误的必要机制。
    - 领域相关且证据锚定的评估被认为比通用任务成功更能说明科学声明的价值。
    分歧:
    - 评估目标不同：冻结数据的盲证据解释、评分生成论文、领域特定注释和选择题。
    - 监督信号不同：研究生级人类基线、固定LLM裁判，或人工与多AI评审接受。
    - 系统范围不同：端到端理论推导与论文生成、编码智能体科学分析、领域生物发现和通用自演化基准系统。
    - 交互模式不同：人类首席研究员与智能体研究生协作、自主编码智能体分析、自演化智能体迭代假设。
    - 部署场景不同：应用数学、组学数据驱动的生物学、ML研究工作流和通用科学基准，导致证据类型与失败模式不同。
    开放问题:
    - 基于LLM的评分标准能否对标人类同行评审，用于评估文献综合与开放式发现？
    - 当前证据锚定基准衡量的是文献智能和科学发现，还是主要是任务特定分析与编程能力？
    - 在现有证据仅使用单一基座模型或狭窄领域的情况下，结论如何跨模型、领域和数据集泛化？
    - 在长程文献到论文的工作流中，哪些检索与验证机制足以防止引用、逻辑和执行错误？
    - 缺失的工件如代码、数据、评估标准、可复现基线和限制披露，哪些属于可验证缺口，哪些是真实方法局限？
