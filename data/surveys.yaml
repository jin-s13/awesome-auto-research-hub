      解决的问题: 通过融入领域感知检查，如基于视觉的流场检查或数学内部证明验证，确保自主生成实验的物理或逻辑有效性。
      尚未覆盖: 验证门控并非完美（例如计算流体动力学中遗漏了16个静默失败中的2个），且其设计紧密耦合于目标领域，限制了向新科学领域的迁移。
    - 路线: AI科学家的基准与评估
      解决的问题: 提供标准化任务和指标来比较AI科学家智能体，超越临时论文评审，转向如DISCOVERYWORLD、BAISBench和ARC-Bench等结构化环境。
      尚未覆盖: 现有基准仅覆盖科学学科的一小部分；基准分数与真实世界科学贡献之间的相关性未经验证，人类基线通常规模小或不具代表性。
    - 路线: 人机协作模型
      解决的问题: 在关键决策点集成人类专业知识，以提高研究质量同时保持高度自动化，如结构化干预模式和跨运行学习所示。
      尚未覆盖: 最佳干预粒度和时机仍不明确；人类努力与研究产出质量之间的权衡需要在多样化科学领域进行系统研究。
    共识:
    - 当前的AI科学家系统尚不具备完全自主、可靠的科学发现能力，需要某种形式的验证或人类监督。
    - 大型语言模型充当中央协调器，但其原始输出需要通过代码执行、形式化验证或领域专用模拟器来扎根。
    - 仅自动生成论文是不够的；底层实验和推理的有效性是首要关注点，推动了内部验证循环和物理检查的纳入。
    分歧:
    - 领域专一化的必要性：通用系统如AI Scientist覆盖广泛的机器学习子领域，而ReasFlow和AI CFD Scientist认为深度领域知识和验证对于有意义的贡献至关重要。
    - 人类输入的角色：AI Scientist和AI Scientist-v2旨在实现完全自主，而AutoResearchClaw表明在高杠杆点进行精准人机协作优于完全自主和详尽的逐步监督。
    - 评估方法论：一些工作依赖模拟的LLM评审员或工作坊同行评审，而其他工作引入基于任务的基准（DISCOVERYWORLD、BAISBench、ARC-Bench）和特定指标，导致对系统能力的不同主张。
    开放问题:
    - 为某一领域设计的验证组件（例如基于视觉的物理检查）能否在不损失有效性的前提下泛化到其他科学领域？
    - 研究社区应如何建立一种共识评估协议，在自动评分与专家人工判断之间取得平衡，并覆盖实验科学和理论科学？
    - 保证AI生成科学论文正确性所需的最小人类干预集是什么，这在不同学科间如何变化？
