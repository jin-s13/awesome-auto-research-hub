    - 路线: 端到端自主研究智能体框架
      解决的问题: 把构思、代码/实验执行、可视化、写作和评审整合为可重复的科研主张生成管线。
      尚未覆盖: 通过率不稳定；仅在部分工作坊或领域验证；智能体推理与验证权威的分离尚未普遍解决。
    - 路线: 盲式证据锚定发现基准
      解决的问题: 隐藏来源结论，评估智能体依据冻结数据提出主张的能力，降低记忆复现。
      尚未覆盖: 自动指标和LLM裁判是否对齐同行评审或真实发现价值仍不明确；现有智能体对比仅基于单一冻结基座模型。
    - 路线: 领域特定虚拟与实验环境
      解决的问题: 在CFD、组学等领域提供受控任务、难度等级和参数变化，以覆盖完整发现循环。
      尚未覆盖: 到真实实验发现的迁移、环境任务覆盖、任务完成度之外的指标效度仍不明确。
    - 路线: 可靠性与有效性门控
      解决的问题: 检测静默失败、限制源码头编辑、执行规范化评测或对证据成熟度打分。
      尚未覆盖: 门控仍漏检部分失败；对照、稳健性、可证伪性和跨数据集泛化仍不足。
    - 路线: 人类基线与专家标注评估
      解决的问题: 用领域专家基线和专家标注数据锚定AI科学家在细胞注释和发现选择题上的表现。
      尚未覆盖: 依赖可获取专家；开放式发现评估仍有限。
    共识:
    - 自主研究智能体应按完整发现循环评估，而不只看单点模型预测。
    - 自动评估应基于证据和产出物，不能只采信生成文本。
    - 当前智能体可较熟练执行和记录分析，但尚未自主产出可信、可辩护的科学结论。
    - 物理检查、确定性权威等验证机制对发现静默失败和限制不可靠编辑是必要的。
    - 人工或同行评审基线仍是自动发现评估的重要参照。
    分歧:
    - 评测目标不同：有的评论文/评审接受，有的评任务完成，有的评主张的证据成熟度。
    - 可靠性机制不同：模拟评审反馈、视觉语言物理门控、确定性程序权威与固定LLM评分表对失败环节的假设不同。
    - 领域与表示范围不同：通用机器学习文章生成与评审，与CFD、单细胞组学、预测等专用环境各有侧重。
    - 监督信号不同：部分依赖自动评审作为筛选信号，部分依赖人类专家基线或同行评审来源研究。
    - 部署场景不同：从OpenFOAM/代码仓库的开源智能体到文本虚拟环境和真实组学数据，对可复现性提出不同要求。
    开放问题:
    - 自动评审分数和盲基准指标能否预测真实同行评审结果或下游科学效用？
    - 可靠门控能否跨基座模型、领域和失败注入设置泛化？
    - 何种对照、稳健性、可证伪性和跨数据集泛化组合足以支撑自主发现可信主张？
    - 对可改码、跑实验和自动写论文的智能体，治理和安全要求应如何细化？
    - 现有领域环境与人类基线是否足以发现跨基座模型和任务分布的泛化失败？
