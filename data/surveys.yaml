  related_work_outline_zh:
  - 主流方向：面向端到端自主研究智能体，使其提出想法、执行实验、撰写论文，并通过模拟评审或领域特定验证进行把关。
  - 研究共性：大多采用 LLM 驱动的研究循环，同时引入显式评估或验证机制，以发现无效或不可靠产物。
  - 关键差异：评测目标不同，包括任务完成环境、盲评证据成熟度、专业领域指标和专家偏好；交互方式从全自动运行到可监控的多智能体团队不等。
