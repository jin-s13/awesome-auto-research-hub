    研究路线矩阵:
    - 路线: 端到端自动发现工作流
      解决的问题: 把研究想法转化为代码、实验、可视化、论文与自动评审闭环
      尚未覆盖: 验证门控、对照与可证伪性证据、多次运行稳定性，以及模板或工作坊之外泛化不足
    - 路线: 面向发现智能体的评测环境与基准任务
      解决的问题: 以统一任务比较智能体在完整发现循环或领域判断中的能力
      尚未覆盖: 代理指标与真实科研效用一致性、领域多样性、发现任务与复现任务边界、人类基线覆盖有限
    - 路线: 基于证据的认知可靠性评估
      解决的问题: 按对照、稳健性、可证伪性、跨数据集泛化、可审计性与新颖性评估主张成熟度
      尚未覆盖: 当前证据仅来自单一冻结基座模型，智能体成绩高度接近，LLM裁判可靠性尚未独立验证
    - 路线: 领域专用验证与安全门控
      解决的问题: 在领域工作流中捕捉静默失败，并通过物理或领域有效性反馈提供安全关口
      尚未覆盖: 稀疏失败注入中仍有遗漏，跨领域迁移和真实实验条件下的外部验证不足
    - 路线: 可复现多智能体研究基础设施
      解决的问题: 自定义角色、实时监控、代码执行、工件检查、回滚恢复和实验反馈闭环
      尚未覆盖: 评价仅限于少数内部案例，缺少跨平台、跨硬件、跨数据集和跨用户的标准化外部验证
    共识:
    - LLM智能体能够较熟练地执行和记录实验分析，但在对照、稳健性、可证伪性和跨数据集泛化等科学判断上存在平台期或明显缺口
    - 自动化评测需要显式证据维度，而不能只依据生成论文或任务完成情况
    - 开源代码、基准任务和验证门控有助于暴露通用自动研究框架难以捕捉的挑战
    - 当前系统展现出辅助科研的潜力，但可靠的全自主科学发现仍远未得到证明
    分歧:
    - 评测目标不同：有的关注生成的研究产物，有的关注完整模拟发现任务、证据成熟度、物理有效性或多智能体交互质量
    - 验证机制不同：有的使用领域专用视觉或物理门控，有的使用通用方法学标准、自动化LLM裁判或人类专家裁判
    - 泛化证据范围不同：部分结论依赖单个冻结基座模型或少数内部案例，部分提供更广泛领域任务与人类基线
    - 交互模式不同：从全自动端到端工作流到强调人工监控、回滚和可定制团队的平台各有侧重
    开放问题:
    - 自动裁判和验证门控在分布外或跨领域环境中是否仍能可靠识别静默失败和无证据主张
    - 任务完成、论文接收或证据成熟度得分能否转化为真实科学发现价值与决策效用
    - 在现有泛化证据有限的情况下，智能体评测排名在跨基座模型和跨领域数据上是否稳定
    - 哪些最小可操作的对照、稳健性和可证伪性标准应被纳入自动化研究的治理准则
