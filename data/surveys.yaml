  related_work_outline:
  - 'Mainstream direction: Autonomous multi-agent research pipelines that generate
    hypotheses, execute experiments, and verify or self-correct artifacts dominate
    the current frontier; systems such as AI CFD Scientist, AutoResearchClaw, EvoCast,
    and SAGE focus on closed-loop ideation-to-verification rather than isolated idea
    scoring.'
  - 'Shared research pattern: Most systems ground hypotheses in prior rounds, diagnostics,
    literature, or reference comparators, then couple generation with execution, verification
    gates, and reporting constraints to reduce silent failures and hallucinated results.'
  - 'Key differences: They diverge by domain specificity (CFD, omics, forecasting,
    general ML), verification mechanism (vision-language physics gates, deterministic
    program authority, multi-hypothesis failure attribution), human-in-the-loop granularity,
    and whether claims are validated on domain benchmarks or broad testbeds.'
  - 'Trend evolution: Within the 2025-2026 frontier, the topic moves from benchmarks/surveys
    such as BAISBench toward reliability-focused agents with self-correction, verifiable
    reporting, and human collaboration; older years are not represented in the top
    evidence so a longer-term trend cannot be strongly established.'
  - 'Open questions: Whether autonomous systems generate genuine research insights
    rather than local engineering tricks, how to validate scientific utility beyond
    narrow benchmarks or case studies, and how to handle missed failures, ethics,
    and conference-ready writing remain open.'
  related_work_outline_zh:
  - 主流方向：自主多智能体研究流水线主导当前前沿，将假设生成、实验执行与验证或自我纠正耦合成闭环，代表性系统包括 AI CFD Scientist、AutoResearchClaw、EvoCast、SAGE
    等。
  - 研究共性：多数工作从先前轮次、诊断、文献或参考比较器获取证据以生成假设，并通过执行、验证门控和报告约束减少静默失败与幻觉结果。
  - 关键差异：系统在领域专精（CFD、组学、预测、通用 ML）、验证机制（视觉-语言物理门控、确定性程序权威、多假设失败归因）、人机介入粒度和评测设置上存在差异。
  - 趋势演进：在 2025-2026 前沿内，主题从 BAISBench 等基准/综述转向带自纠正、可验证报告和人机协作的可靠智能体；顶层证据未覆盖更早年份，无法确证长期趋势。
  - 开放问题：自主系统产出的是真正研究洞见还是局部工程技巧、如何超越窄基准或案例验证科学效用、错检失败、伦理与可投稿写作等问题仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Literature- and evidence-grounded hypothesis generation
      what_it_solves: Turns literature, reference comparators, dataset characteristics,
        diagnostics, and prior failure records into candidate hypotheses or research
        directions rather than sampling ideas from a fixed concept space.
      what_remains_open: Whether generated hypotheses are calibrated for novelty and
        domain insight; Agent4Sci evidence shows gains can come from engineering tricks
        rather than research-level insight, but no standard novelty measure is established.
    - line: Verification-gated execution and self-correction
      what_it_solves: Couples ideation with runnable experiments and gates such as
        vision-language physics checks, deterministic program authority, or multi-hypothesis
        failure attribution to detect silent failures and prevent fabricated reporting.
      what_remains_open: 'Verification coverage is incomplete: one vision-language
        gate missed 2 of 16 planted silent failures, and several systems lack explicit
        limitation evidence, leaving failure-attribution quality across domains unverified.'
    - line: Human-in-the-loop and multi-agent research organization
      what_it_solves: Enables role specialization, structured debate, monitoring,
        rollback/resume, and targeted human interventions at high-leverage decision
        points rather than exhaustive step-by-step oversight.
      what_remains_open: Optimal intervention granularity and role composition are
        under-specified; evaluations often rely on few internal case studies, so cross-domain
        or cross-research-culture generalizability remains a verification gap.
    - line: Benchmark and evidence design for autonomous scientific discovery
      what_it_solves: Provides task suites, human baselines, and long-horizon testbeds
        to compare AI scientists on cell annotation, scientific discovery, forecasting
        architecture evolution, or improving published ML models.
      what_remains_open: Proxy metrics and leaderboard improvements may not track
        real scientific utility; current results show agents improve published best
        models but often via local engineering sweeps, and benchmark domain coverage
        is limited.
    - line: Reproducible research platforms and infrastructure
      what_it_solves: Turns isolated agent ideas into open-source, inspectable, runnable
        stacks with code harnesses, dashboards, artifact tracking, and rollback/resume
        workflows.
      what_remains_open: External validation across hardware, datasets, user settings,
        and longer-horizon scientific problems is missing from the top evidence; reproducibility
        signals vary, and some platforms are described as early-stage.
    consensus:
    - Autonomous hypothesis generation must be coupled with execution and verification;
      idea-only systems are treated as insufficient for producing defensible claims.
    - Self-correction, failure attribution, and verifiable reporting are becoming
      standard components to reduce silent failures and hallucinated outputs.
    - Current AI scientists are promising research assistants but are not yet fully
      autonomous discoverers in evidence-intensive domains such as omics or ML research.
    - Targeted human collaboration at high-leverage decisions can outperform both
      full autonomy and exhaustive step-by-step oversight.
    disagreements:
    - 'Verification mechanism differs: some systems use vision-language inspection
      of rendered outputs, others use deterministic program authority for source-edit
      boundaries and promotion, and others use multi-hypothesis causal failure attribution.'
    - 'Evaluation target and evidence differ: domain-specific benchmarks are used
      alongside broad long-horizon testbeds; some systems compare against expert human
      baselines, while others use AI-expert preference or blind manuscript scores.'
    - 'Interaction mode differs: full autonomy, modular human-in-the-loop intervention,
      and interactive multi-agent teams with rollback/resume control each represent
      different deployment assumptions.'
    - 'Deployment setting differs: CFD, omics, time-series forecasting, and scientific
      ML environments shape different validity conditions for hypotheses, artifacts,
      and acceptable improvements.'
    open_questions:
    - Can autonomous idea generation produce research-level domain insight rather
      than local ML engineering sweeps or parameter corrections under novel conditions?
    - How should verification gates be evaluated for coverage and false negatives,
      given one gate missed 2 of 16 planted silent failures and several systems provide
      no explicit limitation evidence?
    - What benchmark metrics and baselines would connect AI scientist outputs to real
      scientific utility across domains beyond ARC-Bench, BAISBench, Agent4Sci, or
      few case studies?
    - How should human oversight be allocated across hypothesis generation, execution,
      verification, and writing as systems scale beyond small internal case studies?
    - Are current results externally reproducible across hardware, datasets, and longer
      scientific workflows when reproducibility signals vary and some platforms remain
      early-stage?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于文献与证据的假设生成
      解决的问题: 将文献、参考比较器、数据集特征、诊断结果和先前失败记录转化为候选假设或研究方向，而不是从固定概念空间随机抽样。
      尚未覆盖: 假设的新颖性与领域洞见是否经过校准缺少统一证据；Agent4Sci 表明提升可能来自工程技巧而非研究级洞见，但证据包未提供标准新颖性度量。
    - 路线: 验证门控执行与自纠正
      解决的问题: 把构思与可运行实验结合，通过视觉-语言物理检查、确定性程序权威或多假设失败归因来检测静默失败并防止虚构报告。
      尚未覆盖: 验证覆盖不完整：一项视觉-语言门控漏检 16 个植入静默失败中的 2 个；若干系统缺少显式局限性，跨域失败归因质量仍属验证缺口。
    - 路线: 人机协作与多智能体研究组织
      解决的问题: 支持角色分工、结构化辩论、监控、回滚/恢复，以及在高杠杆决策点进行精准人工干预，避免逐步过度监督。
      尚未覆盖: 最佳干预粒度和角色构成尚未明确；评测常局限于少量内部案例，跨领域和跨研究文化的可推广性仍是验证缺口。
    - 路线: 自主科学发现的基准与证据设计
      解决的问题: 提供任务集、人类基线和长视野测试床，比较 AI 科学家在细胞注释、科学发现、预测架构演化或改进已发表 ML 模型上的表现。
      尚未覆盖: 代理指标与排行榜提升可能无法反映真实科学效用；当前结果表明提升常来自局部工程扫描，且基准领域覆盖有限。
    - 路线: 可复现研究平台与基础设施
      解决的问题: 将单点智能体想法转化为开源、可检查、可运行的流程，包含代码工具、仪表板、工件跟踪和回滚/恢复工作流。
      尚未覆盖: 顶层证据缺少跨硬件、数据集、用户设置和更长科学问题的外部验证；可复现信号不一，部分平台仍处于早期阶段。
    共识:
    - 自主假设生成必须与执行和验证耦合；仅产生想法的系统无法形成可辩护的研究结论。
    - 自纠正、失败归因和可验证报告正成为减少静默失败与幻觉输出的标准组件。
    - 当前 AI 科学家更接近有希望的科研辅助者，还不能在组学、机器学习等证据密集型场景中完全自主发现。
    - 在高杠杆决策点进行精准人机协作，优于完全自主和逐步持续监督。
    分歧:
    - 验证机制不同：有的使用视觉-语言检查渲染输出，有的使用确定性程序权威控制源码边界与晋升，有的使用多假设因果失败归因。
    - 评测目标与证据不同：领域专用基准与长视野通用测试床并存；有的对照专家人类基线，有的采用 AI 专家偏好或盲评分数。
    - 交互模式不同：完全自主、模块化人机介入、以及可回滚/恢复的交互式多智能体团队代表不同部署假设。
    - 部署场景不同：CFD、组学、时间序列预测和科学 ML 等场景塑造了不同的假设有效性条件与可接受改进标准。
    开放问题:
    - 自主想法生成能否产出研究级领域洞见，而不是新条件下的局部 ML 工程扫描或参数修正？
    - 应如何评估验证门控的覆盖率和漏检率，尤其当一项门控漏检 16 个静默失败中的 2 个且部分系统缺少显式局限性？
