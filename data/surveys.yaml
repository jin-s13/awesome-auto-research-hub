  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automates hypothesis generation, code writing, experiment execution,
        result analysis, visualization, and manuscript composition in a single agentic
        loop.
      what_remains_open: Peer-review acceptance and physical validity remain inconsistent;
        evidence on reliability across base models, domains, and failure modes is
        limited to a few showcases.
    - line: Domain-specific verification and knowledge retrieval for discovery agents
      what_it_solves: Adds internal logical, literature, or physics-aware gates to
        catch errors and support claims in domains such as applied mathematics and
        computational fluid dynamics.
      what_remains_open: Detectors still miss silent failures and depend on domain-specific
        simulators or visual checks, so coverage outside the chosen domain or simulation
        stack is unproven.
    - line: Evaluation environments and evidence-grounded benchmarks
      what_it_solves: Creates reusable tasks and metrics for complete discovery cycles
        or evidence maturity, enabling comparison across agents without per-instance
        human scoring.
      what_remains_open: Automated judges and virtual environments may not track real
        discovery utility; current evidence uses a single frozen base model, limited
        task samples, and missing controls or robustness criteria.
    consensus:
    - Autonomous agents can chain idea generation, code/experiment execution, analysis,
      and paper drafting, but producing a defensible scientific claim is much harder
      than completing the pipeline.
    - Automated LLM-based review or judging is frequently used to score generated
      work, yet its agreement with human or physical evidence quality is not fully
      established.
    - Domain-specific validity checks and evidence-oriented rubrics are emerging as
      necessary safeguards because purely generative workflows often produce plausible
      but insufficiently controlled results.
    - Current systems show useful automation in narrow or simulated settings, but
      publication- or workshop-level success is rare and inconsistent.
    disagreements:
    - 'Verification strategy differs: some systems rely on simulated peer review,
      others on domain-specific visual or physics gates, and others on evidence-maturity
      rubrics requiring controls and falsifiability.'
    - 'Evaluation target differs: one line evaluates task completion in virtual discovery
      environments, another evaluates blind evidence sufficiency from frozen data,
      while end-to-end systems are judged by generated-paper review scores.'
    - 'Domain scope differs: broad machine learning discovery systems target open-ended
      workflows, whereas applied mathematics and computational fluid dynamics systems
      specialize around retrieval, theorem or proof checks, or solver-level physical
      validity.'
    - 'Autonomy boundary differs: some systems retain human templates or domain scaffolds,
      while newer systems attempt to remove template dependence and introduce agent-managed
      tree search.'
    open_questions:
    - Can automated validity gates reliably detect silent failures beyond the tested
      cases, especially when one gate missed 2 of 16 planted failures?
    - Do LLM-based judges and simulated reviewers measure real scientific contribution
      or only stylistic and surface plausibility?
    - How do agent capabilities transfer across base models, datasets, and scientific
      domains when a reported benchmark comparison uses only one frozen base model?
    - What minimal evidence standards should be required before a generated claim
      is considered a discovery rather than documentation of competent analysis?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研流水线
      解决的问题: 在单一智能体循环中自动化假设生成、代码编写、实验执行、分析可视化和论文写作。
      尚未覆盖: 同行评审和物理有效性仍不稳定；跨领域、跨基座模型和失败模式的证据限于少数展示。
    - 路线: 领域特定验证与知识检索型发现智能体
      解决的问题: 引入逻辑、文献或物理感知检查，以支持应用数学、计算流体动力学等领域的声明并减少静默错误。
      尚未覆盖: 检测器仍会漏掉静默失败，依赖领域模拟器或视觉检查；在所选领域或仿真栈之外覆盖不足。
    - 路线: 评估环境与证据锚定基准
      解决的问题: 用可复用任务和指标评估完整发现循环或证据成熟度，减少对逐例人工评分的依赖。
      尚未覆盖: 自动裁判和虚拟环境可能不代表真实发现价值；证据受单一冻结基座模型、有限任务和缺失对照或稳健性限制。
    共识:
    - 自主智能体能串联选题、实验、分析和写作，但形成可辩护的科学声明远比跑通流水线困难。
    - 自动评审或 LLM 评分常被用于评价生成结果，其与人类评审或物理论证质量的一致性尚未充分确立。
    - 领域专用检查和证据量规正成为必要保障，因为纯生成式流程会产生看似合理但缺乏对照和可证伪性的结果。
    - 当前系统在窄域或模拟环境中显示出自动化价值，但达到工作坊或同行评审接受级别仍罕见且不稳定。
    分歧:
    - 验证策略不同：有的系统依赖模拟同行评审，有的依赖视觉或物理门控，有的依赖证据成熟度量规和对照与可证伪性要求。
    - 评测目标不同：一条路线评测虚拟发现环境中的任务完成，另一条评测冻结数据上的盲证据充分性，端到端系统则以生成论文的评审分数为主。
    - 领域范围不同：通用机器学习系统面向开放式工作流，应用数学与计算流体动力学系统围绕检索、定理或求解器级别的物理论证展开。
    - 自主边界不同：一些系统依赖人类模板或领域脚手架，新系统尝试去除模板依赖并引入智能体树搜索。
