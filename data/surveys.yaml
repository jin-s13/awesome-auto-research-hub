  - 主流方向：以LLM为核心的智能体系统自动完成实验科研全流程，包括提出问题、编写代码、执行实验、分析结果、撰写论文和评审。
  - 研究共性：将发现流程拆分为多智能体或记忆/评审组件，并用模拟评审、LLM评分、任务环境或案例研究作为主要评估方式，外部真实验证不足。
