  related_work_outline_zh:
  - 主流方向：端到端自主研究智能体，整合构思、代码、实验、分析、验证和论文生成；近期系统加入领域特定有效性门控与自动评审。
  - 研究共性：基于LLM的智能体把科学发现拆为假设、实验、证据分析和论文撰写，并通过内部或外部评分筛掉薄弱主张。
  - 关键差异：系统在有效性条件上不同，如理论工作强调逻辑一致性，仿真工作强调物理感知检查；评测目标也不同，包括LLM评审、任务完成、同行评审或盲态证据成熟度。
  - 趋势演进：从2024年通用自主发现与基准环境，到2025年智能体树搜索及首篇AI生成工作坊论文通过同行评审，再到2026年领域特定验证与证据锚定评测。
  - 开放问题：自动验证能否跨出狭窄领域泛化，LLM评判质量是否对应真实科学有效性，系统能否在独立评审中持续通过。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research-agent pipelines
      what_it_solves: Covers the full research loop from idea generation through code,
        experiments, visualization, manuscript drafting, and simulated or automated
        review.
      what_remains_open: Scientific defensibility and consistency beyond curated demos;
        success is often judged by automated reviewers, rubrics, or a small number
        of generated manuscripts.
    - line: Domain-aware verification and validity gating
      what_it_solves: Detects logically or physically invalid intermediate results
        before they are accepted, especially in theory-heavy mathematics and simulation-heavy
        fluid dynamics.
      what_remains_open: Verification gates can still miss silent failures, and evidence
        is limited to selected domains and conditions rather than established as broadly
        transferable.
    - line: Discovery evaluation environments and evidence-grounded benchmarks
      what_it_solves: Provides reusable tasks, blinded datasets, and scoring rubrics
        for complete discovery cycles or evidentiary maturity, enabling comparison
        across agents.
      what_remains_open: Alignment between proxy metrics such as task completion or
        LLM-judged evidence maturity and real scientific validity remains unproven,
        with limited base-model coverage.
    - line: Agentic search and iterative experiment management
      what_it_solves: Replaces fixed pipelines with tree search, experiment-manager
        agents, and reviewer feedback loops to improve exploration, iteration, and
        manuscript quality.
      what_remains_open: 'Observed success is unstable: only one of three AI-generated
        workshop papers passed peer review, and validation remains workshop-level
        rather than full conference-grade.'
    - line: Human-AI role orchestration and knowledge retrieval
      what_it_solves: Frames collaboration as a human principal investigator directing
        an AI agent while using verification and knowledge retrieval to reduce expert
        intervention.
      what_remains_open: The reduction in human intervention is mainly assessed with
        self-generated LLM-based rubrics, leaving independent expert validation incomplete.
    consensus:
    - Scientific discovery can be decomposed into ideation, experimentation, evidence
      analysis, and manuscript generation, with LLM agents coordinating the pipeline.
    - Plausible paper generation is not enough; evaluation increasingly requires verification,
      evidence quality, or reproducibility signals.
    - Automated reviewers and domain-specific validity gates are becoming central
      mechanisms for detecting unsupported claims or silent failures.
    - 'Current systems remain narrow: they execute and document analyses more reliably
      than they produce trustworthy novel science.'
    disagreements:
    - 'Validity conditions differ by content area: general machine-learning pipelines
      rely on broad code-and-review loops, while theory and physics systems require
      logic-consistency or physical-consistency checks.'
    - 'Evaluation targets differ substantially: some work compares manuscripts to
      conference or LLM review thresholds, others measures simulated task completion,
      and still others scores blinded evidence maturity.'
    - 'Interaction mode differs: some systems run fully autonomously, while others
      embed a human expert as a principal investigator who supervises the AI''s research
      actions.'
    - 'Verification supervision differs: one line uses LLM judges or automated reviewers,
      another uses vision-language physical-validity gates, and another uses internal
      proof-consistency loops.'
    open_questions:
    - Can domain-aware verification gates transfer beyond the narrow settings in which
      they were demonstrated?
    - Do LLM-rubric scores or evidence-maturity metrics predict reproducible, externally
      valid scientific contributions?
    - Can fully autonomous systems consistently pass independent peer review beyond
      a single workshop paper?
    - How can systems close the observed gaps in controls, robustness, falsifiability,
      and cross-dataset generalization?
    - What external validation across hardware, datasets, and user settings is needed
      before these systems can be treated as reproducible research infrastructure?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究智能体流水线
      解决的问题: 覆盖从想法生成到代码、实验、结果可视化、论文初稿和自动评审的完整研究循环。
      尚未覆盖: 科学可辩护性与稳定性尚未超出精选演示；很多结论依赖自动评审、评分表或少量的生成论文。
    - 路线: 领域感知验证与有效性门控
      解决的问题: 在结果被接受前检测逻辑或物理上无效的中间结果，适用于理论型数学和仿真型流体问题。
      尚未覆盖: 验证门控仍会漏掉静默失败，证据主要集中在少数领域和特定条件下，未证明可跨领域迁移。
    - 路线: 发现评测环境与证据锚定基准
      解决的问题: 提供可复用任务、盲态数据集和评分标准，用于评估完整发现周期或证据成熟度，便于智能体比较。
      尚未覆盖: 任务完成度或LLM证据成熟度等代理指标与真实科学有效性之间的一致性尚未建立，基座模型覆盖也有限。
    - 路线: 智能体搜索与迭代实验管理
      解决的问题: 用树搜索、实验管理器智能体和审稿反馈循环替代固定流水线，改进探索、迭代和论文质量。
      尚未覆盖: 成功不稳定：三篇AI生成工作坊论文只有一篇通过同行评审，验证仍停留在工作坊级别。
    - 路线: 人机角色编排与知识检索
      解决的问题: 将协作建模为人类首席研究员指导AI智能体，通过验证和知识检索减少专家干预。
      尚未覆盖: 专家干预减少的效果主要靠自生成LLM评分表评估，缺少独立的专家级外部验证。
    共识:
    - 科学发现可拆解为构思、实验、证据分析和论文生成，并由LLM智能体协调完整流程。
    - 仅生成看似合理的论文不够，评价越来越强调验证、证据质量或可复现性信号。
    - 自动评审与领域特定有效性门控正成为防止静默失败或不可靠主张的关键组件。
    - 当前系统仍较窄：它们在执行和记录分析方面更可靠，但在产生可信的新科学上仍不足。
    分歧:
    - 不同内容领域的有效性条件不同：通用机器学习流程依靠代码与评审循环，而理论或物理系统需要逻辑一致性或物理一致性校验。
    - 评测目标差异明显：有的比较会议或LLM评审阈值，有的测量仿真任务完成情况，有的给盲态证据成熟度打分。
    - 交互模式不同：部分系统全自动运行，部分系统把人类专家作为首席研究员纳入监督循环。
    - 验证监督不同：有的采用LLM裁判，有的采用视觉-语言物理门控，有的采用内部证明一致性检查。
