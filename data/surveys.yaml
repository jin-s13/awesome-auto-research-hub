    proxy metrics like citation F1 or similarity.'
  related_work_outline_zh:
  - 主流方向：利用基于LLM的代理自动化文献综述流程的多个环节，从检索和证据提取到结构化综述生成和同行评审模拟。
  - 研究共性：将文献综述工作流分解为子任务（检索、规划、写作、编辑、评审），并在多代理或编排框架下分配给专用代理或LLM调用。
  - 关键差异：系统在介入点上有别——有的侧重于为AI代理升级搜索基础设施，有的专注于生成完整综述稿件，还有的聚焦于审计自动评审的鲁棒性，从而导致不同的评估指标和交互模式。
  - 趋势演进：2024至2026年，工作从层次化组织辅助（2024）发展到多代理生成流水线（2025），进而到集成知识层和评审代理鲁棒性研究（2026），对事实可靠性和安全性的重视逐步增强。
  - 开放问题：生成的综述能否达到专家级的事实准确性和覆盖度，如何防御对评审代理的对抗性操纵，以及缺乏能捕捉真实效用而不仅是引用F1或相似度等代理指标的标准化基准。
  literature_review:
    line_of_work_matrix:
    - line: Retrieval-augmented knowledge layers for agent access
      what_it_solves: Upgrades literature databases into AI-agent-accessible knowledge
        layers that can decompose natural language queries, execute live searches,
        and extract evidence, improving retrieval accuracy and downstream task performance.
      what_remains_open: Generalization beyond the curated search engine (e.g., Europe
        PMC) and the brittleness of relying on a single LLM orchestrator; no evidence
        on how the system behaves with ambiguous or cross-domain queries.
    - line: Multi-agent literature review generation
      what_it_solves: Automates the production of structured literature reviews by
        emulating a human workflow with specialized agents for outlining, writing,
        editing, and reviewing, thereby improving readability, citation quality, and
        overall coherence.
      what_remains_open: Factual accuracy and depth compared to expert-written reviews;
        the evaluation relies on surface-level similarity and writing quality metrics,
        not on downstream utility or expert verification of the synthesized claims.
    - line: Automated peer review and robustness analysis
      what_it_solves: Studies the behavior and vulnerability of LLM agents in peer
        review, revealing that surface-level revisions can manipulate review outcomes
        and that adversarial attacks can break reviewer models.
      what_remains_open: Building defenses against such manipulations, ensuring fairness
        and consistency of automated reviewers, and validating whether simulated review
        dynamics reflect real human review processes.
    - line: Iterative and hierarchical literature organization
      what_it_solves: Provides structured or iterative organization of scientific
        papers to support researchers in navigating and synthesizing large bodies
        of literature, often through hierarchical clustering or iterative retrieval
        loops.
      what_remains_open: Lack of detailed methodology and evaluation evidence in the
        available data; the assumption that better organization directly translates
        to higher-quality literature reviews remains untested.
    consensus:
    - LLM-based agents are a viable backbone for automating literature review tasks,
      with retrieval and generation steps being orchestrated through multi-step or
      multi-agent workflows.
    - Factual accuracy and reliability remain major concerns across all systems, and
      current evaluation metrics only partially capture the quality of a generated
      review.
    - Human review behavior (e.g., iterative refinement, organization, and critical
      appraisal) serves as a design template for agent workflows.
    disagreements:
    - 'The primary target of automation differs: some works aim to improve the retrieval
      interface for agents (information access), while others focus on generating
      the final review document (content creation) or on auditing the review process
      itself (meta-evaluation).'
    - Evaluation practices diverge—citation F1, writing quality, similarity to human
      reviews, and robustness under attack are used in isolation, with no agreed-upon
      benchmark that covers all aspects.
    - 'Interaction mode varies: real-time live search versus offline batch generation,
      single-agent orchestration versus multi-agent collaboration, and human-in-the-loop
      versus fully autonomous operation.'
    open_questions:
    - How can we verify that a claim in an automatically generated review is supported
      by the cited evidence without relying on heuristics that are vulnerable to presentation-only
      manipulations?
    - What defenses can make automated review agents robust against adversarial papers,
      and how do we design such defenses without leaking review criteria?
    - Is the improvement in retrieval or generation quality observed on existing benchmarks
      retained when the system is deployed in a different scientific domain or with
      a different underlying search index?
    - What evaluation protocol would capture both the utility of a generated review
      for a human researcher and the factual trustworthiness of its claims, beyond
      writing style and citation overlap?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向代理的检索增强知识层
      解决的问题: 将文献数据库升级为AI代理可访问的知识层，能分解自然语言查询、执行实时搜索并提取证据，提升检索准确性和下游任务表现。
      尚未覆盖: 在策划搜索引擎（如Europe PMC）之外的泛化能力，以及依赖单一LLM编排器的脆弱性；缺乏系统在模糊或跨领域查询下行为的证据。
    - 路线: 多代理文献综述生成
      解决的问题: 通过模拟人类工作流，使用专用代理进行大纲、写作、编辑和审阅，自动化生成结构化文献综述，提升可读性、引用质量和整体连贯性。
      尚未覆盖: 与专家综述相比的事实准确性和深度；评估依赖表面相似度和写作质量指标，而非下游效用或对合成主张的专家验证。
    - 路线: 自动同行评审与鲁棒性分析
      解决的问题: 研究LLM代理在同行评审中的行为和脆弱性，揭示表面修改可操纵评审结果，以及对抗性攻击能破坏评审模型。
      尚未覆盖: 构建针对此类操纵的防御，确保自动评审的公平性和一致性，验证模拟评审动态是否反映真实人类评审过程。
    - 路线: 迭代式与层次化文献组织
      解决的问题: 提供结构化或迭代的科学论文组织方式，通过层次聚类或迭代检索循环支持研究者导航和综合大量文献。
      尚未覆盖: 当前数据中缺乏详细的方法和评估证据；更好的组织方式能否直接转化为更高质量的文献综述这一假设尚未验证。
    共识:
    - 基于LLM的代理是实现文献综述任务自动化的可行主干，检索和生成步骤通过多步或多代理工作流进行编排。
    - 事实准确性和可靠性是所有系统共同面临的主要挑战，当前评估指标只能部分捕捉生成综述的质量。
    - 人类综述行为（如迭代精炼、组织和批判性评价）被用作代理工作流的设计模板。
    分歧:
    - 自动化的主要目标不同：有的工作旨在改善面向代理的检索接口（信息获取），有的聚焦于生成最终综述文章（内容创作），还有的着眼于审计评审过程本身（元评估）。
    - 评估实践各异——引用F1、写作质量、与人类综述的相似度、攻击下的鲁棒性被孤立使用，缺少覆盖所有方面的共识基准。
    - 交互模式不同：实时在线搜索 vs. 离线批量生成，单代理编排 vs. 多代理协作，人在回路 vs. 完全自主运行。
    开放问题:
    - 如何在不依赖易受表面修改影响的启发式方法的情况下，验证自动生成综述中的主张是否得到引用证据的支持？
    - 哪些防御机制能使自动评审代理对对抗性论文具有鲁棒性，且如何设计这些防御而不泄露评审标准？
    - 在现有基准上观察到的检索或生成质量提升，在部署到不同科学领域或不同底层搜索索引时能否保持？
    - 什么样的评估协议能同时捕捉生成综述对人类研究者的效用和其主张的事实可信度，超越写作风格和引用重叠？
