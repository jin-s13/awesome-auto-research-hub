    reproducible research infrastructure.'
  - 'Shared research pattern: Agents generate ideas, run code, analyze results, and
    produce conclusions; evaluators then score outputs through blind tasks, rubrics,
    judges, peer review, or domain-specific verification.'
  - 'Key differences: Evaluation target, domain specificity, supervision mode, and
