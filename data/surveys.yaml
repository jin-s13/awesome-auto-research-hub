      尚未覆盖: 超出选定演示的一致性尚未证明；三篇全AI生成工作坊论文仅一篇通过同行评审，完整会议级可重复性未确立。
    - 路线: 领域专用验证与执行
      解决的问题: 引入任务专用有效性门控，例如数学中的逻辑推导检查或计算流体动力学中的物理感知流场检查，在主张写入前发现静默失败。
      尚未覆盖: 门控会漏检静默失败；结果与特定仿真或推理设置高度相关，未必能跨领域迁移。
    - 路线: 科学发现的基准与评测设计
      解决的问题: 通过标准化任务、指标和盲测证据评分比较发现智能体，而不只依赖论文级评审。
      尚未覆盖: 基准任务完成度或证据成熟度评分是否与真实发现效用一致尚不明确；现有智能体结果仅基于冻结基座模型和部分科学主题。
    - 路线: 多智能体协作与知识检索
      解决的问题: 通过首席研究员/研究生角色组织智能体，并检索陈述性事实和过程性启发法，降低专家干预并支撑推理中心式发现。
      尚未覆盖: 证据依赖人工设计的LLM评审标准；缺少独立人工验证以及跨数学子领域的稳健性验证。
    - 路线: 自动同行评审与迭代优化
      解决的问题: 利用模拟评审和迭代反馈优化手稿、图表与主张，减少人工检查或正式投稿前的粗糙错误。
      尚未覆盖: 自动评审与人类判断的一致性只在较窄设置下得到证明；自我评估偏差和跨会议校准仍不清晰。
    共识:
    - 科学发现被建模为覆盖想法生成、实验执行、分析和论文写作的闭环执行流程。
    - 验证或有效性检查被视为使自主系统主张可辩护的必要环节。
    - 当前系统擅长生成合理的工件和分析，但在通过对照、稳健性和可证伪性建立可信主张方面较弱。
    - 评估正在从仅看论文评审转向任务完成、证据成熟度和领域感知有效性检查。
    分歧:
    - 评估目标不同：一些系统优化论文/评审质量，另一些优化领域有效性、基准任务完成或证据成熟度。
    - 验证模式不同：逻辑证明检查、流场视觉语言检查、模拟同行评审和基于基准的裁判提供不同保证。
    - 交互模式不同：一类采用人类首席研究员与代理作为学生的监督关系，另一些使用全自主运行或沙盒智能体。
    - 部署设置不同：理论/数学推理、计算流体动力学模拟和机器学习代码实验带来不同假设和失败模式。
