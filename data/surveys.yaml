  related_work_outline:
  - 'Mainstream direction: End-to-end autonomous research agents that combine LLM-driven
    hypothesis generation with executable experiments, iterative failure correction,
    and verification gates for defensible claims.'
  - 'Shared research pattern: Systems treat experimentation as a closed loop; generated
    hypotheses are tested, failures are attributed and fed back, and reporting is
    constrained by measured evidence.'
  - 'Key differences: Domain-specific verification and task scope, human-in-the-loop
    placement, failure attribution depth, and evaluation from general benchmarks to
    real domain tasks and expert preference.'
  - 'Trend evolution: Evidence from available 2025-2026 papers shows convergence from
    isolated ideation and evaluation toward multi-agent, self-correcting, human-AI
    research pipelines with deterministic or physical validity gates.'
  - 'Open questions: Whether gains reflect research insight or engineering sweeps,
    how to validate generated hypotheses outside training distributions, and how to
    standardize reproducibility and verification gap reporting.'
  related_work_outline_zh:
  - 主流方向：面向端到端自主研究智能体，结合LLM驱动的假设生成、可执行实验、迭代纠错和验证门控以形成可辩护结论。
  - 研究共性：将实验视为闭环；生成假设后执行验证，将失败归因并反馈，报告受实测证据约束。
  - 关键差异：领域验证与任务范围、人类介入位置、失败归因深度，以及从通用基准到真实领域任务和专家偏好的评测差异。
  - 趋势演进：现有2025-2026证据显示，从孤立构思与评测向多智能体、自纠正、人机协同研究流水线和确定性或物理有效性门控收敛。
  - 开放问题：提升来自研究洞察还是工程调优；生成的假设在训练分布之外如何验证；如何标准化可复现性与验证缺口报告。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Couples hypothesis generation with code execution, experiment
        control, and report drafting to produce testable research artifacts.
      what_remains_open: Validation is often task-specific; complete conference-ready
        writing and autonomous generation of meaningful domain hypotheses remain unsolved.
    - line: Domain-specific scientific discovery with physical or biological validity
        checks
      what_it_solves: Adds domain-grounded verification to ideation, such as inspecting
        flow fields or using real transcriptomic data for biological discovery tasks.
      what_remains_open: Verification gates still miss silent failures; generalization
        beyond the selected domains or datasets is not established.
    - line: Benchmarks and testbeds for agentic scientific discovery
      what_it_solves: Provides comparable tasks, baselines, and human performance
        anchors to assess hypothesis quality and experimental progress.
      what_remains_open: Coverage of diverse scientific domains and agreement between
        benchmark success and real research insight are limited; some gains are engineering
        tricks.
    - line: Human-AI collaboration and governance structures
      what_it_solves: Allocates human oversight at high-leverage decision points and
        constrains agent authority to improve reliability.
      what_remains_open: The optimal intervention granularity and transfer of collaboration
        modes across research settings are not established.
    - line: Surveys and conceptual taxonomies of agentic scientific discovery
      what_it_solves: Organizes systems by capability, domain, evaluation metrics,
        and challenges such as literature review automation and ethics.
      what_remains_open: The proposed categories lack direct empirical evidence connecting
        them to downstream discovery outcomes.
    consensus:
    - Autonomous research systems should connect ideation to executed experiments
      rather than only generating text; this appears in pipelines that run code and
      collect metrics.
    - Validity gates, verifiable reporting, or deterministic evaluation constraints
      are necessary to prevent fabricated claims.
    - Failure signals are valuable inputs; systems respond through iterative repair,
      structured failure attribution, or cross-run evolution.
    - Targeted human collaboration at high-leverage decisions can outperform full
      autonomy or exhaustive step-by-step oversight.
    - Task-specific evaluation with baselines and human or expert judgment is used
      to assess scientific discovery agents.
    disagreements:
    - 'Verification mechanism: some rely on vision-language physical checks, while
      others rely on deterministic program authority or grounded reporting constraints.'
    - 'Autonomy mode: some favor fully autonomous loops, while others integrate human
      interventions with multiple oversight modes.'
    - 'Evaluation target: some report general experimental benchmark improvement,
      while others report domain-specific physical, biological, or forecasting outcomes
      or expert preference.'
    - 'Failure handling depth: from simple reflection to structured multi-hypothesis
      causal attribution and self-healing Pivot/Refine loops.'
    - 'Domain scope: general AI research workflows differ from computational fluid
      dynamics, single-cell biology, and time-series forecasting deployments.'
    - 'Progress attribution: evidence shows some gains come from ML engineering tricks
      rather than research-level insight, which contrasts with claims of autonomous
      discovery.'
    open_questions:
    - Do reported benchmark gains transfer to novel hypothesis generation outside
      training and evaluation distributions?
    - How should validity gates be scaled across domains when domain-specific verification
      missed silent failures in ablation?
    - What reproducibility reporting standard is needed for autonomous research agents,
      given some top papers lack explicit limitations or release artifacts?
    - How can evaluation distinguish engineering optimization from scientific insight
      in generated hypotheses?
    - What is the minimal and most effective human oversight placement for high-risk
      scientific decisions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流水线
      解决的问题: 将假设生成与代码执行、实验控制和报告草拟结合，产出可检验研究工件。
      尚未覆盖: 验证通常面向特定任务；完全可提交的论文写作与有意义领域假设的自主生成仍未解决。
    - 路线: 带物理或生物有效性检查的领域科学发现
      解决的问题: 在构思中加入领域相关验证，如检查流场或使用真实转录组数据进行生物学发现。
      尚未覆盖: 验证门控仍会漏掉静默失败；跨领域或数据集的泛化尚未建立。
    - 路线: 面向科学发现智能体的基准与测试平台
      解决的问题: 通过可比任务、基线和人类表现锚点评估假设质量与实验进展。
      尚未覆盖: 多领域覆盖及基准成功与真实研究洞察之间的一致性有限；部分提升来自工程技巧。
    - 路线: 人机协作与治理结构
      解决的问题: 将人类监督放在高杠杆决策点并限制智能体权限，以提高可靠性。
      尚未覆盖: 最佳干预粒度和跨研究场景的协作模式迁移尚未确定。
    - 路线: 智能体科学发现的综述与概念分类
      解决的问题: 按能力、领域、评估指标和挑战组织系统，如文献综述自动化和伦理。
      尚未覆盖: 所提分类缺乏直接实证证据证明它们能预测下游发现结果。
    共识:
    - 自主研究系统应将构思与已执行实验连接，而不是只生成文本；这体现在运行代码并收集指标的流水线中。
    - 需要有效性门控、可验证报告或确定性评估约束来防止伪造结论。
    - 失败信号是有价值的输入；系统可通过迭代修复、结构化失败归因或跨运行演化来响应。
    - 在高杠杆决策点进行精准人机协作可优于完全自主或逐步监督。
    - 使用带基线和人类或专家判断的任务特定评测评估科学发现智能体。
    分歧:
    - 验证机制不同：有的依赖视觉-语言物理检查，有的依赖确定性程序权威或事实约束报告。
    - 自主模式不同：部分偏好全自主循环，部分集成多种人工干预模式。
    - 评测目标不同：部分报告通用实验基准提升，部分报告领域物理、生物、预测结果或专家偏好。
    - 失败处理深度不同：从简单反思到结构化多假设因果归因和自愈式Pivot/Refine循环。
