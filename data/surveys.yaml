  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Turns LLM capabilities into a complete loop of ideation, code
        implementation, experiment execution, visualization, and paper writing, lowering
        per-paper human effort.
      what_remains_open: Reliability of the generated claims is inconsistent; internal
        or simulated review may not match external peer review or broad scientific
        validity.
    - line: Evidence-grounded discovery benchmarks
      what_it_solves: Creates blinded or virtual discovery tasks that separate evidence
        quality from reproduction and produce repeatable agent scores.
      what_remains_open: Automated judges and task metrics may not align with real
        discovery utility; coverage is limited across domains and base models.
    - line: Domain-specific reliability and verification mechanisms
      what_it_solves: Reduces silent failures and unsafe or uncontrolled code evolution
        in autonomous research through physics-aware checks, deterministic authority
        boundaries, or feedback loops.
      what_remains_open: Verification gates can still miss planted failures; demonstrated
        boundaries are narrow and generalization to other domains or settings remains
        unproven.
    - line: Human-calibrated evaluation infrastructure
      what_it_solves: Establishes human performance references and open artifacts
        so agent results can be interpreted against expert baselines.
      what_remains_open: Human baselines are small or context-specific, and reproducible
        evaluation across changing models, data, and infrastructure is not standardized.
    consensus:
    - Research agents now share a common loop of hypothesis generation, experiment
      execution, result analysis, and written or reviewed output.
    - 'Evaluation is shifting from describing autonomy toward checking evidentiary
      maturity: controls, robustness, falsifiability, documentation, and comparability.'
    - Several works use human baselines or peer-review-style thresholds to contextualize
      agent performance, while still reporting that autonomous discovery remains limited.
    - Open-source code, frozen data, and deterministic scoring are increasingly treated
      as necessary to make automated research evaluation repeatable.
    disagreements:
    - Some systems evaluate success through workshop peer review or paper acceptance,
      while others use deterministic evidence-maturity rubrics or task completion
      scores, leading to different definitions of scientific success.
    - Some evaluations target open-ended discovery with no hidden target, while others
      use blinded tasks from peer-reviewed studies that withhold source conclusions
      and expected values.
    - 'Reliability is enforced differently: simulated reviewer feedback, physics-aware
      vision gates, or deterministic program authorities with cognition-authority
      separation; each assumes different failure sources.'
    - The evidence base differs by domain focus, including general ML research, CFD,
      single-cell transcriptomics, and time-series forecasting, so conclusions may
      not transfer across research fields.
    open_questions:
    - Do automated judges correlate with human experts and with long-term scientific
      impact when agents switch base models, given that current evidence uses limited
      frozen models?
    - Can silent failure detection be improved beyond the observed miss rate, and
      what failure modes remain unexamined outside planted cases or narrow domains?
    - When tasks hide source conclusions, how do we distinguish discovery from competent
      analysis execution and source-style reproduction?
    - Are current human baselines broad enough to support claims about autonomous
      discovery in specialized fields, and what expert validation is still missing?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究智能体
      解决的问题: 把LLM能力组织为假说生成、代码实现、实验执行、可视化和论文撰写的完整闭环，降低每篇论文的人工成本。
      尚未覆盖: 生成主张的可靠性不稳定；内部或模拟评审未必等价于外部同行评审或更广泛的科学有效性。
    - 路线: 证据锚定的科学发现基准
      解决的问题: 通过盲测或虚拟发现任务区分证据质量与复现，产出可重复的智能体评分。
      尚未覆盖: 自动评审与任务指标可能偏离真实科研效用；领域和基座模型覆盖有限。
    - 路线: 领域特定可靠性与验证机制
      解决的问题: 通过物理感知检查、确定性权限边界或反馈闭环，降低静默失败与不受控的代码演化。
      尚未覆盖: 验证门控仍会漏检植入失败；已验证边界较窄，跨领域泛化尚未证实。
    - 路线: 以人为校准的评测基础设施
      解决的问题: 提供人类表现参照和开放工件，使智能体结果可相对专家基线解释。
      尚未覆盖: 人类基线较小且带有场景特定性，跨模型、数据与基础设施的可复现评测尚未标准化。
    共识:
    - 研究智能体已形成提出假说、执行实验、分析结果、撰写或评审输出的共同闭环。
    - 评测正从展示自主性转向检查证据成熟度，包括对照、稳健性、可证伪性、文档记录和可比性。
    - 多类工作使用人类基线或类同行评审门槛来校准智能体表现，但仍报告自主发现能力有限。
