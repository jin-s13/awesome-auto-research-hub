  literature_review:
    line_of_work_matrix:
    - line: End-to-end agentic autonomous research loops (e.g., AutoRecLab, MLIPilot,
        SciLink)
      what_it_solves: Converts high-level research goals into hypotheses, code/config
        edits, execution, and interpretation across a research pipeline.
      what_remains_open: Standardized evaluation, governance, and evidence that the
        agentic loop improves scientific validity rather than only producing plausible
        artifacts.
    - line: Self-driving laboratory optimization and experiment orchestration (e.g.,
        La Agente Óptima, distributed SDL)
      what_it_solves: Persistent closed-loop selection of experiments or training
        configurations under physical or computational constraints.
      what_remains_open: Scalability beyond simple demonstrations, instrumentation/model
        mismatch, inference cost, and attribution of gains to planner versus constraint
        or simulator.
    - line: Predictive state and measurement modeling for automated experiments (e.g.,
        coupled digital twins, kNN feature recovery)
      what_it_solves: Converts raw measurements into corrected, predictive state and
        estimates uncertainty or risk for future actions.
      what_remains_open: Cross-modality generalization, low-intensity noise and discrete
        feature recovery, and comprehensive model-reality gap coverage.
    - line: Collaborative data and reproducibility infrastructure (e.g., FAIR distributed
        SDL)
      what_it_solves: Logs, shares, indexes, and updates data and models across collaborators
        and remote execution environments.
      what_remains_open: Adoption beyond a specific ecosystem, governance/provenance
        standards, and quantitative comparison against non-collaborative workflows.
    - line: Evaluation and evidence design for automated experimentation (e.g., kNN
        limitation study, AutoRecLab governance agenda)
      what_it_solves: Makes failure modes, noise conditions, and agenda-level gaps
        visible through benchmarks, ablations, and governance criteria.
      what_remains_open: Whether benchmark metrics and proxy evaluation align with
        downstream scientific discovery utility.
    consensus:
    - Automated experimentation is framed as a closed-loop process from observation
      or hypothesis to action, rather than isolated model fitting.
    - Explicit constraints or scoring functions are used to accept, reject, or guide
      candidate experiments or code changes.
    - Persistent logging, provenance, and model/data updates are treated as necessary
      components for repeatability and collaboration.
    - Current evidence is largely demonstration-oriented across a narrow set of tasks
      and lacks a common benchmark for autonomous research quality.
    - Some form of human or expert oversight remains visible, but its exact placement
      and authority are not standardized.
    disagreements:
    - 'Autonomy granularity differs: some systems aim to automate a full research
      pipeline, while others supervise repeated optimization campaigns or search code
      changes.'
    - 'Representation differs: predictive sample/instrument twins versus agent-managed
      Bayesian optimization versus kNN-based noisy feature correction versus LLM-mediated
      literature-aware reasoning.'
    - 'Evaluation target differs: physical laboratory runs, computational interatomic-potential
      training, and materials-characterization data, with different success metrics
      and constraints.'
    - 'Interaction and deployment differ: centralized HPC job management, distributed
      collaborative workflows, closed-loop physical instruments, and theory-in-the-loop
      characterization.'
    - Reported improvements do not separate the contribution of LLM reasoning from
      task-specific controllers, simulators, priors, or dataset characteristics.
    open_questions:
    - Which governance and evaluation standards can compare automated experimentation
      systems across different scientific domains?
    - How much of the observed optimization gain is attributable to LLM-agent decisions
      rather than fixed constraints, scorecards, simulators, or domain-specific priors?
    - Can predictive twins and noisy-feature recovery transfer to unseen modalities,
      datasets, noise levels, and feature distributions?
    - What minimal human oversight is needed as autonomy expands from code and optimization
      to physical laboratories and research claims?
    - Do proof-of-concept tasks such as color mixing, contact angle, flow chemistry,
      and QM7-derived MLIP training generalize to harder discovery problems?
