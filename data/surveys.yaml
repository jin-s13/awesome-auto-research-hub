  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery pipelines
      what_it_solves: Integrating idea generation, code/experiment execution, visualization,
        analysis, and manuscript writing into a single iterative agentic workflow.
      what_remains_open: Success is inconsistent and validation remains mostly workshop-level,
        LLM-judged, or small in domain coverage; full peer-review and conference-level
        robustness are not established.
    - line: Domain-specific discovery agents with embedded verification loops
      what_it_solves: Catching logical or physical silent failures and binding discovery
        to domain constraints such as mathematical proof coherence or flow-field plausibility.
      what_remains_open: Verification gates can miss planted failures and are shown
        mainly in narrow case studies; cross-domain transferability and broader boundary
        conditions remain open.
    - line: Benchmark environments and evidence-grounded evaluation
      what_it_solves: Providing reproducible discovery tasks and automatic scoring
        that cover hypothesis formation, experiment design, analysis, and conclusions.
      what_remains_open: Current coding agents plateau in evidence maturity and lack
        controls, robustness, and falsifiability; results are tied to one base model
        and proxy metrics.
    - line: Automated reviewer and visual feedback loops
      what_it_solves: Scaling paper evaluation and iteratively improving generated
        text or figures without full human reviewing at each step.
      what_remains_open: Near-human or acceptance-threshold scores do not yet demonstrate
        evidence-level validity or alignment with long-term scientific value.
    - line: Human-AI collaborative multi-agent reasoning
      what_it_solves: Structuring human expert oversight as principal-investigator
        guidance while agents retrieve knowledge, derive, verify, and write.
      what_remains_open: How much expert intervention is actually reduced and where
        autonomous reasoning boundaries should be drawn are not directly measured
        in available evidence.
    consensus:
    - The field converges on decomposing scientific discovery into ideation, experiment
      or code execution, analysis, and manuscript production.
    - LLM-based judges or rubric-driven automated evaluation are widely used to scale
      assessment of generated research artefacts.
    - Generic agentic research loops require additional verification or validity gates
      before claims can be considered defensible.
    - Current systems are better at competent analysis execution and documentation
      than at generating robust, controlled, falsifiable scientific conclusions.
    disagreements:
    - 'System scope: general-purpose machine-learning research workflows versus domain-constrained
      discovery in applied mathematics or computational fluid dynamics.'
    - 'Evaluation target: peer-review or workshop acceptance, task completion and
      evidence maturity, rubric score, or concrete physical metric improvement.'
    - 'Verification mechanism: simulated reviewer feedback, vision-language physics
      gates, internal proof or logic checks, or blind benchmark judges.'
    - 'Task framing: open-ended novel discovery versus bounded blind tasks derived
      from peer-reviewed studies or virtual environments.'
    open_questions:
    - Can autonomous discovery agents move beyond competent analysis execution to
      producing controlled, robust, falsifiable, and cross-dataset generalizable evidence?
    - Can domain-specific verification gates be generalized or combined so silent
      physical or logical failures are caught reliably beyond the tested cases?
    - Do LLM-based reviewer or rubric signals align with human scientific judgment,
      evidence quality, and long-term research usefulness rather than surface quality?
    - What causes the observed evidence-maturity plateau across coding agents, and
      would it persist across multiple base models and broader task distributions?
    - Can open-ended discovery be externally benchmarked without reducing the task
      to hidden-target reproduction and thereby underestimating exploratory science?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现管线
      解决的问题: 将想法生成、代码/实验执行、可视化、分析和论文撰写整合到单一迭代式智能体工作流。
      尚未覆盖: 成功稳定性不足，验证大多停留在工作坊水平、LLM 评审或小范围领域覆盖；完整同行评审和会议级稳健性尚未建立。
    - 路线: 带内部验证闭环的领域发现代理
      解决的问题: 捕捉逻辑或物理静默失败，并把发现约束到数学证明一致性或流场合理性等领域条件。
      尚未覆盖: 验证门控仍会漏检植入失败，且只在小范围案例中有证据；跨领域迁移和更广边界条件仍未知。
    - 路线: 基准环境与证据锚定评测
      解决的问题: 提供可复现的发现任务和自动评分，覆盖假设形成、实验设计、分析和结论。
      尚未覆盖: 当前编码智能体在证据成熟度上进入平台期，缺乏对照、稳健性和可证伪性；结果依赖单一基座模型和代理指标。
    - 路线: 自动评审与视觉反馈循环
      解决的问题: 在无人逐轮人工评审的情况下扩展论文评估，并迭代改进生成文本或图表。
      尚未覆盖: 接近人类或达到接受阈值不等于证据级验证，与长期科学价值的一致性也未得到证明。
    - 路线: 人机协同多智能体推理
      解决的问题: 将人类专家监管结构化为首席研究员指导，同时由智能体完成知识检索、推导、验证和写作。
      尚未覆盖: 专家干预实际减少多少、自主推理边界应设在哪里，现有证据尚未直接测量。
    共识:
    - 领域共同趋势是把科学发现分解为想法生成、实验或代码执行、分析和论文产出等阶段。
    - 基于 LLM 的评审或量规驱动自动评测被广泛用于规模化评估生成的研究工件。
    - 通用智能体研究流程需要额外的验证或有效性门控，才能让结果主张具备可辩护性。
    - 当前系统更擅长执行和记录分析，而在生成有对照、稳健、可证伪的科学结论方面仍然不足。
    分歧:
