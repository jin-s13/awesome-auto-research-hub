  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Turning idea generation, code or experiment execution, visualization,
        and manuscript production into one runnable loop without human-authored templates.
      what_remains_open: Output quality is inconsistent; only one of three submitted
        manuscripts passed peer review, and validation remains workshop-level or rubric-based
        rather than broad external verification.
    - line: Domain-specific discovery with validity gates
      what_it_solves: Adapting autonomous research to theory-heavy or physics-constrained
        settings by adding internal logic audits, knowledge retrieval, self-improvement,
        or vision-language physics checks.
      what_remains_open: Gates are not complete; a vision-language gate missed 2 of
        16 planted silent failures, and cross-domain transfer of these mechanisms
        is not established.
    - line: Evaluation environments and evidence-grounded benchmarks
      what_it_solves: Making open-ended discovery measurable through controlled tasks,
        completion metrics, domain coverage, and rubric-based evidence-maturity scoring.
      what_remains_open: Current agents plateau around low evidence maturity and lack
        controls, robustness, falsifiability, and cross-dataset generalization; results
        are only shown on one frozen base model.
    - line: Automated review and iterative feedback
      what_it_solves: Scoring and refining generated claims or manuscripts without
        full human review, using LLM reviewers, VLM feedback loops, or curated rubrics.
      what_remains_open: It is not clear whether reviewer scores track true contribution
        rather than surface quality, and reviewer validity across domains and user
        settings remains underexplored.
    consensus:
    - Autonomous scientific discovery is treated as a multi-stage workflow spanning
      hypothesis generation, experimentation or derivation, validation, and manuscript
      or report production.
    - Automated validation is widely considered necessary to catch invalid results
      before claims are accepted, though its implementation varies.
    - Current systems show narrow success rather than trustworthy open-ended discovery;
      generated papers have inconsistent quality, and benchmarked agents plateau on
      evidentiary tasks.
    - Automated evaluation and review can scale assessment of generated research,
      but reliability depends on rubric, judge, or gate design.
    disagreements:
    - 'Verification approach differs: simulated LLM review and VLM feedback loops
      versus internal logic verification plus knowledge retrieval versus vision-language
      physics gates over rendered flow fields.'
    - 'Evaluation target differs: paper acceptance or rubric score versus task completion
      in virtual environments versus evidence maturity on blind peer-reviewed tasks.'
    - 'Human role differs: human principal investigator with agent as graduate-student
      collaborator versus fully autonomous manuscript generation versus benchmarked
      coding agents operating on frozen data.'
    - 'Deployment domain differs: general machine learning research, applied mathematics
      or theory, computational fluid dynamics, and synthetic discovery environments.'
    - 'Success signal differs: autonomous physical model improvement or peer-review
      acceptance versus statistically reliable controls, robustness, falsifiability,
      and cross-dataset generalization.'
    open_questions:
    - How can autonomous discovery agents improve controls, robustness, falsifiability,
      and cross-dataset generalization beyond the plateau observed in evidence-maturity
      benchmarks?
    - Which verification gates or combinations are sufficient to detect silent failures
      across domains, given one gate missed 2 of 16 planted silent failures?
    - Are LLM-based reviewers and evidence-maturity judges tracking real scientific
      utility, or mainly surface features of generated reports?
    - How far do findings transfer across base models when reported agent performance
      comes from one frozen base model and many packet entries lack citation or external
      validation evidence?
