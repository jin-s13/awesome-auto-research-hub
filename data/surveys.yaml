  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research frameworks
      what_it_solves: Automating the full scientific discovery pipeline from idea
        generation to paper writing, reducing human effort and cost per paper.
      what_remains_open: Reliability of generated results outside the demonstrated
        domains; inconsistent pass rates in real peer review; and the absence of robust
        mechanisms to prevent hallucinated citations or fabricated numbers.
    - line: Domain-specific AI scientists with physical or logical verification
      what_it_solves: Extending autonomy to theory-heavy or physics-driven disciplines
        by embedding domain-specific validity gates (e.g., vision-language flow-field
        inspection, internal logical coherence audits) that catch silent failures.
      what_remains_open: Verification gates can still miss a fraction of failures;
        the approach tightly couples the system to a particular simulator or domain,
        limiting transferability.
    - line: Human-AI collaborative research pipelines
      what_it_solves: Balancing full autonomy with human oversight by allowing targeted
        intervention at high-leverage decision points, which improves overall research
        quality and trustworthiness.
      what_remains_open: Optimal granularity and timing of human intervention across
        different research stages; the cost–benefit trade-off between human effort
        and system performance gains.
    - line: Benchmarks and evaluation environments for AI scientists
      what_it_solves: Providing standardized tasks, datasets, and metrics to compare
        AI scientist systems on scientific reasoning, experiment design, and discovery
        capabilities.
      what_remains_open: Current benchmarks cover limited scientific domains and task
        types; correlation between benchmark scores and real-world research utility
        is unvalidated; human baselines are often small or narrow.
    consensus:
    - LLM-based agents can produce complete scientific papers that score above a simulated
      acceptance threshold, demonstrating feasibility of end-to-end automation.
    - Validation or verification steps are essential because purely generative pipelines
      produce errors, hallucinations, and physically invalid results.
    - Current systems perform well in narrow, well-defined subfields but struggle
      with open-ended, cross-domain discovery.
    - Evaluation remains a critical bottleneck, with simulated reviews, benchmark
      tasks, and real peer review each capturing different aspects of quality.
    disagreements:
