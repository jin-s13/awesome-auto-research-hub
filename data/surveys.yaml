    consensus:
    - 'Automatic paper writing is treated as a multi-stage agentic pipeline: ideation,
      execution, verification, drafting, and reviewing.'
    - The dominant direction combines generation with a verification or review loop
      to make claims citable and defensible.
    - Full autonomy alone is brittle; self-correction, human collaboration, or domain-specific
      gates improve success rates and artifact quality.
    - Current evidence relies on proxy evaluations such as review rubrics, workshop
      acceptance, or benchmark success rather than robust external validation.
    disagreements:
    - Some systems embed domain-specific validity gates such as vision-language physics
      checks or logical consistency audits; others rely on general-purpose reviewer
      feedback.
    - Interaction mode differs from fully autonomous runs to human-in-the-loop interventions
      at selected decision points, with varying granularity.
    - 'Evaluation targets differ: LLM judge scores, benchmark success metrics, and
      peer review acceptance are used across systems, so reported improvements are
      not directly comparable.'
    - 'Reporting constraints differ: some systems enforce measured-value grounding,
      while others allow reviewer feedback or internal verification to shape the final
      manuscript.'
    open_questions:
