  related_work_outline_zh:
  - 主流方向：构建将研究执行、论文生成与自动评审耦合的自主智能体流水线；主分支包括端到端通用写作智能体、领域专用验证驱动写作，以及人机协作可验证报告系统。
  - 研究共性：把科学工作流分解为构思、实现、实验、验证和写作阶段，并用LLM评审或同行评审式评分来评价论文。
