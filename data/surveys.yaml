  related_work_outline_zh:
  - 主流方向：构建端到端LLM科研智能体，整合构思、实验或代码执行、分析和论文生成，并日益强调领域特定验证与证据质量。
  - 研究共性：多步智能体流程通过任务完成、LLM评审或物理/理论有效性进行评判，人类角色转向高层监督或审阅。
  - 关键差异：通用发现系统与面向物理/数学的专用系统主要在验证机制、评测目标和监督模式上不同，而非仅由学科标签区分。
  - 趋势演进：2024–2026年的证据显示，前沿从通用自主科研框架和虚拟基准走向具备有效性门控、树搜索、知识检索与证据成熟度评估的专用智能体。
  - 开放问题：自主智能体能否产出可辩护的新科学仍无定论；证据显示其在对照、稳健性、可证伪性和跨领域泛化方面存在不足。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research workflows
      what_it_solves: Automating the complete research cycle from hypothesis generation,
        code or experiment execution, and analysis to manuscript writing with reduced
        human scaffolding.
      what_remains_open: Success is often judged by LLM reviewers or acceptance thresholds
        rather than independent replication, and generated contribution quality remains
        inconsistent.
    - line: Domain-embedded validity verification
      what_it_solves: Reducing silent failures in computational or mathematical discovery
        by checking flow fields, logical coherence, or solver-level validity before
        claims are accepted.
      what_remains_open: Verification gates are not exhaustive; ablation evidence
        shows missed silent failures, and domain-specific validity checks may not
        transfer to new settings.
    - line: Discovery evaluation and evidence benchmarks
      what_it_solves: Making discovery-agent capability comparable through controlled
        virtual tasks, blind peer-study-derived tasks, and automated evidence-quality
        scoring.
      what_remains_open: Generalization across base models, scientific domains, and
        task distributions remains underevaluated, and proxy metrics may not match
        real discovery utility.
    - line: Agentic search and iterative refinement
      what_it_solves: Expanding exploration beyond fixed code or experiment templates
        through tree search or review feedback to iteratively improve hypotheses,
        experiments, figures, and manuscripts.
      what_remains_open: Evidence is mostly at workshop level or based on curated
        generated papers; consistent peer-review acceptance and repeated scientific
        novelty are unresolved.
    - line: Theory-oriented multi-agent reasoning support
      what_it_solves: Supporting reasoning-heavy domains by retrieving declarative
        and procedural knowledge and structuring human-agent collaboration as a principal
        investigator and graduate student division of labor.
      what_remains_open: LLM-based rubric scores do not establish proof soundness
        outside the generated set, and limitation reporting is often sparse.
    consensus:
    - Autonomous research agents are framed as closed-loop systems covering ideation,
      execution or experimentation, analysis, and manuscript generation.
    - Automated judges or evidence-based metrics are increasingly used because large-scale
      human review is difficult.
    - Verification or quality gates are treated as necessary for preventing silent
      failures and unsupported claims.
    - Current agents perform useful execution and documentation but remain far from
      trustworthy open-ended discovery.
    disagreements:
    - Some systems target open-ended general machine learning hypothesis generation,
      while others embed domain-specific physical or logical validation before accepting
      results.
    - 'Evaluation targets differ: some systems score final papers or peer-review outcomes,
      while others score task completion, physical metric improvement, or multidimensional
      evidence maturity.'
    - Interaction and supervision differ across systems, ranging from fully autonomous
      pipelines to human-in-the-loop principal investigator and graduate student collaboration.
    open_questions:
    - Can automated verification gates guarantee scientific validity when evidence
      shows some silent failures still pass?
    - Do evidence-maturity scores predict whether an autonomous discovery would survive
      independent replication or human peer review?
    - Can domain-specific AI scientists generalize beyond one benchmark task, solver,
      or frozen base model without retuning?
    - What minimal human supervision or validation is required to move from competent
      experimental execution to trustworthy novel science?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研流程
      解决的问题: 自动完成从假设生成、代码或实验执行、分析到论文撰写的完整科研循环，减少人工脚手架。
      尚未覆盖: 成功常由LLM评审或接收阈值衡量，而非独立复现；生成成果的质量仍不稳定。
    - 路线: 领域嵌入式有效性验证
      解决的问题: 在计算或数学发现中通过检查流场、逻辑一致性或求解器级有效性，减少主张被接受前的静默失败。
      尚未覆盖: 验证门控并非穷尽；消融证据显示仍有静默失败漏检，领域特定检查可能不迁移。
    - 路线: 发现评测与证据基准
      解决的问题: 通过受控虚拟任务、基于盲审研究的任务和自动证据质量评分，使发现智能体的能力可比较。
      尚未覆盖: 跨基座模型、科学领域和任务分布的泛化性评估不足，代理指标可能不等同于真实发现效用。
    - 路线: 智能体搜索与迭代优化
      解决的问题: 通过树搜索或评审反馈扩展假设探索，迭代改进假设、实验、图表和论文。
      尚未覆盖: 证据多处于工作坊级别或精选生成论文，稳定的同行评审接受与可重复的新颖性仍未解决。
    - 路线: 面向理论的多智能体推理支持
      解决的问题: 通过检索陈述性与程序性知识，并将人机协作组织为首席研究员与研究生式分工，支持推理密集型领域。
      尚未覆盖: LLM评审分数不能证明生成集合之外的证明可靠性，局限性报告往往不足。
    共识:
    - 自主科研智能体被设计为覆盖构思、执行或实验、分析和论文生成的闭环系统。
    - 自动化裁判或基于证据的指标被越来越多地使用，因为大规模人工评审成本高。
    - 验证或质量门控被视为防止静默失败和缺乏支持主张的必要环节。
    - 当前智能体擅长执行和记录，但仍远未实现可信赖的开放式科学发现。
    分歧:
    - 部分系统面向通用开放式机器学习假设生成，而另一类系统在接收结果前嵌入领域特定的物理或逻辑验证。
    - 评测目标各异：有的系统评分最终论文或同行评审结果，有的系统评分任务完成、物理指标改进或多维证据成熟度。
    - 交互与监督方式不同，从全自动流程到人机首席研究员与研究生式协作均有出现。
    开放问题:
    - 当证据显示部分静默失败仍能通过时，自动验证门控能否保证科学有效性？
    - 证据成熟度评分能否预测自主发现是否经得起独立复现或人类同行评审？
    - 领域专用AI科学家能否在不重新调整的情况下泛化到其他基准任务、求解器或冻结基座模型？
    - 从熟练的实验执行到可信赖的新科学发现，需要何种最小人类监督或验证？
