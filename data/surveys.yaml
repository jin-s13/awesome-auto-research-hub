    - 路线: 完整发现循环的基准环境
      解决的问题: 提供可复用的模拟任务和指标，用于假设形成、实验设计、分析与结论，支持受控比较。
      尚未覆盖: 强基线仍难以完成多数任务；当前指标未必对应真实科学洞察，任务领域覆盖有限。
    - 路线: 基于证据的盲评估
      解决的问题: 在隐藏源结论与分析路径的情况下，用固定评分量规检验智能体能否给出数据支持的主张。
      尚未覆盖: 评估智能体在同一基座模型上分数接近，缺乏对照、稳健性、可证伪性与跨数据集泛化。
