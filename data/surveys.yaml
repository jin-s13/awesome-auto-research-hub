  related_work_outline_zh:
  - 主流方向：端到端自主实验智能体，能够提出假设、运行代码或模拟实验、分析结果并撰写论文；子方向包括多智能体研究团队、实验规划基准、持续失败记忆和发现评测环境。
  - 研究共性：以LLM驱动的循环提出实验或消融方案，执行后由自动或LLM评审器评估，并利用反馈或失败记录修正下一次尝试。
  - 关键差异：系统在范围（完整论文生成还是实验/消融规划）、交互模式（全自动还是人在回路）、评测场景（模拟发现、计算ML、PDE或应用数学）和是否使用持续记忆方面存在差异。
  - 趋势演进：从2024年的完整论文流水线走向2025-2026年的工作坊级结果、更多多智能体监督、基准化实验规划和失败感知迭代；证据仅覆盖2024-2026年，趋势仍处于当前前沿内。
  - 开放问题：LLM评分或模拟评审与人类同行评审是否一致；失败记忆和验证机制能否迁移到已评测任务之外；如何证明系统能在真实代码库和物理实验室中可靠部署。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery and manuscript generation systems (e.g.,
        The AI Scientist, The AI Scientist-v2, ReasFlow)
      what_it_solves: Close the loop from hypothesis generation through code execution,
        result analysis, and paper writing.
      what_remains_open: Reported success relies on LLM-based rubrics or workshop-level
        peer review; consistency and full human validation remain open.
    - line: Interactive multi-agent research platforms (e.g., Claw AI Lab, ReasFlow)
      what_it_solves: Provide customizable roles, monitoring, rollback/resume control,
        and runnable code harnesses for supervised experiment automation.
      what_remains_open: Evidence is limited to internal case studies or generated
        papers; external reproducibility across different research domains is not
        established.
    - line: Automated experiment planning and ablation design (e.g., AblationBench)
      what_it_solves: Plan which ablations or experiments are needed and detect missing
        ones from method sections or full papers.
      what_remains_open: Best systems identify only 45% of original ablations and
        show conflicting author/reviewer task behavior, leaving grounding and decision
        coverage unresolved.
    - line: Failure-aware memory for research iteration (e.g., Negative Knowledge
        as Failure-aware Shared Memory for AutoResearch)
      what_it_solves: Convert failed attempts into reusable typed failure records
        so downstream agents avoid repeated errors and propose better next experiments
        with lower token cost.
      what_remains_open: Generalization is shown only on ScienceAgentBench and two
        PDE tasks; whether the memory transfers to broader experiment settings is
        unverified.
    - line: Evaluation environments for discovery agents (e.g., DISCOVERYWORLD)
      what_it_solves: Provide standardized complete-cycle scientific discovery tasks
        with topic, difficulty, parametric variation, and automatic completion/action/knowledge
        metrics.
      what_remains_open: Text-based simulated tasks may not capture physical lab or
        real codebase constraints; strong baselines fail on most tasks, but the gap
        has not been linked to specific agent capabilities.
    consensus:
    - LLM agents can run end-to-end scientific experiment cycles spanning hypothesis
      design, execution, analysis, and manuscript generation.
    - Automated or LLM-based evaluation is widely used, but it remains a proxy for
      human judgment and needs calibration.
    - Memory, verification, and review feedback loops improve subsequent experiment
      proposals or manuscript quality.
    - Current systems still underperform humans on structured experiment planning
      and complete discovery tasks, especially under consistency requirements.
    disagreements:
    - 'Scope: some systems target full paper generation, while others focus only on
      planning ablations or recording failed attempts.'
    - 'Interaction mode: fully autonomous agents contrast with interactive platforms
      that offer monitoring, rollback, and human-in-the-loop control.'
    - 'Evaluation setting: simulated discovery tasks, computational ML experiments,
      applied-mathematics/PDE reasoning, and generated manuscript rubrics lead to
      different evidence claims.'
    - 'Persistent state: failure-aware shared memory is used in some systems, while
      others rely on context or verification loops without durable negative-knowledge
      storage.'
    - 'Success criterion: acceptance by automated/workshop review, benchmark recall,
      token efficiency, or judge preference are not equivalent and imply different
      validation gaps.'
    open_questions:
    - Do LLM-based rubrics and simulated review scores predict human peer-review acceptance
      outside workshop settings?
    - What evaluation protocol would make end-to-end experiment automation claims
      comparable across virtual, code-based, and physical lab settings?
    - How can failure memory and verification mechanisms be tested for transfer beyond
      ScienceAgentBench, PDE tasks, and internal AI case studies?
    - Which specific capabilities explain the low human-level ablation recall and
      the difficulty of strong baselines on discovery tasks?
    - What safety and reliability evidence is needed before autonomous research systems
      are deployed beyond curated demos and internal case studies?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现与论文生成系统（如 The AI Scientist、The AI Scientist-v2、ReasFlow）
      解决的问题: 打通从假设生成到代码执行、结果分析和论文撰写的完整循环。
      尚未覆盖: 成功证据依赖LLM评分或工作坊级评审；一致性和完整人工验证仍未解决。
    - 路线: 交互式多智能体研究平台（如 Claw AI Lab、ReasFlow）
      解决的问题: 提供可定制角色、监控、回滚/恢复控制和可运行代码工具，以支持受监督的实验自动化。
      尚未覆盖: 证据仅限于内部案例研究或生成论文；跨研究领域的外部可复现性尚未建立。
    - 路线: 自动化实验规划与消融设计（如 AblationBench）
      解决的问题: 规划所需的消融或实验，并从方法部分或完整论文中识别缺失实验。
      尚未覆盖: 最佳系统仅识别45%的原始消融，且作者/审稿人任务表现存在冲突，基础和决策覆盖仍未解决。
    - 路线: 面向研究迭代的失败感知记忆（如 Negative Knowledge as Failure-aware Shared Memory for AutoResearch）
      解决的问题: 将失败尝试转化为可复用的类型化失败记录，使下游智能体避免重复错误，并以更低令牌成本提出更好的下一次实验。
      尚未覆盖: 仅在 ScienceAgentBench 和两个 PDE 任务上显示泛化；记忆是否能迁移到更广泛的实验设置仍未验证。
    - 路线: 发现智能体评测环境（如 DISCOVERYWORLD）
      解决的问题: 提供标准化完整周期科学发现任务，涵盖主题、难度、参数变化以及自动完成/动作/知识指标。
      尚未覆盖: 基于文本的模拟任务可能无法覆盖物理实验室或真实代码库约束；强基线在多数任务中失败，但该差距尚未关联到具体智能体能力。
    共识:
    - LLM智能体能够运行覆盖假设设计、执行、分析和论文撰写的端到端科学实验循环。
    - 自动或LLM评价被普遍使用，但仍是人类判断的代理指标，需要校准。
    - 记忆、验证和评审反馈回路能改善后续实验方案或论文质量。
    - 当前系统在结构化实验规划和完整发现任务上仍低于人类水平，尤其在一致性方面。
    分歧:
    - 范围：一些系统面向完整论文生成，另一些只聚焦消融规划或失败尝试记录。
    - 交互模式：全自动智能体与提供监控、回滚和人在回路控制的交互平台形成对比。
    - 评测场景：模拟发现任务、计算ML实验、应用数学/PDE推理和生成论文评分产生不同的证据类型。
    - 持续状态：部分系统使用失败感知共享记忆，其他系统依赖上下文或验证循环，没有持久负知识存储。
    - 成功标准：自动/工作坊评审通过、基准召回率、令牌效率或评审偏好并不等价，代表不同的验证缺口。
    开放问题:
    - LLM评分和模拟评审分数能否预测工作坊之外的人类同行评审结果？
    - 需要何种评估协议，使虚拟、代码和物理实验室场景下的端到端实验自动化声明可比较？
    - 失败记忆和验证机制如何在 ScienceAgentBench、PDE 任务和内部 AI 案例之外测试迁移？
    - 哪些具体能力导致结构化消融回忆率低以及强基线在发现任务中表现困难？
    - 在超出策展演示和内部案例之前，自主研究系统还需要哪些安全与可靠性证据？
