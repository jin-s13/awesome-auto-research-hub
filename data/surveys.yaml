    - 执行接地和结果验证，如物理/视觉门控、规范评估或可验证报告，被视为减少静默失败和幻觉数字的必要手段。
    - 人类基线或高杠杆人机协作有助于校准；有限证据表明精准干预可能优于完全自主或逐步监督。
    - 当前AI科学家系统有潜力但尚未完全自主发现，提升常来自执行与工程而非研究洞察，自主写作仍困难。
    - 评测正从单模型输出转向基准、评审工件、失败案例和人类或专家基线，使主张更可比。
    分歧:
    - 自主与控制的划分不同：有的将LLM认知与确定性程序权威分离，有的采用多智能体辩论加自愈，或中央验证门。
