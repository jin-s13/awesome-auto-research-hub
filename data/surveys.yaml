  related_work_outline:
  - 'Mainstream direction: Building multi-agent LLM systems that automate literature
    search, survey generation, and scientific discovery loops, with heavy emphasis
    on iterative refinement, internal verification, and rubric-guided or world-model-based
    knowledge sharing.'
  - 'Shared research pattern: All works decompose complex literature or discovery
    tasks into specialized agent roles (retrieval, analysis, review, synthesis) and
    couple them with structured feedback mechanisms—verification loops, trees, gradients,
    or reviewer rubrics—to improve output quality over multiple rounds.'
  - 'Key differences: They differ in the central representation for knowledge sharing
    (world model vs. tree vs. behavioral rubric), the locus of supervision (human
    judgment, rubric alignment, accuracy of citations, or matching human baselines),
    and the primary deliverable (standalone survey vs. full research paper vs. benchmark
    score).'
  - 'Trend evolution: The 2025–2026 frontier shows a shift from single-purpose survey
    generators and domain-specific AI scientists toward domain-agnostic, self-evolving
    frameworks that unify literature search, hypothesis generation, and experimentation
    under a single agentic architecture, while parallel work builds evaluation benchmarks
    and catalogs failure modes.'
  - 'Open questions: Factual accuracy of generated literature statements remains insufficient
    (Kosmos reports 79.4% accuracy), long-horizon memory degradation and implementation
    drift limit reliability, and existing benchmarks cover only narrow scientific
    domains, leaving the gap between proxy metrics and real research utility unverified.'
  related_work_outline_zh:
  - 主流方向：构建多智能体大模型系统，自动化文献搜索、综述生成和科学发现循环，重点在于迭代优化、内部验证以及基于评分准则或世界模型的知识共享。
  - 研究共性：所有工作都将复杂的文献或发现任务分解为专业化智能体角色（检索、分析、评审、综合），并辅以结构化反馈机制——验证循环、树结构、梯度或评审准则——通过多轮迭代提升输出质量。
  - 关键差异：核心差异在于知识共享的表示形式（世界模型 vs. 树结构 vs. 行为锚定准则）、监督信号的来源（人类判断、准则对齐、引用准确性或与人类基线的匹配）以及主要产出物（独立综述、完整研究论文或基准分数）。
  - 趋势演进：2025–2026年的前沿显示，从单一用途的综述生成器和特定领域的AI科学家，转向领域无关、自我演化的框架，在统一的智能体架构下整合文献搜索、假设生成和实验，同时平行工作构建评估基准并记录失败模式。
  - 开放问题：生成的文献陈述的事实准确性仍然不足（Kosmos 报告 79.4% 准确率），长周期记忆退化和实现漂移限制了可靠性，现有基准仅覆盖狭窄的科学领域，导致代理指标与真实研究效用之间的差距尚未得到验证。
  literature_review:
    line_of_work_matrix:
    - line: Automated literature survey and synthesis generation
      what_it_solves: Produces structured, multi-section survey papers from seed topics
        by decomposing the workflow into topic expansion, citation curation, summarization,
        drafting, and peer review, with iterative rubric-guided refinement.
      what_remains_open: The generated surveys may lack the novel insight, critical
        argument, and deep conceptual reorganization that human experts provide; cross-domain
        generalization and comparison against human-authored surveys are not yet rigorous.
    - line: Literature search integrated into autonomous scientific discovery
      what_it_solves: Embeds real-time literature retrieval and knowledge synthesis
        into closed-loop discovery cycles, enabling systems to perform data analysis,
        hypothesis generation, and result verification while citing sources, producing
        traceable reports over long horizons.
      what_remains_open: Factual accuracy of retrieved and synthesized claims is bounded
        (e.g., 20.6% of report statements may be inaccurate), and the benefit of scaling
        discovery cycles has only been validated up to 20 iterations; the risk of
        hallucination and misinterpretation remains.
    - line: Evaluation and failure analysis for AI scientist systems
      what_it_solves: Provides benchmarks with human baselines, multiple-choice questions
        derived from published studies, and systematic documentation of recurring
        failure modes (bias toward defaults, implementation drift, memory degradation,
        overexcitement, insufficient domain intelligence, weak scientific taste).
      what_remains_open: Current benchmarks are limited to single-cell transcriptomics
        or narrow ML tasks; the mapping between proxy metrics (accuracy, rubric scores)
        and real scientific discovery utility is not established, and no standardized
        evaluation protocol exists across domains.
    - line: Scalable, self-evolving agent frameworks for literature-intensive tasks
      what_it_solves: Offers domain-agnostic architectures that allow building scientific
        agents with minimal code, supporting continuous self-evolution through hypothesis
        refinement, self-critique, and knowledge accumulation, while organizing research
        as tree-based workflows with backtracking.
      what_remains_open: Validation is confined to existing benchmarks (Humanity's
        Last Exam, MLE-Bench Lite, etc.) and selected optimization or driving scenarios;
        the frameworks have not been stress-tested on real-world multi-step literature
        workflows or diverse hardware settings.
    - line: Taxonomic surveys of agentic AI for scientific discovery
      what_it_solves: Organizes scattered systems into categories based on scientific
        domain and capability (literature review, hypothesis generation, experimentation,
        analysis) and highlights critical challenges and future directions.
      what_remains_open: The proposed taxonomies are not empirically validated to
        predict model behavior, and the survey itself acknowledges that literature
        review automation remains a significant unsolved challenge.
    consensus:
    - All systems favor decomposing literature-related tasks into specialized LLM
      agents with distinct roles (retrieval, analysis, writing, review), then using
      iterative feedback loops to raise quality.
    - Factual grounding and traceability are universally recognized as essential;
      every approach incorporates some form of citation, code reference, or internal
      verification to combat hallucination.
    - There is agreement that current AI scientist systems are not yet fully autonomous
      and require either human-in-the-loop oversight or explicit failure analysis
      to be trustworthy in scientific settings.
    disagreements:
    - 'Knowledge representation during literature processing: some works use a structured
      world model to share information between analysis and search agents, while others
      use tree-based research plans with backtracking, and yet others rely on a behaviorally
      anchored rubric without explicit internal state.'
    - 'Supervision signal: one line of work optimizes against a rubric-derived score
      from multiple reviewer agents, another measures accuracy of individual report
      statements against expert judgment, and a third uses human performance baselines
      on curated multiple-choice questions, leading to different notions of quality.'
    - 'Scope of delivery: systems range from focused survey paper generation (e.g.,
      a rubric-aligned survey engine) to end-to-end autonomous research paper generation
      that includes experiments, theorems, and proofs, with the former prioritizing
      comprehensiveness and format rigor and the latter emphasizing novelty and empirical
      validation.'
    open_questions:
    - How can generated literature surveys and discovery reports achieve the conceptual
      depth and critical perspective of human experts, beyond aggregating existing
      findings?
    - What evaluation protocols can reliably measure the true scientific utility of
      AI-generated literature output, bridging the gap between proxy metrics (rubric
      scores, accuracy percentages) and real-world research impact?
    - To what extent do the documented failure modes (memory degradation, implementation
      drift, overexcitement) generalize beyond the specific ML and single-cell domains
      tested, and how can they be mitigated in longer, open-ended literature workflows?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动化文献综述与综合生成
      解决的问题: 通过将工作流分解为主题扩展、引文管理、总结、起草和同行评审，并借助迭代式准则优化，从种子主题自动生成结构化多章节综述论文。
      尚未覆盖: 生成的综述可能缺乏人类专家提供的新颖见解、批判性论证和深度概念重组；跨领域泛化以及与人类撰写综述的严格比较尚未充分实现。
    - 路线: 文献搜索集成于自主科学发现
      解决的问题: 将实时文献检索和知识综合嵌入闭环发现循环，使系统能够在执行数据分析、假设生成和结果验证的同时引用来源，在长周期内生成可追溯的报告。
      尚未覆盖: 检索和综合陈述的事实准确性有限（例如，20.6% 的报告陈述可能不准确），且发现周期的扩展效益仅在最多 20 次迭代中得到验证；幻觉和误解的风险依然存在。
    - 路线: AI科学家系统的评估与失败分析
      解决的问题: 提供含人类基线的基准、来自已发表研究的选择题，以及系统记录的重复失败模式（对默认值的偏差、实现漂移、记忆退化、过度兴奋、领域智能不足、科学品味薄弱）。
      尚未覆盖: 当前基准局限于单细胞转录组学或狭窄的机器学习任务；代理指标（准确率、准则得分）与真实科学发现效用之间的映射尚未建立，且缺乏跨领域的标准化评估协议。
    - 路线: 面向文献密集型任务的可扩展自演化智能体框架
      解决的问题: 提供领域无关的架构，支持以最少代码构建科学智能体，通过假设优化、自我批判和知识积累实现持续自演化，并将研究组织为具有回溯功能的树形工作流。
      尚未覆盖: 验证仅限于现有基准（Humanity's Last Exam、MLE-Bench Lite 等）以及选定的优化或驾驶场景；这些框架尚未在真实世界多步骤文献工作流或多样化的硬件设置上进行压力测试。
    - 路线: 面向科学发现的智能体AI分类调查
      解决的问题: 将分散的系统按科学领域和能力（文献综述、假设生成、实验、分析）进行分类，并指出关键挑战和未来方向。
      尚未覆盖: 所提出的分类未经过实证验证以预测模型行为，且调查本身承认文献综述自动化仍是一个未解决的重大挑战。
    共识:
    - 所有系统都倾向于将文献相关任务分解为具有不同角色（检索、分析、写作、评审）的专门化大模型智能体，并通过迭代反馈循环来提升质量。
    - 事实依据和可追溯性被普遍认为是必要的；每种方法都包含某种形式的引用、代码参考或内部验证以对抗幻觉。
    - 学界一致认为当前的AI科学家系统尚未完全自主，需要人机协作监督或明确的失败分析，才能在科学环境中值得信赖。
    分歧:
    - 文献处理过程中的知识表示：一些工作使用结构化世界模型在分析和搜索智能体之间共享信息，另一些使用具有回溯功能的树形研究计划，还有一些依赖行为锚定准则而不包含显式内部状态。
    - 监督信号：一条路线根据多个评审智能体的准则得分进行优化，另一条测量单个报告陈述相对于专家判断的准确性，第三条则使用基于人类表现基线的策划选择题，导致了不同的质量观念。
    - 交付范围：系统从专注的综述论文生成（如准则对齐的综述引擎），到包含实验、定理和证明的端到端自主研究论文生成，前者优先考虑全面性和格式严格性，后者强调新颖性和实证验证。
    开放问题:
    - 生成的文献综述和发现报告如何能够超越聚合现有发现，达到人类专家的概念深度和批判性视角？
    - 何种评估协议能够可靠地衡量AI生成文献输出的真实科学效用，从而弥合代理指标（准则得分、准确率百分比）与真实世界研究影响之间的差距？
    - 已记录的失败模式（记忆退化、实现漂移、过度兴奋）在多大程度上能泛化到已测试的机器学习和单细胞领域之外，以及如何在更长、开放式的文献工作流中缓解这些模式？
