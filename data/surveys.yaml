  related_work_outline:
  - 'Mainstream direction: Building autonomous research agents that couple hypothesis
    generation with executable experiment loops, execution-based evidence, and report
    verification, across domain-specific and domain-agnostic settings.'
  - 'Shared research pattern: Treating execution results as evidence for the next
    cycle; separating ideation from deterministic authority or verification; constraining
    outputs to measured values; and placing humans at selective decision points.'
  - 'Key differences: Systems vary in verification mechanisms, from physics-aware
    visual gates to deterministic program authority to report-level fact constraints;
    evaluation ranges from domain metric improvement, general task-suite score, expert
    preference, and human baseline comparison; interaction ranges from fully autonomous
    to interactive human oversight.'
  - 'Trend evolution: The top evidence falls in 2025-2026, so this is a current-frontier
    trend; 2025 work emphasizes surveys and task suites, while 2026 papers add self-correction,
    evolution mechanisms, interactive platforms, and stronger reproducibility signals,
    indicating a shift from one-shot idea generation toward closed-loop research systems.'
  - 'Open questions: How to close verification gaps, align proxy metrics with real
    discovery utility, determine optimal human intervention, and scale failure attribution
    beyond curated case studies remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建自主研究智能体，将假设生成、可执行实验、失败诊断与可验证报告耦合，用于领域专用或通用科研流程。
  - 研究共性：以执行结果作为下一轮证据；把创意生成与确定性验证/权威分离；将输出约束到实测值；在关键决策点引入人类监督。
  - 关键差异：验证机制、评测目标和交互监督方式不同：从物理视觉门控到程序权威，从领域指标到任务套件分数与专家偏好，从全自主到交互面板。
  - 趋势演进：证据集中在2025-2026年；从综述与评测走向自我纠正、演化、交互平台和更强复现信号，显示从一次性想法生成向闭环研究转变。
  - 开放问题：验证门控漏检、代理指标与真实科研效用、何时需要人类介入、失败归因与跨域泛化仍缺外部验证。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous research loops coupling hypothesis generation with executed
        experiments
      what_it_solves: Turns proposed ideas into runnable experiments or code changes
        and uses execution feedback to guide later hypotheses.
      what_remains_open: Whether loops generalize beyond curated case studies; most
        papers lack external reproduction and natural failure distributions.
    - line: Evidence-grounded failure attribution and self-correction
      what_it_solves: Diagnoses failed experiments from execution trajectories and
        routes intervention to hypothesis, design, or implementation.
      what_remains_open: Causal attribution coverage and accuracy are not fully validated
        on unseen or unplanted failures.
    - line: Human-AI collaboration and verifiable reporting
      what_it_solves: Places human oversight at decision points and constrains generated
        reports to measured outputs, reducing unsupported claims.
      what_remains_open: Optimal intervention granularity and scalability of report
        verification in open-ended discovery remain unclear.
    - line: Domain-constrained scientific discovery agents
      what_it_solves: Filters invalid hypotheses through domain validation signals
        such as physical visual checks, data-specific baselines, or domain task suites.
      what_remains_open: Validity gates still miss silent failures and domain coverage
        is limited to a few cases.
    - line: Evaluation and human baseline construction
      what_it_solves: Creates task suites, baselines, expert judgments, and human
        reference points for comparing autonomous research capability.
      what_remains_open: Proxy metrics have not been directly tied to real scientific
        discovery utility.
    consensus:
    - Generated hypotheses are treated as incomplete until executed, checked, or reproduced.
    - Execution feedback is used to update or reject ideas rather than relying on
      static prompt-only hypothesis generation.
    - Systems separate creative generation from a checking or authority component
      to prevent unsound changes and hallucinated results.
    - Fully autonomous research and writing are still considered unsolved, leaving
      room for human collaboration or domain constraints.
    disagreements:
    - 'Verification mechanism differs: physics-aware vision gate, deterministic program
      authority, or factual report constraint.'
    - 'Interaction mode differs: fully autonomous loop, targeted human-in-the-loop,
      or interactive dashboard with rollback/resume.'
    - 'Evaluation target differs: domain metric improvement, general task-suite score,
      expert preference, or human-level baseline comparison.'
    - 'Scope differs: domain-specific scientific workflows versus domain-agnostic
      research frameworks.'
    open_questions:
    - The only explicit planted-failure ablation misses 2 of 16 failures; false negative
      rates under natural conditions are unknown.
    - Proxy task metrics and expert preferences have not been linked to real discovery
      outcomes, especially when evaluations use internal case studies.
    - The optimal role and granularity of human intervention have not been externally
      validated across different scientific settings.
    - Several limitations fields are empty, leaving the true failure boundary and
      cross-domain generalization as verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主研究循环与可执行实验耦合
      解决的问题: 将提出的假设转化为可运行实验或代码修改，并用执行反馈指导后续假设。
      尚未覆盖: 能否在精选案例之外泛化；多数研究未提供外部复现或自然失败分布。
    - 路线: 基于证据的失败归因与自我纠正
      解决的问题: 从执行轨迹或实验结果中诊断失败原因，并将干预路由到假设、设计或实现。
      尚未覆盖: 因果归因的覆盖率与准确性；对未植入或开放场景的失败缺少充分验证。
    - 路线: 人机协作与可验证报告
      解决的问题: 在关键决策点插入人类监督，并将报告约束到实测结果，减少虚构输出。
      尚未覆盖: 何种干预粒度最优尚无标准证据；报告约束能否在开放式发现中扩展未知。
    - 路线: 领域约束的科学发现智能体
      解决的问题: 通过物理视觉门控、数据基线或领域任务套件过滤无效假设。
      尚未覆盖: 验证门控仍会漏检静默失败；领域评估覆盖面有限。
    - 路线: AI研究智能体的评估与人类基线构建
      解决的问题: 用任务套件、基线、专家评审或人类表现参考点使研究能力可比较。
      尚未覆盖: 代理指标与真实科学发现效用之间的一致性未被直接验证。
    共识:
    - 各路线都将假设视为未完成，直到经过执行、检查或复现。
    - 执行反馈被用于修正或拒绝想法，而非只依赖静态提示生成假设。
    - 系统将创意生成与检查或权威组件分离，以减少不合理修改和幻觉结果。
    - 完全自主的科研与写作仍被视为未解决，需保留人类协作或领域约束。
    分歧:
    - 验证机制不同：物理感知视觉门控、确定性程序权威或报告事实约束。
    - 交互模式不同：全自主循环、精准人类介入或带可回滚的交互面板。
    - 评测目标不同：领域指标提升、通用任务套件分数、专家偏好或人类水平比较。
    - 范围不同：领域专用科学流程与领域无关研究框架。
    开放问题:
    - 仅有的植入失败消融遗漏了16个中的2个；自然条件下的漏检率未知。
    - 代理指标与专家偏好尚未与真实科研发现关联，部分评估依赖内部案例或选择题。
    - 人类介入的最佳角色和粒度尚未在不同科学场景中得到外部验证。
    - 多条路线未提供完整局限说明，失败边界与跨域泛化仍是验证缺口。
