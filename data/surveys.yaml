  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automating the full scientific discovery cycle from ideation
        to paper generation, removing human involvement from routine stages.
      what_remains_open: Inconsistent output quality, limited generalization to complex
        or niche domains, and no evidence of producing truly paradigm-shifting findings.
    - line: Verification and error correction
      what_it_solves: Reducing hallucinated results and silent failures via internal
        logic audits, physics-aware visual checks, or self-healing execution loops.
      what_remains_open: Verification gates can still miss errors (e.g., 2 of 16 planted
        failures missed), and domain-specific designs hinder cross-domain reuse.
    - line: Evaluation benchmarks and environments
      what_it_solves: Providing standardized tasks and metrics to compare AI scientist
        capabilities, covering diverse topics and difficulty levels.
      what_remains_open: Whether such benchmarks reflect the open-ended creativity
        of real discovery, and the gap between automated metrics and human expert
        judgment.
    - line: Human-AI collaboration frameworks
      what_it_solves: Enabling human intervention at high-leverage decision points
        to improve result quality and reliability over fully autonomous runs.
      what_remains_open: Optimal collaboration modes remain undetermined, and the
        scalability and cost of human involvement are not yet addressed.
    consensus:
    - All systems rely on large language models as the core reasoning engine, orchestrated
      within multi-agent architectures.
    - Decomposing the discovery process into specialized sub-agents (ideation, coding,
      reviewing) improves performance over monolithic approaches.
    - Benchmarking is essential for measuring progress, and current systems still
      fall short of human expert-level reliability in fully autonomous mode.
    disagreements:
    - Fully autonomous execution is pursued by some pipelines, while others argue
      that targeted human collaboration yields better results and prevents uncorrected
      errors.
    - 'Verification mechanisms differ in nature: some encode domain-specific physical
      or mathematical constraints, while others use generic debate or self-healing
      loops without deep domain grounding.'
    - 'Evaluation is fragmented: automated reviewer scores, real peer-review outcomes,
      and standardized benchmark metrics are used interchangeably, limiting cross-system
      comparability.'
    open_questions:
    - How can a unified verification layer be designed to handle both theoretical
      reasoning and empirical simulation without domain-specific re-engineering?
    - Do current benchmarks genuinely capture the exploratory, open-ended nature of
      scientific discovery, or do they reward narrow optimization?
    - Can AI scientist systems generate novel, impactful hypotheses that go beyond
      rearranging known patterns, and how would we reliably measure that?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流水线
      解决的问题: 将科学发现的全过程从构思到论文生成自动化，消除常规阶段的人工参与。
      尚未覆盖: 生成质量不稳定，对复杂或小众领域泛化不足，且尚无证据表明能产生真正范式转移的发现。
