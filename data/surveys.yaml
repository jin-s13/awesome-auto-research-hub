  literature_review:
    line_of_work_matrix:
    - line: End-to-end general discovery frameworks
      what_it_solves: Automating the full research loop from ideation, code implementation,
        and experiment execution through visualization, writing, and review for broad
        ML-style studies.
      what_remains_open: Peer-review success is inconsistent, validation is mostly
        workshop-level or LLM-judged, and independence from human-authored code templates
        still needs stronger evidence.
    - line: Domain-specific discovery agents with verification gates
      what_it_solves: Embedding disciplinary checks such as logical derivation audits
        or vision-based physics validation to reduce silent errors in applied mathematics
        and computational fluid dynamics workflows.
      what_remains_open: Verification gates are incomplete; evidence shows missed
        planted silent failures and reliance on curated LLM scoring rubrics rather
        than external scientific consensus.
    - line: Benchmark environments for discovery agents
      what_it_solves: Providing task suites and metrics for complete discovery cycles
        so agent capability can be compared without exposing hidden target studies
        or expected conclusions.
      what_remains_open: Task coverage and proxy-metric utility remain uncertain;
        strong baseline agents still lack controls, robustness, cross-dataset generalization,
        and falsifiability.
    - line: Automated evidence-maturity evaluation
      what_it_solves: Scoring whether agent-produced claims have sufficient evidentiary
        support across dimensions such as controls, robustness, falsifiability, novelty,
        and auditability.
      what_remains_open: Generalizability across base models and judges is not established,
        and current scores reveal plateauing coding agents that remain far from trustworthy
        discovery.
    consensus:
    - 'Research agents broadly adopt a full-loop decomposition: ideation, experiment
      execution, analysis, and manuscript generation.'
    - Verification and evaluation are treated as necessary layers, whether as internal
      correctness checks, automated review, or external benchmark tasks.
    - Current systems are more reliable at executing and documenting analyses than
      at producing defensible, novel scientific claims under controls and robustness
      checks.
    - Domain-specific validity signals improve error detection compared with generation-only
      workflows, but no evidence yet shows complete silent-failure coverage.
    disagreements:
    - 'Verification source differs: internal LLM-based review or derivation loops,
      physics-aware vision gates, blind benchmark judges, and peer-review acceptance
      are used as different validity signals.'
    - 'Target setting differs: general machine-learning discovery frameworks contrast
      with domain-specific applied-math and computational-fluid-dynamics systems,
      and with simulated or blinded task environments.'
    - 'Evaluation emphasis differs: some work scores generated manuscripts by rubric,
      others measure task completion or evidence maturity, and others rely on peer-review
      acceptance.'
    - 'Interaction and supervision differ: fully automated agents, human-principal-investigator/agent-graduate-student
      collaboration, and benchmark-deployed coding agents assume different human roles.'
    open_questions:
    - How well do LLM-based review scores or benchmark metrics predict real scientific
      validity beyond the curated evaluation setting?
    - Can verification gates detect enough silent failures across open-ended domains,
      given observed misses in planted-failure ablations?
    - Are agent rankings stable across different base models and task distributions,
