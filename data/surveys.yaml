  related_work_outline:
  - 'Mainstream direction: Developing end-to-end AI research agents that can autonomously
    generate, execute, and evaluate scientific hypotheses, with a strong emphasis
    on reliability, verifiability, and self-correction.'
  - 'Shared research pattern: A closed-loop architecture where LLM-based agents generate
