  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous manuscript generation
      what_it_solves: Generates research ideas, experiments, visualizations, and full
        papers from minimal human prompts or templates.
      what_remains_open: Inconsistent success, long-horizon memory or context degradation,
        weak scientific taste, and uncertain acceptance beyond workshop or rubric
        settings.
    - line: Verification and self-correction for generated claims
      what_it_solves: Audits logical, physical, or factual validity of generated results
        before human inspection and routes corrections to hypothesis, design, or implementation.
      what_remains_open: Verification gates can miss silent failures; evidence is
        limited to narrow domains or small ablations, and the link to human peer review
        is not established.
    - line: Human-AI collaboration and oversight design
      what_it_solves: Allocates human intervention to high-leverage decision points
        rather than requiring full autonomy or step-by-step oversight.
      what_remains_open: Optimal interaction modes and domain-specific allocation
        remain underevaluated beyond benchmark ablations.
    - line: Evaluation and reproducibility infrastructure for AI research writing
      what_it_solves: Provides curated rubrics, LLM reviewers, benchmark tasks, and
        open-source artifacts to compare autonomous research-writing pipelines.
      what_remains_open: Proxy metrics and acceptance thresholds may not capture scientific
        novelty, correctness, or generalization across domains.
    consensus:
    - Multiple systems decompose research writing into ideation, execution, experimentation,
      and manuscript drafting stages.
    - Verification or reviewer loops are treated as necessary because generated claims
      can contain errors or hallucinations.
    - Human judgment remains a checkpoint, either as final review or targeted intervention,
      even in highly autonomous pipelines.
    - Open-source artifacts and benchmark comparisons are becoming standard for assessing
      research-writing agents.
    disagreements:
    - 'Verification strategy differs: one line audits logical coherence before human
      inspection, another inspects rendered physical fields for silent solver failures,
      and another constrains reported metrics to measured values.'
    - 'Interaction mode differs: some pursue full autonomy with minimal prompts, while
      others frame the human expert as principal investigator or high-leverage collaborator.'
    - 'Evaluation target differs: LLM-based review rubrics, workshop peer-review acceptance,
      benchmark performance improvements, and blind scoring are used separately.'
    - 'Domain scope differs: some systems target general machine learning subfields,
      while others specialize in applied mathematics or computational fluid dynamics.'
    open_questions:
    - Can domain-specific verification gates generalize across physics, mathematics,
      and empirical machine learning tasks without task-specific validators?
    - Does success under LLM rubrics or workshop review predict scientific correctness
      and novelty, or only internal consistency?
    - Where should human intervention be placed as tasks become longer and failures
      become less observable?
    - Can self-correction from failure attribution improve manuscript-level scientific
      quality, not just code and execution metrics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主论文生成
      解决的问题: 从最小提示或模板自动生成研究想法、实验、可视化和完整论文。
      尚未覆盖: 成功率不稳定，长程记忆或上下文退化，科学品味弱；是否真正超越工作坊或审稿量表仍不明确。
    - 路线: 生成主张的验证与自我纠正
      解决的问题: 在人工检查前审计逻辑、物理或事实有效性，并把错误路由到假设、实验设计或实现层面纠正。
      尚未覆盖: 验证门会漏检静默失败；证据目前来自窄领域或小规模消融，与真实同行评审的联系尚未建立。
    - 路线: 人机协作与介入设计
      解决的问题: 将人工介入放在高杠杆决策点，而非完全自主或逐步监督。
      尚未覆盖: 最优交互模式和跨领域分配仍缺少基准消融之外的外部验证。
    - 路线: AI科研写作的评测与可复现基础设施
      解决的问题: 通过策划量表、LLM评审器、基准任务和开源工件来比较科研写作智能体。
      尚未覆盖: 代理指标和接收阈值可能无法覆盖科学新颖性、正确性和跨领域泛化。
    共识:
    - 多个系统把科研写作拆成想法生成、执行、实验和手稿撰写等阶段。
    - 验证或评审回路被普遍视为必要，因为生成主张可能包含错误或幻觉。
    - 即使在高度自主流水线中，人类判断仍作为最终审查或关键点介入保留。
    - 开源工件与基准比较正在成为评估科研写作智能体的常见方式。
    分歧:
    - 验证策略不同：有的在人工检查前审计逻辑一致性，有的检查渲染物理场以发现求解器静默失败，有的把报告指标限制为实测值。
    - 交互模式不同：有的追求最少提示下的完全自主，有的将人类专家设计为首席研究员或高杠杆协作者。
    - 评测目标不同：分别采用LLM评审量表、工作坊同行评审接收、基准性能提升和盲审打分。
    - 领域范围不同：有的面向通用机器学习子领域，有的专注应用数学或计算流体动力学。
    开放问题:
    - 领域特定验证门能否在物理、数学和经验性机器学习任务间泛化，而不必为每类任务重写验证器？
    - 通过LLM量表或工作坊评审是否预测科学正确性和新颖性，还是只反映内部一致性？
    - 当任务变长、失败更难观测时，人工介入的最佳位置在哪里？
    - 基于失败归因的自我纠正能否提升论文层面的科学质量，而不只是代码或执行指标？
