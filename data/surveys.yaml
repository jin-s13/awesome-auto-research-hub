  related_work_outline:
  - 'Mainstream direction: autonomous multi-agent research systems that generate hypotheses,
    execute experiments, verify results, and iteratively refine ideas across scientific
    domains.'
  - 'Shared research pattern: LLM-driven ideation is embedded in execution loops with
    structured evaluation, reporting constraints, and some human or programmatic oversight.'
  - 'Key differences: domain focus, control architecture, verification style, and
    evaluation target vary; some stress domain-specific validity, others benchmark
    or judge-based comparison.'
  - 'Trend evolution: from surveys and benchmarks in 2025 toward 2026 self-correcting,
    domain-grounded, and human-AI collaborative autonomous research pipelines.'
  - 'Open questions: whether gains reflect research insight or engineering tricks;
    how to standardize reliability, verification, novelty metrics, and external reproducibility.'
  related_work_outline_zh:
  - 主流方向：自主多智能体研究系统在多个科学领域中生成假设、运行实验、验证结果并迭代细化思想。
  - 研究共性：LLM驱动的构思嵌入执行循环，配合结构化评估、报告约束以及人类或程序化监督。
  - 关键差异：领域重点、控制架构、验证方式和评测目标不同；有的强调领域特定有效性，有的采用基准或评审比较。
  - 趋势演进：从2025年的综述与基准，走向2026年强调自纠正、领域验证和人机协作的自主研究流水线。
  - 开放问题：收益是否来自研究洞察还是工程技巧；可靠性、验证、新颖性指标与外部复现性如何标准化。
  literature_review:
    line_of_work_matrix:
    - line: Domain-grounded autonomous discovery agents
      what_it_solves: autonomously propose, execute, and verify literature-grounded
        hypotheses in specialized scientific workflows such as computational fluid
        dynamics.
      what_remains_open: verification can miss silent failures; validation remains
        narrow and domain-specific.
    - line: Human-AI collaborative multi-agent research teams
      what_it_solves: combine structured debate, self-healing execution, and verifiable
        reporting with targeted human intervention.
      what_remains_open: evaluation uses few internal case studies; optimal human
        intervention points are not standardized.
    - line: Cognition-authority separated iterative evolution
      what_it_solves: keeps open-ended LLM hypothesis and code generation bounded
        by deterministic source-edit, evaluation, and promotion rules.
      what_remains_open: reported limitations are absent; generalization beyond forecasting
        cases is a verification gap.
    - line: Self-correcting experiment failure attribution
      what_it_solves: diagnose experiment failures through multiple evidence-grounded
        explanations and route corrections to hypothesis, design, or implementation.
      what_remains_open: autonomous conference-ready writing remains unsolved; code
        and artifact signals are limited.
    - line: Benchmark and testbed design for AI scientists
      what_it_solves: assess AI scientists on real data tasks, human baselines, or
        improvement over published models.
      what_remains_open: tasks may reward engineering tricks or narrow annotation;
        benchmark reproducibility is unclear.
    - line: Taxonomy and survey of agentic scientific discovery
      what_it_solves: organize agentic AI systems, metrics, frameworks, and datasets
        across chemistry, biology, and materials science.
      what_remains_open: direct empirical validation that the proposed categories
        predict system behavior is missing.
    consensus:
    - LLM agents are used in iterative loops to generate hypotheses or ideas and then
      execute and evaluate experiments.
    - Structured verification and reporting controls are needed to reduce hallucinated
      or invalid scientific claims.
    - Targeted human collaboration at high-leverage decision points improves over
      fully autonomous or exhaustive oversight.
    - Current systems show potential but are not yet reliable enough for fully autonomous
      scientific discovery.
    disagreements:
    - 'Control architecture differs: deterministic cognition-authority separation,
      multi-agent debate, or human-in-the-loop intervention.'
    - 'Evaluation target differs: domain-specific task improvement, benchmark score,
      judge preference, or human baseline.'
    - Whether observed gains come from research insight or ML engineering tricks is
      contested; testbed evidence points mostly to engineering tricks.
    - 'Verification mechanisms differ: domain-specific visual gates, grounded measured-value
      reporting, or multi-hypothesis failure attribution.'
    open_questions:
    - Can autonomous hypothesis generators produce defensible, generalizable claims
      beyond narrow case studies and benchmarks?
    - How should verification and failure attribution be standardized across domains
      with different silent failure modes?
    - Which metrics capture novelty and research-level insight rather than engineering
      optimization?
    - How can external reproducibility be improved when code, data, and artifact availability
      is missing or limited?
    - How should evaluation separate popularity or read-first signals from reproducible
      methodological validity?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域验证的自主发现智能体
      解决的问题: 在计算流体动力学等专业科学流程中自主提出、执行并验证基于文献的假设。
      尚未覆盖: 验证可能漏掉静默失败；验证范围较窄且局限于特定领域。
    - 路线: 人机协作的多智能体研究团队
      解决的问题: 将结构化辩论、自愈执行和可验证报告与精准人工干预结合。
      尚未覆盖: 评估仅基于少量内部案例；最优人工干预点尚未标准化。
    - 路线: 认知-权威分离的迭代演化
      解决的问题: 让开放式LLM假设与代码生成受确定性源码边界、评估和晋升规则约束。
      尚未覆盖: 缺少报告的局限性；预测案例之外的泛化属于验证缺口。
    - 路线: 自纠正实验失败归因
      解决的问题: 通过多证据解释诊断失败，并将纠正路由到假设、实验设计或实现。
      尚未覆盖: 自主撰写可投稿论文仍未解决；代码和工件信号有限。
    - 路线: AI科学家基准与测试台设计
      解决的问题: 通过真实数据任务、人类基线或对已发布模型的改进来评估AI科学家。
      尚未覆盖: 任务可能奖励工程技巧或狭窄注释；基准复现性不明确。
    - 路线: 智能体科学发现的分类与综述
      解决的问题: 组织化学、生物学和材料科学中的智能体AI系统、指标、框架和数据集。
      尚未覆盖: 所提分类能否预测系统行为尚缺少直接实证验证。
    共识:
    - LLM智能体在迭代闭环中生成假设或想法，并执行、评估实验。
    - 需要结构化验证和报告约束来减少幻觉或无效科学声明。
    - 在关键决策点进行精准人工协作优于全自主或逐步监督。
    - 当前系统具备潜力，但尚未达到完全可靠的自主科学发现。
    分歧:
