  - 'Key differences: general machine-learning discovery agents versus domain-specific
    physics/math systems; internal validity gates versus external benchmark judges;
    fully autonomous versus human-as-PI collaboration.'
  - 'Trend evolution: 2024 introduced broad fully automated frameworks and virtual
    discovery tasks; 2025 added agentic tree search and workshop peer acceptance;
    2026 shifted toward domain-specific verification and evidence-grounded benchmarks,
    all within the current frontier.'
