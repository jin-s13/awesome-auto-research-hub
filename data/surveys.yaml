  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research lifecycle systems
      what_it_solves: Connects idea generation, code implementation, experiment execution,
        visualization, manuscript writing, and sometimes simulated or peer review
        into an automated scientific workflow.
      what_remains_open: Consistency and generality beyond selected ML or applied
        math domains; evaluations often rely on LLM reviewers or small case studies
        rather than external human scientific validation.
    - line: Evaluation environments and experiment-planning benchmarks
      what_it_solves: Provides standardized tasks and automatic metrics for hypothesis
        formation, experiment design, action quality, explanatory knowledge, and ablation
        planning.
      what_remains_open: Proxy metrics may not align with real laboratory utility;
        the best LM systems still underperform humans on targeted ablation planning,
        and strong baselines struggle on many discovery tasks.
    - line: Verification, knowledge retrieval, and failure-memory augmentation
      what_it_solves: Adds internal logical auditing, proactive knowledge retrieval,
        and shared negative knowledge to detect errors, avoid repeated failures, and
        guide later experiments.
      what_remains_open: Evidence is limited to PDE cases, internal research case
        studies, or same-task retries; cross-domain transfer and long-term memory
        value remain underexplored.
    - line: Interactive and reproducible experiment-execution infrastructure
      what_it_solves: Connects local codebases, datasets, checkpoints, dashboards,
        rollback/resume controls, and role customization into runnable experiments
        and research loops.
      what_remains_open: External validation across hardware, datasets, and user settings
        is not demonstrated; some systems have limited repository or artifact signals,
        leaving reproducibility as a verification gap.
    consensus:
    - 'A useful automated research agent must cover more than final text generation:
      it should span experiment design, execution, analysis, and verification or review.'
    - Iterative verification, whether through internal logical checks, simulated review,
      or feedback on figures and results, is treated as necessary for scientific quality.
    - Automated evaluation is widely used but remains proxy-based, relying on LLM
      rubrics, virtual task metrics, or expert preference judgments.
    - Human involvement is not eliminated but repositioned as principal-investigator
      oversight, dashboard-based monitoring, or expert judging, with no standardized
      division of labor.
    - The available evidence concentrates on ML workflows, applied mathematics, and
      text-based simulated discovery tasks; real-world lab experimentation is not
      demonstrated.
    disagreements:
    - 'Evaluation target differs: some work optimizes generated-paper quality and
      acceptance thresholds, while other work scores environment task completion,
      action relevance, explanatory knowledge, or ablation planning recall.'
    - 'Interaction mode differs: some systems run fully autonomously, others use a
      human-principal-investigator and agent-student collaboration, and others emphasize
      interactive monitoring with rollback and resume.'
    - 'Architecture differs: single end-to-end frameworks, progressive tree search
      with an experiment manager, multi-agent role decomposition, and shared failure-memory
      banks each encode different control assumptions.'
    - 'Domain scope differs: some systems target broad ML research workflows, others
      target reasoning-centric applied mathematics, and evaluation environments target
      simulated discovery or AI research case studies.'
    - 'Success criteria differ: acceptance in small workshop or expert-judged case
      studies is not the same as reaching human-level performance on standardized
      tasks, and the packet shows both kinds of evidence.'
    open_questions:
    - Do automated-reviewer acceptance thresholds and curated LLM rubrics predict
      real peer-review acceptance or downstream scientific utility outside the sampled
      domains?
    - Can these systems transfer from ML, applied mathematics, and simulated text-based
      discovery to real laboratory experiment design, execution, and troubleshooting?
    - Why does chain-of-thought prompting outperform agent-based control on ablation
      planning, and what does that imply for agent architecture choices in experiment
      automation?
    - How can reliability be improved when evidence shows only one of three workshop
      submissions passed peer review and targeted planning remains below human level?
    - What external validation designs are needed when limitation, code, dataset,
      and baseline details are blank or missing for several systems in the packet?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究生命周期系统
      解决的问题: 把想法生成、代码实现、实验执行、可视化、论文撰写以及模拟或同行评审串联为自动化科学发现流程。
      尚未覆盖: 在选定ML或应用数学领域之外的一致性和泛化性；评估常依赖LLM评审或小规模案例，而不是外部人类科学验证。
    - 路线: 科学发现评测环境与实验规划基准
      解决的问题: 通过虚拟任务和自动指标，对假设形成、实验设计、动作质量、解释性知识以及消融规划能力进行标准化比较。
      尚未覆盖: 代理指标可能无法对齐真实实验室效用；最佳LM在消融规划上仍低于人类，强基线在大量发现任务上表现不佳。
    - 路线: 验证、知识检索与失败记忆增强
      解决的问题: 加入内部逻辑审计、主动知识检索和共享负知识，以发现错误、避免重复失败并指导后续实验。
      尚未覆盖: 证据主要来自PDE、内部研究案例或同类任务重试；跨领域迁移和长期记忆价值仍未充分验证。
    - 路线: 交互式可复现实验执行基础设施
      解决的问题: 把本地代码库、数据集、检查点、仪表板、回滚/恢复控制和角色定制接入可运行实验与研究循环。
      尚未覆盖: 跨硬件、数据集和用户设置的外部验证未展示；部分系统代码或工件信号有限，复现性仍是验证缺口。
    共识:
    - 有效的自动化研究智能体不能只生成最终文本，还应覆盖实验设计、执行、分析和验证或评审。
    - 迭代验证被普遍视为保证科学质量的关键机制，包括内部逻辑检查、模拟评审和图表/结果反馈。
    - 自动评测被广泛采用，但多为LLM rubric、虚拟任务指标或专家偏好等代理指标。
    - 人类角色没有被完全移除，而是重新定位为PI监督、仪表板监控或专家评判，但尚缺标准分工方式。
    - 现有证据集中在ML工作流、应用数学和文本模拟发现任务，真实实验室实验自动化未被证明。
    分歧:
    - 评测目标不同：有的优化生成论文质量和接受阈值，有的评估环境任务完成、动作相关性、解释性知识或消融规划召回。
    - 交互模式不同：有的完全自主运行，有的采用人类PI与代理协作，有的强调交互式监控、回滚和恢复。
    - 架构不同：端到端单框架、带实验管理器的渐进树搜索、多智能体角色分解和共享失败记忆库承载了不同控制假设。
    - 领域范围不同：有的面向广泛ML研究，有的面向推理密集的应用数学，有的面向模拟发现或AI研究案例。
    - 成功标准不同：工作坊接受或专家偏好案例中的表现，与标准化任务上达到人类水平并非同一类证据。
    开放问题:
    - 自动评审接受阈值和LLM rubric是否预测真实同行评审接受率或采样领域之外的科学效用？
    - 这些系统能否从ML、应用数学和模拟文本发现任务泛化到真实实验室实验设计、执行和故障处理？
    - 为何消融规划中思维链提示优于智能体式方法？这对实验自动化的架构选择意味着什么？
    - 在证据显示三篇工作坊投稿仅一篇通过同行评审、且定向规划仍低于人类水平时，如何提高可靠性？
    - 当多篇论文的局限性、代码、数据集和基线细节为空或缺失时，需要怎样的外部验证设计？
