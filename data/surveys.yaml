  related_work_outline:
  - 'Mainstream direction: building autonomous research agents that generate hypotheses,
    execute experiments, verify results, and self-correct, with representative systems
    such as AI CFD Scientist, AutoResearchClaw, EvoCast, and SAGE.'
  - 'Shared research pattern: closed-loop workflows connect idea generation to executable
    experiments, evidence-grounded verification or failure attribution, and selective
    human oversight.'
  - 'Key differences: verification mechanisms include physics-aware visual gates,
    deterministic source-edit authority, structured debate, and multi-hypothesis failure
    attribution; evaluation spans domain benchmarks, expert judgment, and long-horizon
    ML testbeds.'
  - 'Trend evolution: evidence is concentrated in 2025-2026, within the current frontier;
    systems are moving from surveys and feasibility benchmarks toward reliability,
    self-correction, verifiable reporting, and targeted human-AI collaboration.'
  - 'Open questions: can agents produce research-level insight rather than engineering
    tricks, do verification gates generalize to unseen silent failures, and do benchmark
    gains predict real discovery utility?'
  related_work_outline_zh:
  - 主流方向：构建自主研究智能体，使其生成假设、执行实验、验证结果并自我纠正，例如AI CFD Scientist、AutoResearchClaw、EvoCast和SAGE。
  - 研究共性：闭环研究流程将想法生成连接到可执行实验、基于证据的验证或失败归因，以及选择性人类监督。
  - 关键差异：验证机制包括物理感知视觉门控、确定性源码编辑权威、结构化辩论和多假设失败归因；评测覆盖领域基准、专家评判和长时程机器学习测试床。
  - 趋势演进：证据集中在2025-2026年的当前前沿；系统正从综述和可行性基准走向可靠性、自我纠正、可验证报告和精准人机协作。
  - 开放问题：智能体能否产生研究层面的洞察而非工程技巧，验证门控能否泛化到未见静默失败，基准提升能否预测真实发现效用？
  literature_review:
    line_of_work_matrix:
    - line: Autonomous hypothesis generation with verification-gated execution
      what_it_solves: Turns open-ended hypotheses or research directions into executable
        experiments whose results are checked before acceptance, reducing silent failures
        and unsupported claims.
      what_remains_open: Verification gates still miss some planted failures and are
        validated mainly in narrow domains; generalization to unseen failure modes
        is not established.
    - line: Structured failure attribution and self-correction
      what_it_solves: Converts failed experiments into evidence-grounded causal diagnoses
        routed to hypothesis, design, or implementation fixes, improving metrics-bearing
        artifacts.
      what_remains_open: Fully autonomous scientific writing and conference-ready
        reporting remain unsolved, and evaluation is concentrated on a small benchmark.
    - line: Human-in-the-loop multi-agent research orchestration
      what_it_solves: Coordinates agent roles, workflows, and selective human interventions
        at high-leverage points, with reporting checks against fabricated numbers
        or hallucinated citations.
      what_remains_open: Evidence is limited to small internal case studies and expert
        preference judgments; optimal intervention modes across domains are unresolved.
    - line: Benchmarks and testbeds for AI-driven scientific discovery
      what_it_solves: Provides comparable tasks and baselines for cell annotation,
        biology discovery questions, and improving published ML models across domains.
      what_remains_open: Current gains often reflect ML-engineering tricks rather
        than research insight, and proxy benchmark performance is not yet tied to
        real-world discovery utility.
    - line: Surveys and conceptual organization of agentic AI for science
      what_it_solves: Organizes agent capabilities, domains, evaluation metrics, frameworks,
        and challenges into a broader map for scientific discovery systems.
      what_remains_open: The proposed categories lack direct empirical validation
        that they predict system reliability or discovery outcomes.
    consensus:
    - Autonomous research systems converge on a loop of hypothesis generation, executable
      experiment, verification, and result-grounded reporting.
    - Reliability is treated as a first-class design goal through verification gates,
      deterministic authority separation, or failure attribution rather than raw model
      generation.
    - Selective human collaboration at high-leverage decision points tends to outperform
      both full autonomy and exhaustive step-by-step oversight in reported ablations.
    - Benchmark and expert-judge evaluations are supplementing leaderboard metrics,
      but observed improvements often concentrate in code execution and engineering
      changes.
    disagreements:
    - 'Verification mechanism differs: physics-specific visual inspection, deterministic
      source-edit authority, structured debate, and multi-hypothesis causal diagnosis
      encode trust differently.'
    - 'Interaction mode differs: some systems target full autonomy, others emphasize
      human-in-the-loop checkpoints, and one reports optimal performance with targeted
      rather than exhaustive oversight.'
    - 'Evaluation target differs: single-cell biology discovery, computational fluid
      dynamics, time-series forecasting, and cross-domain ML model improvement impose
      different success criteria.'
    - 'Measurement focus differs: implementation success and token cost, benchmark
      accuracy, expert preference, or metrics-bearing artifact rate are not interchangeable
      evidence.'
    open_questions:
    - Can autonomous research agents distinguish a novel scientific hypothesis from
      an ML-engineering trick, especially on long-horizon improvement tasks?
    - Do verification and validity gates transfer to domains or failure modes not
      represented in the ablation set?
    - Are current AI scientist benchmark improvements predictive of downstream discovery
      utility in real laboratories?
    - What is the minimal and most effective human intervention schedule across research
      workflows beyond small case studies?
    - Can these systems reliably automate literature grounding without hallucinated
      citations or fabricated numerical results?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带有验证门控执行的自主假设生成
      解决的问题: 将开放式假设或研究方向转化为可执行实验，并在接受前检查结果，以减少静默失败和无支持的主张。
      尚未覆盖: 验证门控仍会漏掉部分植入失败，且主要在狭窄领域中验证；对未见失败模式的泛化尚未建立。
    - 路线: 结构化失败归因与自我纠正
      解决的问题: 将失败实验转化为有证据的因果诊断，并路由到假设、设计或实现层面的修复，从而提高含指标产出的比例。
      尚未覆盖: 完全自主的科研写作和可提交论文仍待解决，评测集中在小规模基准。
    - 路线: 人机协作的多智能体研究编排
      解决的问题: 协调智能体角色、工作流和关键节点的人类干预，并检查报告以防止伪造数字和虚假引用。
      尚未覆盖: 证据限于小型内部案例和专家偏好评判；跨领域最优干预模式尚未明确。
    - 路线: 面向AI科学发现的基准与测试床
      解决的问题: 为细胞注释、生物学发现问题和改进已发布的机器学习模型提供可比较的任务和基线。
      尚未覆盖: 当前提升常来自机器学习工程技巧而非研究洞察，基准表现尚未与真实发现效用关联。
    - 路线: 面向科学的智能体AI综述与概念组织
      解决的问题: 将智能体能力、领域、评估指标、框架和挑战组织为更完整的科学发现系统图谱。
      尚未覆盖: 这些分类是否能预测系统可靠性或发现结果仍缺少直接实证验证。
    共识:
    - 自主研究系统在流程上趋于一致：假设生成、可执行实验、验证和基于结果的报告。
    - 可靠性被视为一级设计目标，通过验证门控、确定性权威分离或失败归因实现，而非仅依赖模型生成。
    - 消融证据显示，在高杠杆决策点进行选择性人类协作优于完全自主和逐步监督。
    - 基准和专家评审正在补充排行榜指标，但观察到的改进常集中于代码执行和工程变更。
    分歧:
    - 验证机制不同：面向物理的视觉检查、确定性源码编辑权威、结构化辩论和多假设因果诊断以不同方式编码可信度。
    - 交互模式不同：部分系统追求完全自主，另一些强调人机检查点，且一项证据显示精准监督优于穷尽式监督。
    - 评测目标不同：单细胞生物学发现、计算流体动力学、时间序列预测和跨领域机器学习改进设定了不同成功标准。
    - 测量重点不同：实现成功率与token成本、基准准确率、专家偏好或含指标产出率并非可互换的证据。
    开放问题:
    - 自主研究智能体能否在长时程改进任务中区分新的科学假设与机器学习工程技巧？
    - 验证和有效性门控能否迁移到消融集之外的新领域或未见失败模式？
