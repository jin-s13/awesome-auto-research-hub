  - 'Trend evolution: Within the 2024-2026 packet, visible top papers are concentrated
    in 2026, so the pattern reflects a tight frontier moving toward closed-loop discovery,
    experience/skill reuse, feedback budgeting, and evidence verification.'
  - 'Open questions: Cross-task generalization, held-out transfer robustness, reproducibility,
    and whether proxy research benchmarks reflect real research utility remain unresolved.'
