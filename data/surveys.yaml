  related_work_outline_zh:
  - 主流方向：构建端到端多智能体系统，利用前沿大语言模型自主完成从构思、代码执行、实验、验证到论文撰写的完整科学发现循环。
  - 研究共性：将科学发现过程分解为假设生成、编码、分析、验证与写作等子任务，由专用智能体编排执行，常引入内部评审或验证门控以控制输出质量。
