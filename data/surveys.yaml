  related_work_outline_zh:
  - 主流方向：构建端到端自主科研智能体，覆盖假设提出、代码实验、分析可视化和论文撰写；既有通用系统也有数学、流体等学科专用变体。
  - 研究共性：多采用“生成想法—执行实验—分析结果—撰写论文”闭环，并结合自动评审、验证门控或证据锚定裁判过滤不可靠主张。
