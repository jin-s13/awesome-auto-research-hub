    evaluation approach (benchmark metrics vs. real-world validation); and domain
    specificity (general vs. biology/equation discovery).'
  - 'Trend evolution: From 2025 single-agent cycles and surveys to 2026 multi-agent
    collaboration, human-in-the-loop integration, and evolutionary search; benchmarks
    become harder, and emphasis shifts to verifiability and reliability.'
  - 'Open questions: Evidence preservation, reproducibility, weak-direction rejection,
    cross-domain robustness, ethical safeguards, and scaling of valid discoveries
    beyond tested cycles.'
  related_work_outline_zh:
  - 主流方向：利用LLM、工具和人类反馈，自动化科学发现全循环（假设生成、实验设计和结果分析）的多智能体AI系统。
  - 研究共性：结构化工作流（树、迭代循环）和共享信息状态（世界模型），用于协调文献搜索、数据分析和假设生成。
  - 关键差异：假设生成机制（辩论、进化搜索、结构化世界模型）；人类参与模式（全自主 vs. 精准干预）；评估方式（基准指标 vs. 实际验证）；领域特异性（通用
    vs. 生物学/方程发现）。
  - 趋势演进：从2025年的单智能体循环和综述，到2026年多智能体协作、人在环整合和进化搜索；基准测试难度提升，关注点转向可验证性和可靠性。
  - 开放问题：证据保存、可重复性、弱方向排除、跨领域鲁棒性、伦理保障，以及有效发现在测试周期之外的扩展性。
  literature_review:
    line_of_work_matrix:
    - line: State and representation modeling for coherent discovery
      what_it_solves: Enables long-horizon, traceable hypothesis generation by sharing
        information between data analysis and literature search agents via a structured
        world model, as in Kosmos.
      what_remains_open: Whether the world model representation is sufficient for
        decisions outside the training distribution, and the accuracy ceiling of 79.4%
        leaves 20.6% of statements potentially inaccurate.
    - line: Action-conditioned control and planning for research workflows
      what_it_solves: Automates the research decision loop—hypothesis generation,
        experimental design, and iterative refinement—through multi-agent debate,
        evolutionary-search trees, and self-healing execution (e.g., AutoResearchClaw,
        OR-Agent).
      what_remains_open: How much of the performance gain comes from the workflow
        structure versus the underlying LLM, and how to determine the optimal level
        of human collaboration.
    - line: Evaluation and evidence design
      what_it_solves: Provides benchmarks (e.g., LABBench2) and metrics to compare
        AI scientists' capabilities in hypothesis generation and downstream tasks,
        revealing model performance gaps.
      what_remains_open: Agreement between proxy benchmark metrics and real-world
        scientific utility; coverage of diverse scientific domains beyond biology.
    - line: Systems and reproducible infrastructure
      what_it_solves: Transforms isolated model ideas into runnable artifacts (code,
        datasets, evaluation harnesses) for community use, as with LABBench2's public
        release.
      what_remains_open: Standardized external validation across hardware, datasets,
        and user settings; many systems lack public code or detailed reproducibility
        signals.
    - line: Conceptual taxonomy and theory
      what_it_solves: Organizes the fragmented landscape of AI research automation
        into spectrums (AutoResearch vs. Vibe Research), workflow conditions, and
        evaluation dimensions, identifying critical challenges.
      what_remains_open: Direct empirical validation that the proposed categories
        predict model behavior; evidence that addressing the identified challenges
        (e.g., provenance tracking) improves system performance.
    consensus:
    - LLMs are the core engine for hypothesis generation, but require additional scaffolding
      (workflows, tools, human feedback) to achieve reliable scientific discovery.
    - Structured workflow management (iterative loops, decision trees) is essential
      for orchestrating the information seeking and experimentation needed for hypothesis
      generation.
    - Current systems still cannot guarantee the reliability, reproducibility, or
      ethical safety of autonomously generated hypotheses and experiments.
    - Human-AI collaboration, when applied at key decision points, enhances the quality
      and trustworthiness of the research output compared to full autonomy or exhaustive
      oversight.
    disagreements:
    - 'Hypothesis generation mechanism: Some systems rely on multi-agent debate, others
      on evolutionary search with backtracking, and still others on a shared world
      model for iterative cycles.'
    - 'Human involvement: Approaches range from full autonomy to multiple intervention
      modes, with no consensus on the optimal interface or frequency of human feedback.'
    - 'Evaluation target: Some works evaluate on proxy benchmarks that measure task
      performance, while others demonstrate real-world novel discoveries validated
      by domain experts.'
    - 'Domain specificity: A few systems are designed for a single domain (e.g., biology,
      equation discovery), whereas others claim generality across multiple scientific
      fields.'
    open_questions:
    - How can we automatically verify the novelty and scientific validity of generated
      hypotheses beyond surface-level plausibility?
    - What is the most effective balance between autonomous exploration and human
      guidance, and how does this balance change with domain complexity?
    - Can the observed linear scaling of valid discoveries with cycles hold beyond
      20 cycles, and how do failures compound over longer horizons?
    - Which aspects of multi-agent workflows (debate, evolution, backtracking) contribute
      most to hypothesis quality, and how can these be isolated and improved?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 用于连贯发现的状态与表示建模
      解决的问题: 通过结构化世界模型在数据分析智能体和文献搜索智能体之间共享信息，实现长周期、可追溯的假设生成，如Kosmos所示。
      尚未覆盖: 世界模型表示在训练分布之外是否足以支撑决策；79.4%的准确率上限意味着20.6%的陈述可能不准确。
    - 路线: 研究流程的动作条件控制与规划
      解决的问题: 通过多智能体辩论、进化搜索树和自愈执行（如AutoResearchClaw、OR-Agent），自动化假设生成、实验设计和迭代优化的研究决策循环。
      尚未覆盖: 性能提升有多少来自工作流结构本身而非底层LLM；如何确定最优的人类协作水平。
    - 路线: 评估与证据设计
      解决的问题: 提供基准测试（如LABBench2）和指标，以比较AI科学家在假设生成和下游任务中的能力，揭示模型性能差距。
      尚未覆盖: 代理基准指标与真实科学效用之间的一致性；覆盖生物学以外的多样化科学领域。
    - 路线: 系统与可复现基础设施
      解决的问题: 将孤立的模型想法转化为可运行的工件（代码、数据集、评估工具）供社区使用，如LABBench2的公开版本。
      尚未覆盖: 跨硬件、数据集和用户设置的标准化外部验证；许多系统缺乏公开代码或详细的复现信号。
    - 路线: 概念分类与理论
      解决的问题: 将碎片化的AI研究自动化领域组织为谱系（AutoResearch vs. Vibe Research）、工作流条件和评估维度，识别关键挑战。
      尚未覆盖: 所提出的分类是否能预测模型行为缺少直接实证验证；解决已识别挑战（如来源追踪）是否能提升系统性能的证据。
    共识:
    - LLM是假设生成的核心引擎，但需要额外的基础设施（工作流、工具、人类反馈）才能实现可靠的科学发现。
    - 结构化工作流管理（迭代循环、决策树）对于协调假设生成所需的信息搜索和实验至关重要。
    - 当前系统仍无法保证自主生成的假设和实验的可靠性、可重复性或伦理安全性。
    - 在关键决策点应用人机协作，比完全自主或详尽监督更能提升研究成果的质量和可信度。
    分歧:
    - 假设生成机制：一些系统依赖多智能体辩论，另一些依赖带回溯的进化搜索，还有的依赖共享世界模型进行迭代循环。
    - 人类参与：方法从完全自主到多种干预模式不等，对于人类反馈的最佳接口和频率尚无共识。
    - 评估目标：部分工作在衡量任务性能的代理基准上评估，而其他工作则展示由领域专家验证的真实世界新发现。
    - 领域特异性：少数系统专为单一领域设计（如生物学、方程发现），而其他系统声称可泛化到多个科学领域。
    开放问题:
    - 如何自动验证生成的假设在表面合理性之外的新颖性和科学有效性？
    - 自主探索与人类指导之间最有效的平衡是什么，这种平衡如何随领域复杂性变化？
    - 观察到的有效发现随周期线性扩展（Kosmos）在20个周期后是否仍然成立，失败如何在更长时间跨度内累积？
    - 多智能体工作流的哪些方面（辩论、进化、回溯）对假设质量贡献最大，如何将其隔离并改进？
