  related_work_outline_zh:
  - 主流方向：以端到端自主科学发现智能体为核心，从研究提示生成想法、代码实验、分析到论文写作，代表如 ReasFlow 和 The AI Scientist v2。
  - 研究共性：将实验自动化拆分为提出-执行-分析-报告的迭代循环，并加入验证、检索或记忆机制以在人工检查前捕获错误。
  - 关键差异：完整论文生成系统与聚焦实验规划基准；全自动循环与交互式人工监控平台；内部验证、负失败记忆与基准驱动反馈。
  - 趋势演进：在当前前沿内，2024 年确立全自动科学发现流水线；2025 年出现智能体树搜索和 AblationBench 等基准；2026 年转向多智能体验证与失败感知记忆。
  - 开放问题：超越 LLM 评审的外部效度、跨领域可靠性、可复现标准，以及失败知识在不同实验设置间的迁移性。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agents
      what_it_solves: 'Transforms a high-level research prompt into a full experiment
        cycle: hypothesis or idea generation, code implementation, execution, analysis,
        visualization, manuscript writing, and sometimes simulated peer review.'
      what_remains_open: Reliability across domains and runs is inconsistent; only
        one of three AI Scientist-v2 submissions passed peer review, and ReasFlow
        reports no limitations, leaving failure boundaries unclear.
    - line: Evaluation and targeted experiment-planning benchmarks
      what_it_solves: Measures discovery-agent competence through task completion,
        discovered explanatory knowledge, and planning of ablation experiments, providing
        reproducible gaps against baselines and humans.
      what_remains_open: Proxy metrics and LM-based judges may not align with real
        scientific utility; the best system identifies only 45 percent of original
        ablations, so evaluation validity remains partial.
    - line: Failure-aware memory and iterative correction
      what_it_solves: Converts failed attempts into bounded, typed records in a shared
        memory that downstream agents can explicitly adopt or reject, improving token
        efficiency and enabling cross-task transfer on similar problems.
      what_remains_open: Evidence is limited to ScienceAgentBench and nonlinear PDE
        problems; generalization, curation boundaries, and risk of using stale failure
        records are not yet established.
    - line: Interactive research platforms and experiment infrastructure
      what_it_solves: Provides customizable multi-agent roles, real-time monitoring,
        artifact inspection, rollback/resume control, and a code harness that connects
        local datasets, checkpoints, and runnable experiments back into the research
        loop.
      what_remains_open: Evaluation is limited to five internal AI case studies, so
        external validity across hardware, datasets, and user settings remains unverified.
    consensus:
    - Autonomous experimentation is decomposed into iterative stages such as hypothesis
      generation, implementation, execution, analysis, and reporting.
    - Verification, review, or memory loops are treated as necessary to catch coherent
      but incorrect experimental or logical steps.
    - Current evaluation relies heavily on LLM-based judges, scripted task metrics,
      and simulated peer review.
    - Current systems are not yet consistently reliable at human-level scientific
      work beyond narrow case studies.
    disagreements:
    - Whether the evaluation target should be a complete manuscript or a focused experimental-planning
      decision such as ablation identification.
    - Whether agents should run fully autonomously or through interactive platforms
      with human monitoring, rollback, and resume control.
    - Whether error reduction should come from internal logical verification, failure-aware
      negative memory, or benchmark feedback.
    - Whether success should be assessed by automated peer-review simulation, task-completion
      environments, or recall of human-identified ablations.
    open_questions:
    - How can automated reviewers and task metrics be validated against the downstream
      validity of generated experiments rather than surface similarity to accepted
      papers?
    - Under what conditions do failure-memory records transfer across tasks without
      introducing stale or over-specific constraints?
    - How well do end-to-end discovery agents generalize beyond machine learning and
      applied mathematics case studies to lab-based experiment automation?
    - What external reproducibility standards are needed when code, datasets, baselines,
      and limitation reporting are incomplete or unavailable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现智能体
      解决的问题: 将高层研究提示转化为完整实验循环：假设或想法生成、代码实现、执行、分析、可视化、论文撰写，有时还包括模拟同行评审。
      尚未覆盖: 跨领域与多次运行的可靠性不一致；AI Scientist-v2 三篇提交仅一篇通过同行评审，ReasFlow 未报告局限性，失败边界仍不清晰。
    - 路线: 面向发现过程的基准与消融规划评测
      解决的问题: 通过任务完成度、可解释知识发现和消融实验规划来度量发现智能体能力，并提供相对基线和人类的可复现差距。
      尚未覆盖: 代理指标和 LLM 评审可能不与真实科学效用一致；最佳系统仅识别 45% 的原始消融，评测效度仍不完整。
    - 路线: 失败感知记忆与迭代纠错
      解决的问题: 将失败尝试转化为有界、类型化的共享记忆记录，由下游智能体明确采纳或拒绝，以提升 token 效率并实现相似问题上的跨任务改进。
      尚未覆盖: 证据仅限于 ScienceAgentBench 和非线性 PDE 问题；泛化性、记录管理边界与使用陈旧失败记录的风险尚未确立。
    - 路线: 交互式研究平台与实验基础设施
      解决的问题: 提供可定制多智能体角色、实时监控、工件检查、回滚/恢复控制，以及连接本地数据集、检查点和可运行实验的代码工具。
      尚未覆盖: 评测仅限五个内部 AI 案例，跨硬件、数据集和用户设置的外部效度仍未验证。
    共识:
    - 自主实验被分解为假设生成、实现、执行、分析和报告等迭代阶段。
    - 验证、评审或记忆循环被视为捕获连贯但错误的实验或逻辑步骤的关键机制。
    - 当前评测高度依赖 LLM 评审、脚本化任务指标和模拟同行评审。
    - 当前系统尚不能在狭窄案例之外稳定达到人类水平的科学可靠性。
    分歧:
    - 评测目标应是完整论文，还是聚焦消融识别等实验规划决策。
    - 智能体应全自动运行，还是通过具有人工监控、回滚和恢复控制的交互式平台运行。
    - 误差减少应来自内部逻辑验证、失败感知负记忆，还是基准反馈。
    - 成功应由模拟同行评审、任务完成环境，还是对人类识别消融的召回来衡量。
    开放问题:
    - 如何验证自动评审和任务指标能反映生成实验的下游有效性，而不仅是与已接受论文的表面相似性？
    - 失败记忆记录在何种条件下可跨任务迁移，而不引入过时或过度特定的约束？
    - 端到端发现智能体能否从机器学习和应用数学案例推广到实验室实验自动化？
    - 当代码、数据集、基线和局限性报告不完整或缺失时，应采用什么外部可复现标准？
