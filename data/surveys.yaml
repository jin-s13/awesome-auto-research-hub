  related_work_outline_zh:
  - 主流方向：构建端到端的自主实验设计、执行和分析代理，通常以生成论文为产出，如AI Scientist-v2和ReasFlow所代表。
  - 研究共性：所有系统均依赖LLM进行实验规划、调用代码执行，并基于结果迭代优化，辅以验证循环或外部记忆。
  - 关键差异：全流程自动化（如AI Scientist-v2）与聚焦实验规划（如AblationBench）；多智能体协作（ReasFlow、Claw AI Lab）与单代理迭代；理论学科与实证ML领域；以论文接受为评估目标与以任务完成度为指标。
  - 趋势演进：从2024年的概念验证框架（AI Scientist、DISCOVERYWORLD）到2025年工作坊级同行评审和消融基准，再到2026年多智能体与失败感知记忆系统，显示出从单一脚本向结构化、记忆增强工作流的转变。
  - 开放问题：这些代理能否从模拟环境迁移到真实实验室？如何构建跨科学领域泛化的长期记忆？哪些指标能可靠地反映真正的科学贡献？
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery pipelines
      what_it_solves: Automating the complete scientific workflow from hypothesis
        generation and code implementation to experiment execution, paper writing,
        and simulated review, minimizing human intervention.
      what_remains_open: Reliability across many runs; only one of three AI Scientist-v2
        papers passed peer review. Evaluation is largely internal or simulated, with
        no evidence of reproducibility in real-world lab settings or across diverse
        hardware.
    - line: Experiment planning and ablation design
      what_it_solves: Formalizing the sub-problem of planning which ablations to run,
        and evaluating an agent's ability to identify missing or necessary experiments
        from a method description or full paper.
      what_remains_open: Current LMs achieve only 45% recall on ablation identification,
        far below human level. Performance is inconsistent between author and reviewer
        tasks, suggesting grounding gaps that limit practical deployment.
    - line: Failure-aware memory for iterative experimentation
      what_it_solves: Capturing failed attempts as structured negative knowledge in
        a shared memory bank, enabling downstream research agents to avoid repeating
        errors and to solve novel tasks more efficiently.
      what_remains_open: Demonstrated on PDE tasks within the same domain; transferability
        to fundamentally different scientific fields (e.g., biology, chemistry) is
        not yet shown. The representation of failure is bounded and may miss complex
        causal chains.
    - line: Evaluation environments for scientific discovery agents
      what_it_solves: Providing standardized virtual environments with diverse tasks
        and automatic metrics to benchmark an agent's complete discovery cycle, including
        hypothesis formation, experimentation, and conclusion drawing.
      what_remains_open: The gap between text-based simulated environments and physical
        lab constraints remains unaddressed. Automatic metrics like task completion
        and explanatory knowledge may not capture the novelty or significance of real
        discoveries.
    consensus:
    - LLM-based agents can now perform non-trivial scientific experiments autonomously,
      covering code writing, execution, and result analysis, but they remain brittle
      and fall short of human-level reliability.
    - Current evaluation relies heavily on automated metrics or simulated reviewers,
      with limited external validation; the community lacks a shared, rigorous benchmark
      for scientific discovery.
    - Iterative refinement through verification loops or memory improves performance,
      yet the mechanisms are still simplistic and do not model the depth of human
      scientific reasoning.
    disagreements:
    - 'Scope of automation: Some systems target full paper generation as the end goal,
      while others focus narrowly on experiment planning or ablation design, implying
      different assumptions about human-in-the-loop roles.'
    - 'Interaction paradigm: Multi-agent systems with role specialization (ReasFlow,
      Claw AI Lab) compete with single-agent iterative approaches (AI Scientist),
      with no clear evidence yet on which yields more robust discoveries.'
    - 'Domain emphasis: ReasFlow targets theory-heavy applied mathematics, whereas
      AI Scientist and AblationBench focus on empirical machine learning, leading
      to different requirements for verification (logical proofs vs. empirical metrics).'
    - 'Evaluation target: Papers are judged by simulated reviewer scores or workshop
      acceptance, while DISCOVERYWORLD uses task completion and explanatory knowledge,
      making cross-system comparisons difficult.'
    open_questions:
    - How can failure memory and verification loops be extended to capture causal
      explanations of errors, rather than just recording failed attempts?
    - What is the minimal set of evaluation standards that can bridge simulated environments
      and real-world lab experiments, ensuring that an agent that performs well in
      a virtual environment can also operate physical instruments?
    - Why do current LMs show inverse performance on author vs. reviewer ablation
      tasks, and what does this reveal about the underlying representation of experimental
      design in these models?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现流水线
      解决的问题: 自动化从假设生成、代码实现到实验执行、论文撰写和模拟评审的完整科学工作流，减少人工干预。
      尚未覆盖: 多次运行的可靠性不足，如AI Scientist-v2三篇论文仅一篇通过评审。评估多限于内部或模拟环境，缺乏真实实验室或跨硬件的可复现性证据。
    - 路线: 实验规划与消融设计
      解决的问题: 将规划消融实验这一子任务形式化，并评估代理从方法描述或完整论文中识别缺失或必要实验的能力。
      尚未覆盖: 当前LM在消融识别上仅达到45%召回率，远低于人类水平。作者任务与审稿人任务性能不一致，表明存在基础差异，限制了实际部署。
    - 路线: 面向迭代实验的失败感知记忆
      解决的问题: 将失败尝试转化为结构化负知识存入共享记忆库，使下游研究代理能避免重复错误并更高效地解决新任务。
      尚未覆盖: 仅在PDE任务上验证，尚未展示向完全不同的科学领域（如生物、化学）的迁移能力。失败的表示是有限的，可能遗漏复杂的因果链。
    - 路线: 科学发现代理的评估环境
      解决的问题: 提供具有多样化任务和自动指标的标准化虚拟环境，以基准测试代理在假设形成、实验和得出结论等完整发现周期中的表现。
      尚未覆盖: 基于文本的模拟环境与物理实验室限制之间的差距尚未解决。任务完成度和解释性知识等自动指标可能无法捕捉真实发现的新颖性或重要性。
    共识:
    - 基于LLM的代理已能自主执行非平凡的科学实验，涵盖代码编写、执行和结果分析，但仍脆弱，远未达到人类水平的可靠性。
    - 当前评估严重依赖自动指标或模拟评审，外部验证有限；社区缺乏一个共享的、严格的科学发现基准。
    - 通过验证循环或记忆进行迭代改进可提升性能，但这些机制仍较简单，未能模拟人类科学推理的深度。
    分歧:
    - 自动化范围：部分系统以生成完整论文为最终目标，而另一些专注于实验规划或消融设计，暗含对人在回路中角色的不同假设。
    - 交互范式：具有角色专业化的多智能体系统（ReasFlow、Claw AI Lab）与单代理迭代方法（AI Scientist）并存，尚无明确证据表明哪种能产生更稳健的发现。
    - 领域侧重：ReasFlow瞄准理论性强的应用数学，而AI Scientist和AblationBench聚焦实证机器学习，导致验证需求不同（逻辑证明 vs.
      实证指标）。
    - 评估目标：论文以模拟评审分数或工作坊接受为评判标准，而DISCOVERYWORLD使用任务完成度和解释性知识，使得跨系统比较困难。
    开放问题:
    - 如何将失败记忆和验证循环扩展到能捕捉错误的因果解释，而不仅仅是记录失败尝试？
    - 什么是最小化评估标准，能够弥合模拟环境与真实实验室实验，确保证实虚拟环境中表现良好的代理也能操作物理仪器？
    - 为什么当前LM在作者与审稿人消融任务上表现出相反性能，这揭示了这些模型在实验设计表示方面的哪些深层问题？
