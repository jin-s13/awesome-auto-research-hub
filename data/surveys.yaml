  related_work_outline_zh:
  - 主流方向：构建能够自主生成假设、设计和执行实验、并从失败中迭代改进的AI研究智能体，且越来越重视领域特定的验证和人机协作。
  - 研究共性：以LLM为骨干的多智能体架构、自愈执行循环，以及将实验失败转化为改进尝试的结构化失败分析。
  - 关键差异：验证机制（物理仿真门控 vs. 形式化证明 vs. 可验证结果报告）、自主程度（完全自主 vs. 精准人类干预）和领域特异性（流体动力学、生物学、因果推断、AI研究本身）。
  - 趋势演进：2025–2026年间，前沿从通用AI科学家流水线转向具有领域验证的自演化框架，并出现了带有人类基线的基准（如BAISBench、ARC-Bench），使自主研究系统的对比评估成为可能。
  - 开放问题：如何保证在狭窄验证循环之外所生成假设的可靠性，如何弥合形式化或仿真正确性与真实世界科学真理之间的差距，以及如何设计最优的人机协作模式以最大化发现而不增加人类监督者负担。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automates the full scientific cycle—from literature-grounded
        ideation and experiment design to execution, result analysis, and manuscript
        writing—reducing the human labor bottleneck in iterative discovery.
      what_remains_open: Generalization across scientific domains with vastly different
        experimental realities; the systems often degrade when the target domain requires
        tacit knowledge or long-horizon planning not captured in training corpora.
    - line: Self-correcting and evolving agent architectures
      what_it_solves: Enables agents to diagnose root causes of experiment failures
        and improve their own behavior over successive runs, thereby increasing the
        fraction of runs that produce meaningful, metric-bearing results.
      what_remains_open: Whether the causal attribution of failure is accurate enough
        to avoid reinforcing spurious correlations; the long-term stability and alignment
        of self-evolving policies under open-ended exploration are untested.
    - line: Domain-specific verification and formal grounding
      what_it_solves: Provides gatekeeping mechanisms—such as vision-language physics
        checks or machine-checked proofs—that catch silent errors and increase the
        credibility of autonomously generated claims.
      what_remains_open: Incomplete detection (e.g., missed physical failures) and
        the semantic gap between formalized theorems and their intended scientific
        meaning; verification is only as strong as the model of the domain it encodes.
    - line: Benchmarks and human-baseline evaluation
      what_it_solves: Creates standardized tasks, metrics, and human performance baselines
        that allow objective comparison of AI scientist systems and reveal where they
        fall short of expert human reasoning.
      what_remains_open: Benchmarks cover limited domains and question types; the
        relationship between benchmark scores and real-world scientific impact remains
        unvalidated, and human baselines are often small and narrow.
    - line: Human–AI collaboration modes
      what_it_solves: Introduces flexible intervention points—from full oversight
        to high-leverage decision checks—so that human judgment can steer or rescue
        the autonomous process when it goes off track.
      what_remains_open: The optimal timing and granularity of human interventions
        are unknown; poorly designed collaboration can introduce bottlenecks or cognitive
        overload without proportional gains in discovery quality.
    consensus:
    - Multi-agent architectures decomposing research into subtasks (ideation, execution,
      verification, reporting) are the dominant design pattern.
    - LLM-based agents require structured execution and verification loops, not just
      free-form generation, to produce defensible scientific results.
    - Failures in autonomous experiments are common and must be treated as information
      sources; reflection and iterative correction are essential components.
    - Domain-agnostic frameworks can be built, but high-quality scientific output
      in a specific domain demands some form of domain-calibrated validity gate.
    disagreements:
    - 'Verification strategy: physics-based visual inspection vs. formal proof vs.
      constrained output reporting—each trades off generality, rigor, and domain coverage
      differently.'
    - 'Role of human oversight: one camp argues for targeted human intervention at
      critical decision points, while another pushes toward full autonomy with self-healing
      as the only fallback.'
    - 'Evaluation scope: some works rely on custom case studies or internal benchmarks,
      whereas others build standardized benchmarks with human baselines, making cross-system
      comparisons difficult.'
    - 'Generality vs. depth: some systems aim for a single domain-agnostic evolving
      agent, while others accept domain-specific engineering (e.g., a CFD solver harness)
      as necessary for credible results.'
    open_questions:
    - How can we systematically verify that an autonomously generated hypothesis is
      not only internally consistent but also scientifically interesting or novel,
      given the absence of a ground-truth oracle?
    - What are the failure modes of self-evolving agents over multi-cycle experiments,
      and can they inadvertently drift toward uninterpretable yet superficially high-scoring
      solutions?
    - Under what conditions does human intervention add the most value, and can we
      design collaboration protocols that reduce human cognitive load while maintaining
      or improving research quality?
    - How can we move beyond narrow domain benchmarks to evaluate the broader scientific
      reasoning and knowledge integration capabilities of AI scientists?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流水线
      解决的问题: 自动完成从基于文献的构思、实验设计到执行、结果分析和论文撰写的完整科学循环，减少迭代发现中的人类劳动瓶颈。
      尚未覆盖: 在实验现实差异巨大的科学领域间的泛化；当目标领域需要训练语料未涵盖的隐性知识或长远规划时，系统性能往往下降。
    - 路线: 自我修正与演化智能体架构
      解决的问题: 使智能体能够诊断实验失败的根本原因，并在连续运行中改进自身行为，从而提高产生有意义、带指标结果的运行比例。
      尚未覆盖: 失败归因的因果准确性是否足以避免强化虚假关联；开放式探索下自演化策略的长期稳定性和目标对齐尚未测试。
    - 路线: 领域特定验证与形式化基础
      解决的问题: 提供把关机制，例如视觉-语言物理检查或机器验证证明，以捕获静默错误并提高自主生成声明的可信度。
      尚未覆盖: 不完全检测（如遗漏物理失败）以及形式化定理与其预期科学意义之间的语义鸿沟；验证强度仅取决于其编码的领域模型。
    - 路线: 基准与人类基线评估
      解决的问题: 创建标准化任务、指标和人类表现基线，使AI科学家系统能够客观比较，并揭示其与专家人类推理之间的差距。
      尚未覆盖: 基准覆盖的领域和问题类型有限；基准得分与真实世界科学影响之间的关系尚未验证，且人类基线通常规模小且范围窄。
    - 路线: 人机协作模式
      解决的问题: 引入灵活的干预点——从全面监督到高杠杆决策检查——使人类判断能够在自主过程偏离时引导或挽救它。
      尚未覆盖: 人类干预的最佳时机和粒度未知；设计不当的协作可能引入瓶颈或认知超载，而发现质量提升不成比例。
    共识:
    - 将研究分解为子任务（构思、执行、验证、报告）的多智能体架构是主流设计模式。
    - 基于LLM的智能体需要结构化的执行和验证循环，而非仅自由生成，以产生可辩护的科学结果。
    - 自主实验中的失败很常见，必须被视为信息源；反思和迭代修正是必不可少的组成部分。
    - 可以构建领域无关框架，但特定领域的高质量科学产出需要某种形式的领域校准有效性门控。
    分歧:
    - 验证策略：基于物理的视觉检查 vs. 形式化证明 vs. 受限输出报告——三者在通用性、严谨性和领域覆盖上各有取舍。
    - 人类监督的角色：一派主张在关键决策点进行精准的人类干预，另一派则推动完全自主，仅以自愈作为后备。
