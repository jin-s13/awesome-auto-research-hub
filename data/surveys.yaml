  - 趋势演进：从2024年通用框架和发现环境，到2025年树搜索与工作坊同行评审，再到2026年领域专用验证和证据锚定评测；当前证据主要反映前沿阶段而非长期历史趋势。
  - 开放问题：自动评审与真实科学有效性是否一致，智能体能否跨基座模型和领域泛化，以及如何改进仍会漏报或无法区分智能体的验证门控。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end agentic discovery systems
      what_it_solves: Integrating research ideation, code or experiment execution,
        analysis, and manuscript generation into a runnable agent loop.
      what_remains_open: Reliability across domains and runs; general systems can
        produce publication-like papers, but acceptance is inconsistent and evidence
        of genuine discovery remains limited.
    - line: Domain-specific verification and grounded execution
      what_it_solves: Detecting invalid claims in mathematical or physical workflows
        by adding logical checks, knowledge retrieval, physics-aware vision gates,
        or solver-level compilation.
      what_remains_open: Verification gates still miss planted failures; evidence
        is limited to specific solvers or domains, and external validity is not standardized.
    - line: Evaluation and evidence design
      what_it_solves: Making discovery-agent claims comparable through task suites,
        blinded peer-derived problems, or rubric-based evidence-maturity scoring.
      what_remains_open: Agents can plateau near each other without statistical separation;
        current metrics may not capture controls, robustness, falsifiability, or cross-dataset
        generalization.
    - line: Reproducible discovery infrastructure and artifacts
      what_it_solves: Providing runnable stacks, open-source agents, or environment
        interfaces so discovery workflows can be inspected and repeated.
      what_remains_open: Missing code, dataset, baseline, metric, or limitation details
        remain verification gaps; standardized external validation across hardware
        and user settings is absent.
    consensus:
    - 'Autonomous discovery systems share a common loop: generate a hypothesis or
      task, execute experiments or derivations, analyze outputs, and produce a written
      artifact.'
    - Verification and evaluation are treated as necessary, whether through automated
      reviewers, logic checks, physics-aware gates, or rubric-based judges.
    - 'Current evidence distinguishes execution and documentation competence from
      scientific judgment: agents can run analyses and write papers, but often lack
      controls, robustness, falsifiability, or statistical separation.'
    - Publication-style output and task completion are used as proxy signals, but
      the packet does not establish that these proxies equal real scientific validity.
    disagreements:
    - 'Evaluation target differs: some systems optimize peer-review acceptance or
      paper scores, while benchmark work evaluates task completion or evidence maturity
      rather than manuscript quality.'
    - 'Deployment setting differs: evidence includes virtual text-based discovery
      environments, open-source CFD solver workflows, and applied-mathematics paper-generation
      workflows, each with different failure modes.'
    - 'Interaction mode differs: some pipelines operate fully autonomously, while
      an applied-mathematics system adopts a principal investigator and graduate student
      collaboration; the level of human intervention varies.'
    - 'Verification mechanism differs: some systems validate through an internal logical
      loop, others through a post-artifact automated reviewer, and others through
      a physics-aware vision-language gate during execution.'
    open_questions:
    - Do automated reviewers or LLM judges align with human scientific judgment and
      actual discovery utility when current agents still lack controls, robustness,
      and falsifiability?
    - Can agentic discovery generalize across base models and scientific domains when
      benchmark results are reported on only one frozen base model and domain-specific
      systems are tested in narrow settings?
    - Why do multiple coding agents plateau around similar evidence-maturity scores
      with no statistically reliable pairwise separation, and what metric would discriminate
      stronger scientific reasoning?
    - How should verification gates be improved or externally validated when a physics-aware
      gate still missed 2 of 16 planted failures and several limitation fields are
      empty?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端智能体发现系统
      解决的问题: 将研究构思、代码或实验执行、分析和论文生成整合为可运行的智能体循环。
      尚未覆盖: 跨领域和多次运行的可靠性；通用系统能产出类似论文，但接受率不稳定，真实发现证据有限。
    - 路线: 领域专用验证与受控执行
      解决的问题: 通过逻辑检查、知识检索、物理感知视觉门控或求解器级编译，检测数学或物理工作流中的不可靠主张。
      尚未覆盖: 验证门控仍会漏报人为植入的失败；证据局限于特定求解器或领域，外部有效性尚未标准化。
    - 路线: 评测与证据设计
      解决的问题: 通过任务套件、盲态同行评议问题或基于评分表的证据成熟度评估，使发现类智能体的主张可比较。
      尚未覆盖: 多个智能体得分接近且缺乏统计区分；现有指标未必能体现对照、稳健性、可证伪性或跨数据集泛化。
    - 路线: 可复现发现基础设施与工件
      解决的问题: 提供可运行栈、开源智能体或环境接口，使发现工作流可检查、可重复。
      尚未覆盖: 缺失代码、数据集、基线、指标或局限性说明仍是验证缺口；跨硬件和用户设置的标准化外部验证不足。
    共识:
    - 自主发现系统共享同一循环：提出假设或任务，执行实验或推导，分析结果，并生成书面产出。
    - 验证与评测被视为必要环节，形式包括自动评审、逻辑检查、物理感知门控或评分表裁判。
    - 现有证据区分执行与文档能力及科学判断：智能体能运行分析和写论文，但常缺乏对照、稳健性、可证伪性或统计区分。
    - 论文式产出和任务完成被用作代理信号，但证据包没有证明这些代理信号等同于真实科学有效性。
    分歧:
    - 评测目标不同：部分系统优化同行评审接受或论文分数，而基准工作评估任务完成或证据成熟度，而非手稿质量。
    - 部署场景不同：证据涵盖虚拟文本发现环境、开源 CFD 求解器工作流和应用数学论文生成工作流，失败模式不同。
    - 交互方式不同：一些流程完全自主，而应用数学系统采用首席研究员和研究生式的人机协作，人类介入程度不同。
    - 验证机制不同：有的在内部逻辑循环中验证，有的在产出后由自动评审验证，有的在执行过程中采用物理感知视觉语言门控。
    开放问题:
    - 自动评审或 LLM 裁判是否与人类科学判断和真实发现效用一致，而当前智能体仍缺乏对照、稳健性和可证伪性？
    - 智能体发现能否跨基座模型和科学领域泛化，而目前基准结果只基于一个冻结基座模型，领域系统只在狭窄场景中测试？
    - 为什么多个编码智能体在证据成熟度得分上接近且无统计上可靠的成对差异，什么指标能区分更强的科学推理？
    - 当物理感知门控仍漏报 16 个植入失败中的 2 个，且若干局限性字段为空时，应如何改进或外部验证验证门控？
