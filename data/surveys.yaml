  related_work_outline:
  - 'Mainstream direction: Autonomous multi-agent research systems that generate hypotheses
    and research ideas, then connect them to executable experiments, verification,
    self-correction, or human collaboration.'
  - 'Shared research pattern: Idea generation is bound to code execution, evidence
    checks, and grounded reporting rather than free-form language generation.'
  - 'Key differences: Verification approaches differ, including visual physics gates,
    multi-hypothesis failure attribution, deterministic program authority, and grounded
    reporting; interaction modes range from full autonomy to targeted human guidance;
    evaluation targets range from domain-specific discovery tasks to general research
    benchmarks.'
  - 'Trend evolution: The available evidence concentrates in 2025-2026, moving from
    surveys and benchmarks toward verifiable, self-evolving, and domain-specific AI
    scientist systems within the current frontier.'
  - 'Open questions: Generalization of verification gates, optimal human-AI collaboration
    points, the gap between proxy benchmarks and real discovery utility, and fully
    autonomous scientific writing remain unresolved.'
  related_work_outline_zh:
  - 主流方向：自主多智能体研究系统生成假设和研究方向，并通过执行、验证、自纠正或人机协作形成证据闭环。
  - 研究共性：将想法与代码执行、证据检查和有事实依据的报告绑定，而不是停留在自由文本生成。
  - 关键差异：验证方式从视觉物理门控、多假设失败归因到确定性程序权威不同；交互模式从完全自主到关键节点人工介入不同；评测目标覆盖领域任务与通用基准。
  - 趋势演进：证据集中在2025-2026年，当前前沿正从综述与基准测试走向可验证、自演化和领域专用AI科学家。
  - 开放问题：验证门控泛化性、最佳人机协作模式、代理基准与真实发现效用的一致性、以及完全自主科学写作仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous research-pipeline systems
      what_it_solves: Generate hypotheses, run experiments, and report results through
        multi-agent, self-reinforcing, or self-evolving research workflows.
      what_remains_open: Whether reported gains come from the workflow itself, the
        underlying model, or task-specific execution harnesses; generalization beyond
        curated case studies is uncertain.
    - line: Verification, failure attribution, and self-correction
      what_it_solves: Turn invalid or failed experiment trajectories into diagnostic
        evidence and route corrections to hypothesis, experimental design, or implementation
        levels.
      what_remains_open: Verification gates can miss failure modes, and attribution
        coverage across hidden or domain-specific silent failures remains incompletely
        validated.
    - line: Domain-specific AI scientist deployment
      what_it_solves: Embed ideation into disciplinary tooling and data- or physics-grounded
        validation for concrete discovery tasks such as computational fluid dynamics,
        omics analysis, or forecasting.
      what_remains_open: Demonstrations are narrow in domain and dataset coverage;
        open-ended discovery and direct parity with domain experts remain unresolved.
    - line: Benchmarks and human-baseline evaluation
      what_it_solves: Make AI research agent ideation and experimental outputs comparable
        through tasks, metrics, expert judgments, and human performance references.
      what_remains_open: Evaluation coverage is limited by topic count, internal case
        studies, and proxy metrics; standardized external validation across systems
        is lacking.
    - line: Survey and conceptual framing
      what_it_solves: Organize agentic scientific discovery into capabilities, metrics,
        frameworks, and challenges across scientific domains.
      what_remains_open: The categories are mostly descriptive rather than predictive,
        and reliability and ethical concerns are catalogued but not empirically resolved.
    consensus:
    - Hypothesis generation must be coupled with execution and evidence; language
      generation alone is insufficient for scientific research claims.
    - Verification, grounded reporting, or validity gating improves trustworthiness
      and metric-bearing outputs in autonomous research workflows.
    - Human collaboration at high-leverage decision points can outperform both fully
      autonomous operation and exhaustive step-by-step oversight.
    - Current systems support data-driven research but do not yet achieve fully autonomous
      scientific discovery or reliable conference-ready writing.
    - Evaluation benchmarks and baselines are recognized as necessary, but existing
      evaluation remains early and limited in coverage.
    disagreements:
    - 'Verification strategy differs: some systems use vision-language physics inspection,
      others use causal multi-hypothesis failure attribution, deterministic program
      authority, or constrained grounded reporting.'
    - 'Interaction mode differs: some systems push toward self-evolution and autonomy,
      while others emphasize targeted human collaboration or rollback and monitoring
      control.'
    - 'Evaluation target differs: some compare on domain-specific task performance
      such as flow-field error or forecasting accuracy, while others rely on AI-expert
      judgments or broad benchmark scores.'
    - 'Domain generality differs: some systems are domain-agnostic frameworks intended
      to be adapted in few lines of code, while others depend on domain-specific solvers,
      datasets, and verification rules.'
    open_questions:
    - How well do verification and self-correction mechanisms generalize beyond planted
      failures and the specific domains tested?
    - Which human intervention modes, at which decision points, most improve research
      quality across different scientific workflows?
    - Do current benchmark scores and expert-preference judgments predict real scientific
      discovery utility or downstream deployment value?
    - Can autonomous systems close the gap between producing metrics-bearing artifacts
      and producing fully defensible conference-ready papers?
    - Are performance improvements attributable to the research workflow, the underlying
      model, the execution harness, or domain-specific validation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主研究流水线系统
      解决的问题: 通过多智能体、自强化或自演化流程生成假设、运行实验并报告结果。
      尚未覆盖: 报告的性能提升究竟来自流程、基座模型还是任务专用执行脚手架，尚不明确；在精选案例之外的泛化性也不确定。
    - 路线: 验证、失败归因与自纠正
      解决的问题: 把失败或无效的实验轨迹转化为诊断证据，并将纠正路由到假设、实验设计或实现层面。
      尚未覆盖: 验证门控仍可能漏检失败模式，归因机制对隐藏错误和跨领域静默失败的覆盖尚未充分验证。
    - 路线: 领域专用AI科学家部署
      解决的问题: 将想法生成嵌入领域工具与基于数据或物理的验证中，用于计算流体动力学、组学分析或预测等具体发现任务。
      尚未覆盖: 验证范围限于少量领域和数据集；开放式发现以及与领域专家的直接对标仍未解决。
    - 路线: 基准与人类基线评测
      解决的问题: 通过任务、指标、专家判断和人类性能参考，使AI研究智能体的想法与实验输出具有可比性。
      尚未覆盖: 评测覆盖受主题数量、内部案例和代理指标限制；跨系统的标准化外部验证不足。
    - 路线: 综述与概念框架
      解决的问题: 将智能体科学发现按能力、指标、框架和挑战进行组织，覆盖多个科学领域。
      尚未覆盖: 这些分类多为描述性而非预测性；可靠性与伦理问题已被列出，但尚未得到实证解决。
    共识:
    - 假设生成必须与执行和证据结合，仅靠语言生成不足以支撑科学研究主张。
    - 验证、有依据的报告或有效性门控能提升自主研究流程的可信度和带指标输出比例。
    - 在高杠杆决策点进行人工协作，可能优于完全自主和逐步全面监督。
    - 当前系统能支持数据驱动研究，但尚未实现完全自主的科学发现或可靠的会议级写作。
    - 基准与基线评测被认为是必要的，但现有评测仍处于早期且覆盖有限。
    分歧:
    - 验证策略不同：视觉-语言物理检查、多假设因果失败归因、确定性程序权威和受约束的有依据报告各有侧重。
    - 交互模式不同：部分系统强调自演化和自主性，另一些则强调关键节点人工协作或回滚与监控控制。
    - 评测目标不同：有的以流场误差或预测精度等任务性能为主，有的依赖AI专家判断或宽泛基准分数。
    - 领域通用性不同：有的系统主张以少量代码适配任意学科，另一些则强依赖领域专用求解器、数据集和验证规则。
    开放问题:
    - 验证与自纠正机制在植入故障和已测领域之外能泛化到何种程度？
    - 哪种人工介入模式以及哪个决策点最适合不同科学研究流程？
    - 当前基准分数和专家偏好判断能否预测真实的科学发现效用或下游部署价值？
