  related_work_outline_zh:
  - 主流方向：证据集中在基于大语言模型的智能体系统，自动化实验设计、代码执行、结果分析和论文生成，代表性系统如 The AI Scientist-v2 和 ReasFlow。
  - 研究共性：工作普遍结合规划、执行、评估与迭代修正，采用多智能体角色、代码工具、模拟评审或机器裁判，以及记忆或验证循环来改进自动研究输出。
  - 关键差异：工作范围不同，从端到端论文生成到消融规划等子技能基准评测；交互模式不同，从完全自主到人在环中；领域涉及机器学习、应用数学、虚拟科学任务和偏微分方程问题。
  - 趋势演进：从2024年的端到端发现框架，到2025年的基准与智能体升级，再到2026年的多智能体平台、失败感知记忆和验证机制，研究正转向更专门的质量控制、人类监督和更广泛的实验循环评测。
  - 开放问题：外部同行评审、跨领域鲁棒性、机器裁判效度、可复现工件，以及自动化实验系统是否改善真实科学决策而非仅改善生成产物，仍缺少证据。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous experiment and manuscript generation
      what_it_solves: Covers ideation, code writing, experiment execution, visualization,
        and paper writing as one integrated research loop.
      what_remains_open: Reliability and external validity are still uncertain; many
        claims rely on machine-judge review or workshop-level acceptance rather than
        broad human calibration across domains.
    - line: Evaluation environments and benchmarks for experiment planning
      what_it_solves: Creates reusable tasks and metrics for hypothesis formation,
        experiment design, ablation planning, and complete discovery cycles.
      what_remains_open: Coverage is limited to selected topics and benchmarks, and
        available proxy metrics are not yet linked to long-run scientific impact or
        real decision utility.
    - line: Failure-aware memory and negative knowledge
      what_it_solves: Converts failed attempts into bounded, retrievable constraints
        so downstream agents can avoid repeated mistakes under token and compute limits.
      what_remains_open: Demonstrated mainly on same-task retries and PDE case studies;
        whether negative knowledge transfers across research workflows and domains
        remains unclear.
    - line: Multi-agent orchestration and verification/knowledge retrieval
      what_it_solves: Coordinates specialist roles, internal logical checks, knowledge
        retrieval, and human-in-the-loop monitoring to reduce expert intervention.
      what_remains_open: Verification is often self-referential or machine-judged,
        and robustness outside selected machine learning, math, and virtual science
        demonstrations is not established.
    - line: Human-in-the-loop interactive research platforms
      what_it_solves: Provides dashboards, role customization, artifact inspection,
        rollback/resume control, and code harnesses that connect local experiments
        back into the research loop.
      what_remains_open: Evidence comes from small internal case studies, leaving
        external validation, task generalization, and safe oversight boundaries unresolved.
    consensus:
    - The field converges on decomposing experiment automation into ideation, execution,
      analysis, and reporting loops orchestrated by large-language-model agents.
    - There is broad reliance on machine-judge evaluation, simulated review, or automated
      expert preference to score generated papers and experiment plans, creating both
      scalable assessment and shared validity risk.
    - Papers agree that autonomous systems still need some form of verification, memory,
      or human-in-the-loop control to reduce failures and improve reliability.
    - Work consistently treats missing code, dataset, artifact, or limitation details
      as reproducibility gaps; several papers report strong generated output but lack
      external peer replication evidence.
    disagreements:
    - 'Evaluation scope differs: some systems optimize full manuscript generation
      and peer-review acceptance, while others measure narrower sub-skills such as
      ablation planning or task-level discovery actions.'
    - 'Interaction mode differs: fully autonomous generation, human-supervised dashboards
      or principal-investigator style control, and agent-external memory that constrains
      the next experiment create different deployment assumptions.'
    - 'Verification signals differ: internal logical coherence loops, simulated reviewer
      scores, visual-language-model feedback on figures, and expert preference judgments
      imply different validity conditions.'
    - 'Domain and evidence differ: demonstrations range across machine learning, applied
      mathematics, virtual science tasks, and PDE case studies, so generalization
      boundaries are not directly comparable.'
    - 'Failure handling differs: some systems use negative memory from past failures,
      while others rely on tree search or human rollback/resume control, changing
      the likely source of performance gains.'
    open_questions:
    - Do machine-judge scores, simulated review, or automated expert preference predict
      human peer review and long-term scientific utility across domains?
    - 'Which component contributes most to successful experiment automation: planning,
      execution harness, verification loop, memory, or human-in-the-loop interaction?'
    - Can failure-aware memory and internal verification prevent silent logical or
      empirical errors beyond the demonstrated PDE and case-study settings?
    - Do current automated planning benchmarks cover sufficient task variety and difficulty
      to reveal robustness gaps in real experimentation?
    - Under what conditions can fully autonomous systems be safely deployed without
      human oversight, given observed inconsistency in peer review outcomes and limited
      external validation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主实验与论文生成
      解决的问题: 覆盖从想法生成、代码执行、实验运行、结果可视化到论文写作的完整研究循环。
      尚未覆盖: 可靠性和外部有效性仍不确定；许多声张依赖机器裁判评审或工作坊级接受，缺乏跨领域的人类校准。
    - 路线: 面向实验规划的评测环境与基准
      解决的问题: 通过可复用任务和指标衡量假设形成、实验设计、消融规划和完整发现循环能力。
      尚未覆盖: 覆盖范围和主题有限，现有代理指标尚未与长期科学影响或真实决策效用建立关联。
    - 路线: 失败感知记忆与负知识
      解决的问题: 把失败尝试转化为有界、可检索的约束，使下游智能体在令牌和计算预算内避免重复错误。
      尚未覆盖: 主要在相同任务重试和偏微分方程案例上验证；负知识是否能跨研究流程和领域泛化仍不清楚。
    - 路线: 多智能体编排与验证/知识检索
      解决的问题: 协调专家角色、内部逻辑检查、知识检索和人在环监控，减少专家干预。
      尚未覆盖: 验证常为自指或机器裁判，所选机器学习、数学和虚拟科学案例之外的平台鲁棒性尚未建立。
    - 路线: 人在环交互式研究平台
      解决的问题: 提供仪表板、角色定制、工件检查、回滚/恢复控制和代码工具，使本地实验能够运行并反馈到研究循环。
      尚未覆盖: 证据来自小型内部案例研究，外部验证、任务泛化和安全监督边界仍未解决。
    共识:
    - 领域趋同于将实验自动化分解为想法生成、执行、分析和报告循环，并由大语言模型智能体编排。
    - 研究工作广泛使用机器裁判、模拟评审或自动化专家偏好来给生成论文和实验计划打分，这既提供可扩展评估，也带来共同的效度风险。
    - 论文普遍认为自主系统仍需要验证、记忆或人在环控制，以减少失败并提高可靠性。
    - 工作一致将缺少代码、数据集、工件或局限性描述视为可复现性缺口；多篇工作报告了强生成结果，但缺乏外部同行复现证据。
    分歧:
    - 评测范围不同：一些系统优化完整论文生成和同行评审接受，另一些衡量消融规划或任务级发现动作等较窄子技能。
    - 交互模式不同：全自主生成、人类监督仪表板或首席研究员式控制，以及约束下一次实验的代理外部记忆，形成不同的部署假设。
    - 验证信号不同：内部逻辑一致性循环、模拟评审分数、图形视觉语言模型反馈和专家偏好判断，隐含不同的效度条件。
    - 领域和证据不同：演示涵盖机器学习、应用数学、虚拟科学任务和偏微分方程案例，泛化边界难以直接比较。
    - 失败处理机制不同：一些系统使用来自过去失败的负记忆，另一些依赖树搜索或人类回滚/恢复控制，因此性能提升的可能来源不同。
    开放问题:
    - 机器裁判分数、模拟评审或自动化专家偏好是否能预测人类同行评审和跨领域长期科学效用？
    - 成功的实验自动化最依赖哪个组件：规划、执行工具、验证循环、记忆，还是人在环交互？
    - 失败感知记忆和内部验证能否在所展示的偏微分方程和案例研究之外防止隐性逻辑或实证错误？
    - 当前自动规划基准是否覆盖足够的任务类型和难度，以揭示真实实验中的鲁棒性缺口？
    - 在同行评审结果不稳定且外部验证有限的情况下，完全自主系统在何种条件下可以安全无监督部署？
