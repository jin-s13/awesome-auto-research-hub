      解决的问题: 将想法生成、代码或实验执行、分析、可视化和论文撰写融合成可迭代的科学发现闭环。
      尚未覆盖: 在类ML任务之外的稳定可靠性，以及生成论文是否构成可辩护的科学主张而非看似合理的产物。
    - 路线: 领域专用AI科学家与验证门控
      解决的问题: 在应用数学或计算流体力学中加入逻辑感知或物理感知验证、知识检索和求解器级检查，减少静默错误。
      尚未覆盖: 验证门控仍会漏掉植入的静默失败；证据限于少数案例、LLM评分或单一指标改进。
    - 路线: 智能体树搜索与审稿-优化循环
      解决的问题: 减少对人工代码模板的依赖，通过实验管理器、VLM反馈和渐进树搜索改进实验与论文质量。
      尚未覆盖: 同行评审成功仍稀少且仅工作坊级；搜索和审稿循环尚未证明能确保科学有效，而不仅是格式或评分可接受。
    - 路线: 科学发现基准与证据成熟度评测
      解决的问题: 用任务套件或盲化同行研究任务测量完整发现循环或主张的证据质量，超越对隐藏目标研究的复现。
      尚未覆盖: 当前编码智能体在证据成熟度上平台化；基准依赖单一冻结基座或模拟任务，代理指标与真实科研效用尚未对齐。
