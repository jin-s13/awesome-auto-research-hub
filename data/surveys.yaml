  related_work_outline:
  - 'Mainstream direction: Autonomous multi-agent research systems that couple literature
    synthesis, reasoning, verification, and manuscript generation; evaluation is shifting
    from static literature tasks toward evidence-grounded scientific discovery benchmarks.'
  - 'Shared research pattern: LLM-based agents are orchestrated as scientific workflows
    with retrieval, self-critique, and automated review. Progress is measured by benchmark
    scores, evidence maturity, and generated-paper quality rather than narrow retrieval
    precision.'
  - 'Key differences: One line builds end-to-end discovery systems, another builds
    blind or domain-specific discovery benchmarks, another analyzes failure modes,
    and another provides surveys/taxonomies. Supervision, task representation, and
    evaluation targets differ.'
  - 'Trend evolution: In the available 2025-2026 top evidence, the frontier moves
    from surveys of agentic scientific discovery and domain benchmarks toward self-evolving
    frameworks and stricter evidence-maturity evaluation. Older years are not represented
    among top papers.'
  - 'Open questions: Can literature review automation and research gap discovery become
    reliable outside training distributions? Are single-base-model benchmark results
    generalizable? Do LLM judges align with human scientific judgment, and which controls/robustness
    checks establish trustworthy discovery claims?'
  related_work_outline_zh:
  - 主流方向：以多智能体自主科研系统为主线，将文献综合、推理、验证与论文生成耦合；评测正从静态文献任务转向证据锚定的科学发现基准。
  - 研究共性：基于LLM的智能体被编排为科学工作流，常见检索、自批判和自动评审；进展多以基准分数、证据成熟度和生成论文质量衡量，而非窄检索精度。
  - 关键差异：一条路线构建端到端发现系统，一条构建盲任务或领域专用发现基准，另一条做失败分析，还有一条做综述/分类；监督方式、任务表示和评测目标不同。
  - 趋势演进：在可用的2025-2026年高排名证据中，方向从智能体科学发现综述与领域基准，转向自演化框架和更严格的证据成熟度评测；更早年份未在高排名论文中体现。
  - 开放问题：文献综述自动化和研究空白发现能否在训练分布外可靠？单基座模型基准结果是否可泛化？LLM评判器与人类科学判断是否一致，哪些对照与稳健性检查能建立可信发现主张？
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript synthesis, e.g., ReasFlow
        and EvoMaster
      what_it_solves: Couples literature synthesis, reasoning/derivation, experiment
        generation, and paper writing under multi-agent workflows to reduce human
        intervention in scientific discovery.
      what_remains_open: Verification and self-improvement claims rely on curated
        LLM-review or benchmark comparisons; cross-domain, cross-base-model, and long-horizon
        reliability remain unvalidated in the packet.
    - line: Evidence-grounded evaluation and benchmark design, e.g., TruthInsightBench
        and BAISBench
      what_it_solves: Creates blind or domain-real tasks that measure scientific claim
        quality and evidence maturity rather than reproducing a hidden target study
        or evaluating narrow retrieval output.
      what_remains_open: 'Generalizability evidence is sparse: coding-agent parity
        comes from one frozen base model, and human baselines are limited; proxy judge
        scores may diverge from real discovery utility.'
    - line: Failure analysis and design principles for autonomous research workflows,
        e.g., Why LLMs Aren't Scientists Yet
      what_it_solves: Documents recurring implementation, memory, domain-intelligence,
        and scientific-taste failures to guide more robust AI research agents.
      what_remains_open: Design principles are derived from four attempts in ML research,
        so transfer to cross-disciplinary literature intelligence is not empirically
        established.
    - line: Survey and conceptual taxonomy of agentic scientific discovery, e.g.,
        Agentic AI for Scientific Discovery
      what_it_solves: Organizes agentic AI capabilities, datasets, metrics, and frameworks
        across scientific domains and identifies literature review automation as a
        key bottleneck.
      what_remains_open: The taxonomy remains descriptive; it does not directly predict
        model behavior or benchmark outcomes, and literature review automation is
        flagged as still unreliable.
    consensus:
    - Current systems are far from fully autonomous, trustworthy scientific discovery;
      observed progress is strongest in executing and documenting analyses.
    - Literature review automation is repeatedly identified as a bottleneck, but the
      available evidence is concentrated in 2025-2026 and lacks external cross-model
      validation.
    - Evaluation is moving from literature retrieval precision toward evidence quality,
      blind task performance, and scientific workflow completion.
    - Human-AI collaboration remains necessary, whether through a human principal
      investigator, human baselines, or human review.
    disagreements:
    - 'Evaluation target differs: some work scores generated manuscript and derivation
      quality via LLM rubrics, while others score blind data-analysis claims, multiple-choice
      discovery questions, or broad science exams.'
    - 'Task representation differs: one line uses a six-agent workflow for ML research,
      another uses domain-agnostic evolving agents, and another encodes discovery
      as questions derived from published studies.'
    - 'Supervision and interaction differ: some systems keep a human principal investigator
      in the loop, while others emphasize autonomous self-evolution or remove source
      conclusions to force independent judgment.'
    - 'Validation evidence differs: one benchmark reports no statistically reliable
      separation among coding agents on a single base model, while a framework reports
      large relative gains on general science benchmarks; both leave cross-base-model
      comparability unresolved.'
    open_questions:
    - Do LLM-review rubrics for generated papers align with human scientific judgment
      and real discovery utility?
    - Can literature review automation and gap discovery be made reliable outside
      the domains and datasets seen during training?
    - Which controls, robustness checks, falsifiability criteria, and cross-dataset
      tests are necessary for a scientific claim to be considered trustworthy?
    - How much do reported gains come from retrieval or self-evolution components
      rather than the base model or task-specific prior? The packet lacks ablations.
    - Are results from one frozen base model or a single benchmark generalizable across
      backbone models and scientific domains?
    - Artifact, code, and dataset availability signals are inconsistent in the evidence
      packet, leaving reproducibility as a verification gap rather than proven absence.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究与论文生成的智能体系统，如 ReasFlow、EvoMaster
      解决的问题: 把文献综合、推理/推导、实验和论文写作串联为多智能体工作流，以减少人工干预。
      尚未覆盖: 验证与自改进多依赖LLM评审或基准比较；跨领域、跨基座模型和长程可靠性尚未被外部证据确认。
    - 路线: 证据锚定的评测与基准设计，如 TruthInsightBench、BAISBench
      解决的问题: 用盲任务或真实领域数据评估智能体主张的证据成熟度和科学发现能力，而非仅复现隐藏目标研究或评估窄检索输出。
      尚未覆盖: 泛化证据不足：编码智能体结果仅基于一个冻结基座模型，人类基线有限；评分代理指标与真实发现效用可能不一致。
    - 路线: 自主研究工作流的失败分析与设计原则，如 Why LLMs Aren't Scientists Yet
      解决的问题: 记录实现漂移、记忆退化、领域智能不足和科学品味弱等重复失败模式，以指导更强健的AI研究智能体。
      尚未覆盖: 设计原则来自四次机器学习研究尝试，能否迁移到跨领域文献智能尚未实证。
    - 路线: 智能体科学发现的综述与概念分类，如 Agentic AI for Scientific Discovery
      解决的问题: 按领域和能力组织智能体AI系统、数据集、指标和框架，并识别文献综述自动化为关键瓶颈。
      尚未覆盖: 分类仍偏描述性，未能直接预测模型行为或基准结果；文献综述可靠性仍被标记为未解决。
    共识:
    - 当前系统远未达到完全自主、可信的科学发现；已有进展主要体现在分析执行和文档记录上。
    - 文献综述自动化被反复视为瓶颈，但现有证据集中在2025-2026年，缺乏跨模型外部验证。
    - 评测正从文献检索精度转向证据质量、盲任务表现和科学工作流完成度。
    - 人机协作仍被保留：或以人工首席研究员形式，或以人类基线、人工评审作为参照。
    分歧:
    - 评测目标不同：有的评生成论文与推导质量，有的评盲数据主张、选择题式科学发现或通用科学考试。
    - 任务表示不同：一条路线用六智能体研究流水线，一条强调领域无关自演化，另一条把发现编码为已发表研究的问答。
    - 监督与交互不同：有的保留人工首席研究员，有的强调自主自演化，有的隐藏原始结论以强制独立判断。
    - 验证证据不同：一个基准在单一基座上未发现编码智能体之间有统计显著差异，另一个框架报告相对基线的大幅提升；跨基座可比性仍未解决。
    开放问题:
    - 基于生成论文的LLM评审与人类科学判断及真实发现效用是否一致？
    - 文献综述自动化和研究空白发现能否在训练分布外的领域和数据集上保持可靠？
    - 哪些对照、稳健性、可证伪性和跨数据集检验足以支撑可信科学主张？
    - 报告增益有多少来自检索或自演化组件，而非基座模型或任务先验？当前证据包缺少消融。
    - 单个冻结基座模型或单个基准上的结果是否可推广到其他基座与科学领域？
    - 证据包中代码、数据和工件信号不一致，复现性应视为验证缺口而非已确认缺失。
