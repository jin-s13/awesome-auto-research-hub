  related_work_outline:
  - 'Mainstream direction: Building autonomous multi-agent research systems that combine
    literature retrieval/synthesis, reasoning, verification, experimentation, and
    paper generation, with increasing emphasis on evidence-grounded evaluation of
    scientific discovery claims.'
  - 'Shared research pattern: LLM-based agents simulate scientific workflow stages
    and are scored via rubric-style or benchmark tasks; verification, retrieval, and
    self-critique are proposed but validated mainly through proxy metrics rather than
    real scientific consensus.'
  - 'Key differences: Some work produces full papers or discoveries through end-to-end
    agents, while others create blind tasks, failure-case studies, or surveys; evaluation
    targets range from generated-paper quality to data-supported claim maturity and
    biological annotation accuracy.'
  - 'Trend evolution: Within the available 2025-2026 frontier evidence, research moved
    from domain-specific scientific benchmarks and surveys toward open-ended discovery
    benchmarks and self-evolving agent frameworks that expose gaps in controls, robustness,
    falsifiability, and cross-domain generalization.'
  - 'Open questions: How to validate LLM-judge metrics against human review and real
    utility; whether retrieved knowledge and verification loops prevent reasoning
    failures; and how far modular agents can generalize beyond narrow base models
    and curated tasks.'
  related_work_outline_zh:
  - 主流方向：构建自主多智能体研究系统，整合文献检索/综述、推理、验证、实验与论文生成，并越来越多地以证据为基础评估科学发现主张。
  - 研究共性：基于 LLM 的智能体模拟科研工作流，并通过评分表或基准任务打分；验证、检索和自我批判被提出，但主要通过代理指标验证，而非真实科学共识。
  - 关键差异：一类工作端到端生成论文或发现，另一类构建盲测任务、失败案例研究或综述；评测目标涵盖生成论文质量、数据支持主张的成熟度以及生物学注释准确率。
  - 趋势演进：在现有 2025-2026 前沿证据中，研究从领域特定科学基准和综述转向开放式发现基准与自演化智能体框架，暴露对照、稳健性、可证伪性与跨域泛化不足。
  - 开放问题：LLM 裁判指标如何与人工评审和实际效用一致；检索与验证循环能否预防推理论证失败；模块化智能体在单一基座模型与整理任务之外能否泛化。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research generation
      what_it_solves: Converts literature synthesis, theory or experiment design,
        verification, and manuscript preparation into one agent workflow.
      what_remains_open: Generated outputs are scored mainly by LLM rubrics, so scientific
        correctness beyond curated review criteria is unverified; reproducibility
        artifacts and external validation are limited.
    - line: Evidence-grounded evaluation and blind benchmarking
      what_it_solves: Creates tasks from peer-reviewed studies with withheld conclusions
        to assess whether agents produce claims supported by available evidence.
      what_remains_open: Current agents exhibit weak controls, robustness, falsifiability,
        and cross-domain generalization; evaluation relies on limited base models
        and curated domains.
    - line: Failure-mode analysis and design principles
      what_it_solves: Documents recurring failure modes in autonomous research attempts
        and translates them into guidance for more robust systems.
      what_remains_open: Evidence comes from few end-to-end attempts; prevention strategies
        are not yet systematically evaluated across varied research problems.
    - line: Surveys and conceptual organization
      what_it_solves: Organizes agentic scientific discovery systems, metrics, datasets,
        and challenges into domain or capability categories.
      what_remains_open: Literature review automation and system reliability remain
        unresolved; proposed taxonomies lack predictive empirical validation.
    - line: Knowledge-grounded self-evolving agent frameworks
      what_it_solves: Supports iterative hypothesis refinement, self-critique, and
        knowledge accumulation across experimental cycles in domain-agnostic settings.
      what_remains_open: Cross-domain claims depend heavily on benchmark scores; external
        citation, artifact, and deployment evidence remains insufficient.
    consensus:
    - LLM-based multi-agent pipelines can execute parts of the scientific workflow,
      but current systems do not yet produce trustworthy autonomous scientific discovery.
    - Proxy evaluation using LLM judges or multiple-choice tasks is common, but it
      does not fully substitute for human review or real scientific validation.
    - Evidence auditability and documentation competence are emerging as evaluable
      strengths, while discriminative scientific acts such as controls, robustness,
      and falsifiability remain weak.
    - Knowledge retrieval, verification loops, and self-critique are recurring architectural
      responses to logical and factual errors.
    disagreements:
    - 'Evaluation target differs: generated-paper quality under reviewer rubrics versus
      evidence maturity of data-supported claims versus task-level biological annotation
      accuracy.'
    - 'System scope differs: end-to-end paper generation versus domain-agnostic evolving
      frameworks versus benchmark construction versus qualitative survey synthesis.'
    - 'Supervision differs: one setup treats a human expert as principal investigator,
      another uses blind tasks without human intervention, and another compares against
      graduate-level human baselines.'
    - 'Progress judgment differs: some work reports state-of-the-art benchmark scores,
      while other work emphasizes plateauing agents and a persistent scientific discovery
      gap.'
    open_questions:
    - Can LLM evidence-maturity scores predict whether an agent's claim would survive
      peer review or replication?
    - How much of reported improvement comes from knowledge retrieval and self-evolution
      rather than base model capability, task priors, or rubric design?
    - Do verification loops reduce documented failure modes such as implementation
      drift, overexcitement, and weak scientific taste beyond the tested attempts?
    - Can these systems transfer across scientific domains without substantial task-specific
      reconfiguration or curated human labels?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究生成
      解决的问题: 把文献综合、理论或实验设计、验证和论文写作整合到单一智能体工作流中。
      尚未覆盖: 输出主要由 LLM 评分表评判，超出整理评审标准的科学性未验证；可复现工件与外部验证不足。
    - 路线: 基于证据的评测与盲测基准
      解决的问题: 从同行评审研究中提取任务并隐藏结论，评估智能体是否能给出有数据支持的主张。
      尚未覆盖: 当前智能体在对照、稳健性、可证伪性和跨域泛化上薄弱；评测依赖有限基座模型和整理领域。
    - 路线: 失败模式分析与设计原则
      解决的问题: 记录自主研究尝试中的复发失败模式，并转化为更稳健系统的设计启发。
      尚未覆盖: 证据来自少量端到端尝试，预防策略尚未在多样化研究问题上得到系统验证。
    - 路线: 综述与概念组织
      解决的问题: 将智能体科学发现系统、指标、数据集和挑战按领域或能力归类。
      尚未覆盖: 文献综述自动化和系统可靠性仍是未解难题；分类缺少预测性的实证验证。
    - 路线: 知识接地的自演化智能体框架
      解决的问题: 通过迭代假设优化、自我批判和知识积累，在领域无关设置中支持发现循环。
      尚未覆盖: 跨领域泛化主要依赖基准分数，外部引用、工件和部署证据仍然不足。
    共识:
    - 基于 LLM 的多智能体流水线可以执行部分科研工作流，但当前系统尚未产生可信的自主科学发现。
    - 使用 LLM 裁判或选择题式代理评测很常见，但不能完全替代人工评审或真实科学验证。
    - 证据可审计性和文档能力正在成为可评估的优势，而对照、稳健性和可证伪性等判别性科学行为仍较弱。
    - 知识检索、验证循环和自我批判是对逻辑与事实错误的常见架构性回应。
    分歧:
    - 评测目标不同：论文生成质量、数据支持主张的证据成熟度、生物学注释准确性各有侧重。
    - 系统范围不同：端到端论文生成、领域无关自演化框架、基准构建和定性综述分别面对不同问题。
    - 监督信号不同：一种以人类专家为主持者，另一种采用无人干预的盲测任务，还有人类基线作为对照。
    - 进展判断不同：一些工作强调最先进基准分数，另一些则强调智能体得分停滞和科学发现能力差距。
    开放问题:
    - LLM 证据成熟度评分能否预测主张通过同行评审或可复现性？
    - 报告的性能提升有多少来自知识检索和自演化，而非基座模型能力、任务先验或评分表设计？
    - 验证循环能否在少数测试之外减少实现漂移、过度兴奋和科学品味薄弱等失败模式？
    - 这些系统能否在没有大量领域特定配置或人工标注的情况下跨学科迁移？
