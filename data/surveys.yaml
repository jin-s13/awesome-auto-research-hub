  related_work_outline:
  - 'Mainstream direction: Current work centers on autonomous agentic research systems
    that move from hypotheses or experimental ideas through execution, verification,
    and reporting. Representative examples include physics-aware computational fluid
    dynamics discovery, formal causal inference, and general multi-agent research
    platforms, with emerging benchmarks for comparison.'
  - 'Shared research pattern: The dominant pattern couples ideation with grounded
    execution, using verification gates, self-correction loops, structured debate,
    or human checkpoints to reduce hallucinated findings and silent experimental failures.'
  - 'Key differences: Work splits between domain-specific constraints such as physics
    checks or proof assistants and domain-agnostic frameworks; between quantitative
    benchmarks and expert/case-study judgments; and between autonomous self-correction
    and targeted human collaboration.'
  - 'Trend evolution: The 2025–2026 window shows a shift from surveys plus early AI-scientist
    benchmarks toward self-evolving, formally grounded, and domain-verified agents
    with stronger human collaboration; the span is narrow, so this is a frontier trend
    rather than long-term evolution.'
  - 'Open questions: How well do verification gates cover silent failures and formalization
    gaps? Do proxy metrics transfer to real scientific utility? How much of reported
    gains is workflow rather than model capability or human input?'
  related_work_outline_zh:
  - 主流方向：当前研究集中于自主智能体科研系统，从假设或实验想法进入执行、验证和报告环节；代表性系统覆盖物理感知计算流体动力学、形式化因果推断和通用多智能体平台，并出现用于比较的基准。
  - 研究共性：主流模式将想法生成与有依据的执行耦合，通过验证门控、自我纠正循环、结构化辩论或人类检查点来减少幻觉结论和静默实验失败。
  - 关键差异：工作分为领域特定约束（如物理检查或证明助手）与领域无关框架；评测分为量化基准与专家/案例判断；交互分为自主自我纠正与精准人类协作。
  - 趋势演进：2025–2026窗口显示从综述和早期AI科学家基准，转向具备自我演化、形式化基础和领域验证的智能体，并加强人机协作；时间跨度窄，这属于当前前沿趋势。
  - 开放问题：验证门控对静默失败和形式化缺口的覆盖如何？代理指标能否迁移到真实科研效用？报告增益中多少来自工作流而非模型能力或人工输入？
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research teams
      what_it_solves: Combines hypothesis generation, experiment execution, result
        analysis, and reporting into a loop so an idea can become a validated research
        artifact.
      what_remains_open: Reliability outside curated case studies or benchmarks, and
        attribution of gains to the agent workflow, backbone model, or human interventions.
    - line: Domain-grounded discovery with verification gates
      what_it_solves: Embeds physical, formal, or empirical constraints into hypothesis
        search so invalid ideas or silent experimental failures are caught before
        acceptance.
      what_remains_open: Verification gates can still miss failure modes; physical
        or formal checks do not guarantee the artifact faithfully captures the intended
        scientific claim.
    - line: Self-correction and failure attribution
      what_it_solves: Diagnoses failed experiments and routes corrections to hypothesis,
        design, or implementation levels to improve execution success and output quality.
      what_remains_open: Coverage of failure classes, fully autonomous scientific
        writing, and generalization beyond limited topic benchmarks remain unresolved.
    - line: Benchmarking and human baseline evaluation
      what_it_solves: Makes AI scientist claims comparable through tasks, baselines,
        metrics, expert judgment, and human performance references.
      what_remains_open: Benchmark coverage and whether proxy metrics predict real
        discovery value or multi-domain utility are still uncertain.
    - line: Formal and theoretical research automation
      what_it_solves: Automates theorem/proof-style or theory-building workflows with
        proof assistants and audits to ensure formal correctness.
      what_remains_open: Faithfulness between formalization and intended claim, reliance
        on human inspection, and limited quantitative evidence in presented artifacts.
    - line: Surveys and organizational taxonomies
      what_it_solves: Synthesizes system capabilities, domains, metrics, frameworks,
        and challenges to guide design and evaluation.
      what_remains_open: Whether categories predict behavior or reliability, and whether
        the map remains valid as new systems emerge.
    consensus:
    - Ideation should be embedded in a closed research loop that includes execution,
      verification, and grounded reporting.
    - Verification or audit mechanisms are needed to catch silent failures, fabricated
      results, or misaligned claims.
    - Targeted human collaboration can improve reliability over fully autonomous or
      exhaustive step-by-step supervision.
    - Current systems show potential but are not yet equivalent to fully autonomous
      scientific discovery.
    disagreements:
    - 'Domain-specific constraints versus domain-agnostic extensibility: some systems
      enforce discipline-specific validity, while others prioritize broad applicability
      with minimal customization.'
    - 'Supervision and intervention: some rely on self-healing or self-evolving loops,
      whereas others place humans at high-leverage decision points or final inspection.'
    - 'Evaluation target and evidence: quantitative benchmark scores, expert preference,
      artifact quality, and formal proof audits are used as competing or complementary
      success signals.'
    - 'Validity type: empirical/physical verification, formal machine-checked proof,
      and benchmark-based performance certify different notions of reliability.'
    open_questions:
    - Can verification gates be made sufficiently broad to catch missed silent failures
      and formalization-to-claim gaps?
    - What share of reported improvement comes from the agent workflow, underlying
      backbone model, task prior, or human collaboration?
    - Do current benchmarks such as ARC-Bench and BAISBench predict real scientific
      discovery value across fields?
    - What level of human oversight balances reliability, novelty, and scalability
      in autonomous hypothesis generation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研团队
      解决的问题: 把假设生成、实验执行、结果分析与报告连接成闭环，使想法能转化为可验证的研究工件。
      尚未覆盖: 还缺乏在策划案例与基准之外可靠性的证据，且难以区分增益来自框架、底座模型还是人工干预。
    - 路线: 带验证门控的领域驱动发现
      解决的问题: 将物理、形式或经验约束嵌入假设搜索，在接受结果前捕获无效想法或静默实验失败。
      尚未覆盖: 验证门控可能遗漏部分失败模式；物理或形式检查并不能保证工件忠实反映预期科学主张。
    - 路线: 自我纠正与失败归因
      解决的问题: 对失败实验进行因果诊断，并将纠正路由到假设、实验设计或实现层面，以提高执行成功率和产出质量。
      尚未覆盖: 对失败类型、完整科学写作以及有限主题基准之外的泛化仍缺少覆盖。
    - 路线: 基准与人类基线评测
      解决的问题: 通过任务、基线、指标、专家判断和人类表现参照，使AI科学家的主张可比。
      尚未覆盖: 基准覆盖和代理指标能否预测真实发现价值或多领域效用仍不明。
    - 路线: 形式化与理论研究自动化
      解决的问题: 借助证明助手和审计自动化定理/证明或理论构建工作流，确保形式正确性。
      尚未覆盖: 形式化与预期主张之间的忠实性、人工检查依赖，以及产物评估缺少定量证据。
    - 路线: 综述与分类体系
      解决的问题: 综合系统能力、领域、指标、框架和挑战，以指导设计和评估。
      尚未覆盖: 这些分类能否预测行为或可靠性，以及在新系统出现后是否保持有效，尚未被直接验证。
    共识:
    - 想法生成应被嵌入必须包含执行、验证和基于事实的报告的科研闭环。
    - 验证或审计机制用于捕获静默失败、伪造结果或与主张不一致的问题。
    - 精准的人类协作可以比完全自主或逐步监督更可靠。
    - 当前系统展现出潜力，但还不能等同于完全自主的科学发现。
    分歧:
