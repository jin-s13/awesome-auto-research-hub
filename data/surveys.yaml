      尚未覆盖: 仅在单一冻结基座模型上报告；智能体得分趋同且无可靠两两差异，关键判别性科学行为仍缺失。
    - 路线: 自动评审与迭代稿件优化
      解决的问题: 用模拟评审或视觉-语言反馈对生成论文打分并指导修改，降低评审成本并提供迭代信号。
      尚未覆盖: 同行评审通过仅为工作坊级别且部分通过；自动评审尚不能完全替代人类评审或会议级验证。
