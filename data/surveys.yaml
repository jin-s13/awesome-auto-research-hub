      what_it_solves: Provides repeatable tasks, metrics, and human baselines for
        testing discovery cycles and scientific reasoning across virtual, omics, and
        blind peer-study tasks.
      what_remains_open: Current agents plateau or fall short of autonomous discovery;
        reported performance often relies on one frozen base model or limited internal
        case studies.
    - line: Evidence-grounded evaluation and verification
      what_it_solves: Assesses generated claims through automated LLM judges, vision-language
        physics gates, or simulated peer review, targeting evidence maturity, validity,
        and paper quality.
      what_remains_open: Verifiers still miss failures and do not guarantee controls,
        robustness, falsifiability, or cross-dataset generalization; alignment with
        human judgment is only partially validated.
    consensus:
    - 'Autonomous research systems share an ideation-to-writing loop: generate hypotheses,
      run experiments or simulations, analyze results, and author outputs.'
    - Evaluation is becoming embedded in the research loop through automated judges,
      benchmarks, and verification gates rather than treated as an external afterthought.
    - Current agents can execute and document analyses competently but are not yet
      reliable autonomous scientific discoverers.
    - Evidence-grounded benchmarks reveal plateaued or insufficient performance on
