    - 验证模态不同：领域特定的物理检查、逻辑一致性审计和报告约束针对不同失败源。
    - 失败响应不同：一些系统使用反思，另一些使用因果多假设归因并确定性路由干预。
    - 评测标准不同：工作坊接受、评分、基准提升和工件质量不可互换。
