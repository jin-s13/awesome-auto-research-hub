  - 'Key differences: Some focus on full manuscript generation and peer review, others
    on scorable tasks like ablation planning or simulated discovery; interaction ranges
    from autonomous end-to-end to human-in-the-loop dashboards.'
  - 'Trend evolution: From 2024 simulated discovery environments and first automated
