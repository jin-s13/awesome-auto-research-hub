  related_work_outline:
  - 'Mainstream direction: Building multi-agent systems that iteratively search, synthesize,
    and critique literature, often integrated into broader autonomous scientific discovery
    pipelines.'
  - 'Shared research pattern: Specialized LLM agents assume distinct scholarly roles
    (e.g., retrieval, drafting, reviewing) and refine outputs through internal verification
    loops or rubric-guided iteration.'
  - 'Key differences: Systems vary in evaluation methodology (LLM-as-judge vs. human-expert
    panels vs. structured benchmarks), domain specificity (domain-agnostic frameworks
    vs. domain-tailored like mathematics or biology), and the degree of human-in-the-loop
    collaboration.'
  - 'Trend evolution: Across 2023–2026, the frontier moved from standalone survey
    generation to integrated, self-evolving agents that couple literature intelligence
    with hypothesis generation and experimental validation; failure analysis and benchmarking
    have emerged as corrective mechanisms.'
  - 'Open questions: How to guarantee factual accuracy and comprehensive coverage
    in generated literature reviews; how to design unified, transferable benchmarks
    for literature intelligence; and how to mitigate memory degradation and implementation
    drift in long-horizon autonomous research.'
  related_work_outline_zh:
  - 主流方向：构建多智能体系统，迭代搜索、综合与批判文献，并常将其集成到更广泛的自主科学发现流水线中。
  - 研究共性：专门的LLM智能体扮演不同学术角色（如检索、撰写、评审），通过内部验证循环或评分准则引导的迭代来优化输出。
  - 关键差异：系统在评估方法（LLM评分与人类专家评审与结构化基准）、领域特异性（领域无关框架与面向数学或生物学等特定领域）以及人机协作程度上存在差异。
  - 趋势演进：2023–2026年间，前沿从独立的综述生成发展为集成化、自我演化的智能体，将文献情报与假设生成和实验验证相结合；失败分析与基准测试作为纠偏机制出现。
  - 开放问题：如何保证生成文献综述的事实准确性与全面覆盖；如何设计统一、可迁移的文献情报基准；以及如何缓解长周期自主研究中的记忆退化和实现漂移。
  literature_review:
    line_of_work_matrix:
    - line: Automated literature survey generation
      what_it_solves: Producing comprehensive, formatted academic survey papers by
        decomposing the task into specialized agent roles (topic expansion, citation
        curation, drafting) and iteratively refining drafts via rubric-guided review.
      what_remains_open: Factual accuracy and coverage are not yet verified against
        human-consensus surveys; reliance on LLM-based evaluation may mask hallucinated
        or missing references.
    - line: Literature-integrated autonomous discovery systems
      what_it_solves: Coupling literature search, data analysis, and hypothesis generation
        in a closed loop, enabling traceable, long-horizon scientific reports that
        reference both code and literature.
      what_remains_open: Report statement accuracy remains imperfect (≈79.4%), and
        the scaling behavior beyond tens of cycles is unknown; domain-specific knowledge
        gaps persist.
    - line: Benchmarking and failure analysis for AI scientists
      what_it_solves: Providing standardized tasks (e.g., cell-type annotation, ML
        research pipeline) and human performance baselines to measure the gap between
        AI and human scientific reasoning, and documenting recurring failure modes.
      what_remains_open: Existing benchmarks are narrow in scientific domain coverage;
        the documented failure modes (e.g., implementation drift, memory degradation)
        have not yet been systematically resolved.
    - line: Self-evolving, domain-agnostic agent frameworks
      what_it_solves: Enabling agents to iteratively refine hypotheses, self-critique,
        and accumulate knowledge across experiments, applicable to multiple disciplines
        with minimal code adaptation.
      what_remains_open: Demonstrated improvements are measured on static benchmarks;
        evidence that self-evolution yields genuine novel discoveries (rather than
        overfitting to benchmark metrics) is missing.
    - line: Taxonomy and challenge surveys
      what_it_solves: Organizing fragmented AI-scientist systems into categories by
        domain and capability, and identifying cross-cutting challenges such as literature
        review automation, reliability, and ethics.
      what_remains_open: Direct empirical validation that the proposed taxonomies
        predict system performance or failure is absent; the surveys reflect the literature
        landscape at a snapshot, not a causal model.
    consensus:
    - Multi-agent decomposition with specialized roles (retrieval, drafting, reviewing)
      improves the quality of automated literature synthesis and scientific reasoning.
    - Iterative refinement, whether through self-critique, rubric feedback, or reviewer
      agents, is essential for producing coherent and scholarly outputs.
    - Literature intelligence is a critical bottleneck for autonomous scientific discovery,
      and current systems still fall short of fully autonomous, reliable literature
      review and synthesis.
    - Human baselines remain a necessary reference point, but the definition of a
      human baseline varies from graduate-level bioinformaticians to expert researchers.
    disagreements:
    - 'Evaluation: Some works rely on LLM-based rubric scores (e.g., ARISE), while
      others use independent human expert ratings (e.g., Kosmos) or standardized task-based
      benchmarks (e.g., BAISBench), leading to inconsistent performance claims.'
    - 'Domain specificity: Domain-agnostic frameworks (e.g., EvoMaster) claim broad
      applicability, whereas systems like ReasFlow demonstrate deep integration in
      a single domain (applied mathematics), making it unclear whether generalizability
      comes at the cost of depth.'
    - 'Human-in-the-loop: ReasFlow adopts a principal-investigator–graduate-student
      metaphor with human oversight, while Kosmos and EvoMaster push toward full autonomy,
      reflecting different assumptions about the role of human researchers.'
    - 'Architectural control: Tree-based backtracking workflows (OR-Agent) contrast
      with evolutionary self-evolution (EvoMaster) and static role-based pipelines
      (ARISE), indicating no consensus on the optimal control structure for long-horizon
      research.'
    open_questions:
    - How can we systematically verify the factual accuracy and source faithfulness
      of AI-generated literature reviews without relying solely on LLM judges?
    - What evaluation protocols can capture the incremental utility of literature
      intelligence in real-world researcher workflows, beyond static benchmark scores?
    - How do the documented failure modes (bias toward training defaults, implementation
      drift, memory degradation) scale with agent complexity and task duration, and
      which architectural interventions are most effective against them?
    - Under what conditions does a domain-agnostic self-evolving agent produce genuinely
      novel scientific insights, rather than recombining existing knowledge from the
      training corpus?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动化文献综述生成
      解决的问题: 通过将任务分解为专门智能体角色（主题扩展、引文管理、撰写）并利用评分准则引导的迭代优化，生成结构化的学术综述。
      尚未覆盖: 生成综述的事实准确性和覆盖度尚未与人类共识综述对比验证；依赖LLM评分可能掩盖虚构或遗漏的引用。
    - 路线: 文献集成式自主发现系统
      解决的问题: 将文献搜索、数据分析和假设生成整合为闭环，产出可追溯的、长周期的科学报告，并引用代码和文献。
      尚未覆盖: 报告陈述准确率仍不完美（约79.4%），数十个周期以上的缩放行为未知；领域特定知识缺口依然存在。
    - 路线: AI科学家的基准测试与失败分析
      解决的问题: 提供标准化任务（如细胞类型注释、ML研究流水线）和人类基线，衡量AI与人类科学推理的差距，并记录重复出现的失败模式。
      尚未覆盖: 现有基准覆盖的科学领域较窄；已记录的失败模式（如实现漂移、记忆退化）尚未被系统性地解决。
    - 路线: 自我演化、领域无关的智能体框架
      解决的问题: 使智能体能够迭代优化假设、自我批判并在实验间积累知识，以最少代码适配即可应用于多个学科。
      尚未覆盖: 已展示的性能提升来自静态基准；缺乏自演化能产生真正新颖发现（而非过度拟合基准指标）的证据。
    - 路线: 分类学与挑战综述
      解决的问题: 将零散的AI科学家系统按领域和能力进行分类，并识别文献综述自动化、可靠性和伦理等跨领域挑战。
      尚未覆盖: 缺乏直接实证验证，表明所提出的分类能预测系统性能或失败；综述反映的是文献的瞬时快照，而非因果模型。
    共识:
    - 使用专门角色的多智能体分解（检索、撰写、评审）能提升自动文献综合和科学推理的质量。
    - 迭代优化，无论是通过自我批判、评分反馈还是评审智能体，对于生成连贯且学术化的输出至关重要。
    - 文献情报是自主科学发现的关键瓶颈，当前系统仍远未达到完全自主、可靠的文献综述与综合水平。
    - 人类基线仍是必要的参考点，但人类基线的定义从研究生水平的生物信息学家到专家研究员不等。
    分歧:
    - 评测方式：部分工作依赖基于LLM的评分准则分数（如ARISE），而其他工作使用独立人类专家评分（如Kosmos）或标准化任务基准（如BAISBench），导致性能声明不一致。
    - 领域特异性：领域无关框架（如EvoMaster）声称具有广泛适用性，而像ReasFlow这样的系统则展示了在单一领域（应用数学）的深度整合，使得泛化性是否以牺牲深度为代价变得不明确。
    - 人机协作：ReasFlow采用首席研究员与研究生的人机监督隐喻，而Kosmos和EvoMaster则推动完全自主，反映了对人类研究员角色假设的不同。
    - 架构控制：基于树的回溯工作流（OR-Agent）与演化式自我进化（EvoMaster）以及静态角色流水线（ARISE）形成对比，表明在长周期研究的最优控制结构上尚无共识。
    开放问题:
    - 如何在不单纯依赖LLM评判的情况下，系统性地验证AI生成文献综述的事实准确性和来源忠实性？
    - 哪些评估协议能够捕捉文献情报在真实科研工作流中的增量效用，超越静态基准分数？
    - 已记录的失败模式（对训练数据默认值的偏见、实现漂移、记忆退化）如何随智能体复杂度和任务持续时间而缩放，哪些架构干预对其最有效？
    - 在什么条件下，领域无关的自我演化智能体能够产生真正新颖的科学洞察，而非重组训练语料库中的已有知识？
