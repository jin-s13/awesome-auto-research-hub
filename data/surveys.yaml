      解决的问题: 自动化从假设生成、代码执行、实验分析到论文写作的完整研究周期。
      尚未覆盖: 同行评审下成功不稳定，多个提交中仅部分通过；声明尚未在工作坊级机器学习任务之外得到验证。
    - 路线: 领域感知的验证增强发现智能体
      解决的问题: 通过知识检索、证明验证或物理感知视觉检查，在接受结果前将发现约束在领域要求内。
      尚未覆盖: 验证门控仍会遗漏静默失败，且仅在较窄领域案例上展示；生成声明仍需更广泛的外部领域验证。
    - 路线: 发现基准与证据成熟度评测
      解决的问题: 构建任务和评分标准以评估开放式发现而非复现，包括任务完成、相关动作、解释性知识和证据成熟度。
      尚未覆盖: 当前智能体在一个冻结基座模型上呈现平台期，两两之间无统计上可靠的分离；代理指标和 LLM 评判器尚未与真实科学效用或跨模型泛化建立联系。
    - 路线: 自动论文生成与评审
      解决的问题: 以低成本生成完整论文和模拟评审，减轻人类写作与初步评审负担。
      尚未覆盖: 自动评审器在有限场景中接近人类评分，但会议级有效性、局限性报告和工件复用仍未验证。
    共识:
    - 研究智能体普遍将发现结构化为想法、实验、结果和论文写作之间的迭代循环。
    - 自动评测被视为规模化比较的必要手段，使用 LLM 评审、固定评分标准或基准任务指标。
    - 验证或有效性门控被认为对产生可辩护主张很重要，尤其是在模板化机器学习任务之外。
    - 人类研究者仍以首席研究员、评审人或外部验证者身份参与，而不是被完全移除。
    分歧:
    - 发现范围：有的工作面向通用机器学习研究，有的则限制在应用数学或计算流体动力学领域。
    - 评测目标：有的优化工作坊同行评审接受，有的优化基准任务完成，有的则沿对照、可证伪性等维度对证据成熟度打分。
    - 验证方式：逻辑证明审计、物理感知视觉检查和通用 LLM 自动评审编码了不同的有效性概念。
    - 自主程度与人机角色：系统在是否移除人类代码模板、是否保持首席研究员-研究生协作模式、是否依赖外部领域解释上存在差异。
    开放问题:
    - 何种证据能把 LLM 评判分数、基准完成或同行评审接受与可复用、新颖的科学价值联系起来？
    - 验证门控在多样科学领域和设置中检测静默失败和逻辑错误的能力如何？
    - 科学发现智能体能否跨不同基座模型、数据集和硬件稳定表现，而不是在单一冻结模型上停留平台期？
    - 哪些评测设计能区分智能体自身贡献与底层模型或仿真器带来的改进？
