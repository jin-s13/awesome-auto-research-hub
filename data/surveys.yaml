  - 趋势演进：2024年确立全自动发现与虚拟基准；2025年新增同行评审接收和消融规划基准；2026年转向多智能体编排、实时监控、失败感知记忆和应用数学发现。
  - 开放问题：工作坊级之外可靠性、跨领域泛化、代理指标与科学有效性一致性、可复现工件，以及人类与智能体实验规划一致性仍不确定。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous experimentation pipelines
      what_it_solves: Covers the full loop from hypothesis or idea generation through
        code execution, experiment running, analysis, and manuscript or report generation.
      what_remains_open: Validation is mostly through LLM-based review or workshop
        peer review; full conference-level, lab-level reliability, and calibration
        remain underevidenced.
    - line: Multi-agent orchestration and human-in-the-loop experiment management
      what_it_solves: Coordinates roles, monitors runs, rolls back or resumes experiments,
        connects local code and artifacts, and supports verification or self-improvement.
      what_remains_open: Evidence is limited to small case studies or internal AI
        and math tasks; scalability, external reproducibility, and real-world lab
        integration are not yet mature.
    - line: Virtual environments for end-to-end discovery evaluation
      what_it_solves: Provides reusable simulated tasks and automatic metrics for
        hypothesis formation, experiment design, analysis, and conclusion-driven action.
      what_remains_open: Strong baseline agents struggle on many tasks; proxy metrics
        and limited coverage leave real scientific utility uncertain.
    - line: Automated ablation and experiment design planning
      what_it_solves: Assesses how well models propose ablations from method sections
        or identify missing ablations in full papers.
      what_remains_open: Best LM systems recall only about 45% of original ablations,
        with inconsistent author-task versus reviewer-task behavior.
    - line: Failure-aware memory and iterative experiment reuse
      what_it_solves: Records failed attempts as typed negative knowledge and lets
        downstream research agents adopt or reject them before proposing the next
        experiment.
      what_remains_open: Demonstrated on ScienceAgentBench and PDE tasks; cross-domain
        transfer and long-term memory quality controls remain open.
    consensus:
    - 'The dominant framing is workflow decomposition: idea or hypothesis generation,
      experiment execution, analysis, and writeup are handled as separate but coupled
      stages.'
    - LLM-based or rubric-based evaluation is widely used to score research outputs
      because scalable human review is scarce.
    - Iterative feedback loops such as verification, reviewer feedback, failure memory,
      or tree search are treated as necessary for improving autonomous experiment
      quality.
    - Benchmarks and virtual environments are introduced because existing task settings
      fail to capture long-horizon discovery challenges.
    - Current systems remain below human-level on at least some experiment-planning
      and long-horizon discovery tasks.
    disagreements:
    - 'Scope differs: full end-to-end research generation versus narrow ablation or
      experiment planning versus task execution in simulated discovery environments.'
    - 'Evaluation target differs: LLM-rubric paper quality, peer-review acceptance,
      virtual task completion, or human and AI expert case-study preference.'
    - 'Interaction mode differs: fully autonomous pipelines, human-in-the-loop and
      customizable roles, or human principal investigator with agent collaborator.'
    - 'Search and planning mechanism differs: agentic tree search with an experiment
      manager, failure-aware negative memory, chain-of-thought prompting, or multi-agent
      verification.'
    - 'Deployment domain differs: applied mathematics, machine learning subfields,
      simulated science topics, internal AI research cases, and PDE tasks, creating
      different generalization expectations.'
    open_questions:
    - Can these systems consistently pass rigorous peer review beyond workshop-level
      or LLM-judged settings?
    - Do failure records and negative knowledge transfer across scientific domains
      and experimental modalities without task-specific curation?
    - Are LLM judges, task-completion metrics, and expert preference aligned with
      real scientific validity, reproducibility, and decision utility?
    - What code, dataset, artifact, baseline, and limitation details are missing from
      current evidence, and how do those gaps affect comparability?
    - Why do frontier LMs underperform humans on ablation planning and discovery completion,
      and which planning or feedback mechanisms close that gap?
    - Does automated experimentation in simulated or code-based settings transfer
      to lab-based and real-world experiment design and monitoring?
