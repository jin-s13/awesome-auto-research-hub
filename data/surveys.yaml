  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous scientific discovery agents
      what_it_solves: Automates hypothesis generation, code writing, experiment execution,
        visualization, and manuscript preparation as a continuous loop.
      what_remains_open: Output quality is inconsistent and often judged by automated
        rubrics rather than external human peer review; one-in-three workshop acceptance
        was reported.
    - line: Evaluation environments and benchmarks for discovery agents
      what_it_solves: Provides comparable tasks and metrics for complete discovery
        cycles, including task completion, task-relevant actions, and explanatory
        knowledge.
      what_remains_open: Synthetic or ML-benchmark success may not capture real scientific
        insight; in-the-wild gains can come mostly from ML-engineering tricks.
    - line: Failure-aware memory for iterative experimentation
      what_it_solves: Converts failed attempts into bounded, typed negative knowledge
        that downstream agents can adopt or reject, improving success while reducing
        tokens.
      what_remains_open: Evidence is limited to a retry benchmark and PDE tasks; generalization
        across broader scientific domains and memory types remains unverified.
    - line: Automated verification and review feedback loops
      what_it_solves: Adds internal logical audits, simulated review, or vision-language
        reviewer feedback to catch errors and improve generated papers or experiments.
      what_remains_open: Automated reviewers may not align with human judgment; optimizing
        for proxy review could inflate perceived quality without external validation.
    - line: Reproducible experiment orchestration infrastructure
      what_it_solves: Offers code harnesses, experiment managers, and multi-agent
        workflows that turn local codebases, datasets, and checkpoints into runnable
        experiments.
      what_remains_open: Platform maturity and external validation across hardware,
        datasets, and user settings are limited; some evaluations use only few internal
        case studies.
    consensus:
    - 'Autonomous research systems now cover substantial parts of the scientific loop:
      ideation, code execution, experiment management, result analysis, and manuscript
      production.'
    - Automated judges and benchmark metrics are the dominant evaluation mechanism,
      but they are used alongside human or peer-review cases only in limited settings.
    - Persistent memory or feedback from prior attempts improves agent performance
      and reduces repeated failures, as shown by negative knowledge and verification
      loops.
    - Current agents often struggle on open-ended discovery or in-the-wild scientific
      tasks despite strong performance on narrower coding or single-step tasks.
    - Verification and reproducibility artifacts are treated as key components, but
      the evidence for external validation is still thin.
    disagreements:
    - 'Scope: some systems target full manuscript generation, while others measure
      task completion in virtual environments or improvement over published benchmarks.'
    - 'Supervision and interaction: designs range from fully autonomous pipelines
      to human-principal-investigator/agent collaboration and interactive dashboards.'
    - 'Feedback mechanism: systems differ in using internal logical audits, simulated
      reviewers, vision-language reviewer feedback, or workshop peer review.'
    - 'Evaluation target: synthetic task completion, benchmark score improvement,
      and peer-review acceptance are not interchangeable proxies for scientific merit.'
    - 'Memory and state: some agents maintain failure-aware shared memory, while others
      rely on stateless or short-horizon generation and retries.'
    open_questions:
    - Do gains on synthetic discovery tasks or scientific ML benchmarks transfer to
      real laboratory experiments and novel domain discoveries?
    - Can automated reviewers align with human peer review without rewarding superficial
      paper quality or novelty miscalibration?
    - How much of reported improvement is attributable to engineering tricks, better
      infrastructure, or explicit failure memory rather than research-level insight?
    - What are the conditions under which negative knowledge transfers across tasks
      and domains, especially beyond retry and PDE settings?
    - Are the platforms and code harnesses externally reproducible across different
      hardware, datasets, and user settings beyond small internal case studies?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科学发现智能体
      解决的问题: 将假设生成、代码编写、实验执行、可视化和手稿撰写自动化成一个连续循环。
      尚未覆盖: 输出质量不稳定，常由自动评分而非外部人类同行评审判定；有报告称三篇中仅一篇通过工作坊评审。
    - 路线: 科学发现智能体的评测环境与基准
      解决的问题: 为完整发现循环提供可比较任务和指标，包括任务完成、任务相关动作和可解释知识。
      尚未覆盖: 合成或ML基准成功未必代表真实科学洞察；在真实基准上的提升可能主要来自ML工程技巧。
    - 路线: 面向迭代实验的失败感知记忆
      解决的问题: 把失败尝试转化为有界、类型化的负知识，下游智能体可采纳或拒绝，从而提升成功并降低token消耗。
      尚未覆盖: 证据仅限于重试基准和PDE任务；在更广泛科学领域和记忆类型上的泛化尚未验证。
    - 路线: 自动验证与评审反馈循环
      解决的问题: 引入内部逻辑审计、模拟评审或视觉语言模型反馈来发现错误并改进生成论文或实验。
      尚未覆盖: 自动评审可能与人类判断不一致；针对代理评审优化可能在缺乏外部验证时夸大质量。
    - 路线: 可复现实验编排基础设施
      解决的问题: 提供代码工具、实验管理器和多智能体工作流，把本地代码库、数据集和检查点变成可运行实验。
      尚未覆盖: 平台成熟度和跨硬件、数据集、用户设置的外部验证有限；部分评估只使用少量内部案例研究。
    共识:
    - 自主科研系统已覆盖科学循环的相当部分：提出想法、执行代码、管理实验、分析结果和撰写手稿。
    - 自动化评审和基准指标是主要评估机制，但只在有限场景中与人类或同行评审结合。
    - 来自先前尝试的持续记忆或反馈能提升智能体表现并减少重复失败，负知识和验证循环提供了证据。
    - 当前智能体在开放式发现或真实科学任务上仍常表现困难，尽管在较窄的编码或单步任务上表现较强。
    - 验证与可复现工件被视作关键组成部分，但外部验证证据仍然薄弱。
    分歧:
    - 范围：有的系统瞄准完整手稿生成，有的只衡量虚拟环境中的任务完成或对已发表基准的改进。
    - 监督与交互：设计从全自动流水线到人类首席研究员/智能体协作，以及交互式仪表板不等。
    - 反馈机制：系统分别使用内部逻辑审计、模拟评审、视觉语言模型反馈或工作坊同行评审。
    - 评估目标：合成任务完成、基准分数提升和同行评审接受度不能互相替代科学价值。
    - 记忆与状态：部分智能体维护失败感知共享记忆，另一些依赖无状态或短程生成与重试。
    开放问题:
    - 合成发现任务或科学ML基准上的提升能否迁移到真实实验室实验和新领域发现？
    - 自动评审能否与人类同行评审一致，而不奖励表面论文质量或新颖性误判？
    - 报告中的提升有多大程度来自工程技巧、更好基础设施或显式失败记忆，而不是研究级洞察？
    - 负知识在哪些条件下能跨任务和跨领域迁移，尤其是超出重试和PDE设置之后？
    - 这些平台和代码工具能否在不同硬件、数据集和用户设置上被外部复现，而非仅限于小型内部案例研究？
