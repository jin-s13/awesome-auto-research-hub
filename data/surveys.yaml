  related_work_outline:
  - 'Mainstream direction: Autonomous multi-agent pipelines that couple retrieval,
    verification, experiment or derivation, and paper generation, evaluated by LLM
    or human judges on scientific discovery tasks.'
  - 'Shared research pattern: Decompose scientific work into agent or module roles,
    then assess via blind tasks, rubric scores, or end-to-end manuscript outcomes;
    execution and documentation appear stronger than critical scientific judgment.'
  - 'Key differences: System-building work optimizes end-to-end generation and self-evolution,
    while evaluation work targets evidence maturity, human baselines, or failure-mode
    characterization; domains range from applied mathematics to single-cell biology
    to general ML.'
  - 'Trend evolution: Within a narrow 2025-2026 frontier, work moves from domain-focused
    benchmarks and surveys toward general evolving agent frameworks and critical audits
    of whether agents can support trustworthy claims.'
  - 'Open questions: Whether benchmark or rubric scores predict real discovery utility,
    whether single-model findings generalize across base models, and how to close
    verification gaps in long-horizon autonomous literature-to-paper pipelines.'
  related_work_outline_zh:
  - 主流方向：自主多智能体流水线，将检索、验证、实验或推导、论文生成结合起来，并通过LLM或人工评审在科学发现任务上进行评测。
  - 研究共性：将科学工作分解为智能体或模块角色，再用盲任务、评分标准或端到端手稿结果进行评测；执行和文档记录普遍强于关键科学判断。
  - 关键差异：系统构建工作优化端到端生成与自我演化，评测研究关注证据成熟度、人类基线或失败模式；领域覆盖应用数学、单细胞生物学到通用机器学习。
  - 趋势演进：在2025-2026较窄前沿内，研究从领域基准和综述走向通用演化智能体框架，并出现对智能体能否支撑可信主张的批判性审计。
  - 开放问题：基准或评分分数能否预测真实发现效用；单模型发现能否跨基座模型泛化；如何弥补长程自主文献到论文流程中的验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery workflows
      what_it_solves: Transforming literature synthesis, retrieval, derivation or
        experiment execution, verification, and manuscript writing into runnable multi-agent
        or self-evolving pipelines.
      what_remains_open: Long-horizon reliability, implementation drift, memory degradation,
        premature success declarations, and whether generated outputs reflect real
        discovery rather than task-specific rubric performance.
    - line: Blinded evidence-maturity evaluation
      what_it_solves: Comparing discovery agents on withheld conclusions or frozen
        data with automated or hybrid judges, sometimes adding expert human baselines
        in domain-specific settings.
      what_remains_open: Current results rely on one frozen base model or narrow domain
        tasks; proxy rubric dimensions may not align with real scientific utility
        or cross-model generalizability.
    - line: Failure-mode and challenge synthesis
      what_it_solves: Cataloging why autonomous research systems fail and identifying
        design principles, evaluation metrics, and open challenges across scientific
        domains.
      what_remains_open: Identified obstacles such as scientific taste, domain intelligence,
        and system reliability are documented but not yet converted into validated
        interventions or standardized audits.
    consensus:
    - Multi-agent decomposition is common, with literature synthesis, retrieval, verification,
      coding or derivation, evaluation, and writing assigned to separate agent or
      module roles.
    - Literature review and literature synthesis remain bottlenecks even in broader
      discovery workflows; systems can execute and document analyses better than they
      can exercise controls, robustness, falsifiability, and cross-dataset generalization.
    - Evaluation is moving toward blinded evidence-oriented tasks and automated or
      hybrid LLM judges rather than reproduction of hidden target results.
    disagreements:
    - One line treats end-to-end manuscript generation and benchmark success as the
      target, while another treats whether agents support evidence-grounded claims
      under blinded data as the key outcome.
    - Domain-specific biological evaluation uses expert human baselines and multiple-choice
      discovery tasks, whereas general evidence-maturity evaluation uses a fixed six-dimension
      automated judge and reports no reliable separation among coding agents.
    - Self-evolving domain-agnostic frameworks claim state-of-the-art benchmark gains,
      while failure-analysis work argues long-horizon execution, domain intelligence,
      and scientific taste remain unresolved regardless of benchmark score.
    open_questions:
    - Do evidence-maturity or generated-paper rubric scores predict peer-reviewed
      or real-world discovery utility beyond the bounded benchmark tasks?
    - How does agent performance generalize across multiple frozen base models, given
      current evidence from only one model?
    - Which verification and memory mechanisms can reduce implementation drift, context
      degradation, and premature success declarations in long-horizon autonomous research?
    - What human baseline and metric suite would make automated judges comparable
      across applied mathematics, biology, and general machine learning settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现工作流
      解决的问题: 把文献综合、检索、推导或实验执行、验证和论文撰写转化为可运行的多智能体或自演化流水线。
      尚未覆盖: 长程可靠性、实现漂移、记忆退化、过早宣称成功，以及生成结果是否代表真实发现而非任务特定评分表现。
    - 路线: 盲测证据成熟度评测
      解决的问题: 通过隐藏结论或冻结数据、使用自动化或混合评委比较发现智能体；部分领域加入专家人类基线。
      尚未覆盖: 当前结果依赖单一冻结基座模型或窄领域任务；代理评分维度未必对齐真实科学效用或跨模型泛化。
    - 路线: 失败模式与挑战综合
      解决的问题: 归纳自主研究系统失败原因，以及跨领域所需的设计原则、评估指标与开放挑战。
      尚未覆盖: 科学品味、领域智能和系统可靠性等问题已被记录，但尚未转化为经过验证的干预或标准化审计。
    共识:
    - 将科学发现分解为多个智能体或模块角色是常见做法，覆盖文献综合、验证、编码或推导、评估和论文写作。
    - 文献综述与文献综合在更广泛的发现工作流中仍是瓶颈；系统能较熟练地执行并记录分析，但在对照、稳健性、可证伪性、跨数据集泛化上仍较弱。
    - 评测正转向盲任务和面向证据的评分，而非复现隐藏目标结果；自动或混合LLM评判被用于评分。
    分歧:
    - 一条路线将端到端手稿生成和基准成功作为目标，另一条路线则把智能体在盲测数据下能否支撑证据化主张作为关键结果。
    - 领域特定的生物学评测使用专家人类基线和选择题式发现任务；通用证据成熟度评测使用固定的六维自动化评委，并报告编码智能体之间无统计可靠差异。
    - 自演化领域无关框架声称在通用基准上取得最先进提升，而失败分析研究认为长程执行、领域智能和科学品味无论分数高低仍未解决。
    开放问题:
    - 证据成熟度或生成论文评分能预测同行评审或真实世界发现效用吗？现有证据仅覆盖有限基准任务。
    - 当前结果仅来自单一冻结基座模型，能否在多个基座模型上泛化？
    - 哪些验证与记忆机制能减少自主研究中的实现漂移、上下文退化和过早成功宣称？
    - 需要什么样的人类基线和指标，使自动评委在应用数学、生物学和通用机器学习设定中具有可比性？
