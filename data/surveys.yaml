  related_work_outline:
  - 'Mainstream direction: Work is converging on scaffolds, benchmarks, and safety/evaluation
    layers for LLM scientific discovery agents rather than on demonstrated end-to-end
    discovery. Representative branches include DiscoveryWorld-style task suites, TruthInsightBench-style
    evidentiary evaluation, FirstResearch-style auditable question formation, and
    safety/execution loops such as LabEvolver and SciTrace.'
  - 'Shared research pattern: Papers assume LLM/coding agents can perform parts of
    scientific investigation but need external structure such as curated tasks, frozen
    data, evidence rubrics, certificates, vetted code libraries, memory, or safety
    gates to produce repeatable, auditable claims. Current agents are usually stronger
    at execution and documentation than at scientific judgment.'
  - 'Key differences: Work differs by target phase such as question formation, experiment
    execution, evaluation, or safety; by interaction setting such as simulated text/2D,
    single-GPU coding, or wet-lab robotics; by evaluation object such as task completion,
    evidence maturity, question auditability, experiment quality, or safety compliance;
    and by supervision signal such as automatic metrics, LLM judge, domain expert,
    or safety gate.'
  - 'Trend evolution: Within 2024 to 2026, the field moved from broad discovery-cycle
    environments such as DiscoveryWorld to narrower evidence and constraint benchmarks,
    then to scaffolds for auditable questions, vetted code libraries, memory, and
    trajectory-aware safety. This is mostly a frontier 2025 to 2026 shift rather than
    a long historical trend.'
  - 'Open questions: Whether LLM-judged evidence maturity aligns with human experts;
    whether agents can go beyond analysis execution to controls, robustness, falsifiability,
    and cross-dataset generalization; whether gains transfer across domains, base
    models, and from simulation to wet-lab settings; how to integrate safety without
    losing discovery capability; and what evidence supports genuine novelty versus
    reproduction.'
  related_work_outline_zh:
  - 主流方向：工作集中在为LLM科学发现智能体构建基准、可审计结构与安全/评测层，而非展示端到端真发现。代表性分支包括DISCOVERYWORLD式任务环境、TruthInsightBench式证据评估、FirstResearch式可审计提问，以及LabEvolver与SciTrace式安全执行闭环。
  - 研究共性：论文假设LLM/编码智能体能承担部分科学流程，但需外部结构，如精选任务、冻结数据、证据量表、结构化证书、经筛选代码库、记忆或安全门，才能产生可重复且可审计的主张。当前智能体更擅长执行与记录，而非科学判断。
  - 关键差异：路线在目标阶段、交互设置、评测对象和监督信号上不同。目标阶段包括问题形成、实验执行、评测和安全；交互设置包括模拟文本/2D、单GPU编码、湿实验室机器人；评测对象包括任务完成、证据成熟度、问题可审计性、实验质量或安全合规；监督信号包括自动指标、LLM裁判、领域专家或安全门。
  - 趋势演进：在2024至2026年内，领域从DISCOVERYWORLD式完整发现循环环境转向更窄的证据与约束基准，再进一步到可审计提问、经筛选代码库、经验记忆和轨迹感知安全，属于当前前沿内的演进。
  - 开放问题：LLM裁判的证据成熟度是否与人类专家一致；智能体能否从分析执行推进到对照、稳健性、可证伪性和跨数据集泛化；改进能否跨领域、基座模型和从模拟到湿实验室迁移；如何融入安全而不削弱发现能力；何种证据能支持真正新颖而非复现。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end scientific discovery environments and task benchmarks
      what_it_solves: Creates multi-topic task suites that measure an agent's ability
        to form hypotheses, run experiments, analyze results, and complete discovery
        cycles.
      what_remains_open: Automatic completion metrics may not capture evidence quality
        or true novelty, and task/domain coverage is limited.
    - line: Evidence-grounded evaluation and auditable question formation
      what_it_solves: Turns open-ended investigation into blind evidence-maturity
        judgments and structured research-question certificates with explicit assumptions
        and falsifiable hypotheses.
      what_remains_open: Evaluation depends on LLM judges with limited expert validation
        and is reported on a narrow base-model or domain sample.
    - line: Constrained coding and experiment execution infrastructure
      what_it_solves: Assesses or enhances end-to-end ML/scientific implementation
        under realistic resource limits and supplies vetted domain code examples for
        downstream experiment generation.
      what_remains_open: Task and domain coverage remains small; LLM-as-judge ratings
        show only moderate expert agreement; constraints may not generalize to real
        workflows.
    - line: Grounded and safety-aware agent loops
      what_it_solves: Adds state-grounded memory and trajectory-aware safety checks
        to reduce unsafe actions and improve task completion in wet-lab and tool-chain
        settings.
      what_remains_open: Reported safety and grounding gains lack broad domain/base-model
        validation, and some baseline or limitation information is missing.
    consensus:
    - 'Scientific discovery is modeled as a multi-stage agent process: forming questions,
      designing and executing experiments, interpreting evidence, and producing claims.'
    - Current LLM/coding agents can execute and document analyses but generally lack
      controls, robustness checks, falsifiability, and cross-dataset generalization
      needed for trustworthy claims.
    - External structure, including curated tasks, hidden or frozen data, evidence
      rubrics, research-question certificates, vetted code libraries, memory, and
      safety gates, improves auditability and repeatability over unstructured agent
      loops.
    - Automated LLM judging is becoming a scalable evaluation proxy, but available
      evidence treats human expert validation as still needed.
    disagreements:
    - 'Evaluation target differs: simulated task completion, blind evidence maturity,
      auditable research-question quality, end-to-end ML performance, or safety compliance.'
    - 'Interaction and deployment settings differ: text-based simulation with optional
      2D overlay, single-GPU code-only research, and wet-lab robotic or tool-chain
      execution.'
    - 'Supervision signals differ: automatic task metrics, deterministic LLM-judge
      rubrics, domain-expert ratings, safety-gate intercepts, and resource/time-constraint
      outcomes.'
    - 'What is controlled or frozen differs across studies: hidden conclusions and
      data, restricted internet/weights/time, locked evaluation scripts, environment
      state grounding, or cumulative risk state.'
    open_questions:
    - Does LLM-judged evidence maturity align strongly enough with human domain experts
      across diverse scientific disciplines?
    - Can scientific discovery agents move beyond competent analysis and documentation
      toward robust controls, falsification, and cross-dataset generalization?
    - How well do gains transfer across base models, scientific domains, and from
      simulated environments to resource-constrained or wet-lab settings?
    - Can trajectory-aware safety and memory improve grounded execution without reducing
      scientific output quality or exploratory capacity?
    - What automatic evidence can distinguish genuine novel discovery from analysis
      reproduction or plausible but unsupported claims?
