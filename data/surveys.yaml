  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous scientific writing
      what_it_solves: Generating complete research papers from idea to manuscript
        with minimal human input, reducing cost and time.
      what_remains_open: Inconsistent quality, low acceptance rates beyond workshop
        level, and lack of deep domain reasoning.
    - line: Multi-agent collaboration with verification gates
      what_it_solves: Improving reliability through internal verification loops, physics-aware
        checks, and structured debate, catching errors before final output.
      what_remains_open: Verification gates may miss certain failures, and the optimal
        level of agent interdependence is unclear.
    - line: Self-correction and failure attribution
      what_it_solves: Diagnosing root causes of experiment failures and routing corrections
        to the right component, increasing the rate of valid results.
      what_remains_open: Full autonomy in scientific writing remains unsolved; self-correction
        does not yet guarantee conference-ready papers.
    - line: Human-in-the-loop collaboration models
      what_it_solves: Integrating human oversight at strategic decision points to
        balance autonomy and quality, outperforming pure autonomy or exhaustive oversight.
