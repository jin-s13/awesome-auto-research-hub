  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agent systems
      what_it_solves: Covers the full research pipeline from idea generation, code
        or experiment execution, result analysis, and visualization to manuscript
        writing and simulated or peer review.
      what_remains_open: Consistency and trustworthiness of fully generated claims
        remain limited; acceptance or review thresholds are not stable across all
        submitted outputs.
    - line: Domain-specific AI scientist systems with verification gates
      what_it_solves: Embeds discipline-specific checks, such as logical coherence
        auditing for mathematical reasoning or vision-language physics verification
        for computational fluid dynamics, into the discovery loop.
      what_remains_open: Verification gates can miss silent failures; demonstrated
        improvements are narrow in domain, metric, and scenario coverage.
    - line: Virtual environments and benchmark tasks for discovery agents
      what_it_solves: Provides repeatable tasks, parametric variations, blind data,
        and automatic metrics for comparing scientific discovery behavior rather than
        reproduction of hidden target studies.
      what_remains_open: Whether virtual-task or LLM-judged scores correspond to real
        scientific utility and generalize across base models has not been established.
    - line: Iterative search and automated review
      what_it_solves: Uses agentic tree search, experiment management, and reviewer
        feedback loops to improve idea selection, experimental progression, and manuscript
        quality.
      what_remains_open: The pass rate can be inconsistent and has been demonstrated
        mainly at curated workshop-level or rubric-based review settings rather than
        broad conference-level validation.
    - line: Evidence-maturity evaluation
      what_it_solves: Measures whether agent-generated claims exhibit controls, robustness,
        falsifiability, auditability, novelty, and cross-dataset generalization.
      what_remains_open: Current coding agents score near the same plateau and largely
        lack discriminating scientific judgment; true discovery remains far beyond
        measured capability.
    consensus:
    - Systems generally decompose discovery into ideation, execution, analysis, and
      manuscript or claim generation.
    - Automated scoring or review is widely used, typically with LLM-based rubrics
      or simulated peer-review thresholds.
    - Execution and documentation are comparatively strong, while controls, robustness,
      falsifiability, and cross-dataset generalization are weak in evaluated agents.
    - Verification is increasingly treated as a required component, whether logical,
      physical, or evidentiary.
    disagreements:
    - 'Success criteria differ: peer-review acceptance, benchmark task completion,
      evidence-maturity scores, or domain metric improvement.'
    - 'Domain breadth differs: general machine learning workflows versus specialized
      applied mathematics or computational fluid dynamics loops.'
    - 'Interaction mode differs: human expert as principal investigator, fully autonomous
      operation, or benchmark-driven agent runs.'
    - 'Verification target differs: logical derivation checks, rendered flow-field
      physics checks, or LLM-judged evidence maturity.'
    open_questions:
    - Can domain-specific verification gates detect the silent failures they currently
      miss without over-constraining the discovery space?
    - Do benchmark scores and automated reviewers predict genuine scientific contribution
      beyond workshop paper acceptance or rubric performance?
    - How can agents be made to produce controls, robustness, falsifiability, and
      cross-dataset generalization instead of merely competent analysis?
    - How robust are these systems across different base models, domains, and task
      distributions when current benchmark results rely on limited frozen model settings?
