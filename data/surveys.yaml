  literature_review:
    line_of_work_matrix:
    - line: End-to-end automated research frameworks
      what_it_solves: Completes the full scientific discovery loop—from hypothesis
        generation and coding to experimentation and manuscript writing—with minimal
        human intervention, lowering the cost and effort of producing research papers.
      what_remains_open: Output quality is inconsistent; only a fraction of generated
