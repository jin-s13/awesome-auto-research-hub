  related_work_outline:
  - 'Mainstream direction: Building closed-loop autonomous research agents that generate
    hypotheses, execute experiments, verify results, and write reports; representative
    examples include AI CFD Scientist, AutoResearchClaw, and EvoCast.'
  - 'Shared research pattern: Idea generation is increasingly grounded in experimental
    evidence, dataset diagnostics, prior failures, or literature, then constrained
    by verification or reporting gates to reduce hallucination.'
  - 'Key differences: Systems split between domain-embedded validity gates and domain-agnostic
    frameworks; evaluation ranges from real discovery tasks with human baselines,
    expert-judged case studies, to broad reasoning exams; interaction ranges from
    full autonomy to targeted human oversight.'
  - 'Trend evolution: Available evidence is concentrated in 2025-2026, showing a frontier
    shift from surveys and AI-scientist evaluation toward self-correcting, self-evolving,
    human-collaborative research pipelines.'
  - 'Open questions: Whether proxy evaluations predict real discovery utility; which
    verification signals catch silent failures; how to attribute gains among ideation,
    execution, and base models; what human intervention granularity is optimal.'
  related_work_outline_zh:
  - 主流方向：构建闭环自主研究智能体，从假设生成走向可执行实验、验证和报告撰写，如 AI CFD Scientist、AutoResearchClaw、EvoCast。
  - 研究共性：想法生成越来越多依赖实验证据、数据诊断、历史失败或文献，并通过验证或报告约束减少幻觉。
  - 关键差异：系统在领域内嵌有效性门与领域无关框架之间分化；评测从带人类基线的真实发现任务、专家评审案例到广泛推理考试不等；交互模式从全自主到精准人类监督。
  - 趋势演进：证据集中在2025-2026前沿，显示从综述与智能体评测转向自纠正、自演化和人机协作研究流水线。
  - 开放问题：代理评测是否能预测真实科学发现效用；哪些验证信号能捕获静默失败；如何区分想法生成、执行和基座模型的增益；最佳人类介入粒度是什么。
  literature_review:
    line_of_work_matrix:
    - line: Closed-loop autonomous research pipelines
      what_it_solves: Turning hypothesis generation into runnable experiments, code
        edits, verified outputs, and reports rather than isolated idea proposals.
      what_remains_open: Validation is often narrow; silent-failure detection and
        cross-domain generalization are not yet established.
    - line: Evidence-grounded direction generation and failure attribution
      what_it_solves: Using diagnostics, ablations, prior rounds, and causal failure
        explanations to select or correct hypotheses.
      what_remains_open: Coverage of failure modes and correctness of intervention
        routing beyond tested topics remain open.
    - line: Domain-specific scientific discovery with embedded constraints
      what_it_solves: Embedding domain validity checks such as flow-field inspection
        or biological task design into idea generation.
      what_remains_open: Imperfect gates miss some planted failures; transfer to other
        domains is unclear.
    - line: Evaluation and human baseline construction for autonomous research claims
      what_it_solves: Making claims comparable through tasks, human baselines, expert
        judgment, and blind scoring.
      what_remains_open: Proxy metrics do not yet show agreement with real discovery
        utility or broad domain coverage.
    - line: Interactive human-AI multi-agent research platforms
      what_it_solves: Providing customizable roles, monitoring, rollback/resume, and
        targeted human intervention modes.
      what_remains_open: Optimal intervention granularity and external validation
        beyond internal case studies are unresolved.
    - line: Self-evolving domain-agnostic frameworks
      what_it_solves: Using self-critique and accumulated knowledge to scale autonomous
        research across disciplines.
      what_remains_open: Gains are not cleanly attributed among framework design,
        base model ability, and chosen evaluation suites.
    consensus:
    - Current systems converge on a generate-execute-verify-report loop rather than
      isolated idea generation.
    - Grounding and verification are widely used to reduce fabricated results or hallucinated
      citations.
    - Experimental feedback, ablations, or failure records are treated as first-class
      inputs for subsequent hypotheses.
    - Full autonomy still falls short; human baselines, expert oversight, or human-in-the-loop
      modes remain necessary evidence.
    disagreements:
    - 'Verification strategy differs: some embed domain-specific validity gates, others
      use deterministic code authorities or report constraints, and others rely on
      learned self-critique.'
    - 'Evaluation target differs: real biological discovery questions with human baselines,
      expert-judged case studies, and broad reasoning or coding exams are all used.'
    - 'Interaction and deployment differ: full autonomous pipelines, targeted human
      intervention at decision points, and interactive customizable multi-agent platforms
      coexist.'
    - 'Abstraction level differs: task-specific scientific discovery systems are built
      alongside domain-agnostic self-evolving frameworks.'
    open_questions:
    - Which verification signals are necessary and sufficient to catch silent experimental
      failures across domains?
    - Do current evaluation scores or expert preferences predict real scientific discovery
      utility?
    - How should gains be attributed among hypothesis generation, execution, task-specific
      priors, and base model capabilities?
    - What is the most effective granularity of human oversight without adding exhaustive
      oversight cost?
    - Can evidence-grounded failure attribution scale beyond a small set of topics
      and domains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 闭环自主研究流水线
      解决的问题: 将假设生成转化为可运行实验、代码修改、验证输出和报告，而不是孤立提出想法。
      尚未覆盖: 验证多为窄案例；静默失败检测和跨领域泛化尚未建立。
    - 路线: 基于证据的方向生成与失败归因
      解决的问题: 利用诊断、消融、历史轮次和因果失败解释来选择或纠正假设。
      尚未覆盖: 失败模式覆盖范围以及在测试主题之外的干预路由正确性仍未解决。
    - 路线: 领域约束下的科学发现
      解决的问题: 在想法生成中嵌入流场检查或生物学任务设计等领域有效性检查。
      尚未覆盖: 不完美的门会漏检部分已植入失败，跨领域迁移尚不清晰。
    - 路线: 自主研究系统的评测与人类基线构建
      解决的问题: 通过任务、人类基线、专家评审和盲评使自主研究声明可比较。
      尚未覆盖: 代理指标尚未显示与真实发现效用或广泛领域覆盖一致。
    - 路线: 交互式人机多智能体研究平台
      解决的问题: 提供可定制角色、监控、回滚/恢复和定向人类干预模式。
      尚未覆盖: 最佳干预粒度及内部案例之外的外部验证仍未解决。
    - 路线: 领域无关的自演化框架
      解决的问题: 通过自我批判和知识积累跨学科扩展自主研究系统。
      尚未覆盖: 框架设计、基座模型能力与评测套件之间的增益尚未清晰归因。
    共识:
    - 当前系统收敛到生成-执行-验证-报告闭环，而不是孤立提出想法。
    - 普遍使用证据约束或验证来减少伪造数字与幻觉引用。
    - 实验反馈、消融和失败记录成为后续假设生成的重要输入。
    - 完全自主仍不足，人类基线或专家监督仍是关键证据来源。
    分歧:
    - 验证策略不同：有的嵌入领域特定有效性门，有的使用确定性代码权威或报告约束，有的依赖自批判。
    - 评测目标不同：有带人类基线的真实生物学发现题、有专家评审案例，也有广泛推理或编码考试。
    - 交互与部署不同：包含全自主流水线、关键节点人类干预，以及可交互自定义多智能体平台。
    - 抽象层次不同：任务特定的科学发现系统与领域无关的自演化框架并存。
