  literature_review:
    line_of_work_matrix:
    - line: Standardized benchmarking of AI scientists
      what_it_solves: Provides task suites, metrics, and human baselines to make the
        capability of autonomous research agents comparable across diverse scientific
        domains.
      what_remains_open: Whether proxy metrics (task completion, answers to multiple-choice
        questions) align with the true utility of scientific discovery, and whether
        the benchmarks transfer to open-ended real-world research.
    - line: Reliability enforcement through verification gates and failure attribution
      what_it_solves: Reduces silent failures and hallucinations in autonomous experiments
        by injecting physics-aware validity checks, multi-hypothesis causal diagnosis,
        and grounded reporting that constrains outputs to measured values.
      what_remains_open: Generalization to unforeseen failure modes outside the design
        range of the verification components, and the risk of false positives that
        could incorrectly block valid exploratory directions.
    - line: Infrastructure for multi-agent autonomous research
      what_it_solves: Turns isolated research ideas into runnable, monitorable, and
        reproducible workflows with customizable roles, code harnesses, and real-time
        dashboards, enabling collaborative AI research teams.
      what_remains_open: Standardized external validation across hardware, datasets,
        and user settings; platform maturity for long-horizon, high-stakes scientific
        investigations.
    - line: Empirical failure analysis and design principles for LLM-based research
        agents
      what_it_solves: Identifies recurring failure modes (e.g., implementation drift,
        memory degradation, overexcitement) and derives design principles to guide
        the construction of more robust autonomous research systems.
      what_remains_open: Direct empirical validation that the proposed design principles
        predict and prevent failures in novel systems, and whether the taxonomy covers
        all critical failure categories.
    consensus:
    - Autonomous AI research agents consistently underperform on tasks requiring multi-step
      hypothesis testing and experimental design, as shown by dedicated benchmarks.
    - Structured verification—whether through vision-language physics gates, multi-hypothesis
      failure attribution, or simulated review—is essential to improve the reliability
      of generated results.
    - Reproducibility and code artifacts are key concerns; systems that incorporate
      code harnesses and execution feedback loops produce more trustworthy outputs.
    - End-to-end paper generation remains prone to hallucinations and lack of scientific
      rigor, requiring explicit mechanisms to constrain claims to measured evidence.
    disagreements:
    - 'Evaluation environments differ in abstraction: virtual text-based worlds with
      parametric variation versus real biological datasets with expert-annotated labels,
      leading to different conclusions about agent capability.'
    - Verification strategies vary from post-hoc visual inspection of rendered flow
      fields to causal root-cause analysis of execution trajectories, implying different
      assumptions about where failures originate.
    - 'Autonomy level varies: some platforms aim for fully automated research with
      no human intervention, while others provide interactive dashboards for human
      monitoring and rollback.'
    - 'Success criteria differ: some works target task completion scores on a benchmark,
      others aim for peer-reviewed workshop acceptance, and others measure artifact
      quality and metrics-bearing output rates.'
    open_questions:
    - How can verification mechanisms be designed to detect silent failures that fall
      outside pre-specified validity checks without overly restricting the agent's
      exploratory freedom?
    - What governance frameworks are needed to oversee long-running autonomous research
      cycles, particularly when they interact with real-world lab equipment or generate
      potentially harmful knowledge?
    - To what extent do current benchmark metrics correspond to meaningful scientific
      progress, and how can we develop evaluation protocols that reward genuine novelty
      rather than benchmark overfitting?
  literature_review_zh:
    研究路线矩阵:
    - 路线: AI科学家的标准化基准测试
      解决的问题: 通过任务套件、指标和人类基线，使自主研究智能体的能力在不同科学领域间具有可比性。
      尚未覆盖: 代理指标（任务完成度、选择题答案）是否与科学发现的真实效用对齐，以及基准能否迁移到开放式的真实世界研究。
    - 路线: 通过验证门控与失败归因实现可靠性增强
      解决的问题: 通过注入物理感知的正确性检查、多假设因果诊断和将输出约束为测量值的扎实报告，减少自主实验中的静默失败和幻觉。
      尚未覆盖: 对验证组件设计范围之外的未知失败模式的泛化能力，以及可能错误阻断有效探索方向的假阳性风险。
    - 路线: 多智能体自主研究基础设施
      解决的问题: 将孤立的研究想法转化为可运行、可监控、可复现的工作流，配备可定制角色、代码工具和实时仪表板，实现协作式AI研究团队。
      尚未覆盖: 跨硬件、数据集和用户设置的标准化外部验证；平台在长周期、高利害科学研究中的成熟度。
    - 路线: 基于LLM的研究智能体的经验性失败分析与设计原则
      解决的问题: 识别重复出现的失败模式（如实现漂移、记忆退化、过度兴奋），并推导设计原则，以指导构建更稳健的自主研究系统。
      尚未覆盖: 提出的设计原则能否在新系统中预测和预防失败的直接实证验证，以及该分类法是否覆盖所有关键失败类别。
    共识:
    - 自主AI研究智能体在需要多步假设检验和实验设计的任务上普遍表现不佳，专用基准已证实这一点。
    - 结构化验证——无论是通过视觉-语言物理门控、多假设失败归因还是模拟评审——对于提升生成结果的可靠性至关重要。
    - 可复现性和代码工件是关键关注点；集成代码工具和执行反馈循环的系统能产生更可信的输出。
    - 端到端论文生成仍容易产生幻觉和缺乏科学严谨性，因此需要明确机制将主张约束在实际测量证据上。
    分歧:
    - 评估环境在抽象程度上存在差异：基于文本参数变化的虚拟世界与真实生物数据集加专家标注，导致对智能体能力得出不同结论。
    - 验证策略各异：从对渲染流场的事后视觉检查到对执行轨迹的因果根因分析，隐含着对失败来源的不同假设。
    - 自主程度不同：部分平台旨在无人干预的全自动研究，另一些则提供交互式仪表板供人类监控和回滚。
    - 成功标准不同：部分工作以基准任务完成分数为目标，其他以同行评审工作坊接收为目标，还有以工件质量和含指标输出率为目标。
    开放问题:
    - 如何设计验证机制，既能检测超出预设正确性检查的静默失败，又不过度限制智能体的探索自由？
    - 需要何种治理框架来监督长期运行的自主研究循环，尤其是当它们与真实世界实验室设备交互或可能生成有害知识时？
    - 当前基准指标在多大程度上对应于有意义的科学进步，如何开发能奖励真正新颖性而非基准过拟合的评估协议？
