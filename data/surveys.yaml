  related_work_outline_zh:
  - 主流方向：构建自主多智能体科学实验系统，从研究想法或提示出发，完成代码执行、实验管理、论文撰写以及自动或同行评审。
  - 研究共性：形成“发现—执行—分析—撰写—评审”的闭环，并通过验证、树搜索、记忆或监控从失败中恢复并改进后续动作。
  - 关键差异：自主程度与人类角色不同；评测目标包括虚拟发现任务、已发表科学机器学习基准提升、工作坊同行评审和内部案例研究；可靠性机制各异。
  - 趋势演进：2024年出现全自动框架和虚拟发现基准，2025年出现树搜索与工作坊同行评审，2026年更多是多智能体协作、失败记忆和真实科学ML评测；年份跨度窄，属于前沿趋势。
  - 开放问题：自动代理指标与人类科学价值是否一致；系统能否跨领域跨案例泛化；提升中有多少来自工程技巧而非科学洞察；以及缺少哪些制品和外部验证。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery and manuscript-generation systems
      what_it_solves: Converting a broad research prompt into ideation, coding, experiments,
        visualization, full paper writing, and simulated or peer review.
      what_remains_open: Whether generated papers represent durable scientific contribution
        rather than one-off acceptance, and whether systems can consistently pass
        full conference peer review.
    - line: Multi-agent orchestration and human-in-the-loop research teams
      what_it_solves: Decomposing scientific labor into customizable roles, while
        supporting monitoring, rollback/resume control, human oversight, and shared
        memory.
      what_remains_open: Maturity beyond small internal case studies, cross-task generalization
        of roles and memory, and standardized operational evaluation.
    - line: Virtual environments and scientific ML benchmarks for discovery agents
      what_it_solves: Measuring agents on hypothesis formation, experiment design,
        task completion, and improving published scientific ML best models under long-horizon
        conditions.
      what_remains_open: Alignment between task metrics and true scientific insight,
        coverage of diverse scientific domains, novelty calibration, and preventing
        engineering-only gains.
    - line: Failure-aware knowledge and verification mechanisms
      what_it_solves: Capturing failed attempts or auditing logical coherence so agents
        can avoid repeated errors and improve subsequent proposals.
      what_remains_open: Whether verification or negative knowledge transfers across
        problems and whether it improves theoretical or domain reasoning beyond evaluated
        PDE and ScienceAgentBench settings.
    - line: Reproducible experimentation infrastructure and code harnesses
      what_it_solves: Connecting local code, datasets, checkpoints, and execution
        artifacts into agent workflows so experiments become runnable and inspectable.
      what_remains_open: External validation across hardware, datasets, and user settings,
        plus code/artifact releases and clearer limitation reporting.
    consensus:
    - Research agents are converging on a closed loop of proposing, executing, analyzing,
      writing, and reviewing or verifying scientific work.
    - Automatic or LLM-based review and metrics are widely used to evaluate output,
      but evidence so far is mainly from rubric alignment or case-study judgments.
    - Single-shot generation is treated as insufficient; systems commonly add verification,
      tree search, failure memory, or human monitoring to improve robustness.
    - Current evidence shows agents can improve benchmarks or pass acceptance thresholds,
      but reported gains often depend on engineering, retrieval, or execution rather
      than domain novelty.
    disagreements:
    - 'Autonomy mode differs: fully automated manuscript generation versus human-as-principal-investigator
      supervision versus interactive dashboard-based team control.'
    - 'Evaluation target differs: virtual discovery task completion versus improving
      published scientific ML benchmarks versus manuscript acceptance or review scores
      versus judge preference in case studies.'
    - 'Reliability mechanism differs: internal logic verification versus failure-aware
      shared memory versus progressive tree search with VLM review versus rollback
      and resume infrastructure.'
    - 'Success criteria differ: threshold acceptance or benchmark improvement versus
      evidence of scientific insight or cross-task generalization.'
    open_questions:
    - Do automatic metrics and LLM review truly reflect scientific contribution and
      human decision utility?
    - Can systems maintain consistency beyond isolated accepted papers or small case
      studies and extend to full conference settings?
    - How much of observed improvement is transferable domain insight rather than
      ML engineering tricks?
    - Do verification and negative-knowledge mechanisms generalize beyond the evaluated
      PDE and ScienceAgentBench cases?
    - What code, dataset, and limitation evidence is missing for reproducible validation
      across hardware and user settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现与论文写作系统
      解决的问题: 把宽泛研究提示转化为想法提出、代码实验、可视化、完整论文和自动或同行评审闭环。
      尚未覆盖: 生成论文是否代表持久科学贡献而非一次性接受，以及系统能否持续通过完整会议同行评审。
    - 路线: 多智能体编排与人在回路研究团队
      解决的问题: 将科学劳动分解为可定制角色，支持监控、回滚/恢复、人类监督和共享记忆。
      尚未覆盖: 超越小规模内部案例的成熟度、角色与记忆的跨任务泛化以及标准化运行评测。
    - 路线: 科学发现虚拟环境与基准评测
      解决的问题: 用虚拟任务或已发表科学ML基准测量智能体的假设形成、实验设计、任务完成和模型改进能力。
      尚未覆盖: 任务指标与真实科学洞察的一致性、多样科学领域覆盖、新颖性校准以及防止纯工程收益。
    - 路线: 失败感知知识与逻辑验证机制
      解决的问题: 记录失败尝试或审计逻辑一致性，避免重复错误并改进后续实验提议。
      尚未覆盖: 验证或负知识是否跨问题迁移，是否在已评测的PDE和ScienceAgentBench之外提升理论或领域推理。
    - 路线: 可复现实验基础设施与代码工具
      解决的问题: 将本地代码、数据集、检查点和执行工件接入智能体工作流，使实验可运行、可检查。
      尚未覆盖: 跨硬件、数据集和用户设置的外部验证，代码与工件发布，以及更清晰的局限性说明。
    共识:
    - 研究智能体正在收敛到“提议—执行—分析—撰写—评审/验证”的闭环流程。
    - 自动或LLM评审与指标被广泛用于评测产出，但现有证据多来自评分标准对齐或案例研究判断。
    - 单次生成被认为不够，系统普遍增加验证、树搜索、失败记忆或人工监控来提高稳健性。
    - 当前证据显示智能体能提升基准或达到阈值，但收益常依赖工程、检索或执行而非领域新颖性。
    分歧:
    - 自主模式不同：完全自动生成论文、人类担任首席研究员监督、或交互式仪表板团队控制。
    - 评测目标不同：虚拟发现任务完成、提升已发表科学ML基准、论文接受或评审分数、内部案例的评审员偏好。
    - 可靠性机制不同：内部逻辑验证、失败感知共享记忆、渐进树搜索加VLM评审、或回滚与恢复基础设施。
    - 成功标准不同：阈值接受或基准提升，还是真正的科学洞察或跨任务泛化。
    开放问题:
    - 自动指标和LLM评审是否真正反映科学贡献和人类决策效用？
    - 系统能否在孤立的接受论文或小案例之外保持一致性，并扩展到完整会议环境？
    - 观察到的改进有多少是可迁移的领域洞察，而非机器学习工程技巧？
    - 验证与负知识机制能否超越已评测的PDE和ScienceAgentBench任务实现泛化？
    - 还缺少哪些代码、数据集和局限性证据以支持跨硬件和用户的外部验证？
