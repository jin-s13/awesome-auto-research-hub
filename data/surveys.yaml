      verification; the former generalizes easier, the latter catches more silent
      failures.
    - 'The role of human input: one line treats the human as a principal investigator
      who only sets high-level goals, while another advocates for multiple intervention
      modes from fully autonomous to step-by-step oversight.'
    - 'Evaluation methodology: simulated reviewer scores, benchmark task completion,
      and real workshop peer review each lead to different conclusions about system
      capability and readiness.'
    open_questions:
    - To what extent can an AI scientist system transfer from one scientific domain
      to another without re-engineering its verification and knowledge retrieval components?
    - How should the research community validate that an AI-generated paper's experimental
      results are reproducible and not the product of data leakage or stochastic parroting?
    - What is the most effective mode and frequency of human interaction for improving
      research outcomes without undermining the autonomy gains?
