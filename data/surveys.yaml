  related_work_outline:
  - 'Mainstream direction: Automated literature intelligence is converging on agentic
    workflows that combine retrieval, synthesis, verification, and paper generation,
    increasingly evaluated through blind evidence-maturity tasks and LLM-based review
    rubrics.'
  - 'Shared research pattern: Papers decompose literature or discovery work into agents/stages
    such as retrieval, claim formation, analysis, drafting, and verification, replacing
    or augmenting human review with automated evidence scoring.'
  - 'Key differences: One line optimizes end-to-end synthesis and paper generation
    under rubric scoring; another scores blind evidence support for open-ended claims;
    a third builds taxonomies and failure-mode findings; a fourth supplies self-evolving
    reusable frameworks.'
  - 'Trend evolution: Within the 2023–2026 span, high-ranking evidence concentrates
    in 2025–2026, shifting from capability surveys and system demonstrations toward
    evidence-grounded discovery tasks, verification loops, and self-evolving agent
    infrastructure.'
  - 'Open questions: Whether LLM judges track expert review, what controls and falsifiability
    are needed, cross-base-model and cross-domain generalization, and how much performance
    comes from the framework versus base model or task-specific prior remain unresolved.'
  related_work_outline_zh:
  - 主流方向：自动化文献智能正收敛到将检索、综合、验证与论文生成结合起来的智能体工作流，并越来越多通过盲证据任务和LLM评审rubric进行评估。
  - 研究共性：多数论文把检索、主张形成、分析、草拟、验证拆为多阶段或智能体，并用自动证据评分替代或增强人工评审。
  - 关键差异：生成端优化端到端综合与论文生成，评测端关注盲证据支持与证据成熟度，综述/案例强调分类与失败模式，基础设施端提供可复用自演化框架。
  - 趋势演进：在2023–2026窗口内，高排名证据集中在2025–2026，显示从能力综述、系统演示转向证据锚定任务、验证循环和自演化基础设施。
  - 开放问题：LLM评审是否与专家评审一致、需要哪些对照与可证伪性、跨基座模型与跨领域泛化、以及性能多大程度来自框架而非基座模型或任务先验仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous literature synthesis and paper-generation agents
      what_it_solves: Integrates retrieval, synthesis, derivation or analysis, drafting,
        and verification into an end-to-end workflow with reduced expert intervention.
      what_remains_open: Whether outputs satisfy rigorous scientific or logical standards
        beyond curated LLM rubrics; domain depth, external code/artifact signals,
        and reproducibility remain unclear.
    - line: Evidence-grounded evaluation of discovery and literature claims
      what_it_solves: Uses blind tasks, frozen data, and automated judges to score
        evidence maturity for open-ended claims in a repeatable way.
      what_remains_open: Cross-base-model and cross-domain generalization are not
        established; current agents largely lack controls, robustness, falsifiability,
        and cross-dataset validation.
    - line: Survey taxonomy and failure-mode characterization
      what_it_solves: Organizes agentic research and literature-review capabilities,
        metrics, frameworks, datasets, and recurring failure patterns.
      what_remains_open: Literature review automation reliability, ethical concerns,
        and direct empirical validation that the proposed categories predict system
        behavior remain unresolved.
    - line: Self-evolving agent infrastructure
      what_it_solves: Provides domain-agnostic, reusable frameworks for iterative
        hypothesis refinement, self-critique, and knowledge accumulation across cycles.
      what_remains_open: Standardized external validation across hardware, datasets,
        and user settings is missing; framework contribution is hard to separate from
        base model or task-specific priors.
    consensus:
    - 'Work is staged or multi-agent: retrieval, analysis, verification, and drafting
      are separated, with internal critique or verification loops.'
    - Automated evidence scoring is treated as repeatable and comparable, reducing
      per-instance human grading.
    - Current systems execute and document analyses more reliably than they test controls,
      robustness, or falsifiability.
    disagreements:
    - 'Evaluation target differs: generated-paper rubric scores, blind evidence support
      for open-ended claims, or domain-specific annotation and multiple-choice decisions
      with human baselines.'
    - 'Interaction and supervision differ: human principal investigator plus agents,
      autonomous coding agents, or multi-agent pipelines with artifacts.'
    - 'Claim type differs: full research papers and discovery outputs versus explicitly
      scored evidentiary decisions and failure-mode case studies.'
    - Deployment setting ranges from domain-specific omics data to domain-agnostic
      reusable frameworks, so assumptions about data and expertise differ.
    open_questions:
    - How well do automated LLM judges track expert peer review and literature-synthesis
      quality?
    - What controls, robustness analyses, and falsifiability checks are required before
      agent-generated reviews or discoveries are trustworthy?
    - How much of the reported performance comes from the agent framework rather than
      the frozen base model, filtered data, or task-specific priors?
    - Can literature review automation become reliable enough for systematic reasoning
      without continuous expert intervention?
    - How can evidence-grounded evaluation expand beyond single datasets or domains
      and avoid score saturation among coding agents?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主文献综合与论文生成智能体
      解决的问题: 将检索、综合、推导或分析、草稿与验证整合为低人工干预的端到端文献或发现流程。
      尚未覆盖: 生成结果是否在自动评审rubric之外仍满足严格科学或逻辑标准；领域深度、外部代码或工件和可复现性仍不明确。
    - 路线: 证据锚定的发现与文献主张评测
      解决的问题: 用盲任务、冻结数据和自动裁判对开放性主张的证据成熟度进行可重复评分。
      尚未覆盖: 跨基座模型和跨领域泛化未确立；当前智能体普遍缺乏对照、稳健性、可证伪性和跨数据集验证。
    - 路线: 综述分类与失败模式刻画
      解决的问题: 整理智能体科研或文献评审能力、指标、框架、数据集及重复失败模式。
      尚未覆盖: 文献综述自动化的可靠性、伦理问题，以及所提分类能否预测系统行为仍缺少直接实证验证。
    - 路线: 自演化智能体基础设施
      解决的问题: 提供领域无关、可复用框架，支持迭代假设优化、自我批判与跨周期知识积累。
      尚未覆盖: 跨硬件、数据集和用户设置的标准化外部验证缺失；难以分离框架本身与基座模型或任务先验的贡献。
    共识:
    - 多数论文将检索、分析、验证和草拟拆分为多阶段或多智能体，并引入验证或自我批判循环。
    - 自动证据评分被视为可重复、可比较信号，以减少逐实例人工评分。
    - 当前系统在分析执行和文档化上较强，但未稳定展示可信的科学或文献发现能力。
    分歧:
    - 评测目标不同：生成论文的LLM rubric评分、盲任务证据支持度、领域选择题或注释与人类基线。
    - 监督与交互不同：人类PI与智能体协同、自主编码智能体、多智能体流水线。
    - 产出类型不同：完整论文或发现输出，对比可打分的证据决策；部署从领域专用数据到领域无关框架。
    开放问题:
    - 自动LLM评审在多大程度上跟踪专家同行评审和文献综合质量？
    - 需要哪些对照、稳健性分析和可证伪性检查，智能体生成的综述或发现才算可信？
    - 报告性能有多大比例来自智能体框架，而非冻结基座模型、筛选数据或任务先验？
    - 文献综述自动化能否在专家持续干预较少时达到系统推理所需的可靠性？
    - 证据锚定评测如何扩展到更多数据或领域，并避免编码智能体分数饱和？
