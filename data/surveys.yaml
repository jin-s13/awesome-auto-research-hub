  related_work_outline:
  - 'Mainstream direction: Agentic systems that automate literature search, reading,
    synthesis, and manuscript generation, increasingly embedding literature intelligence
    inside broader discovery pipelines with verification or self-evolution.'
  - 'Shared research pattern: Research and literature workflows are broken into stages
    such as retrieval, synthesis, analysis, and drafting, then scored by LLM rubrics,
    blind evidence-maturity tasks, or human baselines.'
  - 'Key differences: Work targets differ: domain-focused knowledge retrieval and
    verification, domain-agnostic self-evolving frameworks, evidence-grounded benchmarks,
    or failure diagnosis; optimization signals differ accordingly.'
  - 'Trend evolution: The packet shows no 2023-2024 top-paper evidence for this topic;
    visible evolution runs from 2025 surveys and frameworks to 2026 blind benchmarks,
    failure analyses, and self-evolving frameworks, concentrated in the current frontier.'
  - 'Open questions: Alignment between automated judges and real literature insight,
    generalization beyond narrow base models and domains, and prevention of long-horizon
    reliability failures remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建智能体系统，自动化文献检索、阅读、综合和论文生成，并越来越多地将文献智能嵌入更广泛的发现流水线中，加入验证或自我演化。
  - 研究共性：将科研或文献工作流拆分为检索、综合、分析和撰写等阶段，并用LLM评审、盲测证据成熟度任务或人类基线进行评分。
  - 关键差异：工作目标不同：领域相关的知识检索与验证、领域无关的自我演化框架、证据锚定基准或失败诊断；优化信号也相应不同。
  - 趋势演进：证据包中未显示2023-2024年的顶级论文证据；可见演进从2025年的综述与框架转向2026年的盲测基准、失败分析和自我演化框架，集中在前沿阶段。
  - 开放问题：自动化评审与真实文献洞察的一致性、跨基座模型与领域的泛化性、以及长程可靠性问题的预防仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Knowledge-grounded literature synthesis and manuscript generation
      what_it_solves: Automates retrieving and condensing literature and drafting
        structured reviews or research papers with internal verification and self-improvement.
      what_remains_open: Fidelity of synthesized claims beyond demonstrated examples,
        coverage across diverse literature domains, and reduction of human verification
        burden remain open.
    - line: Evidence-grounded benchmarking of research and discovery agents
      what_it_solves: Turns peer-reviewed studies into blind tasks with frozen data
        and automated LLM scoring to compare claim-evidence maturity and biological
        discovery support.
      what_remains_open: Findings rely on a few frozen base models and curated tasks;
        alignment of proxy scores with real discovery utility and broader domain coverage
        is unproven.
    - line: Reusable self-evolving agent frameworks
      what_it_solves: Lowers the cost of building domain-specific scientific agents
        and enables iterative hypothesis refinement, self-critique, and knowledge
        accumulation.
      what_remains_open: Long-horizon reliability, memory degradation, implementation
        drift, and external validation across hardware, data, and user settings remain
        unresolved.
    - line: Failure analysis and design principle synthesis
      what_it_solves: Documents recurring failure modes from end-to-end attempts and
        distills design guidance for more robust automated research workflows.
      what_remains_open: Whether these categories and design principles predict behavior
        across tasks, domains, and base models lacks direct empirical validation.
    consensus:
    - Systems remain assistive rather than fully autonomous; human supervision or
      human baselines are still used to judge quality.
    - Evaluation is shifting toward evidence-grounded, automated, and repeatable protocols
      because manual review does not scale.
    - Current agents are strongest at execution, documentation, and auditability,
      while scientific judgment, falsifiability, and control design are weak.
    - Multi-stage decomposition of scientific and literature workflows is a shared
      architectural pattern.
    disagreements:
    - 'Evaluation target differs: generated manuscript quality versus evidence maturity
      on blind tasks versus benchmark task success.'
    - 'Domain strategy differs: tightly coupled domain-specific knowledge retrieval
      and verification versus domain-agnostic self-evolving frameworks.'
    - 'Human role differs: principal investigator collaboration, hidden peer-reviewed
      source conclusions, or human performance baseline.'
    - 'Proposed remedy differs: internal verification loops, self-evolution and memory,
      or improved benchmarks and design principles.'
    open_questions:
    - Do LLM-based evidence-maturity judges align with real literature review quality
      and research gap discovery?
    - Can conclusions generalize beyond single frozen base models, narrow scientific
      domains, and curated benchmark tasks?
    - How can long-horizon agents avoid memory degradation, implementation drift,
      overexcitement, and weak scientific taste?
    - Which evaluation signals best predict downstream discovery utility rather than
      surface rubric scores?
    - To what extent can reproducibility be confirmed when code, dataset, metric,
      and external-validation details are not visible across systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 知识锚定的文献综合与手稿生成
      解决的问题: 自动化检索和压缩文献，并在内部验证和自我改进的支持下起草结构化综述或研究论文。
      尚未覆盖: 合成结论在已展示样本之外的保真度、多样文献领域的覆盖范围，以及人工验证负担的降低仍待解决。
    - 路线: 面向研究与发现智能体的证据导向基准评测
      解决的问题: 将同行评审研究转化为带冻结数据的盲测任务，并通过自动化LLM评分比较主张的证据成熟度和生物学发现支持。
      尚未覆盖: 结论依赖少数冻结基座模型和人工策划任务；代理分数与真实发现效用的一致性以及更广领域覆盖尚未证实。
    - 路线: 可复用的自我演化智能体框架
      解决的问题: 降低构建领域专用科学智能体的成本，并支持迭代假设优化、自我批判和知识积累。
      尚未覆盖: 长程可靠性、记忆退化、实现漂移，以及跨硬件、数据和用户设置的外部验证仍未解决。
    - 路线: 失败分析与设计原则综合
      解决的问题: 记录端到端尝试中反复出现的失败模式，并为更稳健的自动化研究工作流提炼设计指导。
      尚未覆盖: 这些分类和设计原则能否跨任务、领域和基座模型预测行为，仍缺乏直接实证验证。
    共识:
    - 系统仍以辅助为主，尚未完全自主；人类监督或人类基线仍被用于质量判断。
    - 评测正在转向证据锚定、自动化和可重复的协议，因为人工评审难以规模化。
    - 当前智能体在执行、记录和可审计性方面最强，而科学判断、可证伪性和对照设计较弱。
    - 将科学和文献工作流多阶段分解是常见的架构模式。
    分歧:
    - 评测目标不同：生成手稿质量、盲测任务上的证据成熟度与基准任务成功率。
    - 领域策略不同：紧密耦合的领域知识检索与验证，对领域无关的自我演化框架。
    - 人类角色不同：作为首席研究员协作、隐藏同行评审来源结论、或仅作为人类性能基线。
    - 建议的改进路径不同：内部验证循环、自我演化与记忆，或改进基准与设计原则。
    开放问题:
    - 基于LLM的证据成熟度评审是否与真实文献综述质量和研究缺口发现一致？
    - 结论能否泛化到单一冻结基座模型、狭窄科学领域和人工策划基准之外？
    - 长程智能体如何避免记忆退化、实现漂移、过度兴奋和科学品味薄弱？
    - 哪些评测信号最能预测下游发现效用，而不是表面评审分数？
    - 当代码、数据集、指标和外部验证细节不可见时，可复现性在多大程度上能被确认？
