  related_work_outline:
  - 'Mainstream direction: Building LLM-based autonomous agents that can perform end-to-end
    scientific discovery cycles, with growing emphasis on safety, auditability, and
    mechanism fidelity beyond outcome-only metrics.'
  - 'Shared research pattern: Most works decompose the discovery pipeline into modular
    stages (hypothesis, experiment, analysis) and introduce structured artifacts,
    memory, or safety checks to improve robustness and reproducibility.'
  - 'Key differences: Systems differ in evaluation targets (task completion vs. reasoning
    correctness), deployment settings (simulated text environments vs. wet-lab robotics),
    and safety integration (post-hoc monitors vs. intrinsic reasoning loops).'
  - 'Trend evolution: The field moved from establishing virtual benchmarks (2024)
    toward frameworks that address safety, experience memory, and epistemic honesty
    (2025–2026), indicating a shift from capability demonstration to trustworthiness
    engineering.'
  - 'Open questions: How to validate mechanism fidelity without ground-truth labels;
    how to generalize safety mechanisms across diverse scientific domains; and whether
    learned experience can transfer between different discovery tasks.'
  related_work_outline_zh:
  - 主流方向：构建基于LLM的自主智能体，完成端到端科学发现循环，并日益强调安全性、可审计性和机制忠实性，而不仅以结果指标为导向。
  - 研究共性：多数工作将发现流程分解为模块化阶段（假设、实验、分析），并引入结构化工件、记忆或安全检查，以提升鲁棒性和可复现性。
  - 关键差异：系统在评测对象（任务完成 vs. 推理正确性）、部署环境（模拟文本环境 vs. 湿实验室机器人）和安全集成方式（事后监控 vs. 内禀推理循环）上存在分歧。
  - 趋势演进：领域从建立虚拟基准（2024年）逐步转向应对安全、经验记忆和认知诚实性的框架（2025–2026年），标志着从能力展示到可信度工程的转变。
  - 开放问题：如何在没有真实标签的情况下验证机制忠实性；安全机制如何泛化到不同科学领域；以及学习到的经验能否在不同发现任务间迁移。
  literature_review:
    line_of_work_matrix:
    - line: Standardized discovery benchmarks and task design
      what_it_solves: Provides reproducible environments (e.g., DISCOVERYWORLD and
        1GC-7RC) to evaluate agent capabilities across diverse scientific or ML tasks,
        capturing exploration, planning, and resource constraints.
      what_remains_open: Benchmarks are limited to specific domains or simulated setups;
        they do not yet assess long-term, open-ended discovery or real-world laboratory
        integration.
    - line: Auditable research question formation
      what_it_solves: Introduces structured certificates (FirstResearch) that record
        assumptions, hypotheses, and failure update rules, making the reasoning of
        scientific agents explicit and falsifiable.
      what_remains_open: Certificates are evaluated by LLM judges rather than human
        experts; their impact on actual discovery outcomes and robustness in noisy
        or incomplete data remains untested.
    - line: Code and tool infrastructure for scientific coding agents
      what_it_solves: Automatically distills domain-specific code libraries (CodeDistiller)
        to improve the quality and correctness of agent-generated experiments, bridging
        the gap between general code generation and scientific rigor.
      what_remains_open: Library generation is validated only on materials science;
        generalization to other disciplines and the reliability of LLM-as-a-judge
        for scientific code quality are unverified.
    - line: Safety and experience evolution in physical or tool-chain agents
      what_it_solves: Integrates safety reasoning into agent pipelines (SciTrace)
        and accumulates experience from execution (LabEvolver) to reduce physical
        risks and improve task efficiency without retraining.
      what_remains_open: Safety mechanisms are evaluated in simulation or controlled
        lab settings; real-world deployment with unpredictable variables and long-term
        evolution of safety knowledge remain open.
    - line: Mechanism fidelity and epistemic evaluation
      what_it_solves: Identifies the 'Correct Answer, Wrong Mechanism' failure mode
        and proposes additional evaluation dimensions (mechanism fidelity, epistemic
        honesty) beyond task success, enabling detection of brittle reasoning.
      what_remains_open: Detection methods rely on known ground-truth mechanisms or
        comparison checks, which may not be available in genuine open-ended discovery;
        sample sizes and domain coverage are limited.
    - line: Automated goal evolution for scientific optimization
      what_it_solves: Replaces hand-crafted objective functions with a bi-level LLM
        agent (SAGA) that explores and refines objectives, enabling discovery of novel
        solutions in antibiotics, nanobodies, and other design tasks.
      what_remains_open: Validated on a few select tasks; the scalability of the objective
        space exploration and its integration with safety constraints in high-stakes
        domains are not demonstrated.
    consensus:
    - LLM-based agents can autonomously execute scientific discovery loops when provided
      with structured prompts, tools, or environments, but they remain brittle under
      distribution shift or incomplete information.
    - Safety and auditability are emerging as essential components for scientific
      agents, not optional add-ons, because raw task completion can hide flawed reasoning
      or dangerous action sequences.
    - 'Evaluation must go beyond binary success metrics: process-oriented measures
      (explanation quality, safety gate violations, mechanism consistency) are necessary
      to assess agent reliability.'
    disagreements:
    - 'Evaluation scope: some works focus on final task outcomes (DISCOVERYWORLD,
      1GC-7RC), while others argue that mechanism fidelity and epistemic honesty are
      equally important (Correct Answer, Wrong Mechanism).'
    - 'Safety integration: SciTrace employs a trajectory-aware intrinsic safety loop
      woven into every stage, whereas LabEvolver uses an outer experience evolution
      loop that distills safety from past episodes, creating a trade-off between real-time
      intervention and post-hoc learning.'
    - 'Deployment realism: CodeDistiller and 1GC-7RC operate in simulated coding environments,
      while LabEvolver targets robotic wet-lab tasks; this leads to different assumptions
      about noise, risk, and the availability of ground-truth feedback.'
    open_questions:
    - How can we design evaluation protocols that simultaneously assess task success,
      mechanism correctness, and safety without relying on pre-specified ground-truth
      mechanisms?
    - To what extent can safety policies learned in one scientific domain (e.g., chemistry
      wet labs) transfer to another (e.g., materials synthesis) when tool chains and
      risk profiles differ?
    - What are the minimal requirements for an agent's internal representation to
      enable robust, verifiable scientific reasoning under real-world uncertainty
      and partial observability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 标准化发现基准与任务设计
      解决的问题: 提供可复现环境（如 DISCOVERYWORLD 和 1GC-7RC），评估智能体在多样化科学或ML任务中的探索、规划和资源约束处理能力。
      尚未覆盖: 基准局限于特定领域或模拟设置，尚未评估长期开放式发现或真实实验室集成。
    - 路线: 可审计的研究问题形成
      解决的问题: 引入结构化证书（FirstResearch）记录假设、机制和失败更新规则，使科学智能体的推理过程显式且可证伪。
      尚未覆盖: 证书由LLM评审而非人类专家评估；其对实际发现结果的影响以及在噪声或缺失数据下的鲁棒性未经验证。
    - 路线: 科学编码代理的代码与工具基础设施
      解决的问题: 自动提炼领域特定代码库（CodeDistiller），提升智能体生成实验的质量和科学性，弥合通用代码生成与科学严谨性之间的差距。
      尚未覆盖: 仅在材料科学仓库验证；对其他学科的泛化能力以及LLM-as-a-judge对科学代码质量评估的可靠性未经证实。
    - 路线: 物理或工具链智能体的安全与经验演化
      解决的问题: 将安全推理融入智能体流水线（SciTrace），并从执行中积累经验（LabEvolver），降低物理风险、提升任务效率而不需重新训练。
      尚未覆盖: 安全机制在模拟或受控实验室环境中评估；在不可预测的真实世界部署以及长期安全知识演化方面仍是空白。
    - 路线: 机制忠实度与认知评估
      解决的问题: 揭示“正确答案，错误机制”失败模式，提出除任务成功之外的评估维度（机制忠实度、认知诚实性），以检测脆性推理。
      尚未覆盖: 检测方法依赖已知真实机制或比对检查，在真正的开放式发现中可能不可用；样本量和领域覆盖有限。
    - 路线: 面向科学优化的自动化目标演化
      解决的问题: 用双层LLM智能体（SAGA）替代手工设计的目标函数，探索并细化目标，实现抗生素、纳米抗体等设计任务中的新颖发现。
      尚未覆盖: 仅在少数任务上验证；目标空间探索的可扩展性及其在高风险领域中与安全约束的集成尚未展示。
    共识:
    - 基于LLM的智能体在给定结构化提示、工具或环境时，能够自主执行科学发现循环，但在分布偏移或不完整信息下仍显脆弱。
    - 安全性和可审计性正成为科学智能体的必要组件，而非可选附件，因为单纯的任务完成无法揭示推理缺陷或危险动作序列。
    - 评估必须超越二元成功指标：过程导向的度量（解释质量、安全门违规、机制一致性）对于评估智能体可靠性至关重要。
    分歧:
    - 评估范围：部分工作聚焦最终任务结果（如 DISCOVERYWORLD、1GC-7RC），而其他工作主张机制忠实度和认知诚实性同等重要（如正确答案错误机制）。
    - 安全集成：SciTrace 采用内禀、轨迹感知的安全循环，贯穿每个阶段；LabEvolver 则使用外部经验演化循环从历史中提炼安全策略，形成实时干预与事后学习之间的权衡。
    - 部署真实性：CodeDistiller 和 1GC-7RC 工作在模拟编码环境中，而 LabEvolver 针对机器人湿实验室任务，这导致对噪声、风险和真实反馈可获取性的假设不同。
    开放问题:
    - 如何设计能同时评估任务成功、机制正确性和安全性的评测协议，而不依赖预先指定的真实机制？
    - 当工具链和风险剖面不同时，一个科学领域（如化学湿实验室）学习到的安全策略在多大程度上可以迁移到另一领域（如材料合成）？
    - 智能体内部表示需满足哪些最低要求，才能在真实世界不确定性和部分可观测条件下实现鲁棒、可验证的科学推理？
