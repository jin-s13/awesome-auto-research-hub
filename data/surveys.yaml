      解决的问题: 提供需要假设形成、实验设计、结果分析和结论判断的标准化任务套件，便于可重复比较不同智能体。
      尚未覆盖: 虚拟或选择题代理任务可能简化科学发现；强智能体仍表现困难，人类基线只在少数领域存在。
    - 路线: 基于证据的评测工具
      解决的问题: 从对照、稳健性、可证伪性、可审计性和泛化等维度判断结论是否真正获得数据支持。
