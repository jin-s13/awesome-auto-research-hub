  literature_review:
    line_of_work_matrix:
    - line: Iterative multi-agent survey authoring workflows
      what_it_solves: End-to-end scholarly survey generation by decomposing tasks
        into retrieval, thematic organization, drafting, and review, with refinement
        loops to improve structure and coverage.
      what_remains_open: Large-scale human expert validation is limited; quality improvements
        rest heavily on LLM-based evaluators, and artifact release and verification
        remain incomplete.
    - line: Evidence-grounded retrieval and citation reliability
      what_it_solves: Grounding survey claims in retrieved papers through full-text
        analysis, cross-paper modeling, citation-graph expansion, and evidence-constrained
        citation assignment.
      what_remains_open: Cross-domain scalability and retrieval completeness are unresolved;
        code and implementation-level reproducibility are not systematically demonstrated.
    - line: Taxonomy and hierarchical organization synthesis
      what_it_solves: Generating or evaluating hierarchical literature taxonomies
        and paper-to-category mappings that mirror expert conceptual structure.
      what_remains_open: Alignment measures rely on single expert-reference taxonomies;
        alternative valid organizations and direct predictive value of taxonomies
        remain underexplored.
    - line: Survey evaluation and benchmark design
      what_it_solves: Making survey-generation claims comparable through benchmarks,
        paired comparisons, hierarchical metrics, and multi-agent LLM rubrics.
      what_remains_open: Proxy metrics are not yet validated against expert decision
        utility; coverage beyond selected CS/LLM topics and large paper sets is limited.
    consensus:
    - Survey generation is treated as a multistage process with separate retrieval,
      organization, drafting, and evaluation modules rather than a single generative
      pass.
    - Iterative refinement using LLM reviewer feedback or rubrics is a common mechanism
      for improving structure, comprehensiveness, and citation alignment.
    - Grounding generated claims in cited papers is recognized as a central reliability
      challenge, with dedicated mechanisms for evidence and citation control.
    - LLM-based evaluation is widely used to score coverage, relevance, structure,
      and citation quality, but authors acknowledge evaluation coverage limitations.
    disagreements:
    - 'Evaluation target differs: some optimize rubric-aligned manuscript quality,
      others diagnose retrieval and taxonomy organization with reference-based hierarchical
      metrics, and others emphasize citation fidelity.'
    - Mode of operation ranges from fully autonomous multi-agent flows to governed
      scientist-in-the-loop orchestration, especially for privacy-constrained research
      settings.
    - 'Representation strategy varies: paper cards and structured keynotes for paper-level
      grounding versus taxonomy trees for literature organization versus modular role-based
      agents for authoring workflows.'
    - 'Scope of claims differs: some validate on curated CS/LLM topics only, while
      others attempt cross-domain generalization, leaving frontier and large-corpus
      behavior uncertain.'
    open_questions:
    - How well do LLM rubric scores and multi-agent evaluators track expert acceptance
      and long-term scholarly utility of generated surveys?
    - What retrieval mechanisms can close the observed gap where a strong agent retrieves
      only about 20.92% of expert-cited papers in TaxoBench?
    - How should taxonomy quality be measured without over-penalizing alternative
      valid structures against a single expert reference taxonomy?
    - Do evidence-constrained and iterative improvements remain effective outside
      curated CS/LLM topics, large paper sets, and domains with limited full-text
      access?
    - Which missing reproducibility signals—code, datasets, metrics, baselines, and
      limitation reports—are most consequential for independently verifying survey-generation
      claims?
