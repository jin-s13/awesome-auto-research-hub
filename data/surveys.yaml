  related_work_outline_zh:
  - 主流方向：构建覆盖选题、实验、分析和论文生成的端到端自主研究智能体；新系统越来越多加入领域验证、自动评审和选择性人类监督以提升可靠性。
  - 研究共性：多数系统将科学过程分解为假设、执行、评估和写作等模块或路径，基于LLM/VLM骨干，并在最终输出前设置验证门或评审机制以拒绝无效主张。
  - 关键差异：系统在通用性与领域绑定、验证策略、评测目标、交互模式和可复现信号上不同；通用ML框架用模拟或工作坊评审，CFD、应用数学和组学系统采用物理、逻辑或生物基准。
  - 趋势演进：2024至2026年，工作从通用端到端框架和虚拟发现环境，走向领域特定多智能体系统、物理感知门控、智能体树搜索，以及高杠杆决策点的人类-AI协作。
  - 开放问题：验证门在漏检植入失败时是否可靠；基准和LLM评审分数是否对应真实科学价值；改进主要来自智能体设计还是领域先验；哪种人类干预模式最有效仍待研究。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research workflows
      what_it_solves: Automates the full research loop from ideation and code execution
        to paper writing and review, reducing per-paper cost and manual scaffolding.
      what_remains_open: Validation remains mostly simulated review or workshop-level
        acceptance, with inconsistent success and no full conference-level evidence.
    - line: Domain-constrained discovery and verification
      what_it_solves: Embeds disciplinary constraints such as logical auditing, physics-aware
        visual checks, or domain knowledge retrieval to make generated claims defensible
        in theory or simulation.
      what_remains_open: Verification gates still miss planted silent failures, and
        the contribution of domain priors versus the underlying model is not isolated.
    - line: Benchmarks and virtual discovery environments
      what_it_solves: Provides repeatable tasks, metrics, and human baselines for
        comparing discovery agents across topics or real biological data.
      what_remains_open: Coverage is limited to curated domains or proxy tasks, and
        agreement between benchmark metrics and real scientific utility is not established.
    - line: Human-AI collaborative research pipelines
      what_it_solves: Uses structured debate, self-healing execution, verifiable reporting,
        and targeted human intervention to improve reliability and prevent fabricated
        results.
      what_remains_open: Evidence is based on a single benchmark and ablation; long-run
        and cross-institutional validation are missing.
    - line: Open-source and reproducible infrastructure
      what_it_solves: Turns agent designs into runnable workflows, code, and artifacts
        for reuse and inspection in domains such as CFD and ML.
      what_remains_open: Standardized external validation across hardware, datasets,
        and user settings is absent; several papers provide only partial code or artifact
        signals.
    consensus:
    - Scientific discovery agents are treated as multi-step pipelines covering hypothesis
      generation, experiment execution, result analysis, and manuscript creation.
    - A verification or review gate is considered necessary before accepting generated
      claims, although gate implementations differ.
    - Benchmarks, automated reviewers, or peer review are used as external reference
      points rather than relying only on self-reported success.
    - Domain-specific constraints improve defensibility over generic autonomy in applied
      math, fluid dynamics, and biological discovery.
    - Selective human involvement can improve outcomes comparably or better than full
      autonomy or exhaustive oversight.
    disagreements:
    - 'Generality versus domain grounding: some work pursues cross-domain ML research,
      while others build specialized physics, mathematical, or biological agents.'
    - 'Verification strategy: logical coherence audits, vision-language physics gates,
      verifiable result reporting, and simulated review target different failure modes.'
    - 'Evaluation target: conference or workshop review acceptance, benchmark task
      completion, multiple-choice biological discovery, and specific physical error
      metrics are not interchangeable.'
    - 'Interaction mode: systems range from fully autonomous operation to principal
      investigator and graduate student collaboration, and multi-mode human-in-the-loop
      oversight.'
    - Reproducibility and validation evidence vary; some systems expose code and datasets,
      while others rely on paper-level signals or leave limitations unreported.
    open_questions:
    - How can verification gates achieve acceptable recall when current evidence shows
      planted silent failures can be missed?
    - Do LLM-based review and benchmark scores align with long-term scientific value
      outside curated rubrics?
    - 'Which components of domain-specific agents contribute most: domain priors,
      backbone model, verification gates, or search strategy?'
    - What is the minimal effective human intervention point, and does it generalize
      beyond specific benchmarks?
    - How do these systems transfer across disciplines without re-engineering domain
      constraints or evaluation protocols?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究工作流
      解决的问题: 自动化从选题、代码执行到论文写作和评审的完整研究循环，降低单篇论文成本并减少人工脚手架。
      尚未覆盖: 验证仍以模拟评审或工作坊级接受为主，成功率不稳定，缺少完整会议级证据。
    - 路线: 领域约束发现与验证
      解决的问题: 嵌入逻辑审计、物理感知视觉检查或领域知识检索等约束，使理论或仿真中的生成主张更可辩护。
      尚未覆盖: 验证门仍会漏检植入的静默失败，领域先验与底层模型的贡献未被分离。
    - 路线: 基准与虚拟发现环境
      解决的问题: 提供可重复任务、指标和人类基线，用于跨主题或真实生物数据比较发现智能体。
      尚未覆盖: 覆盖范围限于筛选过的领域或代理任务，基准指标与真实科学效用的一致性尚未建立。
    - 路线: 人机协作研究流水线
      解决的问题: 通过结构化辩论、自愈执行、可验证报告和定向人类干预，提高可靠性并防止伪造结果。
      尚未覆盖: 证据来自单一基准和消融，缺少长期和跨机构验证。
    - 路线: 开源与可复现基础设施
      解决的问题: 将智能体设计转化为可运行工作流、代码和工件，用于CFD和ML等领域复用与审查。
