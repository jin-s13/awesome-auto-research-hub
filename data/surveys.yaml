  - 开放问题：长程收益能否推广到狭窄工程/科学领域之外；生成评估器能否达到目标分歧上限而不对开发目标过拟合；蒸馏技能能否在未知仓库与任务上保持有效。
  literature_review:
    line_of_work_matrix:
    - line: Long-horizon research-state management and coordination
      what_it_solves: Improves long automated research runs by moving durable state,
        focused context, and experiment assignment outside agent conversation memory,
        reducing replay, duplication, and stalled search.
      what_remains_open: Evidence focuses on software engineering, kernel optimization,
        and algorithm tasks; transfer to noisier or open-ended research domains and
        explicit failure modes outside those settings remain verification gaps.
    - line: Closed-loop feedback efficiency and surrogate repair
      what_it_solves: Reduces expensive high-fidelity oracle queries during closed-loop
        discovery by interleaving surrogate feedback with decision-relevant high-fidelity
        evaluations.
      what_remains_open: Fixed surrogate replacement can leave persistent model error,
        proposed method limitations are not explicitly stated, and acquisition rules
        may not cover all discovery task structures.
    - line: Reusable experimental experience and operational skill distillation
      what_it_solves: Extracts decision-relevant experience or verified operational
        skills from prior trajectories and repositories so agents reuse knowledge
        instead of repeating costly experiments.
      what_remains_open: Transferability to unseen repositories and domains remains
        weakly bounded; several evidence statements lack explicit limitations or standardized
        external validation.
    - line: Domain-specific held-out validation for autonomous scientific discovery
      what_it_solves: Tests whether AI-scientist modifications generalize to unseen
        data and produce reusable artifacts in materials modeling and molecular optimizer
        design.
      what_remains_open: 'Coverage is narrow: ten Matbench endpoints or selected optimizer
        families; one selected intervention failed on holdout, so robustness is imperfect.'
    - line: Meta-evaluation and evaluator construction benchmarks
      what_it_solves: Measures whether research agents can construct executable evaluators
        under fixed time and API budgets, supporting recursive self-improvement feedback.
      what_remains_open: Generated evaluators remain below target disagreement ceilings,
        best development evaluators do not transfer to sealed targets, and budget
        truncation or question-dominance issues persist.
    consensus:
    - 'Autonomous research is commonly framed as a budgeted closed loop: propose a
      change, run evaluation feedback, decide whether to keep or revise.'
    - Durable evidence should be externalized from model context, whether as harness
      state, an experience library, or verified skills, to improve long-horizon reliability.
    - Held-out or sealed evaluation is emerging as a preferred way to test whether
      discoveries or evaluators generalize beyond development feedback.
    - The field jointly tracks task-level final quality and resource cost, including
      token budgets, API budgets, oracle queries, or force calls.
    disagreements:
    - 'State representation differs: one direction keeps agents stateless with harness-owned
      state, another accumulates reusable experience, and another distills operational
      skills into a library.'
    - 'Feedback supervision differs: some use every-episode high-fidelity feedback,
      some use sparse decision-relevant high-fidelity repair, and some use pilot feedback
      only before freezing an evaluator.'
    - 'Evaluation target differs: domain-specific discovery tasks, optimizer rewriting,
      repository-derived skill transfer, and meta-evaluation of generated evaluators.'
    - 'Success metric emphasis differs: final result with token efficiency versus
      oracle-query or force-call efficiency versus evaluator agreement with target
      ceilings.'
    open_questions:
    - Can long-horizon state-management gains transfer to research tasks outside software
      engineering, kernel optimization, and algorithm design?
    - How can generated evaluators improve toward target disagreement ceilings without
      overfitting development targets and without truncating candidate answers?
    - How robust are held-out improvements across broader materials/chemistry endpoints
      and unseen optimizer families when one selected modification already failed
      on holdout?
    - Do distilled operational skills remain valid when repositories, domains, and
      evaluation suites shift away from the distillation sources?
    - What are the explicit failure modes of online surrogate repair beyond fixed
      surrogate model error and infrastructure cost?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 长程研究状态管理与协调
      解决的问题: 通过将持久状态、聚焦上下文和实验分配移出智能体对话记忆，减少历史重放、重复工作和停滞搜索，从而改善长程自动研究。
      尚未覆盖: 证据集中在软件工程、内核优化和算法设计任务；向更嘈杂或开放式研究领域的迁移及显式故障模式仍是验证缺口。
    - 路线: 闭环反馈效率与代理修复
      解决的问题: 在闭环发现中交错使用低成本代理反馈与针对决策相关区域的高保真评估，减少昂贵 oracle 查询。
      尚未覆盖: 固定代理替换可能留下持续模型误差；所提方法局限未明确，且采集规则未必覆盖所有发现任务结构。
    - 路线: 可复用实验经验与操作技能蒸馏
      解决的问题: 从历史实验轨迹和代码仓库中提取决策相关经验或经验证的操作技能，使智能体复用知识而不是重复昂贵实验。
      尚未覆盖: 向未见仓库和领域的可迁移性边界不清；若干证据未列出显式局限性或标准化外部验证。
    - 路线: 面向领域的留出验证自主科学发现
      解决的问题: 测试 AI 科学家的修改能否推广到未见数据并在材料建模和分子优化器设计中产生可复用工件。
      尚未覆盖: 覆盖较窄：仅限于十个 Matbench 端点或选定的优化器家族；一个干预在留出集失败，说明鲁棒性不完美。
    - 路线: 元评估与评估器构建基准
      解决的问题: 衡量研究智能体能否在固定时间和 API 预算下构建可执行评估器，为递归自我改进提供反馈。
      尚未覆盖: 生成评估器仍低于目标分歧上限；开发目标上最佳者在密封目标上不迁移；预算截断和少数问题主导领域分数仍存在。
    共识:
    - 自主研究通常被框架化为有预算的闭环：提出修改，运行评估反馈，决定保留或修订。
    - 持久证据应从模型上下文中外置，无论是以框架状态、经验库还是经验证技能的形式，以提升长程可靠性。
    - 留出或密封评估正在成为检验发现或评估器能否超越开发反馈而泛化的优先方式。
    - 领域同时关注任务级最终质量与资源成本，包括 token 预算、API 预算、oracle 查询或力调用次数。
    分歧:
    - 状态表示不同：一种让智能体无状态并由框架持有状态，另一种积累可复用经验，还有一种将操作知识蒸馏为技能库。
    - 反馈监督不同：有的每轮使用高保真反馈，有的使用稀疏且面向决策相关区域的高保真修复，有的仅在冻结评估器前使用试点反馈。
    - 评测目标不同：领域特定的科学发现任务、优化器改写、仓库技能迁移，以及生成评估器的元评估。
    - 成功指标侧重不同：最终结果与 token 效率、oracle 查询或力调用效率、评估器与人类/目标上限的一致性。
    开放问题:
    - 长程状态管理收益能否迁移到软件工程、内核优化和算法设计之外的研究任务？
    - 生成评估器如何在不过拟合开发目标、不截断候选答案的情况下逼近目标分歧上限？
    - 在一个留出修改失败的情况下，留出改进在更广材料/化学端点和未见优化器家族上的鲁棒性如何？
    - 当仓库、领域和评测套件偏离蒸馏来源时，蒸馏出的操作技能是否仍有效？
    - 除固定代理模型误差和基础设施成本外，在线代理修复还有哪些显式失败模式？
