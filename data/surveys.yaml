  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Combines hypothesis generation, code execution, experiment running,
        visualization, and paper writing into one LLM-driven loop, reducing the cost
        and time of complete research cycles.
      what_remains_open: Result consistency and reliability are uncertain; only one
        of three autonomous submissions passed peer review in one case, and many evaluations
        rely on the system's own review loop or limited tasks.
    - line: Domain-specific discovery agents with verification gates
      what_it_solves: Adds logical or physics-aware checks to detect invalid derivations
        or silent simulation failures, especially in applied mathematics and computational
        fluid dynamics.
      what_remains_open: Verification gates still miss silent failures and have not
        been shown to transfer broadly across domains or experimental settings.
    - line: Benchmarks and environments for discovery
      what_it_solves: Provides standardized tasks requiring hypothesis formation,
        experiment design, analysis, and conclusion, separating discovery from reproduction
        of known findings.
      what_remains_open: Virtual or blind task success may not track real discovery;
        reported evidence is limited to selected base models and domains.
    - line: Automated review and evidence scoring
      what_it_solves: Uses model-based reviewers or judges to evaluate generated manuscripts
        and evidentiary maturity without full human review.
      what_remains_open: Automated scoring can mimic part of human review but still
        fails to surface missing controls, robustness, falsifiability, and cross-dataset
        generalization.
    - line: Human-in-the-loop research collaboration
      what_it_solves: Keeps expert judgment as a principal investigator or final authority
        while delegating derivation, implementation, and drafting to agents.
      what_remains_open: Final validity and interpretation still depend on human experts;
        evidence for reduced intervention is mostly qualitative and not standardized.
    consensus:
    - 'LLM-based agents are used to span the full scientific loop: ideation, experimentation
      or derivation, analysis, and manuscript drafting.'
    - Automated verification or evaluation is treated as necessary to scale beyond
      human review, whether by LLM judges, tree search, physics gates, or benchmark
      scoring.
    - Current systems perform analysis and documentation competently, but their generated
      claims often lack controls, robustness, falsifiability, or cross-dataset evidence.
    disagreements:
    - 'Validation strategy differs: some systems optimize for workshop or conference
      acceptance via simulated peer review, while others optimize for task completion
      in virtual or blind discovery benchmarks.'
    - 'Domain scope differs: general machine-learning discovery agents process code-led
      experiments, whereas domain-specific agents rely on theorem verification or
      physics simulation checks.'
    - 'Human interaction differs: some approaches pursue fully autonomous generation
      from minimal prompts, while others require a human principal investigator or
      expert-in-the-loop check.'
    - 'Evidence of progress differs: some treat generated paper scores as progress,
      while others treat accepted workshop papers, discovered corrections, or benchmark
      completion as the primary signal.'
    open_questions:
    - Can automated judges and verification gates reliably catch silent failures,
      logical errors, and invalid scientific claims across domains?
    - Does performance on virtual environments or blind benchmark tasks transfer to
      reusable, externally validated scientific discoveries?
    - How sensitive are current agent conclusions to the frozen base model, code environment,
      or benchmark construction?
    - What additional supervision or control mechanisms are needed before autonomous
      agents can produce defensible claims with controls, robustness, and falsifiability?
