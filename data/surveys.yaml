  related_work_outline:
  - 'Mainstream direction: The evidence centers on LLM-based autonomous scientific
    discovery systems, treating literature synthesis, paper generation, verification,
    and knowledge retrieval as an integrated workflow rather than isolated search
    or review tasks.'
  - 'Shared research pattern: Systems decompose the research process into stages or
    agents, use verification and self-critique, retrieve knowledge, generate papers
    or claims, and evaluate outputs with LLM rubrics, blind tasks, or case-study failure
    analysis.'
  - 'Key differences: Some papers propose end-to-end generation frameworks, others
    propose evidence-grounded benchmarks, domain-specific biological evaluation, or
    failure-mode/survey analyses; supervision ranges from curated LLM review to frozen-data
    blind tasks with human baselines.'
  - 'Trend evolution: The visible high-ranked work moves from surveys and failure
    case studies in 2025 toward domain-agnostic self-evolving frameworks and automated
    evidence-maturity benchmarks in 2026; the available years are too narrow to establish
    a longer trajectory.'
  - 'Open questions: Whether review scores and benchmark performance translate into
    human expert acceptance and genuine discovery utility, and whether systems can
    maintain controls, robustness, falsifiability, and cross-domain generalization.'
  related_work_outline_zh:
  - 主流方向：证据集中在基于LLM的自主科学发现系统，将文献综合、论文生成、验证和知识检索视为一体化工作流，而非孤立的搜索或综述任务。
  - 研究共性：系统把研究过程分解为阶段或智能体，采用验证与自我批判，检索知识，生成论文或主张，并通过LLM评审、盲任务或失败案例分析来评估输出。
  - 关键差异：部分工作提出端到端生成框架，另一些提出证据锚定基准、领域特定生物评测或失败模式/综述分析；监督方式从精选LLM评审到冻结数据盲任务和人工基线不等。
  - 趋势演进：可见的高排名工作从2025年的综述和失败案例研究，走向2026年的领域无关自演化框架与自动化证据成熟度基准；可用年份过窄，难以确立更长趋势。
  - 开放问题：评审分数和基准表现能否转化为人类专家接受度和真实发现效用；系统能否保持对照、稳健性、可证伪性和跨领域泛化。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research-writing agents
      what_it_solves: Automating literature synthesis, derivation, proof, experiment,
        and manuscript preparation with internal verification and knowledge retrieval.
      what_remains_open: Whether curated LLM-rubric scores transfer to human expert
        acceptance and long-horizon reliability outside the reported generated-paper
        setting.
    - line: Evidence-grounded evaluation benchmarks
      what_it_solves: Comparing AI scientists on blind tasks, frozen data, and rubric-based
        evidence maturity rather than reproduction of hidden target studies.
      what_remains_open: Current evidence is limited to a single frozen base model
        and lacks controls, robustness, falsifiability, and cross-dataset generalization.
    - line: Failure-case and survey analyses
      what_it_solves: Mapping scientific workflow stages, recurring failure modes,
        evaluation criteria, and design principles from autonomous research attempts.
      what_remains_open: The resulting taxonomies and design principles have not been
        directly validated as predictive of downstream system behavior.
    - line: Self-evolving agent infrastructure
      what_it_solves: Providing domain-agnostic continuous self-improvement, hypothesis
        refinement, self-critique, and knowledge accumulation for scientific agents.
      what_remains_open: Reported benchmark gains do not yet establish that self-evolution
        produces genuinely novel, externally validated scientific insight.
    consensus:
    - Current AI scientist systems are treated as assistants rather than fully autonomous
      discoverers; they can execute literature-related workflows but do not yet reliably
      produce trustworthy novel claims.
    - Evaluation is shifting from model-only capability toward evidence maturity,
      auditability, and agreement with human or LLM-based review.
    - Verification, knowledge retrieval, and self-critique are recurring mechanisms
      intended to reduce hallucination and logical error.
    - Real scientific and literature intelligence remains gated by controls, robustness,
      falsifiability, and cross-domain generalization.
    disagreements:
    - Some work targets end-to-end paper generation with internal verification, while
      other work targets blind benchmark evaluation of evidence maturity or failure-mode
      documentation.
    - 'Evaluation settings differ: curated LLM-based review of generated papers versus
      blind tasks with hidden conclusions, frozen data, and human baselines.'
    - 'Supervision and domain assumptions differ: domain-agnostic self-evolving frameworks
      coexist with domain-specific biological or omics benchmarks.'
    - 'Success criteria differ: high benchmark or generated-paper review scores, one
      accepted workshop paper, and documented repeated failures all appear as evidence
      patterns.'
    open_questions:
    - Do LLM-judge or rubric scores on generated papers predict human expert acceptance
      and real discovery utility?
    - Can autonomous literature synthesis systems maintain factual and logical fidelity
      across long-horizon workflows?
    - How do evidence-grounded discovery benchmarks generalize across base models,
      scientific domains, and unseen study designs?
    - Which verification and memory mechanisms close the observed gaps in controls,
      robustness, falsifiability, and implementation drift?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研写作智能体
      解决的问题: 将文献综合、推导、证明、实验和论文生成整合到带内部验证与知识检索的工作流中。
      尚未覆盖: 精选LLM评审得分能否迁移到人类专家接受度和长程可靠性，仍缺乏证据。
    - 路线: 证据锚定的自动化评测基准
      解决的问题: 用盲任务、冻结数据和基于证据成熟度的评分来比较AI科学家，而不是复现隐藏目标研究。
      尚未覆盖: 当前证据仅基于单一冻结基座模型，对照、稳健性、可证伪性和跨数据集泛化不足。
    - 路线: 失败案例与综述分析
      解决的问题: 从自主研究尝试中归纳科学工作流阶段、反复出现的失败模式、评测维度和设计原则。
      尚未覆盖: 这些分类和设计原则能否预测后续系统行为，尚缺少直接实证验证。
    - 路线: 自演化智能体基础设施
      解决的问题: 提供领域无关的持续自改进、假设精化、自我批判和知识积累机制。
      尚未覆盖: 基准分数提升尚不能证明自演化能产生真正新颖且经外部验证的科学洞察。
    共识:
    - 当前AI科学家系统被定位为辅助者而非完全自主发现者；它们能执行文献相关工作流，但尚不能可靠产出可信任的新发现。
    - 评估正在从单一模型能力转向证据成熟度、可审计性以及与人工或LLM评审的一致性。
    - 验证、知识检索和自我批判是反复出现的机制，旨在降低幻觉和逻辑错误。
    - 真正科学或文献智能仍受限于对照、稳健性、可证伪性和跨领域泛化。
    分歧:
    - 一部分工作面向带内部验证的端到端论文生成，另一部分面向盲任务证据成熟度评测或失败模式记录。
    - 评测设置不同：精选LLM评审比较生成论文，盲任务则隐藏源结论并提供冻结数据和人工基线。
    - 监督与领域假设不同：领域无关的自演化框架与领域特定的生物或组学基准并存。
    - 成功标准不同：高基准或生成论文评审分数、一篇被接收论文、多次失败记录都作为证据模式出现。
    开放问题:
    - LLM评审或生成论文评分能否预测人类专家接受度和真实发现效用？
    - 长程文献综合系统能否保持事实与逻辑保真度？
    - 证据锚定的科学发现基准如何跨基座模型、研究领域和未见研究设计泛化？
    - 哪些验证与记忆机制能补上对照、稳健性、可证伪性和实现漂移等缺口？
