  - 'Shared research pattern: Systems and benchmarks model literature/science work
    as multi-stage LLM agent pipelines involving retrieval, verification, analysis,
    and reporting, then score outputs through LLM judges or human baselines.'
  - 'Key differences: Evaluation targets differ across generated-paper quality, evidential
    maturity of claims, and domain-task performance; system interaction differs among
    human-in-the-loop verification, self-evolution, and fixed agent pipelines; deployment
    domains differ across applied mathematics, omics, and ML research workflows.'
  - 'Trend evolution: Available years cover only 2025–2026, so the trend is within
    the current frontier: 2025 works emphasize surveys and domain benchmarks, while
    2026 works move toward self-evolving frameworks and systematic failure-mode analysis.'
  - 'Open questions: Whether high automated scores reflect true literature synthesis
    or discovery competence rather than fluent analysis, how to independently validate
    citation and literature reliability, and how well findings generalize across models,
    domains, and real scientific workflows.'
  related_work_outline_zh:
  - 主流方向：自主科学文献与发现智能体，综合检索、文献综述、验证、分析和论文生成，并逐步转向基于证据的评测。
  - 研究共性：系统与基准把文献/科学工作建模为多阶段LLM智能体流水线，包括检索、验证、分析与报告，并通过LLM评审或人类基线打分。
  - 关键差异：评测目标不同，分别关注生成论文质量、证据成熟度和领域任务表现；系统交互不同，包括人机协作验证、自我演化和固定流水线；应用领域不同，横跨应用数学、组学和ML研究工作流。
  - 趋势演进：现有年份仅覆盖2025至2026，趋势处于当前前沿内；2025年多为综述和领域基准，2026年更多出现自演化框架与失败模式分析。
  - 开放问题：高自动评分是否代表真实综述/发现能力而非表面流畅分析；引用与文献可靠性如何独立验证；结果能否跨模型、跨领域和真实科学工作流泛化。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous literature synthesis and manuscript generation
      what_it_solves: Automates retrieval, verification, synthesis, and document generation
        for reasoning-centric scientific papers and literature review workflows.
      what_remains_open: Citation and literature accuracy lack independent validation,
        and evaluation depends on curated LLM review rubrics rather than standardized
        external replication.
    - line: Evidence-grounded evaluation design
      what_it_solves: Creates blind or domain-specific tasks that measure whether
        agents produce claims supported by frozen data and adequate controls, robustness,
        and falsifiability.
      what_remains_open: Reported results rest on narrow base-model coverage, limited
        task domains, and uncertain alignment between automated judges and real scientific
        utility.
    - line: Self-evolving agent infrastructure
      what_it_solves: Provides reusable domain-agnostic agents that iteratively refine
        hypotheses, self-critique, and accumulate knowledge across cycles.
      what_remains_open: Evidence is benchmark-centric, with missing limitation analysis
        and no standardized external validation across literature-specific or real-world
        research workflows.
    - line: Failure-mode and design-principle analysis
      what_it_solves: Identifies recurring failure modes in long-horizon autonomous
        research attempts and converts them into design principles for more robust
        systems.
      what_remains_open: Evidence comes from small case-study sets, so generalizability
        to large-scale literature intelligence tasks remains unmeasured.
    consensus:
    - Current LLM-based agents are not yet fully autonomous scientific or literature-intelligence
      systems and are better framed as supporting tools for human researchers.
    - Automated evaluation is necessary because open-ended outputs cannot be compared
      reliably with a single numeric metric alone.
    - Retrieval, verification, analysis, and reporting stages recur across proposed
      systems, but trustworthy claims depend on evidence auditability, controls, robustness,
      and falsifiability.
    - Literature review automation remains a bottleneck even when downstream coding
      and analysis competence is comparatively strong.
    disagreements:
    - 'Representation: some systems frame human-AI collaboration as principal investigator
      and student, while others pursue self-evolving agents with reduced human intervention.'
    - 'Evaluation target: one line scores generated-paper quality, another scores
      evidential maturity of claims inferred from frozen data, and another scores
      domain-specific annotation and discovery tasks.'
    - 'Supervision and interaction: systems differ between internal verification loops,
      continuous self-critique with knowledge accumulation, and fixed multi-agent
      pipelines.'
    - 'Deployment setting: contributions target applied mathematics, single-cell transcriptomics,
      general scientific benchmarks, or ML research workflows, creating different
      data assumptions and failure surfaces.'
    open_questions:
    - What evidence shows that high LLM-judge scores track actual literature synthesis
      or discovery utility rather than surface fluency and documentation quality?
    - Can citation retrieval and literature review components be independently validated
      for correctness and completeness when source conclusions are hidden or absent?
    - How well do failure patterns observed in a small number of autonomous ML research
      attempts transfer to large-scale literature intelligence tasks?
    - Does self-evolution improve evidence-grounded scientific claims, or does it
      mainly optimize benchmark-specific behavior without external validation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主文献综合与论文生成
      解决的问题: 把检索、验证、综合和文献/论文撰写组织成多智能体流程，用于辅助综述、理论推导和手稿准备。
      尚未覆盖: 引用与文献准确性缺乏独立验证，评估依赖人工设计的LLM评审标准，缺少标准化外部复现。
    - 路线: 基于证据的评测设计
      解决的问题: 通过盲任务或领域任务，衡量智能体是否基于冻结数据提出有对照、稳健性、可证伪性支撑的主张。
      尚未覆盖: 结果仅覆盖单一冻结基座模型，任务领域有限，自动评审与真实科学效用之间的一致性尚不明确。
    - 路线: 自演化智能体基础设施
      解决的问题: 提供领域无关、可复用的智能体框架，使其在实验周期中迭代优化假设、自我批判并积累知识。
      尚未覆盖: 证据偏向基准表现，缺少局限分析，也缺少面向文献工作流或真实研究场景的标准化外部验证。
    - 路线: 失败模式与设计原则分析
      解决的问题: 识别长期自主研究尝试中反复出现的失败模式，并转化为更鲁棒系统的设计原则。
      尚未覆盖: 证据来自少量案例，能否泛化到大规模文献智能任务仍未测量。
    共识:
    - 当前基于LLM的智能体尚未实现完全自主的科学发现或文献智能，更适合作为人类研究者的辅助工具。
    - 开放输出无法用单一数值可靠比较，因此自动化评测是必要的。
    - 检索、验证、分析和报告阶段在不同系统中反复出现，但可信主张依赖证据可审计性、对照、稳健性和可证伪性。
    - 即使下游编码和分析能力较强，文献综述自动化仍是当前瓶颈。
    分歧:
    - 表示方式：部分系统将人机协作建模为首席研究员与研究生，部分系统则强调减少人工干预的自演化智能体。
    - 评测目标：一条路线评价生成论文质量，一条评价从冻结数据中形成主张的证据成熟度，另一条评价领域注释与发现任务。
    - 监督与交互：系统在内部验证环、持续自我批判与知识积累、固定多智能体流水线之间存在差异。
    - 部署场景：不同工作面向应用数学、单细胞转录组、通用科学基准或ML研究工作流，因此数据假设和失败边界不同。
    开放问题:
    - 有哪些证据表明高LLM评审分数反映真实综述或发现能力，而不只是表面流畅和文档完整？
    - 在隐藏或缺失源结论的情况下，引用检索和文献综述组件能否被独立验证为正确且完整？
    - 少量自主ML研究尝试中观察到的失败模式，在多大程度上能迁移到大规模文献智能任务？
    - 自演化是提升了基于证据的科学主张，还是主要优化了缺乏外部验证的基准表现？
