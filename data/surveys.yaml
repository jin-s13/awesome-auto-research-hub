  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究智能体
      解决的问题: 自动化提出想法、执行代码实验、分析结果和撰写论文，用于经验性和理论性科学研究。
      尚未覆盖: 在有限案例之外的一致性和可复现性仍不明确；现有证据只显示部分同行评审成功和较窄的领域演示。
    - 路线: 科学发现评测环境与实验规划基准
      解决的问题: 为完整发现循环和消融规划提供可重复任务与指标，暴露当前智能体的不足。
      尚未覆盖: 任务完成和消融召回仍是代理指标；覆盖限于模拟或基准设置，当前模型在消融规划上仍低于人类水平。
    - 路线: 失败感知记忆与迭代细化
      解决的问题: 把失败实验记录为可复用的负知识，或对实验分支进行搜索，以改善重试并降低 token 消耗。
      尚未覆盖: 跨科学工作流的迁移和长期累积尚未验证；证据主要限于基准重试和 PDE 案例。
    - 路线: 自动验证与评审反馈
      解决的问题: 在人工检查前审计逻辑一致性、评估生成结果并提供迭代反馈。
      尚未覆盖: 自动评审和内部检查是否与人类同行评审一致尚不清楚；外部验证与稳定通过率仍然缺失。
    共识:
    - LLM 智能体可以覆盖实验主要生命周期：提出想法、实现、执行、分析和写作。
    - 迭代验证、评审反馈或失败记忆比单次生成更能提升鲁棒性。
    - 自动评测对规模化评估是必要的，但目前证据主要依赖 LLM 评委或环境特定指标。
    - 这些系统仍处于早期阶段，常在较窄案例和有限同行评审或基准结果上接受评估。
    分歧:
    - 目标范围：完整论文生成、发现任务执行，或以消融设计为典型的实验规划。
    - 成功标准：模拟同行评审接受、基准任务完成，或相对人类设计的消融实验召回率。
    - 交互模式：全自动流程、带管理角色的多智能体团队，或人机协同可定制团队。
    - 机制重点：内部验证与知识检索、代码工具与平台工作流，或失败记忆与搜索。
    开放问题:
    - 自动评审或任务指标是否预测真实科学新颖性、正确性和下游效用？
    - 当前智能体能否在策展应用数学、机器学习和模拟发现环境之外生成一致、新颖且可复现的研究？
