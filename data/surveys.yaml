  literature_review:
    line_of_work_matrix:
    - line: 'End-to-end autonomous research pipelines: multi-agent systems that connect
        literature search, data analysis, hypothesis generation, experiment or code
        execution, and report synthesis'
      what_it_solves: converts an open objective plus data or literature into candidate
        hypotheses and interpretable results
      what_remains_open: factual reliability and error containment over long horizons,
        weak-direction rejection, and domain generalization beyond tested settings
    - line: 'Structured search and reflection layers: tree-based evolutionary search,
        structured debate, or hierarchical reflection used to propose, branch, and
        revise hypotheses'
      what_it_solves: systematizes exploration and backtracking so hypothesis generation
        is more inspectable and less random
      what_remains_open: whether search or reflection quality, rather than underlying
        model capability or task prior, accounts for reported gains; scaling beyond
        tested branches or cycles
    - line: 'Shared state or world-model scaffolding: structured representations that
        share information across literature and data-analysis agents'
      what_it_solves: maintains coherence across long multi-agent discovery runs
      what_remains_open: whether shared state remains sufficient for decisions outside
        the observed task distribution; no external validation of the representation
        itself
    - line: 'Human-AI collaboration and oversight: selective human intervention at
        high-leverage decision points within autonomous workflows'
      what_it_solves: reduces fabrication, hallucinated citations, and blind spots
        while preserving efficiency
      what_remains_open: optimal intervention granularity, cross-domain accountability,
        and whether collaboration results transfer to institutional or embodied settings
    - line: 'Evaluation and reproducibility infrastructure: benchmarks, task datasets,
        and harnesses that measure research-relevant model capabilities'
      what_it_solves: makes capability claims comparable across frontier models and
        reveals remaining performance gaps
      what_remains_open: proxy tasks may not track real discovery utility; reproducibility
        and metric coverage remain incomplete
    - line: 'Conceptual taxonomy and workflow evaluation: surveys that organize autonomous
        research into workflow conditions, autonomy spectra, and evaluation dimensions'
      what_it_solves: defines boundaries and evaluative criteria across literature
        grounding, hypothesis formation, experimentation, feedback, and reporting
      what_remains_open: direct empirical validation that proposed categories predict
        system behavior or successful discoveries
    consensus:
    - Systems agree on decomposing research into literature grounding, hypothesis
      formation, execution or experimentation, feedback and verification, and reporting;
      hypothesis generation is treated as an iterative loop rather than a single completion
      task.
    - There is cross-system agreement that agentic LLM pipelines can produce useful
      candidate hypotheses or discoveries when combined with code or tool execution,
      structured reflection, or experimental feedback.
    - 'Survey and benchmark evidence agree that autonomy is domain-conditioned: more
      reliable in structured, executable, and quickly verifiable settings, and weaker
      in embodied, delayed, heterogeneous, or ethically accountable contexts.'
    - Verifiable or traceable output is emerging as a shared mechanism to reduce fabricated
      numbers and hallucinated citations.
    disagreements:
    - 'Systems differ in interaction mode: some emphasize full autonomy, while others
      argue that targeted human collaboration at high-leverage points outperforms
      exhaustive oversight and full autonomy.'
    - 'They differ in hypothesis search representation: structured research trees
      with evolutionary search and backtracking, structured debate, parallel data-analysis
      and literature loops, and symbolic equation optimization coexist.'
    - 'Evaluation targets differ: broad research-activity benchmarks, biology-task
      batteries, equation-discovery datasets, combinatorial optimization tasks, and
      domain-specific lab-in-the-loop validation.'
    - 'Supervision and verification signals differ: code execution feedback, literature-grounded
      traceability, wet-lab experimental validation, or benchmark-derived metrics
      are used as evidence.'
    - 'Methodological evidence is uneven: several systems report benchmark or domain
      wins without visible limitation or external artifact details, while surveys
      and benchmarks expose reliability, evidence-preservation, and reproducibility
      gaps.'
    open_questions:
    - How well do proxy metrics such as ARC-Bench, LABBench2, and symbolic-equation
      baselines align with successful real-world hypothesis generation and scientific
      utility?
    - What mechanisms prevent unreliable statements and weak hypotheses from propagating
      across long runs beyond the tested 20-cycle or benchmark-scale limits?
    - What is the minimum and most effective human intervention granularity for keeping
      autonomous research aligned and accountable across domains?
    - Can shared world-state or research-tree representations maintain coherence when
      moving to out-of-distribution topics or less structured scientific problems?
    - Which observed gains come from multi-agent workflow, reflection or search structure,
      human oversight, or underlying model capability, given limited ablation and
      reproducibility evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流水线：连接文献搜索、数据分析、假设生成、实验或代码执行以及报告综合的多智能体系统
      解决的问题: 将开放目标加数据或文献转化为候选假设和可解释结果
      尚未覆盖: 长周期中的事实可靠性与错误遏制、弱方向拒绝，以及超出已测设置的领域泛化
    - 路线: 结构化搜索与反思层：基于树的进化搜索、结构化辩论或分层反思，用于提出、分支和修正假设
      解决的问题: 使探索和回溯系统化，让假设生成更可检查且更少随机性
      尚未覆盖: 报告增益多少来自搜索或反思质量而非底层模型能力或任务先验；超出已测分支或周期的扩展性
    - 路线: 共享状态或世界模型脚手架：在文献智能体和数据分析智能体之间共享信息的结构化表示
      解决的问题: 维持长程多智能体发现过程的一致性
      尚未覆盖: 学习到的状态在训练分布之外是否仍足以支撑决策；该表示本身缺少外部验证
    - 路线: 人机协作与监督：在自主工作流的高杠杆决策点加入选择性人工干预
      解决的问题: 减少虚假、幻觉引用和盲点，同时保持效率
      尚未覆盖: 最优干预粒度、跨领域问责，以及协作结果能否迁移到机构或具身场景
    - 路线: 评测与可复现基础设施：用于测量研究相关模型能力的基准、任务数据集和评估工具
      解决的问题: 使前沿模型的能力声明可比较，并揭示剩余性能差距
      尚未覆盖: 代理任务可能与真实发现效用不一致；可复现性和指标覆盖仍不完整
    - 路线: 概念分类与工作流评估：将自主研究组织为工作流条件、自主性谱系和评估维度的综述
      解决的问题: 在文献基础、假设形成、实验、反馈和报告等环节定义边界和评估标准
      尚未覆盖: 所提出的分类能否预测系统行为或成功发现仍缺少直接实证验证
    共识:
    - 多数系统同意将研究分解为文献基础、假设形成、执行或实验、反馈验证和报告传播；假设生成被看作迭代闭环，而非一次性补全。
    - 系统普遍认为，结合代码或工具执行、结构化反思或实验反馈后，基于智能体的LLM流水线能产出有用候选假设或发现。
    - 综述和基准证据共同表明，自主性受领域条件约束：在结构化、可执行、可快速验证的设置中更可信，在具身、延迟、异质或伦理问责场景中较弱。
    - 可验证或可追溯输出正在成为共同机制，以减少虚假数字和幻觉引用。
    分歧:
    - 交互模式不同：有的强调完全自主，另一些认为在高杠杆决策点进行精准人类协作优于逐步监督和完全自主。
    - 假设搜索表示不同：结构化研究树与进化搜索和回溯、结构化辩论、并行数据分析与文献循环、符号方程优化等路径并存。
    - 评测对象不同：广泛研究行为基准、生物学题库、方程发现数据集、组合优化任务和领域特定的实验室在环验证各有侧重。
    - 监督和验证信号不同：代码执行反馈、文献来源可追溯性、湿实验验证或基准指标分别被用作证据。
    - 方法学证据不均衡：若干系统报告基准或领域优势，但缺少可见的局限性或外部工件细节；综述与基准揭示了可靠性、证据保存和可复现性缺口。
    开放问题:
    - ARC-Bench、LABBench2 及符号方程基线等代理指标在多大程度上与真实世界假设生成和科学效用一致？
    - 在超出已测试的20周期或基准规模后，哪些机制能阻止不可靠陈述和较弱假设在长程运行中扩散？
    - 在不同领域中，使自主研究保持对齐和可问责的最小且最有效人类干预粒度是什么？
    - 共享世界状态或研究树表示在迁移到分布外主题或更非结构化的科学问题时，能否维持一致性？
    - 在有限消融和可复现证据下，观测到的性能提升有多少来自多智能体流程、反思或搜索结构、人类监督或底层模型能力？
