  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research workflow systems
      what_it_solves: Automates idea generation, code or experiment execution, analysis,
        visualization, and paper writing in a single agentic pipeline.
      what_remains_open: External validation is limited to self-generated papers,
        workshop review, or LLM-review thresholds; full-conference and real-world
        reliability remain unproven.
    - line: Domain-specific discovery agents with verification gates
      what_it_solves: Uses domain logic or physics-aware checks to detect invalid
        derivations and silent simulation failures before claims are written.
      what_remains_open: Reported gate still missed 2 of 16 planted failures, and
        transfer beyond the configured domain or solver is not established.
    - line: Benchmark environments for complete discovery cycles
      what_it_solves: Provides structured discovery tasks and automatic metrics for
        task completion, relevant actions, or explanatory knowledge.
      what_remains_open: Strong prior agents struggle, but simulated task metrics
        do not yet align with real scientific decision utility or novel-contribution
        validity.
    - line: Evidence-grounded claim evaluation
      what_it_solves: Blind peer-study tasks and rubric-based LLM judging score evidentiary
        maturity, auditability, controls, robustness, and novelty.
      what_remains_open: Only one frozen base model was used; evaluated coding agents
        plateaued and lacked controls, robustness, falsifiability, and cross-dataset
        generalization.
    - line: Progressive search and reviewer feedback for manuscript improvement
      what_it_solves: Agentic tree search and experiment-manager loops reduce dependence
        on fixed templates and iteratively refine manuscripts and figures.
      what_remains_open: Only one of three submitted manuscripts passed peer review,
        indicating inconsistent performance and workshop-level rather than full-conference
        evidence.
    consensus:
    - Scientific discovery is formulated as an end-to-end agentic loop from ideation
      through execution to manuscript or report generation.
    - 'Systems increasingly include an automated gate: logical coherence, physics-aware
      visual checks, simulated review, or rubric-based evidence scoring.'
    - Current evidence shows agents can execute analyses and write plausible papers,
      but do not yet consistently produce trustworthy novel science.
    - Reproducibility evidence is mixed; some systems provide code, benchmark, or
      task artifacts, while others only report paper or review outcomes, leaving verification
      gaps.
    disagreements:
    - 'Evaluation target: manuscript acceptance thresholds, task completion or explanatory
      knowledge, and evidence maturity are used as different success criteria.'
    - 'Grounding strategy: domain-specific verification for mathematics or fluid dynamics
      contrasts with general-purpose LLM review without embedded domain validity checks.'
    - 'Interaction mode: some systems are fully autonomous, while others use a human
      principal investigator and agent-as-graduate-student collaboration.'
    - 'Judge signal: automated LLM reviewers, peer review, vision-language gate failures,
      and rubric scores reward different aspects of scientific claims.'
    - 'Deployment setting: benchmark environments, workshop peer review, and self-generated
      papers differ in whether they test reproducibility, novelty, or reliability.'
    open_questions:
