  related_work_outline_zh:
  - 主流方向：构建端到端自主科研智能体，自动提出假设、执行实验、分析证据并撰写论文，同时越来越多地加入自动评审和领域特定验证门控。
  - 研究共性：把发现循环分解为构思、代码或实验执行、结果分析、手稿撰写和自动评判，并叠加验证或基准层过滤不可靠结论。
