  - 趋势演进：2024至2026年间，从ML子领域的框架演示逐步走向任务套件压力测试、工作坊级同行评审、失败感知记忆和交互式多智能体基础设施；2023年证据未进入前列。
  - 开放问题：开放式新颖性、LLM评审可靠性、跨少量案例/仿真任务迁移，以及共享工件和外部复现的证据仍显不足。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agents
      what_it_solves: Run a complete research episode from hypothesis formation and
        code/experiment execution to result analysis and manuscript writing.
      what_remains_open: Consistency across runs, removal of human templates, and
        generalization beyond a few machine learning or mathematics case studies remain
        under-supported.
    - line: Virtual discovery environments
      what_it_solves: Provide repeatable tasks and metrics for hypothesis, experiment,
        analysis, and conclusion cycles without expensive real laboratories.
      what_remains_open: Whether strong baseline failure on tasks translates to better
        real scientific decisions, and whether text/simulation tasks cover real-world
        constraints, remains unclear.
    - line: Experiment planning evaluation
      what_it_solves: Isolate ablation design and missing-experiment detection as
        measurable research reasoning tasks.
      what_remains_open: Current recall is below human level and author/reviewer condition
        differences suggest grounding issues rather than a solved capability.
    - line: Failure-aware memory and search
      what_it_solves: Record and reuse unsuccessful attempts so later experiments
        avoid repeated mistakes and can transfer negative evidence across related
        problems.
      what_remains_open: Evidence comes from limited PDE and ScienceAgentBench cases;
        long-term scalability and generality to noisy real-world experiments remain
        unproven.
    - line: Interactive research infrastructure
      what_it_solves: Turn a single prompt into a configurable multi-agent team with
        monitoring, rollback, and code harness integration for runnable experiments.
      what_remains_open: Evaluated on a small internal AI case-study set; external
        validation and maturity are early.
    consensus:
    - Research automation is treated as a closed-loop process connecting idea generation,
      execution, analysis, and written output rather than a single inference step.
    - Automated judging or internal verification is used as a scalable evaluation
      proxy, but human or peer acceptance remains an external standard.
    - Current demonstrations concentrate on code, simulation, and narrow scientific
      tasks; real-world open-ended validity is not yet established.
    - Failure handling and verification improve consistency, but evidence is case-study
      based rather than from broad external task suites.
    disagreements:
    - 'Evaluation target: some work scores generated manuscripts with LLM or peer
      review, others score virtual environment task completion, and others isolate
      experiment planning recall.'
    - 'Interaction mode: fully automated minimal-prompt pipelines, human-as-PI collaboration,
      and dashboard-supervised configurable teams imply different levels of human
      oversight.'
    - 'Coordination mechanism: agentic tree search, curated failure memory, internal
      logical verification, and code harness/rollback use different ways to manage
      experiment branches and errors.'
    - 'Domain scope: applied mathematics, machine learning subfields, broad simulated
      science topics, and PDE problem-solving create different assumptions about available
      simulators and verification.'
    open_questions:
    - Can generated outputs be shown to be novel beyond recovering known solutions,
      and what external evidence would establish that?
    - Are LLM reviewers calibrated with human peer judgment across domains and output
      types?
    - Does failure-aware memory transfer beyond the limited PDE and task-suite cases
      shown?
    - How should automated experimentation systems be validated across external hardware,
      datasets, and user settings when artifacts are not yet standardized?
    - What mix of task completion, paper quality, and decision-utility metrics should
      define progress?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现智能体
      解决的问题: 把假设形成、代码或实验执行、结果分析和论文撰写串成完整研究回路。
      尚未覆盖: 跨运行一致性、去掉人类模板，以及在少数机器学习或数学案例之外的泛化仍证据不足。
    - 路线: 虚拟科学发现环境
      解决的问题: 为假设、实验、分析和结论循环提供可重复任务与自动指标，降低真实实验室成本。
      尚未覆盖: 强基线在任务上表现困难是否对应真实科学决策改进，以及文本/仿真任务是否覆盖现实约束仍不清楚。
    - 路线: 实验规划评测
      解决的问题: 把消融设计和缺失实验识别作为可量化的研究推理能力来评估。
      尚未覆盖: 当前召回低于人类，作者/审稿人条件差异说明存在模型基础不一致问题而非能力已解决。
    - 路线: 失败感知记忆与搜索
      解决的问题: 记录并复用失败尝试，让后续实验避免重复错误，并跨相关问题迁移负面证据。
      尚未覆盖: 现有证据主要来自少量 PDE 和 ScienceAgentBench 案例，长期可扩展性与真实噪声实验的通用性未证实。
    - 路线: 交互式研究基础设施
      解决的问题: 用提示生成可配置多智能体团队，并提供监控、回滚和代码harness接入可运行实验。
      尚未覆盖: 仅在少量内部 AI 案例上评测，外部验证和系统成熟度仍然早期。
    共识:
    - 研究自动化被视作连接想法生成、执行、分析和书面输出的闭环，而不是单步推理。
    - 自动评审或内部校验被用作可扩展评价代理，但人类或同行接受仍是外部标准。
    - 当前展示集中在代码、仿真和窄科学任务上；真实开放世界有效性尚未建立。
    - 失败处理和验证能改善一致性，但证据多为案例研究，而非广泛外部任务套件。
    分歧:
    - 评测目标：一些工作用LLM或同行评审给论文打分，另一些看虚拟环境任务完成，还有工作单独测量实验规划召回。
    - 交互模式：全自动最小提示流水线、人类担任PI协作、以及仪表板监督可配置团队意味着不同的人类监督程度。
    - 协调机制：智能体树搜索、策展失败记忆、内部逻辑验证和代码harness/回滚采用不同方式管理实验分支和错误。
    - 领域范围：应用数学、机器学习子领域、广域仿真科学主题和PDE求解对可用仿真器和验证方式假设不同。
    开放问题:
    - 生成结果如何证明超越已知解法的新颖性，需要怎样的外部证据？
    - LLM评审在跨领域和输出类型上是否与人类同行判断一致？
    - 失败感知记忆能否迁移到所示有限PDE和任务套件之外的场景？
    - 在工件尚未标准化时，如何在外部硬件、数据集和用户设置上验证自动化实验系统？
    - 任务完成率、论文质量和决策效用指标应如何组合才能定义进展？
