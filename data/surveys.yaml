  related_work_outline:
  - 'Mainstream direction: The current frontier is agentic AI for autonomous scientific
    research, especially end-to-end literature synthesis, reasoning, and paper generation
    under human oversight.'
  - 'Shared research pattern: Multi-agent or pipeline architectures combine retrieval,
    verification, critique, and manuscript generation, using LLM-based rubrics, blind
    tasks, or human baselines.'
  - 'Key differences: Work varies by evaluation target, domain focus, and architecture
    fixity, with some systems using fixed verification pipelines and others emphasizing
    self-evolving frameworks.'
  - 'Trend evolution: Evidence clusters in 2025-2026, showing a shift from surveys
    and case analyses toward benchmarked autonomous research agents and self-evolving
    systems.'
  - 'Open questions: Whether LLM judges track human scientific judgment, whether findings
    generalize across base models and domains, and whether agents can produce trustworthy
    research-gap discovery.'
  related_work_outline_zh:
  - 主流方向：当前前沿是面向自主科学研究的智能体AI，尤其聚焦端到端文献综合、推理和论文生成，并保留人类监督。
  - 研究共性：多智能体或流水线架构结合检索、验证、批判与手稿生成，常见评估包括LLM评审、盲任务或人类基线。
  - 关键差异：研究在评测目标、领域侧重和架构固定性上不同，部分系统采用固定验证流水线，部分强调自演化框架。
  - 趋势演进：证据集中在2025至2026年，呈现从综述和案例分析走向带基准的自主研究智能体与自演化系统的趋势。
  - 开放问题：LLM评审是否与人类科学判断一致，结论能否跨基座模型和领域泛化，以及智能体能否产生可信的研究缺口发现。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous literature synthesis and manuscript generation
      what_it_solves: Combines domain knowledge retrieval, literature synthesis, derivation,
        experimentation, and paper drafting into an end-to-end research artifact.
      what_remains_open: Quality is assessed mainly through internal LLM-based review;
        visible evidence lacks independent human or external benchmark validation
        of generated literature claims.
    - line: Evidence-grounded evaluation of discovery claims
      what_it_solves: Builds blind tasks and multidimensional evidence-maturity scoring
        for open-ended scientific or data-driven discovery claims.
      what_remains_open: Evaluated agents concentrate around mid-range scores under
        one frozen base model; controls, robustness, falsifiability, and cross-dataset
        generalization remain weak.
    - line: Scalable multi-agent orchestration and self-evolution
      what_it_solves: Provides domain-agnostic frameworks for building agents that
        refine hypotheses, self-critique, and accumulate knowledge across research
        cycles.
      what_remains_open: Visible evidence reports benchmark gains but does not clearly
        document limitations, external validation, or failure modes.
    - line: Survey and failure-case synthesis for research workflows
      what_it_solves: Maps agentic research capabilities, metrics, frameworks, and
        recurring failure modes into progress surveys and design principles.
      what_remains_open: Survey categories and design principles lack direct empirical
        validation for predicting model behavior; literature review automation is
        identified as unresolved.
    consensus:
    - Current systems can execute and document literature-related analysis tasks in
      controlled settings but are not yet reliable autonomous scientists.
    - Verification, retrieval, and human-in-the-loop collaboration are recurring mechanisms
      intended to reduce logical errors and improve trust.
    - Evaluation remains substantially dependent on LLM-based judgment or derived
      multiple-choice tasks; visible human and cross-model validation is limited.
    disagreements:
    - Some work evaluates open-ended evidence maturity from blind data, while other
      work uses domain-specific multiple-choice discovery questions and annotation
      tasks.
    - One line emphasizes fixed multi-agent verification for theory-heavy paper generation,
      while another claims broad gains from a self-evolving domain-agnostic framework.
    - 'Success criteria differ: some studies use curated LLM rubric scores for generated
      paper quality, while others rely on benchmark score improvements and statistical
      or relative gains.'
    open_questions:
    - How well do LLM-based rubrics and judges align with expert human assessment
      of literature synthesis and discovery validity?
    - Do current agent findings generalize beyond a single frozen base model and the
      specific tasks or domains represented in the evidence?
    - Can agents move from executing analyses to generating trustworthy, falsifiable
      research gaps with appropriate controls and robustness checks?
    - What external validation and limitation reporting are needed to substantiate
      claimed self-evolution and state-of-the-art benchmark performance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主文献综合与手稿生成
      解决的问题: 将领域知识检索、文献综合、推导、实验和论文起草整合为端到端研究产出。
      尚未覆盖: 质量主要由内部LLM评审评估；可见证据中缺少独立人工或外部基准验证来确认生成文献主张的正确性。
    - 路线: 证据锚定的发现主张评测
      解决的问题: 通过盲任务和多维证据成熟度评分，评测开放式科学或数据驱动发现主张。
      尚未覆盖: 受评智能体在单一冻结基座模型上集中在中等得分；对照、稳健性、可证伪性和跨数据集泛化仍较弱。
    - 路线: 可扩展多智能体编排与自演化
      解决的问题: 提供领域无关框架，使智能体在研究周期中优化假设、自我批判并积累知识。
      尚未覆盖: 可见证据报告基准提升，但未清楚记录局限性、外部验证或失败模式。
    - 路线: 研究工作流的综述与失败案例分析
      解决的问题: 将智能体研究能力、指标、框架和重复失败模式整理为进展综述与设计原则。
      尚未覆盖: 综述分类和设计原则缺乏直接实证验证；文献综述自动化仍被认定为未解决问题。
    共识:
    - 当前系统能在受控设置下执行并记录文献相关分析，但尚不是可靠的自主科学家。
    - 验证、检索和人类在环协作被反复用作减少逻辑错误和提升可信度的机制。
    - 评估仍依赖LLM判断或由已发表研究衍生的选择题；可见证据中人工和跨模型验证有限。
    分歧:
    - 部分工作评测盲数据上的开放式证据成熟度，另一部分使用领域特定的发现选择题和标注任务。
    - 一方侧重固定多智能体验证用于理论密集型论文生成，另一方声称领域无关自演化框架带来广泛基准收益。
    - 成功主张不同：通过精选LLM评分衡量生成论文质量，或通过基准分数提升和统计/相对增益衡量性能。
    开放问题:
    - 基于LLM的评分与专家对文献综合和发现有效性的判断是否一致？
    - 当前智能体结论能否泛化到单一冻结基座模型之外的基座模型、领域和任务？
    - 智能体能否从执行分析推进到提出可信、可证伪并带对照和稳健性检验的研究缺口？
    - 需要何种外部验证和局限性报告来支持自演化和最先进基准性能声明？
