  literature_review:
    line_of_work_matrix:
    - line: Autonomous closed-loop research agents
      what_it_solves: End-to-end generation and testing of hypotheses by combining
        data analysis, literature search, code execution, and iterative refinement.
      what_remains_open: Factual accuracy of generated statements and long-horizon
        reliability beyond small cycle counts remain only partially validated.
    - line: Structured hypothesis search and trajectory control
      what_it_solves: Systematic exploration of hypothesis spaces through branching,
        backtracking, evolutionary selection, and hierarchical reflection.
      what_remains_open: Demonstrated gains focus on selected optimization and forecasting
        settings; transfer to open-ended scientific domains is not established.
    - line: Shared state or world-model representations for discovery
      what_it_solves: Coherent multi-source reasoning by sharing information between
        analysis and literature agents across long agent rollouts.
      what_remains_open: Report accuracy is imperfect, and scaling evidence stops
        at tested rollout or cycle horizons.
    - line: Evaluation benchmarks for research capabilities
      what_it_solves: Comparable measurement of model performance on realistic scientific
        tasks through task suites and evaluation harnesses.
      what_remains_open: Proxy task accuracy does not yet map to real discovery utility,
        and harder realistic contexts still produce large performance drops.
    - line: Taxonomy and workflow frameworks for autonomous research
      what_it_solves: Organizing autonomy spectra, workflow conditions, and evaluation
        dimensions so systems can be compared by design assumptions.
      what_remains_open: The proposed categories and dimensions lack direct empirical
        validation that they predict system behavior across domains.
    consensus:
    - Autonomous research systems commonly split discovery into hypothesis generation,
      execution or experiment, evaluation, and reporting loops.
    - Reliability and evidence preservation are treated as central weaknesses, motivating
      verifiable reporting, provenance tracking, or human oversight.
    - Current evaluations show improvement over strong baselines, but realistic task
      settings remain substantially harder and leave a clear performance gap.
    disagreements:
    - 'Interaction mode differs: some systems seek full autonomy across long runs,
      while others argue targeted human collaboration at key decision points is more
      effective.'
    - 'Hypothesis exploration differs: structured tree search with backtracking and
      evolutionary selection contrasts with parallel world-model cycles and multi-agent
      debate mechanisms.'
    - Evaluation targets and domain assumptions differ, spanning biology tasks, scientific
      equation discovery, time-series forecasting architecture evolution, and combinatorial
      optimization.
    open_questions:
    - How can systems close the observed accuracy gap when a notable fraction of generated
      report statements may still be inaccurate?
    - How far do gains in specific benchmarks or domains transfer to embodied, delayed,
      heterogeneous, or institutionally accountable research settings?
    - Which search and oversight mechanism best prevents weak-direction persistence
      without sacrificing exploration or requiring exhaustive human supervision?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主闭环研究智能体
      解决的问题: 结合数据分析、文献检索、代码执行和迭代优化，端到端生成并验证假设。
      尚未覆盖: 生成陈述的事实准确性以及小周期之外的长程可靠性仍只被部分验证。
    - 路线: 结构化假设搜索与轨迹控制
      解决的问题: 通过分支、回溯、进化选择和分层反思，系统探索假设空间。
      尚未覆盖: 收益主要集中在选定的优化和预测场景；能否迁移到开放科学领域尚无证据。
    - 路线: 面向发现的共享状态或世界模型表征
      解决的问题: 在长周期智能体运行中共享分析与文献信息，形成连贯多源推理。
      尚未覆盖: 报告准确率并非完美，且扩展性证据止于已测的 rollout 或周期范围。
    - 路线: 研究能力评测基准
      解决的问题: 通过任务集和评测工具，对科学任务中的模型表现进行可比较测量。
      尚未覆盖: 代理任务准确率尚未映射到真实发现效用，且更真实场景仍造成大幅性能下滑。
    - 路线: 自主研究的分类与工作流框架
      解决的问题: 组织自主性谱系、工作流条件和评估维度，使系统可按设计假设进行比较。
      尚未覆盖: 这些分类与维度是否能跨领域预测系统行为，仍缺乏直接实证验证。
    共识:
    - 自主研究系统通常把发现拆分为假设生成、执行或实验、评估和报告循环。
    - 可靠性与证据保存被视为核心弱点，因此引入可验证报告、来源追踪或人工监督等机制。
    - 当前评测显示相对强基线有提升，但更真实的任务设置明显更难，仍存在显著能力缺口。
    分歧:
    - 交互模式不同：有的系统追求长周期完全自主，有的则认为在关键决策点引入精准人机协作更有效。
    - 假设探索方式不同：带回溯的结构化树搜索和进化选择，与并行世界模型循环、多智能体辩论机制形成对比。
    - 评测目标和领域假设不同，涉及生物任务、科学方程发现、时间序列预测架构演化以及组合优化。
    开放问题:
    - 当生成报告陈述仍有一定比例不准确时，如何系统性地缩小事实准确性缺口？
    - 在具身、延迟、异质或需要机构问责的研究场景中，现有基准或特定领域的收益能迁移多少？
    - 哪种搜索与监督机制最能在避免弱方向持续的同时保持探索，而不需要穷尽式人工监督？
