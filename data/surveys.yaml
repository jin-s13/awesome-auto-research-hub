    研究路线矩阵:
    - 路线: 端到端自主科学发现管线
      解决的问题: 自动化从想法生成、编码、实验执行到论文写作和模拟评审的完整研究循环。
      尚未覆盖: 跨领域和多次运行的性能一致性；多数评估仅限于机器学习子领域或工作坊级别接受度，在理论密集型科学中的可靠性尚未充分探索。
    - 路线: 面向自动化实验的基准与评测套件
      解决的问题: 提供标准化任务和指标，衡量AI智能体在科学发现中的规划与执行能力，如消融规划和多步实验设计。
      尚未覆盖: 当前语言模型在这些基准上远低于人类水平；自动评判器与人类专家评估之间的一致性仍不确定。
    - 路线: 面向迭代式研究智能体的记忆与知识管理
      解决的问题: 将失败实验捕获为结构化负知识以避免重复并指导未来假设，同时检索相关领域事实以减少专家干预。
      尚未覆盖: 失败记忆在不同科学问题之间的可迁移性，以及策展策略在大规模、带噪失败日志上的可扩展性尚未测试。
    - 路线: 交互式多智能体研究平台
      解决的问题: 使人类研究者能够定制智能体角色、实时监控实验，并将本地代码库注入研究循环，混合人类监督与智能体自主性。
      尚未覆盖: 平台成熟度处于早期阶段；评估仅限于少量内部案例研究，缺乏跨不同用户群体和硬件设置的外部验证。
    共识:
    - 大语言模型是所有系统中用于假设生成、代码编写和结果解释的核心引擎。
    - 无论内部验证器、模拟评审还是失败记忆，某种形式的自动反馈循环对于超越一次性生成至关重要。
    - 运行完整发现循环的成本已足够低，能够支持大规模实验（某些情况下单篇论文成本低于15美元）。
    - 当前智能体仍缺乏人类科学家的可靠性，尤其是在需要基于物理或领域特定约束进行推理的复杂多步任务中。
    分歧:
    - 领域可及性：一些管线专为基于代码的机器学习实验设计，而另一些则融入了面向应用数学的符号推理，导致对所需工具链和验证策略的假设存在根本差异。
    - 人类参与程度：系统从完全自主（初始提示后无人类参与）到交互式仪表板，人类可监控、回滚和引导研究过程，反映了对人机协作模式的不同构想。
    - 记忆设计：一条路线依赖共享负知识库来避免过去失败，其他路线则在每次运行后丢弃历史或仅依赖模型上下文窗口，暗示了对长期实验记忆价值的不同假设。
    - 评估基础：部分工作通过真实的工作坊同行评审进行验证，其他使用基于LLM的评判器，还有的采用具有自动计算指标的结构化基准，导致关于智能体性能的声明难以直接比较。
    开放问题:
    - 在孤立的偏微分方程任务中开发的失败知识方法，能否泛化到DISCOVERYWORLD基准所涵盖的更广泛科学发现环境？
    - 为什么在消融规划中思维链提示表现优于基于智能体的方法，这对自动化研究智能体的架构选择有何启示？
    - 如何验证理论密集型智能体（如ReasFlow）中使用的内部逻辑一致性检查，能够覆盖经验科学中无真实证明的开放式探索需求？
    - 在全自动论文生成中，从工作坊级别提升到完整会议级别接受度，所需的最小人类反馈信号集是什么？
