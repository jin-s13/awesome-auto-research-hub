  literature_review:
    line_of_work_matrix:
    - line: Agentic multi-stage survey generation
      what_it_solves: Decomposes survey writing into planning, retrieval, section
        drafting, review, and iterative refinement to produce long-form scholarly
        manuscripts.
      what_remains_open: Robustness across larger or more diverse paper sets and whether
        rubric/LLM-judge scores align with expert judgment.
    - line: Structured outline and taxonomy organization
      what_it_solves: Organizes retrieved papers into hierarchical taxonomies, outlines,
        and paper-level keynotes that guide coherent survey structure.
      what_remains_open: Machine-generated taxonomies still show weak mutual exclusivity,
        imbalance, and low alignment with expert reference taxonomies; evaluation
        depends heavily on a single expert reference.
    - line: Citation grounding and evidence-constrained synthesis
      what_it_solves: Improves citation coverage and reliability by combining retrieval
        expansion, citation-graph filtering, full-text analysis, code-repository signals,
        and claim-to-citation checking.
      what_remains_open: Generalization beyond selected computer science topics and
        verification of claim-citation consistency across fast-moving or non-English
        literature.
    - line: Evaluation benchmarks and metrics for survey synthesis
      what_it_solves: Makes survey quality comparable through pairwise survey arenas,
        expert taxonomy references, and metrics for coverage, structure, citation,
        and taxonomy similarity.
      what_remains_open: Topic coverage is limited, large-corpus stress tests are
        scarce, and evidence linking proxy metrics to downstream scholarly utility
        is incomplete.
    - line: Governed end-to-end scholarly research workflows
      what_it_solves: Extends automated research/survey workflows with governance,
        scientist-in-the-loop oversight, privacy-preserving data access, and reproducible
        orchestration.
      what_remains_open: Current evidence is case-study-level and not yet connected
        to general survey generation quality or external validation.
    consensus:
    - The dominant architecture is agentic and iterative, with separate planning,
      retrieval, drafting, evaluation, and refinement stages cooperating to produce
      surveys.
    - Human-written surveys and expert-authored taxonomies are the main reference
      standards for quality.
    - Evaluation concentrates on coverage, structural coherence, citation quality,
      and taxonomy organization rather than downstream research decisions.
    - Citation fidelity and taxonomy alignment remain recurring weak points even when
      overall content scores are strong.
    disagreements:
    - 'Systems differ in their primary bottleneck: rubric-guided manuscript refinement,
      outline/paper-card generation, real-time retrieval, full-text and code-grounded
      citation, or taxonomy construction.'
    - 'Evaluation designs differ: multi-LLM scoring, pairwise human-style comparison,
      reference-based taxonomy metrics, or end-to-end real-world case studies.'
    - Some approaches aim for fully automated generation while another line emphasizes
      governed, scientist-in-the-loop workflows with privacy constraints.
    - 'Scalability evidence is inconsistent: some results report high coverage on
      smaller paper sets but lower coverage on very large sets, while most systems
      evaluate only selected topics.'
    open_questions:
    - How well do rubric-based and multi-LLM scores predict expert or reader utility
      outside the evaluated topic sets?
    - Can retrieval and citation constraints maintain high coverage and precision
      when the paper corpus is much larger or fast-moving?
    - What evaluation design can distinguish a model's taxonomy failure from legitimate
      disagreement with a single expert taxonomy?
    - How can evidence-constrained synthesis be validated across domains when code,
      dataset, or limitation details are often missing?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多智能体分阶段综述生成
      解决的问题: 把综述写作拆分为规划、检索、分节撰写、评审与迭代优化，以生成长篇学术手稿。
      尚未覆盖: 在更大、更多样论文集合上的稳健性，以及评分准则或 LLM 评委分数与专家判断是否一致仍缺少验证。
    - 路线: 结构化大纲与分类法组织
      解决的问题: 把检索到的论文组织为层次分类、大纲和论文级要点，以支撑连贯的综述结构。
      尚未覆盖: 机器生成的分类法在互斥性、结构均衡和对专家参考的对齐上仍较弱，且评价依赖单一专家参考。
    - 路线: 引用依据与证据约束综合
      解决的问题: 通过检索扩展、引文图过滤、全文分析、代码库信号和声明-引用核对提升引用覆盖与可靠性。
      尚未覆盖: 在选定计算机科学主题之外的泛化，以及快速更新或非英语文献中的声明-引用一致性验证。
    - 路线: 综述综合评测基准与指标
      解决的问题: 通过成对综述竞技场、专家分类参考以及覆盖、结构、引用和分类相似度指标，使质量可比。
      尚未覆盖: 主题覆盖有限，大语料压力测试不足，代理指标与下游学术效用之间的联系证据不足。
    - 路线: 受治理端到端学术研究工作流
      解决的问题: 在自动研究/综述流程中加入治理、科学家在环、隐私保护数据访问和可复现编排。
      尚未覆盖: 目前证据停留在案例研究层面，尚未与通用综述生成质量或外部验证建立联系。
    共识:
    - 主流架构是智能体化且迭代式，规划、检索、撰写、评审和优化阶段协作生成综述。
    - 人工撰写综述和专家分类树是主要质量参照。
    - 评测集中在覆盖度、结构连贯性、引用质量和分类法组织，而不是下游研究决策。
    - 即使整体内容分数较高，引用保真与分类对齐仍是反复出现的薄弱点。
    分歧:
    - 系统关注的瓶颈不同：评分准则引导的手稿优化、大纲/论文卡片生成、实时检索、全文与代码约束引用，或分类法构建。
    - 评测设计有差异：多 LLM 评分、成对人类偏好比较、基于参考分类的指标，或端到端真实案例研究。
    - 部分系统追求全自动生成，另一条路线强调受治理、科学家在环且受隐私约束的工作流。
    - 可扩展性证据不一致：有的在较小论文集上覆盖率较高，但在非常大集合上下降；多数仅评估选定主题。
    开放问题:
    - 基于评分准则和多 LLM 分数的结果能否预测其在评估主题之外的专家或读者效用？
    - 当论文语料规模更大或更新更快时，检索和引用约束能否保持高覆盖与高精确？
