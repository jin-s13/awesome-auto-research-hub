  literature_review:
    line_of_work_matrix:
    - line: Benchmarks and evaluation environments for discovery agents
      what_it_solves: Makes open-ended automated research comparable through tasks,
        blind or frozen datasets, domain-specific questions, and automated or human
        references.
      what_remains_open: Task-completion and LLM-judge proxies are not yet shown to
        align with real scientific decision utility; evidence is often limited to
        one base model, domain, or task suite.
    - line: End-to-end autonomous research systems with verification gates
      what_it_solves: Turns LLM ideation into runnable experiments, source-code modification,
        artifact generation, and self-review or physics/vision verification.
      what_remains_open: Verification gates can still miss silent failures, publication
        success is inconsistent, and measured gains may partly come from domain-specific
        tooling or task-specific priors.
    - line: Evidence-maturity and reliability rubrics
      what_it_solves: Operationalizes controls, robustness, falsifiability, auditability,
        novelty, and generalization into scored dimensions for scientific claims.
      what_remains_open: Scored differences among tested coding agents are small,
        cross-base-model generalization is unproven, and the causal link from rubric
        dimensions to trustworthiness is missing.
    - line: Interactive multi-agent research platforms
      what_it_solves: Provides customizable roles, real-time monitoring, rollback/resume,
        artifact inspection, and local code harnesses for inspectable research workflows.
      what_remains_open: Evaluation relies on limited internal case studies and judge
        preference, leaving cross-user, cross-hardware, and cross-dataset validation
        open.
    consensus:
    - Automated research pipelines can propose hypotheses, execute analyses, and document
      results, but reliability is judged through evidence rather than paper plausibility
      alone.
    - Blind tasks, hidden source conclusions, verification gates, and evidence-maturity
      dimensions are recurring mechanisms for detecting unsupported findings or silent
      failures.
    - Current systems still fall short of fully autonomous trustworthy discovery because
      they lack discriminating controls, robustness, falsifiability, and generalization.
    disagreements:
    - 'Evaluation targets differ: open-ended virtual discovery tasks, domain-specific
      blinded data claims, publication readiness, and human-relative biological annotation
      are used as separate outcome definitions.'
    - 'Supervision signals differ: hidden peer-reviewed source conclusions, human
      expert judges, simulated review, and physics-aware visual verification encode
      different notions of ground truth.'
    - 'Success criteria differ: numerical task metrics, LLM-judge evidence scores,
      peer-review acceptance, physical residual reduction, and expert preference are
      not interchangeable.'
    - 'Deployment settings differ: some systems emphasize one-shot fully autonomous
      generation while others emphasize interactive human-in-the-loop monitoring,
      rollback, and artifact inspection.'
    open_questions:
    - Can LLM-judge evidence-maturity scores predict human judgment, real-world validity,
      or downstream decision utility outside the single frozen base model tested?
    - How should verification gates reduce missed silent failures without suppressing
      valid but unconventional discoveries?
    - What task coverage and metric design would provide credible cross-domain generalization
      evidence for open-ended discovery agents?
    - What human oversight, interaction mode, and governance boundary are necessary
      as systems move from workshop-level output toward production research?
    - Do domain-specific improvements such as physical residual reduction reflect
      discovery ability, or mainly reflect solver and agent integration quality?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向发现智能体的基准与评测环境
      解决的问题: 通过任务、盲测或冻结数据、领域问题以及自动或人工参照，使开放式自动研究表现可比较。
      尚未覆盖: 任务完成和LLM评委等代理指标是否对应真实科研决策效用尚未证明；证据常局限于单一基座模型、领域或任务集。
    - 路线: 带验证门控的端到端自主研究系统
      解决的问题: 将LLM构思转化为可运行实验、源码修改、工件生成和自我评审或物理/视觉验证。
      尚未覆盖: 验证门控仍会漏检静默失败，发表成功率不稳定，性能提升可能部分来自领域专用工具或任务特定先验。
    - 路线: 证据成熟度与可靠性评分框架
      解决的问题: 将对照、稳健性、可证伪性、可审计性、新颖性和泛化性操作化为可评分的科学主张质量维度。
      尚未覆盖: 受测编码智能体分数差异很小，跨基座模型泛化未经证明，评分维度与可信度之间的因果关联仍缺失。
    - 路线: 交互式多智能体研究平台
      解决的问题: 通过可定制角色、实时监控、回滚/恢复、工件检查和本地代码工具，提供可审查的研究工作流。
      尚未覆盖: 评估依赖有限的内部案例和评审偏好，跨用户、跨硬件和跨数据集的标准化外部验证尚未完成。
    共识:
    - 自动研究流程已能提出假设、执行分析并记录结果，但可靠性评价更多依赖证据而非论文表面可信度。
    - 盲任务、隐藏源结论、验证门控和证据成熟度维度是检测无支撑结论或静默失败的常用机制。
    - 当前系统距离完全自主且可信的科学发现仍有差距，普遍缺少对照、稳健性、可证伪性和泛化性。
    分歧:
    - 评测目标不同：开放虚拟发现任务、领域盲测数据主张、发表就绪度和人类相对的生物注释表现被作为不同的结果定义。
    - 监督信号不同：隐藏的同行评审源结论、人类专家评审、模拟评审和物理感知视觉验证编码了不同的真值概念。
    - 成功标准不同：数值任务指标、LLM评委证据分、同行评审接受、物理残差改进和专家偏好不可互换。
    - 部署模式不同：有的一次性全自主生成，有的强调可回滚、可检查的人类在环交互式平台。
