  literature_review:
    line_of_work_matrix:
    - line: Autonomous multi-agent research pipelines for hypothesis generation and
        experimentation
      what_it_solves: Propose and refine research hypotheses by combining debate,
        execution, and cross-run memory into a closed-loop workflow.
      what_remains_open: Whether generated ideas yield domain-level research insight
        rather than local engineering improvements; reliability under low supervision
        remains unresolved.
    - line: Verification-gated execution and failure attribution
      what_it_solves: Filter fabricated or physically invalid outputs and route experiment
        failures to corrected hypothesis, design, or implementation decisions.
      what_remains_open: Gates can miss silent failures, and fully autonomous scientific
        writing or conference-ready reporting is still difficult.
    - line: Human-AI collaboration and oversight
      what_it_solves: Place human intervention at high-leverage points and provide
        monitoring, rollback, and role customization in autonomous research.
      what_remains_open: Optimal intervention granularity and generalization beyond
        small internal case studies are not established.
    - line: Benchmark and testbed design for AI scientists
      what_it_solves: Make AI scientist claims comparable through tasks, expert baselines,
        trajectory analysis, and success or quality metrics.
      what_remains_open: Coverage across domains is limited, and alignment between
        benchmark gains and real scientific decision utility is unclear.
    - line: Domain-specific autonomous discovery agents
      what_it_solves: Embed hypothesis search in constrained scientific workflows
        such as fluid dynamics, omics, or forecasting with domain-specific verification.
      what_remains_open: Transfer of domain-specific verification and priors across
        datasets, tasks, and scientific fields remains untested.
    - line: Interactive research infrastructure and conceptual taxonomy
      what_it_solves: Turn research agents into inspectable, reusable platforms and
        organize workflow capabilities into categories.
      what_remains_open: Maturity, standardized external validation, and empirical
        evidence that categories predict system behavior are missing.
    consensus:
    - Research ideas must be grounded in executed evidence, dataset diagnostics, or
      prior failures instead of untested text proposals.
    - Autonomous claims require a verification layer such as deterministic authority,
      result-reporting constraints, or physics/vision gates.
    - Human oversight at selected high-leverage decision points can outperform both
      full autonomy and exhaustive step-by-step oversight.
    - Evaluation increasingly uses benchmark tasks, success rates, artifact quality,
      and expert checks to compare AI scientists.
    disagreements:
    - 'Interaction modes differ: fully autonomous loops with internal gates versus
      human-in-the-loop monitoring and targeted intervention versus interactive role-customizable
      teams.'
    - 'Reliability mechanisms differ: centralized verification or deterministic authority,
      multi-hypothesis failure attribution, or verifiable reporting constraints.'
    - 'Evaluation targets differ: domain metric improvement, long-horizon benchmark
      improvement, expert preference, or human-level biological annotation and discovery
      questions.'
    - 'Task generality differs: narrow domain-specific search such as fluid dynamics,
      forecasting, or omics versus multi-domain scientific ML benchmarks versus broad
      survey coverage.'
    open_questions:
    - Can AI scientists produce research-level conceptual advances rather than ML
      engineering tricks and local hyperparameter or architecture sweeps?
    - How can verification gates achieve high recall for silent failures while preserving
      autonomy?
    - Do current benchmark metrics and expert preferences predict real-world scientific
      decision utility or downstream discovery?
    - What is the right granularity and timing of human intervention for reliability
      without removing autonomy?
    - Do domain-specific hypothesis generation systems transfer to new datasets, tasks,
      or disciplines without re-engineering domain gates?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主多智能体研究流水线，用于假设生成与实验
      解决的问题: 通过辩论、执行和跨轮记忆形成闭环，提出并细化研究假设。
      尚未覆盖: 生成的想法能否带来领域级研究洞察，而非局部工程性能提升；低监督下的可靠性仍不明确。
    - 路线: 验证门控执行与失败归因
      解决的问题: 过滤伪造或物理上无效的输出，并将实验失败路由到修正后的假设、设计或实现决策。
      尚未覆盖: 门控仍可能遗漏静默失败，完全自主的科学写作或可投稿论文生成仍有困难。
    - 路线: 人机协作与监督
      解决的问题: 在高杠杆决策点引入人类干预，并在自主研究中提供监控、回滚和角色定制。
      尚未覆盖: 最佳干预粒度和在小规模内部案例之外的泛化尚未建立。
    - 路线: AI科学家的基准与测试平台设计
      解决的问题: 通过任务、专家基线、轨迹分析和成功/质量指标，使AI科学家声明具备可比性。
      尚未覆盖: 领域覆盖有限，基准增益与真实科学决策效用之间的一致性尚不清晰。
    - 路线: 领域特定的自主发现智能体
      解决的问题: 将假设搜索嵌入流体力学、组学或预测等受约束科学工作流，并使用领域验证。
      尚未覆盖: 领域特定验证与先验在数据集、任务和科学领域间的迁移仍未验证。
    - 路线: 交互式研究基础设施与概念分类
      解决的问题: 将研究智能体转化为可检查、可复用的平台，并把工作流能力组织为分类。
      尚未覆盖: 平台成熟度、标准化外部验证，以及分类能否预测系统行为，均缺少证据。
    共识:
    - 研究想法必须建立在已执行证据、数据集诊断或先前失败之上，而不是未经验证的文本提案。
    - 自主声明需要验证层，例如确定性权威、结果报告约束或物理/视觉门控。
    - 在选定高杠杆决策点进行人类监督，可优于完全自主和逐步详尽监督。
    - 评估越来越多采用基准任务、成功率、工件质量和专家检查来比较AI科学家。
    分歧:
    - 交互模式不同：全自主闭环与内部门控、人类参与监控与定向干预、可交互角色定制团队并存。
    - 可靠性机制不同：集中式验证或确定性权威、多假设失败归因或可验证报告约束。
    - 评测目标不同：领域指标改进、长链路基准改进、专家偏好或人类级生物注释与发现问答。
    - 任务通用程度不同：流体力学、预测或组学等狭窄领域搜索与多领域科学ML基准、广泛综述覆盖不同。
