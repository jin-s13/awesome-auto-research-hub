    研究路线矩阵:
    - 路线: 端到端自主论文生成流程
      解决的问题: 把研究想法到论文写作的全流程自动化，包括代码或实验执行、结果分析、可视化和稿件撰写。
      尚未覆盖: 跨领域与跨任务可靠性有限，多数系统仅在部分输出中达到可提交或可比较的质量。
    - 路线: 验证与失败归因闭环
      解决的问题: 在结果进入论文前捕捉无效结果、静默执行失败、幻觉数字或逻辑错误。
      尚未覆盖: 面对植入或对抗性失败仍会遗漏，领域专属检查之外存在盲区。
    - 路线: 人机协作与干预设计
      解决的问题: 在高杠杆决策点配置人类监督，取代完全自主或逐步监督。
      尚未覆盖: 哪些干预点可跨领域推广，以及不同协作模式的成本收益仍缺少系统证据。
    - 路线: 自动评审与评测辅助
      解决的问题: 用LLM评审标准、模拟评审、盲评分数或视觉-语言反馈规模化评估生成论文。
      尚未覆盖: 与人类同行评审及真实决策效用的一致性尚未充分建立，工作坊接收只是有限证据。
    - 路线: 领域专属发现到写作系统
      解决的问题: 在科学写作中嵌入应用数学、计算流体动力学等领域的有效性检查和可执行流程，使主张基于已验证结果。
      尚未覆盖: 跨学科迁移和超出展示案例的理论或实证覆盖仍待验证。
    共识:
    - 多项工作把科学写作拆成构思、执行、分析和起草阶段，并倾向于使用多智能体而不是单一模型。
    - 验证或反思被视为必要阶段，用于减少幻觉结果、无效实验或缺乏依据的主张。
    - 自动评审和LLM评分被用作可扩展的评测代理，但人类同行评审仍是外部把关。
    - 在高杠杆决策点进行精准人类协作，比完全自主和全流程逐步监督更受认可。
    - 论文生成被看作与实验执行和结果验证不可分割，而不是独立文本任务。
    分歧:
    - 验证机制不同：有些依赖物理或数学领域检查，有些采用通用因果失败归因、辩论或反思基线。
    - 自主程度不同：一些系统追求全自动发现，另一些明确设计人机协作的多种干预模式。
    - 评测目标不同：工作坊接收、基准成功率、LLM评分、盲评分数或领域指标提升不能互相替代。
    - 写作范围不同：有些目标是完整论文，另一些聚焦带指标的实验阶段报告，尚未达到可投稿水平。
    - 领域约束不同：面向应用数学或计算流体力学的系统施加领域有效性门控，而通用系统更强调跨领域灵活性。
    开放问题:
    - 自动验证门控在多大程度上能泛化到策展或领域专属案例之外，尤其已经出现漏检静默失败的情况？
    - LLM评审分数和基准成功率是否与人类科学判断及长期研究效用一致？
    - 自主研究写作系统能否在长程任务中保持一致记忆，避免实现漂移或过早宣称成功？
    - 哪些人类干预点能在不过度增加监督负担的前提下提升不同领域的输出质量？
    - 在缺少局限性说明、外部验证、代码或数据集证据时，如何把可复现性缺口纳入系统能力判断？
