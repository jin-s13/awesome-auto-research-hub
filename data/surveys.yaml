  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Integrating ideation, code execution, experiment management,
        visualization, and manuscript authoring into one LLM-driven loop.
      what_remains_open: 'Consistency and defensibility: one of three submitted manuscripts
        passed workshop peer review, and several generated papers rely on automated
        rather than independent human validation.'
    - line: Domain-specific verification and validity gating
      what_it_solves: Embedding logic auditing, physics-aware visual checks, and knowledge
        retrieval to catch invalid derivations or silent simulation failures before
        claims are written.
      what_remains_open: A physics gate still missed 2 of 16 planted failures, and
        logic-based verification evidence is limited to small generated-paper evaluations
        without independent replication.
    - line: Discovery-oriented evaluation environments and benchmarks
      what_it_solves: Providing tasks and metrics for complete discovery behavior
        or evidence maturity across multiple scientific domains.
      what_remains_open: Benchmarks rely on limited frozen models or simulated/controlled
        settings; strong baseline agents plateau and lack controls, robustness, falsifiability,
        and cross-dataset generalization.
    - line: Automated review and paper-quality judging
      what_it_solves: Scaling evaluation of generated manuscripts and providing feedback
        loops for iterative improvement.
      what_remains_open: Near-human or threshold agreement is not robust across venues;
        rubric and LLM-judge scores may capture surface paper quality more than the
        truth or reproducibility of the underlying result.
    consensus:
    - LLM agents can execute multi-step research workflows covering hypothesis generation,
      coding, experiment running, analysis, and paper writing.
    - Automated evaluation, whether via LLM reviewers, rubrics, or benchmark metrics,
      is treated as necessary for scaling AI-scientist assessment.
    - Verification or evidence gates improve the defensibility of research outputs
      over unverified generation.
    - Current systems have not demonstrated reliable scientific judgment; they show
      plateaus or gaps in controls, robustness, falsifiability, and generalization.
    disagreements:
    - 'Evaluation target: some work scores manuscripts, others score task completion
      in simulated environments, and others judge evidence maturity from blind data-only
      tasks.'
    - 'Verification strategy: one line uses internal logical audits, another uses
      vision-language physics inspection, and another uses fixed LLM judges across
      six evidence dimensions.'
    - 'Interaction and supervision: some systems operate as fully automated discovery
      agents, while others frame human-AI collaboration as principal investigator
      and graduate student.'
    - 'Deployment setting: several systems are demonstrated in specific mathematical
      or fluid dynamics tasks, while others target general machine-learning or multi-domain
      scientific tasks.'
    - 'Success claims differ: some report highest rubric scores, cost per paper, or
      workshop acceptance; benchmarks report that coding agents plateau without reliable
      pairwise separation.'
    open_questions:
    - How can automated judges be calibrated to detect missing controls, robustness,
      falsifiability, and cross-dataset generalization rather than rewarding clear
      documentation and novelty?
    - Can domain-specific verification gates be generalized across fields without
      losing sensitivity, given that a physics-aware gate missed silent failures in
      its own ablation?
    - What would independent human replication or multi-base-model evaluation reveal,
      since several papers lack visible limitations or report on a single frozen base
      model?
    - Does passing a workshop or peer-review threshold or scoring high on an LLM rubric
      indicate actual scientific contribution, or only internal consistency and presentation
      quality?
