  related_work_outline:
  - 'Mainstream direction: End-to-end autonomous research agents that combine literature
    synthesis, hypothesis generation, experimentation, and paper writing, with increasing
    emphasis on self-evolution and verification.'
  - 'Shared research pattern: Most work organizes LLM multi-agent workflows and evaluates
    capability through automated review or benchmarks, while direct literature retrieval
    and citation-analysis quality remain secondary.'
  - 'Key differences: Contributions split among system frameworks, evidence-grounded
    evaluation benchmarks, and failure analysis; they target different scientific
    domains and use different supervision signals.'
  - 'Trend evolution: Available top evidence moves from 2025 broad surveys and domain-specific
    benchmarks to 2026 blind evidence-maturity evaluation and scalable evolving frameworks,
    within a narrow current frontier.'
  - 'Open questions: Whether automated judges reflect real research utility, whether
    agents generalize across base models and domains, and how literature review automation
    becomes reliable.'
  related_work_outline_zh:
  - 主流方向：构建端到端自主科研智能体，融合文献综合、假设生成、实验与论文撰写，并逐步强调自我演化与验证。
  - 研究共性：多数工作以LLM多智能体流程组织任务，并通过自动评审或基准评测能力，而不是直接测量文献检索与引文分析质量。
  - 关键差异：有的做系统框架，有的做评测基准，有的做失败分析；领域、监督信号与评测目标不同。
  - 趋势演进：2025年出现领域基准和综述，2026年转向盲测证据成熟度与可扩展演化框架，整体处于当前前沿内的快速迭代。
  - 开放问题：自动评审是否反映真实科研效用，智能体跨基座模型与领域泛化能力，以及文献综述自动化如何突破。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end literature-to-manuscript discovery systems
      what_it_solves: Automates literature synthesis, derivation or experiment execution,
        verification, and paper generation into one workflow to reduce expert intervention.
      what_remains_open: Reported success relies on LLM-based review rubrics and self-evaluation;
        external validity, code or artifact availability, and base-model generality
        are not established.
    - line: Evidence-grounded evaluation of discovery agents
      what_it_solves: Creates controlled tasks with frozen data, hidden source conclusions,
        human baselines, or fixed judges to measure evidence maturity and discovery
        behavior.
      what_remains_open: Current evaluations cover limited domains, often depend on
        one frozen base model or proxy metrics, and do not isolate literature search,
        reading, citation analysis, or gap discovery from downstream experimentation.
    - line: Failure analysis and design principles
      what_it_solves: Extracts recurring failure modes and design guidance from end-to-end
        autonomous research attempts and broad surveys.
      what_remains_open: Whether these principles predict reliability across domains,
        datasets, and longer-horizon literature workflows remains unverified.
    - line: Knowledge retrieval and verification scaffolds
      what_it_solves: Integrates automated knowledge retrieval, internal verification
        loops, and self-improvement to correct logical errors before human inspection.
      what_remains_open: There is thin evidence separating retrieval or verification
        gains from task-specific scaffolding, and no direct citation coverage or source
        trust metric is reported.
    consensus:
    - The field converges on LLM-based multi-agent workflows for scientific discovery,
      with literature synthesis as one stage alongside experimentation and writing.
    - Automated LLM-based evaluation is widely used but not yet anchored to human
      scientific judgment or real research utility.
    - Current systems perform competent analysis execution and documentation, yet
      lack controls, robustness, falsifiability, and domain intelligence needed for
      trustworthy discovery.
    - Human expert involvement persists as verification, scientific taste, or principal-investigator-style
      oversight rather than being fully replaced.
    - Literature review automation and reliable research gap discovery remain unresolved
      from the survey and case-study evidence.
    disagreements:
    - 'Evaluation targets differ: blind evidence maturity, domain-specific annotation
      and multiple-choice discovery, generated-paper scores, and broad benchmark state-of-the-art.'
    - 'Supervision signals differ: LLM review rubrics, fixed LLM judges, graduate-level
      human baselines, and open-access agent baselines.'
    - 'System emphasis differs: domain-specific verification and paper generation,
      domain-agnostic self-evolution, and failure diagnosis are each foregrounded.'
    - 'Progress definitions differ: some count an autonomously generated paper being
      accepted, others benchmark score gains, and others catalog failure modes.'
    open_questions:
    - Do current benchmarks isolate and measure literature search, paper reading,
      citation analysis, literature review, and research gap discovery, or do they
      bundle these with experimentation and coding?
    - Do automated evidence-maturity or review scores predict whether a generated
      literature review or research gap is trustworthy to domain experts?
    - Which parts of self-evolving or verification scaffolds improve literature understanding,
      and which gains come from base models, grounding data, or task-specific prompts?
    - How should missing code, datasets, limitation details, and external validation
      be treated when comparing agentic research systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端文献到论文的科研发现系统
      解决的问题: 将文献综合、推导或实验执行、验证与论文生成整合为一条工作流，以减少专家干预。
      尚未覆盖: 成功证据主要来自LLM评审和自我评测；外部效度、代码与工件可获得性、跨基座模型泛化尚未确立。
    - 路线: 基于证据的发现智能体评测
      解决的问题: 用冻结数据、隐藏源结论、人类基线或固定裁判构建受控任务，衡量证据成熟度与发现行为。
      尚未覆盖: 当前评测领域有限，常依赖单一冻结基座模型或代理指标，且未将文献检索、阅读、引文分析和缺口发现与下游实验隔离。
    - 路线: 失败分析与设计原则
      解决的问题: 从端到端自主科研尝试和综述中提取重复失败模式与系统设计指引。
      尚未覆盖: 这些原则能否预测跨领域、跨数据集和更长程文献工作流的可靠性仍无验证。
    - 路线: 研究智能体内部的知识检索与验证
      解决的问题: 引入自动知识检索、内部验证循环与自我改进，在人工检查前纠正逻辑错误。
      尚未覆盖: 检索或验证收益与任务脚手架贡献难以区分，且未报告直接衡量引文覆盖或来源可信度的指标。
    共识:
    - 领域正在汇聚到基于LLM的多智能体科研工作流，文献综合只是实验与写作之外的一个环节。
    - 自动LLM评测被广泛采用，但尚未锚定到人类科学判断或真实科研效用。
    - 当前系统能胜任基础分析与文档记录，但普遍缺乏对照、稳健性、可证伪性与领域智能。
    - 人类专家仍以验证、科学品味或首席研究员式监督的形式参与，而非被完全替代。
    - 文献综述自动化和可靠的研究缺口发现仍未从综述与案例证据中得到解决。
    分歧:
    - 评测目标不同：盲测证据成熟度、领域注释与选择题发现、生成论文评分、通用基准最先进分数并存。
    - 监督信号不同：LLM评审标准、固定LLM裁判、研究生级人类基线与开放访问智能体基线各有采用。
    - 系统重点不同：领域特定验证与论文生成、领域无关自我演化、失败诊断分别被强调。
    - 进展定义不同：有人看自主生成论文是否被接收，有人看基准分数提升，有人整理失败模式与设计原则。
    开放问题:
    - 当前基准是否真正隔离并测量文献检索、论文阅读、引文分析、文献综述与研究缺口发现，而不只是实验与编码？
    - 自动化证据成熟度或评审分数能否预测生成综述或研究缺口对领域专家而言是否可信？
    - 自我演化或验证框架中哪些部分提升了对文献的理解，哪些收益来自基座模型、外部数据或任务提示？
    - 在比较智能体科研系统时，如何处理缺失的代码、数据集、局限性说明和外部验证？
