  related_work_outline:
  - 'Mainstream direction: Building autonomous AI research systems that use multi-agent
    architectures, self-evolution, and verification gates to generate hypotheses and
    experimental ideas, aiming to automate the scientific discovery pipeline.'
  - 'Shared research pattern: Most systems rely on multi-agent collaboration, iterative
    improvement loops, and verification mechanisms (e.g., physics-aware gates, failure
    attribution, or verifiable reporting) to increase hypothesis credibility, often
    integrating human feedback or automated correction.'
  - 'Key differences: Systems diverge on domain specificity (general frameworks vs.
    domain-tied like CFD or biology), autonomy level (full autonomy vs. human-in-the-loop
    collaboration), verification strategy (simulation-based, benchmark-based, or grounded
    reporting), and search mechanism (evolutionary search, structured trees, or multi-hypothesis
    attribution).'
  - 'Trend evolution: Within the 2023–2026 frontier, research rapidly moved from basic
    AI scientist concepts (e.g., AI Scientist) to more sophisticated multi-agent,
    self-correcting, and domain-adaptive frameworks, with increasing emphasis on verification,
    reproducibility, and targeted human collaboration.'
  - 'Open questions: Fully autonomous scientific writing and conference-ready paper
    generation remain unsolved; system reliability, ethical concerns, and cross-domain
    generalization lack evidence; existing benchmarks (e.g., ARC-Bench, BAISBench)
    have limited coverage and unclear alignment with real-world scientific discovery.'
  related_work_outline_zh:
  - 主流方向：构建自主AI研究系统，采用多智能体架构、自我演化与验证机制，自动生成假设与实验想法，推动科学发现流水线自动化。
  - 研究共性：多数系统依赖多智能体协作、迭代优化环路和验证门控（如物理感知门、失败归因或可验证报告）提升假设可信度，常集成人类反馈或自动纠正。
  - 关键差异：系统在领域特异性（通用框架 vs. 领域绑定如CFD、生物）、自主程度（完全自主 vs. 人机协作）、验证策略（基于仿真、基准或事实报告）和搜索机制（进化搜索、结构化树或多假设归因）上存在分歧。
  - 趋势演进：在2023–2026前沿期内，研究从基础AI科学家概念快速演进到更复杂的多智能体、自我纠正和领域自适应框架，更强调验证、可复现性和精准人机协作。
  - 开放问题：完全自主的科学写作与会议论文生成仍未解决；系统可靠性、伦理和跨领域泛化缺乏证据；现有基准（如ARC-Bench、BAISBench）覆盖面有限，与真实科学发现的一致性未经验证。
  literature_review:
    line_of_work_matrix:
    - line: Systems and reproducible infrastructure
      what_it_solves: Integrating hypothesis generation, experiment execution, and
        reporting into runnable multi-agent pipelines or platforms, enabling autonomous
        or semi-autonomous research cycles with customizable roles and workflows.
      what_remains_open: Standardized external validation across diverse scientific
        domains, hardware, and user settings; current platforms are early-stage and
        evaluated on limited internal case studies.
    - line: Evaluation and evidence design
      what_it_solves: Making claims about AI scientist performance comparable through
        benchmarks, tasks, verification gates, and grounded reporting, thus catching
        hallucinations and silent failures.
      what_remains_open: Coverage of diverse real-world scientific tasks and alignment
        between proxy metrics (e.g., benchmark scores) and genuine discovery utility;
        human baseline generalizability is uncertain.
    - line: Action-conditioned control and planning
      what_it_solves: Connecting hypothesis generation to interventions, failure diagnosis,
        and iterative decision-making using structured workflows (trees), evolutionary
        search, or multi-hypothesis failure attribution.
      what_remains_open: How much improvement comes from the control/planning strategy
        versus the underlying LLM or task-specific priors; fully autonomous writing
        and complex experimental design remain open.
    - line: State and representation modeling
      what_it_solves: Turning raw research context, experiment outcomes, and failure
        traces into structured representations (e.g., research trees, trajectory features)
        that downstream reasoning modules can consume.
      what_remains_open: Whether the learned representations generalize to new scientific
        domains or unanticipated failure modes beyond those seen in training.
    - line: Conceptual taxonomy and theory
      what_it_solves: Organizing fragmented agentic AI systems into categories by
        domain, capability, and challenges, and identifying key evaluation metrics
        and implementation frameworks.
      what_remains_open: Direct empirical validation that the proposed taxonomies
        predict system behavior or guide design choices; ethical and reliability concerns
        remain unresolved.
    consensus:
    - Multi-agent collaboration and verification mechanisms are essential for improving
      the trustworthiness of generated hypotheses and experimental results.
    - Iterative self-improvement, whether through reflection, failure attribution,
      or evolutionary mechanisms, is a common strategy to enhance research quality.
    - Current AI scientists are not yet fully autonomous; human-in-the-loop collaboration,
      especially at high-leverage decision points, yields better outcomes than full
      autonomy or exhaustive oversight.
    - Benchmarking is critical for measuring progress, but existing benchmarks are
      limited in task diversity and alignment with real-world scientific impact.
    disagreements:
    - 'Autonomy degree: Some systems aim for full autonomy with minimal human input,
      while others advocate for structured human collaboration at specific intervention
      points.'
    - 'Verification method: Approaches range from physics-based vision-language gates
      for domain-specific simulation, to benchmark-based evaluation, to grounded reporting
      that constrains outputs to measured values.'
    - 'Search strategy: Systems employ evolutionary search, structured tree-based
      branching with backtracking, or multi-hypothesis failure attribution, each with
      different assumptions about how to explore the hypothesis space.'
    - 'Domain scope: Domain-agnostic frameworks (e.g., EvoMaster) claim broad applicability,
      whereas domain-specific systems (e.g., AI CFD Scientist, BAISBench) tailor verification
      and execution to one scientific field.'
    open_questions:
    - Can autonomous AI scientists produce publication-ready papers that meet rigorous
      scientific standards, beyond the limited case studies shown?
    - How do verification gaps (e.g., missed silent failures, hallucinated citations)
      affect the reliability of autonomous research in high-stakes domains?
    - What ethical safeguards and oversight mechanisms are needed when AI systems
      autonomously propose and conduct experiments?
    - Do benchmarks like ARC-Bench or BAISBench capture the full difficulty of real-world
      hypothesis generation, or do they overestimate progress in narrow settings?
