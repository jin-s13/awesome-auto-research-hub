  related_work_outline:
  - 'Mainstream direction: Building autonomous multi-agent research pipelines that
    generate hypotheses, execute experiments or formalizations, and self-correct through
    verification gates.'
  - 'Shared research pattern: A loop of ideation, execution, verification, reporting,
    and failure-driven refinement, with LLM agents acting as the central controller.'
  - 'Key differences: Domain scope, verification mechanism, human intervention mode,
    and evaluation target differ, including physics/vision gates, machine-checked
    proof, verifiable reporting, and expert preference.'
  - 'Trend evolution: From 2025 domain benchmarks and surveys toward 2026 open-ended
    agent frameworks with stronger self-correction, formal grounding, and human-AI
    collaboration; changes remain within the current frontier.'
  - 'Open questions: Generalization beyond small internal case studies, robustness
    of verification gates, benchmark construct validity for open-ended hypothesis
    quality, and fidelity of formalization to scientific intent.'
  related_work_outline_zh:
  - 主流方向：构建自主多智能体研究流水线，生成假设、执行实验或形式化验证，并通过验证门控进行自我纠正。
  - 研究共性：以LLM智能体为中心，形成“构思-执行-验证-报告-失败驱动改进”的闭环，并强调抑制幻觉和未验证结果。
  - 关键差异：领域范围、验证机制、人工干预方式和评测目标不同，如物理/视觉门控、机器证明、可验证报告或专家偏好。
  - 趋势演进：从2025年的领域基准和综述，向2026年具有更强自纠正、形式化基础和人机协作的开放式智能体框架演进，但仍处于当前前沿内。
  - 开放问题：内部小规模案例向外部泛化、验证门控的鲁棒性、基准是否能衡量开放式假设质量，以及形式化与科学意图的一致性。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous empirical research loop
      what_it_solves: Proposes hypotheses, runs code or simulator experiments, and
        iteratively refines based on execution artifacts or failure signals.
      what_remains_open: Generalization beyond a few domain case studies, and whether
        measured metrics represent genuine discovery rather than search over a fixed
        solver space.
    - line: Verification- and audit-gated claim generation
      what_it_solves: Adds physics/vision, reporting, or proof constraints to limit
        outputs to measured or machine-checkable evidence.
      what_remains_open: Gates still miss some silent failures; formal checks guarantee
        correctness under assumptions but not that the formalization captures the
        intended scientific claim.
    - line: Human-AI orchestration and oversight
      what_it_solves: Introduces human intervention at high-leverage decision points
        or provides monitoring, rollback, and inspection controls for research teams.
      what_remains_open: Optimal intervention granularity and whether expert judgment
        scales across domains.
    - line: Benchmarking and evidence design for AI scientists
      what_it_solves: Creates tasks, human baselines, and metrics for cell annotation,
        discovery questions, and experiment-stage research claims.
      what_remains_open: Proxy tasks may not capture open-ended hypothesis quality
        or real scientific decision utility.
    - line: Formally grounded theoretical ideation
      what_it_solves: Uses proof assistants and machine-checked libraries to generate
        formal theoretical results and align them with informal scientific claims.
      what_remains_open: A gap remains between machine-checked theorems and intended
        scientific claims; quantitative evidence is limited in the visible packet.
    consensus:
    - Agents can produce candidate hypotheses and run experiments across multiple
      domains, but outputs need verification or reporting constraints to suppress
      hallucinated results.
    - Fully autonomous outputs are not yet reliable; human inspection or targeted
      intervention remains important.
    - Benchmarks and baselines are used to compare success rates, artifact quality,
      or expert preference, but many evaluations are small or internal.
    - Failures are often treated as information for self-correction rather than terminal
      errors.
    disagreements:
    - Some systems target domain-specific empirical discovery through simulation or
      experiment execution, while others target formal theoretical results through
      proof assistants.
    - 'Interaction mode differs: one line favors targeted high-leverage human intervention,
      another provides dashboard monitoring and rollback, and another emphasizes autonomous
      self-correcting loops.'
    - Verification standards differ, such as physics/vision inspection, verifiable
      result reporting, multi-hypothesis failure attribution, and machine-checked
      proof.
    - 'Evaluation targets differ: domain-specific error metrics, benchmark scores,
      human expert baselines, or AI-expert preference judgments.'
    - Execution or representation substrates differ, including runnable code harnesses,
      Lean declarations, structured multi-agent debate, and benchmark question-answering.
    open_questions:
    - Which verification mechanisms best catch silent failures without blocking novel
      but valid hypotheses?
    - Do current benchmarks measure open-ended idea generation quality, or mainly
      downstream execution and question answering?
    - How can formal proof fidelity be audited beyond statement-level alignment?
    - How much of reported performance comes from the underlying model rather than
      orchestration, verification, or domain-specific priors?
    - Can systems move from few internal case studies to external, multi-institution
      validation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主经验研究循环
      解决的问题: 提出假设，运行代码或仿真实验，并根据执行产物或失败信号进行迭代改进。
      尚未覆盖: 能否泛化到少数领域案例之外，以及指标是否代表真正发现而非固定求解器空间上的搜索。
    - 路线: 验证与审计门控的声明生成
      解决的问题: 通过物理/视觉、报告约束或机器证明，把输出限制在可测量或可核验证据内。
      尚未覆盖: 门控仍会漏掉部分静默失败；形式化检查只保证假设内正确，不保证形式化忠实于原始科学意图。
    - 路线: 人机协同与监督
      解决的问题: 在高杠杆决策点引入人工干预，或为研究团队提供监控、回滚和检查控制。
      尚未覆盖: 最优干预粒度和专家判断能否跨领域扩展。
    - 路线: AI科学家基准与证据设计
      解决的问题: 为细胞注释、发现问答或实验阶段研究建立任务、人类基线和指标。
      尚未覆盖: 代理任务是否衡量开放式假设质量及真实科学决策效用。
    - 路线: 形式化理论构思
      解决的问题: 利用证明助手和机器验证库生成形式化理论结果，并使其与非形式化科学主张对齐。
      尚未覆盖: 机器验证定理与预期科学主张之间仍有差距，且可见证据中定量结果有限。
    共识:
    - 智能体能够在多个领域生成候选假设并运行实验，但输出需要通过验证或报告约束来抑制幻觉。
    - 完全自主尚不可靠，关键节点的人工检查或干预依然必要。
    - 基准和基线用于比较成功率、工件质量或专家偏好，但许多评估规模较小或来自内部。
    - 失败常被转化为自我纠正信号，而不是终点。
    分歧:
    - 有的系统面向通过仿真或实验执行进行领域特定的经验发现，有的面向通过证明助手产生形式化理论结果。
    - 交互模式不同：有的在高杠杆决策点引入人工，有的通过仪表板实现监控与回滚，有的强调自主自纠循环。
    - 验证标准不同：如物理/视觉检查、可验证结果报告、多假设失败归因和机器验证证明。
    - 评测目标不同：领域特定误差指标、基准分数、人类专家基线或AI专家偏好。
    - 执行或表示载体不同：如可运行代码、Lean声明、结构化多智能体辩论和基准问答。
    开放问题:
