    consensus:
    - Autonomous scientific discovery systems are converging on a closed loop spanning
      hypothesis generation, experiment execution, analysis, verification, and manuscript
      or review production.
    - Verification, review, or validity gating is treated as necessary for making
      generated claims defensible.
    - Evaluation is expanding beyond final manuscript quality to include task completion,
