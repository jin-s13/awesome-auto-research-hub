  - 开放问题：自动评分或LLM评分如何对应专家实际效用，低专家引用召回能否在不损失精确率的前提下提升，以及多专家分类参照下如何评测组织结构。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end agentic survey generation pipelines
      what_it_solves: Automates retrieval, outline drafting, section writing, and
        iterative refinement into a coherent long-form survey from a paper collection
      what_remains_open: Scaling to very large or non-CS corpora and providing component-level
        evidence that agent orchestration, rather than the underlying LLM or retrieval,
        drives quality gains
    - line: Taxonomy and hierarchical organization generation
      what_it_solves: Organizes retrieved papers into structured category trees and
        paper-to-category mappings comparable to expert survey taxonomies
      what_remains_open: Alignment evaluation often depends on a single expert reference;
        model taxonomies still show high sibling overlap, MECE violations, and structural
        imbalance
    - line: Evidence-grounded and citation-reliable synthesis
      what_it_solves: Improves analytical depth and citation fidelity by grounding
        claims in full-text evidence, structured keynotes, and constrained citation
        assignment
      what_remains_open: Cross-domain generalization beyond computer science and verification
        of implementation-level or non-repository evidence
    - line: Benchmarking and evaluation design for survey systems
      what_it_solves: Creates comparable evidence for retrieval, organization, quality,
        and preference through rubrics, pairwise human evaluation, expert taxonomies,
        and citation metrics
      what_remains_open: Agreement between proxy metrics, LLM judges, and real expert
        decision utility remains underevidenced
    - line: Governed end-to-end research workflow systems
      what_it_solves: Embeds survey-like publication outputs inside a governed research
        workflow with privacy-preserving data access, reproducibility controls, and
        scientist-in-the-loop oversight
      what_remains_open: Survey-generation ability is not isolated; current validation
        is limited to one biomedical case and does not directly compare against survey-specific
        baselines
    consensus:
    - Most systems decompose survey generation into retrieval, organization, drafting,
      and review stages, then refine iteratively.
    - Specialized LLM agents or modules are a shared pattern for improving coverage,
      structure, and citation reliability over single-pass baselines.
    - Explicit automated evaluation is common, including rubric-aligned scoring, multi-LLM
      judging, pairwise comparison, and citation precision/recall.
    - Citation grounding is treated as a central reliability problem, addressed through
      paper cards, structured keynotes, or evidence-constrained citation assignment.
    - Current evidence concentrates on computer science/LLM topics or a single biomedical
      case, leaving broader domain generalization underevidenced.
    disagreements:
    - 'Primary evaluation target differs: whole-survey quality scores versus hierarchical
      taxonomy alignment versus citation reliability versus governed research reproducibility.'
    - 'Evaluation reference differs: rubric-based LLM judges, human-written survey
      scores, expert-authored taxonomies, and pairwise human preference are not interchangeable.'
    - 'Interaction and autonomy differ: fully autonomous pipelines contrast with scientist-in-the-loop
      governed systems and bottom-up organization-only modes.'
    - 'Corpus scale and domain differ: small-to-medium LLM topic collections, a large
      biomedical cohort, and benchmark-scale paper sets make direct comparison difficult.'
    - 'Implementation emphasis differs: systems centered on retrieval-augmented generation
      and real-time retrieval create different failure modes from systems centered
      on full-text extraction and cross-paper clustering.'
    open_questions:
    - How do rubric or LLM-judge quality scores map to factual correctness and usefulness
      for expert readers?
    - What methods can lift expert-cited paper recall beyond the low reported levels
      without sacrificing precision?
    - How should taxonomy organization be scored when multiple valid expert taxonomies
      exist rather than a single reference?
    - Which component—retrieval, organization, drafting, or refinement—contributes
      most to observed quality gains, given sparse ablation evidence in the packet?
    - Can evidence-constrained survey systems generalize outside CS/LLM topics and
      to much larger or non-English corpora?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端智能体综述生成流水线
      解决的问题: 从论文集合中自动完成检索、大纲起草、章节写作和迭代优化，生成连贯的长篇综述
