  literature_review:
    line_of_work_matrix:
    - line: Autonomous end-to-end research writing
      what_it_solves: Automates research ideation, code/experiment execution, and
        full manuscript drafting from minimal prompts.
      what_remains_open: Consistency and quality are limited; only workshop-level
        acceptance or partial pipeline completion is evidenced.
    - line: Verification and self-correction for scientific reporting
      what_it_solves: Reduces hallucinated numbers, invalid results, and silent experimental
        failures before they enter a manuscript.
      what_remains_open: Verification gates remain domain-specific and can miss planted
        failures; benchmark coverage is narrow.
    - line: Human-AI collaborative authoring and oversight
      what_it_solves: Uses human input at selected decision points to improve autonomous
        research outcomes without exhaustive supervision.
      what_remains_open: Optimal intervention modes and transfer to diverse scientific
        workflows have not been systematically validated.
    - line: Scientific manuscript evaluation and simulated review
      what_it_solves: Provides scalable scoring and review of generated papers through
        LLM rubrics, peer-review simulations, or benchmark success rates.
      what_remains_open: Alignment between these evaluation signals and real scientific
        contribution or long-term reproducibility is under-evidenced.
    - line: Domain-specific scientific discovery writing
      what_it_solves: Embeds domain constraints such as mathematical reasoning or
        physics validity into discovery and paper-generation pipelines.
      what_remains_open: These systems rely on domain-specific validators; cross-domain
        robustness and generality remain unclear.
    consensus:
    - Most systems decompose the research-to-writing pipeline into ideation, execution,
      evaluation, and manuscript drafting.
    - Across different implementations, there is a shared shift toward verification,
      grounded reporting, or self-correction to reduce fabricated or unsupported claims.
    - Generated manuscripts are commonly assessed with LLM-based review rubrics, automated
      reviewers, or benchmark success rather than only human inspection.
    - Workshop-level acceptance and artifact improvements are reported, but consistent
      full conference-quality generation is not yet established.
    disagreements:
    - 'Interaction mode: some systems pursue full autonomy, while others incorporate
      targeted human-in-the-loop oversight at high-leverage decisions.'
    - 'Failure correction representation: single-loop reflection or verification gates
      are contrasted with structured multi-hypothesis failure attribution.'
    - 'Verification target: logical coherence auditing, physics-aware perception checks,
      and grounded numeric reporting emphasize different sources of error.'
    - 'Evaluation emphasis: peer-review acceptance, benchmark-relative scores, metrics-bearing
      output rate, and artifact quality are used as different success signals.'
    - 'Domain scope: general machine-learning workflows differ from domain-specific
      pipelines that embed mathematics or physics constraints.'
    open_questions:
    - How can LLM-based reviewers and rubrics be calibrated to human peer review beyond
      the limited workshop and benchmark settings shown?
    - How do verification gates transfer to unseen failure modes outside planted or
      domain-specific scenarios?
    - What is the minimal human supervision needed to make generated manuscripts trustworthy
      without requiring exhaustive step-by-step intervention?
    - Do reported benchmark and artifact improvements indicate reproducible scientific
      communication across disciplines, or only better execution within narrow tasks?
    - What evidence would demonstrate that generated papers improve scientific insight
      and communication rather than merely crossing a scoring threshold?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究写作
      解决的问题: 从少量提示自动完成研究构思、代码/实验执行和完整手稿草拟。
      尚未覆盖: 一致性与质量仍然有限；证据仅显示部分流程完成或工作坊级接收。
    - 路线: 科学报告中的验证与自我纠正
      解决的问题: 在错误主张进入手稿前减少幻觉数字、无效结果和静默实验失败。
      尚未覆盖: 验证闸门仍依赖领域特定检查，并可能漏掉植入失败；基准覆盖范围较窄。
    - 路线: 人机协作写作与监督
      解决的问题: 在关键决策点引入人类判断，以提升自主研究结果，同时避免逐步监督的负担。
      尚未覆盖: 最优干预模式以及向不同科研工作流的迁移尚未被系统验证。
    - 路线: 科学手稿评测与模拟评审
      解决的问题: 通过 LLM 评审标准、同行评审模拟或基准成功率实现可扩展的生成论文评分。
      尚未覆盖: 这些评测信号与真实科学贡献或长期可复现性之间的一致性证据不足。
    - 路线: 领域专用科学发现写作
      解决的问题: 将数学推理或物理有效性等领域约束嵌入发现与论文生成流程。
      尚未覆盖: 依赖领域专用验证器；跨领域稳健性和通用性仍不明确。
    共识:
    - 多数系统将研究与写作流程分解为构思、执行、评测和手稿草拟。
    - 不同实现共同转向验证、事实报告或自我纠正，以减少虚假或缺乏依据的主张。
    - 生成手稿通常通过 LLM 评审标准、自动评审器或基准成功率进行评估，而非仅依赖人工检查。
    - 已报告工作坊级接收和工件改进，但一致达到完整会议论文质量尚未确立。
    分歧:
    - 交互模式：一些系统追求完全自主，另一些在关键决策点引入有针对性的人机监督。
    - 失败纠正表示：单环反思或验证闸门与结构化多假设失败归因存在差异。
    - 验证目标：逻辑一致性审计、物理感知检查和基于事实的数字报告分别关注不同错误来源。
    - 评测重点：同行评审接收、基准相对得分、带指标输出率和工件质量被用作不同的成功信号。
    - 领域范围：通用机器学习工作流与嵌入数学或物理约束的领域专用流程不同。
    开放问题:
    - LLM 评审器和评审标准能否在所示的工作坊和基准环境之外与人类同行评审对齐？
    - 验证闸门如何迁移到植入场景或领域特定场景以外的未见过失败模式？
    - 为了让生成手稿可信，最少需要多少人类监督，同时避免逐步干预的负担？
    - 报告的基准和工件改进是否意味着跨学科可复现的科学传播，还是仅在狭窄任务中执行更好？
    - 什么证据能证明生成论文提升了科学洞察和传播，而不仅仅是越过评分阈值？
