  - 主流方向：自主科学发现智能体是核心研究对象，重点正从生成能力转向外部评估、可靠性门控和基于证据的治理。
  - 研究共性：系统常将LLM驱动的假设/代码生成与可执行实验和自动评判器、基准或领域专用有效性门控配对；使用盲任务或隐藏结论测试智能体是否能得出可支持的主张。
