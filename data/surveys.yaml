  related_work_outline_zh:
  - 主流方向：构建端到端自主科学发现系统，集成验证、自我纠正与多智能体协作，从纯LLM生成走向结构化、可靠的研究流水线。
  - 研究共性：所有工作都将科学工作流分解为假设、实验、分析、写作等阶段，用LLM智能体自动化执行，并通过自动评审、基准或专家评判来评估输出质量。
  - 关键差异：评估环境从合成虚拟环境、特定领域真实数据到内部AI研究任务不等；可靠性策略包括带反馈的树搜索、多假设失败归因和交互式人工监控；生成报告的真实性约束从事后过滤到受限解码各不相同。
  - 趋势演进：从2024年无验证门控的通用框架，2025–2026年转向领域特定的物理感知验证、结构化失败诊断、多智能体交互平台，以及带人类基线的标准化基准。
  - 开放问题：代理指标与模拟任务是否与真实科学发现价值对齐；验证门控如何泛化到非物理领域；自我纠正循环的长期稳定性；以及如何实现完全自主、符合会议标准的科学写作。
  literature_review:
    line_of_work_matrix:
    - line: Evaluation and evidence design
      what_it_solves: Making claims comparable through tasks, baselines, metrics,
        and failure cases; providing standardized environments and benchmarks that
        measure the scientific discovery capability of AI agents.
      what_remains_open: Coverage of diverse scientific tasks and agreement between
        proxy metrics (e.g., task completion, artifact quality) and real decision
        utility in genuine research; the extent to which simulated environments capture
        the open-ended, creative nature of real science.
    - line: Systems and reproducible infrastructure
      what_it_solves: Turning isolated model ideas into runnable stacks, artifacts,
        and repeatable workflows; integrating verification gates, code execution harnesses,
        and multi-agent coordination to produce complete scientific papers autonomously.
      what_remains_open: Standardized external validation across hardware, datasets,
        and user settings; the reliability of internal verification mechanisms (e.g.,
        vision-language gates) in detecting all silent failures; scalability to high-stakes
        interdisciplinary research.
    - line: Conceptual taxonomy and theory
      what_it_solves: Organizing fragmented claims into task boundaries, assumptions,
        and evaluation criteria; identifying recurring failure modes (e.g., implementation
        drift, memory degradation, insufficient domain intelligence) and deriving
        design principles for robust autonomous research agents.
      what_remains_open: Direct empirical validation that the proposed failure categories
        or design principles predict model behavior in new domains and over long-horizon
        tasks; whether self-correction mechanisms can overcome deep conceptual errors
        rather than surface-level execution mistakes.
    consensus:
    - Current LLM-based autonomous research systems are not yet reliable enough to
      fully replace human scientists; they require explicit verification, failure
      handling, and quality control.
    - Automated scientific discovery must be evaluated not only on paper generation
      but also on the correctness of executable experiments, validity of results,
      and adherence to measured values.
    - Structured workflows that decompose the scientific process into hypothesis,
      code, experiment, analysis, and writing stages are widely adopted, and the bottleneck
      is in implementation and evaluation rather than in idea generation.
    disagreements:
    - 'Evaluation targets differ: some works measure success by task completion in
      virtual environments, others by expert-confirmed discoveries in domain data
      (e.g., single-cell omics, CFD), and still others by blind peer review scores
      of generated papers.'
    - 'Reliability enhancement approaches diverge: tree search with VLM feedback loops,
      multi-hypothesis causal failure attribution, and interactive dashboards with
      human rollback represent different points on the spectrum of autonomy and control.'
    - 'Truthfulness in reporting is handled differently: one line enforces grounded
      reporting that constrains claims to measured values, while others rely on post-hoc
      automated review to filter hallucinations, which may not prevent them from reaching
      the final manuscript.'
    open_questions:
    - How can verification gates designed for physics-based domains (e.g., vision-based
      flow field inspection) be adapted to abstract disciplines like mathematics or
      social science?
    - Do current benchmarks (DISCOVERYWORLD, BAISBench) predict real-world scientific
      impact, or do they only measure narrow proxy skills?
    - Can self-correction loops like multi-hypothesis failure attribution remain stable
      over long iterative cycles without accumulating subtle errors?
    - What is the minimal set of metrics and human baselines needed to certify that
      an AI scientist's output is trustworthy for publication?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 评估与证据设计
      解决的问题: 通过任务、基线、指标和失败案例使主张具有可比性；提供标准化环境和基准，衡量AI代理的科学发现能力。
      尚未覆盖: 多样化科学任务的覆盖，以及代理指标（如任务完成度、工件质量）与真实研究中决策效用之间的一致性；模拟环境在多大程度上捕捉真实科学的开放性和创造性。
    - 路线: 系统与可复现基础设施
      解决的问题: 将孤立模型想法转化为可运行的堆栈、工件和可重复的工作流；集成验证门控、代码执行框架和多智能体协调，以自主生成完整科学论文。
      尚未覆盖: 跨硬件、数据集和用户设置的标准化外部验证；内部验证机制（如视觉-语言门控）检测所有静默失败的可靠性；在高风险跨学科研究中的可扩展性。
    - 路线: 概念分类与理论
      解决的问题: 将碎片化主张组织为任务边界、假设和评估标准；识别反复出现的失败模式（如实现漂移、记忆退化、领域智能不足），并推导构建稳健自主研究代理的设计原则。
      尚未覆盖: 所提出的失败类别或设计原则在预测新领域和长周期任务中模型行为的直接实证验证；自我纠正机制能否克服深层概念性错误，而不仅仅是表面执行错误。
    共识:
    - 当前基于LLM的自主研究系统尚不足以完全替代人类科学家；它们需要显式的验证、失败处理和质量控制。
    - 自动化科学发现不仅应评估论文生成，还应评估可执行实验的正确性、结果的有效性以及对测量值的忠实度。
    - 将科学过程分解为假设、代码、实验、分析和写作阶段的结构化工作流被广泛采用，瓶颈在于实现和评估，而非想法生成。
    分歧:
    - 评估目标不同：部分工作以虚拟环境中的任务完成度衡量成功，其他以领域数据中的专家确认发现（如单细胞组学、CFD）衡量，还有以生成论文的盲审分数衡量。
    - 可靠性增强策略不同：带VLM反馈循环的树搜索、多假设因果失败归因，以及带人工回滚的交互式仪表板，代表了在自主性和控制光谱上的不同选择。
    - 报告真实性处理方式不同：一条路线强制基于事实的报告，将主张约束为测量值；其他路线则依赖事后自动评审来过滤幻觉，这可能无法阻止幻觉进入最终稿件。
    开放问题:
    - 为物理领域设计的验证门控（如基于视觉的流场检查）如何适应数学或社会科学等抽象学科？
    - 当前基准（DISCOVERYWORLD、BAISBench）是否预测真实世界的科学影响力，还是仅衡量狭窄的代理技能？
    - 多假设失败归因等自我纠正循环能否在长迭代周期中保持稳定而不积累细微错误？
    - 认证AI科学家输出可信且可发表所需的最低指标和人类基线集是什么？
