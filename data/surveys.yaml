  literature_review:
    line_of_work_matrix:
    - line: Automated research-agent systems
      what_it_solves: End-to-end execution from hypothesis generation and code implementation
        to experiment running and paper writing in an inspectable workflow.
      what_remains_open: 'Validity and reliability are inconsistent: examples show
        only one of three submitted papers passing peer review, and automated reviewers
        have not been shown to replace human judgment.'
    - line: Discovery-oriented evaluation and evidence design
      what_it_solves: Makes agentic research claims comparable through task suites,
        blind studies, metrics, and human baselines across complete scientific discovery
        cycles.
      what_remains_open: Task coverage is limited to selected domains, and proxy metrics
        such as task completion or evidence-maturity scores are not yet linked to
        real scientific utility.
    - line: Verification and governance mechanisms for agentic research
      what_it_solves: Detects silent failures and constrains invalid edits via physics-aware
        visual checks, deterministic authority over source edits, and staged promotion
