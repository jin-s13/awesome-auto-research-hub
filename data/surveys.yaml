  related_work_outline:
  - 'Mainstream direction: The dominant evidence shows autonomous multi-agent systems
    that couple literature synthesis, verification, knowledge retrieval, hypothesis
    refinement, and manuscript drafting, evaluated increasingly by blind or evidence-grounded
    benchmarks.'
  - 'Shared research pattern: Systems decompose scientific workflows into agent roles
    or stages, add self-critique, verification, memory, and retrieval loops, then
    compare against human baselines or automated LLM judges; human experts still serve
    as principal investigator or annotation source.'
  - 'Key differences: Some works generate complete papers with internal verification,
    while others audit evidence maturity or benchmark data-to-claim reasoning; evaluation
    targets range from LLM review rubrics and blind peer-study tasks to omics multiple-choice
    questions and general science benchmarks.'
  - 'Trend evolution: The available 2025–2026 frontier shifts from broad surveys and
    framework claims toward evidence-based auditing, failure-mode analysis, and reliability
    concerns; the narrowed time span makes this a current-frontier trend rather than
    a long historical trajectory.'
  - 'Open questions: Whether these agents can perform credible literature search,
    citation analysis, review synthesis, and gap discovery—not only paper drafting—remains
    open; cross-domain generalization, missing limitations, and automated evaluation
    validity are unresolved.'
  related_work_outline_zh:
  - 主流方向：主导证据显示，自主多智能体系统正在耦合文献综合、验证、知识检索、假设细化与手稿生成，并越来越多通过盲测或证据锚定基准进行评估。
  - 研究共性：系统把科学工作流分解为智能体角色或阶段，加入自我批评、验证、记忆和检索循环，再与人类基线或自动LLM评审比较；人类专家仍担任首席研究员或标注来源。
  - 关键差异：一类工作生成完整论文并进行内部验证，另一类审计证据成熟度或基准测试数据到主张的推理；评测目标从LLM评审量规、盲测同行研究任务到组学选择题和通用科学基准不等。
  - 趋势演进：可用2025–2026前沿证据显示，从宽泛综述和框架声明转向基于证据的审计、失败模式分析与可靠性关注；时间跨度较窄，只能判断当前前沿趋势。
  - 开放问题：这些智能体能否实现可信的文献搜索、引文分析、综述综合和差距发现，而不只是起草论文，仍未解决；跨域泛化、缺失局限性与自动评测有效性也未解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous literature synthesis and manuscript generation
      what_it_solves: Integrates literature synthesis, algorithm design, theorem proving,
        experiments, and paper drafting into a multi-agent workflow with verification
        and knowledge retrieval; reduces domain-expert intervention in reasoning-centric
        academic writing.
      what_remains_open: Reported quality rests on an LLM-based review rubric and
        open-access baselines rather than independent expert or field validation;
        applicability beyond applied mathematics and missing limitation details are
        verification gaps.
    - line: Evidence-grounded evaluation benchmarks for discovery agents
      what_it_solves: Provides blind tasks from peer-reviewed studies, frozen data,
        deterministic LLM-judge scoring, and evidence-maturity dimensions; one omics
        benchmark adds graduate-level human baselines to compare AI scientists.
      what_remains_open: Coding-agent results derive from a single frozen base model,
        so cross-model generalization is unestablished; blind or multiple-choice tasks
        may not cover full literature search, review, or gap-discovery workflows.
    - line: Self-evolving domain-agnostic agent frameworks
      what_it_solves: Offers continuous self-evolution through hypothesis refinement,
        self-critique, and knowledge accumulation, with a domain-agnostic interface
        claimed to build scientific agents across disciplines with low code overhead.
      what_remains_open: General benchmarks show strong relative scores but do not
        isolate literature-intelligence capability; the evidence lacks limitation
        reporting and independent external validation for literature-specific use.
    - line: Failure-mode analysis and design principles
      what_it_solves: Documents recurring autonomous research failures such as implementation
        drift, memory degradation, overexcitement, insufficient domain intelligence,
        and weak scientific taste, and derives design principles for more robust systems.
      what_remains_open: Evidence comes from only four end-to-end attempts in machine-learning
        research, so the failure taxonomy may not transfer to literature search and
        review automation without broader studies.
    - line: Survey and taxonomy of scientific discovery automation
      what_it_solves: Organizes agentic systems by scientific domain and capability
        including literature review, hypothesis generation, experimentation, and analysis;
        catalogs evaluation metrics, frameworks, and datasets.
      what_remains_open: The proposed categories and challenges are descriptive; direct
        empirical validation that the taxonomy predicts model behavior or improves
        literature intelligence workflows is missing.
    consensus:
    - Current systems can execute and document analyses or produce paper drafts, but
      evidence does not show reliable full autonomy in literature-to-discovery workflows.
    - Verification loops, self-critique, knowledge retrieval, and memory mechanisms
      are recurring safeguards to reduce human intervention and catch synthesis or
      reasoning errors.
    - Evaluation is moving toward hidden or blind peer-study tasks, frozen data, and
      automated judges to make claims comparable without revealing target conclusions.
    - Human experts remain prominent as principal investigators or as baseline/annotation
      providers, positioning systems as assistants rather than fully autonomous scientists.
    - Across the evidence, systematic literature review automation is still treated
      as a critical challenge, especially reliability, source grounding, and gap quality.
    disagreements:
    - One line of work generates complete papers and scores them with LLM review rubrics,
      while another audits whether an agent's claim is supported by frozen data; these
      are distinct targets and do not directly compare.
    - 'Evaluation formats differ: blind open-ended tasks, multiple-choice questions
      from published studies, broad general-science benchmarks, and rubric-scored
      generated manuscripts each measure different stages of literature intelligence.'
    - 'Supervision assumptions differ: one workflow casts human as principal investigator,
      another emphasizes continuous self-evolution with low-code agents, and benchmark
      studies use human performance as a fixed comparison.'
    - 'Domain evidence differs: one system focuses on applied mathematics, another
      on single-cell transcriptomics, while another claims domain-agnostic operation;
      cross-domain transfer is not established from the packet.'
    - 'Reproducibility and limitation evidence is inconsistent: some records provide
      datasets, baselines, metrics, and failure modes, while others omit limitations
      or external validation signals.'
    open_questions:
    - How can evidence-grounded evaluation distinguish scientific claim quality and
      gap discovery ability from well-formatted but under-supported manuscript generation?
    - Do blind-task benchmark scores transfer to real literature search, citation
      analysis, review synthesis, or research-gap discovery in less controlled academic
      settings?
    - What minimum human supervision or verification loop is necessary to prevent
      overexcitement, weak scientific taste, and implementation drift in literature
      intelligence workflows?
    - Are self-evolving domain-agnostic frameworks genuinely reusable for literature-specific
      tasks, or do benchmark gains come from general reasoning and task-specific priors?
    - How should missing code, datasets, baselines, and limitation reporting be weighted
      when assessing reproducibility and trustworthiness of automated literature systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主文献综合与手稿生成
      解决的问题: 把文献综合、算法设计、定理证明、实验和论文起草整合到带验证和知识检索的多智能体工作流中，减少推理密集型学术写作中领域专家干预。
      尚未覆盖: 所报告质量依赖基于LLM的评审量规和开放访问基线，缺乏独立专家或领域验证；应用数学之外是否适用以及缺失的局限性说明仍是验证缺口。
    - 路线: 证据锚定的发现智能体评测基准
      解决的问题: 从同行评审研究中构建盲任务，提供冻结数据和确定性LLM评判，从证据成熟度维度评分；组学基准加入研究生级人类基线以比较AI科学家。
      尚未覆盖: 编码智能体结果仅基于单一冻结基座模型，跨模型泛化未确立；盲任务或选择题未必覆盖完整文献搜索、综述和差距发现工作流。
    - 路线: 自演化领域无关智能体框架
      解决的问题: 通过假设细化、自我批判和知识积累实现持续自演化，并以领域无关接口声称可跨学科低代码构建科学智能体。
      尚未覆盖: 通用基准分数高但未能隔离文献智能能力；证据缺少局限性报告，也缺少针对文献场景的独立外部验证。
    - 路线: 失败模式分析与设计原则
      解决的问题: 记录自主研究中重复出现的实现漂移、记忆退化、过度兴奋、领域智能不足和弱科学品味等失败模式，并提炼更稳健系统设计原则。
      尚未覆盖: 证据仅来自四次机器学习端到端尝试，该失败分类能否迁移到文献搜索和综述自动化仍缺乏更广泛研究。
    - 路线: 科学发现自动化综述与分类
      解决的问题: 按科学领域和能力组织智能体系统，包括文献综述、假设生成、实验和分析，并整理评测指标、框架和数据集。
      尚未覆盖: 分类与挑战仍属于描述性总结；分类能否预测模型行为或改进文献智能工作流缺少直接实证验证。
    共识:
    - 当前系统能执行并记录分析或生成论文草稿，但证据尚未显示其在文献到发现工作流中具备可靠的全自主能力。
    - 验证循环、自我批评、知识检索和记忆机制是反复出现的保障手段，用于减少人工干预并捕获综合或推理错误。
    - 评测正转向隐藏或盲测的同行研究任务、冻结数据和自动评委，以便在不揭示目标结论的情况下比较主张。
    - 人类专家仍作为首席研究员或基线/标注来源出现，系统更多被定位为助手，而非完全自主科学家。
    - 所有证据都把系统化文献综述自动化视为关键挑战，尤其是可靠性、来源锚定和差距质量问题。
    分歧:
    - 一类工作生成完整论文并用LLM评审量规评分，另一类审计主张是否得到冻结数据支持；两者目标不同，不能直接互通。
    - 评测形式不同：盲测开放式任务、已发表研究选择题、通用科学基准和量规评分稿件各自衡量文献智能的不同阶段。
    - 监督假设不同：一个工作流把人类设为首席研究员，一个强调低代码持续自演化，基准研究则用人类表现作为固定对比。
    - 领域证据不同：有的关注应用数学，有的关注单细胞转录组，还有的声称领域无关；跨领域迁移在证据包中未建立。
    - 可复现性与局限性证据不一致：部分记录提供数据集、基线、指标和失败模式，部分省略局限性或外部验证信号。
    开放问题:
    - 证据锚定评测如何区分科学主张质量和差距发现能力，而不是只奖励格式良好但证据不足的稿件生成？
    - 盲任务基准分数能否迁移到真实文献搜索、引文分析、综述综合或研究差距发现等更不受控的学术场景？
    - 在文献智能工作流中，需要多少最低限度的人类监督或验证循环才能防止过度兴奋、弱科学品味和执行漂移？
    - 自演化领域无关框架在文献特定任务上是否真正可复用，还是基准收益来自通用推理和任务特定先验？
    - 在评估自动化文献系统的可复现性与可信度时，应如何权衡缺失的代码、数据集、基线和局限性报告？
