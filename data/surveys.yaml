  related_work_outline_zh:
  - 主流方向：构建端到端自主研究流水线，从假设生成、实验实施到论文撰写，并日益强调领域特化和可靠性机制。
  - 研究共性：所有系统均以大型语言模型为核心推理引擎，集成某种验证或评审循环，并承认全自主尚未实现。
  - 关键差异：在人类参与程度（全自主 vs. 人机协作）、领域范围（通用机器学习 vs. 特定科学）以及验证方式（逻辑、物理或结果校验）上存在分歧。
  - 趋势演进：从2024年通用全自动机器学习科学概念验证，转向2025–2026年嵌入特定领域、具备更强验证、协作界面和可复现工件的系统。
