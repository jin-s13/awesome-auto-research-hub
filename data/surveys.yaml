  literature_review:
    line_of_work_matrix:
    - line: Research-state and experience representation
      what_it_solves: Turns long experiment histories into durable compact state such
        as harness-owned search state, reusable experience libraries, or repository-derived
        skills so agents avoid history replay, duplicated work, and excessive interaction
        cost.
      what_remains_open: Whether the represented state or skills transfer outside
        the benchmark families and domains in the visible evidence is unclear; several
        records provide no explicit limitation details.
    - line: Closed-loop search and feedback allocation
      what_it_solves: Connects prediction to interventions by assigning experiments,
        selecting pilot or high-fidelity evaluations, and rewriting optimizers under
        token, oracle-query, or force-call budgets.
      what_remains_open: How much gain comes from search and allocation policy versus
        fixed backbone, harness, or task-specific prior remains difficult to attribute;
        domain coverage is narrow.
    - line: Benchmark and held-out evaluation design
      what_it_solves: Makes claims comparable through fixed budgets, sealed or held-out
        targets, oracle query counts, baseline comparisons, and target-disagreement
        ceilings.
      what_remains_open: Proxy metrics may not align with real utility; development-best
        evaluators do not always remain best on sealed targets, and human-designed
        baselines remain strong.
    - line: Resource-aware research infrastructure
      what_it_solves: Distills repositories into verified skills, builds executable
        evaluators or harnesses, and reduces token, oracle-query, or force-call costs
        across multiple suites.
      what_remains_open: 'Visible reproducibility evidence is sparse: code, dataset,
        artifact, and limitation fields are often missing; standardized cross-framework
        external validation is absent.'
    consensus:
    - Long-horizon autonomous research is usually measured by final task improvement
      and resource cost together, not only by single-point accuracy.
    - 'Feedback design is central: held-out or sealed evaluation, sparse high-fidelity
      labels, pilot tests, and explicit budgets are used to test generalization beyond
      training/search.'
    - Separating durable research state or external knowledge from the agent's immediate
      context improves efficiency and reuse.
    - Short development evaluation can mislead, so several studies use sealed/hold-out
      tests and target-disagreement ceilings to correct overoptimistic conclusions.
    disagreements:
    - 'Supervision signal differs: one line uses target benchmark agreement, another
      uses held-out metric reductions, another uses sparse high-fidelity oracle labels,
      and another uses downstream benchmark score gains.'
    - 'Evaluation target differs: code and ML benchmark suites, materials endpoints
      such as Matbench, molecular optimizer force calls, and evaluator-design tasks
      each serve as the primary testbed in different strands.'
    - 'Interaction mode differs: a stateless harness owns shared search state, an
      experience library retrieves prior evidence, repository-derived skills provide
      operational knowledge, and online surrogate repair interleaves high-fidelity
      feedback.'
    - 'Deployment setting differs: software/ML research, materials science, molecular
      geometry optimization, and autonomous evaluation research define the boundary
      of a research agent differently.'
    open_questions:
    - Do gains on development targets transfer to sealed or held-out tasks when target
      disagreement ceilings are high?
    - How much of reported improvement comes from agent search policy versus fixed
      backbone, harness, judge, or task-specific priors?
    - Are token, oracle-query, and force-call efficiency metrics comparable across
      frameworks when budgets and baselines differ?
    - Several visible records lack code, datasets, artifacts, or explicit limitations;
      can standardized external validation close these verification gaps?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 研究状态与经验表示
      解决的问题: 把长期实验历史转化为持久紧凑状态、经验库或可复用技能，减轻历史重放、重复工作和交互开销。
      尚未覆盖: 这些状态或技能在多大程度上跨基准族和领域迁移尚不明确；多个可见记录未报告明确局限性。
    - 路线: 闭环搜索与反馈分配
      解决的问题: 连接决策与干预，如分配实验、按需试点或高保真评估，并在预算下改写优化器。
      尚未覆盖: 提升中搜索/分配策略与固定主干、harness或任务先验的贡献难以区分；领域覆盖较窄。
    - 路线: 基准与留出评测设计
      解决的问题: 通过固定预算、密封/留出目标、oracle查询数、基线和目标分歧上限使主张可比。
      尚未覆盖: 代理指标与真实效用可能不一致；开发集最优不必然迁移到密封目标；人工设计基线仍强。
    - 路线: 资源感知研究基础设施
      解决的问题: 把仓库知识提炼为已验证技能，构建可执行评估器或harness，并降低 token、oracle 调用或力调用成本。
      尚未覆盖: 可见可复现证据稀疏：代码、数据集、工件和局限性字段常缺失；缺少跨框架标准化外部验证。
    共识:
    - 长期自主研究通常以最终任务改进和资源成本共同衡量，而非只看单点指标。
    - 反馈设计是核心：留出/密封评测、稀疏高保真标签、试点测试和显式预算被用于测试泛化。
    - 把持久研究状态或外部知识从智能体即时上下文中分离出来，能够改善效率与复用。
    - 短视界开发评估可能误导，多个工作采用密封/留出测试和目标分歧上限来修正。
    分歧:
    - 监督信号不同：有的用目标基准一致性，有的用留出指标降低，有的用稀疏高保真 oracle 标签，有的用下游基准分数提升。
    - 评测目标不同：代码/ML基准套件、材料Matbench端点、分子几何优化力调用、评估器设计任务分别成为主战场。
    - 交互模式不同：无状态 harness 持有共享搜索状态、经验库检索、仓库提炼技能、在线代理修复各自组织反馈。
    - 部署场景不同：软件/ML研究、材料科学、分子几何优化、自主评估研究对研究智能体边界的定义不同。
    开放问题:
    - 在目标分歧上限较高时，开发目标上的收益能否迁移到密封/留出任务？
    - 报告性能提升中，多少来自智能体搜索策略，多少来自固定主干、harness、评分器或任务先验？
    - token、oracle 调用、力调用等资源效率指标在不同框架预算和基线不一致时是否可比？
    - 多条可见记录缺少代码、数据、工件或明确局限性，标准化外部验证能否弥补这些证据缺口？
