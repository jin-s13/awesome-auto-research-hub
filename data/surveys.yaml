    研究路线矩阵:
    - 路线: 端到端自主发现流水线（如 The AI Scientist、AI Scientist-v2、ReasFlow）
      解决的问题: 闭环完成从想法生成、代码/实验执行、分析、论文写作到自动评审或验证。
      尚未覆盖: 一致性和深度有限；仅有工作坊级接收或精选 LLM 评审证据，会议级验证不充分。
    - 路线: 科学发现与实验规划评测环境（如 DISCOVERYWORLD、AblationBench）
      解决的问题: 建立任务套件与指标，衡量智能体能否规划假设、实验、消融并解释结果。
      尚未覆盖: 模拟任务之外的覆盖，以及任务完成或 LLM 评判分数是否对应真实研究效用。
    - 路线: 交互式多智能体研究平台（如 Claw AI Lab、ReasFlow）
      解决的问题: 提供编排、可定制角色、监控、回滚/恢复和代码工具，支持有人监督的研究流程。
      尚未覆盖: 评估多为小型内部案例；跨硬件、代码库和外部用户设置的标准化验证缺失。
    - 路线: 失败感知记忆与自改进（如 Negative Knowledge as Failure-aware Shared Memory）
      解决的问题: 将失败尝试转化为可采纳或拒绝的共享记忆，改善重试和跨任务迁移并降低 token 使用。
      尚未覆盖: 仅在少数科学/PDE 任务上显示；尚未跨多样实验类型或长程发现验证。
    共识:
    - 各系统普遍把科学工作流拆分为子任务，由单个或多个 LLM 智能体承担规划、执行、分析和撰写。
    - 普遍采用自动或 LLM 辅助评估，以弥补人类同行评审成本高、难以规模化的问题。
    - 多数工作都把人类定位为验证、监督或 PI/审稿人，而非完全移除人，但自主程度不同。
    - 代码、数据和外部验证信号报告不均衡；基准和代码工具被用来弥补可复现性缺口。
    分歧:
    - 自主程度不同：端到端全自动生成与带监控和回滚的交互式人工在环平台形成对比。
    - 评测环境不同：模拟文本虚拟环境、可运行代码工具的内部案例、精选 LLM 评审量规之间存在差异。
    - 任务粒度不同：完整论文/发现循环与专项消融规划或实验重试的优化目标不同。
    - 改进机制不同：树搜索和视觉语言反馈循环、失败记忆/负知识、可定制角色编排各有侧重。
    开放问题:
    - 智能体生成的论文或结论能否在 LLM 评判和工作坊级接收之外得到复现和真实同行认可？
    - DISCOVERYWORLD 的任务完成度和 AblationBench 的召回率与真实实验决策效用之间如何对应？
    - 需要多少专家监督和验证，才能防止看似合理但错误的科学结论？
    - 失败记忆方法如何从 PDE 和 ScienceAgentBench 类任务扩展到长程、多领域实验？
