        revealing weaknesses via measured task completion and knowledge discovery.
      what_remains_open: Existing benchmarks are often simplified simulated worlds
        that may not reflect the openness and complexity of real scientific discovery;
        automatic metrics have not been fully validated against human expert judgment.
    - line: Reliability and self-correction mechanisms
      what_it_solves: Improving the trustworthiness of AI-generated research by multi-hypothesis
        failure attribution, reflection loops, and grounded reporting that constrains
        outputs to measured values.
      what_remains_open: Silent failures such as hallucinated results still escape
        detection; creative scientific writing and nuanced reasoning remain difficult
        to correct automatically.
    - line: Domain-embedded validation with physics or biology
      what_it_solves: Embedding domain-specific knowledge (e.g., CFD visual verification,
        single-cell transcriptomics) into the agent loop to catch physically or biologically
        implausible results.
      what_remains_open: Verification gates may miss certain failure modes; the approaches
        are tied to specific simulators or datasets and do not easily transfer to
        other domains.
    consensus:
    - LLM-based agents can execute substantial parts of the research workflow, but
      fully autonomous scientific discovery remains beyond current capabilities.
    - Dedicated benchmarks are necessary to quantify progress, as general AI benchmarks
      do not capture the challenge of novel scientific exploration.
    - Failure detection and correction are critical for reliability, and single-pass
      reflection is insufficient to catch all errors.
    - Multi-step reasoning with experimental verification is essential for producing
      trustworthy scientific claims.
    disagreements:
    - Approaches differ on whether to build a general-purpose research agent applicable
      to many domains or to tightly integrate domain-specific validation (e.g., vision-based
      physics gates vs. general LLM reviewers).
    - 'Evaluation strategy varies: some rely on simulated automated reviewers, others
      on human expert panels or benchmark task completion, with no consensus on which
      proxy best predicts real scientific merit.'
    - 'Architectural choices diverge: single-agent pipelines vs. multi-agent teams
      with specialized roles, and the degree of human-in-the-loop control during research.'
    open_questions:
    - How can we design benchmarks that measure the generation of truly novel hypotheses
      rather than recombination of existing knowledge?
    - What validation mechanisms are needed to ensure that AI-generated results are
      reproducible and not artifacts of the experimental design?
    - Can self-correction loops scale to the full complexity of mature scientific
      fields where ground truth is not available for verification?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动化研究框架与端到端管道
      解决的问题: 实现从构想生成到论文撰写的全周期自动化，降低实验与撰稿成本。
      尚未覆盖: 跨领域泛化能力与输出质量仍不稳定；许多系统依赖领域特定脚手架或人类代码模板，长任务中上下文漂移问题未解。
    - 路线: 基准环境与评估套件
      解决的问题: 提供标准化任务与指标，用于比较AI科学家能力，并通过任务完成度和知识发现揭示弱点。
      尚未覆盖: 现有基准多为简化模拟世界，可能无法反映真实科学发现的开放性与复杂性；自动指标尚未与人类专家判断充分校验。
    - 路线: 可靠性与自我纠正机制
      解决的问题: 通过多假设失败归因、反思循环和基于事实的报告，提高AI生成研究的可信度，减少幻觉。
      尚未覆盖: 静默失败（如捏造数据）仍可能逃脱检测；创造性科学写作和微妙推理仍难以自动纠正。
    - 路线: 领域嵌入的物理或生物验证
      解决的问题: 将领域特定知识（如CFD视觉验证、单细胞组学）嵌入智能体循环，以捕获物理或生物上不合理的结果。
      尚未覆盖: 验证门控可能遗漏某些失败模式；方法局限于特定仿真器或数据集，难以迁移至其他领域。
    共识:
    - 基于LLM的智能体可执行大部分研究工作流程，但完全自主的科学发现仍超出当前能力。
    - 需要专门的基准来量化进展，因为通用AI基准无法捕捉新颖科学探索的挑战。
    - 失败检测与纠正对可靠性至关重要，单次反思不足以捕捉所有错误。
    - 多步推理与实验验证对于产生可信的科学主张必不可少。
    分歧:
    - 是构建可应用于多领域的通用研究智能体，还是紧密集成领域特定验证（如视觉物理门控 vs. 通用LLM评审），存在路线分歧。
    - 评估策略不同：有的依赖模拟自动评审，有的依赖人类专家小组或基准任务完成度，对于哪种代理指标最能预测真实科学价值尚无共识。
    - 架构选择存在差异：单智能体管道 vs. 多智能体团队与专门角色，以及在研究过程中人类介入的程度。
    开放问题:
    - 如何设计能衡量真正新颖假设生成（而非现有知识重组）的基准？
    - 需要哪些验证机制来确保AI生成的结果可复现，而非实验设计造成的假象？
    - 当真实答案不可用于验证时，自我纠正循环能否扩展到成熟科学领域的全部复杂性？
