  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自动化研究框架
      解决的问题: 完成从假设生成、编码、实验到论文撰写的完整科学发现循环，以最少的人工干预降低研究产出的成本和门槛。
      尚未覆盖: 输出质量不稳定，仅部分论文能通过同行评审，且多局限于工作坊级别和模板化任务，自主处理领域特定验证或产出真正新颖见解的能力有限。
    - 路线: 自动化科学发现评估基准
      解决的问题: 提供标准化、多样化的任务和指标，支持跨领域对比AI科学家，从主观判断转向任务完成度、动作相关性和可解释知识的测量。
      尚未覆盖: 当前基准主要在简化模拟环境或选择题中测试发现能力，尚未捕捉真实科学探究的复杂性，基准得分与实际研究效用之间的关联未经证实。
    - 路线: 自主研究的失败分析与自我纠正
      解决的问题: 识别重复出现的失败模式（如实现漂移、过度兴奋、科学品味薄弱），并引入诊断和纠正机制，提高AI生成结果的可信度。
      尚未覆盖: 失败分类基于少量案例研究，自我纠正方法尚未完全消除核心问题，如长上下文退化和缺乏真伪判断力；干预与真正的科学判断之间的鸿沟依然存在。
    共识:
    - 基于LLM的智能体可以自主执行科研流程的相当部分，但尚不足以支持完全无人值守的研究。
    - 自动化评估（无论是模拟评审还是基于任务的指标）对于衡量进展至关重要，但现有指标不足以替代真实的科学价值。
    - 系统共享常见的失败模式，尤其是倾向于在无效结果上宣称成功，且缺乏深层领域智能，表明需要更强的验证和事实基础。
    分歧:
    - 验证粒度不同：通用框架依赖LLM评审，而领域特定智能体引入外部有效性格栅（如基于物理的视觉检查）。
    - 评估目标各异：部分工作以机器学习子领域为基准，另一些针对CFD、生物学或混合主题，这影响结论的普适性。
    - 提升可靠性的路线分歧：一条路线侧重事后失败编目以指导设计，另一条路线则在研究过程中嵌入因果诊断和干预路由。
    开放问题:
    - 如何将科学品味和识别真正新颖贡献的能力嵌入AI科学家，超越当前模式匹配和模板生成的局限？
    - 何种评估设计能够捕捉真实科学发现的深度与偶然性，并确保基准性能转化为实际研究成果？
    - 证据包中缺乏治理相关的论文；研究社区应如何应对在敏感领域部署自主AI科学家的伦理与社会风险，以及应强制执行哪些可复现性标准？
