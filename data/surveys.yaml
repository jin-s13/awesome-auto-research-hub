  related_work_outline:
  - 'Mainstream direction: The evidence clusters around LLM-based autonomous research
    agents that move from literature search and synthesis toward full scientific discovery,
    paper writing, and benchmarked evaluation. Representative work includes ReasFlow,
    TruthInsightBench, BAISBench, Agentic AI survey, and EvoMaster.'
  - 'Shared research pattern: Systems combine large language models with multi-agent
    roles, retrieval or knowledge modules, verification/critique loops, and LLM-judged
    or curated-benchmark scoring.'
  - 'Key differences: Some focus on theory-driven manuscript generation from minimal
    prompts, others on data-driven biological discovery, blind evidence-from-data
    claims, or domain-agnostic self-evolving agent stacks; evaluation and interaction
    modes differ.'
  - 'Trend evolution: Within the 2025-2026 frontier, the topic is shifting from surveys
    and isolated case studies toward reproducible benchmarks and evolving frameworks,
    but evidence before 2025 is not visible in this packet.'
  - 'Open questions: Whether LLM-rubric metrics track human review, whether literature
    synthesis can be externally verified, and whether systems generalize across base
    models and domains remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以LLM为核心的自主科研智能体，从文献检索与综合走向科学发现、论文撰写与基准评测，代表工作包括ReasFlow、TruthInsightBench、BAISBench、智能体AI综述和EvoMaster。
  - 研究共性：系统普遍结合多智能体角色、检索或知识模块、验证/批判循环，并通过LLM评审或人工/精选基准进行评分。
  - 关键差异：有的面向理论驱动的手稿生成，有的面向数据驱动的生物发现、盲态证据推断或领域无关自演化堆栈；评估目标和交互模式不同。
  - 趋势演进：在2025-2026前沿窗口内，主题从综述和案例研究走向可重复基准与演化框架；数据包中未见2025年前的证据。
  - 开放问题：LLM评分是否与人类评审一致、文献综合可否被外部验证、系统能否跨基座模型和领域泛化仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end literature synthesis and manuscript generation workflows
      what_it_solves: Transforms a minimal prompt or research objective into literature
        synthesis, reasoning, experiments, and paper drafts by coordinating agents
        and verification loops.
      what_remains_open: External verification of citations and logical correctness
        beyond LLM rubrics; human-expert burden and code/artifact availability are
        not established.
    - line: Evidence-grounded scientific discovery benchmarks
      what_it_solves: Compares agents on tasks derived from peer-reviewed studies
        or real datasets while hiding source conclusions to test evidence maturity
        rather than reproduction.
      what_remains_open: Results rely on a single frozen base model or narrow domains;
        scored agents lack controls, robustness, falsifiability, and cross-dataset
        generalization.
    - line: Failure analysis and design principles for autonomous research agents
      what_it_solves: Maps scientific workflow stages to agent pipelines and documents
        recurring failure modes such as implementation drift, memory degradation,
        and weak scientific taste.
      what_remains_open: Whether these design principles predict model behavior or
        improve reliable literature intelligence across domains and deployment settings.
    - line: Domain-agnostic evolving agent frameworks
      what_it_solves: Provides reusable self-evolution and knowledge accumulation
        mechanisms that can be instantiated across scientific domains with minimal
        domain-specific code.
      what_remains_open: Benchmark gains are not tied to literature-review quality
        or real discovery utility; reproducibility and external validation remain
        verification gaps.
    - line: Survey taxonomies of agentic scientific workflows
      what_it_solves: Organizes systems by domain and capability such as literature
        review, hypothesis generation, experimentation, and analysis; inventories
        metrics, frameworks, datasets, and challenges.
      what_remains_open: Little direct empirical validation that these categories
        predict model behavior or support standardized reliability and ethics evaluation.
    consensus:
    - LLM-based research agents can execute and document analytical workflows, but
      current systems plateau on evidence maturity and lack controls, robustness,
      falsifiability, and cross-setting generalization.
    - Literature review automation and knowledge retrieval are recurring bottlenecks;
      verification/critique loops and human oversight are common design responses.
    - Evaluation remains heavily dependent on LLM-based rubrics, multiple-choice questions,
      or curated benchmarks; reported scores are not yet linked to human peer review
      or real discovery utility.
    - 'Reproducibility is uneven: several papers expose no code, dataset, or artifact
      signals, and limitations are frequently missing, so methodology claims are only
      partially verifiable.'
    disagreements:
    - 'Setting and domain: theory-driven applied mathematics manuscript generation
      with a human principal investigator versus data-driven single-cell biology or
      domain-agnostic benchmark performance.'
    - 'Evaluation evidence: blinded frozen-data claim formulation, multiple-choice
      questions from published studies, LLM-judged paper rubrics, and aggregate benchmark
      scores represent different targets.'
    - 'Interaction mode: human-as-PI collaboration, self-evolving agents, fixed coding
      agents, and survey categorization rather than runtime workflow support different
      deployment assumptions.'
    - 'Coverage claim: some emphasize depth in one domain with internal verification,
      others emphasize horizontal cross-domain generality and minimal instantiation
      cost.'
    open_questions:
    - How well do LLM-rubric paper scores and evidence-maturity dimensions track human
      peer review or literature-grounded correctness?
    - Can literature synthesis systems be externally audited for hallucinated citations,
      missing controls, and biased training-data defaults outside curated tasks?
    - What benchmark would isolate research gap discovery and citation analysis from
      manuscript formatting or known-answer question answering?
    - How do findings generalize beyond the single frozen base model or selected scientific
      domains reported in the evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端文献综合与手稿生成工作流
      解决的问题: 通过协调智能体与验证循环，将简短提示或研究目标转化为文献综合、推理、实验和论文草稿。
      尚未覆盖: 引用与逻辑正确性的外部验证仍依赖LLM评分；人工专家负担、代码与工件可得性未建立。
    - 路线: 证据锚定的科学发现基准
      解决的问题: 从同行评审研究或真实数据集构造任务，隐藏源结论以评测证据成熟度而非复现。
      尚未覆盖: 结果依赖单一冻结基座模型或少数领域；被评智能体缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 路线: 自主科研智能体失败分析与设计原则
      解决的问题: 把科学工作流阶段映射到智能体流水线，记录实现漂移、记忆退化与科学品味弱等失败模式。
      尚未覆盖: 这些设计原则能否预测模型行为或提升跨领域文献智能可靠性仍缺直接验证。
    - 路线: 领域无关的自演化智能体框架
      解决的问题: 提供可复用的自演化和知识积累机制，以少量领域特定代码在多个科学领域实例化。
      尚未覆盖: 基准提升与文献综述质量或真实发现效用之间的关联未验证；可复现性与外部验证存在缺口。
    - 路线: 智能体科学工作流综述分类
      解决的问题: 按领域和能力对系统进行分类，梳理文献综述、假设生成、实验与分析等能力及指标和挑战。
      尚未覆盖: 缺少这些分类能预测模型行为或支撑标准化可靠性与伦理评估的直接实证。
    共识:
    - 基于LLM的科研智能体能够执行并记录分析流程，但在证据成熟度上普遍处于平台期，缺乏对照、稳健性、可证伪性和跨场景泛化。
    - 文献综述自动化与知识检索是反复出现的瓶颈，验证/批判循环和人工监督是常见应对。
    - 评估仍依赖LLM评分、选择题或精选基准，已有分数尚未与人类同行评审或真实发现效用建立联系。
    - 可复现性参差不齐：若干论文未显示代码、数据集或工件信号，局限性也常缺失，方法学主张只能部分核验。
    分歧:
    - 目标场景不同：有理论驱动的应用数学手稿生成并设人类首席研究员，也有数据驱动的单细胞生物学或领域无关基准性能。
    - 评估证据不同：包括冻结数据盲态推断、发表研究选择题、LLM论文评分和聚合基准分数。
    - 交互模式不同：人类作为首席研究员协作、自演化智能体、固定编码智能体，以及仅做分类综述。
    - 覆盖主张不同：有的强调单领域深度和内部验证，有的强调跨领域横向通用性和较低实例化成本。
    开放问题:
    - LLM论文评分和证据成熟度维度在多大程度上与人类同行评审或文献支撑正确性一致？
    - 文献综合系统能否在精选任务之外被外部审计，识别虚构引用、缺失对照和对训练数据默认值的偏见？
    - 何种基准能把研究缺口发现和引文分析从手稿格式或已知答案问答中分离出来？
    - 这些发现在证据所报告的单一冻结基座模型或选定科学领域之外如何泛化？
