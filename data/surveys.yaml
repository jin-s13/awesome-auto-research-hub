  literature_review:
    line_of_work_matrix:
    - line: End-to-end scientific discovery pipelines
      what_it_solves: Integrates idea generation, experiment execution or derivation,
        analysis, and manuscript/claim writing into an automated research workflow.
      what_remains_open: Output quality is inconsistent, and trustworthiness or peer-review
