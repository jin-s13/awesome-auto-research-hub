    - 路线: 迭代式大纲与分类法组织
      解决的问题: 构建分层大纲和论文-类别结构，使综述结构连贯、易导航。
      尚未覆盖: 生成分类法仍存在兄弟重叠、MECE违反、结构不平衡，与专家分类法的语义对齐较低。
    - 路线: 证据约束检索与引用依据
      解决的问题: 利用全文证据支撑综述主张，减少引用幻觉或错误归属。
      尚未覆盖: 当前最佳检索仅覆盖20.92%的专家引用论文；全文与代码仓库信号在不同领域差异较大。
    - 路线: 综述生成的评测与基准设计
      解决的问题: 通过基准、指标、基线、专家分类和人工偏好让综述生成主张可比较。
      尚未覆盖: 主题覆盖有限，自动指标与专家或人工偏好尚缺强关联，许多论文未报告局限。
    - 路线: 受管控且可复现的端到端研究系统
      解决的问题: 在隐私、治理和可复现约束下编排证据生成与论文草稿输出。
      尚未覆盖: 验证仍以单一生医案例为主，缺少跨数据集和跨场景的外部复现证据。
    共识:
    - 自动综述生成被普遍拆解为多智能体或多阶段流程，而不是单次模型响应。
    - 通过显式评审、评分准则或评估反馈进行迭代优化是改进草稿的共同机制。
    - 检索质量与引用保真度被视为核心可靠性要求。
    - 评估通常同时关注结构连贯性、内容覆盖和引用或分类组织，但具体指标存在差异。
    分歧:
    - 优化对象不同：评分准则驱动的手稿、循环大纲与论文卡片、专家对齐分类法，或基于全文证据的主张。
    - 监督与交互模式不同：从完全自主生成到受管控的科学家在环工作流。
    - 评估目标不同：评分准则分数、多维大语言模型评审、专家分类编辑距离、引用精度/召回率或人工偏好。
    - 证据深度不同：部分系统基于摘要级综合，部分系统提取全文和代码仓库证据。
    - 部署场景不同：通用CS/LLM主题生成与面向生物医学的隐私治理案例系统。
