  related_work_outline:
  - 'Mainstream direction: Building interactive environments and benchmarks for scientific
    discovery, alongside modular agent frameworks that automate the hypothesize-experiment-analyze
    loop.'
  - 'Shared research pattern: Multi-turn cycles of hypothesis generation, experimentation,
    and analysis form the core paradigm; LLMs serve as the central reasoning engine,
    augmented with tools, memory, or safety wrappers.'
  - 'Key differences: Environments range from text-based virtual worlds to code-execution
    benchmarks and wet-lab simulations; safety is integrated either as a per-step
    reasoning loop or as external guardrails; evaluation targets final outcomes, process
    faithfulness, or both.'
  - 'Trend evolution: The field is moving from static benchmarks toward dynamic, process-verifiable
    training environments, and from outcome-only metrics to mechanism-aware and safety-aware
    evaluation, with growing emphasis on auditability and continual learning from
    experience.'
  - 'Open questions: How to generalize across scientific domains; how to guarantee
    reasoning faithfulness and detect correct-answer-wrong-mechanism failures; how
    to balance safety with exploratory freedom; how to transition from simulated environments
    to real-world labs reliably.'
  related_work_outline_zh:
  - 主流方向：构建科学发现交互环境和基准，同时开发模块化代理框架以自动化假设-实验-分析循环。
  - 研究共性：多轮假设生成、实验和分析循环是核心范式，LLM作为中心推理引擎，辅以工具、记忆或安全封装。
  - 关键差异：环境类型从虚拟文本世界到代码执行基准和湿实验室模拟不一；安全集成方式有每步推理内嵌或外部安全门；评估目标聚焦最终结果、过程忠实性或两者兼顾。
  - 趋势演进：从静态基准转向动态可过程验证的训练环境，从仅看结果转向机制感知与安全感知评估，日益强调可审计性和从经验中持续学习。
  - 开放问题：如何跨科学领域泛化；如何保证推理忠实性并检测“正确答案错误机制”失败；如何在安全与探索自由之间取得平衡；如何从模拟环境可靠地迁移到真实实验室。
  literature_review:
    line_of_work_matrix:
    - line: Science discovery environments and benchmarks
      what_it_solves: Provides standardized tasks, interaction protocols, and metrics
        to evaluate AI agents on end-to-end scientific discovery, from hypothesis
        formation to experiment and conclusion.
      what_remains_open: Task coverage is limited to certain domains; LLM-based judges
        show only moderate agreement with human experts; outcome metrics cannot detect
        incorrect reasoning that yields correct results.
    - line: Agent infrastructure and tool augmentation
      what_it_solves: Automates parts of the discovery pipeline—code generation, wet-lab
        execution, training, safety checks—to improve agent efficiency, reproducibility,
        and task completion rate.
      what_remains_open: Generalization across scientific domains is unverified; most
        systems are evaluated in isolation or with simulated tasks, not in real-world
        lab settings; long-term autonomy and reliability remain open.
    - line: Faithful reasoning and safety mechanisms
      what_it_solves: Integrates explicit checks, structured certificates, or safety
        loops to ensure agents' reasoning is consistent with evidence and free from
        dangerous actions or tool-chain escapes.
      what_remains_open: Current safety reasoning is evaluated on limited tasks; detecting
        all compositional risks without stifling exploration is hard; mechanism-fidelity
        checks often require known ground-truth, limiting use in open-ended discovery.
    consensus:
    - All works adopt a multi-stage experiment loop (hypothesis, experiment, analysis)
      as the agent's decision cycle.
    - Current LLM-based agents are insufficient for robust scientific discovery and
      require additional scaffolding, such as tools, memory, or safety modules.
    - Evaluation should go beyond task completion and include process quality, safety,
      or reasoning faithfulness.
    disagreements:
    - 'Environment type: some use fully text-based virtual labs, others rely on code
      execution with real software constraints, and a few simulate physical wet-lab
      operations.'
    - 'Safety integration: one approach embeds safety reasoning into every agent reasoning
      step, while another applies external safety gates after trajectory completion.'
    - 'Question formation: one line advocates structured, auditable research question
      certificates; others keep question generation as a free-form prompt step without
      explicit traceability.'
    - 'Evaluation judges: one study reports moderate agreement between LLM-as-a-judge
      and domain experts, while others use LLM judges without human calibration, raising
      concerns about proxy reliability.'
    open_questions:
    - How can we build a single agent infrastructure that generalizes across diverse
      scientific fields without per-domain retuning?
    - What automatic methods can detect 'correct answer, wrong mechanism' failures
      when the ground-truth mechanism is unknown?
    - How can safety mechanisms be designed to prevent compositional tool-chain risks
      without over-restricting the agent's ability to explore novel hypotheses?
    - What is the minimal set of reality-grounded tasks and metrics needed to validate
      that a simulated discovery agent will succeed in a real laboratory?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 科学发现环境与基准
      解决的问题: 提供标准化任务、交互协议和指标，以评估AI代理在从假设形成到实验和结论的端到端科学发现中的能力。
      尚未覆盖: 任务覆盖领域有限；基于LLM的评判者与人类专家仅具有中等一致性；结果指标无法检测导致正确结果的错误推理。
    - 路线: 代理基础设施与工具增强
      解决的问题: 自动化发现流程的各个环节——代码生成、湿实验室执行、训练、安全检查——以提升代理效率、可复现性和任务完成率。
      尚未覆盖: 跨科学领域的泛化性未经验证；多数系统在隔离或模拟任务中评估，而非真实实验室环境；长期自主性与可靠性仍待解决。
    - 路线: 忠实推理与安全机制
      解决的问题: 集成显式检查、结构化证书或安全循环，以确保代理推理与证据一致，并避免危险动作或工具链逃逸。
      尚未覆盖: 当前安全推理仅在有限任务上评估；在不抑制探索的情况下检测所有组合风险很困难；机制忠实性检查通常需要已知真值，限制了在开放式发现中的使用。
    共识:
    - 所有工作均采用多阶段实验循环（假设、实验、分析）作为代理决策周期。
    - 当前基于LLM的代理不足以进行稳健的科学发现，需要额外的脚手架，如工具、记忆或安全模块。
    - 评估不应仅看任务完成，还应包括过程质量、安全性或推理忠实性。
    分歧:
    - 环境类型：有些使用完全基于文本的虚拟实验室，有些依赖具有真实软件约束的代码执行，少数模拟物理湿实验室操作。
    - 安全集成：一种方法将安全推理嵌入代理的每个推理步骤，另一种则在轨迹完成后应用外部安全门。
    - 问题形成：一种路线提倡结构化、可审计的研究问题证书，而其他路线将问题生成作为自由形式的提示步骤，无显式可追溯性。
    - 评估评判者：一项研究报告LLM作为评判者与领域专家之间仅具有中等一致性，而其他研究使用LLM评判者但未进行人类校准，引发了对代理指标可靠性的担忧。
    开放问题:
    - 如何构建一个无需逐领域重新调整即可泛化到不同科学领域的单一代理基础设施？
    - 当真实机制未知时，哪些自动方法可以检测“正确答案错误机制”失败？
    - 如何设计安全机制以防止组合工具链风险，同时不过度限制代理探索新假设的能力？
    - 验证模拟发现代理能在真实实验室中成功所需的最小现实任务和指标集是什么？
