    - 路线: 验证与纠错机制
      解决的问题: 通过内部逻辑审计、物理一致性检查或多假设故障归因来减少生成内容中的事实错误和幻觉，提高论文可信度。
      尚未覆盖: 静默失败（如物理视觉门控遗漏的故障）仍会发生；对科学论证深层逻辑错误和实验设计缺陷的检测能力有限。
    - 路线: 人机协作与交互设计
      解决的问题: 在高杠杆决策点（如假设选择、结果解释）嵌入人类专家干预，弥补完全自主的脆弱性。
      尚未覆盖: 最优干预时机和模式尚不明确，如何在减少人类工作量的同时最大化系统成功率仍需探索。
    共识:
    - 所有系统均采用多智能体架构，将科学发现分解为文献检索、代码生成、实验执行和写作等可管理的子任务。
    - 均依赖大型语言模型作为核心生成引擎，并利用某种反馈循环（如评审、验证）来迭代改进输出。
    - 普遍认识到完全自主的局限性，通过引入验证门控或人机协作来应对。
    分歧:
    - 人类参与程度不同：AI Scientist系列追求完全自主，而AutoResearchClaw和ReasFlow强调人机协作，将人类建模为首席研究员。
    - 验证哲学不同：ReasFlow采用内部逻辑一致性检查，AI CFD Scientist使用领域特定的物理感知视觉门控，SAGE则应用因果多假设故障归因。
    - 评估方式不同：部分工作使用内部自动评审器评分，而AI Scientist-v2和AutoResearchClaw的部分论文已通过真实外部同行评审。
    开放问题:
    - 当前系统在长周期科学写作中如何避免上下文记忆退化，确保论文各部分逻辑一致？
    - 如何量化评估生成论文的原创性和科学贡献，而不仅仅是格式正确性与实验可重复性？
    - 在资源受限的领域，如何构建有效的领域特定验证器，以防止生成看似合理但物理上错误的结论？
