  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous manuscript generation systems
      what_it_solves: Turns research ideas into code, experiments, visualizations,
        and full paper drafts with reduced human effort.
      what_remains_open: Standardized external validation across domains is missing;
        success is inconsistent and often limited to workshop-level or domain-specific
        demonstrations.
    - line: Verification and grounded reporting for generated claims
      what_it_solves: Reduces silent failures, fabricated numbers, and hallucinated
        citations by checking outputs against logical, physical, or measured-value
        evidence before writing.
      what_remains_open: Current gates still miss failures and are not proven to guarantee
        general scientific soundness beyond covered cases.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Inserts human judgment at high-leverage decision points to improve
        autonomous research outcomes without exhaustive step-by-step oversight.
      what_remains_open: Which intervention modes and density transfer across tasks
        and domains remains open; evidence is mostly ablation-based.
    - line: Failure-mode diagnosis and self-correction
      what_it_solves: Identifies why autonomous research attempts fail and routes
        corrections to hypothesis, experimental design, or implementation levels.
      what_remains_open: Taxonomies come from small case studies and lack direct empirical
        validation that they predict model behavior or long-horizon reliability.
    - line: Automated review and evaluation for generated papers
      what_it_solves: Provides scalable scoring, benchmark comparisons, and feedback
        loops for generated manuscripts and research agents.
      what_remains_open: Agreement between proxy review scores, human peer review,
        and real scientific validity is not yet established.
    consensus:
    - Autonomous writing is treated as part of an experiment-and-verification pipeline,
      not as a standalone drafting module.
    - 'Some validity gate is necessary before reporting: logical coherence, physical
      plausibility, measured-value grounding, or reviewer-style critique.'
    - Human involvement remains valuable even in autonomous systems, especially at
      high-leverage decision points.
    - Evaluation should combine task success, artifact quality, and review outcomes
      rather than only counting generated papers.
    - Open-source artifacts and reproducibility signals are visible in several systems
      but inconsistently provided.
    disagreements:
    - 'Verification signal differs: domain-specific physical or visual checks, logical
      audits, LLM-based review, and grounded reporting are used without a common validity
      standard.'
    - 'Human-AI interaction mode differs: full autonomy, PI/graduate-student role
      assignment, and targeted high-leverage intervention yield different claims about
      optimal oversight.'
    - 'Evaluation target differs: workshop peer acceptance, benchmark improvement,
      artifact quality, blind review scores, and LLM rubric scores are not directly
      comparable.'
    - 'System emphasis differs: some target end-to-end paper production, while others
      target failure diagnosis or self-correction, so reported gains are hard to attribute
      to writing capability.'
    - 'Reproducibility evidence differs: some reports include code or open-source
      claims, while others lack limitation details or external validation.'
    open_questions:
    - What validity standard would establish that generated claims are scientifically
      sound beyond domain-specific gates?
    - How well do LLM-based review scores and blind scores predict human peer-review
      decisions or downstream research impact?
    - Which human intervention modes and timing are necessary for reliable autonomous
      paper writing across domains?
    - How can systems detect fabricated numbers, hallucinated citations, and silent
      experimental failures without task-specific detectors?
    - How well do failure-mode taxonomies derived from small autonomous research attempts
      generalize to new domains and longer-horizon studies?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主论文生成系统
      解决的问题: 将研究想法转化为代码、实验、可视化和完整论文草稿，减少人工工作量。
      尚未覆盖: 缺少跨领域标准化外部验证；成功率不稳定，通常仅在工作坊级或特定领域演示。
    - 路线: 生成声明的验证与基于证据的报告
      解决的问题: 在写作前通过逻辑、物理或实测证据检查输出，减少静默失败、伪造数字和幻觉引用。
      尚未覆盖: 当前门控仍会漏检，且未被证明能在覆盖案例之外保证一般科学可靠性。
    - 路线: 人机协作与干预设计
      解决的问题: 在高杠杆决策点引入人类判断，在不进行逐步监督的情况下改善自主研究结果。
      尚未覆盖: 哪些干预模式和密度可跨任务跨领域迁移仍未解决；现有证据主要来自消融研究。
    - 路线: 失败模式诊断与自纠正
      解决的问题: 识别自主研究尝试为何失败，并将纠正路由到假设、实验设计或实现层面。
      尚未覆盖: 分类来自小规模案例研究，缺乏直接实证验证其能否预测模型行为或长程可靠性。
    - 路线: 生成论文的自动评审与评测
      解决的问题: 为生成手稿和研究智能体提供可扩展评分、基准比较和反馈循环。
      尚未覆盖: 代理评审分数、同行评审与真实科学有效性之间的一致性尚未建立。
    共识:
    - 自主写作被视为实验与验证流程的一部分，而不是独立起草模块。
    - 在报告前需要某种有效性门控：逻辑一致性、物理合理性、实测值约束或评审式批判。
    - 即使在自主系统中，人类参与仍然有价值，尤其在高杠杆决策点。
    - 评估应综合任务成功、工件质量和评审结果，而不是只统计生成论文数量。
    - 多个系统显示开源工件与可复现信号，但提供不一致。
    分歧:
    - 验证信号不同：领域物理或视觉检查、逻辑审计、LLM评审和基于实测值的报告同时存在，缺乏统一有效性标准。
    - 人机协作模式不同：完全自主、首席研究员或研究生式角色分配和关键点精准介入对最优监督结论不一致。
    - 评测目标不同：工作坊同行接受、基准提升、工件质量、盲评分数与LLM评分量纲不可直接比较。
    - 系统侧重点不同：部分面向端到端论文产出，部分面向失败诊断或自纠正，导致报告的提升难以归于写作能力。
    - 可复现证据不同：部分报告包含代码或开源声明，部分缺少限制说明或外部验证。
    开放问题:
    - 什么样的有效性标准能证明生成声明在领域特定门控之外仍然科学可靠？
    - LLM评审分数与盲评分数在多大程度上能预测人类同行评审决定或下游研究影响？
    - 跨领域可靠自主论文写作需要哪些人类干预模式和时机？
    - 系统如何不依赖任务专用检测器发现伪造数字、幻觉引用和静默实验失败？
    - 从小规模自主研究尝试中得出的失败模式分类能否泛化到新领域和更长周期研究？
