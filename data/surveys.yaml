  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery pipelines
      what_it_solves: Turn research ideation, code execution, experiment analysis,
        and manuscript writing into a repeatable agent loop.
      what_remains_open: Reliability is inconsistent; reported peer-review success
        rates and validity-gate coverage remain below trustworthy autonomy.
    - line: Domain-embedded discovery agents with validity or authority gates
      what_it_solves: Adapt general discovery loops to physical, biological, or forecasting
        settings by adding simulation checks, physics-aware verification, or deterministic
        edit and evaluation authorities.
      what_remains_open: Silent-failure detection is incomplete and case-specific;
        demonstrated success is still narrow and not fully generalized.
    - line: Task-suite and hidden-objective evaluation environments
      what_it_solves: Make open-ended scientific discovery comparable through simulated
        or real-data tasks, hidden objectives, difficulty levels, and automatic scoring.
      what_remains_open: Task completion and rubric scores have not yet established
        agreement with real scientific utility.
    - line: Evidence-grounded evaluation and automated review
      what_it_solves: Assess whether generated claims have reproducible workflows,
        controls, robustness, and falsifiability rather than only plausible output.
      what_remains_open: LLM-judge calibration across base models and domains is missing;
        current agents perform weakly on controls and cross-dataset generalization.
    - line: Reproducible research infrastructure and governance mechanisms
      what_it_solves: Provide open-source code, artifacts, deterministic scoring,
        simulated review, or cognition-authority separation to reduce uncontrolled
        edits and unrepeatable claims.
      what_remains_open: External validation across hardware, datasets, and user settings
        remains thin; several evaluations rely on one frozen model or one setting.
    consensus:
    - The field treats autonomous research as a closed-loop problem requiring execution
      and verification, not only large-model generation.
    - Automatic evaluation is broadly seen as necessary but insufficient without evidence
      checks or validity gates.
    - Current agents are positioned as research assistants or partial discoverers
      rather than fully trustworthy autonomous scientists.
    - Hidden objectives or frozen data are increasingly used to avoid shortcutting
      and to examine claim-level evidence rather than surface outputs.
    disagreements:
    - 'Evaluation targets differ: task completion and downstream accuracy versus evidential
      maturity of claims versus peer-review acceptance.'
    - 'Settings differ: simulated text-based discovery environments, real domain code
      and data, and workshop submission pipelines impose different validity requirements.'
    - 'Autonomy boundaries differ: some systems allow broad LLM-driven code edits,
      while others constrain edits and promotion through deterministic authorities.'
    - 'Metric trust differs: some rely on LLM judges or rubrics, while others rely
      on domain-specific simulation or vision verification; agreement among these
      is not established.'
    open_questions:
    - Can automated LLM judges and validity gates be calibrated across multiple frozen
      base models and scientific domains?
    - Which evaluation evidence predicts whether a generated finding will hold under
      external peer review or real-world deployment?
    - How can autonomous agents systematically produce controls, robustness checks,
      falsifiable claims, and cross-dataset generalization?
    - What false-negative and false-positive rates are acceptable for silent-failure
      detectors in domain-specific discovery pipelines?
    - How should research autonomy be governed without over-constraining exploratory
      hypothesis and code search?
  literature_review_zh:
    研究路线矩阵:
