  - 'Mainstream direction: 2025-2026 work is converging on autonomous research agents
    that generate hypotheses, execute code or experiments, then use verification and
    failure diagnosis to refine the next round.'
  - 'Shared research pattern: systems close the loop from hypothesis or idea generation
    to executed evidence, rather than treating proposal generation as a standalone
    text task.'
  - 'Key differences: they vary in domain specificity, degree of human collaboration,
    verification mechanism, and evaluation target, from physics-aware gates to deterministic
    programmatic authority and multi-hypothesis failure attribution.'
  - 'Trend evolution: the available evidence moves from survey and benchmark construction
    in 2025 toward more autonomous, self-evolving multi-agent pipelines in 2026; this
    is within the current frontier.'
  - 'Open questions: external validity beyond curated benchmarks, safe reliability
