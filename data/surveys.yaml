  related_work_outline:
  - 'Mainstream direction: Building closed-loop AI research agents that generate hypotheses,
    execute experiments, and refine ideas from execution feedback, with domain-specific
    systems in CFD, biology, and forecasting alongside domain-agnostic frameworks.'
  - 'Shared research pattern: Most systems connect evidence-grounded hypothesis generation
    with explicit verification, execution harnesses, and iterative failure correction;
    valid reporting or validity gates are added to suppress hallucinated claims.'
  - 'Key differences: Some systems use targeted human collaboration at high-leverage
    points, while others favor full autonomy with deterministic authority separation;
    evaluation also splits between domain-specific task success and general process
    quality.'
  - 'Trend evolution: Within the available 2025-2026 frontier, work is moving from
    surveys and narrow benchmarks toward 2026 systems emphasizing reliability, self-correction,
    and open-ended or large-scale agentic science.'
  - 'Open questions: Whether proxy benchmarks predict real discovery value, whether
    validity gates generalize beyond narrow planted failures, and whether autonomous
    scientific writing can become defensible and conference-ready remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建闭环AI研究智能体，使其生成假设、执行实验并从执行反馈中迭代修正；代表性系统覆盖CFD、生物学、时间序列预测，也有领域无关的通用框架尝试扩大覆盖。
  - 研究共性：多数系统将基于证据的假设生成与显式验证、执行工具和迭代失败纠正串联；引入可验证报告或有效性门控以抑制幻觉主张。
  - 关键差异：有的在高杠杆决策点引入人类协作，有的采用认知与权威分离的全自主流程；评估目标在领域任务指标、通用多基准分数和专家评审过程质量之间分化。
  - 趋势演进：在现有2025-2026前沿期内，工作正从综述与窄基准走向2026年更强调可靠性、自我纠正和开放式或规模化智能体科学的系统。
  - 开放问题：代理基准能否预测真实发现价值，有效性门控能否泛化到狭窄植入失败之外，自主科学写作能否变得可辩护并达到可投稿水平，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous discovery loops that generate hypotheses, run experiments,
        and refine from execution feedback
      what_it_solves: Converts open scientific questions into executable experiments,
        measured results, and iteratively updated hypotheses.
      what_remains_open: Cross-domain reliability is not established; fully autonomous
        defensible scientific writing and generalizing beyond narrow success cases
        remain unresolved.
    - line: Verification and failure attribution for research agents
      what_it_solves: Detects invalid outcomes, hallucinated results, or silent execution
        failures before they enter the research record.
      what_remains_open: Even physical or vision-based gates miss planted failures,
        and attribution mechanisms are mainly validated on limited benchmarks or case
        studies.
    - line: Benchmark-based evaluation of AI scientists
      what_it_solves: Makes AI scientist claims comparable through curated datasets,
        multiple-choice discovery questions, human baselines, and blind judging.
      what_remains_open: Coverage is often narrow or domain-specific, and proxy task
        scores are not yet tied to real-world discovery utility.
    - line: Interactive multi-agent platforms and research infrastructure
      what_it_solves: Turns isolated agent ideas into customizable roles, runnable
        code harnesses, artifact inspection, and repeatable workflows.
      what_remains_open: Maturity and external validation are limited; evidence from
        a small number of internal case studies may not generalize.
    - line: Conceptual surveys and taxonomies of agentic science
      what_it_solves: Organizes fragmented agentic systems by domain, capability,
        evaluation, and challenges such as reliability and ethics.
      what_remains_open: Direct empirical validation that proposed categories predict
        system behavior is not yet provided.
    consensus:
    - Closed-loop research cycles, alternating hypothesis generation with experiment
      execution and failure analysis, are the dominant shared pattern.
    - Evidence-grounded hypotheses from literature, dataset diagnostics, or prior
      execution results are preferred over unstructured LLM-only ideation.
    - Reliability depends on explicit validity gates, grounded reporting, deterministic
      authorities, or verifiable result constraints to limit fabricated claims.
    - Autonomous agents still act as research supports rather than fully independent
      discoverers, especially beyond narrow benchmarks.
    disagreements:
    - 'Interaction mode varies: some systems emphasize human-in-the-loop intervention
      at high-leverage points, while others emphasize full autonomy with deterministic
      authority separation.'
    - 'Verification strategy differs: vision-language physical checks, multi-hypothesis
      causal failure attribution, deterministic source-control authorities, and factual
      reporting constraints assume different failure locations.'
    - Evaluation target ranges from domain-specific scientific metrics such as CFD
      error or forecasting performance to general multi-benchmark agentic science
      scores and expert-judged novelty or completeness.
    - Scope differs between domain-specific systems in CFD, omics, and time-series
      forecasting and domain-agnostic frameworks built for arbitrary disciplines.
    open_questions:
    - Do current AI-scientist benchmarks predict real-world discovery value beyond
      narrow proxy tasks?
    - Which validity gates or failure-attribution mechanisms generalize across domains
      and failure modes?
    - How can autonomous research agents produce defensible, conference-ready claims
      without hallucinated metrics or citations?
    - How much of reported gains comes from the underlying LLM, versus the task-specific
      harness, verification gate, or human oversight?
    - What interaction mode and oversight granularity are most effective across different
      research phases?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主发现循环：生成假设、执行实验并从执行反馈中修正
      解决的问题: 将开放式科学问题转化为可执行实验、可测量结果和迭代更新的假设。
      尚未覆盖: 跨领域可靠性仍未建立；完全自主可辩护的科学写作及超越窄场景成功的泛化仍无证据。
    - 路线: 研究智能体的验证与失败归因
      解决的问题: 在无效结果、幻觉结论或静默执行失败进入研究记录前进行检测和纠正。
      尚未覆盖: 物理或视觉门控仍会漏掉植入失败；归因机制主要只在有限基准或案例研究上验证。
    - 路线: 基于基准的AI科学家评测
      解决的问题: 通过精选数据集、选择题、人类基线和盲评使AI科学家主张具备可比性。
      尚未覆盖: 覆盖范围常偏窄或偏领域特定；代理任务分数尚未与真实世界发现效用建立联系。
    - 路线: 交互式多智能体平台与研究基础设施
      解决的问题: 将单点智能体想法转化为可定制角色、可运行代码工具、工件检查和可重复工作流。
      尚未覆盖: 成熟度与外部验证有限；少量内部案例研究的证据可能不具普遍性。
    - 路线: 智能体科学的概念综述与分类
      解决的问题: 按领域、能力、评测和挑战组织零散的智能体系统，并指出可靠性与伦理问题。
      尚未覆盖: 尚未直接实证验证所提分类能否预测系统行为。
    共识:
    - 闭环研究循环，即假设生成与实验执行、失败分析交替进行，是主要共享模式。
    - 基于文献、数据集诊断或先前执行结果的证据支撑假设，优于仅由LLM产生的无结构化构思。
    - 可靠性依赖显式有效性门控、事实性报告、确定性权威或可验证结果约束，以限制虚假主张。
    - 自主智能体目前更多是研究辅助系统，而非能够超越窄基准的完全独立发现者。
    分歧:
    - 交互方式不同：部分系统在高杠杆决策点引入人类干预，另一些则强调认知与权威分离的全自主流程。
    - 验证策略不同：视觉-语言物理检查、多假设因果失败归因、确定性源码控制权威和事实性报告约束体现了不同的失败定位假设。
    - 评测目标不同：从CFD误差或预测性能等领域科学指标，到通用多基准智能体科学分数和专家评审新颖性或完整性。
    - 研究范围不同：CFD、组学和时间序列预测中的领域特定系统，与面向任意学科的领域无关框架存在差异。
    开放问题:
    - 当前AI科学家基准能否预测超越窄代理任务之外的真实发现价值？
    - 哪些有效性门控或失败归因机制能够跨领域和跨失败模式泛化？
    - 自主研究智能体如何在没有幻觉指标或引用的情况下产出可辩护且可投稿的成稿主张？
    - 报告性能中有多少来自底层LLM，多少来自任务特定工具、验证门控或人类监督？
    - 不同研究阶段中哪种交互模式和监督粒度最有效？
