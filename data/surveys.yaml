    - Autonomous research agents converge on decomposing the discovery cycle into
      hypothesis, experiment, analysis, and manuscript stages.
    - Verification and self-correction loops are treated as necessary for defensible
      claims, not optional post-processing.
    - Evaluation increasingly combines automated review or peer review, benchmark
      tasks, domain-specific metrics, and human expert baselines.
    - Human oversight persists even in highly autonomous systems, especially at high-leverage
      decision points.
    disagreements:
    - Scope ranges from general machine-learning research to domain-bound discovery
      in computational fluid dynamics, applied mathematics, and single-cell biology.
    - 'Verification mechanisms differ: internal logical consistency, visual physics
      inspection of rendered fields, and benchmark or human-relative correctness.'
    - 'Evaluation targets differ: workshop peer-review acceptance, benchmark task
      completion, domain-specific metric improvement, or expert-relative performance.'
    - Interaction mode ranges from fully autonomous operation to human-in-the-loop
      intervention modes.
    - Reproducibility evidence is uneven; some systems are open-source or artifact-linked,
      while others provide only paper or rubric signals.
    open_questions:
    - Do current verification gates remain reliable on distribution shift or in new
      domains?
    - Which evaluation metrics best predict real scientific utility rather than task
      completion or reviewer agreement?
    - Where should human intervention be inserted under limited oversight budget,
      and can that generalize beyond one benchmark?
    - What evidence is missing due to absent code, datasets, baselines, metrics, or
      limitation statements in several papers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研流水线
      解决的问题: 自动化从想法生成到论文撰写的完整研究周期，覆盖通用机器学习或特定领域。
      尚未覆盖: 同行评审接受不稳定，例如三篇工作坊论文仅一篇通过，完整会议级证据仍缺失。
    - 路线: 领域专用验证门控发现智能体
      解决的问题: 通过逻辑审计或物理感知图像检查等机制，让自主生成的科学声明在特定领域内更可靠。
      尚未覆盖: 验证门控仍会遗漏静默失败，如16个植入失败中漏掉2个，且只在窄领域测试。
    - 路线: 科学发现评测环境
      解决的问题: 提供含任务和难度分级的评测环境、自动指标和人类基线，用于比较完整发现周期能力。
      尚未覆盖: 代理指标与真实科研效用之间的一致性未证实；任务覆盖有限，强基线智能体仍表现困难。
    - 路线: 人机协作科研编排
      解决的问题: 在完全自主与逐步监督之间引入多种干预模式、可验证报告和自愈执行，以改善决策质量。
      尚未覆盖: 最佳干预点仅在一个实验阶段基准上验证，缺少跨领域与长期证据。
    - 路线: 可复现科研智能体基础设施
      解决的问题: 将智能体能力转化为可运行、可检查且有时开源的系统，并支持评审或工件产出。
      尚未覆盖: 跨硬件、数据集和用户设置的标准化外部验证不均衡，代码与数据集信号仍存在缺口。
    共识:
    - 自主科研智能体普遍将发现周期拆解为假设、实验、分析和论文撰写等阶段。
    - 验证与自校正循环被视为形成可靠结论的必要环节，而非可选后处理。
    - 评测越来越多结合自动评审或同行评审、基准任务、领域指标和人类专家基线。
    - 即使在高自主系统中，人类监督仍然存在，尤其集中在高杠杆决策点。
    分歧:
    - 研究范围从通用机器学习到计算流体力学、应用数学和单细胞生物学等领域差异明显。
    - 验证机制各异：内部逻辑一致性检查、渲染流场的视觉物理检查、基准或人工相对正确性。
    - 评测目标不同：工作坊同行评审接受、基准任务完成、领域指标改进或相对专家表现。
    - 交互模式从完全自主到带多种干预模式的人机协作不等。
    - 可复现证据不均衡，部分系统开放源码或工件，部分仅有论文或评审信号。
    开放问题:
    - 当前验证门控在分布外或新领域中是否仍然可靠？
    - 哪些评测指标能预测真实科学效用，而不只是任务完成或评审者一致性？
    - 在有限监督预算下，人类干预应插入何处，并能否超越单一基准泛化？
    - 若干论文缺少代码、数据集、基线、指标或局限性声明，这些证据缺口如何弥补？
