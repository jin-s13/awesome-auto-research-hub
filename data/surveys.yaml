  related_work_outline:
  - 'Mainstream direction: Multi-agent autonomous systems that integrate literature
    search, synthesis, and review generation into end-to-end scientific discovery
    pipelines, driven by LLM reasoning and iterative refinement.'
  - 'Shared research pattern: Decomposing literature intelligence into modular agent
    roles (retrieval, analysis, writing, reviewing) and using feedback loops—rubrics,
    self-critique, or human evaluation—to improve output quality.'
  - 'Key differences: Task scope ranges from standalone survey generation to full-cycle
    scientific discovery; evaluation methods diverge between rubric-based, human-benchmark,
    and independent scientist accuracy; supervision varies from human-in-the-loop
    to fully autonomous self-evolution.'
  - 'Trend evolution: The 2023–2026 window shows a rapid shift from dedicated survey
    engines (2025) toward deeply integrated, self-evolving agent frameworks (2026),
    with growing emphasis on failure analysis, reliability, and domain-agnostic design.'
  - 'Open questions: Reliable citation and factuality under long-horizon synthesis,
    cross-domain knowledge consistency, alignment between proxy metrics and true research
    utility, and the lack of large-scale, diverse benchmarks for literature intelligence.'
  related_work_outline_zh:
  - 主流方向：多智能体自主系统，将文献搜索、综合与综述生成集成到端到端科学发现管道中，由LLM推理和迭代优化驱动。
  - 研究共性：将文献智能分解为模块化智能体角色（检索、分析、写作、评审），并通过反馈循环（评分准则、自我批判或人类评估）提升输出质量。
  - 关键差异：任务范围从独立综述生成到完整科学发现循环；评估方式分为基于评分准则、人类基线对照和独立科学家准确率评定；监督模式从人在回路到完全自主自我演化。
  - 趋势演进：2023–2026年窗口显示从专用综述引擎（2025年）快速转向深度集成、自我演化的通用智能体框架（2026年），并越来越重视失败分析、可靠性和领域无关设计。
  - 开放问题：长周期综合中的可靠引用与事实性，跨领域知识一致性，代理指标与真实研究效用之间的对齐，以及缺乏大规模、多样化的文献智能基准。
  literature_review:
    line_of_work_matrix:
    - line: Automated survey synthesis
      what_it_solves: Generating structured, high-quality academic survey papers from
        raw literature by orchestrating topic expansion, citation curation, summarization,
        and peer-review agents.
      what_remains_open: Deep verification of cited content beyond surface-level alignment,
        and adaptation to rapidly evolving knowledge without manual rubric updates.
    - line: Literature search integrated with scientific discovery
      what_it_solves: Enabling autonomous agents to perform parallel literature retrieval,
        data analysis, and hypothesis generation, with shared knowledge states that
        support coherent long-horizon research.
      what_remains_open: Hallucination propagation across integrated modules, cross-domain
        knowledge conflict resolution, and guarantees that the retrieved literature
        fully supports the derived conclusions.
    - line: System evaluation and failure diagnosis
      what_it_solves: Benchmarking AI scientist capabilities on real-world data tasks
        (e.g., cell annotation, multiple-choice questions from published studies)
        and documenting recurring failure modes such as implementation drift and memory
        degradation.
      what_remains_open: Fine-grained, multi-domain benchmarks that capture literature-specific
        reasoning, and empirical evidence linking benchmark scores to downstream research
        impact.
    - line: Self-evolving and domain-agnostic frameworks
      what_it_solves: Providing continuous self-evolution mechanisms that allow agents
        to refine hypotheses, self-critique, and accumulate knowledge across experimental
        cycles without domain-specific rewiring.
      what_remains_open: Validation on concrete literature intelligence tasks (not
        just general science benchmarks), and formal guarantees on convergence and
        knowledge stability over long evolution runs.
    - line: Conceptual taxonomy and challenge mapping
      what_it_solves: Organizing the landscape of agentic AI for science, including
        literature review automation, and identifying critical gaps in system reliability,
        ethical concerns, and human–AI collaboration.
      what_remains_open: Direct empirical validation that the proposed taxonomies
        predict system behavior, and actionable design principles beyond high-level
        challenge identification.
    consensus:
    - All systems decompose the literature intelligence workflow into specialized
      modules such as retrieval, analysis, synthesis, and review, typically implemented
      as LLM-based agents.
    - Iterative refinement with explicit feedback—whether from reviewer agents, verification
      loops, or human judgment—is universally adopted to improve factual consistency
      and scholarly rigor.
    - Literature search and synthesis are recognized as core bottlenecks for autonomous
      scientific discovery, motivating tight integration with data analysis and hypothesis
      generation rather than treating them as isolated tasks.
    - The field acknowledges that current LLM-based agents suffer from hallucination,
      memory degradation, and insufficient domain intelligence, and that reliability
      must be improved before full autonomy is reached.
    disagreements:
    - ARISE uses a behaviorally anchored rubric and multiple reviewer agents to evaluate
      survey drafts, whereas Kosmos relies on a structured world model that shares
      information between a literature agent and a data analysis agent, with accuracy
      assessed by independent scientists.
    - ReasFlow and Why LLMs Aren't Scientists emphasize human expert supervision (Principal
      Investigator role) and document failure modes to guide design, while EvoMaster
      pursues continuous self-evolution without domain-specific human intervention.
    - BAISBench measures performance through multiple-choice questions derived from
      published studies and human bioinformatician baselines; ARISE measures quality
      via rubric-aligned scores; Kosmos evaluates report-statement accuracy directly,
      leading to different conclusions about system readiness.
    - 'Task definitions differ: ARISE targets stand-alone survey generation, whereas
      Kosmos, ReasFlow, and OR-Agent embed literature search within a broader scientific
      discovery loop that includes algorithm design, theorem proving, or simulation-based
      experimentation.'
    open_questions:
    - How can we automatically verify that every claim in a generated survey is supported
      by the cited source, and that the source is not misinterpreted?
    - What benchmark designs can capture the depth of literature understanding—such
      as contradiction detection, gap identification, and cross-document reasoning—beyond
      surface-level citation accuracy?
    - How do long-horizon scientific discovery runs maintain literature knowledge
      consistency and prevent the agent's memory from drifting or degrading over tens
      of cycles?
    - Can self-evolving frameworks improve literature synthesis quality beyond a fixed
      pipeline, and how should we measure the trade-off between adaptability and factual
      reliability?
    - What is the relationship between proxy evaluation metrics (e.g., rubric scores,
      MCQ accuracy) and the real-world utility of generated literature reviews for
      researchers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动化综述合成
      解决的问题: 通过编排主题扩展、引文管理、总结和同行评审智能体，从原始文献中生成结构化、高质量的学术综述论文。
      尚未覆盖: 超越表面一致性的引文内容深度验证，以及在无需人工更新评分准则的情况下适应快速变化的知识体系。
    - 路线: 文献搜索与科学发现集成
      解决的问题: 使自主智能体能够并行执行文献检索、数据分析和假设生成，并通过共享知识状态支持连贯的长周期研究。
      尚未覆盖: 幻觉在集成模块间的传播、跨领域知识冲突解决，以及保证检索到的文献完全支持所得结论。
    - 路线: 系统评估与失败诊断
      解决的问题: 在真实数据任务（如细胞注释、基于已发表研究的选择题）上基准测试AI科学家能力，并记录实施漂移和记忆退化等反复出现的失败模式。
      尚未覆盖: 能捕捉文献特定推理的细粒度多领域基准，以及将基准分数与下游研究影响力联系起来的实证证据。
    - 路线: 自我演化与领域无关框架
      解决的问题: 提供持续自我演化机制，使智能体能够在实验周期中优化假设、自我批判并积累知识，无需针对特定领域重新设计。
      尚未覆盖: 在具体文献智能任务上的验证（而非仅通用科学基准），以及在长期演化过程中收敛性和知识稳定性的形式化保证。
    - 路线: 概念分类与挑战映射
      解决的问题: 梳理用于科学发现的智能体AI格局，包括文献综述自动化，并识别系统可靠性、伦理问题和人机协作中的关键差距。
      尚未覆盖: 所提出的分类法能预测系统行为的直接实证验证，以及超越高层挑战识别的可操作设计原则。
    共识:
    - 所有系统都将文献智能工作流分解为检索、分析、综合和评审等专门模块，通常以基于LLM的智能体实现。
    - 普遍采用带有明确反馈的迭代优化（无论是来自评审智能体、验证循环还是人类判断），以提升事实一致性和学术严谨性。
    - 文献搜索与综合被视为自主科学发现的核心瓶颈，这促使系统将其与数据分析和假设生成紧密集成，而非作为孤立任务处理。
    - 该领域承认当前基于LLM的智能体存在幻觉、记忆退化和领域智能不足，并且在达到完全自主之前，必须提升可靠性。
    分歧:
    - ARISE使用行为锚定评分准则和多个评审智能体评估综述草稿，而Kosmos依赖结构化世界模型在文献智能体和数据分析智能体之间共享信息，并通过独立科学家评估准确性。
    - ReasFlow和Why LLMs Aren't Scientists强调人类专家监督（首席研究员角色）并记录失败模式以指导设计，而EvoMaster追求无需领域特定人工干预的持续自我演化。
    - BAISBench通过基于已发表研究的选择题和人类生物信息学家基线来衡量性能；ARISE通过评分准则对齐分数衡量质量；Kosmos直接评估报告陈述的准确性，导致对系统成熟度的不同结论。
    - 任务定义不同：ARISE面向独立综述生成，而Kosmos、ReasFlow和OR-Agent将文献搜索嵌入更广泛的科学发现循环中，包括算法设计、定理证明或基于仿真的实验。
    开放问题:
    - 如何自动验证生成综述中的每个陈述都有被引来源支持，且来源未被曲解？
    - 什么样的基准设计能捕捉文献理解的深度，例如矛盾检测、差距识别和跨文档推理，而不仅仅是表面引用准确性？
    - 长周期科学发现运行如何保持文献知识一致性，并防止智能体记忆在数十个周期中漂移或退化？
    - 自我演化框架能否比固定流水线进一步提升文献综合质量，以及如何衡量适应性提升与事实可靠性之间的权衡？
    - 代理评估指标（如评分准则分数、选择题准确率）与生成文献综述对研究人员的实际效用之间有何关系？
