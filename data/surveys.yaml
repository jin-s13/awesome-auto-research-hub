  related_work_outline:
  - 'Mainstream direction: Building autonomous AI scientist pipelines that close the
    loop from hypothesis generation, literature review, and experiment execution to
    result analysis and paper writing, with increasing emphasis on self-correction
    and human-in-the-loop collaboration.'
  - 'Shared research pattern: Systems integrate large language models as core reasoning
    engines, decompose the research process into modular agent roles, and incorporate
    verification mechanisms (physical gates, formal proofs, multi-agent debate) to
    improve reliability.'
  - 'Key differences: Representation ranges from multi-agent debate to self-evolving
    knowledge accumulation; supervision spans fully autonomous, human-in-the-loop,
    and interactive inspection; evaluation targets vary from domain-specific benchmarks
    (CFD, single-cell) to general AI-scientist suites; some systems prioritize formal
    correctness while others emphasize empirical discovery.'
  - 'Trend evolution: Within the 2025–2026 frontier, the field is moving from single-run
    autonomous experimenters toward self-improving frameworks that learn across runs,
    and from generic toolchains toward domain-adapted verification gates and human-AI
    interaction modes.'
  - 'Open questions: How to guarantee that autonomously generated hypotheses are both
    novel and scientifically valid; how to close the gap between verification (formal
    or physical) and real-world discoverability; what is the optimal human-AI collaboration
    protocol for high-stakes research decisions; and whether general-purpose AI-scientist
    frameworks can match domain-specific ones without sacrificing rigor.'
  related_work_outline_zh:
  - 主流方向：构建自主AI科学家流水线，闭环覆盖假设生成、文献综述、实验执行到结果分析与论文撰写，并日益强调自我修正与人机协作。
  - 研究共性：系统以大型语言模型为核心推理引擎，将研究过程分解为模块化智能体角色，并引入验证机制（物理门控、形式化证明、多智能体辩论）以提高可靠性。
  - 关键差异：表示方式从多智能体辩论到自我演化知识积累不等；监督信号涵盖完全自主、人机协作与交互式审查；评测目标从领域特定基准（CFD、单细胞）到通用AI科学家评测套件；部分系统优先保证形式正确性，另一部分强调经验发现。
  - 趋势演进：在2025–2026年前沿内，领域正从单次运行自主实验者转向跨运行学习的自我改进框架，并从通用工具链转向领域适配的验证门控和人机交互模式。
  - 开放问题：如何保证自主生成的假设兼具新颖性与科学有效性；如何弥合验证（形式化或物理）与真实世界可发现性之间的差距；高风险研究决策的最佳人机协作协议是什么；通用AI科学家框架能否在不牺牲严谨性的前提下达到领域专用系统的水平。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous research pipelines
      what_it_solves: 'End-to-end automation of scientific discovery: translating
        a research goal into hypothesis generation, experimental design, code execution,
        and result reporting.'
      what_remains_open: Reliability of fully autonomous scientific writing and the
        ability to produce genuinely novel, conference-ready contributions without
        human filtering.
    - line: Self-improvement and failure attribution
      what_it_solves: Robustness of autonomous agents by diagnosing experiment failures,
        attributing root causes, and iteratively refining hypotheses or implementations.
      what_remains_open: Generalization of failure attribution to unseen error modes
        and long-horizon knowledge accumulation beyond single repair loops.
    - line: Formal and physical verification gates
      what_it_solves: Ensuring the correctness of generated claims by embedding formal
        proof checkers or physics-based vision-language validation into the research
        loop.
      what_remains_open: The gap between formal/machine-checked correctness and the
        intended scientific meaning, and the coverage of verification against all
        possible silent failures.
    - line: Human-AI collaboration modes
      what_it_solves: Balancing autonomy and oversight by allowing human intervention
        at high-leverage decision points, thereby improving idea quality and experiment
        completeness.
      what_remains_open: Optimal intervention granularity and the transferability
        of collaboration protocols across domains and research phases.
    - line: Evaluation benchmarks for AI scientists
      what_it_solves: Standardized comparison of diverse AI scientist systems on tasks
        such as code generation, experimental design, and biological discovery.
      what_remains_open: Alignment of proxy metrics with real scientific utility,
        and the coverage of open-ended, long-term discovery tasks that mirror actual
        research.
    consensus:
    - All systems treat large language models as the central reasoning component for
      hypothesis formation and experimental planning.
    - Autonomous research pipelines converge on a modular architecture that separates
      literature review, ideation, execution, verification, and writing.
    - There is broad agreement that pure end-to-end autonomy is currently insufficient
      for high-stakes scientific claims, motivating verification gates and human oversight.
    - Evaluation standardization is recognized as a critical need, with several benchmarks
      emerging to compare AI scientists across topics and domains.
    disagreements:
    - 'Representation of the research process: some systems adopt multi-agent debate,
      others rely on a single self-evolving agent with accumulated memory.'
    - 'Verification strategy: physics-based vision-language gates vs. formal proof
      assistants vs. structured debate and fact-checking for detecting hallucinations.'
    - 'Role of human input: one line promotes targeted human collaboration at critical
      decision points, while another pursues full autonomy with only post-hoc inspection.'
    - 'Domain specificity: domain-agnostic foundational frameworks claim extensibility
      with minimal code, whereas domain-specific systems embed deep physical or formal
      knowledge for higher reliability.'
    open_questions:
    - Can formal verification (e.g., Lean proofs) be scaled to cover the full pipeline
      from informal hypothesis to machine-checked claim without a semantic gap?
    - How can failure attribution mechanisms be tested on truly novel, unforeseen
      failure modes that are not part of the training distribution?
    - What is the optimal level of human intervention that maximizes scientific output
      quality without reintroducing human bias bottlenecks?
    - Do current AI scientist benchmarks capture the open-ended, iterative nature
      of real scientific discovery, or do they over-reward incremental improvements
      on known tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主研究流水线
      解决的问题: 端到端自动化科学发现：将研究目标转化为假设生成、实验设计、代码执行和结果报告。
      尚未覆盖: 完全自主的科学写作可靠性，以及在没有人类筛选的情况下产生真正新颖、可投稿论文的能力。
    - 路线: 自我改进与失败归因
      解决的问题: 通过诊断实验失败、归因根本原因并迭代优化假设或实现，提升自主智能体的鲁棒性。
      尚未覆盖: 失败归因对未知错误模式的泛化能力，以及超越单次修复循环的长期知识积累。
    - 路线: 形式化与物理验证门控
      解决的问题: 通过在研究循环中嵌入形式化证明检查器或基于物理的视觉-语言验证，保证生成声明正确性。
      尚未覆盖: 形式化/机器检查正确性与预期科学意义之间的语义差距，以及验证对各类静默失败的覆盖度。
    - 路线: 人机协作模式
      解决的问题: 在高杠杆决策点允许人类干预，以平衡自主性与监督，提升想法质量和实验完整性。
      尚未覆盖: 最优干预粒度，以及协作协议在不同领域和研究阶段的可迁移性。
    - 路线: AI科学家评测基准
      解决的问题: 在代码生成、实验设计和生物学发现等任务上标准化比较不同AI科学家系统。
      尚未覆盖: 代理指标与真实科学效用的一致性，以及覆盖真实研究那种开放式、长期发现任务的基准设计。
    共识:
    - 所有系统都将大型语言模型作为假设形成和实验规划的核心推理组件。
    - 自主研究流水线收敛于模块化架构，将文献综述、构思、执行、验证和写作分离。
    - 普遍认为纯粹的端到端自主尚不足以应对高利害科学声明，因此引入验证门控和人类监督。
    - 评估标准化被视为关键需求，多个基准正涌现以跨主题和领域比较AI科学家。
    分歧:
    - 研究过程的表示：部分系统采用多智能体辩论，另一部分依赖具有记忆累积的单一自我演化智能体。
