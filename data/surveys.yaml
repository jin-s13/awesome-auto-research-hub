    generic benchmarks (DISCOVERYWORLD). By 2025–2026, the focus shifted toward more
    complex, multi-agent architectures, domain-grounded metrics, and explicit reliability
    mechanisms such as visual-language physics gates, failure attribution, and grounded
    reporting, indicating a move from proof-of-concept to governance-oriented evaluation.'
  - 'Open questions: How to validate scientific correctness without a gold-standard
    human baseline; whether proxy metrics (automated reviews, task completion) align
