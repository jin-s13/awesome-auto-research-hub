    研究路线矩阵:
    - 路线: 闭环实验规划与执行
      解决的问题: 将假设或生成的想法连接到可执行实验、代码运行和迭代修正，覆盖模拟或in-the-wild条件。
      尚未覆盖: 成功是否来自可迁移的规划能力还是任务特定工程，以及能否泛化到未见过的实验类型。
