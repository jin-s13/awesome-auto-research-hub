      reproducibility, or downstream research utility?
    - How can domain-aware verification be generalized without hand-built task-specific
      gates or prior knowledge?
    - What level and timing of human interaction maximize output quality without exhaustive
      oversight?
    - Which design can prevent long-horizon failures such as memory degradation, implementation
      drift, and overexcitement in paper generation?
