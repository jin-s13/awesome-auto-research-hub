  literature_review:
    line_of_work_matrix:
    - line: Autonomous end-to-end research and paper generation pipelines
      what_it_solves: Turning a research prompt into idea generation, code execution,
        experiment runs, visualization, and complete manuscript drafts with reduced
        human intervention.
      what_remains_open: Scientific defensibility and acceptance remain inconsistent;
        only one workshop-level peer acceptance is evidenced, not full conference-level
        validity.
    - line: Verification and grounded reporting layers
      what_it_solves: Reducing fabricated numbers, hallucinated citations, and invalid
        results by constraining outputs to measured values or checking logical/physical
        coherence before writing.
      what_remains_open: Verification gates still miss planted silent failures and
        do not yet cover broad scientific domains or diverse failure modes.
    - line: Self-correcting execution and failure attribution
      what_it_solves: Diagnosing failed experiments and routing corrections to hypothesis,
        experimental design, or implementation instead of discarding failed attempts.
      what_remains_open: Long-horizon memory, domain intelligence, and causal attribution
        reliability remain unresolved and are explicitly reported as failure modes.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Placing human judgment at high-leverage decision points to improve
        outcomes over full autonomy or exhaustive step-by-step oversight.
      what_remains_open: Which intervention modes generalize across research settings
        and how much human effort is actually needed remain unclear.
    - line: Evaluation, benchmarking, and failure-mode analysis
      what_it_solves: Making AI-generated research comparable through automated reviewers,
        task benchmarks, artifact scores, and documented failure modes.
      what_remains_open: Proxy metrics such as LLM review scores and artifact quality
        have not been shown to predict real scientific contribution or human peer
        acceptance.
    consensus:
    - Multi-agent LLM systems can draft full papers but need execution-grounded checks
      and review to produce defensible scientific claims.
    - Automated reviewer scores and acceptance thresholds are the current primary
      evaluation signal, although evidence of human-level validity remains limited.
    - Verification, source/citation grounding, and measured-value constraints improve
      report trustworthiness over unconstrained generation.
    - Targeted human collaboration can outperform both fully autonomous and step-by-step
      oversight in reported ablations.
    disagreements:
    - 'Interaction mode: fully autonomous minimal-prompt systems versus human-in-the-loop
      pipelines with explicit intervention points.'
    - 'Verification signal: vision-language physical gates, logical coherence audits,
      measured-value constraints, multi-agent debate, or automated reviewer feedback.'
    - 'Evaluation target: peer workshop acceptance, domain metric improvement, benchmark
      success rates, artifact quality, or blind paper scores.'
    - 'Domain focus: applied mathematics, computational fluid dynamics, machine learning
      subfields, or multi-domain research benchmarks.'
    open_questions:
    - Do LLM-based or automated review scores predict human peer-review acceptance
      and long-term scientific utility beyond the one workshop acceptance reported?
    - Which verification gates are sufficient to detect silent experimental and reasoning
      failures across domains without adding unacceptable compute or human effort?
    - How much of the reported gain comes from pipeline structure, search, verification,
      or collaboration rather than the underlying frontier model or task environment?
    - What minimal human intervention points preserve scientific accountability while
      scaling autonomous research and writing?
    - When code, data, and limitation details are not consistently reported, can current
      benchmarks and artifacts adequately measure soundness, reproducibility, and
      communication quality?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究与论文生成流水线
      解决的问题: 把研究提示转化为创意生成、代码执行、实验运行、可视化和完整论文草稿，减少人工干预。
      尚未覆盖: 科学可辩护性和被接受性仍不一致，证据只显示个别工作坊级别的接受，尚未达到完整会议级别的有效性。
    - 路线: 验证与有依据报告层
      解决的问题: 通过把输出约束到测量值或检查逻辑/物理一致性，降低虚构数字、幻觉引用和无效结果。
      尚未覆盖: 验证门控仍会漏掉植入的静默失败，尚未覆盖广泛科学领域和多种失败模式。
    - 路线: 自我纠正执行与失败归因
      解决的问题: 诊断失败实验，并将纠正路由到假设、实验设计或实现，而不是放弃失败尝试。
      尚未覆盖: 长程记忆、领域智能和因果归因的可靠性仍未解决，并被明确报告为失败模式。
    - 路线: 人机协作与介入设计
      解决的问题: 在高杠杆决策点放置人类判断，比完全自主或逐步监督取得更好结果。
      尚未覆盖: 哪些介入模式跨研究场景可泛化，以及实际需要多少人类工作量仍不明确。
    - 路线: 评测、基准与失败模式分析
      解决的问题: 通过自动评审、任务基准、工件分数和记录失败模式，让AI生成的研究可比较。
      尚未覆盖: LLM评审分数和工件质量等代理指标尚未被证明能预测真实科学贡献或人类同行接受。
    共识:
    - 多智能体LLM系统能撰写完整论文，但需要基于执行的检查和评审才能产生可辩护的科学主张。
    - 自动评审分数和接受阈值是当前主要评测信号，但关于接近人类有效性的证据仍然有限。
    - 验证、来源/引用基础化和测量值约束相比无约束生成能提升报告可信度。
    - 报告中的消融显示，在高杠杆点进行精准人类协作优于完全自主和逐步监督。
    分歧:
    - 交互模式：完全自主的少提示系统，与具有明确介入点的人机闭环流水线之间存在差异。
    - 验证信号：视觉-语言物理门控、逻辑一致性审计、测量值约束、多智能体辩论或自动评审反馈各不相同。
    - 评测目标：工作坊同行接收、领域指标提升、基准成功率、工件质量或盲评论文分数不一致。
    - 领域范围：应用数学、计算流体动力学、机器学习子领域或多领域研究基准各有侧重。
    开放问题:
    - 自动评审或LLM评分能否预测人类同行接收和长期科学效用，目前仅有一个工作坊接收案例的证据。
    - 哪些验证门控足以在跨领域情况下检测静默实验和推理失败，且不会增加过多算力或人工负担？
    - 报告中的提升有多少来自流水线结构、搜索、验证或协作，而不是底层前沿模型或任务环境？
    - 哪些最小人类介入点能在扩展自主研究与写作的同时保持科学问责？
    - 当代码、数据和局限性披露不一致时，当前基准和工件是否足以衡量AI生成论文的可靠性、可复现性和交流质量？
