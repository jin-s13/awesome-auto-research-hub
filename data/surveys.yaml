    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: Turns ideation, code implementation, experiment execution, and
        visualization into complete paper drafts without per-step human authoring.
      what_remains_open: Outputs remain inconsistent; success is shown mainly through
        rubric scores, workshop-level acceptance, or benchmark comparisons rather
        than reliable conference-ready writing.
    - line: Domain-grounded scientific writing with verification gates
      what_it_solves: Checks logical coherence, physical plausibility, or measurement
        constraints before claims are written into a manuscript, reducing silent failures
        and fabricated claims.
      what_remains_open: Verification gates can still miss planted silent failures
        and depend on domain-specific checks that may not transfer across disciplines.
    - line: Human-AI collaborative research writing workflows
      what_it_solves: Distributes drafting, execution, verification, and revision
        between human experts and agents to improve accountability and credible output.
      what_remains_open: The optimal intervention granularity is unresolved; evidence
        supports selected high-leverage checkpoints but not a general scaling rule.
    - line: Self-correcting failure attribution and grounded reporting
      what_it_solves: Converts failed experiments or hallucination risks into corrected
        reports constrained to measured values and diagnosed root causes.
      what_remains_open: It does not fully overcome conference-ready writing and depends
        on proxy scores whose real scientific value is under-evidenced.
    - line: Evaluation and review simulation for generated manuscripts
      what_it_solves: Makes generated paper quality comparable through automated reviewers,
        scoring rubrics, and planted-failure ablations.
      what_remains_open: Agreement between these proxy evaluations and real human
        peer review or long-term research utility lacks direct evidence.
    consensus:
    - Research communication is treated as an integrated output of autonomous discovery
      rather than as a standalone drafting aid.
    - Some form of verification or grounding is considered necessary before claims
      enter a manuscript to reduce hallucinated results and citations.
    - Pure autonomy is often unstable; reviewer feedback or human oversight improves
      credible output.
    - Automated review and rubric scores are common, but they are not yet shown to
      match real peer-review outcomes.
    disagreements:
