  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research loop frameworks (e.g., The AI Scientist)
      what_it_solves: Translates idea generation, code implementation, experiment
        execution, visualization, and manuscript writing into an automated workflow.
      what_remains_open: Consistency across attempts, conference-level quality beyond
        workshop acceptance, and the validity of automated reviewers as a primary
        evaluation signal.
    - line: Domain-verified discovery agents (e.g., AI CFD Scientist)
      what_it_solves: Connects autonomous experimentation to domain-specific verification
        such as physics-aware visual inspection, reducing silent invalid results.
      what_remains_open: The verification gate still misses some planted failures;
        transfer to new domains may require substantial domain-specific engineering.
    - line: Discovery benchmark environments (e.g., DISCOVERYWORLD, BAISBench)
      what_it_solves: Provides controlled tasks, metrics, and human baselines for
        measuring full-cycle scientific discovery and domain-specific biological discovery.
      what_remains_open: Whether controlled or multiple-choice task scores align with
        real research contribution and downstream decision utility.
    - line: Failure diagnosis and self-correcting research systems (e.g., SAGE)
      what_it_solves: Attributes long-horizon experiment failures to hypothesis, design,
        or implementation causes and routes interventions accordingly.
      what_remains_open: Causal attribution remains difficult to validate directly;
        memory degradation, implementation drift, and weak scientific taste are not
        fully solved.
    - line: Interactive multi-agent research platforms (e.g., Claw AI Lab)
      what_it_solves: Supports customizable research roles, real-time monitoring,
        artifact inspection, rollback/resume, and integration of local code and data.
      what_remains_open: Evaluation is limited to small internal case studies; external
        validation across hardware, datasets, and user settings is still missing.
    consensus:
    - Research automation should be evaluated across a full loop of hypothesis generation,
      execution, verification, analysis, and reporting rather than single-step outputs.
    - Reliability is improved through explicit verification gates, artifact inspection,
      or failure detection rather than generation fluency alone.
    - Current agents still underperform human or acceptance thresholds on complex
      and real-data tasks, so failure cases are central to evaluation.
    - Open-source artifacts and reproducible workflows are treated as key evidence,
      but the packet leaves cross-setting external replication as a verification gap.
    disagreements:
    - Evaluation targets range from synthetic virtual discovery tasks to real omics
      datasets and domain-specific physics simulation.
    - 'Verification signals differ: automated text review, vision-based physics inspection,
      human expert baselines, and multi-AI expert judgment are used as adjudicators.'
    - Deployment modes differ between fully autonomous pipelines and human-monitored
      platforms with rollback and resume control.
    - Generalization strategies differ between broad ML research loops and domain-specific
      workflows with compiled domain libraries.
    - Failure correction differs between simple reflection and structured multi-hypothesis
      causal attribution.
    open_questions:
    - To what extent do automated reviewers and benchmark task metrics predict genuine
      scientific contribution or downstream decision utility?
    - Can silent-failure detection transfer across domains without substantial domain-specific
      engineering?
    - How should long-horizon reliability be assessed when memory degradation, implementation
      drift, and weak scientific taste compound?
    - What external replication and standardized validation evidence is missing beyond
      small internal case studies and workshop-level acceptance?
