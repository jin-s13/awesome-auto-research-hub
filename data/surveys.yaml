  - 主流方向：证据集中于自主研究智能体的长程基准任务和效率指标，如 token、oracle 查询、力调用次数，重点在状态管理、高保真反馈解耦和可复用经验。
  - 研究共性：论文先指出闭环研究中失败或低效，再引入控制上下文、反馈或先验知识的机制，并在受控环境、基准套件或留出设置上评估最终任务质量和资源成本。
  - 关键差异：研究状态的表示、反馈来源与调度、领域特异性以及评测目标不同，包括最终基准分数、留出泛化和预测信用等。
