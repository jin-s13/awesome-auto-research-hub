      research workflows.
    - Automated review or LLM-based judging has become a common evaluation shortcut,
      but its validity still depends on alignment with human judgment.
    - Explicit verification, tree search, or failure-aware memory improves over naive
      single-pass research agents.
    - Current systems remain below human reliability on open-ended scientific discovery
      and experimental planning.
