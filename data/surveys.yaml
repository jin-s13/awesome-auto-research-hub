    研究路线矩阵:
    - 路线: 端到端自主研究写作流水线
      解决的问题: 把想法生成、代码运行、结果可视化与论文草稿写成整合为低人工干预流程。
      尚未覆盖: 通过同行评审或完整流程的比例很低，会议级写作质量尚未稳定证明。
    - 路线: 写作前领域专用验证
      解决的问题: 在结果进入论文前执行逻辑一致性或物理可视化检查，减少不可靠结论。
      尚未覆盖: 验证门控仍会漏掉部分静默错误，当前证据集中在应用数学和计算流体动力学。
    - 路线: 人机协作研究写作
      解决的问题: 让自主流水线在高杠杆决策点接受人工干预，平衡效率与可靠性。
      尚未覆盖: 哪些干预模式可跨基准泛化尚不明确，现有消融来自单一基准。
    - 路线: 自我纠正与有据报告
      解决的问题: 从实验失败中恢复，并把写入稿件的数据限制在实测值范围内。
      尚未覆盖: 完全自主的会议级写作仍困难，工件质量提升不等于稳定可发表。
    - 路线: AI生成写作的评测与证据设计
      解决的问题: 通过基准、自动评审、同行评审试点和评分表比较生成手稿质量。
      尚未覆盖: 代理评分与小样本基准尚未与人类判断或真实学术效用对齐；很多记录缺少引用数据。
    共识:
    - 研究普遍认为科学写作系统需要从实验执行到论文起草的闭环，而不是孤立文本生成。
    - 写作前验证被视为可信报告的必要条件，因为原始生成会产生无根据或物理上无效的结论。
    - 自动评审、评分表和同行评审试点被用作评估生成论文质量的重复证据。
    - 部分人工介入能提升可靠性，现有消融显示精准协作优于全程逐步监督。
    分歧:
    - 验证机制不同：面向理论的逻辑审计、面向仿真的视觉物理检查、面向机器学习结果的报告约束。
    - 交互模式不同：从完全自主到多种人工介入级别不等。
    - 评测目标不同：LLM评分表、工作坊同行评审接收、基准改进、盲评分数、能产出指标的结果比例。
    - 研究范围不同：通用机器学习写作与应用数学、计算流体动力学等专门领域写作。
    - 自我纠正方式不同：树搜索、结构化辩论、自愈执行、单次反思与多假设失败归因。
    开放问题:
    - 哪种验证门控能把物理感知检查中漏检的静默失败比例降到更低？
    - 自主系统能否稳定通过完整会议同行评审，而不仅是工作坊或基准中的孤立成功？
    - LLM评分表和基准分数在多大程度上能预测人类评估及下游研究效用？
    - 哪些人类干预点能跨领域推广？现有证据只覆盖单一基准。
    - 若干记录缺少代码、数据集和引用信息，外部可复现性与长期影响仍难判断。
