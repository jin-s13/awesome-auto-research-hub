  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agent frameworks
      what_it_solves: Closes the full discovery loop from ideation, experiment coding,
        and analysis to manuscript generation without a human operator at each stage.
      what_remains_open: Stability and acceptance beyond workshop-level outputs; removing
        template dependence does not yet establish trustworthy or consistent peer-review
        claims.
    - line: Domain-grounded discovery agents with validation gates
      what_it_solves: Constrains autonomous research to domains such as applied mathematics
        or computational fluid dynamics and adds logical or physics-aware checks before
        accepting results.
      what_remains_open: Verification gates can still miss silent failures or boundary
        cases, and evidence of cross-domain transfer is absent.
    - line: Simulated and blind-task evaluation environments for discovery agents
      what_it_solves: Makes discovery competence measurable through standardized tasks,
        completion metrics, task-relevant actions, or evidence-maturity rubrics.
      what_remains_open: Whether benchmark scores reflect real scientific utility;
        current agents plateau and lack controls, robustness, and reliable cross-agent
        separation.
    - line: Automated manuscript review and evidence scoring
      what_it_solves: Provides scalable review signals for generated papers and agent
        outputs using LLM judges or rubric-based scoring.
      what_remains_open: LLM-judge alignment with human peer review and ability to
        detect weak evidence beyond prose quality are only partially validated.
    consensus:
    - The field treats autonomous discovery as a staged process spanning ideation,
      experiment execution, analysis, and manuscript writing.
    - Recent systems commonly place an automated review or validation stage before
      claims are accepted.
    - LLM-based scoring is widely used, but current evidence shows it reflects execution
      and auditability more than scientific rigor.
    - Open-source or inspectable artifacts are increasingly bundled with agent systems,
      while external validation remains limited.
    disagreements:
    - End-to-end frameworks target broad machine-learning discovery, while domain-specific
      systems constrain search inside mathematics or computational fluid dynamics
      with stronger validity gates.
    - 'Evaluation target varies: some optimize generated manuscript scores, some task
      completion in simulated environments, and some evidence maturity on blind peer-reviewed
      tasks.'
    - 'Verification mechanisms differ: logical coherence auditing versus physics-aware
      vision-language inspection versus weak or absent validity gates.'
    - 'Deployment setting differs: some assume a human principal investigator, others
      run fully autonomous loops, and benchmarks expose agents to fixed frozen data
      without source conclusions.'
    open_questions:
    - Can agents move beyond auditable execution to claims with controls, robustness,
      falsifiability, and cross-dataset generalization?
    - Do automated LLM reviewers correlate with human peer review and real downstream
      scientific utility across domains?
    - How can domain-specific verification gates be generalized without missing silent
      failures, given observed missed failure plants in one study?
    - Are current limitations due to the evaluated systems themselves or to the single
      frozen base model and narrow task set?
