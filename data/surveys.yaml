  related_work_outline_zh:
  - 主流方向：构建可评测的自主研究智能体，以下游任务与留出迁移为核心，强调可审计工作流和可复用技能。
  - 研究共性：闭环搜索加评估闸门：提出/执行、经留出或高保真反馈选择、压缩更新状态或技能，再在固定基准上评测。
  - 关键差异：领域目标（材料、机器学习工程、数学、深度研究问答）、反馈节奏（留出、在线稀疏、递归自查）和知识来源（仓库技能、上下文记忆、代理修复）不同。
  - 趋势演进：在2025–2026前沿内，从单一基准转向可迁移/可审计评测，从孤立智能体转向技能复用与递归验证；2024年证据在本包中不可见。
  - 开放问题：基准到真实研究效用的迁移、最小高保真反馈、技能长期验证、预算受控的递归，以及缺失产物/局限性证据。
  literature_review:
    line_of_work_matrix:
    - line: Evaluation and evidence design
      what_it_solves: Making research-agent claims comparable through downstream tasks,
        transfer splits, fixed budgets, and failure cases.
      what_remains_open: Coverage across domains and agreement between benchmark metrics
        and real discovery utility; several packet entries lack visible methodology
        or limitation evidence.
    - line: Systems and reproducible infrastructure
      what_it_solves: Turning isolated agent methods into runnable workflows, reusable
        skill libraries, auditable code, and repeatable search loops.
      what_remains_open: Standardized external validation across domains and settings;
        artifact availability is uneven and fixed backbones/budgets may hide operational
        drift.
    - line: Action-conditioned control and planning
      what_it_solves: Connecting closed-loop search to intervention quality via sparse
        high-fidelity labels, acquisition rules, and online surrogate updates.
      what_remains_open: Attribution of gains to surrogate/controller versus agent
        search; persistent surrogate error and scaling beyond controlled discovery
        benchmarks.
    - line: Conceptual taxonomy and theory
      what_it_solves: Organizing long-horizon research into inner evidence-gathering
        and outer audit/follow-up loops, compressing context into an improvement state.
      what_remains_open: Empirical validation that recursive decomposition and compressed
        state are sufficient beyond reported deep-research and reasoning benchmarks.
    consensus:
    - Across lines, research agents are evaluated by downstream task success under
      fixed budgets rather than isolated final predictions; transfer splits and benchmark
      comparisons recur.
    - 'Closed-loop feedback is a shared concern: work uses held-out selection, sparse
      high-fidelity acquisition, or self-audit to decide which proposals survive.'
    - Reusable operational knowledge and auditable artifacts are treated as performance
      levers, whether from repository-distilled skills, frozen selected code, or compressed
      context.
    - Long-horizon autonomy is usually decomposed into proposal/execution and verification/update
      loops.
    disagreements:
    - 'Evaluation target differs: materials endpoints, ML engineering tasks, deep
      research question answering, and reasoning suites coexist.'
    - 'Feedback timing differs: after-search held-out transfer, online sparse oracle
      labels, or recursive self-audit without per-step oracle feedback.'
    - 'Supervision and knowledge source differ: repository-derived skills, reinforcement
      learning with long-horizon reward, and high-fidelity label-driven surrogate
      updates.'
    - 'Deployment setting differs: simulated benchmarks versus custom laboratory automation
      and externally screened data, affecting infrastructure cost and reproducibility.'
    - 'Evidence completeness differs: some records provide methodology and limitations,
      while several lack visible analysis fields or artifact signals.'
    open_questions:
    - How well do reported gains on Matbench, MADE, MLE-bench, PaperBench, FrontierCS,
      PassNet, BrowseComp, WideSearch, DeepSearchQA, and HLE translate to real research
      decisions?
    - What is the minimal high-fidelity feedback needed for robust closed-loop discovery,
      and when does surrogate repair amplify persistent error?
    - Can repository-distilled skills remain verified as source repositories, agent
      backbones, and execution budgets change?
    - How should recursive self-improvement and audit loops be evaluated under controlled
      inference and oracle budgets?
    - What evidence is hidden by missing analysis, limitation, or artifact fields
      among the 28-paper packet, and how should meta-benchmarks account for that?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 评测与证据设计
      解决的问题: 通过下游任务、留出迁移、固定预算与失败案例，让研究智能体的主张可比较。
      尚未覆盖: 跨领域覆盖，以及基准指标与真实研究效用是否一致；部分条目缺少可见的方法或局限性证据。
    - 路线: 系统与可复现基础设施
      解决的问题: 将单点智能体方法转化为可运行工作流、可复用技能库、可审计代码和可重复搜索流程。
      尚未覆盖: 跨领域与跨设置的标准化外部验证；产物可得性不均衡，固定主干和预算可能掩盖运行层面的漂移。
    - 路线: 动作条件控制与规划
      解决的问题: 通过稀疏高保真标签、采集规则和在线代理更新，把闭环搜索与干预质量连接起来。
      尚未覆盖: 性能提升有多少来自代理/控制器而非智能体搜索；代理误差持续存在，且尚未扩展出受控发现基准。
    - 路线: 概念分类与理论
      解决的问题: 将长程研究组织为内层证据收集与外层审计/跟进循环，并把上下文压缩为改进状态。
      尚未覆盖: 递归分解与压缩状态是否足以超越已报告的深度研究与推理基准，仍缺少直接验证。
    共识:
    - 各条路线都以固定预算下的下游任务成功为准，而不是只看最终答案；留出切分、基准对比和闭环选择反复出现。
    - 闭环反馈是共同瓶颈：研究用留出选择、稀疏高保真采集或自查来决定保留哪些提案。
    - 可复用操作知识或可审计工件被视为性能杠杆，包括仓库蒸馏技能、冻结的可复用代码或压缩上下文。
    - 长程自主通常被拆成提案/执行与外层验证/更新两个回路。
    分歧:
    - 评测目标不同：材料端点、机器学习工程任务、深度研究问答和推理套件并存。
    - 反馈时机不同：搜索后留出迁移、在线稀疏标签和递归自查并存。
    - 监督/知识来源不同：仓库蒸馏技能、长程强化学习奖励、高保真标签驱动代理更新并存。
    - 部署设置不同：模拟基准与定制实验室自动化和外部数据筛选并存，影响基础设施与可复现性。
    - 证据完整度不同：部分记录给出方法与局限，部分缺少可见分析与工件信号。
    开放问题:
    - 在 Matbench、MADE、MLE-bench、PaperBench、FrontierCS、PassNet、BrowseComp、WideSearch、DeepSearchQA、HLE
      上的提升能否迁移到真实研究决策？
    - 闭环发现所需的最小高保真反馈是多少，代理修复在何时会放大持续误差？
    - 当源仓库、智能体主干和执行预算变化时，仓库蒸馏技能能否持续保持已验证？
    - 如何在推理与 oracle 预算受控下评估递归自改进与审计循环？
    - 在 28 篇包的证据中，缺失的分析、局限或工件字段隐藏了什么，后续元基准应如何补偿？
