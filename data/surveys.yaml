  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research workflows (e.g., The AI Scientist, AI Scientist-v2)
      what_it_solves: Automates idea generation, experiment execution, visualization,
        analysis, and manuscript writing, with simulated review to filter low-quality
        papers.
      what_remains_open: 'Success is sparse: one of three AI Scientist-v2 submissions
        passed peer review; early systems can depend on code templates, and independent
        validity gates are not always shown.'
    - line: Domain-specific discovery agents with verification gates (e.g., ReasFlow,
        AI CFD Scientist)
      what_it_solves: Embeds formal or physics-aware checks into mathematics or computational
        fluid dynamics loops to catch logical errors and silent physical failures
        before human inspection.
      what_remains_open: 'Verification is incomplete: the CFD vision-language gate
        missed 2 of 16 planted silent failures, and results are demonstrated mainly
        in narrow domains and metrics.'
    - line: Virtual discovery environments for agent evaluation (e.g., DISCOVERYWORLD)
      what_it_solves: Provides controlled tasks over complete discovery cycles so
        agent exploration, experiment design, and conclusion quality can be compared
        automatically.
      what_remains_open: Strong baseline agents still struggle on many tasks, and
        task-completion or interpretable-knowledge metrics are not yet tied to real
        research value.
    - line: Evidence-grounded scientific discovery benchmarks (e.g., TruthInsightBench)
      what_it_solves: Uses blind tasks from peer-reviewed studies to score whether
        agents produce claims supported by controls, robustness, falsifiability, and
        generalization evidence.
      what_remains_open: Current coding agents cluster around 58-60 out of 100 on
        one frozen base model, and cross-base-model generalization remains unverified.
    consensus:
    - Current systems can execute and document analysis, generate code or experiments,
      and produce manuscript-like artifacts, but that does not by itself imply trustworthy
      scientific discovery.
    - Automated evaluation or review is treated as necessary to scale assessment beyond
      human inspection, though its validity remains proxy evidence.
    - Domain-specific verification gates and human-in-the-loop collaboration are introduced
      to reduce silent failures and expert intervention.
    - 'The strongest demonstrated results are narrow: a workshop-level accepted paper,
      a CFD RMSE improvement, or task benchmark gains, while robust general discovery
      remains unresolved.'
    disagreements:
    - 'Supervision differs: some systems pursue fully autonomous discovery, while
      others frame the human as principal investigator and the agent as graduate student.'
    - 'Evaluation target differs: full discovery environments, blind evidence tasks
      drawn from peer studies, manuscript review rubrics, or domain-specific physical/formal
      metrics.'
    - 'Success signal differs: peer-review acceptance, LLM-judged paper score, task
      completion, evidence-maturity score, or domain metric improvement are used as
      primary claims.'
    - 'Verification strategy differs: generic simulated review and LLM scoring versus
      task-specific formal proof checks or vision-language physics validation.'
    open_questions:
    - What training or architecture changes would move agents beyond competent analysis
      execution to controls, robustness, falsifiability, and cross-dataset generalization?
    - How reliable are vision-language physics gates and LLM reviewers at detecting
      silent failures or unsupported claims, and what external standard validates
      them?
    - Under what conditions do benchmark or reviewer scores align with real scientific
      breakthroughs, reproducibility, or domain utility?
    - How do current systems generalize across base models, hardware, datasets, and
      scientific domains when much evidence comes from single backbones or narrow
      tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研工作流（如 The AI Scientist、AI Scientist-v2）
      解决的问题: 自动完成创意生成、实验执行、可视化、分析和论文撰写，并用自动评审过滤低质量成果。
      尚未覆盖: 成功率较低，AI Scientist-v2 三篇中仅一篇通过同行评审；早期系统可能依赖代码模板，且不是都具备独立有效性门控。
    - 路线: 带验证门控的领域专属发现智能体（如 ReasFlow、AI CFD Scientist）
      解决的问题: 在数学或计算流体动力学循环中嵌入形式化或物理感知检查，以在人工检查前发现逻辑错误和静默物理失效。
      尚未覆盖: 验证仍不完整，CFD 视觉语言门控漏掉 16 个植入失效中的 2 个；结果主要在狭窄领域和指标上展示。
    - 路线: 面向智能体评估的虚拟发现环境（如 DISCOVERYWORLD）
      解决的问题: 通过完整发现循环中的受控任务，自动比较智能体的探索、实验设计和结论质量。
      尚未覆盖: 强基线智能体在多数任务上仍困难；任务完成度和发现性知识指标尚未与真实研究价值对齐。
    - 路线: 基于证据的科研发现基准（如 TruthInsightBench）
      解决的问题: 用同行研究构建盲评任务，评估智能体是否提供包含对照、稳健性、可证伪性和泛化性的证据。
      尚未覆盖: 当前编码智能体在单一冻结基座模型上仅得约 58-60 分，跨基座模型泛化性未经证实。
    共识:
    - 当前系统能执行并记录分析、生成代码或实验并产出类似论文的工件，但这不自动等于可信赖的科学发现。
    - 自动化评审或评测被视为扩展评估规模所必需，但其有效性仍是代理证据。
    - 通过领域专属验证门控和人类PI—智能体协作减少静默失败与专家干预。
    - 最有力的成果仍较狭窄：工作坊级论文、CFD RMSE 提升或任务得分，稳健的通用发现尚未解决。
    分歧:
    - 监督方式不同：有的追求全自主发现，有的把人类设为首席研究员、智能体设为研究生。
    - 评测目标不同：完整发现环境、来自同行研究的盲评证据任务、论文评审量规或领域物理/形式化指标。
    - 成功信号不同：同行评审接受、LLM论文评分、任务完成度、证据成熟度得分或领域指标改进被分别作为主证据。
    - 验证策略不同：通用模拟评审或LLM评分，与任务特定形式化证明检查或视觉语言物理验证。
    开放问题:
    - 何种训练或架构改进能推动智能体从熟练分析执行迈向对照、稳健性、可证伪性和跨数据集泛化？
    - 视觉语言物理门控和LLM评审器在检测静默失败或无证据主张时有多可靠，用什么外部标准验证？
    - 在什么条件下基准或评审分数与真实科学突破、可复现性或领域效用一致？
    - 在多基座模型、硬件、数据集和科学领域中，当前系统如何泛化？现有证据多来自单一骨干或狭窄任务。
