  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research writing systems
      what_it_solves: Converts research ideas into full workflows such as code, experiments,
        visualizations, and complete manuscripts without relying on human-authored
        templates.
      what_remains_open: Acceptance is inconsistent beyond workshop or LLM-review
        settings; several attempts fail during implementation or evaluation, leaving
        full conference-level reliability unresolved.
    - line: Domain-specific verifiable discovery and writing agents
      what_it_solves: Grounds manuscript generation in domain constraints by coupling
        retrieval, simulation, or verification with paper drafting, especially for
        applied mathematics and computational fluid dynamics.
      what_remains_open: Verification gates still miss some silent failures, and it
        is unclear whether the domain-specific checks generalize across other scientific
        fields.
    - line: Human-AI collaborative research workflows
      what_it_solves: Balances autonomous research with human oversight through structured
        intervention modes, reducing failures at high-leverage decision points.
      what_remains_open: The optimal amount and timing of human intervention is not
        established beyond the evaluated benchmarks and collaboration modes.
    - line: Self-correction and failure attribution in research writing
      what_it_solves: Diagnoses failed experiments and constrains reporting to measured
        values before manuscript drafting, improving the share of outputs with usable
        metrics.
      what_remains_open: Conference-ready scientific writing remains difficult; failure
        diagnosis may not fully cover conceptual reasoning, scientific taste, or domain
        intelligence gaps.
    - line: Automated review and evidence-based evaluation of generated research
      what_it_solves: Makes generated paper claims comparable through simulated review,
        benchmark scores, or domain error metrics.
      what_remains_open: LLM-based review rubrics and narrow benchmarks may not match
        human peer review or long-term research utility, and several evaluation details
        remain unspecified.
    consensus:
    - Current systems agree that manuscript generation must be coupled to executable
      experiments and verification rather than isolated text generation.
    - They adopt multi-agent pipelines that separate ideation, execution, reporting,
      and review to reduce single-agent failure.
    - Generated scientific claims require verification or grounded reporting because
      unimpeded generation can fabricate results or citations.
    disagreements:
    - 'Verification signals differ: internal logical audits, domain-specific physical
      or visual gates, and grounded reporting constrained to measured values.'
    - Human involvement ranges from full autonomy to targeted high-leverage collaboration
      or step-by-step oversight; some evidence suggests targeted collaboration outperforms
      exhaustive oversight.
    - 'Evaluation targets differ: LLM-based review scores, topic benchmarks such as
      ARC-Bench, and domain error such as wall Cf RMSE capture different notions of
      success.'
    - Scope differs from generic machine learning to constrained domains such as applied
      mathematics or computational fluid dynamics, changing what counts as valid evidence.
    open_questions:
    - Do LLM-based review scores or workshop acceptance adequately proxy scientific
      communication quality and longer-term research utility?
    - Can verification gates eliminate hallucinated citations and fabricated numbers
      across long-horizon research writing?
    - How should optimal human intervention be chosen across domains beyond ARC-Bench
      or CFD-style examples?
    - What is missing for consistently producing conference-ready manuscripts when
      only a fraction of attempts pass peer review?
    - Where limitations, external baselines, or datasets are unspecified in the packet,
      what additional evidence is needed to establish failure boundaries and reproducibility?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究写作系统
      解决的问题: 将研究想法转化为完整流程，包括代码、实验、可视化和完整论文，而不依赖人类编写模板。
      尚未覆盖: 在工作坊或LLM评审之外通过率不稳定；多次尝试在实现或评估阶段失败，完整会议级可靠性仍未解决。
    - 路线: 领域特定可验证发现与写作智能体
      解决的问题: 通过将检索、仿真或验证与论文起草耦合，把稿件生成锚定在领域约束中，尤其用于应用数学和计算流体动力学。
      尚未覆盖: 验证门控仍会遗漏部分静默失败，且这些领域特定检查是否可推广到其他科学领域仍不清楚。
    - 路线: 人机协作研究流程
      解决的问题: 通过结构化干预模式平衡自主研究与人类监督，降低高杠杆决策点的失败。
      尚未覆盖: 最佳人类干预数量和时机尚未在现有基准和协作模式之外得到确定。
    - 路线: 研究写作中的失败归因与自我纠正
      解决的问题: 在论文起草前诊断失败实验并将报告约束到实测值，提高含可用指标输出的比例。
      尚未覆盖: 面向会议的科研写作仍然困难；失败诊断可能未充分覆盖概念推理、科学品味或领域智能缺口。
    - 路线: 生成研究的自动评审与证据评估
      解决的问题: 通过模拟评审、基准分数或领域误差指标，使生成论文的主张具有可比性。
      尚未覆盖: 基于LLM的评审标准和窄基准可能无法匹配人类同行评审或长期研究效用，且若干评估细节仍未说明。
    共识:
    - 当前系统认为稿件生成必须与可执行实验和验证耦合，而不是孤立的文本生成。
    - 它们采用多智能体流水线，将构思、执行、报告和评审分工以降低单点失败。
    - 生成的科学声明需要验证或基于实证的报告，否则可能产生虚假结果或引用。
    分歧:
    - 验证信号不同：内部逻辑审计、领域特定物理或视觉门控、将报告约束到实测值。
    - 人类参与程度不同，从完全自主到精准高杠杆协作或逐步监督；部分证据表明精准协作优于过度监督。
    - 评测目标不同：LLM评审分数、ARC-Bench等主题基准以及壁面Cf RMSE等领域误差代表不同的成功定义。
    - 范围不同：从通用机器学习到应用数学或计算流体动力学等强约束领域，这改变了有效证据的判定。
    开放问题:
    - LLM评审分数或工作坊接收是否足以代理科研交流质量和长期研究效用？
    - 验证门控能否在长周期研究写作中消除幻觉引用和虚假数字？
    - 在ARC-Bench或CFD式示例之外，如何选择最佳人类干预方式？
    - 当只有部分尝试通过同行评审时，当前系统还缺什么才能稳定产出符合会议要求的论文？
    - 当证据包未明确说明局限性、外部基线或数据集时，还需要哪些证据来确定失败边界与可复现性？
