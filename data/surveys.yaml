  - 主流方向：构建基于LLM的智能体与知识层，用于文献检索、组织、生成和评测，重点关注证据溯源与引用质量。
  - 研究共性：多步LLM编排或多智能体工作流处理科学文献，并以引用F1、写作质量、专家一致性或综述相似度作为评估信号。
  - 关键差异：检索/知识层关注证据获取；生成工作流关注完整综述撰写；评测工作关注公平基准；更广义的AI科学家工作关注科学任务集成。
  - 趋势演进：证据从2024年的层级组织支持，到2025年的多智能体综述生成，再到2026年的检索层与评测认证；时间跨度窄，反映当前前沿。
