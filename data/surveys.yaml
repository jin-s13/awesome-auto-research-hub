    - 路线: 评估基准与证据设计
      解决的问题: 提供标准化任务、指标和基线来测量AI科学家的实验完成与知识发现能力，并建立人类基线进行对比。
      尚未覆盖: 现有基准覆盖的科学领域和难度层级有限；自动指标与真实科学突破价值之间的一致性尚未验证。
    - 路线: 领域专用验证与安全机制
      解决的问题: 通过内部逻辑审计、物理感知视觉检查或知识检索门控，确保AI生成结果的科学有效性，减少幻觉。
      尚未覆盖: 验证机制与领域知识深度耦合，难以跨领域迁移；即使专用门控也可能漏检静默失败（如CFD研究中漏检16个植入错误中的2个）。
    共识:
    - 几乎所有系统都采用基于LLM的多智能体或流水线架构，将研究分解为构思、实验、分析、写作等子任务。
    - 系统普遍意识到内部验证或评审机制的必要性，以提升生成结果的可靠性。
    - 所有工作都强调通过自动化降低科学研究的成本与时间，同时使研究过程可复现。
    分歧:
    - 人类监督程度不同：部分系统追求完全自主，而另一些刻意引入多层次人机协作，导致对‘自主’的定义产生差异。
    - 验证策略存在差异：有的依赖通用LLM评审器，有的部署领域专用模型（如视觉-语言物理门控），其可靠性与泛化性存在疑问。
    - 评估实践不一致：有的采用模拟评审或基准指标，有的则提交真实同行评审，缺乏统一的科学发现质量成功度量。
    - 应用范围使领域分化：部分系统面向通用机器学习子领域，其他聚焦数学、流体力学或生物学，在通用性与领域深度专业化之间形成张力。
    开放问题:
    - 如何设计能在陌生科学领域迁移的验证机制，以检测并纠正错误？
    - 自动评估指标在多大程度上能反映真实的科学突破价值，而非仅仅任务完成度？
    - 长期自主发现系统如何避免累积错误，并将新知识有效整合到人类知识库中？
    - 如何平衡人类专家干预与系统自主性，以最大化科学生产力？
