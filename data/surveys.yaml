        than exhaustive oversight, improving benchmark performance.
      what_remains_open: Which intervention points generalize and how much expert
        load remains is not established.
    - line: Self-correcting failure attribution
      what_it_solves: Attributes experiment failures to hypothesis, design, or implementation
        and routes corrections to the appropriate layer.
      what_remains_open: Conference-ready writing and long-horizon scientific reasoning
