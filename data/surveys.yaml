  - 趋势演进：从 2024 年的首个端到端框架与发现基准，演进到 2025–2026 年的智能体树搜索、工作坊级通过、失败记忆、交互式研究平台和专项消融基准。
  - 开放问题：LLM/模拟评审与人类科学价值是否一致；系统能否稳定通过评审并跨出内部或模拟任务；失败记忆、验证基础设施如何规模化与外部验证。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and experimentation agents
      what_it_solves: 'Automates the full experimental cycle: hypothesis or idea generation,
        code or experiment execution, result analysis, and manuscript authoring.'
      what_remains_open: Reliability and validity remain weak; evidence shows only
        one of three submitted papers passing peer review and workshop-level rather
        than full conference or lab-based validation.
    - line: Discovery and experiment-planning benchmarks
      what_it_solves: Creates standardized tasks and metrics for scientific discovery,
        experimental action selection, and ablation planning so agent capabilities
        can be compared.
      what_remains_open: Tasks are largely simulated or ML-specific, LLM judges remain
        below human level, and proxy metrics are not yet tied to real downstream scientific
        utility.
    - line: Failure-aware memory and iterative experiment planning
      what_it_solves: Converts failed attempts into bounded, reusable records so future
        agents can reject or adopt prior failed strategies, improving retry success
        and token efficiency.
      what_remains_open: Validation is limited to same-task and cross-task PDE examples
        plus ScienceAgentBench; failure-type boundaries and broader cross-domain generalization
        are unresolved.
    - line: Interactive multi-agent experimentation infrastructure
      what_it_solves: Provides customizable roles, real-time monitoring, artifact
        inspection, and rollback/resume controls that connect local code, data, and
        checkpoints to the research loop.
      what_remains_open: The evidence is early-stage and limited to five internal
        AI case studies, leaving external validation across hardware, data, and user
        settings unestablished.
    consensus:
    - Experimentation is framed as a closed loop from hypothesis or idea generation
      through execution, analysis, and reporting.
    - LLM-based or simulated evaluators are common but are anchored to human acceptance
      thresholds or expert judgment as a reference.
    - Strong language models still underperform humans on open-ended or planning-heavy
      scientific tasks, indicating headroom for specialized scaffolds.
    - Multi-agent decomposition, verification, and monitoring are used to improve
      logical coherence and experimental completeness.
    disagreements:
    - 'Evaluation target differs: some work scores manuscript quality or peer-review
      outcomes, while others measure task completion, relevant experimental actions,
      or ablation identification recall.'
    - 'Interaction mode differs: fully automatic pipelines contrast with human-in-the-loop
      platforms offering monitoring, rollback, and resume.'
    - 'Domain and representation differ: ML code experimentation, simulated text-based
      discovery, applied math manuscript generation, and PDE tasks use different execution
      and observation assumptions.'
    - 'Memory strategy differs: most systems treat generated experiments or papers
      as forward outputs, while one line explicitly maintains failure records to constrain
      future proposals.'
    open_questions:
    - Do LLM-based judges and simulated peer review align with human judgment and
      real scientific impact outside curated evaluation sets?
    - Can autonomous experiment agents become reliable enough to surpass current evidence
      limits such as one of three papers passing peer review or 45% ablation recall?
    - How should failure memory, verification, and monitoring scale from simulated
      or ML tasks to physical or lab-based experiments?
    - What reproducible infrastructure and external validation standards are needed
      to compare research agents across code, data, and hardware environments?
