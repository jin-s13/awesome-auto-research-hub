  related_work_outline:
  - 'Mainstream direction: The topic centers on building agents and benchmarks for
    autonomous scientific discovery, with stress on complete discovery cycles and
    evidence-grounded evaluation rather than isolated reasoning. Virtual environments,
    blind peer-reviewed data tasks, and constrained coding/wet-lab settings are used
    to expose execution, auditability, and safety gaps.'
  - 'Shared research pattern: Agents follow multi-stage workflows from question formation
    through experiment/analysis to reporting; evaluations use task completion, rubric-based
    LLM judging, or safety metrics, often with automated scoring and explicit claim-evidence
    coupling.'
  - 'Key differences: Works differ in evaluation target from task completion and evidence
    maturity to end-to-end code implementation and wet-lab execution; interaction
    settings, safety handling, and supervision via LLM judge versus domain expert
    also diverge.'
  - 'Trend evolution: In the available 2024-2026 evidence, the frontier moves from
    introducing discovery environments toward blind, evidence-grounded benchmarks
    and auditable/safety-aware workflows, while results still show agents plateauing
    below trustworthy discovery.'
  - 'Open questions: Whether proxy LLM judges align with expert scientific judgment;
    cross-domain/cross-base-model generalization; formal question formation and falsifiability;
    compositional safety; and validating synthetic constraints against real scientific
    practice.'
  related_work_outline_zh:
  - 主流方向：围绕自主科学发现智能体及其评测展开，强调完整发现循环和证据锚定评估，而非孤立推理。虚拟环境、盲审数据任务和受限编码/湿实验室设置被用于暴露执行、可审计性与安全缺口。
  - 研究共性：智能体多采用多阶段流程（问题形成、实验/分析、报告）；评测多使用任务完成、基于规则的LLM评判或安全指标，强调自动化评分和主张-证据关联。
  - 关键差异：评测目标（任务完成 vs 证据成熟度 vs 代码实现 vs 湿实验执行）、交互设置（模拟、编码、机器人）、安全处理（轨迹感知推理 vs 经验演化）和监督信号（LLM评判
    vs 领域专家）不同。
  - 趋势演进：在2024-2026现有证据中，前沿正从引入发现环境转向盲审证据锚定基准和可审计/安全意识工作流，但结果仍显示智能体在可信发现水平以下停滞。
  - 开放问题：LLM代理评判是否与专家科学判断一致；跨领域/跨基座模型泛化；正式问题形成与可证伪性；组合安全性；合成约束与真实科研实践的一致性。
  literature_review:
    line_of_work_matrix:
    - line: Evaluation and evidence design
      what_it_solves: Makes discovery-agent claims comparable through structured tasks,
        hidden-source blind data, constrained coding problems, rubrics, and automatic
        metrics that separate task completion from evidence quality.
      what_remains_open: Whether proxy judges and controlled benchmarks align with
        domain-expert utility, capture diverse scientific domains, and reflect real
        discovery rather than reproduction within synthetic constraints.
    - line: Agent execution, action-conditioned control, and safety
      what_it_solves: Connects multi-stage scientific reasoning to safe interventions
        and closed-loop execution via planning, trajectory-aware risk checks, and
        experience distillation.
      what_remains_open: How much safety or success improvement comes from the added
        control layer versus the base agent, and whether compositional risk detection
        generalizes across tool chains, domains, and base models.
    - line: Systems and reproducible infrastructure
      what_it_solves: Turns isolated model ideas into runnable artifacts such as vetted
        code libraries, benchmark scripts, and training-free memory over execution
        trajectories, improving repeatability and domain-specific action.
      what_remains_open: External validation across scientific domains, hardware settings,
        and agent stacks; several top papers provide incomplete baseline, limitation,
        or artifact evidence.
    - line: Conceptual structure and auditable reasoning
      what_it_solves: Organizes scientific question formation and claim making into
        explicit artifacts recording definitions, assumptions, mechanisms, falsifiable
        hypotheses, tests, and update rules.
      what_remains_open: Empirical validation that these structured categories improve
        downstream discovery behavior rather than only improving LLM-judge scores
        in preliminary evaluations.
    consensus:
    - Scientific discovery is framed as a multi-stage agentic loop from question formation
      through experimentation or analysis to reporting, rather than a single-step
      prediction task.
    - Automatic evaluation with rubrics, constrained tasks, or LLM judges is necessary
      to scale open-ended discovery assessment, but current proxy judgments remain
      imperfect.
    - Current agents can execute and document analyses somewhat competently, yet they
      lack discriminating scientific behaviors such as controls, robustness checks,
      falsifiability, and cross-setting generalization.
    - Reproducibility and safety infrastructure is treated as a first-order part of
      measuring progress, not as an add-on to model capability.
    disagreements:
    - 'Evaluation target differs: some benchmark general discovery task completion
      in synthetic worlds, others score evidentiary maturity on blind peer-reviewed
      data, and others evaluate end-to-end ML implementation under compute or internet
      constraints.'
    - 'Deployment and interaction settings differ: simulated text environments, autonomous
      coding agents, and robotic wet-lab execution create different action spaces,
      failure modes, and safety requirements.'
    - Safety is treated either as a trajectory-aware reasoning layer integrated into
      every stage, or as episodic experience evolution with safety gates; the relative
      contribution of safety mechanisms versus base agent capability is not disentangled.
    - 'Supervision differs: fixed LLM judges are used for deterministic scoring, while
      some evidence compares LLM judgments with domain experts and finds only moderate
      agreement, leaving human-expert validity unresolved.'
    open_questions:
    - Are LLM-based judges sufficiently aligned with domain-expert scientific judgment
      for measurable discovery claims, especially beyond the moderate agreement reported?
    - Can structured question-formation or certification mechanisms improve actual
      hypothesis novelty and falsifiability rather than only improving judge scores?
    - Do trajectory-aware safety and experience-evolution mechanisms generalize across
      base models, scientific domains, and compositional tool-chain risk?
    - How well do synthetic and resource-constrained benchmarks capture wet-lab or
      real-world discovery, given task-coverage, single-GPU, no-internet, and simulated-environment
      limitations?
    - Where are the missing verification details for baselines, limitations, and artifacts
      in several top papers, and how should they affect reproducibility claims?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 评测与证据设计
      解决的问题: 通过结构化任务、隐藏来源的盲数据、受限编码问题、评分项和自动指标，使科学发现智能体的主张可比较，并将任务完成与证据质量区分开。
      尚未覆盖: 代理评委和受控基准是否与领域专家效用一致，是否覆盖多样科学领域，以及能否反映真实发现而非合成约束内的复现。
    - 路线: 智能体执行、动作条件控制与安全
      解决的问题: 通过规划、轨迹感知风险检查和经验提炼，将多阶段科学推理连接到安全干预和闭环执行。
      尚未覆盖: 安全或成功提升有多少来自新增控制层而非基础智能体；组合风险检测能否跨工具链、领域和基座模型泛化。
    - 路线: 系统与可复现基础设施
      解决的问题: 把单点模型想法转化为可运行工件，如经验证的代码库、基准脚本和基于执行轨迹的免训练记忆，从而改善可重复性和领域特定行动。
      尚未覆盖: 跨科学领域、硬件设置和智能体栈的外部验证；部分重要论文的基线、局限或工件证据仍不完整。
    - 路线: 概念结构与可审计推理
      解决的问题: 将科学问题形成和主张构建组织为记录定义、假设、机制、可证伪假设、测试和更新规则的显式工件。
      尚未覆盖: 这些结构化类别能否改善下游发现行为，而不只是提升初步评估中的LLM评判分数。
    共识:
    - 科学发现被构建为从问题形成到实验/分析再到报告的多阶段智能体循环，而不是单步预测任务。
    - 采用带评分项、受限任务或LLM评判的自动评测是扩展开放式发现评估所必需的，但当前代理判断仍不完善。
    - 当前智能体能够较熟练地执行和记录分析，但普遍缺乏对照、稳健性、可证伪性和跨设置泛化等判别性科学行为。
    - 可复现性与安全基础设施被视为衡量进展的一等要素，而非模型能力的附加项。
    分歧:
    - 评测目标不同：有的在合成世界中评估通用发现任务完成度，有的在盲审同行评审数据上评估证据成熟度，有的在算力或网络受限条件下评估端到端机器学习实现。
    - 部署与交互设置不同：模拟文本环境、自主编码智能体和机器人湿实验执行形成不同的动作空间、失败模式和安全需求。
    - 安全处理方式不同：一种将其作为贯穿各阶段的轨迹感知推理层，另一种采用带安全门的片段经验演化；安全机制与基础智能体能力的贡献尚未分解。
    - 监督方式不同：固定LLM评判用于确定性评分，而部分证据将LLM评判与领域专家比较后仅发现中等一致性，人类专家效度仍未有定论。
    开放问题:
    - 基于LLM的评判是否与领域专家的科学判断足够一致，尤其是在报告的中等一致性之外？
    - 结构化问题形成或证书机制能否提升真实假设的新颖性和可证伪性，而不只是提升评委分数？
    - 轨迹感知安全和经验演化机制能否跨基座模型、科学领域和组合工具链风险泛化？
    - 合成或资源受限基准在多大程度上能反映湿实验或真实世界发现，尤其是存在任务覆盖、单GPU、无互联网和模拟环境限制时？
    - 若干重要论文在基线、局限和工件方面缺少验证细节，这些缺口如何影响可复现性主张？
