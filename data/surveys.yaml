  related_work_outline:
  - 'Mainstream direction: Multi-agent collaboration and iterative workflows dominate
    automated literature review generation, focusing on improving readability, citation
    accuracy, and factual consistency of the generated surveys.'
  - 'Shared research pattern: Large language models (LLMs) are used to orchestrate
    specialized modules (retrieval, planning, writing, reviewing) that mimic the human
    cognitive process of literature review writing.'
  - 'Key differences: Architectures vary between single-agent orchestration of the
    full retrieval-to-writing pipeline and multi-agent decomposition with dedicated
    roles; evaluation targets diverge between writing quality metrics and evidence
    retrieval precision (e.g., Citation F1).'
  - 'Trend evolution: Work evolved from LLM-assisted hierarchical organization of
    papers (2024) to multi-agent review generation systems (2025) and into knowledge
    layers that equip AI agents with evidence retrieval from live databases (2026),
    with a parallel emerging interest in the robustness assessment of automated reviewing.'
  - 'Open questions: How to guarantee long-tail factual accuracy of generated reviews
    without exhaustive human verification; how to achieve cross-domain generalization
    and real-time knowledge updates; and how to defend automated review systems against
    adversarial presentation-only attacks.'
  related_work_outline_zh:
  - 主流方向：多智能体协作与迭代工作流成为自动化文献综述生成的主流范式，重点提升综述的可读性、引用准确性和事实一致性。
  - 研究共性：利用大语言模型编排多个专用模块（检索、规划、写作、审阅），模拟人类撰写文献综述的认知过程。
  - 关键差异：架构上存在单智能体编排全流程与多智能体角色分工的区别；评测目标分化，一端侧重写作质量指标，另一端侧重证据检索精度（如Citation F1）。
  - 趋势演进：从2024年LLM辅助文献分层组织，到2025年多智能体综述生成系统，再到2026年为AI代理构建可实时检索文献证据的知识层，同时出现对自动化评审鲁棒性评估的并行探索。
  - 开放问题：如何在无详尽人工验证下保证生成综述的长尾事实准确性；如何实现跨领域泛化与实时知识更新；如何防御自动化评审系统免受仅修改呈现方式的对抗攻击。
  literature_review:
    line_of_work_matrix:
    - line: Multi-agent literature review generation systems
      what_it_solves: Automates the generation of structured, readable, and citation-accurate
        literature surveys by decomposing the task into planning, subsection writing,
        editing, and reviewing subtasks handled by specialized LLM agents.
      what_remains_open: Deep verification of factual accuracy of the generated claims,
        especially for long-tail content; generalization to non-English and non-CS
        domains; and comparison with long-term human expert preferences rather than
        single-round similarity metrics.
    - line: Literature knowledge layers and evidence retrieval for AI agents
      what_it_solves: Transforms existing literature databases into a queryable knowledge
        layer that enables AI agents to decompose natural language questions, execute
        live searches, and return referenced evidence, improving citation F1 and agreement
        with expert consensus in synthesis and verification tasks.
      what_remains_open: Current implementation is limited to specific databases like
        Europe PMC and the biomedical domain; cross-disciplinary coverage, real-time
        paper ingestion, and version-aware retrieval are not yet validated.
    - line: LLM-assisted hierarchical organization of scientific literature
      what_it_solves: Automatically organizes a corpus of scientific studies into
        a hierarchical topic structure, supporting researchers in navigating and scoping
        a literature review, thereby reducing the cognitive load of manual thematic
        clustering.
      what_remains_open: Empirical evidence that the LLM-generated hierarchy is superior
        to traditional clustering methods is missing; the ability to dynamically update
        the hierarchy and incorporate user interactive refinement has not been examined.
    - line: Robustness evaluation of automated peer review systems
      what_it_solves: Examines how LLM-based peer review can be manipulated by textual
        adversarial attacks or superficial presentation-only revisions, revealing
        vulnerabilities in the decision-making process of automated reviewers.
      what_remains_open: No defense strategies are proposed or evaluated; the evaluation
        is limited to a narrow set of review criteria and adversarial patterns; real-world
        deployment in conference settings with diverse reviewer models remains unexplored.
    consensus:
    - LLM-based agents can markedly improve the efficiency of literature processing
      compared to monolithic model outputs.
    - Decomposing the review generation or evidence retrieval task into multiple planned
      steps produces higher quality results than one-shot generation.
    - Automated review systems are vulnerable to surface-level features and adversarial
      modifications, indicating that current evaluation metrics may not capture true
      review quality.
    disagreements:
    - End-to-end review generation systems (such as LiRA) prioritize readability and
      overall writing quality, while evidence retrieval layers (such as EMBL AI Librarian)
      focus on precise citation accuracy and evidence grounding, leading to different
      architectural choices and evaluation metrics.
    - 'Approaches diverge in their interaction mode: some provide a complete survey
      draft for human consumption, whereas others serve as a retrieval tool that grounds
      downstream AI agents, implying different assumptions about the human-in-the-loop
      role.'
    - The goal of robustness evaluation in automated reviewing is not yet aligned
      with the generation-focused literature; one exposes brittleness of reviewers,
      while the other optimizes writer-side quality, leaving a gap in jointly optimizing
      robustness and generation quality.
    open_questions:
    - How can we reliably evaluate the factual accuracy of an automatically generated
      literature review without relying on limited human-written reference reviews?
    - What is the optimal unified architecture that can both generate a high-quality
      survey and serve as a verifiable evidence-retrieval engine for AI agents?
    - How can automated review systems be made robust against presentation-only and
      adversarial inputs while maintaining alignment with human expert judgments?
    - Since the evidence spans only 2024–2026, the long-term stability and cross-community
      adoption of these systems remain unknown.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多智能体文献综述生成系统
      解决的问题: 通过将任务分解为规划、子节写作、编辑和审阅等子任务，由专用LLM智能体协同完成，自动化生成结构清晰、可读性强且引用准确的文献综述。
      尚未覆盖: 对生成论断的事实准确性进行深度验证，尤其是长尾内容；在非英语、非计算机科学领域的泛化；以及与人类专家长期偏好相比，而非仅单轮相似度指标。
    - 路线: 文献知识层与面向AI代理的证据检索
      解决的问题: 将现有文献数据库转化为可查询的知识层，使AI代理能够分解自然语言问题、执行实时搜索并返回带引用的证据，在综合与验证任务中提升Citation
        F1和与专家共识的一致性。
      尚未覆盖: 当前仅针对Europe PMC等生物医学领域；跨学科覆盖、实时论文更新和版本感知检索尚未验证。
    - 路线: LLM辅助的科学文献分层组织
      解决的问题: 自动将大量科学文献组织成层次化主题结构，辅助研究人员快速浏览和界定综述范围，降低人工主题聚类的认知负担。
      尚未覆盖: 缺少LLM生成的层次结构优于传统聚类方法的实证证据；未探讨层次结构的动态更新能力及用户交互式调整。
    - 路线: 自动化同行评审的鲁棒性评估
      解决的问题: 考察基于LLM的同行评审如何被文本对抗攻击或仅修改呈现方式的修订所操控，揭示自动化评审决策中的脆弱性。
      尚未覆盖: 未提出或评估任何防御策略；评估局限于有限的评审标准和对抗模式；未在真实会议场景下部署和多评审模型测试。
    共识:
    - 基于LLM的代理能显著提升文献处理效率，优于单一模型直接输出。
    - 将综述生成或证据检索任务分解为多个规划步骤，产出质量高于一次性生成。
    - 自动化评审系统易受表面特征和对抗修改的影响，表明当前评测指标可能无法反映真实评审质量。
    分歧:
    - 端到端综述生成系统（如LiRA）优先考虑可读性和整体写作质量，而证据检索层（如EMBL AI Librarian）侧重精确引用准确性和证据支撑，导致架构选择和评测指标分化。
    - 交互模式存在差异：一些工作提供完整综述草稿供人类使用，另一些则作为下游AI代理的检索工具，隐含了对人机协同角色的不同假设。
    - 自动化评审的鲁棒性评估目标与以生成为中心的文献尚未对齐；前者暴露评审者的脆弱性，后者优化写作者侧的质量，留下联合优化鲁棒性与生成质量的空白。
    开放问题:
    - 如何在不依赖有限人工综述参考的情况下，可靠评估自动生成综述的事实准确性？
    - 既能生成高质量综述，又能作为可验证证据检索引擎的统一代理架构是什么？
    - 如何使自动化评审系统对仅修改呈现方式和对抗性输入具有鲁棒性，同时保持与人类专家判断的一致性？
    - 证据仅涵盖2024-2026年，这些系统的长期稳定性和跨社区采纳情况尚不可知。
