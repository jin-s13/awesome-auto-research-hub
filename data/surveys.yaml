  related_work_outline:
  - 'Mainstream direction: The dominant direction is building autonomous or semi-autonomous
    research agents that propose hypotheses, execute experiments, verify outputs,
    and generate reports, with recent systems adding self-correction and human-in-the-loop
    oversight.'
  - 'Shared research pattern: Systems decompose scientific discovery into hypothesis
    generation, experiment/code execution, validation or failure detection, and reporting;
    many evaluate against reference autonomous research baselines.'
  - 'Key differences: They differ in verification mechanism (visual physics gates,
    formal proof, result grounding, failure attribution), autonomy level, human interaction,
    and evaluation target (domain-specific discovery vs broad multi-domain benchmarks
    vs expert preference).'
  - 'Trend evolution: The evidence moves from 2025 surveys and benchmarks toward 2026
    self-correcting, self-evolving, and formally grounded agents, with increasing
    emphasis on reliability, verifiability, and cross-domain scaling.'
  - 'Open questions: Remaining gaps include external validity, semantic faithfulness
    of formal verification, optimal human oversight, and whether benchmark gains reflect
    genuine scientific discovery.'
  related_work_outline_zh:
  - 主流方向：构建自主或半自主科研智能体，提出假设、执行实验、验证输出并生成报告；近期系统加入自我纠正与人机协作。
  - 研究共性：将科学发现分解为假设生成、实验/代码执行、验证或失败检测和报告；评估常与参考自主科研基线对比。
  - 关键差异：验证机制不同（视觉物理门控、形式证明、结果事实约束、失败归因），自主程度、人机交互与评测目标也不同。
  - 趋势演进：证据从2025年的综述与基准走向2026年的自纠正、自演化和形式化智能体，更强调可靠性、可验证性与跨领域扩展。
  - 开放问题：外部有效性、形式验证与科学主张的语义一致性、最优人机监督，以及基准提升是否代表真实科学发现能力。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous experiment generation and self-correction
      what_it_solves: Transforms hypotheses into runnable experiments and improves
        outcomes by attributing failures to hypothesis, experimental design, or implementation.
      what_remains_open: Verification gates still miss silent failures; domain-specific
        validity outside the training simulator or data distribution is not established.
    - line: Formally grounded theory generation
      what_it_solves: Produces machine-checked theoretical artifacts for causal inference
        and reduces proof errors through formal verification.
      what_remains_open: Formal proofs do not guarantee faithful capture of intended
        scientific claims; human inspection of artifacts remains required.
    - line: Human-AI collaborative research pipelines
      what_it_solves: Allocates human intervention to high-leverage decision points
        instead of requiring full autonomy or exhaustive step-by-step oversight.
      what_remains_open: Optimal interaction modes and cross-discipline generalization
        remain unknown; evidence comes from limited case studies.
    - line: Benchmarking and evidence design for AI scientists
      what_it_solves: Provides comparable tasks and human or baseline references on
        real biological data and multi-domain experiment benchmarks.
      what_remains_open: Proxy metrics may not reflect genuine discovery utility;
        domain coverage is narrow and generalization or contamination is uncertain.
    - line: Platform and infrastructure for research agents
      what_it_solves: Turns agent pipelines into runnable monitored systems with code
        harnesses, artifact inspection, and rollback or resume control.
      what_remains_open: Platform maturity and external validation across hardware,
        datasets, and user settings are limited.
    consensus:
    - Autonomous scientific discovery systems commonly decompose work into hypothesis
      generation, experiment execution, validation or failure detection, and reporting.
    - 'Reliability is treated as a core concern: multiple systems add explicit verification,
      grounding, or proof-checking because end-to-end generation alone can produce
      unsupported claims.'
    - Human oversight remains valuable, especially at targeted intervention points,
      rather than being entirely removed or applied at every step.
    - Evaluation centers on benchmark scores, artifact quality, and comparison with
      a reference autonomous research baseline.
    disagreements:
    - 'Verification signal differs: some rely on visual physics inspection of rendered
      outputs, others on formal proof assistants, executable result grounding, or
      evidence-grounded failure attribution.'
    - 'Desired autonomy differs: open-ended autonomous search versus selective human
      collaboration versus human-reviewed formal artifacts.'
    - 'Evaluation target differs: domain-specific CFD or omics discovery tasks versus
      broad multi-domain science benchmarks versus internal expert preference judgments.'
    - 'Failure correction granularity differs: some route to hypothesis, experimental
      design, or implementation level, while others apply global reflection or self-evolution.'
    open_questions:
    - How can autonomous discovery systems establish external validity beyond their
      training simulators, datasets, or formal assumptions?
    - Which verification mechanism best catches silent scientific failures without
      blocking valid but unusual results?
    - What amount and timing of human interaction maximize novelty and reliability
      without requiring exhaustive oversight?
    - Do current benchmark scores predict meaningful scientific discovery or only
      improvements in coding, execution, and report formatting?
    - How can formally machine-checked claims be audited for semantic alignment with
      the intended non-formal scientific contribution?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主实验生成与自我纠正
      解决的问题: 将假设转化为可执行实验，并通过将失败归因到假设、实验设计或实现层来改善结果。
      尚未覆盖: 验证门控仍会漏报静默失败；训练仿真器或数据分布之外的领域有效性尚未建立。
    - 路线: 形式化理论生成
      解决的问题: 在因果推断中生成经机器检查的理论产物，通过形式验证降低证明错误。
      尚未覆盖: 形式证明不保证忠实捕获科学主张；最终产物仍需人工检查。
    - 路线: 人机协作科研流水线
      解决的问题: 将人工干预集中在高杠杆决策点，而非要求完全自主或逐步监督。
      尚未覆盖: 最优交互模式与跨学科泛化仍未知；证据来自有限案例研究。
    - 路线: 面向AI科学家的基准与证据设计
      解决的问题: 在真实生物数据和多领域实验任务上提供可比较任务以及人类或基线参照。
      尚未覆盖: 代理指标未必反映真实发现效用；领域覆盖较窄，泛化与污染问题也不确定。
    - 路线: 研究智能体平台与基础设施
      解决的问题: 将智能体流水线转化为可运行、可监控系统，提供代码工具、工件检查与回滚/恢复控制。
      尚未覆盖: 平台成熟度以及跨硬件、数据集和用户设置的外部验证仍有限。
    共识:
    - 自主科学发现系统通常将工作分解为假设生成、实验执行、验证或失败检测和报告。
    - 可靠性被视作核心问题：多个系统加入显式验证、事实约束或证明检查，因为端到端生成会产生无支撑主张。
    - 人类监督仍有用，尤其是在关键决策点干预，而非完全移除或逐步监督。
    - 评估集中于基准分数、工件质量以及与参考自主科研基线的对比。
    分歧:
    - 验证信号不同：有的依赖渲染流场的视觉物理检查，有的依赖形式证明助手、可执行结果约束或基于证据的失败归因。
    - 自主程度不同：开放式自主搜索、选择性人机协作或人工审查的形式化产物。
    - 评测目标不同：特定领域的CFD或组学发现任务、广泛多领域基准或内部专家偏好判断。
    - 失败纠正粒度不同：有的路由到假设、实验设计或实现层，有的采用全局反思或自我演化。
    开放问题:
    - 自主发现系统如何在训练仿真器、数据集或形式假设之外建立外部有效性？
    - 哪种验证机制能在不阻塞合理但异常结果的情况下最好地捕捉静默科学失败？
    - 多少和何时的人类交互最能提升新颖性与可靠性，同时避免逐步监督？
    - 当前基准分数能否预测有意义的科学发现，还是只反映编码、执行和报告质量的提升？
    - 如何审计机器验证的形式化声明与预期非形式科学贡献之间的语义一致性？
