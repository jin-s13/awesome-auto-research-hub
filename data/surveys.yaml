    开放问题:
    - 自动评判器和量表得分能否在不同领域和难度下与人类科学判断保持一致？
    - 可靠性门控能否扩展到已展示案例之外，因为物理门控漏检了静默失败，而其他系统缺少可见局限性或跨基座模型证据？
    - 开放端智能体需要何种治理边界，才能防止看似合理但缺乏对照或不够稳健的发现在自动化流程中被接受？
