  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agents
      what_it_solves: Covering the full research loop from idea generation and code
        execution to manuscript drafting and review simulation.
      what_remains_open: Claim validity is inconsistent; generation succeeds more
        reliably than defensible scientific inference or domain-specific correctness.
    - line: Evaluation environments for discovery tasks
      what_it_solves: Providing standardized task suites and automatic metrics to
        compare agents across multiple scientific topics or datasets.
      what_remains_open: Task completion and proxy metrics have not been shown to
        correspond to trustworthy, generalizable scientific findings.
    - line: Evidence-grounded evaluation rubrics
      what_it_solves: Assessing whether data support the claims an agent makes, using
        blind tasks and evidentiary maturity scores rather than reproduction alone.
      what_remains_open: Findings are based on one frozen base model and show weak
        discrimination among agents, leaving cross-model validity open.
    - line: Domain-specific verification gates
      what_it_solves: Detecting silent failures and grounding acceptance or rejection
        in physical or task-specific validity before results are used or written up.
      what_remains_open: Verification gates can still miss planted failures and have
        not been generalized across domains.
    - line: Reproducible multi-agent research infrastructure
      what_it_solves: Turning isolated research actions into runnable code harnesses,
        monitored workflows, and inspectable artifacts.
      what_remains_open: External validation beyond internal case studies is missing;
        preference judgments do not establish evidence quality or scientific soundness.
    consensus:
    - Automated research systems are evaluated through full discovery cycles or end-to-end
      generated artifacts rather than isolated prediction metrics.
    - Explicit validation and review mechanisms are considered necessary, but current
      systems only partially detect invalid or unsupported claims.
    - Reproducibility is operationalized through code, frozen data, and runnable workflows,
      while missing artifacts or external checks are treated as gaps.
    - Current evidence shows agents can execute and document analyses but still lack
      controls, robustness, falsifiability, and cross-domain generalization.
    disagreements:
    - 'Evaluation standard differs: task completion and expert preference compare
      outputs, whereas blind evidence-maturity scoring asks whether data support the
      claim, and domain verification asks whether results satisfy physical validity.'
    - 'Deployment setting differs: some systems operate on general machine-learning
      subdomains, while others target a single physical simulation domain or omics
      data.'
    - 'Interaction mode differs: fully autonomous generation with simulated review
      contrasts with interactive multi-agent teams that expose monitoring, rollback,
      and user control.'
    - 'Supervision signal differs: human-authored code templates are removed in later
      systems, but reliance on fixed LLM judges, domain-specific checks, or human
      baselines varies across studies.'
    open_questions:
    - Do automated score improvements on discovery tasks or evidence rubrics predict
      real-world scientific utility or downstream decision quality?
    - How generalizable are verification gates and evidence-maturity findings outside
      the specific physical domain or the single frozen base model used?
    - What external validation is required to establish that multi-agent infrastructure
      improves validity rather than just workflow presentation?
    - What minimal controls, robustness checks, and falsifiability conditions should
      be required before an automated discovery claim is considered trustworthy?
  literature_review_zh:
    研究路线矩阵:
