  related_work_outline:
  - 'Mainstream direction: closed-loop autonomous research agents that generate hypotheses,
    run experiments, verify outputs, and report results, with recent systems adding
    self-correction, formal or physics-based verification, and human-in-the-loop controls.'
  - 'Shared research pattern: idea generation is treated as one stage in an executable
    research workflow; LLM backbones drive reasoning and writing, while gates, audits,
    or reporting constraints aim to reduce hallucinations and failed experiments.'
  - 'Key differences: verification substrate, domain focus, supervision mode, and
    evaluation target differ across visual physics checks, formal proofs, measured-value
    reporting, CFD, omics, causal inference, ML case studies, autonomy, and human-in-the-loop
    platforms.'
  - 'Trend evolution: evidence concentrates in 2025-2026, moving from surveys and
    benchmark construction toward self-evolving, failure-attributing, and interactive
    multi-agent research platforms; 2023-2024 evidence is too sparse to assess earlier
    trends.'
  - 'Open questions: whether current verification catches enough silent failures,
    whether benchmarks predict real discovery utility, and how formal or domain-specific
    checks generalize remain unresolved.'
  related_work_outline_zh:
  - 主流方向：闭环自主研究智能体，生成假设、执行实验、验证输出并报告结果；近期工作进一步加入自我纠正、形式或物理验证以及人机闭环控制。
  - 研究共性：论文把创意生成作为可执行研究流程的一个阶段，用LLM骨干进行推理与写作，并通过门控、审计或报告约束来减少幻觉和失败实验。
  - 关键差异：验证基座、领域关注、监督模式和评测目标不同，涵盖视觉物理检查、形式证明、基于测量值的报告，以及CFD、组学、因果推断、机器学习案例和不同人机交互模式。
  - 趋势演进：证据集中在2025-2026年，从综述与基准构建走向自我演化、失败归因和交互式多智能体研究平台；现有证据不足以判断2023-2024年的更早趋势。
  - 开放问题：当前验证是否能捕获足够多静默失败、基准是否预测真实发现效用，以及形式或领域专用检查能否跨域泛化仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous research-loop agents
      what_it_solves: Generate hypotheses and execute domain experiments through LLM-driven
        multi-agent workflows, moving from ideation to runnable artifacts and reports.
      what_remains_open: Reliability is not assured; silent failures can persist,
        and many evaluations use narrow domain tasks or internal case studies, so
        generalizable discovery ability remains unproven.
    - line: Self-correction and failure-attribution mechanisms
      what_it_solves: Convert failed experimental runs into targeted hypothesis, design,
        or implementation revisions by attributing root causes and constraining outputs
        to measured evidence.
      what_remains_open: Error detection is incomplete; a reported vision gate missed
        2 of 16 planted failures, formalization may not fully capture intended scientific
        claims, and autonomous writing is still weak.
    - line: Benchmarks and evaluation for AI scientists
      what_it_solves: Provide comparable tasks, datasets, metrics, and human baselines
        for discovery-oriented or experiment-stage research claims.
      what_remains_open: Tasks are domain-specific or small-scale, and the relation
        between benchmark success and real scientific discovery utility is not established.
    - line: Human-AI collaborative research platforms
      what_it_solves: Support customizable roles, real-time monitoring, artifact inspection,
        rollback/resume, and selective human intervention in autonomous research.
      what_remains_open: Optimal intervention and interaction modes are only partly
        studied, with limited case-study evaluations.
    - line: Formal proof-grounded theoretical ideation
      what_it_solves: Generate, formalize, and machine-check causal inference results
        using a Lean library and statement audit to separate proof correctness from
        claim alignment.
      what_remains_open: Machine-checked proofs guarantee correctness only under formal
        assumptions; faithfulness to intended claims still relies on human review
        and lacks reported quantitative metrics.
    - line: Survey and taxonomy of agentic scientific discovery
      what_it_solves: Organize capabilities, evaluation metrics, frameworks, datasets,
        and challenges across chemistry, biology, and materials science.
      what_remains_open: Taxonomy lacks direct empirical validation that categories
        predict behavior; system reliability and ethical concerns are unresolved.
    consensus:
    - Hypothesis generation is embedded in an end-to-end research loop that includes
      execution, verification, and reporting rather than being evaluated as an isolated
      ideation step.
    - LLM-based researchers require explicit verification, audit, or reporting constraints
      before generated results are treated as defensible.
    - Selective human collaboration at high-leverage decision points is beneficial,
      while exhaustive oversight is not required.
    - Evaluation is moving toward experiment-stage benchmarks, domain-specific discovery
      tasks, and artifact quality rather than only question answering.
    disagreements:
    - 'Verification substrate varies: visual inspection of rendered physical fields,
      machine-checked formal proofs, or constraints that restrict reporting to measured
      values.'
    - Supervision mode varies from fully autonomous loops to configurable human-in-the-loop
      intervention; some treat human input as an ablation factor, others as a platform
      feature.
    - 'Primary evaluation target varies: domain accuracy gains, benchmark success
      and artifact scores, or judge preference for novelty, completeness, and presentation.'
    - Domain focus varies across CFD, single-cell omics, causal inference, and general
      ML/AI case studies; domain-specific validity gates may not transfer.
    open_questions:
    - Can verification gates detect enough silent failures for unattended experimentation,
      given observed missed planted failures?
    - Do current AI scientist benchmarks correlate with real scientific discovery
      quality across domains?
    - How can formal proof correctness be aligned with intended informal scientific
      claims beyond statement audits?
    - What minimal human intervention pattern preserves reliability without exhaustive
      oversight?
    - Do domain-agnostic self-evolving frameworks generalize beyond reported benchmarks
      and case studies?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主研究闭环智能体
      解决的问题: 通过LLM驱动的多智能体工作流生成假设并执行领域实验，从创意推进到可运行工件和报告。
      尚未覆盖: 可靠性尚未保证；静默失败可能持续存在，许多评估仅使用狭窄领域任务或内部案例，跨领域发现能力仍未被证实。
    - 路线: 自我纠正与失败归因机制
      解决的问题: 将实验失败归因到假设、设计或实现层面并路由干预，同时把输出约束到已测量证据。
      尚未覆盖: 错误检测仍不完整；有报告显示视觉门控漏检16个植入失败中的2个，形式化可能无法完全捕获预期科学主张，自主写作仍较弱。
    - 路线: AI科学家基准与评测
      解决的问题: 为发现导向或实验阶段研究提供可比较的任务、数据集、指标与人类基线。
      尚未覆盖: 任务领域特定或规模较小，基准成功与真实科学发现效用之间的一致性尚未建立。
    - 路线: 人机协作研究平台
      解决的问题: 支持可定制角色、实时监控、工件检查、回滚/恢复与选择性人工干预。
      尚未覆盖: 最优干预和交互模式研究有限，案例评估范围较小。
    - 路线: 形式化证明驱动的理论构思
      解决的问题: 使用Lean库生成、形式化并机械验证因果推断结果，并通过陈述审计区分证明正确性与主张一致性。
      尚未覆盖: 机器验证仅在形式假设下保证正确性；对预期科学主张的忠实性仍依赖人工审查，且未报告量化指标。
    - 路线: 智能体科学发现综述与分类
      解决的问题: 跨化学、生物学和材料科学整理能力、评测指标、框架、数据集与挑战。
      尚未覆盖: 分类能否预测行为缺少直接实证验证；系统可靠性和伦理问题仍未解决。
    共识:
    - 假设生成被嵌入包含执行、验证和报告的端到端研究闭环，而非作为孤立创意步骤评估。
    - 基于LLM的研究者在生成结果被视为可信之前，需要显式验证、审计或报告约束。
    - 在高杠杆决策点进行选择性人机协作被认为有益，无需逐步穷尽监督。
    - 评测正转向实验阶段基准、领域发现任务和工件质量，而非仅限于问答。
    分歧:
