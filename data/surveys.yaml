  - 趋势演进：从 2024 年的端到端机器学习发现框架与发现基准，到 2025 年基于智能体树搜索并通过同行评审的工作坊论文，再到 2026 年领域感知物理智能体和证据锚定评测；重点从生成流畅性转向可辩护性。
