  related_work_outline_zh:
  - 主流方向：以LLM为核心的端到端智能体自动化发现循环，涵盖假设或想法生成、代码执行、实验分析、论文撰写与评审，并逐渐引入智能体树搜索和多智能体编排。
  - 研究共性：把研究工作流拆解为智能体步骤或角色，接入执行和反馈循环，并以自动评审、评分标准或任务完成度作为改进信号。
