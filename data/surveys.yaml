  related_work_outline:
  - 'Mainstream direction: autonomous multi-agent workflows for literature synthesis,
    reasoning, verification, and paper generation, evaluated increasingly through
    blind evidence-grounded discovery tasks.'
  - 'Shared research pattern: decompose scientific or literature work into agent stages,
    add retrieval or knowledge modules, then score outputs with either LLM rubrics
    or human-anchored baselines.'
  - 'Key differences: some systems target manuscript-level generation under expert
    supervision, while others evaluate minimally supervised coding agents or propose
    domain-agnostic self-evolving frameworks.'
  - 'Trend evolution: within the 2023-2026 frontier, work is moving from single-domain
    assistants toward domain-agnostic frameworks and from reproduction-style evaluation
    toward blinded evidence-maturity evaluation.'
  - 'Open questions: whether LLM judge scores track real scientific validity, how
    to obtain controls, robustness, and falsifiability, and how to validate literature
    search, citation analysis, and gap discovery beyond benchmarks.'
  related_work_outline_zh:
  - 主流方向：构建自主多智能体工作流，用于文献综合、推理、验证与论文生成，并越来越多地通过盲式、证据锚定的发现任务进行评估。
  - 研究共性：将科研或文献工作分解为智能体阶段，加入检索或知识模块，再用 LLM 评审标准或人类锚定基线对输出评分。
  - 关键差异：有的系统在专家监督下生成完整论文，有的评估最少人工干预的编码智能体，还有的提供领域无关的自演化框架。
  - 趋势演进：在2023-2026前沿期内，研究正从单一领域助手转向领域无关框架，从复现式评估转向盲式证据成熟度评估。
  - 开放问题：LLM 评审分数是否对应真实科学有效性，如何获得对照、稳健性与可证伪性，以及如何在基准之外验证文献搜索、引文分析与研究缺口发现。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous literature-to-paper workflows with verification
      what_it_solves: Combines literature synthesis, formal reasoning, verification,
        and manuscript generation into a multi-agent human-led workflow.
      what_remains_open: Evidence is missing that LLM rubric scores or generated papers
        correspond to external human acceptance, reproducibility, or citation impact.
    - line: Evidence-grounded benchmarks for discovery agents
      what_it_solves: Compares agents on blind peer-reviewed tasks using frozen data
        and automated judges to score how well claims are supported by evidence.
      what_remains_open: Published results rely on narrow base-model coverage and
        report plateau or no reliable pairwise separation; controls, robustness, and
        cross-dataset transfer remain weak.
    - line: Workflow decomposition and failure diagnostics
      what_it_solves: Maps scientific workflow stages to agent roles and catalogs
        recurring failure modes such as implementation drift, memory degradation,
        and weak scientific taste.
      what_remains_open: Derived design principles are not yet shown to fix the documented
        failures, and literature review automation plus system reliability are explicitly
        unresolved.
    - line: Domain-agnostic self-evolving agent frameworks
      what_it_solves: Provides reusable infrastructure for hypothesis refinement,
        self-critique, and cross-discipline knowledge accumulation, reporting strong
        benchmark results.
      what_remains_open: The evidence lacks limitation details and external validation
        on literature-intensive tasks, so benchmark gains may not transfer to real
        synthesis and gap discovery.
    consensus:
    - Current systems can execute parts of literature search, synthesis, analysis,
      and scientific writing, but they are not yet trustworthy autonomous scientists
      or reviewers.
    - Blind, evidence-grounded evaluation is being used to prevent reproduction of
      known conclusions and to score whether claims are supported by data.
    - Human expert baselines or human review remain important reference points for
      judging agent outputs.
    - Literature review automation is treated as an open challenge with unresolved
      reliability and ethical concerns rather than a solved capability.
    disagreements:
    - 'Evaluation target differs: manuscript quality via LLM rubric versus evidence
      maturity from frozen data versus domain-specific multiple-choice questions versus
      broad benchmark scores.'
    - 'Interaction mode differs: expert-led PI/graduate-student collaboration versus
      fully autonomous coding agents versus self-evolving reusable agent frameworks.'
    - 'Domain specificity differs: applied mathematics reasoning, single-cell biology,
      and broad domain-agnostic science create different task assumptions and evaluation
      settings.'
    - 'Claim direction differs: some evidence reports state-of-the-art benchmark performance,
      while other evidence reports plateau, no reliable pairwise separation, and recurring
      failure modes.'
    open_questions:
    - Do LLM rubric or judge scores track human scientific validity, reproducibility,
      and downstream literature utility?
    - Can agents convert evidence auditability into the missing controls, robustness,
      falsifiability, and cross-dataset generalization needed for reliable claims?
    - How well do domain-agnostic frameworks transfer to literature search, citation
      analysis, survey synthesis, and research gap discovery?
    - What external validation and limitation reporting are needed to separate reasoning
      ability from benchmark overfitting?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带验证的自动文献到论文工作流
      解决的问题: 把文献综合、形式推理、验证和论文生成整合进多智能体、由人主导的工作流。
      尚未覆盖: 缺少证据表明 LLM 评审分数或生成论文与外部人类接受度、可复现性或引用影响一致。
    - 路线: 面向发现智能体的证据锚定基准
      解决的问题: 以盲式同行评审任务和冻结数据比较智能体，自动评判其主张是否由证据支撑。
      尚未覆盖: 已报告结果依赖较窄的基座模型覆盖，并出现平台期或无可靠两两差异；对照、稳健性与跨数据集迁移仍弱。
    - 路线: 工作流分解与失败诊断
      解决的问题: 把科学工作流阶段映射到智能体角色，并归纳实现漂移、记忆退化和科学品味弱等重复失败模式。
      尚未覆盖: 所提炼的设计原则尚未证明能修复已记录的失败；文献综述自动化和系统可靠性仍被明确列为未解决。
    - 路线: 领域无关的自演化智能体框架
      解决的问题: 提供可复用的基础设施，用于假设细化、自我批判和跨学科知识积累，并报告较强基准成绩。
      尚未覆盖: 证据缺少局限说明和文献密集任务上的外部验证，基准提升未必能迁移到真实综合与研究缺口发现。
    共识:
    - 当前系统能执行部分文献搜索、综合、分析和科研写作，但还不是可信赖的自主科学家或评审者。
    - 盲式、证据锚定的评估正被用来避免复现已知结论，并判断主张是否由数据支撑。
    - 人类专家基线或人工评审仍是判断智能体输出的重要参照。
    - 文献综述自动化仍被视为开放挑战，可靠性和伦理问题未解决，而非已具备的能力。
    分歧:
    - 评测目标不同：LLM 标准下的论文质量、冻结数据上的证据成熟度、领域选择题或宽泛基准分数并存。
    - 交互模式不同：专家主导的 PI/研究生式协作、完全自主编码智能体、自演化可复用框架各有取向。
    - 领域侧重不同：应用数学推理、单细胞生物学和宽泛领域无关科学带来不同任务假设与评估设置。
    - 结论取向不同：部分证据报告最先进基准性能，另一些则报告平台期、无可靠两两差异和重复失败模式。
    开放问题:
    - LLM 评审或裁判分数是否与人类科学有效性、可复现性和下游文献效用一致？
    - 智能体能否把证据可审计性转化为可靠主张所需的对照、稳健性、可证伪性和跨数据集泛化？
    - 领域无关框架在文献搜索、引文分析、综述综合和研究缺口发现上的迁移效果如何？
    - 需要哪些外部验证与局限报告，才能区分真实推理能力与基准过拟合？
