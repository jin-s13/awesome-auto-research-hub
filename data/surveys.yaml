    - line: Closed-loop feedback and surrogate repair
      what_it_solves: Reducing expensive high-fidelity or oracle evaluations while
        preserving decision quality through sparse surrogate updates, acquisition
        rules, or targeted pilot experiments.
      what_remains_open: Fixed surrogate errors and task-specific acquisition may
        not transfer; reported gains are tied to the evaluated synthetic and MADE
        benchmarks.
    - line: Skill and experience distillation and reuse
      what_it_solves: Capturing operational know-how from repositories and prior experimental
        trajectories as reusable verified skills or experience libraries for new research
        tasks.
      what_remains_open: Skill verification breadth, staleness risk, and dependence
        on existing benchmark suites remain unresolved.
    - line: Domain-specific method rewriting and discovery
      what_it_solves: Producing validated modeling, representation, or optimizer changes
        under admission gates and held-out data in materials and molecular domains.
      what_remains_open: Evidence covers limited endpoints; one selected change was
        not robust on holdout, and external data screening added little for composition
        tasks.
    - line: Recursive verification and self-improvement
      what_it_solves: Alternating evidence gathering with retrospective auditing and
        targeted follow-up to improve deep research answers while compressing context.
      what_remains_open: Generalization, benchmark contamination, and missing limitation
        or artifact details leave training and evaluation boundaries unverified.
    - line: Evaluation and predictive-credit design
      what_it_solves: Making research-agent contributions comparable through benchmarks
        and paired forecasts, especially measuring whether explanations add predictive
        value beyond descriptions.
      what_remains_open: Proxy metrics may not align with real utility; several preregistered
        predictive-credit checks were inconclusive or unmet.
    consensus:
    - Research is modeled as a closed loop requiring separate search, execution, feedback,
      and verification components rather than one open-ended generation.
    - Resource efficiency is treated as a first-class outcome alongside task performance,
      using tokens, oracle queries, force calls, or interaction overhead under fixed
      budgets.
    - Held-out or untouched evaluation is increasingly used to probe whether selected
      changes generalize beyond development loops.
    - Unbounded history replay, duplicated work, premature stopping, and sparse-reward
      credit assignment are recognized as core failure modes for research agents.
    disagreements:
    - 'Where durable research state lives: harness-owned state, compressed agent-managed
      context, experience libraries, or skill libraries.'
    - 'How high-fidelity feedback is allocated: every episode, sparse surrogate repair
      via acquisition rules, targeted pilot experiments, or only when stored experience
      is insufficient.'
    - 'What the agent is allowed to modify or optimize: modeling/feature/representation
      changes, optimizer code, operational skills, or answer evidence and audit state.'
    - 'How work is evaluated: benchmark scores on MLE-bench, PaperBench, FrontierCS,
      and PassNet; held-out transfer on Matbench or molecular relaxation; oracle-call
      regret; or predictive-credit tests with some null or inconclusive results.'
    - 'Agent organization: parallel stateless workers with an advisor, a recursively
      self-improving auditor, or a single skill-equipped research agent.'
    open_questions:
    - Do reported token, oracle-query, and force-call savings reflect better research
      quality, or only more efficient search on existing proxies?
    - Can held-out transfer results from materials and molecular optimization extend
      to slower, less reproducible, or qualitative research tasks?
    - What benchmark duration, coverage, and metrics expose long-horizon duplicative
      or stalled behavior and align with real research utility?
    - How should experience and skill libraries be updated, invalidated, or transferred
      across domains to avoid stale, irrelevant, or overfit operational knowledge?
    - Can predictive-credit evaluation become conclusive without stronger donor resolutions,
      outcome measures, or better artifact and limitation reporting?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 长程状态与上下文管理
      解决的问题: 通过把持久状态放入 harness 或压缩已验证上下文，避免无限历史重放、重复工作和实验停滞，从而扩展自动化研究循环。
      尚未覆盖: 无状态或压缩上下文是否丢失有用细节，以及短评估视界是否误判研究系统。
    - 路线: 闭环反馈与代理修复
      解决的问题: 通过稀疏代理更新、采集规则或按需试点，在保持决策质量的同时减少昂贵的高保真/oracle 评估。
      尚未覆盖: 固定代理误差和任务特定采集可能难以迁移；报告收益主要限于合成环境与 MADE 基准。
    - 路线: 技能与经验提炼复用
      解决的问题: 从代码仓库和历史实验轨迹中提取可复用、已验证的技能或经验库，以提升新研究任务上的操作能力。
      尚未覆盖: 技能验证广度、知识过时风险，以及对现有基准套件的依赖仍未解决。
    - 路线: 领域特定的方法改写与发现
      解决的问题: 在材料和分子等领域，通过准入门控与留出数据生成并验证建模、表示或优化器改动。
      尚未覆盖: 证据只覆盖有限端点；十项选择中一项不够稳健，外部数据筛选对成分任务贡献有限。
    - 路线: 递归验证与自改进
      解决的问题: 在深度研究中交替进行证据收集、审计和针对性补充，以提升答案质量并压缩交互上下文。
      尚未覆盖: 泛化性、污染问题，以及缺少局限和工件信息使训练与评估边界未被验证。
    - 路线: 评测与预测信用设计
      解决的问题: 通过基准和配对预测测量研究智能体贡献，尤其是解释是否比描述增加预测价值。
      尚未覆盖: 代理指标可能不代表真实效用；若干预注册的预测信用检查结果为不确定或未达标。
    共识:
    - 将研究建模为需要分离搜索、执行、反馈和验证的闭环，而非一次性开放式生成。
    - 资源效率与任务性能并列为核心结果，常以固定预算下的 token、oracle 查询、力调用或交互开销衡量。
    - 越来越多使用留出或未接触评估，以检验所选改动是否能在开发循环之外泛化。
    - 历史无限重放、重复工作、过早停止和稀疏奖励分配被识别为研究智能体的核心失败模式。
    分歧:
    - 持久研究状态存放于何处：harness 状态、压缩上下文、经验库或技能库。
    - 高保真反馈如何分配：每轮反馈、通过采集规则进行稀疏代理修复、按需试点，或仅在经验不足时获取。
    - 智能体被允许修改或优化的对象：建模/特征/表示改动、优化器代码、操作技能，或答案证据与审计状态。
    - 评测方式：MLE-bench、PaperBench、FrontierCS、PassNet 等基准分数，Matbench 或分子弛豫的留出迁移，oracle
      调用遗憾，或预测信用测试；部分结果为阴性或不确定。
    - 智能体组织方式：带 Advisor 的并行无状态 Worker、递归自改进审计器，或单个技能驱动的研究智能体。
    开放问题:
    - 所报告的 token、oracle 查询和力调用节省，是反映更好的研究质量，还是仅提升现有代理指标上的搜索效率？
    - 材料和分子优化上的留出迁移结果，能否扩展到反馈更慢、更不可复现或更偏定性的研究任务？
    - 何种基准时长、覆盖面和指标能揭示长程重复或停滞行为，并与真实研究效用一致？
    - 如何更新、失效或跨域迁移经验库与技能库，以避免过时、无关或过拟合的操作知识？
    - 若没有更强的 donor 分辨率、结果指标及更好的工件和局限性报告，预测信用评测能否从不确定变为可确认？
