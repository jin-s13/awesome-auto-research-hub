  related_work_outline:
  - 'Mainstream direction: Building and evaluating LLM-based autonomous agents that
    perform closed-loop scientific discovery in simulated worlds, constrained coding
    tasks, or wet-lab settings, with increasing emphasis on verifiability, safety,
    and structured reasoning.'
  - 'Shared research pattern: Papers pair an agent scaffold such as memory, certificates,
    safety loops, or code libraries with a task environment; evaluate on completion,
    judge quality, task performance, or evidence checks; and report that strong general
    agents need additional support for discovery work.'
  - 'Key differences: Differences appear in deployment setting (simulation, code,
    wet-lab), supervision signal (LLM judge, hidden evidence verifier, episodic memory,
    safety gate, RL credit), and whether safety/audit layers are first-class parts
    of the pipeline.'
  - 'Trend evolution: The available top-ranked evidence moves from defining full-cycle
    discovery environments in 2024, to code/library augmentation in 2025, and then
    to safety, auditability, turn-level RL, and evidence benchmarks in 2026.'
  - 'Open questions: Proxy metrics and LLM judges may not align with real scientific
    utility; domain transfer, open-ended verification without hidden truth, and attribution
    of gains to scaffolds versus base models remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建并评测以LLM为核心的自主科学发现智能体，使其在模拟环境、代码实验或湿实验室任务中完成假设、实验、分析与结论闭环，并逐步加入可验证性、安全与结构化推理。
  - 研究共性：多数工作将智能体脚手架（记忆、证书、安全循环、代码库）与任务环境结合，通过完成率、裁判评分、任务性能或证据检查评估；证据显示强通用智能体仍需额外支持才能完成科学发现。
  - 关键差异：差异集中在部署场景（模拟、代码、湿实验室）、监督信号（LLM裁判、隐藏证据验证器、片段记忆、安全门控、RL信用）以及安全/审计层是否被作为流水线的一等部分。
  - 趋势演进：从2024年定义完整发现循环环境，到2025年代码与代码库增强，再到2026年出现安全、可审计性、回合级RL与证据基准，演进方向是更强验证、闭环训练与安全审计。
  - 开放问题：代理指标和LLM裁判是否对应真实科学效用、跨领域迁移、无隐藏真值时的开放验证，以及提升来自脚手架还是基础模型，证据仍不足。
  literature_review:
    line_of_work_matrix:
    - line: Full-cycle simulated discovery environments
      what_it_solves: Establishes reproducible multi-step tasks for hypothesis formation,
        experiment design, result analysis, and conclusion within controlled worlds.
      what_remains_open: Coverage remains limited to fixed topics and task metrics;
        alignment with real-world discovery impact is unverified.
    - line: Constrained ML coding and scientific code library generation
      what_it_solves: Tests agents on end-to-end model design, implementation, and
        training under resource limits, and supplies vetted domain code examples for
        better scientific experiments.
      what_remains_open: Evaluated domains are narrow, and LLM-as-judge reliability
        only moderately matches domain experts, leaving metric validity uncertain.
    - line: Auditable research question formation
      what_it_solves: Structures definitions, assumptions, mechanisms, falsifiable
        hypotheses, tests, and failure updates so research questions can be explicitly
        inspected.
      what_remains_open: Evaluation depends on LLM judges and preliminary topics;
        human domain-expert validation is not evidenced.
    - line: Closed-loop experience and reinforcement learning for discovery
      what_it_solves: Uses environment feedback, episodic memory, or turn-level credits
        to improve agent trajectories and hypothesis-driven data-analysis actions.
      what_remains_open: Reported improvements are benchmark-specific, and the contribution
        of verifiers, policy, and base model remains unclear.
    - line: Safety-aware execution and trajectory reasoning
      what_it_solves: Embeds cumulative risk tracking, stage-level safety reasoning,
        and compositional tool-chain checks into discovery pipelines and physical
        lab tasks.
      what_remains_open: Compositional escape detection is still incomplete, and external
        validation across labs, hardware, and user settings is not shown.
    - line: Evidence-grounded open-ended evaluation
      what_it_solves: Aims to automatically evaluate open-ended discovery claims against
        evidence rather than only final answers.
      what_remains_open: The packet lacks detailed method/result/limitation evidence,
        so coverage and metric validity cannot be assessed.
    consensus:
    - Autonomous scientific discovery is treated as a closed-loop process requiring
      hypothesis formation, experiment design, result interpretation, and action or
      model update.
    - General-purpose agents need additional scaffolding such as memory, verification,
      safety, or code libraries because strong baselines still struggle on scientific
      discovery tasks.
    - Environment- or evidence-based feedback is preferred over final-answer-only
      evaluation, with recurring metrics around task completion, tool-call safety,
      and verifiable knowledge.
    - LLM judges are common low-cost evaluation proxies, but their moderate agreement
      with human domain experts is treated as a shared reliability concern.
    disagreements:
    - 'Deployment settings differ: virtual text/2D discovery tasks, constrained code
      training, and robotic wet-lab execution impose different failure modes and safety
      requirements.'
    - 'Evaluation targets differ: predefined task completion, end-to-end ML performance
      under resource limits, open-ended question quality, or evidence-grounding rather
      than one shared benchmark.'
    - 'Supervision and optimization signals differ: LLM-judge scores, hidden evidence-graph
      verifiers, episodic memory rewards, safety gates, and turn-level RL credits
      coexist.'
    - Auditing and safety integration varies from explicit research-question certificates
      and cumulative risk loops to no dedicated safety layer in environment or code-generation
      work.
    - 'The unit of improvement differs: some change agent policy via RL, while others
      add experience memory, code libraries, safety loops, or question-formation scaffolds.'
    open_questions:
    - Do current proxy metrics and LLM-judge scores align with real scientific discovery
      quality or lab outcomes?
    - How well do agents transfer across domains beyond materials science, ML tasks,
      or the fixed scientific topics used in current evaluations?
    - What fraction of measured gains comes from environment verifiers, safety gates,
      memory, or code libraries versus stronger base reasoning?
    - Can safety reasoning catch compositional tool-chain risks and physical lab hazards
      across wider settings, given detected escapes still remain?
    - How should open-ended discovery be evaluated when no hidden evidence graph or
      ground-truth verifier is available?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 完整循环模拟发现环境
      解决的问题: 在受控世界中建立可复现的多步任务，覆盖假设提出、实验设计、结果分析和结论环节。
      尚未覆盖: 主题与指标仍然固定；与真实科学发现影响的对应关系未被验证。
    - 路线: 受限ML编码与科学代码库生成
      解决的问题: 在资源约束下评估端到端模型设计、实现与训练，并供应经过验证的领域代码示例以提升科学实验。
      尚未覆盖: 评估领域较窄；LLM裁判与领域专家仅中度一致，指标效度仍不确定。
    - 路线: 可审计研究问题形成
      解决的问题: 结构化记录定义、假设、机制、可证伪假设、检验与失败更新，使研究问题可被明确检查。
      尚未覆盖: 依赖LLM裁判且主题初步，缺少人类领域专家验证证据。
    - 路线: 闭环经验与强化学习
      解决的问题: 利用环境反馈、片段记忆或回合级信用改善智能体轨迹与假设驱动的数据分析动作。
      尚未覆盖: 报告提升多为基准特定；验证器、策略与基础模型各自的贡献不清晰。
    - 路线: 安全感知执行与轨迹推理
      解决的问题: 在发现流水线和物理实验室任务中嵌入累积风险跟踪、阶段级安全推理与组合工具链检查。
      尚未覆盖: 组合逃逸检测仍不完整；跨实验室、跨硬件和用户设置的标准化外部验证尚未展示。
    - 路线: 基于证据的开放式评估
      解决的问题: 试图基于证据自动评估开放式发现声明，而非只评价最终答案。
      尚未覆盖: 证据包缺少详细方法/结果/局限信息，无法评估覆盖范围与指标效度。
    共识:
    - 自主科学发现被建模为需要假设提出、实验设计、结果解释与动作或模型更新的闭环过程。
    - 通用智能体在科学发现任务上仍困难，因此需要记忆、验证、安全或代码库等额外脚手架。
    - 研究倾向于采用环境或证据反馈而非只看最终答案，常见指标包括任务完成、工具调用安全和可验证知识。
    - LLM裁判常被用作低成本代理指标，但其与人类专家的中度一致性被普遍视为可靠性风险。
    分歧:
    - 部署场景不同：虚拟文本/2D发现任务、受限代码训练和机器人湿实验室执行对失败模式与安全要求不同。
    - 评测目标不同：预定义任务完成、受限端到端ML性能、开放式问题质量或证据基础，尚未共享同一基准。
    - 监督与优化信号不同：LLM裁判、隐藏证据图验证器、片段记忆奖励、安全门控和回合级RL信用并存。
    - 安全与审计深度不同：显式研究问题证书和累积风险循环与没有专门安全层的环境或代码生成工作形成对比。
    - 改进单元不同：有的用RL改变策略，有的加入经验记忆、代码库、安全循环或问题形成脚手架。
    开放问题:
    - 当前代理指标与LLM裁判分数是否对应真实科学发现质量或实验室结果？
    - 智能体在超越材料科学、ML任务或固定科学主题后能否跨领域迁移？
    - 测量增益中有多少来自环境验证器、安全门、记忆或代码库，而非更强的基座推理能力？
    - 安全推理能否在更广泛场景中捕捉组合工具链风险与物理实验室危害？已检出逃逸之外仍有遗漏。
    - 当没有隐藏证据图或真值验证器时，如何评价开放式发现的证据充分性？
