      analysis, and writing, with agents judged on generated artifacts.
    - Automated validation and evaluation are viewed as necessary safeguards, but
      current systems still under-specify controls, robustness, falsifiability, and
      generalization.
    - Domain- or task-specific validity checks can catch some failures that general
      execution pipelines miss.
    - Competent analysis execution and documentation are more mature than trustworthy
      scientific judgment.
