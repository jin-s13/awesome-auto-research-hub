    - 需要哪些证据来证明机器生成的实验和论文包含真正的科学洞见，而非表面合理但肤浅的叙述？
    - 如何将实验自动化智能体从软件和模拟扩展到物理实验室和湿实验协议？
    - 负知识或其他记忆机制能否跨不同科学领域迁移，自我改进的上限在哪里？
