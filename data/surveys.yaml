      尚未覆盖: 代理指标尚未验证其与专家决策效用的一致性；精选CS/LLM主题及大规模论文集合之外的覆盖有限。
    共识:
    - 综述生成被视为多阶段过程，包含检索、组织、起草和评测等独立模块，而非一次性生成。
