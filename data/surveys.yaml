  related_work_outline:
  - 'Mainstream direction: autonomous agentic workflows that automate literature synthesis,
    reasoning, experimentation, and paper generation for scientific discovery, rather
    than isolated search or citation tools.'
  - 'Shared research pattern: multi-agent or LLM-judged pipelines decompose discovery
    into literature review, analysis, verification, and write-up; evaluation increasingly
    targets evidence maturity rather than final answers alone.'
  - 'Key differences: systems target different evidence types—theorem-style derivation,
    data-driven empirical claims, or end-to-end ML research—and differ in human-in-the-loop
    supervision, domain specificity, and evaluation target.'
  - 'Trend evolution: within the 2023–2026 frontier, evidence shifts from survey-style
    capability catalogs toward concrete multi-agent frameworks and blind, evidence-grounded
    evaluation suites that expose reliability gaps.'
  - 'Open questions: whether automated evaluation aligns with expert judgment; whether
    agents can sustain controls, robustness, falsifiability, and cross-domain generalization;
    and whether literature review automation is reliable enough for autonomous discovery.'
  related_work_outline_zh:
  - 主流方向：以自主智能体工作流自动化文献综述、推理、实验和论文生成，支持科学发现，而非孤立的搜索或引文工具。
  - 研究共性：多智能体或 LLM 评判流水线将发现任务分解为文献综述、分析、验证和撰写；评测越来越关注证据成熟度，而不仅是最终答案。
  - 关键差异：系统目标证据类型不同——定理式推导、数据驱动的经验主张或端到端机器学习研究；人机监督、领域特异性和评测目标也不同。
  - 趋势演进：在 2023–2026 的证据中，主流从综述式能力分类走向具体多智能体框架和盲测、基于证据的评测集，并暴露可靠性差距。
  - 开放问题：自动评测是否与专家判断一致；智能体能否保持对照、稳健性、可证伪性和跨领域泛化；文献综述自动化是否足以支撑自主发现。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous multi-agent research synthesis systems
      what_it_solves: End-to-end conversion of minimally specified research goals
        into literature synthesis, derivation, verification, and paper generation;
        some add self-evolution across experimental cycles.
      what_remains_open: Most evidence comes from internal LLM-based review rather
        than independent human replication, external validity, or proof of novel scientific
        contribution.
    - line: Evidence-grounded evaluation suites for discovery claims
      what_it_solves: Comparable evaluation of whether an agent's claims are supported
        by hidden source conclusions and frozen data, using blind tasks and human
        baselines.
      what_remains_open: Current results rest on limited base-model coverage and automated
        LLM judges; controls, robustness, falsifiability, and cross-dataset generalization
        are not yet demonstrated.
    - line: Failure-mode analysis and design principles for research agents
      what_it_solves: Documents recurring long-horizon failure modes such as implementation
        drift, memory degradation, overexcitement, and weak scientific taste to derive
        design guidance.
      what_remains_open: Findings come from a small set of end-to-end attempts; the
        proposed design principles are not yet validated across domains, base models,
        or evaluation-suite outcomes.
    - line: Survey and taxonomy of agentic scientific workflows
      what_it_solves: Organizes agentic capabilities across domains and workflow stages,
        and catalogs metrics, frameworks, and datasets for discovery-oriented AI.
      what_remains_open: Taxonomic coverage remains descriptive; no direct empirical
        validation shows that the categories predict system reliability, evidence
        quality, or discovery outcomes.
    consensus:
    - Autonomous agents can execute and document analyses, but current evidence does
      not demonstrate trustworthy scientific discovery.
    - Evaluation should focus on evidence maturity and claim support rather than final
      answers or paper completion alone.
    - Literature review automation and system reliability remain unresolved across
      the surveyed systems.
    - Human baselines or human review are used to calibrate performance, but the packet
      does not show that LLM-judged scores consistently match expert judgment.
    disagreements:
    - 'Evaluation target differs: some work scores generated papers with LLM rubrics,
      while others score blind-task claim support or standardized science-task performance.'
    - 'Domain positioning differs: some systems target domain-specific omics discovery,
      while others are domain-agnostic reasoning or applied mathematics frameworks.'
    - 'Supervision and interaction differ: some lines use human-in-the-loop principal-investigator
      collaboration, others emphasize self-evolving agents, and evaluation suites
      prefer fixed judges with hidden conclusions.'
    - 'Representation of scientific work differs: theorem-style derivation and paper
      generation versus data-driven empirical claim support versus end-to-end ML research
      pipelines.'
    open_questions:
    - What controls, robustness checks, falsifiability tests, and cross-dataset generalization
      are needed before agent-generated claims count as evidence?
    - Do automated LLM-judge scores predict human expert judgment or downstream scientific
      utility?
    - Can internal verification loops catch long-horizon failures such as implementation
      drift and overexcitement?
    - How far do results generalize beyond the packet's small case set, single frozen
      base model, or unshown code and citation data?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主多智能体研究综合系统
      解决的问题: 把最少提示的研究目标转化为文献综合、推导、验证和论文生成的端到端流程；部分系统通过实验周期中的自我演化积累知识。
      尚未覆盖: 证据主要来自内部 LLM 评审，而非独立人类复现、外部有效性或原创科学贡献证明。
    - 路线: 面向发现主张的证据锚定评测套件
      解决的问题: 通过隐藏原始结论和冻结数据，用盲任务和人类基线比较智能体提出的主张是否被数据支持。
      尚未覆盖: 当前结果依赖有限的基座模型覆盖和自动 LLM 评判；对照、稳健性、可证伪性和跨数据集泛化尚未被证明。
    - 路线: 研究智能体失败模式分析与设计原则
      解决的问题: 记录长周期研究中的实现漂移、记忆退化、过度宣布成功和科学品味薄弱等重复失败模式，以推导设计原则。
      尚未覆盖: 来自少量端到端尝试；设计原则尚未跨领域、跨基座模型或与评测结果一起验证。
    - 路线: 智能体科学工作流综述与分类
      解决的问题: 按领域和工作流阶段组织智能体能力，并整理指标、框架和数据集的目录。
      尚未覆盖: 分类仍是描述性；尚缺直接实证证明这些类别能预测系统可靠性、证据质量或发现结果。
    共识:
    - 自主智能体能够执行和记录分析，但现有证据尚不表明其能产出可信的科学发现。
    - 评测应更重视证据成熟度和主张支持程度，而不是只看最终答案或论文是否完成。
    - 文献综述自动化和系统可靠性在所涉系统中仍未解决。
    - 人类基线或人类评审被用于校准性能，但证据包未证明 LLM 评判分数始终与专家判断一致。
    分歧:
    - 评测目标不同：一些工作用 LLM 评审标准给生成论文打分，另一些对盲任务的主张支持度或标准化科学任务表现打分。
    - 领域定位不同：一些系统针对特定组学发现，另一些是应用数学推理或领域无关框架。
    - 监督与交互模式不同：一类采用人类担任首席研究员的协作方式，一类强调自我演化智能体，评测套件则偏好固定评判器和隐藏结论。
    - 对科学工作的表示不同：定理式推导与论文生成、数据驱动经验主张、端到端机器学习研究流水线各有侧重。
    开放问题:
    - 智能体生成的主张需要哪些对照、稳健性检验、可证伪性测试和跨数据集泛化，才能算作证据？
    - 自动 LLM 评判分数能否预测人类专家判断或下游科学效用？
    - 内部验证循环能否捕获实现漂移和过度宣布成功等长周期失败？
    - 现有结果在多大程度上能推广到超越证据包中的小规模案例、单一冻结基座模型或未展示的代码与引文数据？
