  related_work_outline:
  - 'Mainstream direction: Building autonomous research agents that generate hypotheses,
    execute experiments, and verify or report findings, with increasing emphasis on
    reliability and grounding.'
  - 'Shared research pattern: Systems separate open-ended idea generation from controlled
    execution, validation, and reporting; they evaluate on domain tasks or benchmarks
    and add mechanisms against fabricated or invalid results.'
  - 'Key differences: Domains and evaluation targets range from CFD, forecasting,
    and omics to general ML; reliability mechanisms include physics-aware vision gates,
    deterministic authority separation, and multi-hypothesis failure attribution;
    human oversight spans fully autonomous loops, selective collaboration, and interactive
    platforms.'
  - 'Trend evolution: The 2025-2026 frontier moves from broad benchmarks and surveys
    toward self-correcting agents and human-AI collaboration, but evidence remains
    concentrated in narrow case studies.'
  - 'Open questions: Verification gaps, benchmark meaningfulness, literature-grounding
    reliability, generalization beyond limited cases, optimal human intervention,
    and fully autonomous scientific writing.'
  related_work_outline_zh:
  - 主流方向：构建能提出假设、执行实验并验证或报告发现的自主研究智能体，并高度关注可靠性和证据落地。
  - 研究共性：系统倾向于把开放式想法生成与受控执行、验证和报告分离；通过领域任务或基准评估，并引入机制防止虚构或无效结果。
  - 关键差异：领域与评测目标覆盖CFD、预测、组学到通用ML；可靠性机制包括物理感知视觉门控、确定性权威、多假设失败归因等；人类监督从完全自主、选择性协作到交互式平台不等。
  - 趋势演进：2025–2026前沿从宽口径基准与综述转向自校正智能体与人机协作，但进展仍集中在少数案例。
  - 开放问题：验证缺口、基准是否能代表研究洞察、文献落地可信度、小范围案例的泛化、最佳人类干预程度，以及完全自主的科研写作。
  literature_review:
    line_of_work_matrix:
    - line: Closed-loop autonomous research agents that turn hypotheses into executed
        experiments and reports (e.g., AI CFD Scientist, EvoCast, AutoResearchClaw,
        SAGE)
      what_it_solves: Converting generated hypotheses into executable experiments,
        code edits, and result reports within an inspectable or self-correcting loop.
      what_remains_open: Whether downstream gains reflect research insight rather
        than domain-specific tuning, engineering tricks, or selected baselines; failure
        attribution and validation remain incomplete.
    - line: Empirical benchmarks and testbeds for AI scientists and scientific discovery
        (e.g., BAISBench, Agent4Sci)
      what_it_solves: Making claims about hypothesis generation and discovery comparable
        through datasets, baselines, metrics, and human performance references.
      what_remains_open: Benchmarks may favor engineering improvements over hypothesis
        quality; current evidence shows systems still fall short of fully autonomous
        biological discovery.
    - line: Reliability, verification, and self-correction mechanisms
      what_it_solves: Reducing silent failures, fabricated numbers, hallucinated citations,
        and ungrounded results through physics-aware vision gates, deterministic authority
        separation, grounded reporting, or multi-hypothesis failure attribution.
      what_remains_open: Verification gates can miss failures; fully autonomous conference-ready
        writing and broad external validation remain unsolved.
    - line: Human-AI collaboration and interactive research platforms
      what_it_solves: Allowing human judgment at high-leverage points or through customizable
        roles, monitoring, artifact inspection, rollback, and resume controls.
      what_remains_open: Optimal intervention modes are not standardized, and evaluations
        may rely on limited internal case studies that may not generalize.
    - line: Surveys and conceptual organization of agentic scientific discovery
      what_it_solves: Cataloging progress, evaluation metrics, implementation frameworks,
        datasets, and challenges across chemistry, biology, and materials science.
      what_remains_open: Categories and future directions need empirical validation;
        system reliability and ethical concerns remain open.
    consensus:
    - 'Autonomous research systems share a modular structure: open-ended hypothesis
      or idea generation, execution, validation, and reporting.'
    - LLM outputs are not trusted by default; systems add programmatic authority,
      physics/vision gates, grounded reporting, or failure attribution.
    - 'Current agents are assistive or narrow-domain: they can improve selected baselines
      but are not yet reliable fully autonomous scientific discoverers.'
    - Targeted human collaboration at high-leverage decision points can outperform
      either complete autonomy or exhaustive oversight.
    disagreements:
    - 'Evaluation targets vary widely: experimental benchmarks, published-study multiple-choice
      tasks, single-cell annotation, forecasting cases, ML leaderboard improvement,
      and expert-judged case studies.'
    - 'Reliability is achieved through different mechanisms: physics-aware visual
      verification, deterministic authority separation, multi-hypothesis failure attribution,
      and verifiable result reporting.'
    - 'Interaction and supervision modes differ: fully autonomous loops, selectable
      human intervention, or interactive platforms with real-time monitoring and rollback.'
    - Success is measured by domain metric gains, benchmark score, artifact quality,
      blind review score, or judge preference, so direct comparison is difficult.
    open_questions:
    - Can verification mechanisms detect silent failures beyond the limited planted-failure
      or narrow-domain cases reported?
    - Do benchmark improvements reflect hypothesis generation quality rather than
      ML engineering tricks, given evidence that gains may come mostly from engineering?
    - How can autonomous systems reliably ground literature and citations without
      hallucinating sources?
    - Do results from a few forecasting cases, internal case studies, or specific
      benchmark topics transfer to broader scientific domains and user settings?
    - What is the optimal level and timing of human intervention across different
      research stages?
    - What evaluation criteria can capture research insight, novelty calibration,
      and real discovery utility beyond leaderboard metrics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 闭环自主研究智能体，把假设转化为执行实验和报告（如AI CFD Scientist、EvoCast、AutoResearchClaw、SAGE）
      解决的问题: 将生成的假设转化为可执行实验、代码修改和结果报告，并在可检查或自校正闭环中运行。
      尚未覆盖: 下游提升有多少来自研究洞察而不是领域调优、工程技巧或所选基线仍不清楚；失败归因与验证仍不完整。
    - 路线: 面向AI科学家与科学发现的经验基准和测试床（如BAISBench、Agent4Sci）
      解决的问题: 通过数据集、基线、指标和人类表现参考，使假设生成与发现声明可比较。
      尚未覆盖: 基准可能更偏好工程改进而非假设质量；证据显示系统仍未达到完全自主的生物学发现。
    - 路线: 可靠性、验证与自校正机制
      解决的问题: 通过物理感知视觉门控、确定性权威分离、基于事实的报告或多假设失败归因，减少静默失败、伪造数字和幻觉引用。
      尚未覆盖: 验证门控仍可能漏检；完全自主的会议级写作和广泛外部验证尚未解决。
    - 路线: 人机协作与交互式研究平台
      解决的问题: 在高杠杆决策点引入人类判断，或通过可定制角色、监控、工件检查、回滚和恢复提供控制。
      尚未覆盖: 最佳干预模式缺乏标准；评估可能依赖有限的内部案例，泛化性未知。
    - 路线: 智能体科学发现综述与概念整理
      解决的问题: 梳理化学、生物学和材料科学中的进展、评估指标、实施框架、数据集与挑战。
      尚未覆盖: 分类与未来方向需要实证验证；系统可靠性与伦理问题仍开放。
    共识:
    - 自主研究系统共享模块化结构：开放式假设或想法生成、执行、验证和报告。
    - LLM输出不被默认信任；系统引入程序权威、物理/视觉门控、基于事实的报告或失败归因。
    - 当前智能体更接近辅助或窄领域工具，而非可靠的完全自主科学发现者。
    - 在高杠杆点进行选择性人机协作可能优于完全自主或逐步式监督。
    分歧:
    - 评测目标差异大：实验基准、已发表研究选择题、单细胞注释、预测案例、ML排行榜提升和专家评审案例各有侧重。
    - 可靠性实现方式不同：物理感知视觉验证、确定性权威分离、多假设失败归因和可验证报告并存。
    - 监督与交互模式不同：从完全自主、可选择人类干预到实时监控与回滚的交互式平台。
