  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery and manuscript generation with simulated
        review
      what_it_solves: Turns LLM-driven ideation into code, experiments, visualization,
        and full papers, with automated review intended to scale assessment beyond
        human effort.
      what_remains_open: Consistency and broader scientific validity are weak; only
        one of three workshop manuscripts passed peer review and conference-level
        validation is missing.
    - line: Discovery environments and domain benchmark suites
      what_it_solves: Standardizes complete discovery-cycle tasks so agents can be
        compared on hypothesis formation, experiment design, analysis, and conclusion.
      what_remains_open: Task completion metrics may not equal real discovery utility;
        domain coverage and human calibration are limited in the available evidence.
    - line: Evidence-grounded blind evaluation with automated judges
      what_it_solves: Hides source conclusions while exposing a neutral objective
        and frozen data, then uses fixed rubric-based LLM judges to score evidentiary
        maturity automatically.
      what_remains_open: Reported results use only one frozen base model, and the
        judged rubric may not capture controls, robustness, falsifiability, or cross-dataset
        generalization.
    - line: Domain-specific autonomous discovery with physical validity gates
      what_it_solves: Adds domain-aware verification to catch silent failures and
        improve domain results, such as reducing wall Cf RMSE in CFD.
      what_remains_open: The verification gate still missed planted failures, and
        open-ended generalization beyond the domain shown is not established.
    - line: Controlled iterative evolution through cognition-authority separation
      what_it_solves: Bounds LLM edit authority with deterministic program control
        while improving implementation success and task-specific architecture performance.
      what_remains_open: External validation across hardware, datasets, and user settings
        is missing, and gain attribution between agent cognition and task-specific
        priors is unresolved.
    consensus:
    - 'Current systems converge on an agentic science loop: propose, implement, run,
      analyze, and write, with separate evaluation or verification layers added to
      improve reliability.'
    - Automatic evaluation is treated as necessary for scale; trust evidence comes
      from tasks, hidden conclusions, fixed judges, validity gates, deterministic
      authority, or human baselines rather than popularity scores.
    - 'The available evidence shows agents are comparatively strong at execution and
      documentation but still lack discriminating scientific judgment: controls, robustness,
      falsifiability, and cross-domain generalization remain weak.'
    - Read-first scores, tags, and citation-related components are metadata signals
      and should not be treated as methodology, result, or reproducibility evidence.
    - Missing code, dataset, baseline, metric, or limitation details in the packet
      are verification gaps rather than proof that a system lacks those properties.
    disagreements:
    - 'Evaluation target differs: broad discovery environments versus domain-specific
      physical, biological, and forecasting tasks, which leads to different claims
      about discovery capability.'
    - 'Reliability mechanism differs: vision-language physical gates, fixed LLM evidence-maturity
      judges, simulated peer review, and deterministic program authority embed different
      assumptions about what makes a claim trustworthy.'
    - 'Success criterion differs: task completion or benchmark score, evidence maturity,
      peer-review acceptance, or downstream architecture performance are used as progress
      indicators without a shared standard.'
    - 'Supervision and calibration differ: some works use hidden peer-reviewed conclusions
      or human baselines, while others rely on automated reviewer thresholds or task-specific
      baselines, weakening comparability.'
    open_questions:
    - Does automated judge or review scoring correlate with real scientific validity,
      or only with surface evidence features and manuscript quality?
    - Are reported systems robust across base models and domains when the available
      evidence includes one frozen base model and workshop-level validation?
    - What verification layer can detect silent failures and missing controls if a
      physical gate misses planted failures and agents still lack robustness and falsifiability?
    - How should authority, permissions, governance, and external validation be standardized
      for autonomous systems that write code and modify experiments?
    - How much of iterative architecture search gain comes from the agent's cognition
      rather than deterministic authority, task-specific baselines, or domain priors?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现与论文生成，配合模拟评审
      解决的问题: 把LLM驱动的构思转化为代码、实验、可视化和完整论文，并用自动评审扩展评估规模。
      尚未覆盖: 一致性和科学有效性不足；三篇中仅一篇工作坊论文通过同行评审，会议级验证缺失。
    - 路线: 发现环境与领域基准套件
      解决的问题: 标准化完整发现循环任务，让智能体在假设形成、实验设计、分析和结论上可比较。
      尚未覆盖: 任务完成指标未必等于真实发现效用；现有证据中领域覆盖与人类校准有限。
    - 路线: 证据锚定的盲测与自动证据成熟度评分
      解决的问题: 隐藏源结论，仅提供中立目标与冻结数据，并用固定评分项自动评估证据成熟度。
      尚未覆盖: 仅在单一冻结基座模型上报告；评分可能未覆盖对照、稳健性、可证伪性与跨数据集泛化。
    - 路线: 带物理有效性门控的领域发现
      解决的问题: 增加领域感知验证以捕获静默失败并改进领域结果，例如降低CFD壁面Cf RMSE。
      尚未覆盖: 验证门控仍遗漏植入失败，且所展示领域之外的开放式泛化尚未确立。
    - 路线: 认知-权威分离的受控迭代演化
      解决的问题: 用确定性程序控制约束LLM编辑权限，同时提升实现成功率和任务专属架构性能。
      尚未覆盖: 缺少跨硬件、数据集和用户设置的标准化外部验证，智能体认知与任务先验的收益归因未解决。
    共识:
    - 当前系统共同采用提出-实现-运行-分析-写作的智能体科学闭环，并增加独立评估或验证层。
    - 自动评估被视为规模化的必要条件；可靠性证据来自任务、隐藏结论、固定裁判、有效门控、确定性权威或人类基线，而非流行度分数。
    - 现有证据显示智能体在分析与文档记录上较强，但在对照、稳健性、可证伪性和跨领域泛化等科学判断上仍不足。
    - 排序分数、标签和引用相关指标属于元数据信号，不应作为方法学、结果或可复现性证据。
    - 代码、数据集、基线、指标或局限性信息缺失应视为验证缺口，而非系统不具备这些属性的证据。
    分歧:
    - 评估目标不同：通用发现环境与特定物理、生物、预测任务并存，导致发现能力主张难以直接比较。
    - 可靠性机制不同：物理视觉门控、固定LLM证据裁判、模拟同行评审、确定性程序权威，对可信主张的假设各异。
    - 成功标准不同：任务完成/基准得分、证据成熟度、同行评审接受或下游架构性能，缺乏共享标准。
    - 监督与校准不同：有的使用隐藏同行评审结论或人类基线，有的使用自动评审阈值或任务基线，可比较性较弱。
    开放问题:
    - 自动评审或裁判分数是否与真实科学有效性相关，还是只反映表面证据特征和论文质量？
    - 在现有证据仅包含一个冻结基座模型和工作坊级验证的情况下，系统跨基座模型与跨领域是否稳健？
    - 当物理门控会漏掉静默失败且智能体仍缺乏对照与可证伪性时，何种验证层能提供保证？
    - 能编写代码并修改实验的自主系统，应如何标准化权限、权限边界、治理和外部验证？
    - 迭代架构搜索的收益有多少来自智能体认知，而非确定性权威、任务基线或领域先验？
