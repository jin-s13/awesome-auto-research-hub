  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript-generation systems
      what_it_solves: Covers the full research loop from hypothesis ideation through
        code, experiments, visualization, and writing to reduce human time and cost.
      what_remains_open: Success is inconsistent and often validated only at workshop
        level or via automated reviewers; controls, robustness, and falsifiability
        are not yet established.
    - line: Domain-specific verifier-gated discovery agents
      what_it_solves: Embeds domain checks such as physics-aware visual inspection,
        internal logical auditing, and knowledge retrieval to catch invalid derivations
        or silent experimental failures.
      what_remains_open: Verification gates can miss planted silent failures and are
        evaluated on narrow cases; attribution of improvement to the agent versus
        the domain solver remains unclear.
    - line: Benchmark environments for complete discovery cycles
      what_it_solves: Provides reusable simulated tasks and metrics for hypothesis
        formation, experiment design, analysis, and conclusion, enabling controlled
        agent comparisons.
      what_remains_open: Strong baselines still struggle on many tasks; current metrics
        may not capture real scientific insight, and task domain coverage is limited.
    - line: Evidence-grounded blind evaluation of discovery agents
      what_it_solves: Tests whether an agent can derive data-supported claims when
        source conclusions and analysis paths are withheld, using fixed rubrics for
        evidentiary maturity.
      what_remains_open: Evaluated agents plateau with no reliable separation on one
        base model and lack discriminating scientific behaviors such as controls,
        robustness, and cross-dataset generalization.
    - line: Knowledge-based multi-agent reasoning for formal sciences
      what_it_solves: Automates theory-heavy discovery such as proofs and derivations
        in applied mathematics by combining retrieval, self-improvement, and multi-agent
        roles.
      what_remains_open: Current evidence comes from LLM-based rubric scoring of a
        small generated paper set, with no reported external validation or limitation
        analysis.
    consensus:
    - 'Research systems share a decompose-and-loop structure: ideation, execution,
      verification, and manuscript writing are treated as connected stages.'
    - Verification and evaluation gates are considered necessary because raw generated
      outputs alone do not produce defensible scientific claims.
    - Current demonstrations show partial automation or narrow discovery, with major
      gaps in controls, robustness, falsifiability, and cross-domain generalization.
    - Automated reviewers or judges are used to scale assessment, but their validity
      is mainly shown against human-like scoring or fixed rubrics rather than real-world
      scientific utility.
    disagreements:
    - 'Target domain specificity: some systems operate on general machine learning
      research loops, while others specialize in computational fluid dynamics or applied
      mathematics with domain-specific validity checks.'
    - 'Evaluation target: works differ between paper acceptance and review scores,
      benchmark task completion, physical metric improvement, and evidence maturity
      under blind tasks.'
    - 'Verification mode: one line uses internal logic auditing, another uses vision-language
      physics inspection of rendered flow fields, and a third uses rubric-based evidence
      judges.'
    - 'Deployment setting: simulated sandbox tasks, self-generated paper portfolios,
      real workshop submission, and domain solver experiments create different validity
      boundaries.'
    open_questions:
    - Can autonomous agents produce claims with adequate controls, robustness checks,
      falsifiability, and cross-dataset generalization, given current systems largely
      lack these behaviors?
    - Do LLM-based reviewers and rubric scores track real scientific merit or peer-review
      outcomes beyond the small evaluated paper sets?
    - How should verification gates handle silent failures, since one physics-aware
      gate missed two of sixteen planted silent failures?
    - How stable are current findings across base models, domains, and hardware or
      solver settings when some evaluations rely on a single frozen base model or
      a single domain case?
