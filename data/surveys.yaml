    constrain unattended research.'
  related_work_outline_zh:
  - 主流方向：端到端自主研究智能体与评测基准配对，衡量任务完成、证据成熟度或类论文输出。
  - 研究共性：LLM智能体产生假设或代码、运行实验、记录结果，并由自动评审、基准或程序化权威过滤。
  - 关键差异：评测目标从虚拟发现任务到真实组学、CFD或时序数据不等；可靠性通过模拟评审、确定性权威或领域验证门控实现。
  - 趋势演进：在2024-2026前沿内，工作从通用自动论文生成走向领域特定自主科学家与基于证据的盲评可信度。
  - 开放问题：代理指标是否对应真实科学效用，验证门控能否跨领域捕获静默失败，以及如何治理无人值守研究。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Turning LLM-driven idea generation, code, experiments, and manuscript
        writing into runnable closed-loop research workflows.
      what_remains_open: Consistency across runs and domains; many demonstrations
        rely on narrow case counts, workshop-level evidence, or missing limitation
        details.
    - line: Scientific discovery benchmark environments
      what_it_solves: Making agent capabilities comparable through standardized tasks,
        baseline agents, automatic metrics, and sometimes human baselines.
      what_remains_open: Whether task completion, rubric scores, or expert-derived
        questions reflect real scientific discovery quality and generalize beyond
        the benchmark context.
    - line: Verification, review, and authority mechanisms
      what_it_solves: Reducing silent failures, invalid claims, or unsafe code changes
        via physics-aware gates, simulated peer review, VLM feedback, or deterministic
        authority separation.
      what_remains_open: Missed failure modes and unclear sensitivity to base model,
        task domain, and evaluation protocol.
    consensus:
    - LLM-based research agents can execute and document analyses and produce plausible
      research artifacts, but they are not yet reliable autonomous discoverers.
    - Automated evaluation is feasible for scientific discovery tasks through task
      suites, expert-derived questions, or evidence-maturity rubrics.
    - Strong baseline agents often struggle or plateau on discovery-style tasks, showing
      that execution and documentation do not imply trustworthy conclusions.
    - Some form of verification, review, or authority boundary is needed because raw
      agent outputs can contain silent failures or undefended claims.
    disagreements:
    - 'Evaluation target differs: publication acceptance or reviewer score, task completion
      in virtual environments, evidence maturity in blind tasks, or domain-specific
      metric improvement.'
    - 'Reliability is operationalized differently: simulated review, physics-aware
      vision gates, deterministic program authority, or human baseline contrast.'
    - 'Deployment setting differs: broad ML workshop papers, single-cell omics data,
      computational fluid dynamics, and time-series forecasting architectures.'
    - 'Supervision and authority differ: LLM judge only, human baseline comparisons,
      program-controlled edit boundaries, or combined review loops.'
    open_questions:
    - How to calibrate proxy metrics and LLM judges so higher scores track actual
      scientific validity rather than surface plausibility?
    - How to design verification gates that detect silent failures across domains
      without requiring task-specific retraining or manual checks?
    - Whether end-to-end autonomous research findings remain stable across base models,
      datasets, and independent evaluation teams?
    - What governance and reproducibility requirements should apply to unattended
      automated research cycles that write code and papers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究智能体
      解决的问题: 将LLM驱动的想法生成、代码、实验和论文撰写组织成可运行的闭环研究流程。
      尚未覆盖: 跨领域和多次运行的稳定性；多个演示仅基于少量案例、工作坊级证据或缺失的局限性说明。
    - 路线: 科学发现基准环境
      解决的问题: 通过标准化任务、基线智能体、自动指标和部分人类基线，让智能体能力可比较。
      尚未覆盖: 任务完成、评分或专家衍生问题是否代表真实科学发现质量，以及是否能泛化到基准之外。
    - 路线: 验证、评审与权限机制
      解决的问题: 通过物理感知门控、模拟同行评审、VLM反馈或确定性权限分离，减少静默失败、无效主张或危险代码修改。
      尚未覆盖: 漏检失败模式，以及对基座模型、任务领域和评测协议变化的敏感性。
    共识:
    - 基于LLM的研究智能体能够执行并记录分析，产出看似合理的研究工件，但尚不是可靠的自主发现者。
    - 可以通过任务套件、专家衍生问题或证据成熟度评分对科学发现任务进行自动评估。
    - 强基线智能体在发现类任务上常表现挣扎或进入平台期，执行和记录能力强不等于结论可信。
    - 需要某种验证、评审或权限边界，因为原始智能体输出可能包含静默失败或无依据主张。
    分歧:
    - 评测目标不同：论文录用或评审分数、虚拟环境任务完成、盲任务证据成熟度或领域指标提升。
    - 可靠性定义不同：模拟评审、物理感知视觉门控、确定性程序权限或人类基线对比。
    - 部署场景不同：通用机器学习工作坊论文、单细胞组学数据、计算流体动力学和时序预测架构。
    - 监督与权限不同：仅LLM裁判、人类基线比较、程序控制编辑边界或组合评审循环。
    开放问题:
    - 如何校准代理指标和LLM裁判，使更高分数对应真实科学有效性而非表面合理性？
    - 如何设计能在不同领域检测静默失败、且无需大量任务特定重训或人工检查的验证门控？
    - 端到端自主研究发现是否在跨基座模型、数据集和独立评估团队条件下保持稳定？
    - 对无人值守且会编写代码和论文的自动研究循环，应设置哪些治理和可复现性要求？
