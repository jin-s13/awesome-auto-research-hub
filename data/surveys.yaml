  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: Converts high-level research prompts into code, experiments,
        visualizations, and full manuscripts with minimal manual intervention.
      what_remains_open: 'Success is inconsistent: only one of three workshop submissions
        passed peer review, and most evidence is LLM-reviewed or benchmark-level rather
        than full conference validation.'
    - line: Domain-grounded verification and validity gates
      what_it_solves: Checks logical or physical validity before results are accepted
        or written, reducing silent failures and fabricated findings.
      what_remains_open: Gates still miss failures, e.g., a physics-aware gate missed
        2 of 16 planted silent failures, and performance outside the tested domain
        remains unproven.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Allocates human oversight to high-leverage decision points instead
        of full manual step-by-step supervision.
      what_remains_open: Evidence is largely from one experiment-stage benchmark;
        optimal intervention granularity and transfer to other research workflows
        are not established.
    - line: Failure attribution and self-correction
      what_it_solves: Diagnoses why experiments fail and routes correction to hypothesis,
        experimental design, or implementation, improving metrics-bearing outputs
        and artifact quality.
      what_remains_open: Reported gains center on code development and execution;
        fully autonomous scientific writing and conference-ready papers remain difficult.
    - line: Automated review and evaluation of generated papers
      what_it_solves: Creates repeatable scoring through LLM rubrics, simulated review,
        blind scoring, and workshop peer review.
      what_remains_open: Proxy review metrics are not yet tied to long-term scientific
        validity, reproducibility, or real scientific utility.
    - line: Knowledge integration for theory-heavy or domain-specific writing
      what_it_solves: Retrieves declarative and procedural knowledge to support reasoning,
        proof-oriented content, and domain-specific manuscript drafting.
      what_remains_open: Demonstrated mainly in applied mathematics and computational
        fluid dynamics; transfer to other disciplines and coverage of tacit knowledge
        are unclear.
    consensus:
    - Multiple systems demonstrate that LLM agents can produce complete research manuscripts,
      but success rates remain uneven and often depend on LLM-based or workshop-level
      review.
    - Verification and reporting constraints are treated as necessary to reduce fabricated
      numbers, hallucinated citations, and silently invalid results.
    - 'Autonomous research systems share recurring failure modes: implementation drift,
      memory or context degradation, insufficient domain intelligence, overexcitement,
      and weak scientific taste.'
    - Targeted human collaboration at high-leverage decision points can outperform
      both full autonomy and exhaustive step-by-step oversight.
    - 'The evidence reflects a current frontier rather than mature field validation:
      evaluations rely on benchmarks, simulated review, or workshop acceptance.'
    disagreements:
    - 'Fully autonomous workflows versus human-in-the-loop workflows: some systems
      minimize human intervention to a PI-like role, while others argue for high-leverage
      human checkpoints.'
    - 'Verification strategy differs: domain-specific physics or logic gates versus
      generic multi-agent debate, reflection, or VLM reviewer feedback.'
    - 'Evaluation target differs: domain task metrics such as wall Cf RMSE, experiment-stage
      benchmark scores, LLM rubrics, blind reviews, or workshop peer review are not
