  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery systems
      what_it_solves: Covering the full loop from idea generation and code-based experiment
        execution to manuscript writing and automated review in one agentic workflow.
      what_remains_open: Inconsistent success rates, domain transfer beyond selected
        ML or applied math cases, and whether generated papers contain new scientific
        insight rather than plausible reformulation.
    - line: Discovery evaluation environments and benchmarks
      what_it_solves: Providing comparable tasks, baselines, and metrics for complete
        discovery cycles, including simulated experiments and scientific ML benchmark
        improvement.
      what_remains_open: Proxy metrics and LLM/expert judgments may not capture downstream
        scientific utility; current top evidence lacks lab-based experimental tasks.
    - line: Failure-aware memory and iterative experimentation
      what_it_solves: Retaining failed attempts as typed negative knowledge so downstream
        agents can adopt or reject them, improving retries and cross-task transfer
        with lower token use.
      what_remains_open: Evidence is limited to PDE and ScienceAgentBench-style settings;
        the curator/reasoner interaction and task-type boundaries are not fully validated.
    - line: Interactive multi-agent research platforms
      what_it_solves: Turning isolated agents into runnable, monitorable research
        workflows with customizable roles, dashboards, and local code/data integration.
      what_remains_open: Platform maturity and external validation beyond small internal
        case studies; reproduction and user-setting variability are not yet established.
    - line: Frontier-agent capability diagnostics
      what_it_solves: Characterizing how frontier coding agents improve published
        best models and where they fail, rather than only ranking them on leaderboards.
      what_remains_open: Separating ML engineering tricks from domain-level research
        insight, and determining whether plug-in skills transfer to other experimental
        regimes.
    consensus:
    - 'The field converges on closed-loop automation: agents propose hypotheses, run
      or simulate experiments, inspect results, and iterate toward a written output.'
    - Evaluation relies increasingly on automated judges, benchmark tasks, expert
      preferences, or peer review because direct human assessment of full discovery
      cycles is limited.
    - Newer systems incorporate memory, tree search, verification, or review feedback
      to improve coherence, lower token cost, or avoid repeating failures.
    - Current evidence shows agents can produce plausible artifacts and improve benchmarks,
      but it does not yet show consistent peer-review success or stable generalization
      across domains.
    disagreements:
    - 'Human interaction mode differs: some systems pursue full automation, while
      others treat human experts as principal investigators or operators of a dashboard.'
    - 'Evaluation targets differ: simulated discovery tasks, scientific ML benchmark
      improvement, LLM review rubrics, expert preference judgments, and workshop peer
      review are not directly comparable.'
    - 'Improvement mechanism differs: failure memory, agentic tree search, plug-in
      skills, and role-based multi-agent platforms may each contribute through different
      operational paths.'
    - 'Domain emphasis differs: applied mathematics/theory, ML subfields, and broad
      simulated scientific discovery create different requirements for code execution,
      proof, and experimental design.'
    - 'Reported success is disputed at the level of contribution type: one diagnostic
      line finds benchmark gains come mostly from engineering tricks rather than research
      insight, while other systems report novelty via LLM or expert judges.'
    open_questions:
    - Can automated reviewers or LLM rubrics be validated against human scientific
      judgments beyond a narrow acceptance threshold?
    - What causes inconsistent peer-review outcomes when multiple fully generated
      papers are submitted, and how can that variance be reduced?
    - Do agents transfer from current case studies such as PDE tasks, ML benchmark
      improvements, or small platform evaluations to unseen scientific domains and
      lab-based experiments?
    - Which improvements reflect genuine domain insight rather than parameter sweeps,
      code templates, stored knowledge, or engineering tricks?
    - Where are the missing code, dataset, baseline, limitation, and reproducibility
      artifacts for several top-ranked systems, and how would their availability change
      the claims?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现系统
      解决的问题: 在单个智能体工作流中覆盖从想法生成、代码类实验执行到论文撰写和自动评审的完整闭环。
      尚未覆盖: 成功率不稳定，超出所选机器学习或应用数学案例的领域迁移有限，生成论文是否包含真正新洞察仍不清楚。
    - 路线: 发现评测环境与基准
      解决的问题: 为完整科学发现循环提供可比任务、基线和指标，包括模拟实验和科学机器学习基准改进。
      尚未覆盖: 代理指标与LLM/专家判断未必反映下游科学效用；当前顶层证据缺少实验室实验任务。
    - 路线: 失败感知记忆与迭代实验
      解决的问题: 把失败尝试保留为类型化负知识，供下游智能体采纳或拒绝，以更低令牌消耗改善重试和跨任务迁移。
      尚未覆盖: 证据限于PDE和ScienceAgentBench类场景；策展者与推理者交互以及任务类型边界尚未充分验证。
    - 路线: 交互式多智能体研究平台
      解决的问题: 把单点智能体转化为可运行、可监控的研究工作流，支持角色定制、仪表板和本地代码/数据集成。
      尚未覆盖: 平台成熟度和超出少量内部案例研究的外部验证不足；复现与用户设置变异性尚未建立。
    - 路线: 前沿智能体能力诊断
      解决的问题: 刻画前沿编码智能体如何改进已发布最佳模型以及失败模式，而不是只看排行榜排名。
      尚未覆盖: 区分机器学习工程技巧与领域研究洞察，以及插件技能能否迁移到其他实验设置。
    共识:
    - 领域收敛于闭环自动化：智能体提出假设、运行或仿真实验、检查结果并迭代形成书面输出。
    - 评估越来越依赖自动评审、基准任务、专家偏好或同行评审，因为完整发现循环的人工评估有限。
    - 较新系统引入记忆、树搜索、验证或评审反馈，以提升连贯性、降低令牌成本或避免重复失败。
    - 当前证据显示智能体能生成看似合理的工件并改进基准，但尚未展现稳定的同行评审成功或跨领域泛化。
    分歧:
    - 人类交互模式不同：一些系统追求全自动，另一些把人类专家作为首席研究员或仪表板操作者。
    - 评测目标不同：模拟发现任务、科学机器学习基准改进、LLM评审评分、专家偏好判断和研讨会同行评审难以直接比较。
    - 改进机制不同：失败记忆、智能体树搜索、插件技能和角色化多智能体平台可能通过不同执行路径起作用。
    - 领域侧重不同：应用数学/理论、机器学习子领域和广泛模拟科学发现对代码执行、证明和实验设计有不同要求。
    - 对成功的实质存在分歧：一类诊断发现基准提升主要来自工程技巧而非研究洞察，而其他系统通过LLM或专家评审报告新颖性。
    开放问题:
    - 自动评审或LLM评分能否在窄接受阈值之外与人类科学判断对齐？
    - 多篇完全生成论文提交时，为什么同行评审结果不一致，如何降低方差？
    - 智能体能否从PDE任务、机器学习基准改进或小规模平台评估等现有案例迁移到未知科学领域和实验室实验？
    - 哪些改进反映真正领域洞察，而不是参数扫描、代码模板、已存储知识或工程技巧？
    - 若干高排名系统的代码、数据集、基线、局限性和可复现工件缺失情况如何，获得这些证据后结论是否会改变？
