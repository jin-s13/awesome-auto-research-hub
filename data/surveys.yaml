  related_work_outline_zh:
  - 主流方向：以LLM代理为核心，将文献综述拆解为检索、证据提取、结构化组织、写作与评审，生物医学/生命科学评估尤其突出。
  - 研究共性：都强调引用级证据和专家一致性，并普遍把文献综述视为需要数据库/搜索引擎编排、角色分工和评估约束的复合任务。
  - 关键差异：有的侧重实时文献数据库证据层，有的侧重多代理写作流程，有的侧重排行榜认证与公平比较；领域与基准覆盖也不同。
  - 趋势演进：从2024年CHIME类的层级组织支持，到2025年LiRA/IterSurvey迭代多代理生成，再到2026年EMBL AI Librarian与排行榜认证，演进集中在前沿期。
