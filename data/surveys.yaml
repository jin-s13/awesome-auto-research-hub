  related_work_outline_zh:
  - 主流方向：端到端自主科研智能体，将大模型构思、实验或代码执行、分析和论文生成串联起来，并逐渐加入自动验证与评审关卡。
  - 研究共性：科研发现被建模为迭代式智能体流程，并至少引入一种检查，例如逻辑审计、物理感知可视化验证、模拟同行评审或证据成熟度评分。
  - 关键差异：评测目标在论文接受、任务完成与证据成熟度之间不同；系统从领域专用验证器到通用自主智能体，从人类主导协作到完全自主不等。
  - 趋势演进：证据集中在2024-2026年前沿，从通用框架和基准环境走向智能体树搜索、工作坊级同行评审，以及带验证关卡的领域专用智能体。
