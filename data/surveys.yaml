  related_work_outline_zh:
  - 主流方向：端到端LLM多智能体系统，从想法生成、代码执行到论文草拟，并加入评审或验证循环作为把关。
  - 研究共性：模块化流水线把构思、实验、验证和写作分开；多篇论文通过检查失败运行、幻觉数字或物理无效结果来防止其进入手稿。
  - 关键差异：自主程度从完全自动到精准人机协作不同；验证方式从内部逻辑审计和LLM评分到领域特定的物理或视觉门控不同；成功标准包括基准分数、工件质量、盲审或工作坊同行评审接受。
  - 趋势演进：证据集中在2024–2026年，从通用自动发现框架和模拟评审，到智能体树搜索与首篇被接受的工作坊论文，再到领域感知验证、失败归因和人在环修正。
  - 开放问题：稳定的完整会议论文生成、自动评审与人类判断一致、跨领域验证、性能提升来源以及可复现性仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research paper generation, e.g. The AI Scientist
        and The AI Scientist-v2
      what_it_solves: Automates ideation, coding, experiment execution, visualization,
        manuscript drafting, and lightweight review into a single workflow.
      what_remains_open: 'Reliability and consistency: only one of three v2 manuscripts
        passed workshop peer review, and full conference acceptance is not shown.'
    - line: Domain-specific verified generation, e.g. ReasFlow and AI CFD Scientist
      what_it_solves: Couples paper generation to internal logical verification or
        physics-aware visual validation so domain-invalid results are filtered before
        manuscript writing.
      what_remains_open: Verification gates still miss some silent failures and may
        not transfer across applied mathematics, computational fluid dynamics, and
        beyond.
    - line: Human-AI collaborative research writing, e.g. AutoResearchClaw
      what_it_solves: Embeds human intervention at high-leverage decision points and
        uses verifiable result reporting to balance autonomy with expert oversight.
      what_remains_open: Optimal intervention modes are not standardized beyond the
        tested benchmark, and collaboration cost is not fully quantified.
    - line: Self-correcting failure attribution for research agents, e.g. SAGE
      what_it_solves: Diagnoses why experiments fail and routes corrections to hypothesis,
        experimental design, or implementation before grounded reporting.
      what_remains_open: Fully autonomous scientific writing remains difficult; blind
        scores stay constrained and gains concentrate in code execution rather than
        manuscript quality.
    - line: Failure-mode analysis and design principles, e.g. Why LLMs Aren't Scientists
        Yet
      what_it_solves: Documents recurring failures such as implementation drift, memory
        degradation, overexcitement, and weak scientific taste, then converts them
        into design guidance.
      what_remains_open: The proposed design principles lack broad empirical validation
        across domains and long-horizon research tasks.
    - line: Automated review and evaluation of generated manuscripts
      what_it_solves: Provides fast simulated review or vision-language feedback loops
        to score generated papers and improve figures before submission.
      what_remains_open: Alignment with expert human peer review is only approximated
        and tested in limited venues.
    consensus:
    - Autonomous research writing is typically decomposed into ideation, code or experiment
      execution, validation, and manuscript drafting stages.
    - A verification or reviewer loop is treated as necessary for filtering fabricated
      numbers, hallucinated citations, and invalid claims before manuscripts are accepted.
    - Fully autonomous systems are not yet reliable enough to replace human oversight;
      the strongest reported results include some targeted human intervention or external
      review.
    - Domain-aware checks, self-correction, and human collaboration improve measurable
      success relative to purely automatic baselines on reported benchmarks and reviews.
    - Current evidence does not show consistent generation of full conference-ready
      papers across domains.
    disagreements:
    - 'Autonomy level: some systems advocate full automation, while another result
      suggests targeted human collaboration at high-leverage decision points outperforms
      both full autonomy and exhaustive oversight.'
    - 'Validation evidence: internal logical audits, domain-specific physics or vision
      gates, multi-hypothesis failure attribution, and LLM/VLM review operate as different
      gates with distinct false-negative and leak risks.'
    - 'Evaluation outcome: benchmark success, artifact quality, blind score, LLM-review
      threshold, and actual workshop acceptance are not interchangeable and can lead
      to different rankings of system capability.'
    - 'Generalization scope: domain-general machine-learning writing pipelines differ
      from applied mathematics or computational fluid dynamics systems that modify
      source code and inspect rendered fields, with weak evidence of cross-domain
      transfer.'
    open_questions:
    - How well do automated review scores align with expert peer review outside narrow
      workshop settings?
    - Which verification gates generalize beyond applied mathematics and computational
      fluid dynamics to less verifiable research areas?
    - How should human intervention be positioned to maximize scientific quality per
      unit of expert time?
    - How much of the reported improvement comes from agentic scaffolding rather than
      the underlying model, environment, or reviewer?
    - Can these systems produce truly novel, defensible, and reproducible manuscripts
      instead of only acceptable-looking drafts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究论文生成，如 The AI Scientist、The AI Scientist-v2
      解决的问题: 把构思、编码、实验执行、可视化、手稿起草和轻量评审自动化到一个工作流中。
      尚未覆盖: 稳定性和一致性不足；v2三篇论文中仅一篇通过工作坊同行评审，完整会议发表尚未验证。
    - 路线: 领域特定验证生成，如 ReasFlow、AI CFD Scientist
      解决的问题: 将论文生成与内部逻辑验证或物理感知视觉验证耦合，在手稿写作前过滤领域无效结果。
      尚未覆盖: 验证门控仍会漏掉部分静默失败，跨应用数学、计算流体动力学及其他领域的迁移尚未证明。
    - 路线: 人机协作研究写作，如 AutoResearchClaw
      解决的问题: 在高杠杆决策点引入专家干预，并利用可验证结果报告平衡自主性与人工审查。
      尚未覆盖: 最优干预模式尚未在测试基准之外标准化，协作成本也未充分量化。
    - 路线: 面向研究代理的自我纠正失败归因，如 SAGE
      解决的问题: 诊断实验失败原因，并将修正路由到假设、实验设计或实现，再进入基于事实的汇报。
      尚未覆盖: 完全自主科学写作仍困难；盲审分数受限，增益集中在代码执行而非手稿质量。
    - 路线: 失败模式分析与设计原则，如 Why LLMs Aren't Scientists Yet
      解决的问题: 记录实现漂移、记忆退化、过度兴奋、科学品味弱等失败模式，并转化为系统设计原则。
      尚未覆盖: 这些设计原则缺少跨领域和长周期研究任务的广泛实证验证。
    - 路线: 自动评审与生成稿评估
      解决的问题: 提供快速模拟评审或视觉-语言反馈循环，对生成论文打分并在提交前改进图表。
      尚未覆盖: 与专家同行评审的一致性仅在有限场景中近似，覆盖范围和效度有限。
    共识:
    - 自主研究写作通常被分解为构思、代码或实验执行、验证和手稿起草等阶段。
    - 验证或评审循环被视为必要环节，用于在接收手稿前过滤伪造数字、幻觉引用和无效声明。
    - 完全自主系统尚不足以替代人类审查；报告中最强的结果仍包含某种有针对性的人工干预或外部评审。
    - 领域感知检查、自我纠正和人机协作在已报告的基准与评审中相比完全自动基线带来可测量提升。
    - 现有证据尚未显示能跨领域稳定生成完整会议级别的论文。
    分歧:
    - 自主程度：一些系统主张完全自动化，而另一项结果表明在高杠杆决策点进行精准人机协作优于完全自主和逐步监督。
    - 验证证据：内部逻辑审计、物理或视觉门控、多假设失败归因和LLM/VLM评审作为不同闸门运作，假阴性和漏检风险不同。
    - 成功度量：基准成功率、工件质量、盲审分数、LLM评审阈值和实际工作坊接受不可互换，可能导致不同的系统能力排序。
    - 泛化范围：通用机器学习写作流水线与修改源代码并检查渲染场的应用数学或计算流体动力学系统不同，跨领域迁移证据较弱。
    开放问题:
    - 自动评审分数在多大程度上与更广泛场景中的人类同行评审一致？
    - 哪些验证闸门能跨出应用数学和计算流体动力学，推广到难以验证的研究领域？
    - 如何配置人类干预才能在单位专家时间下最大化科学质量？
    - 报告的性能提升有多大程度来自智能体脚手架，而非底层模型、环境或评审器？
    - 这类系统能否产出真正新颖、可辩护且可复现的手稿，而不仅是看起来可接受的草稿？
