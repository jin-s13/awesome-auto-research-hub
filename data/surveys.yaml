  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Integrates ideation, code or experiment execution, result analysis,
        visualization, and manuscript generation into a single autonomous workflow
        with minimal human control.
      what_remains_open: Reliability across repeated runs, breadth beyond demonstrated
        domains, and achieving full conference-level scientific validity beyond isolated
        workshop acceptance.
    - line: Domain-aware verification-gated discovery
      what_it_solves: Grounds autonomous discovery in domain-specific validity checks
        such as logical/theoretical verification or physics-aware visual inspection
        to catch silent failures.
      what_remains_open: Verification gates still miss some silent failures, and domain-specific
        assumptions may not transfer to other scientific domains.
    - line: Evidence-grounded evaluation and benchmark environments
      what_it_solves: Provides tasks, frozen data, and metrics for comparing discovery
        agents on complete cycles rather than reproducing hidden target studies or
        relying only on generated-paper review.
      what_remains_open: Coverage across scientific domains, generalizability across
        base models, and alignment between proxy metrics and real scientific decision
        utility.
    - line: Automated review and manuscript assessment
      what_it_solves: Scales evaluation of generated manuscripts through simulated
        review, LLM-based rubrics, or evidence-maturity scoring without requiring
        full human peer review at every iteration.
      what_remains_open: Whether automated reviewers can separate polished text from
        evidentiary rigor, novelty, and sound limitations, and whether their scores
        predict genuine discovery.
    consensus:
    - Autonomous discovery systems commonly combine ideation, execution, analysis,
      and writing, with an automated evaluation or verification stage used to judge
      output quality.
    - Current agents are comparatively strong at executing and documenting analyses,
      but weak on controls, robustness, falsifiability, and cross-dataset generalization.
    - Benchmarks and automated review are treated as necessary infrastructure because
      real peer review and human validation do not scale to iterative open-ended discovery.
    disagreements:
    - 'Evaluation targets differ: closed virtual discovery tasks, blind evidence-grounded
      tasks, LLM-generated paper review, or actual workshop peer review.'
    - 'Validation strategies differ: generic LLM or simulated review versus domain-specific
      verification such as internal logical validation or vision-language physical
      plausibility checks.'
    - 'Deployment settings differ: general machine-learning research workflows versus
      specialized applied mathematics or computational fluid dynamics toolchains.'
    - 'Success signals differ: task completion and rubric scores versus physical metric
      improvement or peer-review acceptance.'
    open_questions:
    - Which verification mechanisms generalize beyond a single scientific domain and
      remain effective on silent failures not included in planted ablations?
