  literature_review:
    line_of_work_matrix:
    - line: Fully automated end-to-end discovery pipelines
      what_it_solves: Minimizing human effort by automating the complete research
        cycle from idea generation to paper writing, using LLM-driven code generation,
        experiment execution, and automated reviewing.
      what_remains_open: Generated papers still show inconsistent quality and often
        fail real peer review; the approach generalizes poorly beyond machine learning
        tasks and lacks deep domain verification.
    - line: Domain-specific AI scientists with built-in verification
      what_it_solves: Ensuring correctness in specialized fields (applied mathematics,
        computational fluid dynamics) by embedding internal logic checks, knowledge
        retrieval, or vision-based physics verification directly in the workflow.
      what_remains_open: Verification gates are not exhaustive (e.g., missed silent
        failures in CFD), and transferring these mechanisms to new domains requires
        substantial redesign of the verification logic.
    - line: Multi-agent and human-in-the-loop collaborative frameworks
      what_it_solves: Balancing autonomy and reliability by structuring agent debates,
        self-healing execution loops, and defining multiple human intervention modes
        to catch errors at high-leverage decision points.
      what_remains_open: The optimal level and timing of human involvement remain
        unclear; excessive oversight can negate efficiency gains, while too little
        may allow fabricated results.
    - line: Benchmarks and evaluation environments for AI scientists
      what_it_solves: Providing standardized tasks and metrics to compare AI scientist
        systems across diverse scientific discovery scenarios, including simulated
        environments and real-world omics data.
      what_remains_open: Current benchmarks either use synthetic tasks that may not
        reflect real scientific novelty or focus on narrow domains; the link between
        benchmark scores and genuine scientific contribution is unproven.
    consensus:
    - Large language models serve as the core reasoning and planning engine across
      all proposed systems.
    - Every system includes a component for automated experimentation and code execution,
      with results feeding back into the writing stage.
    - Error detection and verification are recognized as critical, whether through
      internal logic loops, physical plausibility checks, or structured result validation.
    - Automated paper writing is a standard final output, but the quality assessment
      remains a challenge and is often delegated to simulated or real reviewers.
    disagreements:
    - 'Full autonomy versus human-in-the-loop: one group aims to eliminate human intervention
      entirely, while another argues that targeted human collaboration at decision
      points yields higher-quality results.'
    - 'General-purpose versus domain-specific architecture: some systems are designed
      for broad ML subfields, whereas others embed domain knowledge and physics-aware
      verification for a single scientific discipline.'
    - 'Verification strategy: some rely on internal logical self-consistency checks,
      others use vision-language models to inspect rendered outputs, and still others
      enforce verifiable numeric reporting with cross-run evolution.'
    - 'Evaluation methodology: works differ in using simulated automated reviewers,
      real workshop peer review, or task-completion benchmarks with human baselines,
      making direct comparison difficult.'
    open_questions:
