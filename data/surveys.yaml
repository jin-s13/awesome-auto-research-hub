  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: Converting an open scientific goal into ideation, code or derivation,
        experiment execution, result analysis, and a paper draft with reduced human
        intervention.
      what_remains_open: Acceptance remains rare and unstable; long-horizon memory,
        implementation drift, and scientific taste still limit autonomous runs.
    - line: Domain-specific validity and verification gating
      what_it_solves: Adding checks such as logical coherence, physics-based visual
        inspection, or verifiable measured-result reporting to prevent silent failures
        and hallucinated outputs.
      what_remains_open: Verification gates still miss some planted failures and do
        not guarantee claims generalize beyond the tested domain.
    - line: Self-correction and failure attribution
      what_it_solves: Diagnosing why an autonomous run failed and routing interventions
        to the hypothesis, experimental design, or implementation level.
      what_remains_open: Evidence depends on limited benchmark topics; producing fully
        conference-ready or journal-ready papers remains unsolved.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Finding high-leverage human oversight points between full autonomy
        and exhaustive step-by-step supervision.
      what_remains_open: Optimal intervention granularity is not standardized across
        different scientific workflows or domains.
    - line: Evaluation and evidence design for generated research
      what_it_solves: Comparing systems through rubric scores, peer-review outcomes,
        benchmark success rates, artifact quality, and planted failure cases.
      what_remains_open: Proxy rubrics and small topic sets may not align with human
        peer review or long-term scientific utility.
    consensus:
    - Autonomous scientific writing is framed as a pipeline spanning ideation, execution,
      verification, and manuscript generation rather than as isolated language generation.
    - Verification or grounded reporting is treated as necessary because raw LLM outputs
      can fabricate numbers, citations, or success claims.
    - Systems converge on modular multi-agent decomposition, decision loops, or both
      instead of relying on a single monolithic LLM call.
    - Even when systems target autonomy, human review or human-in-the-loop checkpoints
      remain important for final judgment or high-leverage decisions.
    disagreements:
    - 'Evaluation target differs: some use LLM-based rubrics, some use peer-review
      outcomes, some use benchmark success metrics, and some use planted silent failures
      for verification.'
    - 'Interaction mode differs: full autonomy, principal-investigator/student collaboration,
      targeted high-leverage human intervention, or multi-mode oversight.'
    - 'Verification type differs: logical theorem coherence checking, vision-language
      physical field inspection, grounded measured-result reporting, or multi-hypothesis
      causal failure attribution.'
    - 'Domain scope differs: applied mathematics, computational fluid dynamics, and
      machine learning experiments impose different execution, baseline, and validity
      requirements.'
    - 'Reproducibility signals differ: some works offer code or artifact links, while
      others have weak or absent repository evidence; this is a verification gap rather
      than proof of missing implementation.'
    open_questions:
    - Can any system reliably produce peer-review-ready conference or journal papers
      beyond isolated workshop acceptance or rubric-based success?
    - How should verification gates be evaluated across fields, and what failure modes
      remain when gates miss planted silent failures?
    - What is the right granularity and timing of human intervention to improve research
      quality without negating autonomy?
    - Do LLM-based review rubrics and benchmark scores align with human peer-review
      judgment and long-term scientific utility?
    - Are current gains attributable to better agent design, stronger base models,
      domain-specific constraints, or benchmark selection effects?
    - Several top-ranked papers lack OpenAlex identifiers or citation edges, and some
      lack code or dataset artifacts, so citation and reproducibility evidence remains
      incomplete.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究与论文生成
      解决的问题: 把开放科学目标转化为构思、代码或推导、实验执行、结果分析和论文草稿，减少人工干预。
      尚未覆盖: 成功接收仍罕见且不稳定；长程记忆、实现漂移和科学品味仍限制自主运行。
    - 路线: 领域特定有效性与验证门控
      解决的问题: 通过逻辑一致性、物理视觉检查或可验证实测结果报告，防止静默失败和幻觉输出。
      尚未覆盖: 验证门控仍会漏掉部分植入失败，不能保证主张在测试领域之外泛化。
    - 路线: 自我纠正与失败归因
      解决的问题: 诊断自主运行失败原因，并把修复指向假设、实验设计或实现层。
      尚未覆盖: 证据依赖有限基准主题；生成完全符合会议或期刊要求的论文仍未解决。
    - 路线: 人机协作与干预设计
      解决的问题: 在完全自主与逐步监督之间找到高杠杆人工干预点。
      尚未覆盖: 不同科学工作流或领域中的最优干预粒度尚未标准化。
    - 路线: 生成研究评测与证据设计
      解决的问题: 通过评分标准、同行评审结果、基准成功率、工件质量和植入失败案例比较系统。
      尚未覆盖: 代理评分标准和小型主题集可能不等同于人类同行评审或长期科学效用。
    共识:
    - 自主科学写作被构造为覆盖构思、执行、验证和论文生成的流水线，而不是孤立的文本生成问题。
    - 验证或基于事实的报告被看作必要环节，因为原始 LLM 输出可能虚构数字、引用或成功声明。
    - 系统普遍采用模块化多智能体分解、决策循环或两者组合，而非依赖单次 LLM 调用。
    - 即使系统追求自主，最终判断或高杠杆决策点仍保留人类评审或人机回路。
    分歧:
    - 评测目标不同：有的采用 LLM 评审标准，有的采用同行评审结果，有的采用基准成功率，有的采用植入静默失败进行验证。
    - 交互方式不同：完全自主、首席研究员/研究生式协作、高杠杆人工干预或多模式监督并存。
    - 验证类型不同：逻辑定理连贯性检查、视觉-语言物理场检查、实测结果事实报告或多假设因果失败归因。
    - 领域范围不同：应用数学、计算流体力学和机器学习实验对执行环境、基线和有效性有不同要求。
    - 可复现信号不同：部分工作提供代码或工件链接，部分证据较弱或缺失；这是验证缺口，不能证明没有实现。
    开放问题:
    - 系统能否稳定产出真正可投稿的会议或期刊论文，而不只是孤立的工作坊接收或评分标准成功？
    - 验证门控在不同领域的覆盖范围如何，漏检静默失败时的失败模式仍未被系统刻画。
    - 何种人工干预粒度和时机能在不牺牲自主性下提升论文质量？
    - LLM 评审评分和基准分数是否与人类同行评审判断及长期科学效用一致？
    - 当前增益有多少来自更好的智能体设计、更强基础模型、领域约束或基准选择效应？
    - 多篇高排名论文缺少 OpenAlex 标识符或引用边，部分缺少代码或数据工件，因此引用和可复现证据不完整。
