  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation pipelines
      what_it_solves: Producing ready-to-submit research artifacts—ideas, code, experiments,
        visualizations, and papers—from lightweight prompts, reducing writing and
        experimental cost.
      what_remains_open: Consistent acceptance beyond workshop or single-domain demonstrations
        and robustness to silent failures in long-horizon execution.
    - line: Verification, self-correction, and failure attribution loops
      what_it_solves: Catching logical, empirical, or hallucinated claims before final
        manuscript output via review gates, failure attribution, and grounded reporting.
      what_remains_open: Root-cause coverage and missed-failure rates, especially
        across visual, mathematical, and domain-specific evidence.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Injecting expert judgment at high-leverage decision points to
        improve research quality and credibility over full autonomy.
      what_remains_open: Optimal intervention granularity, human burden, and transfer
        across domains and tasks.
    - line: Automated review and evaluation for generated papers
      what_it_solves: Scaling review and scoring of AI-generated papers through simulated
        reviewers or peer-review proxies.
      what_remains_open: Whether automated review scores predict human acceptance
        and long-term scientific value.
    - line: Domain-specific AI scientists with grounded scientific writing
      what_it_solves: Generating papers whose claims are tied to domain-validated
        results, such as theorem verification or physics-aware CFD checks.
      what_remains_open: Generalization beyond built-in verification environments
        and coverage of planted or silent failures.
    consensus:
    - End-to-end systems now include manuscript drafting, automated review, and some
      form of verification rather than only experiment execution.
    - Multi-agent decomposition and internal validation loops are used to improve
      the credibility of generated scientific claims and reporting.
    - Generated papers can reach or approximate acceptance thresholds under automated
      review or workshop peer review, but consistency remains limited.
    - Human-AI collaboration is often framed as PI-agent collaboration or targeted
      intervention, not necessarily full autonomy.
    - Code and repository artifacts are increasingly used to support reproducibility,
      though several papers omit complete limitation details.
    disagreements:
    - 'Verification signals differ: logical coherence audits, physics-aware visual
      gates, multi-hypothesis failure attribution, structured debate, and self-healing
      execution.'
    - 'Interaction mode differs: full autonomy with simulated review versus targeted
      human intervention at high-leverage points versus PI-agent collaboration.'
    - 'Evaluation target differs: LLM-based rubrics, workshop peer review, experiment-stage
      benchmarks, blind scores, and domain-specific metrics are used separately.'
    - 'Domain focus differs: generic machine learning subfields, applied mathematics,
      computational fluid dynamics, and multi-domain experiment benchmarks.'
    - 'Reporting guarantees differ: some systems constrain claims to measured values
      or verified citations, while others lack visible limitation evidence.'
    open_questions:
