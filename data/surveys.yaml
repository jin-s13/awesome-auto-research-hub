  - 主流方向：构建多智能体自主科学发现流水线，通过文献/数据分析、代码执行和实验设计迭代生成、修正并验证假设。
  - 研究共性：假设生成嵌在“文献证据—结构化构思/搜索—工具执行—反馈—可追溯报告”循环中，人类介入集中在关键决策点。
