  - 研究共性：将科学实验分解为智能体阶段，并通过内部验证、树搜索、多智能体角色、共享记忆或基准任务提升计划-执行-报告质量。
  - 关键差异：目标范围不同，包括完整论文生成、消融规划、虚拟发现任务或交互式研究平台；评测方式涵盖LLM评审、专家偏好、任务完成和同行评审提交。
  - 趋势演进：在2023–2026前沿窗口内，从2024年首个全自动框架和发现基准，演进到2025年工作坊级同行评审，再到2026年更交互、知识感知的多智能体系统。
  - 开放问题：跨未见领域可靠性、自动化代理指标与人类科学效用的一致性、架构相对基座模型或任务脚手架的贡献、以及外部验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end discovery and manuscript generation
      what_it_solves: Automating idea generation, code/experiment execution, analysis,
        and paper writing with automated review or verification.
      what_remains_open: Consistency across multiple runs and domains remains low;
        evidence mainly shows one workshop-level acceptance or small generated-paper
        evaluations, with several limitation fields empty.
    - line: Virtual environments and benchmarks for experiment planning
      what_it_solves: Making hypothesis formation, experiment design, and ablation
        planning comparable through structured tasks and automatic metrics.
      what_remains_open: Proxy metrics and virtual tasks do not yet align with real
        research utility; best language models still identify only 45% of original
        ablations, below human level.
    - line: Multi-agent orchestration, tool harnesses, and interactive monitoring
      what_it_solves: Turning isolated research agent ideas into runnable stacks with
        customizable roles, code/dataset/checkpoint integration, dashboards, rollback,
        and resume.
      what_remains_open: Validation is limited to small internal AI case studies;
        external reproducibility across hardware, domains, and user settings is not
        yet established.
    - line: Failure-aware memory and knowledge accumulation
      what_it_solves: Recording failed attempts as bounded, reusable knowledge to
        improve same-task retry and cross-task generalization while reducing token
        use.
      what_remains_open: Shown mainly on ScienceAgentBench and PDE tasks; broader
        failure types, noisy or multi-modal lab failures, and longer-horizon research
        cycles remain unverified.
    consensus:
    - Most work divides the research loop into hypothesis, experiment, analysis, and
      reporting phases, with agents handling multiple phases under automated or human
      judgment.
    - 'Structured control matters: verification loops, tree search, role-based orchestration,
      harness integration, or failure memory are added to improve vanilla agent performance.'
    - Automated evaluation proxies are widely used, including LLM reviewers, expert
      judges, task completion metrics, and ablation recall.
    - Several systems provide code, datasets, or environments, enabling benchmark
      reuse, but external validation remains narrow.
    disagreements:
    - Scope differs between full scientific manuscript generation and narrower experiment
      or ablation planning tasks.
    - 'Evaluation contexts differ: simulated virtual discovery tasks, internal AI
      case studies, benchmark suites, and workshop peer-review submission.'
    - 'Interaction modes differ: fully autonomous pipelines, human-in-the-loop principal
      investigator/graduate student framing, and interactive dashboards with rollback/resume.'
    - 'Experience representation differs: some store failure-aware shared memory;
      others rely on tree search, verification, or one-shot generation without persistent
      negative knowledge.'
    - 'Success signals differ: acceptance thresholds and LLM review scores versus
      task completion, expert preference, token efficiency, or ablation recall.'
    open_questions:
    - Do reported successes transfer to unseen scientific domains, lab experiments,
      or longer multi-week research cycles?
    - Are automated reviewers and LLM judges sufficiently aligned with human peer
      review and real scientific utility?
    - How much of improvement is due to agent architecture, memory, or tree search
      rather than base model capability or task-specific scaffolds?
    - Can systems achieve reliable multi-trial performance, given evidence of one-of-three
      workshop acceptance and 45% ablation recall?
    - What failure modes remain unreported where limitation fields are absent, especially
      for end-to-end generation and failure-memory systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端发现与论文生成
      解决的问题: 自动化想法生成、代码/实验执行、分析和论文写作，并加入自动评审或验证。
      尚未覆盖: 多次运行和跨领域一致性较低；证据主要是一次工作坊接收或小规模生成论文评估，部分局限性字段缺失。
    - 路线: 实验规划虚拟环境与基准
      解决的问题: 通过结构化任务和自动指标，让假设形成、实验设计和消融规划可比较。
      尚未覆盖: 代理指标和虚拟任务尚未与真实研究效用对齐；最佳语言模型仍仅识别45%的原始消融，低于人类水平。
    - 路线: 多智能体编排、工具链与交互监控
      解决的问题: 将孤立的智能体研究想法转化为可运行系统，支持自定义角色、代码/数据/检查点集成、仪表板、回滚与恢复。
      尚未覆盖: 验证主要限于少量内部AI案例；跨硬件、领域和用户设置的外部可复现性尚未建立。
    - 路线: 失败感知记忆与知识积累
      解决的问题: 将失败尝试记录为有界可复用知识，改善同任务重试和跨任务泛化，同时降低令牌使用。
      尚未覆盖: 主要在 ScienceAgentBench 和 PDE 任务上展示；更广泛的失败类型、实验室噪声失败和更长研究周期仍未验证。
    共识:
    - 多数工作把研究循环分解为假设、实验、分析和报告阶段，由智能体在自动或人类判断下完成多个阶段。
    - 结构化控制很重要：通过验证循环、树搜索、角色编排、工具链集成或失败记忆来提升普通智能体的表现。
    - 广泛使用自动评测代理，包括 LLM 评审、专家偏好、任务完成指标和消融召回率。
    - 部分系统提供代码、数据集或环境，便于基准复用，但外部验证仍较窄。
    分歧:
    - 范围不同：有的是完整论文生成，有的是更窄的实验或消融规划。
    - 评测环境不同：模拟虚拟发现任务、内部AI案例、基准套件和工作坊同行评审提交并存。
    - 交互模式不同：全自动流水线、人机首席研究员/研究生协作，以及带仪表板和回滚/恢复的交互式平台。
    - 经验表示不同：有的存储失败感知共享记忆，有的依赖树搜索、验证或单次生成，而不保留持续性负知识。
    - 成功信号不同：接收阈值和 LLM 评审分数，相对任务完成、专家偏好、令牌效率或消融召回。
    开放问题:
    - 当前成果能否迁移到未见科学领域、实验室实验或更长的多周研究周期？
    - 自动化评审器和 LLM 评委是否与人类同行评审及真实科学效用对齐？
    - 改进有多少来自智能体架构、记忆或树搜索，而不是基座模型能力或任务特定脚手架？
    - 系统能否实现可靠的多试验表现？已有证据包括三份提交中一份被接收，以及45%的消融召回率。
    - 在局限性字段缺失的情况下，还有哪些未被报告的失败模式？
