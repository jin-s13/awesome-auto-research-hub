  related_work_outline_zh:
  - 主流方向：端到端LLM智能体系统，将科研构思、实验或推导、分析和论文生成耦合，近期领域化系统在接收结论前加入逻辑或物理感知验证门控。
  - 研究共性：自动化完整发现循环后再用另一模型、基准或领域门控进行校验；强调减少专家介入但保留一定人工监督或评审。
