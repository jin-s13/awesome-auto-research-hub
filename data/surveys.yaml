    or evaluable feedback, and retain traces or reports to improve later rounds; structured
    memory and reporting are common.'
  - 'Key differences: Human involvement ranges from targeted high-leverage collaboration
    to near-full autonomy; search structures include tree branching/backtracking,
    evolutionary ideation, and linear cycles; evaluation targets span biology, equation
    discovery, forecasting architectures, optimization, and driving.'
  - 'Trend evolution: In 2025 the evidence emphasizes surveys and domain-specific
    agents; by 2026 it shifts toward stronger control, verifiable reporting, human-in-the-loop
    modes, and harder benchmarks while still within a narrow frontier.'
  - 'Open questions: Accuracy of generated reports, scaling beyond tested cycles,
    cross-domain robustness, reproducibility, and whether benchmark gains correspond
    to real scientific utility.'
