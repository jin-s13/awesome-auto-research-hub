  related_work_outline:
  - 'Mainstream direction: Closed-loop autonomous research agents that generate hypotheses/ideas,
    execute experiments, validate results, and report findings are the dominant frame;
    2026 work adds domain-aware verification and targeted human oversight.'
  - 'Shared research pattern: Systems couple LLM-driven ideation with an execution
    or formalization stage, then apply a verification/reporting gate to reject hallucinations,
    silent failures, or ungrounded claims.'
  - 'Key differences: Work diverges on verification mechanism, autonomy level, domain
    specificity, interaction mode, and evaluation target: formal proofs versus physics/vision
    checks versus benchmark success.'
  - 'Trend evolution: The evidence is concentrated in 2025-2026, moving from surveys
    and domain benchmarks toward self-correcting, formally grounded, and human-collaborative
    pipelines; within this frontier, reliability is the axis of change.'
  - 'Open questions: Generalization beyond narrow case studies, semantic gap between
    formal/automated checks and intended discoveries, optimal human intervention granularity,
    and whether current benchmarks predict useful novel hypotheses.'
  related_work_outline_zh:
  - 主流方向：构建闭环自主研究智能体，让系统提出假设或研究方向、执行实验、验证结果并报告发现；2026年工作更强调领域感知验证和有针对性的人类监督。
  - 研究共性：系统通常将大模型驱动的构思与执行或形式化阶段耦合，再通过验证或报告门控来抑制幻觉、静默失败或无依据的主张。
  - 关键差异：差异体现在验证机制、自主程度、领域专精度、交互模式和评测目标，例如形式化证明、物理/视觉检查、基准成功率等不同选择。
  - 趋势演进：证据集中在2025至2026年，从综述和领域基准，逐步走向自纠正、形式化基础和人类协作流水线；在当前前沿内，可靠性是演化的主要轴线。
  - 开放问题：如何从狭窄案例泛化到更广泛场景、形式化或自动检查与真正科学发现之间的语义差距、最优人类干预粒度，以及现有基准能否预测有价值的新假设。
  literature_review:
    line_of_work_matrix:
    - line: Closed-loop autonomous research agents
      what_it_solves: Turns literature-grounded or observation-grounded ideation into
        testable hypotheses, executes experiments, and refines directions from execution
        feedback.
      what_remains_open: Autonomous scientific writing and conference-ready arguments
        remain unreliable; verification gates can miss planted silent failures.
    - line: Human-in-the-loop research orchestration
      what_it_solves: Allows customizable roles, monitoring, rollback/resume, and
        targeted human intervention at high-leverage decision points instead of full
        autonomy or exhaustive oversight.
      what_remains_open: Optimal intervention granularity and external validity are
        uncertain; evaluations are limited to internal AI case studies or few intervention
        modes.
    - line: Domain-aware and formal verification
      what_it_solves: Uses machine-checked proofs, physics-aware visual inspection,
        or statement audits to reduce hallucinated results and invalid proposals in
        causal, CFD, or biological domains.
      what_remains_open: Machine-checked correctness does not guarantee faithful capture
        of the intended scientific claim; domain-specific gates are not universal
        and still miss failure modes.
    - line: Evaluation and benchmarking
      what_it_solves: Provides tasks, baselines, human performance references, and
        judge-based comparisons for cell annotation, discovery questions, and research
        case studies.
      what_remains_open: Benchmarks cover limited domains and may not reflect long-run
        discovery utility; human baselines are small or expert-specific.
    - line: Self-improving and failure-attribution frameworks
      what_it_solves: Recovers from failed experiments by generating multiple evidence-grounded
        failure explanations, routing corrective interventions, and accumulating knowledge
        across cycles.
      what_remains_open: Root-cause diagnosis and intervention routing are still vulnerable
        to wrong attribution; long-term reliability and fully autonomous writing remain
        unresolved.
    - line: Survey and conceptual organization
      what_it_solves: Organizes agentic scientific discovery systems by domain, capability,
        metrics, frameworks, and challenges to reveal bottlenecks and future directions.
      what_remains_open: The categories are descriptive rather than empirically validated
        as predictors of system behavior or discovery quality.
    consensus:
    - Hypothesis generation is treated as one stage in a larger research loop requiring
      execution, validation, and reporting rather than as isolated ideation.
    - Human collaboration or oversight remains necessary at decision points, artifact
      inspection, or final claim auditing, even in highly autonomous frameworks.
    - Verification and grounded reporting mechanisms are needed to prevent fabricated
      numbers, hallucinated citations, and silent experimental failures.
    - Evaluation increasingly compares systems on benchmarks with baselines, ablation
      settings, or human/judge references rather than on demonstration alone.
    - Domain-specific constraints and verification improve the defensibility of generated
      hypotheses relative to general-purpose pipelines.
    disagreements:
    - 'Verification mechanism differs: formal machine-checked proof, physics-aware
      rendered flow inspection, grounded metric reporting, or statement audit are
      used as alternative validity gates.'
    - 'Autonomy target differs: some systems push for self-improving full autonomy,
      while others argue targeted human collaboration at high-leverage points outperforms
      exhaustive or no oversight.'
    - 'Evaluation setting differs: domain-specific omics or CFD tasks, general science/engineering
      benchmarks, and internal AI expert case studies are not directly comparable.'
    - 'Representation of success differs: proof artifacts, benchmark score gains,
      expert preference, metric-bearing outputs, or domain error reduction are optimized
      depending on the system.'
    - 'Interaction mode differs: single autonomous pipeline, self-healing executor,
      customizable multi-agent team, or formal proof-assisted workflow reflect different
      assumptions about who controls the research loop.'
    open_questions:
    - Can closed-loop hypothesis generators generalize beyond the narrow domains and
      case studies used in current evaluations?
    - How can automated verification gates distinguish formally or superficially valid
      outputs from claims that are scientifically meaningful?
    - What granularity of human intervention best balances reliability, autonomy,
      and scalability in hypothesis research?
    - Do current benchmarks for AI scientists predict novel discovery or only task
      completion and artifact quality?
    - How should silent failure detection be evaluated when the detection gate itself
      can miss planted failures?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 闭环自主研究智能体
      解决的问题: 将来自文献或观察的构思转化为可检验假设，执行实验，并根据执行反馈调整研究方向。
      尚未覆盖: 自主科学写作和会议级论证仍不可靠；验证门控可能遗漏植入的静默失败。
    - 路线: 人在回路的研究编排
      解决的问题: 支持自定义角色、监控、回滚/恢复，以及在高杠杆决策点进行精准人类干预，避免完全自主或逐步监管。
      尚未覆盖: 最优干预粒度和外部有效性尚不明确；评估仅来自内部AI案例或少量干预模式。
    - 路线: 领域感知与形式化验证
      解决的问题: 利用机器检查证明、物理感知视觉检查或陈述审计，减少因果推断、CFD或生物学领域中的幻觉结果和无效提案。
      尚未覆盖: 机器检查只保证形式化假设下的正确性，不保证忠实反映预期科学主张；领域门控不通用且仍会漏检。
    - 路线: 评测与基准构建
      解决的问题: 为细胞注释、发现问答和研究案例提供任务、基线、人类表现参考及评委比较，使AI科学家的能力可对比。
      尚未覆盖: 基准覆盖领域有限，未必反映长期发现效用；人类基线规模较小或仅限于特定专家。
    - 路线: 自改进与失败归因框架
      解决的问题: 通过生成多个基于证据的失败解释、路由纠正干预，以及跨周期积累知识，从失败实验中恢复。
      尚未覆盖: 根因诊断和干预路由仍可能错误归因；长期可靠性和完全自主写作仍未解决。
    - 路线: 综述与概念组织
      解决的问题: 按领域、能力、指标、框架和挑战组织智能体科学发现系统，以揭示瓶颈和未来方向。
      尚未覆盖: 这些分类仍是描述性的，未经验证能否预测系统行为或发现质量。
    共识:
    - 假设生成被视为更大研究闭环中的一个阶段，必须包含执行、验证和报告，而非孤立构思。
    - 即使在高度自主的框架中，人类协作或监督在决策点、工件检查或最终声明审计中仍然必要。
    - 需要验证和基于事实的报告机制，以防止伪造数字、幻觉引用和静默实验失败。
    - 评测越来越多地通过基准、基线、消融设置或人类/评委参考进行比较，而非仅靠演示。
    - 领域特定约束和验证比通用流水线更能提升生成假设的可辩护性。
    分歧:
    - 验证机制不同：形式化机器检查证明、物理感知渲染流检查、基于事实的指标报告或陈述审计被用作不同的有效性门控。
    - 自主目标不同：一些系统追求自改进的完全自主，另一些则认为在高杠杆点进行精准人类协作优于无监督或逐步监督。
