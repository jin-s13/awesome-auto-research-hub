  related_work_outline:
  - 'Mainstream direction: Multi-agent LLM systems with iterative refinement and verification
    are the dominant paradigm for automating literature review generation and literature-informed
    scientific discovery.'
  - 'Shared research pattern: Modular agents simulate scholarly roles, integrating
    retrieval-augmented knowledge bases and internal or external feedback loops to
    improve output quality and factual grounding.'
  - 'Key differences: Work varies in task scope—from autonomous full survey generation
    to embedded literature synthesis within broader discovery pipelines—and in evaluation
    strategy, alternating between LLM-based rubric scoring and human-baseline benchmarking.'
  - 'Trend evolution: Across 2023–2026, the frontier moved from isolated survey generation
    (ARISE, 2025) and domain-specific evaluation (BAISBench, 2025) toward integrated
    scientific discovery systems (ReasFlow, EvoMaster, 2026) that treat literature
    intelligence as a component, with growing emphasis on self-evolution and verification.'
  - 'Open questions: Assessing the critical depth and novelty of synthesized literature,
    closing the gap between proxy metrics and real-world research utility, handling
    cross-disciplinary contradictions, and ensuring long-horizon reliability without
    human intervention.'
  related_work_outline_zh:
  - 主流方向：多智能体大语言模型系统结合迭代优化与验证，是自动化文献综述生成和文献驱动科学发现的主导范式。
  - 研究共性：模块化智能体模拟学术角色，集成检索增强知识库，通过内部或外部反馈循环提升输出质量和事实依据。
  - 关键差异：任务范围从端到端综述生成到嵌入更广泛发现流程的文献综合各有不同；评估策略在基于LLM的评分准则和基于人类基线的基准测试之间交替。
  - 趋势演进：2023–2026年间，前沿从独立的综述生成（ARISE，2025）和领域特定评估（BAISBench，2025）转向将文献智能作为组件的集成科学发现系统（ReasFlow、EvoMaster，2026），并更强调自我演化和验证。
  - 开放问题：评估合成文献的批判性深度与原创性，弥合代理指标与真实科研效用之间的差距，处理跨学科矛盾，确保长期无人工干预的可靠性。
  literature_review:
    line_of_work_matrix:
    - line: Automated survey generation systems
      what_it_solves: Produces structured, comprehensive academic surveys by coordinating
        specialized agents for topic expansion, citation curation, summarization,
        and iterative review, substantially reducing expert time.
      what_remains_open: Critical depth, original insight, and avoidance of hallucinated
        references remain unverified; the rubrics used for self-evaluation have not
        been shown to correlate with genuine peer review outcomes.
    - line: Literature retrieval and synthesis for scientific discovery
      what_it_solves: Integrates literature search, knowledge extraction, and synthesis
        into multi-agent discovery pipelines, enabling hypothesis generation and experimental
        design grounded in prior work.
      what_remains_open: Handling noise, contradictions across fields, and coverage
        of non-English or grey literature; the contribution of the literature synthesis
        component versus the planning or execution agents is not isolated.
    - line: Evaluation and benchmarking for literature intelligence
      what_it_solves: Provides standardized tasks and metrics—such as multiple-choice
        questions from published studies or rubric-based quality scores—to compare
        literature-aware AI systems.
      what_remains_open: Task alignment with real-world research discovery, the reproducibility
        of human baselines, and the gap between superficial literature comprehension
        and actionable scientific insight.
    - line: Failure analysis and robustness in autonomous literature work
      what_it_solves: Identifies recurring failure modes—bias toward training defaults,
        memory degradation, overexcitement, weak scientific taste—in AI systems that
        perform literature review or research paper generation.
      what_remains_open: Quantitative metrics for domain intelligence and scientific
        taste, and validation that proposed design principles reliably reduce failures
        across diverse domains and long-horizon tasks.
    consensus:
    - Multi-agent architectures are the dominant approach for decomposing literature-related
      tasks such as searching, summarizing, and drafting.
    - Iterative feedback loops—through rubric-guided review, internal verification,
      or self-critique—are considered essential for improving factual accuracy and
      scholarly quality.
    - Literature review automation remains a significant open challenge; current systems
      are not reliable enough for fully autonomous use.
    - Integrating domain-specific knowledge bases and retrieval mechanisms is critical
      for reducing errors and grounding generated content.
    - Current evaluation relies heavily on LLM-based judges or constrained benchmarks;
      there is no agreed-upon standard for measuring literature intelligence.
    disagreements:
    - 'Task scope: some systems target complete survey generation from scratch, while
      others embed literature synthesis as a sub-module within broader scientific
      discovery pipelines.'
    - 'Evaluation strategy: one line uses behaviorally anchored rubrics scored by
      LLM reviewers, another uses human-baseline benchmarks with multiple-choice questions
      from published studies, and a third relies on end-to-end success rates of research
      paper generation.'
    - 'Domain specificity: systems like ReasFlow are designed for a single discipline
      (applied mathematics), whereas ARISE and EvoMaster claim domain-agnostic operation,
      leading to differing assumptions about the need for curated knowledge bases.'
    - 'Human–AI interaction: designs range from principal investigator–graduate student
      collaboration to fully autonomous operation, reflecting divergent views on where
      human judgment is necessary and how responsibility is allocated.'
    open_questions:
    - How can the critical depth and original insight of automatically generated literature
      reviews be measured beyond surface-level rubric scores?
    - Do current benchmarks for literature intelligence capture the complexity of
      real-world research discovery, or are they rewarding shallow pattern matching?
    - What mechanisms can reliably resolve contradictions and detect biases across
      a large, cross-disciplinary body of literature?
    - How can long-horizon robustness and scientific taste be quantified and improved
      in autonomous literature systems?
    - There is no evidence of longitudinal studies assessing whether these tools improve
      researcher productivity or the quality of human-written literature reviews.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动化综述生成系统
      解决的问题: 通过协调主题扩展、引文管理、总结和迭代评审等专用智能体，生成结构化、全面的学术综述，大幅减少专家耗时。
      尚未覆盖: 批判性深度、原创见解及避免虚假引用仍未经证实；用于自我评估的评分准则尚未被证明与真实同行评审结果相关。
    - 路线: 面向科学发现的文献检索与综合
      解决的问题: 将文献检索、知识提取与综合集成到多智能体发现流程中，使假设生成和实验设计能够基于先验工作。
      尚未覆盖: 处理跨领域噪声和矛盾，以及对非英语或灰色文献的覆盖；文献综合组件与规划或执行智能体的贡献未能分离。
    - 路线: 文献智能的评估与基准
      解决的问题: 提供标准化任务和指标——如基于已发表研究的选择题或基于评分准则的质量得分——以比较具有文献意识的AI系统。
      尚未覆盖: 任务与现实世界科研发现的对齐，人类基线的可复现性，以及浅层文献理解与可操作科学洞见之间的差距。
    - 路线: 自主文献工作的失败分析与鲁棒性
      解决的问题: 识别执行文献综述或研究论文生成的AI系统中反复出现的失败模式——偏见、记忆退化、过度兴奋、薄弱的科学品味。
      尚未覆盖: 领域智能和科学品味的量化指标，以及所提出的设计原则是否能在不同领域和长周期任务中可靠降低失败率的验证。
    共识:
    - 多智能体架构是分解文献搜索、总结和起草等任务的主流方法。
    - 通过评分准则引导、内部验证或自我批判形成的迭代反馈循环，被认为是提高事实准确性和学术质量的关键。
    - 文献综述自动化仍是一个重大开放挑战，当前系统尚不足以完全自主使用。
    - 集成领域特定知识库和检索机制对于减少错误和夯实生成内容至关重要。
    - 当前评估高度依赖基于LLM的评审或受限基准，尚无公认的文献智能测量标准。
    分歧:
    - 任务范围：部分系统专注于从零开始生成完整综述，另一些则将文献综合作为更广泛科学发现流程的子模块。
    - 评估策略：一路线使用基于行为的评分准则由LLM评审打分，另一路线使用基于人类基线的选择题基准，第三条路线依赖研究论文生成的端到端成功率。
    - 领域特异性：ReasFlow等系统针对单一学科（应用数学）设计，而ARISE和EvoMaster声称领域无关，导致对是否需要精心策划的知识库存在不同假设。
    - 人机交互：设计从首席研究员–研究生协作到完全自主运行不等，反映了对人类判断应在何处介入以及责任如何分配的不同观点。
    开放问题:
    - 如何超越表面评分准则，衡量自动生成的文献综述的批判性深度和原创见解？
    - 当前文献智能基准是否捕捉了真实科研发现的复杂性，还是仅仅奖励浅层模式匹配？
    - 什么机制能够可靠解决跨学科文献中的矛盾并检测偏见？
    - 如何在自主文献系统中量化和提升长周期鲁棒性与科学品味？
    - 尚无纵向研究证据表明这些工具是否提高了研究者生产力或人类撰写的文献综述质量。
