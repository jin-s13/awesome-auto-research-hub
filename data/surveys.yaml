    - 交互模式不同：完全自主、逐步人工监督和精准协作被作为竞争性控制策略。
    - 评测目标不同：工作坊同行评审接受、LLM评分分数、基准成功率或工件质量。
    - 失败纠正模型不同：单次反思与多假设因果归因，后者将修正路由到假设、设计或实现。
    开放问题:
