      downstream scientific value?
    - Do current findings generalize beyond one frozen base model, selected domains,
      and specific benchmark tasks?
    - Which verification mechanisms reduce silent failures and false claims without
      blocking novel but unconventional findings?
    - Can benchmarks distinguish generative discovery from reproduction of known studies
      or task-specific optimization?
