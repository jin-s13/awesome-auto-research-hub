  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agents
      what_it_solves: Automating research ideation, experiment execution, analysis,
        and manuscript generation as a single workflow.
      what_remains_open: Reliability and consistency are unresolved; performance is
        often demonstrated only in narrow domains, workshop-level acceptance, or internal
        case studies.
    - line: Evidence-grounded evaluation benchmarks
      what_it_solves: Making scientific claims comparable through blind tasks, expert-derived
        questions, rubrics, and human baselines.
      what_remains_open: Proxy metrics may not capture real discovery utility; current
        agents plateau and lack controls, robustness, falsifiability, and cross-dataset
        generalization.
    - line: Verification and validity gating
      what_it_solves: Detecting silent failures and auditing whether claims are supported
        by data, domain constraints, or physical validity.
      what_remains_open: Automated gates still miss planted failures and are validated
        only in limited domains or with a single frozen judge model.
    - line: Reproducible research infrastructure
      what_it_solves: Turning isolated model ideas into runnable codebases, artifacts,
        dashboards, and repeatable experiment workflows.
      what_remains_open: External standardization across hardware, datasets, and user
        settings is absent; evaluation often comes from small internal case studies.
    - line: Human review and peer-review alignment
      what_it_solves: Calibrating automated evaluation and generated output against
        human expert baselines or peer-review decisions.
      what_remains_open: Human baselines are small and acceptance is inconsistent;
        automated or expert-judge alignment is not yet shown to generalize.
    consensus:
    - Scientific discovery is treated as a closed-loop process involving hypothesis
      formation, experiment execution, analysis, and reporting.
    - Evaluation should capture more than final task completion, including evidence
      quality, auditability, controls, and robustness.
    - Current agents can execute and document analyses, but they do not yet demonstrate
      trustworthy independent scientific judgment.
    - Runnable code, datasets, artifacts, and repeatable workflows are regarded as
      core infrastructure, even when external validation is missing.
    disagreements:
    - 'Evaluation targets differ: some focus on task completion or explanatory knowledge,
      others on evidence maturity, and others on peer-review-style acceptance.'
    - 'Domain specificity differs: some systems use domain simulators with physics-based
      visual gates, while others use text-based virtual tasks or real omics data.'
    - 'Interaction mode differs: autonomous end-to-end manuscript generation contrasts
      with interactive human-in-the-loop research platforms.'
    - 'Generality claim differs: some frameworks aim for broad scientific applicability,
      while specialized benchmarks and verification gates assume domain-specific constraints.'
    open_questions:
    - Do current task-completion, evidence-maturity, and automated-review metrics
      align with real-world scientific validity?
    - Can verification gates reliably detect silent failures across more diverse scientific
      domains?
    - Are agent results robust across different base models, datasets, and disciplines?
    - How should automated judges, expert review, and human-in-the-loop oversight
      be combined for research governance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现智能体
      解决的问题: 把研究构思、实验执行、分析和论文生成自动化为一个完整工作流。
      尚未覆盖: 可靠性和一致性尚未解决；证据多限于狭窄领域、工作坊级别或内部案例研究。
    - 路线: 基于证据的评估基准
      解决的问题: 通过盲任务、专家衍生问题、评分量规和人类基线使科研主张具备可比性。
      尚未覆盖: 代理指标可能无法反映真实发现效用；当前智能体缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 路线: 验证与有效性门控
      解决的问题: 检测静默失败，审计主张是否得到数据、领域约束或物理有效性的支持。
      尚未覆盖: 自动门控仍会漏检植入失败，且仅在有限领域或单一冻结裁判模型上验证。
    - 路线: 可复现科研基础设施
      解决的问题: 将单点模型想法转化为可运行代码库、工件、仪表板和可重复的实验工作流。
      尚未覆盖: 跨硬件、数据集和用户设置的标准化外部验证缺失；评估通常仅来自小规模内部案例。
    - 路线: 人类评审与同行评审对齐
      解决的问题: 将自动评估和生成结果与人类专家基线或同行评审决定进行校准。
      尚未覆盖: 人类基线小，接受结果不稳定；自动或专家评委对齐尚未证明能泛化。
    共识:
    - 科研发现被作为一个闭环过程来处理，包括假设形成、实验执行、分析和报告。
    - 评估应当超越最终任务完成情况，纳入证据质量、可审计性、对照和稳健性。
    - 当前智能体能够执行并记录分析，但尚未展现出可信赖的独立科学判断。
