      what_remains_open: Reported wins are often demonstrated on few cases; it is
        unclear how much comes from task-specific priors or evaluator design rather
        than general scientific reasoning.
    - line: Conceptual and measurement framing for evidence maturity
      what_it_solves: Operationalizes scientific reliability into dimensions such
        as controls, robustness, falsifiability, auditability, and novelty for automated
        scoring.
      what_remains_open: The categories need direct empirical validation that they
        predict agent behavior or downstream scientific validity.
    consensus:
    - 'Automated research requires more than fluent generation: systems now include
      execution, verification, and documentation loops.'
    - Evaluation for discovery should hide target conclusions or inject failures so
      agents cannot succeed merely by reproducing known answers.
    - Current agents can execute and document analyses competently, but still lack
      discriminating scientific behaviors such as controls, robustness, and falsifiability.
    - Reproducibility signals such as code, datasets, open artifacts, and deterministic
      aggregation are increasingly treated as part of credible evidence.
    disagreements:
    - Scope of evaluation ranges from broad open-ended discovery tasks to narrow domain-specific
      architecture or physics-model improvements.
    - 'Verification mechanisms differ: LLM-based evidentiary judges, visual physics
      gates, deterministic source-edit and promotion authorities, and human baseline
      comparisons.'
    - 'Success measures differ: workshop peer-review acceptance, task completion rate,
      wall shear RMSE improvement, forecasting performance, and evidence-maturity
      scores.'
    - 'Autonomy and reliability designs differ: some separate cognition from deterministic
      authority for safety, while others rely on LLM reviewers or vision-language
      inspection.'
    open_questions:
    - Do LLM-based judges or automated reviewers align with human scientific judgment
      across domains and task types?
    - Can verification gates detect silent failures outside the failure modes used
      in ablation tests?
    - How robust are agent rankings when evaluation uses only one frozen base model?
    - Do domain-specific improvements such as lower wall Cf RMSE or better forecasting
      architectures demonstrate general discovery ability or task-specific tuning?
    - What benchmark designs can reliably measure controls, robustness, falsifiability,
      and cross-dataset generalization?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于证据的基准设计
      解决的问题: 通过盲任务、隐藏源结论、冻结数据、自动指标和人类基线，使发现主张可比较，并测量证据而非复现。
      尚未覆盖: 代理LLM评判分数未必反映真实决策效用；跨领域和跨基座模型的覆盖仍有限。
    - 路线: 自主研究的系统与可复现基础设施
      解决的问题: 把智能体假设转化为可执行代码、实验和论文，并通过验证门控、权限分离或开源工件使流程可重复。
      尚未覆盖: 失效覆盖不完整；跨硬件、数据集和基座模型的标准化外部验证尚缺失。
    - 路线: 领域专用自主发现系统
      解决的问题: 将研究智能体嵌入物理、组学或预测流程，使用任务特定诊断、基线和晋升规则产生领域相关改进。
      尚未覆盖: 报告的优势常只在少数案例上显示；不清楚多少来自任务先验或评估器设计，而非通用科学推理。
    - 路线: 证据成熟度的概念与测量框架
      解决的问题: 把科学可靠性操作化为对照、稳健性、可证伪性、可审计性和新颖性等维度，用于自动评分。
      尚未覆盖: 这些分类能否预测智能体行为或下游科学有效性，仍缺少直接实证验证。
    共识:
    - 自主研究不能只靠流畅生成：当前系统已加入执行、验证和文档化闭环。
    - 面向发现的评测应隐藏目标结论或注入失败，使智能体不能仅靠复现已知答案成功。
    - 当前智能体能较熟练地执行和记录分析，但仍缺乏对照、稳健性、可证伪性等判别性科学行为。
    - 代码、数据集、开放工件和确定性聚合等可复现信号，越来越被视为可信证据的一部分。
    分歧:
    - 评测范围不同：从宽泛的开放式发现任务，到较窄的领域专用架构或物理模型改进。
    - 验证机制不同：基于LLM的证据评分、视觉物理门控、确定性源码编辑与晋升权限、人类基线比较。
    - 成功度量不同：工作坊同行评审接受、任务完成率、壁面剪切RMSE改进、预测性能和证据成熟度分数。
    - 自主性与可靠性设计不同：有的将认知与确定性权威分离以控风险，有的依赖LLM评审或视觉语言检查。
    开放问题:
    - 基于LLM的评审或自动评判是否与跨领域、跨任务的人类科学判断一致？
    - 验证门控能否在消融测试所用失败模式之外检测未知静默失败？
    - 当评测只使用一个冻结基座模型时，智能体排名有多稳健？
    - 领域专用改进（如更低壁面Cf RMSE或更好预测架构）证明的是通用发现能力还是任务特定调优？
    - 何种基准设计能可靠测量对照、稳健性、可证伪性和跨数据集泛化？
