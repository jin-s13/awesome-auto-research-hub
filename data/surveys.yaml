  related_work_outline:
  - 'Mainstream direction: Autonomous research agents that generate hypotheses and
    drive code or experiment execution, then revise based on executed results; representative
    examples include AI CFD Scientist, EvoCast, and SAGE.'
  - 'Shared research pattern: A loop from idea proposal to runnable experiment, result
    inspection, failure attribution, and grounded reporting, with a deterministic
    verification or authority layer separating generation from acceptance.'
  - 'Key differences: Systems differ in interaction mode (fully autonomous versus
    targeted human collaboration), failure handling (visual physics gates, multi-hypothesis
    attribution, debate/reflection), and evaluation setting (CFD, forecasting, omics,
    AI case studies).'
  - 'Trend evolution: 2025 work establishes surveys and benchmarks, while 2026 work
    shifts toward reliability gates, self-evolving knowledge transfer, and selective
    human oversight at high-leverage decision points.'
  - 'Open questions: Verification coverage for silent failures, generalizability beyond
    narrow case studies, and whether benchmark gains correspond to externally valid
    scientific discovery remain unresolved.'
  related_work_outline_zh:
  - 主流方向：自主研究智能体提出假设并驱动代码或实验执行，再依据执行结果迭代修正；代表性工作如AI CFD Scientist、EvoCast、SAGE。
  - 研究共性：从想法提出到可运行实验、结果检查、失败归因和基于证据的报告形成闭环，并以确定性验证或权威层把生成与采纳分离。
  - 关键差异：系统在交互模式（全自主与精准人机协作）、失败处理（视觉物理门控、多假设归因、辩论反思）和评测场景（CFD、预测、组学、AI案例）上不同。
  - 趋势演进：2025年多为综述与基准，定义能力缺口；2026年转向可靠性门控、自演化知识沉淀和高杠杆点的人机协同。
  - 开放问题：静默失败的验证覆盖、超越窄案例的泛化，以及基准得分能否对应可外部验证的科学发现仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Domain-gated autonomous discovery
      what_it_solves: Proposes and executes open-ended hypothesis search inside a
        domain-specific simulator, then uses a validity gate to reject non-physical
        results before they are accepted or written.
      what_remains_open: The gate missed 2 of 16 planted silent failures in the available
        ablation, so its coverage and generalization beyond the tested CFD setting
        remain unverified.
    - line: Self-correcting hypothesis revision
      what_it_solves: Attributes failed experiments to hypothesis, experimental design,
        or implementation causes, then routes corrections to the appropriate level
        to increase metrics-bearing outputs.
      what_remains_open: Fully autonomous writing and conference-ready outputs are
        still unsolved, and failure attribution completeness lacks external validation.
    - line: Human-AI collaborative research orchestration
      what_it_solves: Uses multi-agent debate, self-healing execution, verifiable
        reporting, and targeted human intervention to generate and refine research
        ideas.
      what_remains_open: Optimal intervention mode and cross-domain generalization
        are based on limited AI case studies; broad external validation is missing.
    - line: Benchmarks for scientific idea and discovery
      what_it_solves: Provides real-data tasks and human baselines, such as omics
        annotation and discovery questions, to compare AI scientists' idea-driven
        discovery performance.
      what_remains_open: Current AI scientists still fall short of fully autonomous
        biological discovery, and benchmark scores may not map to novel real-world
        utility.
    - line: Foundational evolving agent frameworks
      what_it_solves: Encapsulates hypothesis refinement, self-critique, and knowledge
        accumulation into domain-agnostic loops, reducing the cost of building scientific
        agents.
      what_remains_open: Evidence centers on leaderboard-style benchmark gains; whether
        accumulated knowledge improves hypothesis quality outside these benchmarks
        remains an open verification gap.
    consensus:
    - Autonomous research systems are organized as iterative generate-execute-inspect-revise
      loops, rather than one-shot proposal generation.
    - Successful systems couple LLM-driven hypothesis generation with a deterministic
      evaluation, verification, or reporting authority to make results auditable.
    - Executed experiment feedback is used as evidence for the next hypothesis, making
      methodology and metrics central to idea generation quality.
    - Evaluation currently relies on case studies or benchmarks; several papers lack
      external validation or full limitation reporting, creating verification gaps
      rather than proof of absence.
    disagreements:
    - 'Domain validity enforcement differs: some systems reject non-physical outputs
      through visual physics inspection, while others rely on generic execution metrics
      or expert preference judging.'
    - 'Autonomy stance differs: targeted human collaboration at high-leverage decision
      points is reported to outperform full autonomy in one line, while other systems
      emphasize fully autonomous self-correction.'
    - 'Failure diagnosis differs: structured multi-hypothesis causal attribution competes
      with multi-agent debate/reflection and self-healing retry loops, implying different
      beliefs about where experiments fail.'
    - Evaluation targets differ across CFD, forecasting, omics, and AI research case
      studies, making reported improvement percentages not directly comparable.
    open_questions:
    - How wide is the coverage of validity gates for silent failures outside the specific
      simulations or datasets used to test them?
    - Do metric improvements on ARC-Bench, forecasting cases, or single-cell tasks
      transfer to externally validated scientific discoveries?
    - What is the right granularity of human intervention, and which high-leverage
      decision points generalize beyond five internal AI research case studies?
    - How can evaluation separate idea novelty, execution reliability, and discovery
      validity instead of relying on aggregate preference or metrics-bearing output
      availability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域门控式自主发现
      解决的问题: 在特定领域模拟器或环境中提出并执行开放式假设搜索，并用有效性门控阻止不可靠结果进入结论或论文。
      尚未覆盖: 门控在消融中遗漏了2/16的植入静默失败，其覆盖范围与跨领域泛化仍未验证。
    - 路线: 自纠正假设修正
      解决的问题: 将失败实验归因到假设、实验设计或实现层级，并路由到相应层级修正，以提高包含度量的输出比例。
      尚未覆盖: 完全自主写作和可提交论文仍未解决，失败归因完整性缺少外部验证。
    - 路线: 人机协同研究编排
      解决的问题: 用多智能体辩论、自愈执行、可验证报告和精准人工干预来生成与精化研究想法。
      尚未覆盖: 最优干预模式和跨域推广主要基于有限AI案例，缺乏广泛外部验证。
    - 路线: 科学想法与发现基准
      解决的问题: 通过真实组学数据、发现问答和人类基线，比较AI科学家的注释和科学发现能力。
      尚未覆盖: 当前系统尚未达到完全自主发现，基准得分与真实新发现的效用映射不清。
    - 路线: 通用演化智能体框架
      解决的问题: 将假设优化、自我批判和知识积累封装为领域无关循环，降低构建科学智能体的成本。
      尚未覆盖: 证据集中在榜单式基准提升，知识积累是否提升基准外假设质量仍是验证缺口。
    共识:
    - 自主研究系统被组织为迭代的生成-执行-检查-修正循环，而非一次性提出建议。
    - 成功系统通常将LLM驱动的假设生成与确定性的评估、验证或报告权威结合，以提高可审计性。
    - 执行反馈被作为下一轮假设的证据，使方法与评估在假设生成质量中起核心作用。
    - 当前评测多依赖案例或基准；若干论文缺少外部验证或完整局限性报告，属于验证缺口而非能力缺失证明。
    分歧:
    - 领域有效性执行不同：部分系统通过视觉物理检查拒绝非物理结果，另一些依赖通用执行指标或专家偏好判断。
    - 自主立场不同：一条路线报告在高杠杆节点进行精准人机协作优于全自主，另一些路线强调完全自主自纠正。
    - 失败诊断不同：结构化多假设因果归因与多智能体辩论反思、自愈重试形成不同假设，指向实验失败的不同来源。
    - 评测目标不同：分散在CFD、预测、组学和AI研究案例，改进百分比难以直接比较。
    开放问题:
    - 有效性门控在测试仿真或数据集之外的静默失败上覆盖范围有多大？
    - ARC-Bench、预测案例或单细胞任务上的指标提升能否转化为可外部验证的科学发现？
    - 何种粒度的人工干预最优，哪些高杠杆决策点能超越五个内部AI研究案例实现泛化？
    - 评测如何分离想法新颖性、执行可靠性与发现有效性，而不是依赖综合偏好或是否输出指标？
