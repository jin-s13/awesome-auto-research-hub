  related_work_outline_zh:
  - 主流方向：构建端到端自主科研闭环，把想法生成、实验执行、分析、论文写作和自动评审结合起来。
  - 研究共性：以 LLM 为核心，多阶段组织智能体流程，并逐步加入验证或评测机制以控制低质量输出。
  - 关键差异：通用系统偏重开放式发现，领域系统偏重物理或逻辑验证；评测目标、交互模式和部署场景明显分化。
  - 趋势演进：从 2024 年通用自动化框架，到 2025 年智能体树搜索和工作坊级同行评审，再到 2026 年领域验证和证据成熟度基准。
