  related_work_outline:
  - 'Mainstream direction: Agentic LLM pipelines dominate survey generation, using
    specialized agents for retrieval, outline planning, drafting, and review/refinement.'
  - 'Shared research pattern: Systems iterate over retrieved literature, produce structured
    summaries or paper cards, then refine drafts against rubrics or multi-LLM evaluators.'
  - 'Key differences: Some emphasize end-to-end drafting quality, others target retrieval
    recall/citation reliability, taxonomy organization, or evaluation validity; a
    few extend to governed biomedical research workflows.'
  - 'Trend evolution: From 2025-2026 evidence, trend moves from single-pass synthesis
    to iterative agentic workflows, full-text evidence grounding, citation-graph expansion,
    and explicit taxonomy/benchmark evaluation.'
  - 'Open questions: whether automated metrics reflect expert judgment, how to scale
    retrieval coverage and faithful citation, and how to align generated taxonomies
    with expert conceptual structure.'
  related_work_outline_zh:
  - 主流方向：以 LLM 智能体流水线为主，使用专门智能体完成检索、大纲规划、起草和评审迭代。
  - 研究共性：系统普遍对检索到的文献进行迭代处理，形成结构化摘要或论文卡片，再依据评分准则或多 LLM 评估进行修改。
  - 关键差异：有的侧重端到端撰写质量，有的关注检索召回与引用可靠性，有的关注分类法组织或评测有效性，少数扩展到受治理的生物医学研究流程。
  - 趋势演进：从 2025-2026 年证据看，趋势由单次合成转向迭代智能体工作流、全文证据约束、引文图扩展和显式分类/基准评测。
  - 开放问题：自动指标能否反映专家判断，扩大检索覆盖与可信引用，以及生成分类法如何与专家概念结构对齐。
  literature_review:
    line_of_work_matrix:
    - line: Agentic survey drafting and iterative refinement
      what_it_solves: Turns retrieved literature into structured drafts through modular
        agents and repeated rubric-based or review-based revision.
      what_remains_open: Quality gains are often measured by LLM rubrics rather than
        external expert agreement; limited evidence on failure cases and domain transfer.
    - line: Retrieval, evidence grounding, and citation reliability
      what_it_solves: Improves selection and attribution of source papers through
        full-text analysis, paper cards, citation-graph expansion, and evidence-constrained
        citation.
      what_remains_open: Available evidence reports low expert-cited recall and uneven
        precision; missing standardized evaluation across corpora and disciplines.
    - line: Taxonomy and hierarchical organization generation
      what_it_solves: Learns or generates expert-like category structures that organize
        papers into coherent trees and sections.
      what_remains_open: Generated taxonomies show sibling overlap, MECE violations,
        structural imbalance, and weak semantic alignment with human experts.
    - line: Evaluation and benchmarking for survey systems
      what_it_solves: Creates benchmarks, metrics, and paired comparison settings
        to assess retrieval, organization, content coverage, structure, and citation
        quality.
      what_remains_open: Reference-dependent alignment may penalize valid alternative
        taxonomies; proxy metrics have not been shown to predict real scholarly utility.
    - line: Governed end-to-end research system workflows
      what_it_solves: Orchestrates proposal review, execution planning, computation
        routing, reproducibility, and publication-oriented drafting within institutional
        privacy constraints.
      what_remains_open: Validation is limited to one biomedical case and lacks broad
        reproducibility evidence across tasks, datasets, and research communities.
    consensus:
    - Iterative multi-step agent workflows outperform simpler single-pass or retrieval-only
      baselines on quality, structure, and citation-related metrics.
    - Retrieval coverage and citation faithfulness are central bottlenecks; systems
      increasingly use paper-level summaries or evidence constraints to ground claims.
    - Automated evaluation is necessary because expert review is costly, but current
      evaluation remains partial and often reference-dependent.
    - Taxonomy/tree organization is treated as a distinct capability from fluent drafting,
      with separate metrics for hierarchy and semantic alignment.
    disagreements:
    - 'Representation differs: some methods use free-text iterative drafts and rubrics,
      others use paper cards, structured keynotes, or taxonomy trees as intermediate
      artifacts.'
    - 'Supervision/evaluation target differs: rubric-guided scoring, multi-LLM pairwise
      or 12-dimension evaluation, expert taxonomy alignment, and real-world biomedical
      validation create inconsistent comparison targets.'
    - 'Interaction mode differs: several systems are fully automated multi-agent pipelines,
      while governed research systems include scientist-in-the-loop oversight and
      institutional data controls.'
    - 'Depth-grounding differs: methods vary from abstract/keyword retrieval to full-text
      analysis, code-repository inspection, and citation-graph expansion.'
    open_questions:
    - Do rubric-based or multi-LLM quality scores agree with domain expert judgments
      when survey claims are nuanced or contested?
    - Why does the best evaluated deep research agent retrieve only about 20.92% of
      expert-cited papers, and what retrieval or indexing changes would close that
      gap?
    - Can generated taxonomies be both reference-free and expert-aligned enough to
      reduce MECE violations and structural imbalance without forcing a single human
      taxonomy?
    - How well do survey-generation systems transfer from LLM research topics to non-CS
      fields, and which evidence constraints remain necessary for reliable citation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 智能体综述起草与迭代优化
      解决的问题: 通过模块化智能体和基于评分准则或评审的反复修改，把检索到的文献转化为结构化草稿。
      尚未覆盖: 质量提升常由 LLM 评分准则衡量，而非外部专家一致意见；失败案例和领域迁移证据不足。
    - 路线: 检索、证据约束与引用可靠性
      解决的问题: 通过全文分析、论文卡片、引文图扩展和证据约束引用，改进来源论文的选择与归属。
      尚未覆盖: 现有证据显示专家引用召回低、精度不一致；缺少跨语料和跨学科的标准化评估。
    - 路线: 分类法与层次组织生成
      解决的问题: 生成或学习类似专家的类别结构，将论文组织成连贯的树状章节。
      尚未覆盖: 生成分类法存在兄弟重叠、MECE 违规、结构不平衡，与人类专家语义对齐较弱。
    - 路线: 综述系统评测与基准设计
      解决的问题: 通过基准、指标和成对比较评估检索、组织、内容覆盖、结构和引用质量。
      尚未覆盖: 依赖参考的分类对齐可能惩罚有效替代分类法；代理指标能否预测真实学术效用尚未证明。
    - 路线: 受治理的端到端研究系统工作流
      解决的问题: 在机构隐私约束内编排提案评审、执行规划、计算路由、可重复性和面向发表的起草。
      尚未覆盖: 验证限于一个生物医学案例，缺乏跨任务、数据集和研究社区的广泛可重复性证据。
    共识:
    - 迭代多步骤智能体工作流在质量、结构和引用相关指标上优于简单单次或仅检索基线。
    - 检索覆盖和引用忠实性是核心瓶颈；系统日益使用论文级摘要或证据约束来支撑主张。
    - 自动评测必要但仍是部分和常常依赖参考的评估，专家评审成本高。
    - 分类法/树状组织被视为不同于流畅写作的能力，采用层次和语义对齐等独立指标。
    分歧:
    - 表示方式不同：有的使用自由文本迭代草稿和评分准则，有的使用论文卡片、结构化要点或分类树作为中间产物。
    - 监督/评测目标不同：评分准则引导、多 LLM 成对或 12 维评估、专家分类对齐和真实生物医学验证形成不一致的比较目标。
    - 交互模式不同：多数为全自动多智能体流水线，而受治理研究系统包含科学家在环监督和机构数据控制。
    - 深度依据不同：方法从摘要/关键词检索到全文分析、代码仓库检查和引文图扩展各有差异。
    开放问题:
    - 当综述主张细致或存在争议时，基于评分准则或多 LLM 的质量分数是否与领域专家判断一致？
    - 为什么现有最佳深度研究智能体只能检索到约 20.92% 的专家引用论文，哪些检索或索引变化能缩小这一差距？
    - 生成分类法能否在无参考和专家对齐之间取得平衡，减少 MECE 违规和结构不平衡，而不强制匹配单个人类分类？
    - 综述生成系统从 LLM 研究主题迁移到非 CS 领域时表现如何，可靠引用仍需哪些证据约束？
