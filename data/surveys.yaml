  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous experimentation and paper-generation pipelines
      what_it_solves: Closes the loop from research idea to code execution, analysis,
        and manuscript generation, reducing per-paper cost and human labor.
      what_remains_open: 'Reliability and acceptance consistency remain weak: only
        workshop-level or internal evaluations are shown in the evidence, and limitations
        are often unreported.'
    - line: Multi-agent orchestration and interactive research platforms
      what_it_solves: Provides role decomposition, real-time monitoring, rollback,
        and code harnesses that let a human supervisor steer an automated research
        team.
      what_remains_open: Current evidence is built on few internal case studies, and
        no standardized external validation across hardware, datasets, or user settings
        is reported.
    - line: Evaluation environments and benchmark testbeds for discovery agents
      what_it_solves: Makes discovery behavior measurable through simulated tasks,
        completion metrics, and scientific ML benchmark improvement.
      what_remains_open: Metrics may reward engineering tricks over domain insight;
        coverage across scientific topics and agreement with real decision utility
        remain unproven.
    - line: Failure-aware memory and iterative search
      what_it_solves: Converts failed experiments into reusable knowledge or tree
        search branches to steer subsequent attempts and reduce token cost.
      what_remains_open: Transfer evidence is limited to PDE retry/cross-task settings;
        how far failure records generalize across domains and reward granularity is
        unclear.
    consensus:
    - LLM-based agents can already execute substantial portions of the research cycle,
      including code, experiment loops, and manuscript drafting.
    - Feedback mechanisms such as verification loops, reviewer critiques, or failure
      memory improve agent outputs over vanilla baselines.
    - Evaluation is treated as multidimensional, spanning task completion, paper quality,
      benchmark improvement, and operating cost.
    - Current systems still show inconsistency or narrow evaluation scope; evidence
      of human-level or peer-reviewed reliability is partial.
    - Reproducibility signals vary across papers, but missing artifacts in the packet
      are verification gaps rather than proof of absent code or data.
    disagreements:
    - 'Full autonomy versus human-in-the-loop control: some systems remove human-authored
      templates and submit generated papers, while others emphasize dashboards and
      rollback for human oversight.'
    - 'Evaluation target: generated manuscript quality, simulated discovery task completion,
      or improvement of published ML benchmarks leads to different success criteria.'
    - 'Feedback signal: automated LLM review, VLM reviewer feedback, negative knowledge
      memory, agentic tree search, and expert judge preference are not interchangeable.'
    - 'Domain scope: applied mathematics theorem proving, machine learning subfields,
      simulated science topics, and PDE tasks impose different constraints.'
    - 'Attribution of progress: some evidence attributes gains to verification/knowledge
      retrieval, while a coding-agent testbed attributes gains mainly to ML engineering
      tricks.'
    open_questions:
    - Do automated reviewer scores and benchmark metrics correspond to scientific
      novelty, or mainly to style and engineering quality?
    - Can end-to-end discovery systems reliably pass peer review beyond a single workshop
      submission or small internal case studies?
    - How well do failure-aware memory and tree search transfer across scientific
      domains beyond PDE retry and the demonstrated ML tasks?
    - What standardized external validation and artifact reporting would make autonomous
      experiment agents comparable across code, data, hardware, and user settings?
    - Which assumptions about human oversight are necessary, and at what stages should
      human experts intervene to prevent novelty miscalibration or local engineering
      collapse?
