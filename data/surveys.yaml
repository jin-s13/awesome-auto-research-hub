  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Automating the complete research pipeline from idea generation
        and code/experiment execution to result visualization and manuscript production.
      what_remains_open: 'Reliability is inconsistent: only one of three AI Scientist-v2
        submissions passed peer review, and full conference-level validation is not
        shown.'
    - line: Domain-specific discovery with verification and knowledge retrieval
      what_it_solves: Reducing invalid or physically/logically inconsistent claims
        by adding verification loops and knowledge retrieval before accepting results
        in domains such as applied mathematics and CFD.
      what_remains_open: Verification gates are incomplete; the CFD gate missed 2
        of 16 planted silent failures, and evidence beyond a narrow domain setting
        is limited.
    - line: Discovery-oriented benchmark environments
      what_it_solves: Providing repeatable tasks, varied topics, and metrics for full
        discovery cycles rather than reproduction of known results.
      what_remains_open: Agents plateau and lack controls, robustness, falsifiability,
        and cross-dataset generalization; reported scores rely on one frozen base
        model.
    - line: Automated review and evidentiary scoring
      what_it_solves: Scaling evaluation of generated papers or claims and enabling
        iterative feedback without constant human review.
      what_remains_open: LLM-judge and automated reviewer calibration is only partially
        validated, and proxy scores have not been linked to real scientific utility.
    consensus:
    - Autonomous discovery systems need a closed loop connecting ideation, execution,
      analysis, and write-up.
    - Execution success alone is insufficient; claims require additional review, verification,
      or evidence-maturity evaluation.
    - Benchmarks should evaluate complete discovery behavior, including hypothesis
      formation and evidentiary support, rather than only final answer correctness.
    disagreements:
    - 'Representation and supervision differ: some systems automate the full research
      pipeline with simulated review, while others use human-principal/agent-graduate-student
      collaboration.'
    - 'Verification mode differs: general ML systems use code execution and automated
      review, whereas domain-specific systems add physics-aware vision-language or
      logical verification gates.'
    - 'Evaluation target differs: synthetic task environments measure task completion
      and explanatory knowledge, while blind benchmarks score evidence maturity, controls,
      robustness, falsifiability, and generalization.'
    - 'Deployment setting differs: some contributions target fully generated manuscripts,
      while others target reproducible benchmarks for comparing agents independent
      of paper output.'
    open_questions:
    - How can automated reviewers be calibrated to human scientific judgment beyond
      the narrow tasks and workshop settings where they were tested?
    - Can verification gates detect silent failures reliably across domains without
      handcrafted mirrors for each environment?
    - Do agent improvements on discovery benchmarks transfer to real-world scientific
      utility, especially controls, robustness, falsifiability, and cross-dataset
      generalization?
    - What is the effect of base model, domain, and compute differences when reported
      evidence comes from a single frozen model or narrow case studies?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究智能体
      解决的问题: 把研究目标自动转化为构思、代码/实验执行、结果可视化和论文撰写流程。
      尚未覆盖: 可靠性不稳定；三篇AI Scientist-v2提交中仅一篇通过同行评审，完整会议级验证尚未出现。
    - 路线: 领域特定发现与验证检索
      解决的问题: 在应用数学和CFD等领域中，通过验证循环和知识检索减少物理或逻辑上不一致的结论。
      尚未覆盖: 验证门控不完整；CFD门控漏掉16个植入静默失败中的2个，且跨领域证据有限。
    - 路线: 面向发现的基准环境
      解决的问题: 提供可重复任务、多样主题和指标，评估完整发现循环，而非复现已知结果。
      尚未覆盖: 智能体得分停滞，缺乏对照、稳健性、可证伪性和跨数据集泛化；报告证据仅基于单一冻结基座模型。
    - 路线: 自动评审与证据成熟度评分
      解决的问题: 扩展对生成论文或主张的评估，并在无需持续人工评审的情况下支持迭代反馈。
      尚未覆盖: LLM评判和自动评审校准仅在部分设置中得到验证，代理分数与实际科学效用的关联尚未建立。
    共识:
    - 自主发现系统需要连接构思、执行、分析和写作的闭环。
    - 仅执行成功不足以支撑科学结论，还需要评审、验证或证据成熟度评估。
    - 基准应评估完整发现行为，包括假设形成和证据支持，而不是仅评估最终答案正确性。
    分歧:
