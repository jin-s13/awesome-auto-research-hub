      尚未覆盖: 基准覆盖的领域和任务类型有限（基于文本模拟、细胞类型注释）；基准分数与真实科学发现效用之间的相关性未知；完整论文生成评估尚未标准化，且当前基准未涵盖完整研究流程。
    共识:
    - 所有系统均以大型语言模型作为科学工作流的核心推理引擎。
    - 所有系统均集成某种形式的自动质量控制，无论是模拟评审、逻辑验证还是物理合理性检查。
    - 所有系统均通过与人类基线或同行评审标准进行对比来确立可信度。
    - 所有系统均生成完整研究论文或研究输出作为最终交付物。
    分歧:
    - 监督策略：部分系统追求无人类干预的完全自主，而另一些系统在关键决策点集成人类在回路中协作，消融研究表明精准的人类输入可优于完全自主和详尽监督。
    - 验证机制：领域特定验证（如逻辑审计或物理感知视觉门控）与基于通用LLM的模拟评审形成对比，导致错误检测覆盖范围和失败模式不同。
    - 评测目标：系统通过同行评审接收、基于LLM的评分标准或基准任务完成度进行评判，这些可能奖励科学质量的不同维度。
    - 领域覆盖：通用智能体面向广泛的ML领域，而专用智能体针对应用数学、CFD和生物学，内置了通用智能体所缺乏的领域知识。
    开放问题:
    - 鉴于当前物理和逻辑门控仍会遗漏部分错误，如何使验证门控足够鲁棒以检测所有静默失败？
    - 在消融研究表明精准协作优于完全监督的前提下，最大化研究质量并最小化人类努力的最佳人类干预点是什么？
    - 由于当前基准测试的是已知任务和增量改进，AI科学家系统能否生成超越现有知识插值的真正新颖假设？
    - 基于LLM的自动评审分数与人类专家判断及下游科学影响力之间的相关性如何，尤其是在多样化的科学领域？
