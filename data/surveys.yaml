  related_work_outline:
  - 'Mainstream direction: LLM-based autonomous research systems that generate hypotheses,
    run or modify experiments, verify outputs, and report results, with increasing
    attention to human-AI collaboration and self-correction.'
  - 'Shared research pattern: hypothesis generation is treated as an iterative, evidence-grounded
    loop rather than a one-shot proposal; execution feedback, diagnostic signals,
    and prior failures are used to update later ideas.'
  - 'Key differences: systems diverge in verification mechanisms, autonomy level,
    domain-specific versus domain-agnostic design, and the evidence used for evaluation
    such as benchmarks, expert judgment, or downstream task metrics.'
  - 'Trend evolution: 2025 evidence emphasizes benchmarks and surveys that expose
    reliability gaps; 2026 systems add validity gates, failure attribution, self-evolution,
    and targeted human oversight. The year span is narrow, so this is a current-frontier
    trend.'
  - 'Open questions: verification gates may still miss silent failures, benchmark
    gains may not prove real discovery utility, and long-horizon autonomous scientific
    writing plus reproducible reporting remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以LLM智能体为核心的自主研究系统，覆盖假设生成、实验执行、验证与报告，并逐步引入人机协同与自我纠正。
  - 研究共性：假设生成被组织为证据驱动的迭代闭环，执行失败或领域反馈用于更新后续研究思路。
  - 关键差异：验证机制、自主程度、领域专用与领域通用、以及评测证据类型存在明显分化。
  - 趋势演进：2025年以基准与综述指出可靠性缺口，2026年系统侧重验证门控、失败归因、自我演化和高杠杆人机协作；年份跨度窄，仍属当前前沿。
  - 开放问题：验证门控对未植入失败的泛化能力、基准指标与真实科学发现效用的一致性、以及端到端科学写作与可复现性仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific autonomous discovery loops
      what_it_solves: Generates hypotheses, modifies simulation or code artifacts,
        executes experiments, and validates domain-relevant results in areas such
        as fluid dynamics and forecasting.
      what_remains_open: Domain-specific verification gates still miss some silent
        failures, and evaluation is limited to selected real-world cases and curated
        tasks.
    - line: Multi-agent orchestration and human-AI collaboration
      what_it_solves: Coordinates idea generation, experiment execution, reporting,
        and oversight through role-based agents and human intervention modes.
      what_remains_open: Optimal intervention granularity and generalization beyond
        internal case studies or expert-judged benchmarks are not established.
    - line: Self-correcting and self-evolving research agents
      what_it_solves: Attributes experimental failures to hypotheses, design, or implementation
        and accumulates knowledge across runs to improve success and artifact quality.
      what_remains_open: Long-horizon autonomous scientific writing and conference-ready
        papers remain unsolved; cross-domain transfer of self-evolution is not demonstrated.
    - line: Benchmarks and evidence design for AI scientists
      what_it_solves: Compares AI scientists with human baselines on tasks such as
        cell-type annotation, multiple-choice discovery, or experiment-stage research
        execution.
      what_remains_open: Current systems still fall short of fully autonomous discovery,
        and proxy metrics may not reflect real scientific discovery utility.
    - line: Surveys and conceptual organization of agentic science
      what_it_solves: Categorizes agentic systems, evaluation metrics, frameworks,
        datasets, and cross-domain challenges for scientific discovery.
      what_remains_open: The proposed categories and challenge lists are not directly
        empirically validated; reliability and ethical concerns remain unresolved.
    consensus:
    - Hypothesis generation is treated as an iterative, execution-grounded loop rather
      than a single-pass text proposal.
    - Most systems add explicit reliability mechanisms such as verifiable reporting,
      deterministic authorities, validity gates, or failure attribution.
    - Evaluation is shifting from isolated demonstrations to comparative benchmarks,
      baselines, and human-expert judgments.
    - Human oversight remains valuable, especially at high-leverage decision points
      rather than exhaustive step-by-step review.
    disagreements:
    - 'Validity enforcement varies: physics-aware perceptual checks, deterministic
      source-edit and evaluation authorities, constrained fact-based reporting, and
      causal multi-hypothesis failure attribution.'
    - 'Autonomy mode differs: fully autonomous execution, targeted human collaboration,
      interactive dashboard rollback, and self-evolving cross-run loops.'
    - 'Deployment scope differs: domain-specific discovery loops versus domain-agnostic
      foundational frameworks versus survey or taxonomy contributions.'
    - 'Evaluation evidence differs: benchmark success rates, downstream task metrics,
      expert preference, and human-baseline comparison are not interchangeable.'
    open_questions:
    - How do verification gates perform under broader, non-planted failure distributions
      when one gate misses 2 of 16 planted silent failures?
    - Do gains on ARC-Bench, BAISBench, five case studies, or four benchmarks predict
      useful real-world scientific discoveries?
    - What minimum reliability and reproducibility evidence should an AI scientist
      report when code, dataset, or limitation details are missing?
    - Can self-correcting and self-evolving agents close the gap from metrics-bearing
      outputs to defensible conference-ready scientific writing?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域特定的自主发现循环
      解决的问题: 生成假设，修改仿真或代码工件，执行实验，并在流体力学或预测等场景中验证领域相关结果。
      尚未覆盖: 领域专用验证门控仍会漏掉部分静默失败，且评测仅限于选定真实案例和策展任务。
    - 路线: 多智能体协作与人机协同
      解决的问题: 通过角色化智能体和人类干预模式协调创意生成、实验执行、报告与监督。
      尚未覆盖: 最优干预粒度以及从内部案例或专家评审基准向更广设置的泛化尚未建立。
    - 路线: 自我纠正与自我演化的研究智能体
      解决的问题: 将实验失败归因到假设、设计或实现，并跨运行积累知识以提升成功率和工件质量。
      尚未覆盖: 长周期自主科学写作和可提交会议论文仍未解决；跨领域自我演化迁移未被证明。
    - 路线: AI科学家的基准与证据设计
      解决的问题: 在细胞类型注释、选择题发现或实验阶段研究执行等任务上将AI科学家与人类基线对比。
      尚未覆盖: 当前系统仍未达到完全自主发现，代理指标可能无法反映真实科学发现效用。
    - 路线: 智能体科学的综述与概念组织
      解决的问题: 对智能体系统、评测指标、框架、数据集以及跨领域科学发现挑战进行分类。
      尚未覆盖: 所提分类与挑战清单缺乏直接实证验证；可靠性与伦理问题仍未解决。
    共识:
    - 假设生成被组织为执行反馈驱动的迭代研究闭环，而不是一次性文本建议。
    - 显式可靠性机制，如可验证报告、确定性权威、有效性闸门和失败归因，正在成为共同组件。
    - 评测正从单点演示转向比较基准、基线和人类专家判断。
    - 人类监督仍有价值，尤其在高杠杆决策点而非逐步穷尽式审阅。
    分歧:
    - 有效性保障方式不同：物理感知视觉核验、确定性源码与评估权威、受约束的事实报告、多假设因果归因。
    - 自主模式不同：完全自主、精准人机协作、交互式仪表板回滚、跨运行自我演化。
    - 部署范围不同：领域专用发现循环与领域无关基础框架以及综述分类。
    - 评测证据不同：基准成功率、下游任务指标、专家偏好和人类基线对比，不可互相替代。
    开放问题:
    - 当一个验证门控在16个植入静默失败中漏检2个时，其对更广非植入失败分布的泛化能力如何？
    - 在ARC-Bench、BAISBench、五个案例或四个基准上的提升能否预测真实科学发现的效用？
    - 当代码、数据集或局限性细节缺失时，AI科学家至少应报告哪些最低可靠性和可复现性证据？
    - 自我纠正与自我演化智能体能否弥合从含指标输出到可辩护、可提交论文级科学写作的差距？
