  related_work_outline_zh:
  - 主流方向：构建自主研究智能体，并配套评估、审计与验证基础设施，以判断其主张是否可信、可复现、可治理，而不仅是新颖。
  - 研究共性：多数工作将LLM驱动的生成/实验循环与自动评估结合，例如模拟评审、基准任务、LLM裁判、物理感知门控或确定性执行权威。
  - 关键差异：系统在评测目标（虚拟发现、领域数据、证据成熟度或同行评审接受）、验证信号（人类基线、LLM裁判、确定性门控、视觉物理检查）和约束位置（结果验证或源码编辑与晋升控制）上不同。
  - 趋势演进：2024-2026年证据显示，研究从端到端发现框架转向专用基准、证据审计和可靠性增强智能体；报告结果仍集中于窄领域和工作坊级验证。
  - 开放问题：自动化指标是否对应真实科学效用、验证门控能否泛化到植入失败之外、结果能否跨基座模型、数据集和更广泛领域保持，仍不清楚。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous discovery-loop systems
      what_it_solves: Converts LLM-generated ideas into runnable experiments, code,
        results, and manuscripts for end-to-end research automation.
      what_remains_open: Peer-review success is inconsistent and currently demonstrated
        mainly at workshop level; validity claims remain only as strong as the embedded
        review and evaluation loop.
    - line: Benchmark suites for discovery agents
      what_it_solves: Provides standardized tasks and automatic metrics for comparing
        agents on complete cycles of scientific discovery across simulated and domain-specific
        settings.
      what_remains_open: Task completion and action metrics are proxies; real scientific
        soundness, domain diversity, and correspondence to decision utility are not
        established.
    - line: Evidence-grounded evaluation frameworks
      what_it_solves: Scores claims by evidentiary maturity and documentation quality
        rather than reproduction of hidden target conclusions.
      what_remains_open: Results are bounded to limited frozen base models and show
        weak separation between agents; criteria for acceptable evidence and generalization
        remain unresolved.
    - line: Verification and governance gates
      what_it_solves: Adds deterministic or physics-aware checks to catch silent failures,
        constrain source edits, and enforce canonical evaluation before claims are
        promoted.
      what_remains_open: Ablation evidence shows gates can still miss failure modes;
        cross-domain and cross-hardware validation is missing.
    - line: Human-reference and peer-review validation
      what_it_solves: Contextualizes automated performance with human expert baselines,
        simulated reviewer scores, or actual peer-review submissions.
      what_remains_open: Human baselines are sparse and peer-review acceptance is
        narrow and variable; no consensus threshold for trustworthy autonomous science
        exists.
    consensus:
    - Autonomous research agents can execute and document analyses competently, but
      current evidence repeatedly shows they lack controls, robustness checks, falsifiability,
      and cross-dataset generalization.
    - Evaluation is shifting away from merely reproducing known findings toward blinded
      discovery tasks, evidence maturity scoring, and validity gates before claims
      are accepted.
    - Reliability cannot be assumed from generation ability alone; deterministic or
      domain-specific verification is needed to catch silent failures and indefensible
      outputs.
    - Domain benchmarks expose the gap between routine analysis execution and the
      discriminating acts required for credible scientific claims.
    disagreements:
    - 'Evaluation target differs: some work measures success on synthetic or virtual
      discovery tasks, others on real domain-specific data, still others on evidence
      maturity or peer-review acceptance.'
    - 'Validation signals differ: LLM-based judges and simulated reviewers are used
      alongside human expert baselines, deterministic program authorities, and visual
      or physics-aware verification gates.'
    - 'Enforcement point differs: some systems gate final results or manuscripts,
      while others constrain source-edit boundaries and promotion decisions during
      the research loop.'
    - 'Deployment setting differs: evidence covers simulated text environments, computational
      fluid dynamics, single-cell omics, time-series forecasting, and machine-learning
      workshop writing, creating different failure surfaces and evaluation needs.'
    open_questions:
    - How well do automated task-completion and LLM-judge scores predict the validity,
      reproducibility, or real-world utility of a discovery claim?
    - Can verification and governance gates generalize beyond the specific silent
      failures or planted ablations reported, and how should miss rates be certified?
    - How should evaluation designs control for frozen base models, domain memorization,
      and stochastic agent behavior to establish robust cross-model and cross-task
      trends?
    - What minimum controls, robustness checks, falsifiability tests, and peer-review
      or human-reference thresholds should define a trustworthy autonomous research
      claim?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主发现循环系统
      解决的问题: 将LLM生成的想法转化为可运行的实验、代码、结果和论文，以支持端到端研究自动化。
      尚未覆盖: 同行评审成功不稳定，目前主要在工作坊级别得到验证；有效性声明取决于内嵌评审/评估循环的强度。
    - 路线: 面向发现智能体的基准测试套件
      解决的问题: 提供标准化任务和自动指标，在模拟与领域特定设置中比较智能体的完整科学发现周期。
      尚未覆盖: 任务完成和动作指标只是代理指标；其科学可靠性、领域多样性及与决策效用的一致性尚未建立。
    - 路线: 证据锚定的评估框架
      解决的问题: 根据证据成熟度和记录质量给主张打分，而不是复现隐藏的目标结论。
      尚未覆盖: 结果受限于少量冻结基座模型，智能体之间统计区分较弱；可接受证据和泛化标准仍未解决。
    - 路线: 验证与治理门控
      解决的问题: 加入确定性或物理感知检查，以在主张晋升前捕获静默失败、约束源码编辑并执行规范化评估。
      尚未覆盖: 消融证据显示仍可能漏过失败模式；跨领域、跨硬件验证缺失。
    - 路线: 人类参照与同行评审验证
      解决的问题: 通过人类专家基线、模拟评审或真实同行评审投稿，为自动化表现提供参照。
      尚未覆盖: 人类基线稀疏，同行评审接受范围窄且波动；缺少可信自主科学的共识阈值。
    共识:
    - 自主研究智能体能够胜任分析执行和记录工作，但现有证据反复显示其缺少对照、稳健性、可证伪性和跨数据集泛化。
    - 评估正在从复现已知发现转向盲测发现任务、证据成熟度评分和在接收主张前设置有效性门控。
    - 可靠性不能仅凭生成能力假定；需要确定性或领域特定验证来捕获静默失败和不可辩护输出。
    - 领域基准暴露了常规分析执行与可信科学主张所需判别性行为之间的差距。
    分歧:
