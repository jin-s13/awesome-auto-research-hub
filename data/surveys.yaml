  related_work_outline:
  - 'Mainstream direction: Building structured, auditable, and safe AI agents for
    scientific discovery, with emphasis on process quality (mechanism fidelity, safety,
    question formation) rather than task outcome alone.'
  - 'Shared research pattern: Wrapping LLM reasoning inside explicit frameworks (certificates,
    risk loops, bi-level planners) to gain control over hypothesis generation, experiment
    design, and safety, and using structured evaluation beyond simple task success.'
  - 'Key differences: Evaluation targets diverge (task completion vs. mechanism correctness
    vs. safety vs. goal design); domain specificity varies (constrained ML benchmarks,
    materials science, particle physics); intervention points differ (question formation,
    execution safety, objective function design).'
  - 'Trend evolution: From 2024 general-purpose benchmarks (DISCOVERYWORLD) toward
    2025–2026 frameworks that address process quality, safety, and mechanism fidelity,
    indicating a shift from outcome-only assessment to holistic scientific reasoning
    evaluation.'
  - 'Open questions: Generalizable mechanism fidelity assessment without ground truth,
    balancing safety with open-ended exploration, domain transfer of tooling and frameworks,
    and closing the gap between simulated environments and real-world laboratory discovery.'
  related_work_outline_zh:
  - 主流方向：构建结构化、可审计且安全的科学发现智能体，强调过程质量（机制保真度、安全性、问题形成）而非仅任务结果。
  - 研究共性：将LLM推理封装在显式框架中（证书、风险循环、双层规划），以控制假设生成、实验设计和安全，并使用超越任务完成的结构化评估。
  - 关键差异：评测目标不同（任务完成 vs. 机制正确性 vs. 安全性 vs. 目标设计）；领域特化程度不同（受限ML基准、材料科学、粒子物理）；干预点不同（问题形成阶段、执行安全阶段、目标函数设计阶段）。
  - 趋势演进：从2024年的通用基准环境（DISCOVERYWORLD）发展到2025–2026年关注过程质量、安全性和机制保真度的框架，表明领域正从仅关注结果转向整体科学推理质量评估。
  - 开放问题：无真实机制情况下的通用机制保真度评估，安全与开放式探索的平衡，工具与框架的领域迁移，以及模拟环境与真实实验室发现之间的差距。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark design and evaluation methodology
      what_it_solves: Provides standardized tasks, metrics, and evaluation dimensions
        (e.g., task completion, mechanism fidelity, epistemic honesty) to make agent
        performance comparable across studies.
      what_remains_open: Proxy metrics (LLM judges) show only moderate agreement with
        human experts; task coverage and evaluation dimensions may not capture open-ended
        scientific discovery or detect mechanism errors without ground truth.
    - line: Safety and auditability frameworks
      what_it_solves: Integrates trajectory-aware safety checks and structured research
        question certificates to prevent harmful tool-chain composition and enable
        explicit inspection of reasoning steps.
      what_remains_open: Defining safety boundaries without stifling creative exploration,
        generalizing audit mechanisms across diverse scientific domains, and verifying
        that certificates correctly predict downstream reasoning quality.
    - line: Automated tooling and reproducible infrastructure
      what_it_solves: Generates domain-specific vetted code libraries and virtual
        environments so that scientific coding agents can produce more accurate, complete,
        and reproducible experiments.
      what_remains_open: Code library distillation is validated only on materials
        science; generalizability to other domains and wet-lab settings is unknown,
        and the gap between simulated environments and real labs remains.
    - line: Goal-driven planning and optimization
      what_it_solves: Automates objective function design via bi-level LLM agents,
        enabling systematic exploration of objective trade-offs and accelerating discovery
        of novel molecules and materials.
      what_remains_open: Risk of over-optimization toward shallow objectives, and
        lack of evidence on whether automated goal evolution leads to scientifically
        meaningful rather than merely high-scoring results.
    - line: Conceptual frameworks for scientific reasoning
      what_it_solves: Defines taxonomy and evaluation criteria (e.g., Correct Answer
        Wrong Mechanism, research question certificates) to separate outcome from
        reasoning quality and promote epistemic honesty.
      what_remains_open: Empirical validation is limited to a single simulation task
        or preliminary LLM-judge-based studies; the proposed categories have not been
        shown to predict agent behavior in diverse or real-world discovery settings.
    consensus:
    - LLM-based agents are the central engine for scientific discovery, but they require
      external structural scaffolding to ensure reliability, safety, and auditability.
    - Outcome-only evaluation is insufficient; additional dimensions such as mechanism
      fidelity, safety, and question quality must be assessed to avoid false positives.
    - Explicit intermediate representations (certificates, risk states, objective
      functions) improve agent transparency and allow targeted interventions during
      the discovery pipeline.
    disagreements:
    - 'The primary evaluation target varies: some works prioritize task completion
      and discovery yield, while others stress reasoning correctness or resistance
      to compositional safety risks.'
    - 'Intervention granularity differs: some frameworks embed checks at every agent
      stage (SciTrace), others focus on the initial question formation (FirstResearch),
      and others automate the goal design loop (SAGA).'
    - Domain specificity ranges from general-purpose ML benchmarks with hardware constraints
      to domain-tuned code libraries in materials science, implying different assumptions
      about the availability of prior knowledge and tools.
    open_questions:
    - How can mechanism fidelity be evaluated when no ground-truth mechanism is known,
      given that current detection methods rely on known correct answers?
    - What is the trade-off between safety constraints and the creative exploration
      needed for genuine discovery, and how can it be quantified?
    - To what extent do code-distillation and virtual environment approaches transfer
      to scientific fields that are not code-centric or that require physical experimentation?
    - Do automated objective function design and goal evolution lead to confirmation
      bias, and how can the scientific value of discovered objectives be validated
      independently?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准设计与评测方法
      解决的问题: 提供标准化任务、指标和评估维度（如任务完成度、机制保真度、认知诚实），使不同智能体的性能可比。
      尚未覆盖: 代理指标（LLM评审）与人类专家仅中等一致；任务覆盖和评估维度可能无法捕捉开放式科学发现，或在无真实机制时检测机制错误。
    - 路线: 安全与可审计框架
      解决的问题: 集成轨迹感知安全检查与结构化研究问题证书，防止有害工具链组合，并允许显式检查推理步骤。
      尚未覆盖: 定义安全边界而不抑制创造性探索，将审计机制推广到不同科学领域，及验证证书是否准确预测下游推理质量。
    - 路线: 自动化工具与可复现基础设施
      解决的问题: 生成领域特定的、经过验证的代码库和虚拟环境，使科学编码智能体能产生更准确、完整且可复现的实验。
      尚未覆盖: 代码库蒸馏仅在材料科学验证，对其他领域和湿实验的泛化性未知，虚拟环境与真实实验室的差距依然存在。
    - 路线: 目标驱动的规划与优化
      解决的问题: 通过双层LLM智能体自动化目标函数设计，系统探索目标之间的权衡，加速新分子和新材料的发现。
      尚未覆盖: 浅层目标过度优化的风险，以及自动目标演化是否导致科学上有意义而非仅高分结果的证据缺失。
    - 路线: 科学推理的概念框架
      解决的问题: 定义分类法和评估标准（如正确答案错误机制、研究问题证书），将结果与推理质量解耦，提升认知诚实。
      尚未覆盖: 实证验证仅限于单一模拟任务或基于LLM评审的初步研究；所提出的类别尚未在多样或真实发现场景中证明能预测智能体行为。
    共识:
    - 基于LLM的智能体是科学发现的核心引擎，但需要外部结构支架来确保可靠性、安全性和可审计性。
    - 仅评估结果是不够的；必须额外评估机制保真度、安全性和问题质量等维度，以避免假阳性。
    - 显式中间表示（证书、风险状态、目标函数）提高了智能体透明度，并允许在发现流水线中进行有针对性的干预。
    分歧:
    - 主要评测目标各异：有的优先任务完成和发现产出，有的强调推理正确性或抵抗组合安全风险。
    - 干预粒度不同：有的框架在智能体每个阶段嵌入检查（SciTrace），有的聚焦初始问题形成（FirstResearch），有的自动化目标设计循环（SAGA）。
    - 领域特化程度从带硬件约束的通用ML基准到材料科学领域定制的代码库不等，意味着对先验知识和工具可用性的不同假设。
    开放问题:
    - 当真实机制未知时，如何评估机制保真度？当前检测方法依赖于已知正确答案，在开放式发现中不可用。
    - 安全约束与真正发现所需的创造性探索之间存在何种权衡，如何量化？
    - 代码蒸馏和虚拟环境方法在多大程度上能迁移到非代码为中心或需要物理实验的科学领域？
    - 自动化目标函数设计和目标演化是否会导致确认偏差？如何独立验证所发现目标的科学价值？
