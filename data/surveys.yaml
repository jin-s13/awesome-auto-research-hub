    - 路线: 搜索与自我改进策略
      解决的问题: 通过树搜索、多智能体辩论和跨运行进化等方法，改进假设空间探索和成果质量。
      尚未覆盖: 计算成本高；改进效果紧密耦合于底层验证信号的质量，且对发现新颖性缺乏量化度量。
    共识:
