    benchmarks, and finer-grained human-AI interaction modes.'
  - 'Open questions: How to guarantee genuine scientific novelty, bridge the gap between
    formal verification and scientific meaning, unify evaluation across disciplines,
    and determine optimal human intervention points.'
  related_work_outline_zh:
  - 主流方向：构建多智能体自主研究流水线，生成、执行、验证和自我纠正假设，并越来越重视领域特定验证门控和人机协作。
  - 研究共性：系统将科学发现分解为模块化阶段（假设生成、实验执行、结果验证、报告撰写），然后加入失败归因和自我演化循环以提升输出质量。
  - 关键差异：验证机制包括视觉-语言物理检查、Lean形式化证明和基于事实的报告；自我改进范围从单次实验因果诊断到跨运行知识积累；框架在领域特定（CFD、因果推断）与领域无关之间存在分歧。
  - 趋势演进：2025至2026年，领域从单一流水线转向具有集成验证、专业基准和更精细人机交互模式的自我演化多智能体架构。
  - 开放问题：如何保证真正的科学新颖性，弥合形式验证与科学意义之间的差距，统一跨学科评估，并确定最佳人工干预时机。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automates the full research cycle—from hypothesis proposal and
        experiment design to execution, analysis, and manuscript drafting—reducing
        human labor in routine discovery tasks.
      what_remains_open: Generalization to open-ended domains without domain-specific
        safety nets; the risk of producing plausible but invalid claims when verification
        is weak or absent.
    - line: Self-correction and failure attribution
      what_it_solves: Enables systems to recover from failed experiments by diagnosing
        root causes and adjusting hypotheses, designs, or implementations, thereby
        increasing the rate of usable outputs.
      what_remains_open: Whether the attribution mechanisms cover all common failure
        modes, and how to extend them from single-experiment loops to long-term knowledge
        accumulation without human relabeling.
    - line: Domain-specific verification and formal grounding
      what_it_solves: Catches silent errors and ensures scientific rigor by embedding
        domain knowledge (e.g., physics, formal proofs) into the validation step,
        so that only physically or logically sound claims are accepted.
      what_remains_open: The gap between a formally verified statement and its intended
        scientific meaning remains; verification gates may miss edge cases that human
        experts would catch.
    - line: Human-AI collaboration and interaction design
      what_it_solves: Integrates human judgment at high-leverage decision points to
        improve hypothesis quality, experimental validity, and trustworthiness, while
        avoiding the overhead of exhaustive manual oversight.
      what_remains_open: Optimal intervention timing, granularity, and interface design;
        the trade-off between autonomy and human effort is not yet systematically
        characterized across tasks.
    - line: Benchmarking and evaluation for scientific agents
      what_it_solves: Provides standardized tasks, metrics, and human baselines to
        compare AI scientists on tasks like cell annotation, literature-based QA,
        and full experiment cycles, making progress measurable.
      what_remains_open: Most benchmarks focus on narrow metrics or curated datasets;
        they do not yet capture the creative, open-ended nature of real scientific
        discovery or long-term research impact.
    consensus:
    - Multi-agent or modular architectures are widely adopted to separate hypothesis
      generation, execution, verification, and reporting.
    - Verification and self-correction are essential components; systems without them
      tend to produce unreliable or unverifiable results.
    - Human-AI collaboration is recognized as a practical way to improve reliability,
      but the community is still exploring the right level of autonomy.
    - Fully autonomous generation of publication-ready papers remains an unsolved
      challenge for all current systems.
    disagreements:
    - 'Verification approach: some systems use domain-specific physics-based vision-language
      gates, others rely on formal proof assistants, and still others constrain outputs
      to measured values via fact-grounding.'
    - 'Self-improvement granularity: one line focuses on multi-hypothesis failure
      attribution within a single experiment, while another evolves agents continuously
      across experimental cycles.'
    - 'Domain specificity: several pipelines are built for a single discipline (CFD,
      causal inference) to exploit domain knowledge, while others claim domain-agnostic
      generality and evaluate on broad benchmarks.'
    - 'Evaluation target: metrics include physical quantity improvement, benchmark
      scores on multiple-choice or code tasks, human preference judgments, and expert
      blind reviews, reflecting different definitions of a successful AI scientist.'
    - 'Human intervention mode: designs range from high-leverage spot checks to dashboard-based
      monitoring and rollback, differing in how much and when human input is required.'
    open_questions:
    - How can AI scientists generate hypotheses that are genuinely novel rather than
      recasting known results from the literature?
    - What additional validation is needed to ensure that a formally verified theorem
      or a physically plausible simulation result corresponds to the intended scientific
      claim?
    - Can a unified evaluation framework be built that works across computational,
      experimental, and theoretical sciences while capturing long-term discovery value?
    - What is the optimal division of labor between human scientists and AI agents
      to maximize both efficiency and scientific rigor without introducing unnoticed
      errors?
    - How do current systems perform in truly open-ended hypothesis exploration where
      the search space is not predefined by a benchmark or a specific physics model?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流水线
      解决的问题: 自动化从假设提出、实验设计到执行、分析和论文撰写的完整研究循环，减少常规发现任务中的人工劳动。
      尚未覆盖: 在缺乏领域特定安全机制的情况下向开放域泛化的能力；验证薄弱时产生看似合理但无效的主张的风险。
    - 路线: 自我纠正与失败归因
      解决的问题: 通过诊断失败根本原因并调整假设、设计或实现，使系统能从失败实验中恢复，从而提升可用产出率。
      尚未覆盖: 归因机制是否覆盖所有常见失败模式，以及如何从单次实验循环扩展到长期知识积累而无需人工重标注。
    - 路线: 领域特定验证与形式化基础
      解决的问题: 通过将领域知识（如物理、形式证明）嵌入验证步骤来捕获静默错误并确保科学严谨性，仅接受物理或逻辑上合理的主张。
      尚未覆盖: 形式化验证的陈述与预期科学意义之间的差距仍然存在；验证门控可能遗漏人类专家会发现的边缘情况。
    - 路线: 人机协作与交互设计
      解决的问题: 在高杠杆决策点引入人类判断，以提升假设质量、实验有效性和可信度，同时避免详尽人工监督的负担。
      尚未覆盖: 最佳干预时机、粒度和界面设计；自主性与人力投入之间的权衡尚未在不同任务中得到系统刻画。
    - 路线: 面向科学智能体的基准测试与评估
      解决的问题: 提供标准化任务、指标和人类基线，以比较AI科学家在细胞注释、文献问答和完整实验循环等任务上的表现，使进展可衡量。
      尚未覆盖: 多数基准聚焦于狭窄指标或策划数据集；尚未捕捉真实科学发现的创造性和开放性，或长期研究影响力。
    共识:
    - 广泛采用多智能体或模块化架构，将假设生成、实验执行、验证和报告分离。
    - 验证和自我纠正是必要组件，缺少这些机制的系统往往产生不可靠或无法验证的结果。
    - 人机协作被公认为提升可靠性的实用途径，但社区仍在探索合适的自主性水平。
    - 完全自主生成可发表论文仍然是所有当前系统尚未解决的挑战。
    分歧:
    - 验证方法：一些系统使用领域特定、基于物理的视觉-语言门控，另一些依赖形式化证明助手，还有的通过事实约束将输出限制为测量值。
    - 自我改进粒度：一条路线专注于单次实验内的多假设失败归因，而另一条路线则在跨实验周期中持续演化智能体。
    - 领域特异性：若干流水线为单一学科（CFD、因果推断）构建以利用领域知识，而其他系统声称领域无关并基于广泛基准评估。
