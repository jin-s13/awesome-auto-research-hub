  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned control and planning
      what_it_solves: Enables LLM agents to execute multi-step research actions—querying
        literature, generating hypotheses, running experiments, and self-correcting—through
        closed-loop decision-making and feedback.
      what_remains_open: Robustness of agent decisions in open-ended, long-horizon
        tasks; whether improvements come from better planning, larger models, or domain-specific
        heuristics; and how to prevent error cascades.
    - line: Evaluation and evidence design
      what_it_solves: Standardizes comparison of research agents through curated benchmarks,
        metrics (e.g., accuracy, MAE improvement), and controlled task designs (coding
        problems, survey generation, held-out validation).
      what_remains_open: Coverage of diverse scientific domains, alignment between
        proxy metrics and real-world research utility, and the lack of consensus on
        what constitutes a valid test of autonomous research capability.
    - line: Systems and reproducible infrastructure
      what_it_solves: Packages agent workflows into auditable, executable pipelines
        that produce reusable code and artifacts, enabling verification across different
        environments.
      what_remains_open: Standardized external validation across hardware, data distributions,
        and user settings; most systems lack comprehensive reproducibility artifacts
        beyond the reported experiments.
    consensus:
    - LLMs serve as the core reasoning and coding engine for research agents.
    - The research process is broken into discrete steps (search, plan, code, verify)
      with feedback signals to guide the agent.
    - Evaluation should go beyond toy tasks and move toward real scientific problem-solving,
      though implementations differ.
    - Auditability and reproducibility are emerging as desired properties of research
      agent systems.
    disagreements:
    - 'Evaluation approach: static benchmarks with pre-defined metrics versus dynamic
      held-out task transfer that measures generalization to unseen data.'
    - 'Domain scope: some works target specific scientific fields (materials, mathematics),
      while others aim for general-purpose research agents.'
    - 'Agent architecture: recursive self-improvement via reinforcement learning against
      predefined search space decomposition with inner-fold validation.'
    - 'Reproducibility granularity: some systems provide full code and auditable logs,
      while others only describe the methodology without released artifacts.'
    open_questions:
    - Do current benchmarks (e.g., academic survey tasks, coding problems) genuinely
      measure progress toward autonomous research, or do they reward narrow capabilities?
    - How can agent decision quality be validated in open-ended research where ground
      truth is unknown or evolves over time?
    - What is the minimum set of evidence (code, data, logs) required to trust a research
      agent's findings, and how can this be standardized across domains?
