  related_work_outline_zh:
  - 主流方向：在长时程闭环协议下构建和评估自主研究智能体，重点包括研究状态归属、经验/代理重用、留出验证或自生成评估。
  - 研究共性：工作引入智能体/框架/工作台，基于任务开展固定预算或基线对比，并同时报告最终质量与成本/迁移指标。
  - 关键差异：研究状态存放在何处、搜索反馈信号是什么、面向哪个领域，以及优化目标是 token 效率、oracle 查询节省、迁移还是评估器一致性。
  - 趋势演进：证据年份较窄，主要来自2026年；当前前沿显现向长预算、密封/留出验证、生成式评估器和可复用研究基础设施的演进。
  - 开放问题：短评估视界是否会误判系统、生成评估器与留出迁移如何泛化、代理/经验误差如何传播、工件可得性是否支撑可复现性。
  literature_review:
    line_of_work_matrix:
    - line: Long-horizon autonomy via explicit research-state ownership and focused
        agent contexts
      what_it_solves: Reduces context replay, duplicated work, and stalled experimentation
        by moving durable research state into a harness and assigning concrete experiments
        to agents.
      what_remains_open: Evidence focuses on software engineering, kernel optimization,
        and algorithm tasks; whether gains transfer outside these settings and under
        different search families is unverified.
    - line: Held-out transfer and auditable scientific discovery workflows
      what_it_solves: Tests whether agent-selected modeling changes survive unseen
        data and can be combined or reused across tasks rather than overfitting to
        development feedback.
      what_remains_open: Generalization is demonstrated only on ten Matbench endpoints;
        one selected intervention failed to remain best, and some search dimensions
        added little for composition tasks.
    - line: Closed-loop feedback efficiency through surrogate repair and experimental
        experience reuse
      what_it_solves: Lowers costly high-fidelity/oracle queries or experimental overhead
        by updating surrogates, selecting decision-relevant candidates, and retrieving
        historical or pilot experience.
      what_remains_open: Improving global surrogate fit does not guarantee decision
        utility; fixed surrogate error and custom automation cost remain unresolved,
        and evaluation is limited to synthetic, MADE, or unspecified autonomous research
        benchmarks.
    - line: Research workbenches, generated evaluators, and reusable skill infrastructure
      what_it_solves: Makes research tasks executable and comparable, distills repository
        know-how into reusable skills, and reduces token/development costs across
        multiple research workflows.
      what_remains_open: Generated evaluators still fall below target disagreement
        ceilings and do not transfer consistently to sealed targets; human-designed
        baselines remain strong, and artifact/code verification is not fully established
        in the packet.
    consensus:
    - Research agents are treated as closed-loop systems evaluated over extended budgets
      rather than as single-step predictors.
    - Separating durable research state or experience from the model context improves
      progress and cost efficiency.
    - Development-only feedback can be misleading, so held-out, sealed, or sparse
      high-fidelity evidence is important.
    - Cost-aware metrics such as token consumption, oracle queries, or development
      time are reported alongside final task performance.
    disagreements:
    - 'State ownership differs: some systems keep state in a harness or experience
      library, while prior designs rely on growing agent conversation history.'
    - 'Feedback source differs: inner-fold development means, held-out or sealed targets,
      sparse oracle labels, and agent-generated evaluators push search in different
      ways.'
    - 'Optimization target differs: some work optimizes final result quality, some
      token efficiency, some oracle-query savings, and some generated-evaluator agreement.'
    - 'Deployment setting differs: evaluations span coding/kernel/algorithm tasks,
      materials discovery endpoints, time series forecasting, and coding/co-work/reasoning,
      which makes direct comparison difficult.'
    open_questions:
    - Do short evaluation horizons systematically misjudge long-horizon research systems,
      and what minimum budget or checkpoint protocol would fix this?
    - Can generated evaluators close the gap to target disagreement ceilings and remain
      stable on sealed targets without human-designed task baselines dominating?
    - How well do held-out transfer and surrogate/experience reuse generalize beyond
      the specific endpoints in the packet, especially outside materials and synthetic
      discovery tasks?
    - What artifact, code, dataset, and limitation reporting practices are needed
      to verify these systems independently, given that the packet contains sparse
      reproducibility signals?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 通过显式研究状态归属与聚焦上下文的长期自主研究
      解决的问题: 通过将持久研究状态移入框架并为智能体分配具体实验，减少上下文重放、工作重复和实验停滞。
      尚未覆盖: 证据集中在软件工程、内核优化和算法任务；这些收益能否迁移到其他环境和搜索族尚未验证。
    - 路线: 具有留出迁移和可审计属性的科学发现工作流
      解决的问题: 检验智能体选择的建模变化能否在未见数据上存活，并可在任务间组合或重用，而非过拟合开发反馈。
      尚未覆盖: 泛化仅在十个 Matbench 端点上展示；一个所选干预未能保持最优，且某些搜索维度对成分任务增益有限。
    - 路线: 通过代理修复与实验经验重用的闭环反馈效率
      解决的问题: 通过更新代理、选择决策相关候选以及检索历史或试点经验，降低高保真/oracle 查询和实验开销。
      尚未覆盖: 改善全局代理拟合不保证决策效用；固定代理误差和定制自动化成本仍未解决，且评估限于合成环境、MADE 或未明确的自主研究基准。
    - 路线: 研究工作台、生成式评估器与可复用技能基础设施
      解决的问题: 使研究任务可执行、可比较，将仓库知识提炼为可复用技能，并在多个研究流程中降低 token/开发成本。
      尚未覆盖: 生成式评估器仍低于目标分歧上限，且未能在密封目标上稳定迁移；人工设计基线仍强，工件和代码验证在证据包中尚未完全确立。
    共识:
    - 研究智能体被作为闭环系统，在较长预算下评估，而非作为单步预测器。
    - 将持久研究状态或经验与模型上下文分离，可改善进展和成本效率。
    - 仅凭开发集反馈可能具有误导性，因此留出、密封或稀疏高保真证据很重要。
    - 除最终任务性能外，还报告 token 消耗、oracle 查询或开发时间等成本感知指标。
    分歧:
    - 状态归属不同：有些系统把状态放在 harness 或经验库中，而此前设计依赖不断增长的智能体对话历史。
    - 反馈来源不同：内部折开发均值、留出或密封目标、稀疏 oracle 标签以及智能体生成的评估器以不同方式引导搜索。
    - 优化目标不同：有些工作优化最终结果质量，有些优化 token 效率，有些优化 oracle 查询节省，还有些优化生成评估器一致性。
    - 部署场景不同：评估覆盖编码/内核/算法任务、材料发现端点、时间序列预测以及编码/协作/推理，直接对比较困难。
    开放问题:
    - 短评估视界是否会系统性地误判长期研究系统，需要什么最低预算或检查点协议来修正？
    - 生成式评估器能否缩小与目标分歧上限的差距，并在密封目标上保持稳定，同时不被人工设计任务基线主导？
    - 留出迁移和代理/经验重用在证据包之外的任务上能泛化到多远，尤其是在材料与合成发现之外的领域？
    - 鉴于证据包中可复现性信号稀疏，需要哪些工件、代码、数据集和局限性报告实践才能独立验证这些系统？
