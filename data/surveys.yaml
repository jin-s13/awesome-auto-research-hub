    line_of_work_matrix:
    - line: Autonomous scientific discovery pipelines
      what_it_solves: Automating literature analysis, data analysis, hypothesis generation,
        execution, and report synthesis with traceable feedback.
      what_remains_open: Whether generated knowledge is reliable outside demonstrated
        domains and whether accuracy or reproducibility gaps can be bounded.
    - line: Structured hypothesis search and planning
      what_it_solves: Organizing hypothesis or algorithm exploration through branching,
        backtracking, evolutionary selection, or iterative cycles to avoid aimless
        search.
      what_remains_open: Whether improvement comes from the search structure itself,
        the model prior, or task-specific constraints.
    - line: Domain-specific equation and architecture discovery
