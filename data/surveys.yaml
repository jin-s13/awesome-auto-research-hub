    研究路线矩阵:
    - 路线: 完整发现循环基准
      解决的问题: 评估智能体是否能在受控环境中形成假设、设计实验、分析结果并采取行动。
      尚未覆盖: 自动任务完成指标未必捕捉科学有效性，受控环境之外的任务多样性未得到证明。
    - 路线: 基于证据的开放式评测
      解决的问题: 将同行评审数据以盲任务形式暴露给智能体，按证据成熟度而非复现结果评分。
      尚未覆盖: 仅报告单一冻结基座模型；LLM裁判与人类专家的一致性及跨领域泛化尚未建立。
    - 路线: 可审计研究问题形成
      解决的问题: 在实验前结构化假设、机制、可证伪假设、测试与失败更新规则。
      尚未覆盖: 证据为初步且依赖裁判；对真实发现结果的下游影响未被展示。
    - 路线: 受限端到端编码评测
      解决的问题: 在单GPU、无互联网和时间预算约束下测试自主模型设计、实现与训练。
      尚未覆盖: 仅七个ML任务，约束设置可能不代表真实科研软件工作流或更大规模项目。
    - 路线: 经筛选的科学代码基础设施
      解决的问题: 提炼可用的领域代码示例，以提升智能体生成实验的准确性、完整性与科学合理性。
      尚未覆盖: 仅在一个领域评测；LLM裁判与专家仅中等一致，缺少外部验证。
    - 路线: 安全、具身与经验式执行
      解决的问题: 将轨迹感知安全、累积风险状态或片段经验整合进物理和虚拟执行管线。
      尚未覆盖: 跨任务、领域与故障模式的泛化尚未证明；安全机制对发现质量的影响未被单独区分。
    共识:
    - 智能体仍远未达到可信的自主科学发现；强基线在现有基准上表现出困难或表现平台化。
    - 评测越来越围绕开放式科学目标、证据成熟度、安全性和可复现性，而非简单答案匹配。
    - 智能体能够执行并记录分析或代码，但普遍缺乏对照、稳健性、可证伪性和跨领域泛化能力。
    - 自动LLM裁判被广泛使用，但其作为领域专家代理的可靠性仍未解决。
    分歧:
    - 评测目标不同：发现循环任务完成情况、证据成熟度、受限编码性能、湿实验室安全或可审计问题质量。
    - 交互场景不同：文本模拟环境、盲审数据、单GPU纯代码任务、物理或虚拟执行闭环。
    - 证据来源不同：自动指标、LLM裁判、领域专家校验，或执行成功与安全门拦截情况。
    - 表示与脚手架不同：结构化研究问题证书、提炼代码库、片段记忆，或轨迹感知风险状态。
    开放问题:
    - 自动LLM裁判在不同科学领域中与人类专家判断的一致性如何？
    - 智能体能否产生可推广的新发现，而非重新推导或复现隐性结论？
    - 安全性、可审计性与证据成熟度的改进是否能跨基座模型、领域和部署场景迁移？
