        generalizability to non-visual domains; whether the physical correctness check
        can scale to open-ended hypothesis search without pre-defined reference simulations.
    - line: Benchmarks for automated scientific discovery
      what_it_solves: Standardized evaluation of AI scientists through task suites
        that cover hypothesis formation, experiment design, and knowledge discovery,
        with human performance baselines for comparison.
      what_remains_open: Coverage of real-world scientific complexity remains limited;
        proxy metrics like task completion may not capture the full utility of scientific
        discovery; existing benchmarks are text or simulated environments that may
        not transfer to wet-lab or computational science in practice.
    - line: Failure analysis and self-correction
      what_it_solves: Systematic identification of failure modes (e.g., implementation
        drift, overexcitement) and self-correction via multi-hypothesis causal attribution,
        improving the rate of metric-bearing outputs and artifact quality.
      what_remains_open: Fully autonomous scientific writing and conference-ready
        paper generation remain unsolved; the systems still lack deep scientific taste
        and long-horizon memory; the self-correction approaches were evaluated on
        limited benchmarks and may not cover all failure types.
    consensus:
    - AI scientist systems can complete end-to-end research cycles and produce papers
      that meet basic acceptance thresholds in limited settings, but fully autonomous
      and reliable scientific discovery is not yet achieved.
    - Verification gates and fact-constrained reporting are critical to prevent hallucinated
      numerical results and invalid experimental outcomes.
    - Standardized benchmarks with human baselines are necessary for quantifying progress,
      but current benchmarks only partially capture the multidimensional nature of
      scientific discovery.
    - Failure modes such as implementation drift, memory degradation, and overexcitement
      are recurrent across different architectures, indicating fundamental challenges
      in long-horizon autonomous research.
    disagreements:
    - 'Evaluation method: some works rely on simulated automated reviewer scores,
      while others use task completion metrics on benchmarks or human expert judgment,
      leading to different standards for what constitutes success.'
    - 'System architecture: single-agent pipelines with fixed stages vs. multi-agent
      teams with customizable roles and tree-search-based planning, differing in how
      they allocate reasoning and execution.'
    - 'Failure handling: simple reflection loops that re-prompt the model vs. structured
      multi-hypothesis failure attribution that deterministically routes interventions
      to hypothesis, design, or implementation level.'
    - 'Domain generality: general-purpose AI scientist frameworks target multiple
      ML subfields, whereas domain-specific systems embed physical or biological constraints,
      raising disagreement on whether generality or domain grounding is more effective.'
    open_questions:
    - How can the vision-language verification gate in CFD scientist be improved to
      catch the remaining 12.5% of silent failures, and can this approach be abstracted
      to other simulation-based sciences?
    - What mechanisms can ensure that self-correcting systems like SAGE do not converge
      to shallow improvements and instead produce genuinely novel scientific insights
      beyond the training data distribution?
    - To what extent do automated reviewer scores correlate with the long-term scientific
      impact of a discovery, and can we design metrics that incentivize depth rather
      than surface-level validity?
    - How can we build AI scientists that maintain consistent memory and scientific
      reasoning over much longer research campaigns, avoiding the context degradation
      observed in multi-step pipelines?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流水线
      解决的问题: 实现从想法生成到论文写作的全自动研究，降低单篇论文成本，并证明前沿LLM能产出通过自动评审或工作坊同行评审的稿件。
      尚未覆盖: 自动评审的可靠性及其与人类判断的一致性；跨多元科学领域和顶级会议的泛化性；超越模板化生成的真实科学新颖性保证。
    - 路线: 领域特定科学发现与物理验证
      解决的问题: 在计算流体动力学中自主实验，集成视觉-语言物理验证门控，以检测静默仿真失败，并在结果被接受前确保物理有效性。
      尚未覆盖: 验证门控在消融中漏检了16个植入失败中的2个；对非视觉领域的可扩展性；物理正确性检查能否在无预定义参考仿真的情况下支持开放式假设搜索。
    - 路线: 自动化科学发现评估基准
      解决的问题: 通过覆盖假设形成、实验设计和知识发现的任务套件，对AI科学家进行标准化评估，并提供人类表现基线作为对比。
      尚未覆盖: 现实世界科学复杂性的覆盖度有限；任务完成等代理指标可能无法捕捉科学发现的完整效用；现有基准多为文本或模拟环境，可能无法迁移到湿实验或实际计算科学中。
    - 路线: 失败分析与自我纠正
      解决的问题: 系统性识别失败模式（如实现漂移、过度兴奋），并通过多假设因果归因实现自我纠正，提高包含指标的报告产出率和工件质量。
      尚未覆盖: 完全自主的科学写作和会议级别论文生成仍未解决；系统仍缺乏深层科学品味和长时记忆；自我纠正方法仅在有限基准上评估，可能未覆盖所有失败类型。
    共识:
    - AI科学家系统能完成端到端研究循环，并在有限场景下产出达到基本接受阈值的论文，但完全自主且可靠的科学发现尚未实现。
    - 验证门控和事实约束报告对于防止幻觉数值结果和无效实验输出至关重要。
    - 具有人类基线的标准化基准对于量化进展是必要的，但当前基准仅部分捕捉了科学发现的多维本质。
    - 实现漂移、记忆退化和过度兴奋等失败模式在不同架构中反复出现，表明长时程自主研究存在根本性挑战。
    分歧:
    - 评估方法：部分工作依赖模拟自动评审分数，其他工作则采用基准任务完成度指标或人类专家判断，导致对成功的定义标准不同。
    - 系统架构：具有固定阶段的单智能体流水线 vs. 可定制角色和基于树搜索规划的多智能体团队，在推理和执行的分配方式上存在差异。
    - 失败处理：简单的反思循环重新提示模型 vs. 结构化的多假设失败归因，将干预措施确定性路由到假设、设计或实现层面。
    - 领域通用性：通用型AI科学家框架针对多个机器学习子领域，而领域专用系统嵌入物理或生物约束，引发了通用性还是领域扎根更有效之争。
    开放问题:
    - 如何改进CFD科学家的视觉-语言验证门控，以捕捉剩余12.5%的静默失败，且该方法能否抽象到其他基于仿真的科学领域？
    - 何种机制能确保像SAGE这样的自我纠正系统不会收敛到浅层改进，而是产生超出训练数据分布的真实新颖科学洞察？
    - 自动评审分数与科学发现的长期影响力在多大程度上相关，我们能否设计出激励深度而非表面有效性的指标？
    - 如何构建能长时间保持记忆和科学推理的AI科学家，避免多步流水线中观察到的上下文退化问题？
