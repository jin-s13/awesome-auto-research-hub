  related_work_outline:
  - 'Mainstream direction: building multi-agent systems that automate literature synthesis,
    evidence reasoning, verification, and manuscript or review drafting for scientific
    discovery.'
  - 'Shared research pattern: staged retrieval, synthesis, verification, and writing
    workflows are evaluated with automated LLM judges or benchmark protocols derived
    from peer-reviewed studies.'
  - 'Key differences: some work emphasizes end-to-end paper generation, while others
    emphasize evidence-grounded benchmarking; settings range from domain-specific
    omics tasks to domain-agnostic blind tasks.'
  - 'Trend evolution: available top evidence is concentrated in 2025–2026, showing
    a shift from survey/failure analysis toward evidence-maturity benchmarks and self-evolving
    agent frameworks within the current frontier.'
  - 'Open questions: whether automated judges and benchmark scores transfer across
    base models, domains, and languages, and how to verify logical soundness of generated
    reviews and gap claims.'
  related_work_outline_zh:
  - 主流方向：构建多智能体系统，自动化文献综合、证据推理、验证以及论文或综述草稿生成。
  - 研究共性：将检索、综合、验证和写作组织为分阶段工作流，并采用自动LLM评判或来自同行评审研究的基准协议进行评估。
  - 关键差异：部分工作侧重端到端论文生成，部分侧重证据锚定基准；设置从领域特定的组学任务到领域无关的盲任务不等。
  - 趋势演进：现有主要证据集中在2025–2026年，显示当前前沿从综述与失败分析转向证据成熟度基准和自演化智能体框架。
  - 开放问题：自动评判器与基准分数能否跨基座模型、学科和语言迁移，以及如何验证生成综述与研究缺口主张的逻辑可靠性。
  literature_review:
    line_of_work_matrix:
    - line: Automated literature synthesis and manuscript generation
      what_it_solves: Turns sparse research goals into structured literature reviews,
        derivations, and draft papers by composing retrieval, reasoning, verification,
        and writing agents.
      what_remains_open: Current evidence relies on LLM-rubric scores for generated
        papers; independent logical verification and external reviewer generalization
        are not shown.
    - line: Evidence-grounded agent benchmarks and automated judges
      what_it_solves: Makes scientific discovery and literature-derived claims comparable
        through blind tasks from peer-reviewed studies, frozen data, and artifact-based
        evaluation.
      what_remains_open: Reported comparisons are limited to a single frozen base
        model; agents lack controls, robustness, falsifiability, and cross-dataset
        generalization.
    - line: Survey, failure analysis, and design principles for autonomous research
        workflows
      what_it_solves: Organizes fragmented multi-agent research and literature systems
        into workflow stages, failure modes, metrics, and design guidance.
      what_remains_open: Categories and design principles are mostly descriptive;
        empirical validation that they predict reliability or literature-review quality
        is missing.
    - line: Self-evolving scalable agent frameworks
      what_it_solves: Reduces per-domain engineering by providing domain-agnostic
        agents that refine hypotheses, self-critique, and accumulate knowledge across
        cycles.
      what_remains_open: Benchmark gains are not yet tied to independent literature-search,
        citation-analysis, or review-quality outcomes; external validation across
        settings remains open.
    consensus:
    - Multi-agent workflows separate retrieval, synthesis, verification, and writing
      roles to reduce human expert effort.
    - Evaluation is shifting toward automated, evidence-grounded protocols that demand
      more than reproducing hidden target answers.
    - Current systems perform competent analysis execution and documentation but are
      not yet reliable enough to make trustworthy autonomous scientific claims.
    - Literature review automation, system reliability, and evaluation validity are
      treated as core open challenges.
    disagreements:
    - 'Capability claims conflict with evidence: some frameworks report state-of-the-art
      benchmark gains, while evidence-grounded benchmarks show coding agents clustering
      near 58–60/100 without reliable pairwise separation.'
    - 'Evaluation target and supervision differ: domain-specific annotation and multiple-choice
      tasks with human baselines versus domain-agnostic blind tasks with an LLM evidence-maturity
      judge versus general benchmark suites.'
    - 'Quality signal differs: LLM rubric scoring of generated manuscripts versus
      artifact-level evidence maturity scoring versus direct human comparison.'
    - 'Reproducibility and robustness priorities differ: self-evolving infrastructure
      emphasizes scalability, while benchmark studies highlight missing controls,
      single-base-model limits, and absent generalization.'
    open_questions:
    - Can LLM-based evidence-maturity judges be calibrated to avoid hidden-answer
      leakage and rubric overfitting when evaluating literature-derived claims?
    - Do reported autonomous literature and research results transfer across frozen
      and unfrozen base models, different scientific domains, and non-English sources?
    - What independent verification would show that a generated survey or research-gap
      statement is logically sound, not just highly scored by an automated rubric?
    - How can literature search, citation analysis, survey synthesis, and research-gap
      discovery be benchmarked as distinct sub-capabilities rather than collapsed
      into end-to-end manuscript generation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动化文献综合与论文生成
      解决的问题: 通过组合检索、推理、验证和写作代理，把稀疏研究目标转化为结构化综述、推导和论文草稿。
      尚未覆盖: 现有证据依赖LLM评分标准评估生成论文，尚无独立逻辑验证或外部评审泛化证据。
    - 路线: 证据锚定的智能体基准与自动评判
      解决的问题: 通过来自同行评审研究的盲任务、冻结数据和基于产出的评估，让科学发现与文献衍生主张可比。
      尚未覆盖: 报告比较仅基于单一冻结基座模型；智能体缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 路线: 自主研究工作流的综述、失败分析与设计原则
      解决的问题: 把碎片化多智能体研究和文献系统组织为工作流阶段、失败模式、指标和设计指南。
      尚未覆盖: 分类与设计原则主要为描述性，缺乏其能否预测系统可靠性或文献综述质量的实证验证。
    - 路线: 自演化可扩展智能体框架
      解决的问题: 通过提供领域无关并可自演化、自批评、跨周期积累知识的智能体，减少逐领域工程负担。
      尚未覆盖: 基准提升尚未关联到独立文献检索、引文分析或综述质量结果，跨环境外部验证仍开放。
    共识:
    - 多智能体工作流将检索、综合、验证和写作分工，旨在减少人类专家干预。
    - 评测正向自动化、证据锚定协议转变，要求超越对隐藏目标答案的复现。
    - 现有系统能胜任分析执行和文档记录，但尚不足以做出可信的自主科学主张。
    - 文献综述自动化、系统可靠性与评测有效性被视为核心开放挑战。
    分歧:
    - 能力主张与证据冲突：部分框架报告最先进基准提升，而证据锚定基准显示编码智能体得分集中在约58–60/100，成对差异不可靠。
    - 评测对象与监督信号不同：领域特定标注与选择题任务配人类基线，领域无关盲任务配LLM证据成熟度评判，以及通用基准套件并存。
    - 质量信号不同：生成手稿的LLM评分与工件级证据成熟度评分及直接人类对比存在差异。
    - 可复现性与稳健性重点不同：自演化基础设施强调可扩展性，基准研究强调缺少对照、单一基座模型限制和泛化缺失。
    开放问题:
    - 在评估文献衍生主张时，能否校准基于LLM的证据成熟度评判器，以避免隐藏答案泄漏和评分标准过拟合？
    - 已报告的自主文献与研究结果能否跨冻结与非冻结基座模型、不同科学领域和非英语来源迁移？
    - 何种独立验证能证明生成综述或研究缺口陈述逻辑可靠，而不仅是自动评分高？
    - 如何将文献检索、引文分析、综述综合和研究缺口发现作为不同子能力进行基准测试，而不是并入端到端论文生成？
