  related_work_outline_zh:
  - 主流方向：构建端到端自主研究智能体，把选题、实验、验证与论文撰写串成可运行流水线，并逐步加入验证门控、自纠正和人机协同机制。
  - 研究共性：多智能体或 agentic 工作流普遍分解构思、代码执行、结果核查、评审和写作，并用 LLM/VLM 评审、评分标准、同行评审或任务指标做评估。
  - 关键差异：通用科研流水线与面向数学、计算流体的专用验证流程不同；自主程度和人机介入粒度不同；失败处理从反思、辩论到因果归因和视觉语言门控，粒度不同；评测目标也不同。
  - 趋势演进：证据集中在2024–2026前沿，从全自动论文生成进入工作坊同行评审，再到更强调领域验证、失败归因、可验证报告和人机协作。
  - 开放问题：自动评审与人类科学判断是否一致、验证门控漏检率与跨领域迁移、人机协作最优边界，以及论文生成能否稳定复现并达到会议级水准仍缺少系统证据。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end manuscript generation
      what_it_solves: Converts ideation, code execution, visualization, and drafting
        into an automated pipeline that can produce complete research papers at low
        per-paper cost.
      what_remains_open: Whether generated papers have reliable novelty, scientific
        soundness, and reproducibility beyond the system's own reviewer or rubric.
    - line: Domain-specific verification gating
      what_it_solves: Adds mathematical, logical, or physics-based checks before claims
        are accepted or written, reducing silent failures in constrained domains.
      what_remains_open: Verification gates still miss some planted failures, and
        their transfer to domains without simulators or visual evidence is unclear.
    - line: Self-correction and failure attribution
      what_it_solves: Diagnoses failed experiments and routes interventions to hypothesis,
        design, or implementation layers, improving metrics-bearing output and artifact
        quality.
      what_remains_open: Long-horizon memory, causal attribution confidence, scientific
        taste, and fully autonomous recovery across many topics remain unresolved.
    - line: Human-AI collaboration and oversight
      what_it_solves: Places human intervention at high-leverage decision points,
        balancing fully autonomous workflows with step-by-step oversight.
      what_remains_open: The optimal intervention granularity, phase selection, and
        a standardized collaboration protocol across communities are not established.
    - line: Automated reviewing and evidence design
      what_it_solves: Uses LLM review, workshop or peer-review submission, and benchmark
        metrics as proxy evidence for generated paper and artifact quality.
      what_remains_open: Agreement between proxy metrics and human peer review or
        real scientific utility has only limited evidence, especially beyond single
        acceptance cases.
    consensus:
    - Multi-stage or multi-agent pipelines generally cover ideation, experiment execution,
      verification, and manuscript writing.
    - LLM or vision-language reviewers are used as proximal evaluators, but human
      or peer review is still needed to confirm generated paper quality.
    - Verification and self-correction tend to produce more reliable metric-bearing
      outputs and higher artifact quality than unverified end-to-end generation.
    - Full autonomy remains inconsistent, while targeted human collaboration or domain-specific
      verification improves reliability.
    disagreements:
    - 'Evaluation targets differ: simulated review acceptance thresholds, actual workshop
      peer review, domain physical or numerical metrics, artifact quality, and blind
      scores are not directly interchangeable.'
    - 'Human role differs: systems range from fully autonomous runs, principal investigator/graduate-student
      collaboration, multi-mode intervention, to exhaustive step-by-step oversight,
      so conclusions depend on baseline design.'
    - 'Failure control differs: reflective feedback, structured debate, multi-hypothesis
      causal attribution, and vision-language gating each assume different granularity
      and explainability for self-correction.'
    - 'Generality differs: general machine-learning pipelines and constrained applied-mathematics
      or computational-fluid workflows adopt different verification and writing assumptions.'
    open_questions:
    - Do automated review scores or benchmark gains predict true peer-review quality,
      long-term citation, or reproducibility?
    - What are verification-gate missed-failure rates and cross-domain transfer properties
      beyond small ablation examples?
    - Which human-AI collaboration mode generalizes across research phases, fields,
      and community norms?
    - Where evidence lacks code, data, baselines, or limitation details, can these
      be resolved as metadata gaps rather than true non-availability?
    - Can full paper generation consistently reach conference-level peer review beyond
      a single workshop acceptance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端手稿生成
      解决的问题: 将构思、代码执行、可视化和论文撰写集成到自动化流程，降低单篇论文生成成本。
      尚未覆盖: 生成论文的新颖性、科学可靠性和可复现性是否经得起系统自身评审之外的长期验证。
    - 路线: 领域特定验证门控
      解决的问题: 在结果被接受或写入论文前加入数学逻辑、物理视觉等检查，减少受约束领域中的静默失败。
      尚未覆盖: 门控仍会漏检部分植入失败，其在没有仿真器或视觉证据的领域中的可迁移性不清晰。
    - 路线: 自我纠正与失败归因
      解决的问题: 诊断实验失败原因并路由到假设、设计或实现层，提高含指标输出和工件质量。
      尚未覆盖: 长跨度记忆、因果归因可信度、科学品味和跨主题全自主恢复仍未解决。
    - 路线: 人机协作与监督
      解决的问题: 在高杠杆决策点引入人工干预，在完全自主和逐步监督之间取得平衡。
      尚未覆盖: 最佳干预粒度、阶段选择和跨社区标准化协议尚未建立。
    - 路线: 自动评审与证据设计
      解决的问题: 用 LLM 评审、工作坊或同行评审投稿、基准指标作为生成论文和工件质量的代理证据。
      尚未覆盖: 代理指标与人类同行评审或真实科研效用之间的一致性证据不足，尤其缺少多次接受案例。
    共识:
    - 多阶段或多智能体流水线普遍覆盖构思、实验执行、验证和论文撰写。
    - LLM 或视觉语言模型评审被用于近端评估生成论文，但仍需人工或同行评审确认。
    - 验证与自纠正通常比无门控端到端生成产生更可靠的指标内容和更高质量工件。
    - 全自主仍不稳定，精准人工协作或领域专用验证能提升可靠性。
    分歧:
    - 评测目标不同：模拟评审阈值、实际工作坊同行评审、领域物理或数值指标、工件质量和盲评分难以直接比较。
    - 人工角色不同：从完全自主、首席研究员/研究生式协作、多模式干预到逐步监督，结论受基线设计影响。
    - 失败控制不同：反思反馈、结构化辩论、多假设因果归因和视觉语言门控在粒度和可解释性上各不相同。
    - 通用与专用不同：通用机器学习流水线与受约束的数学、计算流体工作流采用不同的验证和写作假设。
    开放问题:
    - 自动评审分数或基准提升能否预测真实同行评审质量、长期引用和可复现性？
    - 验证门控在更大样本上的漏检率与跨领域迁移证据是否充分？
    - 哪种人机协作模式能在不同研究阶段、领域和社区规范间泛化？
    - 证据中缺少代码、数据、基线或局限性信息时，应作为验证缺口而非直接判定不可用。
    - 除单篇工作坊论文外，能否稳定生成达到会议级同行评审水准的论文仍未证实。
