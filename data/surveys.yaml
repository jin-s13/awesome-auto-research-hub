    - 路线: 受限端到端编码评测
      解决的问题: 在单GPU、无互联网和时间预算约束下测试自主模型设计、实现与训练。
      尚未覆盖: 仅七个ML任务，约束设置可能不代表真实科研软件工作流或更大规模项目。
    - 路线: 经筛选的科学代码基础设施
      解决的问题: 提炼可用的领域代码示例，以提升智能体生成实验的准确性、完整性与科学合理性。
      尚未覆盖: 仅在一个领域评测；LLM裁判与专家仅中等一致，缺少外部验证。
    - 路线: 安全、具身与经验式执行
      解决的问题: 将轨迹感知安全、累积风险状态或片段经验整合进物理和虚拟执行管线。
