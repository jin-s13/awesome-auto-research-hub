        claims; observed failures include implementation drift, memory degradation,
        and overexcitement.
    - line: Benchmarking and evaluation environments for discovery agents
      what_it_solves: Provides task suites, completion metrics, and human or AI baselines
        to compare discovery agents on scientific reasoning loops.
      what_remains_open: Task coverage is narrow relative to real scientific work;
        proxy metrics may not align with actual discovery value or lab-deployable
        conclusions.
    - line: Domain-specific validation and verification
      what_it_solves: Embeds physical or biological constraints, real datasets, and
        validity gates to catch silent failures before reporting.
      what_remains_open: Verification gates still miss planted failures; domain-specific
        success does not yet demonstrate cross-domain generalization.
    - line: Failure diagnosis and self-correction
      what_it_solves: Uses multi-hypothesis failure attribution and grounded reporting
        to improve execution success and reduce hallucinated results.
      what_remains_open: Conference-ready autonomous writing remains unsolved; attribution
        and grounding improve artifacts but do not fully handle scientific taste or
        long-horizon reasoning.
    - line: Interactive and reproducible research infrastructure
      what_it_solves: Offers customizable multi-agent roles, monitoring, rollback,
        and code harnesses to make research workflows runnable and inspectable.
      what_remains_open: External validation is limited to a few internal case studies;
        evidence of cross-hardware, cross-dataset, and cross-user generalization is
        missing.
    - line: Failure-mode analysis and design principles
      what_it_solves: Organizes recurring autonomous-research failures into design
        insights such as implementation drift, weak domain intelligence, and poor
        scientific taste.
      what_remains_open: Lacks direct empirical validation that the proposed failure
        categories predict system behavior across tasks.
    consensus:
    - Agent-based workflows agree that scientific discovery can be decomposed into
      ideation, implementation, execution, analysis, and reporting stages.
    - There is convergent effort to add external evaluation signals such as benchmarks,
      human baselines, automated review, AI judges, or validity gates because generated
      papers alone are insufficient evidence.
    - Current systems are treated as partial research assistants rather than fully
      reliable autonomous scientists; acceptance or benchmark gains occur on narrow
      cases.
    - Reproducibility is addressed through open-source code, task suites, and monitoring
      harnesses, but evidence of generalizable external validation is still weak.
    disagreements:
    - 'Evaluation target differs: narrow task completion metrics, human expert preference,
      automated peer-review acceptance, or domain quantitative improvement.'
    - 'Environment differs: simulated text-based discovery tasks, real domain datasets,
      or ML codebases change which failure modes can be observed.'
    - 'Control differs: fully autonomous pipelines versus interactive human-in-the-loop
      monitoring, rollback, and recovery.'
    - 'Reliability mechanisms differ: vision-language physical gates, multi-hypothesis
      failure attribution, grounded reporting, or automated reviewing assume different
      dominant failure sources.'
    - 'Domain scope differs: physics or biology systems constrain search with field-specific
      validity, while general research agents prioritize cross-domain ML workflows.'
    open_questions:
    - How often do validity gates miss silent failures, and what error rate is acceptable
      for autonomous scientific reporting?
    - Do benchmark task completion and reviewer scores predict real scientific utility
      or laboratory reproducibility?
    - Can autonomous research systems maintain coherence across long-horizon tasks
      without memory degradation, implementation drift, or overexcitement?
    - How well do systems tested on a few internal case studies or submitted manuscripts
      generalize across domains, datasets, and computing environments?
    - What independent code, datasets, and evaluation protocols are available for
      external reproduction given inconsistent reproducibility signals?
    - What governance mechanisms should apply to these systems when the available
      evidence focuses on evaluation and reliability rather than oversight, access,
      or risk controls?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究工作流自动化
      解决的问题: 在LLM智能体流水线中自动完成想法生成、代码实现、实验执行、可视化、论文写作和评审。
      尚未覆盖: 这些系统能否持续产出可同行评审的有效结论；已观察到实现漂移、记忆退化和过度乐观等失败。
    - 路线: 发现智能体的基准与评测环境
      解决的问题: 提供任务集、完成指标和人类或AI基线，以比较智能体在科学推理循环上的表现。
      尚未覆盖: 任务覆盖相对真实科研较窄；代理指标可能不等同于实际发现价值或可落地的实验结论。
    - 路线: 领域专用验证与核实
      解决的问题: 嵌入物理或生物约束、真实数据和有效性门控，在报告前捕获静默失败。
      尚未覆盖: 验证门控仍漏检部分注入失败；领域专用成功不等于跨领域泛化。
    - 路线: 失败诊断与自我纠正
      解决的问题: 通过多假设失败归因和有依据报告提高执行成功并减少幻觉结果。
      尚未覆盖: 完全自主写出可投会议论文仍未解决；归因和事实约束不足以处理科学品味和长程推理。
    - 路线: 交互式与可复现研究基础设施
      解决的问题: 提供可定制多智能体角色、监控、回滚和代码工具，使研究流程可运行、可检查。
      尚未覆盖: 外部验证仅限少量内部案例；跨硬件、跨数据集和跨用户泛化的证据不足。
    - 路线: 失败模式分析与设计原则
      解决的问题: 把重复性自主研究失败组织为实现漂移、领域智能不足和科学品味薄弱等设计洞见。
      尚未覆盖: 缺少直接实证验证这些失败类别能否预测系统在不同任务上的行为。
    共识:
    - 基于智能体的工作流普遍把科学发现分解为想法生成、实现、执行、分析和报告阶段。
    - 普遍引入基准、人类基线、自动评审、AI评审或有效性门控等外部评估信号，因为仅生成论文不足以构成证据。
    - 当前系统被定位为部分研究辅助者而非完全可靠的自主科学家；通过评审或基准提升仅见于狭窄案例。
    - 通过开源代码、任务集和监控工具强调可复现，但仍缺乏可泛化的外部验证证据。
    分歧:
    - 评测目标不同：任务完成指标、人类专家偏好、自动同行评审接受或领域定量改进。
    - 环境不同：模拟文本发现任务、真实领域数据集或ML代码库，导致能观察到的失败类型不同。
    - 控制方式不同：全自动流水线对比交互式人类监控、回滚与恢复。
    - 可靠性机制不同：视觉-语言物理门控、多假设失败归因、有依据报告或自动评审，隐含不同的主要失败来源。
    - 领域范围不同：物理或生物系统用领域约束限制搜索，通用智能体更强调跨领域ML工作流。
    开放问题:
    - 有效性门控漏掉静默失败的频率多高，自主科学报告可接受多大错误率？
    - 基准任务完成率和评审分数能否预测真实科研效用或实验室可复现性？
    - 自主研究系统能否在长程任务中保持连贯，避免记忆退化、实现漂移和过度乐观？
    - 仅在少量内部案例或少数提交论文上测试的系统，跨领域、数据集和计算环境的泛化能力如何？
    - 在可复现信号不一致的情况下，有哪些独立可获取的代码、数据集和评测协议能支持外部验证？
    - 当前证据聚焦评测和可靠性而非监督、访问或风险控制时，应适用哪些治理机制？
