  - 趋势演进：从2024年通用自动科学发现，走向2025-2026年领域绑定、自纠正、可验证报告与人机协作并行的系统；证据集中在当前前沿窗口。
  - 开放问题：跨领域泛化、多篇投稿的稳定性、最优人工干预节点、自动评审与真实同行评审的一致性，以及基准增益能否转化为被接受的论文。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research-to-manuscript generation
      what_it_solves: Covers ideation through code or experiment execution, visualization,
        and full paper drafting in one pipeline, reducing cost and manual burden for
        producing initial manuscripts.
      what_remains_open: Consistent generation of peer-acceptable papers is undemonstrated;
        evidence shows partial success only, and several records lack explicit limitation
        statements or external citation impact data.
    - line: Domain-grounded discovery and verification
      what_it_solves: Adds domain-specific validity checks such as physics-aware or
        knowledge-based verification to prevent silent failures before results enter
        the manuscript.
      what_remains_open: Demonstrated mostly in applied mathematics and computational
        fluid dynamics; domain gates can still miss planted failures, and cross-discipline
        generalization remains a verification gap.
    - line: Human-AI collaborative autonomous research
      what_it_solves: Positions human expertise as principal investigator or high-leverage
        reviewer rather than stepwise operator, aiming to keep autonomous execution
        while improving decision quality.
      what_remains_open: Optimal intervention modes are not established beyond a single
        experiment-stage benchmark, and long-horizon real project outcomes are not
        covered by the evidence.
    - line: Self-correction through failure attribution
      what_it_solves: Diagnoses failed autonomous experiments and routes corrections
        to hypothesis, design, or implementation levels, improving the share of runs
        with measurable outputs.
      what_remains_open: Conference-ready writing remains an unsolved problem in the
        evidence; replication is limited by sparse code or artifact signals and narrow
        benchmark coverage.
    - line: Automated review and quality gating for generated manuscripts
      what_it_solves: Uses LLM or vision-language reviewers and rubrics to score generated
        papers, figures, or claims as a scalable alternative to exhaustive human review.
      what_remains_open: Proxy review is only near-human or threshold-level in limited
        settings; full peer-review acceptance is rare and not consistently replicated.
    consensus:
    - Multiple systems connect literature access, idea generation, experiment execution,
      and manuscript drafting instead of treating writing as an isolated step.
    - There is shared concern that generated results and citations can be hallucinated,
      leading to verification gates, grounded reporting, or executable result checks.
    - Human input is not eliminated; the trend is toward selective expert oversight
      at high-leverage points rather than full step-by-step control.
    - Evaluation mixes automated or LLM-based review with task metrics and artifact
      quality, but real human peer acceptance is still uncommon.
    disagreements:
    - 'Full autonomy versus human-AI collaboration: some systems aim to reduce stepwise
      human control, while others report that targeted human oversight outperforms
      both full autonomy and exhaustive supervision.'
    - 'Verification strategy differs: domain-specific physics or vision-language gates
      appear in some work, while others rely on general reasoning consistency, citation
      grounding, or agentic search.'
    - 'Primary evaluation target differs: peer-review or workshop acceptance, experiment-stage
      benchmark score, artifact quality score, or domain-specific physical error reduction.'
    - 'Failure recovery mechanisms differ: simple reflection, progressive tree search,
      multi-hypothesis causal attribution, and self-healing pivot or refine loops
      are used across systems.'
    - 'Reproducibility posture is uneven: only some records provide strong open-source
      or repository signals, while others have no citation data or explicit limitation
      fields, creating a cross-system verification gap.'
    open_questions:
    - Can autonomous research-writing systems produce conference-ready or journal-ready
      manuscripts consistently, given the limited acceptance evidence and the explicit
      statement that the problem remains unsolved?
    - Do domain-specific verification gates transfer from the demonstrated physics
      and applied-math settings to broader scientific writing tasks without missing
      similar failure modes?
    - Which human-AI collaboration points are necessary and sufficient, and do the
      reported benefits generalize beyond experiment-stage benchmarks?
    - Are LLM-based or vision-language-model-based automated reviewers reliable substitutes
      for human peer review in measuring scientific contribution rather than surface
      quality?
    - Does improving metrics-bearing output or artifact quality translate into valid,
      original research contributions, or mainly into better execution and formatting?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究到论文生成
      解决的问题: 把构思、代码或实验执行、可视化和论文撰写整合为一条流水线，降低首稿成本并覆盖完整科学传播流程。
      尚未覆盖: 稳定产出可被同行接受的论文仍缺乏证据；部分成功案例之外，多项记录未提供完整局限性或外部引用数据。
    - 路线: 领域绑定发现与验证
      解决的问题: 在结果进入论文前加入物理感知或知识一致性检查，减少求解器或逻辑层面的静默失败。
      尚未覆盖: 主要在应用数学和计算流体动力学中展示；专用门控仍会漏检失败，跨领域泛化尚未被验证。
    - 路线: 人机协作自主研究
      解决的问题: 把人类从逐步操作者变为高杠杆决策点上的负责人或审阅者，兼顾自主执行与专家判断。
      尚未覆盖: 最优干预模式仅在单一实验阶段基准上比较，长期真实项目中的效果和适用边界仍不明确。
    - 路线: 基于失败归因的自纠正
      解决的问题: 诊断自主实验失败并分配到假设、设计或实现层，提高可测输出比例和工件质量。
      尚未覆盖: 可提交会议级别的论文写作仍被认定为未解决；代码和工件证据有限，基准覆盖较窄。
    - 路线: 生成稿件的自动评审与质量门控
      解决的问题: 用LLM或视觉语言模型对论文、图表和结果声明进行评分，作为降低人工评审负担的可扩展方案。
      尚未覆盖: 这些代理指标只在有限场景中达到接近人类或阈值水平；真实同行评审接受仍罕见且不稳定。
    共识:
    - 多类系统把文献获取、想法生成、实验执行和论文撰写串成闭环，而非把写作当作孤立步骤。
    - 普遍关注生成结果和引用可能是幻觉，因此加入验证门控、事实约束报告或可执行结果检查。
    - 人类输入未被完全移除，趋势是转向高杠杆节点的选择性监督，而不是逐步控制。
    - 评估混合使用LLM评审、任务指标和工件质量，但真实人类同行接受仍不常见。
    分歧:
    - 全自主与人机协作之间存在张力：一些系统追求减少逐步人工控制，另一些则报告精准人工介入优于完全自主和过度监督。
    - 验证策略不同：有的采用领域专用物理或视觉语言门控，有的依赖通用逻辑一致性、引用约束或智能体树搜索。
    - 主要评测目标不同：同行或工作坊接收、实验阶段基准得分、工件质量评分或领域物理误差下降各被强调。
    - 失败恢复机制不同：从简单反思到渐进树搜索、多假设因果归因和自愈执行循环不等。
    - 可复现性证据不均衡：部分系统提供开源信号，其余缺少引用数据或明确限制字段，形成跨系统验证缺口。
    开放问题:
    - 自主研究写作系统能否稳定产出会议或期刊可接受论文，尤其是现有证据只显示部分接受，且论文明确称该问题仍未解决？
    - 领域专用验证门控能否从应用数学和计算流体动力学推广到更广科学写作任务，同时不产生类似漏检？
    - 哪些人机协作节点是必要且充分的，报告所得收益能否在实验阶段基准之外推广？
    - LLM或视觉语言模型自动评审能否替代人类同行评审，判断科学贡献而不只是表面质量？
    - 提升含指标输出比例或工件质量，能否转化为有效、原创的科学贡献，而非仅改善执行和排版？
