  related_work_outline_zh:
  - 主流方向：构建带验证或评测门的自主科研智能体，以及围绕证据锚定科学发现能力的基准环境。
  - 研究共性：假设生成、代码与实验执行、自动评测或评审反馈、迭代改进的闭环；近期工作加入领域专用验证或认知与权威分离。
