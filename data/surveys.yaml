  related_work_outline:
  - 'Mainstream direction: in this evidence, literature intelligence is embedded in
    autonomous scientific discovery agents that combine literature/knowledge retrieval,
    synthesis, reasoning, verification, and paper generation; evaluation is shifting
    toward blind, evidence-grounded benchmarks and LLM judges.'
  - 'Shared research pattern: decompose scientific workflows into agent roles or stages,
    use frozen data or blind tasks to reduce memorization shortcuts, and compare outputs
    via rubrics, automated judges, or human baselines.'
  - 'Key differences: one line builds end-to-end discovery agents or self-evolving
    frameworks; another contributes benchmarks and evidence-maturity evaluation; another
    surveys or failure-analyzes agentic research. They differ in supervision, domain,
    and whether they measure manuscript quality, evidence maturity, or task success.'
  - 'Trend evolution: within the 2025-2026 frontier, the evidence moves from framework
    and survey claims toward failure analysis and blind evidence-grounded benchmarks,
    with repeated findings that agents plateau and lack discriminating scientific
    judgment.'
  - 'Open questions: trustworthy literature synthesis and research-gap discovery remain
    unresolved; no evidence shows proxy metrics align with human scientific judgment
    across domains or base models.'
  related_work_outline_zh:
  - 主流方向：在本证据包中，文献智能主要嵌入自主科学发现智能体，把文献/知识检索、综合、推理、验证与论文生成整合为流水线，并越来越多地采用盲测、证据锚定基准和LLM评审。
  - 研究共性：将科学工作流拆成多智能体角色或阶段，用冻结数据或盲任务降低记忆捷径，并通过评分量规、自动评审或人类基线比较产出。
  - 关键差异：一类系统推进端到端发现智能体或自演化框架，另一类贡献评测基准与证据成熟度评估，还有一类进行综述或失败分析；它们在监督信号、领域重点和评测目标上存在差异。
  - 趋势演进：在2025-2026的前沿时间窗内，证据从框架与综述主张转向失败分析和盲测基准；结果反复显示智能体达到平台期，缺乏科学判断。
  - 开放问题：可信的文献综合与研究差距发现仍未解决；尚无证据表明代理指标能在不同领域、基座模型间与人类科学判断一致。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous scientific discovery agents and self-evolving frameworks
      what_it_solves: turns an objective plus retrieved knowledge into reasoning,
        experiments, and manuscripts through multi-agent verification or iterative
        self-refinement.
      what_remains_open: long-horizon reliability is not assured; documented failure
        modes include implementation drift, memory degradation, overexcitement, and
        weak scientific taste, while true discovery remains unproven.
    - line: Evidence-grounded benchmarking with human baselines
      what_it_solves: measures open-ended discovery claims using blind tasks from
        peer-reviewed studies, frozen data, domain-specific questions, and graduate-level
        human comparison.
      what_remains_open: results are often tied to one frozen base model and limited
        domains; evaluated agents lack controls, robustness, falsifiability, and cross-dataset
        generalization.
    - line: Survey and challenge synthesis
      what_it_solves: organizes agentic progress, metrics, frameworks, datasets, and
        open challenges across chemistry, biology, and materials science.
      what_remains_open: literature review automation is named as an unsolved challenge,
        and the proposed categories lack direct empirical validation as predictors
        of model behavior.
    - line: End-to-end failure analysis
      what_it_solves: documents where autonomous research pipelines break and derives
        design principles for more robust AI-scientist systems.
      what_remains_open: case evidence is small, with only one completed attempt accepted;
        controlled comparison of design choices and failure interventions is missing.
    consensus:
    - Current evidence treats literature/knowledge retrieval and synthesis as one
      component of broader scientific discovery rather than isolated search or citation
      analysis.
    - Multi-agent decomposition and LLM-based evaluation are common, but authors agree
      that current agents plateau and cannot yet support fully trustworthy autonomous
      discovery.
    - Blind or evidence-grounded evaluation is used to reduce memorization of source
      conclusions, yet no consensus metric captures scientific or literature-synthesis
      quality.
    disagreements:
    - 'Evaluation target differs: manuscript quality under LLM rubrics, evidence maturity
      on blind tasks, domain-specific cell annotation plus multiple-choice questions,
      or successful completion of an autonomous ML research pipeline.'
    - 'Supervision differs: human expert as principal investigator, fixed LLM judge,
      graduate-level human baseline, or human and multi-AI review for a single accepted
      paper.'
    - 'Domain and interaction assumptions differ: applied mathematics, ML research,
      single-cell omics, and multi-domain frameworks imply different needs for domain
      intelligence and human oversight.'
    - Reported limitation and reproducibility evidence is uneven across sources, creating
      verification gaps rather than proof that absent elements do not exist.
    open_questions:
    - Can autonomous literature synthesis and gap discovery produce claims that survive
      controls, robustness checks, and falsifiability tests?
    - How do agent rankings change across base models and domains when current benchmarks
      rely on one frozen model or curated LLM rubrics?
    - What evaluation design aligns proxy metrics with human scientific judgment without
      leaking hidden source conclusions?
    - Which component, knowledge retrieval, verification loop, self-evolution, or
      base model capability, explains the reported performance gains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主科学发现智能体与自演化框架
      解决的问题: 通过多智能体验证或迭代自优化，把目标与检索到的知识转化为推理、实验和论文手稿。
      尚未覆盖: 长周期可靠性不足；已记录实现漂移、记忆退化、过度兴奋和科学品味薄弱，真正科学发现仍未证明。
    - 路线: 证据锚定基准与人类基线评测
      解决的问题: 用同行评审研究衍生的盲任务、冻结数据、领域选择题和研究生水平人类比较来测量开放式发现主张。
      尚未覆盖: 结果常限于单一冻结基座模型和少数领域；智能体缺乏对照、稳健性、可证伪性与跨数据集泛化。
    - 路线: 综述与挑战归纳
      解决的问题: 整理化学、生物学、材料科学等领域的智能体进展、评估指标、框架、数据集和开放挑战。
      尚未覆盖: 文献综述自动化仍被列为未解决挑战；提出的分类是否预测行为缺少直接实证验证。
    - 路线: 端到端失败案例分析
      解决的问题: 记录自主研究流水线在哪些阶段失败，并提炼更稳健AI科学家系统的设计原则。
      尚未覆盖: 案例证据较少，仅一个完成尝试被接收；缺少对设计选择和失败干预措施的受控比较。
    共识:
    - 当前证据把文献/知识检索与综合视为更广泛科学发现流程的组成部分，而不是独立的搜索或引文分析。
    - 多智能体分解和基于LLM的评审是常见模式，但论文普遍认为当前智能体处于平台期，尚不能支撑完全可信的自主发现。
    - 盲测或证据锚定评测被用来减少对源结论的记忆，但仍缺少一致指标来衡量科学或文献综合质量。
    分歧:
    - 评测目标不同：LLM量规下的论文质量、盲任务上的证据成熟度、领域细胞注释加选择题表现，或自主机器学习研究流水线是否完成并被接收。
    - 监督方式不同：人类专家作为首席研究员、固定LLM评审、研究生水平人类基线，或对单一被接收论文的人类与多AI评审。
    - 领域与交互假设不同：应用数学、机器学习研究、单细胞组学和多领域框架对领域智能与人类监督的需求不同。
    - 各来源的局限性与可复现证据不均衡，形成验证缺口，而非能证明缺失要素不存在。
    开放问题:
    - 自主文献综合与差距发现能否生成经得起对照、稳健性和可证伪性检验的主张？
    - 当前基准多使用单一冻结模型或策划的LLM量规，智能体排名在基座模型和领域变化时如何变化？
    - 哪种评测设计能在不泄露隐藏源结论的前提下，使代理指标与人类科学判断一致？
    - 知识检索、验证循环、自演化或基座模型能力中，哪一组件解释了报告的性能提升？
