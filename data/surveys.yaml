  related_work_outline:
  - 'Mainstream direction: Building autonomous multi-agent research pipelines that
    combine retrieval, verification, manuscript generation, and self-evolution; recent
    work shifts from broad capability surveys toward evidence-grounded benchmarks
    and failure diagnostics.'
  - 'Shared research pattern: Systems use LLM-based judges or rubric scoring against
    hidden conclusions, human baselines, or expert-in-the-loop roles to assess discovery
    claims; evaluation relies on curated tasks, frozen data, or generated papers rather
    than external peer outcomes.'
  - 'Key differences: Some work optimizes generated manuscript quality, some measures
    evidentiary maturity on blind tasks, some uses domain-specific omics MCQs, and
    some provides general self-evolving infrastructure; supervision spans human PIs,
    hidden peer conclusions, and fixed LLM judges.'
  - 'Trend evolution: The 2025-2026 evidence moves from surveys and domain-specific
    AI-scientist benchmarks to frameworks for self-evolution and studies documenting
    recurring failure modes, suggesting a frontier shift toward trustworthiness and
    reproducibility.'
  - 'Open questions: Whether rubric or MCQ scores align with real literature search,
    citation analysis, review synthesis, or gap discovery value; cross-model and cross-domain
    generalization; preventing long-horizon drift and overexcitement; several papers
    omit limitations, code, or external validation details.'
  related_work_outline_zh:
  - 主流方向：构建自主多智能体研究流水线，将检索、验证、手稿生成和自我演化结合；近期工作从宽泛能力综述转向证据锚定基准与失败诊断。
  - 研究共性：系统普遍采用基于 LLM 的裁判或评分标准，并借助隐藏结论、人类基线或专家在环角色评估发现主张；评测多依赖策划任务、冻结数据或生成论文，而非外部同行结果。
  - 关键差异：有的优化生成手稿质量，有的测量盲任务证据成熟度，有的使用领域专用组学选择题，还有的提供通用自我演化基础设施；监督方式包括人类 PI、隐藏同行结论和固定
    LLM 裁判。
  - 趋势演进：2025-2026 证据显示从综述与领域专用 AI 科学家基准，转向自我演化框架和反复失败模式研究，反映当前前沿更关注可信性与可复现性。
  - 开放问题：评分或选择题指标是否对应真实文献检索、引文分析、综述综合或缺口发现价值；跨模型与跨领域泛化；防止长跨度漂移与过度兴奋；部分论文缺少局限性、代码或外部验证细节。
  literature_review:
    line_of_work_matrix:
    - line: Iterative literature synthesis and manuscript generation systems
      what_it_solves: Turns a minimal research prompt into a complete paper draft
        by chaining retrieval, derivation, verification, and writing under an expert-as-PI
        setup
      what_remains_open: Evaluation relies on LLM-based rubric comparisons; no external
        peer acceptance or limitation analysis is reported, leaving scientific validity
        outside the curated generation setting unverified
    - line: Evidence-grounded evaluation for discovery claims
      what_it_solves: Blinds source conclusions and expected analysis paths to test
        whether agents can determine what frozen data support, scoring evidentiary
        maturity across controls, robustness, falsifiability, and novelty
      what_remains_open: Reported results come from one frozen base model and agents
        plateau without reliable pairwise separation, so cross-model generalizability
        and metric-to-real-discovery agreement remain open
    - line: Human-referenced domain-specific scientist benchmarks
      what_it_solves: Anchors AI scientist performance on real omics data to graduate-level
        human bioinformaticians for cell annotation and published-study-derived questions
      what_remains_open: Evidence covers specific annotation and multiple-choice tasks;
        it does not yet establish whether these abilities transfer to autonomous literature
        review, gap discovery, or full research synthesis
    - line: Failure-mode and design-principle studies
      what_it_solves: Makes recurring failures visible in long-horizon autonomous
        research, including memory degradation, implementation drift, overexcitement,
        and weak scientific taste
      what_remains_open: Findings are based on four end-to-end attempts in one research
        area, so the failure taxonomy and proposed design principles lack broad cross-domain
        and cross-system validation
    - line: Self-evolving domain-agnostic agent frameworks
      what_it_solves: Provides reusable infrastructure for agents to refine hypotheses,
        critique themselves, and accumulate knowledge across experimental cycles on
        general science benchmarks
      what_remains_open: Reported benchmark gains are not tied specifically to literature
        search, citation analysis, or review synthesis quality, and no limitation
        or external validation details are given
    consensus:
    - Autonomous research systems are organized as multi-stage or multi-agent pipelines
      that separate retrieval, reasoning, generation, and verification.
    - LLM-based judges and rubric scoring are widely used to evaluate scientific outputs
      because they provide scalable automated assessment.
    - 'Current systems remain below reliable autonomous discovery: they plateau, lack
      controls, robustness, falsifiability, or fail in long-horizon settings.'
    - Human expertise is still needed, either as a baseline, reviewer, PI, or source
      of ground-truth conclusions.
    disagreements:
    - 'Evaluation targets differ: some assess generated manuscript quality and self-verification,
      others assess evidence maturity on blinded studies, domain-specific annotation
      and MCQs, or broad benchmark scores.'
    - 'Supervision and anchoring differ: human expert-as-PI, hidden peer conclusions,
      graduate-level human baselines, or fixed LLM judges.'
    - 'Domain scope differs: applied mathematics theory generation, single-cell omics,
      ML paper attempts, and domain-agnostic science frameworks.'
    - 'Metric interpretation differs: some report highest rubric scores or state-of-the-art
      benchmark gains, while others emphasize no statistical pairwise separation and
      plateaued agents.'
    open_questions:
    - Do LLM-judged and multiple-choice evidence metrics predict real literature search,
      review synthesis, or research gap discovery utility?
    - Can these systems generalize across frozen base models, scientific domains,
      and from hidden-conclusion tasks to genuinely novel open problems?
    - What verification and memory conditions prevent implementation drift, overexcitement,
      and context degradation in long-horizon literature workflows?
    - What gaps are hidden by missing limitation sections, code, datasets, or external
      peer evaluations in several included papers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 迭代式文献综合与手稿生成系统
      解决的问题: 以最小研究提示为起点，通过检索、推导、验证与写作链条生成完整论文草稿，并以专家担任 PI 的方式约束流程
      尚未覆盖: 评估依赖基于 LLM 的标准比较；未报告外部同行接受或局限性分析，策划生成设置之外的科学有效性未被验证
    - 路线: 面向发现主张的证据锚定评估
      解决的问题: 隐藏来源结论与预期分析路径，检验智能体能否从冻结数据判断支持何种主张，并从对照、稳健性、可证伪性、新颖性等维度评分证据成熟度
      尚未覆盖: 结果来自单一冻结基座模型，智能体得分平台化且无可靠两两差异，跨模型泛化与指标到真实发现的一致性仍未知
    - 路线: 以人类为参照的领域专用科学家基准
      解决的问题: 在真实组学数据上，以研究生水平生物信息学人员为基线，评估细胞注释和由已发表研究衍生的选择题能力
      尚未覆盖: 证据限于注释与选择题任务，尚未证明这些能力能迁移到自主文献综述、研究缺口发现或完整研究综合
    - 路线: 失败模式与设计原则研究
      解决的问题: 暴露长跨度自主研究中的反复失败，如记忆退化、实现漂移、过度兴奋与科学品味薄弱
      尚未覆盖: 结论基于一个研究方向的四次端到端尝试，失败分类和设计原则缺少跨领域、跨系统的广泛验证
    - 路线: 自我演化的领域无关智能体框架
      解决的问题: 提供可复用基础设施，使智能体能迭代优化假设、自我批判并在实验周期中积累知识，在通用科学基准上取得提升
      尚未覆盖: 报告的性能提升未专门对应文献检索、引文分析或综述综合质量，也缺少局限性与外部验证细节
    共识:
    - 自主研究系统普遍采用多阶段或多智能体流水线，将检索、推理、生成和验证分离。
    - 基于 LLM 的裁判和评分标准被广泛用于科学产出的自动化评估。
    - 当前系统仍低于可靠的自主发现水平：得分平台化、缺乏对照、稳健性、可证伪性，或在长跨度任务中失败。
    - 人类专门知识仍然必要，表现为基线、评审者、首席研究员或隐藏结论来源。
    分歧:
    - 评估目标不同：手稿生成质量、证据成熟度、领域专用注释与选择题、通用科学基准分数同时存在。
    - 监督与锚定方式不同：人类专家担任 PI、隐藏同行结论、研究生水平人类基线或固定 LLM 裁判。
    - 领域范围不同：应用数学理论生成、单细胞组学、机器学习论文尝试和领域无关科学框架。
    - 对指标的解释不同：有的强调最高标准分数或 SOTA 提升，有的强调无显著两两差异和智能体能力平台化。
    开放问题:
    - LLM 裁判和选择题指标能否预测真实文献检索、综述综合或研究缺口发现的实际效用？
    - 这些系统能否跨基座模型、跨科学领域泛化，并从隐藏结论任务迁移到真正的新开放问题？
    - 何种验证与记忆条件能防止长跨度文献工作流中的实现漂移、过度兴奋和上下文退化？
    - 一些论文缺少局限性、代码、数据集或外部同行评审，这些缺失掩盖了哪些验证缺口？
