    consensus:
    - Systems generally decompose scientific workflows into subtasks and let one or
      more LLM agents handle planning, execution, analysis, and drafting.
    - Automated or LLM-based evaluation is widely used because human peer review is
      scarce and costly.
    - Human involvement is often framed as verification, supervision, or PI/reviewer
      rather than full autonomy, though the degree varies.
    - Code, dataset, and external validation signals are reported unevenly; benchmarks
      and code harnesses are used to compensate for reproducibility gaps.
    disagreements:
    - Autonomy level differs between fully automated end-to-end generation and interactive
      human-in-the-loop platforms with monitoring and rollback.
    - Evaluation setting differs among simulated text-based virtual environments,
      runnable internal code harnesses, and curated LLM review rubrics.
    - Objective granularity differs from complete research papers and discovery cycles
      to specific ablation planning or experiment retries.
    - Improvement mechanism differs among tree-search planning with visual-language
      reviewer feedback, failure memory, and customizable role orchestration.
    open_questions:
    - Can agent-generated manuscripts or conclusions reproduce beyond LLM-judge scores
      and workshop-level acceptance?
    - How well do DISCOVERYWORLD task completion and AblationBench recall align with
      real experimental decision utility?
    - What minimum expert supervision and verification is needed to prevent plausible
      but invalid scientific claims?
    - How do failure-memory methods scale beyond PDE and ScienceAgentBench-style tasks
      to long-horizon, multi-domain experiments?
