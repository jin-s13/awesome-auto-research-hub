  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research workflow systems
      what_it_solves: Couples ideation, code execution, experiment management, analysis,
        and manuscript generation into a single agent loop for open-ended discovery.
      what_remains_open: Evidence of external validity is incomplete; many claims
        depend on automated reviewers or limited task venues, and consistency beyond
