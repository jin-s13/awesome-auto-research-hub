  - 趋势演进：从2024到2026年，主题从单一LLM驱动的框架向智能体树搜索、多智能体平台和记忆增强架构演进，同时评估方式从内部LLM评审转向真实工作坊投稿和标准化的科学发现基准。
  - 开放问题：全自动系统能否持续产出通过严格人类同行评审的工作；如何验证代理执行实验的正确性和可复现性；当前基准是否捕捉到真实科学发现的开放式本质。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end automated research systems
      what_it_solves: Automating the full scientific discovery loop—idea generation,
        coding, experiment execution, visualization, and manuscript writing—to reduce
        human effort and per-paper cost.
      what_remains_open: Cross-domain generalization beyond the showcased subfields,
        the reliability of auto-generated results, and the gap between simulated review
        and real human peer-review acceptance.
    - line: Agentic experiment planning, execution, and memory
      what_it_solves: Improving the quality and efficiency of experimental decisions
        through tree search, failure-aware memory, and curated negative knowledge,
        enabling agents to avoid repeated mistakes and solve harder tasks.
      what_remains_open: Whether these mechanisms scale to diverse scientific modalities,
        and how much of the observed gain comes from better planning versus more powerful
        base models or task-specific prompts.
    - line: Benchmarks and evaluation environments for automated discovery
      what_it_solves: Providing standardized tasks and metrics to measure an agent's
        ability to hypothesize, design ablations, run experiments, and interpret results,
        making comparisons across systems possible.
      what_remains_open: The alignment between proxy metrics (task completion, LLM-judge
        scores) and real scientific progress; coverage of long-tail scientific domains
        and open-ended discovery beyond predefined tasks.
    consensus:
    - Large language models serve as the central reasoning engine for automated scientific
      workflows, whether as single backbones or within multi-agent systems.
    - Automated pipelines typically include modules for hypothesis formation, experiment
      execution, and result synthesis, often with a feedback loop for iterative refinement.
    - 'Evaluation remains a known bottleneck: works either rely on LLM-based judges,
      controlled simulated environments, or real (workshop-level) peer review to validate
      outputs.'
    disagreements:
    - The level of human involvement varies from fully autonomous systems that aim
      to remove human templates entirely, to collaborative frameworks where humans
      act as principal investigators and agents as graduate students.
    - 'Evaluation philosophy differs: some systems evaluate internally using custom
      LLM review rubrics, while others use external benchmarks such as DISCOVERYWORLD
      or AblationBench, and one targets real peer-reviewed acceptance.'
    - Domain specificity ranges from focused theoretical reasoning in applied mathematics
      to general machine learning subfields, with limited evidence that a single system
      works well across these different scientific cultures.
    open_questions:
    - How can automated experiment systems guarantee the correctness of generated
      code and experimental results without exhaustive human verification?
    - What would constitute a valid, community-accepted benchmark for open-ended scientific
      discovery that goes beyond scripted tasks?
    - To what extent does the performance of these systems depend on the underlying
      language model's capabilities versus the agentic workflow design, and how can
      we ablate these factors?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自动化研究系统
      解决的问题: 将科学发现的全流程——构想生成、编码、实验执行、结果可视化和论文撰写——自动化，以减少人工工作量和单篇论文成本。
