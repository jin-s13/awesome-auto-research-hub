  related_work_outline:
  - 'Mainstream direction: building closed-loop autonomous research agents that generate
    hypotheses or research ideas, execute experiments, verify outputs, and write findings,
    with domain-specific examples such as AI CFD Scientist and domain-agnostic frameworks
    such as EvoMaster.'
  - 'Shared research pattern: decompose scientific ideation into proposal, execution,
    verification, and reporting stages; add feedback loops, self-correction, formal
    or empirical gates, and human collaboration to reduce silent failures and hallucinated
    results.'
  - 'Key differences: verification mechanism, domain specificity versus generality,
    human interaction granularity, and evaluation target; some use physics/vision
    gates or Lean proofs while others use benchmark scores, human baselines, or expert
    preference.'
  - 'Trend evolution: from 2025 survey and benchmark efforts identifying reliability
    and autonomy gaps to 2026 systems emphasizing self-correction, verification gates,
    formal proofs, and targeted human-in-the-loop workflows.'
  - 'Open questions: whether benchmark or artifact gains predict real discovery utility,
    how to detect missed silent failures, how to validate formalization fidelity,
    and how to generalize beyond small internal case studies.'
  related_work_outline_zh:
  - 主流方向：构建闭环自主研究智能体，生成假设或研究想法，执行实验，验证输出并撰写发现；既有AI CFD Scientist等特定领域系统，也有EvoMaster等通用框架。
  - 研究共性：把科学构思分解为提出、执行、验证和报告阶段，引入反馈循环、自我纠正、形式或经验门控以及人机协作来减少静默失败和幻觉结果。
  - 关键差异：验证机制、领域专用与通用、人机交互粒度、评测目标不同；有的是物理/视觉门控或Lean证明，有的依赖基准分数、人类基线或专家偏好。
  - 趋势演进：从2025年综述与基准工作揭示自主性和可靠性缺口，转向2026年系统强调自我纠正、验证门控、形式证明和精准的人类在环工作流。
  - 开放问题：基准或工件提升能否预测真实发现效用；如何检测漏掉的静默失败；如何验证形式化保真度；如何超越小型内部案例评估。
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific autonomous discovery with empirical verification gates
      what_it_solves: Turns literature-grounded hypotheses into runnable domain experiments
        and verified discoveries by coupling code execution with rendered-output or
        physical checks.
      what_remains_open: Verification gates can still miss silent failures; single-domain
        claims may not transfer to other discovery settings.
    - line: Multi-agent autonomous research with self-healing and human collaboration
      what_it_solves: Improves robustness of generated hypotheses and experiments
        through debate, failure attribution, verifiable reporting, and targeted human
        intervention.
      what_remains_open: Evaluations are often narrow benchmarks or internal case
        studies; conference-ready reporting and fully autonomous writing remain open.
    - line: Benchmarking AI scientists against real data and human experts
      what_it_solves: Provides task-grounded evidence for biological discovery and
        cell annotation, with human baselines to interpret autonomous performance.
      what_remains_open: Multiple-choice and annotation proxies may not capture open-ended
        hypothesis novelty or downstream scientific utility.
    - line: Self-evolving or formally grounded frameworks for scalable scientific
        research
      what_it_solves: Reduces the cost of building self-evolving research agents and
        produces machine-checked theoretical artifacts with statement auditing.
      what_remains_open: Formal verification does not guarantee that formalized claims
        match intended science; cross-domain external validation is missing or not
        reported.
    - line: Organizing agentic discovery systems, metrics, and failure modes
      what_it_solves: Catalogs capabilities and evaluation resources across chemistry,
        biology, and materials science, and identifies reliability and ethical gaps.
      what_remains_open: The proposed categories and challenges are descriptive; there
        is little direct empirical evidence that they predict system reliability or
        discovery impact.
    consensus:
    - Autonomous hypothesis generation is treated as one stage in a closed-loop research
      pipeline that includes execution, analysis, verification, and reporting.
    - Verification and feedback are seen as necessary to avoid fabricated numbers,
      hallucinated citations, or silent experimental failures.
    - Current systems fall short of fully autonomous discovery and are usually framed
      as supporting human scientists rather than replacing them, especially for conference-ready
      writing.
    - Human collaboration or oversight is recognized as valuable, with targeted intervention
      at high-leverage points being more effective than full autonomy or exhaustive
      step-by-step oversight in one ablation.
    - Evaluation is converging on benchmark comparisons, artifact quality, human baselines,
      or expert preference, but external validity remains scarce.
    disagreements:
    - 'Correctness is operationalized differently: empirical physics/vision checks
      for one line, machine-checked proof and statement audits for another, and benchmark
      or human-baseline scoring for others.'
    - 'Systems differ on domain scope: some embed domain physics or formal causal
      inference tooling, while others aim to be domain-agnostic and self-evolving.'
    - The role of human interaction varies from targeted high-leverage collaboration
      to platform-level monitoring and rollback to reliance on human inspection of
      formal artifacts.
    - 'Evaluation targets differ: a physical error metric, benchmark success, artifact
      quality, expert preference, or produced formal artifacts; these are not interchangeable
      evidence.'
    - Some work treats hypothesis generation as literature-grounded and open-ended,
      while others constrain generation to existing tasks or formal statement spaces,
      changing the nature of novelty.
    open_questions:
    - Do benchmark gains such as ARC-Bench or artifact-quality improvements transfer
      to real scientific discovery utility across domains?
    - How can verification gates cover the silent failures they still miss, such as
      2 of 16 planted failures in one physics-aware gate?
    - How can formal proof correctness be aligned with the intended scientific claim
      when formalization gaps remain?
    - What minimum external validation across datasets, domains, and user settings
      is needed to establish reliability for autonomous research systems?
    - Where should human oversight be placed to maximize reliability and novelty without
      requiring exhaustive supervision?
    - How should literature-grounded ideation be evaluated when literature review
      automation and citation verifiability are still challenges?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带有经验验证门控的领域专用自主发现流程
      解决的问题: 将基于文献的假设转化为可运行的领域实验，并通过执行、视觉或物理检查产出可验证发现。
      尚未覆盖: 验证门控仍可能漏掉静默失败；单领域结论未必迁移到其他发现场景。
    - 路线: 多智能体自主研究与自愈式人机协作
      解决的问题: 通过辩论、失败归因、可验证报告和精准人工干预提升假设生成与实验执行的稳健性。
      尚未覆盖: 评估常受限于窄基准或内部案例；可投稿论文写作和完全自主报告仍不成熟。
    - 路线: 面向真实数据和人类基线的AI科学家基准测试
      解决的问题: 用单细胞组学任务和人类基线为生物学发现能力提供任务化证据。
      尚未覆盖: 选择题和注释代理指标未必反映开放式假设新颖性或下游科学效用。
    - 路线: 领域无关的自我演化或形式化研究框架
      解决的问题: 降低构建自我演化研究智能体的成本，并用机器验证证明和陈述审计产出理论工件。
      尚未覆盖: 形式验证不能保证形式化忠实于原意；跨领域外部验证缺失或未报告。
    - 路线: 面向智能体科学发现的综述与分类
      解决的问题: 归纳化学、生物学、材料科学中的系统、指标、框架、数据集和可靠性/伦理缺口。
      尚未覆盖: 分类和挑战仍偏描述性，缺乏直接经验证据证明其能预测系统行为或发现影响。
    共识:
    - 自主假设生成被视作闭环研究流水线中的一环，需配合执行、分析、验证和报告。
    - 验证和反馈被视为防止伪造数字、幻觉引用和静默实验失败的必要机制。
    - 当前系统尚未达到完全自主发现，通常被定位为辅助人类科学家，尤其是可投稿论文写作仍未解决。
    - 人机协作被普遍认为有价值；一项消融显示高杠杆决策点的精准干预优于完全自主或逐步监督。
    - 评测正朝基准对比、工件质量、人类基线或专家偏好收敛，但外部有效性证据仍不足。
    分歧:
    - 正确性的操作化方式不同：一种用物理/视觉经验检查，一种用机器验证证明和陈述审计，另一种用基准或人类基线评分。
    - 领域范围不同：部分系统嵌入领域物理或因果推断工具，部分系统强调领域无关和自我演化。
    - 人类交互角色不同：从高杠杆点干预到仪表板监控/回滚，再到依赖人工检查形式化产物。
    - 评测目标不同：物理误差、基准成功率、工件质量、专家偏好或生成的形式化产物，证据不可互换。
    - 假设生成的性质不同：有的强调文献驱动和开放式搜索，有的限制在既有任务或形式化陈述空间内。
    开放问题:
    - ARC-Bench或工件质量的提升能否迁移到跨领域的真实科学发现效用？
    - 当物理感知门控仍漏掉16个静默失败中的2个时，如何补全验证覆盖？
    - 形式证明正确性如何与预期科学主张对齐？形式化保真度缺口仍存在。
