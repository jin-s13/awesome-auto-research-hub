      尚未覆盖: 共享研究状态在测试周期之外的准确性与一致性未知；一项报告陈述准确率为79.4%。
    - 路线: 面向自主研究的评测与基准设计
      解决的问题: 通过任务、基线、指标和难度控制来比较发现智能体，并暴露剩余能力差距。
