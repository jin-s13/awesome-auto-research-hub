  related_work_outline:
  - 'Mainstream direction: Building multi-agent autonomous research pipelines that
    integrate literature search, data analysis, and iterative hypothesis refinement
    to perform end-to-end scientific discovery.'
  - 'Shared research pattern: All systems decompose the research process into modular
    stages (hypothesis generation, experimentation, analysis) and rely on LLM-based
    agents with tool use (code interpreters, search) to execute them, often with human
    oversight or collaboration.'
  - 'Key differences: Systems differ in their internal workflow structure (tree-based
    with backtracking, linear cycles, or shared world models), the degree of human
    involvement (from fully autonomous to human-in-the-loop), and the scientific domains
    targeted (biology, combinatorial optimization, symbolic regression).'
  - 'Trend evolution: From 2025 to 2026, the field is moving from single-agent or
    survey-based conceptualizations toward more complex multi-agent architectures
    with self-correction, cross-run learning, and verifiable reporting, all within
    the current frontier of LLM capabilities.'
  - 'Open questions: How to ensure factual accuracy and reliability of generated hypotheses,
    how to scale beyond controlled benchmarks to long-running, open-ended discovery,
    and how to formalize evaluation metrics that capture the novelty and impact of
    scientific findings.'
  related_work_outline_zh:
  - 主流方向：构建多智能体自主研究流水线，整合文献搜索、数据分析和迭代假设优化，实现端到端科学发现。
  - 研究共性：所有系统都将研究过程分解为模块化阶段（假设生成、实验、分析），并依赖基于LLM的智能体通过工具使用（代码解释器、搜索）来执行，通常伴随人类监督或协作。
  - 关键差异：系统在内部工作流结构（基于树的回溯、线性循环或共享世界模型）、人类参与程度（从完全自主到人在回路）以及目标科学领域（生物学、组合优化、符号回归）上存在差异。
  - 趋势演进：从2025年到2026年，该领域正从单一智能体或基于综述的概念化，转向更复杂的多智能体架构，具备自我修正、跨运行学习和可验证报告功能，这些均处于当前LLM能力的前沿。
  - 开放问题：如何确保生成假设的事实准确性和可靠性，如何从受控基准扩展到长期、开放式发现，以及如何形式化评估指标以捕捉科学发现的新颖性和影响力。
  literature_review:
    line_of_work_matrix:
    - line: State and representation modeling
      what_it_solves: Maintaining a coherent representation of accumulated knowledge
        and data across multiple iterations of observation and reasoning, as seen
        in Kosmos's shared world model between data analysis and literature search
        agents.
      what_remains_open: Whether the learned state remains sufficient for decisions
        outside the training distribution of the initial dataset and literature, and
        how it degrades over longer discovery cycles.
    - line: Action-conditioned control and planning
      what_it_solves: Connecting hypothesis generation to experimental design and
        execution, enabling agents to plan sequences of code-driven experiments, as
        in SR-Scientist's iterative equation optimization or OR-Agent's tree-based
        research planning.
      what_remains_open: How much improvement comes from the agent's planning strategy
        versus the underlying LLM's reasoning or the domain-specific tools, and whether
        planning quality generalizes across scientific disciplines.
    - line: Evaluation and evidence design
      what_it_solves: Making claims comparable through benchmarks like ARC-Bench and
        LABBench2, and through metrics such as accuracy of report statements or task
        success rates, to quantify progress in autonomous research.
      what_remains_open: Coverage of diverse scientific tasks beyond the few domains
        tested, and agreement between proxy metrics (e.g., report accuracy) and real-world
        scientific utility or novelty.
    - line: Systems and reproducible infrastructure
      what_it_solves: Turning isolated model ideas into runnable multi-agent stacks,
        with some papers providing code or benchmarks (e.g., LABBench2's public release)
        to facilitate repeatable workflows.
      what_remains_open: Standardized external validation across different hardware,
        datasets, and user settings, as most evidence comes from a single paper's
        evaluation environment.
    - line: Conceptual taxonomy and theory
      what_it_solves: Organizing fragmented claims into task boundaries and evaluation
        dimensions, as in the AutoResearch AI survey's five workflow conditions and
        five evaluation dimensions.
      what_remains_open: Direct empirical validation that the proposed categories
        (e.g., 'Vibe Research' vs. 'AutoResearch') predict model behavior or discovery
        success across multiple systems.
    consensus:
    - Autonomous hypothesis generation benefits from decomposition into modular agents
      (literature review, data analysis, experiment design) that interact iteratively.
    - LLM-based agents need tool access (code interpreters, search engines) to ground
      hypotheses in data and literature, rather than relying solely on parametric
      knowledge.
    - Human collaboration remains valuable, often at high-leverage decision points,
      rather than exhaustive step-by-step oversight.
    - Current systems are evaluated primarily on task-specific benchmarks or end-to-end
      report accuracy, with a shared concern for verifiability and factual correctness.
    disagreements:
    - 'Workflow structure: OR-Agent uses a tree-based approach with branching and
      backtracking, while Kosmos uses a shared world model across parallel cycles,
      and Robin integrates a lab-in-the-loop for experimental validation.'
    - 'Degree of autonomy: AutoResearchClaw and AutoResearch AI emphasize human-in-the-loop
      collaboration as a spectrum, whereas Kosmos and SR-Scientist push toward full
      autonomy with minimal human input.'
    - 'Evaluation target: Some works focus on final report accuracy (Kosmos), others
      on benchmark performance (LABBench2, ARC-Bench), and yet others on real-world
      experimental validation (Robin).'
    - 'Domain generality: Surveys and agentic frameworks claim cross-domain applicability,
      but concrete instantiations are tested in narrow domains (biology, symbolic
      regression, optimization), making it unclear how well they transfer.'
    open_questions:
    - How does the factual accuracy of generated hypotheses (currently ~79.4% in Kosmos)
      improve with scale, and what calibration methods are needed to prevent confident
      false statements?
    - What mechanisms enable reliable rejection of weak hypotheses and backtracking,
      given that OR-Agent's tree-based approach is domain-specific and not yet proven
      to generalize?
    - How can open-ended discovery be evaluated beyond proxy metrics like report accuracy,
      when the true measure of novelty and impact requires long-term community validation?
    - What are the minimal sufficient conditions for autonomous research across domains,
      given that AutoResearch AI notes autonomy is credible only in structured, executable,
      and rapidly verifiable settings?
