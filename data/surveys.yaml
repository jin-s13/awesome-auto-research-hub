  - 主流方向：构建端到端的LLM驱动系统，自主生成完整科学论文，整合想法生成、实验执行、验证和手稿撰写。
  - 研究共性：将科学工作流分解为智能体步骤，高度强调内部验证循环、失败检测和自我纠正以提升输出可靠性。
  - 关键差异：在最佳自主程度上（完全自主 vs. 人机协作）、验证机制类型（逻辑、物理或多假设归因）以及评估标准（自动评审 vs. 真实同行评审）上存在分歧。
  - 趋势演进：从2024年首个全自动框架到2026年更稳健的多智能体和自我纠正系统，成功率和工件质量在提升，但仍主要局限于工作坊级别的接收。
