  - 趋势演进：从2024年全自动论文写作框架，到2025年工作坊级同行评审接收，再到2026年领域特定智能体加入验证门控与自我纠正。
  - 开放问题：自动评审与人类判断的一致性、稳定产出会议级论文、最佳人工干预点，以及专用验证门控的泛化仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and paper writing systems
      what_it_solves: Couples idea generation, code execution, experiment analysis,
        visualization, and full manuscript drafting into one automated pipeline with
        an evaluator.
      what_remains_open: Consistency across tasks and venues; evidence shows only
        partial peer-review success and missing broad comparison with human research
        quality.
    - line: Domain-specific scientific discovery agents with verification-driven writing
      what_it_solves: Adds logical, physics-aware, or knowledge-retrieval checks so
        generated claims and papers are grounded in domain evidence before writing.
      what_remains_open: Specialized gates are narrow; one physics gate missed silent
        failures, and generalization beyond the tested domain is not established.
    - line: Human-AI collaborative research pipelines and verifiable reporting
      what_it_solves: Keeps human experts at key decision points and constrains outputs
        to measured values to prevent fabricated numbers or hallucinated citations.
      what_remains_open: Optimal intervention granularity and timing are inferred
        from ablation but not standardized across domains or research stages.
    - line: Failure-mode analysis and self-correcting research workflows
      what_it_solves: Diagnoses failure causes in autonomous research attempts and
        routes corrections to hypothesis, design, or implementation levels.
      what_remains_open: Self-correction improves execution metrics but still does
        not fully solve conference-ready scientific writing or eliminate recurring
        failure modes.
    - line: Automated review and evaluation of generated papers
      what_it_solves: Provides LLM or rubric-based reviewer scoring as a proxy for
        acceptance and quality of machine-generated manuscripts.
      what_remains_open: Only near-human scoring or workshop acceptance is shown;
        alignment with human peer review across fields is not demonstrated.
    consensus:
    - Research writing is treated as an end-to-end output of autonomous workflows,
      not only as a drafting interface; systems generate ideas, run experiments, and
      compose papers.
    - Every system inserts some verification or review step intended to catch invalid
      or unsupported claims, though the type of verification differs.
    - Evaluation uses rubric, peer-review-style, or benchmark-based scoring of generated
      papers, rather than only measuring downstream task accuracy.
    - Human involvement is retained or studied in most recent systems, shifting from
      fully autonomous claims to targeted expert intervention or oversight.
    disagreements:
    - 'Architecture: single-agent end-to-end pipeline vs multi-agent debate or tree
      search vs staged multi-agent workflow.'
    - 'Supervision: full autonomy, human-as-PI collaboration, or targeted human intervention
      at high-leverage decision points.'
    - 'Verification target: logical coherence, physics-aware visual checks, measurement-grounded
      reporting, or multi-hypothesis failure attribution.'
    - 'Domain scope: general machine learning subfields, applied mathematics, computational
      fluid dynamics, or a multi-topic benchmark.'
    - 'Evaluation evidence: automated acceptance threshold, one workshop peer-review
      acceptance, benchmark improvement, blind scoring, or artifact quality.'
    open_questions:
    - How well do LLM-based review scores and peer-review acceptance thresholds align
      with human scientific judgment beyond the narrow evidence shown?
    - Can autonomous systems consistently produce conference-ready papers rather than
      isolated workshop-level or partial pipeline successes?
    - What is the optimal placement and granularity of human intervention across different
      research stages and domains?
    - Do specialized verification gates generalize beyond their tested domain when
      silent failures already occur in ablation?
    - Which failure modes remain after self-correction, and how should they be measured
      in long-horizon scientific writing tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究与论文写作系统
      解决的问题: 将构思、代码执行、实验分析、可视化和完整论文撰写耦合为带评审环节的自动化流水线
      尚未覆盖: 跨任务和跨会议的一致性；现有证据仅显示部分同行评审成功，与人类研究质量的广泛比较缺失
    - 路线: 领域特定的科学发现智能体与验证驱动写作
      解决的问题: 通过逻辑、物理感知或知识检索检查，在写作前使生成的主张和论文更有领域依据
      尚未覆盖: 专用验证门控较窄；一个物理门控漏检静默失败，超出测试领域的泛化未建立
    - 路线: 人机协作研究流水线与可验证报告
      解决的问题: 让人类专家参与关键决策，并把输出限制为实测值，以减少伪造数字和幻觉引用
      尚未覆盖: 最佳干预粒度和时机来自消融推断，尚未跨领域、跨研究阶段标准化
    - 路线: 失败模式分析与自我纠正研究工作流
      解决的问题: 诊断自主研究失败的因果，并将修正路由到假设、实验设计或实现层面
      尚未覆盖: 自我纠正改善执行指标，但仍未完全解决会议级科学写作或消除反复出现的失败模式
    - 路线: 自动评审与生成论文评测
      解决的问题: 提供LLM或规则式评审评分，作为机器生成手稿可接受性和质量的代理指标
      尚未覆盖: 仅展示接近人类评分或工作坊接受；与跨领域人类同行评审的一致性未证明
    共识:
    - 研究写作被视作自主工作流的端到端输出，而非仅一个写作界面；系统生成想法、运行实验并撰写论文。
    - 各系统都插入某种验证或评审环节以捕捉无效或缺乏支撑的主张，但验证类型不同。
    - 评测使用规则、同行评审式或基于基准的论文评分，而不是仅衡量下游任务准确率。
    - 多数近期系统保留或研究人类参与，从完全自主转向关键点的专家干预或监督。
    分歧:
    - 架构差异：单智能体端到端流水线、多智能体辩论或树搜索、或分阶段多智能体工作流。
    - 监督差异：全自主、人类作为首席研究员协作、或在高杠杆决策点进行定向干预。
    - 验证重点差异：逻辑一致性、物理感知视觉检查、基于实测的报告、或多假设失败归因。
    - 领域范围差异：通用机器学习子领域、应用数学、计算流体动力学或多主题基准。
    - 评测证据差异：自动接受阈值、一次工作坊同行评审接受、基准改进、盲评分数或工件质量。
    开放问题:
    - LLM评审分数和同行评审接受阈值在现有窄证据之外，与人类科学判断是否一致？
    - 自主系统能否稳定产出会议级论文，而非仅孤立的工作坊级或部分流水线成功？
    - 在不同研究阶段和领域中，人类干预的最佳位置和粒度是什么？
    - 当静默失败已在消融中出现时，专用验证门控能否泛化到测试领域之外？
    - 自我纠正后仍存在哪些失败模式，如何在长周期科学写作任务中测量？
