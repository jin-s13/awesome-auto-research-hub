      尚未覆盖: 静默失败检测不完整且依赖具体案例；成功展示仍较窄，尚未充分泛化。
    - 路线: 任务集与隐藏目标评测环境
      解决的问题: 通过模拟或真实数据任务、隐藏目标、难度等级和自动评分，让开放式科学发现更具可比性。
      尚未覆盖: 任务完成率和评分表分数与真实科学效用之间的一致性尚未建立。
    - 路线: 基于证据的评测与自动评审
      解决的问题: 评价生成主张是否具备可复现流程、对照、稳健性和可证伪性，而不仅是输出看起来合理。
      尚未覆盖: 缺少跨基座模型和跨领域的LLM裁判校准；当前智能体在对照和跨数据集泛化上表现较弱。
    - 路线: 可复现研究基础设施与治理机制
      解决的问题: 提供开源代码、工件、确定性评分、模拟评审或认知-权限分离，以减少失控修改和不可复现主张。
      尚未覆盖: 跨硬件、数据集和用户设置的外部验证仍薄弱；若干评估只依赖单一冻结模型或单一设置。
    共识:
    - 领域将自主研究视为需要执行与验证的闭环问题，而不是只依赖大模型生成能力。
    - 自动评测被普遍视为必要但不充分，需要证据检查或有效性门控。
    - 当前智能体更多被定位为研究辅助或部分发现者，而非完全可信的自主科学家。
    - 隐藏目标或冻结数据越来越多地被用于避免捷径，并考察主张层面的证据而非表面输出。
    分歧:
    - 评测目标不同：任务完成与下游精度，对比书面主张的证据成熟度，再对比同行评审接受。
    - 场景不同：模拟文本发现环境、真实领域代码与数据、工作坊投稿流程对有效性提出不同要求。
    - 自主边界不同：部分系统允许大范围LLM驱动代码修改，另一些通过确定性权限限制编辑与晋升。
    - 度量信任不同：有的依赖LLM裁判或评分表，有的依赖领域专属仿真或视觉校验，彼此一致性尚未建立。
    开放问题:
