  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agents
      what_it_solves: Automates hypothesis generation, code implementation, experiment
        execution, analysis, and manuscript writing as a continuous research loop.
      what_remains_open: Consistency and peer-review-level reliability remain low;
        human oversight burden is unclear; generalization beyond demonstrated domains
        such as applied mathematics and machine learning is not established.
    - line: Failure-aware experiment memory
      what_it_solves: Converts failed attempts into explicit negative knowledge that
        downstream experiment proposals can adopt or reject, improving retry success
        and token efficiency.
      what_remains_open: Evidence is limited to specific PDE and ScienceAgentBench
        tasks; limitation details are missing; generalization across failure types
        and scientific disciplines remains unverified.
    - line: Discovery evaluation environments and benchmarks
      what_it_solves: Provides tasks and metrics for measuring whether agents can
        form hypotheses, run experiments, analyze results, and plan ablations.
      what_remains_open: Proxy metrics are not yet shown to align with real scientific
        utility; current agents remain below human-level ablation planning; task coverage
        may miss newer agent behaviors.
    - line: Interactive research infrastructure
      what_it_solves: Connects prospective agent ideas to runnable local experiments
        through dashboards, customizable roles, monitoring, rollback/resume, and code-harness
        feedback.
      what_remains_open: Reported evaluation is small and internal; external reproducibility
        and standardization across hardware, datasets, and user settings are missing.
    consensus:
    - Research generation is increasingly separated from validation through automated
      review, logical verification, or explicit failure checks.
    - End-to-end systems can produce research artifacts such as papers, code, and
      experiment results, but reliability is not yet sufficient to replace human judgment.
    - Benchmarks and case studies consistently show that strong prior agents still
      struggle on discovery tasks or remain below human-level experiment planning.
    - Recording failed attempts as explicit memory improves retry efficiency and can
      transfer across related new tasks.
    disagreements:
    - 'Evaluation target differs: some work scores generated manuscripts, others measure
      task completion and actions in simulated environments, and others measure ablation
      planning recall.'
    - 'Interaction mode differs: systems range from fully autonomous pipelines to
      human-in-the-loop dashboards with customizable roles and rollback controls.'
    - 'Supervision signal differs: systems rely on internal logical verification,
      simulated review, VLM feedback, benchmark task success, or failure memory.'
    - Deployment domain differs across applied mathematics, machine learning subfields,
      simulated scientific topics, and internal AI research case studies, creating
      different generalization demands.
    open_questions:
    - Can LLM-based reviewers and judges be calibrated against human expert decisions
      beyond aggregate near-human scoring?
    - What causes run-to-run inconsistency in end-to-end discovery, and which verification
      or search mechanisms reduce failed submissions?
    - How well does failure memory generalize from specific PDE and benchmark tasks
      to broader experiment planning and laboratory settings?
    - Which metrics best capture scientific utility rather than task completion, generation
      quality, or ablation coverage?
    - How can interactive research platforms be externally validated across hardware,
      datasets, and scientific domains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现智能体
      解决的问题: 自动化假设生成、代码实现、实验执行、分析结果与论文写作的连续研究循环。
      尚未覆盖: 一致性和同行评审级可靠性仍不足；人类监督负担不明确；在应用数学和机器学习之外的泛化尚未建立。
    - 路线: 失败感知实验记忆
      解决的问题: 将失败尝试转化为显式负知识，供下游实验提议采纳或拒绝，从而提升重试成功率和令牌效率。
      尚未覆盖: 仅在特定PDE和ScienceAgentBench任务上有证据；限制说明缺失；跨失败类型和跨学科迁移未验证。
    - 路线: 发现评测环境与基准
      解决的问题: 提供任务和指标，衡量智能体形成假设、运行实验、分析结果和规划消融的能力。
      尚未覆盖: 代理指标尚未证明与真实科学效用一致；当前智能体消融规划低于人类水平；任务覆盖可能遗漏新行为。
    - 路线: 交互式研究基础设施
      解决的问题: 通过仪表板、自定义角色、监控、回滚/恢复和代码工具反馈，将智能体想法接入可运行的本地实验。
      尚未覆盖: 评估规模小且为内部案例；跨硬件、数据集和用户设置的外部复现和标准化不足。
    共识:
    - 研究生成正越来越多地通过自动评审、逻辑验证或显式失败检查与验证分离。
    - 端到端系统可以产出论文、代码和实验装置等研究工件，但可靠性尚不足以替代人类判断。
    - 基准和案例一致显示，现有强智能体在发现任务上仍然困难，或实验规划低于人类水平。
    - 将失败尝试记录为显式记忆可以提高重试效率，并能迁移到相关的新任务。
    分歧:
    - 评估目标不同：有的对生成论文评分，有的测量模拟环境中的任务完成与动作，有的测量消融规划召回。
    - 交互模式不同：从全自动流水线到支持自定义角色和回滚的人类在环仪表板。
    - 监督信号不同：依赖逻辑验证、模拟评审、VLM反馈、基准成功或失败记忆。
    - 部署领域不同：涵盖应用数学、机器学习子领域、模拟科学主题和内部AI研究案例，泛化要求不同。
    开放问题:
    - LLM评审器或评判器能否在人类专家决策上得到校准，而不仅是获得接近人类的聚合评分？
    - 什么导致端到端发现的运行间不一致，哪些验证或搜索机制能减少失败提交？
    - 失败记忆能否从特定PDE和基准任务推广到更广泛的实验规划与实验室设置？
    - 哪些指标更能捕捉科学效用，而不是任务完成度、生成质量或消融覆盖率？
    - 交互式研究平台如何在硬件、数据集和科学领域之间进行外部验证？
