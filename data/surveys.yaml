  related_work_outline:
  - 'Mainstream direction: autonomous multi-agent systems that couple retrieval, verification,
    literature synthesis, and manuscript generation under a human-in-the-loop research
    workflow.'
  - 'Shared research pattern: decompose scientific inquiry into agents or tasks, use
    automated judges or human baselines, and contrast execution/documentation competence
    with evidence maturity.'
  - 'Key differences: evaluation targets range from blind peer-derived discovery tasks
    and multiple-choice evidence questions to LLM-rubric scored generated papers;
    systems differ in domain-specific verification versus domain-agnostic self-evolution.'
  - 'Trend evolution: within a narrow 2023-2026 frontier, work moves from survey/framework
    organization toward evidence-grounded benchmarks and failure-mode case studies,
    but literature search and review automation remain identified bottlenecks.'
  - 'Open questions: whether LLM judges align with expert review for literature synthesis;
    how to isolate literature search, citation analysis, and gap discovery from broader
    discovery; how claims generalize across domains and base models; reproducibility
    of artifacts.'
  related_work_outline_zh:
  - 主流方向：构建自主多智能体系统，在人类专家参与下耦合检索、验证、文献综合与论文生成。
  - 研究共性：把科学探究分解为多个智能体或任务，使用自动评审或人类基线，并区分执行能力与证据成熟度。
  - 关键差异：评测目标包括盲式同行研究任务、多选题证据题和基于LLM评分标准的生成论文；系统有的侧重领域验证，有的侧重领域无关自我演化。
  - 趋势演进：在2023-2026窄前沿内，工作从综述与框架整理转向证据锚定评测和失败模式案例研究，但文献搜索与综述自动化仍被视为瓶颈。
  - 开放问题：LLM评审是否与专家评审一致；如何把文献搜索、引用分析和研究缺口发现与更广泛的发现任务分离；跨领域和基座模型泛化性；工件可复现性。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end literature synthesis and research writing agents
      what_it_solves: Automates retrieval, literature synthesis, verification, theorem/experiment
        writing, and manuscript generation from a minimal prompt within a multi-agent
        workflow.
      what_remains_open: Evaluation largely uses LLM-based rubric scores over generated
        papers; independent literature search coverage, citation quality, and review/gap
        discovery quality are not directly measured.
    - line: Evidence-grounded evaluation for discovery agents
      what_it_solves: Creates blind tasks or multiple-choice questions from peer-reviewed
        studies to evaluate claim evidence maturity rather than reproduction of target
        papers.
      what_remains_open: Findings rely on narrow domain coverage or one frozen base
        model; the benchmarks do not isolate literature search, citation analysis,
        or review synthesis ability.
    - line: Survey and taxonomy of agentic scientific workflows
      what_it_solves: Organizes system capabilities, metrics, frameworks, and datasets
        across scientific domains and identifies literature review automation, reliability,
        and ethics as critical gaps.
      what_remains_open: Qualitative categorization lacks direct empirical evidence
        that proposed categories predict success on literature intelligence tasks.
    - line: Failure-mode and design-principle analysis
      what_it_solves: Documents recurrent failure modes in autonomous research pipelines
        and derives design principles for more robust agentic systems.
      what_remains_open: Evidence comes from a small number of ML-centric attempts;
        corrective principles are not yet validated for literature search, survey
        synthesis, or gap discovery workflows.
    consensus:
    - Systems can execute, document, and in some cases write up analyses, but current
      agents fall short of autonomous trustworthy scientific discovery.
    - Reliability and evidence maturity require controls, robustness, falsifiability,
      auditability, and generalization, not only strong task completion.
    - Literature review automation is a repeated bottleneck in scientific agent workflows.
    - Human expert involvement remains an important frame for verification and calibration.
    disagreements:
    - 'Evaluation target differs: blind peer-study-derived evidence scoring, multiple-choice
      questions from published studies, LLM-rubric scored generated papers, and human/multi-AI
      review lead to different performance claims.'
    - 'System design differs: some emphasize domain-specific verification and knowledge
      retrieval loops, while others emphasize domain-agnostic self-evolution and accumulated
      knowledge.'
    - Reported outcomes range from state-of-the-art benchmark gains to plateaued near-random
      separation and documented pipeline failures; the divergence reflects proxy benchmark
      optimization versus discovery-oriented evidence evaluation.
    - 'Supervision and interaction modes differ: human principal investigator-agent
      collaboration, automated judge scoring, and code-agent execution create different
      assumptions about when success can be declared.'
    open_questions:
    - Can LLM-based rubric or judge scores substitute for expert review of literature
      synthesis, citation quality, and research gap claims?
    - How do evidence maturity findings change across base models, scientific domains,
      and datasets when current evidence is limited or unreported?
    - Which mechanisms such as verification loops, knowledge retrieval, self-evolution,
      or explicit failure-mode constraints actually improve literature search and
      review coverage?
    - What evaluation design can isolate literature intelligence tasks from downstream
      experiment and manuscript generation so review automation is measured directly?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端文献综合与研究写作智能体
      解决的问题: 在多智能体工作流中，从最小提示自动完成检索、文献综合、验证、定理或实验写作以及论文生成。
      尚未覆盖: 评测主要基于对生成论文的LLM评分标准；文献搜索覆盖、引用质量和综述/缺口发现质量未被独立直接测量。
    - 路线: 面向发现智能体的证据锚定评测
      解决的问题: 使用来自同行评审研究的盲任务或选择题，评估科学主张的证据成熟度，而非复现目标论文。
      尚未覆盖: 发现依赖较窄领域覆盖或单一冻结基座模型；基准未单独考察文献搜索、引用分析或综述综合能力。
    - 路线: 智能体科学工作流的综述与分类体系
      解决的问题: 跨科学领域组织系统能力、指标、框架和数据集，并识别文献综述自动化、可靠性和伦理等关键缺口。
      尚未覆盖: 偏定性分类，缺乏直接实证证明这些分类能够预测文献智能任务上的表现。
    - 路线: 失败模式与设计原则分析
      解决的问题: 记录自主研究流水线中反复出现的失败模式，并推导更稳健智能体系统的设计原则。
      尚未覆盖: 证据来自少量以机器学习为中心的尝试；纠正原则尚未在文献搜索、综述综合或缺口发现工作流中验证。
    共识:
    - 当前智能体能够执行、记录并在部分场景中写出分析，但仍未达到自主可信的科学发现。
    - 可靠性和证据成熟度需要对照、稳健性、可证伪性、可审计性和泛化性，而不仅是任务完成能力。
    - 文献综述自动化是科学智能体工作流中被反复指出的瓶颈。
    - 人类专家参与仍是验证和校准的重要框架。
    分歧:
    - 评测目标不同：盲式同行研究证据评分、来自已发表研究的选择题、基于LLM评分标准的生成论文，以及人类或多AI评审，导致不同的性能结论。
    - 系统设计不同：一种强调领域特定验证和知识检索循环，另一种强调领域无关的自我演化与知识积累。
    - 报告结果差异较大：有的声称最先进基准提升，有的显示分数接近平台期、两两差异不可靠，有的记录流水线失败；分歧反映代理基准优化与面向科学发现的证据评价不同。
    - 监督和交互模式不同：人类首席研究员与智能体协作、自动评审打分、代码智能体执行等设定，对何时可以宣布成功做了不同假设。
    开放问题:
    - 基于LLM的评分标准或评审分数能否替代专家对文献综合、引用质量和研究缺口判断的审查？
    - 在现有证据有限或未报告的情况下，证据成熟度结论在不同基座模型、科学领域和数据集之间如何变化？
    - 验证循环、知识检索、自我演化或显式失败模式约束中，哪些机制真正改善文献搜索和综述覆盖？
    - 如何设计评测，将文献智能任务与下游实验和论文生成分离，从而直接测量综述自动化能力？
