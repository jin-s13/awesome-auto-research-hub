      what_remains_open: Calibration to expert reviews, fairness across fields, and
        whether proxy review scores predict real decision quality.
    - line: Reproduction and benchmarking of AI research replication
      what_it_solves: Tests AI ability to replicate research and automatically reproduce
        experiments from paper lineage.
      what_remains_open: Semantic equivalence of reproduced results, standardized
