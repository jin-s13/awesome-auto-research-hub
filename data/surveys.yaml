  literature_review:
    line_of_work_matrix:
    - line: Full-cycle autonomous discovery systems
      what_it_solves: turning a research prompt into complete artifacts by chaining
        ideation, coding, experiment execution, analysis, and manuscript generation
        with limited human input
      what_remains_open: consistent output quality and genuine novelty remain unresolved;
        demonstrations are often narrow or accepted at workshop level rather than
        fully reproducible conference-grade research
    - line: Domain-specific verification-gated systems
      what_it_solves: embedding domain knowledge into discovery by coupling retrieval
        or simulation with proof, physics, or vision checks that reject invalid intermediate
        results before writing
      what_remains_open: verification gates still miss some planted silent failures
        and have been shown only in specific domains such as applied mathematics or
        computational fluid dynamics
    - line: Discovery-oriented benchmark environments
      what_it_solves: making scientific agent competence comparable through virtual
        tasks, blind peer-derived datasets, completion metrics, and evidence-maturity
        rubrics
      what_remains_open: current evidence often comes from a single frozen base model
        or simulated/frozen data, leaving uncertain transfer to live experiments,
        new domains, and real scientific utility
    - line: Automated review and evidence evaluation
      what_it_solves: scaling evaluation of generated papers and claims through LLM/VLM
        reviewers or rubric-based judges
      what_remains_open: reviewer scores may not track human peer judgment or downstream
        validity, and acceptance thresholds often remain local to curated rubrics
        or small submission samples
    consensus:
    - Autonomous research agents are converging on a complete loop of hypothesis generation,
      experiment or derivation, analysis, and paper or report writing.
    - Explicit verification and evaluation gates are seen as necessary to make generated
      claims defensible, whether internal to the system or external through benchmarks.
    - Current systems can execute and document analyses competently, but the evidence
      indicates they do not yet reliably produce trustworthy novel scientific claims.
    - LLM-based judges or reviewers are widely used to scale assessment, but they
      require fixed rubrics or constraints to avoid purely subjective scoring.
    disagreements:
    - Some work uses domain-specific verification such as logical audits or physics-aware
      visual inspection, while others rely on generic LLM reviewers or broader environment
      metrics.
    - 'Success is evaluated differently: one stream targets quantitative domain improvement,
      another targets paper acceptance or reviewer score, and another targets task
      completion or evidence maturity.'
    - Interaction modes differ between fully autonomous runs, human-in-the-loop principal
      investigator and graduate student roles, and benchmark agents acting under limited
      observation.
    - Coverage differs from single domains like computational fluid dynamics or applied
      mathematics to multi-domain machine learning workloads and virtual science tasks.
    - 'Reported limitations vary sharply: some systems document missed failure cases
      or inconsistent acceptance, while others provide no visible limitation evidence,
      creating an uneven verification picture.'
    open_questions:
    - Can evidence-maturity scoring detect the difference between genuine new discovery
      and competent reanalysis when source conclusions are hidden?
    - Which verification mechanisms generalize across mathematical, simulation, and
      empirical domains without missing silent failures?
    - How well do LLM/VLM reviewer scores and workshop acceptance predict later peer-review
      outcomes or real scientific value?
    - Do observed agent rankings in evidence-grounded benchmarks hold across multiple
      frozen base models and beyond coding agents?
    - How much human collaboration should be retained to improve logical or domain
      validity without preventing autonomous exploration?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 全流程自主发现系统
      解决的问题: 在较少人工输入下，把研究提示转化为完整工件，串联假设生成、编码、实验执行、分析和论文撰写
      尚未覆盖: 输出质量和真正新颖性仍不一致；演示范围较窄，或仅在工作坊级别获得接受，尚未形成可复现的会议级研究
    - 路线: 领域专用验证门控系统
      解决的问题: 通过检索或仿真与证明、物理、视觉检查结合，在写入结果前拒绝无效中间产出，将领域知识嵌入发现流程
      尚未覆盖: 验证门控仍会漏掉部分植入静默失败，且目前仅在应用数学或计算流体动力学等特定领域展示
    - 路线: 面向发现的基准环境
      解决的问题: 通过虚拟任务、盲测同行研究数据、完成度指标和证据成熟度量规，使科学智能体能力可比较
      尚未覆盖: 当前证据常来自单一冻结基座模型或仿真/冻结数据，跨真实实验、新领域和真实科学效用的迁移仍不确定
    - 路线: 自动评审与证据评估
      解决的问题: 通过LLM/VLM评审者或量规评分，规模化评估生成论文和科学主张
      尚未覆盖: 评审分数未必追踪人类同行判断或下游有效性，接受阈值常局限于策展量规或少量提交样本
    共识:
    - 自主科研智能体正汇聚到从假设生成、实验或推导、分析到论文或报告撰写的完整循环上。
    - 显式验证与评测门控被认为对生成主张的可辩护性至关重要，无论在系统内部还是通过外部基准。
    - 当前系统能胜任执行和记录分析，但证据表明它们尚不能可靠产生值得信任的新颖科学主张。
    - 基于LLM的评审者或裁判被广泛用于规模化评估，但需要固定量规或约束，以避免纯主观打分。
    分歧:
    - 部分工作采用领域专用验证，如逻辑审计或物理感知视觉检查；另一些依赖通用LLM评审者或更宽泛的环境指标。
    - 成功标准不同：一支路线重视领域指标量化改进，一支重视论文接受或评审分数，另一支重视任务完成或证据成熟度。
