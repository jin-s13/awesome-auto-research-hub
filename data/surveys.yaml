      尚未覆盖: 合成或任务特定的成功未必对应真实科学效用；强基线智能体在许多任务上仍困难，但指标未必反映证据质量。
    - 路线: 基于证据的科学主张评估
      解决的问题: 评估智能体主张是否得到数据、对照、稳健性、可证伪性、新颖性、可审计性和跨数据集泛化的支持，而非仅复现论文。
      尚未覆盖: 当前编码智能体在可信主张成熟度以下停滞，缺乏判别性科学判断；评估只基于单一冻结基座模型，跨模型泛化性缺失。
    - 路线: 自动评审与同行评审集成
      解决的问题: 用LLM或VLM审稿人扩展论文质量评估，并以接收阈值判断生成手稿是否接近人工评审工作。
      尚未覆盖: 自动评审与人类科学判断的对齐仍不完全；一篇被接收的工作坊手稿不足以证明会议级可靠性或稳定质量。
    共识:
    - 基于LLM的系统已经能够生成完整论文，并至少执行科学发现循环的部分环节。
    - 仅有生成能力不够；需要评估、验证或评审层来捕捉无支撑或无效的主张。
    - 当前智能体尚不是可信赖的自主科学家；它们在证据成熟度或领域有效性检查上仍处于平台期。
    - 代码、工件、基准和开源流程等可复现信号正在改善，但在不同工作中仍然不均衡。
    分歧:
    - 自主性范围不同：一些系统采用人类PI与研究生式协作，另一些则追求完全自动化的手稿提交。
    - 目标领域不同：部分工作强调通用机器学习发现，另一些聚焦应用数学或计算流体动力学，引入领域特定约束。
    - 评测哲学不同：模拟同行评审的接收阈值与隐藏源结论和预期值的盲测证据锚定任务存在差异。
    - 验证策略不同：内部逻辑一致性循环、视觉-语言物理门控和审稿反馈循环分别捕捉不同失败模式。
    - 部署和可复现性不同：一些系统开源并提供可见工件，另一些从现有证据中无法确认代码或基线可得性。
    开放问题:
    - 自动评审在多大程度上与长期科学影响和人类同行判断一致？
    - 领域专用验证门控能否在新问题、新数据集和新科学共同体中规模化？
    - 什么样的评测设计能预测真实发现效用，而不仅是任务完成度或LLM评分成熟度？
    - 智能体如何一致地生成对照、稳健性检查、可证伪主张和跨数据集泛化？
    - 系统性能和失败模式会如何随基座模型、计算预算和领域变化？
