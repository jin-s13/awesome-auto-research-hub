    研究路线矩阵:
    - 路线: 端到端自主发现系统
      解决的问题: 将研究提示转化为想法生成、代码或推导执行、实验运行、可视化和论文撰写的闭环。
      尚未覆盖: 多次运行和跨领域的一致性仍不充分，尤其是仅部分生成论文通过同行评审；局限性与工件报告有限。
    - 路线: 虚拟评测环境与基准测试床
      解决的问题: 通过可复现任务、参数变化和自动指标，评测假设形成、实验设计、执行与分析能力。
      尚未覆盖: 任务完成度和解释性知识分数是否与真实科学发现质量一致仍不清楚。
    - 路线: 失败感知记忆与反馈机制
      解决的问题: 将失败尝试或评审/模拟反馈存储为可复用信号，引导后续实验并降低令牌消耗。
      尚未覆盖: 跨任务迁移、采纳/拒绝可靠性，以及负知识是否会过时或过度限制后续探索。
    - 路线: 交互式多智能体实验平台
      解决的问题: 提供可定制角色、实时监控、回滚/恢复控制和代码工具，让人类可检查和引导智能体实验。
      尚未覆盖: 仅少量内部案例研究，平台成熟度和跨数据、硬件、用户场景的外部验证不足。
    - 路线: 真实环境中的前沿智能体评测
      解决的问题: 衡量前沿编码智能体能否在多个科学机器学习基准上改进已发表最佳模型。
      尚未覆盖: 新颖性误判和资源利用不足；难以区分机器学习工程技巧与领域研究洞见。
    共识:
    - 自主实验被组织为多阶段循环，涵盖假设或想法生成、实验执行、分析和报告或论文撰写。
    - 内部验证、评审反馈、记忆或监控能改进一次性生成的迭代工作流。
    - 自动评审信号被广泛使用，但只在有限场景下与人类或同行评审对齐。
    - 在以往环境中表现良好的强智能体难以直接迁移到新的科学发现任务，因此需要专门评测环境。
    分歧:
    - 评测对象不同：生成论文质量、虚拟任务完成、对已发表最佳模型的改进，或平台工作流的专家偏好。
    - 成功标准不同：大模型评分或模拟评审、实际 workshop 同行接受、平均相对基准提升，或 AI 专家判断。
    - 自动化模式不同：全自动论文生成、人在环交互仪表板、插件技能增强，或作为独立层的共享失败记忆。
    - 部署范围不同：应用数学推导与论文生成、机器学习代码实验、虚拟微发现任务，或广泛科学机器学习基准扫描。
    开放问题:
    - 当前沿智能体改进基准时，如何区分机器学习工程技巧收益与研究级领域洞见？
