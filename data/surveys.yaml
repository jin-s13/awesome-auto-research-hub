    - 路线: 面向发现能力的基准与评测框架
      解决的问题: 通过任务、基线、指标和难度度量使系统能力主张具备可比性
      尚未覆盖: 代理指标与真实科学效用之间的一致性以及更广泛领域覆盖仍缺乏证据
    - 路线: 领域特定的端到端发现系统
      解决的问题: 在生物学或方程发现等场景中产出具实验或符号验证的假设
      尚未覆盖: 跨领域泛化、可复现性和超越示范案例后的验证深度仍有限
    共识:
    - 多数系统将假设生成视为连接文献或数据分析与实验反馈、代码执行的迭代循环。
    - 多智能体分工较常见，文献搜索、数据分析、构思、执行和验证角色相互分离。
    - 人类监督通常在关键高杠杆决策点最有用，而非逐步全面干预。
    - 可追溯报告和基准任务正在成为评价自主研究系统的重要机制。
    - 当前系统在结构化、可执行、可快速验证的场景中更可信，在难以受控的环境中可靠性不足。
