  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automating the complete scientific discovery cycle—literature
        synthesis, ideation, experiment execution, analysis, and paper writing—to
        reduce human workload and accelerate research.
      what_remains_open: Cross-domain generalization is not validated; success rates
        in genuine peer-reviewed acceptance remain unstable; human experts still need
        to intervene at critical decision points to correct errors.
    - line: Evaluation benchmarks and evidence design
      what_it_solves: Providing standardized tasks, metrics, and baselines to measure
        AI scientists' capabilities in experiment completion and knowledge discovery,
        and establishing human baselines for comparison.
      what_remains_open: Existing benchmarks cover limited scientific domains and
        difficulty levels; the alignment between automatic metrics and real scientific
        breakthrough value is not yet verified.
    - line: Domain-specific verification and safety mechanisms
      what_it_solves: Ensuring the scientific validity of AI-generated results and
        reducing hallucinations through internal logic audits, physics-aware vision
        inspection, or knowledge retrieval gates.
      what_remains_open: Verification mechanisms are tightly coupled with domain knowledge
        and are hard to transfer across fields; even specialized gates can miss silent
        failures (e.g., missing 2 out of 16 planted errors in a CFD study).
    consensus:
    - Almost all systems adopt LLM-based multi-agent or pipeline architectures that
      decompose research into subtasks such as ideation, experimentation, analysis,
      and writing.
    - Systems universally recognize the necessity of internal verification or review
      mechanisms to enhance the reliability of generated results.
    - All works emphasize reducing the cost and time of scientific research through
      automation while making the research process reproducible.
    disagreements:
    - 'The degree of human supervision varies: some systems target full autonomy,
      while others deliberately incorporate human-in-the-loop collaboration at multiple
      intervention levels, leading to different definitions of ''autonomy''.'
    - 'Verification strategies differ: some rely on general LLM-based reviewers, while
      others deploy domain-specific models (e.g., vision-language physics gates),
      raising questions about reliability and generalizability.'
    - 'Evaluation practices are inconsistent: some systems use simulated review or
      benchmark metrics, others submit to real peer review, and there is no unified
      success metric for scientific discovery quality.'
    - 'Application scope splits the field: some systems target general ML subdomains,
      others focus on mathematics, fluid dynamics, or biology, creating a tension
      between generality and deep domain specialization.'
    open_questions:
    - How can we design verification mechanisms that transfer across unfamiliar scientific
      domains to detect and correct errors?
    - To what extent do automatic evaluation metrics reflect genuine scientific breakthrough
      value rather than task completion?
    - How can long-term autonomous discovery systems avoid cumulative errors and effectively
      integrate new knowledge into existing human knowledge bases?
