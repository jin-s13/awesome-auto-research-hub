    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: Automates idea generation, coding, experimentation, visualization,
        and full paper drafting as one connected pipeline.
      what_remains_open: Consistent full conference acceptance, reliability beyond
        isolated or workshop-level successes, and standardized external validation.
    - line: Verification and grounded reporting for generated claims
      what_it_solves: Adds logical, measured-output, or domain-specific validity checks
        to prevent fabricated numbers, hallucinated citations, and silent experimental
        failures from entering drafts.
      what_remains_open: Verification gates still miss some planted failures and lack
        cross-domain standardized audit; logical checks may not cover empirical validity.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Combines autonomous execution with targeted human oversight
        at high-leverage decision points, aiming to balance full autonomy and exhaustive
        supervision.
      what_remains_open: Optimal intervention points, transfer beyond limited benchmark
        settings, and reducing the cost of human involvement.
    - line: Failure analysis and comparative benchmarking for research agents
      what_it_solves: Makes generated research more comparable by documenting recurring
        failure modes, design principles, and benchmark scores for paper quality or
        artifact usefulness.
      what_remains_open: Benchmarks and case studies are small, proxy metrics may
        not align with real scientific contribution, and blind human or peer validation
        remains limited.
    consensus:
    - Multi-agent or staged workflows cover ideation, execution, verification, and
      manuscript writing or review.
    - Automated verification or review is treated as necessary for defensible generated
      papers, not as optional post-processing.
    - LLM-based review scores and benchmark metrics are common but are not yet accepted
      as replacements for human peer review.
    - Generated papers can pass simulated review or workshop-level peer acceptance,
      but success is not yet consistent.
    - Targeted human oversight at critical decision points improves reliability over
      either full autonomy or exhaustive step-by-step supervision.
