  related_work_outline_zh:
  - 主流方向：端到端自主科研智能体，自动提出想法、执行代码实验、分析结果并撰写论文，并用基于LLM的评审作为核心评测回路。
  - 研究共性：将构思、实验执行、结果分析与论文写作串联为闭环，常采用多智能体角色或树搜索，并引入自动评审。
  - 关键差异：有的面向完整论文生成，有的面向模拟发现任务、消融规划或失败记忆迭代；评测从内部LLM评审到专家偏好和任务完成指标不等。
  - 趋势演进：证据集中在2024-2026年，从完整循环框架和基准环境，走向同行评审级生成、子问题基准，以及2026年的交互式或记忆增强研究平台。
  - 开放问题：自动评审是否与人类科学效用一致，失败尝试记忆能否跨领域迁移，以及实验室场景和外部可复现性缺口如何补足。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery loop
      what_it_solves: Automates the complete cycle of hypothesis generation, code
        execution, experiment management, and manuscript authoring.
      what_remains_open: Consistency beyond internal or workshop-level judges; stable
        full peer-review reliability is not yet demonstrated.
    - line: Experiment planning and ablation design
      what_it_solves: Turns method sections or full papers into missing ablation experiment
        plans for empirical AI research.
      what_remains_open: Language model recall remains below human level, and author-versus-reviewer
        grounding reverses in observed tasks.
    - line: Failure-aware shared memory
      what_it_solves: Converts failed attempts into typed records that downstream
        agents adopt or reject, improving experiment selection with fewer tokens.
      what_remains_open: Evidence is limited to retry and PDE transfer settings; broader
        experiment automation or lab settings remain uncovered.
    - line: Benchmark environments for discovery agents
      what_it_solves: Evaluates hypothesis-experiment-conclusion behavior through
        task completion, task-relevant actions, and explanatory knowledge.
      what_remains_open: Strong baselines struggle on most tasks, but proxy metrics
        may not capture real scientific utility or lab deployment.
    - line: Interactive multi-agent research infrastructure
      what_it_solves: Provides role customization, real-time monitoring, artifact
        inspection, and local codebase integration for human-guided research teams.
      what_remains_open: Only internal AI case studies are shown; platform maturity
        and external validation are not yet established.
    consensus:
    - Multiple approaches treat scientific experimentation as a closed loop requiring
      hypothesis formation, execution, result analysis, and written output.
    - They rely on LLM-based or expert judging to score generated papers, task completion,
      or experiment plans, but validation is mostly internal or simulated.
    - Most systems introduce iteration or verification, such as reviewer feedback,
      tree search, internal audits, or failure memory.
    - Reproducibility and limitation evidence is inconsistent; several papers lack
      visible code, dataset, or external citation metadata, creating verification
      gaps.
    disagreements:
    - Some systems target complete manuscripts that can pass peer review, while others
      target task completion in a simulated environment or the narrower subproblem
      of planning ablations.
    - 'Supervision and interaction differ: fully autonomous generation, human principal
      investigator roles, interactive dashboards, and curated failure records assign
      authority differently.'
    - Evaluation targets differ from paper acceptance thresholds, to task completion
      and explanatory knowledge, to AI expert preference, to ablation recall.
    - 'Domain and deployment settings differ: applied mathematics reasoning, machine
      learning empirical studies, broad science scenarios, and PDE retry or transfer
      tasks.'
    - 'Optimization signals differ: some maximize reviewer scores; others reduce token
      use or improve novelty, completeness, and presentation quality.'
    open_questions:
    - Can automated review scores be calibrated against external human peer review
      and real downstream scientific utility beyond acceptance thresholds?
    - Does failure-aware memory transfer beyond ScienceAgentBench-style retries and
      PDE examples to wet-lab or multi-step code experiments?
    - What explains the inverse author-reviewer ablation performance, and can a single
      system ground planning in both paper writing and reviewing?
    - How should discovery agent benchmarks scale beyond 120 simulated tasks or five
      internal AI case studies to cover diverse scientific fields and lab settings?
    - Are missing code, datasets, limitations, and external baselines indicative of
      reproducibility gaps, or only absent metadata in the bounded packet?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现闭环
      解决的问题: 自动完成假说生成、代码执行、实验管理与论文撰写的完整循环。
      尚未覆盖: 通过内部或工作坊评审得到的结果能否稳定扩展到完整同行评审与真实科学效用仍未可知。
    - 路线: 实验规划与消融实验设计
      解决的问题: 把方法部分或完整论文转化为实证AI研究中缺失的消融实验计划。
      尚未覆盖: 语言模型消融召回低于人类，作者与审稿任务存在反向表现，基础差异未解决。
    - 路线: 失败感知共享记忆
      解决的问题: 将失败尝试记录为下游代理可采纳或拒绝的类型化记录，以更少令牌改善实验选择。
      尚未覆盖: 证据限于重试和PDE迁移，尚未覆盖更广泛的实验自动化或实验室场景。
    - 路线: 发现型智能体基准环境
      解决的问题: 通过任务完成、任务相关动作和解释性知识自动评估假说-实验-结论循环。
      尚未覆盖: 代理在多数任务上仍然困难，代理指标与真实科研效用或实验室部署的一致性未验证。
    - 路线: 交互式多智能体研究基础设施
      解决的问题: 提供角色定制、实时监控、工件检查和本地代码库集成的人机研究平台。
      尚未覆盖: 仅展示内部AI案例评估，平台成熟度和外部验证不足。
    共识:
    - 多项工作把科学实验自动化视为一个闭环，需要提出假说、执行、分析结果并形成书面输出。
    - 常用LLM评审或专家评审给论文、任务完成或实验计划打分，但这些评估大多来自内部或模拟环境。
    - 系统普遍引入迭代或验证机制，如评审反馈、树搜索、内部审计或失败记忆。
    - 可复现性与局限性报告不一致，缺少可见代码、数据集或外部引用元数据，形成验证缺口。
    分歧:
    - 有的面向能通过同行评审的完整论文，有的面向模拟环境中的任务完成，有的只处理消融规划这一子问题。
    - 监督与交互方式不同：完全自主生成、人类首席研究员、交互式仪表板和失败记录分别赋予不同的介入方式。
    - 评测目标不同：论文接受阈值、任务完成和解释性知识、AI专家偏好、消融召回率不直接可比。
    - 领域和部署设置不同：应用数学推理、机器学习实证、跨学科科学任务和PDE重试或迁移任务。
    - 优化信号不同：有的最大化评审分数，有的减少令牌使用或提高新颖性、完整性和呈现质量。
    开放问题:
    - 自动评审分数能否与外部人类同行评审以及真实下游科学效用对齐？
    - 失败感知记忆能否从ScienceAgentBench式重试和PDE示例迁移到湿实验或多步骤代码实验？
    - 什么原因导致作者与审稿消融性能反向，单一系统能否同时兼顾写作和评审的基础？
    - 发现型智能体基准如何从120个模拟任务或五个内部AI案例扩展到多样科学领域和实验室设置？
    - 缺失代码、数据集、局限性和外部基线是真实可复现性缺口，还是仅证据包元数据不足？
