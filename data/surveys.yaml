  related_work_outline:
  - 'Mainstream direction: Autonomous multi-agent research pipelines for hypothesis
    generation, where LLM agents propose, execute, evaluate, and refine hypotheses
    inside structured search or debate loops, often with human oversight.'
  - 'Shared research pattern: Evidence-grounded iterative loop: hypothesis proposal,
    code/experiment execution, metric or diagnostic feedback, then backtracking or
    refinement; systems add trees, evolutionary selection, debate, or shared state
    to improve traceability.'
  - 'Key differences: Control authority, search representation, human interaction
    mode, and evaluation domain differ across systems; some use deterministic program
    authorities, others LLM self-repair or targeted human intervention, and tasks
    range from research workflows to equation and architecture discovery.'
  - 'Trend evolution: Evidence is concentrated in 2025-2026, so the trend is within
    the current frontier: systems are moving from surveys and single-domain discovery
    toward more autonomous, verifiable, human-collaborative research agents, with
    harder realistic evaluations.'
  - 'Open questions: Reliability beyond tested cycles and domains, attribution of
    gains, weak-direction rejection, provenance preservation, and external validation
    remain unresolved; several papers lack visible code, dataset, metric, baseline,
    or limitation evidence.'
  related_work_outline_zh:
  - 主流方向：以自主多智能体研究流水线为核心的假设生成，LLM智能体在结构化搜索或辩论循环中提出、执行、评估并精炼假设，并常引入人类监督。
  - 研究共性：形成证据驱动的迭代闭环：假设提出→代码/实验执行→指标或诊断反馈→回溯或精炼；系统通过树、进化选择、辩论或共享状态增强可追溯性。
  - 关键差异：控制权归属、搜索表示、人机交互模式和评测域不同；有的使用确定性程序权威，有的依靠LLM自愈或定向人类干预，任务涵盖研究工作流、方程与架构发现等。
  - 趋势演进：证据集中在2025–2026年，趋势属于当前前沿：系统正从综述和单域发现走向更自主、可验证、人机协作的研究智能体，评测也更真实且更难。
  - 开放问题：已测周期与领域之外的可靠性、收益归因、弱方向拒绝、来源保存和外部验证仍不清晰；部分论文缺少可见的代码、数据集、指标、基线或局限性证据。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous multi-agent research orchestration
      what_it_solves: Organizes hypothesis generation into branching, backtracking,
        debate, self-repair, and human-intervention workflows so research trajectories
        are controllable and inspectable.
      what_remains_open: Whether reported gains generalize beyond evaluated research-workflow,
        combinatorial optimization, and cooperative driving settings, and whether
        human oversight contributes reliably outside selected ablations.
    - line: Evidence-conditioned iterative discovery
      what_it_solves: Binds hypothesis generation to executable code, data analysis,
        diagnostics, and iterative optimization for forecasting architectures, equations,
        and open-ended datasets.
      what_remains_open: Attribution of improvement versus baselines, controllers,
        or task-specific search priors, and behavior beyond the tested domains, cycles,
        and dataset conditions.
    - line: Shared research-state and traceable reporting
      what_it_solves: Maintains a structured research world model or verifiable reporting
        layer so data-analysis and literature evidence can be shared, cited, and audited
        across long-horizon discovery runs.
      what_remains_open: Reported statement accuracy remains imperfect, scaling is
        only tested up to 20 cycles, and missing limitation details in several systems
        create verification gaps rather than proof of absence.
    - line: Evaluation and conceptual organization of research automation
      what_it_solves: Defines workflow conditions, evaluation dimensions, and more
        realistic task suites for comparing AI research capabilities across scientific
        domains.
      what_remains_open: Proxy task performance may not cover embodied, delayed, heterogeneous,
        ethical, or institutionally accountable settings; harder task suites show
        large accuracy drops without clarifying which capability fails.
    consensus:
    - Hypothesis generation is moving from single-shot LLM outputs to iterative multi-agent
      loops that connect proposals to executable experiments, feedback, and refinement.
    - Structured search or planning mechanisms such as debate, trees, evolutionary
      selection, or memory are used to make research trajectories inspectable and
      controllable.
    - Human-AI collaboration is treated as a reliability mechanism, with targeted
      collaboration at high-leverage decision points reported to outperform fully
      autonomous or exhaustive step-by-step oversight.
    - Evaluation currently emphasizes task-specific baselines and metrics, while shared
      evidence for scientific validity, provenance, long-horizon reliability, and
      reproducibility remains underdeveloped.
    disagreements:
    - 'Control and authority differ: some systems let LLM agents handle open-ended
      hypothesis generation while deterministic program authorities enforce source-edit
      boundaries and promotion; others rely on self-healing agents or human interventions.'
    - 'Search representation differs: some use tree-structured branching with backtracking,
      some use evolutionary-systematic selection, and others use structured multi-agent
      debate.'
    - Evaluation target differs across research-workflow tasks, forecasting architecture
      evolution, equation discovery datasets, biology laboratory tasks, and combinatorial
      optimization scenarios, making direct comparison difficult.
    - 'Evidence and reproducibility differ: some systems provide code, dataset, or
      evaluation-harness signals, while others primarily provide survey or textual
      claims, leaving external validation as a verification gap.'
    open_questions:
    - How much of reported improvement comes from the hypothesis-generation or search
      mechanism rather than stronger base models, controllers, task-specific simulators,
      or data priors?
    - Can these systems preserve evidence, reject weak directions, and maintain accurate
      provenance when scaled beyond currently tested cycles, selected tasks, and limited
      domain cases?
    - What common metrics would make research validity, reproducibility, and downstream
      scientific utility comparable across heterogeneous domains and deployment settings?
    - Where should missing code, datasets, metrics, baselines, or limitation statements
      be treated as verification gaps, and how would standardized external validation
      change conclusions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主多智能体研究编排
      解决的问题: 把假设生成组织成带分支、回溯、辩论、自修复和人工干预的工作流，使研究轨迹可控且可检查。
      尚未覆盖: 报告增益是否超过已评估的研究工作流、组合优化和协同驾驶场景仍不清楚；人类监督的可靠贡献尚未在更多消融中隔离。
    - 路线: 证据驱动的迭代发现
      解决的问题: 将假设生成与可执行代码、数据分析、诊断和迭代优化绑定，用于预测架构、方程和开放数据集的发现。
      尚未覆盖: 较基线、控制器或任务特定搜索先验的增益归因不明；已测领域、周期和数据集条件之外的行为未知。
    - 路线: 共享研究状态与可追溯报告
      解决的问题: 维护结构化研究状态或可验证报告层，使数据分析和文献证据能在长周期发现中被共享、引用和审计。
      尚未覆盖: 报告陈述准确率仍不完美，发现规模仅测至20周期；多个系统缺少局限性细节，属于验证缺口而非不存在。
    - 路线: 研究自动化的评测与概念组织
      解决的问题: 定义工作流条件、评测维度和更真实的任务套件，以比较不同科学领域中的AI研究能力。
      尚未覆盖: 代理任务表现可能不覆盖具身、延迟、异质、伦理或机构问责场景；更难的任务套件准确率大幅下降，但未说明哪项能力失败。
    共识:
    - 假设生成正从单次LLM输出转向迭代多智能体闭环，将提案连接到可执行实验、反馈和精炼。
    - 通过辩论、树、进化选择或记忆等结构化搜索与规划机制，使研究轨迹可检查、可控制。
    - 人机协作被作为可靠性机制，在高杠杆决策点进行定向协作的表现优于全自主或逐步监督的消融结果。
    - 评测目前依赖任务特定基线和指标，但科学有效性、来源、长周期可靠性和可复现性的共享证据仍不成熟。
    分歧:
    - 控制与权限不同：有的系统让LLM智能体处理开放式假设生成，由确定性程序权威控制源码边界和晋升；有的依赖自愈智能体或人工干预。
    - 搜索表示不同：有的采用树形分支与回溯，有的采用进化-系统化选择，有的采用结构化多智能体辩论。
    - 评测目标不同：涉及研究工作流任务、预测架构演化、方程发现数据集、生物学实验任务和组合优化场景，难以直接比较。
    - 证据与可复现性不同：有的提供代码、数据集或评测工具信号，有的主要提供综述或文本主张，外部验证仍属验证缺口。
    开放问题:
    - 报告中的性能提升有多少来自假设生成或搜索机制本身，而不是更强的基座模型、控制器、任务专用仿真器或数据先验？
    - 这些系统在超越当前已测周期、选定任务和有限领域案例后，能否保留证据、拒绝弱方向并维持准确来源？
    - 需要哪些共同指标，使研究有效性、可复现性和下游科学效用能在异构领域和部署环境中可比？
    - 缺失的代码、数据集、指标、基线或局限性信息应在何处被视为验证缺口，标准化外部验证会如何改变结论？
