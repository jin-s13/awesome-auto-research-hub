  related_work_outline:
  - 'Mainstream direction: Agentic scientific research automation is dominant, including
    literature synthesis, reasoning verification, autonomous paper generation, and
    evidence-grounded evaluation. Short examples include ReasFlow for autonomous mathematical
    discovery, TruthInsightBench for blind evidence maturity scoring, and EvoMaster
    for self-evolving discovery agents.'
  - 'Shared research pattern: Multiple papers use LLM-based multi-agent or pipeline
    designs with retrieval, verification, and automated judges. They treat human experts
    as supervisors or baselines and emphasize auditability, documentation, and evidence
    maturity over raw task accuracy.'
  - 'Key differences: One line generates end-to-end papers from minimal prompts; another
    withholds source conclusions to test evidence inference; another evaluates domain-specific
    biological discovery with human baselines. Architectures differ in self-evolving
    memory versus fixed verification loops, and in evaluation strictness and domain
    coverage.'
  - 'Trend evolution: Top-ranked evidence is concentrated in 2025-2026; no clear 2023/2024
    signal is present in the packet. The observed frontier moves from domain-specific
    potential benchmarks toward blind evidence-grounded evaluation, failure analysis,
    and self-evolving frameworks, emphasizing reliability over demos.'
  - 'Open questions: Open issues include LLM-judge validity, base-model and cross-domain
    generalization, whether benchmark gains reflect scientific judgement or execution
    ability, and missing artifacts or external validation for literature-review automation.'
  related_work_outline_zh:
  - 主流方向：智能体驱动的科研自动化居主导，涵盖文献综合、推理验证、自主论文生成和证据锚定评测，例如ReasFlow、TruthInsightBench、EvoMaster。
  - 研究共性：多采用LLM多智能体或流水线设计，结合检索、内部验证和自动评审；把人类专家作为监督者或基线，强调可审计性、文档与证据成熟度。
  - 关键差异：一方从最小提示端到端生成论文；另一方隐藏源结论以测试证据推断；还有领域特定生物发现评测。架构上存在自演化记忆与固定验证流水线差异，评测严格度和覆盖领域也不同。
  - 趋势演进：高排名证据集中于2025-2026年，未观察到2023/2024明显信号；前沿从领域潜力基准转向盲式证据评测、失败分析和自演化框架，强调可靠性而非演示。
  - 开放问题：LLM评审效度、跨基座与跨领域泛化、基准提升是否代表科学判断或执行能力、文献综述自动化的工件与外部验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous literature and research synthesis systems
      what_it_solves: Integrating literature search, synthesis, verification, iterative
        error correction, self-improvement, and paper generation into a runnable workflow.
      what_remains_open: Verification quality beyond curated LLM rubrics; reproducibility
        across fields; whether generated synthesis captures actual research gaps rather
        than surface structure.
    - line: Evidence-grounded evaluation for open-ended discovery agents
      what_it_solves: Making discovery claims comparable by withholding source conclusions
        and scoring evidential maturity with a fixed automated judge across multiple
        evidential dimensions.
      what_remains_open: Only one frozen base model evaluated; unclear whether evidential
        maturity predicts real scientific or literature-review utility; limited domain
        and task coverage beyond coding and selected sciences.
    - line: Domain-specific expert-scored discovery benchmarking
      what_it_solves: Grounding evaluation in real omics data and graduate-level human
        baselines for cell annotation and discovery questions drawn from published
        studies.
      what_remains_open: Narrow multiple-choice and annotation tasks may miss open-ended
        literature reasoning and gap discovery; missing cross-base-model and artifact
        details are verification gaps.
    - line: Failure analysis and conceptual design principles for agentic research
      what_it_solves: Organizing recurring autonomous research failure modes and system
        capabilities into design principles and survey categories.
      what_remains_open: Categories are not yet validated as predictive of system
        behavior; reliability and ethical concerns remain unresolved; literature-review
        automation is still identified as a bottleneck.
    consensus:
    - Current systems competently execute and document analyses, with comparatively
      strong evidence auditability and novelty, but do not close the gap to trustworthy
      discovery.
    - Automated LLM-based evaluation is a common scalability solution, yet its external
      validity and agreement with human utility are not established.
    - Human-in-the-loop or principal-investigator style supervision remains a shared
      interaction pattern.
    - Literature review automation persists as a significant unresolved bottleneck
      across systems.
    disagreements:
    - 'Target output differs: end-to-end generated papers versus blind evidence inference
      versus domain-specific cell annotation and discovery questions.'
    - 'Evaluation focus differs: manuscript quality, evidential maturity, or domain
      task accuracy.'
    - 'Agent architecture differs: self-evolution with accumulated memory versus fixed
      multi-agent verification pipelines.'
    - Reported conclusions differ sharply, from state-of-the-art benchmark gains to
      three of four attempts failing, reflecting divergent evaluation strictness and
      domain settings.
    open_questions:
    - Can automated LLM judges assess credibility of literature synthesis and research-gap
      claims as reliably as expert reviewers?
    - Do benchmark gains reflect scientific and literature understanding or mainly
      execution, documentation, and self-audit competence?
    - How well do these workflows transfer across base models and beyond applied mathematics,
      biology, and machine learning?
    - What external artifacts and validation are needed to close reproducibility gaps
      in literature search and review automation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主文献与科研综合系统
      解决的问题: 将文献检索、综合、验证、迭代纠错、自我改进和论文生成整合为可运行流程
      尚未覆盖: 人工LLM评审之外的可复现性；生成综合内容是否真正呈现研究空白仍未被直接验证
    - 路线: 开放式发现智能体的证据锚定评测
      解决的问题: 隐藏源结论并由固定自动评审按证据维度评分，使发现主张可比较
      尚未覆盖: 仅评估一个冻结基座模型；证据成熟度与真实科学或文献判断效用是否一致未知；任务覆盖有限
    - 路线: 领域特定专家评分发现基准
      解决的问题: 用真实组学数据和研究生级人类基线评估细胞注释与已发表研究衍生发现问题
      尚未覆盖: 选择题和注释任务对开放文献推理覆盖不足；缺少跨基座模型与工件信号是验证缺口
    - 路线: 智能体科研的失败分析与概念设计原则
      解决的问题: 将反复出现的自主研究失败模式和系统能力组织为设计原则与综述分类
      尚未覆盖: 分类尚未被证明能预测系统行为；伦理与系统可靠性未解决；文献综述自动化仍是瓶颈
    共识:
    - 当前智能体可胜任分析执行和文档记录，证据可审计性和新颖性相对较强，但尚未弥合到可信发现的差距。
    - 自动化LLM评审是常见规模化手段，但其外部效度以及与人类效用的一致性尚未建立。
    - 人机协作或首席研究员式监督仍是共享交互模式。
    - 文献综述自动化仍是跨系统持续存在的显著瓶颈。
    分歧:
    - 目标输出不同：端到端生成论文、盲式证据推断、领域特定细胞注释与发现问答。
    - 评测焦点不同：论文质量、证据成熟度或领域任务准确性。
    - 智能体架构不同：自演化与记忆积累对比固定多智能体验证流水线。
    - 结论强度不同：从最先进基准提升到四次尝试三次失败，反映评测严格度和领域设置差异。
    开放问题:
    - LLM自动评审能否像专家一样可靠评价文献综合和研究空白主张的可信度？
    - 基准提升反映的是科学文献理解，还是执行、文档与自我审计能力？
    - 这些工作流在应用数学、生物学和机器学习之外的领域及不同基座模型上如何迁移？
    - 还需要哪些外部工件和验证来弥合文献搜索与综述自动化的可复现性缺口？
