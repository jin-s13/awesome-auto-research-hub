      they have not demonstrated trustworthy open-ended discovery because they lack
      controls, robustness, falsifiability, and cross-dataset generalization.
    - Evaluation is moving toward full discovery cycles and evidence quality rather
      than only final numeric performance.
    - LLM-based ideation and code generation alone are not considered sufficient;
      verification gates, deterministic authorities, or external benchmarks are treated
      as necessary complements.
    disagreements:
