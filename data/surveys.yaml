  related_work_outline_zh:
  - 主流方向：融合验证、知识检索与证据锚定评估的自主多智能体研究与发现系统。
  - 研究共性：智能体流程常覆盖检索、假设/分析、验证与写作；评测强调冻结数据、自动裁判和证据成熟度。
  - 关键差异：领域范围、监督交互模式和评测目标不同；性能结论从 LLM 评分最高到无统计显著差异及失败记录并存。
  - 趋势演进：证据集中在 2025-2026，当前前沿从能力演示转向对失败模式、可信性和证据质量的基准评估。
  - 开放问题：自动评分是否经独立人工验证，单基座模型或单领域结论能否泛化，验证循环能否弥补对照、稳健性与可证伪性缺口。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous multi-agent research generation with verification and knowledge
        retrieval, e.g., ReasFlow
      what_it_solves: End-to-end literature synthesis, derivation, experimentation,
        and paper generation in reasoning-centric domains under human principal-investigator
        supervision.
      what_remains_open: Evaluation relies on curated LLM review rubrics; no external
        human validity evidence or limitation analysis is reported, leaving cross-domain
        trust uncertain.
    - line: Evidence-grounded evaluation of open-ended discovery agents, e.g., TruthInsightBench
        and BAISBench
      what_it_solves: Uses blind tasks, frozen data, and peer-reviewed-study-derived
        questions to compare whether agents support claims with controls, robustness,
        falsifiability, and auditability.
      what_remains_open: Coverage is limited to a single frozen base model or a specific
        biological data setting; cross-base-model and cross-domain generalization
        remain unverified.
    - line: Failure-case and design-principle analysis for autonomous research pipelines,
        e.g., Why LLMs Aren't Scientists Yet
      what_it_solves: Identifies recurring failure modes such as implementation drift,
        memory degradation, overexcitement, insufficient domain intelligence, and
        weak scientific taste.
      what_remains_open: Evidence comes from four end-to-end attempts in ML research,
        so it does not establish which design interventions generalize to other pipelines
        or fields.
    - line: Self-evolving domain-agnostic agent frameworks, e.g., EvoMaster
      what_it_solves: Provides reusable infrastructure for iterative hypothesis refinement,
        self-critique, and knowledge accumulation across scientific disciplines.
      what_remains_open: Reported benchmark scores are task-proxy results; missing
        limitation details and external validation across hardware, datasets, and
        user settings leave practical reliability open.
    - line: Survey-based taxonomy of agentic AI for scientific discovery, e.g., Agentic
        AI for Scientific Discovery survey
      what_it_solves: Organizes progress by scientific domain, capability, evaluation
        metric, framework, dataset, and challenge such as literature review automation
        and reliability.
      what_remains_open: Proposed categories remain descriptive; no direct empirical
        evidence shows that the taxonomy predicts system behavior or intervention
        effectiveness.
    consensus:
    - Autonomous discovery agents are still treated as assistants rather than fully
      independent scientists, with human oversight or human baselines remaining central.
    - Verification loops, self-critique, knowledge retrieval, and evidence auditing
      are repeated mechanism choices for reducing unchecked model output.
    - Evaluations increasingly use frozen data, automated judges, and peer-reviewed-study-derived
      tasks to make open-ended claims comparable.
    - Current systems can execute and document analyses competently, but they largely
      lack controls, robustness, falsifiability, and cross-domain generalization.
    - Literature review and synthesis automation is repeatedly identified as an unresolved
      challenge across system-building, benchmarking, and survey evidence.
    disagreements:
    - 'Evaluation target differs: one line scores generated paper quality with an
      LLM rubric, another scores empirical claim evidence maturity, another scores
      domain-specific biological discovery, and another aggregates general benchmark
      performance.'
    - 'Supervision and interaction differ: human-as-PI and agent-as-graduate-student
      collaboration contrasts with autonomous self-evolving pipelines and with blind
      evaluation of coding agents.'
    - 'Performance interpretation conflicts: some evidence reports highest LLM-rubric
      scores, while other evidence finds no statistically reliable separation among
      coding agents and documents multiple failure modes.'
    - 'Task scope differs: theory-driven mathematical derivation, open-ended peer-reviewed
      data analysis, single-cell omics, and general science benchmark tasks impose
      different notions of valid evidence.'
    open_questions:
    - Do LLM-judge and evidence-maturity scores predict human research utility or
      publication quality when independent expert review is missing from the evidence
      packet?
    - Can the observed gaps in controls, robustness, falsifiability, and cross-domain
      generalization be reduced by stronger verification loops, or are they inherent
      limits of a frozen base model?
    - How far do findings transfer beyond the limited systems, domains, and one successful
      pipeline attempt represented in this evidence?
    - What external validation standard would make autonomous literature synthesis
      and discovery claims trustworthy across different scientific tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带验证与知识检索的自主多智能体论文生成，如 ReasFlow
      解决的问题: 在推理密集领域完成文献综合、推导、实验和论文撰写，并在人类首席研究员监督下减少专家干预。
      尚未覆盖: 评测依赖 LLM 评审标准，缺少外部人工效度和局限性证据，跨领域可信性仍不确定。
    - 路线: 面向开放发现智能体的证据锚定评测，如 TruthInsightBench、BAISBench
      解决的问题: 用盲任务、冻结数据和同行评审研究衍生题比较智能体是否提供对照、稳健性、可证伪性与可审计性。
      尚未覆盖: 仅覆盖单个冻结基座模型或特定生物数据设置，跨基座模型和跨领域泛化尚未验证。
    - 路线: 自主研究流水线的失败案例与设计原则分析，如 Why LLMs Aren't Scientists Yet
      解决的问题: 识别实现漂移、记忆退化、过度乐观、领域智能不足和科学品味薄等失败模式，为稳健设计提供原则。
      尚未覆盖: 证据来自少量端到端机器学习研究尝试，无法说明哪些干预能在其他流水线或领域复现。
    - 路线: 自演化、领域无关的智能体框架，如 EvoMaster
      解决的问题: 通过假设优化、自我批判和知识积累提供可复用基础设施，降低不同学科构建自演化智能体的成本。
      尚未覆盖: 基准分数属于代理指标；缺少限制说明与跨硬件、数据集和用户设置的外部验证。
    - 路线: 智能体科学发现综述与分类，如 Agentic AI for Scientific Discovery 综述
      解决的问题: 按科学领域、能力、评测指标、框架、数据集和挑战组织进展，并系统列出文献综述自动化等问题。
      尚未覆盖: 分类主要是描述性的，没有直接验证这些分类能否预测系统行为或干预效果。
    共识:
    - 自主发现智能体仍被当作科研助理而非完全独立科学家，人工监督或人类基线仍是核心。
    - 验证循环、自批判、知识检索和证据审计是减少未受检输出的重复机制选择。
    - 评测趋向使用冻结数据、自动裁判和同行评审研究衍生任务，使开放式主张可比较。
    - 现有系统能执行并记录分析，但普遍缺少对照、稳健性、可证伪性和跨领域泛化。
    - 文献综述与综述合成自动化在这组证据中反复被列为核心未解挑战。
    分歧:
    - 评测目标不同：有的评生成论文质量，有的评实证主张的证据成熟度，有的评特定生物发现，有的聚合通用基准表现。
    - 监督交互不同：人工担任 PI 与代理担任研究生协作，对比自主自演化管道和盲评估编码代理，干预时机假设不同。
    - 性能解读冲突：一方报告 LLM 评分上的最高成绩，另一方发现编码代理间无统计显著差异并记录多种失败模式。
    - 任务范围不同：推理密集数学推导、开放式同行评审数据分析、单细胞组学和通用科学任务对有效证据的定义不同。
    开放问题:
    - 在证据包缺少独立专家人工验证的情况下，LLM 裁判和证据成熟度分数能否预测真实科研效用或发表质量？
    - 对照、稳健性、可证伪性和跨领域泛化缺口能否通过更强验证循环解决，还是受限于单一冻结基座模型？
    - 现有证据仅覆盖少量系统、领域和一次成功管道尝试，相关结论能否扩展到其他基座模型、数据集和科研设置？
    - 需要何种外部验证标准，才能使自动文献综合和发现声明在不同科研任务中具有可信性？
