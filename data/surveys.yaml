  related_work_outline:
  - 'Mainstream direction: autonomous research agents that close the loop from data,
    literature, and prior results to hypothesis generation, experiment execution,
    and traceable reporting.'
  - 'Shared research pattern: iterative evidence loops that generate candidate hypotheses,
    execute or verify them through code or benchmarks, and retain provenance for reliability.'
  - 'Key differences: interaction mode ranges from fully autonomous long-horizon runs
    to targeted human-in-the-loop oversight; exploration ranges from structured tree/evolutionary
    search to parallel iterative cycles.'
  - 'Trend evolution: available evidence concentrates in 2025-2026, shifting from
    broad surveys and taxonomies toward implemented systems and more difficult realistic
    benchmarks.'
  - 'Open questions: long-horizon factual accuracy, alignment of proxy benchmarks
    with real discovery value, optimal human intervention points, and reliable weak-direction
    rejection remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建闭环研究智能体，覆盖数据分析、文献搜索、假设生成、实验执行和可追溯报告，并加入可验证报告、结构化探索与人机监督。
  - 研究共性：围绕证据循环展开，从数据或文献生成候选假设，通过代码执行或基准评测验证，并保留来源和可靠性控制。
  - 关键差异：交互模式在完全自主与精准人机协作之间不同；搜索机制有树形/进化式与并行迭代之分；评测目标覆盖生物、方程、优化、预测等。
  - 趋势演进：证据集中于2025-2026年前沿，从综述分类走向可运行系统和更难的真实基准，可靠性、成本与人机边界更受关注。
  - 开放问题：长周期事实准确性、代理指标与真实发现效用对齐、最优人机干预点、弱方向拒绝和长期自主边界仍缺少证据。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous hypothesis-to-result pipelines
      what_it_solves: Turns an open-ended objective and dataset into iterative data
        analysis, literature search, hypothesis generation, and experiment execution,
        producing traceable reports.
      what_remains_open: Long-horizon accuracy and factuality are incomplete; reported
        statement accuracy is below full reliability, and scaling was tested only
        up to a bounded number of cycles.
    - line: Structured search and evolutionary research trajectories
      what_it_solves: Explores hypothesis, algorithm, or equation spaces through branching,
        backtracking, or evolutionary selection, yielding more controlled and inspectable
        research trajectories.
      what_remains_open: Scaling beyond tested combinatorial optimization, driving,
        or forecasting cases and isolating search gains from model or task-specific
        priors remain unresolved.
    - line: Human-AI collaboration and oversight protocols
      what_it_solves: Allocates human intervention to high-leverage decision points
        to improve reliability without requiring exhaustive step-by-step oversight.
      what_remains_open: Which decision points justify intervention and how autonomy
        boundaries generalize beyond the reported ablations lack systematic external
        validation.
    - line: Evaluation benchmarks and evidence design
      what_it_solves: Measures real-world research capabilities with realistic tasks
        and public evaluation harnesses, quantifying difficulty shifts across model
        generations.
      what_remains_open: The alignment between benchmark metrics and true discovery
        novelty, repeatability, or downstream utility is not established, and domain
        coverage remains limited.
    - line: Conceptual frameworks and capability surveys
      what_it_solves: Organizes autonomous research workflows, evaluation dimensions,
        and autonomy conditions into taxonomies that distinguish human-steered and
        AI-led research.
      what_remains_open: Whether the proposed categories predict actual model behavior
        or system failure modes has not been directly empirically validated.
    consensus:
    - Systems converge on iterative cycles of analysis, literature search, hypothesis
      generation, and experimental validation, with language agents writing or executing
      code to test hypotheses.
    - 'Evidence grounding and traceability are treated as core reliability mechanisms:
      reports or results should cite code, data, or prior literature, or pass deterministic
      authority checks.'
    - Evaluation relies on benchmark tasks and baseline comparison, but reported accuracy
      or benchmark performance still leaves residual error or untested edge cases.
    - 'Autonomy is viewed as domain-conditioned: credible in structured, executable,
      rapidly verifiable settings, while embodied, delayed, heterogeneous, or ethically
      accountable settings remain limited.'
    disagreements:
    - 'Interaction mode differs: some systems rely on long-horizon fully autonomous
      operation, while others show that targeted human collaboration at high-leverage
      points outperforms full autonomy or exhaustive oversight.'
    - 'Exploration mechanism differs: structured tree or evolutionary search uses
      branching and backtracking to control trajectory, whereas parallel iterative
      loops rely on large-scale agent rollouts and information sharing.'
    - 'Authority design differs: some separate cognition from deterministic program
      authority for source edits and promotion, while others depend on agent self-verification
      and traceable reporting to prevent fabricated outputs.'
    - 'Evaluation target differs: biology research benchmarks, scientific equation
      discovery, combinatorial optimization, and real-world forecasting cases are
      not directly comparable because they assess different research capabilities.'
    open_questions:
    - How do hypothesis quality and factual accuracy change beyond the tested number
      of cycles or agent rollouts? Existing evidence covers only bounded runs and
      specific benchmarks.
    - Do proxy research benchmarks such as ARC-Bench and LABBench2 correlate with
      real scientific discovery value, novelty, reproducibility, or downstream utility?
    - Under what conditions is human intervention necessary, and which decision points
      produce the largest reliability gain per unit of human effort?
    - Can systems reject weak directions early and avoid fabricated numbers or hallucinated
      citations in open, non-code-executable research environments?
    - How much of the reported improvement comes from hypothesis generation itself,
      versus task-specific priors, baselines, or execution and controller design?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主假设到结果流水线
      解决的问题: 将开放式目标和数据集转化为数据分析、文献搜索、假设生成和实验执行的迭代循环，形成可追溯报告。
      尚未覆盖: 长期准确性与事实性不完整，报告陈述准确率未达完全可靠，且扩展性仅在有限周期内得到验证。
    - 路线: 结构化搜索与进化式研究轨迹
      解决的问题: 通过分支、回溯或进化选择探索假设、算法或方程空间，获得更受控且可检查的研究轨迹。
      尚未覆盖: 在已测的组合优化、驾驶或预测案例之外的扩展性，以及搜索收益与模型或任务先验的分离仍未解决。
    - 路线: 人机协作与监督协议
      解决的问题: 将人类干预分配到高杠杆决策点，以在不进行逐步监督的情况下提高可靠性。
      尚未覆盖: 哪些决策点应引入干预，以及自主边界如何推广到已报告消融之外，缺少系统外部验证。
    - 路线: 评测基准与证据设计
      解决的问题: 用真实任务和公开评测工具测量真实研究能力，并量化不同模型间的难度差距。
      尚未覆盖: 基准指标与真实发现新颖性、可重复性或下游效用之间的对齐尚未建立，领域覆盖也有限。
    - 路线: 概念框架与能力综述
      解决的问题: 将自主研究工作流、评测维度和自主条件组织为分类体系，区分人类引导与AI主导的研究。
      尚未覆盖: 所提分类能否预测实际模型行为或系统失败模式，尚未得到直接实证验证。
    共识:
    - 系统普遍采用迭代循环：从数据、文献或先前结果中生成候选假设，通过代码执行或实验反馈验证，并输出可追溯结果。
    - 证据来源和可追溯性被视为核心可靠性机制，通常要求报告引用代码、数据或原始文献，或通过确定性权威检查。
    - 评测依赖基准任务和基线对比，但报告准确率或基准得分仍存在残差或未验证边界。
    - 自主性被视为领域条件化：在结构化、可执行、可快速验证的环境中更可信，在具身、延迟、异质或伦理负责的环境中仍受限制。
    分歧:
    - 交互模式不同：一些系统依赖长时间完全自主运行，另一些则显示在关键决策点引入精准人类协作优于完全自主或逐步监督。
    - 探索机制不同：结构化树或进化搜索用分支和回溯控制研究轨迹，而并行迭代循环依赖大规模智能体展开和信息共享。
    - 权威设计不同：部分系统将认知与确定性程序权威分开以控制代码编辑和晋升，部分系统依赖智能体自验证和可追溯报告防伪。
    - 评测目标不同：生物研究基准、科学方程发现、组合优化和真实预测案例评估不同能力，难以直接比较。
    开放问题:
    - 超出已测周期或智能体展开次数后，假设质量和事实准确性会如何变化？现有证据仅覆盖有限运行和特定基准。
    - ARC-Bench、LABBench2等代理基准是否与真实科学发现的新颖性、可重复性或下游效用相关？
    - 在什么条件下必须引入人类干预，哪些决策点能以最小人力成本获得最大可靠性提升？
    - 系统能否在开放、非代码可执行环境中可靠地拒绝弱方向并避免伪造数字或幻觉引用？
    - 性能提升中有多少来自假设生成本身，多少来自任务先验、基线或执行与控制器设计？
