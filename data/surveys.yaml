    - What minimal external validation, data and code availability, and limitation
      reporting should be required before autonomous research claims are trusted?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研智能体
      解决的问题: 把想法生成、代码执行、实验运行和论文写作整合到一个自动化工作流中，例如 The AI Scientist、AI Scientist-v2。
      尚未覆盖: 成功不稳定，提交论文只有部分通过评审，且主要验证到工作坊级别；跨领域和完整会议级可靠性仍未证实。
    - 路线: 任务套件与环境设计
      解决的问题: 通过结构化任务、基线和指标，如任务完成度、任务相关动作和可解释知识，使发现能力可比较，例如 DiscoveryWorld 与 BAISBench。
      尚未覆盖: 科学领域覆盖有限，任务指标与真实发现价值或下游决策效用之间的一致性尚未建立。
    - 路线: 验证与自我纠正
      解决的问题: 通过物理感知视觉门控、基于事实的报告或多假设失败归因减少静默失败和幻觉式结果，例如 SAGE、AI CFD Scientist。
      尚未覆盖: 验证门控仍会遗漏部分植入失败；自我纠正尚不能保证完全自主或会议级论文写作。
    - 路线: 多智能体与交互式研究平台
      解决的问题: 协调可定制角色、实时监控、工件检查、回滚或恢复控制以及本地代码集成，例如 Claw AI Lab。
      尚未覆盖: 评估依赖小型内部案例研究，缺乏跨硬件、数据集和用户设置的标准化外部验证。
    - 路线: 失败分析与设计原则
      解决的问题: 把多次自主研究尝试转化为失败模式和更可靠 AI 研究系统的设计原则。
      尚未覆盖: 所识别失败类别是否能跨领域预测系统行为，仍缺少直接实证验证。
    共识:
    - 自主科研系统的评估不仅看想法质量，还看是否产出可运行实验、含指标的结果和有效工件。
    - 当前AI科学家系统仍不够可靠，因此显式验证、评审或失败归因阶段越来越普遍。
    - 评估证据正在转向结构化任务、人类或专家基线、盲审或自动评审，而非单点演示。
    - 可复现性和外部效度记录不均衡；可见例子中开源工件常见，但跨设置验证仍有限。
    分歧:
    - 验证目标不同：一些系统检查渲染流场以确认物理有效性，另一些系统模拟稿件评审或将失败实验轨迹归因到根因。
    - 评估对象不同：完全论文接受或盲审分数、任务完成与可解释知识、领域特定的细胞注释与发现问答。
    - 交互与监督不同：完全自主循环、自我纠正循环、任务套件环境和交互式多智能体仪表板意味着不同的人工角色与信任程度。
    - 领域范围不同：部分系统专攻计算流体动力学或组学，另一些面向通用机器学习主题，因而泛化声明难以比较。
    开放问题:
    - 验证机制如何扩展到当前消融中特定物理或视觉案例之外的静默失败？
    - 任务完成度、自动评审分数和工件质量指标是否与真实科学贡献或下游科研效用一致？
    - 所记录的失败模式和自我纠正收益能否迁移到其他领域、更长周期和完整会议级贡献？
    - 在信任自主科研声明前，应建立哪些最低的外部验证、数据与代码可得性和局限性报告标准？
