  literature_review:
    line_of_work_matrix:
    - line: Editor-integrated multi-agent writing and review assistants
      what_it_solves: Coordinates drafting, in-editor review, and editing to reduce
        authoring friction and improve paper quality.
      what_remains_open: Human-expert agreement, effect on author learning, and whether
        generated edits preserve technical soundness beyond the editor context.
