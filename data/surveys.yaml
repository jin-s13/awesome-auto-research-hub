  - 主流方向：用多智能体LLM系统把研究构思、实验执行、验证和科学论文撰写连接成一条自动化流程。
  - 研究共性：生成结论在写入论文前会经过某种有效性门控、评审或人类介入，以降低幻觉和实验失败。
  - 关键差异：系统在自主程度、验证机制、领域专用性及成功判定证据上存在明显不同。
  - 趋势演进：在2024–2026前沿内，研究从通用自动论文生成转向领域感知验证、自纠正和精准人机协作。
