  related_work_outline_zh:
  - 主流方向：构建端到端LLM智能体流程，自动提出想法、执行代码或推导、分析结果并撰写论文，并加入验证或评审闭环。
  - 研究共性：将科学发现循环拆分为智能体角色或阶段，使用LLM评审、专家偏好、任务套件或同行评审结果进行评估；证据多来自窄案例。
