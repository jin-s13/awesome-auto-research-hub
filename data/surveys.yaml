  related_work_outline:
  - 'Mainstream direction: The evidence cluster is dominated by autonomous agentic
    research systems—exemplified by ReasFlow for generation and TruthInsightBench
    for evaluation—that fold literature synthesis, evidence assessment, and paper
    generation into end-to-end scientific workflows.'
  - 'Shared research pattern: Systems combine LLM agents, fixed rubrics or judges,
    and benchmark tasks; they emphasize execution and documentation, and use verification
    loops or self-critique to reduce human intervention.'
  - 'Key differences: Work splits between complete-paper generation systems, evidence-maturity
    benchmarks using blind tasks, domain-specific benchmarks with human baselines,
    failure-case analyses, and self-evolving agent infrastructure.'
  - 'Trend evolution: From 2025 surveys and domain benchmarks toward 2026 evidence-grounded
    evaluation, failure accountability, and scalable self-evolving frameworks; the
    span is too narrow to infer a longer arc.'
  - 'Open questions: Whether LLM-judge and benchmark scores align with real literature-review
    and discovery utility, and how to validate verification, reproducibility, base-model
    generality, and reliability beyond curated settings.'
  related_work_outline_zh:
  - 主流方向：证据簇以自主科研智能体系统为主，例如 ReasFlow 做生成、TruthInsightBench 做证据锚定评估，将文献综合、证据评估与论文生成纳入端到端科学工作流，而非孤立检索或引用工具。
  - 研究共性：系统普遍结合LLM智能体、固定评分标准或评判器与基准任务；强调执行和记录能力，并用验证循环或自批判减少人工干预。
  - 关键差异：工作分为生成完整论文的系统、基于盲任务审计证据成熟度的基准、带人类基线的领域基准、失败案例分析以及自演化智能体基础设施。
  - 趋势演进：从2025年的综述与领域基准，走向2026年的证据锚定评测、失败归因与可扩展自演化框架；时间跨度过窄，难以推断更长周期趋势。
  - 开放问题：LLM评委和基准分数是否与真实文献综述及发现效用一致；如何验证核查、可复现性、基座模型泛化性及设定外可靠性。
  literature_review:
    line_of_work_matrix:
    - line: Reasoning-centric multi-agent research synthesis
      what_it_solves: Turns minimal prompts into complete research papers by integrating
        literature synthesis, verification, knowledge retrieval, theorem proving,
        experiments, and manuscript preparation under a human principal investigator/agent
        student interaction mode.
      what_remains_open: Evaluation rests on a curated LLM-based review rubric with
        no external validation or disclosed limitations; reduction in expert intervention
        and cross-domain logical verification are not independently measured.
    - line: Evidence-grounded evaluation benchmarks
      what_it_solves: Compares open-ended discovery agents on blind tasks taken from
        peer-reviewed studies, giving only neutral objectives and frozen data, then
        scoring evidence maturity with fixed LLM judges across multiple dimensions.
      what_remains_open: Only one frozen base model is assessed; agents plateau and
        lack controls, robustness, falsifiability, and cross-dataset generalization,
        so the benchmark reveals a gap rather than demonstrated discovery.
    - line: Domain-specific AI scientist benchmarking
      what_it_solves: Evaluates AI scientists on real single-cell transcriptomic data
        for annotation and multiple-choice discovery questions derived from published
        studies, with graduate-level human baselines.
      what_remains_open: Current AI scientists still fall short of fully autonomous
        biological discovery; reported evidence focuses on potential rather than standardized
        cross-domain validation.
    - line: Survey and taxonomy of agentic scientific discovery
      what_it_solves: Organizes agentic systems by scientific domain and capability,
        catalogs evaluation metrics, implementation frameworks, and datasets, and
        identifies challenges such as literature review automation.
      what_remains_open: Literature review automation, system reliability, and ethical
        concerns remain unresolved; the taxonomy is not validated by direct behavioral
        prediction.
    - line: Failure analysis and design principles
      what_it_solves: Uses a six-agent pipeline to mirror the research workflow and
        documents recurring failure modes such as implementation drift, memory degradation,
        overexcitement, and weak scientific taste.
      what_remains_open: Only one of four end-to-end attempts completed the pipeline,
        so robust generalization and design-principle efficacy across tasks remain
        open.
    - line: Self-evolving domain-agnostic research agent infrastructure
      what_it_solves: Provides a foundational framework for agents to refine hypotheses,
        self-critique, and accumulate knowledge across experimental cycles, yielding
        benchmark score improvements over OpenClaw.
      what_remains_open: Benchmark gains are reported without limitations; artifacts
        and external validation are not visible, and score improvements do not isolate
        literature-intelligence or scientific-judgment gains.
    consensus:
    - Current systems can execute and document analyses, retrieve knowledge, and generate
      structured research content, but autonomous literature synthesis and scientific
      discovery are not yet reliable.
    - Evidence-grounded evaluation with blind tasks, frozen data, and fixed judges
      is treated as a stronger alternative to uncontrolled generation claims.
    - LLM-based rubrics and judges are common but remain proxy metrics; their alignment
      with human or real-world research utility is not established.
    - Verification, self-critique, and knowledge accumulation are recurring mechanisms
      intended to reduce human intervention.
    - Human baselines or human-in-the-loop roles are used to anchor performance, but
      sample sizes and calibration details are limited.
    disagreements:
    - 'Evaluation target differs: complete paper quality via curated LLM rubric versus
      evidence maturity on blind peer-reviewed tasks versus multiple-choice questions
      from published studies versus broad benchmark scores.'
    - 'Interaction mode differs: human principal investigator/agent student collaboration
      versus fully autonomous coding agents versus self-evolving domain-agnostic agents.'
    - 'Deployment setting differs: applied mathematics research papers, single-cell
      omics discovery, ML research attempts, and general science benchmarks.'
    - 'Supervision signal differs: some rely on internal verification loops, others
      on fixed LLM judges, others on human baselines or external benchmark scores.'
    - 'Reported evidence differs in what remains visible: some disclose failure modes
      or limitations, while several highlight high scores without limitation details
      or external artifacts.'
    open_questions:
    - Can LLM-judge scores on generated papers or blind tasks predict real literature-review
      quality, citation analysis, or research gap discovery utility?
    - How much of reported performance comes from the base model versus the agent
      scaffolding, given TruthInsightBench uses one frozen base model and ReasFlow/EvoMaster
      do not isolate this?
    - What verification and artifact-sharing standards would make autonomous literature
      synthesis externally reproducible across domains?
    - Which evidence-maturity dimensions are necessary for trustworthy claims, and
      can agents be improved on controls, robustness, falsifiability, and cross-dataset
      generalization?
    - How should human-in-the-loop calibration be designed when current failures include
      overexcitement, implementation drift, memory degradation, and weak scientific
      taste?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 以推理为中心的多智能体研究综合
      解决的问题: 将最小提示转化为完整研究论文，集成文献综合、验证、知识检索、定理证明、实验和手稿准备，采用人类首席研究员/智能体学生的交互模式。
      尚未覆盖: 评估依赖精心设计的基于LLM的评审标准，未披露外部验证或局限性；专家干预减少和跨领域逻辑验证未独立测量。
    - 路线: 证据锚定的评估基准
      解决的问题: 用来自同行评审研究的盲任务比较开放式发现智能体，仅给出中立目标和冻结数据，并用固定LLM评委从多个维度评估证据成熟度。
      尚未覆盖: 仅评估一个冻结基座模型；智能体表现趋同，缺乏对照、稳健性、可证伪性和跨数据集泛化，基准揭示差距而非展示发现能力。
    - 路线: 领域特定的AI科学家基准测试
      解决的问题: 在真实单细胞转录组数据上评估AI科学家的细胞注释和基于已发表研究的选择题发现能力，并提供研究生水平的人类基线。
      尚未覆盖: 当前AI科学家仍达不到完全自主的生物学发现；证据更强调潜力，而非标准化的跨领域验证。
    - 路线: 智能体科学发现的综述与分类
      解决的问题: 按科学领域和能力组织智能体系统，梳理评估指标、实现框架和数据集，并识别文献综述自动化等挑战。
      尚未覆盖: 文献综述自动化、系统可靠性和伦理问题仍未解决；分类未通过直接行为预测验证。
    - 路线: 失败分析与设计原则
      解决的问题: 用六智能体流水线模拟研究工作流，记录实现漂移、记忆退化、过度兴奋和科学品味薄弱等重复失败模式。
      尚未覆盖: 四次端到端尝试仅一次完成流水线，跨任务的稳健泛化和设计原则有效性仍未证明。
    - 路线: 自演化的领域无关研究智能体基础设施
      解决的问题: 提供基础框架，使智能体在实验周期中优化假设、自我批判并积累知识，相对OpenClaw取得基准分数提升。
      尚未覆盖: 报告基准提升但未披露局限性；工件和外部验证不可见，分数提升未隔离文献智能或科学判断能力的收益。
    共识:
    - 当前系统能执行并记录分析、检索知识并生成结构化研究内容，但自主文献综合和科学发现仍不可靠。
    - 带盲任务、冻结数据和固定评委的证据锚定评估被视为优于不受控生成主张的评估方式。
    - 基于LLM的评分标准和评委很常见，但仍是代理指标，与人类或真实研究效用的一致性尚未建立。
    - 验证、自批判和知识积累是减少人工干预的常见机制。
    - 使用人类基线或人类在环角色来锚定表现，但样本量和校准细节有限。
    分歧:
    - 评估目标不同：基于LLM评分标准的完整论文质量、盲任务证据成熟度、基于已发表研究的选择题、或广泛基准分数。
    - 交互模式不同：人类首席研究员/智能体学生协作、完全自主编码智能体、自演化领域无关智能体。
    - 部署场景不同：应用数学研究论文、单细胞组学发现、机器学习研究尝试和通用科学基准。
    - 监督信号不同：内部验证循环、固定LLM评委、人类基线或外部基准分数。
    - 可见证据不同：有些披露失败模式或局限性，有些只强调高分而缺少局限性细节或外部工件。
    开放问题:
    - LLM评委对生成论文或盲任务的评分能否预测真实文献综述质量、引文分析或研究缺口发现效用？
    - 在TruthInsightBench仅使用一个冻结基座模型、ReasFlow和EvoMaster未隔离基座模型贡献的情况下，报告性能有多少来自基座模型而非智能体脚手架？
    - 什么样的验证和工件共享标准能使自主文献综合在不同领域具备外部可复现性？
    - 哪些证据成熟度维度是可信主张所必需的，智能体能否在对照、稳健性、可证伪性和跨数据集泛化上得到改进？
    - 当当前失败包括过度兴奋、实现漂移、记忆退化和科学品味薄弱时，应如何设计人在环校准？
