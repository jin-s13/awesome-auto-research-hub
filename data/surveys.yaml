  related_work_outline_zh:
  - 主流方向：端到端自主研究智能体，将想法生成、代码执行、实验管理、论文写作与自动评审串联起来，并通过特定领域的有效性与证据锚定基准进行质量控制。
  - 研究共性：系统把科学发现分解成智能体阶段——假设或想法生成、实现与执行、分析与反思、写作或评测；普遍使用LLM评审、任务完成度或同行评审模拟来打分。
  - 关键差异：通用框架侧重论文产出与工作坊级录用，领域系统嵌入逻辑或物理感知验证，而基准工作衡量完整发现行为与证据成熟度而非生成论文。
  - 趋势演进：2024–2026年前沿从首个全自动ML发现框架与虚拟任务集，发展到智能体树搜索与同行评审接收，再到专业验证门控和盲测证据评估，暴露出智能体平台期。
  - 开放问题：自动评审与人类科学有效性的一致性、跨基座模型和领域泛化、验证门控可靠性、鲁棒性与可证伪性控制是否充足，以及基准提升能否转化为真实发现。
  literature_review:
    line_of_work_matrix:
    - line: Fully automated end-to-end discovery frameworks
      what_it_solves: Automates the complete research cycle from idea generation,
        code writing, experiment execution, visualization, and manuscript composition
        through simulated or workshop-level peer review, lowering per-paper cost and
        human intervention.
      what_remains_open: Consistency across multiple submissions and venues remains
        uncertain; workshop-level acceptance or automated review scores have not yet
        demonstrated equivalence to broader human scientific validity.
    - line: Domain-specific autonomous discovery with verification or knowledge gates
      what_it_solves: Embeds logical audit, physics-aware vision-language checks,
        domain knowledge retrieval, or compiled model modification into the discovery
        loop to catch silent failures and produce defensible claims in reasoning-heavy
        or physics-based fields.
      what_remains_open: Verification gates remain imperfect—one study reports missing
        2 of 16 planted silent failures—and the available evidence covers limited
        domains, tasks, metrics, and baselines, so cross-task reliability is not established.
    - line: Virtual environments for complete discovery cycles
      what_it_solves: Provides reproducible task suites and automatic metrics requiring
        agents to form hypotheses, design and run experiments, analyze results, and
        act on conclusions, enabling benchmarking beyond narrow coding tasks.
      what_remains_open: Strong baselines still struggle, but it is unclear whether
        gains reflect general discovery ability or environment-specific shortcuts;
        transfer from virtual task success to real scientific utility is unmeasured.
    - line: Evidence-grounded blind evaluation suites
      what_it_solves: Tests whether discovery agents can produce claims supported
        by frozen data under blind conditions, scoring evidentiary maturity rather
        than reproduction of a hidden target study.
      what_remains_open: Only one frozen base model is evaluated; current coding agents
        plateau and still lack sufficient controls, robustness, falsifiability, and
        cross-dataset generalization.
    consensus:
    - Scientific discovery is decomposed into agentic stages such as ideation, execution,
      analysis or reflection, and manuscript or claim generation.
    - Automated review or benchmark scoring is treated as necessary for scalable evaluation
      but is not yet validated as equivalent to human scientific judgment.
    - Current autonomous systems can execute and document analyses reasonably well,
      yet remain weak in controls, robustness, falsifiability, and cross-setting generalization.
    disagreements:
    - 'Evaluation target differs: generated paper quality and simulated review versus
      complete task completion in virtual environments versus blind evidentiary maturity
      of claims.'
    - 'Interaction mode differs: fully autonomous agents versus human principal investigator
      with agent executor versus environment-benchmarked coding agents.'
    - 'Verification strategy differs: logic or derivation audit versus vision-language
      physics gate versus automated LLM judge; some domains require modality-specific
      validity gates.'
    - 'Deployment scope differs: general machine learning paper generation versus
      theory-driven applied mathematics versus physics-based computational fluid dynamics
      versus simulated discovery environments.'
    open_questions:
    - Can automated reviewers or LLM judges detect the silent failures that domain-specific
      validity gates miss, and what minimal verification standard should be required
      before generated claims are considered trustworthy?
    - How far do results transfer across base models, scientific domains, and from
      simulated or benchmark tasks to real experimental or theoretical discovery?
    - Which components—search strategy, verification gate, base model capability,
      task prior, or environment design—account for observed improvements and current
      agent plateaus?
    - What evidence of controls, robustness, falsifiability, and novelty is necessary
      to distinguish autonomous scientific discovery from competent analysis or hidden-target
      reproduction?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自动发现框架
      解决的问题: 自动化从想法生成、代码与实验执行、可视化、论文写作到模拟或同行评审的完整研究循环，降低单篇论文成本与人工负担。
      尚未覆盖: 多次提交与不同会议场景下的一致性仍不确定；工作坊级接收或自动评审分数尚未证明等同于更广泛的人类科学有效性。
    - 路线: 嵌入门控的领域自主发现系统
      解决的问题: 在发现循环中嵌入逻辑审计、物理感知的视觉-语言检查、领域知识检索或模型编译修改，以捕捉静默失败并产出更可靠的结论。
      尚未覆盖: 验证门控仍不完美——有系统漏检16个植入失败中的2个；现有证据覆盖的领域、任务、指标与基线有限，跨任务可靠性尚未建立。
    - 路线: 虚拟科学发现任务环境
      解决的问题: 提供可复现任务与自动指标，要求智能体形成假设、设计并运行实验、分析结果并基于结论行动，从而支持超越狭窄编码任务的基准评测。
      尚未覆盖: 强基线仍普遍困难，但难以区分是通用发现能力不足还是环境特化捷径；从虚拟任务成功到真实科学效用的迁移未被测量。
    - 路线: 证据锚定的盲评基准
      解决的问题: 在盲条件下用冻结数据测试发现智能体能否产出有数据支撑的主张，评分证据成熟度而非复现隐藏目标研究。
      尚未覆盖: 仅在一个冻结基座模型上被评估；当前编码智能体得分停滞，仍缺乏充分的对照、稳健性、可证伪性和跨数据集泛化。
    共识:
    - 科学发现被分解为想法生成、执行、分析或反思、论文或主张生成等智能体阶段。
    - 自动评审或基准评分被视为可扩展评估的必要手段，但尚未验证等同于人类科学判断。
    - 当前自主系统能较熟练执行并记录分析，但在对照、稳健性、可证伪性和跨设置泛化方面仍然薄弱。
    分歧:
