  related_work_outline:
  - 'Mainstream direction: Building closed-loop autonomous research pipelines that
    propose hypotheses, execute or validate them, and self-correct, usually with human
    oversight at high-leverage points.'
  - 'Shared research pattern: Combining large-language-model agents with executable
    tools, structured debate or failure attribution, and verification gates to move
    from candidate ideas to evidence.'
  - 'Key differences: Validation ranges from physics-aware visual inspection and machine-checked
    proofs to executable reporting and benchmark-based comparison; systems also differ
    in autonomy, domain specificity, and human interaction mode.'
  - 'Trend evolution: Within a narrow 2025–2026 frontier, work moves from surveys
    and domain benchmarks toward self-improving frameworks, formal verification, physics-aware
    gates, and meta-benchmarks.'
  - 'Open questions: Verification gaps, idea-versus-execution attribution, generalization
    beyond curated settings, formalization-to-claim alignment, and evaluation designs
    for open-ended discovery value.'
  related_work_outline_zh:
  - 主流方向：构建闭环自主研究流水线，生成假设、执行或验证实验，并在高杠杆节点加入人类监督后自我纠正。
  - 研究共性：将大语言模型智能体与可执行工具、结构化辩论或失败归因、验证门控结合，从候选想法推进到可检验证据。
  - 关键差异：验证方式包括物理感知视觉检查、形式化证明、可执行报告和基准对比；系统在自主程度、领域通用性与人机交互模式上也有差异。
  - 趋势演进：在2025–2026较窄时间窗内，工作从综述和领域基准走向自改进框架、形式化验证、物理感知门控与元基准。
  - 开放问题：验证缺口、想法与执行的贡献归因、超出受控环境的泛化、形式化与科学含义对齐，以及开放式发现价值的评测设计。
  literature_review:
    line_of_work_matrix:
    - line: Hypothesis generation and search
      what_it_solves: Uses language-model reasoning, structured debate, and open-ended
        search to produce candidate hypotheses, research ideas, or experimental directions.
      what_remains_open: Generated hypotheses may be highly specific to the experiment
        scaffold, domain prior, or benchmark topic, so generalization remains unproven.
    - line: Verification, execution, and self-correction
      what_it_solves: Connects proposals to execution or proof so that failures can
        be detected, attributed, and routed back to hypothesis, design, or implementation.
      what_remains_open: Silent failures still slip through visual or reporting gates,
        and the quality of failure attribution is only partially tested.
    - line: Evaluation and benchmark design
      what_it_solves: Creates real-data tasks, baselines, and human performance references
        for comparing AI-driven discovery systems.
      what_remains_open: Open-ended discovery and downstream scientific utility are
        not fully captured by existing multiple-choice, annotation, or artifact-quality
        metrics.
    - line: Human–AI collaboration and system infrastructure
      what_it_solves: Turns isolated model ideas into runnable multi-agent workflows
        with dashboards, code harnesses, and intervention modes.
      what_remains_open: External validation is limited to few case studies or internal
        benchmarks, so repeatability across settings is uncertain.
    - line: Formalization and conceptual organization
      what_it_solves: Organizes claims and proofs into formal libraries, audits, surveys,
        or taxonomies to make research arguments inspectable and consistent.
      what_remains_open: Formal correctness does not guarantee that the artifact means
        what the paper claims, and category-based predictions lack direct empirical
        testing.
    consensus:
    - Credible autonomous research requires connecting idea generation to execution,
      verification, or formal checking rather than leaving hypotheses as untested
      text.
    - Verification gates, grounded reporting, self-correction, and human review are
      recurring safeguards against fabricated or invalid findings.
    - Human collaboration at high-leverage decision points can outperform both fully
      autonomous loops and exhaustive step-by-step oversight.
    - Current systems often demonstrate promise in specific domains or benchmarks
      but are not yet reliable fully autonomous scientific discoverers.
    - Evaluation should compare systems against baselines and human performance on
      real data tasks to support comparable evidence.
    disagreements:
    - 'Verification reflects different evidence traditions: physics-aware visual inspection,
      machine-checked formal proofs, and executable experiment reporting target different
      failure modes.'
    - Supervision and interaction range from autonomous pipelines to targeted human
      interventions, dashboards, and multiple collaboration modes.
    - Evaluation targets vary from domain-specific metrics such as CFD error or omics
      annotation, to broad benchmarks, to case-study expert preferences.
    - 'Generalization strategy differs: some systems are domain-agnostic foundational
      frameworks, while others build specialized domain libraries and solvers.'
    - Research artifact definitions differ, including model corrections, formal theorem
      libraries, benchmark answers, and paper-producing pipelines.
    open_questions:
    - How well do idea-generation agents transfer beyond their validation environments
      or curated benchmark topics?
    - What additional verification cues would catch silent failures that current gates
      miss?
    - How much of reported improvement comes from better hypothesis generation rather
      than better execution, search, or baseline scaffold?
    - Can machine-checked formalization be aligned with intended scientific claims
      without relying on human inspection?
    - Which evaluation designs measure open-ended discovery utility instead of only
      task success or artifact quality?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 假设生成与搜索
      解决的问题: 通过语言模型推理、结构化辩论或开放式搜索生成候选假设、研究问题或实验方向。
      尚未覆盖: 生成假设可能高度依赖实验脚手架、领域先验或基准主题，泛化性仍未被证明。
    - 路线: 验证、执行与自我纠正
      解决的问题: 将假设连接到执行或证明，使失败可被检测、归因，并路由回假设、设计或实现层面。
      尚未覆盖: 静默失败仍会通过视觉或报告门控，失败归因质量只得到部分测试。
    - 路线: 评测与基准设计
      解决的问题: 通过真实数据任务、基线和人类表现参考来比较AI驱动的发现系统。
      尚未覆盖: 现有选择题、注释或工件质量指标未能充分捕捉开放式发现和下游科研效用。
    - 路线: 人机协作与系统基础设施
      解决的问题: 将单点模型想法转化为可运行的多智能体工作流，包括仪表板、代码工具和干预模式。
      尚未覆盖: 外部验证仅限于少量案例或内部基准，跨环境可重复性仍不确定。
    - 路线: 形式化与概念组织
      解决的问题: 将主张和证明组织为形式库、审计、综述或分类，使研究论证可检查且一致。
      尚未覆盖: 形式正确性不保证工件与论文主张语义一致，基于分类的行为预测也缺少直接实证。
    共识:
    - 可信的自主研究需要把想法生成与执行、验证或形式化检查连接起来，而不是只生成未检验文本候选。
    - 验证门控、事实约束报告、自我纠正和人类审查是反复出现的防虚假结果机制。
    - 在高杠杆节点的人类协作可以同时优于完全自主和逐步监督。
    - 当前系统多在特定领域或基准中显示潜力，尚未成为稳定的完全自主科学发现系统。
    - 评测需要用基线、人类表现和真实数据任务进行对比，以形成可比较证据。
    分歧:
    - 验证方式反映不同证据传统：物理感知视觉检查、形式化机器证明与可执行实验报告关注不同失败模式。
    - 监督与交互从全自主流水线到仪表板、多种人类干预模式不等。
    - 评测目标不同，包括CFD误差或组学注释等领域指标、广域基准、案例研究和专家偏好。
    - 泛化策略不同：一些系统是领域无关基础框架，另一些构建专用领域库和求解器。
    - 研究产物定义不同，包括模型修正、形式定理库、基准答案和论文生成流水线。
    开放问题:
    - 想法生成智能体在其验证环境之外的泛化能力如何？
    - 哪些验证信号能够捕获当前门控遗漏的静默失败？
