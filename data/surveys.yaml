  - 主流方向：构建并评估由大语言模型驱动的自主科学发现智能体，研究重点从单纯生成想法转向证据质量、可复现性和领域有效性质控。
  - 研究共性：智能体提出假设、运行代码或实验、分析结果、记录结论，并通过任务完成度、物理有效性、自动评审或证据成熟度进行评分。
