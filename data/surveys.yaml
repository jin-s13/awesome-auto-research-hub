  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous manuscript generation pipelines
      what_it_solves: Converts ideation, code execution, result visualization, and
        paper composition into a runnable loop that yields full drafts for automated
        review or submission.
      what_remains_open: Acceptance remains inconsistent, and long-horizon memory
        degradation, implementation drift, and out-of-domain generalization are not
        systematically resolved.
    - line: Verification-before-writing domain-specific discovery agents
      what_it_solves: Adds logical, physics-aware, or reporting checks before manuscript
        claims are accepted, reducing false conclusions from derivation or simulation
        failures.
      what_remains_open: Verification gates can still miss silent failures outside
        their tested examples, and transfer to other scientific domains is underevidenced.
    - line: Human-AI collaborative research and verifiable reporting pipelines
      what_it_solves: Balances autonomous execution with targeted human intervention
        and prevents fabricated numbers or hallucinated citations through reporting
        constraints.
      what_remains_open: Evidence for high-leverage intervention points is mostly
        limited to ARC-Bench-style topic suites rather than independent multi-task
        or multi-user validation.
    - line: Self-correction and failure-attribution research agents
      what_it_solves: Diagnoses failed experiments through evidence-grounded hypotheses
        and routes corrections to hypothesis, experimental design, or implementation
        levels.
      what_remains_open: Attribution accuracy, coverage of failure modes, and stable
        production of conference-ready scientific writing remain uncertain.
    - line: Automated review and evaluation design for generated scientific writing
      what_it_solves: Provides scalable scoring through LLM reviewers, simulated peer
        review, workshop submission, or task benchmarks for generated papers.
      what_remains_open: Alignment between proxy review scores, benchmark metrics,
        and true scientific contribution is not yet established.
    consensus:
    - Verification and grounded reporting are treated as required stages between execution
      and writing rather than relying on text generation alone.
    - Complete paper generation is a common final test, but acceptance rates, benchmark
      scores, or domain metrics indicate only partial success.
    - Human oversight remains relevant even in highly autonomous systems, with ongoing
      disagreement about amount and timing rather than whether to include it.
    disagreements:
    - 'Autonomy level: some systems target fully automated submission and peer review,
      while others design multiple human intervention modes.'
    - 'Verification strategy: logical self-checking, vision-language physical validity
      checks, verifiable reporting, and multi-hypothesis failure attribution coexist.'
    - 'Evaluation target: workshop peer-review acceptance, ARC-Bench scores, blind
      benchmark scores, or domain-specific metrics such as wall Cf RMSE.'
    - 'Deployment setting: generic ML research loops differ from applied mathematics
      and computational fluid dynamics workflows.'
    open_questions:
    - How can verification gates reduce false negatives and false positives outside
      the exact silent failures used for testing?
    - 'Which evaluation signal best matches scientific utility: LLM rubric, blind
      benchmark score, peer review, or a combined criterion?'
    - When should humans intervene to improve generated papers without negating the
      scaling advantage of autonomous research?
    - How can long-horizon autonomous pipelines avoid memory degradation, implementation
      drift, and premature success claims?
    - Is workshop-level peer-review acceptance sufficient evidence of reliable research
      contribution for written output?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主论文生成流水线
      解决的问题: 把想法、代码执行、结果可视化和论文撰写连接成可运行流程，产出完整手稿并交由自动评分或评审判断。
      尚未覆盖: 评审接受仍不稳定；长程记忆退化、实现漂移和训练任务之外泛化缺少系统验证。
    - 路线: 验证先行的领域科学发现与写作代理
      解决的问题: 在论文生成前用逻辑、物理视觉或报告约束检查推导和仿真失误，减少错误结论进入手稿的概率。
      尚未覆盖: 验证门控在测试样本之外的静默失败漏检风险不明，跨科学领域迁移证据不足。
    - 路线: 人机协作研究与可验证报告流水线
      解决的问题: 在自主执行中引入人类决策点和报告约束，平衡自动化效率与科研可信度，抑制伪造数字和幻觉引用。
      尚未覆盖: 高杠杆干预点的证据主要来自 ARC-Bench 等限定基准，缺少跨任务、跨用户的独立验证。
    - 路线: 失败归因与自我纠正研究代理
      解决的问题: 对失败实验生成多个证据化原因并路由到假设、实验设计或实现层面，提升带有可计量结果的输出比例。
      尚未覆盖: 归因准确性和失败类型覆盖有限，能否稳定产出可发表论文仍不明确。
    - 路线: 生成论文的自动评审与评测设计
      解决的问题: 通过 LLM 评审、模拟同行评审、工作坊投稿或主题基准为生成论文提供可重复评分。
      尚未覆盖: 评审分数和代理指标与真实科学贡献之间的一致性尚未建立。
    共识:
    - 研究普遍把验证和基于事实的报告作为论文生成前的必要门控，而不是只依赖生成文本。
    - 完整论文生成是常见最终检验，但接受率、基准分数或领域指标仅表明部分成功。
    - 即使高度自主的系统也保留人类监督，争议主要在于监督数量和介入时机。
    分歧:
    - 自主程度：从完全自主投稿与评审到设计多种人类干预模式。
    - 验证策略：逻辑级自查、视觉-语言物理校验、可验证报告与多假设失败归因并存。
    - 评测目标：工作坊同行评审接受、ARC-Bench 分数、盲基准分数或壁面 Cf RMSE 等领域指标。
    - 部署场景：通用机器学习研究流程与应用数学、计算流体动力学等专业领域存在差异。
