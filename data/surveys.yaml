  - 主流方向：以端到端 LLM 智能体为核心，将构思、实验执行、分析和论文生成连成闭环，并逐步加入领域感知验证与证据基准。
  - 研究共性：多数系统把科学发现拆为生成、执行、验证、写作；评估依赖生成论文、任务完成或证据成熟度，并以 LLM 评审作为可扩展信号。
