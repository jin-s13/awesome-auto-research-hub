  related_work_outline:
  - 'Mainstream direction: The dominant direction is building and evaluating autonomous
    research agents that generate hypotheses, run experiments, modify code, and write
    manuscripts, with growing emphasis on evidence-grounded reliability rather than
    task success alone. Representative examples include end-to-end agents, blind discovery
    benchmarks, and validity-gated domain scientists.'
  - 'Shared research pattern: Most work converges on a closed-loop discovery pattern:
    an LLM/agent proposes ideas, executes code or experiments, analyzes outputs, and
    produces claims. A parallel evaluation pattern uses blinded tasks, fixed LLM judges
    or rubrics, human expert baselines, and artifact-level evidence checks to compare
    agents.'
  - 'Key differences: Work differs on evaluation target: open-ended agent output quality,
    discovery task completion, or evidential maturity of claims. Reliability mechanisms
    also differ: simulated review, vision-language physics gates, deterministic authority
    separation, or human reference baselines. Domain scope ranges from general ML
    to CFD, omics, and forecasting.'
  - 'Trend evolution: From 2024 general autonomous discovery frameworks to 2025/2026
    more specialized benchmarks and reliability controls. Recent work shifts from
    showing agents can write papers to auditing whether claims are defensible, reproducible,
    and supported under blind evidence.'
  - 'Open questions: Whether automated judges and proxy metrics predict real scientific
    value remains open. Reliability gates still miss planted failures. Cross-base-model
    generalization and cross-domain transfer are unproven. Governance and safety standards
    for autonomous research remain under-specified in this evidence.'
  related_work_outline_zh:
  - 主流方向：构建并评测能提出假设、跑实验、改代码并写论文的自主研究智能体，重点从完成论文转向证据可靠性和治理。
  - 研究共性：闭环发现流程：智能体提出想法、执行代码或实验、分析结果并形成主张；同时采用盲任务、固定LLM评委、人类专家基线和产出物证据检查。
  - 关键差异：评测目标不同（论文/评审接受、任务完成或证据成熟度）；可靠性机制不同（模拟评审、物理门控、确定性权威、人类参照）；领域范围从通用ML到CFD、组学和预测。
  - 趋势演进：2024年展示全自动论文生成，2025-2026转向专用基准与可靠性控制，关注主张是否可辩护、可复现并由证据支撑。
  - 开放问题：自动评审和代理指标是否对应真实科学价值；可靠性门控仍漏检；跨基座模型与跨领域泛化未证；自主研究治理规范在证据中不足。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous end-to-end research agent frameworks
      what_it_solves: Integrate ideation, code or experiment execution, visualization,
        writing, and review into a repeatable agentic pipeline for producing scientific
        claims.
      what_remains_open: Consistent pass rates, domain-specific validity beyond workshop
        and ML settings, and separation of agent reasoning from verification authority
        remain unresolved.
    - line: Blind evidence-grounded discovery benchmarks
      what_it_solves: Compare discovery agents on tasks where source conclusions are
        hidden, reducing memorization and evaluating whether claims are supported
        by frozen data.
      what_remains_open: Whether benchmark metrics and LLM judges align with peer
        review or real-world discovery utility; reported agent comparison rests on
        a single frozen base model.
    - line: Domain-specific virtual and experimental environments
      what_it_solves: Provide controlled task distributions, difficulty levels, and
        parametric variations for complete discovery cycles in domains such as CFD,
        omics, and virtual science.
      what_remains_open: Transfer to real laboratory or discovery settings, environment
        coverage, and metric validity beyond task completion remain unclear.
    - line: Reliability and validity gates for autonomous research
      what_it_solves: Catch silent failures, constrain source-edit boundaries, enforce
        canonical evaluation, or score evidential maturity in generated claims.
      what_remains_open: Gates still miss some planted failures; controls, robustness,
        falsifiability, and cross-dataset generalization remain weak.
    - line: Human-reference and expert-labeled evaluation design
      what_it_solves: Anchor AI scientist performance with graduate-level domain expert
        baselines and expert-labeled datasets for annotation and discovery questions.
      what_remains_open: Depends on available human experts and covers limited discovery
        tasks; open-ended discovery evaluation is still incomplete.
    consensus:
    - Autonomous research agents should be assessed on complete discovery cycles rather
      than isolated model predictions.
    - Automated evaluation requires evidence-grounded, artifact-based scoring rather
      than accepting generated narratives.
    - Current agents can execute and document analyses competently but do not yet
      autonomously produce trustworthy or defensible scientific claims.
    - Verification mechanisms, such as physics checks or deterministic authority,
      are necessary to catch silent failures and constrain unreliable agent edits.
    - Human or peer-review baselines remain important reference points for automated
      discovery assessment.
    disagreements:
    - 'Evaluation targets differ: some work evaluates overall paper or review acceptance,
      others task completion, and others evidential maturity of claims.'
    - 'Reliability mechanisms differ: simulated reviewer feedback, vision-language
      physical validity gates, deterministic program authority, and fixed LLM rubric
      judges make different assumptions about where failures occur.'
    - 'Representation and domain focus differ: general ML writing-and-review pipelines
      contrast with domain-specific environments in CFD, single-cell omics, and forecasting.'
    - 'Supervision signals differ: some rely on automated reviewers as selection signal,
      while others use human expert baselines or peer-reviewed source studies for
      ground truth.'
    - 'Deployment settings differ: from open-source agents in OpenFOAM or code repositories
      to text-based virtual environments and real omics datasets, changing reproducibility
      requirements.'
    open_questions:
    - Do automated reviewer scores and blind benchmark metrics predict real peer-review
      outcomes or downstream scientific utility?
    - Can reliability gates generalize beyond the specific base model, domain, and
      failure injection settings reported?
    - What combination of controls, robustness checks, falsifiability tests, and cross-dataset
      generalization is sufficient for trustworthy autonomous discovery?
    - How should governance and safety requirements be operationalized for agents
      that can modify code, run experiments, and generate papers without human review?
    - Are current domain-specific environments and human baselines sufficient to detect
      generalization failures across base models and task distributions?
