    with recent variants adding internal verification or reviewer feedback to filter
    invalid claims.'
  - 'Shared research pattern: Work converges on a hypothesis–execution–analysis–writing
    cycle; evaluation increasingly separates whether an agent can run the process
    from whether the resulting claims are defensible and evidence-grounded.'
  - 'Key differences: Systems split between generic open-ended ML discovery, domain-constrained
    agents such as applied mathematics or CFD, and evaluation-only environments/benchmarks;
    supervision modes and validity gates also differ.'
  - 'Trend evolution: In the supplied top-paper evidence, the work spans 2024–2026,
    moving from general automated scientists and discovery environments toward domain-specific
    verification-gated agents and stricter evidence-maturity evaluation.'
  - 'Open questions: Verification gates still miss silent failures; automated review
