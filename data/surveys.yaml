  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research generation
      what_it_solves: Integrates idea formation, code and experiment execution, result
        analysis, and manuscript drafting into one LLM-driven loop, as in The AI Scientist,
        AI Scientist-v2, and ReasFlow.
      what_remains_open: Success is uneven across domains and submissions; reliance
        on automated or rubric-based review remains; there is limited evidence of
        claims beyond the training or task distribution.
    - line: Domain-specific verifier-gated discovery
      what_it_solves: Adds field-specific validity checks or knowledge retrieval to
        catch logical or physical errors before claims are written, as in AI CFD Scientist
        and ReasFlow.
      what_remains_open: Silent failures can still pass gates; generalization beyond
        the tested physical or mathematical domain is not established; contribution
        from the verifier versus the base solver or model is unclear.
    - line: Benchmark environments and evidence-grade evaluation
      what_it_solves: Provides reusable tasks and metrics for comparing discovery
        agents, including simulated discovery challenges such as DISCOVERYWORLD and
        blind peer-study evidence tasks such as TruthInsightBench.
      what_remains_open: Current baseline agents plateau and lack discriminating scientific
        behaviors such as controls, robustness, and falsifiability; evaluations rest
        on one or few base models; proxy metrics may not match real scientific utility.
    consensus:
    - Autonomous scientific discovery requires coupling ideation, experimentation,
      analysis, and write-up rather than isolating a single stage.
    - Verification and review gates are necessary to turn fluent generated papers
      into defensible claims.
    - Automated benchmarking and rubric judges are emerging as the main scalable way
      to compare discovery agents.
    - Current systems execute and document analyses competently but still fall short
      of credible, controlled scientific discovery.
    disagreements:
    - 'Evaluation target: one line optimizes manuscript acceptance or review scores,
      another optimizes task completion in simulated discovery, and another scores
      evidence maturity from blind data.'
    - 'Verification mechanism: LLM-based review loops differ from vision-language
      physical validity gates and from rubric-based checks for controls, robustness,
      and falsifiability.'
    - 'Interaction mode: fully autonomous loops differ from human-as-principal-investigator
      collaboration with agents as graduate students.'
    - 'Domain adaptation strategy: general machine-learning research scaffolds contrast
      with systems embedding CFD or physics constraints and applied-math reasoning
      knowledge.'
    open_questions:
    - Which evidence and validation signals would make an agent's scientific claim
      independently trustworthy across domains?
    - How much of observed performance is caused by the agent loop rather than the
      base model, solver, or task prior?
    - Can LLM-based reviewers or rubric judges remain aligned with human peer review
      as agents adapt and exploit scoring patterns?
    - Do current reported successes indicate novel discovery or mostly competent reproduction
      and recombination of existing patterns?
