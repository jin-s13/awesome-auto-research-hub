    - 路线: 可验证执行与可复现研究基础设施
      解决的问题: 将开放推理与确定性源码控制、规范评估、晋升决策和可追溯报告分离，以减少伪造结果。
      尚未覆盖: 跨硬件、数据集、机构和用户设置的外部验证仍缺失或未在证据包中体现。
    - 路线: 自主性与工作流条件的概念分类
      解决的问题: 将研究自动化组织为工作流阶段、自主性谱系以及新颖性、有效性、可靠性、来源等评估维度。
      尚未覆盖: 这些概念类别是否能预测实际系统行为或失败模式尚未经过实证验证。
