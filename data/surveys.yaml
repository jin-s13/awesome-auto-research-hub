  - 主流方向：端到端自主研究写作系统，整合想法生成、实验执行、验证和论文草稿，并越来越多强调验证与自我纠正。
  - 研究共性：系统把科学写作流程分解为计划、执行、评测和草稿阶段，并加入自动评审或验证回路，在提交前捕捉无效主张。
  - 关键差异：交互模式从完全自主到有针对性的人机协作，验证机制从逻辑审计到物理感知闸门，评测目标从工作坊同行评审到基准成功率。
  - 趋势演进：2024-2026年前沿由通用自动发现框架，演进到智能体树搜索及首个工作坊接收，再到领域专用智能体和强调事实报告与监督的自我纠正流程。
