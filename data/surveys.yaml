    task completion.'
  - 'Open questions: how to validate the scientific correctness of automatically generated
    claims beyond shallow metrics, transfer failure knowledge across disciplines,
    and extend automation from code-only experiments to real-world laboratories.'
  related_work_outline_zh:
  - 主流方向：构建端到端或多智能体系统，自动化完整研究周期（想法生成、编码、实验、写作），并强调验证循环与迭代改进，如 AI Scientist、ReasFlow
    和 Claw AI Lab。
  - 研究共性：将科学发现分解为假设、实验、分析、报告等模块化步骤，由基于 LLM 的智能体编排，通常包含模拟评审、共享记忆或树搜索以提升输出质量。
  - 关键差异：系统在自动化程度（全自动 vs. 人机协作）、领域聚焦（ML 代码实验 vs. 理论数学）和评估严格性（LLM 评分 vs. 同行评审 vs. 基准任务）上不同。
  - 趋势演进：从 2024 年的单智能体框架，发展到 2025–2026 年的多智能体、失败感知和树搜索方法，同时涌现出 DISCOVERYWORLD、AblationBench
    等基准，用于衡量超越简单任务完成的智能体能力。
  - 开放问题：如何超越浅层指标验证自动生成声明的科学正确性，如何在学科间迁移失败知识，以及如何将自动化从纯代码实验扩展到真实世界实验室。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery frameworks
      what_it_solves: Fully automate the research pipeline from idea generation through
        experiment and paper writing, reducing per-study cost and human effort.
      what_remains_open: Output quality is inconsistent and often below high-impact
        conference standards; validation is limited to ML subfields and code-based
        experiments, with no evidence of wet-lab or theory-heavy domains.
    - line: Multi-agent collaboration and verification systems
      what_it_solves: Improve logical coherence and error correction by dividing labor
        among specialized agents (e.g., verification, writing, experiment management)
        and incorporating human-in-the-loop oversight.
      what_remains_open: Platform maturity is early; evaluations are confined to internal
        case studies, and it is unclear whether such systems scale to novel, high-stakes
        scientific problems.
    - line: Failure-aware memory and knowledge management
      what_it_solves: Reduce token waste and avoid repeating failed experiment paths
        by storing typed negative examples in a shared knowledge bank that agents
        can adopt or reject.
      what_remains_open: Limited to a small set of PDE tasks; the representation of
        negative knowledge may not capture the complexity of failure in other disciplines,
        and transfer across tasks is not yet robust.
    - line: Benchmarks for experiment planning and discovery
      what_it_solves: Provide standardized tasks and metrics to evaluate an agent's
        ability to design ablations, troubleshoot experiments, and derive knowledge
        from simulated environments.
      what_remains_open: Current benchmarks reveal a large gap with human performance,
        and proxy metrics may not correlate with real scientific impact; task coverage
        is narrow relative to the breadth of scientific experimentation.
    consensus:
    - Automated experiment systems uniformly adopt a modular pipeline that separates
      hypothesis, experiment, analysis, and writing, with a verification or review
      step to filter low-quality outputs.
    - LLM-based agents alone are insufficient for complex scientific reasoning; additional
      mechanisms such as tree search, shared memory, or human feedback are needed
      to raise performance.
    - Benchmarks and automatic evaluation are essential for measuring progress, yet
      existing metrics do not capture the long-term scientific value of generated
      work.
    - Failure information is a valuable resource that should be explicitly modeled
      rather than discarded, as it improves efficiency and task success rate.
    disagreements:
    - 'The role of human oversight: some systems target full autonomy (The AI Scientist),
      while others frame the human as a principal investigator guiding a graduate
      student-like agent (ReasFlow, Claw AI Lab).'
    - 'Domain specialization: most works focus on ML coding experiments, but ReasFlow
      and Negative Knowledge target theoretical math and PDEs, implying different
      assumptions about the form of experiments and validation.'
    - 'Evaluation standards: benchmarks like DISCOVERYWORLD and AblationBench use
      task completion metrics, whereas AI Scientist-v2 relies on real workshop peer
      review, making cross-system comparison difficult.'
    - 'Interaction mode: end-to-end pipelines operate batch-style, while Claw AI Lab
      offers an interactive dashboard with real-time monitoring and rollback, suggesting
      different deployment scenarios.'
    open_questions:
    - Can automated experiment systems generate valid scientific contributions outside
      of code-based ML, such as in biology or chemistry, where physical experiments
      are required?
    - What representation of failure knowledge is sufficient to transfer across tasks,
      and how can it be integrated without overwhelming the agent's context?
    - How can we design evaluation that measures the novelty and reproducibility of
      generated research, rather than just surface-level similarity to human papers?
    - To what extent does the internal verification loop in current systems detect
      subtle logical errors that would be caught by expert human reviewers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现框架
      解决的问题: 全自动完成从想法生成到实验和论文撰写的科研流程，降低单次研究成本和人力投入。
      尚未覆盖: 输出质量不稳定，常低于高影响力会议标准；验证仅限于 ML 子领域和代码实验，缺乏湿实验或理论密集型领域的证据。
    - 路线: 多智能体协作与验证系统
      解决的问题: 通过分工协作（验证、写作、实验管理）和引入人机回环，提升逻辑连贯性和错误纠正能力。
      尚未覆盖: 平台成熟度低，评估局限于内部案例，尚不清楚在全新、高风险的科研问题上是否可扩展。
    - 路线: 失败感知记忆与知识管理
      解决的问题: 通过将失败尝试存储为有类型的负知识记录，供智能体采纳或拒绝，减少重复失败和 token 消耗。
      尚未覆盖: 仅在一组 PDE 任务上验证，负知识表示可能无法捕捉其他学科中失败的复杂性，任务间迁移尚未稳健。
    - 路线: 实验规划与发现基准
      解决的问题: 提供标准化任务和指标，衡量智能体设计消融、排查实验和从模拟环境中提取知识的能力。
      尚未覆盖: 当前基准揭示与人类水平的巨大差距，代理指标与真实科学影响的相关性未知，任务覆盖范围相对于科学实验的广度较窄。
    共识:
    - 自动化实验系统普遍采用将假设、实验、分析和写作分离的模块化流程，并加入验证或评审步骤以过滤低质量输出。
    - 仅靠 LLM 智能体不足以完成复杂科学推理，需要树搜索、共享记忆或人类反馈等额外机制来提升性能。
    - 基准和自动评估对衡量进展至关重要，但现有指标无法反映生成工作的长期科学价值。
    - 失败信息是一种宝贵资源，应被显式建模而非丢弃，因为它能提升效率和任务成功率。
    分歧:
    - 人类监督的角色：部分系统追求全自主（AI Scientist），另一些则将人类定位为引导智能体的首席研究员（ReasFlow、Claw AI Lab）。
    - 领域专业化：多数工作聚焦 ML 编码实验，而 ReasFlow 和 Negative Knowledge 针对理论数学和 PDE，隐含对实验形式和验证方式的不同假设。
    - 评估标准：DISCOVERYWORLD 和 AblationBench 采用任务完成指标，而 AI Scientist-v2 依赖真实工作坊同行评审，导致跨系统比较困难。
    - 交互模式：端到端流程以批处理方式运行，而 Claw AI Lab 提供交互式仪表板，支持实时监控和回滚，指向不同的部署场景。
    开放问题:
    - 自动化实验系统能否在需要物理实验的学科（如生物、化学）中产生有效的科学贡献？
    - 何种失败知识表示足以跨任务迁移，且能整合而不超出智能体的上下文窗口？
    - 如何设计评估以衡量生成研究的新颖性和可复现性，而非仅与人类论文的表面相似度？
    - 当前系统的内部验证循环能在多大程度上检测出人类专家审稿人会发现的那种微妙逻辑错误？
