  related_work_outline_zh:
  - 主流方向：构建端到端的自主研究智能体，覆盖想法生成、代码或实验执行、分析和论文撰写；重点逐渐转向验证门控与基于证据的评测，而非仅用LLM评审。
  - 研究共性：系统将科学发现分解为智能体工作流，使用LLM评审或视觉/物理门控过滤无效输出，并通过生成论文、同行评审或基准任务完成度来验证。
