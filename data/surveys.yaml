  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery systems
      what_it_solves: Converting a research prompt into a closed loop of idea generation,
        code or derivation execution, experiment running, visualization, and manuscript
        writing.
      what_remains_open: Consistency across multiple runs and domains, especially
        when only a subset of generated papers passes peer review, and limited reporting
        of limitations or artifacts.
    - line: Virtual evaluation environments and benchmark testbeds
      what_it_solves: Providing reproducible tasks, parametric variations, and automatic
        metrics for hypothesis formation, experiment design, execution, and analysis.
      what_remains_open: Whether completion metrics and explanatory-knowledge scores
        align with real-world scientific discovery quality beyond the simulated tasks.
    - line: Failure-aware memory and feedback mechanisms
      what_it_solves: Storing failed attempts or reviewer/simulation feedback as reusable
        signals to guide later experiments while reducing token cost.
      what_remains_open: Cross-task transfer, adoption/rejection reliability, and
        whether negative knowledge remains useful without becoming stale or overly
        restrictive.
    - line: Interactive multi-agent experiment platforms
      what_it_solves: Providing customizable roles, real-time monitoring, rollback/resume
        control, and code harnesses so human operators can inspect and steer agent-run
        experiments.
      what_remains_open: Generalizability beyond small internal case studies; platform
        maturity and external validation across datasets, hardware, and user settings.
    - line: In-the-wild frontier-agent evaluation
      what_it_solves: Measuring whether frontier coding agents can improve published
        best models across many scientific machine learning benchmarks without controlled
        task simplifications.
      what_remains_open: Detecting novelty miscalibration and resource under-utilization;
        separating machine-learning engineering tricks from research-level domain
        insight.
    consensus:
    - Autonomous experimentation is framed as a multi-stage loop spanning hypothesis
      or idea generation, experiment execution, analysis, and report or manuscript
      creation.
    - Internal verification, reviewer feedback, memory, or monitoring improves iterative
      workflows over one-shot generation.
    - Automated evaluation signals are widely used, but they are validated against
      human or peer review only in limited settings.
    - Strong performance on prior environments does not transfer to novel scientific
      discovery tasks, motivating dedicated evaluation environments.
    disagreements:
    - 'Evaluation target differs: generated paper quality, virtual task completion,
      improvement over published best models, or expert preference for platform workflows.'
    - 'Success criterion differs: LLM rubric scores or simulated review, actual workshop
      peer acceptance, mean relative benchmark improvement, or AI expert judgment.'
    - 'Automation mode differs: fully autonomous manuscript generation, interactive
      human-in-the-loop dashboards, plug-in skill augmentation, or shared failure
      memory as a separate layer.'
    - 'Deployment scope differs: applied mathematics derivation and paper generation,
      machine learning code experiments, virtual micro-discovery tasks, or broad scientific
      machine learning benchmark sweeps.'
    open_questions:
    - How can evaluation separate machine-learning engineering trick gains from research-level
      domain insight when frontier agents improve benchmarks?
    - Can end-to-end systems achieve stable peer-review acceptance beyond isolated
      workshop-level successes?
    - Do failure-aware memories transfer across task families without reinforcing
      irrelevant or stale failures?
    - What external reproducibility evidence is missing for systems that report strong
      results but no public code, dataset, baseline, or limitation details?
