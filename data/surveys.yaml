  related_work_outline_zh:
  - 主流方向：构建端到端自主科研智能体，将想法生成、实验执行、分析、论文写作和自动评审整合为闭环，并逐步加入领域验证和证据评测。
  - 研究共性：将科学发现分解为多步智能体流程，用自动评审分数或任务/领域/证据指标评估，人类从执行者转为监督者。
  - 关键差异：评测目标覆盖生成论文分数、任务完成度、物理误差降低和证据成熟度；验证机制从通用LLM评审到领域物理/推理门控不一。
  - 趋势演进：2024年提出通用发现框架与虚拟环境；2025年出现树搜索和首个工作坊评审通过；2026年转向领域感知系统和更严格的证据评测。
  - 开放问题：自动评审是否反映科学质量，智能体是否真正发现而非复现，跨基座/领域泛化，最低证据标准，以及验证门控校准。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agent frameworks
      what_it_solves: Integrates ideation, code execution, experiments, visualization,
        analysis, and manuscript drafting into a continuous agentic loop, reducing
        manual execution and writing effort.
      what_remains_open: Pass rates are inconsistent, and there is limited evidence
        that automated reviewer scores translate to robust scientific quality; some
        visible records omit limitation details.
    - line: Domain-aware verification and validation gates
      what_it_solves: Adds physics- or reasoning-specific checks that detect invalid
        intermediate outputs before they are accepted or written up, aiming to reduce
        silent failures in specialized discovery workflows.
      what_remains_open: Gates still miss some planted silent failures and are validated
        on narrow domain tasks, so cross-domain transfer and error calibration remain
        unproven.
    - line: Benchmark environments for scientific discovery
      what_it_solves: Provides repeatable task suites and automatic metrics for full
        discovery cycles, enabling comparison without relying on subjective paper
        appraisals.
      what_remains_open: Strong baselines still struggle, and the relationship between
        task completion metrics and real open-ended scientific utility is not established.
    - line: Evidence-grounded evaluation of discovery claims
      what_it_solves: Evaluates the evidentiary maturity of agent-generated claims
        through blind tasks and fixed LLM judges across dimensions such as controls,
        robustness, and falsifiability.
      what_remains_open: Results are reported for a single frozen base model; agents
        plateau with no reliable pairwise separation and still lack key discriminating
        scientific behaviors.
    - line: Automated review and iterative manuscript refinement
      what_it_solves: Uses simulated reviewers or vision-language feedback loops to
        score generated papers and guide revisions, lowering review cost and providing
        iterative signal.
      what_remains_open: Peer-review acceptance is workshop-level and partial; automated
        review does not yet fully substitute for human evaluation or conference-level
        validation.
    consensus:
    - Scientific discovery is operationalized as a multi-step loop spanning hypothesis
      formation, experiment design and execution, analysis, visualization, and manuscript
      writing.
    - Automated evaluation is treated as central, whether through simulated peer review,
      task metrics, domain metrics, or evidence-maturity scoring.
    - Current systems produce plausible artifacts and perform some analysis competently
      but remain short of reliable autonomous discovery.
    - Human roles are shifting from direct execution toward oversight, validation,
      and final judgment.
    disagreements:
    - 'Evaluation target differs: generated-paper acceptance scores, task completion
      and explanatory knowledge, domain-specific physical error reduction, and evidence
      maturity are used as success criteria.'
    - 'Verification strategy differs: some rely on general automated reviewers, while
      others impose domain-specific physics or reasoning gates or blind evidence judges.'
    - Operational scope differs across general machine-learning workflows, applied
      mathematics reasoning, and computational fluid dynamics systems.
    - 'Capability claims differ: one system reports a workshop peer-review pass, another
      reports a physical metric improvement, while evaluations show coding agents
      plateau on discovery evidence.'
    open_questions:
    - Do LLM-based reviewers and judges measure scientific quality or only surface
      plausibility and formatting?
    - Can these agents distinguish novel discovery from reproduction or known parameter-space
      search when source conclusions are withheld?
    - How do performance and evidence quality generalize across base models, scientific
      domains, datasets, and hardware settings?
    - What minimum evidence standards for controls, robustness, falsifiability, and
      cross-dataset generalization should be required before accepting agent claims?
    - How should domain-specific verification gates be calibrated and audited, given
      evidence that they miss some silent failures?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研智能体框架
      解决的问题: 将假设生成、代码执行、实验、可视化、分析和论文撰写整合为连续智能体闭环，降低人工执行与写作成本。
      尚未覆盖: 通过率不稳定，自动评审分数能否迁移为可靠科学质量仍缺证据；部分条目缺少限制说明。
    - 路线: 领域感知验证与有效性门控
      解决的问题: 在物理或推理等专业工作流中加入检查，提前拦截无效中间结果，减少静默失败进入最终结论。
      尚未覆盖: 门控仍会漏掉部分植入静默失败，且只在窄领域任务上验证；跨领域迁移和误差校准未被证明。
    - 路线: 科学发现基准环境
      解决的问题: 提供可重复任务集和自动指标，覆盖完整发现周期，避免只依赖主观论文评价。
