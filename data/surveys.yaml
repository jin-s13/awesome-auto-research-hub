      尚未覆盖: 输出质量不稳定，仅三篇提交手稿中一篇通过同行评审；验证仍停留在工作坊或评分表层面，缺乏广泛外部验证。
    - 路线: 带有有效性门控的领域专用发现
      解决的问题: 通过内部逻辑审计、知识检索、自我改进或视觉-语言物理检查，把自主科研扩展到理论密集或物理约束场景。
      尚未覆盖: 门控并不完整；一个视觉-语言门控漏掉了16个植入静默失败中的2个，且这些机制的跨领域迁移尚未证实。
    - 路线: 评测环境与证据锚定基准
      解决的问题: 通过受控任务、完成度指标、领域覆盖和基于评分表的证据成熟度评分，使开放式发现可度量。
