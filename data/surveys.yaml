  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research generation pipelines
      what_it_solves: Combining idea generation, code execution, experiment management,
        visualization, and paper writing into an agentic loop.
      what_remains_open: Reliability across runs and venues; validation often rests
        on automated reviewers or narrow workshop acceptance.
    - line: Domain-specific verification-gated discovery systems
      what_it_solves: Embedding physics- or logic-aware checks so invalid results
        are caught before they become claims or manuscripts.
      what_remains_open: Verification misses some planted failures and remains unproven
        across broader domains, metrics, and external reviewers.
    - line: Benchmarks for complete scientific discovery and evidence maturity
      what_it_solves: Turning discovery into repeatable tasks with completion, action,
        explanatory-knowledge, or evidence-rubric metrics.
      what_remains_open: Transfer from simulated or frozen-data tasks to real scientific
        utility and cross-base-model generalization is not established.
    - line: Multi-agent reasoning-centric systems with knowledge retrieval
      what_it_solves: Supporting theory-heavy workflows such as theorem proving and
        literature synthesis through human-PI agent collaboration and internal review.
      what_remains_open: Evaluated under LLM rubrics and open-access baselines; no
        external limitation or reproducibility evidence is reported.
    consensus:
    - End-to-end LLM agents now cover ideation, experiment execution, analysis, and
      manuscript writing.
    - Verification, reviewer feedback, or benchmark scoring is treated as necessary
      to catch invalid or non-defensible claims.
    - Current systems execute documented work competently but lack controls, robustness,
      falsifiability, and cross-domain generalization.
    - Comparable tasks and rubrics are emerging because single demonstrative papers
      do not establish general discovery ability.
    disagreements:
    - 'Validation target differs: paper acceptance or reviewer score versus task completion
      and explanatory knowledge versus evidence maturity of data-supported claims.'
    - 'Verification mechanism differs: LLM rubrics or simulated review versus domain-specific
      logical verification versus physics-aware vision-language gates.'
    - 'Scope differs: general ML subfields versus applied mathematics versus computational
      fluid dynamics versus multi-domain simulated environments.'
    - 'Interaction mode differs: fully automated pipelines versus human-principal-investigator
      multi-agent collaboration versus frozen-data benchmark tasks.'
    - 'Success evidence differs: cost and acceptance threshold, 7.89% wall Cf RMSE
      improvement, silent-failure detection, or statistically indistinguishable agent
      scores.'
    open_questions:
    - How well do current verification gates and LLM judges generalize beyond their
      tested domains, failure modes, and base models?
    - 'Which evaluation target best predicts real scientific utility: accepted papers,
      task completion, explanatory knowledge, or evidence maturity?'
    - Can discovery agents move from competent analysis to claims with adequate controls,
      robustness, falsifiability, and cross-dataset generalization?
    - What external human validation and reproducibility standards should replace
      or complement automated review in AI scientist systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究生成流水线
      解决的问题: 把想法生成、代码执行、实验管理、可视化和论文写作整合到智能体闭环中。
      尚未覆盖: 跨运行和跨会议的可靠性；验证常依赖自动评审或较窄的工作坊接受结果。
    - 路线: 领域专用验证门控发现系统
      解决的问题: 嵌入物理或逻辑感知检查，在无效结果成为声明或论文前捕获错误。
      尚未覆盖: 验证门控仍会漏掉部分植入失败，跨领域、跨指标和外部评审的泛化未证实。
    - 路线: 完整科学发现与证据成熟度基准
      解决的问题: 用可重复任务和完成度、动作、解释性知识或证据评分指标衡量发现能力。
      尚未覆盖: 从模拟或冻结数据任务到真实科学效用的迁移，以及跨基座模型泛化尚未建立。
    - 路线: 基于知识检索的推理型多智能体系统
      解决的问题: 通过人机 PI-研究生协作与内部复核，支撑定理证明、文献综合等理论密集型工作。
      尚未覆盖: 仅在 LLM 评分和开放基线上评估，缺少外部局限性和可复现性证据。
    共识:
    - 端到端 LLM 智能体已覆盖想法生成、实验执行、分析和论文写作。
    - 验证、评审反馈或基准评分被视为捕获无效或不可辩护声明的必要环节。
    - 当前系统能胜任有记录的分析执行，但缺乏对照、稳健性、可证伪性和跨领域泛化。
    - 可比较任务和评分量规正在出现，因为单个示范性论文不足以证明通用发现能力。
    分歧:
    - 验证目标不同：论文接受或评审分数，对比任务完成度与解释性知识，对比数据声明证据成熟度。
    - 验证机制不同：LLM 量规或模拟评审，对比领域专用逻辑验证，对比物理感知视觉-语言门控。
    - 领域范围不同：通用 ML 子领域，对比应用数学，对比计算流体动力学，对比多领域模拟环境。
    - 交互模式不同：全自动流水线，对比人类 PI 多智能体协作，对比冻结数据基准任务。
    - 成功证据不同：成本与接受阈值、7.89% 壁面 Cf RMSE 改进、静默失败检测，或智能体间无统计显著差异。
    开放问题:
    - 当前验证门控与 LLM 评判器在测试领域、失败模式和基座模型之外泛化如何？
    - 哪种评测目标最能预测真实科学效用：被接受论文、任务完成、解释性知识还是证据成熟度？
    - 发现智能体能否从能胜任分析转向具备充分对照、稳健性、可证伪性和跨数据集泛化的声明？
    - 需要哪些外部人工验证和可复现标准来补充或替代 AI 科学家系统中的自动评审？
