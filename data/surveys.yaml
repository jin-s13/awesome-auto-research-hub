  related_work_outline:
  - 'Mainstream direction: Agentic AI for scientific discovery, especially autonomous
    research agents (e.g., ReasFlow, EvoMaster) that retrieve knowledge, synthesize
    literature, perform analysis, and generate papers, paired with evidence-focused
    benchmarks (e.g., TruthInsightBench, BAISBench).'
  - 'Shared research pattern: Work centers on whether generated claims are supported
    by data, using frozen data, blind tasks, or rubrics; systems commonly combine
    knowledge retrieval, verification loops, self-critique, and document or paper
    generation within multi-agent or evolving workflows.'
  - 'Key differences: Contributions split between building end-to-end agent systems
    or frameworks and creating evaluation benchmarks; domains range from applied mathematics
    to single-cell omics to general ML; evaluation targets include LLM-judge rubric
    scores, human baselines, benchmark tasks, and peer review acceptance.'
  - 'Trend evolution: Within the visible 2023-2026 frontier, evidence concentrates
    in 2025-2026, moving from domain benchmarks and surveys that identify gaps toward
    blind evidence-grounded benchmarks, self-evolving frameworks, and failure-case
    studies emphasizing reliability, falsifiability, and systematic failure analysis.'
  - 'Open questions: Cross-base-model and cross-domain generalization, controls, robustness,
    falsifiability, whether rubric or benchmark scores align with real scientific
    utility, literature review automation remains unresolved, and missing code, dataset,
    or limitation details leave verification gaps.'
  related_work_outline_zh:
  - 主流方向：面向科学发现的智能体AI，尤其是自主检索知识、综合文献、执行分析并生成论文的研究智能体（如 ReasFlow、EvoMaster），以及与开放式发现相配的证据导向评测（如
    TruthInsightBench、BAISBench）。
  - 研究共性：多篇工作都围绕“生成的主张是否由数据支撑”展开评测，使用冻结数据、盲任务或评分标准；系统通常结合知识检索、验证循环、自我批评和论文生成。
  - 关键差异：一部分工作构建端到端智能体系统或框架，另一部分创建评测基准；领域覆盖应用数学、单细胞组学和通用 ML；评测目标包括 LLM 评审分数、人类基线、基准任务和同行评审接收。
  - 趋势演进：在可见的 2023-2026 前沿期内，证据集中在 2025-2026 年，从领域基准和综述识别差距，发展到盲测证据基准、自演化框架和失败案例分析，更强调可靠性、可证伪性和系统失败分析。
  - 开放问题：跨基座模型和跨领域泛化、对照、稳健性、可证伪性、评分标准与真实科学效用是否一致、文献综述自动化仍待解决，以及代码、数据集或局限缺失带来的验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous scientific discovery systems
      what_it_solves: Integrating literature synthesis, knowledge retrieval, verification,
        experimentation, and paper generation into multi-agent workflows.
      what_remains_open: Long-horizon reliability, logical correctness before human
        inspection, and reproducibility evidence beyond rubric scores.
    - line: Evidence-grounded evaluation and benchmarks
      what_it_solves: Scoring agent claims against frozen data and peer-reviewed tasks
        instead of reproducing hidden target studies.
      what_remains_open: Generalization across base models and domains, and alignment
        between LLM-judge metrics and real scientific utility.
    - line: Failure-mode and survey synthesis
      what_it_solves: Cataloging agentic AI capabilities, metrics, datasets, and recurring
        failure patterns to derive design principles.
      what_remains_open: Direct evidence that taxonomies and failure modes predict
        behavior or improve systems; literature review automation remains unresolved.
    - line: Self-evolving agent infrastructure
      what_it_solves: Building domain-agnostic frameworks for iterative hypothesis
        refinement, self-critique, and knowledge accumulation across disciplines.
      what_remains_open: Disentangling framework contribution from base model, benchmark,
        and task-specific components.
    consensus:
    - Current systems are judged by whether claims are data-supported, not by fluent
      paper generation alone.
    - Frozen data, blind tasks, and explicit rubrics are emerging as reusable scaffolding
      for evidence-maturity evaluation.
    - Agents can execute and document analyses with comparatively strong evidence
      auditability and novelty, but lack controls, robustness, falsifiability, and
      cross-dataset generalization.
    - Knowledge retrieval, verification loops, and literature review automation are
      shared bottlenecks.
    disagreements:
    - Evaluation should center on real domain data and human baselines versus domain-agnostic
      hard tasks and automated LLM judges.
    - System designs should be domain-specific multi-agent pipelines versus domain-agnostic
      self-evolving frameworks built with minimal code.
    - Success is measured by generated-paper rubric scores versus benchmark task metrics
      versus human or multi-AI peer review acceptance.
    - Evidence is operationalized as hidden source conclusions with frozen data versus
      LLM rubrics versus peer review.
    open_questions:
    - Do high rubric or benchmark scores transfer to valid discovery outside the evaluation
      distribution?
    - Can agents generalize beyond the small samples reported across base models,
      domains, and data modalities?
    - How can controls, robustness, falsifiability, and cross-dataset generalization
      be embedded in both agent behavior and evaluation?
    - Literature review automation remains unresolved, and missing code, dataset,
      and limitation details leave reproducibility unverified.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科学发现系统
      解决的问题: 将文献综合、知识检索、验证、实验执行和论文生成整合到多智能体工作流中。
      尚未覆盖: 长时程可靠性、人工检查前的逻辑正确性，以及超越评分标准的可复现性证据。
    - 路线: 证据导向评测与基准
      解决的问题: 针对冻结数据和同行评审任务对智能体主张打分，而不是复现隐藏目标研究。
      尚未覆盖: 跨基座模型与领域泛化，以及 LLM 裁判指标与真实科学效用的一致性。
    - 路线: 失败模式与综述归纳
      解决的问题: 梳理智能体 AI 能力、指标、数据集和重复失败模式以提炼设计原则。
      尚未覆盖: 分类与失败模式能否预测行为并改进系统仍缺少直接实证；文献综述自动化仍未解决。
    - 路线: 自演化智能体基础设施
      解决的问题: 构建领域无关框架，支持迭代假设优化、自我批判和跨学科知识积累。
      尚未覆盖: 框架贡献与基座模型、基准及任务特定组件难以分离。
    共识:
    - 当前系统能否生成可信科学发现，取决于数据支撑和验证，而不是流畅文本或论文形式。
    - 冻结数据、盲任务和明确评分标准正被用于自动评估证据成熟度。
    - 现有智能体能执行并记录分析，证据可审计性和新颖性较强，但对照、稳健性、可证伪性和跨数据集泛化明显不足。
    - 知识检索、验证循环和文献综述自动化是共同瓶颈。
    分歧:
    - 评测应以真实领域数据和人类基线为主，还是以领域无关难题和自动 LLM 裁判为主。
    - 系统设计应采用特定领域多智能体流水线，还是用约 100 行代码构建的领域无关自演化框架。
    - 成功标准是生成论文评分、基准任务指标，还是通过人类与多 AI 评审并被接收。
    - 如何定义证据：隐藏源结论与冻结数据、LLM 评分标准，还是同行评审。
    开放问题:
    - 评分标准或基准高分在评测分布之外是否转化为真实有效发现。
    - 智能体能否在少量样本之外跨基座模型、领域和数据模态泛化。
    - 如何将对照、稳健性、可证伪性和跨数据集泛化嵌入智能体行为与评测。
    - 文献综述自动化仍缺乏直接系统证据；现有代码、数据集或局限缺失也构成验证缺口。
