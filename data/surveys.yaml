    研究路线矩阵:
    - 路线: 端到端自主研究工作流智能体
      解决的问题: 在一个循环中整合想法生成、代码执行、实验管理、可视化和论文撰写。
      尚未覆盖: 成功率不稳定，评估多依赖自动评审；对照、稳健性检查和可证伪贡献仍有限。
    - 路线: 带验证门的领域专用发现系统
      解决的问题: 在应用数学或计算流体动力学等领域加入逻辑审查或视觉-语言物理校验，以捕获静默失败。
      尚未覆盖: 验证门仍会遗漏部分失败，且验证范围较窄；向配置外求解器或任务族泛化不明确。
    - 路线: 面向开放式科学发现的基准环境
      解决的问题: 以标准化任务和指标评估假设形成、实验和结论生成，而不只是复现已知结果。
      尚未覆盖: 强基线智能体仍表现困难，基准表现未必能转化为任务分布外的真实科学效用或新颖性。
    - 路线: 基于证据的评测与自动评审
      解决的问题: 用LLM评委或模拟评审大规模评估论文、证据成熟度、可审计性与新颖性。
      尚未覆盖: 编码智能体得分趋同，代理指标不足以证明真实科学判断或跨场景可信度。
    - 路线: 人机协同角色分工
      解决的问题: 将人类研究者定位为首席研究员、智能体定位为研究生，以减少专家干预并保持监督。
      尚未覆盖: 可辩护主张仍需要人类监督，且这种分工尚未在不同科学领域得到验证。
    共识:
    - 自主研究系统普遍采用相似循环：形成假设、实现、实验、可视化、写作，然后评估或验证。
    - 自动评估被视为规模化必要条件，但证据成熟度结果显示智能体进入平台期，缺少判别性科学行为。
    - 通用工作流在技术领域缺少验证门时难以生成可辩护主张；领域感知系统能提升有效性，但仍不完全可靠。
    分歧:
