      尚未覆盖: 评估依赖LLM评审且属于初步结果；缺少人类领域专家验证和下游发现影响的证据。
    - 路线: 接地执行基础设施
      解决的问题: 提供经过验证的代码库或可重用执行经验，使智能体生成的实验更准确、完整且可执行。
      尚未覆盖: 泛化主要在一个领域内展示；LLM-as-a-judge一致性仅中等，外部可复现性未验证。
