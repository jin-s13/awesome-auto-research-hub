    evidence maturity, safety, and auditability.'
  - 'Shared research pattern: Agents are asked to form hypotheses, design or run experiments,
    analyze frozen or simulated data, and document conclusions; evaluation uses task
    metrics, LLM judges, or safety gates.'
  - 'Key differences: Work targets complete discovery loops, blind evidence interpretation,
    constrained ML coding, wet-lab execution safety, or auditable question formation,
    with different interaction settings and evidence sources.'
  - 'Trend evolution: From 2024 complete-loop simulation environments toward 2026
    evidence-grounded evaluation, structured research-question certificates, trajectory-aware
