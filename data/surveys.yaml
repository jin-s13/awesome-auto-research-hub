      尚未覆盖: 输出在同行评审下不稳定，通常只在工作坊或评分标准层面成功，缺少完整会议级证据，且局限常未说明。
    - 路线: 领域特定验证与有效性门控
      解决的问题: 在结论写入之前，通过逻辑审计或渲染领域工件检查来发现逻辑或物理层面的静默失败。
      尚未覆盖: 门控仍会漏检植入失败，只在少数领域得到展示，向新推理领域或仿真器迁移的证据不足。
    - 路线: 面向证据的发现基准
      解决的问题: 用任务完成、动作相关性、可解释知识或证据成熟度等自动指标，让科学发现可比较。
      尚未覆盖: 当前智能体得分在60左右并出现平台期，缺少对照、稳健性、可证伪性和跨数据集泛化，指标与真实科学价值也未校准。
    - 路线: 协作式多智能体研究工作流
      解决的问题: 在人类首席研究员或实验管理智能体下协调知识检索、推导、实验管理和手稿起草。
      尚未覆盖: 人机贡献边界不清，评测依赖LLM评审标准或单领域案例，缺少可复现的多领域证据。
    共识:
    - 发现流程普遍被分解为构思、实验执行、分析、论文撰写和自动评审等阶段。
    - 自动评测或评审被用作人工评估的可扩展替代，但仍受限于LLM裁判本身。
    - 当前系统能较完整地执行和记录分析，但尚未可靠地形成带对照与稳健性检查的可信科学结论。
    - 验证或有效性门控有助于减少无效结论，但已报告的漏检率和基准平台期说明其覆盖仍不完整。
    分歧:
    - 评测目标不同：模拟虚拟任务、盲数据实证任务、领域特定求解器发现和会议式同行评审并存。
    - 验证机制不同：逻辑一致性审计、渲染流场的视觉语言检查，以及无领域专用门控的通用自动评审。
    - 部署方式不同：有的完全自主生成手稿，有的采用人类首席研究员-智能体协作，也有系统止步于分析行动。
