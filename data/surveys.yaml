  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous manuscript generation
      what_it_solves: Converting research ideation, code execution, and result analysis
        into full paper drafts with automated review
      what_remains_open: 'Inconsistent completion and acceptance: one of three workshop
        submissions passed, and one of four autonomous attempts completed in the evidence'
    - line: Domain-specific research writing with verification gates
      what_it_solves: Adding field-aware checks before writing, such as theorem coherence
        in applied mathematics or visual flow verification in computational fluid
        dynamics
      what_remains_open: Missed failures remain possible; the CFD vision gate missed
        2 of 16 planted silent failures, and transfer to other domains is unproven
    - line: Self-correcting and grounded reporting
      what_it_solves: Recovering from failed experiments and constraining generated
        claims to measured values to reduce hallucinated numbers and citations
      what_remains_open: Fully autonomous conference-ready writing remains unsolved;
        gains are concentrated in code execution rather than manuscript quality
    - line: Human-AI collaboration and intervention design
      what_it_solves: Identifying when human oversight should enter an autonomous
        research-writing loop to improve reliability
      what_remains_open: Optimal intervention modes are validated mainly on ARC-Bench;
        evidence across fields and larger workflows is absent
    - line: Automated review and evaluation design
      what_it_solves: Supplying scoring rubrics, benchmarks, blind scores, or peer-review-style
        signals to compare generated manuscripts
      what_remains_open: Small sample sizes and proxy reviewers are not yet aligned
        with human peer-review acceptance across venues
    - line: Failure-mode analysis and design principles
      what_it_solves: Organizing recurring failures from end-to-end autonomous attempts
        into lessons for more robust AI writing systems
      what_remains_open: The proposed principles are not directly validated as predicting
        success or improving manuscript quality
    consensus:
    - Systems commonly split autonomous research writing into ideation, execution,
      verification, and manuscript drafting stages.
    - A verification, reviewer, or grounded-reporting mechanism is treated as necessary
      to avoid unsupported claims or hallucinated results.
    - LLM-based review rubrics or peer-review-style signals are the primary evaluation
      approach, despite small sample sizes.
    - Human-AI collaboration is often retained; one ablation suggests targeted human
      intervention outperforms full autonomy and exhaustive oversight.
    - Full autonomy for conference-ready writing is not yet established, with completion
      and acceptance remaining uneven.
    disagreements:
    - 'Verification signals differ: logical proof coherence, physics-aware visual
      inspection, causal failure attribution, and constraints to measured values.'
    - 'Domain scope differs: general machine learning, applied mathematics, computational
      fluid dynamics, and multi-domain benchmark settings.'
    - 'Autonomy philosophy differs: full autonomy versus human-in-the-loop control
      with different intervention modes.'
    - 'Evaluation targets differ: automated reviewer acceptance, workshop peer review,
      ARC-Bench score, blind score, and completion rate.'
    - Some work emphasizes full manuscript generation; other work emphasizes failure
      recovery and reporting honesty rather than final publication readiness.
    open_questions:
    - Do LLM-based review or blind scores predict human peer-review acceptance across
      fields and venues?
    - How can verification gates reduce missed silent failures, given the reported
      2 of 16 misses in one physics-checking system?
    - Why do completion and acceptance rates remain low, such as one of three workshop
      papers or one of four autonomous attempts?
    - Can fully autonomous systems move beyond workshop or benchmark demonstrations
      to formal conference-ready manuscripts?
    - What shared datasets, metrics, and human-evaluation protocols are missing for
      systematic writing quality assessment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自动论文生成流水线
      解决的问题: 将研究构思、代码执行和结果分析转化为带自动评审的完整论文草稿
      尚未覆盖: 完成与接受率不稳定：证据中三次工作坊投稿仅一篇通过，四次尝试仅一次完成
    - 路线: 领域专用写作验证门控
      解决的问题: 在写作前加入专业检查，如应用数学的定理一致性或计算流体力学的视觉流场验证
      尚未覆盖: AI CFD Scientist 视觉门控漏掉 16 个植入失败中的 2 个；跨领域迁移无法证实
    - 路线: 自我纠正与基于测量值的报告
      解决的问题: 从失败实验恢复并约束生成内容来自实测值，减少幻觉数字与引用
      尚未覆盖: 完全自主生成会议可投稿论文仍未解决，且改进集中在代码执行而非文本质量
    - 路线: 人机协作与干预设计
      解决的问题: 判断人类监督应进入自主研究写作的哪个环节以提升可靠性
      尚未覆盖: 最优干预模式主要在 ARC-Bench 上验证，其他领域和大规模流程证据缺失
    - 路线: 自动评审与评测设计
      解决的问题: 提供评分量表、基准、盲评或类同行评审信号以比较生成稿件
      尚未覆盖: 小样本和代理评审与真实人类同行评审接受是否一致未建立
    - 路线: 失败模式与设计原则
      解决的问题: 将端到端自主研究尝试中的重复失败归纳为更稳健的设计原则
      尚未覆盖: 这些原则是否直接预测成功或提升稿件质量缺乏实证
    共识:
    - 多数系统把自主科研写作拆成构思、执行、验证和手稿撰写。
    - 普遍引入验证、评审或基于实测值的报告机制，以抑制不实断言或幻觉结果。
    - LLM 评分量表或类同行评审信号是主要评价方式，但样本量偏小。
    - 人机协作仍常被保留；一项消融显示高杠杆点的人类干预优于全自主和逐步监督。
    - 完全自主写作尚未达到会议级稳定水平，完成与接受率参差不齐。
    分歧:
    - 验证信号不同：逻辑证明一致性、物理感知视觉检查、因果失败归因、基于实测值约束。
    - 领域范围不同：通用机器学习、应用数学、计算流体动力学和多领域基准。
    - 自主程度不同：全自动生成与人类在环控制并存，干预模式各不相同。
    - 评测目标不同：自动审稿人接受、工作坊同行评审、ARC-Bench 分数、盲评分和完成率。
    - 部分工作强调完整论文生成，部分强调失败恢复和报告诚实，而非最终出版就绪。
    开放问题:
    - LLM 审稿评分或盲评分能否预测跨领域和跨会议的人类同行评审接受？
    - 验证门控如何进一步降低漏检，如某个物理检查系统漏掉 16 个植入失败中的 2 个？
    - 为何完成与接受率仍偏低，如三次工作坊投稿仅一篇通过或四次尝试仅一次完成？
    - 完全自主系统能否从工作坊或基准演示扩展到正式会议论文？
    - 目前缺少哪些共享数据集、指标和人类评估协议来系统衡量科研写作质量？
