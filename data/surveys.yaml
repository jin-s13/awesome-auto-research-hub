    - 路线: 人机协作研究流水线
      解决的问题: 将智能体自主性与定点人工监督、自愈执行和可验证报告结合，降低虚构或幻觉输出风险。
      尚未覆盖: 最优干预点和跨领域成本效益未确定，证据主要来自实验阶段基准。
    共识:
    - 仅靠自主组件不够，系统普遍加入验证、评审或人工检查以抑制不可靠和虚假输出。
    - 端到端工作流收敛为假设—实验—分析—写作闭环。
    - 基准和评审式评测正在成为比较AI科学家系统的重要手段。
