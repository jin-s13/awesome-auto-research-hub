  - 趋势演进：2024 年以全自动生成与模拟评审为主，2025 年出现智能体树搜索和工作坊级同行评审，2026 年更重视领域验证、人机协作和失败归因。
  - 开放问题：生成手稿能否稳定通过严格会议评审；需要多少人工监督；如何跨领域保证事实和方法的可靠性。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous manuscript generation
      what_it_solves: Produces full research papers by linking idea generation, code
        execution, result visualization, and drafting, reducing per-paper cost and
        human intervention.
      what_remains_open: Consistency of acceptance and generalizability beyond workshop
        or benchmark settings; no stable evidence of conference-level publication
        quality.
    - line: Domain-aware verification-gated writing
      what_it_solves: Grounds generated manuscripts in domain-specific checks, such
        as physics-aware vision inspection or internal logical verification, before
        accepting results or text.
      what_remains_open: Verification gates still miss planted failures and do not
        cover factual or methodological errors outside the defined check scope.
    - line: Self-correcting and failure-attribution authoring
      what_it_solves: Diagnoses failed experiments or draft reporting and routes interventions
        to hypothesis, design, implementation, or reporting to increase metric-bearing
        and artifact-quality outputs.
      what_remains_open: Cannot yet reliably produce conference-ready manuscripts;
        improvement depends on benchmark trajectories and observable failure features.
    - line: Human-AI collaborative research writing
      what_it_solves: Integrates targeted human oversight at high-leverage decision
        points to outperform both full autonomy and exhaustive step-by-step supervision
        in research pipelines.
      what_remains_open: Optimal intervention granularity, cost, and whether the collaboration
        advantage transfers across domains and writing tasks remains open.
    - line: Automated review and evaluation of research manuscripts
      what_it_solves: Uses LLM/VLM reviewers, peer-review simulations, or rubric-based
        comparisons to evaluate generated manuscripts and surface weak claims.
      what_remains_open: Alignment between automated review scores and human scientific
        judgement is not fully established; evidence is limited to workshop-level
        or benchmark results.
    consensus:
    - Autonomous scientific writing is treated as an integrated system problem spanning
      ideation, execution, verification, and drafting rather than an isolated language-generation
      task.
    - Verification, review, or self-correction loops are consistently used to constrain
      claims and reduce fabricated or unsupported results in generated manuscripts.
    - Multi-agent or pipeline architectures with specialized stages are seen as improving
      robustness relative to a single end-to-end generator.
    - 'Authors treat current systems as partial successes: they can produce papers,
      but acceptance is inconsistent and often limited to controlled settings.'
    disagreements:
    - 'Autonomy stance is contested: some systems minimize human intervention, while
      others show targeted human collaboration at key decision points outperforms
      full autonomy and exhaustive oversight.'
    - 'Verification mechanism differs: domain-specific physical or logical gates,
      multi-hypothesis causal failure attribution, and simulated peer review constrain
      claims in different ways and catch different errors.'
    - 'Success is measured by different outcomes: automated acceptance thresholds,
      workshop peer-review acceptance, benchmark scores, artifact quality, or error
      detection rate, making cross-system comparison difficult.'
    - Evaluation scope differs between broad ML workflows and domain-specific settings
      such as applied mathematics or computational fluid dynamics, which affects whether
      a validity gate is feasible and what writing quality means.
    open_questions:
    - Can any current autonomous research writing system produce conference-ready
      manuscripts reliably, beyond a single accepted workshop paper or benchmark claim?
    - What verification coverage is necessary to catch silent failures in generated
      text and figures, given that even domain-aware gates miss planted failures?
    - How should human oversight be allocated to high-leverage writing and experimental
      decisions without falling into exhaustive, expensive supervision?
    - Do automated LLM reviewers and acceptance thresholds align with human peer review
      for scientific communication, and under what conditions do they diverge?
    - How can systems address failure modes such as training-data defaults, implementation
      drift, context degradation, overexcitement, weak domain intelligence, and weak
      scientific taste in long-horizon authoring?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主手稿生成
      解决的问题: 把选题、代码执行、结果可视化和论文起草串成完整论文产出，减少人工干预和单篇成本。
      尚未覆盖: 接收稳定性和在基准或工作坊之外的可泛化性；尚无稳定的会议级论文质量证据。
    - 路线: 领域感知的验证门控写作
      解决的问题: 在产出结果或文本前，用物理感知的视觉检查或内部逻辑审计等特定领域检查来约束论文主张。
      尚未覆盖: 验证门控仍会漏掉植入失败，也无法覆盖定义检查范围之外的事实与方法错误。
    - 路线: 自纠正与失败归因式论文生成
      解决的问题: 对失败实验或草稿报告做诊断，把干预路由到假设、设计、实现或报告层面，以提高带指标输出和工件质量。
      尚未覆盖: 尚不能稳定产出可提交会议的论文；改进依赖基准轨迹和可观察失败特征。
    - 路线: 人机协作科研写作
      解决的问题: 在高杠杆决策点引入精炼人工监督，优于完全自主和逐步详尽监督。
      尚未覆盖: 最优监督粒度、成本及其跨领域、跨写作任务的可迁移性仍未确定。
    - 路线: 生成论文的自动评审与评测
      解决的问题: 用 LLM/VLM 评审、同行评审模拟或评分准则评估生成手稿，暴露薄弱主张。
      尚未覆盖: 自动评审分数与人类科学判断的一致性未充分建立；证据主要限于工作坊或基准。
    共识:
    - 自主科研写作被视为覆盖构思、执行、验证和起草的系统问题，而不是孤立的文本生成任务。
    - 验证、评审或自纠正循环被持续用于约束论文主张，减少编造或无支持的结果。
    - 由专门阶段组成的多智能体或流水线架构被认为比单一端到端生成器更稳健。
    - 现有工作把系统视为部分成功：能生成论文，但接受度不稳定，且常受控制场景限制。
    分歧:
    - 自主程度存在分歧：一些系统尽量减少人工干预，另一些则表明在关键决策点进行目标化人机协作优于全自主和逐步监督。
    - 验证机制不同：领域特定的物理或逻辑门控、多假设因果失败归因与模拟同行评审以不同方式约束主张，捕获不同错误。
    - 成功标准不同：自动接受阈值、工作坊同行评审通过、基准分数、工件质量或错误检出率并存，使跨系统比较困难。
    - 评测范围不同：通用机器学习流程与特定领域（如应用数学或计算流体动力学）在验证门控可行性和写作质量含义上不同。
    开放问题:
    - 当前自主科研写作系统是否能在单个工作坊论文或基准结果之外，可靠产出可提交会议的论文？
    - 既然领域感知门控仍会漏掉植入失败，何种验证覆盖才能捕获生成文本和图表中的静默错误？
    - 如何在不陷入昂贵逐步监督的情况下，将人工监督分配到高杠杆的写作与实验决策上？
    - 自动 LLM 评审和接受阈值是否与人类同行评审一致，在何种条件下会偏离？
    - 系统如何应对长程写作中的训练数据默认偏好、实现漂移、记忆退化、过度兴奋、领域智能不足和科学品味薄弱？
