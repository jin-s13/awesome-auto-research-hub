  related_work_outline:
  - 'Mainstream direction: Building multi-agent systems that automate scientific literature
    review, survey generation, and research paper writing, predominantly using LLM-based
    agents with iterative refinement, self-evolution, or structured workflows.'
  - 'Shared research pattern: Agents are organized into modular pipelines mirroring
    scholarly roles (search, curation, drafting, review), and quality is ensured through
    internal verification, rubric-guided feedback, or human-in-the-loop evaluation.'
  - 'Key differences: Systems vary in the degree of autonomy (fully autonomous vs.
    human-led collaboration), the scope of output (survey paper, algorithm discovery,
    full research paper), and the mechanism for guiding exploration (evolutionary
    search, tree-based backtracking, or rubric-guided iteration).'
  - 'Trend evolution: From 2025 to 2026, the field is shifting from isolated tool
    proposals to integrated, self-improving agent ecosystems, with growing emphasis
    on systematic failure analysis and reproducible benchmarks, but evidence is confined
    to the current frontier (2023–2026).'
  - 'Open questions: How to guarantee factual accuracy and avoid hallucinated citations
    in generated literature; how to design evaluation metrics that align with real
    scholarly utility; and how to scale literature intelligence across diverse, rapidly
    evolving research fields.'
  related_work_outline_zh:
  - 主流方向：构建多智能体系统，自动化科学文献综述、综述生成和研究论文撰写，主要采用基于LLM的智能体，结合迭代优化、自我演化或结构化工作流。
  - 研究共性：智能体按学术角色（检索、策展、起草、审稿）模块化组织，通过内部验证、评分准则引导的反馈或人机协作评估来保证质量。
  - 关键差异：系统在自主性程度（全自主 vs. 人主导协作）、产出范围（综述、算法发现、完整研究论文）以及探索引导机制（进化搜索、树状回溯或评分准则迭代）上存在差异。
  - 趋势演进：2025至2026年间，该领域正从孤立工具提案转向集成化、自改进的智能体生态，并日益重视系统失败分析与可复现基准，但证据仅涵盖当前前沿（2023–2026）。
  - 开放问题：如何保证生成文献的事实准确性并避免虚构引用；如何设计与真实学术效用对齐的评估指标；以及如何在多样、快速演化的研究领域扩展文献智能。
  literature_review:
    line_of_work_matrix:
    - line: Paper representation and knowledge modeling
      what_it_solves: Encoding documents, citation graphs, and domain knowledge into
        searchable, queryable structures that downstream agents can reason over.
      what_remains_open: How to update representations incrementally with new publications
        and handle multimodal content (figures, tables, code) remains largely unexplored.
    - line: Agentic planning and workflow orchestration
      what_it_solves: Designing the high-level decision process that sequences information
        retrieval, reading, synthesis, and writing steps to produce a coherent output.
      what_remains_open: Whether the planning strategy itself improves the final output
        quality beyond the underlying LLM's capabilities is not isolated; the benefit
        of agent orchestration vs. single-pass generation is unquantified.
    - line: Evaluation and quality assurance
      what_it_solves: Creating benchmarks, rubrics, and human baselines to measure
        the completeness, accuracy, and scholarly rigor of automatically generated
        literature.
      what_remains_open: Existing benchmarks focus on narrow scientific domains or
        proxy metrics; no agreement on a holistic, real-world validation protocol
        that includes expert peer review.
    - line: Systems and reproducible infrastructure
      what_it_solves: Turning proof-of-concept agents into reusable, modular systems
        with accessible code, datasets, and deployment pipelines.
      what_remains_open: Reproducibility signals (code, artifacts) are present in
        some papers but absent in others, and cross-system comparisons under identical
        conditions are missing.
    - line: Failure analysis and design principles
      what_it_solves: Cataloging recurrent failure modes (e.g., implementation drift,
        memory degradation, overexcitement) and deriving generalizable design guidelines
        for robust AI scientists.
      what_remains_open: The documented failure modes are derived from a small number
        of case studies; it is unclear whether they generalize to other domains, scales,
        or agent architectures.
    consensus:
    - LLM-based multi-agent systems can generate structured literature surveys and
      research papers, but they require internal verification or human oversight to
      correct logical errors and maintain factual fidelity.
    - Automated literature review remains a significant bottleneck; current systems
      struggle with comprehensive retrieval, hallucinated references, and maintaining
      context over long documents.
    - Evaluation should move beyond simple automated metrics to include rubric-based
      assessments and human baselines that capture scholarly depth and novelty.
    disagreements:
    - 'Autonomy vs. partnership: Some systems aim for fully autonomous end-to-end
      paper generation, while others frame the agent as a collaborative assistant
      that requires a human principal investigator.'
    - 'Output granularity: Systems target different artifacts—full research papers,
      algorithm descriptions, or survey manuscripts—making direct comparisons difficult.'
    - 'Exploration strategy: Evolutionary search, structured tree-based backtracking,
      and rubric-guided iterative refinement represent distinct philosophies for navigating
      the design space of a paper or survey.'
    open_questions:
    - Can automated literature intelligence systems reliably detect and avoid hallucinated
      citations, and what verification mechanisms are necessary for trustworthiness?
    - How should the scientific community validate the quality of AI-generated surveys
      beyond surface-level rubric scores, given the absence of large-scale expert-reviewed
      benchmarks?
    - What are the minimal system requirements (retrieval freshness, domain adaptation,
      human input) to make literature intelligence usable across fast-moving fields
      like machine learning or biomedicine?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 论文表示与知识建模
      解决的问题: 将文档、引文图和领域知识编码为可供下游智能体推理的可搜索、可查询结构。
      尚未覆盖: 如何随新出版物增量更新表示，并处理多模态内容（图、表、代码），仍基本未探索。
    - 路线: 智能体规划与工作流编排
      解决的问题: 设计信息检索、阅读、综合与写作步骤的高层决策序列，以生成连贯的产出。
      尚未覆盖: 规划策略本身是否在底层LLM能力之外提升了最终产出质量尚不明确；智能体编排与单次生成的增益未被量化。
    - 路线: 评测与质量保证
      解决的问题: 创建基准、评分准则和人类基线，以衡量自动生成文献的完整性、准确性和学术严谨性。
      尚未覆盖: 现有基准集中在狭窄科学领域或代理指标；尚无包含专家同行评审的全面真实世界验证协议共识。
    - 路线: 系统与可复现基础设施
      解决的问题: 将概念验证型智能体转化为可复用的模块化系统，并提供可访问的代码、数据集和部署流水线。
      尚未覆盖: 部分论文提供了可复现信号（代码、工件），但另一些没有，且缺乏在相同条件下跨系统的比较。
    - 路线: 失败分析与设计原则
      解决的问题: 编录反复出现的失败模式（如实现漂移、记忆退化、过度兴奋）并推导出构建稳健AI科学家的通用设计指南。
      尚未覆盖: 所记录的失败模式源自少量案例研究；尚不清楚它们是否可推广到其他领域、规模或智能体架构。
    共识:
    - 基于LLM的多智能体系统能够生成结构化的文献综述和研究论文，但需要内部验证或人工监督来纠正逻辑错误并保持事实保真度。
    - 自动化文献综述仍是显著瓶颈；当前系统在全面检索、虚构引用和长文档上下文保持方面存在困难。
    - 评测应超越简单的自动指标，纳入基于评分准则的评估和能捕捉学术深度与新颖性的人类基线。
    分歧:
    - 自主性 vs. 协作：一些系统旨在完全自主的端到端论文生成，而另一些则把智能体定位为需要人类首席研究员的协作助手。
    - 产出粒度：系统针对不同工件——完整研究论文、算法描述或综述手稿——使得直接比较难以进行。
    - 探索策略：进化搜索、结构化树状回溯和评分准则引导的迭代优化代表了在论文或综述设计空间导航的不同理念。
    开放问题:
    - 自动化文献智能系统能否可靠地检测并避免虚构引用，且需要何种验证机制才能确保可信度？
    - 在缺乏大规模专家评审基准的情况下，科学界应如何超越表面评分来验证AI生成的综述质量？
    - 要使文献智能在机器学习或生物医学等快速发展的领域可用，最低限度的系统要求（检索时效性、领域适配、人类输入）是什么？
