  - 开放问题：自动评判与人类科学判断的对齐程度，跨基座模型与跨领域泛化，以及智能体是否能产出对照、稳健性、可证伪性和跨数据集证据。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous discovery workflows (e.g., The AI Scientist, AI CFD Scientist,
        EvoCast)
      what_it_solves: Converting LLM-driven hypothesis generation into end-to-end
        research loops that write code, run experiments, document findings, and sometimes
        modify architectures or physical models.
      what_remains_open: Whether outputs are scientifically trustworthy outside evaluated
        cases; generated claims still lack consistent controls, robustness, and validity
        gates.
    - line: Discovery evaluation environments (e.g., DISCOVERYWORLD, BAISBench)
      what_it_solves: Providing controlled tasks and human or automatic metrics to
        compare agents on complete discovery cycles, including real-data tasks.
      what_remains_open: Transfer from task completion and rubric scores to real-world
        scientific validity, and coverage across domains and hidden study types, remain
        unclear.
    - line: Evidence-maturity scoring instruments (e.g., TruthInsightBench)
      what_it_solves: Assessing whether agent claims are supported by controls, robustness,
        falsifiability, and cross-dataset generalization rather than merely reproducing
        a target study.
      what_remains_open: Generalizability across base models, domain-specific evidence
        norms, and the validity of a fixed LLM judge remain unproven.
    - line: Reliability gates and authority separation (e.g., AI CFD Scientist, EvoCast)
      what_it_solves: Catching invalid or silently wrong outputs and constraining
        agent modifications with deterministic or physics-aware verification.
      what_remains_open: Missed silent failures and whether gates built for one domain
        transfer to broader scientific workflows remain unresolved.
    - line: Open reproducible agent infrastructure
      what_it_solves: Making agent workflows runnable and reusable through open code
        and artifacts, supporting external re-execution and inspection.
      what_remains_open: Standardized validation across hardware, datasets, and user
        settings; code and artifact presence alone do not establish result correctness.
    consensus:
    - Autonomous agents can execute and document analyses, but current evidence shows
      they do not yet reach dependable fully autonomous discovery.
    - 'Effective evaluation requires more than task success: it should include evidence
      quality dimensions such as controls, robustness, falsifiability, and generalization.'
    - Reliability controls, whether physics checks, authority separation, or deterministic
      scoring, are treated as necessary to catch invalid outputs that execution metrics
      miss.
    - Open code and artifact signals are common, but external validation and citation
      or graph evidence for these top papers are limited or unavailable.
    disagreements:
    - 'Evaluation targets differ: open-ended virtual discovery, domain-specific real-data
      analysis, and task-specific architecture evolution make scientific ability claims
      hard to compare.'
    - 'Reliability mechanisms differ: visual physics verification, deterministic program
      authority, automated peer review, and blind evidence-maturity judgment rely
      on different failure assumptions.'
    - 'Success metrics differ: physical error reduction, peer-review acceptance, task
      completion plus explanation knowledge, and evidence maturity are not interchangeable
      and may reward different agent behaviors.'
    - 'Human comparison baselines are absent or differently constructed: some evaluations
      use human reviewers or graduate students, while others rely on automated judges
      or domain-specific physical references.'
    open_questions:
    - How can evidence-maturity rubrics be validated against human scientific judgment
      across more domains and base models?
    - Can autonomous agents be designed to consistently produce controls, robustness
      checks, falsifiability evidence, and cross-dataset generalization?
    - How should domain-specific verification gates and general evidence judges be
      combined to reduce missed silent failures?
    - What would be required to establish reliable pairwise comparison of agents when
      top scores cluster and differences are not statistically significant?
