  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery loops
      what_it_solves: Automating the full research cycle from hypothesis generation
        and experiment execution to paper writing, with internal review or verification
        checks.
      what_remains_open: Reliability across runs and domains; current evidence shows
        partial acceptance or high rubric scores but limited external validation beyond
        case studies.
    - line: Human-in-the-loop multi-agent research platforms
      what_it_solves: Providing customizable role-based research workflows, real-time
        monitoring, artifact inspection, and experiment harnesses that keep a human
        operator in control.
      what_remains_open: Evidence is limited to a small set of internal case studies;
        platform maturity and generalizability to external tasks remain unproven.
    - line: Failure-aware memory and iterative self-improvement
      what_it_solves: Recording failed attempts as structured negative knowledge so
        later research agents can avoid repeating errors and improve retries or cross-task
        transfer with fewer tokens.
      what_remains_open: Demonstrated mainly on ScienceAgentBench and PDE tasks; coverage
        of more diverse experiment types and long-term memory maintenance is unknown.
    - line: Benchmark environments for scientific discovery agents
      what_it_solves: Providing task suites and automatic metrics for hypothesis formation,
        experiment design, execution, and discovery explanation to make agent capabilities
        comparable.
      what_remains_open: Strong baselines still struggle; proxy metrics may not align
        with real discovery value, and lab-based or physical experiment coverage is
        missing.
    - line: Automated experimental design and ablation planning evaluation
      what_it_solves: Assessing whether language models can propose necessary ablation
        experiments or identify missing ablations from empirical AI papers.
      what_remains_open: Best systems remain below human recall; author/reviewer task
        behavior is inconsistent, and planning quality is measured by LLM judges rather
        than executed experimental value.
    consensus:
    - 'Autonomous research agents share a common loop pattern: generate a hypothesis
      or plan, execute experiments or derivations, analyze outcomes, and produce a
      written artifact.'
    - Automated evaluation is used as a core control signal, whether through simulated
      LLM reviewers, curated rubrics, or benchmark metrics.
    - Current evidence shows that fully autonomous scientific discovery is feasible
      only on bounded tasks and often remains below human-level consistency for open-ended
      or adversarial evaluation.
    - Reproducibility evidence is mixed; several systems expose code or artifacts,
      but evaluation breadth and limitation reporting are uneven.
    disagreements:
    - 'Systems differ in interaction mode: fully automated loops versus human-in-the-loop
      dashboards with monitoring and rollback.'
    - 'Evaluation targets differ: task completion scores in synthetic environments
      versus ablation-recall benchmarks versus actual workshop peer review acceptance.'
    - 'Memory and revision mechanisms differ: failure-aware shared banks versus internal
      logical verification loops versus visually grounded reviewer feedback for figure
      improvement.'
    - 'Domain focus differs: empirical ML experiments dominate some frameworks, while
      others emphasize applied mathematics, PDEs, or broad symbolic scientific discovery
      tasks; lab-based physical automation is not represented in the packet evidence.'
    open_questions:
    - How well do automated discovery agents transfer from bounded code or math tasks
      to physical lab experiment automation with noisy observations and equipment
      constraints?
    - Does success under LLM-generated rubrics or simulated review predict real scientific
      impact or robustness under human peer review?
    - Can failure-aware memory scale beyond a few PDE or ScienceAgentBench tasks to
      long-horizon, cross-domain experiment iteration without forgetting or conflict?
    - What missing evidence, such as limitations, negative results, dataset/code release,
      and external baselines, is needed to distinguish genuine methodology gains from
      intent or narrative quality?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现循环
      解决的问题: 自动化从假设生成、实验执行到论文写作的完整研究闭环，并加入内部评审或验证检查。
      尚未覆盖: 跨运行和跨领域的可靠性仍不明确；现有证据多为案例研究或部分同行评审通过，外部验证有限。
    - 路线: 人在回路的多智能体研究平台
      解决的问题: 提供可定制角色分工、实时监控、工件检查和实验代码接入，使人类操作者能监督和回滚。
      尚未覆盖: 证据主要来自少量内部案例；平台成熟度与外部任务泛化性尚未得到充分验证。
    - 路线: 失败感知记忆与迭代自改进
      解决的问题: 把失败尝试转化为结构化负知识，让后续研究代理避免重复错误，并在重试或跨任务时用更少 tokens 提升表现。
      尚未覆盖: 主要在 ScienceAgentBench 和 PDE 任务上验证，对更多样实验类型及长期记忆维护的覆盖未知。
    - 路线: 科学发现智能体基准环境
      解决的问题: 通过任务套件和自动指标评估假设形成、实验设计、执行和发现解释能力，使智能体能力可比。
      尚未覆盖: 强基线仍表现困难；代理指标与真实发现价值的一致性未验证，实验室或物理实验覆盖缺失。
    - 路线: 自动实验设计与消融规划评测
      解决的问题: 评估语言模型是否能从方法部分提出必要消融实验，或从完整论文识别缺失消融。
      尚未覆盖: 最佳系统仍低于人类召回率；作者/审稿人任务行为不一致，是否按计划执行并产生实验价值仍未有充分证据。
    共识:
    - 自主研究智能体共享“提出假设/计划—执行实验或推导—分析结果—产出论文或报告”的工作流模式。
    - 自动评测被用作核心控制信号，形式包括模拟LLM评审、人工设计评分标准或任务基准指标。
    - 证据显示，完全自主科学发现在受限任务上可行，但在开放或对抗性评估中通常仍低于人类一致性。
    - 可复现性证据不均衡；部分系统公开代码或工件，但评估广度和局限性报告参差不齐。
    分歧:
    - 交互模式不同：部分系统是全自动闭环，部分系统强调人在回路的仪表板、监控与回滚。
    - 评测目标不同：合成环境中的任务完成度、消融召回率基准、以及真实工作坊同行评审接受分别占据不同位置。
    - 记忆与修订机制不同：失败感知共享记忆、内部逻辑验证循环、基于视觉反馈的图表评审各有侧重。
    - 领域重点不同：有些框架聚焦实证机器学习实验，有些强调应用数学或PDE，有些面向符号化的广义科学发现任务；证据包中缺乏物理实验室自动化。
    开放问题:
    - 自动化发现智能体在有限代码或数学任务上的表现能否迁移到观测量嘈杂、设备约束强的物理实验室自动化？
    - LLM生成评分标准或模拟评审下的成功，能否预测真实科学影响或在人类同行评审下的稳健性？
    - 失败感知记忆能否从小规模 PDE 或 ScienceAgentBench 任务扩展到长期、跨领域实验迭代，且不产生遗忘或冲突？
    - 现有证据中缺少局限性、负结果、数据/代码发布及外部基线时，如何区分真正的方法论改进与写作或意图质量？
