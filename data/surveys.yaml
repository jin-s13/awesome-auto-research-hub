  literature_review:
    line_of_work_matrix:
    - line: Autonomous discovery agents and end-to-end research platforms
      what_it_solves: Turning LLM-driven ideation, code execution, result visualization,
        and manuscript writing into runnable scientific workflows.
      what_remains_open: Whether output claims remain reliable beyond accepted workshop
        papers, selected case studies, or automated review thresholds.
    - line: Evidence-grounded evaluation benchmarks and virtual discovery environments
      what_it_solves: Providing comparable tasks, blind data, metrics, and judge pipelines
        to measure scientific discovery agents.
      what_remains_open: Whether task metrics and fixed LLM judges align with human
        peer review, real decision utility, and cross-domain generalization.
    - line: Domain-specific verification and scientific validity gates
      what_it_solves: Detecting invalid or unsupported outputs within a physical or
        biological modality through visual checks, domain benchmarks, or annotation
        tasks.
      what_remains_open: Gates and domain benchmarks still miss silent failures and
        have not been shown to transfer across modalities, base models, or deployment
        settings.
    - line: Multi-agent research infrastructure and human-in-the-loop control
      what_it_solves: Making autonomous research inspectable and steerable via roles,
        dashboards, code harnesses, and rollback/resume control.
      what_remains_open: Standardized external validation across hardware, datasets,
        user settings, and beyond small internal case studies.
    consensus:
    - Current automated discovery systems can execute experiments, document analyses,
      and generate papers or task solutions, but their claims still lack consistent
      scientific rigor and external validity.
    - 'Evaluation is moving toward evidence-grounded auditing: blind tasks, frozen
      data, rubric-based judges, and human or peer baselines rather than leaderboard-style
      task completion alone.'
    - Across available results, agents are stronger at execution, auditability, and
      novelty than at controls, robustness, falsifiability, and cross-dataset generalization.
    - Reliability depends on verification gates or judges, and current gates or judges
      remain partially effective rather than fully trustworthy.
    disagreements:
    - 'Evaluation target differs: some work scores end-to-end manuscript generation
      and peer-review acceptance, while others score task completion, evidence maturity,
      or domain-specific discovery actions.'
    - Supervision and judgment differ across simulated LLM reviewers, VLM physics
      gates, fixed LLM judges, human expert judges, and real peer review, creating
      distinct validity assumptions.
    - Domain focus ranges from fluid dynamics and single-cell omics to general virtual
      environments and machine-learning case studies, so failure modes and metrics
      are not directly comparable.
    - 'Reproducibility evidence varies: some systems provide open-source code and
      artifacts, while others report limited internal case studies or omit limitation
      statements.'
    open_questions:
    - How well do automated judges, physics gates, and task-completion metrics predict
      human peer review or real-world scientific utility?
    - What evaluation design would require agents to demonstrate controls, robustness,
      falsifiable predictions, and cross-dataset generalization before claims are
      accepted?
    - How stable are current agent rankings and failure patterns across different
      base models, scientific domains, and deployment settings?
    - What governance checks are needed to prevent silent failures when an autonomous
      system writes or submits a paper that passes a narrow automated review but would
      not satisfy broader evidence standards?
