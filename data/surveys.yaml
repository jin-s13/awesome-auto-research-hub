  related_work_outline:
  - 'Mainstream direction: autonomous multi-agent systems that connect literature
    retrieval, synthesis, verification, and paper generation, with examples such as
    ReasFlow and EvoMaster.'
  - 'Shared research pattern: treating literature/science work as a long-horizon agentic
    pipeline and adding verification, self-critique, or knowledge retrieval before
    human inspection.'
  - 'Key differences: system builders optimize end-to-end workflow completion, while
    evaluation work measures evidence maturity through blind tasks, LLM judges, or
    human baselines; domain coverage ranges from general science to omics-specific
    data.'
  - 'Trend evolution: evidence from 2025-2026 shows a shift from survey/benchmark
    identification of challenges toward verification loops and self-evolving frameworks;
    the trend remains within the current frontier.'
  - 'Open questions: whether automated judges proxy real scientific judgment, how
    to maintain reliability over long horizons, and how to close the gap between fluent
    execution and trustworthy discovery.'
  related_work_outline_zh:
  - 主流方向：自主多智能体系统连接文献检索、综合、验证和论文生成，例如 ReasFlow 和 EvoMaster。
  - 研究共性：把文献/科学工作视为长程智能体流水线，并在人工检查前加入验证、自我批判或知识检索。
  - 关键差异：系统构建者优化端到端工作流完成，评测工作通过盲任务、LLM 裁判或人类基线衡量证据成熟度；领域覆盖从通用科学到组学数据。
  - 趋势演进：2025-2026 证据显示，从综述和基准识别挑战，转向验证循环与自演化框架；趋势仍处于当前前沿内。
  - 开放问题：自动裁判能否代理真实科学判断，长程可靠性如何维持，以及如何弥合流畅执行与可信发现之间的差距。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end multi-agent research workflow systems
      what_it_solves: unifies literature synthesis, knowledge retrieval, verification,
        derivation, experimentation, and manuscript generation into a single agentic
        pipeline
      what_remains_open: long-horizon reliability is not assured; reported success
        often rests on LLM-based review, and failures include implementation drift,
        memory degradation, and weak scientific taste
    - line: Evidence-grounded evaluation and benchmarks for discovery agents
      what_it_solves: makes open-ended scientific discovery comparable by hiding source
        conclusions, freezing data, and scoring evidentiary maturity or multiple-choice
        answers automatically against a fixed judge or human baseline
      what_remains_open: evaluation may not generalize across base models; LLM-judge
        validity and alignment with human judgment remain unestablished, and agents
        still lack controls, robustness, and falsifiability
    - line: Domain-specific AI scientist evaluation
      what_it_solves: measures AI scientist behavior on real domain data, such as
        single-cell transcriptomic annotation and published-study-derived questions,
        including a graduate-level human baseline
      what_remains_open: the gap to fully autonomous biological discovery remains
        large, and multiple-choice or annotation success may underrepresent open-ended
        discovery capability
    - line: Problem characterization and design principles
      what_it_solves: organizes agentic scientific discovery into capability categories,
        failure modes, evaluation metrics, and design guidance for more robust systems
      what_remains_open: there is no direct empirical evidence in the packet showing
        that following these design principles improves downstream discovery outcomes
        across tasks
    consensus:
    - Current LLM-based agents can execute and document analysis workflows competently
      and show potential for supporting scientific discovery.
    - Verification, human expert oversight, and evidence grounding remain necessary
      because autonomous end-to-end research is still unreliable.
    - Automated evaluation is needed to scale assessment, but it must be evidence-aware
      rather than only measuring surface fluency.
    - Literature review automation is repeatedly identified as a major unresolved
      bottleneck in agentic scientific workflows.
    disagreements:
    - 'Success is measured differently: end-to-end generated-paper quality under LLM
      review versus evidence maturity on blind discovery tasks versus domain-specific
      human-baseline question answering.'
    - Some work favors domain-agnostic self-evolving frameworks, while other work
      focuses on fixed domain-specific benchmarks with real data.
    - 'The primary evaluator differs across evidence: LLM rubric judges, hidden peer-review-derived
      outcomes, or graduate-level human baselines; the field has not agreed on one
      validity standard.'
    open_questions:
    - How can automated judges be validated when source conclusions are hidden and
      the target claim is open-ended?
    - Do higher LLM-judged paper scores correspond to real scientific utility or merely
      to plausible, well-documented execution?
    - What mechanisms can prevent implementation drift, memory degradation, and premature
      success declarations over long-horizon literature and research tasks?
    - How should evaluation cover cross-base-model generalization and diverse scientific
      domains without becoming narrow multiple-choice benchmarking?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端多智能体研究工作流系统
      解决的问题: 将文献综合、知识检索、验证、推导、实验和论文生成统一到一个智能体流水线中
      尚未覆盖: 长程可靠性尚未得到保证；报告的成功常依赖基于 LLM 的评审，且存在实现漂移、记忆退化和科学品味薄弱等失败
    - 路线: 面向发现智能体的证据锚定评测与基准
      解决的问题: 通过隐藏来源结论、冻结数据并自动对证据成熟度或选择题答案评分，使开放式科学发现可比较
      尚未覆盖: 评测可能无法跨基座模型泛化；LLM 裁判效度及其与人类判断的一致性尚未确立，智能体仍缺乏对照、稳健性和可证伪性
    - 路线: 领域专用 AI 科学家评测
      解决的问题: 在真实领域数据上衡量 AI 科学家行为，例如单细胞转录组注释和从已发表研究衍生的题目，并引入研究生水平人类基线
      尚未覆盖: 离完全自主生物学发现仍有很大差距，选择题或注释成功可能低估开放式发现能力
    - 路线: 问题表征与设计原则
      解决的问题: 将智能体科学发现组织为能力类别、失败模式、评测指标和更稳健系统的设计指导
      尚未覆盖: 证据包中尚无直接实证表明遵循这些设计原则能在各任务上提升下游发现效果
    共识:
    - 当前基于 LLM 的智能体能够熟练执行并记录分析工作流，并在支持科学发现方面显示出潜力。
    - 验证、人类专家监督和证据锚定仍然必要，因为端到端自主研究尚不可靠。
    - 自动化评测需要规模化，但应关注证据，而不是只衡量表面流畅性。
    - 文献综述自动化被反复认定为智能体科学工作流中的主要瓶颈。
    分歧:
    - 成功度量不同：LLM 评审下的端到端生成论文质量、盲发现任务的证据成熟度，或领域专用的人类基线问答。
    - 一些工作倾向领域无关的自演化框架，另一些工作聚焦真实数据的领域专用固定基准。
    - 主要评测者不同：LLM 评分标准、隐藏的同行评审来源结果或研究生水平人类基线；领域内尚未就一种效度标准达成一致。
    开放问题:
    - 当来源结论被隐藏且目标主张开放时，如何验证自动裁判？
    - LLM 评审下更高的论文分数是否对应真实科学效用，或只是合理且记录良好的执行？
    - 在长程文献和研究任务中，哪些机制能防止实现漂移、记忆退化和过早宣布成功？
    - 评测如何覆盖跨基座模型泛化和多样科学领域，而不沦为狭窄的选择题基准？
