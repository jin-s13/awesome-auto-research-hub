  - 关键差异：工作分为通用研究流水线、带物理/生物验证的领域特定AI科学家，以及基准/评测平台；监督模式和评测目标也不同。
  - 趋势演进：现有主要证据集中在2025-2026年，显示从综述和基准走向强调可靠性、自我纠正、人机协作和领域特定验证的系统，仍处于当前前沿。
