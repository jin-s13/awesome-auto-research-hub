  related_work_outline_zh:
  - 主流方向：构建闭环研究智能体，覆盖数据分析、文献搜索、假设生成、实验执行和可追溯报告，并加入可验证报告、结构化探索与人机监督。
  - 研究共性：围绕证据循环展开，从数据或文献生成候选假设，通过代码执行或基准评测验证，并保留来源和可靠性控制。
  - 关键差异：交互模式在完全自主与精准人机协作之间不同；搜索机制有树形/进化式与并行迭代之分；评测目标覆盖生物、方程、优化、预测等。
