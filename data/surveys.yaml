    - 领域验证门能否从已展示的CFD单配置修正推广到更多领域和任务？
    - 何种人类干预模式与频率能在不增加专家负担下最有效提升论文可靠性？
    - 实现漂移、记忆退化、训练数据偏置等失败模式如何在长周期写作中缓解？
    - 现有基准是否足以区分执行失败、验证失败和写作质量问题？
