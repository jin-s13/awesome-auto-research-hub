  related_work_outline_zh:
  - 主流方向：端到端大语言模型智能体，完成想法生成、代码实验、结果分析和论文撰写，并以大语言模型评审或同行评审作为评测信号；物理实验自动化在顶级证据中覆盖较弱。
  - 研究共性：闭环实验与迭代反馈，通过验证、检索、模拟评审或失败记忆来改进后续实验。
  - 关键差异：自主程度从人工监督到全自动不等；评测目标涵盖任务完成、论文接受、消融召回和 token 效率；编排与记忆机制不同。
  - 趋势演进：顶级证据集中在 2024-2026 年，从全自动科学发现走向树搜索、基准环境、交互式多智能体团队和失败感知记忆；进展仍集中在代码中心任务。
  - 开放问题：代理指标是否对应真实科研效用；可见证据中代码、数据集和局限性信息存在缺口；从代码、工作坊和偏微分方程案例向外泛化；物理实验自动化覆盖不足。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous experiment workflows
      what_it_solves: turns a research prompt or minimal hypothesis into runnable
        code, experiment execution, result analysis, and manuscript generation
      what_remains_open: reliability beyond selected code-centric domains; only one
        of three submissions passed peer review in the workshop-level evidence
    - line: Experiment planning and ablation benchmarks
      what_it_solves: makes automated proposal and review of experiment perturbations
        comparable through curated author/reviewer tasks and LLM-based judges
      what_remains_open: best LM recall remains around 45% and author/reviewer performance
        trends invert, so grounding assumptions are unresolved
    - line: Simulated discovery evaluation environments
      what_it_solves: provides controlled task suites and metrics for complete hypothesis-experiment-conclusion
        cycles
      what_remains_open: whether task completion and explanatory-knowledge metrics
        predict real scientific discovery remains unproven
    - line: Failure-aware experience memory
      what_it_solves: converts failed experiment attempts into retrievable records
        that downstream agents can adopt or reject, improving retry and cross-task
        performance with lower token use
      what_remains_open: evidence is limited to ScienceAgentBench and nonlinear PDE
        tasks; transfer to broader experimental domains is unverified
    - line: Interactive multi-agent orchestration and human oversight
      what_it_solves: decomposes research into roles, dashboards, retrieval, verification
        loops, and code harnesses to make autonomous research inspectable and controllable
      what_remains_open: limited internal case studies and early maturity; reproducibility
        signals are weaker in the available packet
    consensus:
    - LLM agents can complete hypothesis proposal, code implementation, experiment
      execution, result analysis, and paper writing in a closed loop, at least in
      constrained code-centric domains.
    - Automated evaluation is widely used as a scalable proxy signal, while peer review
      or human expert judgment remains the reference.
    - Current systems are stronger on code-centric tasks and have weaker evidence
      for physical or more open-ended experimentation.
    - Feedback mechanisms such as verification, retrieval, simulated review, or failure
      memory improve later experiment iterations.
    disagreements:
    - 'Autonomy level differs: some systems pursue full automation, while others keep
      human inspection, monitoring, and rollback.'
    - 'Evaluation target differs: complete discovery tasks, paper acceptance, manuscript
      quality, ablation recall, or token efficiency are used as separate success criteria.'
    - 'Orchestration differs: single-agent pipelines, tree search, multi-agent roles,
      failure-curated shared memory, and dashboard-controlled teams coexist.'
    - 'Evidence design differs: simulated environments assess task completion, while
      empirical research benchmarks assess missing-ablation identification; these
      settings are not yet unified.'
    open_questions:
    - Do simulated task completion and LLM-based review scores align with real scientific
      reproducibility or impact?
    - Can failure-aware memory transfer from ScienceAgentBench and nonlinear PDE tasks
      to other experiment types?
    - Why does chain-of-thought prompting outperform the agent-based setup on ablation
      planning, and why do author and reviewer task performances show inverse trends?
    - Can fully automated workshop-level paper acceptance scale to conference-level,
      multidisciplinary, or physical lab experiments?
    - The visible packet lacks code, dataset, and limitation details for several high-ranked
      works, leaving reproducibility boundaries unverified.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主实验工作流
      解决的问题: 把研究提示或最小假设转化为可运行代码、实验执行、结果分析和论文生成
      尚未覆盖: 超出所选代码中心领域后的可靠性；现有工作坊级证据中三篇投稿仅一篇通过同行评审
    - 路线: 实验规划与消融基准
      解决的问题: 通过作者/审稿人消融任务和大语言模型评判器，使自动提出与审查实验扰动变得可比较
      尚未覆盖: 最佳大语言模型平均召回率约45%，且作者/审稿人性能趋势相反，模型基础假设未解决
    - 路线: 模拟发现评测环境
      解决的问题: 提供受控任务套件和指标，覆盖假设-实验-结论完整周期
      尚未覆盖: 任务完成度和解释性知识指标是否预测真实科学发现仍未被证明
    - 路线: 失败感知经验记忆
      解决的问题: 把失败实验尝试转化为下游智能体可采纳或拒绝的记录，提升重试和跨任务表现并降低 token 使用
      尚未覆盖: 证据限于 ScienceAgentBench 与非线性偏微分方程任务；向更广泛实验类型的迁移未验证
    - 路线: 交互式多智能体编排与人类监督
      解决的问题: 将研究分解为角色、仪表板、检索、验证循环和代码工具，使自主研究可检查、可回滚
      尚未覆盖: 案例研究有限且平台尚属早期；可见包中可复现信号较弱
    共识:
    - 大语言模型智能体可以完成假设提出、代码实现、实验运行、结果分析和论文撰写的闭环，至少在受限代码领域中成立。
    - 自动评测被广泛用作可扩展代理信号，但同行评审或人类专家仍是最终参照。
    - 当前系统在代码中心任务上更强，在物理实验或更开放场景中的证据不足。
    - 验证、检索、模拟评审或失败记忆等反馈机制有助于改进后续实验迭代。
    分歧:
    - 自主程度不同：部分系统追求全自动，部分系统保留人类检查、监控和回滚。
    - 评测目标不同：完整发现任务、论文接受、论文撰写质量、消融召回或 token 效率被分别作为成功标准。
    - 编排方式不同：单智能体流水线、树搜索、多智能体角色、失败策展共享记忆与仪表板控制团队并存。
    - 证据设计不同：模拟环境评测任务完成度，实证研究基准评测缺失消融识别，两类证据尚未统一。
    开放问题:
    - 模拟任务完成和大语言模型评审分数与实际科研可复现性或影响力之间的一致性仍缺乏证据。
    - 失败感知记忆能否从 ScienceAgentBench 和非线性偏微分方程迁移到其他实验类型？
    - 为何思维链在消融规划上优于智能体设置，且作者与审稿人任务性能趋势相反？
    - 全自动工作坊级论文接受是否能扩展到会议级、多学科和物理实验场景？
    - 可见证据包中多项高排名工作缺少代码、数据集和局限性细节，可复现性边界不明。
