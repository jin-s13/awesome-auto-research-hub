  literature_review:
    line_of_work_matrix:
    - line: End-to-end discovery-loop automation (e.g., The AI Scientist-v2)
      what_it_solves: Turns research ideas into code execution, experiment analysis,
        manuscript writing, and iterative revision inside a single agentic loop.
      what_remains_open: Success is inconsistent and mostly demonstrated in workshop-level
        or narrow domain outputs; one of three submissions passed peer review, and
        external replication remains unproven.
    - line: Discovery-task evaluation and benchmarking (e.g., DISCOVERYWORLD)
      what_it_solves: Provides virtual environments, challenge tasks, and automatic
        metrics for comparing hypothesis formation, experiment execution, and discovery
        behavior.
      what_remains_open: Strong baselines struggle on most discovery tasks, but it
        is unclear whether virtual task metrics transfer to real lab or code-based
        experimental utility.
    - line: Automated verification, review, and ablation planning (e.g., ReasFlow,
        AblationBench)
      what_it_solves: Audits logical or empirical completeness through internal verification
        loops, LLM-based review, and missing-ablation identification.
      what_remains_open: Current language models identify only 45 percent of original
        ablations on average, and author-versus-reviewer task performance shows inverse
        trends.
    - line: Failure-aware memory and self-improvement (e.g., Negative Knowledge as
        Failure-aware Shared Memory)
      what_it_solves: Converts failed attempts into reusable negative knowledge records,
        reducing repeated trial-and-error and token usage in scientific research agents.
      what_remains_open: Evidence is limited to ScienceAgentBench retry and PDE research
        transfer; generality across broader experiment types and disciplines is unknown.
    - line: Interactive multi-agent research infrastructure (e.g., Claw AI Lab)
      what_it_solves: Packages customizable multi-agent teams, dashboards, rollback
        or resume control, and code harnesses into a human-supervised research platform.
      what_remains_open: The platform is an early step evaluated on only five internal
        AI case studies, so standardized external validation across codebases, datasets,
        and users is missing.
    consensus:
    - Research automation is decomposed into multi-step agent workflows covering hypothesis
      or idea generation, code or experiment execution, result analysis, and reporting
      or review.
    - Automatic feedback loops are treated as central, using LLM judges, rubric scores,
      or task completion metrics to drive iterative improvement.
    - Current systems remain below human-level on complex scientific tasks such as
      discovery and ablation planning, with strong baselines still failing on harder
      benchmarks.
    - Failure records, knowledge retrieval, reviewer feedback, or tree search are
      used as mechanisms for reducing errors and improving generated research artifacts.
    - Visible evidence for code, datasets, baselines, and limitations is uneven, so
      reproducibility and external verification remain open verification gaps.
    disagreements:
    - 'Automation scope differs: full manuscript or theorem-oriented discovery, task-based
      experimental design, and interactive team support are separate emphases.'
    - 'Evaluation target differs: peer-review acceptance, virtual task completion,
      internal LLM rubric scoring, and expert preference judgments are not interchangeable.'
    - 'Interaction mode differs: some systems run fully autonomous loops, while others
      require human principal-investigator oversight, dashboard monitoring, or rollback
      and resume control.'
    - 'Corrective mechanism differs: negative memory of failures, knowledge retrieval,
      reviewer feedback, and agentic tree search each address error correction differently.'
    - 'Generalization evidence differs: mathematical PDE research, machine learning
      empirical research, and broad virtual science topics are evaluated under different
      assumptions.'
    open_questions:
    - Can end-to-end systems move beyond one-of-three workshop acceptance to stable,
      externally replicable peer-reviewed results across domains?
    - How can ablation planning reach human-level recall and resolve the inverse author-versus-reviewer
      performance pattern?
    - Does failure-aware memory transfer beyond ScienceAgentBench and PDE tasks to
      real laboratory protocols or broader combinatorial experiment spaces?
    - Are LLM-based judges and virtual task metrics aligned with actual human scientific
      utility, or only with proxy scoring behavior?
    - How can virtual discovery benchmarks be connected to standardized real-world
      code and lab automation validation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端发现循环自动化（如 The AI Scientist-v2）
      解决的问题: 把研究想法转化为代码执行、实验分析、论文写作和迭代修改的闭环。
      尚未覆盖: 成功不稳定，主要在工作坊级或窄领域输出中演示；三篇中仅一篇通过同行评审，外部复现仍不明确。
    - 路线: 发现任务评测与基准设计（如 DISCOVERYWORLD）
      解决的问题: 提供虚拟环境、挑战任务和自动指标，比较假设形成、实验执行和发现行为。
      尚未覆盖: 强基线在多数发现任务上表现困难，但虚拟任务指标能否迁移到真实实验室或代码实验效用尚不清楚。
    - 路线: 自动验证、评审与消融规划（如 ReasFlow、AblationBench）
      解决的问题: 通过内部验证循环、LLM评审和缺失消融识别审计逻辑或实证完整性。
      尚未覆盖: 当前语言模型平均只识别出45%的原始消融，且作者任务与审稿人任务性能呈反向趋势。
    - 路线: 失败感知记忆与自我改进（如 Negative Knowledge as Failure-aware Shared Memory）
      解决的问题: 把失败尝试转换为可复用的负知识记录，减少重复试错并降低 token 使用。
      尚未覆盖: 证据集中在 ScienceAgentBench 重试和 PDE 研究迁移，更广泛实验类型与跨学科泛化仍未知。
    - 路线: 交互式多智能体研究基础设施（如 Claw AI Lab）
      解决的问题: 把可定制多智能体团队、仪表板、回滚或恢复控制和代码工具打包为有人监督的研究平台。
      尚未覆盖: 平台属于早期阶段，仅在五个内部 AI 案例上评估，缺少跨代码库、数据集和用户的标准化外部验证。
    共识:
    - 研究自动化被拆解为多步智能体工作流，覆盖假设或想法生成、代码或实验执行、结果分析和报告或评审输出。
    - 自动反馈循环被视为核心设计，使用 LLM 评审、评分标准或任务完成度来驱动迭代改进。
    - 当前系统在科学发现和消融规划等复杂任务上仍低于人类水平，强基线在更难的基准上也会失败。
    - 失败记录、知识检索、评审反馈或树搜索被普遍用作减少错误和提升研究成果质量的机制。
    - 可见证据中代码、数据集、基线和局限性披露不完整，可复现性与外部验证仍是验证缺口。
    分歧:
    - 自动化范围不同：完整论文或定理导向发现、任务化实验设计和交互式团队支持各有侧重。
    - 评测目标不同：同行评审接受、虚拟任务完成、内部 LLM 评分和专家偏好判断不能互相替代。
    - 交互模式不同：全自主循环与人类负责人监督、仪表板监控或回滚恢复形成不同控制层级。
    - 纠错机制不同：失败负记忆、知识检索、评审反馈和智能体树搜索分别承担不同的错误修正方式。
    - 泛化证据不同：数学 PDE 研究、机器学习实证研究和宽口径虚拟科学任务基于不同假设进行评估。
    开放问题:
    - 端到端系统能否从三篇中一篇通过工作坊评审，发展为跨领域稳定且可外部复现的同行评审结果？
    - 如何把消融规划提升到人类水平，并解释作者任务与审稿人任务之间的反向表现？
    - 失败感知记忆能否从 ScienceAgentBench 和 PDE 任务迁移到真实实验室流程或更复杂的组合实验空间？
    - LLM 评审和虚拟任务指标是与真实人类科研效用一致，还是只与代理评分行为一致？
    - 如何把虚拟发现基准与标准化的真实代码和实验室自动化验证连接起来？
