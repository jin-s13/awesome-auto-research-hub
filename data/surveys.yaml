  related_work_outline_zh:
  - 主流方向：构建全自动管道，自主生成研究想法、编写实验代码、执行并分析结果、撰写完整论文，并通过内部验证、树搜索或多智能体辩论等方式迭代改进。
  - 研究共性：所有系统都围绕大语言模型构建智能体循环，交替进行假设生成、实验执行，并通过反馈机制（自动评审、内部验证器或失败记忆）优化输出。
