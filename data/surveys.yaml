  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现与实验流水线
      解决的问题: 覆盖从想法生成、代码/实验执行、分析、可视化到论文起草和自动评审的完整过程。
      尚未覆盖: 结果一致性和深度仍限于工作坊级别或狭义案例；部分系统依赖领域特定模板或代码案例，真实实验室集成证据有限。
    - 路线: 面向发现智能体的评测环境与任务基准
      解决的问题: 以标准化任务、难度级别、任务完成/动作/知识指标，以及真实世界基准套件来比较智能体与已发表基线。
      尚未覆盖: 代理指标与LLM/专家提示可能无法反映真正发现效用；当前覆盖偏重代码型模拟ML和数学任务，而非物理实验室自动化。
    - 路线: 失败感知记忆与经验复用
      解决的问题: 记录有类型的负面结果，并让下游智能体采纳或拒绝过去失败，以提升效率并跨相关科学任务迁移。
      尚未覆盖: 证据仅限于ScienceAgentBench和PDE任务；跨多种失败类型、领域和长程发现的规模化尚未验证。
    - 路线: 交互式多智能体研究平台与可复现代码工具链
      解决的问题: 把孤立研究智能体转化为可运行、可监控、可定制的环境，连接本地代码库、数据集、检查点和执行工件。
      尚未覆盖: 外部验证仅限于少量内部AI案例；跨硬件、数据集和用户设置的标准化可复现性尚未展示。
    - 路线: 验证与知识驱动的推理回路
      解决的问题: 审计逻辑一致性、在人工检查前纠正错误，并检索陈述性事实与过程性启发，以支持推理密集型实验和写作。
      尚未覆盖: 评测依赖精选LLM评审标准和生成论文；缺少验证能改善真实实验结果的直接证据。
    共识:
    - 基于LLM的研究智能体正被组织为包含假设形成、实验执行、分析和论文撰写的多步骤循环。
    - 自动评测成为核心环节，采用自动审稿人、任务完成指标或专家偏好对生成结果进行打分。
    - 记忆、验证、代码工具链和多智能体角色分工等模块被用于提升可靠性、复用经验并减少人工干预。
    - 可复现性与外部验证仍是开放问题；报告的成功常依赖窄基准、内部案例或LLM评审标准，而非多样真实证据。
    分歧:
    - 评测目标不同：一些路线优化生成论文质量与同行评审接受，另一些优化科学ML任务中的基准改进或任务完成。
    - 监督方式不同：部分系统以最少人工干预端到端运行，另一些强调交互式监控、回滚/恢复和人在回路控制。
    - 任务与领域设置不同：模拟文本环境、应用数学论文生成和真实代码/ML基准测试不同能力，结果难以比较。
    - 对进展的解释不同：一类报告基准增益但主要归因于ML工程技巧，另一类声称更深的验证和知识驱动推理，却未清楚区分洞察与工程。
    开放问题:
    - 当前评测指标能否区分实验自动化中的研究洞察与参数/代码工程技巧？
    - LLM评审标准和任务完成分数是否与人类同行评审判断及真实科学效用一致？
    - 系统能否从窄代码型或模拟发现任务迁移到物理实验室实验和更广泛科学领域？
    - 失败感知记忆和验证回路如何在多样失败模式下扩展，而不引入脆弱的类型记录或昂贵策展？
    - 随着自主实验更加开放式，需要哪些最低限度的人类监督与安全约束？
