  literature_review:
    line_of_work_matrix:
    - line: Autonomous discovery workflow systems
      what_it_solves: 'Turning LLM-generated hypotheses into complete loops: code
        implementation, experiments, visualization, manuscript writing, and simulated
        or real peer review.'
      what_remains_open: Reliability is uneven across submissions and domains; validation
        often remains single-domain, workshop-level, or dependent on limitation details
        that are not fully visible in the evidence.
    - line: Benchmark and task-environment design
      what_it_solves: Providing controlled task suites, hidden conclusions, frozen
        data, metrics, and human baselines for comparable evaluation of discovery
        agents.
      what_remains_open: Domain and task-format coverage is limited; LLM judges and
        proxy metrics may not align with expert scientific utility, and generalizability
        across base models is unverified.
    - line: Reliability gates and authority control
      what_it_solves: Constraining autonomous edits or validating generated results
        through deterministic program authorities, physics-aware visual gates, and
        evidence audits.
      what_remains_open: Silent failure detection remains incomplete, such as a vision-language
        gate missing 2 of 16 planted failures; autonomy-authority tradeoffs across
        domains are unresolved.
    - line: Evidence-maturity and epistemic evaluation
      what_it_solves: Scoring generated scientific claims along dimensions such as
        controls, robustness, falsifiability, auditability, novelty, and cross-dataset
        generalization.
      what_remains_open: Current agents plateau around executing and documenting analyses
        but lack discriminating evidence practices; only one frozen base model is
        tested, leaving generalization as an evidence gap.
    consensus:
    - Automated research should be evaluated as an end-to-end workflow, not only as
      final model outputs.
    - Current agents can implement and document analyses, but still lack the controls,
      robustness, and falsifiability needed for trustworthy claims.
    - Automated judging or simulated review is a scalable direction, but its consistency
      and alignment with expert judgment remain open.
    - Domain-specific reliability mechanisms, such as validity gates or deterministic
      authority separation, help reduce silent failures and unsafe modifications.
    disagreements:
    - 'Evaluation settings differ: virtual discovery environments with completion
      metrics versus real domain workflows with physical, biological, or forecasting
      outcomes.'
    - 'Reliability enforcement differs: deterministic code-edit and promotion control
      versus vision-language physical verification versus post hoc LLM evidence grading.'
    - 'Success is defined by different standards: peer-review acceptance, benchmark
      score, evidence maturity, or task-specific performance gain.'
    - 'Generalization claims differ: some systems claim cross-domain ML generality,
      while others are validated in one physical, biological, or forecasting domain.'
    open_questions:
    - Do benchmark scores from one frozen base model transfer across other base models
      and agent frameworks?
    - Can automated validity gates and authority controls detect enough silent failures
      to support trustworthy autonomous discovery?
    - Can agents move beyond analysis documentation to produce controls, robustness
      checks, falsifiability tests, and cross-dataset generalization?
    - How well do automated LLM judges and simulated peer review align with human
      expert judgment outside the narrow tasks reported?
    - Are domain-specific improvements such as physics error reduction or forecasting
      gains evidence of general discovery ability or task-specific adaptation?
    - Several top papers lack fully visible limitation or artifact details, so reproducibility
      and failure boundaries remain verification gaps rather than confirmed properties.
