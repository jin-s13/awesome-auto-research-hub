  related_work_outline_zh:
  - 主流方向：端到端自主科研写作系统，将文献构思、实验执行、验证与论文撰写整合到单一智能体流水线。
  - 研究共性：多智能体或树搜索流程显式加入验证、自我纠正和报告门控，以抑制伪造结果与静默失败。
  - 关键差异：自主程度与人机干预设计不同；验证方式包括逻辑审计、物理感知视觉门控或实测值报告；评测领域、基准和工件开放性各异。
  - 趋势演进：2024至2026前沿期内，研究从通用自动论文生成转向领域特定可靠性、目标化人机协作和失败感知自纠正。
  - 开放问题：稳定通过完整会议评审、LLM评审标准与人类同行评审的一致性、跨领域验证信号、最佳人工监督位置及外部可复现验证。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research writing agents
      what_it_solves: Generating research ideas, code, experiments, visualizations,
        and full manuscripts with minimal human prompting while embedding writing
        in the research loop.
      what_remains_open: Stable cross-domain evidence for full conference-level acceptance
        is missing; current proof is often one accepted workshop paper, one benchmark
        gain, or one completed attempt out of several.
    - line: Verification and self-correction in reporting
      what_it_solves: Reducing hallucinated claims, fabricated numbers, invalid results,
        or silent experimental failures before manuscript writing.
      what_remains_open: Verification gate coverage is incomplete; a physics-aware
        gate missed planted failures, and logical or factual audits lack cross-domain
        validation.
    - line: Human-AI collaborative scientific writing
      what_it_solves: Integrating expert oversight at high-leverage decision points
        while retaining autonomous literature synthesis, coding, and drafting.
      what_remains_open: Optimal intervention granularity and transferability outside
        curated pipelines remain unresolved; evidence is mainly from ablations and
        a benchmark setting.
    - line: Evaluation and evidence design for AI writing systems
      what_it_solves: Comparing systems through benchmarks, LLM review rubrics, artifact
        quality, and limited peer-review outcomes.
      what_remains_open: Alignment between proxy scores, workshop acceptance, and
        full human peer review is unclear; several citation, metric, and baseline
        details are missing.
    - line: Reproducible infrastructure and failure analysis
      what_it_solves: Documenting failure modes and providing runnable open-source
        agents or design principles for more robust research communication.
      what_remains_open: Standardized external validation across hardware, domains,
        and user settings is absent, and code, dataset, and artifact completeness
        vary.
    consensus:
    - Systems treat manuscript generation as the final stage of an integrated research
      loop rather than a standalone text-generation task.
    - Verification, self-correction, and measured-value reporting are becoming core
      requirements for trustworthy autonomous scientific writing.
    - Targeted human collaboration can improve outcomes compared with fully autonomous
      pipelines or exhaustive oversight, based on ablation evidence.
    - LLM-based review rubrics and artifact-quality scores are common evaluation proxies,
      but their relation to human peer review remains under-specified.
    disagreements:
    - Autonomy design differs from fully automated systems to seven-mode human intervention
      or human-as-principal-investigator collaboration.
    - 'Verification signals differ: logical coherence audits, vision-language physical
      validity checks, and reporting constraints that restrict drafts to measured
      values.'
    - Evaluation targets differ across applied mathematics, computational fluid dynamics,
      general machine learning, workshop peer review, and experiment-stage benchmarks.
    - Some systems emphasize domain-specific execution and verification gates, while
      others pursue general-purpose research writing with self-healing execution or
      tree search.
    - 'Reported maturity differs: one workshop acceptance, one benchmark improvement,
      or one-of-four pipeline completion, with no full conference-level consensus.'
    open_questions:
    - How can full conference-level scientific writing be made consistent when current
      evidence shows only partial acceptance or benchmark-specific gains?
    - What verification evidence is required in disciplines without visual or formal
      correctness checks, and how should missed silent failures be handled?
    - How well do LLM-based review scores and workshop acceptance predict long-term
      scientific value or human peer-review decisions?
    - What is the optimal point for expert intervention in autonomous research writing,
      given evidence that targeted collaboration can outperform exhaustive oversight?
    - Which missing artifacts, baselines, datasets, and external validations prevent
      reproducible comparison across systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究写作智能体
      解决的问题: 在较少人工提示下生成研究想法、代码、实验、可视化和完整论文，把写作嵌入研究闭环。
      尚未覆盖: 目前多为孤立成功、工作坊级证明或基准增益，稳定通过完整会议评审的跨领域一致性尚不明确。
    - 路线: 报告中的验证与自我纠正
      解决的问题: 减少幻觉声明、伪造数字、无效结果或静默实验失败，在论文撰写前进行纠错。
      尚未覆盖: 验证门控覆盖不完整；物理感知门控会漏检植入失败，逻辑与事实审计尚缺跨领域验证。
    - 路线: 人机协作科研写作
      解决的问题: 在保留文献综合、编码和草稿自主性的同时，在高杠杆决策点引入专家监督。
      尚未覆盖: 最佳干预粒度和迁移性仍未确定；目标化协作是否适用于基准外场景仍需外部验证。
    - 路线: AI写作系统的评测与证据设计
      解决的问题: 通过基准、LLM评审标准、工件质量和有限同行评审结果比较系统，提供可比性证据。
      尚未覆盖: 代理指标、工作坊接收与完整人类同行评审之间的一致性；许多引用证据和度量细节缺失。
    - 路线: 可复现基础设施与失败分析
      解决的问题: 记录失败模式，并提供可运行的开源智能体或设计原则，以增强研究沟通的鲁棒性。
      尚未覆盖: 跨硬件、领域和用户设置的外部验证不足；代码、数据集、基线和工件完整性仍有验证缺口。
    共识:
    - 各系统把论文写作作为研究闭环的最终阶段，而非独立文本生成任务。
    - 验证、自我纠正和基于实测值的报告正成为可信自主科研写作的核心要求。
    - 消融证据显示，在高杠杆决策点引入目标化人工协作可优于完全自主或逐步监督。
    - LLM评审标准和工件质量分数常被用作评测代理，但它们与人类同行评审的关系仍未充分说明。
    分歧:
    - 自主程度不同：完全自主、七种人机干预模式，或人类作为首席研究员、智能体作为研究生的协作范式并存。
    - 验证信号不同：逻辑一致性审计、基于视觉语言的物理有效性检查，以及将草稿约束为实测值的报告机制各有取舍。
    - 评测目标不同：涵盖应用数学、计算流体动力学、通用机器学习、工作坊同行评审和实验阶段基准。
    - 有的工作侧重领域特定执行与验证门控，有的追求通用研究写作并结合自愈执行或树搜索。
    - 成熟度证据不同：一个工作坊接收、一个基准提升或四次尝试中一次完成，尚未形成完整会议级共识。
    开放问题:
    - 当前证据仅显示部分接受或基准特定增益，如何稳定实现完整会议级科研写作？
    - 在缺少视觉或形式化正确性检查的学科中，需要哪些验证证据，又该如何处理漏检的静默失败？
    - LLM评审分数和工作坊接收能在多大程度上预测长期科学价值与人类同行评审结果？
    - 自主研究写作中专家介入的最佳位置是什么，如何从精准协作优于完全自主的证据中推导可迁移准则？
    - 缺少的代码、数据集、基线和外部验证会如何限制系统间的可复现比较？
