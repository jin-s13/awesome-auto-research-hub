  related_work_outline_zh:
  - 主流方向：以LLM为基础的完全或半自主研究工作流，从草拟扩展到创意生成、代码执行、验证和完整论文撰写。
  - 研究共性：多智能体流水线将文献支撑的构思、实验执行、自我验证和论文撰写组合起来，并以LLM或同行式评审评价质量。
  - 关键差异：自主程度、人类介入位置、验证信号、领域范围，以及基准成功率、工件质量或接受度等评测目标不同。
  - 趋势演进：可得高相关证据集中在2024-2026年，主线从通用端到端论文生成走向具备物理/逻辑门控、自我纠正、失败归因和精准人机协作的领域专用系统。
