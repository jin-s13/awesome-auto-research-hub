  related_work_outline:
  - 'Mainstream direction: Building autonomous AI agent systems that perform end-to-end
    scientific research loops—hypothesis generation, experiment execution, and result
    reporting—often with structured multi-agent or multi-step workflows.'
  - 'Shared research pattern: Use of iterative refinement through failure-driven self-correction,
    multi-hypothesis attribution, or self-evolution, combined with domain-specific
    verification gates (physics-aware, formal proof) to enforce validity.'
  - 'Key differences: Systems vary in the level of human collaboration (full autonomy
    versus targeted human-in-the-loop), the reliance on formal verification versus
    empirical validation, and whether they are domain-agnostic platforms or specialized
    for disciplines like CFD, causal inference, or omics.'
  - 'Trend evolution: From 2025 to 2026, the frontier moved from benchmarking and
    survey taxonomies to self-improving frameworks and open-source platforms, with
    a shift toward formal grounding and scalable multi-agent architectures.'
  - 'Open questions: Fully autonomous scientific writing and conference-ready paper
    generation remain unsolved; the gap between formal or empirical verification and
    real scientific utility is not yet closed; and cross-domain generalization of
    AI scientist agents is untested.'
  related_work_outline_zh:
  - 主流方向：构建能够完成假设生成、实验执行和结果报告全流程的自主AI智能体，通常采用结构化多智能体或多步骤工作流。
  - 研究共性：通过失败驱动的自我纠正、多假设归因或自我演化进行迭代改进，并结合领域特定的验证门控（物理感知、形式化证明）以确保有效性。
  - 关键差异：系统在人机协作程度（完全自主 vs 精准人机回环）、验证方式（形式化证明 vs 经验验证）以及领域通用性（平台化 vs 专注CFD、因果推断、组学等）上存在差异。
  - 趋势演进：2025至2026年间，前沿从基准测试和综述分类转向自我改进框架和开源平台，出现了形式化基础和可扩展多智能体架构的趋势。
  - 开放问题：完全自主的科学写作与可投稿论文生成仍未解决；形式化/经验验证与真实科学效用之间的鸿沟尚未弥合；AI科学家智能体的跨领域泛化能力未经检验。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned control and planning
      what_it_solves: Connects hypothesis generation, experiment design, and execution
        in a closed loop, enabling agents to plan interventions, react to experimental
        outcomes, and improve decision quality over cycles.
      what_remains_open: Whether the improvement stems from the agent's planning logic
        rather than the underlying LLM or task-specific priors, and how well the loop
        handles distributional shifts outside the training domain.
    - line: Evaluation and evidence design
      what_it_solves: Provides standardized benchmarks (e.g., ARC-Bench, BAISBench)
        with tasks, metrics, and human baselines to make claims about AI scientist
        capabilities comparable and to surface failure modes.
      what_remains_open: Coverage of diverse scientific domains and alignment between
        proxy metrics (benchmark scores) and real-world scientific discovery utility
        remain limited.
    - line: Systems and reproducible infrastructure
      what_it_solves: Turns isolated research agents into runnable, customizable platforms
        (e.g., multi-agent laboratories, code harnesses) with artifacts, monitoring,
        and reusable workflows, lowering the barrier to build and reproduce AI scientist
        experiments.
      what_remains_open: Standardized external validation across hardware, datasets,
        and user settings is missing; most platforms are evaluated only on internal
        case studies.
    - line: Conceptual taxonomy and theory
      what_it_solves: Organizes fragmented AI scientist systems into categories (literature
        review, hypothesis generation, experimentation, analysis) and identifies common
        challenges, metrics, and frameworks, enabling a structured understanding of
        the field.
      what_remains_open: The proposed taxonomies lack direct empirical validation
        that the categories predict agent behavior, and the field still lacks a unified
        theoretical framework for autonomous scientific reasoning.
    consensus:
    - Reliable scientific discovery requires structured verification beyond raw LLM
      outputs; all systems incorporate some form of validity gate or verification
      step.
    - Multi-agent or modular architectures are the dominant design pattern for decomposing
      the research workflow into manageable sub-tasks (e.g., ideation, execution,
      analysis).
    - Current AI scientist agents are not yet capable of fully autonomous, end-to-end
      conference-ready paper generation; human intervention or collaboration remains
      necessary for quality and correctness.
    disagreements:
    - 'The role of formal verification: some systems rely on machine-checked proofs
      and statement audits, while others depend on empirical validation or vision-language
      gates, creating a divide between formal and data-driven verification.'
    - 'Human collaboration mode: approaches range from fully autonomous execution
      to targeted human-in-the-loop at high-leverage decision points, with no consensus
      on the optimal level or timing of human involvement.'
    - 'Domain specificity: some works are domain-agnostic foundational frameworks,
      while others are tightly integrated with domain-specific tools and physics models,
      raising a tension between generality and depth.'
    open_questions:
    - How can we close the gap between formal or empirical verification and the actual
      scientific value of generated hypotheses?
    - To what extent do improvements in benchmark scores translate to more effective
      AI scientists in real-world labs?
    - What are the failure modes of self-evolving agents when they operate outside
      the distribution of tasks seen during their design and evaluation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件控制与规划
      解决的问题: 将假设生成、实验设计与执行连接成闭环，使智能体能够规划干预、响应实验结果并在循环中提升决策质量。
      尚未覆盖: 性能提升是否源于智能体的规划逻辑而非底层LLM或任务先验，以及该闭环在训练域外分布偏移时的鲁棒性。
    - 路线: 评测与证据设计
      解决的问题: 提供标准化基准（如ARC-Bench、BAISBench），通过任务、指标和人类基线使AI科学家能力的主张具有可比性，并揭示失败模式。
      尚未覆盖: 对多样化科学领域的覆盖以及代理指标（基准分数）与真实科学发现效用之间的一致性仍然有限。
    - 路线: 系统与可复现基础设施
      解决的问题: 将孤立的智能体转变为可运行、可定制的平台（如多智能体实验室、代码工具），提供工件、监控和可复用工作流，降低构建和复现AI科学家实验的门槛。
      尚未覆盖: 缺乏跨硬件、数据集和用户设置的标准化外部验证；大多数平台仅基于内部案例研究进行评估。
    - 路线: 概念分类与理论
      解决的问题: 将碎片化的AI科学家系统组织为类别（文献综述、假设生成、实验、分析），识别共同挑战、指标和框架，形成对领域的结构化理解。
      尚未覆盖: 所提出的分类法缺乏直接实证验证以证明这些类别能预测智能体行为；领域仍缺乏统一的自主科学推理理论框架。
    共识:
    - 可靠的科学发现需要超越原始LLM输出的结构化验证；所有系统都包含某种形式的有效性门控或验证步骤。
    - 多智能体或模块化架构是分解研究工作流为可管理子任务（如构思、执行、分析）的主流设计模式。
    - 当前的AI科学家智能体尚不具备完全自主、端到端生成可投稿会议论文的能力；为保证质量和正确性，人工干预或协作仍不可或缺。
    分歧:
    - 形式化验证的角色：部分系统依赖机器验证的证明和陈述审计，而其他系统依赖经验验证或视觉-语言门控，形成形式化与数据驱动验证之间的分歧。
    - 人机协作模式：方法涵盖从完全自主执行到在高杠杆决策点精准引入人机回环，对人工介入的最佳程度和时机尚无共识。
    - 领域特异性：部分工作是领域无关的基础框架，而其他工作则与领域特定工具和物理模型紧密集成，形成通用性与深度之间的权衡。
    开放问题:
