  related_work_outline_zh:
  - 主流方向：利用大语言模型（LLM）多智能体系统构建端到端自主研究智能体，实现从假设生成、实验设计、执行、分析到论文撰写的全流程科学发现自动化。
  - 研究共性：多数系统将研究工作流分解为多个专用LLM智能体，它们与共享环境或记忆交互，并通过模拟评审、任务完成基准或真实同行评审来评估性能。
