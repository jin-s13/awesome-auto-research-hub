      and the agent as a graduate student, while other systems pursue fully autonomous
      open-ended discovery.'
    - 'Definitions of success differ: reviewer/rubric thresholds, paper acceptance,
      domain-error reduction, task completion, and evidence maturity are used as targets
      and are not interchangeable.'
    - Deployment settings differ, ranging from general machine-learning paper generation
      and virtual discovery tasks to domain-specific simulation in computational fluid
      dynamics and applied mathematics.
    - 'Evaluation strictness differs: one direction treats automated or peer review
      acceptance as the milestone, while another emphasizes blind reanalysis tasks
      where agents plateau and lack discriminating scientific acts.'
