  literature_review:
    line_of_work_matrix:
    - line: 'End-to-end autonomous research pipelines (examples: The AI Scientist,
        AI Scientist-v2, ReasFlow)'
      what_it_solves: 'Automating the full idea-to-paper loop: hypothesis formation,
        code execution, experiment analysis, visualization, and manuscript drafting
        with internal verification or simulated review.'
      what_remains_open: 'Reliability is inconsistent: only one of three AI Scientist-v2
        submissions passed peer review, and evaluation often relies on automated review
        rather than independent human validation.'
    - line: 'Virtual discovery environments and standardized benchmarks (example:
        DISCOVERYWORLD)'
      what_it_solves: Benchmarking complete discovery cycles across diverse science
        tasks with task completion, action, and explanatory-knowledge metrics.
      what_remains_open: Strong prior-environment agents still struggle, and the translation
        from simulated task metrics to real-world discovery utility is not yet established.
    - line: 'Interactive multi-agent research platforms (example: Claw AI Lab)'
      what_it_solves: Customizable role-based research teams, real-time monitoring,
        rollback/resume, and integration of local code, data, and checkpoints into
        runnable experiments.
      what_remains_open: Evidence is limited to five internal case studies with expert
        preference judgments; platform maturity and external generalization remain
        unproven.
    - line: 'Failure-aware memory and negative knowledge (example: Negative Knowledge
        as Failure-aware Shared Memory)'
      what_it_solves: Converting failed attempts into typed shared records that downstream
        agents can adopt or reject, improving retry performance and cross-task transfer
        with fewer tokens.
      what_remains_open: Demonstrated mainly on ScienceAgentBench and PDE tasks; broader
        domain generality, memory quality control, and longer-term benefit are unresolved.
    - line: 'In-the-wild scientific ML optimization agents (example: Agent4Sci)'
      what_it_solves: Long-horizon evaluation of frontier coding agents improving
        published best models across scientific ML benchmarks and domains.
      what_remains_open: Observed improvements come mostly from ML-engineering tricks
        rather than research insight, with novelty miscalibration and resource under-utilization.
    consensus:
    - Most work organizes around a loop of proposing hypotheses or ideas, running
      experiments or executing code, analyzing results, and producing reports or papers.
    - Evaluation is increasingly mediated by LLM-based judges or automated review,
      with task completion metrics used in benchmark environments.
    - Recent systems add multi-agent roles, verification feedback, or memory to reduce
      failures and human intervention.
    - Code, experiment artifacts, and paper generation are treated as core outputs,
      but reported reproducibility and limitations remain uneven.
    disagreements:
    - Evaluation target varies from publication-like paper acceptance to task completion
      in simulated environments to improving published ML baselines.
    - 'Human involvement differs: some systems are fully autonomous, while others
      use human-in-the-loop PI/dashboard control or curator-agent memory.'
    - 'Systems prioritize different problems: logical verification in mathematical
      reasoning, open-ended discovery, interactive control, failure avoidance, or
      long-horizon ML optimization.'
    - 'What counts as progress differs: automated reviewer scores, peer-review acceptance,
      explanatory knowledge, expert preference, or numerical benchmark gain.'
    - Some works report explicit limitations such as pass rate and engineering-trick
      gains, while others leave limitation evidence blank.
    open_questions:
    - Can automated reviewer or LLM-judge scores be calibrated against independent
      human peer review and real scientific validity?
    - How can agents convert engineering tricks into novel domain insights rather
      than local parameter and implementation sweeps?
    - Do virtual discovery metrics such as task completion and explanatory knowledge
      predict success in real laboratory or code-based experiments?
    - How general is failure-aware negative knowledge beyond PDE and ScienceAgentBench-style
      tasks?
    - What are the missing safety, cost, and reproducibility boundaries when limitations
      and artifacts are not reported?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流程（如The AI Scientist、AI Scientist-v2、ReasFlow）
      解决的问题: 自动化从想法到论文的完整闭环：假设形成、代码执行、实验分析、可视化和论文撰写，并加入内部验证或模拟评审。
      尚未覆盖: 可靠性不一致：AI Scientist-v2三篇仅一篇通过同行评审；评价常依赖自动评审而非独立人工验证。
    - 路线: 虚拟发现环境与标准化基准（如DISCOVERYWORLD）
      解决的问题: 用任务完成、任务相关动作和解释性知识等指标，在多样科学任务中评测完整发现循环。
      尚未覆盖: 强基线仍大多困难；模拟任务指标到真实发现效用的转化尚未建立。
    - 路线: 交互式多智能体研究平台（如Claw AI Lab）
      解决的问题: 支持可定制角色研究团队、实时监控、回滚/恢复，并把本地代码、数据和检查点接入可运行实验。
      尚未覆盖: 证据限于五个内部案例和专家偏好判断；平台成熟度与外部泛化未验证。
    - 路线: 失败感知记忆与负知识（如Negative Knowledge as Failure-aware Shared Memory）
      解决的问题: 把失败尝试转化为共享的类型化记录，下游智能体可采纳或拒绝，以更少token改进重试与跨任务迁移。
      尚未覆盖: 主要在ScienceAgentBench和PDE任务上验证；更广领域泛化、记忆质量与长期收益未解决。
    - 路线: 真实科学ML优化智能体（如Agent4Sci）
      解决的问题: 通过长程基准评估前沿编码智能体在多个科学ML基准和领域上改进已发表最佳模型。
      尚未覆盖: 提升主要来自ML工程技巧而非研究洞察，存在新颖性误判和资源利用不足。
    共识:
    - 多数工作围绕提出假设或想法、运行实验或代码、分析结果、生成报告或论文的循环展开。
    - 评测日益依赖LLM评审或自动评审，并在基准环境中使用任务完成指标。
    - 近期系统加入多智能体角色、验证反馈或记忆机制，以减少失败和人工干预。
    - 代码、实验工件和论文生成被作为核心输出，但可复现性与局限性报告仍不均衡。
    分歧:
    - 评测目标不同：从论文级接受、模拟环境任务完成，到提升已发表ML基线。
    - 人工参与程度不同：有的全自动，有的采用人类PI/仪表板控制或策展-智能体记忆。
    - 系统侧重点不同：数学推理逻辑验证、开放式发现、交互控制、失败避免或长程ML优化。
    - 进展定义不同：自动评审分数、同行评审接受、解释性知识、专家偏好或数值基准提升。
    - 一部分工作明确报告通过率和工程技巧收益等局限，另一些工作的局限性证据为空。
    开放问题:
    - 自动评审或LLM评分能否与独立人工同行评审和真实科学有效性对齐？
    - 智能体如何从工程技巧转向新的领域洞察，而不是局部参数和实现式搜索？
    - 虚拟发现中的任务完成和解释性知识指标能否预测真实实验室或代码实验中的成功？
    - 失败感知负知识在PDE和ScienceAgentBench之外的任务上有多通用？
    - 当局限性和工件未报告时，缺失的安全、成本和可复现性边界是什么？
