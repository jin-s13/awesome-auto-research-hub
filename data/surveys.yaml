  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: Reduces manual effort from ideation through code execution,
        result visualization, and full paper drafting.
      what_remains_open: Consistency remains low; only a few outputs pass peer review
        or complete the full pipeline, and conference-ready quality is not yet stable.
    - line: Domain-specific verification before writing
      what_it_solves: Adds discipline-specific checks, such as logical coherence audits
        or vision-based physics gates, before results are accepted into a manuscript.
      what_remains_open: Verification gates still miss some planted silent failures;
        current evidence is concentrated in applied mathematics and computational
        fluid dynamics.
    - line: Human-in-the-loop collaborative research writing
      what_it_solves: Combines autonomous pipelines with targeted human intervention
        at high-leverage decision points.
      what_remains_open: Which intervention modes generalize beyond one benchmark
        is not established; available ablation shows targeted collaboration outperforms
        exhaustive oversight.
    - line: Self-correction and grounded reporting
      what_it_solves: Recovers from failed runs and constrains drafted numbers to
        measured values, reducing hallucinated results.
      what_remains_open: Fully autonomous conference-ready writing remains unsolved,
        and artifact quality gains do not yet show stable end-to-end publication readiness.
    - line: Evaluation and evidence design for AI-generated writing
      what_it_solves: Provides benchmarks, automated reviewers, peer-review pilot
        tests, and rubric scores for comparing generated manuscripts.
      what_remains_open: Proxy review scores and small benchmark populations are not
        yet aligned with human judgment or broader scientific utility; many records
        lack citation impact evidence.
    consensus:
    - The field agrees that scientific writing systems need a closed loop linking
      experiment execution to manuscript drafting rather than isolated text generation.
    - Verification before writing is treated as necessary for credible reporting,
      because raw generation can produce unsupported or physically invalid claims.
    - Automated review, rubric scoring, and peer-review pilots are used as repeatable
      evidence for generated paper quality.
    - Some human involvement improves reliability, with sparse targeted collaboration
      more effective than exhaustive step-by-step oversight in the available ablation.
    disagreements:
    - 'Verification mechanism differs: logical coherence audits for theory-oriented
      writing, vision-language physical checks for simulation writing, and grounded
      report constraints for measured machine learning results.'
    - Interaction mode ranges from fully autonomous pipelines to multiple human-in-the-loop
      intervention levels.
    - Evaluation target differs across LLM review rubrics, workshop peer-review acceptance,
      benchmark improvement, blind quality scores, and the proportion of metrics-bearing
      outputs.
    - Domain scope differs between general machine learning research writing and domain-specific
      applied mathematics or computational fluid dynamics writing.
    - 'Self-correction approaches differ: iterative tree search, structured debate,
      self-healing execution, single reflection, and multi-hypothesis failure attribution.'
    open_questions:
    - What validity gate design can reduce missed silent failures below the observed
      2 of 16 gap in physics-aware verification?
    - Can fully autonomous systems consistently pass full conference peer review rather
      than isolated workshop or benchmark successes?
    - How well do LLM-based review rubrics and benchmark scores predict human assessment
      and downstream research utility?
    - What human intervention points generalize across disciplines beyond the single
      available benchmark?
    - Missing code, dataset, and citation records for several records leave external
      reproducibility and impact claims unverified.
