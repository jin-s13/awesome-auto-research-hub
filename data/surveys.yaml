  - 主流方向：端到端自主研究写作系统，以多智能体流程串联构思、实验执行、论文起草和评审环节。
  - 研究共性：把科学工作流拆分为专门智能体或模块，并通过验证、反思或评审回路降低错误主张。
  - 关键差异：验证信号从物理/数学等特定领域有效性检查到通用失败归因不等；交互程度从完全自主到精准人机协作；评测目标涵盖LLM评分、基准分和真实同行评审。
  - 趋势演进：2024/2025年的通用自动发现框架，逐渐走向2026年更强的领域约束、可验证报告和选择性人类协作。
