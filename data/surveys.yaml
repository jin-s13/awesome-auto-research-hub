  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automating the complete scientific workflow from hypothesis
        generation, code and experiment execution, visualization, analysis, and manuscript
        writing to review.
      what_remains_open: Claims are often validated only on self-generated papers
        or workshop-level acceptance; consistency across domains, venues, and runs
        remains unproven.
    - line: Domain-specific discovery systems with validation gates
      what_it_solves: Embedding physics, logic, or evidence checks to detect silent
        failures and prevent invalid conclusions in specialized domains such as CFD
        and applied mathematics.
      what_remains_open: Reported gates still miss some planted failures; their transfer
        beyond one domain or simulator boundary is not established.
    - line: Discovery benchmarks and simulated environments
      what_it_solves: Providing reproducible tasks and metrics for complete discovery
        cycles, including hypothesis formation, experiment design, result analysis,
        and conclusion.
      what_remains_open: Task coverage is limited; proxy metrics may not align with
        real scientific utility, and results are often reported on a single base model.
    - line: Human-AI collaboration and oversight mechanisms
      what_it_solves: Structuring when and how humans intervene in autonomous research
        loops to improve reliability without exhaustive step-by-step oversight.
      what_remains_open: Which intervention points are high-leverage across fields
        is not yet shown; current evidence is limited to specific experiment-stage
        benchmarks.
    - line: Automated review and evidence-maturity evaluation
      what_it_solves: Using LLM or VLM judges to score generated claims and papers,
        including controls, robustness, falsifiability, and auditability.
      what_remains_open: Judge calibration against human scientific judgment is unresolved;
        hidden expected values and source conclusions may not fully prevent reproduction-style
        results.
    consensus:
    - 'End-to-end discovery is treated as a multi-stage loop: ideation, execution,
      verification, analysis, and writing.'
    - Automated validation or review is considered necessary because raw workflow
      execution alone does not yield trustworthy scientific claims.
    - Current agents can execute and document analyses competently but remain insufficient
      in controls, robustness, falsifiability, or cross-dataset generalization.
    - Evaluations are moving toward complete discovery cycles rather than isolated
      coding or reasoning tasks.
    disagreements:
    - 'Domain generality versus specialized constraints: some systems target broad
      ML workflows, while others use physics or mathematical checks suited to one
      domain.'
    - 'Autonomy placement: one direction pursues fully automated submission and review,
      while another argues targeted human collaboration at high-leverage decision
      points.'
    - 'Evaluation target: paper acceptance, task completion in simulated environments,
      and evidence maturity of blind peer-derived tasks represent different validity
      criteria.'
    - 'Verification strategy: internal textual/logical checks, vision-language inspection
      of rendered outputs, and external LLM/judge rubrics differ in coverage and failure
      modes.'
    open_questions:
    - How can verification gates cover more silent failure modes without becoming
      narrow domain-specific detectors?
    - Do LLM- and VLM-based reviewers align with long-term scientific validity rather
      than surface features of generated papers?
    - Can systems generalize from machine learning, computational fluid dynamics,
      and applied mathematics to less formalized or less executable domains?
    - What minimal human oversight converts competent workflow execution into defensible
      scientific claims?
    - How can benchmarks hide expected values and analysis paths while still scoring
