  related_work_outline_zh:
  - 主流方向：构建端到端的大模型智能体系统，自动完成假设提出、代码编写与执行、实验运行、结果分析和论文撰写，例如 The AI Scientist、AI Scientist-v2、ReasFlow、Claw
