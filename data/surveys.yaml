  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research workflows
      what_it_solves: Integrating ideation, code and experiment execution, analysis,
        visualization, and manuscript writing into a single agentic loop.
      what_remains_open: Reliability beyond narrow workshop or benchmark demonstrations;
        consistent peer-review acceptance is not established.
    - line: Verification and validity gating
      what_it_solves: Auditing logical, mathematical, or physical validity before
        claims are written, reducing silent experimental failures.
      what_remains_open: Gates still miss some planted failures, and cross-domain
        or cross-base-model detection rates are not established.
    - line: Evaluation environments and evidence-grounded benchmarks
      what_it_solves: Making discovery-agent claims comparable through blind tasks,
        virtual environments, and artifact-level evidence-maturity scoring.
      what_remains_open: Current agents score close together with no reliable pairwise
        separation, so proxy metrics may not capture true discovery utility.
    - line: Domain-specific scientific discovery systems
      what_it_solves: Adapting autonomous research to domains such as applied mathematics
        or computational fluid dynamics with domain knowledge and physics-aware checks.
      what_remains_open: Reported domain metric improvements rely on limited cases
        and lack broad external validation across hardware, cases, or user settings.
    - line: Automated manuscript generation and review
      what_it_solves: Producing full papers and using reviewer feedback, sometimes
        including vision-language feedback, to revise and select outputs.
      what_remains_open: Acceptance scores or workshop acceptance do not yet prove
        scientific validity; writing quality and discovery quality may be conflated.
    consensus:
    - Autonomous discovery is framed as a complete ideation-experiment-analysis-writing
      loop rather than an isolated prediction task.
    - Successful execution alone is insufficient; verification gates, validity checks,
      or evidence-based evaluation are increasingly treated as necessary components.
    - LLM-based judging and review are becoming a scalable evaluation layer, but their
      validity remains a central concern.
    - 'Current systems produce promising artifacts but remain reliability-limited:
      detection gaps, unstable acceptance, and clustered benchmark scores recur.'
    disagreements:
    - 'Verification signals differ: some systems audit logical or mathematical coherence,
      some inspect rendered physical fields, and others rely on LLM review of execution
      outputs.'
    - 'Evaluation targets differ: manuscript acceptance thresholds, virtual task completion,
      and blind-task evidence maturity measure different stages of discovery.'
    - 'Interaction modes differ: some systems use a human principal investigator and
      agent-as-graduate-student setup, while others pursue fully automated end-to-end
      research.'
    - 'Deployment settings differ: some workflows are specialized for applied mathematics
      or computational fluid dynamics, while others target general machine-learning
      subfields or simulated science tasks.'
    - 'Success metrics differ: cost per paper, acceptance threshold, domain-specific
      metric improvement, and benchmark score separation are used without common calibration.'
