  literature_review:
    line_of_work_matrix:
    - line: Long-horizon research state and context management
      what_it_solves: Keeps durable search state outside agent conversations and reconstructs
        focused contexts, reducing token growth, repeated work, and stalled progress
        in long research runs.
      what_remains_open: Whether compressed or harness-maintained state remains sufficient
        on unseen research domains, and whether short evaluation horizons can detect
        late-run progress.
    - line: Closed-loop experimental control and high-fidelity feedback scheduling
      what_it_solves: Decides which experiments, code changes, or optimizer rewrites
        deserve expensive high-fidelity evaluation by using surrogates, targeted pilots,
        admission gates, or acquisition rules.
      what_remains_open: How much gain comes from the agent, controller, surrogate,
        or task-specific prior rather than from the learned research policy itself.
    - line: Held-out transfer and benchmark evaluation design
      what_it_solves: Makes research-agent claims comparable through holdout data,
        inner-fold means, token/oracle/force-call budgets, and multi-suite benchmark
        comparisons.
      what_remains_open: Whether these proxy metrics align with real research utility,
        and whether current task coverage supports standardized external validation
        across domains.
    - line: Operational knowledge, experience, and skill reuse
      what_it_solves: Distills prior experimental trajectories or GitHub repositories
        into reusable, verified skills or experience libraries so agents can avoid
        repeating known operational failures.
      what_remains_open: Coverage and robustness of extracted knowledge outside the
        source repositories, tasks, execution budgets, and model backbones.
    - line: Artifact-level search and auditing of optimizer or modeling changes
      what_it_solves: Searches over modeling choices, optimizer rewrites, and code
        changes with admission gates that reject premature stopping or non-generalizing
        improvements.
      what_remains_open: Current evidence is limited to specific materials endpoints
        and molecular-optimization settings; broader artifact types and failure-case
        boundaries remain underexplored.
    consensus:
    - Persistent research state should live outside the agent conversation rather
      than being replayed as a growing history, improving token efficiency and reducing
      duplicated work.
    - Research is modeled as an iterative loop of proposal, execution, auditing, and
      state update rather than as one-shot generation.
    - Evaluation is moving toward held-out or sparse high-fidelity evidence to avoid
      overfitting to development feedback.
    - 'Efficiency is treated as a first-class result: token budgets, oracle queries,
      force calls, and interaction overhead are reported alongside final quality.'
    - Reusable prior knowledge—experience libraries, distilled skills, or learned
      surrogates—improves research performance when backbone and execution budgets
      are held fixed.
    disagreements:
    - 'State representation differs: some designs keep durable state in a harness,
      others compress it inside the agent context, and others distill it into skill
      or experience libraries.'
    - 'Control mode differs: centralized advisor-worker assignment versus recursive
      self-auditing versus acquisition-rule-driven surrogate repair versus repository-derived
      skill retrieval.'
    - 'Evaluation target differs: held-out materials endpoints, software/ML engineering
      suites, molecular relaxation, and deep research question answering create different
      utility signals and generalization claims.'
    - 'High-fidelity feedback timing differs: per-episode feedback, sparse online
      surrogate updates, or targeted pilot experiments only when historical experience
      is insufficient.'
    - Deployment and reproducibility assumptions differ across laboratory automation,
      open ML repositories, optimizer code, and web research settings, with uneven
      artifact availability.
    open_questions:
    - Do short-horizon benchmarks and fixed proxy metrics predict long-horizon autonomous
      research progress?
    - How well do held-out improvements on Matbench endpoints, molecular relaxation
      benchmarks, and coding or agent suites transfer to unseen scientific domains?
    - How robustly can distilled skills, experience libraries, and surrogates be reused
      across different agent backbones, execution budgets, and task distributions?
    - How much of the reported token, oracle-query, and force-call gain comes from
      agent architecture rather than backbone capability, controller choice, or task-specific
      prior?
    - Several top papers have missing limitation fields or low reproducibility signals
      in the packet; these are verification gaps, not proof that artifacts or failure
      analyses are absent.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 长程研究状态与上下文管理
      解决的问题: 在智能体对话之外保存持久搜索状态并重建聚焦上下文，减少长程研究中的 token 膨胀、重复工作和停滞。
      尚未覆盖: 压缩或 harness 保存的状态在未见研究领域上是否仍然充分，以及短评测视界是否足以反映后期进展。
    - 路线: 闭环实验控制与高保真反馈调度
      解决的问题: 通过代理、定向试点、准入门控或采集规则，决定哪些实验、代码变更或优化器改写值得进行昂贵的高保真评估。
      尚未覆盖: 性能提升有多少来自智能体、控制器、代理或任务先验，而非学习到的研究策略本身。
    - 路线: 留出迁移与基准评测设计
      解决的问题: 通过留出数据、内折均值、token/oracle/力调用预算和多套件基准，让研究智能体的主张具有可比性。
      尚未覆盖: 代理指标是否与真实科研效用一致，以及当前任务覆盖是否足以支撑跨领域标准化外部验证。
    - 路线: 操作知识、经验与技能复用
      解决的问题: 从历史实验轨迹或 GitHub 仓库中提炼可复用且经过验证的技能或经验库，避免智能体重复已知操作失败。
      尚未覆盖: 提炼出的知识在源仓库、任务、执行预算和模型主干之外的覆盖范围与鲁棒性仍缺少证据。
    - 路线: 优化器或建模变更的产物级搜索与审计
      解决的问题: 在建模选择、优化器改写和代码变更空间中自动搜索，并用准入门控拒绝过早停止或不泛化的改进。
      尚未覆盖: 当前证据仅限于特定材料端点和分子优化场景，更多产物类型和失败案例边界仍未覆盖。
    共识:
    - 持久研究状态应放在智能体对话之外，而不是以不断增长的历史形式重放，以提升 token 效率并减少重复工作。
    - 研究被普遍建模为提出、执行、审计、状态更新的迭代闭环，而非单次生成。
    - 评测趋向使用留出或稀疏高保真证据，以避免只依赖开发反馈而过拟合。
    - 效率被视为一等相关指标：token 预算、oracle 查询、力调用和交互开销与最终质量一起报告。
    - 在主干和执行预算固定条件下，可复用的经验库、蒸馏技能或代理模型能改善研究表现。
    分歧:
    - 状态表示不同：有的将持久状态保存在 harness 中，有的在智能体上下文内压缩，有的则蒸馏为技能或经验库。
    - 控制模式不同：集中式 Advisor 分配 Worker、递归自审计、采集规则驱动的代理修复或仓库技能检索各有差异。
    - 评测目标不同：材料端点留出任务、软件/ML工程套件、分子弛豫和深度研究问答产生不同效用信号和泛化主张。
    - 高保真反馈节奏不同：每回合反馈、稀疏在线代理更新，或仅在历史经验不足时进行定向试点。
    - 部署与可复现假设不同：实验室自动化、开放 ML 仓库、优化器代码和网页研究对工件与外部验证的依赖程度不同。
    开放问题:
    - 短视界基准和固定代理指标能否预测长程自主研究的真正进展？
    - 在 Matbench 端点、分子弛豫基准和编码或智能体套件上的留出改进，能否迁移到未见科学领域？
    - 蒸馏技能、经验库和代理在不同主干、执行预算与任务分布之间的复用鲁棒性如何？
    - 报告中的 token、oracle 查询和力调用增益有多少来自智能体架构，而非主干能力、控制器选择或任务先验？
    - 若若干高排名论文缺失局限性字段或复现信号偏低，这是验证缺口，而非证明其缺少工件或失败分析。
