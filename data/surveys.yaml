  related_work_outline_zh:
  - 主流方向：以代码为中心的端到端自主科研智能体是主导，覆盖假设生成、代码执行、实验分析、论文写作和模拟评审；证据集中在机器学习与应用数学，实验室物理实验路径仍较少。
  - 研究共性：将完整实验生命周期分解为提出—执行—分析—报告—评审循环，并通过记忆、验证或树搜索减少失败，提升可重复性；人类仍承担首席研究员、监控者或评审者角色。
  - 关键差异：评测目标分为任务完成、基准提升、生成论文质量或工作坊同行评审接受；交互模式从全自动生成到可回滚/监控平台；领域覆盖包括ML子领域、应用数学和多主题虚拟发现。
  - 趋势演进：从2024年的全自动框架和虚拟评测环境，到2025年首篇通过同行评审的工作坊级论文，再到2026年多智能体团队、失败记忆和真实ML基准评测；时间跨度窄，属于当前前沿内部演进。
  - 开放问题：自动评审是否有效；收益是否来自科研洞察而非工程技巧；代码型流程能否迁移到实验室物理实验；共享记忆与验证机制是否跨域泛化。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents for code-based discovery
      what_it_solves: Automating the full experiment lifecycle from hypothesis and
        code generation through execution, result analysis, manuscript writing, and
        simulated review.
      what_remains_open: Consistency across generated outputs, human-grade validity,
        and evidence that performance comes from scientific insight rather than local
        engineering sweeps.
    - line: Evaluation environments and benchmarks for discovery agents
      what_it_solves: Making scientific discovery agent capabilities comparable through
        task completion, action quality, and interpretable discovery knowledge metrics.
      what_remains_open: Coverage beyond text-based or machine-learning-centric tasks,
        and agreement between automatic metrics and real scientific utility.
    - line: Self-verification and reviewer feedback loops
      what_it_solves: Adding internal logical audits, knowledge retrieval, or visual-model-based
        reviewer feedback to catch errors before human inspection and align outputs
        with review quality.
      what_remains_open: Whether automated review/feedback is calibrated to human
        peer review and produces fundamental correctness gains rather than surface
        polish.
    - line: Failure-aware shared memory and knowledge reuse
      what_it_solves: Converting failed attempts into reusable records so later experiments
        can adopt or reject them, improving performance while reducing token use.
      what_remains_open: Transfer boundary of failure records across tasks and whether
        they encode reusable domain knowledge or task-specific shortcuts.
    - line: Interactive multi-agent research platforms and code harnesses
      what_it_solves: Orchestrating customizable research teams with real-time monitoring,
        rollback/resume control, and integration of local codebases, datasets, and
        checkpoints into runnable experiments.
      what_remains_open: Generalization beyond narrow internal case studies and standardized
        external validation across hardware, datasets, and user settings.
    consensus:
    - Current systems decompose experiment automation into propose–execute–analyze–report/review
      loops, treating code execution and generated artifacts as core parts of the
      research process.
    - LLM/VLM-based reviewers or expert judges are frequently used as proxies for
      scientific quality because human peer review is costly or unavailable at scale.
    - Human oversight remains present, but shifts toward initial prompting, dashboard
      monitoring, downstream judging, or final acceptance decisions.
    - Memory, verification, and tree-search mechanisms are introduced to manage multi-step
      failure, improve token efficiency, and make outputs more reliable.
    disagreements:
    - 'Success measures differ: some evaluate task completion or benchmark improvement,
      while others evaluate generated manuscript quality or peer-review acceptance.'
    - 'Autonomy and interaction modes differ: some systems pursue fully automatic
      end-to-end generation, while others emphasize interactive dashboards, human
      inspection, rollback, and monitoring.'
    - Domain scope differs across applied mathematics, machine learning subfields,
      multi-topic virtual discovery tasks, and scientific ML benchmarks, weakening
      comparability.
    - 'Improvement mechanisms differ: failure-aware memory, self-verification with
      knowledge retrieval, agentic tree search with visual feedback, and code harnesses
      represent distinct technical routes.'
    open_questions:
    - Do benchmark improvements reflect scientific insight or mainly ML-engineering
      tricks? Available in-the-wild benchmark evidence suggests much of the gain comes
      from engineering tricks rather than research-level domain insight.
    - Are LLM/VLM reviewer scores and workshop peer-review acceptance reliable proxies
      for scientific contribution when generated papers can be polished for surface
      quality?
    - Can code-based experiment automation transfer to lab-based settings with physical
      instruments, wet-lab protocols, and experimental safety constraints?
    - Do shared failure memories, verification loops, and retrieved knowledge generalize
      across tasks and domains, or mainly encode task-specific shortcuts?
    - What minimum human oversight prevents reward hacking, novelty miscalibration,
      resource under-utilization, and collapse into local engineering sweeps?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研智能体
      解决的问题: 自动完成从假设、代码生成、执行、结果分析到论文写作与模拟评审的完整实验生命周期
      尚未覆盖: 多篇生成结果的一致性、人类级有效性，以及收益源自领域洞察还是局部工程搜索仍不明确
    - 路线: 面向发现智能体的评测环境与基准
      解决的问题: 通过任务完成度、动作质量和可解释知识等指标比较科学发现智能体的能力
      尚未覆盖: 任务多为文本或代码型，自动指标与真实科研效用之间的一致性未被充分验证
    - 路线: 自我验证与评审反馈循环
      解决的问题: 在人工审查之前进行逻辑审计、知识检索或视觉模型反馈，以减少错误并贴近评审质量
      尚未覆盖: 自动审核/反馈分数是否与人类同行评审一致，是否带来根本正确性提升而非表面润色
    - 路线: 失败感知共享记忆与知识复用
      解决的问题: 将失败尝试转化为可复用记录，供后续实验采纳或拒绝，提升性能并降低令牌消耗
      尚未覆盖: 失败记录的迁移边界及其编码的是可复用领域知识还是任务特定捷径
    - 路线: 交互式多智能体平台与代码工具链
      解决的问题: 编排可定制研究团队，支持实时监控、回滚/恢复，并把本地代码库、数据集和检查点接入可运行实验
      尚未覆盖: 当前验证多为内部案例，跨硬件、数据集和用户设置的标准化外部验证仍不充分
    共识:
    - 当前系统普遍把实验自动化分解为提出—执行—分析—报告/评审循环，代码执行与生成工件被视为研究流程的核心环节。
    - 由于人类同行评审成本高或难以规模化，LLM/VLM评审器或专家评审被频繁用作科学质量的替代信号。
    - 人类监督仍然存在，但逐渐转向初始提示、仪表板监控、下游评审或最终接受决策。
    - 记忆、验证和树搜索等机制被引入，以应对多步失败、提升令牌效率并增强输出可靠性。
    分歧:
    - 成功衡量方式不同：有的以任务完成或基准提升衡量，有的以生成论文质量或同行评审接受衡量。
    - 自主与交互模式不同：部分系统追求全自动端到端生成，另一些强调交互式仪表板、人工检查、回滚和实时监控。
    - 领域覆盖差异明显：应用数学、机器学习子领域、多主题虚拟发现任务和科学ML基准并存，跨系统可比性较弱。
    - 改进机制不同：失败感知记忆、自我验证与知识检索、智能体树搜索与视觉反馈、代码工具链各自代表不同技术路线。
    开放问题:
    - 基准提升是否反映科学洞察，还是主要反映机器学习工程技巧？现有真实世界基准证据表明，很大一部分收益来自工程技巧而非研究级领域洞察。
    - 当生成论文可以通过表面优化获得高分时，LLM/VLM评审分数和工作坊同行评审接受能否作为可靠的科学贡献代理指标？
    - 代码型实验自动化能否迁移到包含物理仪器、湿实验流程和实验安全约束的实验室场景？
    - 共享失败记忆、验证循环和检索知识能否跨任务、跨领域泛化，还是主要编码任务特定捷径？
    - 如何设置最低人类监督，以防止奖励黑客、新颖性误判、资源利用不足和快速陷入局部工程搜索？
