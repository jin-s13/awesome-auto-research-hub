  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Automating the full loop from hypothesis or idea generation
        and code execution to analysis, visualization, and manuscript drafting.
      what_remains_open: Consistent cross-domain success and external peer or lab
        validation; visible evidence is mainly machine-learning, mathematical, PDE,
        or simulated tasks.
    - line: Multi-agent collaboration and failure-aware memory
      what_it_solves: Coordinating specialized roles, monitoring artifacts, reusing
        failed attempts, and improving next-step experiment proposals with lower token
        cost.
      what_remains_open: Whether gains transfer beyond internal case studies and same-task
        retries, and whether the interactive infrastructure matures enough for external
        validation.
    - line: Task-based evaluation suites for discovery and experimental design
      what_it_solves: Operationalizing hypothesis testing, experiment planning, and
        ablation design so agents can be compared on shared tasks and metrics.
      what_remains_open: Coverage across scientific domains, alignment of proxy metrics
        with real decision utility, and closing the gap where current agents remain
        below human planning performance.
    - line: Verification and automated review loops
      what_it_solves: Auditing logical or experimental coherence and scoring generated
        papers or workflows before human inspection to reduce obvious errors.
      what_remains_open: LLM-based review may reward plausible text; alignment with
        rigorous peer review and empirical reproducibility is not established in visible
        evidence.
    consensus:
    - Autonomous agents can generate research ideas, execute code-based experiments,
      analyze outputs, and draft papers or reports end-to-end.
    - LLM-based judges and reviewers are a common evaluation shortcut, but they require
      complementary task completion or human expert checks.
    - Structured discovery or experimental-design tasks expose failures that text
      generation alone does not reveal.
    - Verification loops, failure memory, and artifact monitoring are emerging mechanisms
      for improved reliability and token efficiency.
    disagreements:
    - 'Interaction mode differs: fully automatic pipelines, human principal-investigator
      collaboration, and interactive dashboards with rollback/resume controls.'
    - 'Evaluation target differs: generated-paper acceptance or reviewer score, task
      completion in simulated environments, ablation planning recall, and expert preference
      judgments.'
    - 'Agent organization differs: single end-to-end framework, multi-agent role specialization,
      progressive tree search with an experiment manager, and shared failure memory.'
    - 'Domain focus differs: empirical machine-learning experimentation, applied mathematics
      proof reasoning, and PDE tasks, with no direct lab-based evidence in the packet.'
    open_questions:
    - Can automated experiment agents transfer from simulated or code-based tasks
      to physical laboratory settings, which are underrepresented in the visible evidence?
    - Can LLM-based review be calibrated against human peer review and downstream
      scientific utility, rather than mainly assessing plausibility and formatting?
    - How much of the reported improvement is attributable to base model capability
      rather than multi-agent orchestration, tree search, verification, or failure
      memory?
    - Are missing reproducibility artifacts, external baselines, and limitation details
      in the visible packet recoverable, or do they hide unresolved validation gaps?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究智能体
      解决的问题: 自动完成从假设或想法生成、代码执行到分析、可视化和论文草稿的完整循环。
      尚未覆盖: 跨领域一致成功与外部同行或实验室验证；可见证据集中在机器学习、数学、PDE或模拟任务。
    - 路线: 多智能体协作与失败感知记忆
      解决的问题: 协调专门角色、监控工件、复用失败尝试，并以更低令牌成本改进后续实验方案。
      尚未覆盖: 收益能否迁移到内部案例和同任务重试之外，以及交互基础设施是否足够成熟接受外部验证。
    - 路线: 面向发现与实验设计的任务评测套件
      解决的问题: 将假设检验、实验规划和消融设计操作化，使智能体在共享任务和指标上可比较。
      尚未覆盖: 跨科学领域覆盖、代理指标与真实决策效用的一致性，以及当前智能体低于人类规划水平这一差距。
    - 路线: 验证与自动评审循环
      解决的问题: 在人工检查前审计逻辑或实验一致性，并对生成论文或工作流评分，以减少明显错误。
      尚未覆盖: 基于LLM的评审可能奖励表面合理文本；其与严格同行评审和经验可复现性的一致性尚缺证据。
    共识:
    - 智能体可以端到端生成研究想法、运行代码实验、分析输出并起草论文或报告。
    - 基于LLM的评审或评审器是常见评测捷径，但需要任务完成或人类专家检查作为补充。
    - 结构化发现或实验设计任务能暴露纯文本生成无法揭示的失败。
    - 验证循环、失败记忆和工件监控正成为提升可靠性与令牌效率的机制。
    分歧:
    - 交互模式不同：全自动流程、人类首席研究员式协作和带恢复控制的交互式仪表盘。
    - 评测目标不同：生成论文接受或评审分数、模拟环境任务完成、消融规划召回和专家偏好判断。
    - 智能体组织方式不同：单一端到端框架、多智能体角色分工、带实验管理器的渐进树搜索和共享失败记忆。
    - 领域侧重不同：机器学习实验、应用数学证明推理和PDE任务，暂缺直接实验室证据。
    开放问题:
    - 自动化实验智能体能否从模拟或代码任务迁移到可见证据中代表性不足的物理实验室环境？
    - 基于LLM的评审能否与人类同行评审和下游科学效用对齐，而不是主要评估合理性和格式？
    - 报告的性能提升有多少来自基座模型能力，而非多智能体编排、树搜索、验证或失败记忆？
    - 可见证据中缺失的可复现工件、外部基线和限制说明是可恢复的，还是隐藏了未解决的验证缺口？
