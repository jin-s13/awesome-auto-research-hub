  literature_review:
    line_of_work_matrix:
    - line: End-to-end automated discovery frameworks
      what_it_solves: complete research loops from ideation to experiment to manuscript
        generation with reduced dependence on human-coded templates
      what_remains_open: consistency and governance remain weak; demonstrated acceptance
        is mostly workshop-level or simulated, and generated claims still lack defensible
        controls
    - line: Evidence-grounded benchmark design
      what_it_solves: comparing open-ended discovery claims through blind tasks, frozen
        data, domain-specific questions, and human or LLM judges
      what_remains_open: generalizability across base models and scientific domains;
        proxy metrics may not align with real discovery utility
    - line: Domain-specific research agents with reliability gates
      what_it_solves: embedding deterministic evaluation, physics-aware verification,
        or vision-language checks to catch silent failures and constrain source edits
      what_remains_open: gates are incomplete and domain-tuned; evidence is limited
        on transfer to other scientific workflows
    - line: Simulated and domain benchmark environments
      what_it_solves: controlled task suites covering full discovery cycles where
        prior strong agents still struggle
      what_remains_open: whether environment task completion transfers to real scientific
        validity and peer-recognized claims
    - line: Automated review and governance instruments
      what_it_solves: scalable evaluation of generated papers near human scoring or
        peer-review thresholds
      what_remains_open: unclear whether automated or workshop-level review can substitute
        human scientific governance
    consensus:
    - Autonomous agents can now execute and document analyses competently but do not
      yet reliably produce trustworthy, fully validated discoveries.
    - Reliable evaluation requires evidence-grounded tasks, fixed metrics or judges,
      and open artifacts; unconstrained agent outputs are insufficient.
    - Explicit verification gates, deterministic evaluators, or authority separation
      improve reliability over generic agent pipelines.
    - Human baselines or peer-review-aligned thresholds are used to calibrate claims
      when available.
    disagreements:
    - Deployment setting differs across simulated text worlds, real scientific software
      such as OpenFOAM and forecasting pipelines, and real omics data.
    - Evaluation signal differs among fixed LLM evidence-maturity judging, task-completion
      metrics, domain-specific performance, and human baselines or peer review.
    - Control mechanism differs from domain-embedded physics or canonical evaluator
      gates to general validity gates, while early end-to-end frameworks lack explicit
      gates.
    - Claim target differs across proof-of-concept paper acceptance, benchmark failure
      characterization, and task-specific architecture improvement.
    open_questions:
    - Can current LLM judges detect missing controls, robustness checks, falsifiability,
      and cross-dataset generalization in novel claims?
    - Do improvements in physics or forecasting domains transfer beyond the specific
      simulators, datasets, and base models tested?
    - What minimal reliability gates are required before autonomous research outputs
      should enter human peer review or real-world use?
    - How should evaluation metrics be calibrated so task completion and automated
      scores align with long-term scientific utility?
