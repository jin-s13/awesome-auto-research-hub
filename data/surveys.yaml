  - 主流方向：构建能搜索、验证、改进并迁移变化的研究智能体，并在标准化或留出式研究任务基准上进行评测。
  - 研究共性：采用闭环智能体流程；把干预与固定基线或基准比较；强调留出迁移和可复用、经验证的工件。
