  related_work_outline:
  - 'Mainstream direction: Recent work centers on autonomous agentic pipelines for
    literature synthesis, claim formation, evidence auditing, and manuscript generation,
    with internal verification and self-evolution.'
  - 'Shared research pattern: Systems decompose scientific inquiry into retrieval/synthesis,
    analysis, verification, and evaluation stages, then score outputs with LLM judges
    or human/expert baselines.'
  - 'Key differences: Evaluation targets range from open-ended evidentiary maturity
    to domain-specific annotation and general benchmark suites; interaction modes
    range from human-in-the-loop to fully autonomous; verification ranges from fixed
    rubric judges to self-critique.'
  - 'Trend evolution: Within the 2025–2026 frontier, work shifts from isolated discovery
    agents toward evidence-grounded benchmarks and failure-oriented reliability analysis,
    while literature review automation remains an explicit challenge.'
  - 'Open questions: Metric validity, domain/base-model generalization, and whether
    generated literature reviews and research gaps require independent expert validation
    remain unresolved.'
  related_work_outline_zh:
  - 主流方向：近期工作集中构建自主智能体流水线，用于文献综合、证据审计、主张形成与论文生成，并加入内部验证和自我演化机制。
  - 研究共性：将科学工作流分解为检索/综合、分析、验证和评测，并用 LLM 评委或人类基线对输出进行评分。
  - 关键差异：评测目标从开放式证据成熟度到领域标注和通用基准不等；交互从人机协作到全自动；验证从固定评委到自批评。
  - 趋势演进：在 2025–2026 前沿内，趋势由单一发现智能体转向证据锚定基准和失败模式分析，文献综述自动化仍被列为关键挑战。
  - 开放问题：指标效度、基座模型与领域泛化、以及生成式综述和研究缺口是否需要独立人工验证仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Agentic literature synthesis and manuscript generation
      what_it_solves: Turns a minimal research prompt into synthesized literature,
        derivations, experiments, and a manuscript, with an internal verification
        loop to correct obvious logical errors.
      what_remains_open: Generated literature reviews and gap claims lack independent
        expert validation, and verification may miss domain-level errors beyond local
        coherence.
    - line: Evidence-grounded evaluation design for discovery agents
      what_it_solves: Produces comparable blind tasks, frozen data, automated rubrics,
        and human baselines for scoring whether agent claims are evidence-supported.
      what_remains_open: Cross-model and cross-domain generalization, and whether
        rubric scores align with real literature search or research decision utility.
    - line: Failure-mode analysis for autonomous research workflows
      what_it_solves: Documents recurring failure patterns such as implementation
        drift, memory degradation, overexcitement, insufficient domain intelligence,
        and weak scientific taste.
      what_remains_open: Turning failure modes into measurable guardrails specific
        to long-horizon literature review and gap-discovery pipelines.
    - line: Survey and taxonomy of agentic scientific discovery
      what_it_solves: Organizes agent capabilities, evaluation metrics, frameworks,
        datasets, and challenges, including literature review automation, reliability,
        and ethics.
      what_remains_open: Direct empirical validation that these categories predict
        downstream literature intelligence performance.
    - line: Self-evolving agent infrastructure for scientific workflows
      what_it_solves: Supports iterative hypothesis refinement, self-critique, and
        knowledge accumulation so domain agents can be built scalably.
      what_remains_open: Whether benchmark gains derive from literature-relevant capabilities
        or from general agent improvements; external validation remains incomplete.
    consensus:
    - Recent work treats literature synthesis, claim formation, and manuscript creation
      as multi-step agentic workflows rather than isolated retrieval or summarization.
    - LLM judges and rubric-based evidence maturity are common evaluation devices,
      but human baselines remain limited.
    - Existing systems can execute analyses and generate documents, but reliability,
      verification, and domain judgment remain unresolved.
    - Literature review automation and autonomous discovery are explicitly treated
      as frontier challenges rather than solved capabilities.
    - Read-first, citation, and graph prestige scores are not methodology evidence;
      many zero citation/prestige values reflect missing OpenAlex identifiers, so
      rankings should not be read as established impact.
    disagreements:
    - Systems differ on whether to prioritize end-to-end autonomous generation with
      internal verification or staged failure diagnosis and design principles.
    - 'Evaluation targets differ: open-ended evidentiary maturity from blinded peer-reviewed
      studies, domain-specific annotation and multiple-choice tasks, and cross-domain
      benchmark suites.'
    - Interaction modes differ from human-in-the-loop principal investigator/graduate-student
      collaboration to fully autonomous self-evolving loops.
    - Supervision and verification differ among fixed LLM judge with artifact-level
      items, human plus multi-agent review, and self-critique with knowledge accumulation.
    - 'Deployment settings differ: theory-oriented applied mathematics, single-cell
      omics discovery, and broader multi-domain agentic science.'
    open_questions:
    - What is the external validity of current evidence-maturity or LLM-judge metrics
      for literature search, review synthesis, and research gap discovery in real
      scholarly workflows?
    - Which verification signals can catch unsupported claims and logical errors in
      generated literature reviews without requiring expert human review?
    - How do failure modes such as memory degradation, implementation drift, and overexcitement
      affect long-horizon literature synthesis specifically? Existing case evidence
      comes from autonomous ML research, not literature intelligence.
    - Do self-evolving agent gains reflect improved literature intelligence or general
      instruction-following capability? Controlled ablations and released artifacts
      are needed.
    - How robust are current benchmarks across base models, domains, and languages?
      Available evidence is limited to one frozen base model or domain-specific tasks,
      so broader verification is missing.
    - Several packet entries do not expose code, data, baselines, limitations, or
      impact metadata; these are verification gaps and should be resolved before strong
      cross-system conclusions.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端智能体文献综合与论文生成
      解决的问题: 把最小研究提示转化为文献综合、推导、实验和手稿，并通过内部验证减少明显错误。
      尚未覆盖: 生成综述和研究缺口是否经独立专家验证，验证循环能否捕捉超出表面连贯性的领域错误。
    - 路线: 面向发现智能体的证据锚定评测
      解决的问题: 用盲任务、冻结数据和自动化评委评估智能体是否能形成有证据支持的主张。
      尚未覆盖: 基座模型与领域泛化，以及评分指标与真实文献检索/研究效用的一致性。
    - 路线: 自主研究失败模式分析
      解决的问题: 记录实现漂移、记忆退化、过度乐观、领域智能不足和科学品位薄弱等重复失败。
      尚未覆盖: 如何把这些失败模式转化为针对文献智能任务的可测量护栏。
    - 路线: 智能体科学综述与分类体系
      解决的问题: 按能力、指标、数据集和挑战组织智能体科学系统，并指出文献综述自动化等难点。
      尚未覆盖: 分类是否能预测下游文献检索、综述合成和缺口发现行为仍缺直接验证。
    - 路线: 自演化智能体基础设施
      解决的问题: 允许智能体跨实验迭代假设、自批评和积累知识，并以少量代码构建领域智能体。
      尚未覆盖: 基准提升是否来自文献智能能力而非通用智能体改进，且缺少报告外的外部验证。
    共识:
    - 近期的证据将文献综合、证据审计和论文生成视为多步智能体工作流，而不是独立检索或摘要。
    - 基于 LLM 评委和评分细则的证据成熟度评估成为常见做法，但人类基线仍然有限。
    - 现有系统能执行分析并生成文档，但可靠性、验证和领域判断缺口仍持续存在。
    - 文献综述自动化和自主发现被明确列为未解决的前沿挑战。
    - 阅读优先分数、引用和图谱声望不是方法学证据；很多零引用或零声望值源于缺少 OpenAlex 标识符，因此排名不能视为既有影响力。
    分歧:
    - 有工作强调带内部验证的端到端自主生成，另一些则强调阶段性诊断和失败分类。
    - 评测目标不同：开放式证据成熟度、领域特定注释与选择题、以及跨领域通用基准并存。
    - 交互模式不同：人机协作的负责人-研究生式分工，与完全自主的自演化智能体回路并存。
    - 监督与验证方式不同：固定 LLM 评委基于产出物评分、人类与多智能体评审、自批评与知识积累并存。
    - 部署领域设置不同：应用数学理论推导、单细胞组学数据发现、以及跨领域通用智能体科学。
    开放问题:
    - 当前证据成熟度和 LLM 评委指标是否对应于真实学术工作流中的文献搜索、缺口发现和综述质量，仍缺外部验证。
    - 什么样的验证信号可以在没有人工专家审查的情况下，发现生成式文献综述中的逻辑错误和无据主张？
    - 记忆退化、过度乐观和实现漂移等失败模式在长跨度文献综合任务中的具体影响尚缺文献情报任务的专门实验。
    - 自演化智能体在文献情报中的收益是否来自知识积累，还是来自通用指令跟随能力提升，需要受控消融。
    - 当前基准在不同基座模型、科学领域和语言上的稳定性仍不明确，现有证据只覆盖单一冻结基座或领域特定任务。
    - 若干证据条目不暴露代码、数据、基线、局限性或影响力元数据；这些是验证缺口，应在强跨系统结论前解决。
