        discovery from reproducing known findings.
      what_remains_open: Proxy metrics do not yet guarantee real scientific validity;
        evidence covers limited domains, one result depends on a single frozen base
        model, and strong baselines still plateau.
    - line: Evidence-maturity scoring and reliability diagnostics
      what_it_solves: Evaluating claims by auditability, novelty, controls, robustness,
        falsifiability, and generalization instead of output-only success, revealing
        discrimination gaps among coding agents.
      what_remains_open: LLM-judge alignment with human judgment is not established;
        scoring depends on a single base model, and dimensions need validation as
        predictors of trustworthy discovery.
    consensus:
    - End-to-end automated research loops can produce plausible workflows and manuscripts,
      but reliability requires an independent evaluation layer such as a verification
      gate, deterministic authority, benchmark, or judge.
    - Blind or hidden-target evidence is treated as more discovery-oriented than reproducing
      known studies, forcing agents to infer claims from data rather than match expected
      conclusions.
    - Current agents show competent execution and documentation, but they generally
      lack controls, robustness checks, falsifiability, and cross-dataset generalization
      needed for trustworthy claims.
    - Reproducibility signals such as code and repositories appear in several systems,
      but external validation and limitation reporting remain verification gaps rather
      than established properties.
    disagreements:
    - 'Evaluation target differs: synthetic task environments versus blind peer-reviewed-study
      tasks versus real single-cell omics data create different coverage and realism
      assumptions.'
    - 'Interaction mode and safeguards differ: one line uses a vision-language physics-verification
      gate, another separates LLM cognition from deterministic program authority,
      and evaluation-first work uses fixed automated judges.'
    - 'Success criteria differ: simulated acceptance thresholds, human peer-review
      acceptance, benchmark task completion, evidence-maturity scores, and task-specific
      metric improvement are not interchangeable.'
    - 'Supervision differs: some claims rely on automated reviewers or fixed LLM judges,
      while one domain benchmark introduces graduate-level human baselines; alignment
      between these signals is unclear.'
    open_questions:
    - Which controls, robustness checks, and falsifiability conditions are necessary
      and sufficient for treating an autonomous research output as a trustworthy discovery
      claim?
    - Do fixed LLM judges and automated reviewers align with human scientific judgment
      across base models, domains, and publication levels?
    - Can verification gates be improved beyond their observed silent-failure miss
      rate and inconsistent workshop-level acceptance?
    - How can evidence-maturity benchmarks move from single frozen base models and
      narrow task sets to standardized external validation across datasets, hardware,
      and user settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 验证门控的自主发现系统
      解决的问题: 将LLM驱动的假设、编码和实验循环转化为可检查的研究流程，通过守卫拒绝无效输出并限制源码变更。
      尚未覆盖: 守卫仍会遗漏静默失败；同行评审通过率不稳定且停留在工作坊层级；跨领域、数据集和用户设置的外部验证尚未建立。
    - 路线: 科学发现基准与任务设计
      解决的问题: 通过固定任务、隐藏或冻结证据、领域数据集，以及人工或自动指标，比较智能体发现能力，区分发现与复现已知结论。
      尚未覆盖: 代理指标尚不能保证真实科学有效性；证据覆盖领域有限，部分结果仅基于单一冻结基座模型，强基线仍处于平台期。
    - 路线: 证据成熟度评分与可靠性诊断
      解决的问题: 从可审计性、新颖性、对照、稳健性、可证伪性和泛化性评估主张，而非仅看输出成功，揭示编码智能体的判断差距。
      尚未覆盖: LLM评判与人类判断的一致性尚未建立；评分依赖单一基座模型；这些维度是否预测可信发现仍需验证。
    共识:
    - 端到端自主研究循环能产出合理工作流和论文，但可靠性需要独立评估层，如验证门、确定性权限、基准或评判器。
    - 盲测或隐藏目标证据比复现已知研究更面向发现，要求智能体从数据推断主张，而不是匹配已知结论。
    - 当前智能体执行和记录分析较熟练，但普遍缺乏可信主张所需的对照、稳健性、可证伪性和跨数据集泛化。
    - 若干系统提供代码或仓库等可复现信号，但外部验证与局限性报告仍是验证缺口，而非已确立性质。
    分歧:
    - 评测目标不同：合成任务环境、盲审同行研究任务与真实单细胞组学数据带来不同的覆盖和真实度假定。
    - 交互与保障不同：一条路线采用视觉-语言物理验证门，另一条将LLM认知与确定性程序权威分离，评测路线使用固定自动评判器。
    - 成功标准不同：模拟接受阈值、人类同行评审通过、任务完成、证据成熟度评分和任务指标提升不可互换。
    - 监督来源不同：部分依赖自动评审或固定LLM评判，领域基准引入研究生级人类基线；这些信号之间的一致性不清晰。
    开放问题:
    - 可信自主发现需要哪些必要且充分的对照、稳健性检查和可证伪性条件？
    - 固定LLM评判和自动评审与跨基座模型、领域和发表层级的人类科学判断是否一致？
    - 验证门能否降低其已观察到的静默失败遗漏率，并改善工作坊层级的不稳定通过率？
    - 证据成熟度基准如何从单一冻结基座模型和狭窄任务集走向跨数据集、硬件和用户设置的标准化外部验证？
