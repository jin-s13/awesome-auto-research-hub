  related_work_outline:
  - 'Mainstream direction: Autonomous multi-agent workflows for scientific discovery,
    literature synthesis, and paper generation, increasingly paired with evidence-grounded
    benchmarks and LLM-based review.'
  - 'Shared research pattern: Systems connect retrieval, reasoning, verification,
    and writing stages; evaluations use blind peer-study tasks or review rubrics to
    score evidence maturity.'
  - 'Key differences: Some build domain-specific synthesis agents, others domain-agnostic
    self-evolving frameworks; some measure generation quality, others measure scientific
    judgment, controls, robustness, and cross-dataset generalization.'
  - 'Trend evolution: Within 2025–2026, work moves from broad surveys and domain benchmarks
    toward blind evidence-grounded evaluation and self-evolving agent frameworks,
    while still noting reliability gaps.'
  - 'Open questions: External citation verification, LLM-judge validity, cross-base-model
    generalization, and whether benchmark gains transfer to literature review and
    research gap discovery.'
  related_work_outline_zh:
  - 主流方向：面向科学发现、文献综合与论文生成的自主多智能体工作流，日益配合基于证据的基准与LLM评审。
  - 研究共性：系统将检索、推理、验证与写作阶段连接；评测采用盲审式同行研究任务或评审量规对证据成熟度打分。
  - 关键差异：有的构建领域特定综合智能体，有的构建领域无关的自演化框架；有的测生成质量，有的侧重新颖性、对照、稳健性与跨数据集泛化。
  - 趋势演进：在2025–2026年内，工作从宽泛综述和领域基准走向盲证据评测与自演化框架，但仍指出可靠性差距。
  - 开放问题：外部引文验证、LLM评审效度、跨基座模型泛化，以及基准收益能否迁移到文献综述和研究缺口发现。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous literature synthesis and manuscript generation agents
      what_it_solves: End-to-end retrieval, literature synthesis, theorem/experiment
        drafting, and paper preparation with internal verification and self-improvement.
      what_remains_open: External citation-level grounding is not demonstrated; limitation
        reporting is sparse, so reliability outside the demonstration domain remains
        unverified.
    - line: Evidence-grounded benchmark and evaluation design
      what_it_solves: Comparable assessment of open-ended discovery and literature
        analysis by hiding source conclusions and scoring artifact-level evidence
        maturity.
      what_remains_open: Current results rely on one frozen base model or a single
        judge; the connection between rubric scores and real literature or discovery
        utility is still unproven.
    - line: Landscape surveys and failure-mode analysis
      what_it_solves: Organizes agentic scientific workflows, evaluation resources,
        and recurring failure patterns to define progress and design principles.
      what_remains_open: Survey categories and failure principles are not yet empirically
        validated as predictors of system behavior or literature workflow success.
    - line: Domain-agnostic self-evolving agent frameworks
      what_it_solves: Provides a reusable agent substrate that refines hypotheses,
        self-critiques, and accumulates knowledge across disciplines.
      what_remains_open: Benchmark gains are concentrated on general science or coding-style
        tasks; transfer to citation-aware literature review and reproducible validation
        is not established.
    consensus:
    - Agentic systems are treated as collaborators that can cover retrieval, reading,
      hypothesis formation, analysis, experimentation, and writing in one workflow.
    - Current evidence shows these systems are useful support tools but have not reached
      trustworthy autonomous scientific or literature discovery.
    - Evaluation is moving toward blind tasks, explicit rubrics, and human or LLM
      baselines rather than reproduction of a known target result.
    - Verification loops, knowledge retrieval, and self-critique are recurring mechanisms
      proposed to reduce logical errors and overclaiming.
    disagreements:
    - One line optimizes end-to-end generation quality; another measures whether agents
      perform controlled, robust, falsifiable analysis on hidden study data.
    - Some approaches are specialized to a narrow scientific domain, while others
      aim for domain-agnostic construction and accumulate knowledge across disciplines.
    - Some evaluation uses curated LLM-based review rubrics or multiple-choice questions;
      others use blind peer-study tasks with human expert baselines.
    - Literature synthesis is sometimes embedded as one stage of a discovery pipeline,
      whereas other work identifies it as an unresolved bottleneck requiring separate
      attention.
    open_questions:
    - How can generated literature reviews cite and verify external sources rather
      than relying on model-proposed or retrieved claims?
    - Are LLM judges stable enough to replace or complement expert assessment across
      domains and base models?
    - Do gains on general scientific discovery benchmarks transfer to literature search,
      survey synthesis, and research gap discovery?
    - Which design choices—verification loops, memory management, domain knowledge,
      or task scaffolding—account for reliable scientific judgment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主文献综合与论文生成智能体
      解决的问题: 端到端检索、文献综合、推导/实验草稿与论文准备，并加入内部验证和自我改进。
      尚未覆盖: 外部引文级证据不足；局限性披露稀疏，演示领域之外的可靠性尚未验证。
    - 路线: 基于证据的基准与评测设计
      解决的问题: 通过隐藏来源结论并对产出物级证据成熟度打分，评估开放式发现和文献分析。
      尚未覆盖: 当前结果依赖单一冻结基座模型或单一评委；量规分数与真实文献/发现效用之间的联系仍未证明。
    - 路线: 领域综述与失败模式分析
      解决的问题: 整理智能体科研工作流、评测资源和重复失败模式，提炼进展与设计原则。
      尚未覆盖: 综述分类和失败原则是否预测系统行为或文献工作流成败尚缺实证验证。
    - 路线: 领域无关的自演化智能体框架
      解决的问题: 提供可复用的智能体底座，使其跨学科优化假设、自我批判并积累知识。
      尚未覆盖: 基准收益集中在通用科学或代码类任务；向引文感知的文献综述和可复现验证的迁移未确立。
    共识:
    - 智能体系统被视为协作者，可覆盖检索、阅读、假设形成、分析、实验与写作等工作流阶段。
    - 当前证据显示这些系统是有用辅助工具，但尚未达到可信任的自主科学或文献发现。
    - 评测正在转向盲任务、显式量规和人工或LLM基线，而不是复现已知目标结果。
    - 验证循环、知识检索和自我批判被反复提出，用于减少逻辑错误和过度声明。
    分歧:
    - 一条路线优化端到端生成质量；另一条衡量智能体在隐藏研究数据上是否做出有对照、稳健、可证伪的分析。
    - 有的方法面向狭窄科学领域，有的追求领域无关构造并跨学科积累知识。
    - 有的评测采用LLM评审量规或选择题；有的采用盲同行研究任务并设置人类专家基线。
    - 文献综合有时作为发现流程的一个阶段，有时被单独视为尚未解决的瓶颈。
    开放问题:
    - 生成的文献综述如何引用并核验外部来源，而不是依赖模型提出或检索到的声明？
    - LLM评审在不同领域和基座模型上是否足够稳定，能否替代或补充专家评估？
    - 一般科学发现基准上的收益能否迁移到文献搜索、综述综合和研究缺口发现？
    - 验证循环、记忆管理、领域知识或任务脚手架中，哪些设计选择真正决定可靠科学判断？
