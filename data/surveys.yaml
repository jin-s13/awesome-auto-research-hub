  related_work_outline:
  - 'Mainstream direction: Autonomous LLM-based research agents that generate hypotheses
    or ideas, execute code/experiments, and produce reported results; stronger systems
    add verification gates, self-correction loops, and human touchpoints to reduce
    invalid claims.'
  - 'Shared research pattern: Idea generation is treated as part of a closed loop
    with execution and evidence, so hypotheses are revised from diagnostics, failures,
    and prior rounds rather than generated as isolated text.'
  - 'Key differences: Systems target different domains and tasks, use different reliability
    mechanisms such as physics-aware gates, cognition-authority separation, or multi-hypothesis
    failure attribution, and differ in whether they produce benchmarks, domain discoveries,
    or architecture improvements.'
  - 'Trend evolution: The available 2025-2026 evidence shows a frontier shift from
    surveys and diagnostic benchmarks toward more reliable autonomous research loops
    with targeted human collaboration, factual reporting, and failure-driven self-correction.'
  - 'Open questions: How to measure research-level novelty separately from ML engineering
    tricks; whether domain-specific gates generalize; what level of human oversight
    is needed; and whether conference-ready writing remains beyond current verifiability.'
  related_work_outline_zh:
  - 主流方向：基于LLM的自主研究智能体负责提出假设或研究想法，执行代码/实验并产出可报告结果；较强系统进一步引入验证门控、自纠正循环和人工介入以减少无效或虚假主张。
  - 研究共性：想法生成被嵌入“执行—证据—修正”闭环，假设根据诊断、失败和先前轮次不断更新，而不是只生成孤立文本。
  - 关键差异：目标领域与任务不同，可靠性机制不同，例如物理感知门控、认知-权威分离或多假设失败归因；产物也不同，有的是基准，有的是领域发现或架构改进。
  - 趋势演进：2025–2026年证据显示从综述和诊断基准走向更可靠的自主研究循环，强调精准人机协作、事实性报告和失败驱动的自我纠正。
  - 开放问题：如何将研究级新颖性与ML工程技巧增益分离；领域专用门控能否跨域泛化；最低有效人工监督层级；可验证的会议级写作是否仍难实现。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous hypothesis generation and execution loops
      what_it_solves: Convert open-ended research questions into executable experiments,
        code modifications, or architecture search with evidence accumulation.
      what_remains_open: Whether the generated hypotheses reflect domain-level insight
        rather than local engineering tweaks remains underevidenced.
    - line: Verification-gated self-correction and factual reporting
      what_it_solves: Constrain reported results to measured values and diagnose failures
        before routing revisions to hypothesis, design, or implementation levels.
      what_remains_open: Validity gates can still miss planted failures, and fully
        autonomous scientific writing remains difficult.
    - line: Human-AI collaborative research control
      what_it_solves: Insert human judgment at high-leverage decision points, from
        team role setup to intervention modes, instead of all-or-nothing autonomy.
      what_remains_open: Optimal collaboration granularity and generalization beyond
        small internal case studies are open.
    - line: Benchmark and testbed design for AI scientists
      what_it_solves: Create expert-labeled or long-horizon tasks and baselines to
        compare AI scientist capabilities and failure modes.
      what_remains_open: Coverage is limited across real scientific domains, and proxy
        metrics may not capture actual discovery utility.
    - line: Domain-specific discovery agents
      what_it_solves: Embed domain constraints, such as physics-aware visual inspection
        or biological data tasks, into ideation and validation.
      what_remains_open: Validation is concentrated on specific datasets, modest human
        baselines, and domain-specific failure modes.
    consensus:
    - Idea generation alone is insufficient; hypotheses must be connected to executable
      experiments or code.
    - Verification and factual-reporting constraints reduce hallucinated or fabricated
      scientific claims.
    - Reliability improves when systems can use failure evidence to revise subsequent
      hypotheses.
    - Current benchmarks show that agents can improve metrics, but gains often come
      from engineering tricks rather than novel research insight.
    disagreements:
    - 'Evaluation target differs: some systems are judged on domain discovery tasks,
      while others are judged on broad scientific ML improvement or expert review
      of novelty and presentation.'
    - 'Reliability strategy differs: deterministic authority and validity gates versus
      structured multi-agent debate and self-healing retry loops.'
    - 'Human involvement differs: full autonomy, targeted high-leverage collaboration,
      or exhaustive intervention modes are all used.'
    - 'Evidence emphasis differs: leaderboard metrics and artifact quality versus
      scientific claim validity and reporting trustworthiness.'
    open_questions:
    - Which evaluation designs can separate novel research hypotheses from ML-engineering
      sweeps in open-ended tasks?
    - How can verification gates be made to catch silent failures across domains and
      beyond planted-ablation settings?
    - What human intervention modes are necessary and sufficient for different scientific
      workflows?
    - Several top systems lack explicit limitation details or publicly visible code
      signals, leaving replication and failure boundaries as verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主假设生成与执行闭环
      解决的问题: 把开放式研究问题转化为可执行实验、代码修改或架构搜索，并积累证据。
      尚未覆盖: 所生成假设是否体现领域层级洞察，而非局部工程调整，证据仍不足。
    - 路线: 带验证门控的自纠正与事实性报告
      解决的问题: 将报告结果约束到实际测量值，并在失败后把修正路由到假设、设计或实现层。
      尚未覆盖: 验证门控仍会漏掉植入失败，全自主科学写作仍很困难。
    - 路线: 人机协作研究控制
      解决的问题: 在高杠杆决策点引入人类判断，例如团队角色设置和干预模式，而不是全有或全无自主。
      尚未覆盖: 最优协作粒度和超出小规模内部案例的泛化仍不明确。
    - 路线: AI科学家基准与测试床设计
      解决的问题: 通过专家标注或长周期任务和基线，让AI科学家能力与失败模式可比较。
      尚未覆盖: 真实科学领域覆盖有限，代理指标未必反映实际发现效用。
    - 路线: 领域专用发现智能体
      解决的问题: 在构思与验证中嵌入领域约束，如物理感知视觉检查或生物数据任务。
      尚未覆盖: 验证集中在特定数据集、有限人类基线和领域特定失败模式。
    共识:
    - 仅提出想法不够，假设必须连接到可执行实验或代码。
    - 验证和事实性报告约束可减少幻觉或伪造的科学主张。
    - 当系统能利用失败证据修正后续假设时，可靠性会提高。
    - 当前基准显示智能体能改进指标，但增益常来自工程技巧而非新研究洞察。
    分歧:
    - 评测目标不同：有些按领域发现任务评判，有些按广泛科学ML改进或专家对新颖性与呈现的评审评判。
    - 可靠性策略不同：确定性权威与验证门控，对比结构化多智能体辩论与自愈重试循环。
    - 人类参与不同：完全自主、精准高杠杆协作或逐步干预模式并存。
    - 证据侧重不同：排行榜指标与工件质量，对比科学主张层面的有效性与报告可信度。
    开放问题:
    - 哪些评测设计能区分开放式研究中的新假设与ML工程技巧提升？
    - 如何让验证门控在不同领域和超出植入消融的环境中捕获静默失败？
    - 不同科学工作流需要哪些必要且充分的人类干预模式？
    - 若干系统缺少明确的局限性说明或公开可见代码信号，使复现与失败边界成为验证缺口。
