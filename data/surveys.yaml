  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agent frameworks, e.g., The AI Scientist
        and AI Scientist-v2
      what_it_solves: Automates hypothesis generation, code and experiment execution,
        visualization, manuscript writing, and iterative reviewer feedback in a single
        discovery loop.
      what_remains_open: Inconsistent acceptance rates and weak evidence for controls,
        robustness, falsifiability, and cross-dataset generalization; mostly validated
        in narrow machine learning or workshop settings.
    - line: Discovery benchmark and evaluation environments, e.g., DISCOVERYWORLD,
        TruthInsightBench, BAISBench
      what_it_solves: Makes open-ended agent performance comparable through fixed
        tasks, metrics, and human baselines, while hiding target conclusions or using
        real data.
      what_remains_open: Whether benchmark success transfers to real discovery utility;
        current evidence often uses one frozen base model or limited domains and does
        not establish broad generalizability.
    - line: Evidence-grounded auditability and automatic judging
      what_it_solves: Separates execution and documentation competence from claim
        validity by scoring evidence maturity, auditability, novelty, and explanatory
        knowledge without per-instance human review.
      what_remains_open: LLM judges may miss silent failures and cannot yet guarantee
        the discriminating acts needed for trustworthy claims.
    - line: Reliability-oriented agent orchestration and domain-specific verification
      what_it_solves: Adds deterministic program authorities, source-edit boundaries,
        canonical evaluation, or physics and vision verification gates to reduce failure
        and improve implementation success in autonomous research.
      what_remains_open: Domain-specific gates still missed 2 of 16 planted silent
        failures and lack standardized external validation across hardware, datasets,
        and user settings.
    consensus:
    - Autonomous agents can execute and document analyses, but current systems plateau
      on scientific judgment and lack controls, robustness, falsifiability, and cross-dataset
      generalization.
    - Evaluation is moving toward evidence-grounded tasks with automated judges and
      human or domain-specific baselines, rather than measuring implementation success
      alone.
    - Open-source code and artifacts are common, but they do not close the gap between
      executing plausible analyses and producing defensible scientific claims.
    - Recent systems increasingly pair LLM-driven reasoning with deterministic or
      domain-specific verification to limit unsupported claims.
    disagreements:
    - 'Evaluation substrate differs: virtual text-based tasks, blind tasks from peer-reviewed
      studies, real single-cell and forecasting data, and closed-domain fluid dynamics
      measure novelty, evidence maturity, annotation support, or domain metric improvement.'
    - 'Supervision boundary differs: one line relies on LLM-based reviewers or judges,
      another uses deterministic program authority for source edits and promotion,
      and another uses a vision-language physics gate.'
    - 'Claim target differs: workshop peer-review acceptance, evidence-grounded auditability,
      or task-specific architecture and forecasting improvement.'
    open_questions:
    - Do automated LLM judges align with human peer review across domains, and can
      they detect unsupported or silently wrong claims?
    - What base-model and dataset diversity is needed to separate general scientific
      capability from single-frozen-model or few-case results?
    - How should benchmarks measure controls, robustness, falsifiability, and cross-dataset
      generalization rather than only execution competence?
    - Can verification gates be standardized without overfitting to domain-specific
      failure modes, given that a physics gate missed planted silent failures?
    - What governance, accountability, and safety mechanisms are needed for autonomous
      research systems, since the current evidence mostly addresses technical evaluation?
