  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery pipelines
      what_it_solves: Automates idea generation, code implementation, experiment execution,
        result visualization, and manuscript writing in a single closed loop.
      what_remains_open: Consistency across domains and publication venues, with at
        least one pipeline passing only one of three workshop submissions.
    - line: Verification and structured search orchestration
      what_it_solves: Improves autonomous experimentation reliability through internal
        logical verification, agentic tree search, experiment managers, and reviewer
        feedback loops.
      what_remains_open: Whether higher generated-paper scores correspond to genuine
        research insight or transfer beyond selected ML and applied-math settings.
    - line: Benchmark and virtual evaluation environments
      what_it_solves: Creates comparable discovery tasks and scientific-ML benchmarks
        to score task completion, task-relevant actions, explanatory knowledge, and
        improvement over published baselines.
      what_remains_open: Proxy metrics may not reflect real decision utility; coverage
        is limited relative to the breadth of empirical and lab-based science.
    - line: Failure-aware shared memory systems
      what_it_solves: Records unsuccessful typed attempt records so downstream agents
        can avoid prior failures, improve performance, and use fewer tokens.
      what_remains_open: Demonstrated transfer mainly on same-benchmark retries and
        PDE problems; broader cross-domain and long-term novelty effects remain unproven.
    - line: Interactive multi-agent research platforms
      what_it_solves: Provides human-configurable roles, real-time monitoring, artifact
        inspection, rollback/resume control, and local code/dataset integration for
        experiment loops.
      what_remains_open: Evaluation comes from few internal case studies; platform
        maturity and generalization beyond AI research tasks are unverified.
    consensus:
    - Autonomous agents can now execute the experimentation cycle from hypothesis
      through coding, analysis, and write-up, but they need verification, review,
      or memory mechanisms to be reliable.
    - Evaluation is shifting from static leaderboards toward process-level signals
      such as task completion, action quality, generated-paper review, peer acceptance,
      or improvement over published models.
    - Gains are frequently demonstrated on narrow case studies or benchmark suites,
      leaving external validity and real scientific utility as open issues.
    - Some evidence separates raw engineering improvements from domain-specific insight,
      suggesting current systems underperform on novelty and resource use.
    disagreements:
    - 'Evaluation targets differ: simulated discovery tasks, manuscript review/peer
      acceptance, and in-the-wild published-baseline improvement are not interchangeable.'
    - 'System design emphasis differs: one line adds verification/search, another
      adds interactive human oversight, and another adds failure memory; they address
      distinct failure modes.'
    - Fully automated pipelines assume minimal human intervention, while interactive
      platforms assume a human principal investigator or operator can guide and monitor
      runs.
    - 'Benchmark gain interpretation differs: one study attributes most improvement
      to ML-engineering tricks, while other systems claim autonomous research contributions.'
    open_questions:
    - Do automated reviewers and task/benchmark proxy metrics align with peer review
      and long-term scientific impact?
    - Can failure memory or structured search produce consistent full-conference-level
      contributions rather than occasional successes?
    - How well do systems transfer from ML or applied-math case studies to wet-lab,
      materials, or other experiment-driven domains?
    - What is the missing evidence behind empty limitation fields and absent artifact
      links, and how would it change reproducibility claims?
