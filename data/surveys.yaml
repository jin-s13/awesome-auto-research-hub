  related_work_outline_zh:
  - 主流方向：端到端自主科研智能体覆盖选题、实验、分析和论文写作，并越来越多加入验证门控、领域约束和自动评估。
  - 研究共性：以 LLM 为骨干，把科研闭环拆成假设、执行、分析、写作，再用模拟评审、基准任务或证据成熟度评分判断产出。
  - 关键差异：领域包括通用机器学习、应用数学、CFD 和多领域盲任务；验证机制有逻辑审计、物理视觉门控、模拟评审和确定性裁判；评测侧重论文质量、任务完成或证据成熟度。
  - 趋势演进：2024 年主要是通用框架和虚拟环境，2025 年出现树搜索与工作坊级评审，2026 年更强调领域验证和证据基准；重心从生成能力转向可信性。
  - 开放问题：自动评分能否代表真实科学进展，验证门如何减少漏检，智能体为何缺乏对照和稳健性，跨基座模型和跨领域泛化仍未知。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery workflows, such as The AI Scientist and
        The AI Scientist-v2
      what_it_solves: Combines idea generation, code execution, experiment management,
        visualization, and manuscript writing into a single low-cost loop for open-ended
        ML research.
      what_remains_open: Generated papers are inconsistent and lack trustworthy controls,
        robustness, and falsifiability; peer-review success is currently limited to
        workshop-level acceptance.
    - line: Domain-specific discovery systems with verification gates, such as ReasFlow
        and AI CFD Scientist
      what_it_solves: Reduces silent failures in theory-heavy or simulation-heavy
        domains by coupling execution with logic consistency audits or physics-aware
        visual verification before claims are written.
      what_remains_open: Verification gates still miss planted failures, and it is
        unclear how far these domain-specific mechanisms transfer to new fields or
        backbone models.
    - line: Benchmark environments and evidence-grounded evaluation, such as DISCOVERYWORLD
        and TruthInsightBench
      what_it_solves: Provides repeatable tasks and automatic scoring for scientific
        discovery cycles or blind data interpretation, making agent capabilities more
        comparable.
      what_remains_open: Results are based on limited base models and task coverage,
        and LLM-judge or task-completion scores are not yet validated against real
        scientific utility.
    - line: Multi-agent reasoning-centric discovery with knowledge retrieval
      what_it_solves: Supports theorem proving and derivation-intensive applied mathematics
        through PI-student style collaboration, internal correction, and proactive
        retrieval of facts and procedural heuristics.
      what_remains_open: Evaluation relies on curated LLM review rubrics with no reported
        limitations or external human validation, leaving the strength of the underlying
        scientific contribution unclear.
    consensus:
    - All approaches use LLM-driven agents to close the cycle from hypothesis through
      execution, analysis, and manuscript generation.
    - All introduce some automated verification or review mechanism to reduce human
      inspection and attempt to ensure output quality.
    - Current systems can execute and document analyses competently but still lack
      the discriminating behaviors needed for trustworthy scientific claims, especially
      controls, robustness, and falsifiability.
    - The field is shifting from asking whether an agent can generate a paper toward
      asking whether its evidence is mature and its conclusions are defensible.
    disagreements:
    - 'Evaluation targets differ: generated manuscript quality versus task completion
      in a virtual environment versus evidence maturity on blind data.'
    - 'Verification strategies differ: internal logical coherence auditing, vision-based
      physics field inspection, simulated peer review, and deterministic evidence-maturity
      judging.'
    - 'Deployment settings differ: general machine learning workflows, applied mathematics
      theory generation, computational fluid dynamics simulation, and multi-domain
      blind scientific tasks.'
    - 'Interaction and autonomy differ: human PI-agent collaborative workflows versus
      fully automated end-to-end pipelines.'
    - 'Success signals differ: acceptance thresholds from automated or human workshop
      review versus task-completion metrics versus evidence-based score dimensions.'
    open_questions:
    - Do high automated-review or workshop acceptance scores indicate real scientific
      progress, or only alignment with reviewer preferences and generated-paper style?
    - Why do coding agents plateau in evidence maturity and consistently lack controls,
      robustness, and falsifiability, and what architectural or training changes would
      close this gap?
    - How can verification gates be improved to catch missed silent failures while
      extending beyond a single domain or simulator?
    - To what extent are reported findings dependent on a frozen base model, a particular
      simulator, or a narrow set of tasks, given missing cross-base-model and cross-domain
      validation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现工作流，如 The AI Scientist、The AI Scientist-v2
      解决的问题: 将选题、代码执行、实验管理、可视化和论文写作整合为低成本闭环，用于开放式机器学习研究。
      尚未覆盖: 生成论文质量不稳定，缺少可信赖的对照、稳健性和可证伪性；目前仅达到工作坊级同行评审接受。
    - 路线: 带验证门控的领域发现系统，如 ReasFlow、AI CFD Scientist
      解决的问题: 通过逻辑一致性审计或物理感知视觉检查，在撰写结论前减少理论密集或仿真密集领域的静默失败。
      尚未覆盖: 验证门仍会漏检植入失败，且这些领域机制能否迁移到新领域或新基座模型尚未可知。
    - 路线: 基准环境与证据成熟度评测，如 DISCOVERYWORLD、TruthInsightBench
      解决的问题: 为科学发现完整循环或盲数据解释提供可重复任务和自动评分，使智能体能力更可比较。
      尚未覆盖: 结果仅基于有限基座模型和任务覆盖，LLM 裁判或任务完成分数与真实科研效用的一致性尚未验证。
    - 路线: 知识检索驱动的多智能体推理发现
      解决的问题: 通过 PI-研究生式协作、内部纠错和主动检索事实与过程性启发法，支持定理证明和推导密集的应用数学研究。
      尚未覆盖: 评估依赖精选 LLM 评审标准，未报告局限性，也缺少外部人工验证，科学贡献强度难以判断。
    共识:
    - 所有方法都用 LLM 驱动智能体完成从假设、执行、分析到论文生成的科研闭环。
    - 所有方法都引入某种自动验证或评审机制，以减少人工检查并尽量保证产出质量。
    - 现有系统能较熟练地执行和记录分析，但仍缺乏可信科学主张所需的对照、稳健性和可证伪性。
    - 领域正在从关注智能体能否生成论文，转向关注证据是否成熟、结论是否可辩护。
    分歧:
    - 评测目标不同：生成论文质量、虚拟环境中的任务完成、盲数据上的证据成熟度。
    - 验证策略不同：内部逻辑一致性审计、基于视觉的物理场检查、模拟同行评审、确定性证据成熟度裁判。
