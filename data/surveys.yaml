  related_work_outline:
  - 'Mainstream direction: Building multi-agent autonomous scientific research systems
    where literature intelligence appears as retrieval-backed synthesis, survey automation,
    and full manuscript generation, with examples including ReasFlow and EvoMaster.'
  - 'Shared research pattern: Systems wrap LLM or coding agents around scientific
    workflows and use automated rubrics, blind evidence tasks, or human baselines
    to score generated claims and papers.'
  - 'Key differences: Evaluation targets range from generated-paper rigor and broad
    benchmark accuracy to blind discovery evidence maturity and domain-specific tasks;
    interaction modes range from human-as-principal-investigator to fully benchmarked
    coding agents.'
  - 'Trend evolution: The 2025 evidence emphasizes surveys, human baselines, and domain
    benchmarks; 2026 work shifts toward self-evolving frameworks and evidence-grounded
    blind evaluation, with the trend confined to the current frontier window.'
  - 'Open questions: How to verify literature provenance and citation quality, link
    proxy scores to real research utility, and extend evidence beyond narrow domains,
    single base models, and short evaluation cycles.'
  related_work_outline_zh:
  - 主流方向：构建多智能体自主科研系统，将文献检索支持的综合、综述自动化和完整论文生成结合，例如 ReasFlow 与 EvoMaster。
  - 研究共性：将 LLM 或编程智能体纳入科研工作流，并用自动评审、盲测证据任务或人类基线对生成结论与论文进行评分。
  - 关键差异：评测目标从生成论文严谨性、通用基准准确率到盲发现证据成熟度和领域任务不一；交互方式从人类担任首席研究员到完全基准化编码智能体各异。
  - 趋势演进：2025 年证据偏重综述、人类基线和领域基准；2026 年更多转向自演化框架与证据锚定的盲评，趋势仍处于当前前沿窗口内。
  - 开放问题：如何验证文献溯源与引用质量，如何把代理指标映射到真实研究效用，以及如何超越窄领域、单一基座模型和短评测周期推广证据。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end literature-to-manuscript pipelines with internal verification
        and knowledge retrieval
      what_it_solves: Automates literature synthesis, derivation checking, and full
        research paper generation inside a human-supervised loop.
      what_remains_open: Evaluation relies heavily on LLM-based rubrics and self-generated
        outputs; independent external validation and limitation reporting are missing.
    - line: Evidence-grounded evaluation and blind task benchmarks
      what_it_solves: Makes agent claims comparable by hiding source conclusions and
        scoring evidence maturity, controls, robustness, falsifiability, and generalization.
      what_remains_open: Current results depend on a single frozen base model, limited
        domain/task samples, and automated judges not yet tied to real discovery or
        literature utility.
    - line: Self-evolving domain-agnostic agent frameworks
      what_it_solves: Provides reusable infrastructure for iterative hypothesis refinement,
        self-critique, and knowledge accumulation across disciplines.
      what_remains_open: No limitation evidence is shown; broad benchmark gains do
        not isolate literature-specific abilities such as retrieval provenance or
        gap discovery.
    - line: Failure-mode case studies and design principles
      what_it_solves: Documents recurring autonomous-research failures such as memory
        degradation, implementation drift, and premature success claims, then derives
        design principles.
      what_remains_open: Evidence comes from a small number of end-to-end attempts
        and post-hoc analysis; standardized failure metrics and reproducibility across
        systems are unestablished.
    - line: Survey and taxonomy of agentic scientific workflows
      what_it_solves: Organizes systems by scientific domain and capability, including
        literature review automation, and catalogs metrics, frameworks, datasets,
        and challenges.
      what_remains_open: The taxonomy is not empirically tested for predictive value;
        literature review automation and system reliability remain unresolved.
    consensus:
    - Systems are often multi-agent or pipeline-based and couple generation with verification,
      critique, or evidence auditing.
    - Current agents can execute documented analyses and produce paper-like outputs
      but are not fully autonomous scientists; human oversight and domain judgment
      remain necessary.
    - Evaluation is moving toward blind, evidence-grounded, rubric-based, or LLM-judge
      settings with human baseline comparisons.
    - Recurring reliability problems include insufficient controls, overexcitement,
      memory degradation, and weak scientific taste.
    disagreements:
    - 'Evaluation target differs: some work scores generated papers or theoretical
      rigor, while others score blind discovery evidence maturity, domain multiple-choice
      tasks, or general benchmark accuracy.'
    - 'Interaction mode differs: one strand places a human expert as principal investigator,
      another evaluates coding agents with frozen data and hidden conclusions, and
      another frames self-evolution as domain-agnostic infrastructure.'
    - Domain focus differs across applied mathematics theory generation, biological
      omics discovery, general machine-learning research, and cross-domain science
      coverage.
    - 'Success-evidence strength differs: one benchmark reports no statistically reliable
      pairwise separation among agents, while a framework reports large relative gains
      without visible limitation evidence.'
    open_questions:
    - Can literature provenance, citation coverage, and research-gap validity be measured
      independently from generated paper quality?
    - Do automated rubric scores and discovery benchmarks predict real literature
      review or research decisions?
    - How do current systems generalize beyond one frozen base model, narrow tasks,
      and selected domains?
    - Which oversight or verification interfaces reduce recurring failures such as
      memory degradation and false success declarations?
    - Where are direct comparisons against human literature reviewers and citation-analysis
      baselines?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端文献到论文流水线，带内部验证与知识检索
      解决的问题: 在人类监督循环中自动化文献综合、推导检查和完整研究论文生成。
      尚未覆盖: 评测高度依赖基于 LLM 的评分与自生成产出；缺少独立外部验证和局限性报告。
    - 路线: 证据锚定的评测与盲任务基准
      解决的问题: 通过隐藏源结论并评分证据成熟度、对照、稳健性、可证伪性与泛化性，使智能体主张可比。
      尚未覆盖: 现有结果依赖单一冻结基座模型、有限领域与任务样本及自动裁判，尚未关联真实发现或文献效用。
    - 路线: 自演化领域无关的智能体框架
      解决的问题: 提供可复用基础设施，用于迭代假设优化、自我批判和跨学科知识积累。
      尚未覆盖: 未展示局限性证据；广泛基准提升未隔离文献检索溯源或研究缺口发现等能力。
    - 路线: 失败模式案例研究与设计原则
      解决的问题: 记录自主研究反复出现的失败，如记忆退化、实现漂移和过早宣布成功，并推导设计原则。
      尚未覆盖: 证据来自少量端到端尝试与事后分析；缺乏跨系统标准化失败指标和可复现性。
    - 路线: 智能体科学工作流的综述与分类
      解决的问题: 按科学领域和能力组织系统，包括文献综述自动化，并梳理指标、框架、数据集和挑战。
      尚未覆盖: 分类未经预测效力的实证检验；文献综述自动化和系统可靠性仍被列为未解决。
    共识:
    - 系统通常为多智能体或流水线形式，并把生成与验证、自我批判或证据审计结合。
    - 当前智能体能执行有记录的分析并生成类论文输出，但尚未成为完全自主科学家；人类监督与领域判断仍必要。
    - 评测正在向盲任务、证据锚定、基于评分标准或 LLM 裁判以及人类基线对比方向演进。
    - 对照不足、过度兴奋、记忆退化和科学品味薄弱等可靠性问题反复出现。
    分歧:
    - 评测目标不同：有的评生成论文或理论严谨性，有的评盲发现证据成熟度，有的评领域选择题或通用基准准确率。
    - 交互方式不同：一类以人类专家为首席研究员，一类用冻结数据和隐藏结论评估编码智能体，一类把自演化作为领域无关基础设施。
    - 领域侧重不同：应用数学理论生成、生物组学发现、通用机器学习研究和跨领域科学覆盖不均。
    - 成功证据强度不同：一个基准显示编码智能体间无统计可靠差异，另一个框架报告大幅相对提升但未展示局限性证据。
    开放问题:
    - 如何独立测量文献溯源、引用覆盖和研究缺口有效性，而非仅论文生成质量？
    - 自动评分与发现基准是否能预测真实文献综述或研究决策效用？
    - 现有系统在单一冻结基座模型、窄任务和特定领域之外如何泛化？
    - 哪些监督或验证界面能减少记忆退化、错误成功声明等反复失败？
    - 与人类文献评审者和引文分析基线之间的直接比较仍缺失。
