    研究路线矩阵:
    - 路线: 自主多智能体假设生成与迭代修正流程
      解决的问题: 把文献和数据转化为可通过实验反馈、代码执行和结果解释持续更新的假设
      尚未覆盖: 报告陈述准确性、弱方向拒绝以及超出有限周期和已展示领域后的扩展性仍不确定
