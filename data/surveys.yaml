  - 研究共性：把发现过程分解为假设、实验和证据的迭代循环；使用具备工具调用、代码解释器和结构化记忆或研究树的LLM智能体；在合成或真实生物任务及湿实验上评测。
  - 关键差异：自主程度从完全自主到高杠杆决策点人机协作不等；搜索结构在树形进化探索与长时间并行迭代之间不同；评测目标涵盖通用研究基准、生物实验任务、方程发现数据集和湿实验验证。
  - 趋势演进：2025-2026年前沿从综述型分类和单领域AI科学家示范，走向更难的现实基准、可溯源多智能体系统、自我纠错以及对可重复性与验证缺口的显式讨论。
  - 开放问题：报告增益是否反映通用假设生成能力还是任务特定流程；如何减少不准确陈述和弱方向持续；如何跨领域和更长周期验证；如何使代理指标与真实科学效用一致。
  literature_review:
    line_of_work_matrix:
    - line: Systems and reproducible infrastructure for autonomous discovery workflows
      what_it_solves: turning isolated LLM agent capabilities into runnable multi-agent
        stacks with tools, code execution, and repeatable hypothesis-experiment-report
        cycles
      what_remains_open: whether reported gains reflect general discovery ability
        or task-specific orchestration, and missing standardized external validation
        across domains and settings
    - line: Shared state and traceability modeling for long-horizon research agents
      what_it_solves: coordinating literature search and data analysis through structured
        information sharing and verifiable reasoning over long rollouts
      what_remains_open: accuracy and scaling evidence beyond observed cycle limits,
        and robustness across domain shifts
    - line: Evaluation benchmarks and evidence design for scientific AI
      what_it_solves: making AI research capability claims comparable through realistic
        tasks, baselines, and difficulty measurements
      what_remains_open: whether benchmark accuracy reflects real discovery utility
        and whether task coverage can extend beyond current biology/science subsets
    - line: Conceptual taxonomy and workflow-condition analysis for research automation
      what_it_solves: organizing autonomy spectra, workflow conditions, and evaluation
