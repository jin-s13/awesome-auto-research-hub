  related_work_outline:
  - 'Mainstream direction: Building autonomous research agents and agent-agnostic
    workbenches that make long-horizon research loops cheaper and more evaluable,
    with separate research state, reusable knowledge, and held-out feedback.'
  - 'Shared research pattern: Externalize durable evidence or skills from raw agent
    context, allocate expensive feedback sparsely, and evaluate task completion/accuracy
    together with token, query, or development cost.'
  - 'Key differences: Some work focuses on stateless harness context, some on surrogate
    or experience-based feedback efficiency, some on reusable repository skills, and
    some on self-built evaluator quality; domains range from code and ML to materials
    and time series.'
  - 'Trend evolution: Visible top-paper evidence clusters in 2026 and shifts toward
    longer-horizon budgets, agent-agnostic infrastructure, held-out or sealed transfer,
    and efficiency metrics; earlier 2024-2025 trends are not inferable from this packet.'
  - 'Open questions: Whether dev/sealed/hold-out gains transfer to real research utility,
    how to avoid persistent surrogate or experience errors, and how to close reproducibility
    gaps from missing code, data, baselines, or limitation statements.'
  related_work_outline_zh:
  - 主流方向：构建自主研究智能体与智能体无关工作台，通过分离研究状态、复用知识以及留出反馈，让长程研究循环更便宜、更可评估。
  - 研究共性：把持久证据或技能从智能体上下文中外部化，稀疏分配昂贵反馈，并在任务完成/准确率之外报告 token、查询或开发成本。
  - 关键差异：有些工作聚焦无状态框架上下文，有些聚焦代理或经验反馈效率，有些聚焦仓库技能复用，有些聚焦自建评估器质量；领域涵盖代码、ML、材料和时序预测。
  - 趋势演进：可见顶级论文集中在 2026 年，朝向更长预算、智能体无关基础设施、留出或密封迁移及效率指标发展；2024–2025 趋势因证据不足无法判断。
  - 开放问题：开发/密封/留出收益能否转化为真实研究效用，如何避免持续代理或经验误差，以及如何弥补缺失代码、数据、基线与局限性声明的可复现缺口。
  literature_review:
    line_of_work_matrix:
    - line: Evaluation and benchmark design for autonomous research
      what_it_solves: Creates comparable tasks, budgets, baselines, and metrics for
        research agents, including self-built evaluator quality and held-out material
        modeling transfer.
      what_remains_open: Sealed-target and dev-target rankings diverge, evaluator
        agreement remains below target disagreement ceilings, and no single researcher
        config wins all metrics.
    - line: Long-horizon state and context management
      what_it_solves: Prevents history replay, duplicated work, and stalled experimentation
        by storing durable research state outside conversations and giving agents
        focused, role-specific contexts.
      what_remains_open: Benefits are shown on software engineering, kernel optimization,
        and algorithm tasks; explicit limitations are absent, and generalization to
        other research workflows is unmeasured.
    - line: Closed-loop feedback allocation and surrogate repair
      what_it_solves: Uses sparse high-fidelity evaluations to update surrogates during
        longer searches and chooses candidates by decision-relevant acquisition rules.
      what_remains_open: Improving global surrogate fit does not necessarily reduce
        regret; fixed surrogates leave persistent errors; evidence mainly covers synthetic
        and MADE benchmarks.
    - line: Reusable experience and skill libraries
      what_it_solves: Distills prior experimental trajectories or GitHub repositories
        into verified, reusable experience or skills that improve agent performance
        and reduce interaction or development cost.
      what_remains_open: Several systems lack explicit limitations; whether libraries
        transfer across research domains without contamination or stale knowledge
        remains unresolved.
    - line: Domain-specific workbenches and transfer protocols
      what_it_solves: Provides shared resources and tools for time series forecasting
        research or materials discovery, with reproduction, benchmarking, and new
        method development workflows.
      what_remains_open: Materials transfer is limited to ten Matbench endpoints and
        one holdout intervention failed; time series workbench lacks stated own limitations;
        broader external validation is open.
    consensus:
    - Durable research state or reusable external knowledge is preferable to treating
      growing conversation history as the only memory.
    - Sparse, targeted, or pilot feedback can improve research-agent efficiency while
      preserving or improving final performance.
    - Practical evaluations now add cost signals such as tokens, oracle queries, and
      development time to task completion or accuracy.
    - Agent-agnostic shared infrastructure can make existing agents more reproducible
      and can lower research iteration costs.
    disagreements:
    - 'Where durable knowledge should live: harness state, an experience library,
      a surrogate, or a repository-derived skill library.'
    - 'Feedback evidence: frozen held-out evaluation, sealed targets hidden from the
      researcher, online surrogate acquisition, or targeted pilot experiments when
      prior experience is insufficient.'
    - 'Evaluation target: some benchmark task completion and accuracy in code/ML/materials/time
      series; others benchmark the quality of evaluators an agent creates.'
    - 'Domain coverage: some evidence uses controlled synthetic or single-domain tasks;
      other evidence spans multiple ML benchmark suites but lacks explicit limitations.'
    open_questions:
    - Do reduced token/query costs and improved benchmark scores translate into more
      useful real-world research outputs under domain shift?
    - How should systems detect and repair persistent surrogate, experience, or skill
      errors during long-horizon searches?
    - What missing code, dataset, baseline, and limitation details would change reproducibility
      or generalization claims?
    - How robust are these research-agent designs across tasks outside software engineering,
      kernel, Matbench, MADE, and time series forecasting?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主研究的评测与基准设计
      解决的问题: 为研究智能体提供可比较的任务、预算、基线和指标，包括自建评估器质量与材料建模留出迁移。
      尚未覆盖: 密封目标与开发目标排序不一致，评估器一致性低于目标分歧上限，且没有单一研究者配置在所有指标上领先。
    - 路线: 长程状态与上下文管理
      解决的问题: 通过将持久研究状态保存在智能体对话之外并提供聚焦的角色特定上下文，防止历史重放、重复工作和实验停滞。
      尚未覆盖: 证据集中在软件工程、内核优化和算法任务；缺少明确局限性，其他研究流程中的泛化性未测量。
    - 路线: 闭环反馈分配与代理修复
      解决的问题: 在较长搜索中利用稀疏高保真评估更新代理模型，并通过面向决策相关区域的采集规则选择候选。
      尚未覆盖: 改善全局代理拟合不必然降低遗憾；固定代理会留下持久模型误差；证据主要来自合成环境和 MADE 基准。
    - 路线: 可复用经验与技能库
      解决的问题: 把先验实验轨迹或 GitHub 仓库提炼为经过验证的可复用经验或技能库，降低智能体交互和开发成本。
      尚未覆盖: 多个系统缺少明确局限性；经验或技能库能否在无污染、不过时的情况下跨领域迁移仍未解决。
    - 路线: 领域专用工作台与迁移协议
      解决的问题: 为时序预测或材料发现提供共享资源、工具与复现/基准/新方法开发流程。
      尚未覆盖: 材料迁移仅覆盖十个 Matbench 端点且一个留出干预失败；时序工作台缺少自身局限性；外部验证仍开放。
    共识:
    - 持久研究状态或可复用外部知识比仅依赖不断增长的对话历史更可靠。
    - 稀疏、定向或试点反馈可以在保持或提升最终表现的同时提高研究智能体效率。
    - 实用评测在任务完成或准确率之外，越来越多加入 token、oracle 查询和开发时间等成本信号。
    - 智能体无关的共享基础设施可提高现有智能体的可复现性并降低迭代成本。
    分歧:
    - 持久知识应存放在 harness 状态、经验库、代理模型还是仓库派生技能库中，方案不同。
    - 反馈证据不同：冻结留出评估、对研究者隐藏的密封目标、在线代理采集，或经验不足时的定向试点。
    - 评测目标不同：部分基准关注代码/ML/材料/时序任务完成与准确率，部分基准关注智能体自建评估器的质量。
    - 领域覆盖不同：部分证据来自受控合成或单域任务，部分证据跨多个 ML 基准但缺少明确局限性。
    开放问题:
    - 降低的 token/查询成本和更高的基准分数能否转化为领域转移下的真实研究效用？
    - 系统应如何在长程搜索中检测并修复持续的代理、经验或技能误差？
    - 缺失的代码、数据集、基线和局限性细节会如何改变可复现性或泛化性结论？
    - 这些研究智能体设计在软件工程、内核、Matbench、MADE 和时序预测之外的任务上有多稳健？
