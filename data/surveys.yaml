  related_work_outline_zh:
  - 主流方向：证据主要集中在端到端多智能体系统，这类系统将自主研究执行与验证、报告和完整论文生成结合，而不是孤立的语法或写作润色助手。
  - 研究共性：基于 LLM 的智能体覆盖选题、代码或实验执行、可视化、报告和论文起草，并通过内部验证、失败纠正或有依据的报告来减少虚假或不可靠结论。
  - 关键差异：系统在人机交互方式、验证策略、领域知识接入，以及同行评审录用、基准提升或 LLM 评分等成功标准上各不相同。
  - 趋势演进：现有 2024-2026 年证据显示，从通用自动发现框架走向 workshop 级录用，再走向具有更强验证和失败归因的领域专用系统；整体仍处于当前前沿。
  - 开放问题：小规模基准之外的外部有效性、静默失败检测、最优人工监督、代理评审与真实同行评审的一致性，以及跨领域可复现验证。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: Transforms a prompt or research idea into experiments, results,
        and complete paper drafts in domains such as machine learning, computational
        fluid dynamics, and applied mathematics.
      what_remains_open: Only one of three workshop submissions passed peer review
        in one system; performance is inconsistent and not validated at full conference
        scale across broader fields.
    - line: Internal verification and grounded reporting
      what_it_solves: Audits logical coherence, physical validity, or measured results
        before human inspection, reducing fabricated numbers, hallucinated citations,
        and silent failures.
      what_remains_open: Reported domain-specific verification still missed some planted
        silent failures, and grounded reporting does not guarantee novelty or conference-ready
        scientific writing.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Allocates human oversight across planning, execution, or reporting
        stages and compares fully autonomous workflows with targeted human intervention.
      what_remains_open: Optimal intervention granularity and cost-quality tradeoffs
        are not standardized; existing evidence comes from limited ablation or case-study
        settings.
    - line: Evaluation and evidence design for generated research
      what_it_solves: Produces comparable claims through benchmarks, LLM-based review
        rubrics, blind scores, and acceptance thresholds for AI-generated papers.
      what_remains_open: Proxy reviewer and benchmark scores may not align with real
        decision utility, and benchmark topic coverage and sample sizes remain small.
    - line: Reproducible autonomous research infrastructure
      what_it_solves: Provides open-source multi-agent pipelines, runnable code, and
        artifacts that support repeatable research writing workflows.
      what_remains_open: Several systems lack visible code, dataset, or limitation
        details, and external replication across hardware, datasets, and user settings
        is unproven.
    consensus:
    - LLM-based multi-agent pipelines can complete an end-to-end research-writing
      cycle from a prompt or idea through experiment execution, visualization, and
      full manuscript draft generation.
    - Verification, self-correction, or grounded reporting is treated as necessary
      because autonomous generation can produce hallucinated numbers, invalid results,
      or unstable claims.
    - Human evaluation, peer review, or simulated review remains the main external
      check, with current systems more validated at workshop or benchmark level than
      as consistently reliable full-conference writers.
    - 'Autonomy is partial in practice: systems either include human intervention
      or remain constrained by recurring failure modes and inconsistent accepted outputs.'
    disagreements:
    - 'Autonomy and interaction mode differ: evidence compares fully autonomous loops
      with structured human-AI collaboration and disagrees on whether full autonomy
      or targeted human oversight is more effective.'
    - 'Verification strategy differs by content domain: theory-heavy writing uses
      logical consistency audits, computational fluid dynamics uses vision-language
      physical field checks, and code-experiment loops use structured failure attribution.'
    - 'Success criteria differ: studies use peer-review acceptance, benchmark score
      gains over baselines, metrics-bearing output proportions, or blind reviewer
      scores, making cross-system comparison unstable.'
    - 'Domain adaptation paths differ: general machine-learning workflows rely on
      code execution and automated review, while applied-math and fluid-dynamics systems
      add domain knowledge retrieval or physics-aware checks.'
    open_questions:
    - How well do LLM-based reviewer scores and acceptance thresholds align with human
      peer review across different scientific fields?
    - What level and timing of human intervention improves manuscript quality without
      excessive oversight cost?
    - Can domain-specific verification reduce missed silent failures to an acceptable
      rate beyond the reported partial detection results?
    - Do these systems generalize beyond small benchmark topics and workshop settings
      to full conference publications or unfamiliar domains?
    - Are open-source pipelines externally replicable when code, datasets, and limitation
      details are missing?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究与论文生成
      解决的问题: 把提示或研究想法转化为实验、结果和完整论文草稿，覆盖机器学习、计算流体动力学和应用数学等场景。
      尚未覆盖: 已有系统中三篇提交仅一篇通过同行评审，性能不稳定，且未在更广泛领域的完整会议级别上验证。
    - 路线: 内部验证与有依据的报告生成
      解决的问题: 在人工检查前审计逻辑、物理有效性或实测结果，减少虚构数字、幻觉引用和静默失败。
      尚未覆盖: 领域专用验证仍会漏检部分静默失败，有依据的报告也不能保证新颖性或会议级写作质量。
    - 路线: 人机协作与干预设计
      解决的问题: 在规划、执行或报告阶段分配人工监督，并比较完全自主与精准人工干预。
      尚未覆盖: 最优干预颗粒度与成本质量权衡尚未标准化，现有证据来自有限消融或案例研究。
    - 路线: 面向生成式研究的评测与证据设计
      解决的问题: 通过基准、LLM 评审标准、盲审分数和录用阈值，使 AI 生成论文的主张可比较。
      尚未覆盖: 代理评分与真实决策效用可能不一致，基准覆盖主题和样本量仍然较小。
    - 路线: 可复现的自主研究基础设施
      解决的问题: 提供开源多智能体流水线、可运行代码和工件，支撑可重复的研究写作流程。
      尚未覆盖: 若干系统缺少可见代码、数据集或局限性描述，跨硬件、数据集和用户设置的复现尚未证实。
    共识:
    - 基于 LLM 的多智能体流水线能够从提示或想法开始，完成实验执行、可视化到完整论文草稿的端到端研究写作循环。
    - 验证、自我纠正或有依据的报告被认为是必要环节，因为自主生成可能产生虚假数字、无效结果或不稳定结论。
    - 人工评价、同行评审或模拟评审仍是主要外部检查，当前系统更多在 workshop 或基准层面获得验证。
    - 实际自主性仍不完整：系统或者需要人工干预，或者仍受反复出现的失败模式和不稳定录用结果的限制。
    分歧:
    - 自主与交互模式不同：证据比较完全自主循环与结构化人机协作，对全自主还是精准人工监督更有效存在分歧。
    - 验证策略因内容领域不同：理论写作采用逻辑一致性审计，计算流体动力学采用视觉语言物理场检查，代码实验循环采用结构化失败归因。
    - 成功标准不同：分别以同行评审录用、相对基线的基准得分提升、带指标输出比例或盲审分数为成功，跨系统比较不稳定。
    - 领域适应路径不同：通用机器学习依赖代码执行和自动评审，应用数学与流体动力学系统引入领域知识检索或物理感知检查。
    开放问题:
    - LLM 评审分数和录用阈值在多大程度上与不同科学领域的人类同行评审一致？
    - 什么水平和时机的人工干预能在不过度增加监督成本的情况下提升论文质量？
    - 领域专用验证能否把漏检静默失败率降低到可接受范围，而不只是报告中的部分检出结果？
    - 这些系统能否从小规模基准主题和 workshop 设置推广到完整会议或陌生领域？
    - 在缺少代码、数据集和局限性信息时，开源流水线能否被外部复现？
