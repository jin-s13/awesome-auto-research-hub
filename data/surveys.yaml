  related_work_outline_zh:
  - 主流方向：以LLM智能体为核心，自动完成从想法/假设生成、实验执行、分析到论文撰写与自动评审的端到端科研流程。
  - 研究共性：采用“提出—实验—评估—撰写—验证/评审”闭环，并引入记忆、内部验证或树搜索来减少重复失败和人类干预。
  - 关键差异：目标任务包括应用数学理论推导、模拟环境科学发现和ML代码基准改进；评估方式涵盖同行评审、任务完成指标和专家/LLM偏好。
  - 趋势演进：在2024–2026前沿期内，从全自动发现框架和基准环境，发展到树搜索、多智能体平台、失败记忆与真实科学ML评测；重点由生成论文转向稳定性和真实科研进展度量。
  - 开放问题：自动指标与人类科学效用是否一致；智能体是否能提出领域洞见而非仅工程技巧；记忆与验证机制如何跨领域泛化。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agents
      what_it_solves: Converts a research prompt or idea into code/experiment runs,
        analysis, visualizations, and manuscript drafts, sometimes with automated
        review or verification.
      what_remains_open: Validation is narrow; peer-review success is unstable and
        there is limited evidence that outputs contain domain-level novelty rather
        than formatted paper narratives.
    - line: Discovery-oriented benchmark environments
      what_it_solves: Makes discovery agents comparable through long-horizon tasks,
        parametric variation, and automatic completion/action/knowledge metrics.
      what_remains_open: Coverage is limited to simulated or code-centric science,
        and proxy metrics may not capture whether an agent produced genuine scientific
        insight.
    - line: Interactive multi-agent research platforms
      what_it_solves: Converts isolated agents into observable teams with customizable
        roles, real-time monitoring, rollback/resume, and local code/artifact integration.
      what_remains_open: Evidence comes from small internal case studies; external
        generalization, maturity, and reproducibility across hardware and user settings
        remain unverified.
    - line: Failure-aware memory and knowledge reuse
      what_it_solves: Records failed attempts as structured negative knowledge so
        downstream agents can avoid repeated mistakes and improve token efficiency
        in retries or cross-task transfer.
      what_remains_open: Boundaries are shown mainly on ScienceAgentBench and nonlinear
        PDE tasks; interaction with other retrieval and verification loops is underexplored.
    - line: Automated review and evidence-quality feedback
      what_it_solves: Provides scalable LLM/VLM reviewer or peer-review signals to
        score generated papers and guide iterative improvements in manuscripts and
        figures.
      what_remains_open: Reviewer scoring is not yet shown to consistently track human
        scientific utility, and acceptance-level outcomes remain unstable and domain-limited.
    consensus:
    - The shared objective is to automate or support the full scientific experiment
      loop with LLM agents, from idea or hypothesis formation through execution, analysis,
      and reporting.
    - Most work introduces verification, reviewer feedback, or memory mechanisms to
      reduce errors and repeated failures, but evidence is concentrated in narrow
      domains or internal case studies.
    - Evaluation commonly uses automatic metrics or LLM/expert judges, yet alignment
      with long-term scientific utility remains unproven.
    - Performance is strongest when systems can execute code or access runnable artifacts,
      which biases current evidence toward code-centric or simulated tasks.
    disagreements:
    - 'Systems cover different scientific stages: some include full manuscript generation
      and peer review, while others focus on simulated task completion or code-only
      model improvement.'
    - 'Autonomy and interaction modes differ: fully autonomous agents, human-as-principal-investigator
      collaboration, and interactive dashboards with rollback/resume coexist.'
    - 'Evaluation targets differ: workshop peer-review acceptance, simulated discovery
      task completion, relative improvement over published best models, and expert/LLM
      judge preference are used separately.'
    - 'Knowledge reuse mechanisms differ: structured negative failure records, declarative/procedural
      retrieval, and runnable code/artifact harnesses represent distinct ways of retaining
      experience.'
    - Progress claims are hard to compare because some work treats gains from ML engineering
      tricks as a limitation, while paper-generation systems emphasize manuscript
      quality and format.
    open_questions:
    - Do automatic evaluation metrics and LLM reviewers align with human scientific
      peer judgment across applied mathematics, ML, and simulated discovery tasks?
    - Can agents move beyond ML-engineering tricks and template code to produce reusable
      domain-level hypotheses or theory?
    - How does failure-aware memory transfer across scientific domains, and what should
      be stored as negative knowledge without over-constraining future search?
    - What minimal human oversight, safety, and validity checks are needed when generated
      experiments or papers enter real scientific workflows?
    - How can interactive multi-agent platforms be externally validated beyond small
      internal case studies?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现智能体
      解决的问题: 将研究提示或想法转化为代码/实验运行、分析、可视化和论文草稿，部分系统加入自动评审或验证。
      尚未覆盖: 验证范围较窄；同行评审通过率不稳定，且缺乏证据表明输出包含真正领域新发现而非格式化论文叙事。
    - 路线: 发现型基准环境
      解决的问题: 通过长周期任务、参数变化和自动完成/动作/知识指标，让自动化科研智能体可比较。
      尚未覆盖: 覆盖局限于模拟或代码中心科学；代理指标可能无法反映是否产生了真正科学洞见。
    - 路线: 交互式多智能体研究平台
      解决的问题: 将单点智能体转化为可观察团队，支持自定义角色、实时监控、回滚/恢复，以及本地代码和工件集成。
      尚未覆盖: 证据来自小规模内部案例；外部泛化、成熟度以及跨硬件和用户设置的可复现性仍未见验证。
    - 路线: 失败感知记忆与知识复用
      解决的问题: 将失败尝试记录为结构化负知识，让下游智能体避免重复错误，并在重试或跨任务迁移时降低token消耗。
      尚未覆盖: 主要证据限于ScienceAgentBench和非线性PDE任务；与其他检索和验证循环的交互仍缺乏探索。
    - 路线: 自动评审与证据质量反馈
      解决的问题: 用可扩展的LLM/VLM评审或同行评审信号对生成论文打分，并指导论文与图表迭代改进。
      尚未覆盖: 评审分数与真实科学效用的一致性尚未确证；接受级结果不稳定且局限于有限领域。
    共识:
    - 共同目标是用LLM智能体自动化或支持从想法/假设形成、实验执行、分析到报告撰写的完整科研闭环。
    - 多数工作引入验证、评审反馈或记忆机制来减少错误和重复失败，但证据主要来自窄领域或内部案例。
    - 评测普遍使用自动指标或LLM/专家评审，但尚未证明这些指标与长期科学效用对齐。
    - 当系统能执行代码或接入可运行工件时表现更好，导致评测偏向代码中心或模拟任务。
    分歧:
    - 覆盖的科研阶段不同：部分系统生成完整论文并进入同行评审，部分只关注模拟任务完成或代码模型改进。
    - 自主性和交互模式不同：完全自主、人类担任PI的协作、以及具有回滚/恢复的交互式仪表板并存。
    - 评价目标不同：工作坊同行评审接受、模拟发现任务完成、相对已发布最优模型提升、专家/LLM偏好各有侧重。
    - 知识复用机制不同：失败负知识、陈述性/过程性检索、代码与工件接入代表不同的经验保留方式。
    - 对进展度量存在分歧：代码基准上的提升被指主要来自ML工程技巧，而论文生成系统更强调稿件质量与格式，导致主张难以横向比较。
    开放问题:
    - 自动评测指标和LLM评审者能否在应用数学、ML和模拟发现任务中与人类科学同行评审保持一致？
    - 智能体能否从ML工程技巧和模板代码中跳出来，生成可复用的领域级假设或理论？
    - 失败感知记忆如何跨科学领域迁移，哪些内容应作为负知识存储而不过度约束搜索？
    - 当生成实验或论文进入真实科学流程时，需要怎样的人类监督、安全与有效性检查？
    - 交互式多智能体平台如何超越小规模内部案例得到外部验证？
