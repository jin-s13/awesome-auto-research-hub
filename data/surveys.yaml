  literature_review:
    line_of_work_matrix:
    - line: Durable state and compact context management
      what_it_solves: Prevents context-bloat failures such as replaying long histories,
        duplicating work, and stalling experiments by moving research state out of
        agent conversation and reconstructing focused context per invocation.
      what_remains_open: Whether compressed state/context retains enough decision-relevant
        evidence outside the reported software, kernel, algorithm, materials, and
        deep-research QA settings.
    - line: Evidence-conditioned planning and task graph expansion
      what_it_solves: Converts confidence, uncertainty, and completed evidence into
        next experiments or graph expansions instead of following fixed plan-then-execute
        pipelines.
      what_remains_open: How much gain comes from assignment structure or graph topology
        rather than the underlying model and execution budget; coverage beyond reported
        benchmark suites is limited.
    - line: Feedback acquisition and surrogate/high-fidelity budgeting
      what_it_solves: Decouples expensive oracle or laboratory feedback from long
        search loops by using sparse high-fidelity evaluations to update surrogates
        or guide future experiments.
      what_remains_open: Fixed surrogate replacement leaves persistent model error,
        and evidence is mainly from synthetic and MADE-style settings, so broader
        laboratory discovery transfer is unproven.
    - line: Operational knowledge and experimental experience reuse
      what_it_solves: Turns repositories and prior experimental trajectories into
        reusable verified skills or experience libraries so agents avoid relearning
        operational know-how and repeating costly experiments.
      what_remains_open: Evidence is mostly benchmark performance and interaction-overhead
        reduction; detailed failure cases and external validation across more research
        workflows are missing.
    - line: Self-improvement and recursive verification
      what_it_solves: Alternates evidence gathering and constraint-wise auditing,
        with learned context compression and reinforcement learning, to improve deep-research
        answers.
      what_remains_open: Sparse final rewards and recursive-loop contributions are
        not fully isolated; reported gains over baselines lack strong reproducibility
        signals in the packet.
    - line: Evaluation and claim-verification protocols
      what_it_solves: Tests whether research claims and explanations transfer to held-out
        or prospective forecasts rather than only fitting development splits.
      what_remains_open: 'Current evidence is mixed or inconclusive: some holdout
        transfers fail, predictive-credit decisions remain inconclusive, and selected
        domains are narrow.'
    consensus:
    - Long-horizon research agents benefit from separating durable research state
      from the active model context.
    - Targeted evidence and feedback, such as holdout evaluation, sparse high-fidelity
      oracle queries, historical experience, or constraint audits, are used to decide
      what to try next.
    - Evaluation emphasizes downstream transfer and efficiency, including held-out
      performance, token or oracle-query budgets, and benchmark gains.
    - Many results report improved final outcomes or efficiency, but code, dataset,
      and repository signals are generally weak, leaving reproducibility as a verification
      gap.
    disagreements:
    - 'State ownership and compression differ: harness-owned stateless contexts, learned
      recursive context compression, and hierarchical DAG context propagation.'
    - 'Supervision and feedback type differ: sparse high-fidelity evaluations update
      a surrogate, pilot or historical experience guides decisions, recursive audits
      impose constraint-wise verification, and topological credit drives reinforcement
      learning.'
    - 'Evaluation target differs: software, kernel, and algorithm tasks; materials
      endpoints with held-out code transfer; ML research benchmark suites; deep-research
      question answering; and forecast-credit checks.'
    - 'Improvement source differs: scaling and orchestration around a fixed model,
      retrieved or discovered skills and experience, surrogate acquisition, or policy
      training via reinforcement learning.'
    - 'Claim strength differs: most papers report positive benchmark or efficiency
      gains, while the evidence-evaluation line reports inconclusive or partially
      unmet preregistered tests.'
    open_questions:
    - Do state-context separations remain sufficient for decision quality outside
      the reported software, kernel, algorithm, materials, and deep-research tasks?
    - Can high-fidelity feedback be budgeted without fixed surrogate errors or infrastructure-heavy
      evaluation dominating the result?
    - Which held-out transfer results generalize beyond the ten Matbench endpoints
      and development-split settings visible in the packet?
    - Are reported gains attributable to the proposed control, planning, or experience
      mechanism rather than backbone scale, execution budget, or downstream harness
      choices?
    - Is the predictive-credit protocol strong enough to confirm that explanations
      improve experimental forecasts, given inconclusive frozen decisions and intervals
      spanning zero?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 持久状态与紧凑上下文管理
      解决的问题: 将研究状态移出智能体对话并重建聚焦上下文，缓解历史重放、重复工作和停滞实验。
      尚未覆盖: 压缩后的状态/上下文在已报告的软件、内核、算法、材料与深度研究问答之外是否保留足够决策相关证据仍未知。
    - 路线: 证据条件规划与任务图扩展
      解决的问题: 依据已完成节点的置信度、不确定性和证据分配下一批实验或扩展任务图，而非先规划后执行。
      尚未覆盖: 新增收益有多少来自任务分配或图拓扑，而非底层模型和执行预算，仍需分离；已报告基准之外的覆盖有限。
    - 路线: 反馈获取与代理/高保真预算分配
      解决的问题: 通过稀疏高保真评估更新代理模型或经验，减轻闭环搜索中的 oracle 或实验室成本。
      尚未覆盖: 固定代理替换会留下持久模型误差；证据主要来自合成与 MADE 类设置，尚未证明可推广到更广泛的实验室发现场景。
    - 路线: 操作知识与实验经验复用
      解决的问题: 将仓库和既往实验轨迹提炼为已验证技能或经验库，避免重复学习操作 know-how 与昂贵实验。
      尚未覆盖: 当前证据主要是基准性能和交互开销降低，缺少详细失败案例与跨研究流程的外部验证。
    - 路线: 自改进与递归验证
      解决的问题: 在内层证据收集与外层约束审计间交替，并结合上下文压缩与强化学习改进深度研究答案。
      尚未覆盖: 稀疏奖励与递归循环的贡献未完全隔离；相对基线的提升缺乏强可复现信号。
    - 路线: 评测与声明验证协议
      解决的问题: 检查研究声明和解释是否在留出或前瞻预测上成立，而非只拟合开发集。
      尚未覆盖: 当前证据混合甚至不确定，部分留出迁移失败，预测信用结论仍不明确，所选领域较窄。
    共识:
    - 长程研究智能体受益于将持久研究状态与活跃模型上下文分离。
    - 研究倾向于用目标化证据和反馈决定下一步，例如留出评估、稀疏高保真 oracle 查询、历史经验或约束审计。
    - 评测关注下游迁移与效率，包括留出性能、token 或 oracle 查询预算和基准提升。
    - 许多结果报告最终效果或效率提升，但代码、数据集与仓库信号普遍较弱，可复现性仍是验证缺口。
    分歧:
    - 状态所有权与压缩方式不同：harness 拥有的无状态上下文、递归学习压缩与分层 DAG 上下文传播。
    - 监督与反馈类型不同：稀疏高保真反馈更新代理、试点或历史经验引导决策、递归审计约束验证、拓扑信用驱动强化学习。
    - 评测目标不同：软件/内核/算法任务、材料端点留出代码迁移、ML 研究基准、深度研究问答和预测信用检查。
    - 提升来源不同：固定模型的编排与缩放、检索或发现的技能与经验、代理采集或强化学习策略训练。
    - 声明强度不同：多数论文报告正向基准或效率增益，而证据评估路线报告了不确定或部分未满足的预注册检验。
    开放问题:
    - 状态-上下文分离能否在已报告的软件、内核、算法、材料与深度研究之外保持决策质量？
    - 高保真反馈预算能否在不被固定代理误差或重型基础设施评估主导的情况下实现？
    - 哪些留出迁移结果能推广到证据包中可见的十个 Matbench 端点之外？
    - 性能提升是否来自控制、规划或经验机制，而非底层模型、执行预算或下游 harness 选择？
    - 预测信用协议能否证实解释改善实验预测，尤其当前冻结决策不确定且区间跨零？
