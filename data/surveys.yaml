  literature_review:
    line_of_work_matrix:
    - line: Agentic rubric-guided survey generation
      what_it_solves: Produces full academic survey drafts by decomposing tasks across
        specialized LLM agents and using iterative refinement with rubric-based or
        multi-LLM reviewers.
      what_remains_open: Reported gains rely mainly on rubric or coverage metrics;
        sentence-level citation support and limitations are often unstated, and external
        human-expert validation is sparse.
    - line: Graph-structured method-entity generation
      what_it_solves: Improves retrieval, outline construction, and relation extraction
        by modeling method-level follow-on, competition, and shared-resource edges
        rather than flat document ranking.
      what_remains_open: Semantic edge support remains incomplete, with extends relations
        weakest; comparisons are bounded rather than matched-backend end-to-end.
    - line: Full-text evidence-constrained synthesis
      what_it_solves: Increases analytical depth and citation reliability using full-text
        keynotes, cross-paper clustering, code-repository analysis, hybrid filtering,
        and evidence-gated citation assignment.
      what_remains_open: Reproducibility signals are weaker and limitations are not
        visible; cross-domain and externally replicated validation beyond reported
        benchmarks is lacking.
    - line: Taxonomy generation and organization benchmarking
      what_it_solves: Generates hierarchical scholarly taxonomies and evaluates retrieval
        plus tree-structured organization against expert-authored reference taxonomies.
      what_remains_open: Reliance on a single expert taxonomy for alignment and low
        measured retrieval or organization performance leave open whether disagreement
        is model failure or valid alternate organization.
    - line: Governed end-to-end research orchestration
      what_it_solves: Supports governed planning, computational routing, reproducible
        workflow execution, evidence generation, and scientist-in-the-loop oversight
        in a real biomedical GWAS setting.
      what_remains_open: Evidence is concentrated in one domain-specific case study
        under an aggregate-only data policy; external reproducibility and cross-domain
        generalization remain unverified.
    consensus:
    - 'Automated survey generation is treated as a multi-stage problem: retrieval,
      organization, drafting, and evaluation.'
    - Iterative refinement and LLM-based evaluation are common mechanisms for improving
      coverage, structure, and format quality.
    - Citation grounding and evidence support are recognized as central quality dimensions,
      with dedicated retrieval, filtering, or gating components.
    - Structured evaluation is shifting toward benchmarks with expert references,
      human preferences, or controlled diagnostic checks.
    disagreements:
    - 'Representation: some use flat lexical or passage retrieval, others use method-entity
      graphs, full-text structured keynotes, or taxonomy trees.'
    - 'Evaluation target: rubric-generated manuscript quality, citation precision
      and recall, expert taxonomy alignment, or real-world scientific replication.'
    - 'Interaction mode: fully autonomous agents versus scientist-in-the-loop governed
      workflows.'
    - 'Deployment setting: general scholarly survey generation versus domain-specific
      governed biomedical research systems.'
    - 'Evidence standard: some rely on LLM judges and rubric scores, while others
      audit sentence-level citation or semantic-edge support.'
    open_questions:
    - How can retrieval recall be improved beyond the low expert-cited paper recovery
      observed in current agents?
    - Which quality metrics best predict human expert judgment of survey utility rather
      than surface formatting or rubric alignment?
    - Can semantic graph relations be generated with sufficient citation and edge-level
      evidence, especially for extends and comparative claims?
    - How can taxonomy evaluation separate model capability from legitimate divergence
