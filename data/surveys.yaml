  related_work_outline_zh:
  - 主流方向：构建自主或人机协同的研究智能体，使假设生成能够连接到可执行实验、评估和可验证报告。
  - 研究共性：围绕假设、证据收集、代码执行与反馈进行结构化迭代，并用辩论、分支、回溯、反思或确定性校验约束生成。
  - 关键差异：人类监督程度、搜索策略、评测目标和验证机制不同，从完全自主到高杠杆人工干预，从树/进化搜索到循环式分析-文献流程。
  - 趋势演进：可见前沿证据集中在2025-2026年，从综述框架和领域专用智能体走向更可验证、更关注成本，并引入更难的真实任务基准。
  - 开放问题：可靠性阈值、基准提升是否转化为真实科学效用、超出已测周期的扩展性、来源追踪与伦理问责尚未解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous hypothesis-to-experiment loops
      what_it_solves: Turns open-ended research goals and datasets into repeated generate-execute-evaluate-report
        cycles with code execution and synthesized findings.
      what_remains_open: Reported accuracy and reliability are not guaranteed; scaling
        beyond short cycles and generalizing beyond structured, executable domains
        remain open.
    - line: Search-structured idea generation and reflection
      what_it_solves: Controls hypothesis exploration through tree branching, backtracking,
        evolutionary selection, and hierarchical reflection over failed trials.
      what_remains_open: Evidence is strongest in combinatorial optimization and cooperative
        driving; transfer to less structured scientific domains is not shown.
    - line: Evaluation and evidence design
      what_it_solves: Creates benchmarks and realistic task suites that compare frontier
        models and AI research systems on biology and experiment-stage research tasks.
      what_remains_open: Benchmark difficulty and proxy accuracy do not yet establish
        real scientific decision utility or coverage across diverse disciplines.
    - line: Conceptual taxonomy and workflow frameworks
      what_it_solves: Organizes research automation into literature grounding, hypothesis
        formation, experimentation, validation, and reporting, plus evaluation dimensions.
      what_remains_open: The proposed categories need direct empirical validation
        predicting model behavior; evidence preservation, provenance, and weak-direction
        rejection remain unsolved.
    - line: Coordinated multi-agent evidence state
      what_it_solves: Shares data analysis, literature search, and failure records
        across agents to maintain coherent long-horizon discovery.
      what_remains_open: Evaluated in limited case studies and domains; whether shared
        state remains sufficient for decision quality outside these distributions
        is unknown.
    consensus:
    - Attaching hypothesis generation to executable or benchmarked feedback is necessary
      for verifiable research output.
    - Structured agent workflows, including debate, branching, and deterministic checks,
      are used to reduce unconstrained generation and fabricated results.
    - Human collaboration can improve research workflows when concentrated at high-leverage
      decision points rather than applied as exhaustive oversight.
    disagreements:
    - 'Search strategy: tree/evolutionary branching with backtracking versus repeated
      parallel analysis-literature-hypothesis cycles.'
    - 'Evaluation target: general research benchmarks, biology tasks, forecasting
      cases, combinatorial optimization, cooperative driving, or equation discovery.'
    - 'Human interaction mode: full autonomy, targeted human intervention, or separation
      of LLM cognition from deterministic authority.'
    - 'Verification mechanism: verifiable result reporting, deterministic promotion
      and source-edit boundaries, traceable citations, or benchmark-based comparison.'
    open_questions:
    - How much reported gain is attributable to orchestration versus task-specific
      baselines, code execution, or selected benchmarks?
    - Can autonomous hypothesis generation remain safe and reliable beyond structured,
      quickly verifiable settings, especially where feedback is delayed, embodied,
      ethical, or institutionally accountable?
    - What accuracy and reproducibility threshold would make autonomous research reports
      scientifically usable, given reported 79.4% statement accuracy and missing external
      validation?
    - Do improvements on ARC-Bench, LABBench2, forecasting cases, or optimization
      benchmarks transfer to real scientific discovery utility?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主假设到实验循环
      解决的问题: 将开放式研究目标和数据集转化为重复的生成-执行-评估-报告循环，并综合可验证发现。
      尚未覆盖: 报告准确率与可靠性仍无法保证；超出短周期以及结构化、可执行领域之外的泛化仍开放。
    - 路线: 搜索结构化的构思与反思
      解决的问题: 通过树状分支、回溯、进化选择和分层反思控制假设探索，利用失败记录调整后续轮次。
      尚未覆盖: 证据在组合优化和协作驾驶等场景最强，向结构化较弱的科学领域迁移尚未显示。
    - 路线: 评测与证据设计
      解决的问题: 通过基准和真实任务集比较前沿模型与AI研究系统，例如在生物学和实验阶段研究任务中衡量难度与能力。
      尚未覆盖: 基准难度和代理准确率尚未证明真实科学决策效用，跨学科覆盖仍有限。
    - 路线: 概念分类与工作流框架
      解决的问题: 把研究自动化组织为文献基础、假设形成、实验、验证和报告，并提出新颖性等评估维度。
      尚未覆盖: 所提分类需要直接实证验证是否能预测模型行为；证据保存、来源追踪和弱方向拒绝仍未解决。
    - 路线: 多智能体协调证据状态
      解决的问题: 在数据分析、文献搜索与失败记录之间共享信息，以维持长周期研究的一致性。
      尚未覆盖: 仅在有限案例和领域中评估；共享状态在分布外是否仍足以支撑决策未知。
    共识:
    - 假设生成必须连接到可执行或基准化反馈，才能形成可验证的研究输出。
    - 采用辩论、分支、分层反思或确定性检查等结构化工作流，以减少无约束生成和伪造结果。
    - 将人工协作集中在高杠杆决策点，可能优于完全自主或逐步监督。
    分歧:
    - 搜索策略：树状/进化分支与回溯，对比循环式分析-文献-假设流程。
    - 评测目标：通用研究基准、生物学任务、预测案例、组合优化、协作驾驶或方程发现。
    - 人机交互模式：完全自主、定向人工干预，或LLM认知与确定性权威分离。
    - 验证机制：可验证结果报告、确定性晋升与源码编辑边界、可追踪引用，或基于基准的比较。
    开放问题:
    - 报告的性能提升有多少来自编排本身，而非任务特定基线、代码执行或所选基准？
    - 在反馈延迟、具身、伦理或需机构问责的环境中，自主假设生成能否保持安全可靠？
    - 在报告陈述准确率为79.4%且缺少外部验证的情况下，自主研究报告需要达到何种准确率与可复现性阈值？
    - 在ARC-Bench、LABBench2、预测案例或优化基准上的提升能否迁移到真实科学发现效用？
