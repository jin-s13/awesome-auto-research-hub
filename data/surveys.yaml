  - 主流方向：以多智能体LLM系统为核心的端到端自主研究与论文生成，重点从单纯写作转向验证、自我纠正和人类监督。
  - 研究共性：将研究流程分解为想法生成、实验或实现、验证、手稿撰写与自动或人工评审。
  - 关键差异：验证机制从内部逻辑审计、测量值约束到领域特定视觉-语言物理门控不等；评测方式从LLM评分标准、工作坊同行评审到实验基准和盲审工件评分不等；人类参与程度从完全自主到选择性关键点干预不等。
