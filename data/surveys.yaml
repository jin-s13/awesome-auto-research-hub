    - There is agreement that unchecked generation is insufficient for defensible
      scientific communication; verification, self-correction, or human review is
      needed.
    - Recent work evaluates outputs through end-to-end success rates, blind scores,
      or peer-review acceptance instead of only surface text fluency.
    - Current systems remain inconsistent and often fail during implementation, evaluation,
      or domain-specific validation despite producing plausible manuscripts.
