  related_work_outline:
  - 'Mainstream direction: The field is converging on agentic benchmarks and evaluation
    environments that score full scientific discovery cycles, while adding code and
    tool grounding, process rewards, auditability, and safety mechanisms.'
  - 'Shared research pattern: Scientific discovery is treated as a multi-step loop
    of question or hypothesis formation, experiment design, execution through code
    or tools, evidence analysis, and conclusion; automatic metrics, verifiers, or
    LLM judges evaluate the loop.'
  - 'Key differences: Works evaluate simulated novel discovery, blind peer-derived
    open-ended claims, constrained autonomous ML engineering, wet-lab execution, and
    risk-sensitive tool chains. Learning signals differ from prompting and memory
    to structured certificates, process verifiers, and turn-level RL.'
  - 'Trend evolution: Available evidence is concentrated in 2024-2026. The frontier
    moves from broad virtual environments in 2024 toward evidence-grounded evaluation,
    auditable question formation, scalable process-verifiable RL, domain-specific
    code and memory infrastructure, and safety reasoning.'
  - 'Open questions: Whether current benchmarks and LLM judges track real discovery
    utility, whether agents can produce trustworthy falsifiable claims, and how much
    reported gain comes from infrastructure or task priors rather than general scientific
    reasoning.'
  related_work_outline_zh:
  - 主流方向：围绕智能体科学发现建立端到端虚拟基准和盲测评测，并逐步加入代码与工具基础设施、过程奖励、可审计问题形成和安全机制。
  - 研究共性：将科学发现建模为多步循环：提问或假设、实验设计、代码或工具执行、证据分析、结论或行动；用自动指标、验证器或 LLM 评审评测闭环。
  - 关键差异：评测场景横跨模拟新发现任务、同行评审盲测、受限 ML 工程、湿实验室执行和高风险工具链；学习信号从提示和记忆到结构化证书、过程验证与逐轮强化学习各有不同。
  - 趋势演进：现有证据集中在 2024-2026 年。前沿从 2024 年的广覆盖虚拟环境，转向证据成熟度评测、可审计问题形成、可扩展过程验证强化学习、领域代码与记忆基础设施及安全推理。
  - 开放问题：当前基准与 LLM 评审能否预测真实发现效用；智能体能否提出带对照和可证伪性的可信主张；报告提升来自通用推理还是外部基础设施或任务先验。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end discovery evaluation environments
      what_it_solves: 'Measures whether agents can complete or justify scientific
        discovery loops: hypothesis formation, experiment design, execution, result
        analysis, and claim or task completion.'
      what_remains_open: Coverage across domains and unseen studies, alignment between
        automatic metrics and expert utility, and generalization beyond single frozen
        base models or constrained task sets.
    - line: Evidence-grounded open-ended claim evaluation
      what_it_solves: Scores blind scientific claims by evidentiary maturity rather
        than exact reproduction, using frozen data and neutral objectives to test
        whether agents can determine what evidence supports.
      what_remains_open: Current evidence comes from one frozen base model and automated
        LLM judges; cross-model validity and human expert validation are not established.
    - line: Process-verifiable reinforcement learning and credit assignment
      what_it_solves: Converts multi-turn scientific analysis into verifier-filtered
        trajectories with turn-level reward, training agents to produce verifiable
        evidence steps.
      what_remains_open: Evidence is mainly in hypothesis-driven scientific data analysis;
        broader workflow generalizability and reproducibility signals remain unproven.
    - line: Auditable question formation and safety reasoning
      what_it_solves: Makes research question formation explicit through structured
        certificates, or embeds cumulative risk and trajectory-aware checks into scientific
        agent stages.
      what_remains_open: Evaluation relies on LLM judges or unspecified baselines;
        human expert confirmation and stronger artifact availability are needed.
    - line: Grounded code, tool, and memory infrastructure
      what_it_solves: Distills vetted code libraries from repositories or reusable
        execution memory into agent workflows, improving experiment quality, task
        success, and safety in grounded settings.
      what_remains_open: Domain coverage is limited, and proxy judges or single-domain
        evaluations leave cross-domain reuse and expert agreement unresolved.
    - line: Constrained autonomous ML engineering evaluation
      what_it_solves: Evaluates agents that must design, implement, and train ML models
        under fixed GPU, time, internet, and pretrained-weight constraints, isolating
        planning and time-budget skills.
      what_remains_open: Small task count and resource constraints may not capture
        real ML development, and the relation to broader scientific discovery is unclear.
    consensus:
    - Scientific discovery is framed as an agentic loop spanning question or hypothesis
      formation, experiment design, execution through code or tools, evidence analysis,
      and conclusion or action.
    - 'Automatic evaluation is central and takes multiple forms: task completion,
      evidence maturity, verifier-filtered steps, or LLM-based judgment.'
    - Current agents execute and document analyses better than they produce trustworthy,
      controlled, falsifiable, and generalizable scientific claims.
    - Safety, auditability, and grounding infrastructure are increasingly treated
      as cross-cutting parts of the discovery pipeline.
    disagreements:
    - 'Evaluation target differs: simulated novel discovery, blind peer-derived open-ended
      claims, constrained ML engineering, and wet-lab execution emphasize different
      abilities.'
    - 'Learning signal differs: prompting, episodic memory, structured certificates,
      verifier-based turn-level RL, and code or tool retrieval make different assumptions
      about how agents improve.'
    - 'Evidence and metrics differ: some rely on LLM judges with moderate expert agreement,
      while others report task completion or statistically unreliable agent separation.'
    - 'Deployment setting differs: text or simulation, code-only ML, robotic wet-lab,
      and risk-sensitive tool-chain contexts require different safety, resource, and
      interaction constraints.'
    open_questions:
    - Do current benchmarks and LLM judges predict real-world scientific discovery
      utility across domains and base models?
    - What would it take for agents to move from competent analysis execution to trustworthy
      claims with controls, robustness, falsifiability, and cross-dataset generalization?
    - How much of reported improvement comes from distilled code libraries, experience
      memory, safety filters, or task-specific priors rather than general scientific
      reasoning?
    - What external validation is needed for process-verifiable RL agents beyond hypothesis-driven
      data analysis?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端科学发现评测环境
      解决的问题: 衡量智能体能否完成或论证完整发现循环：提出假设、设计实验、执行、分析结果并完成任务或主张。
      尚未覆盖: 跨领域与未见研究的覆盖，自动指标与专家效用的对齐，以及跨基座模型和任务集的泛化。
    - 路线: 证据成熟度的开放结论盲评
      解决的问题: 用冻结数据和中性目标盲测评判智能体结论的证据成熟度，避免仅按是否复现隐藏研究评分。
      尚未覆盖: 当前证据仅来自单一冻结基座模型和 LLM 评审，跨模型效度与人类专家验证不足。
    - 路线: 过程可验证的强化学习与功劳分配
      解决的问题: 将多轮科学分析转化为验证器筛选的轨迹，并分配逐轮奖励，使模型学习产出可验证证据步骤。
      尚未覆盖: 范畴主要集中在假设驱动的科学数据分析，更广泛工作流和可复现性仍待证实。
    - 路线: 可审计问题形成与安全推理
      解决的问题: 用结构化问题证书显式记录假设、机制和可证伪检验，或在智能体各阶段加入累积风险与轨迹感知检查。
      尚未覆盖: 评测依赖 LLM 评审或基线不详，缺乏人类专家确认与充分工件。
    - 路线: 面向实验执行的代码、工具与记忆基础设施
      解决的问题: 从仓库蒸馏经检验代码库，或把执行经验提炼为可复用技能和安全经验，改善实验质量和湿实验室成功率。
      尚未覆盖: 领域覆盖有限，自动评审与专家一致性中等，跨领域复用和外部验证不足。
    - 路线: 受限自主 ML 工程评测
      解决的问题: 在单 GPU、时间预算、无互联网和无预训练权重约束下，评测智能体的隐式 ML 知识、规划与时间管理能力。
      尚未覆盖: 任务数量少、资源约束未必代表真实 ML 开发流程，与更广泛科学发现能力的关系尚不明确。
    共识:
    - 科学发现被建模为覆盖问题或假设形成、实验设计、代码或工具执行、证据分析和结论或行动的智能体循环。
    - 自动评测已成为常态，形式包括任务完成度、证据成熟度、验证器筛选步骤或 LLM 评审。
    - 当前智能体在执行和记录分析方面较强，但在带对照、稳健、可证伪和可泛化的科学主张上仍偏弱。
    - 安全、可审计性和外部基础设施越来越被视为科学发现流程的横切要求。
    分歧:
    - 评测目标不同：模拟新发现、同行评审盲测、受限 ML 工程和湿实验室执行强调不同能力。
    - 学习信号不同：提示、片段记忆、结构化证书、验证器逐轮强化学习和代码或工具检索对改进方式有不同假设。
    - 证据和指标不同：有的依赖 LLM 评审，与专家一致性中等；有的报告任务完成度但未建立统计上可靠的智能体差异。
    - 部署场景不同：文本或模拟、纯代码 ML、机器人湿实验室和高风险工具链在安全、资源和交互约束上差异明显。
    开放问题:
    - 现有基准与 LLM 评审能否跨领域、跨基座模型预测真实科学发现效用？
    - 智能体要怎样从熟练执行分析，发展到能提出带对照、稳健性、可证伪性和跨数据集泛化的可信主张？
    - 报告中的提升有多少来自蒸馏代码库、经验记忆、安全过滤或任务先验，而不是一般科学推理能力？
    - 过程可验证强化学习智能体在假设驱动数据分析之外需要哪些外部验证？
