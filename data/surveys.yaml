  literature_review:
    line_of_work_matrix:
    - line: Evidence-grounded benchmark design for discovery agents
      what_it_solves: Makes claims about autonomous scientific agents comparable by
        providing tasks, frozen data, or blind peer-review-derived questions and scoring
        task completion, relevant actions, or evidence maturity.
      what_remains_open: Automatic proxy metrics are not yet tied to independent replication,
        real-world discovery utility, or performance across more than one frozen base
        model.
    - line: Reliability-gated autonomous research systems
      what_it_solves: Wraps open-ended LLM ideation and coding in execution boundaries,
        deterministic promotion authorities, or physics/vision verification to reduce
        silent failures and improve implementation success.
      what_remains_open: Verification gates remain domain- and task-specific and can
        still miss planted failures; evidence is limited to workshop-level or three-case
        evaluations, so generalization is unclear.
    - line: Automated review and artifact evaluation
      what_it_solves: Uses LLM or VLM reviewers to score generated papers, figures,
        or evidence artifacts, providing scalable feedback and acceptance-like judgments
        for automated research.
      what_remains_open: Reviewer alignment, reward hacking, and consistency across
        models are not established; human governance or safety judgments are largely
        absent from the visible evidence.
    - line: Domain-specific AI scientist deployment and evaluation
      what_it_solves: Adapts autonomous research loops to specific domains such as
        computational fluid dynamics, time-series forecasting, or single-cell omics,
        reporting task-specific performance and baseline comparisons.
      what_remains_open: Attribution of gains to the research-agent system versus
        task-specific baselines, diagnostics, or domain structure is not separated;
        cross-domain reliability remains unproven.
    consensus:
    - Recent work agrees that autonomous research agents can execute, document, and
      sometimes verify analyses, but their generated claims still lack controls, robustness,
      falsifiability, and cross-dataset generalization.
    - Evaluation is moving beyond task completion toward evidence maturity, auditability,
      and reproducibility, with frozen data, deterministic scoring, and code execution
      as shared infrastructure.
    - 'Reliability is being treated as a system-level property: open-ended LLM behavior
      needs external verification, deterministic boundaries, or automated review rather
      than trust in generated output alone.'
    disagreements:
    - 'Evaluation setting differs: virtual discovery environments score task completion
      and discovered knowledge, while blind benchmark tasks expose only a neutral
      objective and frozen data and score evidence maturity with a fixed LLM judge.'
    - 'Verification strategy differs: some systems embed domain-specific physics-aware
      visual checks or deterministic authorities inside the research loop, while others
      rely on simulated AI review after paper generation.'
    - 'Supervision target differs: one line evaluates full discovery cycles, another
      evaluates a narrower architecture-evolution or annotation-plus-question task,
      so reported success is not directly comparable.'
    open_questions:
    - Does evidence-maturity scoring predict whether an AI-generated finding survives
      independent replication, human peer review, or real-world deployment?
    - Can current benchmarks claim robust agent rankings when top results come from
      one frozen base model or limited domain cases without external validation?
    - What verification coverage is sufficient if a domain-specific reliability gate
      can miss planted silent failures?
    - Where are explicit governance, safety, or oversight policies evaluated for these
      autonomous systems beyond benchmark performance and artifact quality?
