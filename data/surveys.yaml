    - 路线: 面向发现能力的基准与评测框架
      解决的问题: 通过任务、基线、指标和难度度量使系统能力主张具备可比性
      尚未覆盖: 代理指标与真实科学效用之间的一致性以及更广泛领域覆盖仍缺乏证据
    - 路线: 领域特定的端到端发现系统
      解决的问题: 在生物学或方程发现等场景中产出具实验或符号验证的假设
      尚未覆盖: 跨领域泛化、可复现性和超越示范案例后的验证深度仍有限
    共识:
    - 多数系统将假设生成视为连接文献或数据分析与实验反馈、代码执行的迭代循环。
    - 多智能体分工较常见，文献搜索、数据分析、构思、执行和验证角色相互分离。
    - 人类监督通常在关键高杠杆决策点最有用，而非逐步全面干预。
    - 可追溯报告和基准任务正在成为评价自主研究系统的重要机制。
    - 当前系统在结构化、可执行、可快速验证的场景中更可信，在难以受控的环境中可靠性不足。
    分歧:
    - 人类角色不同：有的系统追求完全自主，有的强调多种人类干预模式，也有综述将自主性视为领域条件化谱系。
    - 探索机制不同：结构化多智能体辩论、进化-系统化研究树、基于代码解释器的迭代优化和强化学习代表不同协调策略。
    - 评测目标不同：生物学任务基准、实验阶段研究基准、方程发现数据集、湿实验验证和报告陈述准确率并行存在，缺乏统一标准。
    - 监督与优化信号不同：自愈反馈、进化搜索、结构化世界模型信息共享和端到端强化学习是提升假设质量的不同路径。
    开放问题:
    - 如何在保持可追溯性和可验证报告的同时降低错误或不支持的陈述比例？
    - 有价值发现随周期线性增长是否能在超出测试周期数和开放科学领域中继续成立？
    - 哪些评测指标能预测真实世界科学效用，尤其在具身、延迟、异质和伦理约束场景？
    - 哪种结构化探索或人类干预模式能跨领域泛化，又有何种证据能证明这种迁移？
    - 长周期自主研究系统能否在早期拒绝弱方向并保持证据来源，而无需人类清理？
    - 由于许多来源记录未说明局限或发布可复现工件，尚存在哪些验证缺口？
