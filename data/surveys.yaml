  related_work_outline:
  - 'Mainstream direction: LLM-based agents are used to automate literature review
    tasks, with multi-step or multi-agent architectures decomposing the process into
    retrieval, evidence extraction, organization, writing, and editing.'
  - 'Shared research pattern: Specialized agents or modules interact with external
    literature databases; evaluation focuses on citation quality and similarity to
    human reviews, using benchmarks like ScholarQABench and SciReviewGen.'
  - 'Key differences: Works target different sub-tasks—retrieval and grounding vs.
    full review generation vs. iterative structuring vs. peer review robustness. Metrics
    and benchmarks are not standardized, and the balance between retrieval accuracy
    and synthesis quality varies.'
  - 'Trend evolution: From 2024 to 2026, the frontier moves from single-agent retrieval
    to multi-agent generation frameworks, and then toward robustness evaluation and
    adversarial vulnerability in peer review.'
  - 'Open questions: How to verify factual correctness beyond citation coverage? Can
    iterative refinement outperform single-pass retrieval? How to handle contradictory
    evidence? What are the deployment risks of adversarial attacks? How to generalize
    across disciplines?'
  related_work_outline_zh:
  - 主流方向：基于LLM的智能体用于自动化文献综述任务，采用多步或多智能体架构将流程分解为检索、证据提取、组织、写作和编辑。
  - 研究共性：专用智能体或模块与外部文献数据库交互；评估侧重于引用质量和与人类综述的相似度，使用ScholarQABench和SciReviewGen等基准。
  - 关键差异：工作针对不同子任务——检索与证据构建 vs. 完整综述生成 vs. 迭代结构 vs. 同行评审鲁棒性。评估指标和基准未标准化，检索精度与综述质量之间的平衡各异。
  - 趋势演进：2024至2026年，前沿从单智能体检索转向多智能体生成框架，再到鲁棒性评估和同行评审中的对抗脆弱性。
  - 开放问题：如何验证超越引用覆盖的事实正确性？迭代细化能否优于单次检索？如何处理矛盾证据？对抗攻击的部署风险是什么？如何跨学科泛化？
  literature_review:
    line_of_work_matrix:
    - line: Retrieval-grounded literature agents
      what_it_solves: Connecting LLM agents to live literature databases for evidence
        retrieval, claim verification, and synthesis, as demonstrated by EMBL AI Librarian
        using Europe PMC.
      what_remains_open: Coverage across multiple databases and languages, and whether
        retrieval metrics like Citation F1 fully capture factual correctness.
    - line: Multi-agent review generation
      what_it_solves: Automating full literature review writing through specialized
        agents for outlining, writing, editing, and reviewing, as in LiRA.
      what_remains_open: Factual accuracy of generated text beyond surface similarity
        to human reviews, and handling of nuanced scientific disagreements.
    - line: Iterative and hierarchical survey automation
      what_it_solves: Improving coverage and organization of literature surveys via
        iterative refinement or hierarchical structuring, as proposed by IterSurvey
        and CHIME.
      what_remains_open: Whether iterative methods consistently outperform single-pass
        retrieval, and how to evaluate structural coherence independently of writing
        style.
    - line: Robustness and adversarial evaluation in peer review
      what_it_solves: Understanding vulnerability of LLM reviewers to adversarial
        attacks and modeling peer review dynamics, explored by AgentReview and Breaking
        the Reviewer.
      what_remains_open: Real-world deployment risks and effective mitigation strategies
        for automated review systems.
    - line: Benchmarks for agent-based research workflows
      what_it_solves: Providing standardized tasks to evaluate LLM agents' ability
        to automate complex research processes, such as post-training (PostTrainBench).
      what_remains_open: Direct relevance to literature review quality and adaptability
        to other review subtasks; evidence of task transfer is missing.
    consensus:
    - LLM-based agents can improve literature review efficiency and quality, especially
      when tasks are decomposed into subtasks.
    - Multi-step orchestration enhances retrieval and evidence grounding, and external
      literature databases are critical for factual accuracy.
    - Evaluation metrics predominantly focus on citation quality and textual similarity
      to human-written reviews.
    disagreements:
    - 'Target output differs: some systems produce retrieval-only evidence snippets,
      while others generate complete review manuscripts.'
    - Evaluation protocols and benchmarks vary, leading to incomparable results; some
      use ScholarQABench, others use proprietary datasets.
    - Robustness to adversarial attacks is emphasized in some works but ignored in
      others, creating a divide between security and generation quality.
    - Whether iterative or hierarchical structuring yields measurable gains over simpler
      one-pass retrieval pipelines remains unverified.
    open_questions:
    - How to measure factual accuracy beyond citation overlap, for example, through
      expert verification of claims?
    - Can agents handle contradictory scientific evidence without hallucinating a
      consensus?
    - What is the reliability of multi-agent generated reviews under adversarial attacks
      in real-world settings?
    - How to generalize literature review agents across diverse scientific disciplines
      without per-domain retraining?
    - What is the cost-benefit trade-off between iterative refinement and single-pass
      retrieval in terms of time and computational resources?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 检索增强文献智能体
      解决的问题: 将LLM智能体连接到实时文献数据库，用于证据检索、声明验证和综合，如EMBL AI Librarian利用Europe PMC。
      尚未覆盖: 跨数据库和语言的覆盖范围，以及Citation F1等检索指标是否完全反映事实正确性。
    - 路线: 多智能体综述生成
      解决的问题: 通过用于大纲、写作、编辑和审阅的专用智能体自动生成完整文献综述，如LiRA。
      尚未覆盖: 生成文本除表面相似度外的事实准确性，以及处理细微科学分歧的能力。
    - 路线: 迭代与层级化综述自动化
      解决的问题: 通过迭代细化或层级化结构改进文献综述的覆盖范围和组织，如IterSurvey和CHIME。
      尚未覆盖: 迭代方法是否始终优于单次检索，以及如何独立于写作风格评估结构连贯性。
    - 路线: 同行评审的鲁棒性与对抗评估
      解决的问题: 理解LLM审稿人对对抗攻击的脆弱性，并建模同行评审动态，如AgentReview和Breaking the Reviewer。
      尚未覆盖: 实际部署中的风险及自动化审稿系统的有效缓解策略。
    - 路线: 基于智能体的研究工作流基准
      解决的问题: 提供标准化任务评估LLM智能体自动化复杂研究过程的能力，如后训练（PostTrainBench）。
      尚未覆盖: 与文献综述质量的直接关联，以及对其他综述子任务的可迁移性；缺少任务迁移的证据。
    共识:
    - 基于LLM的智能体能够提升文献综述的效率和品质，尤其是将任务分解为子任务时。
    - 多步编排增强了检索和证据基础，外部文献数据库对事实准确性至关重要。
    - 评估指标主要关注引用质量和与人类撰写综述的文本相似度。
    分歧:
    - 目标输出各异：部分系统仅提供检索到的证据片段，其他系统则生成完整综述手稿。
    - 评估协议和基准不统一，导致结果不可比；有的使用ScholarQABench，有的使用专有数据集。
    - 部分工作强调对抗攻击的鲁棒性，而其他工作忽略，造成安全性与生成质量之间的分歧。
    - 迭代或层级化结构是否比简单的一次性检索管线带来可测量的增益仍待验证。
    开放问题:
    - 如何超越引用重叠来度量事实准确性，例如通过专家对宣称的验证？
    - 智能体能否在不虚构共识的情况下处理矛盾的科学证据？
    - 在真实场景中，多智能体生成的综述面对对抗攻击时的可靠性如何？
    - 如何使文献综述智能体在不进行领域微调的情况下跨学科泛化？
    - 在时间和计算资源方面，迭代细化与单次检索的成本效益权衡是什么？
