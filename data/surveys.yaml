  related_work_outline:
  - 'Mainstream direction: Multi-agent AI systems that automate the entire scientific
    discovery loop—hypothesis generation, experiment design, and result analysis—using
    LLMs, tools, and human feedback.'
  - 'Shared research pattern: Structured workflows (trees, iterative cycles) with
    shared information states (world models) to coordinate literature search, data
    analysis, and hypothesis generation.'
  - 'Key differences: Hypothesis generation mechanism (debate, evolutionary search,
    structured world model); human involvement mode (full autonomy vs. targeted intervention);
    evaluation approach (benchmark metrics vs. real-world validation); and domain
    specificity (general vs. biology/equation discovery).'
  - 'Trend evolution: From 2025 single-agent cycles and surveys to 2026 multi-agent
    collaboration, human-in-the-loop integration, and evolutionary search; benchmarks
    become harder, and emphasis shifts to verifiability and reliability.'
  - 'Open questions: Evidence preservation, reproducibility, weak-direction rejection,
    cross-domain robustness, ethical safeguards, and scaling of valid discoveries
    beyond tested cycles.'
  related_work_outline_zh:
  - 主流方向：利用LLM、工具和人类反馈，自动化科学发现全循环（假设生成、实验设计和结果分析）的多智能体AI系统。
  - 研究共性：结构化工作流（树、迭代循环）和共享信息状态（世界模型），用于协调文献搜索、数据分析和假设生成。
  - 关键差异：假设生成机制（辩论、进化搜索、结构化世界模型）；人类参与模式（全自主 vs. 精准干预）；评估方式（基准指标 vs. 实际验证）；领域特异性（通用
