  related_work_outline:
  - 'Mainstream direction: Building autonomous AI research agents that can generate
    hypotheses, design experiments, and iteratively improve through self‑correction
    or human collaboration, with a clear shift from single‑task pipelines to general,
    self‑evolving frameworks.'
  - 'Shared research pattern: Most systems rely on LLM backbones, decompose the research
    cycle into modular stages (ideation, execution, verification, reporting), and
    incorporate some form of failure feedback—either via multi‑hypothesis causal attribution,
    vision‑language physics gates, or formal proof assistance.'
  - 'Key differences: The main split lies in (1) domain‑specific verification (physics‑aware
    gates, Lean‑based formal proofs) versus domain‑agnostic multi‑agent debate, and
    (2) the role of humans—ranging from fully autonomous runs to targeted human intervention
    at high‑leverage decision points.'
  - 'Trend evolution: From 2025 benchmarks and surveys that catalogued early AI‑scientist
    capabilities, the 2026 frontier moves toward self‑reinforcing pipelines, cross‑run
    knowledge accumulation, and formal verification, with reproducibility infrastructure
    beginning to emerge.'
  - 'Open questions: Whether proxy metrics (benchmark scores, blind review ratings)
    align with real scientific utility; how to ensure that formal or vision‑based
    verification gates do not miss silent failures; and how to scale domain‑specific
    validation to genuinely open‑ended discovery.'
  related_work_outline_zh:
  - 主流方向：构建能够自主提出假设、设计实验并通过自我纠正或人类协作迭代改进的AI研究智能体，明显从单任务流水线走向通用、自我演化的框架。
  - 研究共性：多数系统依赖LLM骨干，将研究循环分解为构思、执行、验证、报告等模块，并引入某种形式的失败反馈——通过多假设因果归因、视觉‑语言物理门控或形式化证明辅助。
  - 关键差异：主要分歧在于（1）领域特定的验证（物理感知门控、基于Lean的形式化证明）与领域无关的多智能体辩论，以及（2）人类角色——从完全自主运行到在高杠杆决策点进行精准的人机协作。
  - 趋势演进：从2025年的基准和综述对早期AI科学家能力的梳理，到2026年前沿转向自我强化流水线、跨运行知识积累和形式化验证，可复现基础设施也开始出现。
  - 开放问题：代理指标（基准分数、盲评评分）是否与真实科学效用一致；如何确保形式化或基于视觉的验证门控不会遗漏静默失败；以及如何将领域特定的验证扩展到真正的开放式发现。
  literature_review:
    line_of_work_matrix:
    - line: General-purpose autonomous research pipelines
      what_it_solves: Provides reusable multi‑agent architectures, structured debate,
        self‑healing execution, and human‑in‑the‑loop collaboration to automate the
        full experimental cycle across disciplines.
      what_remains_open: Actual scientific novelty depends on the backbone LLM and
        the quality of human intervention; no evidence yet that these pipelines independently
        produce discoveries beyond what a skilled human could achieve with the same
        tools.
    - line: Domain‑specific scientist agents with verification gates
      what_it_solves: Embeds hard validity checks (physics‑aware vision‑language inspection,
        machine‑checked formal proofs) to catch silent failures that general‑purpose
        pipelines miss.
      what_remains_open: Gates are incomplete—the vision‑language gate still missed
        2 of 16 planted failures, and formal proofs only guarantee correctness under
        formal assumptions, not that the formalisation faithfully captures the intended
        scientific claim.
    - line: Failure diagnosis and self‑correction
      what_it_solves: Replaces naive reflection with structured causal attribution
        that routes error root causes to the appropriate intervention level, substantially
        raising the fraction of successful experimental outputs.
      what_remains_open: Improvements are concentrated in code execution and artifact
        quality; full autonomous scientific writing and conference‑ready paper generation
        remain unsolved.
    - line: Benchmark design and evaluation frameworks
      what_it_solves: Creates standardised tasks, human baselines, and expert‑judged
        metrics to compare AI scientists across domains, tasks, and reproducibility
        axes.
      what_remains_open: Existing benchmarks cover only a handful of topics and rely
        on proxy metrics (e.g., expert preference, blind scores) whose correlation
        with real‑world discovery impact is unknown.
    - line: Conceptual taxonomies and survey synthesis
      what_it_solves: Organises fragmented progress into capability categories and
        identifies cross‑cutting challenges such as literature review automation,
        system reliability, and ethics.
      what_remains_open: The proposed categories have not been empirically validated
        to predict model behaviour or to guide the design of more effective AI scientists.
    consensus:
    - LLM‑based AI scientist systems consistently decompose the research cycle into
      ideation, execution, and verification stages, with modularity enabling reuse
      and evaluation.
    - Some form of external or internal validation (whether through debate, vision‑language
      gates, or formal proofs) is necessary to avoid hallucinated claims and silent
      experimental failures.
    - Human collaboration, even when minimal, still provides a decisive advantage
      over fully autonomous runs, especially at high‑leverage decision points.
    - The field recognises that current autonomous agents are not yet capable of producing
      fully reliable, conference‑ready scientific papers without human oversight.
    disagreements:
    - 'Representation of verification: some systems rely on domain‑specific physics
      or logic gates, while others argue for domain‑agnostic heuristic checks or multi‑agent
      debate.'
    - 'Supervision strategy: from fully autonomous runs with post‑hoc human inspection,
      to targeted human intervention at decision points, to exhaustive step‑by‑step
      oversight—the optimal level of human involvement remains contested.'
    - 'Evaluation target: some works benchmark on standardised tasks with automated
      metrics, others use expert‑judged novelty and presentation quality, with no
      agreement on which evaluation best predicts real scientific utility.'
    - 'Interaction mode: single‑agent pipelines, multi‑agent teams, and self‑evolving
      frameworks coexist, and the evidence does not yet show which architecture consistently
      yields more robust or novel hypotheses.'
    open_questions:
    - How can we build verification gates that are simultaneously cheap enough for
      large‑scale runs and accurate enough to catch nearly all silent failures, as
      the vision‑language gate in the CFD case still missed 2 of 16 planted failures?
    - To what extent do benchmark scores and blind review ratings correlate with genuine
      scientific discoveries, and what would a longitudinal study of AI‑generated
      hypotheses look like?
    - Can formal verification be scaled beyond narrowly defined theoretical domains,
      and how should the gap between a formalised theorem and its informal scientific
      interpretation be systematically audited?
    - What is the minimal viable human‑in‑the‑loop configuration that balances safety,
      scientific novelty, and cost, given that ablation studies suggest targeted collaboration
      outperforms both full autonomy and exhaustive oversight?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 通用自主研究流水线
      解决的问题: 提供可复用的多智能体架构、结构化辩论、自愈执行和人机协作，以跨领域自动化完整的实验周期。
      尚未覆盖: 实际科学新颖性取决于骨干LLM和人类干预的质量；尚无证据表明这些流水线能独立产生超出熟练人类使用相同工具所能达到的发现。
    - 路线: 带有验证门控的领域特定科学家智能体
      解决的问题: 嵌入硬核有效性检查（物理感知的视觉‑语言检查、机器验证的形式化证明），以捕捉通用流水线遗漏的静默失败。
      尚未覆盖: 门控并不完备——视觉‑语言门控在消融中仍遗漏了16个植入失败中的2个，且形式化证明仅保证形式化假设下的正确性，无法保证形式化忠实反映了预期的科学主张。
    - 路线: 失败诊断与自我纠正
      解决的问题: 用结构化因果归因取代简单反思，将错误根因路由到正确的干预层级，从而大幅提高成功实验输出的比例。
      尚未覆盖: 改进主要集中在代码执行和工件质量上；完全自主的科学写作和生成可提交会议论文的难题仍未解决。
    - 路线: 基准设计与评测框架
      解决的问题: 创建标准化任务、人类基线和专家判断指标，以跨领域、任务和可复现性维度比较AI科学家。
      尚未覆盖: 现有基准仅覆盖少数主题，并依赖代理指标（如专家偏好、盲评分数），其与真实世界发现影响力的相关性尚不清楚。
    - 路线: 概念分类与综述综合
      解决的问题: 将碎片化进展组织为能力类别，并识别文献综述自动化、系统可靠性和伦理等跨领域挑战。
      尚未覆盖: 这些分类尚未经过实证验证，无法预测模型行为或指导更有效的AI科学家设计。
    共识:
    - 基于LLM的AI科学家系统一致将研究循环分解为构思、执行和验证阶段，模块化使复用和评估成为可能。
    - 某种形式的外部或内部验证（无论是通过辩论、视觉‑语言门控还是形式化证明）对于避免幻觉主张和静默实验失败是必要的。
    - 即使是最小限度的人类协作，仍然比完全自主运行具有决定性优势，尤其是在高杠杆决策点。
    - 该领域承认，当前的自主智能体尚无法在没有人类监督的情况下产出完全可靠、可提交会议的论文。
    分歧:
    - 验证的表示方式：部分系统依赖领域特定的物理或逻辑门控，而其他系统主张领域无关的启发式检查或多智能体辩论。
    - 监督策略：从完全自主运行加事后人工审查，到在决策点进行精准人类干预，再到详尽的逐步监督——最优的人类参与程度仍存在争议。
    - 评测目标：一些工作以标准化任务和自动化指标为基准，另一些则使用专家评判的新颖性和呈现质量，对于哪种评价最能预测真实科学效用尚无共识。
