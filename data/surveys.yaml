  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agents, e.g. The AI Scientist, AI Scientist-v2,
        AI CFD Scientist, EvoCast
      what_it_solves: Automating the research loop from hypothesis generation, code
        implementation, and experiment execution to manuscript writing and iterative
        refinement.
      what_remains_open: Inconsistent success rates and limited domain generality;
        reliability and governance boundaries remain unresolved when human oversight
        is reduced.
    - line: Simulation-based discovery environments, e.g. DISCOVERYWORLD
      what_it_solves: Providing repeatable tasks that require full hypothesis-experiment-conclusion
        cycles and automatic completion metrics for agent comparison.
      what_remains_open: Whether simulated task completion aligns with real scientific
        evidence quality; strong baselines still struggle, suggesting coverage gaps
        or evaluation difficulty mismatches.
    - line: Evidence-grounded evaluation benchmarks, e.g. TruthInsightBench, BAISBench
      what_it_solves: Scoring agents on whether data support their claims through
        blind tasks, dimension-level rubrics, and human or automated judges rather
        than only task completion.
      what_remains_open: Reported performance can depend on a single frozen base model
        and limited domains; automated judge alignment with real decision utility
        is not established.
    - line: Verification and reliability mechanisms, e.g. physics-aware vision gates,
        cognition-authority separation
      what_it_solves: Detecting silent failures, constraining source edits, and making
        promotion decisions deterministic to improve trustworthy autonomous research.
      what_remains_open: Verification gates can still miss planted failures; standardized
        external validation across hardware, datasets, and user settings is absent.
    consensus:
    - Agents can execute and document experiments competently enough to produce plausible
      research artifacts or benchmark outputs.
    - Current systems lack discriminating scientific behaviors such as controls, robustness,
      falsifiability, and cross-dataset generalization, leaving them short of trustworthy
      discovery.
    - Evaluation is shifting from completion-only metrics toward evidence maturity,
      blind task design, automated judges, and occasional human baselines.
    - Explicit verification or authority mechanisms are needed because open-ended
      generation alone produces undefendable or inconsistent claims.
    disagreements:
    - Some evaluations target task completion or paper acceptance, while others target
      claim-level evidence maturity or downstream task performance.
    - 'Verification choices differ: visual inspection of rendered outputs versus LLM-based
      rubric judges versus deterministic source-control and promotion rules.'
    - Deployment settings range from domain-specific open-ended discovery to controlled
      multi-topic benchmark tasks.
    - 'Supervision and control assumptions differ: fully automated manuscript generation,
      human benchmark comparison, or system-internal authority separation rather than
      open-ended LLM autonomy.'
    open_questions:
    - Can these agents perform genuine open-ended discovery, or are they mostly reproducing
      or executing analyses within hidden target studies?
    - How can evaluation scale beyond one frozen base model, a single domain, or a
      small set of workshop submissions to establish generality?
    - Which proxy metrics best track real scientific utility, safety, and epistemic
      reliability when ground-truth conclusions are withheld?
    - How should verification gates be designed to catch silent failures that current
      systems miss without blocking valid novel results?
    - What governance mechanisms are needed as end-to-end agents gain greater autonomy
      over source code, experiments, and manuscripts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现智能体，如 The AI Scientist、AI Scientist-v2、AI CFD Scientist、EvoCast
      解决的问题: 自动化从假设生成、代码实现、实验执行到论文撰写和迭代改进的研究闭环。
      尚未覆盖: 成功率不稳定且领域通用性有限；在减少人类监督时，可靠性和治理边界仍未解决。
    - 路线: 基于仿真的发现环境，如 DISCOVERYWORLD
      解决的问题: 提供要求完整假设-实验-结论循环的可重复任务，并以自动完成度指标进行智能体比较。
      尚未覆盖: 模拟任务完成度是否与真实科学证据质量一致仍未知；强基线智能体表现困难，提示覆盖缺口或评测难度不匹配。
    - 路线: 证据锚定的评测基准，如 TruthInsightBench、BAISBench
      解决的问题: 通过盲任务、维度量规和人工或自动评审者，评估智能体主张是否被数据支持，而非仅看任务完成。
      尚未覆盖: 某结果依赖单一冻结基座模型且领域覆盖有限；自动评审者与真实决策效用的一致性尚未确立。
    - 路线: 验证与可靠性机制，如物理感知视觉关卡、认知-权威分离
      解决的问题: 检测静默失败、约束源码修改范围，并以确定性方式执行晋升决策，以提高自主研究的可信性。
      尚未覆盖: 验证关卡仍会遗漏已植入的失败；跨硬件、数据集和用户设置的标准化外部验证仍然缺失。
    共识:
    - 智能体能够相对熟练地执行并记录实验，足以生成看似合理的研究工件或基准输出。
    - 当前系统普遍缺乏对照、稳健性、可证伪性和跨数据集泛化等判别性科学行为，距离可信发现仍有差距。
    - 评测正从仅看任务完成转向证据成熟度、盲任务设计、自动评审和人工基线等更严格的判断。
    - 由于开放式生成本身会产生不可辩护或不稳定的主张，需要显式验证或权威机制。
    分歧:
    - 有的评测以任务完成或论文接受为目标，有的则关注主张级证据成熟度或下游任务性能。
    - 验证方式不同：渲染输出的视觉检查、基于LLM的量规评审，或确定性的源码控制与晋升规则。
    - 部署场景从领域特定的开放式发现到受控的多主题基准任务不等。
    - 监督/控制假设不同：全自动论文生成、人工基线对比，或系统内部权威分离而非完全开放的LLM自主。
    开放问题:
    - 这些智能体能否进行真正的开放式发现，还是主要复现或执行隐藏目标研究中的分析？
    - 评测结果如何跨出单一冻结基座模型、单一领域或少量提交论文以实现泛化？
    - 在隐藏真实结论时，哪些代理指标能最好地反映真实科学效用、安全性与认知可靠性？
    - 如何设计验证关卡，以捕捉当前系统遗漏的静默失败，同时不阻挡有效的原创结果？
    - 随着端到端智能体对源码、实验和论文的自主权增强，需要什么治理机制？
