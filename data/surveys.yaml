    or result traceability).'
  - 'Trend evolution: From 2024 to 2026, the field moves from generic ML-domain frameworks
    (The AI Scientist) toward domain-specialized agents with stronger validity gates,
    structured multi-agent collaboration, and human-interactive platforms, supported
    by emerging benchmarks like DISCOVERYWORLD and BAISBench.'
  - 'Open questions: How to guarantee correctness in domains without a ground-truth
    simulator; whether current benchmark metrics align with real scientific impact;
    and what optimal human-AI collaboration ratio maximizes both novelty and reliability.'
  related_work_outline_zh:
  - 主流方向：端到端自主研究流水线，将LLM驱动的构思、代码生成、实验执行和论文撰写整合为单一智能体工作流。
  - 研究共性：几乎所有系统都将科学发现分解为假设、实验、分析、写作等模块，由LLM智能体遍历，并常加入验证或辩论等内部循环。
  - 关键差异：系统在完全自主与人机协作的依赖程度、领域知识的专门性（通用ML vs. CFD/数学/生物学）以及验证门控类型（逻辑一致性、物理感知视觉检查或结果可追溯性）上存在分化。
  - 趋势演进：从2024年到2026年，领域从通用机器学习框架（The AI Scientist）转向具有更强验证门控、结构化多智能体协作和人类交互平台的领域专用系统，并得到DISCOVERYWORLD和BAISBench等新基准的支持。
  - 开放问题：如何在缺乏真实模拟器的领域保证正确性；当前基准指标是否与真实科学影响力对齐；以及何种人机协作比例能最大化新颖性与可靠性。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automating the full cycle of scientific discovery—from ideation
        and code writing to experiment execution and paper generation—reducing the
        cost and manual effort per paper.
      what_remains_open: Reliability of the generated claims and the ability to generalize
        beyond the narrow ML domains or template-based experiments shown so far.
    - line: Verification and self-correction mechanisms
      what_it_solves: Detecting silent failures, logical errors, or physically impossible
        results before the output is trusted, through internal consistency checks,
        vision-language physics gates, or result traceability.
      what_remains_open: These gates still miss a fraction of planted errors; their
        effectiveness in non-physics domains (e.g., biology) is largely unproven.
    - line: Benchmarking and evaluation design
      what_it_solves: Providing standardized tasks and metrics (e.g., DISCOVERYWORLD,
        BAISBench, ARC-Bench) to compare AI scientist agents on scientific reasoning
        and discovery abilities.
      what_remains_open: Existing benchmarks simplify aspects of real science (simulated
        environments, multiple-choice questions); the correlation with peer-reviewed
        publication quality or downstream impact is not established.
    - line: Human-AI collaboration paradigms
      what_it_solves: Allowing human researchers to intervene at strategic points
        (hypothesis selection, error correction, quality gate) to improve outcomes
        beyond what full autonomy or exhaustive oversight achieves.
      what_remains_open: The optimal granularity and mode of human intervention remain
        empirical; most studies are limited to internal case studies without a large-scale,
        multi-team validation.
    - line: Domain-specific knowledge integration
      what_it_solves: Embedding domain constraints (physics laws, mathematical proof
        checkers, single-cell biology knowledge) into the agent loop to make the system
        usable for real scientific problems outside generic ML.
      what_remains_open: The cost of building such domain-specific backends and the
        lack of a unified approach to transfer across scientific disciplines.
    consensus:
    - Large language models can serve as the core engine for autonomous scientific
      discovery, generating plausible research ideas, code, and narratives.
    - Verification is necessary because purely generative outputs are prone to hallucinated
      citations, fabricated numbers, and physically invalid results.
    - Multi-agent or multi-role architectures (debate, manager-worker, PI-student)
      improve robustness over single-agent loops.
    - Bridging the gap between simulated autonomy and real-world scientific contribution
      requires a combination of human oversight and domain-specific validity checks.
    disagreements:
    - Whether the system should aim for full autonomy (The AI Scientist, AI Scientist-v2)
      or actively incorporate human-in-the-loop collaboration as a core design principle
      (AutoResearchClaw, Claw AI Lab, ReasFlow).
    - 'The type of verification gate: logic-based internal consistency (ReasFlow),
      vision-language physics verification (AI CFD Scientist), or end-to-end result
      traceability and anti-fabrication checks (AutoResearchClaw).'
    - 'Evaluation targets: some works evaluate via simulated peer review or LLM judges,
      others via real conference submission (AI Scientist-v2), and still others via
      standardized benchmark tasks (DISCOVERYWORLD, BAISBench).'
    - 'Generalizability: systems like The AI Scientist and AI Scientist-v2 operate
      in broad ML subfields, while AI CFD Scientist, ReasFlow, and BAISBench are tailored
      to specific domains, leaving unclear whether a single architecture can serve
      all sciences.'
    open_questions:
    - Can verification gates that rely on vision-language inspection of physical fields
      be adapted to domains where ground truth is not visualizable, such as genomics
      or drug discovery?
    - Do the current benchmarks (DISCOVERYWORLD, BAISBench, ARC-Bench) capture the
      creative and inductive leaps that characterize high-impact science, or do they
      primarily reward data-fitting and protocol-following?
    - What is the minimal human-AI interaction frequency and mode that yields a Pareto-optimal
      balance between novelty, correctness, and agent autonomy?
    - How can we systematically compare systems when they use different evaluation
      protocols, different underlying LLMs, and different domain-specific backends,
      without a unified evaluation framework?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流水线
      解决的问题: 自动化从构思、代码编写到实验执行和论文生成的全流程，降低单篇论文的成本和人工投入。
      尚未覆盖: 生成主张的可靠性，以及能否泛化到当前展示的狭窄ML领域或模板实验之外。
    - 路线: 验证与自纠正机制
      解决的问题: 在输出被信任前，通过内部一致性检查、视觉-语言物理门控或结果可追溯性，检测静默失败、逻辑错误或物理上不可能的结果。
      尚未覆盖: 这些门控仍会遗漏部分植入错误；在非物理领域（如生物学）的有效性几乎没有验证。
    - 路线: 基准测试与评估设计
      解决的问题: 提供标准化任务和指标（如DISCOVERYWORLD、BAISBench、ARC-Bench），以比较AI科学家在科学推理和发现能力上的表现。
      尚未覆盖: 现有基准简化了真实科学的某些方面（模拟环境、选择题）；与同行评审发表质量或下游影响力的相关性尚未建立。
    - 路线: 人机协作范式
      解决的问题: 允许人类在关键节点（假设选择、错误纠正、质量门控）介入，以获得优于完全自主或详尽监督的结果。
      尚未覆盖: 人类干预的最佳粒度和模式仍凭经验确定；多数研究仅限于内部案例研究，缺乏大规模、多团队验证。
    - 路线: 领域特定知识整合
      解决的问题: 将领域约束（物理定律、数学证明检查器、单细胞生物学知识）嵌入智能体循环，使系统能用于通用ML之外的真实科学问题。
      尚未覆盖: 构建此类领域特定后端的成本，以及缺乏跨科学学科的统一方法。
    共识:
    - 大型语言模型可作为自主科学发现的核心引擎，生成可信的研究想法、代码和叙述。
    - 验证是必要的，因为纯生成性输出容易产生虚构引用、伪造数字和物理上无效的结果。
    - 多智能体或多角色架构（辩论、管理者-工作者、PI-学生）比单智能体循环更稳健。
    - 弥合模拟自主性与真实科学贡献之间的差距需要结合人类监督和领域专用有效性检查。
    分歧:
    - 系统应追求完全自主（The AI Scientist、AI Scientist-v2），还是应将人机协作作为核心设计原则（AutoResearchClaw、Claw
      AI Lab、ReasFlow）。
    - 验证门控的类型：基于逻辑的内部一致性（ReasFlow）、视觉-语言物理验证（AI CFD Scientist）或端到端结果可追溯性与反伪造检查（AutoResearchClaw）。
    - 评估目标：有的通过模拟同行评审或LLM评审员评估，有的通过真实会议投稿（AI Scientist-v2），还有的通过标准化基准任务（DISCOVERYWORLD、BAISBench）。
    - 泛化性：像The AI Scientist和AI Scientist-v2这样的系统在广泛的ML子领域运作，而AI CFD Scientist、ReasFlow和BAISBench则针对特定领域，单个架构能否服务所有科学领域仍不明确。
    开放问题:
    - 依赖视觉-语言检查物理场域的验证门控能否适应基因组学或药物发现等无法可视化的真实场景？
    - 当前基准（DISCOVERYWORLD、BAISBench、ARC-Bench）是否捕捉到了高影响力科学所特有的创造性和归纳性飞跃，还是主要奖励数据拟合和协议遵循？
    - 什么是最小的人机交互频率和模式，能在新颖性、正确性和智能体自主性之间实现帕累托最优平衡？
    - 当系统使用不同评估协议、不同底层LLM和不同领域后端时，如何在没有统一评估框架的情况下进行系统比较？
