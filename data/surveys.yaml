  literature_review:
    line_of_work_matrix:
    - line: End-to-end discovery loop construction
      what_it_solves: Produces complete research artifacts from idea generation through
        code, experiments, visualization, and writing in one agentic loop.
      what_remains_open: Peer-review acceptance is inconsistent; demonstrated only
        at workshop or task levels, and validity gates can still miss injected failures.
    - line: Reusable task and evaluation environment design
      what_it_solves: Provides shared tasks, baselines, metrics, and failure cases
        for comparing discovery agents beyond single demonstrations.
      what_remains_open: Proxy metrics such as task completion or judge scores are
        not yet shown to equal real decision utility, and coverage across domains
        and base models is incomplete.
    - line: Evidence-maturity scoring and automated review
      what_it_solves: Assesses whether agent-produced claims are supported by data,
        controls, robustness, falsifiability, and auditability rather than style or
        execution alone.
      what_remains_open: Judgments rely on a fixed LLM judge; evidence does not establish
        base-model generalization or alignment with human validity judgments.
    - line: Reliability guarding and authority separation
      what_it_solves: Reduces silent execution failures and invalid modifications
        by adding physics/vision verification gates or deterministic program authorities.
      what_remains_open: The verification gate missed 2 of 16 injected failures, and
        authority separation is evaluated in only a few real-world cases.
    - line: Domain-grounded evaluation with human baselines
      what_it_solves: Measures AI scientists on realistic domain data and published-study-derived
        questions, including human comparison points.
      what_remains_open: Coverage is limited to selected domains and tasks, and human
        baselines are small graduate-level samples.
    consensus:
    - Autonomous research agents can execute and document analyses or experiments
      and produce plausible claims or artifacts.
    - Current systems are not yet reliable autonomous scientists; they largely lack
      controls, robustness, falsifiability, and cross-dataset generalization.
    - Evaluation should move beyond execution or text quality toward evidence maturity,
      validity gates, and reproducibility signals.
    - Open-source artifacts and reusable task environments are treated as necessary
      for repeatable comparison.
    disagreements:
    - 'Success is measured differently: downstream prediction/annotation metrics,
      task completion, LLM-judge evidence scores, or peer-review acceptance.'
    - Some work evaluates open-ended discovery over frozen data, while other work
      withholds source conclusions to avoid reproduction of a hidden target study.
    - Reliability is enforced either through learned visual/physics verification gates
      or through deterministic program authority, implying different assumptions about
      where authority should sit.
    - Evaluation scope ranges from general machine research to specialized domains
      such as computational fluid dynamics, forecasting, and single-cell biology.
    open_questions:
    - Do LLM-based judges and automated reviewers align with human judgments of scientific
      validity and evidence quality?
    - Can reliability gates and authority separation detect silent failures beyond
      the few injected cases evaluated?
    - Do results transfer across base models, scientific domains, and deployment settings
      when current evidence is narrow?
    - Which evaluation target—task performance, evidence maturity, peer review, or
      real-world decision utility—best predicts trustworthy research output?
    - What governance mechanisms are needed around autonomous research systems, given
      the evidence covers technical verification but not institutional oversight?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端发现循环构建
      解决的问题: 从想法生成到代码、实验、可视化和写作，在单个智能体循环中产出完整研究工件。
      尚未覆盖: 同行评审接受度不稳定；仅在工作坊或任务层面验证，且有效性门控仍会漏掉注入失败。
    - 路线: 可复用任务与评测环境设计
      解决的问题: 提供可复用任务、基线、指标和失败案例，用于在单一演示之外比较发现智能体。
      尚未覆盖: 任务完成或裁判分数等代理指标尚未证明等于真实决策效用，跨领域和基座模型覆盖不完整。
    - 路线: 证据成熟度评分与自动评审
      解决的问题: 评估智能体产出主张是否由数据、对照、稳健性、可证伪性和可审计性支撑，而非只看风格或执行。
      尚未覆盖: 判断依赖固定LLM裁判；证据未建立跨基座模型泛化或与人类有效性判断的一致性。
    - 路线: 可靠性守护与权限分离
      解决的问题: 通过物理/视觉验证门控或确定性程序权限减少静默执行失败和无效修改。
      尚未覆盖: 验证门控漏掉16个注入失败中的2个；权限分离仅在少数真实案例中评估。
    - 路线: 带人类基线的领域锚定评测
      解决的问题: 在真实领域数据和已发表研究派生问题上衡量AI科学家，并提供人类比较点。
      尚未覆盖: 覆盖仅限选定领域和任务，人类基线为小型研究生样本。
    共识:
    - 自主研究智能体能够执行并记录分析或实验，并产出看似合理的主张或工件。
    - 当前系统尚不是可靠的自主科学家；它们普遍缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 评估应超越执行或文本质量，转向证据成熟度、有效性门控和可复现信号。
    - 开放源码工件和可复用任务环境被视为可重复比较的必要条件。
    分歧:
    - 成功标准不同：下游预测/注释指标、任务完成、LLM裁判证据分数或同行评审接受。
    - 有些工作评估冻结数据上的开放式发现，有些则隐藏源结论以避免复现隐藏目标研究。
    - 可靠性通过学习的视觉/物理验证门控或确定性程序权限实现，对权威应放在哪里存在不同假设。
    - 评估范围从通用机器学习研究到专门领域，如计算流体动力学、预测和单细胞生物学。
    开放问题:
    - 基于LLM的裁判和自动评审是否与人类对科学有效性和证据质量的判断一致？
    - 可靠门控和权限分离能否在少数注入失败案例之外检测静默失败？
    - 在当前证据较窄的情况下，结果能否跨基座模型、科学领域和部署场景迁移？
    - 任务表现、证据成熟度、同行评审或真实决策效用，哪类评估目标最能预测可信研究成果？
    - 证据覆盖技术验证但未覆盖制度监督，自主研究系统需要哪些治理机制？
