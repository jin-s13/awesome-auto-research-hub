  - 主流方向：构建端到端自主科研智能体，覆盖假设、代码实验、结果分析与论文撰写，并逐步加入验证、评审反馈和失败记忆。
  - 研究共性：评估多依赖自动评审或任务完成指标，与强基线或已发表最佳模型比较，并把发现看作完整循环而非单一预测。
