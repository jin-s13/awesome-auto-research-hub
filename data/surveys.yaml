  related_work_outline_zh:
  - 主流方向：以大型语言模型为核心，从研究构思、实验到论文草稿的一体化自主写作智能体，并逐步强调验证、证据落地与人机协作。
  - 研究共性：多智能体或端到端LLM流水线，从最小提示生成论文，使用开放基线对比，并依赖LLM评审或同行评审式评估。
