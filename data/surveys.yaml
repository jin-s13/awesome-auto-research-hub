      解决的问题: 把综述写作分解为大纲、撰写、编辑、审校的专门智能体或迭代流程，自动生成可读文本。
      尚未覆盖: 可见证据集中在少数综述数据集；无控设置下的检索质量与可扩展性仍需验证。
    - 路线: 层级化研究组织
      解决的问题: 将科学研究组织成层级结构，在完整生成前降低文献综述的认知负担。
      尚未覆盖: 数据包中看不到该路线可用的评测证据，对最终综述质量的影响属于验证缺口。
    - 路线: 文献综述智能体的评测与认证
      解决的问题: 定义生物医学文献综述智能体比较在何种基准条件下可采纳且可控。
      尚未覆盖: 排行榜在生物医学之外的认证能力，以及组合可控性是否可迁移仍未解决。
    - 路线: 通用AI科学发现框架
      解决的问题: 将文献工作置于从假设、实验到信念修正的自主科学发现框架中。
      尚未覆盖: 组件集成仍是最主要的未解决问题，数据包中也没有可见的综述专属定量结果。
    共识:
    - 基于文献数据库的检索能提高引用级指标，优于较少锚定的检索方式。
    - 把文献综述拆分为检索、规划、撰写、审校等步骤，是模拟人类综述流程的常见做法。
    - 评测依赖引用质量、写作质量、专家一致性或与人类综述的相似度，尚未形成统一指标。
    分歧:
    - 系统瓶颈不同：有的聚焦实时证据检索，有的聚焦多智能体生成质量，有的聚焦基准可否采纳。
    - 交互方式不同：单LLM在数据库上编排、多个专门智能体协作，或迭代式生成。
    - 评测目标不同：声明验证用引用F1和专家一致性，综述生成用写作与引用质量，排行榜则检验比较可控性。
    - 部署语境不同：开放领域或生命科学文献、生物医学综述基准，以及更宽泛的科学发现叙事。
    开放问题:
    - 哪些指标能预测生成综述对研究者的实际效用？
