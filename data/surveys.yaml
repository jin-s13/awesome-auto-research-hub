      尚未覆盖: 门控仍会漏检部分静默失败，且验证仅限于特定领域
    - 路线: 科学发现基准环境
      解决的问题: 标准化完整发现循环评测，衡量任务完成、相关动作和可解释知识
      尚未覆盖: 虚拟环境表现未必迁移到真实科研效用，强基线智能体仍显困难
    - 路线: 证据锚定评测与自动评审
      解决的问题: 通过分项评分和LLM裁判实现规模化评估，减少逐例人工评分
      尚未覆盖: 当前智能体在对照、稳健性、可证伪性和跨数据集泛化上表现不足
    - 路线: 可复现开源智能体基础设施
      解决的问题: 将单个智能体想法转化为可运行代码、工件和可复用科研工作流
      尚未覆盖: 跨硬件、领域、数据集和基座模型的外部验证尚未建立
    共识:
