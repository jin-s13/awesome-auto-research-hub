      解决的问题: 在计算或数学发现中通过检查流场、逻辑一致性或求解器级有效性，减少主张被接受前的静默失败。
      尚未覆盖: 验证门控并非穷尽；消融证据显示仍有静默失败漏检，领域特定检查可能不迁移。
    - 路线: 发现评测与证据基准
      解决的问题: 通过受控虚拟任务、基于盲审研究的任务和自动证据质量评分，使发现智能体的能力可比较。
      尚未覆盖: 跨基座模型、科学领域和任务分布的泛化性评估不足，代理指标可能不等同于真实发现效用。
