  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agent frameworks
      what_it_solves: Closes the scientific workflow loop from idea generation and
        code execution to analysis and manuscript drafting with minimal human intervention.
      what_remains_open: Whether accepted-style or reviewer-style scores reflect trustworthy
        evidence, generalizable discovery, or mostly plausible manuscript production.
    - line: Domain-specific discovery systems with embedded validity verification
      what_it_solves: Reduces silent failure modes in specialized fields by coupling
        generation with logical, formal, or physics-aware checks before accepting
        and writing results.
      what_remains_open: Verification gates remain incomplete and domain-bound; evidence
        shows missed silent failures, leaving cross-domain validity and failure coverage
        unresolved.
    - line: Virtual environments for task-based discovery evaluation
      what_it_solves: Provides controlled tasks, baselines, and metrics for assessing
        complete discovery cycles in a repeatable simulated setting.
      what_remains_open: Whether performance in synthetic or narrow task environments
        transfers to real scientific decision utility and diverse research settings.
    - line: Evidence-grounded blind evaluation of discovery claims
      what_it_solves: Measures whether agents produce defensible claims from frozen
        data by auditing controls, robustness, falsifiability, and evidentiary maturity.
      what_remains_open: Current results are based on limited base models and coding
        agents; separation among agents is small, and the gap to genuine discovery
        remains large.
    consensus:
    - Scientific discovery is formulated as an end-to-end agentic loop of hypothesis
      formation, experiment execution, analysis, and writing rather than an isolated
      model prediction.
    - Automated review, verification, or evidence auditing is considered necessary
      because raw generation and execution alone do not establish defensible scientific
      claims.
    - Evaluation should explicitly measure evidence quality, including controls, robustness,
      falsifiability, and explanation, rather than only task completion or manuscript
      format.
    disagreements:
    - 'Systems differ in validity signal: some rely on LLM-based manuscript review,
      while others enforce domain-specific physics, logic, or vision-based checks
      before accepting results.'
    - Evaluation targets differ between simulated task completion in virtual environments
      and blind evidence-maturity scoring on peer-reviewed study data.
    - Deployment settings differ from general machine-learning research loops to applied
      mathematics and computational fluid dynamics, creating domain-specific assumptions
      about code, simulation, and reasoning.
    - Interaction mode differs from fully autonomous generation to human-as-principal-investigator
      multi-agent collaboration, changing how human judgment is used.
    open_questions:
    - Do LLM-based review scores or workshop acceptance thresholds measure scientific
      soundness, or do they mainly reward plausible paper formatting?
    - Can domain-specific validity gates detect enough silent failure modes to reduce
      dependence on human inspection?
    - Are current discovery benchmarks measuring general scientific reasoning or only
      narrow analysis and coding behaviors under limited base-model settings?
    - How should novelty be weighed against controls, robustness, falsifiability,
      and cross-dataset generalization when assessing autonomous discovery?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研智能体框架
      解决的问题: 打通从假设生成、代码执行、结果分析到论文撰写的闭环科研流程，减少人工干预。
      尚未覆盖: 接收或评审式评分能否代表证据可信度和跨领域发现能力，还是主要反映论文产出是否合理，仍缺少验证。
    - 路线: 带有内嵌有效性验证的领域专用发现系统
      解决的问题: 在专业领域中通过逻辑、形式化或物理感知检查，在接受和写作前减少静默失败。
      尚未覆盖: 验证门控仍不完整且受领域限制；已有证据显示会漏检静默失败，跨领域有效性和失败覆盖仍待解决。
    - 路线: 基于虚拟环境的任务式发现评测
      解决的问题: 在可重复的仿真环境中提供受控任务、基线和指标，评估完整发现循环。
      尚未覆盖: 合成或窄任务环境中的表现能否迁移到真实科研决策效用和多样研究场景，仍不清楚。
    - 路线: 基于证据的发现主张盲评
      解决的问题: 通过审计对照、稳健性、可证伪性和证据成熟度，衡量智能体是否能从冻结数据中得出可辩护主张。
      尚未覆盖: 现有结果仅基于有限基座模型和编码智能体，智能体之间差异很小，距离真正科学发现仍很远。
    共识:
    - 科学发现被形式化为假设形成、实验执行、分析和写作的端到端智能体闭环，而非孤立模型预测。
    - 自动评审、验证或证据审计被认为是必要的，因为仅靠生成和执行无法建立可辩护的科学主张。
    - 评测应明确关注证据质量，包括对照、稳健性、可证伪性和解释，而不仅是任务完成或论文格式。
    分歧:
    - 有效性信号不同：一些系统依赖LLM论文评审，另一些在接受结果前强制执行领域专用物理、逻辑或视觉检查。
    - 评测目标不同：有的评虚拟环境中的任务完成，有的评同行评审研究数据上的盲测证据成熟度。
    - 部署场景不同：从通用机器学习研究循环到应用数学和计算流体动力学，对代码、仿真和推理的假设不同。
    - 交互模式不同：从全自主生成到人类作为首席研究员的多智能体协作，人工判断的参与方式存在差异。
    开放问题:
    - 基于LLM的评审分数或工作坊接收阈值衡量的是科学可靠性，还是主要反映论文格式是否合理？
    - 领域专用有效性门控能否检测足够多的静默失败，以减少对人类检查的依赖？
    - 当前发现基准衡量的是通用科学推理，还是仅在有限基座模型设置下的窄分析编码行为？
    - 在评估自主发现时，应如何权衡新颖性与对照、稳健性、可证伪性和跨数据集泛化？
