  - 'Mainstream direction: Research agent work is converging on closed-loop autonomous
    discovery and agent evaluation, with emphasis on long-horizon state management,
    sample/query-efficient feedback, reusable operational knowledge, and held-out
    or sealed generalization tests.'
  - 'Shared research pattern: Agents propose candidates or evaluators, collect feedback
    under fixed budgets, revise and select; durable evidence is externalized into
    harnesses, experience libraries, or verified skills rather than left only in conversation
    history.'
  - 'Key differences: Research-state architecture differs between stateless harness-owned
    contexts, accumulated experience, and distilled skills; evaluation targets span
    domain tasks, optimizer rewriting, and meta-evaluation; success metrics split
    between token/query cost, final task performance, and evaluator agreement.'
  - 'Trend evolution: Visible top evidence is concentrated in 2026 within a 2024-2026
    envelope, moving from single-suite benchmarking toward long-horizon budgeted runs,
    sparse high-fidelity feedback, and held-out/sealed generalization protocols.'
  - 'Open questions: Whether long-horizon gains generalize beyond narrow engineering/science
    domains, whether generated evaluators can reach target disagreement ceilings without
    development overfitting, and whether distilled skills remain valid across unseen
    repositories and tasks.'
  related_work_outline_zh:
  - 主流方向：研究智能体工作正聚焦于闭环自主发现与智能体评估，强调长程状态管理、样本/查询高效反馈、可复用操作知识，以及留出或密封泛化测试。
  - 研究共性：智能体提出候选或评估器，在固定预算下获取反馈并修订选择；持久证据被外置到框架、经验库或技能中，而非只留在对话历史中。
  - 关键差异：研究状态架构分为无状态框架持有上下文、累积经验与蒸馏技能；评测目标覆盖领域任务、优化器改写与元评估；成功指标在token/查询成本、最终任务表现和评估器一致性之间分化。
