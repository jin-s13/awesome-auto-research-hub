  related_work_outline:
  - 'Mainstream direction: End-to-end automated research agents are being paired with
    evaluation infrastructure that tests evidence maturity, task completion, peer
    review, or domain validity, rather than only idea generation.'
  - 'Shared research pattern: The evidence converges on a loop from hypothesis/idea
    to code, experiment, analysis, writing, and external judgment; recent systems
    add verification gates, monitoring, or blind evaluation tasks.'
  - 'Key differences: Evaluation target varies from simulated discovery environments
    and domain-specific blind tasks to real peer review acceptance; interaction spans
    fully autonomous pipelines, interactive human-in-loop dashboards, and domain-specific
    executable tools.'
  - 'Trend evolution: From 2024 general autonomous scientific discovery frameworks
    to 2025-2026 domain-specific, verification-aware, open-source infrastructure and
    evidence-grounded blind evaluation with statistical comparisons.'
  - 'Open questions: Whether LLM-based judges or workshop acceptance predict reproducible
