  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research-loop systems
      what_it_solves: 'Automates the full discovery workflow: hypothesis or idea generation,
        code or derivation execution, experiment and analysis, visualization, and
        manuscript or report writing.'
      what_remains_open: Demonstrated consistency remains limited to selected domains,
        few generated papers, or specific starting components; peer-accepted outputs
        are rare and real-world generalization is not established.
    - line: Domain-specific verification and feedback gates
      what_it_solves: Adds internal logic checking, physics-aware visual inspection,
        or knowledge retrieval to catch silent failures before claims are accepted
        in formal or simulation-heavy science.
      what_remains_open: Observed gates still miss some silent failures; validation
        is narrow in equation, geometry, and problem-class coverage, and external
        generalization remains unproven.
    - line: Discovery evaluation environments and evidence benchmarks
      what_it_solves: Provides standardized tasks, frozen or blind data, and repeatable
        metrics or rubrics for comparing agents on complete discovery cycles and evidentiary
        maturity.
      what_remains_open: Evidence is tied to a single frozen base model or simulated
        environment in some results; whether these proxy evaluations predict real
        scientific utility is not shown.
    - line: Iterative agentic search and automated review
      what_it_solves: Improves idea and manuscript quality by searching over experiment
        paths and incorporating automated reviewer or VLM feedback without human intervention.
      what_remains_open: Pass rates remain inconsistent, and success is demonstrated
        mainly at workshop level rather than broader conference or real-world scientific
        standards.
    consensus:
    - Research agents are commonly decomposed into ideation, execution or derivation,
      analysis, verification, and writing stages with feedback loops between stages.
    - Raw generation is not treated as sufficient; systems add some form of verification,
      review, or environment scoring to filter unsupported or premature claims.
    - Current evidence shows agents can execute and document analyses competently,
      but trustworthy autonomous scientific discovery remains far from demonstrated.
    disagreements:
