      尚未覆盖: 验证门可能遗漏某些失败，最佳智能体相互依赖程度尚不明确。
    - 路线: 自我纠正与失败归因
      解决的问题: 诊断实验失败的根本原因，将纠正措施路由到正确组件，提高有效结果的比例。
      尚未覆盖: 完全自主的科学写作仍未解决，自我纠正尚不能保证产出可提交会议的论文。
    - 路线: 人机协作模式
      解决的问题: 在战略决策点融入人类监督，平衡自主性和质量，优于纯自主或详尽监督。
      尚未覆盖: 最佳干预粒度及循环中人类努力的成本。
    - 路线: AI科学家的基准与评测
      解决的问题: 提供标准化任务和指标以比较自主研究系统，超越临时评估。
      尚未覆盖: 代理指标与真实同行评审接收之间的对齐，以及多样化科学领域的覆盖。
    共识:
    - 所有系统都使用基于LLM的智能体来自动化研究和写作管线的重要部分。
    - 验证和错误纠正被认为是产生可辩护科学主张的关键组成部分。
    - 论文生成在低计算成本下是可行的，但产出质量尚未一致达到顶级人类会议的水平。
    分歧:
    - 自主程度：部分系统追求完全自动化，其他系统则在关键决策点引入人类干预。
    - 验证策略：方法从内部逻辑一致性检查到外部物理感知视觉门控和多假设因果归因各异。
    - 评估标准：论文通过自动LLM评审、真实工作坊同行评审或自定义基准来判断，导致对成功的声称不同。
