  - 趋势演进：从2024年的模拟发现环境与首轮自动论文框架，到2025-2026年出现专门记忆、树搜索、验证和交互式研究团队基础设施，但仍处于当前前沿和窄验证窗口。
  - 开放问题：自动化能否跨出选定领域稳定泛化，代理指标能否预测真实科学价值，负记忆、代码工具和自动评审器如何外部验证。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agents
      what_it_solves: Automating the full research loop from hypothesis or idea generation
        through code or derivation execution, analysis, and manuscript writing.
      what_remains_open: Reliability across domains is unproven; peer-review success
        is rare or inconsistent, and many results rest on LLM-based or internal case-study
        evaluation.
    - line: Evaluation task suites and scoring protocols for scientific discovery
      what_it_solves: Making automated discovery and experiment planning comparable
        through controlled tasks, success metrics, difficulty levels, and ablation
        or recall scoring.
      what_remains_open: Scientific task coverage is limited, and task-completion
        or LLM-judge metrics are not yet tied to real research utility or external
        validity.
    - line: Failure-aware memory and experiment iteration
      what_it_solves: Recording failed attempts as typed negative knowledge so downstream
        agents can avoid repeated errors, reduce token use, and improve retry or new-task
        performance.
      what_remains_open: Transfer is shown only on selected PDE and ScienceAgentBench
        cases; long-term memory scaling, curation quality, and interaction with other
        planning loops remain open.
    - line: Interactive research-team and code-harness infrastructure
      what_it_solves: Turning standalone model ideas into runnable multi-agent stacks
        with role customization, monitoring, artifact inspection, and local code or
        dataset integration.
      what_remains_open: Maturity and external validation across hardware, datasets,
        and user settings are lacking; reported evidence is limited to a small number
        of internal AI case studies.
    - line: Automated review and experiment-planning diagnostics
      what_it_solves: Auditing generated manuscripts or planned ablations via automated
        judges or recall metrics to catch missing evidence and logical mistakes before
        human review.
      what_remains_open: Automated review reliability is not standardized; ablation
        recall remains below human level, and author/reviewer task grounding differs.
    consensus:
    - 'LLM-based agents are the common substrate for automating parts of the scientific
      experiment loop: idea generation, execution, analysis, and reporting.'
    - Multiple works treat human-level or peer-review-like evaluation as a key target,
      using LLM judges, expert preference, or controlled task statistics.
    - Current evidence shows automation can complete selected tasks or produce papers,
      but remains incomplete or inconsistent on harder discovery and experiment-planning
      problems.
    - Reproducibility signals such as code and datasets are present in some systems
      but are not uniformly demonstrated, and limitations are often missing.
    disagreements:
    - 'Representation and control differ: some systems use explicit multi-agent roles
      and shared memory, while others use a single end-to-end loop or tree search;
      one study finds chain-of-thought prompting stronger than an agent-based setup
      on ablation planning.'
    - 'Evaluation targets differ: full manuscript peer review or judge scores, task
      completion in simulated discovery, ablation recall, token efficiency, and expert
      preference on internal case studies are not interchangeable.'
    - 'Deployment and interaction differ: fully autonomous prompt-to-paper pipelines
      coexist with human-in-the-loop dashboards and environment-based task agents.'
    - 'Domain assumptions differ: applied mathematics with theorem and proof checking,
      machine learning with code experiments, and broad simulated science tasks create
      different success conditions and failure modes.'
    open_questions:
    - How well do LLM-judge, task-completion, and ablation-recall metrics predict
      real scientific merit or downstream research utility?
    - Can autonomous systems produce stable peer-review-level scientific contributions
      outside selected machine learning or applied mathematics case studies?
    - Does failure-aware memory transfer across scientific domains without overfitting
      to narrow PDE or ScienceAgentBench tasks?
    - Which planning structure—chain-of-thought prompting, agent roles, tree search,
      or memory retrieval—best supports complex experiment design under limited samples?
    - What external validation is needed for code harnesses, interactive platforms,
      and automated reviewers to support reproducibility beyond internal case studies?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现智能体
      解决的问题: 自动完成从假设或想法生成、代码或推导执行、分析到论文撰写的完整研究循环
      尚未覆盖: 跨领域可靠性未证明；同行评审成功罕见或不稳定，很多结果依赖LLM评审或内部案例评估
    - 路线: 科学发现评测任务套件与评分协议
      解决的问题: 通过受控任务、成功指标、难度层级以及消融或召回评分，使自动发现与实验规划可比较
      尚未覆盖: 科学任务覆盖有限，任务完成或LLM评委指标尚未与真实科研效用和外部效度绑定
    - 路线: 失败感知记忆与实验迭代
      解决的问题: 把失败尝试记录为有类型的负知识，使下游智能体避免重复错误、减少token并改善重试与新任务表现
      尚未覆盖: 仅在选定PDE和ScienceAgentBench案例中显示迁移；长期记忆扩展、筛选质量及与其他规划循环的交互尚不明确
    - 路线: 交互式研究团队与代码工具基础设施
      解决的问题: 把单点模型想法转成可运行多智能体系统，提供角色定制、监控、工件检查和本地代码或数据接入
      尚未覆盖: 跨硬件、数据集和用户设置的成熟度与外部验证不足；证据仅限少量内部AI案例
    - 路线: 自动评审与实验规划诊断
      解决的问题: 通过自动评审或召回指标审计生成论文或规划中的逻辑错误、遗漏证据和消融充分性
      尚未覆盖: 自动评审可靠性未标准化；消融召回仍低于人类，作者与审稿人任务基础不一致
    共识:
    - LLM智能体是自动化科学实验循环各部分（想法生成、执行、分析、报告）的共同基础。
    - 多项工作将接近人类水平或类似同行评审的评估作为关键目标，采用LLM评委、专家偏好或受控任务统计。
    - 现有证据显示自动化能完成选定任务或生成论文，但在更难的发现与实验规划问题上仍不完整或不稳定。
    - 部分系统提供代码和数据集等可复现信号，但并非一致展示，局限性字段常缺失。
    分歧:
    - 表示与控制方式不同：一些系统使用显式多智能体角色和共享记忆，另一些采用单端到端循环或树搜索；一项研究显示思维链提示在消融规划上优于智能体设置。
    - 评测目标不同：完整论文的同行评审或评委分数、模拟发现任务完成、消融召回、token效率和内部案例专家偏好不互通。
    - 部署与交互不同：完全自主的提示到论文流水线与人类在环仪表板、基于环境的任务智能体并存。
    - 领域假设不同：应用数学强调定理证明检查、机器学习强调代码实验、广泛模拟科学任务，导致不同的成功条件和失败模式。
    开放问题:
    - LLM评委、任务完成和消融召回等指标能在多大程度上预测真实科学价值或下游研究效用？
    - 自主系统能否在选定的机器学习或应用数学案例之外稳定产出同行评审级科学贡献？
    - 失败感知记忆能否跨科学领域迁移，而不只是窄化到特定PDE或ScienceAgentBench任务？
    - 思维链提示、智能体角色、树搜索和记忆检索哪种规划结构更适合少样本下的复杂实验设计？
    - 代码工具、交互平台和自动评审器需要哪些外部验证，以支持内部案例之外的复现？
