  related_work_outline:
  - 'Mainstream direction: End-to-end autonomous research and discovery agents that
    combine literature synthesis, hypothesis generation, verification, experiment
    execution, and manuscript drafting in multi-agent or self-evolving workflows.'
  - 'Shared research pattern: Systems rely on LLM agents with retrieval, self-critique/verification
    loops, and benchmark or rubric-based evaluation to measure evidence maturity rather
    than only task accuracy.'
  - 'Key differences: Some contributions build generative agent frameworks such as
    ReasFlow or EvoMaster, while others construct blind evidence benchmarks such as
    TruthInsightBench or BAISBench, or diagnose failure modes through case studies.'
  - 'Trend evolution: From 2025 surveys and domain benchmarks toward 2026 autonomous
    agent frameworks and evidence-grounded evaluation, the emphasis appears to be
    shifting to reliability, self-evolution, and verifiable claims within the current
    frontier.'
  - 'Open questions: Whether current systems transcend recombining existing literature,
    whether automated judges align with human scientific judgment, whether single-base-model
    results generalize, and whether verification loops reduce implementation drift
    and overclaiming.'
  related_work_outline_zh:
  - 主流方向：端到端自主研究与发现智能体，将文献综合、假设生成、验证、实验执行和论文撰写集成到多智能体或自演化工作流中。
  - 研究共性：系统使用具备检索、自我批判或验证循环的LLM智能体，并采用基准或评分准则衡量证据成熟度，而不仅是任务准确率。
  - 关键差异：部分工作构建生成式智能体框架（如ReasFlow、EvoMaster），部分构建盲测证据基准（如TruthInsightBench、BAISBench），或通过案例研究诊断失败模式。
  - 趋势演进：从2025年的综述与领域基准发展到2026年的自主智能体框架和证据化评测，重点转向可靠性、自演化和可验证主张，仍处当前前沿。
  - 开放问题：当前系统是否超越对已有文献的编码与重组；自动评审是否与人类科学判断一致；单一基座模型结果是否可泛化；验证循环能否防止实现漂移和过度声明。
  literature_review:
    line_of_work_matrix:
    - line: Multi-agent autonomous literature synthesis and paper generation, e.g.,
        ReasFlow
      what_it_solves: Decomposes literature retrieval, reasoning, verification, and
        manuscript drafting into mutually correcting agent roles to automate end-to-end
        research workflows.
      what_remains_open: Generated literature reviews and paper claims lack strong
        expert validation; limitation reporting is thin and evidence beyond LLM rubric
        scores is not established.
    - line: Evidence-grounded discovery agent evaluation, e.g., TruthInsightBench
        and BAISBench
      what_it_solves: Turns peer-reviewed studies or scientific datasets into blind
        tasks scored by automated judges, making evidence maturity comparable across
        agents.
      what_remains_open: Evaluations rely on a single frozen base model or curated
        domain data; agents lack controls, robustness, falsifiability, and cross-dataset
        generalization.
    - line: Domain-agnostic self-evolving agent frameworks, e.g., EvoMaster
      what_it_solves: Provides reusable infrastructure for iterative hypothesis refinement,
        self-critique, and knowledge accumulation across disciplines.
      what_remains_open: Benchmark gains are not separated from base-model or task-prior
        contributions, and no limitations are reported.
    - line: Diagnostic case studies and conceptual surveys
      what_it_solves: Organizes capabilities, failure modes, evaluation metrics, and
        challenges into design principles for autonomous scientific and literature-oriented
        agents.
      what_remains_open: Proposed categories and design principles lack direct empirical
        validation for predicting agent behavior across settings.
    consensus:
    - Current LLM-based scientific agents can execute literature-related workflows
      competently but do not yet achieve reliable autonomous discovery.
    - Verification or self-critique loops and benchmark-based evidence grading are
      widely treated as necessary components for trustworthy outputs.
    - 'Published evidence remains narrow: evaluations often depend on a frozen base
      model, curated rubrics, or a small set of domains and datasets.'
    - Automated systems currently appear more viable as human-in-the-loop assistants
      than as fully autonomous scientists.
    disagreements:
    - 'Representation and interaction differ: some work emphasizes end-to-end generation,
      some comparative evaluation, some reusable frameworks, and some diagnostic taxonomy.'
    - 'Evaluation targets differ: generated-paper rubric scores, blind-task evidence
      maturity, multiple-choice questions derived from published studies, and broad
      benchmark suites.'
    - 'Evidence claims differ: benchmark studies report state-of-the-art scores or
      large relative gains, while diagnostic case studies emphasize high failure rates
      and unreliable success declarations.'
    - 'Deployment setting differs: domain-agnostic frameworks, biological omics benchmarks,
      and applied mathematics reasoning systems target different assumptions and validation
      needs.'
    open_questions:
    - Do automated reviewers or rubric scores align with expert judgments of literature
      review quality and research gap discovery?
    - Can agents generalize beyond a frozen base model or curated benchmark domains
      to new literature and datasets?
    - What verification evidence is needed to show that self-evolution and knowledge
      accumulation reduce implementation drift, overexcitement, and weak scientific
      taste?
    - Does end-to-end paper generation measure scientific discovery, or only competent
      reconstruction of patterns already present in existing literature?
    - The packet offers little direct evidence on citation analysis, search quality,
      or gap discovery as separate literature intelligence capabilities, leaving these
      as verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多智能体自主文献综合与论文生成（如ReasFlow）
      解决的问题: 将文献检索、推理、验证和手稿生成分解为相互纠正的智能体角色，自动化端到端研究流程。
      尚未覆盖: 生成的文献综述和论文声明缺乏专家验证；局限性报告薄弱，除LLM评分准则外的证据尚未确立。
    - 路线: 证据锚定的发现智能体评测（如TruthInsightBench、BAISBench）
      解决的问题: 将同行评审研究或科学数据转化为盲测任务，由自动评审打分，使证据成熟度在智能体间可比较。
      尚未覆盖: 评估依赖单一冻结基座模型或精选领域数据；智能体缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 路线: 领域无关的自演化智能体框架（如EvoMaster）
      解决的问题: 提供可复用的迭代假设优化、自我批判与知识积累基础设施，支持跨学科智能体科学。
      尚未覆盖: 基准提升未与基座模型或任务先验的贡献分离，且未报告局限性。
    - 路线: 诊断案例研究与概念综述
      解决的问题: 将能力、失败模式、评估指标和挑战组织为面向自主科学与文献智能体的设计原则。
      尚未覆盖: 所提出的分类和设计原则是否预测智能体行为仍缺少直接实证验证。
    共识:
    - 当前基于LLM的科学智能体能够胜任部分文献相关工作流，但尚未实现可靠的自主发现。
    - 验证或自我批判循环以及基于基准的证据评分，被普遍视为获得可信输出所必需的组件。
    - 已发表证据仍然较窄：评估常依赖单一冻结基座模型、人工评分准则或少量领域与数据集。
    - 自动化系统目前更可能作为人在环助手，而非完全自主科学家。
    分歧:
    - 表示与交互方式不同：有的侧重端到端生成，有的侧重比较评测，有的侧重可复用框架，有的侧重诊断分类。
    - 评测目标不同：生成论文的评分准则、盲任务证据成熟度、基于已发表研究的选择题和广泛基准分数各有侧重。
    - 证据主张不同：基准研究报告最先进分数或大幅相对提升，诊断案例则强调高失败率与不可靠的成功声明。
    - 部署场景不同：领域无关的通用框架、生物组学基准和应用数学推理系统具有不同的假设与验证需求。
    开放问题:
    - 自动评审或评分准则是否与专家对文献综述质量和研究缺口发现质量的判断一致？
    - 智能体能否从冻结基座模型或精选基准域泛化到新文献和数据集？
    - 需要哪些验证证据来证明自演化和知识积累能减少实现漂移、过度兴奋和科学品味不足？
    - 端到端论文生成是否测量科学发现，还是仅能熟练重构已有文献中已经存在的模式？
    - 当前证据包在引文分析、检索质量和缺口发现等独立文献智能能力方面提供的信息很少，这些仍是验证缺口。
