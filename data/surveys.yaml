        judgments is unproven.
    - line: Scientific discovery evaluation benchmarks
      what_it_solves: Provides reusable tasks, blind data and objectives, and evidence-maturity
        rubrics to compare agents on complete discovery behavior instead of only reproducing
        hidden target studies or judging final text.
      what_remains_open: Reported agent performance is based on limited or frozen
        base-model settings; proxy metrics and LLM judges remain weakly linked to
        real scientific validity and genuine discovery.
    - line: Search-based iterative research optimization
      what_it_solves: Uses tree search, manager agents, and multimodal feedback to
