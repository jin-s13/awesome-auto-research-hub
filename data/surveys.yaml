  related_work_outline_zh:
  - 主流方向：构建端到端的自主研究流水线，整合假设生成、实验执行、验证与报告，并日益强调自我改进循环和人机协作。
  - 研究共性：以LLM为核心的推理，结合工具使用（代码执行、模拟、文献检索），通过迭代实验和显式验证门控来检测并恢复失败。
  - 关键差异：自主程度（完全自主vs.人在回路）、自我纠正范式（多假设归因、形式化验证、持续演化）以及通用性（领域无关框架vs.领域特定验证器）。
  - 趋势演进：2023至2026年，领域从定制化的概念验证智能体转向可复现、可基准测试的系统，并融入形式化方法、自我演化和结构化人类监督。
