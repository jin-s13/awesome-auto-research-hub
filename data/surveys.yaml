    sparse high-fidelity feedback, and held-out/sealed generalization protocols.'
  - 'Open questions: Whether long-horizon gains generalize beyond narrow engineering/science
    domains, whether generated evaluators can reach target disagreement ceilings without
    development overfitting, and whether distilled skills remain valid across unseen
    repositories and tasks.'
  related_work_outline_zh:
  - 主流方向：研究智能体工作正聚焦于闭环自主发现与智能体评估，强调长程状态管理、样本/查询高效反馈、可复用操作知识，以及留出或密封泛化测试。
  - 研究共性：智能体提出候选或评估器，在固定预算下获取反馈并修订选择；持久证据被外置到框架、经验库或技能中，而非只留在对话历史中。
