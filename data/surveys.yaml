    open_questions:
    - How far can automated review and validity gates be trusted when ablation evidence
      already shows missed silent failures?
    - Can evidence-maturity and task-completion benchmarks capture true discovery
      rather than competent analysis execution?
    - Will results generalize beyond the limited base models, narrow domains, and
      small submission counts reported in the current frontier?
    - What is the right human supervision boundary as systems move from controlled
      experiments toward open-ended, high-stakes discovery?
    - How should evaluation separate agent capability from base-model ability, search
      strategy, domain-specific tools, and rubric design, given missing external validation
