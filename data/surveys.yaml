  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous manuscript generation and scientific discovery pipelines
        (e.g., The AI Scientist, AI Scientist-v2)
      what_it_solves: Turns a research idea into code execution, experiments, figures,
        and a full draft, optionally with simulated review scoring.
      what_remains_open: Reliability across topics and venues is weak; only one of
        three AI Scientist-v2 submissions passed peer review, and full conference-level
        validation remains absent.
    - line: Verification and grounded failure-attribution mechanisms (e.g., AI CFD
        Scientist, SAGE, ReasFlow)
      what_it_solves: Detects invalid execution, hallucinated citations or numbers,
        and silent failures before a manuscript is accepted or written.
      what_remains_open: Detection is incomplete; AI CFD Scientist missed 2/16 planted
        failures, and constrained reporting still does not guarantee conference-ready
        scientific writing.
    - line: Human-AI collaboration and intervention design (e.g., AutoResearchClaw,
        ReasFlow)
      what_it_solves: Embeds human expertise at high-leverage points to keep research
        direction coherent while reducing exhaustive step-by-step oversight.
      what_remains_open: The best intervention granularity is not established across
        domains; evidence comes mainly from a 25-topic benchmark and applied mathematics
        generation.
    - line: Simulated review and evaluation rubrics for generated papers (e.g., AI
        Scientist reviewer, ReasFlow rubric)
      what_it_solves: Provides low-cost approximation of human review for generated
        manuscripts through LLM/VLM reviewers and rubric scores.
      what_remains_open: Proxy review scores are not fully validated against real
        peer-review decisions or broader scientific writing utility.
    - line: Domain-specific discovery writers with knowledge or physics gates (e.g.,
        AI CFD Scientist, ReasFlow)
      what_it_solves: Adds domain knowledge retrieval or physical-validity checks
        so generated claims are more defensible in specialized fields.
      what_remains_open: Generalization beyond computational fluid dynamics and applied
        mathematics is not shown, and verification gates inherit domain-specific blind
        spots.
    consensus:
    - Research writing is treated as a multi-agent workflow with separable stages
      such as hypothesis generation, execution, verification, reporting, and review.
    - Generation without validity checks is insufficient for defensible papers, so
      verification gates are considered necessary.
    - LLM/VLM reviewers can approximate human scoring, but real peer-review acceptance
      remains rare and task-specific.
    - Targeted human involvement improves outcomes over both full autonomy and exhaustive
      step-by-step oversight.
    disagreements:
    - 'Interaction mode differs: some systems pursue full autonomy with simulated
      review, while others design targeted human oversight or PI-agent collaboration.'
    - 'Evaluation target differs: workshop peer review, blind scores, domain-specific
      physical RMSE, or rubric scores over generated papers.'
    - 'Evidence control differs: some systems constrain outputs to measured values
      and use grounded reporting, while others rely on LLM reviewers without source-level
      or execution-level enforcement.'
    - 'Error-correction signal differs: physics-aware visual verification, logical
      coherence auditing, multi-hypothesis failure attribution, or human feedback
      loops are used to different degrees.'
    open_questions:
    - Can domain-aware verification gates transfer to fields without rendered physical
      outputs or formal theorem-style checks?
    - Do simulated LLM/VLM review scores align with real peer-review decisions and
      long-term scientific utility?
    - What is the minimal and most effective human intervention strategy across venue
      types and disciplines?
    - How should failure attribution handle silent errors that both vision-language
      and logical audits miss?
    - Can end-to-end systems remain stable beyond narrow topic sets or workshop-level
      venues?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主论文生成与科学发现流水线（如 The AI Scientist、AI Scientist-v2）
      解决的问题: 将研究想法转化为代码执行、实验、图表和完整草稿，并可给出模拟评审分数。
      尚未覆盖: 多主题与多会议稳定性不足；AI Scientist-v2 三篇提交仅一篇通过同行评审，完整会议级验证仍缺失。
    - 路线: 验证与有根据的失败归因机制（如 AI CFD Scientist、SAGE、ReasFlow）
      解决的问题: 在论文被接受或撰写前检测无效执行、幻觉引用/数字和静默失败。
      尚未覆盖: 检测仍不完整；AI CFD Scientist 漏掉 16 个植入失败中的 2 个，约束式报告仍无法保证可投会议论文。
    - 路线: 人机协作与干预设计（如 AutoResearchClaw、ReasFlow）
      解决的问题: 在高杠杆点引入人类专业判断，在减少逐步监督的同时保持研究方向一致。
      尚未覆盖: 不同领域的最佳干预粒度尚未建立；证据主要来自 25 主题基准和应用数学生成任务。
    - 路线: 生成论文的模拟评审与评估标准（如 AI Scientist reviewer、ReasFlow 的 LLM 评审标准）
      解决的问题: 通过 LLM/VLM 评审器和评分表为生成手稿提供低成本的人类评审近似。
      尚未覆盖: 代理评审分数与真实同行评审决定或更广泛的科学写作效用之间的一致性尚未充分验证。
    - 路线: 带知识或物理门控的领域专用发现写作系统（如 AI CFD Scientist、ReasFlow）
      解决的问题: 通过领域知识检索或物理有效性检查，使专业领域中的生成结论更可辩护。
      尚未覆盖: 尚未证明能泛化到计算流体动力学与应用数学以外的领域；验证门控继承领域盲点。
    共识:
    - 科学写作被作为多智能体工作流处理，假设生成、执行、验证、报告和评审被分为相对独立的阶段。
    - 仅生成而没有有效性检查不足以产生可辩护论文，因此验证门控被视为必要机制。
    - LLM/VLM 评审可近似人类打分，但真实同行评审接受仍不常见且高度依赖任务。
    - 目标化的人类参与优于完全自主和逐步式监督。
    分歧:
    - 交互模式不同：有的追求完全自主加模拟评审，有的设计目标化的人类监督或 PI-智能体协作。
    - 评测目标不同：包括 workshop 同行评审接受、盲评分、领域物理 RMSE 以及生成论文的评分表分数。
    - 证据控制不同：有的系统把输出约束为测量值并使用 grounded reporting，有的仍主要依赖 LLM 评审而未强制源级或执行级核实。
    - 纠错信号不同：物理感知视觉验证、逻辑一致性审计、多假设失败归因或人类反馈循环各有侧重。
    开放问题:
    - 领域感知验证门控能否迁移到没有可渲染物理输出或形式化定理式检查的领域？
    - 模拟 LLM/VLM 评审分数与真实同行评审决定及长期科学效用是否一致？
    - 在不同会议类型和学科中，最少且有效的人类干预策略是什么？
    - 当视觉-语言和逻辑审计都漏掉无声错误时，失败归因还能如何覆盖？
    - 端到端系统能否在窄主题集或 workshop 级场所以外保持稳定？
