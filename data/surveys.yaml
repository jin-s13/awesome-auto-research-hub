  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous manuscript generation
      what_it_solves: Turns a research prompt into code, experiments, visualizations,
        and a complete paper draft with limited human prompting.
      what_remains_open: 'Unstable acceptance: only one of three manuscripts passed
        in one workshop case, and rubric-level success is not conference-level evidence.'
    - line: Domain-specific verification-gated writing agents
      what_it_solves: Checks physical, mathematical, or logical validity before experimental
        results are accepted into a manuscript.
      what_remains_open: Verification gates are incomplete, as a vision-language gate
        missed two of sixteen planted silent failures in an ablation.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Places human oversight at high-leverage decision points instead
        of full autonomy or exhaustive step-by-step review.
      what_remains_open: Evidence is benchmark-specific; whether targeted intervention
        generalizes across research tasks and improves real manuscript quality is
        unresolved.
    - line: Self-correction through failure attribution
      what_it_solves: Diagnoses an experiment failure as a hypothesis, design, or
        implementation problem and routes the correction to the right layer.
      what_remains_open: Conference-ready scientific writing and strong scientific
        taste are still open whole-field problems, with observed gains concentrated
        in code development and execution.
    - line: Review and evaluation loops for generated research
      what_it_solves: Creates comparable quality signals through LLM rubrics, simulated
        reviewers, benchmark scores, or peer-review submissions.
      what_remains_open: Proxy metrics may not align with human decision utility,
        and cross-field peer-review validity remains under-evidenced.
    consensus:
    - A complete research-writing pipeline must couple experiment execution with verification
      before drafting, not only generate text.
    - Verification, failure attribution, or human oversight improves reliability over
      fully unmonitored generation.
    - LLM-based review and benchmark scores serve as comparable signals but are not
      yet sufficient evidence of scientific quality.
    - Autonomous systems still need human review or targeted intervention to catch
      errors that automated gates miss.
    disagreements:
    - 'Verification mechanism differs: domain-specific physics or mathematical auditing
      versus generic execution or reflection loops.'
    - 'Interaction mode differs: full autonomy, exhaustive human oversight, and targeted
      collaboration are proposed as competing control strategies.'
    - 'Evaluation target differs: workshop peer-review acceptance, LLM rubric score,
      benchmark success rate, or artifact quality.'
    - 'Failure-correction model differs: single-pass reflection versus multi-hypothesis
      causal attribution that routes fixes to hypothesis, design, or implementation.'
    open_questions:
    - Do LLM rubric and benchmark scores predict human peer-review acceptance beyond
      workshop or controlled settings?
    - What verification mechanisms can detect silent domain or theoretical errors
      when the current vision-language gate still misses planted failures?
    - Which human intervention points improve generated-manuscript reliability without
      incurring exhaustive oversight costs?
    - How do missing code, dataset, metric, baseline, and limitation details affect
      reproducibility of these writing pipelines?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主手稿生成
      解决的问题: 将研究提示转化为代码、实验、可视化和完整论文草稿，减少人工提示。
      尚未覆盖: 接受表现不稳定：某工作坊案例中三篇手稿仅一篇通过；评分级成功不等于会议级证据。
    - 路线: 领域专属验证门控写作智能体
      解决的问题: 在结果被写入手稿前检查物理、数学或逻辑有效性。
      尚未覆盖: 验证门控并不完备，视觉-语言门控在消融中遗漏了16个植入静默失败中的2个。
    - 路线: 人机协作与干预设计
      解决的问题: 将人工监督放在高杠杆决策点，而非完全自主或逐步审查。
      尚未覆盖: 证据以基准为中心；精准干预是否能跨研究任务泛化并提升真实手稿质量仍未知。
    - 路线: 通过失败归因的自我纠正
      解决的问题: 将实验失败诊断为假设、设计或实现问题，并路由到正确层级进行修正。
      尚未覆盖: 会议级科学写作和科学品味仍是整个领域难题，观测提升集中在代码开发与执行。
    - 路线: 生成研究的评审与评测回路
      解决的问题: 通过LLM评分、模拟评审、基准分数或同行评审投稿形成可比较的质量信号。
      尚未覆盖: 代理指标可能不匹配人类决策效用，跨领域同行评审效度证据不足。
    共识:
    - 完整的研究写作流程必须在起草前将实验执行与验证耦合，而不仅是生成文本。
    - 验证、失败归因或人工监督能提升完全无监控生成的可靠性。
    - 基于LLM的评审和基准分数提供可比较信号，但不足以证明科学质量。
    - 自主系统仍需要人工评审或定向干预来捕捉自动化门控遗漏的错误。
