  related_work_outline:
  - 'Mainstream direction: Autonomous and semi-autonomous LLM-agent pipelines that
    generate hypotheses, select experiments, execute code, verify results, and produce
    reports; recent work adds domain-specific physics or formal verification gates
    and varying human oversight.'
  - 'Shared research pattern: Discovery is decomposed into ideation, execution, verification,
    and reporting, with feedback loops and evaluation suites used to improve validity
    and reproducibility.'
  - 'Key differences: Domain-specific verification versus domain-agnostic self-evolution;
    targeted human collaboration versus fuller autonomy; specialized scientific data
    with human baselines versus internal case studies or broad test collections; empirical
    simulation checks versus machine-checked proofs.'
  - 'Trend evolution: The available evidence is concentrated in 2025 to 2026, so the
    trend is within the current frontier: moving from broad surveys and evaluation
    construction toward self-correcting, self-evolving, and domain-specialized AI
    scientist systems.'
  - 'Open questions: Evaluation validity beyond proxy metrics, domain transfer, optimal
    human intervention, silent failure and formalization gaps, and reliable autonomous
    scientific writing remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以LLM智能体为核心的自主或半自主研究流水线，用于提出假设、选择实验、执行代码、验证结果并生成报告；近期工作加入领域物理或形式验证门控，并采用不同程度的人工监督。
  - 研究共性：将科学发现分解为构思、执行、验证与报告，并通过反馈循环和评测集提升有效性与可复现性。
  - 关键差异：领域专用验证与领域无关自演化并存；精准人工合作与更完全自主不同；评测使用专门科学数据和人类基线、内部案例研究或宽泛测试集合；正确性依赖经验仿真检查或机器验证证明。
  - 趋势演进：证据主要集中在2025至2026年，属于当前前沿内部演进：从综述与评测构建走向自纠正、自演化和领域专精的AI科学家系统。
  - 开放问题：代理指标能否反映真实发现效用、领域迁移、最优人工干预、静默失败与形式化缺口、以及可靠的自主科研写作仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific autonomous discovery agents, for example AI CFD Scientist
        and CausalForge
      what_it_solves: Integrates literature-grounded ideation, execution, and domain
        validity checks into a single workflow for proposal-level discovery in specific
        disciplines.
      what_remains_open: Domain checks still miss some silent failures or leave formalization-to-claim
        gaps, and results may not transfer beyond the trained domain.
    - line: Multi-agent research orchestration with human-in-the-loop control, for
        example AutoResearchClaw and Claw AI Lab
      what_it_solves: Coordinates debate, execution, reporting, and human intervention
        to improve idea novelty and experimental completeness.
      what_remains_open: Optimal timing of human collaboration remains uncertain;
        evidence is limited to internal case studies or selected comparison settings.
    - line: Self-correcting and self-evolving research loops, for example SAGE and
        EvoMaster
      what_it_solves: Attributes failed experiments to hypothesis, design, or implementation
        levels, and accumulates knowledge across research cycles.
      what_remains_open: Missing limitation details and dependence on specific evaluation
        settings make it unclear whether gains generalize to novel scientific domains.
    - line: Evaluation and evidence design for AI scientists, for example BAISBench
      what_it_solves: Creates real-data tasks and human baselines to compare AI research
        capability and reveal gaps in autonomous discovery.
      what_remains_open: Current AI scientists still fall short of end-to-end discovery,
        and proxy tasks may not capture downstream scientific utility.
    - line: Taxonomy and surveys of agentic scientific discovery, for example Agentic
        AI for Scientific Discovery
      what_it_solves: Organizes systems by scientific domain and capability, and catalogs
        evaluation resources, implementation frameworks, and challenges.
      what_remains_open: Categories remain descriptive; direct empirical validation
        that these categories predict reliability or ethical boundaries is missing.
    consensus:
    - Research pipelines rely on LLM agents to decompose discovery into hypothesis
      generation, experiment execution, verification, and reporting.
    - Verification or grounding mechanisms are introduced because unverified outputs
      can be fabricated or physically invalid.
    - Evaluation suites and human baselines are used to demonstrate progress, though
      their domain coverage and realism vary.
    - Autonomy is partial rather than complete; final artifacts usually require human
      inspection, audit, or intervention.
    disagreements:
    - 'Correctness evidence ranges from empirical simulation or visual checks to machine-checked
      formal proofs, with different failure modes: silent empirical failures versus
      faithful formalization gaps.'
    - Domain-specific systems embed physical or mathematical constraints, while domain-agnostic
      frameworks emphasize reuse and self-evolution across disciplines.
    - 'Human involvement is modeled differently: targeted collaboration at high-leverage
      points, optional dashboard monitoring, or formal artifact audit.'
    - 'Evaluation targets differ: specialized scientific data with human baselines,
      internal case studies, or broad generic test collections.'
    open_questions:
    - Does improved evaluation score reflect better scientific hypotheses or only
      better execution and reporting?
    - How should validity checks combine empirical simulation, formal proof, and human
      auditing to reduce silent failures and formalization mismatch?
    - What is the correct division of labor between autonomous agents and human scientists
      across problem framing, execution, verification, and writing?
    - Do domain-specific gains transfer to new disciplines without rebuilding the
      verification and domain knowledge layers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域专用自主发现智能体，例如AI CFD Scientist和CausalForge
      解决的问题: 将基于文献的构思、执行和领域有效性检查整合到单一可检查工作流中，用于特定学科的提案级发现。
      尚未覆盖: 领域检查仍会遗漏部分静默失败或存在形式化到主张的缺口，结果可能无法迁移到训练领域之外。
    - 路线: 多智能体研究编排与人在回路控制，例如AutoResearchClaw和Claw AI Lab
      解决的问题: 协调辩论、执行、报告与人工干预，以提高想法新颖性和实验完整性。
      尚未覆盖: 人工协作的最优时机仍不明确；证据主要来自内部案例研究或有限比较设置。
    - 路线: 自纠正与自演化研究循环，例如SAGE和EvoMaster
      解决的问题: 把失败归因到假设、实验设计或实现层面，并在多个研究周期中积累知识。
      尚未覆盖: 缺少局限性细节且依赖特定评估设置，因此收益能否推广到新科学领域尚不清楚。
    - 路线: 面向AI科学家的评测与证据设计，例如BAISBench
      解决的问题: 用真实数据任务和人类基线比较AI研究能力，并揭示自主发现的差距。
      尚未覆盖: 当前AI科学家仍无法完成端到端发现，代理任务未必反映下游科学效用。
    - 路线: 面向智能体科学发现的分类与综述，例如Agentic AI for Scientific Discovery
      解决的问题: 按科学领域和能力组织现有系统，并梳理评测资源、实现框架与挑战。
      尚未覆盖: 分类仍偏描述性；这些分类能否预测可靠性和伦理边界尚缺少直接实证验证。
    共识:
