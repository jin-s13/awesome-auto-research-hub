      尚未覆盖: 跨不同科学领域、硬件和用户设置的标准化外部验证；当前平台多处于早期阶段，评估局限于内部案例研究。
    - 路线: 评测与证据设计
      解决的问题: 通过基准、任务、验证门控和基于事实的报告，使AI科学家性能可比，从而捕获幻觉和静默失败。
      尚未覆盖: 多样现实科学任务的覆盖，以及代理指标（如基准分数）与真实发现效用之间的对齐；人类基线的可泛化性尚不确定。
    - 路线: 动作条件控制与规划
      解决的问题: 使用结构化工作流（树）、进化搜索或多假设失败归因，将假设生成与干预、失败诊断和迭代决策相连接。
      尚未覆盖: 性能提升有多少来自控制/规划策略，而非底层LLM或任务特定先验；完全自主的科学写作和复杂实验设计仍是开放问题。
    - 路线: 表示/状态建模
      解决的问题: 将原始研究上下文、实验结果和失败轨迹转化为结构化表示（如研究树、轨迹特征），供下游推理模块使用。
      尚未覆盖: 学习到的表示是否能泛化到新科学领域或训练中未见的失败模式。
    - 路线: 概念分类与理论
      解决的问题: 按领域、能力和挑战对碎片化的智能体AI系统进行分类，识别关键评估指标和实施框架。
      尚未覆盖: 所提出的分类能否预测系统行为或指导设计选择，缺乏直接实证验证；伦理和可靠性问题仍未解决。
    共识:
    - 多智能体协作和验证机制对于提高生成假设和实验结果的可信度至关重要。
    - 迭代自我改进，无论是通过反思、失败归因还是进化机制，都是增强研究质量的共同策略。
    - 当前的AI科学家尚未达到完全自主；在高杠杆决策点进行人机协作，结果优于完全自主或详尽的逐步监督。
    - 基准测试对于衡量进展至关重要，但现有基准在任务多样性和与真实世界科学影响的对齐上存在局限。
    分歧:
    - 自主程度：部分系统追求最少人工干预的完全自主，另一些则主张在特定干预点进行结构化人机协作。
    - 验证方法：从针对领域特定仿真的物理感知视觉-语言门控，到基于基准的评估，再到将输出约束为测量值的基于事实的报告，方法各异。
    - 搜索策略：系统采用进化搜索、带回溯的结构化树形分支或多假设失败归因，对如何探索假设空间有不同假设。
    - 领域范围：领域无关框架（如EvoMaster）声称广泛适用，而领域特定系统（如AI CFD Scientist、BAISBench）则针对某一个科学领域定制验证和执行。
    开放问题:
