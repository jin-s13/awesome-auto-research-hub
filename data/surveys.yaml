    - 路线: 交互式多智能体实验基础设施
      解决的问题: 提供可定制角色、实时监控、工件检查和回滚/恢复控制，将本地代码、数据与检查点连入研究循环。
      尚未覆盖: 证据处于早期阶段，仅限五个内部 AI 案例研究，跨硬件、数据和用户设置的外部验证尚未建立。
