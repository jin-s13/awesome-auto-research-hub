  related_work_outline_zh:
  - 主流方向：构建端到端的自主研究流水线，将基于大语言模型的构思、代码执行、实验管理和论文生成整合在一起，并越来越强调验证循环和领域专业化。
  - 研究共性：系统将科学发现过程分解为假设、实验、分析、写作等模块化阶段，通过多智能体或树搜索架构进行编排，以大语言模型为核心推理引擎。
