  related_work_outline_zh:
  - 主流方向：构建能自主生成、验证和评估科学主张的研究智能体与基准环境，重心从生成能力转向可靠性与治理。
  - 研究共性：智能体提出假设、执行分析、记录结果，并通过自动评审、领域任务指标或验证门控进行判断；但尚未展示完全可信的发现。
  - 关键差异：评测目标覆盖端到端论文接收、盲测证据成熟度、虚拟任务完成、领域建模和受治理的架构演化；验证方式包括物理感知视觉检查、确定性程序权威和 LLM 评审。
  - 趋势演进：从 2024 年通用端到端自动论文生成，走向 2025-2026 年领域专用基准与认知-权威分离治理；时间窗较窄，集中于当前前沿。
  - 开放问题：基准与自动评审能否跨基座模型、领域和同行评审设置迁移；如何发现静默有效性失败；代理指标是否反映真实发现效用。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research workflows
      what_it_solves: Automates idea generation, code execution, experiment management,
        and manuscript writing so discovery claims can be produced and inspected in
        a reproducible loop.
      what_remains_open: Verification gates miss some planted silent failures and
        peer-review success is inconsistent, so trustworthiness is not guaranteed.
    - line: Domain-grounded discovery benchmarks
      what_it_solves: Provides task suites, metrics, and human baselines for comparing
        discovery agents on real or simulated scientific problems.
      what_remains_open: Strong baselines struggle, but whether task completion and
        proxy metrics align with genuine scientific discovery is not established.
    - line: Evidence-maturity evaluation and automated review
      what_it_solves: Judges whether agent-generated claims are supported by controls,
        robustness, falsifiability, and auditability without requiring human grading
        per instance.
      what_remains_open: Judgments depend on a single frozen base model, and evaluated
        agents lack key discriminating acts, so cross-model and cross-domain generalizability
        is unknown.
    - line: Verification and governance mechanisms
      what_it_solves: Separates generative cognition from deterministic code edits,
        evaluations, or physics-aware visual checks to reduce silent invalid results.
      what_remains_open: Physics-aware checks still miss failures, and deterministic
        authority is shown only in narrow forecasting cases; broader governance remains
        unproven.
    consensus:
    - 'Automated research agents can execute and document analyses, but they currently
      plateau on open-ended discovery and lack the discriminating acts needed for
      trustworthy claims: controls, robustness checks, falsifiability, and cross-dataset
      generalization.'
    - Evaluation should be task-based, blind where possible, evidence-grounded, and
      automatically repeatable; human baselines or acceptance thresholds are used
      to anchor performance.
    - Execution success alone is insufficient for claim validity, so verification
      or review gates are necessary.
    - Current evidence shows generalization gaps across base models, scientific domains,
      and from benchmark or workshop settings to full conference or real-world discovery.
    disagreements:
    - Some work targets end-to-end paper production evaluated by simulated or real
      peer review, while other work targets domain tasks with fixed metrics or human
      baseline comparison.
    - 'Evaluation signals differ: physics-aware visual checks and deterministic program
      authorities impose hard validity constraints, while LLM judges or automated
      reviewers provide learned scoring over claim evidence.'
    - 'Benchmark design differs in what is hidden: blind tasks withhold source conclusions
      and expected values, whereas virtual or domain tasks expose objectives and evaluate
      completion and explanatory knowledge.'
    - 'Deployment setting differs: general machine learning discovery, computational
      fluid dynamics, time-series architecture evolution, and omics data-driven discovery
      each stress different reliability failure modes.'
    open_questions:
    - Can automated judges or verification gates reliably detect major validity failures,
      including missing controls or insufficient robustness, outside the specific
      domains tested?
    - How should evidence maturity metrics for scientific discovery be validated against
      human panel decisions, real reproducibility, or downstream research utility?
    - Do current benchmark gains transfer across base models, scientific domains,
      and from workshop or benchmark settings to full conference or production research
      workflows?
    - What governance mechanisms are needed to maintain separation between generative
      agents and deterministic evaluation authority as systems become more open-ended?
    - Several systems in the evidence packet lack reported code, dataset, baseline,
      or limitation details; these are verification gaps, so their full reproducibility
      and failure boundaries remain unconfirmed.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究工作流
      解决的问题: 自动完成想法生成、代码执行、实验管理和论文写作，形成可检查的发现循环。
      尚未覆盖: 验证门控会漏掉部分静默失败，同行评审成功率不稳定，可信度未得到保证。
    - 路线: 领域基础的发现基准
      解决的问题: 通过任务套件、指标和人类基线，让发现智能体在真实或模拟科学问题上可比较。
      尚未覆盖: 强基线普遍挣扎，但任务完成和代理指标是否等价于真实科学发现尚未建立。
    - 路线: 证据成熟度评估与自动评审
      解决的问题: 无需逐例人工评分即可判断智能体主张是否有对照、稳健性、可证伪性和可审计性支撑。
      尚未覆盖: 评判仅基于单一冻结基座模型，受评智能体普遍缺少对照与稳健性，跨模型与跨领域泛化未知。
    - 路线: 验证与治理机制
      解决的问题: 将生成式认知与确定性代码编辑、评估或物理感知检查分离，以减少静默无效结果。
      尚未覆盖: 物理感知门控仍会漏检失败，确定性权威只在狭窄预测任务中展示，跨场景治理未证明。
    共识:
    - 自主研究智能体能够执行和记录分析，但在开放式发现上表现停滞，普遍缺少建立可信主张所需的对照、稳健性、可证伪性和跨数据集泛化。
    - 评估应以任务为基础，尽可能盲测、证据锚定和自动可重复；人类基线或接收阈值被用于锚定性能。
    - 仅执行成功不足以保证主张有效，需要验证或评审门控。
    - 现有证据显示在基座模型、科学领域以及从基准或工作坊到真实发现之间存在泛化缺口。
    分歧:
    - 部分工作面向端到端论文产出并由模拟或真实同行评审评价，另一些面向领域任务并通过固定指标或人类基线比较。
    - 评估信号不同：物理感知视觉检查与确定性程序权威施加硬约束，LLM 评审或自动裁判则对主张证据进行学习式评分。
    - 基准设计对隐藏信息不同：盲测任务隐藏源结论和预期值，虚拟或领域任务暴露目标并评测完成度与解释性知识。
    - 部署设置不同：通用机器学习发现、计算流体动力学、时间序列架构演化和组学驱动发现各自强调不同的可靠性失败模式。
