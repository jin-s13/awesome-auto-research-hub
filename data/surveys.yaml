  related_work_outline_zh:
  - 主流方向：构建自主科研智能体和评测基础设施，把科学发现当作证据问题而非仅任务精度问题。
  - 研究共性：智能体循环地提出假设、运行或修改代码、分析结果并生成报告，评测聚焦执行质量与论断有效性。
  - 关键差异：系统类工作侧重发现吞吐或领域改进，基准类工作侧重证据成熟度、对照、稳健性和泛化；验证机制从LLM裁判到确定性权威和物理感知门控不等。
  - 趋势演进：从2024年的通用自动发现和虚拟任务，走向2025-2026年的盲测证据评估、领域可靠性以及工作坊或同行评审级声明。
  - 开放问题：自动裁判是否与同行评审和真实科学效用一致，验证门控能否跨领域推广，以及当前智能体为何在可信发现上出现平台期。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research discovery systems
      what_it_solves: turning research ideation into executable experiments, code,
        analysis, visualization, and manuscript writing in a single agentic loop
      what_remains_open: consistent peer-review-level quality, trustworthiness without
        external validity gates, and separation of authentic discovery from competent
        execution
    - line: Simulated and domain-specific benchmark environments for discovery agents
      what_it_solves: standardizing complete discovery cycles through tasks, datasets,
        baselines, and automatic completion or action metrics
      what_remains_open: alignment between task-completion metrics and real scientific
        utility, plus coverage beyond the chosen scientific domains
    - line: Evidence-grounded evaluation and automated judging
      what_it_solves: scoring claims by evidentiary maturity such as controls, robustness,
        falsifiability, auditability, and cross-dataset generalization rather than
        output plausibility
      what_remains_open: judge reliability across base models, statistical separation
        between similarly scored agents, and validity of proxy evidence scores as
        discovery measures
    - line: Reliable domain-specific research agents with verification and authority
        separation
      what_it_solves: constraining autonomous code modification and promotion decisions
        with deterministic authorities, physics-aware checks, or executed diagnostic
        ablations to reduce silent failures
      what_remains_open: verification gates can still miss planted failures, and demonstrated
        scope remains limited to specific domains and case studies
    consensus:
    - Autonomous agents can execute and document analyses competently, but current
      evidence does not show consistent trustworthy discovery.
    - Evaluation is shifting from downstream task accuracy toward full discovery cycles
      and the evidence quality of claims.
    - External verification or authority mechanisms are treated as necessary for defensible
      research claims.
    - Current agents tend to plateau when assessed on controls, robustness, falsifiability,
      and cross-dataset generalization.
    - Open-source artifacts and deterministic evaluation pipelines improve reproducibility
      but do not by themselves guarantee scientific validity.
    disagreements:
    - 'Success criteria differ: one line emphasizes performance improvement or peer-review
      acceptance, another emphasizes task completion, and another emphasizes evidence
      maturity dimensions.'
    - 'Deployment and interaction differ: fully autonomous generation and writing
      versus human baseline calibration versus deterministic authority separation.'
    - 'Verification mechanism differs: simulated reviewer scores, fixed LLM evidence
      judges, vision-language physics gates, or deterministic program authorities.'
    - 'Domain scope differs: general machine-learning discovery versus domain-specific
      CFD, omics, or time-series forecasting settings.'
    - 'Discovery definition differs: generating novel improvements versus inferring
      what frozen data support versus completing predefined discovery tasks.'
    open_questions:
    - How well do automated judges and benchmark metrics align with peer review and
      real-world decision utility?
    - Can validity gates and evidence scoring be generalized across scientific domains
      and silent failure modes?
    - Are reported improvements driven by scientific reasoning or by task-specific
      scaffolding and domain priors?
    - Why do current coding agents plateau on controls, robustness, falsifiability,
      and cross-dataset generalization?
    - How much human oversight or deterministic authority is required to make autonomous
      research claims trustworthy?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研发现系统
      解决的问题: 将研究构思转化为可执行实验、代码、分析、可视化和论文写作的单一智能体闭环
      尚未覆盖: 同行评审级质量的一致性、无外部验证门控时的可信度，以及真实发现与熟练执行之间的区分
    - 路线: 面向发现智能体的仿真和领域特定基准环境
      解决的问题: 通过任务、数据集、基线和自动完成或动作指标，标准化完整发现循环的评测
      尚未覆盖: 任务完成指标与真实科学效用之间的对齐，以及所选领域之外的覆盖度
    - 路线: 基于证据的评估与自动裁判
      解决的问题: 从对照、稳健性、可证伪性、可审计性和跨数据集泛化等证据成熟度维度评分，而不是只看输出合理性
      尚未覆盖: 裁判跨基座模型的可靠性、相近分数智能体的统计区分，以及代理证据分数作为发现度量的有效性
    - 路线: 带验证和认知-权威分离的可靠领域科研智能体
      解决的问题: 用确定性权威、物理感知检查或已执行诊断消融来约束自主代码修改和晋升决策，以减少静默失败
      尚未覆盖: 验证门控仍可能漏掉植入失败，且所展示范围局限于特定领域和案例研究
    共识:
    - 自主智能体能胜任分析和文档记录，但现有证据尚未显示一致的、可信的科学发现能力。
    - 评测正从下游任务精度转向完整发现循环和论断的证据质量。
    - 外部验证或权威机制被视为获得可辩护研究论断的必要条件。
    - 在对照、稳健性、可证伪性和跨数据集泛化等维度上，当前智能体普遍出现平台期。
