  related_work_outline_zh:
  - 主流方向：构建自主AI研究智能体与证据锚定基准，使科研主张在可比性、可复现性与可靠性上得到验证；代表工作如The AI Scientist、DISCOVERYWORLD和TruthInsightBench。
  - 研究共性：LLM智能体提出假设、执行实验、记录结果，并由任务完成度、证据成熟度或类同行评审方式进行评分。
