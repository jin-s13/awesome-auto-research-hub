  related_work_outline:
  - 'Mainstream direction: LLM-based multi-agent systems that automate parts of the
    scientific research workflow, especially literature synthesis, hypothesis-to-paper
    generation, and evidence evaluation under automated rubrics.'
  - 'Shared research pattern: benchmarking and scoring claims through curated tasks,
    blind peer-derived data, human baselines, or LLM judges rather than only relying
    on citation counts or visible popularity signals.'
  - 'Key differences: some work targets end-to-end manuscript generation, while others
    target task-level evidentiary maturity, domain-specific biological annotation,
    survey categorization, or self-evolving agent infrastructure.'
  - 'Trend evolution: available top papers cluster in 2025-2026 and move from domain-specific
    evaluation toward evidence-grounded blind tasks and domain-agnostic self-evolving
    frameworks.'
  - 'Open questions: whether automated judges align with human scientific review,
    whether single-base-model benchmark results generalize, and how missing code,
    dataset, baseline, or limitation evidence affects reproducibility claims.'
  related_work_outline_zh:
  - 主流方向：基于LLM的多智能体系统正在自动化科学研究流程中的若干环节，尤其是文献综合、假设到论文生成，以及在自动评审标准下的证据评估。
  - 研究共性：通过构造任务、盲评同行来源数据、人类基线或LLM评委来评分和比较声明，而不是只依赖引用计数或可见热度信号。
  - 关键差异：不同工作分别聚焦端到端论文生成、任务级证据成熟度、领域专用生物学注释、综述分类或可自演化的智能体基础设施。
  - 趋势演进：证据包中的高排名论文集中在2025-2026年，显示出从领域专用基准走向证据锚定的盲评任务和领域无关的自演化框架。
  - 开放问题：LLM评委是否与人类科学评审一致；单一基座模型的基准结果能否泛化；缺失的代码、数据集和局限性说明会留下哪些可复现性缺口。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous literature-to-manuscript synthesis systems
      what_it_solves: Turn retrieved scientific knowledge into complete research papers
        by combining literature synthesis, formal derivation, experiments, and manuscript
        drafting with internal verification and knowledge retrieval.
      what_remains_open: LLM-rubric paper scores may not establish logical correctness
        or human scientific value; visible limitation sections are missing for some
        method papers.
    - line: Evidence-grounded blind evaluation benchmarks
      what_it_solves: Compare open-ended discovery agents on blinded tasks where source
        conclusions are withheld, using fixed LLM judges and evidence-maturity scoring
        rather than reproduction of hidden target studies.
      what_remains_open: Reported results rest on one frozen base model; automated
        judge alignment with human scientific review is not established, and agents
        still lack controls, robustness, and falsifiability.
    - line: Domain-specific scientific agent evaluation
      what_it_solves: Benchmark AI scientists on real single-cell transcriptomic data
        through cell type annotation and multiple-choice questions derived from published
        studies, with a graduate-level human baseline.
      what_remains_open: Annotation and multiple-choice tasks may not cover open-ended
        literature search, review synthesis, or research gap discovery.
    - line: Survey and failure-mode analysis
      what_it_solves: Organize agentic scientific discovery capabilities, evaluation
        metrics, frameworks, datasets, and recurring failure modes into categories
        and design principles.
      what_remains_open: The proposed categories are not directly validated as predictors
        of downstream discovery behavior or model performance.
    - line: Self-evolving domain-agnostic agent infrastructure
      what_it_solves: Provide reusable agent scaffolding that refines hypotheses,
        self-critiques, and accumulates knowledge across experimental cycles and general
        scientific benchmarks.
      what_remains_open: Benchmark improvements may depend on the underlying base
        model, task priors, or selected benchmarks; visible fields lack limitation
        evidence.
    consensus:
    - LLM agents are applied to science as an end-to-end workflow, with literature
      synthesis or evidence gathering as a necessary but not yet reliable standalone
      capability.
    - Evaluation is shifting toward comparison against hidden source conclusions,
      LLM judges, and human baselines instead of only showing generated examples.
    - Current systems can execute and document analyses, but still lack the scientific
      judgment needed for controls, robustness, falsifiability, and cross-dataset
      generalization.
    - High-ranking evidence in this packet is concentrated at the 2025-2026 frontier,
      while citation and graph prestige signals are unavailable.
    disagreements:
    - 'Output target differs: full generated papers under an LLM rubric versus task-level
      evidentiary maturity on blinded data versus domain-specific annotation and multiple-choice
      questions versus general benchmark scores.'
    - 'Interaction mode differs: human-as-principal-investigator collaboration, fully
      autonomous coding agents, self-evolving frameworks, and diagnostic multi-agent
      pipelines.'
    - 'Evaluation evidence differs: rubric-based generated-paper scores, 29-item evidence-maturity
      rubrics, human bioinformatician baselines, survey synthesis, and failure-case
      analysis.'
    - 'Domain scope differs: applied mathematics, general blinded scientific tasks,
      single-cell biology, and domain-agnostic machine learning or science suites.'
    open_questions:
    - Do LLM judges and rubric scores align with human scientific review for literature
      synthesis and gap discovery?
    - Can these systems generalize beyond one frozen base model and the curated benchmark
      or biological datasets shown in this packet?
    - Does automating literature search and synthesis improve claim validity and evidence
      auditability, or only increase plausible paper completion?
    - Where are code, datasets, baselines, prompts, and limitation statements for
      method papers, and what verification gap does their absence create?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主文献到论文综合系统
      解决的问题: 将检索到的科学知识转化为包含文献综合、推导、实验和手稿撰写的完整研究论文，并加入内部验证与知识检索。
      尚未覆盖: 基于LLM的论文评分未必能确立逻辑正确性或人类评审价值；证据包中部分方法未提供局限性说明。
    - 路线: 证据锚定的盲评基准
      解决的问题: 通过隐藏原始结论的盲任务、固定LLM评委和证据成熟度评分，比较开放式发现智能体，而非仅复现已知结果。
      尚未覆盖: 评测仅基于一个冻结基座模型；自动评委与人类科学判断的一致性未验证；智能体仍缺乏对照、稳健性与可证伪性。
    - 路线: 领域专用科学智能体评测
      解决的问题: 在真实单细胞转录组数据上以细胞注释和已发表研究派生选择题评估AI科学家，并提供研究生水平人类基线。
      尚未覆盖: 选择题与注释任务未必覆盖开放式文献检索、综述综合或研究缺口发现。
    - 路线: 综述与失败模式分析
      解决的问题: 将智能体科学系统的能力、评估指标、框架和数据集组织为分类，并记录重复出现的失败模式与设计原则。
      尚未覆盖: 这些分类尚未直接验证能否预测下游发现任务中的系统行为或模型性能。
    - 路线: 可自演化的领域无关智能体基础设施
      解决的问题: 提供可复用框架，使智能体跨周期优化假设、自我批判并积累知识，并在多个通用科学基准上扩展。
      尚未覆盖: 基准提升可能来自基座模型、任务先验或所选基准；可见字段中缺少局限性证据。
    共识:
    - LLM智能体被应用于端到端科学工作流，文献综合或证据收集是必要环节，但尚不是可信赖的独立能力。
    - 评估正转向隐藏源结论、LLM评委和人类基线等比较方式，而不再仅展示生成示例。
    - 当前系统能够执行并记录分析，但仍缺乏建立可信声明所需的对照、稳健性、可证伪性和跨数据集泛化能力。
    - 证据包中的高排名论文集中在2025-2026年前沿，引用和图谱声望信号不可用。
    分歧:
    - 输出目标不同：LLM评审标准下的完整生成论文、盲数据上的证据成熟度、领域专用细胞注释与选择题、通用基准性能。
    - 交互模式不同：人类作为首席研究员的多智能体协作、全自主编码智能体、自演化框架、诊断性多智能体流水线。
    - 评估证据不同：论文评分、29项证据成熟度、人类生物信息学家基线、综述综合和失败案例分析。
    - 领域范围不同：应用数学、通用科学盲任务、单细胞生物学、领域无关机器学习或科学套件。
    开放问题:
    - LLM评委和论文评分能否与文献综合和缺口发现任务中的人类科学评审对齐？
    - 这些系统能否泛化到证据包所示单一冻结基座模型和特定基准或生物数据集之外？
    - 自动化文献搜索与综合究竟改善的是声明有效性、证据可审计性，还是只改善了论文完成度？
    - 方法论文的代码、数据集、基线、提示词和局限性声明在何处；它们的缺失会造成怎样的验证缺口？
