      尚未覆盖: 跨尝试一致性、超越工作坊层级的会议质量，以及自动评审器作为主要评价信号的效度。
    - 路线: 带领域验证的发现智能体（如 AI CFD Scientist）
      解决的问题: 将物理或领域约束接入自主实验，用视觉物理论证减少静默无效结果。
      尚未覆盖: 验证门控仍会漏检部分失败；迁移到新领域可能需要大量领域工程。
    - 路线: 科学发现评测环境与基准（如 DISCOVERYWORLD、BAISBench）
      解决的问题: 提供受控任务、指标和人类基线，测量完整发现循环和领域生物学发现。
      尚未覆盖: 受控任务或选择题得分是否与真实科学贡献和下游决策效用一致仍缺证据。
    - 路线: 失败诊断与自纠正研究系统（如 SAGE）
      解决的问题: 对长程实验失败进行多假设归因，并路由到假设、实验设计或实现层面的干预。
      尚未覆盖: 因果归因难以直接验证；记忆退化、实现漂移和科学品味薄弱问题未完全解决。
    - 路线: 人机交互式多智能体研究平台（如 Claw AI Lab）
      解决的问题: 支持角色定制、实时监控、工件检查、回滚恢复及本地代码数据集成。
