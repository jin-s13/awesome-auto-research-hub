      尚未覆盖: 验证门控仍可能遗漏错误（如CFD消融中遗漏2/16植入失败），且领域特定设计阻碍跨领域复用。
    - 路线: 评估基准与环境
      解决的问题: 提供标准化任务和指标以比较AI科学家能力，覆盖多样主题和难度。
      尚未覆盖: 这些基准是否反映真实科学发现的开放式创造性，以及自动指标与人类专家判断之间的差距。
    - 路线: 人机协作研究框架
      解决的问题: 在高杠杆决策点引入人类干预，以提升结果质量和可靠性，超越完全自主模式。
      尚未覆盖: 最优协作模式尚不明确，人类介入的可扩展性和成本尚未得到解决。
    共识:
    - 所有系统均依赖大型语言模型作为核心推理引擎，并在多智能体架构中编排。
    - 将发现过程分解为专门子智能体（构思、编码、评审）比单体方法更能提升性能。
    - 基准测试对于衡量进展至关重要，且当前系统在完全自主模式下仍达不到人类专家水平的可靠性。
