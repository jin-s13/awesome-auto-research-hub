  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery workflows
      what_it_solves: Automates the full experimentation lifecycle from idea generation,
        code/experiment execution, and analysis to manuscript drafting; later versions
        reduce reliance on human-coded templates and per-paper cost.
      what_remains_open: Output reliability is uneven, with only one of three submitted
        manuscripts passing peer review, and evidence is concentrated in machine learning
        or workshop settings rather than lab-based or broader scientific domains.
    - line: Benchmark and evaluation design for experiment planning
      what_it_solves: Provides controllable virtual environments and task suites with
        automatic metrics for hypothesis formation, experiment actions, discovery
        knowledge, and ablation planning.
      what_remains_open: Best LM ablation recall remains around 45%, below human-level;
        proxy metrics have not been shown to align with real scientific utility, reproducibility,
        or lab-based discovery outcomes.
    - line: Failure-aware memory and verification mechanisms
      what_it_solves: Records failed attempts as bounded typed memory or audits logical
        coherence before human inspection, allowing downstream agents to adopt or
        reject prior negative results and correct errors.
      what_remains_open: Transfer evidence is limited to retry and specific PDE tasks;
        it is unclear whether stored negative knowledge remains valid under distribution
        shift or across unrelated domains.
    - line: Interactive multi-agent research platforms
      what_it_solves: Enables customizable research teams from prompts, real-time
        monitoring, rollback/resume, and connection of local codebases and datasets
        to runnable experiments.
      what_remains_open: Validated on five internal AI case studies and described
        as an early step; external, cross-institutional, or non-AI validation is missing.
    - line: Knowledge-based reasoning-centric discovery systems
      what_it_solves: Combines knowledge retrieval, internal verification, and collaborative
        role design to assist theory-heavy scientific discovery and paper generation
        in applied mathematics.
      what_remains_open: Claims rely on curated LLM review of five generated papers;
        no open external benchmark or clear code/dataset artifact is visible in the
        evidence packet.
    consensus:
    - LLM-based agents can now execute multiple stages of an experiment loop, but
      evaluations still depend on automated reviewers, human judges, or curated benchmarks.
    - Explicit verification, knowledge retrieval, and negative memory can improve
      agent outputs and, in some cases, reduce token use.
    - Current systems remain weaker than human experts on principled experiment design
      and review tasks, especially novel discovery and ablation planning.
    - Benchmarks and virtual environments are becoming a shared substrate for studying
      discovery behavior, but available tasks concentrate on AI, mathematics, or simulated
      science and underrepresent lab-based experiments.
    - Several entries omit detailed limitations or code/dataset artifacts, so reproducibility
      signals are incomplete.
    disagreements:
    - 'Automation scope differs: some systems target complete research paper generation,
      while others focus on subtask planning such as ablation identification.'
    - 'Control structure differs: single-agent tree search, multi-agent role workflows,
      and human-as-PI collaboration imply different assumptions about oversight.'
    - 'Evaluation target differs: generated paper quality and acceptance, benchmark
      task completion, ablation recall, or expert preference in case studies.'
    - 'Improvement mechanism differs: failure-aware shared memory, internal verification
      loops, knowledge retrieval, and experiment-manager tree search are not mutually
      shared components.'
    - 'Task grounding differs: simulated text environments, internal AI case studies,
      and real code/lab experiments have different evidence strength and comparability.'
    open_questions:
    - What external validation would show that fully autonomous systems can reliably
      pass peer review beyond workshop-level and single-domain tasks?
    - Do automatic metrics such as task completion, reviewer scores, and ablation
      recall predict real scientific validity, reproducibility, or lab-based discovery
      outcomes?
    - How do negative knowledge and verification mechanisms behave outside their demonstrated
      PDE or mathematics domains and under distribution shift?
    - Which gains come from orchestration and memory mechanisms rather than the underlying
      frontier language model or human scaffolding?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现工作流
      解决的问题: 自动化从研究想法、代码/实验执行、分析到论文撰写的完整实验生命周期，降低每篇论文成本并减少人工模板依赖。
      尚未覆盖: 输出可靠性不稳定，提交的三篇中仅一篇通过同行评审；证据集中在机器学习或工作坊场景，缺乏实验室环境下的一致性验证。
    - 路线: 实验规划基准与评测设计
      解决的问题: 通过可控虚拟环境和任务套件，提供假设形成、实验动作、发现知识和消融规划的自动指标。
      尚未覆盖: 最佳语言模型对消融项的召回率仍只有约45%，低于人类；代理指标与真实科学效用、可复现性之间的关系尚未验证。
    - 路线: 失败感知记忆与验证机制
      解决的问题: 将失败尝试记录为有界类型记忆，或在人工检查前审计逻辑一致性，使下游代理能采纳或拒绝负面结果并纠正错误。
      尚未覆盖: 迁移证据仅限于重试和特定PDE任务；尚不清楚负面知识在分布偏移或跨领域下是否仍有效。
    - 路线: 交互式多智能体研究平台
      解决的问题: 支持从提示创建可定制研究团队、实时监控、回滚/恢复，以及连接本地代码库和数据集执行实验。
      尚未覆盖: 仅在五个内部AI案例上验证，平台被描述为早期步骤；缺乏外部、跨机构或非AI任务的标准化验证。
    - 路线: 知识驱动的推理中心发现系统
      解决的问题: 融合知识检索、内部验证和协作角色设计，辅助应用数学中理论性强的科学发现与论文生成。
      尚未覆盖: 结论依赖五篇生成论文的LLM评审标准；证据包中未显示开放评测基准或明确的代码/数据集工件。
    共识:
    - 基于LLM的智能体已经能执行实验循环的多个阶段，但评测仍依赖自动评审、人类评委或精选基准。
    - 显式验证、知识检索和负面记忆可以改善智能体输出，并且负面记忆在部分任务上还能减少token使用。
    - 当前系统在需要原则性实验设计与评审的任务上仍弱于人类，例如新颖科学发现和消融规划。
    - 基准和虚拟环境正在成为比较发现智能体的公共基础，但任务集中在AI、数学或仿真科学，对实验室实验覆盖不足。
    - 若干论文未提供详细局限性或代码/数据工件，因此可复现性证据不完整。
    分歧:
    - 自动化范围不同：有些系统生成完整论文，有些只解决消融规划等实验子任务。
    - 控制结构不同：单智能体树搜索、多智能体角色协作、人作为PI的协作模式隐含不同的人工监督假设。
    - 评测目标不同：论文质量/接受度、基准任务完成度、消融召回率或专家偏好各不相同。
    - 改进机制不同：失败记忆、内部验证、知识检索和实验管理器树搜索并非所有系统共享。
    - 任务环境不同：模拟文本环境、内部AI案例和真实代码/实验设置之间的证据强度不可直接比较。
    开放问题:
    - 需要何种外部验证才能证明全自动系统能在工作坊和单领域之外稳定通过同行评审？
    - 任务完成率、评审评分、消融召回率等自动指标能否预测真实科学有效性、可复现性和实验室发现结果？
    - 负知识和验证机制在已验证的PDE/数学领域之外以及分布偏移下的表现如何？
    - 性能提升中有多少来自编排与记忆机制，多少来自底层前沿语言模型或人工脚手架？
