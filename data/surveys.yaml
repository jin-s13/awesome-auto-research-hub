  related_work_outline_zh:
  - 主流方向：构建端到端的自主研究智能体，将科学工作流（想法生成、实验设计、代码执行、分析、论文撰写）分解为多步 LLM 驱动流水线，并常以模拟同行评审作为质量过滤。
  - 研究共性：系统遵循假设提出、实验执行、论文生成的迭代循环，评估普遍依赖基于 LLM 的自动评审或精心设计的基准任务，而非外部人类验证。
  - 关键差异：人类参与程度从人在回路的 PI 角色到完全自主不等；评估范式分为自动评审分数、任务完成基准和内在验证循环；记忆机制从无失败感知到显式负知识库存在分化。
  - 趋势演进：从 2024 年单智能体、依赖模板的框架，到 2025–2026 年集成树搜索、多智能体协作、交互式仪表板和失败感知学习，表明向系统性质量控制和更广泛科学领域覆盖的转变。
  - 开放问题：生成产出是否代表真正的科学新颖性，如何将代理指标（自动评审分数）与现实世界科学影响对齐，以及缺乏跨硬件、数据集和实验室设置的标准化外部验证，均未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Automates the full research cycle from idea generation and experiment
        execution to paper writing, reducing human effort in repetitive scientific
        steps.
      what_remains_open: The systems produce manuscripts that pass automated review,
        but evidence of genuine scientific contribution beyond the training distribution
        is missing; gains largely depend on the quality of the underlying LLM rather
        than on novel reasoning architectures.
    - line: Experiment planning and ablation design
      what_it_solves: Evaluates the ability of LM agents to plan valid ablation studies
        and identify missing experiments, making the experimental design process auditable.
      what_remains_open: Current agents achieve only 45% recall on ablation identification,
        and the inverse performance between author and reviewer tasks suggests grounding
        problems that prevent consistent behavior across contexts.
    - line: Scientific discovery benchmarks and virtual environments
      what_it_solves: Provides reproducible, task-based evaluation of discovery agents
        across diverse scientific topics, measuring task completion and explanatory
        knowledge.
      what_remains_open: Strong baselines struggle on these tasks, but the environment
        is text-based and may not capture the physical constraints, safety risks,
        or equipment interactions of real laboratory experiments.
    - line: Failure-aware memory and iterative improvement
      what_it_solves: Records failed attempts as typed, retrievable records so that
        agents can avoid repeating mistakes and solve new tasks with fewer tokens.
      what_remains_open: The approach is validated on same-task retry and cross-task
        PDE problems; its effectiveness on broader experimental workflows and its
        sensitivity to curator quality remain unexamined.
    - line: Multi-agent collaborative research platforms
      what_it_solves: Enables customizable roles, real-time monitoring, and code harness
        integration, turning isolated LLM calls into an interactive, multi-agent research
        workflow.
      what_remains_open: Evaluations are limited to a handful of internal case studies;
        the platform's performance across diverse research domains, user populations,
        and long-term projects has not been demonstrated.
    consensus:
    - LLM-driven agents can decompose the scientific process into discrete steps—hypothesis
      generation, experiment execution, and manuscript writing—and iterate on them.
    - Automated evaluation, whether through LLM-based reviewers or curated benchmark
      tasks, is the dominant approach for measuring system performance.
    - Current systems show promising results in controlled settings but fall short
      of consistent, human-level scientific reasoning and experimentation.
    disagreements:
    - 'The necessity and role of human involvement: some frameworks treat the human
      as a principal investigator who guides the agent, while others aim for full
      autonomy with no human intervention.'
    - 'Evaluation targets: one line of work relies on automated reviewer scores to
      judge paper quality, another uses task-completion metrics in a virtual environment,
      and a third proposes intrinsic verification loops that audit logical coherence
      before external review.'
    - 'Memory and learning mechanisms: most systems operate without persistent memory
      of past failures, whereas one line explicitly introduces a negative-knowledge
      bank to improve efficiency and cross-task generalization.'
    open_questions:
    - Do the papers generated by these agents contain scientifically meaningful contributions,
      or are they mostly variations on patterns seen in the training data?
    - How well do automated reviewer scores correlate with human expert judgments
      and real-world scientific impact?
    - Can these frameworks be extended to physical laboratory experiments where sensing,
      actuation, and safety constraints are central?
    - What is the minimal set of evaluation criteria that would reveal whether an
      agent is truly advancing knowledge rather than exploiting benchmark artifacts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究智能体
      解决的问题: 自动化从想法生成、实验执行到论文撰写的完整研究循环，减少重复性科学步骤中的人力投入。
      尚未覆盖: 系统产出的论文虽能通过自动评审，但缺乏超出训练分布的真实科学贡献证据；性能提升很大程度上依赖底层 LLM 的质量，而非新颖的推理架构。
    - 路线: 实验规划与消融设计
      解决的问题: 评估 LM 智能体规划有效消融实验和发现缺失实验的能力，使实验设计过程可审计。
      尚未覆盖: 当前智能体在消融识别上的召回率仅为 45%，且作者任务与审稿人任务间的相反性能趋势表明存在基础问题，阻碍跨语境的一致行为。
    - 路线: 科学发现基准与虚拟环境
      解决的问题: 为发现智能体提供可复现的、基于任务的评估，涵盖多种科学主题，测量任务完成度和解释性知识。
      尚未覆盖: 强基线在这些任务上表现困难，但环境是纯文本的，可能无法捕捉真实实验室实验的物理约束、安全风险或设备交互。
    - 路线: 失败感知记忆与迭代改进
      解决的问题: 将失败尝试记录为类型化、可检索的记录，使智能体避免重复错误，并以更少 token 解决新任务。
      尚未覆盖: 该方法在相同任务重试和跨任务 PDE 问题上得到验证，其对更广泛实验工作流的有效性以及对策展智能体质量的敏感性仍有待检验。
    - 路线: 多智能体协作研究平台
      解决的问题: 支持可定制角色、实时监控和代码工具集成，将孤立的 LLM 调用转化为交互式、多智能体的研究工作流。
      尚未覆盖: 评估仅限于少数内部案例研究；平台在多样化研究领域、用户群体和长期项目中的表现尚未得到验证。
    共识:
    - LLM 驱动的智能体能够将科学过程分解为离散步骤——假设生成、实验执行和论文撰写，并迭代执行。
    - 基于 LLM 的自动评审或精心设计的基准任务是衡量系统性能的主导方法。
    - 当前系统在受控环境中表现出前景，但尚未达到一致的人类水平科学推理和实验能力。
    分歧:
    - 人类参与的必要性和角色：部分框架将人类视为指导智能体的首席研究员，而其他框架则追求完全自主、无需人类干预。
    - 评估目标：一类工作依赖自动评审分数来评判论文质量，另一类在虚拟环境中使用任务完成度指标，还有一类提出在外部评审前审计逻辑一致性的内在验证循环。
    - 记忆与学习机制：多数系统在无持久记忆的情况下运行，而一条路线明确引入负知识库以提高效率和跨任务泛化能力。
    开放问题:
    - 这些智能体生成的论文是否包含有科学意义的贡献，还是主要是训练数据中模式的变体？
    - 自动评审分数与人类专家判断及现实世界科学影响之间的相关性有多强？
    - 这些框架能否扩展到以感知、驱动和安全约束为核心的物理实验室实验？
    - 什么样的最小评估标准集能够揭示智能体是否真正推动了知识进步，而非仅仅利用基准的缺陷？
