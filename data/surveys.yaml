  related_work_outline:
  - 'Mainstream direction: Autonomous research agents that generate hypotheses, execute
    experiments, and produce verified claims; recent work combines LLM ideation with
    execution-grounded feedback, verification gates, and human-AI collaboration to
    improve reliability.'
  - 'Shared research pattern: A loop from literature, data, or prior evidence to hypothesis
    generation, code-level or domain-specific execution, evaluation, failure attribution,
    and regenerated direction, with claims constrained by measured outputs.'
  - 'Key differences: Systems differ in supervision target, interaction mode, architectural
    authority, and deployment scope; some use domain validity checks, others use task-suite
    metrics or expert judgments, and some separate LLM cognition from deterministic
    execution control.'
  - 'Trend evolution: Evidence is concentrated in 2025-2026, so the visible trend
    is within the current frontier: from isolated AI scientist pipelines toward modular,
    self-correcting, domain-agnostic frameworks plus evaluation with human baselines.'
  - 'Open questions: Whether verification gates catch all silent failures, whether
    task-suite gains transfer to real discovery utility, where human intervention
    is most valuable, and how to resolve autonomous scientific writing, literature
    automation, reliability, and ethics.'
  related_work_outline_zh:
  - 主流方向：自主研究智能体生成假设、执行实验并产出可验证结论；近期工作将LLM构思与执行反馈、验证门控和人机协作结合以提升可靠性。
  - 研究共性：从文献、数据或先验证据到假设生成、代码或领域执行、评估、失败归因与再生成方向的闭环，且用实测结果约束结论。
  - 关键差异：系统在监督目标、交互模式、架构权威和部署范围上不同；有的使用领域有效性检查，有的使用任务集指标或专家判断，还有的将LLM认知与确定性执行控制分离。
  - 趋势演进：证据集中在2025-2026年，可见趋势处于当前前沿：从孤立AI科学家流水线走向模块化、自纠正、领域无关框架以及带人类基线的评估。
  - 开放问题：验证门控能否捕捉所有静默失败、任务集提升能否转化为真实发现效用、人类干预在何处最有价值，以及自主论文写作、文献自动化、可靠性与伦理问题。
  literature_review:
    line_of_work_matrix:
    - line: Domain-grounded autonomous discovery loops
      what_it_solves: Turns domain observations and literature into executable hypotheses
        with physics- or task-specific validity checks that can reject silent failures
        before claims are accepted.
      what_remains_open: Detectors still miss some silent failures; evidence is limited
        to specific domains and does not establish generalization to new physical
        or biological settings.
    - line: Multi-agent research orchestration with human-AI collaboration
      what_it_solves: Coordinates ideation, execution, reporting, and human intervention
        at selected points, aiming to outperform both fully autonomous and step-by-step
        oversight workflows.
      what_remains_open: Evidence comes mainly from internal case studies or experiment-stage
        tasks, leaving real-world lab integration and cost-effectiveness unmeasured.
    - line: Self-correction and failure attribution
      what_it_solves: Diagnoses failed experiments through multiple evidence-grounded
        explanations and routes corrections to the hypothesis, design, or implementation
        level before regenerating.
      what_remains_open: Improvements concentrate on code development and execution;
        generation of complete, publication-ready scientific writing remains unresolved.
    - line: Domain-agnostic evolving agent frameworks
      what_it_solves: Provides reusable mechanisms for agents to refine hypotheses,
        self-critique, and accumulate knowledge across arbitrary disciplines, lowering
        the cost of building scientific agents.
      what_remains_open: Reported task-suite improvements may not correspond to real
        discovery quality, and provided evidence does not demonstrate long-horizon
        scientific contribution.
    - line: Evaluation and human baseline design for AI scientists
      what_it_solves: Makes AI scientist claims comparable by introducing tasks, datasets,
        baselines, metrics, and human expert performance references in specific scientific
        domains.
      what_remains_open: Coverage across diverse scientific tasks is still narrow,
        and proxy task success is not yet linked to real downstream discovery utility.
    - line: Surveys and conceptual organization of agentic science
      what_it_solves: Organizes fragmented systems into capabilities, domains, metrics,
        frameworks, and challenges, providing a map of progress and unresolved issues.
      what_remains_open: The proposed categories are not directly empirically validated
        as predictors of model behavior, and reliability, ethics, and literature automation
        remain open.
    consensus:
    - Autonomous research systems converge on separating open-ended ideation from
      controlled execution and verification to reduce fabricated or invalid claims.
    - Execution-grounded feedback is treated as essential for evaluating and improving
      generated hypotheses.
    - Structured verification or reporting mechanisms, rather than raw model outputs,
      are required for defensible scientific results.
    - Selected human collaboration at high-leverage decision points can beat both
      full autonomy and exhaustive oversight.
    - Current AI scientists can support data-driven research but are not yet fully
      autonomous discoverers.
    disagreements:
    - 'Evaluation targets differ: domain-specific validity checks constrain some systems,
      while others optimize broad task-suite scores, expert case-study preferences,
      or human baseline comparisons.'
    - Interaction modes differ from fully autonomous execution to multiple human-in-the-loop
      intervention levels.
    - 'Architectural authority differs: multi-agent debate, self-evolving knowledge
      accumulation, and cognitive-authority separation assign different roles to LLMs
      versus deterministic controllers.'
    - Deployment scope differs between domain-specific systems and domain-agnostic
      frameworks intended to support arbitrary disciplines.
    open_questions:
    - Can current verification gates detect enough silent failures to make autonomous
      claims trustworthy outside their evaluated domains?
    - Do task-suite improvements transfer to real scientific discovery utility across
      disciplines?
    - Where should human collaboration be inserted to maximize research quality without
      excessive oversight cost?
    - Can future systems close the remaining gap in fully autonomous scientific writing,
      literature automation, reliability, and ethical oversight?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域锚定的自主发现闭环
      解决的问题: 将领域观测与文献转化为可执行假设，并结合物理或任务特定有效性检查，在结论被接受前拒绝静默失败。
      尚未覆盖: 检测器仍会遗漏部分静默失败；证据限于特定领域，未证明能泛化到新的物理或生物设置。
    - 路线: 多智能体研究编排与人机协作
      解决的问题: 协调构思、执行、报告和在选定节点的人类干预，旨在优于全自主和逐步监督两种工作流。
      尚未覆盖: 证据主要来自内部案例或实验阶段任务，真实实验室集成与成本效益未被测量。
    - 路线: 自我纠正与失败归因
      解决的问题: 通过多个有证据支持的解释诊断失败实验，并在重新生成前将纠正路由到假设、设计或实现层。
      尚未覆盖: 改进集中在代码开发与执行；生成完整、可发表的科学写作仍未解决。
    - 路线: 领域无关的自我演化智能体框架
      解决的问题: 提供可复用机制，使智能体能跨学科优化假设、自我批判并积累知识，降低构建科学智能体的成本。
      尚未覆盖: 报告的任务集提升未必对应真实发现质量，现有证据未证明长期科学贡献。
    - 路线: AI科学家的评估与人类基线设计
      解决的问题: 通过在特定科学领域引入任务、数据集、基线、指标和人类专家表现参考，使AI科学家主张具有可比性。
      尚未覆盖: 对多样科学任务的覆盖仍较窄，且代理任务成功尚未关联到真实下游发现效用。
    - 路线: 智能体科学综述与概念组织
      解决的问题: 将碎片化系统按其能力、领域、指标、框架和挑战组织起来，提供进展与未解决问题的图谱。
      尚未覆盖: 所提出的分类尚未被直接实证验证为能预测模型行为，可靠性、伦理和文献自动化仍开放。
    共识:
    - 自主研究系统正汇聚于将开放式构思与受控执行和验证分离，以减少伪造或无效结论。
    - 执行反馈被广泛视为评估和改进生成假设的关键。
    - 要形成可辩护的科学结论，需要结构化验证或报告机制，而不能只依赖原始模型输出。
    - 在高杠杆决策点进行选择性人类协作，可优于完全自主和穷尽式逐步监督。
    - 当前AI科学家可支持数据驱动研究，但尚不是完全自主的科学发现者。
    分歧:
    - 评估目标不同：部分系统受领域特定有效性检查约束，部分系统优化广泛任务集得分、专家案例偏好或人类基线对比。
    - 交互模式不同：从完全自主执行到多层级人在回路的干预模式均存在。
    - 架构权威不同：多智能体辩论、自演化知识积累和认知-权威分离对LLM与确定性控制器赋予不同职责。
    - 部署范围不同：存在领域专用系统与面向任意学科的领域无关框架。
