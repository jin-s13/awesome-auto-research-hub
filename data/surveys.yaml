  related_work_outline:
  - 'Mainstream direction: autonomous LLM-based multi-agent systems are being built
    for literature synthesis, literature review automation, and research-paper generation,
    with verification loops and knowledge retrieval as core components.'
  - 'Shared research pattern: systems commonly combine retrieval, planning, generation,
    and internal verification; evaluation is shifting from output completion toward
    evidence-grounded scoring of scientific claims.'
  - 'Key differences: some work targets end-to-end paper generation in a specific
    domain, while other work targets blind task benchmarks, failure-mode case studies,
    or domain-agnostic self-evolving frameworks; evaluation targets and metrics vary
    accordingly.'
  - 'Trend evolution: the available evidence is concentrated in 2025-2026, moving
    from isolated synthesis toward evidence-maturity benchmarks, failure analysis,
    and self-evolving agent frameworks within the current frontier.'
  - 'Open questions: reliable automated literature review and research-gap discovery,
    alignment of LLM-judged evidence scores with human judgment, cross-domain and
    cross-base-model generalization, and unresolved long-horizon failure modes remain
    open.'
  related_work_outline_zh:
  - 主流方向：基于LLM的多智能体系统正被用于文献综合、综述自动化和研究论文生成，并以验证循环和知识检索为核心组件。
  - 研究共性：系统普遍组合检索、规划、生成和内部验证；评测正从完成输出转向对科学主张进行证据锚定的评分。
  - 关键差异：有的工作面向特定领域的端到端论文生成，有的则面向盲任务基准、失败模式案例研究或领域无关的自演化框架；评测目标和指标相应不同。
  - 趋势演进：可用证据集中在2025-2026年，当前前沿从孤立文献综合转向证据成熟度基准、失败分析和自演化智能体框架。
  - 开放问题：可靠的自动文献综述与研究缺口发现、LLM证据评分与人类判断的一致性、跨领域与跨基座模型泛化，以及长程自主研究中的失败模式仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end literature synthesis and paper-generation agents, e.g. ReasFlow
      what_it_solves: Automates literature synthesis, reasoning verification, and
        manuscript writing for theory-heavy scientific discovery while reducing expert
        intervention.
      what_remains_open: Evaluation relies on LLM-based review rubrics for generated
        papers; external human validation and cross-domain generalization are not
        shown.
    - line: Evidence-grounded scientific discovery benchmarks, e.g. TruthInsightBench,
        BAISBench
      what_it_solves: Creates blinded tasks from peer-reviewed studies to measure
        whether agents can produce claims supported by data instead of reproducing
        hidden conclusions.
      what_remains_open: Reported results depend on a single frozen base model or
        a specific data type, and proxy evidence metrics may not reflect real scientific
        utility.
    - line: Failure-oriented case studies and design principles, e.g. Why LLMs Aren't
        Scientists Yet
      what_it_solves: Documents recurring failure modes in autonomous research pipelines
        and converts them into design principles for more robust agentic systems.
      what_remains_open: Only a small number of end-to-end attempts are reported,
        mostly in machine learning, and the principles are not yet systematically
        validated across domains.
    - line: Survey and taxonomy of agentic scientific systems
      what_it_solves: Organizes agentic systems, metrics, frameworks, and datasets
        across scientific domains and identifies literature review automation as a
        critical challenge.
      what_remains_open: Survey-level synthesis identifies gaps but does not provide
        empirical validation that the proposed categories predict model behavior.
    - line: Domain-agnostic self-evolving agent frameworks, e.g. EvoMaster
      what_it_solves: Provides reusable infrastructure for building self-improving
        scientific agents that refine hypotheses, self-critique, and accumulate knowledge
        across disciplines.
      what_remains_open: Benchmark wins do not establish scientific originality or
        long-horizon reliability, and limitations are absent from the visible evidence.
    consensus:
    - Multi-agent workflows commonly integrate retrieval, generation, and verification,
      with a human expert retained for task framing or review.
    - Current systems are treated as assistants for synthesis and discovery rather
      than as fully autonomous scientists.
    - Newer evaluation approaches emphasize evidence maturity, auditability, and factual
      grounding over merely completing a document or task.
    - Automated literature review and survey synthesis remain challenging and are
      not yet shown to be reliable across domains.
    disagreements:
    - 'Evaluation target differs: some studies score complete paper generation, while
      others score blind data-supported claims or multiple-choice discovery answers.'
    - 'Scoring mechanism differs: LLM-based review rubrics, automated artifact-based
      rubric scores, and human baselines are used in different studies.'
    - 'Scope differs: domain-specific applied mathematics or omics settings are contrasted
      with domain-agnostic self-evolving frameworks.'
    - Success metrics are not directly comparable because some work builds reusable
      infrastructure while other work produces diagnostic failure cases.
    open_questions:
    - Can automated literature synthesis generate reliable research gaps without depending
      on hidden target conclusions?
    - Do LLM-judged evidence maturity scores align with human expert judgment and
      downstream research utility?
    - How well do domain-agnostic agent frameworks transfer beyond the reported benchmarks
      and base models?
    - Which failure modes most limit long-horizon literature search, synthesis, and
      autonomous paper writing?
    - The evidence packet lacks direct evaluation of citation analysis and literature
      search coverage, leaving those topic capabilities as verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端文献综合与论文生成智能体，如 ReasFlow
      解决的问题: 自动化文献综合、推理验证和手稿撰写，减少专家在理论驱动科学发现中的干预。
      尚未覆盖: 评测依赖基于LLM的评审量表，尚缺乏外部人工验证和跨领域泛化证据。
    - 路线: 证据锚定的科学发现基准，如 TruthInsightBench、BAISBench
      解决的问题: 使用来自同行评审研究的盲任务衡量智能体是否能提出由数据支持的主张，而不是复现隐藏结论。
      尚未覆盖: 结果依赖单一冻结基座模型或特定数据类型，代理证据指标未必对应真实科学效用。
    - 路线: 失败导向的案例研究与设计原则，如 Why LLMs Aren't Scientists Yet
      解决的问题: 记录自主研究流水线中的重复失败模式，并将其转化为更稳健系统的设计原则。
      尚未覆盖: 仅报告少量端到端尝试且主要来自机器学习，原则尚未在跨领域设置中系统验证。
    - 路线: 面向智能体科学系统的综述与分类
      解决的问题: 按科学领域和能力整理智能体系统、指标、框架和数据集，并将文献综述自动化识别为关键挑战。
      尚未覆盖: 综述层面识别缺口，但未提供分类能否预测模型行为的实证验证。
    - 路线: 领域无关的自演化智能体框架，如 EvoMaster
      解决的问题: 提供可复用基础设施，使科学智能体迭代优化假设、自我批判并跨实验周期积累知识。
      尚未覆盖: 基准结果不能证明科学原创性或长程可靠性，可见证据中未说明局限性。
    共识:
    - 多智能体工作流普遍组合检索、生成和验证，并保留人类专家进行任务框定或审查。
    - 当前系统主要被评估为综合与发现的辅助工具，而非完全自主的科学家。
    - 新近评测重视证据成熟度、可审计性和事实锚定，而非仅看输出是否完成。
    - 自动文献综述和综述综合仍不可靠，尚未证明可跨领域稳定运行。
    分歧:
    - 评测目标不同：有的对完整论文生成评分，有的对盲数据支持的主张或多选题发现答案评分。
    - 评分机制不同：有的采用基于LLM的评审量表，有的采用基于产出的自动量规或人类基线。
    - 范围不同：领域特定的应用数学或组学设置，对比领域无关的自演化框架。
    - 成功指标难以直接比较，因为有的构建可复用基础设施，有的产出诊断性失败案例。
    开放问题:
    - 自动文献综合能否在不依赖隐藏目标结论的情况下生成可靠研究缺口？
    - LLM证据成熟度评分是否与人类专家判断和下游研究效用一致？
    - 领域无关的智能体框架在报告基准和基座模型之外能否良好迁移？
    - 哪些失败模式最限制长程文献搜索、综合和自主论文写作？
    - 证据包未直接评估引文分析与文献搜索覆盖度，因此这些主题能力仍是验证缺口。
