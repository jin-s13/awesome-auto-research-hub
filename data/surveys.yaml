  related_work_outline:
  - 'Mainstream direction: Building autonomous multi-step research pipelines (AI scientists)
    that generate hypotheses, execute experiments, and self-correct using multi-agent
    debate, formal verification, or physics-aware gates.'
  - 'Shared research pattern: Systems decompose scientific discovery into ideation
    → execution → verification → reporting cycles, with growing emphasis on failure
    recovery, evidence grounding, and iterative self-improvement.'
  - 'Key differences: Verification mechanisms range from vision-language physics checks
    (CFD) to Lean formal proofs (causal inference) to fact-constrained reporting;
    some systems are domain-agnostic frameworks while others embed domain-specific
    simulators; human-in-the-loop collaboration varies from optional oversight to
    targeted high-leverage interventions.'
  - 'Trend evolution: From 2023–2026, systems evolved from simple experiment generation
    to full-stack autonomous agents with self-healing, cross-run evolution, and formal
    verification, while benchmarks moved from narrow tasks to multi-domain, human-calibrated
    evaluation suites.'
  - 'Open questions: Whether verification gates can reliably detect all silent failures
    in open-ended settings; how to align proxy metrics (benchmark scores) with long-term
    scientific impact; and how to scale formal verification to noisy, real-world experimental
    data.'
  related_work_outline_zh:
  - 主流方向：构建自主多步研究流程（AI科学家），通过多智能体辩论、形式化验证或物理感知门控来生成假设、执行实验并自我纠正。
  - 研究共性：系统将科学发现分解为构思→执行→验证→报告循环，并越来越强调失败恢复、证据锚定和迭代自我改进。
  - 关键差异：验证机制从视觉语言物理检查（CFD）到Lean形式化证明（因果推断）再到事实约束报告不一；部分系统是领域无关框架，而另一些嵌入了领域特定模拟器；人机协作从可选监督到目标性强杠杆干预各有不同。
  - 趋势演进：2023至2026年，系统从简单实验生成演变为具备自愈、跨运行进化和形式化验证的全栈自主智能体，同时基准测试从窄任务走向多领域、人类校准的评估套件。
  - 开放问题：验证门控能否在开放式设置中可靠检测所有静默失败；如何将代理指标（基准分数）与长期科学影响对齐；如何将形式化验证扩展到噪声大的真实世界实验数据。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous multi-step research pipelines
      what_it_solves: 'End-to-end scientific workflow automation: hypothesis generation,
        experiment execution, failure diagnosis, and report drafting, often with multi-agent
        debate or self-evolution to improve idea quality and robustness.'
      what_remains_open: Fully autonomous scientific writing remains unsolved; cross-domain
        generalization of self-correction strategies; verifying that the generated
        hypothesis is scientifically meaningful rather than just optimizing a metric.
    - line: Domain-specific AI scientists with embedded verifiers
      what_it_solves: Integrating domain-aware verification gates (physics simulations,
        formal proof assistants) into the research loop to catch silent failures and
        ensure claims are physically or mathematically defensible.
      what_remains_open: The verification gate may still miss failures (e.g., 2 out
        of 16 planted errors missed); the gap between formalized statements and intended
        scientific meaning; transferability of the verification module to other domains.
    - line: Benchmarks and human-calibrated evaluation
      what_it_solves: Provides reproducible tasks and human performance baselines
        for comparing AI scientist capabilities on realistic scientific problems (e.g.,
        omics data analysis, causal discovery).
      what_remains_open: Coverage of diverse scientific disciplines; alignment between
        benchmark scores and real-world research utility; whether human-calibrated
        baselines are sufficient to capture the depth of scientific reasoning.
    - line: Framework and infrastructure for agentic science
      what_it_solves: Offers reusable, domain-agnostic platforms that allow rapid
        construction of self-evolving, multi-agent research teams with monitoring,
        code harnesses, and artifact management.
      what_remains_open: Maturity and stability of the platform; evaluation limited
        to case studies and internal benchmarks, lacking external validation across
        hardware, datasets, and user settings.
    consensus:
    - Scientific discovery can be decomposed into a closed-loop cycle of ideation,
      execution, verification, and reporting.
    - Verification mechanisms (whether formal, visual, or fact-based) are essential
      to prevent fabricated results and hallucinated citations.
    - Current AI scientist systems are not yet fully autonomous and benefit from human
      collaboration, especially at high-leverage decision points.
    - Self-improvement and failure recovery are critical for increasing the yield
      of meaningful experimental outcomes.
    disagreements:
    - 'Verification approach: formal proof versus physics-aware vision-language gate
      versus fact-constrained reporting.'
    - 'Architecture: single-agent with self-evolution versus multi-agent debate with
      fixed roles.'
    - 'Domain scope: general-purpose frameworks (e.g., EvoMaster, AutoResearchClaw)
      versus domain-specific pipelines (e.g., CFD, causal inference).'
    - 'Human role: targeted collaboration at key decisions versus full autonomy with
      optional oversight versus step-by-step human supervision.'
    open_questions:
    - Can verification gates be made robust enough to detect all silent failures in
      open-ended scientific exploration?
    - How do we evaluate the long-term scientific impact of AI-generated hypotheses
      beyond benchmark scores?
    - What is the minimal set of domain knowledge that must be embedded to make a
      general AI scientist competitive with a domain-specific one?
    - How can formal verification methods scale to settings where ground truth is
      not mathematically defined, such as empirical biological experiments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主多步研究流水线
      解决的问题: 端到端科学工作流自动化：假设生成、实验执行、失败诊断和报告撰写，常通过多智能体辩论或自演化来提升思想质量和鲁棒性。
      尚未覆盖: 完全自主的科学写作仍未解决；自纠正策略的跨领域泛化；验证生成的假设是否具有科学意义，而不仅仅是优化某个指标。
    - 路线: 内嵌领域验证器的领域特定AI科学家
      解决的问题: 将领域感知验证门控（物理仿真、形式化证明助手）集成到研究循环中，以捕获静默失败并确保主张在物理或数学上可辩护。
      尚未覆盖: 验证门控仍可能遗漏失败（例如，16个植入错误中漏检2个）；形式化陈述与预期科学意义之间的差距；验证模块对其他领域的可迁移性。
    - 路线: 基准测试与人类校准评估
      解决的问题: 提供可复现的任务和人类表现基线，用于在真实科学问题（如组学数据分析、因果发现）上比较AI科学家的能力。
      尚未覆盖: 多样科学学科的覆盖度；基准分数与真实世界研究效用的对齐；人类校准基线是否足以捕捉科学推理的深度。
    - 路线: 智能体科学框架与基础设施
      解决的问题: 提供可复用的领域无关平台，支持快速构建具有监控、代码工具和工件管理的自演化多智能体研究团队。
      尚未覆盖: 平台的成熟度和稳定性；评估局限于案例研究和内部基准，缺乏跨硬件、数据集和用户设置的外部验证。
    共识:
    - 科学发现可被分解为构思、执行、验证和报告的闭环循环。
    - 验证机制（无论是形式化、视觉还是基于事实的）对于防止捏造结果和幻觉引用至关重要。
    - 当前AI科学家系统尚未完全自主，在关键决策点引入人类协作能带来明显收益。
    - 自我改进和失败恢复对于提高有意义实验产出的比例至关重要。
    分歧:
    - 验证方式：形式化证明 vs 物理感知视觉语言门控 vs 事实约束报告。
