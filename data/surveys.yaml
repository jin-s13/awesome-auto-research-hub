  related_work_outline_zh:
  - 主流方向：当前证据聚焦于AI科学家系统，自主提出研究想法、执行实验、验证结果并撰写论文，近期更强调领域特定验证与自我纠正，而非仅起草文本。
  - 研究共性：系统将规划、执行、结果检查和论文生成串联；验证循环与评审或评估信号用于约束主张并捕捉静默失败。
  - 关键差异：核心差异在于自主程度、验证机制和评测目标，从完全自主到人在环协作，从逻辑检查到物理视觉或多假设因果归因。
  - 趋势演进：2024至2026年，重点从通用端到端发现转向领域感知有效性门控、结构化失败诊断、精准人机协作和更明确的基准比较，仍处于当前前沿。
  - 开放问题：这些系统能否泛化到展示领域之外，基准或接收指标是否反映科学贡献，以及如何控制漏检的验证失败与幻觉性报告，仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous manuscript generation
      what_it_solves: Integrates idea generation, code execution, experiment analysis,
        visualization, and paper writing into a runnable workflow for producing complete
        research manuscripts.
      what_remains_open: Whether generated papers make defensible scientific contributions
        beyond passing reviewer or benchmark thresholds.
    - line: Domain-aware verification and validity gating
      what_it_solves: Detects silent failures before claims are written by checking
        logical coherence, physical plausibility, or rendered outputs.
      what_remains_open: Verification gates still miss some planted failures and are
        not shown to transfer across broad domains or modalities.
    - line: Failure attribution and self-correction
      what_it_solves: Diagnoses failed experiment states and routes corrections to
        hypothesis, design, or implementation so runs can recover instead of terminating.
      what_remains_open: Long-horizon memory degradation and causal attribution across
        complex, multi-step workflows remain partly unsolved.
    - line: Human-AI collaboration and oversight
      what_it_solves: Places human intervention at high-leverage decision points and
        defines collaboration modes, balancing autonomous execution with expert control.
      what_remains_open: Optimal intervention granularity and whether a single collaboration
        policy transfers across scientific fields are not established.
    - line: Evaluation and review protocols
      what_it_solves: Creates benchmarks, automated reviewers, rubrics, and peer-review
        submission channels to compare autonomous research systems and signal acceptance
        readiness.
      what_remains_open: Proxy metrics and LLM-review scores are not yet aligned with
        long-term scientific utility or independent human judgment.
    consensus:
    - Autonomous research writing systems share an end-to-end workflow covering ideation,
      execution, analysis, and manuscript preparation.
    - Verification or error checking before reporting is seen as necessary to reduce
      silent failures and fabricated claims.
    - LLM-based reviewers and benchmark comparisons are common evaluation tools, but
      workshop or peer acceptance remains a key external signal.
    - Fully autonomous outputs are still unreliable; some human oversight or targeted
      intervention improves result quality.
    disagreements:
    - 'Systems choose different autonomy levels: some target fully automated research,
      while others treat human collaboration as a core mechanism.'
    - Verification strategies differ, including logical coherence auditing, vision-language
      physics checks, and multi-hypothesis causal failure attribution.
    - Evaluation targets differ across LLM rubrics, experiment-stage benchmark scores,
      multi-AI review, and formal workshop peer review.
    - Search and interaction structures differ from linear pipelines to agentic tree
      search to multi-agent debate with self-healing execution.
    open_questions:
    - Can claimed gains on ARC-Bench or LLM reviewer scores transfer to defensible
      scientific contributions in domains beyond CFD, applied math, and selected ML
      subfields?
    - How should systems balance domain-specific verification gates with the need
      for general scientific writing and discovery?
    - What evidence links automatic reviewer scores or acceptance thresholds to long-term
      scientific value?
    - How can systems avoid missed silent failures and memory/context degradation
      over long research trajectories?
    - What minimal human intervention points are sufficient to keep reporting grounded
      without negating autonomy gains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主手稿生成
      解决的问题: 将想法生成、代码执行、实验分析、可视化和论文写作整合为可运行的工作流，产出完整研究手稿。
      尚未覆盖: 生成论文是否在超越评审者或基准阈值之外，形成可辩护的科学贡献尚不明确。
    - 路线: 领域感知验证与有效性门控
      解决的问题: 在写入主张前检查逻辑一致性、物理合理性或渲染输出，以捕捉静默失败。
      尚未覆盖: 验证门控仍会漏掉部分植入失败，也尚未证明能在广泛领域或模态间迁移。
    - 路线: 失败归因与自我纠正
      解决的问题: 诊断失败实验状态，并将修正路由到假设、设计或实现层级，以便运行可恢复而非终止。
      尚未覆盖: 长跨度记忆退化和复杂多步工作流中的因果归因仍未完全解决。
    - 路线: 人机协作与监督
      解决的问题: 在高杠杆决策点引入人类干预并定义协作模式，在自主执行与专家控制之间取得平衡。
      尚未覆盖: 最优干预粒度以及单一协作策略能否跨科学领域迁移尚未建立。
    - 路线: 评测与评审协议
      解决的问题: 构建基准、自动评审器、评分标准和同行评审提交通道，以比较自主研究系统并衡量其准备度。
      尚未覆盖: 代理指标和LLM评审分数与长期科学效用或独立人类判断之间的对齐尚未证明。
    共识:
    - 自主研究写作系统共享覆盖构思、执行、分析和手稿准备的端到端工作流。
    - 在报告前进行验证或错误检查被视为减少静默失败和虚假主张的必要步骤。
    - 基于LLM的评审和基准比较是常见评价工具，但研讨会或同行接收仍是重要外部信号。
    - 完全自主输出仍不稳定；适当人类监督或精准干预能改善结果质量。
    分歧:
    - 系统选择不同自主程度：有些以完全自动化为目标，有些将人机协作作为核心机制。
    - 验证策略不同，包括逻辑一致性审计、视觉语言物理检查以及多假设因果失败归因。
    - 评测目标不同，包括LLM评分标准、实验阶段基准分数、多AI评审以及正式研讨会同行评审。
    - 搜索与交互结构不同，从线性流水线到智能体树搜索，再到带自愈执行的多智能体辩论。
    开放问题:
    - 在ARC-Bench或LLM评审分数上的提升，能否迁移为CFD、应用数学和选定机器学习子领域之外的可辩护科学贡献？
    - 系统应如何在领域特定验证门控与通用科学写作和发现需求之间取得平衡？
    - 哪些证据能连接自动评审分数或接收阈值与长期科学价值？
    - 系统如何避免在长研究轨迹中漏检静默失败以及记忆和上下文退化？
    - 保持报告真实性的最小人类干预点是什么，同时不抵消自主性收益？
