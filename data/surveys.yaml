  related_work_outline_zh:
  - 主流方向：端到端自主科研智能体正在与证据锚定基准和验证门控结合，评估重点从论文产出转向主张可靠性。
  - 研究共性：LLM驱动的智能体提出假设、运行实验、分析数据并撰写结果；可靠性通过任务完成、证据成熟度、同行评审阈值或领域验证检查来评估。
  - 关键差异：评测目标不同——任务完成与可解释知识、盲测证据成熟度、领域指标提升、工作坊同行评审接受，以及实现成功率与控制边界。
  - 趋势演进：从2024年的通用智能体框架和虚拟环境，到2025年工作坊接受和领域基准，再到2026年证据锚定评测与确定性权威分离等可靠性架构。
  - 开放问题：LLM评审是否足以支撑治理；验证门控能否跨领域泛化并捕获静默失败；智能体是真正发现还是仅分析冻结数据；如何填补可复现证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery agents
      what_it_solves: Turns LLM-driven ideation, coding, experiment execution, analysis,
        and manuscript writing into an integrated research workflow.
      what_remains_open: 'Success is inconsistent: for example, only one of three
        AI Scientist-v2 submissions passed peer review, and several baseline systems
        could not produce defensible claims without validity gates.'
    - line: Evidence-grounded evaluation benchmarks
      what_it_solves: Tests discovery-oriented behavior on blind tasks or real datasets
        and scores evidentiary maturity, task completion, and explanatory knowledge
        rather than exact reproduction.
      what_remains_open: Coverage remains narrow and evaluator generalizability is
        unproven; TruthInsightBench is limited to one frozen base model, DiscoveryWorld
        uses simulated topics, and BAISBench uses one biological modality.
    - line: Verification and reliability mechanisms within agents
      what_it_solves: Adds deterministic or domain-specific checks, such as a physics-aware
        vision-language gate or cognition-authority separation, to prevent silent
        failures and constrain source edits.
      what_remains_open: The CFD gate missed 2 of 16 planted silent failures, and
        authority separation is demonstrated only on three real-world forecasting
        cases, leaving cross-domain generalization unresolved.
    - line: Automated review and claim assessment
      what_it_solves: Uses simulated reviewers or fixed LLM judges with rubric dimensions
        to assess generated papers and evidence maturity at scale.
      what_remains_open: Calibration to human judgment and robustness across scientific
        fields are not established; automated judges may reward auditability and novelty
        while underpricing controls, robustness, and falsifiability.
    consensus:
    - Current autonomous agents can execute and document analyses, but they plateau
      on evidence-maturity and discovery tasks when judged on controlled claims.
    - Evaluation is moving beyond hidden-target reproduction toward blind tasks, domain-specific
      validity checks, and evidence maturity rubrics.
    - Separating open-ended LLM-driven cognition from deterministic evaluation or
      authority improves implementation reliability and auditability.
    - Human or near-human baselines and peer-review thresholds are still used to calibrate
      automated assessment.
    disagreements:
    - 'Evaluation target differs: task completion and discovered explanatory knowledge
      versus evidence maturity of blind claims versus domain metric improvement versus
      workshop peer-review acceptance.'
    - 'Reliability mechanism differs: domain-specific visual verification, deterministic
      source-edit and promotion authority, and LLM-based rubric judges address different
      failure points.'
    - 'Domain scope differs: general virtual scientific topics, ML subfields, single-cell
      omics, CFD, and time-series forecasting make transfer claims incompatible.'
    - 'Success evidence differs: one accepted workshop paper, one CFD RMSE improvement,
      no statistically reliable separation among coding agents, and three forecasting
      case wins are not equivalent evidence.'
    open_questions:
    - Are fixed LLM judges sufficiently calibrated to support governance decisions
      across domains, especially when agents score near 60/100 with no pairwise separation?
    - Can physics-aware or authority-bound verification generalize beyond narrow CFD
      and forecasting cases, and how should silent failures be audited?
    - Do blind benchmark tasks measure genuine scientific discovery or only competent
      analysis and documentation of frozen data?
    - How should missing reproducibility signals, such as absent code, datasets, metrics,
      or limitation details, be treated in evidence synthesis?
    - What evaluation coverage is needed for reliability and safety governance in
      open-ended automated research workflows?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现智能体
      解决的问题: 把LLM驱动的构思、编码、实验执行、分析和论文撰写整合为一体化研究流程。
      尚未覆盖: 成功不一致：例如The AI Scientist-v2三篇投稿仅一篇通过同行评审，多个基线系统缺少有效性门控因而无法形成可辩护主张。
    - 路线: 证据锚定的评测基准
      解决的问题: 用盲测任务或真实数据集测试发现行为，并对证据成熟度、任务完成和可解释知识评分，而不是只测复现。
      尚未覆盖: 覆盖范围仍窄且评测器泛化未证明；TruthInsightBench只基于一个冻结基座模型，DISCOVERYWORLD使用模拟主题，BAISBench仅覆盖单细胞组学模态。
    - 路线: 智能体内验证与可靠性机制
      解决的问题: 加入确定性或领域特定检查，如物理感知视觉-语言门控或认知-权威分离，以防止静默失败并约束源码修改。
      尚未覆盖: CFD门控漏检16个植入静默失败中的2个；权威分离仅在三个真实预测案例中展示，跨领域泛化未解决。
    - 路线: 自动评审与主张评估
      解决的问题: 使用模拟评审或固定LLM评委按评分维度规模化评估生成论文和证据成熟度。
      尚未覆盖: 对人工判断的校准和跨科学领域的稳健性尚未建立；自动评委可能奖励可审计性和新颖性，却低估对照、稳健性和可证伪性。
    共识:
    - 当前自主智能体能够执行和记录分析，但在受控主张的证据成熟度与发现任务上出现平台期。
