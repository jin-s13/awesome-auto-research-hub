  related_work_outline:
  - 'Mainstream direction: Constructing multi-agent autonomous research systems that
    close the loop from hypothesis generation through execution, verification, and
    reporting, with growing emphasis on self-correction and human-AI collaboration.'
  - 'Shared research pattern: Decomposing scientific discovery into generate-execute-verify-report
    cycles, using language-model agents for ideation, and adding explicit validity
    gates or audits to catch silent failures and unsupported claims.'
  - 'Key differences: The verification substrate varies across formal proof, physics-specific
    vision-language checks, trajectory-level failure attribution, or structured debate;
    deployment ranges from computational fluid dynamics, single-cell omics, and causal
    inference to domain-agnostic frameworks, and human oversight ranges from targeted
    collaboration to final artifact inspection.'
  - 'Trend evolution: Within the 2025-2026 frontier window, the field is moving from
    surveys and narrow case studies toward stronger reproducibility artifacts, self-correction
    mechanisms, and human-in-the-loop evaluation; the available years are too narrow
    to assess longer-term research-line separation.'
  - 'Open questions: Can verification gates cover enough silent failure modes? Do
    benchmark gains transfer to real scientific hypotheses with delayed or uncertain
    feedback? What is the optimal level and placement of human intervention, and how
    should formal systems report gaps between proved theorems and intended scientific
    claims?'
  related_work_outline_zh:
  - 主流方向：构建多智能体自主科研系统，打通从假设生成到执行、验证和报告的全流程，并日益强调自我纠正与人机协作。
  - 研究共性：将科学发现拆解为生成-执行-验证-报告循环，用智能体生成想法，并引入显式验证门控或审计以防静默失败和不可靠主张。
  - 关键差异：验证基础不同，涵盖形式证明、物理专用视觉-语言检查、轨迹级失败归因或结构化辩论；部署领域从计算流体动力学、单细胞组学和因果推断到领域无关框架；人机监督从精准协作到最终产物人工审查不等。
  - 趋势演进：在2025-2026前沿窗口内，正从综述和狭窄案例走向更强的可复现工件、自纠正机制与人机协同评估；可用年份较窄，难以判断长期研究路线分化。
  - 开放问题：验证门控能否覆盖足够多的静默失败模式？基准增益能否迁移到反馈延迟或不确定的真实科学假设？何为人机干预的最佳强度和介入位置？形式系统如何报告已证明定理与预期科学主张之间的差距？
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous hypothesis-to-experiment research systems
      what_it_solves: Generating research directions and converting them into executable
        experiments and reports within closed research loops.
      what_remains_open: Generality beyond narrow case studies is unproven, and reported
        gains may come from the underlying model, controller, or human intervention
        rather than the pipeline itself.
    - line: Verification and failure-correction loops
      what_it_solves: Catching silent failures, fabricated results, and invalid hypotheses
        before generated claims are accepted as scientific findings.
      what_remains_open: Detectors are incomplete; formal verification only certifies
        conclusions under stated assumptions and may miss misalignment between formal
        claims and intended scientific meaning.
    - line: Evaluation and benchmark design for AI scientists
      what_it_solves: Providing comparable tasks, baselines, and human reference scores
        for assessing cell annotation or experimental discovery capability.
      what_remains_open: Current evaluations are domain-specific or proxy-based, human
        baselines are small, and agreement between benchmark success and real discovery
        utility is not established.
    - line: Interactive human-AI research platforms
      what_it_solves: Making research teams inspectable and controllable through customizable
        roles, monitoring, artifact inspection, and runnable code harnesses.
      what_remains_open: Platform maturity is early, and evaluation relies on limited
        internal case studies, leaving external generalization across tasks and users
        unverified.
    - line: Formal proof-grounded theoretical ideation
      what_it_solves: Generating and formalizing theoretical hypotheses in a proof
        assistant so machine-checked proofs validate logical consistency.
      what_remains_open: Machine-checked correctness does not guarantee that the formalization
        faithfully captures the intended scientific claim, and human review remains
        necessary.
    - line: Self-evolving domain-agnostic agent frameworks
      what_it_solves: Enabling iterative hypothesis refinement, self-critique, and
        accumulated knowledge across disciplines from a general agent scaffold.
      what_remains_open: No limitation evidence was reported, leaving uncertainty
        about domain-specific validation depth, failure modes, and the boundary between
        benchmark gains and scientific insight.
    consensus:
    - Autonomous research should be organized as multi-step generate-execute-verify
      cycles rather than one-shot idea generation.
    - Explicit verification, reporting constraints, or audits are necessary to prevent
      fabricated results and silent experimental failures.
    - Human collaboration improves rigor when targeted at high-leverage decision points
      rather than removed entirely or applied as exhaustive step-by-step oversight.
    - Current systems are better framed as research support than fully autonomous
      discoverers; autonomous scientific writing and reliable end-to-end autonomy
      remain open.
    disagreements:
    - 'Systems rely on different verification substrates: formal proof, physics-specific
      vision-language checks, trajectory-level causal failure attribution, or multi-agent
      debate.'
    - Deployment settings range from tightly scoped physical, biological, and theoretical
      problems to domain-agnostic self-evolving frameworks, implying different assumptions
      about knowledge transfer.
    - Human oversight is treated as a central collaboration mode in some systems,
      while others emphasize self-correction or final artifact inspection.
    - Evaluation targets differ across task-specific scientific benchmarks, broad
      knowledge and code benchmarks, and expert-judged case studies, limiting comparability.
    open_questions:
    - Can verification gates be made sensitive enough to catch silent failures, given
      evidence that a physics gate missed some planted failures?
    - Do gains on AI-scientist benchmarks or broad agent benchmarks transfer to real
      scientific hypotheses with delayed or uncertain feedback?
    - What is the optimal level and placement of human intervention across domains,
      and when does oversight become a bottleneck rather than a guarantee?
    - How should formal verification systems report the gap between a proved theorem
      and the informal scientific claim it is intended to support?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主假设-实验研究系统
      解决的问题: 生成研究方向，并将其转化为可执行实验和报告，形成闭合研究循环。
      尚未覆盖: 狭窄案例之外的泛化能力尚未证明；报告中的增益可能来自底层模型、控制器或人工干预，而非流程本身。
    - 路线: 验证与失败纠正循环
      解决的问题: 在生成的科学主张被接受前，识别静默失败、伪造结果和无效假设。
      尚未覆盖: 检测器并不完整；形式验证只能证明在给定假设下的结论，可能漏掉形式化与预期科学含义之间的错位。
    - 路线: AI科学家评测与基准设计
      解决的问题: 为细胞注释或实验发现能力提供可比较的任务、基线和人类参考分数。
      尚未覆盖: 当前评测偏向特定领域或代理指标，人类基线样本较小，基准成功与真实发现效用之间的一致性尚不明确。
    - 路线: 交互式人机研究平台
      解决的问题: 通过可定制角色、监控、工件检查和可运行代码工具，使研究团队可检查、可控制。
      尚未覆盖: 平台仍属早期，评估依赖少量内部案例，跨任务和用户的外部泛化尚未验证。
    - 路线: 形式证明驱动的理论构思
      解决的问题: 在证明助手中生成并形式化理论假设，以机器验证证明保证逻辑一致性。
      尚未覆盖: 机器验证正确性不能保证形式化忠实捕捉预期科学主张，仍需要人工审查。
    - 路线: 领域无关的自演化智能体框架
      解决的问题: 基于通用智能体脚手架，实现跨学科的迭代假设精炼、自我批判和知识积累。
      尚未覆盖: 证据中未报告局限性，领域验证深度、失败模式以及基准增益与科学洞见之间的边界仍不明确。
    共识:
    - 自主科研应被组织为多步的生成-执行-验证循环，而不是一次性想法生成。
    - 显式验证、报告约束或审计对于防止伪造结果和静默实验失败是必要的。
    - 人在高杠杆决策点的协作能提升严谨性，优于完全自主或详尽逐步监督。
    - 当前系统更适合作为科研辅助而非完全自主发现者；自主科研写作和可靠的端到端自主性仍然开放。
    分歧:
    - 系统采用不同的验证基础：形式证明、物理专用视觉-语言检查、轨迹级因果失败归因或多智能体辩论。
