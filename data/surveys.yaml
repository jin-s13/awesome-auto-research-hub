    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation pipelines
      what_it_solves: Connecting idea generation, coding, experiment execution, visualization,
        and paper writing into a single workflow.
      what_remains_open: Consistent conference-ready quality; one system reports only
        one of three submissions passing peer review, and fully autonomous writing
        remains unresolved.
    - line: Verification and grounded reporting layers
      what_it_solves: Reducing hallucinated numbers, invalid claims, and silent experimental
        failures before results are accepted or written.
      what_remains_open: Detection is incomplete; evidence shows a physics-aware gate
        still missed 2 of 16 planted silent failures, with no unified cross-domain
        validity standard.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Improving robustness by inserting expert oversight at high-leverage
        decision points rather than requiring exhaustive control.
      what_remains_open: Optimal intervention level, required domain expertise, and
        cost trade-offs are not yet established beyond experiment-stage benchmarks.
    - line: Failure attribution and self-correction
      what_it_solves: Diagnosing experiment failures as hypothesis, design, or implementation
        problems and routing corrections to the appropriate stage.
      what_remains_open: It improves metrics-bearing outputs and artifact quality
        but does not overcome the field-level challenge of generating fully conference-ready
        papers.
    - line: Evaluation and benchmarking for automated research systems
      what_it_solves: Providing comparative tasks, metrics, rubrics, and peer-review
        simulations for generated papers and discovery workflows.
      what_remains_open: Proxy metrics and LLM-based review are not yet shown to align
        with human scientific utility, and coverage across diverse domains remains
        limited.
    consensus:
    - Autonomous research systems share a pipeline architecture covering ideation,
      execution, verification, and manuscript production.
    - Verification and grounded reporting are treated as essential for reducing fabricated
      results and invalid claims.
    - Targeted human collaboration at high-leverage points improves robustness over
      both unchecked autonomy and exhaustive oversight.
    - Current evaluations rely on benchmark tasks, LLM-based rubrics, and peer-review
      proxies, with gains often concentrated in execution and artifact quality rather
      than full publication readiness.
    - Domain-specific validity checks catch silent failures that generic pipelines
      may miss.
