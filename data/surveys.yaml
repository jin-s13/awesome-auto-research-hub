  related_work_outline:
  - 'Mainstream direction: Building long-horizon autonomous research agents that search
    modeling/evaluation changes under explicit budgets, with durable state, reusable
    experience or skills, and held-out/sealed validation.'
  - 'Shared research pattern: Treat research as an iterative loop—propose candidate
    changes, receive cheap or high-fidelity feedback, condense reusable knowledge,
    and evaluate final transfer on unseen targets or benchmark suites.'
  - 'Key differences: Some contributions create new evaluation artifacts, such as
    EvalResearchBench; others provide reusable workbenches or skill libraries, such
    as TSFLab or DisCo; still others change state/feedback architecture, such as Stateless
    Language Agents or Online Surrogate Repair.'
  - 'Trend evolution: Within the 2024–2026 frontier, work is moving from single coding
    agents toward self-improving workbenches, budget-aware feedback sampling, experience
    reuse, and recursive evaluation design.'
  - 'Open questions: How well fixed-budget benchmark wins predict real research utility,
    how to compare across heterogeneous suites and hidden targets, and how much gain
    comes from infrastructure or skills versus the underlying model.'
  related_work_outline_zh:
  - 主流方向：构建长程自主研究智能体，在显式预算、持久状态、可复用经验/技能和留出/隐藏验证下搜索建模或评测变化。
  - 研究共性：把研究视为迭代循环——提出候选变化，接收廉价或高保真反馈，压缩可复用知识，并在未见目标或基准套件上评估迁移。
  - 关键差异：有的贡献新基准或评估器，如 EvalResearchBench；有的提供可复用工作台或技能库，如 TSFLab、DisCo；有的改变状态或反馈架构，如
    Stateless Language Agents、Online Surrogate Repair。
  - 趋势演进：在 2024–2026 前沿内，研究正从单一编码智能体走向自改进工作台、预算感知反馈采样、经验复用和递归评估设计。
  - 开放问题：固定预算下基准提升能否预测真实研究效用；异质任务套件与隐藏目标如何公平比较；基础设施或技能带来的收益有多少来自底层模型。
  literature_review:
    line_of_work_matrix:
    - line: State and representation modeling
      what_it_solves: Turns raw experimental trajectories, repository knowledge, and
        agent histories into compact reusable research state or experience.
      what_remains_open: Whether compressed or curated state is sufficient beyond
        the evaluated domains and longer horizons.
    - line: Action-conditioned control and planning
      what_it_solves: Connects research-agent decisions to interventions, closed-loop
        feedback, and budget-aware experiment allocation.
      what_remains_open: How much of the measured gain comes from allocation rules,
        surrogate feedback, or task-specific priors rather than the agent itself.
    - line: Evaluation and evidence design
      what_it_solves: Makes autonomous research claims comparable through executable
        benchmarks, development versus sealed/holdout targets, budgets, and metrics.
      what_remains_open: Coverage across tasks and agreement between proxy metrics
        and real research utility.
    - line: Systems and reproducible infrastructure
      what_it_solves: Turns isolated research agents into reusable workbenches, harnesses,
        shared tools, and verified skill libraries.
      what_remains_open: Standardized external validation and maintenance across changing
        repositories, datasets, and user settings.
    - line: Conceptual taxonomy and theory
      what_it_solves: Organizes failure modes and design axes such as state ownership,
        experience reuse, and evaluator construction.
      what_remains_open: Direct empirical validation that these axes predict model
        behavior across heterogeneous benchmarks.
    consensus:
    - The papers treat autonomous research as an iterative search-evaluation loop,
      where candidate changes are generated, scored, and selected under resource constraints.
    - They converge on externalizing durable research knowledge from agent context
      into harness state, experience libraries, or skill bases to reduce redundant
      exploration.
    - They evaluate with final performance on held-out, sealed, or benchmark-suite
      targets, while reporting resource costs such as tokens, oracle queries, or development
      time.
    - Reproducibility signals are often weak or missing in the packet, so code, artifact,
      and limitation claims remain verification gaps rather than established absences.
    disagreements:
    - 'The primary bottleneck is framed differently: context/history management, feedback
      frequency, evaluator quality, or operational skill distillation.'
    - Evaluation settings differ from domain-specific discovery tasks to general ML
      research suites and recursive evaluator construction, so success metrics are
      not directly comparable.
    - 'Feedback strategy differs: some use sparse high-fidelity surrogate repair during
      search, others use inner-fold means, pilot tests, or one-time held-out checks
      after freezing.'
    - Claims about generalization differ in strength, ranging from sealed hidden targets
      and held-out data splits to cross-benchmark score gains under fixed backbones.
    open_questions:
    - Do token-efficiency and task-completion gains transfer to unseen domains, longer
      horizons, and real-world research workflows not covered by current benchmarks?
    - How should agent-generated evaluators be interpreted when target benchmarks
      themselves disagree by roughly 9%?
    - What minimal high-fidelity feedback frequency is needed to keep closed-loop
      search progressing without amplifying surrogate errors?
    - Can distilled skills and accumulated experience libraries be updated safely
      as source repositories and task distributions change?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 表示/状态建模
      解决的问题: 将原始实验轨迹、仓库知识和智能体历史转化为紧凑可复用的研究状态或经验。
      尚未覆盖: 压缩或筛选后的状态在评估域之外及更长时程下是否仍然充分。
    - 路线: 动作条件控制与规划
      解决的问题: 把研究智能体的决策连接到干预、闭环反馈和预算感知的实验分配。
      尚未覆盖: 测得收益有多少来自分配规则、代理反馈或任务特定先验，而非智能体自身。
    - 路线: 评测与证据设计
      解决的问题: 通过可执行基准、开发集与密封/留出目标、预算和指标，使自主研究声明可比较。
      尚未覆盖: 任务覆盖度，以及代理指标与真实研究效用之间的一致性。
    - 路线: 系统与可复现基础设施
      解决的问题: 将孤立研究智能体转化为可复用工作台、运行框架、共享工具和经过验证的技能库。
      尚未覆盖: 跨仓库、数据集和用户设置的标准化外部验证与维护。
    - 路线: 概念分类与理论
      解决的问题: 组织失败模式和设计轴，例如状态持有者、经验复用和评估器构建方式。
      尚未覆盖: 这些分类轴能否预测模型行为仍缺少直接实证验证。
    共识:
    - 这些工作都把自主研究视为迭代的搜索-评估循环：在资源约束下生成、评分并选择候选变化。
    - 它们一致倾向于将持久研究知识从智能体上下文中外部化，放入运行框架状态、经验库或技能库，以减少冗余探索。
    - 它们都使用留出、密封或基准套件目标上的最终性能作为证据，同时报告 token、oracle 查询或开发时间等资源成本。
    - 证据包中可复现信号普遍较弱或缺失，因此代码、工件和局限声明应被视为验证缺口，而不是已证实不存在。
    分歧:
    - 对主要瓶颈的定位不同：上下文/历史管理、反馈频率、评估器质量或操作技能提炼。
    - 评测设置从领域特定发现任务到通用 ML 研究套件和递归评估器构建各不相同，成功指标不可直接比较。
    - 反馈策略不同：有的在搜索过程中用稀疏高保真代理修复，有的使用内部折均值、试点测试或冻结后一次性留出检查。
    - 泛化证据强度不同，从密封隐藏目标、留出数据划分到固定骨干下的跨基准得分提升，各自覆盖不同失败模式。
    开放问题:
    - 当前基准上的 token 效率与任务完成率提升，能否迁移到未见领域、更长时程和真实研究工作流？
    - 当目标基准之间本身就存在约 9% 的不一致时，应如何解释智能体生成的评估器？
    - 维持闭环搜索持续进展所需的最低高保真反馈频率是多少，同时不放大代理误差？
    - 当源仓库和任务分布变化时，提炼出的技能库与积累的经验库能否安全更新？
