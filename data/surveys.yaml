    - 路线: 面向发现智能体的评测环境与基准
      解决的问题: 通过模拟任务、完成指标和科学机器学习基准提升，使发现行为可测量
      尚未覆盖: 指标可能奖励工程技巧而非领域洞察，主题覆盖性和与真实决策效用的一致性未证明
    - 路线: 失败感知记忆与迭代搜索
      解决的问题: 把失败实验转化为可复用记录或树搜索分支，指导后续尝试并降低令牌开销
      尚未覆盖: 迁移证据限于PDE重试/跨任务设置，失败记录跨领域泛化和奖励粒度不明
    共识:
    - 基于LLM的智能体已能执行研究循环的相当部分，包括代码、实验循环和论文初稿。
    - 验证回路、评审批评或失败记忆等反馈机制比普通基线更能改进智能体输出。
    - 评测被视作多维度问题，涵盖任务完成、论文质量、基准提升和运行成本。
    - 现有系统仍表现出不稳定或评估范围较窄，与人类水平或同行评审可靠性相关的证据不完整。
    - 可复现信号在不同论文中不一致，但证据包中缺失工件应视为验证缺口，而非没有代码或数据的证明。
    分歧:
    - 全自动与人机协同不同：部分系统去除人工代码模板并提交生成论文，另一些强调仪表板和回滚以保留人工监督。
    - 评测目标不同：生成论文质量、模拟发现任务完成度或已发表机器学习基准提升，导致成功标准不同。
    - 反馈信号不同：自动LLM评审、VLM评审反馈、负知识记忆、智能体树搜索和专家评审偏好不可互换。
    - 领域范围不同：应用数学定理证明、机器学习子领域、模拟科学主题和PDE任务施加不同约束。
    - 进展归因不同：一些证据把提升归于验证/知识检索，而编码智能体评测把提升主要归于机器学习工程技巧。
    开放问题:
    - 自动评审分数和基准指标是否对应科学新颖性，还是主要反映文风与工程质量？
    - 端到端发现系统能否在单个工作坊投稿或少量内部案例之外稳定通过同行评审？
    - 失败感知记忆和树搜索能否在PDE重试及已展示的机器学习任务之外跨科学领域迁移？
    - 需要哪些标准化外部验证和工件报告，使自动实验智能体在代码、数据、硬件和用户设置间可比较？
    - 哪些人工监督假设是必要的，人类专家应在哪些阶段介入以避免新颖性误判或局部工程塌缩？
