  literature_review:
    line_of_work_matrix:
    - line: Fully automated discovery pipelines
      what_it_solves: Chains idea generation, code implementation, experiment execution,
        analysis, and paper writing into a single automated workflow, reducing human
        effort per research cycle.
      what_remains_open: Output quality is inconsistent; only a fraction of generated
        papers pass peer review, and the pipeline often fails outside the domain it
        was tuned for.
    - line: Verification and self-correction mechanisms
      what_it_solves: Detects and corrects hallucinated results or silent failures
        through internal logic checks, physics-based visual inspection, or verifiable
        report synthesis, increasing trustworthiness of generated claims.
      what_remains_open: Verification coverage is incomplete—e.g., a vision-language
        gate missed 2 of 16 planted failures—and the verifier itself can be fooled
        by plausible but incorrect outputs.
    - line: Discipline-specific adaptation
      what_it_solves: Tailors the generic AI scientist to a particular domain (CFD,
        applied mathematics, biology) by embedding domain knowledge, physical constraints,
        or specialized toolchains, enabling defensible results in those fields.
      what_remains_open: Domain knowledge injection still relies on human curation;
        open-ended discovery of new physical principles remains an unsolved challenge.
    - line: Benchmarking and evaluation frameworks
      what_it_solves: Provides standardized tasks, metrics, and human baselines (e.g.,
        DISCOVERYWORLD, BAISBench) to compare AI scientist systems quantitatively
        and expose their weaknesses.
      what_remains_open: Benchmark tasks simplify real scientific complexity; proxy
        metrics like task completion do not yet align with genuine scientific insight
        or long-term impact.
    - line: Human–AI collaboration modes
      what_it_solves: Defines interaction protocols (e.g., PI–student, seven intervention
        levels) that let human experts guide the agent at critical decision points,
        improving outcomes beyond full autonomy or full manual oversight.
      what_remains_open: The optimal frequency and type of human intervention for
        different research stages are not known; over- or under-supervision can degrade
        performance.
    consensus:
    - All systems use LLMs as the central reasoning engine for scientific workflows.
    - Every system includes some form of result validation or evaluation to counteract
      hallucination.
    - Current AI scientist performance is insufficient for fully reliable autonomous
      discovery; human involvement or verification remains necessary.
    - End-to-end paper generation is a common end goal, but the quality of generated
      manuscripts varies widely.
    disagreements:
    - 'Verification strategy: logic-based self-audit (ReasFlow) vs. physics-aware
      vision gate (AI CFD Scientist) vs. verifiable report synthesis (AutoResearchClaw).'
    - 'Evaluation target: automated reviewer scores (The AI Scientist series) vs.
      standardized benchmark tasks (DISCOVERYWORLD, BAISBench) vs. real peer review
      acceptance (AI Scientist-v2).'
    - 'Domain generality: build a generic framework and then apply it (The AI Scientist,
      AutoResearchClaw) vs. construct a domain-specific system from the start (AI
      CFD Scientist, ReasFlow).'
    - 'Human collaboration model: PI–student metaphor with high-level guidance (ReasFlow)
      vs. multi-mode intervention with seven granularity levels (AutoResearchClaw).'
    open_questions:
    - Can verification gates be designed to catch all critical failure modes without
      blocking novel but unconventional valid discoveries?
    - How well do benchmark scores and automated reviewer metrics predict the actual
      scientific value or reproducibility of a generated study?
    - What is the minimal set of domain-specific components needed to make a generic
      AI scientist competitive with a purpose-built one in a new field?
    - At which stages of the research cycle does human intervention provide the largest
      marginal benefit over full autonomy?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 全自动发现流水线
      解决的问题: 将构思、代码实现、实验执行、分析和论文写作串联为单一自动化流程，降低每个研究周期的人工投入。
      尚未覆盖: 输出质量不稳定，仅部分生成的论文通过同行评审，且流水线在未经调优的领域外经常失败。
    - 路线: 验证与自我纠正机制
      解决的问题: 通过内部逻辑检查、基于物理的视觉检查或可验证报告合成，检测并纠正幻觉结果或静默失败，提高生成声明可信度。
      尚未覆盖: 验证覆盖率不完整——例如视觉-语言门控遗漏了16个植入失败中的2个——且验证器本身可能被看似合理但错误的输出欺骗。
    - 路线: 领域特定适配
      解决的问题: 通过嵌入领域知识、物理约束或专用工具链，将通用AI科学家定制到特定学科（CFD、应用数学、生物学），在这些领域产生可辩护的结果。
      尚未覆盖: 领域知识注入仍依赖人工整理；对新物理原理的开放式发现仍是未解决的挑战。
    - 路线: 基准与评估框架
      解决的问题: 提供标准化任务、指标和人类基线（如DISCOVERYWORLD、BAISBench），以定量比较AI科学家系统并暴露其弱点。
      尚未覆盖: 基准任务简化了真实科学复杂性；任务完成度等代理指标尚未与真正的科学洞察力或长期影响对齐。
    - 路线: 人机协作模式
      解决的问题: 定义交互协议（如PI-研究生、七种干预层级），让人类专家在关键决策点引导智能体，使结果优于完全自主或完全手动监督。
