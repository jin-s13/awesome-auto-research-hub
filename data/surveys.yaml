  related_work_outline_zh:
  - 主流方向：端到端自主研究智能体提出假设、执行实验并生成论文，同时建立基准和有效性门控以评估可靠性。
  - 研究共性：LLM 驱动的构思、编码、执行和写作循环；通过任务完成度、盲测证据成熟度、领域性能或同行式评审进行评测；开放工件以支持可复现性。
  - 关键差异：通用发现框架对比带有确定性或物理感知门控的领域绑定系统；仿真环境对比来自同行评审的盲测任务对比带人类基线的领域数据；LLM 裁判对比任务指标对比人类评审。
