  related_work_outline_zh:
  - 主流方向：以 The AI Scientist、AI Scientist-v2、ReasFlow、AI CFD Scientist 为代表的端到端自主科研写作系统，从想法或实验到完整论文、图表和评审辅助生成。
  - 研究共性：多智能体流水线覆盖构思、执行、写作和评价阶段，并通过验证、有依据的报告、人工协作或失败纠正来提高生成科研传播内容的可信度。
