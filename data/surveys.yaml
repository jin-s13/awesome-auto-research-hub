  related_work_outline:
  - 'Mainstream direction: Autonomous research agents are being built as closed-loop
    systems that connect candidate search, experimental feedback, and verification;
    evaluation is shifting toward held-out transfer, resource-aware query budgets,
    and multi-task research benchmarks.'
  - 'Shared research pattern: Most works propose, evaluate, and select candidate changes
    using explicit feedback, while adding reusable knowledge such as skills, experience,
    or surrogate models to reduce expensive evaluation and improve long-horizon decisions.'
  - 'Key differences: Evidence targets differ across held-out material metrics, regret/oracle-query
    counts, and multi-suite benchmark scores; knowledge sources differ across repository-derived
    skills, accumulated experimental trajectories, and online surrogate repair.'
  - 'Trend evolution: Within the 2024-2026 frontier, work is moving from isolated
    benchmark scores toward combined search, verification, reusable infrastructure,
    and budgeted feedback; recent 2026 entries emphasize held-out transfer and resource
    efficiency.'
  - 'Open questions: Whether benchmark or held-out gains predict real research utility,
    how much improvement comes from agent architecture versus backbone or execution
    budget, and whether skill/surrogate/experience libraries transfer beyond narrow
    material or synthetic settings.'
  related_work_outline_zh:
  - 主流方向：自主研究智能体正被构建为闭环系统，连接候选搜索、实验反馈和验证；评估正在转向留出迁移、资源感知查询预算和多任务研究基准。
  - 研究共性：多数工作对候选变化进行提出、评估和选择，并引入技能、经验或代理模型等可复用知识，以减少昂贵评估并改善长程决策。
  - 关键差异：证据目标在留出材料指标、遗憾/oracle查询次数、多套件benchmark分数之间不同；知识来源在仓库技能、实验轨迹积累和在线代理修复之间不同。
  - 趋势演进：在2024-2026前沿内，研究从单点基准分数转向搜索、验证、可复用基础设施和预算反馈的融合；2026年更强调留出迁移与资源效率。
  - 开放问题：基准或留出增益能否转化为真实研究效用；性能提升来自智能体架构还是主干或执行预算；技能/代理/经验库能否跨材料和合成环境泛化。
  literature_review:
    line_of_work_matrix:
    - line: Closed-loop discovery with held-out verification
      what_it_solves: Deciding whether model, representation, feature, or training-data
        changes remain useful beyond development feedback by freezing selected code
        and evaluating once on unseen data.
      what_remains_open: Evidence is limited to ten Matbench endpoints and one selected
        intervention still fails on the holdout, so transfer beyond composition/structure
        materials tasks remains unverified.
    - line: Online surrogate and feedback scheduling
      what_it_solves: Reducing high-fidelity oracle/experiment cost during long closed-loop
        searches while preserving decision quality by selecting which accumulated
        proposals receive real feedback.
      what_remains_open: Fixed surrogate replacement can leave errors that optimization
        amplifies; results are shown mainly in synthetic and MADE-like workflows with
        limited external validation.
    - line: Operational skill and experience reuse
      what_it_solves: Turning repository-level know-how or prior experimental trajectories
        into reusable, verified skills or experience libraries that improve downstream
        research-agent execution and reduce redundant exploration.
      what_remains_open: Verification coverage across domains is not fully evidenced,
        and fixed-backbone benchmark gains may still confound agent-side skill contribution
        with downstream execution budget.
    - line: Recursive self-auditing and context compression
      what_it_solves: Maintaining evidence, unresolved constraints, and compact improvement
        state over long-horizon research through alternating research and self-improvement
        loops.
      what_remains_open: Detailed limitations and result text are missing from the
        packet; generalization beyond validated synthetic training and selected reasoning/deep-research
        benchmarks is not established.
    - line: Research-agent benchmark comparability
      what_it_solves: Standardizing research-agent evaluation through tasks such as
        academic survey generation and ML research suites, with fixed backbones or
        budgets for fair comparison.
      what_remains_open: Several benchmark-oriented entries in the packet lack visible
        methodology, baseline, metric, and limitation evidence, so task coverage and
        metric validity cannot be independently checked.
    consensus:
    - Most works treat autonomous research as an iterative closed loop of proposing
      candidates, receiving feedback, and selecting or refining changes.
    - High-fidelity experiments, oracle queries, and real evaluations are consistently
      treated as scarce resources that should be scheduled, repaired, reused, or replaced
      with cheaper feedback.
    - Evaluation increasingly uses fixed backbones, fixed budgets, or held-out splits
      to argue that gains come from the agent mechanism rather than from scaling alone.
    disagreements:
    - 'Evaluation target differs: some papers use held-out material-property regression/classification
      gains, some use maximum regret and oracle-query counts, and some use cross-suite
      benchmark score improvements.'
    - 'Reusable knowledge representation differs: repository-derived operational skills,
      accumulated experimental trajectory libraries, and online-updated surrogate
      models encode different forms of agent know-how.'
    - 'Interaction and verification mode differs: some systems rely on recursive self-auditing
      with compressed context, some on frozen-code held-out evaluation after search,
      and some on targeted pilot experiments when historical evidence is insufficient.'
    open_questions:
    - Several benchmark-oriented papers in the packet lack methodology, baseline,
      metric, and limitation evidence, leaving their comparability as a verification
      gap.
    - The relative contribution of agent search, skills, surrogate repair, and backbone
      or execution budget is not consistently isolated across the reported gains.
    - Surrogate repair and experience reuse are validated on narrow materials or synthetic/controlled
      workflows; external validation across domains, hardware, and user settings remains
      missing.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 留出验证的闭环发现
      解决的问题: 通过冻结所选代码并在未见数据上评估一次，判断模型、表示、特征或训练数据变化是否超出开发反馈仍然有效。
      尚未覆盖: 证据仅限十个Matbench端点，且十选一在留出集上失效，跨组成/结构材料任务之外的迁移仍未验证。
    - 路线: 在线代理与反馈调度
      解决的问题: 在长闭环搜索中减少高保真oracle/实验成本，同时通过选择哪些候选进入真实反馈来维持决策质量。
      尚未覆盖: 固定代理替代会留下可被优化放大的误差；结果主要在合成与MADE类工作流中展示，外部验证有限。
    - 路线: 可复用技能与经验积累
      解决的问题: 把仓库操作知识或历史实验轨迹转化为经过验证、可复用的技能/经验库，以提升下游研究智能体执行并减少重复探索。
      尚未覆盖: 跨领域验证覆盖证据不足；固定主干下的benchmark增益仍可能混淆智能体技能贡献与下游执行预算。
    - 路线: 递归自审计与上下文压缩
      解决的问题: 通过研究循环与自改进循环交替，在长程研究中维持证据、未解决约束和紧凑改进状态。
      尚未覆盖: 证据包缺少详细限制和结果文本；在已验证合成训练及所选推理/深度研究基准之外的泛化尚未建立。
    - 路线: 研究智能体基准与可比性
      解决的问题: 通过学术综述生成、ML研究等任务标准化研究智能体评估，并以固定主干或固定预算进行公平对比。
      尚未覆盖: 若干基准类条目在证据包中缺少方法、基线、指标和限制文本，任务覆盖与指标有效性无法独立核验。
    共识:
    - 多数工作把自主研究视为迭代闭环：提出候选、获得反馈、选择或改进变化。
    - 高保真实验、oracle查询和真实评估被普遍视为稀缺资源，需要调度、修复、复用或替代。
    - 评测越来越多采用固定主干、固定预算或留出划分，以论证增益来自智能体机制而非规模扩展。
    分歧:
    - 评测目标不同：有的使用留出材料属性回归/分类增益，有的使用最大遗憾和oracle查询次数，有的使用跨套件benchmark分数提升。
    - 可复用知识表示不同：仓库操作技能库、历史实验轨迹库和在线更新代理模型编码了不同形式的智能体知识。
    - 交互与验证模式不同：递归自审计与压缩上下文、搜索后冻结代码留出评估、历史经验不足时开展定向试点实验。
    开放问题:
    - 若干基准导向论文在证据包中缺少方法、基线、指标和限制证据，其可比性仍属验证缺口。
    - 在报告增益中，智能体搜索、技能、代理修复与主干或执行预算的相对贡献未被一致隔离。
    - 代理修复与经验复用仅在窄材料或合成/受控工作流上验证，跨领域、硬件和用户设置的外部验证仍然缺失。
