      comparable.'
    - 'Generalization strategy differs: some systems target broad machine-learning
      workflows while others ground the pipeline in specific domains such as applied
      mathematics or computational fluid dynamics.'
    open_questions:
    - Can verification gates transfer across modalities and disciplines without domain-specific
      rendering, simulators, or knowledge bases?
    - How well do LLM-based reviewer rubrics and autonomous-research benchmarks predict
      eventual human peer acceptance?
    - What is the minimum human intervention placement required to move from workshop-level
