  related_work_outline:
  - 'Mainstream direction: Scaling and evaluating autonomous research agents by moving
    state out of agent context, reusing prior experience or skills, and testing on
    long-horizon tasks such as coding, materials, and time-series forecasting instead
    of isolated benchmark completions.'
  - 'Shared research pattern: Research is treated as a sequential search process;
    systems compare final performance against token, oracle, or execution budgets,
    and use held-out, sealed, or reproduced baselines to detect overfitting to development
    splits.'
  - 'Key differences: The externalization mechanism varies among harness-owned state,
    experience libraries, distilled repository skills, and online surrogates. Feedback
    fidelity and success metrics also differ across final task score, cost, evaluator
    agreement, and held-out transfer.'
  - 'Trend evolution: Within the 2024-2026 frontier, work shifts from fixed benchmark
    completion toward long-horizon research loops, self-improving workbenches, and
    agent-built evaluator benchmarks.'
  - 'Open questions: Whether benchmark gains transfer to real research, how long and
    how high-fidelity evaluation should be, and which externalized state or knowledge
    representation generalizes beyond the tested domains.'
  related_work_outline_zh:
  - 主流方向：扩展与评测自主研究智能体，重点从单次任务完成转向长程研究循环，并通过外部化状态、经验复用和留出/密封评测控制成本与过拟合。
  - 研究共性：把研究视为序列决策/搜索过程，同时报告最终性能与 token/oracle/执行成本，采用留出、密封或复现式评估来检测对开发集的过拟合。
  - 关键差异：状态与知识外部化机制不同，包括框架持有状态、经验库、蒸馏技能和在线代理修复；反馈精度与评测目标也不同，涵盖性能、效率、评估器一致性和留出迁移。
  - 趋势演进：在 2024-2026 前沿窗口内，工作从固定基准上的智能体完成转向长程研究编排、自改进工作台和让智能体自行构建评估器的评测方式。
  - 开放问题：当前基准收益能否迁移到真实科研；应设置多长评估视界与多高反馈精度；哪种外部化状态或知识表示能在更广泛的领域中泛化。
  literature_review:
    line_of_work_matrix:
    - line: Long-horizon research orchestration and state management
      what_it_solves: Coordinates parallel research workers by moving durable research
        state into a harness and assigning focused role-specific contexts, reducing
        context replay and duplicated work.
      what_remains_open: Evidence is reported mainly on software engineering, kernel
        optimization, and algorithm design tasks; external validation beyond these
        settings remains a verification gap.
    - line: Closed-loop feedback control with surrogate repair
      what_it_solves: Uses sparse high-fidelity evaluations to update a cheap surrogate
        during long closed-loop searches, reducing oracle queries and decision regret
        without per-episode high-fidelity feedback.
      what_remains_open: Generalizability beyond controlled synthetic settings and
        the MADE benchmark is not established, and fixed surrogate replacement may
        leave persistent model errors.
    - line: Evaluation design and agent-generated feedback benchmarks
      what_it_solves: Tests whether agents can design executable evaluators under
        fixed budgets and whether AI-scientist choices survive held-out transfer or
        hidden sealed targets.
      what_remains_open: Generated evaluators still rank below target agreement ceilings,
        and the best development-target evaluator is not necessarily best on sealed
        targets.
    - line: Reusable experience and operational skill distillation
      what_it_solves: Extracts and distills prior experimental trajectories or GitHub
        repository knowledge into reusable experience or verified skills, improving
        research performance while reducing interaction cost.
      what_remains_open: Coverage beyond selected repositories and benchmark suites,
        plus long-horizon accumulation effects across domains, still lacks broad validation.
    - line: Self-improving, agent-agnostic research workbenches
      what_it_solves: Provides shared tools, resources, and maintenance for coding
        agents to reproduce baselines, benchmark methods, and develop new models more
        efficiently.
      what_remains_open: Explicit limitations of the workbench itself and external
        portability across research domains are not fully specified in the available
        evidence.
    consensus:
    - Long-horizon autonomous research benefits from externalizing persistent research
      state or reusable knowledge out of individual agent contexts.
    - Fixed budgets and combined metrics such as final performance plus token, oracle,
      or execution cost help expose efficiency differences that task success alone
      can miss.
    - Held-out, sealed, or reproduction-based evaluation guards against overfitting
      to visible development sets.
    - Research agents need explicit orchestration, feedback, and resource-control
      mechanisms to avoid duplicated work and wasted experimentation.
    disagreements:
    - 'Externalization mechanisms differ: harness-owned search state, accumulated
      experience libraries, distilled repository skills, and online-repaired surrogates
      each externalize different granularities of knowledge.'
    - Feedback strategies vary from per-episode high-fidelity feedback to sparse acquisition-driven
      feedback, targeted pilot experiments, and agent-generated evaluators.
    - Evaluation targets differ across final task score, token/oracle efficiency,
      evaluator pair agreement, held-out transfer, and reproducible task completion.
    - Interaction modes differ among stateless role-specific agents, agent-agnostic
      coding workbenches, and skill-equipped research agents.
    open_questions:
    - Do gains on current research benchmarks transfer to real scientific discovery
      outside the tested coding, materials, and time-series settings?
    - Can agent-built evaluators close the gap to target-benchmark agreement ceilings
      without overfitting development targets?
    - Which externalized state or knowledge representation best supports generalization
      across longer horizons and domains?
    - What failure modes emerge in multi-domain or resource-constrained deployments
      not covered by the current evidence packet?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 长程研究编排与状态管理
      解决的问题: 将持久研究状态放在框架中，每次给智能体聚焦的角色上下文，减少历史重放和重复实验。
      尚未覆盖: 现有证据主要集中在软件工程、内核优化和算法设计任务，跨领域外部验证仍是缺口。
    - 路线: 闭环反馈控制与在线代理修复
      解决的问题: 在长闭环搜索中用稀疏高保真评估更新代理模型，减少 oracle 查询和决策遗憾。
      尚未覆盖: 受控合成环境和 MADE 之外的泛化性未被证明，固定代理替换可能留下持续模型误差。
    - 路线: 研究评测与智能体生成反馈基准
      解决的问题: 检验智能体能否在预算内构建可执行评估器，以及 AI 科学家的选择能否在留出或密封目标上存续。
      尚未覆盖: 生成评估器仍低于目标一致性上限，开发目标最优不保证密封目标最优。
    - 路线: 可复用经验与操作技能蒸馏
      解决的问题: 从实验轨迹或 GitHub 仓库中提取可复用经验或已验证技能，提升研究表现并降低交互成本。
      尚未覆盖: 所选仓库和基准之外的领域覆盖以及跨领域长期积累效果仍缺少验证。
    - 路线: 自改进、智能体无关的研究工作台
      解决的问题: 为编码智能体提供共享工具和资源，支持复现、基准测试与新方法开发，提升完成率并降低成本。
      尚未覆盖: 工作台本身的显式局限性和跨研究领域的可移植性在证据中尚未充分说明。
    共识:
    - 长程自主研究需要把持久研究状态或可复用知识从单次智能体上下文中外部化。
    - 固定预算下同时比较最终性能与 token/oracle/执行成本，能揭示仅看任务成功会忽略的效率差异。
    - 留出、密封或复现式评估有助于防止对可见开发集的过拟合。
    - 研究智能体需要明确的编排、反馈和资源控制机制，以避免重复实验和浪费性探索。
    分歧:
    - 外部化机制不同：框架持有搜索状态、经验库、蒸馏技能和在线修复代理分别侧重不同知识粒度。
    - 反馈策略不同：每回合高保真反馈、稀疏采集驱动反馈、按需试点实验和智能体生成评估器对成本-性能权衡不同。
    - 评测目标不同：任务最终分、token/oracle 效率、评估器成对一致性、留出迁移和可复现完成各有侧重。
    - 交互模式不同：无状态角色智能体、智能体无关编码工作台和技能驱动智能体之间的组织方式不同。
    开放问题:
    - 当前研究基准上的收益能否迁移到编码、材料和时序之外的真实科学发现？
    - 智能体生成的评估器如何缩小与目标基准一致性上限的差距？
    - 哪种外部化状态或知识表示最适合跨领域、长程研究？
    - 现有证据未覆盖的多领域或资源受限部署中会出现哪些失败模式？
