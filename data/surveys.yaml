  literature_review:
    line_of_work_matrix:
    - line: Autonomous discovery agent frameworks
      what_it_solves: Automating the cycle from hypothesis or idea generation through
        code, experiments, visualization, and paper writing, reducing cost and human
        execution burden.
      what_remains_open: Whether outputs are consistently defensible under peer review
        or domain validity checks; current systems show partial acceptance and limited
        autonomy in real scientific judgment.
    - line: Evidence-grounded evaluation benchmarks
      what_it_solves: Making discovery-agent claims comparable through tasks, blind
        data, scoring rubrics, and human baselines across scientific domains.
      what_remains_open: Coverage of diverse tasks and agreement between automated
        or LLM-judge scores and real decision utility; reported results often depend
        on a single setting or base model.
    - line: Validation gates and authority separation
      what_it_solves: Preventing silent failures or uncontrolled edits by coupling
        agent cognition to deterministic checks, physics-aware visual inspection,
        or review feedback before accepting results.
      what_remains_open: Verification remains incomplete, as shown by missed silent
        failures, and no standardized external validation covers hardware, datasets,
        and user settings.
    - line: Domain-specific research systems
      what_it_solves: Adapting autonomous research to CFD, forecasting architecture
        evolution, and omics data by combining domain constraints, baselines, and
        task-specific diagnostics.
      what_remains_open: Generalization beyond the demonstrated domains and whether
        domain-specific performance gains come from the agent loop or strong domain
        priors and evaluators.
    - line: Reproducible infrastructure and formalized review
      what_it_solves: Turning isolated model ideas into runnable agents, benchmarks,
        code artifacts, and repeatable evaluation workflows such as simulated peer
        review.
      what_remains_open: Consistent external replication and validation across different
        environments, base models, and publication venues are still not established.
    consensus:
    - Autonomous research agents are evaluated on executed outputs such as task completion,
      evidence quality, result metrics, or manuscript survival, not only generated
      text.
    - Domain tasks require additional validity signals beyond generic success metrics,
      such as physical plausibility, biological human baselines, or deterministic
      programmatic checks.
    - Current agents can execute and document analyses competently but still lack
      reliable controls, robustness, falsifiability, and cross-dataset generalization.
    - Reproducibility artifacts such as tasks, code, datasets, and benchmark protocols
      are treated as central contributions for comparing agents.
    disagreements:
    - 'Evaluation targets differ: virtual discovery environments, blind tasks derived
      from peer-reviewed studies, real single-cell omics data, and domain-specific
      CFD or forecasting optimization.'
    - 'Supervision signals differ: some systems rely on LLM judges or simulated peer
      review; others enforce deterministic authority, physics-aware visual gates,
      or human baseline comparison.'
    - 'Success measures differ: task completion and action relevance, evidence-maturity
      scores, implementation success and token cost, domain metric improvement, or
      workshop peer-review acceptance.'
    - 'Reliability philosophy differs: one route embraces open-ended autonomous generation
      with reviewer filtering; another restricts source edits and promotion through
      deterministic authorities; another interposes vision-language verification before
      accepting results.'
    open_questions:
    - Are automated LLM-judge and simulated-review scores aligned with human scientific
      judgment beyond the specific benchmark tasks?
    - Can verification gates reliably detect most silent failures, and how should
      missed failure cases be audited and reduced?
    - Do evidence-maturity results generalize across base models, scientific domains,
      and reproduction settings?
    - What minimal controls, robustness checks, falsification tests, and generalization
      evidence should be required before an autonomous discovery claim is considered
      trustworthy?
    - Which standardized external validation would close the current verification
      gap across hardware, datasets, venues, and user settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主发现智能体框架
      解决的问题: 自动化从假设或想法生成到代码、实验、可视化和论文写作的完整循环，降低人工执行成本。
      尚未覆盖: 输出是否能在同行评审或领域有效性检查下持续成立；现有系统仅部分通过，真实科学判断仍有限。
    - 路线: 证据锚定的评测基准
      解决的问题: 通过任务、盲测数据、评分规则和人类基线，使科学发现智能体的主张具有跨领域可比性。
      尚未覆盖: 任务覆盖度以及自动/LLM 评分与真实决策效用的一致性；结果常取决于单一设置或基座模型。
    - 路线: 验证门控与权威分离
      解决的问题: 通过确定性检查、物理感知视觉审查或评审反馈，在结果接受前阻止静默失败和不受控编辑。
      尚未覆盖: 验证仍不完整，存在漏检静默失败；跨硬件、数据集和用户设置的标准化外部验证尚未建立。
    - 路线: 领域专用研究系统
      解决的问题: 将自主研究适配到 CFD、预测架构演化和组学数据，通过领域约束、基线和任务诊断提高可靠性。
      尚未覆盖: 展示领域之外的泛化能力，以及领域性能提升有多少来自智能体循环而非领域先验或评测器。
    - 路线: 可复现基础设施与形式化评审
      解决的问题: 将孤立模型思想转化为可运行的智能体、基准、代码工件和可重复的模拟评审或评价流程。
      尚未覆盖: 跨环境、基座模型和发表场所的一致复现与外部验证仍未确立。
    共识:
    - 自主研究智能体通过已执行产物评估，包括任务完成、证据质量、指标结果或论文存活，而不仅是生成文本。
    - 领域任务需要通用成功指标之外的额外有效性信号，例如物理合理性、生物学人类基线或确定性程序检查。
    - 当前智能体能胜任分析与记录，但普遍缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 代码、任务、数据集和基准协议等可复现工件被视为比较智能体的核心贡献。
    分歧:
    - 评测目标不同：虚拟发现环境、同行研究盲任务、真实单细胞组学数据，以及 CFD 或预测优化的领域专项任务。
    - 监督信号不同：LLM 裁判或模拟同行评审、确定性权威、物理感知视觉门控，或人类基线比较并存。
    - 成功度量不同：任务完成和动作相关性、证据成熟度分数、实现成功率和 token 成本、领域指标提升，或工作坊同行评审接受。
    - 可靠性哲学不同：一条路线开放生成并用评审过滤，另一条通过确定性权威限制编辑和晋升，还有路线在结果接受前引入视觉语言验证。
    开放问题:
    - 自动 LLM 裁判和模拟评审分数在特定基准之外是否与人类科学判断一致？
    - 验证门控能否可靠检测大多数静默失败，漏检案例如何审计和减少？
    - 证据成熟度结果能否跨基座模型、科学领域和复现设置泛化？
    - 在自主发现主张被认为可信之前，至少应要求哪些对照、稳健性检验、可证伪性测试和泛化证据？
    - 怎样的标准化外部验证可以弥合当前硬件、数据集、发表场所和用户设置之间的验证缺口？
