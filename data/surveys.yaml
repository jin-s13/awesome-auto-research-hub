  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research workflow agents
      what_it_solves: Integrates idea generation, code execution, experiment management,
        visualization, and manuscript writing in one loop.
      what_remains_open: Success is inconsistent and often judged by automated reviewers;
        controls, robustness checks, and falsifiable contributions remain limited.
    - line: Domain-specific discovery systems with verification gates
      what_it_solves: Adds internal logical review or vision-language physics checks
        to catch silent failures in domains such as applied mathematics and computational
        fluid dynamics.
      what_remains_open: Verification gates still miss some failures and are validated
        in narrow domains; generalization beyond the configured solver or task family
        is unclear.
    - line: Benchmark environments for open-ended scientific discovery
      what_it_solves: Creates standardized tasks and metrics for hypothesis formation,
        experimentation, and conclusion-making without simply reproducing a known
        result.
      what_remains_open: Strong prior agents still struggle on discovery tasks, but
        benchmark performance may not translate to real scientific utility or novelty
        outside the task distribution.
    - line: Evidence-grounded evaluation and automated review
      what_it_solves: Uses LLM judges or simulated review to score papers, evidence
        maturity, auditability, and novelty at scale.
      what_remains_open: Scores plateau across coding agents, and proxy metrics remain
        insufficient for claims about true scientific judgment or cross-setting trustworthiness.
    - line: Collaborative human-AI role decomposition
      what_it_solves: Frames the human researcher as principal investigator and the
        agent as graduate student to reduce expert intervention while preserving oversight.
      what_remains_open: Human oversight is still needed for defensible claims, and
        the division of labor is not yet validated across scientific fields.
    consensus:
    - 'Autonomous research systems converge on a similar agentic loop: formulate,
      implement, execute, visualize, write, then evaluate or verify.'
    - Automated evaluation is treated as necessary for scale, but evidence-maturity
      results show agents plateau and lack discriminating scientific actions.
    - Domain-agnostic workflows are insufficient for defensible claims in technical
      domains without verification gates; domain-aware systems improve validity but
      are not fully reliable.
    disagreements:
    - 'Evaluation targets differ: some systems optimize generated-manuscript peer-review
      or workshop acceptance, while others assess hidden-claim task completion or
      evidence maturity.'
    - 'Verification mechanisms differ: internal logical review, vision-language physics
      checks of rendered flow fields, or fixed LLM rubrics applied to output artifacts.'
    - 'Deployment roles differ: fully autonomous systems, principal-investigator and
      graduate-student collaborative control, and benchmark-only evaluation without
      end-to-end paper generation.'
    open_questions:
    - Which verification signals are necessary and sufficient for reliable autonomous
      scientific claims, and how should verification failures be measured?
    - Do current evidence-maturity metrics or automated reviewers predict genuine
      scientific contribution, or only stylistic completeness and documentation quality?
    - Can domain-specific verification gates generalize across solvers, datasets,
      and fields without hand-coded physics or logic checks?
    - How can agents be induced to consistently produce controls, robustness tests,
      falsifiable hypotheses, and cross-dataset validation?
