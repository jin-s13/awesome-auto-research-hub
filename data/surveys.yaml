      尚未覆盖: 可靠性不一致：某系统三篇论文仅一篇过同行评审，物理门遗漏16个静默失败中的2个；评测设置仍较窄。
    - 路线: 模拟与领域特定发现基准
      解决的问题: 提供可重复任务、指标和人类基线，测试虚拟、组学及盲审同行研究任务中的发现循环与科学推理。
      尚未覆盖: 当前智能体平台期或未完全自主；性能常依赖单一冻结基座模型或有限的内部案例。
    - 路线: 基于证据的评估与验证
      解决的问题: 通过自动LLM裁判、视觉-语言物理门或模拟同行评审评估生成主张的证据成熟度、有效性和论文质量。
      尚未覆盖: 验证器仍会漏检失败，且无法保证对照、稳健性、可证伪性或跨数据集泛化；与人类判断的对齐仅部分验证。
    共识:
    - 自主研究系统共享从提出想法到撰写的循环：生成假设、运行实验或仿真、分析结果并撰写输出。
    - 评估正嵌入研究循环，通过自动裁判、基准和验证门进行，而不是事后外部处理。
    - 当前智能体能够熟练执行并记录分析，但尚不是可靠的自主科学发现者。
    - 基于证据的基准显示，在需要对照、稳健性和可证伪性的任务上，智能体性能停滞或不足。
    分歧:
    - 评测目标不同：通用机器学习发现、领域特定的CFD或单细胞组学发现、基于文本的虚拟任务。
