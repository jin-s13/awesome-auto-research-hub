    研究路线矩阵:
    - 路线: 端到端自主发现工作流
      解决的问题: 把想法生成、代码执行、实验结果分析到论文撰写的完整实验循环自动化，减少人工干预。
      尚未覆盖: 在模板或狭窄设置之外成功不稳定；难以区分研究洞见与工程技巧。
    - 路线: 评测环境与发现测试集
      解决的问题: 用标准化任务、参数变化、基线和指标评估完整发现能力，揭示智能体失败模式。
      尚未覆盖: 领域覆盖有限；代理指标或自动评审与真实科学效用的一致性尚未建立。
    - 路线: 失败感知记忆与自我验证
      解决的问题: 记录失败尝试并审计逻辑连贯性，使智能体能在迭代中纠正错误、避免重复失败。
      尚未覆盖: 证据集中于PDE和科学智能体设置；长期记忆检索、跨领域迁移及与其他编排方法整合仍开放。
    - 路线: 人机协同编排与基础设施
      解决的问题: 把自主智能体组织为可监控、可回滚、可恢复的研究团队，并通过代码工具连接本地代码库和数据集。
      尚未覆盖: 仅基于少量内部案例研究；跨硬件、数据集和用户设置的标准化外部验证不足。
    共识:
    - 研究集中在打通从假设或想法生成、编码、实验执行、分析到论文撰写的完整循环。
    - 迭代反馈机制被普遍视为关键：自动审稿、内部验证或失败记忆被用于修正后续实验。
    - 自动评估广泛使用，但方式多样，包括基于LLM的评审、任务完成指标和专家评审偏好。
    - 系统仍不稳定且评估范围窄；可见证据常缺少外部验证、领域多样性或清晰局限性分析。
    分歧:
