  related_work_outline_zh:
  - 主流方向：构建端到端自主科研智能体，贯通想法生成、实验/代码执行、分析和论文撰写，并加入自动评审或验证环节。
  - 研究共性：把科学发现拆成可由智能体执行的阶段，并用 LLM/VLM 裁判、证据成熟度标准、基准任务或领域有效性门控来评估产出。
  - 关键差异：通用机器学习研究流程与面向应用数学/CFD等领域的受限发现路径不同；评测目标涵盖同行评审、评分、任务完成和物理指标。
