    - 路线: 可靠性与对抗评测
      解决的问题: 评估自动化审阅及相关智能体流程在对抗性文本攻击或基准压力下的脆弱性。
      尚未覆盖: 对抗鲁棒性证据尚未与真实审阅质量、专家接受度或决策效用建立联系，缺少统一评测协议。
    共识:
    - 研究普遍使用 LLM 编排的智能体来规划互补子查询、提取证据并合成输出，而非依赖单步检索。
    - 引用质量是反复出现的评测目标，通常通过 Citation F1 或与专家共识的一致性来衡量。
    - 文献综述自动化被视为横跨检索、证据基础、写作和审阅的集成问题，组件集成仍是核心挑战。
