      尚未覆盖: 现有结论来自单一冻结基座模型，缺乏统计上可靠的两两区分；代理指标尚未证明能预测真实科学判断。
    共识:
    - 多数系统把科学发现建模为假设提出、实验或推导、结果分析、手稿或报告生成的迭代闭环。
    - 自动评测被广泛用于扩展评估规模，但LLM评审、任务指标和证据评分仍只是代理指标，尚未等同于真实科学效用。
    - 智能体能够执行并记录分析，但要形成可辩护主张，仍需加强对照、稳健性、可证伪性和泛化行为。
    分歧:
    - 表示与验证机制不同：有的使用多智能体知识检索和内部逻辑审计，有的使用智能体树搜索，有的使用领域专用视觉-语言物理验证门控。
    - 监督与交互模式不同：一条路线采用人类PI与智能体协作，一条路线追求全自动生成，基准路线则评估冻结智能体并减少人类反馈。
    - 评测目标不同：模拟评审或工作坊同行评审、虚拟发现环境任务完成、盲证据成熟度评分分别衡量不同能力。
    开放问题:
