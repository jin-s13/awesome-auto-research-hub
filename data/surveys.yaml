    - 当前基于LLM的AI科学家在端到端完全自主科学发现方面仍有显著不足，尤其在实验设计、科学品味和可靠性方面。
    - 标准化评估环境和基准对于衡量进展至关重要，但现有基准尚未捕捉到真实科学探究的全部复杂性。
    - 可复现性和验证机制（代码执行、物理合理性检查、基于事实的报告）是提升AI生成科学可信度的关键方向。
    - 人类专家评审或基线仍是判断AI生成科学产出质量的主要参考。
    分歧:
    - 评估范围：部分工作聚焦于窄领域特定验证（如CFD壁面剪切应力、单细胞注释），而另一些则面向通用机器学习或多领域基准。
    - 验证策略：事前有效性门控（视觉-语言物理检查）与事后多假设失败归因和自我纠正，以及仅做分析性失败模式记录而无纠正行动。
    - 交互模式：单代理流水线、可配置的多智能体团队与实时仪表板，以及人工介入监控，反映了对研究流程编排的不同假设。
    - 成功标准：被接收的工作坊论文、相对于基线的提升、包含指标产出的比例、工件质量分数和盲评专家偏好等被分别使用，缺乏对“有意义的科学贡献”的统一界定。
    开放问题:
