  related_work_outline:
  - 'Mainstream direction: Autonomous multi-agent workflows dominate the top-ranked
    evidence, coupling literature retrieval and synthesis with verification, hypothesis
    generation, experimentation, and manuscript writing.'
  - 'Shared research pattern: Work repeatedly combines LLM agents, self-critique or
    verification loops, retrieval, and evaluation by LLM rubrics, hidden evidence
    tasks, or human baselines.'
  - 'Key differences: Contributions split among end-to-end discovery systems, evidence-grounded
    benchmarks, survey taxonomies, failure-mode analysis, and domain-agnostic self-evolving
    frameworks.'
  - 'Trend evolution: Top-ranked evidence is concentrated in 2025-2026, shifting from
    isolated research-paper attempts toward reusable frameworks and stricter evidence-oriented
    evaluation.'
  - 'Open questions: Cross-base-model and cross-domain evidence maturity, verification
    of literature synthesis claims, and durable reduction of recurring pipeline failures
    remain unresolved.'
  related_work_outline_zh:
  - 主流方向：顶层证据以自主多智能体流程为主导，将文献检索与综述、验证、假设生成、实验执行和论文撰写耦合。
  - 研究共性：多个工作组合LLM智能体、自批评或验证循环、检索增强，并以LLM量规、隐藏证据任务或人类基线进行评测。
  - 关键差异：工作分为端到端发现系统、证据驱动基准、综述分类、失败模式分析和领域无关自演化框架。
  - 趋势演进：顶层证据集中在2025-2026年，前沿从孤立研究论文尝试转向可复用框架和更严格的证据导向评测。
  - 开放问题：跨基座模型与领域证据成熟度、文献综述主张验证、以及反复流水线失败的持久缓解仍然未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end agentic discovery and manuscript generation
      what_it_solves: Produces complete research papers by combining literature synthesis,
        reasoning, theorem proving, experimentation, and writing with internal verification
        and knowledge retrieval.
      what_remains_open: Reported success relies on LLM-based rubric review; no limitation
        details or external peer-review evidence are present, and generalization beyond
        applied-mathematics-style theory is unverified.
    - line: Evidence-grounded agent evaluation benchmarks
      what_it_solves: Enables automated comparison of AI scientists by using blind
        peer-reviewed tasks, frozen data, scoring rubrics, or published-study questions
        and human baselines.
      what_remains_open: In the available evidence, coding agents plateau near 58-60
        with no reliable pairwise separation; evaluation covers one frozen base model
        or a narrow omics domain, so cross-model and cross-domain validity is unverified.
    - line: Survey and taxonomy synthesis for agentic scientific discovery
      what_it_solves: Organizes agentic systems, capabilities, metrics, frameworks,
        and datasets across scientific domains and identifies challenges such as literature
        review automation, reliability, and ethics.
      what_remains_open: The survey provides categorical synthesis but no direct empirical
        validation that its categories or identified challenges predict system behavior;
        literature review automation remains explicitly unresolved.
    - line: Failure analysis and design principles for autonomous research pipelines
      what_it_solves: Documents recurring long-horizon failures such as training-data
        default bias, implementation drift, memory degradation, overexcitement, insufficient
        domain intelligence, and weak scientific taste.
      what_remains_open: Evidence comes from a small number of end-to-end attempts
        and limited acceptance outcomes, so failure frequency, interaction effects,
        and mitigation effectiveness across models and venues remain uncertain.
    - line: Domain-agnostic self-evolving agent frameworks
      what_it_solves: Provides reusable infrastructure for building scientific agents
        that self-critique, refine hypotheses, and accumulate knowledge with minimal
        domain-specific setup.
      what_remains_open: Reported benchmark wins use fixed datasets and baselines;
        limitations are not stated, and whether self-evolution improves evidence quality
        or real literature synthesis remains unverified.
    consensus:
    - Agentic pipelines are treated as the core abstraction for literature-informed
      scientific work, spanning retrieval, synthesis, reasoning, experimentation,
      and writing.
    - Evaluation is moving toward evidence-focused signals, such as LLM judges over
      blind tasks, rubric-based evidence maturity, and human baseline comparison.
    - Current systems are not yet reliable autonomous scientists; they either plateau,
      fail end-to-end attempts, or lack controls, robustness, falsifiability, and
      cross-task generalization.
    - Human involvement remains important either as principal investigator, reviewer,
      or human baseline, while fully autonomous discovery remains unresolved.
    disagreements:
    - 'Evaluation target differs: complete manuscript quality, evidence maturity from
      withheld conclusions, multiple-choice biological discovery, or benchmark task
      scores.'
    - 'Domain commitment differs: applied mathematics or theory, single-cell omics,
      ML research, or domain-agnostic frameworks; each makes different assumptions
      about literature and data.'
    - 'Interaction mode differs: principal-investigator and agent collaboration, fully
      autonomous attempts, and self-evolving loops that critique and accumulate knowledge.'
    - 'Evidence standards differ: LLM-rubric scores or benchmark improvements, peer-review
      acceptance or failure logs, and human bioinformatician baselines define success
      differently.'
    - 'Literature capability scope differs: some systems treat literature synthesis
      as one stage, while others benchmark discovery end-to-end, leaving literature-review
      reliability often jointly underreported.'
    open_questions:
    - How should literature synthesis claims be verified when automatic judges and
      hidden conclusions are used instead of independent human review?
    - Do evidence-maturity scores remain stable across base models, domains, and task
      formats beyond the single frozen model or narrow omics setting?
    - Which mechanisms reduce recurring failures such as training-data default bias,
      implementation drift, memory degradation, overexcitement, and weak scientific
      taste?
    - Do domain-agnostic frameworks transfer to real literature-heavy tasks if literature
      review automation remains an explicit challenge?
    - Where are missing limitation, code, dataset, and external validation signals
      in top systems, and do they conceal boundary conditions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端智能体发现与手稿生成
      解决的问题: 将文献综合、推理、定理证明、实验和论文撰写整合为统一流程，并通过内部验证和知识检索减少专家干预。
      尚未覆盖: 评价依赖LLM评审量规，未见限制说明或外部同行评审证据；在应用数学类理论之外的可推广性尚未验证。
    - 路线: 证据驱动的智能体评测基准
      解决的问题: 通过盲任务、冻结数据、评分量规或已发表研究问题与人类基线，实现AI科学家的可重复自动比较。
      尚未覆盖: 在现有证据中，编码智能体得分约为58-60且无可靠两两差异；仅覆盖单一冻结基座模型或较窄组学领域，外部效度未知。
    - 路线: 智能体科学发现的综述与分类体系
      解决的问题: 按能力和领域组织智能体系统、指标、框架与数据集，并识别文献综述自动化、可靠性和伦理等挑战。
      尚未覆盖: 分类体系尚未以直接实证证明其能预测系统行为；文献综述自动化仍被明确列为未解决问题。
    - 路线: 自主研究流水线的失败分析与设计原则
      解决的问题: 记录长期研究任务中的反复失败，如训练数据默认值偏见、实现漂移、记忆退化、过度兴奋、领域智能不足和科学品味薄弱。
      尚未覆盖: 证据仅来自少量端到端尝试，失败出现频率、交互效应和跨模型跨场景的缓解效果仍不确定。
    - 路线: 领域无关的自演化智能体框架
      解决的问题: 提供可复用基础设施，使科学智能体能够自我批评、优化假设并积累知识，少量领域配置即可构建。
      尚未覆盖: 基准提升依赖固定数据集和基线；未说明局限性，自演化是否提升证据质量或真实文献综述能力仍待验证。
    共识:
    - 多个工作将文献相关科学研究抽象为智能体流水线，覆盖检索、综合、推理、实验和写作阶段。
    - 评测逐渐转向以证据为中心的信号，例如基于盲任务的LLM评审、证据成熟度量规和人类基线。
    - 当前系统仍不是可信的自主科学家：智能体得分停滞、端到端尝试失败，或缺乏对照、稳健性、可证伪性和跨任务泛化。
    - 人类仍以首席研究员、评审或人类基线等形式介入，完全自主发现尚未成立。
    分歧:
    - 评测目标不同：完整手稿质量、从隐藏结论判断证据成熟度、组学多选题发现或基准任务分数。
    - 领域设定不同：应用数学或理论、单细胞组学、机器学习研究或领域无关框架，各自对文献与数据条件不同。
    - 交互模式不同：首席研究员与智能体协作、完全自主尝试、以及自演化循环中的自我批评与知识积累。
    - 证据标准不同：LLM量规分数、基准提升、同行评审或失败记录、人类基线各自定义不同成功条件。
    - 文献能力范围不同：有的仅把文献综述作为一个阶段，有的端到端评估发现能力，导致文献可靠性常被混合报告。
    开放问题:
    - 当使用自动评审和隐藏结论而非独立人类评审时，如何验证文献综述中的主张？
    - 证据成熟度分数能否在单一冻结基座模型和较窄领域之外保持稳定，并适用于不同任务格式？
    - 哪些机制能减少训练数据默认值偏见、实现漂移、记忆退化、过度兴奋和科学品味薄弱等反复失败？
    - 如果文献综述自动化仍是显著挑战，领域无关框架能否迁移到真实文献密集型任务？
    - 顶级系统中缺失的局限性、代码、数据和外部验证信息，是否掩盖了边界条件？
