    - 'Representation and tooling differ: some systems rely on domain simulators and
      compiled code, while others operate over text, code templates, or structured
      multi-agent debate.'
    open_questions:
    - Can domain-specific verification gates reduce missed silent failures enough
      for deployment outside the demonstrated domains?
    - Do automated review scores and workshop-level acceptance capture long-term scientific
      value or mostly stylistic and task-specific quality?
    - Which human intervention modes improve reliability without adding excessive
      oversight or reducing scalability?
    - Do existing discovery benchmarks measure a shared construct of scientific discovery,
