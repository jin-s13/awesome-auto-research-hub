      解决的问题: 将执行和记录能力与主张有效性分开，基于证据成熟度、可审计性、新颖性和可解释知识评分，无需逐实例人工评审。
      尚未覆盖: LLM裁判可能遗漏静默失败，尚不能保证可信主张所需的判别性行为。
    - 路线: 面向可靠性的智能体编排与领域专用验证门控
      解决的问题: 引入确定性程序权威、源码编辑边界、规范评估或物理与视觉验证门控，降低自主研究失败率并提升实现成功率。
      尚未覆盖: 领域专用门控仍会漏检16个植入静默失败中的2个，且缺少跨硬件、数据集和用户设置的标准化外部验证。
    共识:
    - 自主智能体能够执行和记录分析，但当前系统在科学判断上出现平台期，普遍缺少对照、稳健性、可证伪性和跨数据集泛化。
    - 评估正从只看实现成功转向基于证据的任务，并引入自动评判以及人类或领域专用基线。
    - 开源代码和工件常见，但无法单独弥合执行合理分析与生成可辩护科学主张之间的差距。
    - 近期系统越来越多将LLM推理与确定性或领域专用验证结合，以限制缺少支撑的主张。
    分歧:
    - 评估载体不同：虚拟文本任务、同行评审盲任务、真实单细胞和预测数据、封闭领域流体动力学，分别测量新颖性、证据成熟度、注释支持或领域指标改善。
    - 监督边界不同：一类依赖LLM评审或裁判，另一类使用确定性程序权威控制源码编辑和晋升，还有一类使用视觉语言物理门控。
    - 主张目标不同：工作坊同行评审接受、证据锚定的可审计性，或任务特定架构与预测性能提升。
    开放问题:
    - 自动化LLM裁判是否与跨领域人类同行评审一致，能否检测无支撑或静默错误的主张？
    - 需要多少基座模型和数据集多样性，才能把单一冻结模型或少量案例结果推广为一般科学能力？
    - 基准应如何测量对照、稳健性、可证伪性和跨数据集泛化，而不是只测量执行能力？
    - 在物理门控已漏检植入静默失败的情况下，验证门控如何标准化而不与领域失败模式过拟合？
    - 当前证据主要覆盖技术评估，自主科研系统需要哪些治理、问责和安全机制？
