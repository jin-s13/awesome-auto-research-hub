  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research system design
      what_it_solves: Transforms isolated model ideas into runnable pipelines that
        cover ideation, code implementation, experiment execution, and manuscript
        compilation, enabling fully automatic or minimally supervised paper production.
      what_remains_open: Cross-domain generalization to non-ML sciences, robustness
        against silent failures in generated code or conclusions, and standardized
        external validation under realistic research settings.
    - line: Evaluation and benchmarking for scientific discovery agents
      what_it_solves: Provides tasks, metrics, and environments that make the performance
        of AI scientists comparable, revealing whether an agent can genuinely perform
        novel reasoning rather than memorizing patterns.
      what_remains_open: Coverage of diverse scientific disciplines; alignment between
        proxy metrics (task completion, automated review scores) and actual scientific
        contribution; human baseline calibration for complex discoveries.
    - line: Human-AI collaboration and autonomy calibration
      what_it_solves: Organizes different interaction modes (principal investigator–student,
        on-demand intervention, full autonomy) and identifies decision points where
        human input most improves research quality.
      what_remains_open: Empirical evidence that the proposed collaboration taxonomy
        predicts downstream research success; optimal division of labor across tasks
        and domains remains unquantified.
    consensus:
    - All systems decompose the scientific discovery cycle into a sequence of stages—hypothesis
      generation, experiment design, execution, analysis, and writing—and use large
      language models as the central reasoning and planning component.
    - There is a shared recognition that raw LLM outputs are insufficient for credible
      research; every modern system incorporates some form of verification, whether
      through automated review, logical consistency checks, or physics-based validation.
    - Evaluation is moving away from unvalidated generated papers toward objective
      benchmarks and, in some cases, real peer review, indicating a maturing standard
      for measuring progress.
    disagreements:
    - 'Verification mechanism: ReasFlow relies on an internal logic-style audit, AI
      CFD Scientist uses a vision-language gate that inspects rendered flow fields,
      and AutoResearchClaw adopts a self-healing executor with a pivot/refine loop
      and verifiable result reporting.'
    - 'Autonomy versus collaboration: The AI Scientist and AI Scientist-v2 pursue
      fully automated workflows, while ReasFlow frames the human as principal investigator
      and AutoResearchClaw explicitly compares seven human-in-the-loop intervention
      modes, arguing that targeted collaboration outperforms full autonomy.'
    - 'Domain specificity: AI CFD Scientist and ReasFlow are tailored to a single
      scientific domain (CFD and applied mathematics, respectively), whereas The AI
      Scientist, DISCOVERYWORLD, and BAISBench target general-purpose or multi-domain
      evaluation, leading to different trade-offs in depth versus breadth.'
    open_questions:
    - What is the minimal set of verification gates needed to guarantee that an AI-generated
      paper contains no fundamental logical or empirical errors, and how do we validate
      those gates themselves?
    - How can we design benchmarks that capture the full cycle of scientific discovery—including
      hypothesis refinement and paradigm shifts—rather than isolated task completion?
    - Under what conditions does human intervention significantly improve the quality
      of AI-generated research, and can the optimal collaboration mode be learned
      automatically from task characteristics?
