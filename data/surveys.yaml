    - 路线: 系统与可复现基础设施
      解决的问题: 将智能体工作流打包为可审计、可执行的流水线，产生可重用代码和工件，支持跨环境验证。
      尚未覆盖: 跨硬件、数据分布和用户设置的标准化外部验证；大多数系统缺乏超出报告实验的全面可复现工件。
    共识:
    - LLM作为研究智能体的核心推理和编码引擎。
    - 研究过程被分解为离散步骤（搜索、规划、编码、验证），并利用反馈信号引导智能体。
    - 评估应超越玩具任务，走向真实科学问题解决，尽管实现方式不同。
