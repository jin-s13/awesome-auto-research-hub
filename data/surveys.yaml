      尚未覆盖: 产出的论文很少经过真实同行评审验证；系统难以泛化到理论密集型领域，且容易产生幻觉或不可靠的结论。
    - 路线: 领域特定验证与自我纠错
      解决的问题: 通过内部逻辑检查、物理仿真可视化或可执行代码测试，捕获科学过程中的错误和幻觉。
      尚未覆盖: 验证门控仍会遗漏领域特定失败（如CFD中漏检16个静默失败中的2个），且缺乏通用的跨领域验证框架。
    - 路线: 人机协作框架
