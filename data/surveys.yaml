    - line: End-to-end autonomous research generation systems
      what_it_solves: Automating the full discovery cycle from idea generation and
        code execution to result analysis and manuscript writing, reducing human intervention.
      what_remains_open: Whether outputs are consistent and scientifically novel,
        and whether automated review acceptance transfers to broader peer or real-world
        validation.
    - line: Discovery and experimentation testbeds
      what_it_solves: Providing structured tasks, baselines, and metrics for evaluating
        whether agents complete discovery cycles or improve published scientific ML
        models.
      what_remains_open: Whether task completion and benchmark gains proxy for research-level
        insight or real decision utility; simulated and narrow-domain coverage remains
        incomplete.
    - line: Knowledge and failure memory for research agents
      what_it_solves: Recording retrieved or failed knowledge so agents can avoid
        repeated errors, reduce token use, and transfer lessons across related experiments.
      what_remains_open: Transfer across sufficiently different scientific domains,
        curation quality, and how much improvement comes from the memory layer rather
        than task-specific priors.
