  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous manuscript generation
      what_it_solves: Produces research ideas, code, experiments, visualization, and
        full papers from minimal prompts, compressing the research writing pipeline
        into one agentic run.
      what_remains_open: Reliability beyond workshop-level or narrow technical domains;
        most systems do not consistently produce conference-ready claims or human-accepted
        manuscripts.
    - line: Verification-gated research writing
      what_it_solves: Adds logical, physics-aware, or vision-language checks before
        results are drafted, so generated manuscripts are less likely to report invalid
        or silently failed results.
      what_remains_open: Gates can still miss subtle failures and may be domain-specific;
        evidence does not show a general verification mechanism across fields.
    - line: Human-AI collaborative manuscript drafting
      what_it_solves: Frames generation as principal-investigator/agent or intervention-based
        collaboration, preserving expert judgment at high-leverage decisions while
        delegating execution and drafting.
      what_remains_open: Optimal intervention granularity is unresolved; full autonomy
        and exhaustive oversight both underperform targeted expert involvement in
        available ablation evidence.
    - line: Self-correcting experiment-to-paper pipelines
      what_it_solves: Attributes experiment or code failures to root causes and routes
        corrections, then grounds draft results in measured values to reduce hallucinated
        reporting.
      what_remains_open: Improvements concentrate in code development and execution;
        full scientific writing and conference-ready manuscript quality remain unsolved.
    - line: Automated review and evaluation of generated writing
      what_it_solves: Uses LLM reviewers, rubrics, peer-review proxies, and benchmark
        scores to compare generated papers at scale.
      what_remains_open: Agreement between automated review scores, blind expert review,
        and real scientific contribution is not established across diverse domains.
    consensus:
    - LLM agents can already produce complete scientific manuscripts that cover ideation,
      execution, and writing in constrained settings.
    - Grounding and verification mechanisms improve the trustworthiness of generated
      results compared with unverified autonomous pipelines.
    - Targeted human involvement at high-leverage decision points improves outcomes
      more than full autonomy or step-by-step oversight.
    - Current evidence is mostly limited to workshop-level acceptance, benchmark improvements,
      or LLM-rubric scores rather than broad top-tier publication quality.
    disagreements:
    - 'Autonomy stance: some systems aim for fully automated discovery and drafting,
      while others position the human as principal investigator or intervention point.'
    - 'Verification approach: generic logical coherence checks contrast with domain-specific
      physics or visual gates and multi-hypothesis failure attribution.'
    - 'Evaluation target: LLM-based review rubrics, workshop peer review, and experiment-stage
      benchmarks measure different notions of writing and research quality.'
    - 'Scope: evidence spans applied mathematics, computational fluid dynamics, and
      machine learning subdomains, making cross-domain generalization unsettled.'
    open_questions:
    - How can verification gates be improved when available evidence shows they can
      still miss some silent failures?
    - Can these systems move from workshop-level acceptance or partial pipeline completion
      to consistent conference-ready manuscript quality?
    - How well do automated review scores predict human expert judgment for complete
      scientific manuscripts across domains?
    - What human intervention granularity balances reliability against exhaustive
      oversight?
    - Do reproducibility signals from current reports translate into reusable artifacts
      across external datasets and hardware settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主论文生成
      解决的问题: 从最少提示出发生成研究想法、代码、实验、可视化和完整论文，将科研写作流程压缩为单次智能体运行。
      尚未覆盖: 在工作坊级或窄技术领域之外的可靠性仍不足；多数系统未能一致产出可被人类接受的会议级论文。
    - 路线: 验证门控的科研写作
      解决的问题: 在结果起草前加入逻辑、物理感知或视觉-语言检查，降低生成论文报告无效或静默失败结果的概率。
      尚未覆盖: 门控仍可能漏掉细微失败，且往往面向特定领域；证据未显示可在各领域通用的验证机制。
    - 路线: 人机协作论文起草
      解决的问题: 将生成过程构建为首席研究员/智能体或基于干预的协作，在高杠杆决策点保留专家判断，同时委派执行与起草。
      尚未覆盖: 最优干预粒度尚未解决；现有消融证据显示完全自主和逐步监督均不如精准专家介入。
    - 路线: 从实验到论文的自纠正流水线
      解决的问题: 把实验或代码失败归因到根因并路由修正，再将草稿结果约束到实测值，减少幻觉报告。
      尚未覆盖: 提升主要集中在代码开发与执行；完整科学写作和可投递的稿件质量仍未解决。
    - 路线: 自动评审与生成文本评测
      解决的问题: 使用LLM评审器、评分标准、同行评审代理和基准分数大规模比较生成论文。
      尚未覆盖: 自动评审分数、盲审专家判断和真实科学贡献之间的一致性尚未在不同领域建立。
    共识:
    - LLM智能体已能在受限设置下产出涵盖构思、执行和写作的完整科学论文。
    - 与未验证的自主流水线相比，事实核查和验证机制提高了生成结果的可信度。
    - 在高杠杆决策点的精准人工介入，比完全自主或逐步监督更能改善产出。
    - 当前证据大多限于工作坊级接收、基准提升或LLM评分，而非广泛的顶级期刊或会议质量。
    分歧:
    - 自主程度：部分系统面向全自动发现和起草，另一些将人类作为首席研究员或干预点。
    - 验证方式：通用逻辑一致性检查与领域特定物理或视觉门控、多假设失败归因存在差异。
    - 评测目标：LLM评分标准、工作坊同行评审和实验阶段基准衡量的是不同的写作或研究质量维度。
    - 覆盖范围：证据涉及应用数学、计算流体力学和机器学习子领域，跨领域泛化尚未确定。
    开放问题:
    - 可用证据显示验证门控仍会漏掉部分静默失败，如何进一步降低这类失败？
    - 这些系统能否从工作坊级接收或部分流水线完成提升到稳定的会议级论文质量？
    - 自动评审分数与人类专家判断在不同领域的一致程度如何？
    - 何种人工干预粒度能在可靠性与避免逐步监督之间取得平衡？
    - 当前报告中的可复现信号能否转化为跨外部数据集和设置的可复用工件？
