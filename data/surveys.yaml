      campaigns, and when is human supervision necessary?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究实验室与管线自动化
      解决的问题: 将构思、文献分析、实验设计、执行、解释、手稿起草和溯源记录等完整研究循环转化为可自动化工作流。
      尚未覆盖: 治理、社区协调、已实现原型和经验验证仍然缺失或未解决。
    - 路线: 智能体实验活动编排
      解决的问题: 在计算或物理实验中维持持久优化状态，并将LLM推理与重复的贝叶斯优化或代码编辑循环分离。
      尚未覆盖: 推理成本较高，展示领域仍有限，与人工主导实验效率的比较缺乏标准化。
    - 路线: 仪器与样本的预测数字孪生
      解决的问题: 通过将样本状态表示与仪器或计算基础设施模型配对，预测候选操作的结果、不确定性和风险。
      尚未覆盖: 验证局限于特定模态，仪器模型失配仍存在，未展示超出显微镜或颜色混合场景的迁移。
    - 路线: 自驱动实验室噪声特征检测与恢复
      解决的问题: 基于kNN工作流分析数据集大小、噪声强度、噪声类型和特征分布，检测并纠正实验数据中的噪声特征。
      尚未覆盖: 低强度噪声、离散或窄分布特征，以及DFT和自驱动实验室数据集之外的泛化仍不足。
    - 路线: 自动化发现的综述与议程框架
      解决的问题: 综合机器学习、AutoML、生成建模和自主实验方法，并提出评估与治理的社区方向。
      尚未覆盖: 直接实证验证有限；数据质量、可解释性以及代理指标与真实材料或科学效用之间的对齐仍开放。
    共识:
    - 多项工作都围绕闭环实验展开：提出变更、执行或仿真、依据约束或适应度评估、更新持久状态。
    - 普遍从超参数优化走向更高层的实验设计、解释、模型或实验活动管理。
    - 数字与物理验证并存，但基线标准化、工件发布和可复现证据仍不完整。
    - 人类监督在指导、评审或治理中的作用被多数工作承认，即便系统被描述为自主。
    分歧:
    - 交互方式不同：部分主张完全自主研究实验室，部分保留人类专家进行新颖性评估、反馈或实验活动监督。
    - 表示方式不同：语言代理编辑代码或管理实验活动、学习预测数字孪生、最近邻数据校正各自依赖不同假设。
    - 评测目标不同：推荐系统研究自动化、原子间势训练、显微镜、流动化学、颜色混合和数据清洗基准难以直接比较。
    - 部署假设不同：HPC作业管理、nanoHUB基础设施、物理仪器和纯数字任务对可复现性与扩展性有不同要求。
    开放问题:
    - 哪些评测协议能证明自主实验系统在任务特定评分卡之外仍能产生可复现、可治理且有科学意义的结果？
    - 预测数字孪生和智能体控制器如何跨仪器模态、材料体系和实验室基础设施迁移？
    - 在小样本、窄分布或低强度噪声条件下，噪声检测与闭环优化是否仍可靠？
    - LLM推理在长期物理实验中的成本收益边界在哪里，何时必须保留人类监督？
