      解决的问题: 在多次观察和推理迭代中维持对累积知识和数据的连贯表示，如Kosmos中数据分析智能体与文献搜索智能体之间的共享世界模型。
      尚未覆盖: 学习到的状态在初始数据集和文献的训练分布之外是否仍足够支撑决策，以及在更长发现周期中如何退化。
    - 路线: 动作条件控制与规划
      解决的问题: 将假设生成与实验设计和执行连接起来，使智能体能够规划代码驱动的实验序列，如SR-Scientist的迭代方程优化或OR-Agent的树形研究规划。
      尚未覆盖: 性能提升有多少来自智能体的规划策略，而非底层LLM的推理或领域特定工具，以及规划质量是否跨科学学科泛化。
    - 路线: 评测与证据设计
      解决的问题: 通过ARC-Bench和LABBench2等基准，以及报告陈述准确率或任务成功率等指标，使主张具有可比性，量化自主研究的进展。
      尚未覆盖: 覆盖除已测试的少数领域之外的多样化科学任务，以及代理指标（如报告准确率）与真实世界科学效用或新颖性之间的一致性。
    - 路线: 系统与可复现基础设施
      解决的问题: 将孤立的模型想法转化为可运行的多智能体系统，部分论文提供代码或基准（如LABBench2公开释放）以促进可重复工作流。
      尚未覆盖: 跨不同硬件、数据集和用户设置的标准化外部验证，目前大多数证据来自单一论文的评估环境。
    - 路线: 概念分类与理论
      解决的问题: 将碎片化主张组织为任务边界和评估维度，如AutoResearch AI综述中的五个工作流条件和五个评估维度。
      尚未覆盖: 这些分类（如“Vibe Research”与“AutoResearch”）是否能预测多个系统的行为或发现成功，仍缺少直接实证验证。
    共识:
    - 自主假设生成受益于分解为模块化智能体（文献综述、数据分析、实验设计），这些智能体迭代交互。
    - 基于LLM的智能体需要工具访问（代码解释器、搜索引擎）以将假设建立在数据和文献基础上，而非仅仅依赖参数化知识。
    - 人类协作仍然有价值，通常在高杠杆决策点进行，而非详尽的逐步监督。
    - 当前系统主要通过任务特定基准或端到端报告准确率进行评估，共同关注可验证性和事实正确性。
    分歧:
    - 工作流结构：OR-Agent使用基于树的方法，具有分支和回溯功能，而Kosmos在并行循环中使用共享世界模型，Robin则集成实验室在环进行实验验证。
    - 自主程度：AutoResearchClaw和AutoResearch AI强调人在回路协作作为一个谱系，而Kosmos和SR-Scientist则推动以最少人工输入的完全自主。
    - 评测目标：一些工作关注最终报告准确率（Kosmos），另一些关注基准性能（LABBench2、ARC-Bench），还有一些关注真实世界实验验证（Robin）。
    - 领域通用性：综述和智能体框架声称跨领域适用性，但具体实例在狭窄领域（生物学、符号回归、优化）中测试，不清楚它们如何迁移。
    开放问题:
    - 生成假设的事实准确率（目前Kosmos约为79.4%）如何随规模提升，以及需要哪些校准方法来防止自信的错误陈述？
    - 鉴于OR-Agent的树形方法特定于领域且尚未证明可泛化，什么机制能够可靠地拒绝弱假设并进行回溯？
    - 当新颖性和影响力的真正衡量标准需要长期社区验证时，如何超越代理指标（如报告准确率）来评估开放式发现？
    - 考虑到AutoResearch AI指出自主性仅在结构化、可执行且可快速验证的环境中可信，跨领域自主研究的最低充分条件是什么？
