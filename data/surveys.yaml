  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究工作流
      解决的问题: 将假设生成、代码执行、实验设计、结果分析、可视化和论文撰写整合到单一自动闭环中，降低生成完整研究产物的成本和人工负担。
      尚未覆盖: 跨提交和跨领域的成功一致性不足；验证大多停留在演示级，缺少广泛外部复现和完整会议级证据。
    - 路线: 验证门控的发现系统
      解决的问题: 在接受运行时修正或生成结论之前加入逻辑或物理感知检查，旨在发现求解器级检查或文本检查遗漏的静默失败。
      尚未覆盖: 存在已知漏检，如消融中遗漏植入静默失败；验证仅在特定仿真或形式化领域设置中评估。
    - 路线: 知识型多智能体推理系统
      解决的问题: 面向理论驱动的形式化发现，通过检索、多智能体角色、内部证明或逻辑审计和人类首席研究员协作，减少对开放式编码的依赖。
      尚未覆盖: 评估依赖LLM评审标准，且局限性信息缺失；跨问题、跨评审者和跨人类专家判断的稳健性未得到证明。
    - 路线: 科学发现智能体评测基准
      解决的问题: 提供可复用任务、盲数据和证据成熟度评分，比较智能体在完整发现行为上的表现，而非仅复现隐藏目标研究或评判最终文本。
      尚未覆盖: 报告性能仅基于有限或冻结基座模型；代理指标和LLM裁判与真实科学有效性和真正发现之间的关联仍弱。
    - 路线: 基于搜索的迭代研究优化
      解决的问题: 利用树搜索、管理智能体和多模态反馈迭代假设与论文修改，减少对人类编写代码模板的依赖。
      尚未覆盖: 仅在工作坊级同行评审中得到验证，且提交成功率不均；会议规模泛化和失败模式仍未解决。
    共识:
    - 当前研究普遍把科学发现组织为“提出假设—执行实验—结果分析—验证—论文写作或评审”闭环。
    - 验证、评审或有效性门控被视为让生成结论具备可辩护性的必要机制。
    - 评测正在从只看论文文本质量扩展到任务完成度、证据成熟度和领域物理或逻辑有效性。
    - 当前智能体能胜任分析与记录，但在对照、稳健性、可证伪性和跨数据集泛化等判别性科学行为上仍不足。
    分歧:
    - 评测目标不同：论文质量、任务完成度与解释性知识、盲数据证据成熟度或领域物理误差各有侧重。
    - 验证机制不同：基于LLM评审、逻辑或证明审计、视觉-语言物理门控对失败模式有不同假设。
    - 范围与知识来源不同：通用机器学习发现系统依赖广泛LLM编码能力，领域专用系统引入物理或数学知识与工具。
    - 人机关系不同：一些系统追求全自动生成与评审，另一些将人类设为首席研究员来监督作为研究生的智能体。
    - 成功判据不同：工作坊接受阈值、LLM评分、物理发现指标或判别性证据成熟度分别被用作证据。
    开放问题:
    - 消融已显示验证门控存在漏检时，自动评审与有效性门控可在多大程度上被信任？
    - 证据成熟度和任务完成度基准能否捕获真正的发现，而不只是合格的分析执行？
    - 当前有限基座模型、狭窄领域和少量提交得出的结果能否泛化到更广泛科学任务？
    - 当系统从受控实验走向开放式高风险发现时，应如何划定人类监督边界？
    - 在缺少外部验证证据的情况下，评测应如何分离智能体能力与基座模型能力、搜索策略、领域工具和评分标准设计？
