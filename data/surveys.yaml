  literature_review:
    line_of_work_matrix:
    - line: End-to-end research-loop systems
      what_it_solves: automating the full research cycle from ideation and experiment
        execution to manuscript writing and review
      what_remains_open: whether generated manuscripts and self-evaluated acceptance
        signals correspond to robust, externally valid scientific contributions
    - line: Domain-grounded verification agents
      what_it_solves: adding physics, logic, or literature-based validity checks to
        catch silent errors during autonomous discovery in specialized domains
      what_remains_open: verification gates still miss failure modes and demonstrated
        gains are narrow, with limited evidence of cross-case or cross-domain generalization
    - line: Discovery evaluation environments and benchmarks
      what_it_solves: making scientific discovery agents comparable through task suites,
        completion metrics, and evidence-maturity rubrics
      what_remains_open: single-base-model evaluation, proxy metrics, and uncertain
        link between benchmark performance and real discovery utility
    - line: Automated review and iterative improvement loops
      what_it_solves: scaling quality control and feedback for generated papers or
