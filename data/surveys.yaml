      尚未覆盖: 生成论文得分的提高是否对应真实研究洞见，以及能否迁移到选定 ML 与应用数学之外的环境。
    - 路线: 基准与虚拟评测环境
      解决的问题: 用可比较的发现任务和科学 ML 基准测量任务完成、相关动作、解释性知识和相对已发布基线的提升。
      尚未覆盖: 代理指标可能不对齐真实决策效用，覆盖范围相对实验科学总体仍有限。
    - 路线: 失败感知共享记忆系统
      解决的问题: 把失败尝试转成有界类型记录，使下游代理避免重复错误、提高性能并减少 token 使用。
      尚未覆盖: 迁移主要在同类重试和 PDE 问题上验证，更广泛跨领域和长期新颖性影响未知。
    - 路线: 交互式多智能体研究平台
      解决的问题: 提供可配置角色、实时监控、工件检查、回滚/恢复和本地代码数据集成。
      尚未覆盖: 评测来自少量内部案例；平台成熟度与 AI 研究任务之外的泛化性未验证。
    共识:
    - 自主代理已经能执行从假设到编码、分析、写作的实验循环，但仍需验证、评审或记忆机制提升可靠性。
    - 评测正从静态排行榜转向过程信号，包括任务完成、动作质量、生成论文评审、同行接收或相对已发布模型的提升。
    - 证据多来自狭窄案例或基准套件，外部有效性和真实科学效用仍未解决。
    - 有研究区分工程改进与领域洞见，说明当前系统在新颖性和资源利用上仍不足。
    分歧:
    - 评测目标不同：模拟发现任务、论文评审/同行接收和真实基准提升不可互换。
    - 系统设计重点不同：验证/搜索、交互式人工监督、失败记忆分别针对不同失效模式。
    - 全自动流水线假设较少人工干预，交互式平台假设人类 PI 或操作员可指导和监控运行。
    - 对基准增益的解释不同：一项研究将大部分提升归因于 ML 工程技巧，其他系统则主张自主研究贡献。
    开放问题:
    - 自动评审和任务/基准代理指标是否与同行评审及长期科学影响一致？
    - 失败记忆或结构化搜索能否持续产出完整会议级贡献，而不仅是偶发成功？
    - 这些系统从 ML 或应用数学案例迁移到湿实验、材料或其他实验驱动领域时表现如何？
    - 空白局限性字段和缺失工件链接背后的证据缺口，会如何改变复现性结论？
