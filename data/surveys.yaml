  related_work_outline_zh:
  - 主流方向：2025-2026年的工作正汇聚到自主研究智能体，它们生成假设、执行代码或实验，并利用验证与失败诊断来迭代改进。
  - 研究共性：系统从假设或想法生成进入可执行证据闭环，而不是把提案生成当作孤立文本任务。
  - 关键差异：领域特异性、人机协作程度、验证机制和评测目标各不相同，包括物理感知门控、确定性程序权威和多假设失败归因。
  - 趋势演进：可用证据从2025年的综述与基准构建走向2026年更具自主性、自演化的多智能体流水线；总体仍处于当前前沿。
  - 开放问题：超越精选基准的外部效度、验证门控不完美时的安全可靠性阈值，以及人类监督的最优分配仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Closed-loop autonomous ideation and experimentation
      what_it_solves: Converts hypothesis or idea generation into executable experimental
        modifications, code changes, or parameter searches with reported performance
        evidence.
      what_remains_open: Whether discovered improvements generalize beyond the specific
        benchmark, domain case, or selected baselines used for evaluation remains
        unresolved.
    - line: Verification and failure-attribution gate mechanisms
      what_it_solves: Reduces invalid or hallucinated research outputs by inspecting
        results, attributing failures, and routing corrections before promotion or
        writing.
      what_remains_open: Verification is incomplete under current evidence, for example
        silent failures can still be missed, and cross-domain validity of these mechanisms
        is not established.
    - line: Evaluation and human-referenced evidence design for AI scientists
      what_it_solves: Creates standardized tasks, discovery-oriented questions, expert
        judgments, and human baselines to compare autonomous research systems.
      what_remains_open: Coverage remains limited in size, domain diversity, and alignment
        with real-world discovery utility; missing external validation is a verification
        gap.
    - line: Multi-agent and human-in-the-loop orchestration
      what_it_solves: Organizes role-based debate, self-healing execution, cross-run
        evolution, and targeted human intervention at high-leverage decision points.
      what_remains_open: The optimal granularity and placement of human involvement
        across tasks, cost settings, and autonomy levels is not yet systematically
        established.
    - line: Domain-specific discovery workbenches
      what_it_solves: Embeds hypothesis search, physics-aware verification, or architecture
        evolution into specialized scientific and engineering workflows.
      what_remains_open: Portability to other domains and whether gains arise from
        the general research agent or from domain-specific priors and task tuning
        remain unclear.
    consensus:
    - Systems treat hypothesis generation as part of an iterative evidence loop with
      executed experiments, not isolated text proposals.
    - There is a repeated architecture pattern separating generative or cognitive
      components from deterministic verification, evaluation, or promotion authority.
    - Reliability, hallucinated claims, and silent execution failures are acknowledged
      as central bottlenecks across the evidence.
    - Targeted human collaboration at high-leverage decisions is preferred over either
      complete autonomy or exhaustive step-by-step oversight.
    - Current evidence is strongest for curated benchmarks and internal case studies,
      while external reproducibility and generalization remain incomplete.
    disagreements:
    - 'Verification strategy differs: physics-aware visual gates, deterministic program
      authorities, and multi-hypothesis causal attribution emphasize different failure
      modes.'
    - 'Evaluation target differs: domain-specific case studies such as CFD, omics,
      and forecasting architecture evolution versus broader multi-topic task suites
      and expert judges.'
    - 'Interaction mode differs: some systems are fully autonomous self-correcting
      loops, while others embed human-in-the-loop intervention with multiple oversight
      modes.'
    - 'Scope differs: domain-agnostic foundational frameworks promise broad reuse,
      while tightly coupled domain workflows optimize task-specific baselines and
      diagnostics.'
    - Some systems emphasize task-specific metric gains, while survey or evidence-design
      work emphasizes categorization and gap identification rather than new scientific
      claims.
    open_questions:
    - Can benchmark and case-study improvements transfer to externally validated scientific
      discoveries beyond the selected datasets and baselines?
    - What reliability threshold should verification gates meet when they still miss
      a non-trivial share of silent failures?
    - Which architecture choices produce generalizable research hypotheses rather
      than overfitting to task-specific diagnostics and benchmarks?
    - How should human oversight be allocated as autonomous pipelines become more
      self-evolving and domain-agnostic?
    - Are current reproducibility signals sufficient when several sources lack explicit
      limitation details or standardized external validation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 闭环自主构思与实验执行
      解决的问题: 将假设或想法生成转化为可执行的实验修改、代码变更或参数搜索，并给出报告性能证据。
      尚未覆盖: 所发现的改进能否泛化到特定基准、领域案例或所选基线之外，仍缺乏证据。
    - 路线: 验证与失败归因门控机制
      解决的问题: 通过检查结果、归因失败并在晋升或写作前路由纠正，减少无效或幻觉研究输出。
      尚未覆盖: 当前证据下验证仍不完整，例如静默失败仍可能漏检；这些机制的跨领域有效性尚未建立。
    - 路线: AI科学家评测与人类参照证据设计
      解决的问题: 通过标准化任务、发现导向问题、专家评审和人类基线，比较自主研究系统。
      尚未覆盖: 覆盖规模、领域多样性和与真实发现效用的一致性仍有限；缺少外部验证属于证据缺口。
    - 路线: 多智能体与人机闭环编排
      解决的问题: 组织基于角色的辩论、自愈执行、跨运行演化及在高杠杆决策点的人类干预。
      尚未覆盖: 人类参与的最优粒度和位置尚未在不同任务、成本设置和自主级别上得到系统性确认。
    - 路线: 领域特定发现工作台
      解决的问题: 将假设搜索、物理感知验证或架构演化嵌入专门的科学或工程工作流。
      尚未覆盖: 跨领域可移植性以及增益来自通用研究智能体还是领域先验和任务调优，仍不确定。
    共识:
    - 多数系统把假设生成视为需要执行实验的迭代证据闭环，而非孤立文本提案。
    - 反复出现生成或认知组件与确定性验证、评估或晋升权威分离的架构模式。
    - 可靠性、幻觉结论和静默执行失败被普遍视为核心瓶颈。
