  - 研究共性：把假设生成、执行、分析和撰写的闭环能力作为评估对象，关注证据质量、对照、稳健性、可证伪性和泛化，而非只看最终性能。
  - 关键差异：评测目标涵盖模拟发现任务完成、解释性知识、真实冻结数据的证据成熟度与领域预测改进；可靠性机制包括验证门控、权威分离或模拟评审。
  - 趋势演进：从 2024 年通用自主发现框架和虚拟环境，演进到 2025-2026 年证据锚定基准和带有显式可靠性控制的领域化系统。
