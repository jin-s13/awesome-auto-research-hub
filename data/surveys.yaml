  related_work_outline:
  - 'Mainstream direction: Building end-to-end autonomous research agents that link
    ideation, code or experiment execution, verification, analysis, and manuscript
    generation, increasingly with domain-specific validity gates and agentic search.'
  - 'Shared research pattern: Most systems decompose discovery into LLM-driven agent
    loops, add automated review or verification to catch unreliable results, and evaluate
    outputs through LLM judges, peer-review proxies, or task and evidence benchmarks.'
  - 'Key differences: Evaluation target and domain generality split the field; some
    works score generated manuscripts, others benchmark scientific task completion
    or evidence maturity, and some add mathematical or CFD-specific verification instead
    of general code execution.'
  - 'Trend evolution: Within the 2024-2026 frontier, work moves from general autonomous-framework
    and discovery-environment benchmarks toward 2025 agentic tree search, then toward
    2026 domain-specific physics or math systems and evidence-grounded evaluation.'
  - 'Open questions: Validity of LLM-based review proxies, generalization across domains
    and base models, detection of silent failures, and whether agents can move from
    competent analysis to defensible open-ended claims.'
  related_work_outline_zh:
  - 主流方向：构建端到端自主科研智能体，串联想法生成、代码或实验执行、验证、分析与论文撰写，并逐步加入面向物理或数学的领域验证与智能体树搜索。
  - 研究共性：系统通常把科学发现拆成LLM驱动的智能体闭环，加入自动审查或验证以过滤不可靠结果，并用LLM评审、同行评审代理或任务和证据基准评估。
  - 关键差异：主要分歧在评测目标和领域通用性；有的评估生成论文，有的评估虚拟环境任务完成或证据成熟度，有的引入领域专用验证而非仅通用执行。
  - 趋势演进：在2024-2026前沿期内，研究从通用自治框架和发现环境基准，演进到2025年智能体树搜索，再到2026年面向CFD或数学的领域系统和证据锚定评测。
  - 开放问题：LLM评审代理的有效性、跨领域与跨基座模型的泛化、无声失败检测，以及智能体能否从可用分析发展到可辩护的科学主张。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery pipelines
      what_it_solves: Integrating idea generation, code or experiment execution, analysis,
        visualization, and manuscript writing into an iterative discovery loop.
      what_remains_open: Consistent reliability outside ML-style tasks and whether
        generated papers represent defensible scientific claims rather than plausible
        artifacts.
    - line: Domain-specific AI scientists with verification gates
      what_it_solves: Adding logic-aware or physics-aware verification, knowledge
        retrieval, and solver-level checks to reduce silent invalid results in applied
        mathematics or computational fluid dynamics.
      what_remains_open: Verification gates still miss planted silent failures; evidence
        remains limited to selected case studies, LLM rubric scores, or single-metric
        improvement.
    - line: Agentic tree search and review-refinement loops
      what_it_solves: Reducing dependence on human-authored code templates and improving
        experiment or manuscript quality through experiment managers, VLM feedback,
        and progressive tree search.
      what_remains_open: Peer-review success remains rare and workshop-level; search
        and review improvements have not shown that scientific validity follows from
        accepted formatting or reviewer score.
    - line: Discovery benchmarking and evidence-maturity evaluation
      what_it_solves: Providing task suites and blinded peer-derived tasks to measure
        complete discovery cycles or the evidence quality of claims beyond reproduction
        of hidden target studies.
      what_remains_open: Current coding agents plateau on evidence maturity; benchmarks
        rely on single frozen base models or simulated tasks, and proxy metrics are
        not yet tied to real scientific utility.
    consensus:
    - Systems generally decompose autonomous scientific discovery into ideation, experimentation
      or execution, analysis, and manuscript generation.
    - Automated verification or review gates are treated as necessary because raw
      LLM execution can produce plausible but scientifically invalid outputs.
    - Current evidence shows autonomous agents can perform parts of the discovery
      pipeline, but not yet consistently produce defensible open-ended discoveries.
    - LLM-based rubrics, peer-review proxies, simulated environments, and evidence-maturity
      scores are common evaluation substitutes, but their connection to real scientific
      soundness remains unproven.
    disagreements:
    - 'Works differ on evaluation target: some score full generated papers with LLM
      or peer review, while others score task completion in virtual environments or
      evidence maturity from blinded study data.'
    - 'They differ on deployment domain and verification strategy: some use domain-specific
      logical or physics-aware gates for mathematics or CFD, while general-purpose
      systems rely on broad code execution and automated review.'
    - 'They differ on human role and autonomy: some frame the human as principal investigator
      while the agent acts as graduate student, while others pursue fully automated
      generation with only external review.'
    - Reported success levels conflict because one line claims near-human review scores
      or workshop acceptance, while another finds coding agents statistically indistinguishable
      and lacking controls, robustness, falsifiability, and cross-dataset generalization.
    open_questions:
    - Can domain-specific verification gates extend beyond selected CFD and applied-mathematics
      cases to catch silent failures in broader open-ended discovery tasks?
    - How well do LLM-based review and rubric scores correlate with human peer review
      and with the actual scientific validity of generated claims?
    - Why do coding agents plateau on evidence maturity and largely lack controls,
      robustness, falsifiability, and cross-dataset generalization despite competent
      analysis execution?
    - Can fully autonomous systems achieve consistent peer-review acceptance beyond
      a single workshop-level paper and across different base models or domains?
