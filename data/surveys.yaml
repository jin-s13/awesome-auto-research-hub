  - 主流方向：将文献综述建立在实时数据库检索与证据提取上，并把综述写作分解为多智能体或迭代工作流，同时加强引用证据与评测公平性。
  - 研究共性：利用单个或多个LLM完成检索、组织与综述生成，并用引用、写作质量、相似度、专家一致性等指标对比人类综述或强基线。
  - 关键差异：检索证据层、多智能体生成管线、层级化研究组织、评测认证分别解决不同瓶颈，所需证据类型与基准不同。
  - 趋势演进：2024年侧重层级化研究组织，2025年出现多智能体与迭代文献综述工作流，2026年转向实时数据库知识层与排行榜可采纳性，集中在当前前沿。
