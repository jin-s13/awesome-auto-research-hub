    augmentation strategy—tool libraries, experience evolution, objective-function
    search, or safety reasoning loops.'
  - 'Trend evolution: The frontier (2023–2026) shifted from building foundational
    environments and benchmarks (2023–2024) toward reliability, safety, and deeper
    evaluation of agent reasoning (2025–2026), reflecting a move from “can it do it?”
    to “does it do it correctly and safely?”'
  - 'Open questions: How to verify that an agent''s scientific reasoning is causally
    correct rather than accidentally right; how to generalize safety and evaluation
    from simulated environments to real-world labs; and whether LLM judges can replace
    domain experts for assessing discovery quality.'
  related_work_outline_zh:
  - 主流方向：构建并评估基于大语言模型的自主科学发现智能体，完成从假设形成到实验设计与分析的全流程，并越来越重视安全性、可审计性和评估有效性。
  - 研究共性：采用以LLM推理为核心的多步智能体循环（假设-实验-分析），常辅以工具、记忆或结构化工件，通过任务完成度、科学质量或安全指标衡量成功。
  - 关键差异：评估重点——任务完成 vs. 推理忠实性；部署场景——虚拟文本环境、代码生成基准或湿实验室机器人；增强策略——工具库、经验演化、目标函数搜索或安全推理循环。
  - 趋势演进：当前前沿（2023–2026）从构建基础环境和基准（2023–2024）转向可靠性、安全性和对智能体推理的深层评估（2025–2026），呈现出从“能否做到”到“做得是否正确且安全”的转变。
  - 开放问题：如何验证智能体的科学推理是因果正确的而非偶然正确；如何将安全性和评估从模拟环境泛化到真实实验室；LLM评审能否替代领域专家判断发现质量。
  literature_review:
    line_of_work_matrix:
    - line: Benchmarking and evaluation environments for scientific discovery agents
      what_it_solves: Provides standardized tasks, realistic constraints, and metrics
        to compare end-to-end autonomous discovery agents, revealing their strengths
        and failure modes.
      what_remains_open: Whether proxy metrics (task completion, LLM-judge scores)
        align with real scientific value; generalization from simulated or constrained
        environments to open-ended real-world discovery.
    - line: Agent architectures with structured reasoning and auditability
      what_it_solves: Enables agents to form auditable research questions, evolve
        their strategies through experience, or automatically design objective functions,
        making the discovery process more transparent and adaptive.
      what_remains_open: Verification by human domain experts rather than LLM judges;
        whether the agent's internal reasoning genuinely reflects scientific understanding
        or merely mimics surface patterns.
    - line: Safety and reliability mechanisms for autonomous agents
      what_it_solves: Integrates safety reasoning into every stage of the agent pipeline
        or via episodic memory, preventing dangerous actions and detecting compositional
        tool-chain risks that single-step monitors miss.
      what_remains_open: Completeness of safety coverage against novel or emergent
        risks; robustness of safety mechanisms when the agent is deployed in unfamiliar
        laboratory settings.
    - line: Tool augmentation and knowledge distillation
      what_it_solves: Automatically extracts and vets domain-specific code examples
        from scientific repositories, augmenting agents with reliable building blocks
        that improve experimental accuracy and completeness.
      what_remains_open: Generalizability beyond materials science; the moderate agreement
        between LLM-as-a-judge and domain experts limits the reliability of cheap
        proxy evaluation.
    - line: Evaluation methodology beyond task success
      what_it_solves: Introduces dimensions like mechanism fidelity and epistemic
        honesty, and defines failure modes such as "Correct Answer, Wrong Mechanism,"
        challenging the sufficiency of outcome-only evaluation.
      what_remains_open: Large-scale validation; applicability of detection methods
        in open discovery where the correct answer is unknown; the small sample of
        episodes and models examined.
    consensus:
    - LLMs serve as the core reasoning engine for scientific discovery agents.
    - Multi-step interactive environments are necessary to test the full cycle of
      hypothesis formation, experimentation, and conclusion.
    - Safety is a critical requirement for deploying autonomous agents, especially
      in wet-lab or high-stakes settings.
    - Automated evaluation remains challenging, and new metrics beyond task completion
      are needed.
    disagreements:
    - 'Evaluation target: some works prioritize task completion and result correctness,
      while others argue that mechanism fidelity and epistemic honesty are essential
      and that outcome-only metrics are insufficient.'
    - 'Deployment setting: virtual text-based environments, code-generation-only benchmarks,
      and physical wet-lab robots impose different assumptions about agent capabilities
      and risk tolerance.'
    - 'Supervision signal: reliance on LLM judges for quality assessment versus human
      expert evaluation, with disagreement on the reliability of LLM judges as a proxy.'
    - 'Safety integration: safety as a dedicated reasoning loop embedded in every
      stage of the pipeline versus safety as an emergent property of experience evolution
      and memory, reflecting different granularities of control.'
    open_questions:
    - How can we determine whether an agent's scientific conclusion is based on correct
      reasoning rather than a lucky guess, especially in open-ended discovery without
      a known answer?
    - What is the coverage and completeness of current safety mechanisms against emergent
      risks in multi-step tool use?
    - Can LLM judges reliably substitute for human domain experts when evaluating
      the quality of a scientific discovery?
    - How do agents trained or evaluated in constrained virtual environments transfer
      to real-world laboratory settings with unpredictable variables?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 科学发现智能体的基准与评估环境
      解决的问题: 提供标准化任务、现实约束和指标，以比较端到端自主发现智能体，揭示其能力和失败模式。
      尚未覆盖: 代理指标（任务完成度、LLM评审分数）与真实科学价值是否一致；从模拟或受限环境向开放式真实世界发现的泛化。
    - 路线: 具有结构化推理和可审计性的智能体架构
      解决的问题: 使智能体能够形成可审计的研究问题，通过经验演化策略或自动设计目标函数，让发现过程更透明、更具适应性。
      尚未覆盖: 由人类领域专家而非LLM评审进行验证；智能体的内部推理是否真正反映了科学理解，还是仅模仿表面模式。
    - 路线: 自主智能体的安全与可靠性机制
      解决的问题: 将安全推理嵌入智能体流水线的每个阶段或通过片段记忆，防止危险操作，并检测单步监控器遗漏的组合工具链风险。
      尚未覆盖: 对新型或突发风险的安全覆盖完备性；在陌生实验室环境下安全机制的鲁棒性。
    - 路线: 工具增强与知识蒸馏
      解决的问题: 自动从科学仓库中提取并验证领域特定的代码示例，用可靠构建块增强智能体，提高实验的准确性和完整性。
      尚未覆盖: 在材料科学之外的泛化能力；LLM-as-a-judge与领域专家评分的中等一致性限制了廉价代理评估的可靠性。
    - 路线: 超越任务成功的评估方法
      解决的问题: 引入机制忠实性、认知诚实性等维度，并定义“正确答案、错误机制”等失败模式，挑战仅看结果的评估充分性。
      尚未覆盖: 大规模验证；在开放发现中缺乏正确答案时检测方法的适用性；所检验的片段和模型样本量小。
    共识:
    - LLM是科学发现智能体的核心推理引擎。
    - 需要多步骤交互环境来测试假设形成、实验和结论的完整循环。
    - 安全性是部署自主智能体的关键要求，尤其是在湿实验室或高风险场景中。
    - 自动化评估仍具挑战性，需要超越任务完成的新指标。
    分歧:
    - 评估目标：部分工作优先考虑任务完成和结果正确性，而另一些主张机制忠实性和认知诚实性是必不可少的，仅看结果指标不足。
    - 部署场景：虚拟文本环境、纯代码生成基准和物理湿实验室机器人对智能体能力和风险容忍度施加了不同的假设。
    - 监督信号：依赖LLM评审进行质量评估与依赖人类专家评估之间的分歧，LLM评审作为代理的可靠性存疑。
    - 安全集成：安全作为嵌入流水线每个阶段的专用推理循环，与安全作为经验演化和记忆的涌现属性，反映了不同的控制粒度。
    开放问题:
    - 如何判断智能体的科学结论是基于正确推理，而非偶然正确，特别是在缺乏已知答案的开放式发现中？
    - 当前安全机制对多步工具使用中突发风险的覆盖范围和完备性如何？
    - LLM评审能否可靠地替代人类领域专家评估科学发现的质量？
    - 在受限虚拟环境中训练或评估的智能体如何迁移到具有不可预测变量的真实实验室环境？
