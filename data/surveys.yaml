  related_work_outline_zh:
  - 主流方向：构建并评估端到端自主科学发现智能体，以基准、验证门控和人工或自动评审强化证据质量，而非仅追求自动生成论文。
  - 研究共性：系统普遍将想法生成、代码执行、实验分析、报告撰写纳入闭环，并用自动裁判、同行评审、专家判断或人类基线评估主张。
  - 关键差异：评估目标从论文或工作坊接受、任务完成到证据成熟度不等；环境包括虚拟文本、专业模拟、真实组学数据；验证依赖通用LLM裁判、物理感知视觉门控或人类基线。
  - 趋势演进：2024-2026年从自动论文可行性展示转向盲审、证据锚定基准与领域验证，当前前沿聚焦可靠性与可信度。
  - 开放问题：自动裁判与人类效用一致性、跨基座模型泛化、静默失败检测、标准化外部复现与自主研究治理。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Compress ideation, code writing, experiment execution, visualization,
        and paper authoring into an iterative discovery loop.
      what_remains_open: Inconsistent success rates, limited workshop or domain validation,
        incomplete silent-failure detection, and no evidence of full-conference or
        cross-domain trustworthiness.
    - line: Evidence-grounded benchmark suites
      what_it_solves: Make discovery-agent claims comparable through fixed tasks,
        hidden ground truth, scoring rubrics, and human or baseline comparisons.
      what_remains_open: Current results use few base models and domains; proxy metrics
        such as LLM judge scores remain uncalibrated against real decision utility
        and mature scientific judgment.
    - line: Automated verification and review gates
      what_it_solves: Catch invalid or weak outputs before acceptance using LLM judges,
        VLM feedback, or physics-aware field inspection.
      what_remains_open: Verification gates still miss planted failures and may not
        transfer across domains; automated review approximates human review without
        established calibration.
    - line: Reproducible research-infrastructure platforms
      what_it_solves: Convert isolated agent ideas into runnable multi-agent stacks,
        code harnesses, dashboards, and reusable experimental artifacts.
      what_remains_open: External validation beyond internal case studies is absent;
        reproducibility across hardware, datasets, users, and research settings remains
        unmeasured.
    - line: Human-comparison and domain-specific evaluation
      what_it_solves: Anchor AI scientist performance to human baselines, peer review,
        or domain tasks such as cell annotation and CFD discovery.
      what_remains_open: Human baselines are small or narrow; claims of human-like
        or near-human performance lack broad evidence, especially outside the specific
        domains tested.
    consensus:
    - Autonomous research systems can execute and document analyses and can generate
      papers or reports, but they do not yet consistently produce scientifically trustworthy
      claims.
    - Evaluation is moving toward evidence-grounded benchmarks with fixed tasks, hidden
      ground truth, and explicit rubrics rather than only paper acceptance.
    - Automated judges and verification gates are widely used to make evaluation scalable,
      but they are treated as proxies and require human or domain-specific checks.
    - Reproducibility artifacts such as code harnesses and open-source workflows are
      consistently emphasized, though standardization is still missing.
    - Claim validity depends on controls, robustness, falsifiability, and cross-dataset
      generalization, which current agents largely lack.
    disagreements:
    - Some work evaluates success by task completion or evidence maturity, while other
      work evaluates workshop or paper acceptance or expert preference, creating non-overlapping
      notions of capability.
    - Benchmarks differ in whether they withhold prior conclusions and analysis paths
      and whether they use virtual or synthetic tasks, real peer-reviewed data, or
      expert-labeled real datasets.
    - Verification mechanisms range from general-purpose LLM judges to domain-specific
      physics-aware vision gates to human expert baselines, trading domain specificity
      against broad applicability.
    - 'Systems differ on interaction and deployment modes: fully autonomous pipelines
      versus interactive multi-agent platforms with real-time human monitoring and
      rollback.'
    - Evaluation metrics and supervision vary across simulated automated review, peer
      review, human graduate-level baselines, and AI expert judging, each encoding
      different assumptions about scientific quality.
    open_questions:
    - Do automated LLM judges align with human scientific review and real-world decision
      utility across domains?
    - How can silent failures and unsupported claims be detected without domain-specific
      gates that still miss planted failures?
    - Can agent performance generalize across base models, hardware, datasets, and
      research settings when current evaluations often freeze or narrow these factors?
    - What minimum evidence is required, including controls, robustness, falsifiability,
      and cross-dataset replication, for an AI-generated scientific claim to be considered
      trustworthy?
    - How should autonomous research systems be governed and externally audited to
      avoid evaluation bias and overfitting to proxy metrics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究智能体
      解决的问题: 把想法生成、代码编写、实验执行、可视化和论文写作压缩为迭代发现闭环。
      尚未覆盖: 成功率不稳定，验证多在单领域或工作坊级别，静默失败检测不完整，缺少跨领域可信度证据。
    - 路线: 证据锚定基准套件
      解决的问题: 通过固定任务、隐藏真值、评分细则和人类或基线对比让智能体主张可比。
      尚未覆盖: 当前结果仅覆盖少量基座模型和领域；LLM裁判等代理指标尚未与真实决策效用和成熟科学判断校准。
    - 路线: 自动验证与评审门控
      解决的问题: 在产出被接受前用LLM裁判、VLM反馈或物理感知检查拦截无效或弱主张。
      尚未覆盖: 门控仍会漏检植入失败，且跨领域迁移未验证；自动评审对真实人类评审的校准不足。
    - 路线: 可复现研究基础设施平台
      解决的问题: 把孤立智能体想法转化为可运行的多智能体栈、代码工具、看板和可复用实验工件。
      尚未覆盖: 多为内部案例评估，跨硬件、数据集、用户和研究设置的标准化外部验证缺失。
    - 路线: 人类对比与领域特定评估
      解决的问题: 用人类基线、同行评审或细胞注释、CFD发现等领域任务锚定AI科学家表现。
      尚未覆盖: 人类基线规模小或范围窄，近人或类人性能结论缺少所测领域之外的广泛证据。
    共识:
    - 自主研究系统能执行并记录分析，能生成论文或报告，但目前还不能稳定产出具有科学可信度的主张。
    - 评估正从只看论文接受转向证据锚定基准，包括固定任务、隐藏真值、明确评分细则和对照基线。
    - 自动裁判与验证门控被广泛用于扩展评估规模，但仍被视为代理机制，需要人工或领域特定检查。
