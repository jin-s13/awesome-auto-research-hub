  - 主流方向：构建并评测端到端科学发现智能体，重点转向证据锚定、受控且可审计的评估。
  - 研究共性：智能体获得科学目标后执行实验或分析，并以完成度、证据成熟度或安全性评分，常见 LLM 裁判。
  - 关键差异：评测目标涵盖合成发现任务、盲审同行研究、受控 ML 编码和湿实验室执行；表示包括问题证书、代码库、记忆和轨迹风险状态。
  - 趋势演进：从虚拟发现环境（如 DISCOVERYWORLD）演进到盲证据基准、可审计工件、安全感知闭环和可复现编码基础设施。
  - 开放问题：LLM 裁判代理的有效性、跨基座与跨领域迁移、最低安全与可审计要求，以及何种证据可算作真正的科学发现。
  literature_review:
    line_of_work_matrix:
    - line: Discovery-cycle benchmark design
      what_it_solves: provides comparable tasks and automatic metrics for complete
        hypothesis-experiment-conclusion scientific discovery cycles
      what_remains_open: proxy metrics have not been shown to align with real scientific
        judgment, and generalization beyond fixed base models and tasks is unresolved
    - line: Evidence-grounded and auditable reasoning artifacts
      what_it_solves: makes research questions and claims inspectable by capturing
        assumptions, mechanisms, falsifiable hypotheses, and failure-update rules
      what_remains_open: validation currently relies on LLM judges rather than human
        domain experts, and coverage across scientific domains is limited
    - line: Execution infrastructure and code-level constraints
      what_it_solves: supplies vetted domain code libraries or controlled single-GPU/no-internet
        ML tasks to test autonomous coding and experiment execution
      what_remains_open: evaluated domains and task types are narrow, resource restrictions
        may not reflect real workflows, and LLM-as-judge reliability is only moderate
    - line: Closed-loop safe execution and experience evolution
      what_it_solves: integrates planning, safety validation, and reusable memory
        into wet-lab or multi-tool scientific agent trajectories
      what_remains_open: evidence comes from limited task settings, and standardized
        external validation under broader lab conditions or adversarial tool chains
        is missing
    consensus:
    - Current work treats scientific discovery agents as complete research-cycle systems
      rather than isolated model components.
    - 'Evaluation is converging on evidence- and constraint-oriented signals: blind
      tasks, frozen data, auditability, safety gates, and reproducibility controls.'
    - Agents are competent at executing and documenting analyses, but they still lack
      discriminating scientific behaviors such as controls, robustness, falsifiability,
      and cross-dataset generalization.
    - LLM judges are widely used as scalable proxies, but their agreement with domain
      experts is moderate at best.
    disagreements:
    - 'Evaluation target differs: synthetic virtual discovery tasks, blind peer-reviewed
      study conclusions, constrained ML training, and wet-lab robotic tasks are used.'
    - 'Supervision and evaluation signal differ: task completion metrics, LLM-based
      evidentiary maturity rubrics, end-to-end task success, and safety/trajectory
      checks are emphasized differently.'
    - 'Representation differs: structured research-question certificates, distilled
      code libraries, episodic memory, and trajectory-level risk states are adopted
      by different lines.'
    - 'Deployment context differs: text-based simulation, single-GPU/no-internet code
      agents, and real robotic lab execution impose different assumptions.'
    open_questions:
    - Do LLM-judge evidence scores align with human domain judgments and real scientific
      utility across base models and domains?
    - Can agents evaluated in synthetic or constrained settings transfer to open-ended,
      multi-domain scientific discovery?
    - What safety and auditability mechanisms are necessary without limiting exploratory
      scientific reasoning?
    - What evaluation evidence should be required to claim genuine scientific discovery
      rather than competent analysis execution?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 发现循环基准设计
      解决的问题: 为完整的假设-实验-结论发现循环提供可比任务和自动评估
      尚未覆盖: 代理指标尚未证明与真实科学判断一致，且跨固定基座模型和任务的泛化未解决
    - 路线: 证据锚定与可审计推理工件
      解决的问题: 通过记录假设、机制、可证伪假设和失败更新规则，使研究问题与主张可检查
      尚未覆盖: 验证目前依赖 LLM 评审而非人类领域专家，科学领域覆盖有限
    - 路线: 执行基础设施与代码级约束
      解决的问题: 提供经过验证的领域代码库或受控单 GPU/无互联网 ML 任务，以评估自主编码与实验执行
      尚未覆盖: 评估领域和任务类型较窄，资源限制未必反映真实工作流，LLM 评审可靠性仅为中等
    - 路线: 闭环安全执行与经验演化
      解决的问题: 将规划、安全验证和可复用记忆整合到湿实验室或多工具科学智能体轨迹中
      尚未覆盖: 证据来自有限任务设置，缺少更广泛实验室条件或对抗工具链下的标准化外部验证
    共识:
    - 当前工作将科学发现智能体视为完整研究循环系统来评估，而非只评估孤立模型组件。
    - 评估正在向证据与约束导向收敛：盲任务、冻结数据、可审计性、安全门和可复现控制被广泛采用。
    - 智能体在分析和文档执行上较为胜任，但仍缺乏对照、稳健性、可证伪性和跨数据集泛化等判别性科学行为。
    - LLM 裁判被广泛用作可扩展代理，但与领域专家的一致性最多为中等。
    分歧:
    - 评测目标不同：合成虚拟发现、盲审同行研究结论、受控 ML 训练和湿实验室机器人任务并存。
    - 监督与评测信号不同：任务完成度、LLM 证据成熟度评分、端到端任务成功率和安全/轨迹检查各有侧重。
    - 表示方式不同：结构化研究问题证书、蒸馏代码库、片段记忆和轨迹级风险状态被不同路线采用。
    - 部署场景不同：文本模拟环境、单 GPU/无互联网编码智能体和真实机器人实验室执行带来不同假设。
    开放问题:
    - LLM 裁判的证据评分是否能在不同基座模型和领域上与人类领域判断及真实科学效用一致？
    - 在合成或受限环境中评估的智能体能否迁移到开放式、多领域科学发现？
    - 需要哪些安全与可审计机制，既保证安全又不限制探索性科学推理？
    - 何种评估证据应被要求，以宣称真正的科学发现而非仅仅胜任分析执行？
