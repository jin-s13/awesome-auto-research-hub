  - 趋势演进：在2024至2026前沿中，从通用型全自动科研写作，逐步转向领域专用有效性检查、可调试的错误归因，以及与人类专家的轻量协作。
  - 开放问题：自动评审和基准分数能否预测真实同行评审质量；领域验证门控能否跨域泛化；以及需要多少人工干预才能保证可靠稿文。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research-to-manuscript workflows
      what_it_solves: Produce full papers from idea generation through code execution,
        result analysis, and drafting with little or no human intervention.
      what_remains_open: Inconsistent acceptance beyond workshop-level evaluation,
        unclear generalization across disciplines, and incomplete reporting of limitations
        in the evidence packet.
    - line: Domain-specific verification and evidence grounding
      what_it_solves: Add physics, visual, or logical checks before writing so generated
        claims match measured evidence and some silent failures are caught.
      what_remains_open: Verification gaps remain, including planted failures that
        were missed; transfer beyond narrow domains and quantitative metrics is unproven.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Introduce expert oversight at selected decision points to improve
        robustness compared with full autonomy or exhaustive oversight.
      what_remains_open: Optimal intervention modes are not standardized and the cost
        of expert time is seldom measured in the available evidence.
    - line: Evaluation and evidence design for autonomous writing
      what_it_solves: Use benchmarks, rubrics, and failure case analyses to make paper-generation
        quality and failure modes comparable.
      what_remains_open: Small topic counts, proxy review scores, and narrow artifact-quality
        metrics have unclear correlation with real scientific utility or peer review.
    - line: Reproducible research systems and artifacts
      what_it_solves: Provide runnable stacks, code, or repositories that allow autonomous
        research and manuscript workflows to be rerun and inspected.
      what_remains_open: The evidence only partially reports code, dataset, and artifact
        availability; external cross-domain validation across hardware and user settings
        is not yet established.
    consensus:
    - Multi-agent LLM pipelines converge on combining experiment execution with manuscript
      drafting, treating writing as an integrated part of the research loop rather
      than a post-hoc step.
    - Verification or self-correction is treated as necessary for defensible claims,
      whether through review simulation, result grounding, physics/vision gates, or
      structured failure attribution.
    - Recent systems recognize that fully autonomous research writing is brittle and
      that some form of expert or targeted collaboration improves reliability.
    - Evaluation of autonomous writing mixes LLM review rubrics, benchmark success,
      artifact quality, and rare human or workshop peer review, creating comparison
      challenges.
    disagreements:
    - 'Autonomy boundary: some workflows pursue full automation while others insert
      optional or targeted human intervention at high-leverage decision points.'
    - 'Verification strategy: some use LLM-based review or reflection, others use
      domain-specific physics or visual gates, and others use structured multi-hypothesis
      causal failure attribution.'
    - 'Evaluation target: claims range from LLM-rubric acceptance and automated review
      scores to benchmark improvement, artifact quality, and limited peer review,
      making direct comparison difficult.'
    - 'Domain setting: specialized workflows in applied mathematics or computational
      fluid dynamics rely on domain-specific validity checks, while general machine-learning
      workflows aim for broad topic coverage but may lack equivalent claim checks.'
    - 'Reporting grounding: some systems constrain text to measured values to prevent
      hallucinated numbers, while others rely on self-review or iterative search to
      catch reporting errors.'
    open_questions:
    - Do automated reviewer scores or LLM rubrics align with human peer-review acceptance
      and long-term scientific impact?
    - Can domain-specific verification gates be generalized to writing in fields without
      clean quantitative validity checks?
    - What level and timing of human intervention produces the best trade-off between
      autonomy and manuscript trustworthiness?
    - Are benchmark gains such as ARC-Bench improvements or artifact-quality scores
      evidence of better writing, better execution, or only more robust engineering?
    - How should novelty be measured when generated manuscripts appear plausible but
      may be recombinations of known patterns?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究到论文稿生成工作流
      解决的问题: 从想法生成、代码执行、结果分析到草稿写作，在极少人工干预下生成完整论文
      尚未覆盖: 工作坊之外的接收一致性、跨学科泛化以及证据包中局限性报告不完整
    - 路线: 领域特定验证与证据约束
      解决的问题: 在写作前加入物理、视觉或逻辑检查，使生成结论与实际测量一致并捕获部分静默失败
      尚未覆盖: 验证缺口仍存在，如部分植入失败被遗漏；跨领域和跨量化指标的迁移未证明
    - 路线: 人机协作与干预设计
      解决的问题: 在关键决策点引入专家监督，以改善完全自主或逐步监督的鲁棒性
      尚未覆盖: 最优干预模式未标准化，现有证据很少测量专家时间成本
    - 路线: 自主写作的评测与证据设计
      解决的问题: 用基准、评审标准与失败案例分析使论文生成质量和失败模式可比较
      尚未覆盖: 主题数较少，代理评审分数和窄口径工件质量与真实科学效用或同行评审的相关性不清晰
    - 路线: 可复现研究系统与工件
      解决的问题: 提供可运行栈、代码或代码仓库，使自主科研与论文写作工作流可重复运行和检查
      尚未覆盖: 证据仅部分报告代码、数据和工件可获取性；跨硬件与用户场景的外部验证尚未建立
    共识:
    - 多智能体LLM流水线普遍把实验执行与论文稿撰写结合，将写作视为研究循环的一部分，而非事后附加步骤。
    - 要实现可辩护的结论，验证或自我纠正被视为必要，无论采用评审模拟、结果约束、物理/视觉门控还是结构化失败归因。
    - 近期系统承认完全自主的科研写作较为脆弱，某种形式的人类专家或定向协作能提升可靠性。
    - 自主写作评测混合使用LLM评审标准、基准成功率、工件质量和少量人类或工作坊同行评审，导致可比性挑战。
    分歧:
    - 自主边界：部分工作流追求全自动，另一些则在关键决策点插入可选或定向的人工干预。
    - 验证策略：有的采用LLM评审或反思，有的采用领域特定物理/视觉门控，还有的采用结构化多假设因果失败归因。
    - 评测目标：主张范围从LLM评分接受度、自动评审分数到基准提升、工件质量及有限同行评审，直接比较困难。
    - 领域设定：应用数学或计算流体动力学等专用工作流依赖领域有效性检查，而通用机器学习工作流追求广泛主题覆盖但可能缺少对等的声明检查。
    - 报告约束：部分系统将文本约束为实测值以防幻觉数字，另一些则依赖自评审或迭代搜索来捕捉报告错误。
    开放问题:
    - 自动评审分数或LLM评分标准是否与人类同行评审接受度和长期科学影响一致？
    - 领域特定验证门控能否泛化到缺少清晰定量有效性检查的写作领域？
    - 何种人类干预水平与时机能在自主性与论文稿可信度之间取得最佳权衡？
    - ARC-Bench等基准增益或工件质量分数，证明的是写作更好、执行更好，还是仅说明工程更稳健？
    - 当生成论文看似合理但可能是已知模式的重新组合时，应当如何测量新颖性？
