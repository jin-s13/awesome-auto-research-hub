  related_work_outline_zh:
  - 主流方向：使用大型语言模型构建端到端自主研究智能体，自动完成假设生成、实验设计、执行、分析和论文撰写的完整循环。
  - 研究共性：采用多智能体架构，结合验证循环、知识检索和记忆机制，以提升科学推理能力并减少人类干预。
  - 关键差异：自动化范围从理论推导延伸到代码实验；评估依赖自动评审器、人类专家判断或任务完成度指标；交互模式从全自动到人类作为PI、智能体作为研究生的协作模式不等。
  - 趋势演进：领域正从2024年的单智能体框架，向2025–2026年的智能体树搜索、负知识记忆和多智能体平台演进，评估从模拟评审转向同行评审的工作坊接收，但仍处于早期概念验证阶段。
  - 开放问题：这些智能体能否产生真正新颖的科学洞见，而非表面的连贯性？如何泛化到湿实验和物理实验？哪些评估指标与真实科学影响力相关？
  literature_review:
    line_of_work_matrix:
    - line: Full-cycle autonomous experimentation agents
      what_it_solves: Automating the entire research pipeline from idea generation,
        experiment design, code execution, and analysis to paper writing, reducing
        human effort per discovery.
      what_remains_open: Reliance on fixed templates or human-crafted code scaffolds;
        brittle performance across domains (e.g., only 1 of 3 papers passed peer review
        in AI Scientist-v2); limited to simulation or pure ML settings, with no evidence
        of wet-lab or physical experiment integration.
    - line: Memory-augmented and self-improving research agents
      what_it_solves: Enabling agents to learn from failed attempts by storing typed
        negative knowledge records, reducing repeated errors, and improving token
        efficiency on scientific tasks.
      what_remains_open: Validated only on narrow PDE and ScienceAgentBench tasks;
        generalizability to diverse scientific reasoning tasks and integration with
        positive knowledge remain unexplored.
    - line: Benchmarks for evaluating experiment automation agents
      what_it_solves: Providing standardized tasks and metrics for hypothesis testing,
        ablation planning, and scientific discovery to measure agent capabilities
        and reveal gaps versus human experts.
      what_remains_open: Task coverage is limited to virtual environments or AI paper
        ablations; metrics do not capture scientific novelty or real-world impact;
        current agents achieve only 45% recall on ablation identification, far below
        human performance.
    consensus:
    - Large language models serve as the core reasoning engine for automating different
      stages of scientific experimentation.
    - Standardized evaluation is essential to measure progress, and all existing agents
      still significantly underperform human scientists on discovery and planning
      tasks.
    - Multi-agent decomposition, verification loops, and automatic review can improve
      the coherence and completeness of generated research artifacts.
    - Incorporating failure memory or knowledge retrieval consistently improves agent
      performance and efficiency compared to baseline AutoResearch setups.
    disagreements:
    - 'Automation scope: some systems target only theoretical derivation and paper
      writing (ReasFlow), while others include end-to-end code execution and experiment
      management (AI Scientist, Claw AI Lab).'
    - 'Evaluation signals: approaches range from LM-based automatic reviewers and
      simulated peer review to task-completion metrics and human expert judgements,
      with no consensus on which proxy best predicts true scientific quality.'
    - 'Interaction mode: ReasFlow frames the human as Principal Investigator and agent
      as graduate student, whereas AI Scientist and Claw AI Lab emphasize minimal
      human intervention.'
    - 'Deployment setting: DiscoveryWorld operates in a text-based virtual environment,
      while AI Scientist-v2 and Claw AI Lab run real code in local ML codebases; ReasFlow
      targets pure mathematics domains.'
    open_questions:
    - What evidence is needed to show that machine-generated experiments and papers
      contain genuine scientific insights rather than plausible but superficial narratives?
    - How can experiment automation agents be extended beyond software and simulation
      to physical laboratories and wet-lab protocols?
    - Can negative knowledge or other memory mechanisms transfer across distinct scientific
      domains, and what is the upper bound of self-improvement?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 全循环自主实验智能体
      解决的问题: 自动化从想法生成、实验设计、代码执行、分析到论文撰写的整个研究流程，减少每次发现所需的人类投入。
      尚未覆盖: 依赖固定模板或人类编写的代码脚手架；跨领域性能不稳定（如AI Scientist-v2仅1/3论文通过评审）；限于模拟或纯ML环境，缺乏湿实验或物理实验整合的证据。
    - 路线: 记忆增强和自我改进的研究智能体
      解决的问题: 通过存储类型化的负知识记录，使智能体从失败中学习，减少重复错误，并提高科学任务中的令牌效率。
      尚未覆盖: 仅在狭窄的PDE和ScienceAgentBench任务上验证；对多样化科学推理任务的泛化性以及与正知识的整合尚未探索。
    - 路线: 实验自动化智能体评估基准
      解决的问题: 为假设检验、消融规划和科学发现提供标准化任务和指标，以衡量智能体能力并揭示与人类专家的差距。
      尚未覆盖: 任务覆盖仅限于虚拟环境或AI论文消融；指标未捕捉科学新颖性或真实世界影响力；当前智能体在消融识别上仅达到45%召回率，远低于人类水平。
    共识:
    - 大型语言模型作为核心推理引擎，驱动科学实验不同阶段的自动化。
    - 标准化评估对衡量进展至关重要，现有所有智能体在发现和规划任务上仍显著不如人类科学家。
    - 多智能体分解、验证循环和自动评审可以提升生成的研究成果的连贯性和完整性。
    - 引入失败记忆或知识检索通常比基线AutoResearch设置能提高智能体性能和效率。
    分歧:
    - 自动化范围：部分系统仅聚焦理论推导和论文撰写（ReasFlow），而其他系统包含端到端代码执行和实验管理（AI Scientist, Claw AI Lab）。
    - 评估信号：方法从基于LM的自动评审器和模拟同行评审，到任务完成度指标和人类专家判断，尚未就哪种代理指标最能预测真实科学质量达成共识。
    - 交互模式：ReasFlow将人类定位为首席研究员、智能体为研究生，而AI Scientist和Claw AI Lab强调最小化人类干预。
    - 部署环境：DiscoveryWorld运行在基于文本的虚拟环境中，AI Scientist-v2和Claw AI Lab在本地ML代码库中运行真实代码，ReasFlow则聚焦纯数学领域。
