    - 'The scope of the agent: general-purpose frameworks assume a single system can
      handle multiple research areas, whereas domain-specific agents embed physics
      or biological constraints to improve reliability.'
    - 'The approach to failure: post-hoc analysis documents failure modes after the
      fact, while active self-correction mechanisms attempt to diagnose and fix errors
      during the research loop.'
    - 'The level of autonomy: some systems aim for fully autonomous paper generation,
      while others focus on interactive human-in-the-loop platforms that support rather
      than replace researchers.'
    open_questions:
    - How can we verify the scientific correctness of a novel finding when no human
      gold standard is available, and what is the acceptable false-positive rate for
      autonomous claims?
    - Do proxy evaluation metrics like automated reviewer scores or task completion
      rates correlate with the long-term impact, reproducibility, and truth of the
      generated research?
    - How can domain-specific verification gates (e.g., physics-aware vision-language
      checks) be generalised to fields where visual or physical inspection is not
      straightforward?
    - What are the minimal requirements for an autonomous research system to be considered
      reproducible, and how should we audit code, data, and experimental logs across
      diverse computing environments?
