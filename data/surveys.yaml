  related_work_outline_zh:
  - 主流方向：构建并审计自主科学发现智能体，越来越重视基于证据的评测、可靠性门控和可复现研究基础设施。
  - 研究共性：智能体提出想法、执行代码、分析结果并产出结论；评测方通过盲任务、量规、裁判、同行评审或领域验证对输出打分。
  - 关键差异：评测目标、领域专化、监督方式和可复现证据不同；有的优化论文被接收，有的优化证据成熟度或领域任务成功。
  - 趋势演进：从2024年的通用端到端发现框架，走向2025-2026年的领域专用、工作坊级、多智能体与证据审计系统；2023年在高排序论文中缺少代表证据。
