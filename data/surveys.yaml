  literature_review:
    line_of_work_matrix:
    - line: End-to-end automated discovery-agent systems
      what_it_solves: Completes idea generation, code writing, experiment execution,
        visualization, and manuscript drafting with minimal human intervention.
      what_remains_open: 'Reliability is uneven: only one of three AI Scientist-v2
        submissions passed peer review, and the original framework reported no visible
        limitations.'
    - line: Domain-embedded discovery with verification gates
      what_it_solves: Couples autonomous execution with a domain-specific check, such
        as vision-language inspection of rendered flow fields, to catch silent solver-level
        failures.
      what_remains_open: The validation gate is incomplete, missing 2 of 16 planted
        silent failures, and the available evidence is limited to computational fluid
        dynamics.
    - line: Standardized evaluation environments for discovery agents
      what_it_solves: Provides reproducible task suites such as 120 virtual discovery
        tasks or 40 blind peer-reviewed-study tasks, with automatic metrics and sometimes
        human baselines.
      what_remains_open: 'Construct validity is not established: task completion or
        rubric scores may not measure novel discovery, and reported results rely on
        one frozen base model or single domains.'
    - line: Reliability-control and authority-separation mechanisms
      what_it_solves: Constrains open-ended LLM actions with deterministic program
        authority, canonical evaluation, and promotion decisions to improve implementation
        success and reduce agent-side cost.
      what_remains_open: The approach is demonstrated mainly in iterative forecasting
        architecture evolution; whether the authority boundaries transfer across other
        research workflows is unverified.
    consensus:
    - 'Autonomous research systems increasingly separate generation from verification:
      a model proposes, an execution environment runs, and an external gate or judge
      evaluates.'
    - Evaluation is shifting from simple task success toward evidence quality, requiring
      supportable claims, controls, robustness, falsifiability, and auditability.
    - Hidden conclusions or blind tasks are becoming a shared mechanism to reduce
      reproduction of target answers and focus evaluation on data-supportable discovery.
    disagreements:
    - 'Evaluation target differs: some assess full manuscript or peer-review acceptance,
      some task completion, some evidentiary maturity, some domain-specific physical
      validity, and some architecture evolution performance.'
    - 'Verification mechanism differs: fixed LLM judge vs virtual environment metrics
      vs human expert baseline vs deterministic program authority vs vision-language
      physics gate.'
    - 'Deployment setting differs: general machine learning subdomains, computational
      fluid dynamics, single-cell omics, and time-series forecasting impose different
      validity criteria.'
    open_questions:
    - Do automated judges and rubric scores align with human scientific judgment across
      domains and difficulty levels?
    - Can reliability gates be scaled beyond the demonstrated cases, given that the
      physics gate missed silent failures and other systems lacked visible limitations
      or cross-base-model evidence?
    - What governance boundaries are necessary for open-ended agents to prevent plausible-looking
      but under-controlled or non-robust findings?
