  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: connects idea generation, code or simulation execution, experiment
        management, analysis, and manuscript writing in a single agentic workflow
      what_remains_open: run-to-run consistency and cross-domain reliability beyond
        workshop-level or curated demonstrations
    - line: Domain-specific verification and self-correction
      what_it_solves: adds logical, physical, or result-reporting checks that catch
        invalid derivations, silent simulation failures, or fabricated outputs before
        human review
      what_remains_open: verification gates still miss some failure modes and are
        demonstrated mainly in narrow domains such as mathematics and computational
        fluid dynamics
    - line: Benchmark and virtual environment design
      what_it_solves: creates task suites, metrics, and human baselines for comparing
        discovery agents on full discovery cycles and domain-specific data
      what_remains_open: whether proxy tasks, completion metrics, or multiple-choice
        questions align with real open-ended discovery utility
    - line: Human-AI collaboration and oversight
      what_it_solves: inserts targeted human intervention, structured debate, or principal-investigator-style
        roles to improve robustness beyond full autonomy
      what_remains_open: which intervention modes generalize across domains and how
        to avoid exhaustive step-by-step oversight
    - line: Automated manuscript generation and review
