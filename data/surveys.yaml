  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research-to-manuscript pipelines
      what_it_solves: Reduce human effort in scientific writing by generating ideas,
        code, experiments, and full papers in a single LLM-driven workflow.
      what_remains_open: Acceptance or rubric success relies heavily on LLM or workshop-level
        review; conference-level acceptance and reliability across domains are not
        established.
    - line: Domain-grounded verification before manuscript claims
      what_it_solves: Catch invalid or silently failing results before they enter
        writing through physics-aware, vision-language, or logical consistency checks.
      what_remains_open: Even specialized gates miss failures; evidence shows silent
        failures can still pass, and cross-domain generality remains untested.
    - line: Self-correction and failure attribution for research workflows
      what_it_solves: Convert experiment failures into actionable diagnosis by attributing
        root causes to hypothesis, design, or implementation and constraining reports
        to measured values.
      what_remains_open: Demonstrated on small or custom benchmarks; improved metrics-bearing
        output does not yet prove fully autonomous conference-ready writing.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Position human oversight at high-leverage decisions instead
        of full autonomy or step-by-step supervision, improving benchmark performance
        while retaining control.
      what_remains_open: Optimal intervention patterns are not standardized and evidence
        is limited to a single benchmark comparison.
    - line: Evaluation and reproducibility instrumentation for AI scientists
      what_it_solves: Introduce simulated review, peer review, ARC-Bench, LLM rubrics,
        and artifact scoring to compare generated papers.
      what_remains_open: Most packet entries lack OpenAlex identifiers and several
        limitation fields are blank; shared external validation across metrics, datasets,
        and review settings is missing.
    consensus:
    - Multiple systems decompose research communication into multi-agent stages and
      agree that verification cannot be omitted.
    - LLM/VLM-based review is commonly used as an inexpensive signal for scientific
      writing quality, but no shared standard exists.
    - There is a shared pattern of protecting manuscript claims through gates or grounded
      reporting rather than trusting raw generation.
    - Human involvement is not removed; evidence suggests targeted human collaboration
      at high-leverage points can outperform full autonomy and exhaustive oversight.
    - Open-source or reproducibility artifacts and explicit limitations are reported
      unevenly across systems.
    disagreements:
    - Fully autonomous generation is presented as viable in some work, while another
      line argues it remains inconsistent and requires human-in-the-loop intervention.
    - 'Verification mechanisms differ: domain-specific physics/vision checks, internal
      logical verification, and constrained grounded reporting address different failure
      modes.'
    - 'Success criteria differ: LLM rubric scores and acceptance thresholds are emphasized
      in one line, while others prioritize blind peer review acceptance, benchmark
      gains, or artifact quality.'
    - 'Domain focus differs: general machine learning experimentation, applied mathematical
      derivation, and computational fluid dynamics workflows make different demands
      on writing and verification.'
    - 'The bottleneck is located differently: some systems target idea generation,
      others execution reliability, failure attribution, or writing quality.'
    open_questions:
    - Are LLM/VLM reviewer scores valid proxies for human peer judgment of scientific
      writing and communication?
    - Can domain-specific verification gates be transferred outside their original
      field without missing silent failures?
    - What kind and amount of human intervention yields trustworthy manuscripts without
      falling into full autonomy or exhaustive oversight?
    - Do improvements on ARC-Bench or similar metrics translate into higher acceptance
      rates and reliable reporting in real conferences?
    - Why are limitation sections, OpenAlex identifiers, and code/dataset artifacts
      absent or uneven in several top-scored papers, and how should reproducibility
      be externally validated?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究到论文生成流水线
      解决的问题: 用 LLM 驱动单条流水线完成想法、代码、实验和全文撰写，降低科学写作人工负担。
      尚未覆盖: 接受或评分成功主要依赖 LLM 评审或工作坊级评审，跨领域和会议级可靠性尚未建立。
    - 路线: 面向论文声明前的领域感知验证
      解决的问题: 在结果进入论文前，通过物理感知、视觉语言或逻辑一致性检查捕获无效或静默失败。
      尚未覆盖: 专门化闸门仍会漏检；证据显示静默失败仍可能通过，跨领域泛化未测试。
    - 路线: 研究过程的自我纠正与失败归因
      解决的问题: 把实验失败归因到假设、设计或实现，并将报告限制在实际测量值，减少虚构结论。
      尚未覆盖: 仅在小型或定制基准上展示，指标输出改善尚不等于完全自主的会议级论文写作。
    - 路线: 人机协作与干预设计
      解决的问题: 把人类监督放到高杠杆决策点，避免完全自主或逐步监督，在基准上提升性能。
      尚未覆盖: 最优干预模式未标准化，证据来自单一基准对比。
    - 路线: AI 科学家的评测与可复现基础设施
      解决的问题: 通过模拟评审、同行评审、ARC-Bench、LLM 评分表和工件评分比较生成论文。
      尚未覆盖: 多数条目缺少 OpenAlex 标识符，若干局限性字段为空，缺少跨指标、数据集和评审设置的共享外部验证。
    共识:
    - 多个系统将科研表达拆分为多智能体阶段，并同意验证不可省略。
    - LLM/VLM 评审被广泛用作科学写作质量的低成本信号，但缺乏统一标准。
    - 论文声明需通过闸门或可验证报告保护，而不是直接信任原始生成。
    - 人类参与并未被消除；证据表明高杠杆点的精准人类协作可优于完全自主和逐步监督。
    - 开源或可复现工件和显式局限性报告在各系统之间并不一致。
    分歧:
    - 一些路线追求完全自主生成，另一路线则认为其不稳定并主张人机协作。
    - 验证机制不同：领域特定物理或视觉检查、内部逻辑验证和受限可验证报告针对不同失败模式。
    - 成功标准不同：一线强调 LLM 评分和接受阈值，另一线强调盲审通过、基准增益或工件质量。
    - 领域重点不同：通用机器学习实验、应用数学推导和计算流体动力学工作流对写作和验证要求不同。
    - 瓶颈定位不同：有的侧重想法生成，有的侧重执行可靠性、失败归因或写作质量。
    开放问题:
    - LLM/VLM 评审分数是否为人类同行判断科学写作和表达的有效代理？
    - 领域特定验证闸门离开原始领域后能否泛化，并避免漏检？
    - 什么样的最小人工干预更可能产生可信论文，同时避免完全自主或逐步监督？
    - ARC-Bench 等指标的提升能否转化为真实会议接受率和可靠报告？
    - 为何多个高分论文缺少局限性、OpenAlex 标识符或代码/数据集工件，可复现性如何外部验证？
