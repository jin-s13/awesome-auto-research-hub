  related_work_outline:
  - 'Mainstream direction: LLM-based research agents that autonomously formulate hypotheses,
    run code or simulated experiments, analyze results, and draft manuscripts, increasingly
    using iterative verification, tree search, or multi-agent orchestration.'
  - 'Shared research pattern: A closed discovery loop of hypothesis, experiment, analysis,
    and paper generation, assessed through benchmarks, automated reviewers, or human/AI
    expert judges.'
  - 'Key differences: Full end-to-end autonomy versus human-in-the-loop monitoring;
    benchmark-based discovery tasks versus empirical ablation planning versus peer-review
    acceptance; failure memory versus verification loops versus platform-level orchestration.'
  - 'Trend evolution: 2024 work established fully automated scientific discovery and
    virtual evaluation environments; 2025 added workshop peer review and ablation
    planning; 2026 shifted toward multi-agent research teams, knowledge banks, and
    interactive platforms.'
  - 'Open questions: Consistent full-conference reliability, alignment between proxy
    metrics and scientific utility, cross-task transfer of failure knowledge, and
    missing limitation/reproducibility evidence in several sources.'
  related_work_outline_zh:
  - 主流方向：基于大语言模型的研究智能体自主提出假设、运行代码或模拟实验、分析结果并撰写论文，日益加入迭代验证、树搜索或多智能体编排。
  - 研究共性：形成“假设—实验—分析—论文生成”的闭环，并通过基准、自动评审或人类/AI专家评判进行评估。
  - 关键差异：端到端全自主与人类在环监控；基于发现任务/基准的评测与实证消融规划/同行评审录用；失败记忆与验证循环与平台级编排。
  - 趋势演进：2024年奠定全自动科学发现和虚拟评测环境；2025年加入工作坊同行评审和消融规划；2026年转向多智能体研究团队、知识库与交互式平台。
  - 开放问题：会议级可靠性、代理指标与科学效用的一致性、失败知识跨任务迁移，以及若干来源缺失局限性与可复现证据。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous experimentation and manuscript generation
      what_it_solves: Automating the full scientific workflow from idea and code execution
        to paper writing and review, reducing human effort and cost per paper.
      what_remains_open: Consistent quality beyond workshop-level acceptance; reliance
        on automated reviewers and template/code-harness assumptions remains under-validated.
    - line: Discovery task environments and evaluation design
      what_it_solves: Making experimentation agents comparable through structured
        tasks, completion metrics, and ablation-planning benchmarks that isolate discovery
        competence.
      what_remains_open: Metric alignment with real scientific value and human-level
        control; existing benchmarks show agents below human ablation recall and struggling
        on discovery tasks.
    - line: Failure-aware memory and verification loops
      what_it_solves: Capturing failed attempts and auditing logical or experimental
        coherence so later experiment proposals can reuse negative knowledge and reduce
        token cost.
      what_remains_open: Evidence is limited to same/cross-task PDE and ScienceAgentBench
        cases; transfer to broader lab/code settings and formal correctness guarantees
        are not shown.
    - line: Interactive multi-agent orchestration and human oversight
      what_it_solves: Dividing research roles, monitoring artifacts, and exposing
        rollback/resume controls so users can steer autonomous teams and connect local
        code/data.
      what_remains_open: Early-stage evaluation limited to five internal AI case studies;
        no standardized external validation across hardware, datasets, or user settings.
    consensus:
    - Current systems use LLM-driven agents to propose hypotheses, execute experiments,
      analyze outcomes, and generate papers or reports.
    - Evaluation typically combines automated LLM judges, benchmark task completion,
      or expert preference rather than relying solely on human conference review.
    - Human oversight persists as a correction or steering mechanism, even when systems
      target high autonomy.
    - Benchmarks show that current agents still fall short of human-level scientific
      planning, especially for ablation identification and discovery tasks.
    disagreements:
    - 'Interaction mode varies: one line pursues fully autonomous closed-loop research,
      while another centers interactive human-in-the-loop dashboards with rollback
      and resume.'
    - 'Evaluation target differs: some work optimizes for peer-review acceptance or
      automated review scores, while others target discovery task completion or ablation-planning
      recall.'
    - 'Failure correction differs: some systems encode negative knowledge into shared
      memory, while others use internal verification loops or reviewer feedback loops.'
    - 'Domain focus differs: some operate on empirical AI/code experiments, while
      others use simulated science tasks in physics, chemistry, or biology-like environments.'
    open_questions:
    - Can end-to-end autonomous systems move from a single workshop acceptance to
      consistent full-conference or journal-level reliability?
    - Do proxy metrics such as LLM-judge scores, task completion, and ablation recall
      align with long-term scientific utility or reproducibility?
    - Does negative knowledge transfer beyond same-task retry and two PDE problems
      to diverse code-based and lab-based experimentation?
    - What limitations, datasets, or code artifacts are missing from the available
      evidence for several top-ranked papers, and how would those change comparability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主实验与论文生成
      解决的问题: 自动化从想法、代码执行、实验分析到论文写作与评审的完整科研流程，降低人工干预和单篇成本。
      尚未覆盖: 稳定性仍停留在工作坊级别，自动评审与模板/代码脚手架假设缺乏更广泛验证。
    - 路线: 发现任务环境与评测设计
      解决的问题: 通过结构化任务、完成度指标和消融规划基准，让实验智能体的能力可比较并隔离发现能力。
      尚未覆盖: 代理指标与真实科学价值、人类水平覆盖之间存在缺口；现有基准显示智能体低于人类消融召回率并在发现任务上困难。
    - 路线: 失败感知记忆与验证循环
      解决的问题: 记录失败尝试并审计逻辑或实验一致性，使后续实验方案可复用负面知识并降低 token 开销。
      尚未覆盖: 证据限于 ScienceAgentBench 与 PDE 场景，跨领域迁移与形式化正确性保证尚未覆盖。
    - 路线: 交互式多智能体编排与人工监督
      解决的问题: 划分研究角色、监控工件并提供回滚/恢复控制，使用户能引导自主团队并接入本地代码与数据。
      尚未覆盖: 仅为早期步骤，评估限于五个内部 AI 案例；缺少跨硬件、数据集和用户设置的标准化外部验证。
    共识:
    - 当前系统使用大语言模型智能体提出假设、执行实验、分析结果并生成论文或报告。
    - 评估往往结合自动 LLM 评判、基准任务完成度或专家偏好，而非仅依赖人类会议评审。
    - 即使系统追求高度自主，人工监督仍作为纠错或指导机制存在。
    - 基准显示当前智能体在科学规划上仍低于人类，尤其在消融识别和发现任务中。
    分歧:
    - 交互模式不同：一条路线追求全自主闭环研究，另一条强调带仪表板、回滚和恢复的人在环交互。
    - 评测目标不同：部分工作面向同行评审录用或自动评分，部分面向发现任务完成度或消融规划召回率。
    - 失败纠正不同：一些系统把负面知识写入共享记忆，另一些使用内部验证循环或审稿反馈循环。
    - 领域重点不同：部分关注实证 AI/代码实验，部分使用物理、化学或类生物环境的模拟科学任务。
    开放问题:
    - 端到端自主系统能否从单篇工作坊录用走向稳定的会议或期刊级可靠性？
    - LLM 评审分数、任务完成度和消融召回率等代理指标是否与长期科学效用或可复现性一致？
    - 负面知识能否从 ScienceAgentBench 和两个 PDE 问题迁移到更多代码和实验场景？
    - 若干高排名论文在现有证据中缺少局限性、数据集或代码信息，这些缺失会如何影响可比性？
