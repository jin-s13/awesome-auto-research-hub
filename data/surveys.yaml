  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery workflow
      what_it_solves: Closes the research loop from ideation and implementation through
        experiment execution, analysis, visualization, and paper generation.
      what_remains_open: Consistency beyond selected demonstrations; only one of three
        fully AI-generated workshop papers passed peer review, and full conference-level
        repeatability is not established.
    - line: Domain-specific verification and execution
      what_it_solves: Adds task-specific validity gates such as logical derivation
        checks in mathematics or physics-aware flow-field inspection in CFD to catch
        silent failures before claims are written.
      what_remains_open: Gates can miss planted failures; results are narrowly tied
        to specific simulation or reasoning settings and may not transfer across domains.
    - line: Benchmark and evaluation design for scientific discovery
      what_it_solves: Creates standardized tasks, metrics, and blind evidence-based
        scoring to compare discovery agents without relying solely on paper-level
        review.
      what_remains_open: Whether benchmark task completion or evidence-maturity scores
        align with real discovery utility; available agent results are limited to
        a frozen base model and selected scientific topics.
    - line: Multi-agent collaboration and knowledge retrieval
      what_it_solves: Reduces expert intervention by organizing agents as PI/graduate-student
        roles and retrieving declarative facts plus procedural heuristics to guide
        reasoning-centric discovery.
      what_remains_open: Evidence relies on curated LLM-based review rubrics; independent
        human validation and robustness across mathematical subfields are missing.
    - line: Automated peer review and iterative refinement
      what_it_solves: Uses simulated reviewers and iterative feedback to polish manuscripts,
        figures, and claims before human inspection or formal submission.
      what_remains_open: Automated reviewer agreement with human judgment is demonstrated
        in narrow settings, leaving open self-assessment bias and lack of broad venue
        calibration.
    consensus:
    - Scientific discovery is modeled as a closed execution loop spanning ideation,
      experimentation, analysis, and manuscript creation.
    - Verification or validity checking is treated as necessary to make autonomous
      claims defensible.
    - Current systems are strong at producing plausible artifacts and analyses but
      weak at establishing trustworthy claims through controls, robustness, and falsifiability.
    - Evaluation is shifting from paper-only review toward task completion, evidence
      maturity, and domain-aware validity checks.
    disagreements:
    - 'Evaluation target differs: some systems optimize paper/review quality, while
      others optimize domain validity, benchmark task completion, or evidence maturity.'
    - 'Verification mode differs: logical proof checking, vision-language inspection
      of flow fields, simulated peer review, and benchmark-based judges provide different
      guarantees.'
    - 'Interaction mode differs: one line uses a human principal investigator with
      agent-as-student supervision, while others pursue fully autonomous runs or sandbox
      agents.'
    - 'Deployment setting differs: theoretical/mathematical reasoning, computational
      fluid dynamics simulation, and machine-learning code experimentation impose
      different assumptions and failure modes.'
    open_questions:
    - Can verification gates generalize to novel silent failures outside their demonstrated
      domain and task distribution?
    - Do LLM-based review or evidence-maturity scores predict accepted scientific
      value, practical utility, and reproducibility?
    - What interventions move agents from competent analysis execution to designing
      controls, robustness checks, and falsifiable claims?
    - How do performance and reliability change across base models, datasets, simulation
      environments, and disciplines when artifacts are released?
