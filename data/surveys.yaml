  literature_review:
    line_of_work_matrix:
    - line: Autonomous end-to-end research pipelines
      what_it_solves: Reduces the cost and human effort of the full scientific workflow
        by automating ideation, coding, experimentation, and paper writing with LLM-based
        agents.
      what_remains_open: Generated papers are inconsistent in quality, often limited
        to workshop-level acceptance, and lack robust domain-specific validity checks.
    - line: Human-AI collaborative discovery frameworks
      what_it_solves: Balances autonomy and reliability by allowing human experts
        to intervene at high-leverage decision points, reducing fabricated results
        and improving research direction.
      what_remains_open: Optimal granularity of human intervention is unclear; agent
        performance depends on interface design, and benefits over full autonomy are
        not characterized across domains.
    - line: Domain-specific scientist agents with verification
      what_it_solves: Adapts general AI scientist frameworks to fields like CFD or
        applied mathematics, integrating specialized verification gates (physics visual
        checks, logical audits) to produce defensible claims.
      what_remains_open: Verification gates still miss a fraction of silent failures;
        the approach is not yet demonstrated to generalize across diverse scientific
        disciplines.
    - line: Evaluation environments and benchmarks for discovery agents
      what_it_solves: Provides standardized tasks and metrics to measure an agent's
        ability to form hypotheses, design experiments, and extract knowledge, enabling
        comparison.
      what_remains_open: Proxy tasks and metrics may not correlate with real-world
        scientific impact; existing benchmarks are limited to narrow domains or simulated
        environments.
    consensus:
    - All systems treat LLMs as the core reasoning engine for scientific discovery.
    - Purely autonomous agents still fall short of human-level scientific creativity
      and reliability.
    - Explicit verification mechanisms are necessary to reduce hallucinated results
      and invalid claims.
    - Standardized evaluation is needed to move beyond anecdotal case studies.
    disagreements:
    - 'Full automation versus human-in-the-loop collaboration: some systems aim to
      eliminate human intervention, while others structure it at specific decision
      points.'
    - 'General-purpose versus domain-specific design: The AI Scientist series targets
      broad ML subfields, whereas AI CFD Scientist and ReasFlow embed domain-specific
      physics or logic verification.'
    - 'Evaluation target: simulated automated review scores versus actual peer review
      acceptance versus task completion on curated benchmarks.'
    - 'Mode of failure handling: self-healing execution loops versus human intervention
      versus domain-specific verification gates.'
    open_questions:
    - Can domain-specific verification gates be generalized to cover all failure modes
      observed in fully autonomous science?
    - What is the most effective human-AI interaction mode for maximizing novel scientific
      discovery while minimizing oversight cost?
    - Do current benchmarking metrics (task completion, reviewer score) predict the
      long-term impact and reproducibility of AI-generated research?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 全自动端到端研究流水线
      解决的问题: 通过自动化构思、编程、实验和论文写作，降低整个科学工作流程的成本和人力投入。
      尚未覆盖: 生成论文质量不一致，常限于工作坊水平，且缺乏稳健的领域特定有效性检查。
    - 路线: 人机协作发现框架
      解决的问题: 通过允许人类专家在高杠杆决策点介入，平衡自主性和可靠性，减少伪造结果并改善研究方向。
      尚未覆盖: 人类干预的最优粒度不明确；智能体性能依赖界面设计，且跨领域时相比全自主的优势尚未被刻画。
    - 路线: 带验证的领域专用科学家智能体
      解决的问题: 将通用AI科学家框架适配到计算流体力学或应用数学等领域，集成专用验证门控（物理视觉检查、逻辑审计）以产生可辩护的主张。
      尚未覆盖: 验证门控仍会遗漏部分静默失败；该方法尚未被证明能泛化到不同的科学学科。
    - 路线: 发现智能体的评估环境和基准
      解决的问题: 提供标准化任务和指标，衡量智能体形成假设、设计实验和提取知识的能力，使比较成为可能。
      尚未覆盖: 代理任务和指标可能与真实世界的科学影响力不相关；现有基准局限于狭窄领域或模拟环境。
    共识:
    - 所有系统都将LLM作为科学发现的核心推理引擎。
    - 纯自主智能体在科学创造力和可靠性方面仍落后于人类水平。
    - 显式验证机制对于减少幻觉结果和无效主张是必要的。
    - 需要标准化评估，以超越个案轶事式的展示。
    分歧:
    - 全自动 vs 人机协作：一些系统旨在消除人类干预，而另一些则在特定决策点进行结构化协作。
    - 通用 vs 领域专用设计：AI Scientist系列面向广泛的ML子领域，而AI CFD Scientist和ReasFlow嵌入了领域专用的物理或逻辑验证。
    - 评估目标：模拟自动评审分数 vs 真实同行评审接受 vs 在精心构建的基准上的任务完成度。
    - 失败处理模式：自愈执行循环 vs 人类干预 vs 领域专用验证门控。
    开放问题:
