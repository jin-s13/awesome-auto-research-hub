  literature_review_zh:
    研究路线矩阵:
    - 路线: 编辑器集成的多智能体写作与评审助手
      解决的问题: 协调起草、编辑器内评审和修改，以减少写作摩擦并提升论文质量。
      尚未覆盖: 与人类专家判断的一致性、对作者学习的影响，以及编辑修改是否在编辑器情境之外仍保持技术可靠性。
    - 路线: 学术检索与证据获取智能体
      解决的问题: 提供全面论文检索和带谱系的文献获取，让作者或下游智能体可以找到并复用相关研究。
      尚未覆盖: 模糊查询下的覆盖度、来源权威性验证，以及与有证据基础的写作集成仍未验证。
    - 路线: 自动同行评审与可靠性评估
      解决的问题: 训练AI评审者判断论文可靠性，以规模化审阅论文主张和方法。
      尚未覆盖: 与专家评审的校准、跨领域公平性，以及代理评审分数是否能预测真实决策质量。
    - 路线: AI研究复现与基准评测
      解决的问题: 测试AI复制研究并从论文谱系自动复现实验的能力。
      尚未覆盖: 复现结果的语义等价性、标准化成功准则，以及对可用工件之外任务的覆盖度。
    - 路线: 多模态学术传播自动化
      解决的问题: 把科学论文转化为海报格式，从文本写作扩展到多模态呈现。
      尚未覆盖: 版面保真度、生成视觉的科学准确性，以及用户偏好和设计质量在证据包中未被测量。
    - 路线: 以人为中心的写作辅导系统
      解决的问题: 在Overleaf中提供多智能体辅导，指导作者完成AI研究论文写作。
      尚未覆盖: 学习成效、持续进步，以及与非辅导型写作助手的对比尚缺少证据。
    共识:
    - 研究汇聚于把学术论文生命周期分解为多个LLM智能体角色，而不是把写作视为单一端到端生成任务。
    - 普遍强调编辑器、Overleaf或插件式集成，使智能体在作者现有写作环境中可用。
    - 证据包普遍缺少实验、数据集、基线和局限性细节，因此方法和结果声称暂时难以验证。
    分歧:
    - 任务阶段差异：检索证据、起草与编辑、评审可靠性、实验复现、海报生成和写作辅导各有侧重。
    - 交互模式差异：部分系统强调自主执行，另一部分强调以人为中心的辅导或编辑。
    - 评测目标差异：分别以检索完整性、复现成功、评审一致性或成品质量为评价核心。
    - 部署场景差异：一些面向Overleaf或编辑器场景，另一些面向独立检索或复现流程，但证据未提供界面或端点信息。
    开放问题:
    - 应如何设计统一评测协议和指标，以比较论文写作智能体在起草、评审、检索、复现和展示任务上的表现？
    - 当证据未报告专家一致性时，智能体生成的文本和评审是否符合领域专家判断？
    - 自动实验复现能否区分语义复现与表层工件匹配？
    - 以人为中心的写作辅导是否能带来持久写作能力提升，而不只是单次草稿改善？
    - 这些系统离开原始编辑器或任务特定设置后主要会出现哪些失败模式？
