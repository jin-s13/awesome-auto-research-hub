  - 开放问题：跨领域评测基准、分布外泛化、LLM与评分卡的独立贡献、治理与真实高风险实验验证尚未闭环。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research-loop orchestration
      what_it_solves: Automates hypothesis proposal, code or configuration editing,
        experiment execution, interpretation, and provenance recording across recommender-system
        and ML-potential research pipelines.
      what_remains_open: Lacks unified evaluation and governance; complex discovery
        is still shown only through narrow scorecards or conceptual proposals.
    - line: Predictive digital twins and physics-informed state modeling
      what_it_solves: Represents sample state and instrument dynamics to forecast
        outcome, uncertainty, and risk for autonomous microscopy and mixed-experiment
        optimization.
      what_remains_open: Validation is limited to amplitude-modulation scanning probe
        microscopy and simple color mixing; missing physics and noise dynamics remain
        partially uncaptured.
    - line: Data-quality assessment and constrained reasoning selection
      what_it_solves: Detects noisy features and recovers values; filters LLM reasoning
        traces for physical admissibility to improve accuracy, calibration, and constraint
        satisfaction.
      what_remains_open: Discrete or narrow feature distributions and low-intensity
        noise remain hard; evidence is limited to DFT, self-driving lab, and property-prediction
        data.
    - line: Distributed FAIR infrastructure and reproducible self-driving labs
      what_it_solves: Connects distributed experiments through shared databases, automated
        indexing, model updates, active-learning workflows, and HPC job management.
      what_remains_open: Dependence on one service ecosystem persists; standardized
        cross-facility validation is missing; the color-mixing demonstration lacks
        quantitative comparison.
    - line: Reviews, conceptual agendas, and theory-in-the-loop frameworks
      what_it_solves: Organizes materials-discovery pipelines and autonomous-lab governance
        while linking experiments to literature novelty, theory simulation, and follow-up
        experiments.
      what_remains_open: Whether the proposed categories predict system behavior remains
        empirically unvalidated; data quality, interpretability, governance, privacy,
        and fairness are unresolved.
    consensus:
    - 'The field converges on a close-the-loop abstraction: observe or propose, execute,
      evaluate with task-specific criteria, and update the model or workflow.'
    - Physics, domain constraints, or theory-derived scorecards are widely used to
      gate automated decisions rather than relying only on model likelihood.
    - LLM-based tools are typically integrated with specialized machine-learning models,
      databases, or simulators rather than acting alone.
    - Works increasingly treat provenance, data sharing, and reproducible infrastructure
      as integral to autonomous experimentation.
    - Current empirical evidence comes mostly from narrow, curated tasks or demonstrations,
      so feasibility claims remain bounded.
    disagreements:
    - 'The target of automation differs: physical instrument decision-making versus
      software-level research operations such as code editing and HPC scheduling.'
    - 'Representation strategies differ: physics-informed sample/instrument twins
      versus learned feature imputation versus LLM reasoning-trace selection.'
    - 'Decision evaluation differs: constrained scorecards or physical admissibility,
      literature novelty agreement, and data-quality recovery are not interchangeable.'
    - 'Human interaction differs: fully autonomous agents, real-time expert guidance,
      and distributed human-in-the-loop data submission appear in different systems.'
    - 'Maturity and evidence differ: conceptual agenda or review works lack experiments,
      while empirical works range from systematic perturbation studies to single-task
      demonstrations.'
    open_questions:
    - What common benchmark can compare end-to-end autonomous experimentation quality
      beyond task-specific success or optimization metrics?
    - How do digital twin or imputation models behave outside their validation domains,
      such as other microscopy modalities or discrete low-noise features?
    - What is the isolated contribution of LLM reasoning when the scorecard, physics
      prior, HPC environment, or domain model is fixed? Evidence does not yet separate
      these factors.
    - How can autonomous systems address data quality, interpretability, and governance
      constraints simultaneously in real multi-user or sensitive settings?
    - How does autonomous research behave when experiments are risky, expensive, or
      cannot be safely repeated, given current demonstrations focus on low-risk surrogate
      tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究循环编排
      解决的问题: 自动化假设提出、代码/配置编辑、实验执行、解释与来源记录，减少人工串行研究步骤
      尚未覆盖: 缺少统一评测与治理；复杂发现仍依赖狭窄评分卡或概念验证
    - 路线: 预测性数字孪生与物理信息状态建模
      解决的问题: 表示样本状态与仪器动态，预测候选操作的结果、不确定性与风险，支持自主显微镜与混合实验优化
      尚未覆盖: 仅在振幅调制扫描探针显微镜和简单颜色混合上验证；缺失物理及噪声动态未完全捕获
    - 路线: 数据质量评估与约束型推理选择
      解决的问题: 检测并恢复噪声特征；从LLM推理轨迹中筛选物理可行且数值接近的轨迹，提高准确性与校准性
      尚未覆盖: 离散/窄分布特征和低强度噪声处理仍弱；证据限于DFT、SDL和性质预测数据
    - 路线: 分布式FAIR基础设施与可复现自驱实验室
      解决的问题: 通过共享数据库、自动索引、模型更新、主动学习与HPC作业管理连接分布式实验
      尚未覆盖: 依赖nanoHUB等单一生态；缺少跨设施标准验证；颜色混合演示未提供定量对比
    - 路线: 综述、概念议程与理论在环框架
      解决的问题: 组织材料发现管道、自主实验室治理和文献新颖性链接，支持后续实验提议
      尚未覆盖: 分类是否预测系统行为缺少实证；数据质量/可解释性及治理、隐私、公平仍未解决
    共识:
    - 领域收敛为闭环抽象：观察或提议、执行、按任务标准评估、更新模型或工作流。
    - 物理、领域约束或理论衍生评分卡被广泛用于自动决策门控，而不是仅依赖模型似然。
    - LLM工具通常与专用机器学习模型、数据库或仿真器集成，而非单独行动。
    - 越来越多工作把来源记录、数据共享和可复现基础设施视为自主实验的组成部分。
    - 当前实证证据主要来自狭窄、策展任务或演示，因此可行性声明仍受限。
    分歧:
    - 自动化对象不同：物理仪器决策自动化与软件级研究操作（代码编辑、HPC调度）并存。
    - 状态与表示策略不同：物理信息样本/仪器孪生、学习特征插补和LLM推理轨迹选择各有侧重。
    - 决策评估信号不同：约束评分卡或物理可接受性、文献新颖性、数据质量恢复彼此不混用。
    - 人机交互方式不同：全自主智能体、实时专家指导和分布式人在环提交出现在不同系统。
    - 成熟度和证据深度不同：概念议程/综述缺乏实验，实证工作从系统扰动研究到单任务演示不等。
    开放问题:
    - 何种公共基准能比较端到端自主实验质量，而不只看任务特定成功率或优化指标？
    - 数字孪生或插补模型在验证域之外（其他显微镜模态、离散低噪声特征）如何失效？
    - 固定评分卡、物理先验、HPC环境或领域模型时，LLM推理的独立贡献如何度量？证据尚未隔离开这些因素。
    - 自主系统如何在真实多用户或敏感设置中同时解决数据质量、可解释性与治理约束？
    - 当前演示多为低风险替代任务，自主研究在昂贵、危险或不可重复实验中如何表现仍未知。
