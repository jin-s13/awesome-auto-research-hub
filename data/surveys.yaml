  related_work_outline_zh:
  - 主流方向：端到端LLM智能体系统，自动完成科研构思、实验、分析、验证和论文撰写，并越来越重视领域特定验证或证据评估，而非仅通用执行。
  - 研究共性：智能体工作流覆盖完整科研循环；自动化LLM/VLM评审或裁判为生成论文或证据打分；通过验证门控或基准任务拦截无效主张。
