    研究路线矩阵:
    - 路线: 端到端自主发现流水线
      解决的问题: 将构思、代码执行、实验管理、可视化和论文写作整合到一个智能体循环中，部分系统移除了人类代码模板。
      尚未覆盖: 接受结果不一致，且展示主要集中在机器学习或生成论文场景，外部科学有效性尚未确立。
    - 路线: 带验证门控的领域受限发现智能体
      解决的问题: 通过逻辑内部审查或物理感知视觉-语言门控，在写作前减少静默失败和无效声明。
      尚未覆盖: 门控仍不完整：CFD 门控在消融中遗漏 16 个植入失败中的 2 个；跨出展示领域后的迁移未经验证。
    - 路线: 基准环境与证据成熟度评测
      解决的问题: 用可重复任务和自动化评判来评估完整发现循环，包括隐藏源结论的盲测任务和基于指标的证据成熟度。
      尚未覆盖: 智能体得分平台化且无可靠区分，缺乏对照、稳健性、可证伪性和跨数据集泛化；仅报告单一冻结基座模型。
    - 路线: 人机角色设计与知识检索
      解决的问题: 通过人类担任首席研究员、智能体担任研究生，以及自动知识检索抽取事实和程序性启发，保持与专家标准一致。
      尚未覆盖: 证据限于由 LLM 评审标准评分的生成论文；对人类专家干预减少仍缺少外部人工验证。
    - 路线: 开源可复现栈
      解决的问题: 将孤立智能体想法转化为可检查、可复用的代码和工件流程，例如开源 CFD 智能体与无模板发现系统。
      尚未覆盖: 跨硬件、数据集和用户设置的标准化外部验证尚未展示。
    共识:
    - 基于 LLM 的智能体能够执行从构思或假设形成到实验、分析和论文写作的至少部分科学循环。
    - 自动验证、评审或证据判断被视为过滤或评分生成声明的必要环节。
    - 当前受评智能体更擅长执行和记录分析，而不是产出可信、可证伪的科学结论。
    - 评测应衡量证据质量或发现能力，而不仅是任务完成或论文产出。
    分歧:
    - 评测目标不同：生成论文的同行评审/工作坊接受率、盲测证据成熟度或模拟环境中的任务完成度。
    - 验证信号不同：LLM 评审反馈、领域特定的物理感知视觉门控或内部逻辑证明检查。
    - 部署设置不同：跨多个机器学习领域的无模板树搜索，与单一应用数学或计算流体动力学系统。
    - 交互和监督不同：全自动端到端智能体与人类首席研究员/智能体研究生协作。
    开放问题:
    - 当前系统能否在单一冻结基座模型和已展示任务或领域之外泛化并产生发现？
    - 当一个物理感知门控遗漏了 16 个植入失败中的 2 个，而其他系统未报告局限时，应如何缩小验证缺口？
