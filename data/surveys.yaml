  literature_review:
    line_of_work_matrix:
    - line: Standardized research-task evaluation for agents
      what_it_solves: Compares agent performance using fixed suites such as MLE-bench,
        PaperBench, FrontierCS, PassNet, BrowseComp, WideSearch, DeepSearchQA, ReportBench,
        and HLE; grounds claims in quantitative task scores.
      what_remains_open: The packet does not provide detailed task coverage or metric-to-real-utility
        validation for several suites, leaving comparability and contamination issues
        as verification gaps.
    - line: Closed-loop and held-out AI-scientist workflows
      what_it_solves: Searches feature, model, representation, and training-data changes;
        uses inner-fold feedback to select changes; freezes code and evaluates once
        on untouched holdout data to reduce development overfitting.
      what_remains_open: Evidence covers ten Matbench endpoints; selected interventions
        can still fail on holdout, and external data screening contributes little
        for composition tasks.
    - line: Self-improving and verification-driven research agents
      what_it_solves: Alternates evidence gathering with constraint-wise audit and
        follow-up research; compresses history and uses reinforcement learning with
        critical-step emphasis to improve long-horizon research answers.
      what_remains_open: Reported limitations are absent in the packet, leaving robustness,
        failure modes, and cost or scale boundaries under-specified.
    - line: Operational knowledge and skill distillation
      what_it_solves: Distills GitHub repository know-how into verified reusable skills
        and injects them into research agents, improving multiple benchmark scores
        under fixed backbone and execution budget.
      what_remains_open: Limitations are not stated in the packet; transfer beyond
        the evaluated suites and generalization of the skill library remain unclear.
    - line: Surrogate-repair and feedback-efficiency methods
      what_it_solves: Uses sparse high-fidelity evaluations to update a surrogate
        during long closed-loop search, reducing oracle queries and regret in synthetic
        tasks and MADE.
      what_remains_open: Fixed surrogate replacement can leave model error; custom
        laboratory automation is costly, and method-specific limitations are not explicitly
        stated.
    consensus:
    - Held-out evaluations and standardized benchmark suites are used to compare agent
      interventions and expose development-set overfitting.
    - Research agents are modeled as closed-loop systems that gather evidence, search
      changes, and verify claims or code.
    - Reusable artifacts, verified skills, or frozen code are treated as evidence
      that a result can survive beyond a single development split.
    - Quantitative gains are reported relative to fixed backbones, budgets, or baseline
      agents, making score differences the central evidence.
    disagreements:
    - 'Evaluation target differs: some focus on standardized agent benchmark suites,
      while others target domain-specific held-out metrics or academic survey quality.'
    - 'Feedback mechanism differs: some use recursive self-verification and reinforcement
      learning; some use distilled skills; some use sparse high-fidelity labels to
      repair surrogates.'
    - 'Intervention level differs: architecture and search-loop changes, external
      knowledge libraries, and feedback-efficiency changes imply different assumptions
      about the main bottleneck.'
    - 'Evidence depth differs: several entries provide methodology and limitations,
      while others provide only title and reproducibility signals, limiting comparison.'
    open_questions:
    - Do benchmark score improvements on MLE-bench, PaperBench, FrontierCS, PassNet,
      BrowseComp, WideSearch, or DeepSearchQA transfer to unseen domains or real research
      decisions?
    - How should high-fidelity evaluation budgets be allocated when closed-loop agent
      searches require many surrogate or oracle queries?
    - What limit does missing code, dataset, or limitation evidence place on reproducing
      reported research-agent gains?
    - Can self-improving verification loops remain robust when holdout or benchmark
      leakage contaminates feedback?
    - Which evaluation design best predicts long-horizon research utility rather than
      short-horizon task score?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向深度研究智能体的标准化任务评测
      解决的问题: 通过固定套件（如MLE-bench、PaperBench、FrontierCS、PassNet、BrowseComp、WideSearch、DeepSearchQA、ReportBench、HLE）比较智能体能力，并以任务得分支撑主张。
      尚未覆盖: 数据包未给出所有套件的任务覆盖与指标到真实效用的验证，可比性和污染问题仍是核验缺口。
    - 路线: 闭环与留出式AI科学家工作流
      解决的问题: 搜索特征、模型、表示和训练数据变化；只用内折反馈选择变化，冻结代码后在未接触的留出集上评估一次，以降低开发集过拟合。
      尚未覆盖: 证据仅覆盖十个Matbench端点；选定干预仍可能在留出集失败；外部数据筛选对成分任务贡献很小。
    - 路线: 自改进与验证驱动的研究智能体
      解决的问题: 交替进行证据收集和逐约束审计，发起后续研究；压缩历史状态，并使用带关键步骤强调的强化学习提升长程研究回答。
      尚未覆盖: 数据包未提供明确局限性，鲁棒性、失败模式和成本或规模边界仍未说明。
    - 路线: 操作知识与技能蒸馏
      解决的问题: 把GitHub仓库中的操作知识蒸馏为经过验证的可复用技能，并在固定主干与执行预算内提升多项基准分数。
      尚未覆盖: 数据包未说明局限性；已评估套件之外的可迁移性及技能库的泛化仍不清晰。
    - 路线: 代理修复与反馈效率方法
      解决的问题: 在长闭环搜索中用稀疏高保真评估更新代理模型，降低合成任务和MADE中的神谕查询量与后悔值。
      尚未覆盖: 固定代理替换会留下模型误差；定制实验室自动化成本高；方法本身的局限性未在摘要中明确说明。
    共识:
    - 使用留出评估或标准化基准套件来比较智能体干预，并揭示开发集过拟合。
    - 研究智能体被建模为闭环系统，需要收集证据、搜索变化并验证声明或代码。
    - 可复用工件、经验证技能或冻结代码被视为结果能在不同划分之外存续的正面证据。
    - 量化增益通常相对于固定主干、预算或基线智能体报告，使分数差异成为核心证据。
    分歧:
    - 评测目标不同：有的聚焦标准化智能体基准套件，有的聚焦领域特定留出指标或学术综述质量。
    - 反馈机制不同：有的用递归自验证与强化学习，有的注入蒸馏技能，有的用稀疏高保真标签修复代理。
    - 干预层级不同：架构或搜索循环改动、外部知识库和反馈效率改动对瓶颈有不同假设。
    - 证据深度不同：部分条目提供方法与局限性，部分只有标题和可复现信号，影响对比。
    开放问题:
    - 在MLE-bench、PaperBench、FrontierCS、PassNet、BrowseComp、WideSearch或DeepSearchQA上的得分提升能否迁移到未见领域或真实研究决策？
    - 闭环智能体搜索需要大量代理或神谕查询时，应如何分配高保真评估预算？
    - 缺失代码、数据集或局限性证据会在多大程度上制约研究智能体增益的复现？
    - 当留出集或基准泄漏污染反馈时，自改进验证环能否保持稳健？
    - 哪种评测设计更能预测长程研究效用，而不只是短期任务分数？
