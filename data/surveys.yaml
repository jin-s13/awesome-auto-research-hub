  - 趋势演进：2024 年侧重全自动生成与模拟评审；2025-2026 年转向强调智能体搜索、可验证性、人机协作、自我纠正和领域有效性门控。
  - 开放问题：独立人类同行评审的外部验证、通用静默失败检测、引用与数字的事实溯源、最优人机交互粒度，以及能否超越工作坊级接受达到完整会议级写作质量。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end manuscript generation and research communication
      what_it_solves: Composes full scientific papers from executed work, including
        literature synthesis, result visualization, argument structure, and low-cost
        drafting.
      what_remains_open: Whether generated text faithfully reflects observed evidence,
        reports limitations, and generalizes beyond workshop-level or rubric-based
        acceptance.
    - line: Verification and grounded claim production
      what_it_solves: Reduces fabricated metrics, silent execution failures, and unvalidated
        claims before final writing; links written statements to measured evidence.
      what_remains_open: Verification gates still miss some silent failures, and domain-specific
        checks may not transfer across fields or publication venues.
    - line: Human-AI collaboration and oversight
      what_it_solves: Places human experts at high-leverage decision points, such
        as principal-investigator review or targeted intervention modes, to increase
        quality and trust.
      what_remains_open: Optimal intervention granularity and expertise requirements
        remain unclear beyond the evaluated benchmark settings.
    - line: Automated review and evaluation
      what_it_solves: Provides scalable assessment of generated papers through simulated
        reviewers, LLM-based rubrics, blind scores, and benchmark comparisons.
      what_remains_open: Agreement between proxy review scores and real human peer-review
        utility, and standardization across domains and conferences.
    - line: Self-correction, failure attribution, and long-horizon robustness
      what_it_solves: Diagnoses failed experiments or weak reporting and routes corrections
        to hypotheses, experimental design, or implementation to improve final outputs.
      what_remains_open: Failure coverage remains partial under long-horizon context
        degradation, and conference-ready manuscript quality is still unresolved.
    consensus:
    - Autonomous systems now integrate idea generation, execution, visualization,
      manuscript drafting, and sometimes simulated review within one pipeline.
    - Verification or grounding mechanisms are increasingly treated as necessary for
      credible scientific writing, especially to avoid hallucinated numbers and unsupported
      conclusions.
    - Human evaluation or collaboration remains part of the workflow, but shifts toward
      targeted review or high-leverage intervention rather than full human drafting.
    - Current evidence relies heavily on internal or small-scale benchmarks, with
      variable reproducibility artifacts and limited external validation.
    disagreements:
    - 'Autonomy level differs: fully open-ended generation, principal-investigator/graduate-student
      collaboration, and targeted human intervention reflect different interaction
      modes.'
    - 'Verification strategy differs: logical coherence audits, physics-aware vision-language
      gates, multi-hypothesis failure attribution, and verifiable reporting emphasize
      different failure risks.'
    - 'Evaluation target differs: workshop acceptance, LLM rubric scores, domain-specific
      physical metrics, and experiment-stage benchmarks are not directly comparable.'
    - 'Domain scope differs: general machine learning, applied mathematics, and computational
      fluid dynamics impose different validity and reporting requirements.'
    - 'Failure handling differs: reflective self-correction, causal failure attribution,
      or early gating before writing are used to address unreliable outputs.'
    open_questions:
    - Can automated reviewer scores be validated against independent human peer review
      across different venues and scientific domains?
    - What generalizable validity-gate design can detect silent failures without relying
      on domain-specific logic or physics checks?
    - How can systems guarantee that every generated numeric claim and citation traces
      to a measured artifact or source?
    - What level of human interaction produces writing that reaches full conference
      quality rather than only workshop-level acceptance?
    - Can long-horizon self-correction preserve context, scientific taste, and failure
      coverage simultaneously?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端论文生成与研究沟通
      解决的问题: 把已执行工作组合成完整科学论文，包括文献综合、结果可视化、论证结构和低成本草稿生成。
      尚未覆盖: 生成文本是否忠实反映观测证据、是否充分报告局限性，以及能否超越工作坊级或评分标准级接受。
    - 路线: 验证与有依据的声明生成
      解决的问题: 在最终写作前减少虚构指标、静默执行失败和未验证声明，使写作内容与实测证据建立联系。
      尚未覆盖: 验证门控仍会遗漏部分静默失败，领域特定检查未必能跨领域或跨会议迁移。
    - 路线: 人机协作与监督
      解决的问题: 将人类专家置于高杠杆决策点，如负责人审查或定向干预模式，以提高生成质量和信任度。
      尚未覆盖: 在已评估基准之外，最佳干预粒度和专业知识要求仍不明确。
    - 路线: 自动评审与评价
      解决的问题: 通过模拟评审、基于LLM的评分标准、盲评分数和基准对比，对生成论文进行可扩展质量评估。
      尚未覆盖: 代理评分与真实人类同行评审效用之间的一致性，以及跨领域和会议的标准化。
    - 路线: 自我纠正、失败归因与长程稳健性
      解决的问题: 诊断失败实验或薄弱报告，并把纠正路由到假设、实验设计或实现，以改善最终输出。
      尚未覆盖: 在长程上下文退化下失败覆盖仍不完整，会议级论文质量仍未解决。
    共识:
    - 自主系统已将想法生成、执行、可视化、论文草稿和模拟评审整合到同一流水线中。
    - 为确保科学写作可信，系统越来越多地采用验证或依据约束机制，以减少虚构数字和无支持结论。
    - 人类评估或协作仍保留在工作流中，但角色转向高杠杆审阅或定向干预，而非完全由人起草。
    - 现有证据多依赖内部或小规模基准，可复现工件可变，外部验证仍然有限。
    分歧:
    - 自主程度不同：完全开放生成、负责人/研究生式协作和关键节点人工干预反映不同的交互模式。
    - 验证策略不同：逻辑一致性审计、物理感知视觉-语言门控、多假设失败归因和有依据报告强调不同的失败风险。
    - 评测目标不同：工作坊接受、LLM评分规则、领域物理指标和实验阶段基准难以直接比较。
    - 领域范围不同：通用机器学习、应用数学和计算流体动力学对有效性和报告格式有不同要求。
    - 失败处理不同：反射式自我纠正、因果失败归因或在写作前用门控阻断不合格结果。
    开放问题:
    - 自动评审分数能否在不同会议和领域中得到独立人类同行评审的验证？
    - 是否存在不依赖领域特定逻辑或物理检查的通用静默失败检测机制？
    - 如何保证生成论文中的每个数字和引用都能追溯到实测工件或来源？
    - 何种人类介入粒度能让生成写作达到完整会议论文质量，而不仅是工作坊级接受？
    - 长程自我纠正能否同时保持上下文、科学品味和失败覆盖率？
