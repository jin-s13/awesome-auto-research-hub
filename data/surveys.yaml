  related_work_outline:
  - 'Mainstream direction: Building end-to-end autonomous research agents that integrate
    hypothesis generation, experiment execution, and self-verification into a single
    loop, with multi-agent debate and human collaboration at key decision points.'
  - 'Shared research pattern: All systems embed a verification gate (physics-aware
    vision check, verifiable reporting, Lean proof, or multi-hypothesis failure attribution)
    to catch silent errors, and they prioritize modularity with customizable roles
    and reusable code harnesses.'
  - 'Key differences: Verification methods range from domain-specific physics simulations
    to formal theorem proving, and self-improvement strategies vary from cross-run
    evolution to structured causal diagnosis; some systems target a single domain
    (CFD, causal inference) while others claim domain-agnostic design.'
  - 'Trend evolution: The field condensed in 2025–2026, moving from early benchmarks
    and surveys (2025) to a cluster of agent-based autonomous research platforms (2026),
    then toward reliability-focused self-correction and formal foundation, indicating
    a shift from feasibility to robustness.'
  - 'Open questions: Can these agents generate hypotheses that are both novel and
    scientifically meaningful beyond narrow distribution shifts? How do proxy metrics
    (benchmark scores, artifact quality) align with genuine scientific discovery?
    What is the optimal human-AI collaboration mode without sacrificing autonomy?'
  related_work_outline_zh:
  - 主流方向：构建端到端的自主研究智能体，将假设生成、实验执行与自我验证整合为单一闭环，并在关键决策点引入多智能体辩论与人机协作。
  - 研究共性：所有系统都嵌入某种验证关卡（物理感知视觉检查、可验证报告、Lean证明或多假设失败归因）以捕获静默错误，并优先采用模块化设计，支持可定制角色和可复用的代码工具。
  - 关键差异：验证方式从领域特定的物理仿真到形式化定理证明，自我改进策略从跨运行演化到结构化因果诊断；部分系统针对单一领域（CFD、因果推断），而另一些则声称领域无关。
  - 趋势演进：该领域在2025–2026年快速凝聚，从2025年的早期基准和综述，发展到2026年涌现的多个基于智能体的自主研究平台，再转向以可靠性为中心的自我纠正和形式化基础，显示出从可行性到鲁棒性的转变。
  - 开放问题：这些智能体能否生成在狭窄分布偏移之外既新颖又具有科学意义的假设？代理指标（基准分数、工件质量）与真正的科学发现之间如何对齐？在不牺牲自主性的前提下，最优的人机协作模式是什么？
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automating the full scientific discovery loop—literature ideation,
        experiment coding, execution, verification, and report writing—within a single
        agentic system.
      what_remains_open: Cross-domain generalization of the pipeline, long-horizon
        reliability without human intervention, and the ability to produce conference-ready
        papers with genuine novelty.
    - line: Self-correction and failure attribution
      what_it_solves: Improving the robustness of autonomous experimenters by diagnosing
        root causes of failures and rerouting corrections to the appropriate level
        (hypothesis, design, or implementation).
      what_remains_open: Whether structured failure diagnosis can scale to open-ended
        scientific exploration where ground truth is unavailable, and the completeness
        of the failure taxonomy.
    - line: Evaluation benchmarking for AI scientists
      what_it_solves: Providing standardized tasks and metrics (e.g., cell type annotation,
        scientific MCQs) to measure the research capability of AI systems against
        human baselines.
      what_remains_open: Gap between benchmark performance and real-world scientific
        impact, and the dynamic evolution of benchmarks as agent capabilities advance.
    - line: Formal theorem proving and theory automation
      what_it_solves: Generating and verifying theoretical results in mathematics
        and causal inference using machine-checked proofs, ensuring logical correctness
        of claims.
      what_remains_open: The semantic gap between formalized statements and the intended
        scientific insights, and the inability of current systems to autonomously
        select meaningful research directions.
    consensus:
    - 'Verification is essential: every system includes a mechanism to validate outputs
      before acceptance, whether through physics-aware vision, verifiable number reporting,
      Lean proofs, or multi-hypothesis attribution.'
    - Multi-agent and modular architectures are preferred over monolithic agents;
      teams with customizable roles and debate mechanisms improve idea novelty and
      execution completeness.
    - Human-AI collaboration at high-leverage decision points outperforms both full
      autonomy and exhaustive step-by-step oversight, indicating a shared belief in
      strategic human involvement.
    disagreements:
    - 'Verification approach: domain-specific physical simulation (AI CFD Scientist)
      versus formal machine-checked proofs (CausalForge) versus verifiable result
      reporting (AutoResearchClaw, SAGE).'
    - 'Self-improvement strategy: continuous self-evolution via knowledge accumulation
      (EvoMaster) versus structured multi-hypothesis failure attribution with deterministic
      routing (SAGE) versus cross-run evolution from past mistakes (AutoResearchClaw).'
    - 'Evaluation target: some systems are tested on domain-specific benchmarks (BAISBench
      for single-cell biology, CausalForge by artifact quality), while others use
      broad AI-scientist benchmarks (ARC-Bench, Humanity''s Last Exam).'
    - 'Interaction mode: research platforms like Claw AI Lab emphasize interactive
      dashboards and real-time monitoring, whereas EvoMaster and CausalForge focus
      on autonomous runs with minimal human intervention.'
    open_questions:
    - Can the verification gates themselves be bypassed by adversarial failure modes,
      and how should they be stress-tested against domain-specific silent failures?
    - What constitutes a 'novel' hypothesis in an automated setting, and how can we
      prevent the system from rediscovering trivial variations of known results?
    - Are the reported improvements in benchmark scores (e.g., 54.7% on ARC-Bench,
      7.89% RMSE reduction) attributable to the agent architecture rather than the
      underlying LLM backbone or task-specific engineering?
    - How can we close the gap between formal correctness and scientific meaning,
      especially when machine-checked proofs do not guarantee the hypothesis is interesting
      or relevant?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流水线
      解决的问题: 在单一智能体系统中自动化完整的科学发现循环——文献构思、实验编码、执行、验证和报告撰写。
      尚未覆盖: 流水线的跨领域泛化、无需人工干预的长期可靠性，以及生成具有真正新颖性且可发表的论文的能力。
    - 路线: 自我纠正与失败归因
      解决的问题: 通过诊断失败的根本原因并将纠正措施路由到适当层级（假设、设计或实现），提升自主实验者的鲁棒性。
      尚未覆盖: 结构化失败诊断能否扩展到缺乏真实答案的开放式科学探索，以及失败分类体系的完备性。
    - 路线: AI科学家的评估基准
      解决的问题: 提供标准化任务和指标（如细胞类型注释、科学选择题），以对照人类基线衡量AI系统的研究能力。
      尚未覆盖: 基准性能与真实世界科学影响之间的差距，以及随着智能体能力提升基准的动态演进。
    - 路线: 形式化定理证明与理论自动化
      解决的问题: 使用机器验证的证明来生成和验证数学和因果推断中的理论结果，确保主张的逻辑正确性。
      尚未覆盖: 形式化陈述与预期科学洞察之间的语义鸿沟，以及当前系统无法自主选择有意义的研究方向。
    共识:
    - 验证必不可少：每个系统都包含在接受输出前验证其有效性的机制，无论是通过物理感知视觉、可验证数字报告、Lean证明还是多假设归因。
    - 多智能体和模块化架构优于单体智能体；具备可定制角色和辩论机制的团队能提升想法新颖性和执行完整性。
    - 在高杠杆决策点进行人机协作优于完全自主和详尽的逐步监督，表明研究者普遍认同战略性人工参与的价值。
    分歧:
    - 验证方式：领域特定的物理仿真（AI CFD Scientist）对比形式化机器验证证明（CausalForge）对比可验证结果报告（AutoResearchClaw、SAGE）。
    - 自我改进策略：通过知识积累的持续自演化（EvoMaster）对比结构化多假设失败归因与确定性路由（SAGE）对比基于过去错误的跨运行演化（AutoResearchClaw）。
    - 评估目标：部分系统在领域特定基准上测试（BAISBench针对单细胞生物学，CausalForge通过产物质量），而另一些使用通用AI科学家基准（ARC-Bench、Humanity's
      Last Exam）。
    - 交互模式：Claw AI Lab等研究平台强调交互式仪表板和实时监控，而EvoMaster和CausalForge则侧重于人类干预最小化的自主运行。
    开放问题:
    - 验证关卡本身是否可能被对抗性失效模式绕过，应如何针对领域特定的静默失败进行压力测试？
    - 在自动化环境中，什么样的假设才算“新颖”，如何防止系统重新发现已有结果的微小变体？
    - 基准分数上的报告提升（如ARC-Bench上54.7%、Cf RMSE降低7.89%）是否可归因于智能体架构，而非底层LLM骨干或任务特定工程？
    - 如何缩小形式化正确性与科学意义之间的差距，尤其是当机器验证的证明不能保证假设有趣或相关时？
