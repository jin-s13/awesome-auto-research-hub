  related_work_outline:
  - 'Mainstream direction: Autonomous scientific discovery agents that combine retrieval,
    literature synthesis, verification, and paper generation, with evaluation shifting
    toward evidence-grounded benchmarks and automated LLM judges.'
  - 'Shared research pattern: Systems decompose research into stages such as retrieval,
    reasoning or experimentation, synthesis, and reporting; claims are scored through
    benchmarks or LLM-based rubrics rather than established literature-intelligence
    metrics.'
  - 'Key differences: Work diverges in evaluation target, from full paper generation
    and blind evidence maturity to domain-specific discovery and broad reasoning benchmarks;
    interaction modes and verification mechanisms also differ.'
  - 'Trend evolution: Within the 2025-2026 frontier, the evidence moves from surveys
    and domain-specific AI scientist benchmarks toward self-evolving frameworks and
    failure-mode audits, while literature review automation remains an unresolved
    bottleneck.'
  - 'Open questions: How to validate literature search, gap discovery, and synthesis
    quality beyond proxy scores; whether evidence-maturity metrics predict real downstream
    research utility; and how far single-model and single-domain findings generalize.'
  related_work_outline_zh:
  - 主流方向：自主科学发现智能体将检索、文献综合、验证和论文生成结合，评测逐渐转向证据锚定基准与自动 LLM 评委。
  - 研究共性：系统通常把研究分解为检索、推理或实验、综合与报告等阶段；主张多通过基准或 LLM 评分量表判断，而非成熟的文献智能指标。
  - 关键差异：评测目标、交互模式和验证机制不同，有的侧重论文生成，有的侧重盲测证据成熟度、领域发现或通用推理。
  - 趋势演进：在 2025-2026 前沿证据中，研究从综述和领域特定 AI 科学家基准，转向自演化框架与失败模式审计，文献综述自动化仍是未解决瓶颈。
  - 开放问题：文献搜索、缺口发现和综合质量如何超越代理分数验证；证据成熟度指标能否预测真实下游科研效用；单模型和单领域结论的泛化边界仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: Literature synthesis and paper generation agents
      what_it_solves: Automates retrieval, synthesis, verification, and manuscript
        preparation in a single end-to-end research-writing pipeline, especially for
        reasoning-centric domains.
      what_remains_open: Lacks independent comparison with human literature review
        quality and real research gap discovery; internal verification does not establish
        external validity.
    - line: Evidence-grounded evaluation benchmarks
      what_it_solves: Provides blind tasks and multi-dimensional LLM judging for evidentiary
        maturity of open-ended scientific claims instead of reproducing hidden target
        studies.
      what_remains_open: Current evidence depends on one frozen base model and does
        not cover literature-specific search, citation, or gap-discovery validity
        across models.
    - line: Domain-specific AI scientist benchmarking
      what_it_solves: Evaluates AI scientists on real domain data through annotation
        and discovery questions derived from published studies, with human baselines.
      what_remains_open: Fully autonomous discovery remains unreached; human baseline
        and external validity evidence are limited.
    - line: Self-evolving agent infrastructure
      what_it_solves: Provides a domain-agnostic framework with self-critique and
        knowledge accumulation for scalable scientific agent development.
      what_remains_open: Reported gains come from broad reasoning benchmarks, not
        from direct literature intelligence tasks; long-term knowledge quality and
        limitations are not fully evidenced.
    - line: Failure analysis and design principles for autonomous research
      what_it_solves: Documents recurring failure modes in end-to-end autonomous research
        and derives design principles for more robust AI scientist systems.
      what_remains_open: Case-level evidence is small and pipeline-specific; design
        principles have not been systematically validated across diverse systems.
    consensus:
    - Autonomous scientific workflows are commonly decomposed into retrieval, reasoning
      or experimentation, synthesis, and reporting stages.
    - Current systems are not yet trustworthy for fully autonomous discovery and still
      require human oversight, better evidence validation, or both.
    - Evaluation increasingly uses automated LLM judges or benchmark rubrics, but
      reported performance often lacks cross-base-model and cross-domain coverage.
    - Literature review automation is treated as a remaining bottleneck rather than
      a solved capability.
    disagreements:
    - 'Evaluation targets differ: full paper generation quality, blind scientific
      claim evidence maturity, domain-specific discovery tasks, or broad reasoning
      scores.'
    - 'Interaction modes differ: human principal investigator with agent as graduate
      student, fully autonomous end-to-end pipelines, or self-evolving frameworks.'
    - 'Verification mechanisms differ: internal logical verification, external LLM
      judges, human peer review, and multi-AI review are emphasized to different degrees.'
    - 'Domain coverage differs: applied mathematics, omics biology, machine learning,
      and domain-agnostic science receive unequal attention.'
    - 'Evidence disclosure differs: some work reports limitations and failure modes
      explicitly, while other work omits limitation details or cross-model validation.'
    open_questions:
    - Can automated literature synthesis be validated by gap-discovery quality rather
      than paper generation or benchmark scores?
    - Do evidence-maturity metrics predict real downstream literature review utility
      or accepted research quality?
    - How do retrieval, synthesis, and generation errors propagate differently across
      domain-specific and general scientific workflows?
    - What human-in-the-loop protocol is minimal for reliable autonomous literature
      review and research gap discovery?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 文献综合与论文生成智能体
      解决的问题: 在端到端研究写作流程中集成检索、综合、验证和手稿准备，尤其面向推理密集领域。
      尚未覆盖: 缺少与人工文献综述质量和真实研究缺口发现的独立对照；内部验证不能确立外部有效性。
    - 路线: 证据锚定评测基准
      解决的问题: 用盲任务和多维 LLM 评分评估开放式科学主张的证据成熟度，而非复现隐藏目标研究。
      尚未覆盖: 现有证据依赖单一冻结基座模型，未覆盖文献搜索、引用或缺口发现有效性在跨模型上的表现。
    - 路线: 领域特定 AI 科学家评测
      解决的问题: 在真实领域数据上，通过来自已发表研究的标注和发现任务评估 AI 科学家，并提供人类基线。
      尚未覆盖: 完全自主发现尚未实现，人类基线和外部效度证据有限。
    - 路线: 自演化智能体基础设施
      解决的问题: 提供领域无关框架，通过自我批判和知识积累支持可扩展科学智能体开发。
      尚未覆盖: 已报告提升主要来自通用推理基准，而非直接文献智能任务；长期知识质量和局限性证据不足。
    - 路线: 自主研究失败分析与设计原则
      解决的问题: 记录端到端自主研究中的重复失败模式，并从中提取更稳健 AI 科学家系统的设计原则。
      尚未覆盖: 案例证据规模小且局限于特定流水线；设计原则尚未在多样系统上获得系统验证。
    共识:
    - 自主科研工作流通常被分解为检索、推理或实验、综合与报告等阶段。
    - 当前系统尚不足以可信地实现完全自主发现，仍需人工监督或更好的证据验证，或两者兼备。
    - 评测越来越多地采用自动 LLM 评委或基准量表，但多数报告缺少跨基座模型和跨领域覆盖。
    - 文献综述自动化被视为尚未解决的瓶颈，而非已经具备的能力。
    分歧:
    - 评测目标不同：全文生成质量、盲测科学主张证据成熟度、领域发现任务或通用推理得分各有侧重。
    - 交互模式不同：人类首席研究员与智能体研究生协作、完全自主端到端流水线、自演化框架并存。
    - 验证机制不同：内部逻辑校验、外部 LLM 评委、人工同行评审和多智能体评审受重视程度不一。
    - 领域覆盖不同：应用数学、组学生物、机器学习和领域无关科学的关注度不同。
    - 证据披露不同：部分工作明确说明局限和失败模式，部分工作省略局限细节或跨模型验证。
    开放问题:
    - 自动化文献综合能否通过研究缺口发现质量而非论文生成或基准分数来验证？
    - 证据成熟度指标能否预测真实下游文献评审效用或已接受研究质量？
    - 在领域特定与通用科研工作流中，检索、综合和生成错误如何以不同方式传播？
    - 可靠自主文献综述与研究缺口发现所需的最小人工介入协议是什么？
