  literature_review:
    line_of_work_matrix:
    - line: Full-cycle discovery task environments
      what_it_solves: Evaluates whether agents complete hypothesis formation, experiment,
        analysis, and conclusion inside a controlled virtual setting with scalable
        automatic metrics.
      what_remains_open: Whether task completion and task-relevant action metrics
        align with real scientific validity, and why strong baselines still struggle
        on most discovery tasks.
    - line: Evidence-grounded blind evaluation
      what_it_solves: Grades how well agents decide what claim frozen data support
        when source conclusions and analysis paths are hidden, using evidence-maturity
        rubrics.
      what_remains_open: Reported results rely on one frozen base model; agents plateau
        and largely lack controls, robustness, falsifiability, and cross-dataset generalization.
    - line: Auditable research question formation
      what_it_solves: Structures early-stage scientific questions into certificates
        covering definitions, assumptions, mechanism, falsifiable hypothesis, test,
        and failure update rule.
      what_remains_open: Evidence is preliminary and judged by LLM judges rather than
        human domain experts; downstream effect on actual discovery is not established.
    - line: Resource-constrained end-to-end agent evaluation
      what_it_solves: Measures autonomous agents on end-to-end ML model design, implementation,
        and training under single-GPU, time-budget, and no-internet constraints.
      what_remains_open: Only seven tasks are covered; constraints may not match typical
        research workflows, and one pretrained-weight exception introduces inconsistency.
    - line: Scientific code-library distillation
      what_it_solves: Distills large domain-specific code repositories into vetted
        working examples so scientific coding agents produce more accurate and complete
        experiments.
      what_remains_open: Evaluation is limited to materials science repositories;
        LLM-as-judge ratings show only moderate agreement with domain experts.
    - line: Grounded wet-lab experience evolution
      what_it_solves: Uses episodic memory and execution experience to improve wet-lab
        task completion, online planning, and safety without additional training.
      what_remains_open: Limitations are not reported; generalization across diverse
        wet-lab tasks, hardware, and settings remains a verification gap.
    - line: Trajectory-aware safety reasoning
      what_it_solves: Maintains cumulative risk across scientific agent stages and
        detects compositional tool-chain escapes missed by single-step monitors.
      what_remains_open: Baseline details and limitations are missing; the long-term
        trade-off between safety improvement and scientific output quality is not
        fully evidenced.
    consensus:
    - Current work treats scientific discovery as a compound loop of question formation,
      experiment/code execution, analysis, reporting, and safety rather than a single
      prediction task.
    - Strong coding agents can execute and document analyses competently, but available
      evidence shows plateauing or weak performance on trustworthy, novel, controlled
      scientific investigation.
    - There is convergence on structured audit artifacts—task progress, evidence-maturity
      rubrics, research question certificates, safety traces, or distilled code libraries—to
      make agent reasoning checkable.
    - Automatic judges and proxy metrics are widely used for scalable evaluation,
      but their alignment with domain expert judgment is treated as uncertain or only
      moderate.
    - Domain-specific constraints such as materials-science code, wet-lab physical
      safety, GPU/time budgets, and no-internet settings are becoming part of evaluation
      design.
    disagreements:
    - Some evaluations expose open objectives and expect novel discovery in simulated
      environments, while others hide source conclusions and score whether frozen
      data support an evidence-grounded claim.
    - 'Success criteria differ: task completion and task-relevant actions versus rubrics
      measuring controls, robustness, falsifiability, and cross-dataset generalization.'
    - Interaction settings range from text/virtual tasks to code-only agents to physical
      wet-lab execution, each with different safety and success definitions.
    - 'Resource assumptions conflict: some systems inject external distilled code
      libraries, while others enforce no internet, single-GPU, and no-pretrained-weight
      constraints.'
    - Safety is handled differently, from central trajectory-aware risk reasoning
      to a state-grounded execution loop with safety gates and evolved experience;
      evidence on output-quality trade-offs is incomplete.
    - Supervision varies across fixed LLM judges, domain-expert comparison, and absent
      human validation, leaving judge reliability unresolved.
    open_questions:
    - What evaluation design can distinguish true novel discovery from competent reproduction
      or analysis of hidden known results?
    - Do evidence-maturity rubrics and structured research question certificates improve
      downstream discovery outcomes, or only judged intermediate artifacts?
    - How do missing baselines, limitation details, and single-base-model or single-domain
      results affect generalization across base models, scientific domains, hardware,
      and lab settings?
    - Which proxy metrics align strongly enough with domain-expert scientific quality
      and wet-lab safety to support reliable automatic evaluation?
    - How can agents be induced to perform discriminating controls, robustness checks,
      falsifiability tests, and cross-dataset generalization instead of plateauing
      on analysis execution?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 完整发现循环任务环境
      解决的问题: 在受控虚拟设置中评估智能体是否完成假设、实验、分析、结论的完整循环，并使用可扩展自动指标。
      尚未覆盖: 任务完成和动作相关指标是否与真实科学有效性一致，以及强基线为何仍在多数发现任务上表现困难。
    - 路线: 证据锚定的盲测评估
      解决的问题: 在隐藏源结论和分析路径、仅给冻结数据时，评估智能体判断数据支持何种主张的证据成熟度。
      尚未覆盖: 结果仅基于单一冻结基座模型；智能体接近平台期，缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 路线: 可审计研究问题形成
      解决的问题: 用结构化证书记录定义、假设、机制、可证伪假设、测试和失败更新规则，使问题形成可检查。
      尚未覆盖: 评估依赖LLM评委而非人类领域专家；对下游实际科学发现的影响尚未验证。
    - 路线: 受限端到端编码智能体评测
      解决的问题: 在单GPU、时间预算、无互联网条件下评估自主智能体的端到端ML模型设计、实现和训练。
      尚未覆盖: 仅七项任务；约束可能与典型研究工作流不一致，且一个预训练权重例外带来任务间差异。
    - 路线: 科学代码库蒸馏
      解决的问题: 把大规模领域代码仓库提炼为经过验证的工作示例，提升科学编码智能体实验的准确性和完整性。
      尚未覆盖: 仅评估材料科学仓库；LLM评委与领域专家的一致性仅为中等。
    - 路线: 湿实验室经验演化
      解决的问题: 利用片段记忆和执行经验改进湿实验室任务完成、在线规划和安全，无需额外训练。
      尚未覆盖: 未报告局限性；跨湿实验任务、硬件和设置的泛化仍是验证缺口。
    - 路线: 轨迹感知安全推理
      解决的问题: 在科学智能体各阶段维护累积风险，并检测单步监控遗漏的组合工具链逃逸。
      尚未覆盖: 基线和局限性说明缺失；安全提升与科学输出质量的长期权衡缺少充分证据。
    共识:
    - 当前研究将科学发现视为问题形成、实验/代码执行、分析、报告和安全的复合闭环，而非单一预测任务。
    - 强编码智能体能胜任分析执行和记录，但在可信、新颖、受控的科学调查上表现出平台期或明显不足。
    - 研究正在向结构化审计工件集中，包括任务进度、证据成熟度评分、研究问题证书、安全轨迹或蒸馏代码库。
    - 自动评委和代理指标广泛用于可扩展评测，但其与领域专家判断的一致性仍不确定或仅为中等。
    - 材料科学代码、湿实验室物理安全、GPU/时间预算和无互联网等领域约束正被纳入评测设计。
    分歧:
    - 有的评测在开放模拟环境中看新颖发现，有的隐藏源结论评估冻结数据支持主张的能力。
    - 成功标准不一致：有任务完成和动作相关性，也有对照、稳健性、可证伪性和跨数据集泛化等证据成熟度维度。
    - 交互设置从文本/虚拟任务、纯代码智能体到物理湿实验室不同，安全和成功定义随之不同。
    - 资源假设冲突：一些系统注入外部蒸馏代码库，另一些强制无互联网、单GPU和无预训练权重。
    - 安全处理方式不同，有轨迹感知风险推理，也有状态接地执行配合安全门和经验演化；输出质量权衡证据不足。
    - 监督方式从固定LLM评委、领域专家对照到缺少人类验证，评委可靠性尚未解决。
    开放问题:
    - 什么评测设计能区分真正的新颖发现与对隐藏已知结果的胜任复现或分析？
    - 证据成熟度评分和结构化研究问题证书能否提升下游发现结果，而不只是提升中间工件评分？
    - 缺失基线、限制说明和单一基座模型或单一领域结果如何影响跨模型、跨领域、跨硬件和跨实验室泛化？
    - 哪些代理指标能与领域专家科学质量和湿实验室安全足够对齐，以支持可靠自动评估？
    - 如何让智能体执行对照、稳健性、可证伪性和跨数据集泛化，而不是停在学习分析执行的平台期？
