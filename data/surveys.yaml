    - 输出目标不同：面向下游智能体的数据库知识层、完整综述稿件、以及同行评审鲁棒性各有侧重。
    - 评测设置不同：文献综合/声明验证/问答基准、与人类综述的相似度、以及对抗性文本攻击不可直接比较。
    开放问题:
