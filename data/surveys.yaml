        research-agent capabilities comparable.
      what_remains_open: Coverage of diverse research settings and alignment between
        benchmark metrics and real discovery utility.
    consensus:
    - Agentic research systems converge on closed loops connecting hypothesis generation
      with executable or verifiable evidence rather than isolated suggestion.
    - Traceable reporting, structured memory, or provenance mechanisms are treated
