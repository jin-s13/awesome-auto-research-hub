  literature_review:
    line_of_work_matrix:
    - line: Systems and reproducible infrastructure
      what_it_solves: Turning isolated model ideas into runnable end-to-end stacks
        that can autonomously generate code, run experiments, and produce manuscripts,
        thereby enabling scalable research automation.
      what_remains_open: Standardized external validation across hardware, datasets,
        and user settings; most systems are evaluated only in controlled sandboxes,
        and their reproducibility outside the original environment is not yet established.
    - line: Evaluation and evidence design
      what_it_solves: Creating benchmarks, tasks, and baseline comparisons that make
        the claims of autonomous research agents testable and comparable, including
        human performance baselines to ground capability claims.
      what_remains_open: Coverage of diverse scientific domains and agreement between
        proxy metrics (e.g., automated reviewer scores, task completion) and the actual
        downstream utility of the generated research.
    - line: Conceptual taxonomy and theory
      what_it_solves: Organizing the failure modes, design principles, and corrective
        strategies of autonomous research agents into a structured understanding of
        why current systems are unreliable, and how to improve them.
      what_remains_open: Direct empirical validation that the proposed taxonomies
        (e.g., failure modes, intervention levels) predict and improve agent behavior
        in new, unseen tasks.
    consensus:
    - Current LLM-based autonomous research agents are not yet capable of fully reliable,
      end-to-end scientific discovery without human intervention.
    - External verification mechanisms—whether automated review, human baseline comparison,
      or physics-based inspection—are essential to prevent silent failures and make
      claims trustworthy.
    - Benchmarking and standardised evaluation environments are critical for measuring
