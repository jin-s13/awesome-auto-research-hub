    - line: End-to-end autonomous discovery agents
      what_it_solves: Produces hypotheses, code, experiments, visualizations, and
        manuscripts in an integrated loop, with some systems adding verification or
        rollback controls.
      what_remains_open: 'Reliability is inconsistent: only one of three submitted
