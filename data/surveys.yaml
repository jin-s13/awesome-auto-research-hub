  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery pipelines
      what_it_solves: Automating the full research cycle from idea generation and
        experiment execution to manuscript writing and automated review.
      what_remains_open: Whether passing automated review equals robust scientific
        progress remains unproven; generated outputs can be inconsistent and lack
        stronger human or real-world validation.
    - line: Domain-aware discovery agents with embedded verification
      what_it_solves: Adding physical or logical validity checks and domain-specific
        execution to reduce silent failures in areas such as CFD or applied mathematics.
      what_remains_open: Verification gates still miss some planted failures, and
        generalization beyond the demonstrated domain is not established.
    - line: Benchmarks and virtual environments for discovery agents
      what_it_solves: Providing comparable tasks and metrics for hypothesis formation,
        experimentation, and evidence quality.
      what_remains_open: Agents plateau below trustworthy scientific judgement; proxy
        metrics and results from a single base model may not transfer to real research
        utility or other base models.
    - line: Open-source reproducible agent stacks
      what_it_solves: Turning isolated discovery systems into runnable code and artifacts
        for external inspection and reuse.
      what_remains_open: Standardized external validation across hardware, domains,
        and usage settings is still missing.
    consensus:
    - Autonomous science agents are commonly built as multi-stage loops covering ideation,
      execution, analysis, and manuscript generation.
    - Automated evaluation and review, often using LLM judges, is treated as necessary
      to scale validation.
    - Verification or validity checking is increasingly seen as required because raw
      generation can produce unsupported or physically invalid claims.
    - Current systems remain narrow in demonstrated settings, including ML subfields,
      workshop-level publication, applied mathematics, CFD, or synthetic tasks.
    disagreements:
    - 'Evaluation target differs: some use simulated reviewer acceptance or workshop
      peer review, while others use task completion and evidence-maturity rubrics.'
    - 'Deployment setting differs: some run real code and open-ended experiments,
      while others use virtual text-based discovery environments or domain-specific
      solvers.'
    - 'Interaction mode differs: some cast the human as principal investigator and
      the agent as a graduate student, while others aim for fully automated discovery.'
    - 'Domain scope differs: general machine-learning pipelines coexist with physics-aware
      or mathematics-specific systems that use explicit validity gates.'
    open_questions:
    - Do LLM-based reviewers and evidence-maturity metrics align with human scientific
      judgement or actual discovery quality?
    - Can verification gates be made comprehensive enough to catch silent failures
      across domains without introducing new failure modes?
    - Why do coding agents plateau with similar evidence-grounded scores, and which
      missing capabilities, such as controls or falsifiability, would change that?
    - How far do results transfer across base models, domains, and beyond workshop
      or conference-style writing to real-world scientific settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现流水线
      解决的问题: 自动化从想法生成、实验执行、分析到论文撰写和自动评审的完整循环。
      尚未覆盖: 自动评审通过是否等于稳健科学进展仍未证明；生成输出不稳定，缺少更强的人类或现实场景验证。
    - 路线: 带内置验证的领域感知发现智能体
      解决的问题: 在 CFD 或应用数学等领域引入物理或逻辑校验，减少静默失败。
      尚未覆盖: 验证门控仍会漏掉部分植入失败，跨领域泛化尚未建立。
    - 路线: 面向发现智能体的基准与虚拟环境
      解决的问题: 通过任务和指标比较假设形成、实验过程和证据质量。
      尚未覆盖: 现有智能体尚未达到可信科学判断；代理指标和单一基座模型结果可能不迁移到真实研究效用或其他模型。
    - 路线: 可复现的开源智能体栈
      解决的问题: 将孤立发现系统转化为可运行代码和工件，便于外部检查和复用。
      尚未覆盖: 跨硬件、领域和设置的标准外部验证仍然缺失。
    共识:
    - 自主科学智能体通常被构建为覆盖构思、执行、分析和论文生成的多阶段循环。
    - 自动评价和评审常由 LLM 评判器承担，以扩大验证规模。
    - 验证或有效性检查越来越被视为必要，因为原始生成可能产生无支持或物理上无效的主张。
    - 当前系统大多只在较窄场景中得到展示，如机器学习子领域、工作坊级发表、应用数学、CFD 或合成任务。
    分歧:
    - 评测目标不同：有的采用模拟评审接受或工作坊同行评审，有的采用任务完成和证据成熟度评分。
    - 部署场景不同：有的在真实代码执行和开放式实验中运行，有的使用虚拟文本发现环境或领域专用求解器。
    - 交互模式不同：一类将人类设为首席研究员、智能体为研究生，另一类追求完全自动化开放式发现。
    - 领域范围不同：通用机器学习流水线与物理感知或数学专用系统在有效性门控上存在明显差异。
    开放问题:
    - LLM 评审器和证据成熟度指标是否与人类科学判断或真实发现质量一致？
    - 验证门控能否扩展到跨领域并捕获静默失败，而不引入新的失败模式？
    - 为何编码智能体在证据锚定任务上得分相近，缺少对照、稳健性或可证伪性是否是关键瓶颈？
    - 结果在多大程度上能跨基座模型、跨领域，并从工作坊或会议式写作迁移到真实实验室或现场科学？
