  related_work_outline:
  - 'Mainstream direction: Multi-agent LLM systems that automate literature review,
    survey drafting, and paper generation through role-specialized agents and iterative
    reviewer or evaluator loops.'
  - 'Shared research pattern: Workflows decompose scholarly tasks into retrieval,
    drafting, verification, and review; quality is measured with LLM rubrics, benchmark
    tasks, or human and peer review signals.'
  - 'Key differences: Evaluation targets differ across rubric-aligned survey quality,
    domain discovery benchmarks, end-to-end paper completion, and general science
    benchmarks; interaction mode and domain deployment also diverge.'
  - 'Trend evolution: Available evidence is concentrated within the 2025-2026 frontier,
    moving from standalone survey-generation frameworks toward self-evolving agent
    infrastructures and explicit failure-mode analysis.'
  - 'Open questions: External validity, alignment with human expert judgment, citation
    correctness, reproducibility, and isolation of literature search and gap discovery
    remain unresolved.'
  related_work_outline_zh:
  - 主流方向：多智能体LLM系统通过角色分工和迭代评审自动完成文献综述、综述草拟和论文生成。
  - 研究共性：将学术工作拆分为检索、起草、验证、评审，并用LLM评分、基准任务或人工与同行评审信号衡量质量。
  - 关键差异：评测目标涵盖综述评分、领域发现基准、端到端论文完成和通用科学基准；交互方式与领域部署也不相同。
  - 趋势演进：现有证据集中在2025-2026前沿，从独立综述生成框架走向自我演化代理基础设施和显式失败分析。
  - 开放问题：外部有效性、与人类专家判断一致性、引文正确性、可复现性及文献搜索与缺口发现的单独评测仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Rubric-guided survey generation systems, exemplified by ARISE
      what_it_solves: Converts topic prompts into structured survey manuscripts through
        role-specialized LLM agents and iterative reviewer feedback against behaviorally
        anchored rubrics.
      what_remains_open: Whether rubric-aligned quality scores predict acceptance
        by human domain experts or factual citation reliability outside the evaluated
        corpus.
    - line: Verification-aware literature synthesis and paper generation systems,
        exemplified by ReasFlow
      what_it_solves: Integrates verification, knowledge retrieval, literature synthesis,
        theorem proving, experimentation, and manuscript preparation in one multi-agent
        workflow.
      what_remains_open: Generalizability beyond applied mathematics examples, with
        no visible limitations section or external benchmark comparison in the provided
        evidence.
    - line: Benchmark and human-baseline evaluation for AI scientists, exemplified
        by BAISBench
      what_it_solves: Creates expert-labeled discovery tasks and graduate-level human
        baselines to compare AI scientist capabilities on real scientific data.
      what_remains_open: Tasks are limited to omics biology discovery and do not isolate
        literature search, citation analysis, or survey synthesis as independent skills.
    - line: Domain-agnostic self-evolving agent frameworks, exemplified by EvoMaster
      what_it_solves: Provides scalable infrastructure for hypothesis refinement,
        self-critique, and knowledge accumulation across multiple scientific benchmarks.
      what_remains_open: Only self-reported benchmark scores are visible in this packet;
        external validation and reproducible adaptation across arbitrary disciplines
        remain open.
    - line: Failure-mode case studies and design-principle analysis, exemplified by
        Why LLMs Aren't Scientists Yet
      what_it_solves: Documents recurring failure modes such as training-data default
        bias, implementation drift, memory degradation, overexcitement, and weak scientific
        taste in autonomous research attempts.
      what_remains_open: Based on only four end-to-end attempts, with no controlled
        evidence that the proposed design principles prevent these failures in literature-review
        workflows.
    consensus:
    - Multiple systems decompose literature and scholarly workflows into specialized
      LLM agents for retrieval, drafting, verification, and review.
    - Automated quality scoring depends on LLM-based rubrics or benchmark-derived
      metrics rather than established human peer review.
    - Human oversight remains present, either as a principal-investigator role or
      through human baseline comparisons.
    - Current evidence is mostly self-reported on curated tasks or small case studies;
      external validation and reproducible comparison are limited.
    disagreements:
    - 'Evaluation target differs: one line optimizes rubric-aligned survey quality;
      another measures domain-specific discovery through expert-labeled multiple-choice
      and annotation tasks; another evaluates end-to-end paper completion or acceptance.'
    - 'Interaction mode differs: some systems position a human as principal investigator
      who inspects outputs, while others emphasize continuous self-evolution and accumulated
      agent knowledge.'
    - Domain deployment differs across applied mathematics, omics biology, machine
      learning papers, and general scientific benchmarks, implying different evidence
      requirements and task constraints.
    - 'Supervision signal differs: structured behaviorally anchored rubrics versus
      human expert baselines versus multi-AI or human review of generated papers.'
    open_questions:
    - Do LLM-rubric quality scores align with human expert judgment and real scientific
      utility outside the evaluated corpus?
    - Can these systems maintain citation correctness, evidence traceability, and
      gap discovery across long-horizon literature reviews?
    - Do verification loops and self-evolution mechanisms reduce documented failure
      modes beyond four-case or benchmark-specific evidence?
    - What benchmark design would isolate literature search, paper reading, citation
      analysis, and research gap discovery from broader AI-scientist abilities?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 以评分准则引导的综述生成系统，如 ARISE
      解决的问题: 把主题提示转化为结构化综述，通过角色化LLM代理和迭代评审反馈提升质量。
      尚未覆盖: 评分准则得分是否代表领域专家接受度与引文可靠性仍无外部验证。
    - 路线: 带验证的文献综合与论文生成系统，如 ReasFlow
      解决的问题: 整合验证、知识检索、文献综合、定理证明、实验和手稿生成。
      尚未覆盖: 仅在应用数学案例中展示，缺少可见局限性或外部基准比较。
    - 路线: AI科学家的基准与人类基线评测，如 BAISBench
      解决的问题: 用专家标注的发现任务和研究生水平人类基线比较AI科学家能力。
      尚未覆盖: 任务限于组学数据，不能单独覆盖文献检索、引文分析和综述综合。
    - 路线: 领域无关的自我演化代理框架，如 EvoMaster
      解决的问题: 提供可扩展的假设优化、自我批判和知识积累基础设施。
      尚未覆盖: 仅报告四个基准的自报分数，缺少跨领域外部验证和可复现证据。
    - 路线: 失败模式案例与设计原则分析，如 Why LLMs Aren't Scientists Yet
      解决的问题: 记录训练默认偏见、实现漂移、记忆退化、过度兴奋和科学品味薄弱等失败模式。
      尚未覆盖: 端到端尝试数量少，缺少控制实验证明设计原则能防止这些失败。
    共识:
    - 多个系统把文献和学术工作流拆分成检索、起草、验证、评审等角色化LLM代理。
    - 自动质量评分主要依赖LLM评分准则或基准指标，而非成熟的人类同行评审。
    - 人类监督仍以首席研究员角色或人类基线比较形式存在。
    - 现有证据多为自报分数或小样本案例，外部验证和可复现性不足。
    分歧:
    - 评测目标不同：综述评分、领域发现问答、端到端论文完成或通用科学基准各有侧重。
    - 交互模式不同：有的以人类首席研究员审阅为循环，有的侧重代理自我演化和知识积累。
    - 领域部署不同：应用数学、组学生物、机器学习论文与通用科学场景对证据要求不同。
    - 监督信号不同：有结构化评分准则、人类专家基线、多AI或人类评审等不同反馈。
    开放问题:
    - LLM评分准则得分能否与人类专家判断及真实科研效用一致？
    - 长篇幅文献综述中能否保持引文正确、证据可追踪和缺口发现能力？
    - 验证循环与自我演化机制能否在超过四次案例或特定基准之外减少已记录的失败模式？
    - 哪种基准设计能单独评估文献检索、阅读、引文分析和缺口发现，而不仅是AI科学家整体能力？
