  related_work_outline:
  - 'Mainstream direction: Autonomous multi-agent research pipelines that generate,
    execute, verify, and refine hypotheses through LLM cognition, executable experiment
    loops, verification gates, and targeted human oversight.'
  - 'Shared research pattern: Moving from candidate directions to evidence by grounding
    ideas in literature, diagnostics, or prior failures, running code, checking validity,
    and feeding failure signals back for self-correction.'
  - 'Key differences: Domain-specific physics/data verification versus domain-agnostic
    evolving frameworks and interactive labs; failure handling varies by debate, multi-hypothesis
    attribution, self-healing, or authority separation; evaluation spans domain metrics,
    general benchmarks, expert preference, and blind scoring.'
  - 'Trend evolution: Within the 2023-2026 frontier, work shifts from isolated ideation
    toward end-to-end self-evolving agents with stronger reporting integrity, verification
    gates, human collaboration, and reusable benchmarks.'
  - 'Open questions: Reliability of validity gates, generalization beyond internal
    or single-domain cases, optimal human intervention modes, and whether benchmark
    gains map to real scientific discovery utility.'
  related_work_outline_zh:
  - 主流方向：自主多智能体研究流水线，以LLM认知、可执行实验循环、验证门控和人在环路监督来生成、执行、验证并迭代假设。
  - 研究共性：从想法到证据的闭环，以文献或诊断结果为基础生成研究方向，通过代码执行、有效性检查和失败反馈进行自我纠正。
  - 关键差异：领域专用物理验证与领域无关演化框架、交互式平台并存；失败处理分多假设归因、自愈执行、认知-权威分离或人机干预；评测目标从领域指标到通用基准和专家偏好。
  - 趋势演进：在2023-2026前沿区间，系统从单点构思转向端到端自演化智能体，更强调可验证报告、人在环路和可复用基准。
  - 开放问题：验证门控的可靠性、内部基准之外的泛化、最优人机协作模式，以及基准提升与真实科学发现之间的关系。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous multi-agent research pipelines with human collaboration
      what_it_solves: Turn hypothesis generation into executable experiment loops
        with structured debate, self-healing execution, verifiable reporting, and
        human intervention points.
      what_remains_open: Generalizability beyond curated benchmarks and internal case
        studies remains uncertain; intervention modes lack cross-task standardization.
    - line: Self-correcting failure attribution and evidence-grounded search
      what_it_solves: Convert failed experiments into causal explanations and route
        interventions to the hypothesis, experimental design, or implementation level.
      what_remains_open: Conference-ready autonomous writing remains unresolved; diagnosis
        depends on detectable failure signals and evaluation coverage.
    - line: Domain-specific discovery agents with physics or data verification
      what_it_solves: Constrain autonomous ideation and code modification with domain
        validity checks before results are accepted or written.
      what_remains_open: Verification gates still miss planted silent failures, and
        transfer beyond the demonstrated domain is not established.
    - line: Benchmarks and human-baseline evaluation for AI scientists
      what_it_solves: Compare AI scientists on real data tasks using expert human
        performance and discovery-oriented questions.
      what_remains_open: Task diversity, sample sizes, and agreement between proxy
        metrics and true scientific utility need broader evidence.
    - line: Foundational evolving frameworks and conceptual surveys
      what_it_solves: Provide domain-agnostic self-evolution or organize systems,
        metrics, frameworks, and challenges for scale.
      what_remains_open: External validation across disciplines, hardware, and user
        settings is missing; categories have not been shown to predict behavior.
    consensus:
    - Systems increasingly couple LLM ideation with executable experiments and iterative
      refinement rather than producing text-only hypotheses.
    - Verification gates and verifiable reporting are treated as necessary to reduce
      fabricated metrics and hallucinated citations.
    - Targeted human collaboration at high-leverage decision points is reported to
      outperform both full autonomy and exhaustive oversight.
    - Evaluation is moving toward real datasets, expert human or judge baselines,
      and task-specific metrics, although maturity varies.
    disagreements:
    - 'Interaction mode differs: structured multi-agent debate, self-healing single
      pipelines, cognition-authority separation, or interactive monitored teams.'
    - 'Supervision and evaluation targets differ: domain-specific metrics, general
      benchmark suites, AI expert preference, and blind artifact scoring.'
    - 'Failure handling differs: pre-emptive validity gates, multi-hypothesis causal
      attribution, self-healing retry loops, and cross-run evolutionary memory.'
    - 'Deployment settings differ: domain-specific discovery agents, domain-agnostic
      frameworks, and interactive platforms with rollback/resume and artifact inspection.'
    open_questions:
    - Can current validity gates and failure attribution reach reliability levels
      sufficient for closed-loop scientific discovery beyond curated tasks?
    - Do reported benchmark gains translate to real scientific discovery utility when
      evaluations use internal case studies or single-domain datasets?
    - What human interaction modes generalize across research workflows, and at which
      decision points should humans intervene?
    - Where are missing code, datasets, metrics, baselines, or limitation reports
      verification gaps rather than evidence of absence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主多智能体研究流水线与人机协作
      解决的问题: 把假设生成、实验执行、验证和报告整合为可运行闭环，并在高杠杆决策点引入人类干预。
      尚未覆盖: 超出精选基准和内部案例的外部有效性不确定，人机干预模式缺少跨任务标准化。
    - 路线: 失败自纠正与多假设归因
      解决的问题: 将实验失败转化为因果解释，并路由到假设、实验设计或实现层进行修复。
      尚未覆盖: 会议级自主写作仍未解决，诊断依赖可观测失败信号和评测覆盖。
    - 路线: 领域专用验证与发现智能体
      解决的问题: 在结果被接受或撰写前，用物理或数据检查约束自主构思与代码修改。
      尚未覆盖: 验证门仍漏检植入的静默失败，跨领域迁移证据不足。
    - 路线: AI科学家基准与人类基线评测
      解决的问题: 在真实数据任务上用专家人类基线和发现导向问题比较AI科学家。
      尚未覆盖: 任务多样性、样本量以及代理指标与真实科研效用的一致性仍缺少更广证据。
    - 路线: 领域无关演化框架与综述分类
      解决的问题: 提供自演化基础设施或系统分类，以规模化构建科研智能体。
      尚未覆盖: 缺少跨学科、跨硬件和用户场景的外部验证，分类预测行为未直接验证。
    共识:
    - 多数工作将LLM构思、可执行实验和迭代改进结合，不再只生成文本假设。
    - 验证门控和可验证报告被视为防止伪造指标和幻觉引用的必要条件。
    - 高杠杆决策点的精准人类协作优于完全自主或逐步过度监督。
