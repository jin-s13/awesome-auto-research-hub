  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: Covers idea generation, code/experiment execution, result visualization,
        and full paper drafting in a single agent pipeline.
      what_remains_open: Cross-domain consistency and whether generated manuscripts
        are accepted beyond workshop or rubric-level evaluations.
    - line: Verification and grounded reporting for generated artifacts
      what_it_solves: Detects or prevents invalid results, hallucinated numbers/citations,
        and silent experimental failures before paper acceptance.
      what_remains_open: Verification gates can miss domain-specific failures; evidence
        is limited to a small number of planted or benchmark failure cases.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Allocates human oversight to high-leverage decision points instead
        of fully manual or fully autonomous workflows.
      what_remains_open: Optimal intervention modes and their transferability across
        disciplines and task lengths are not established.
    - line: Automated review and evaluation
      what_it_solves: Provides scalable LLM/VLM-based scoring of generated papers
        and research artifacts, including rubric, acceptance threshold, and blind
        comparison signals.
      what_remains_open: Agreement with human peer review and coverage of rigorous
        theoretical, empirical, and domain-specific work is incomplete.
    - line: Failure analysis and design principles
      what_it_solves: Turns failed autonomous runs into recurring failure modes, attribution
        mechanisms, and system design guidance.
      what_remains_open: Design categories need direct empirical validation that they
        predict downstream success and improve artifact quality.
    consensus:
    - End-to-end pipelines now couple experiment execution with manuscript drafting
      and review, moving beyond isolated text generation.
    - Verification and grounded reporting are treated as necessary for trustworthy
      generated papers, not as optional add-ons.
    - Automated LLM/VLM reviewers or rubrics are used as scalable evaluation proxies,
      often compared to human acceptance thresholds or blind scores.
    - Selective human oversight can improve robustness, and full autonomy remains
      inconsistent across runs.
    - Reproducibility signals such as open-source code or artifacts are present but
      uneven, especially for systems evaluated on proprietary or domain-specific setups.
    disagreements:
    - 'Supervision level: systems differ between full autonomy, structured human-in-the-loop
      intervention, and PI-graduate-student collaboration.'
    - 'Verification anchor: logical/theorem audits, vision-language physical validity
      gates, grounded numeric/citation reporting, and causal failure attribution target
      different failure modes.'
    - 'Evaluation target: acceptance thresholds, rubric scores, benchmark success
      rates, artifact quality, and blind review scores are not directly comparable.'
    - 'Domain scope: general ML workspace systems contrast with applied mathematics
      and computational fluid dynamics systems that embed domain-specific knowledge/validation.'
    - 'Reported capability: some claim workshop-level peer review acceptance; others
      report only rubric or benchmark improvements, leaving conference-level generalization
      unresolved.'
    open_questions:
