  related_work_outline:
  - 'Mainstream direction: Agentic LLM pipelines dominate survey generation, using
    specialized agents for retrieval, outline planning, drafting, and review/refinement.'
  - 'Shared research pattern: Systems iterate over retrieved literature, produce structured
    summaries or paper cards, then refine drafts against rubrics or multi-LLM evaluators.'
  - 'Key differences: Some emphasize end-to-end drafting quality, others target retrieval
