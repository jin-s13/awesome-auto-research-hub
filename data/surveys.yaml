  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research frameworks
      what_it_solves: Automating the full research cycle from idea generation to paper
        writing, reducing cost and human effort for open-ended scientific discovery
        in machine learning and related fields.
      what_remains_open: The generated contributions are often incremental or contain
        subtle errors that escape automated review; cross-domain generalization and
        consistency across multiple runs are not guaranteed.
    - line: Domain-specific AI scientist systems with physics or logic verification
      what_it_solves: Extending autonomous research to disciplines like computational
        fluid dynamics and applied mathematics, where silent errors are common, by
        embedding domain-aware verification gates (e.g., vision-language flow inspection,
        logical coherence audits).
      what_remains_open: Verification gates are not perfect (missed silent failures)
        and currently rely on domain-specific heuristics; it is unclear how to transfer
        such verification to other scientific domains without redesigning the gate.
    - line: Human–AI collaboration and self‑improving execution
      what_it_solves: Combining structured multi-agent debate, self-healing execution
        loops, and selective human intervention to improve robustness over fully autonomous
        systems, and transforming past failures into future safeguards.
      what_remains_open: The optimal points and modes of human intervention are not
        systematically characterized; the improvement from human feedback is shown
        only in controlled benchmarks, not in real-world research productivity.
    - line: Benchmarks and evaluation environments for AI scientists
      what_it_solves: Providing standardized tasks, metrics, and human baselines to
        compare AI scientists on a complete discovery cycle, covering skills like
        hypothesis formation, experiment design, and knowledge extraction across diverse
        science topics.
      what_remains_open: Current benchmarks are either synthetic text-based environments
        or narrow domain-specific question sets; they do not yet capture the open-ended,
        long-term nature of real scientific discovery, and proxy metrics may not align
        with genuine research impact.
    consensus:
    - All systems decompose the research process into subtasks (ideation, coding,
      experimentation, analysis, writing) handled by LLM-driven agents, and rely on
      automated verification to reduce factual errors and hallucinated results.
    - There is broad agreement that fully autonomous scientific discovery is not yet
      reliable; even the best systems require some form of validation or human oversight
      to produce defensible results.
    - The cost per generated paper has dropped to tens of dollars, making large-scale
      automated research economically feasible, but the quality of those papers remains
      below that of expert human researchers.
    disagreements:
    - 'Degree of autonomy: some works argue for fully automated pipelines with AI
      reviewers, while others demonstrate that strategic human intervention at high-leverage
      decision points substantially outperforms either full autonomy or exhaustive
      step-by-step oversight.'
    - 'Evaluation methodology: the community uses divergent evaluation targets—simulated
      automated reviewer scores, acceptance at a real workshop, task completion in
      a synthetic environment, or multiple-choice questions on domain data—leading
      to claims that are not directly comparable.'
    - 'Domain scope: existing systems are split between general machine learning exploration
      and tightly scoped disciplinary problems (e.g., fluid dynamics, single-cell
      biology), and it is unclear whether advances in one setting transfer to the
      other.'
    open_questions:
    - How can we verify that an AI-generated scientific claim is novel, correct, and
      reproducible beyond the specific experiment shown, especially when the system
      can also fabricate citations and results?
    - What is the right granularity of human intervention to maximize discovery quality
      without unduly burdening the human expert, and can this be learned adaptively
      per research stage?
    - Do current benchmarks, which focus on short-term task completion or isolated
      questions, predict the ability of an AI scientist to make genuine long-term
      contributions to a scientific field?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究框架
      解决的问题: 自动化从创意生成到论文写作的完整研究周期，降低开放科学发现中的人力和成本，最初应用于机器学习领域。
      尚未覆盖: 生成贡献常为增量式或包含自动评审未能捕获的细微错误；跨领域泛化及多次运行间的一致性尚未保证。
    - 路线: 具备物理或逻辑验证的领域特定AI科学家系统
      解决的问题: 通过嵌入领域感知验证门（如视觉-语言流场检查、逻辑一致性审计），将自主研究扩展到计算流体动力学和应用数学等易出现静默错误的学科。
      尚未覆盖: 验证门并不完美（会遗漏静默失败）且依赖领域特定启发式方法；如何不重新设计门控而迁移到其他科学领域尚不清楚。
    - 路线: 人机协作与自我改进执行
      解决的问题: 结合结构化多智能体辩论、自愈执行循环和选择性人类干预，提升相对于全自主系统的鲁棒性，并将过去失败转化为未来保障。
      尚未覆盖: 人类干预的最佳时机和模式未被系统化表征；人类反馈带来的改进仅在受控基准中展示，而非真实研究生产力。
    - 路线: AI科学家基准与评估环境
      解决的问题: 提供标准化任务、指标和人类基线，以比较AI科学家在完整发现周期上的表现，涵盖假设形成、实验设计和知识提取等多种科学技能。
      尚未覆盖: 当前基准要么是合成文本环境，要么是狭窄的领域特定问答集；它们尚未捕捉到真实科学发现的开放式、长期特性，且代理指标可能与真实研究影响力不一致。
    共识:
    - 所有系统都将研究过程分解为子任务（构思、编码、实验、分析、写作），由LLM驱动的智能体处理，并依赖自动验证来减少事实错误和幻觉结果。
    - 普遍认为完全自主的科学发现尚不可靠；即使最佳系统也需要某种形式的验证或人类监督才能产生可辩护的结果。
    - 每篇论文生成成本已降至数十美元，使大规模自动化研究在经济上可行，但论文质量仍低于人类专家水平。
    分歧:
    - 自主程度：一些工作主张完全自动化流程及AI评审，另一些则证明在高杠杆决策点进行战略性人类干预显著优于完全自主或详尽的逐步监督。
    - 评估方法：社区使用不同的评估目标——模拟自动审稿评分、真实工作坊接收、合成环境中的任务完成度或领域数据选择题——导致主张无法直接比较。
    - 领域范围：现有系统分为通用机器学习探索和严格限定的学科问题（如流体动力学、单细胞生物学），尚不清楚其中一种场景的进展能否迁移到另一种。
    开放问题:
    - 如何验证AI生成的科学主张在所示实验之外是新颖、正确且可复现的，尤其是当系统亦可伪造引用和结果时？
    - 在最大化发现质量且不过度增加人类专家负担的前提下，人类干预的合适粒度是什么？能否根据研究阶段自适应学习？
    - 当前关注短期任务完成或孤立问题的基准，能否预测AI科学家对科学领域做出真正长期贡献的能力？
