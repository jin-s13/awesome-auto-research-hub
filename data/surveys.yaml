    - 路线: 集成式科学智能体编排
      解决的问题: 将假设形成、实验、解释和文献证据组织为集成式科学发现循环，并将组件级自动化作为近期目标。
      尚未覆盖: 完整组件集成仍未解决；证据包没有提供发现级定量指标，最强主张是 2050 年目标而非已实现结果。
    - 路线: 可靠性与对抗评测
      解决的问题: 评估自动化审阅及相关智能体流程在对抗性文本攻击或基准压力下的脆弱性。
      尚未覆盖: 对抗鲁棒性证据尚未与真实审阅质量、专家接受度或决策效用建立联系，缺少统一评测协议。
    共识:
    - 研究普遍使用 LLM 编排的智能体来规划互补子查询、提取证据并合成输出，而非依赖单步检索。
    - 引用质量是反复出现的评测目标，通常通过 Citation F1 或与专家共识的一致性来衡量。
    - 文献综述自动化被视为横跨检索、证据基础、写作和审阅的集成问题，组件集成仍是核心挑战。
    分歧:
    - 系统拓扑不同：单一 LLM 编排、多智能体角色分工、迭代或层级组织并存。
    - 输出目标不同：面向下游智能体的数据库知识层、完整综述稿件、以及同行评审鲁棒性各有侧重。
    - 评测设置不同：文献综合/声明验证/问答基准、与人类综述的相似度、以及对抗性文本攻击不可直接比较。
    开放问题:
