    consensus:
    - Hypothesis generation in current systems is embedded in iterative workflows
      that couple literature grounding, data analysis, and experimentation rather
      than isolated idea proposal.
    - LLM agents benefit from structured decomposition, tool use, and feedback loops
      for hypothesis refinement and result synthesis.
    - 'Autonomy is domain-conditioned: structured, executable, and rapidly verifiable
      settings are treated as more tractable than embodied, delayed, or ethically
      constrained contexts.'
    - Verification gaps remain around factual accuracy, provenance, weak hypothesis
      rejection, and cross-domain reproducibility.
    disagreements:
    - 'Systems differ in the role of human judgment: some automate full discovery
      cycles, while others argue that targeted human collaboration at high-leverage
      decisions outperforms exhaustive oversight or full autonomy.'
    - Search and exploration mechanisms vary from tree-based evolutionary branching
      with backtracking to parallel open-ended iterative cycles over many agent rollouts.
    - Evaluation regimes differ by domain and evidence type, including general research
      tasks, equation discovery datasets, biology lab tasks, and wet-lab validation,
      making direct comparison difficult.
    - Contributions range from system-level demonstrations to conceptual surveys,
      with differing emphasis on reproducibility artifacts and independent accuracy
      judgments.
    open_questions:
