  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research writing pipelines
      what_it_solves: Automates the full cycle from idea generation to manuscript
        writing, reducing human effort per paper.
      what_remains_open: Generated papers rarely pass full conference peer review;
        cross-domain generalization beyond template tasks is unproven; high rates
        of implementation drift and hallucinated citations persist.
    - line: Internal verification and self-correction mechanisms
      what_it_solves: Improves scientific correctness by detecting and correcting
        logical errors, physical implausibilities, or invalid metrics through automated
        checks.
      what_remains_open: Verification gates can miss certain silent failures (e.g.,
        2 of 16 missed in CFD ablation); no system guarantees elimination of all hallucinated
        claims or code errors across diverse scientific domains.
    - line: Human-AI collaboration paradigms
      what_it_solves: Balances autonomy and human oversight by allowing targeted interventions
        at high-leverage decision points, raising output quality over fully autonomous
        agents.
      what_remains_open: The optimal mode and granularity of human intervention are
        not established; performance gains depend heavily on expert availability and
        may not scale to non-expert users.
    - line: Failure mode analysis and design principles
      what_it_solves: Catalogues recurring failure patterns (e.g., training data bias,
        memory degradation, weak scientific taste) and derives system design guidelines.
      what_remains_open: The identified principles are derived from a limited set
        of attempts and domains; their generalizability to other scientific fields
        or agent architectures has not been empirically validated.
    consensus:
    - Scientific writing automation requires a staged decomposition covering hypothesis
      formation, experimental execution, result verification, and manuscript generation.
    - A verification or review step is essential to prevent the propagation of hallucinated
      results and fabricated numbers.
    - Current LLM-based agents suffer from implementation drift, context degradation,
      and overexcitable reporting of false successes.
    disagreements:
    - 'Verification strategy: some systems use text-based LLM review (AI Scientist,
      AI Scientist-v2), others employ vision-language physics gates (AI CFD Scientist),
      and others use multi-hypothesis causal attribution (SAGE).'
    - 'Autonomy level: systems range from fully autonomous without human intervention
      (AI Scientist, SAGE) to collaborative frameworks with structured intervention
      modes (AutoResearchClaw, ReasFlow).'
    - 'Domain specificity: some works target general ML subfields, while others are
      tightly engineered for computational fluid dynamics or applied mathematics,
      raising questions about the portability of validation components.'
    - 'Failure correction: single-loop reflection is used in earlier systems, while
      later work introduces structured root-cause routing and multi-hypothesis diagnosis
      to direct corrections to the appropriate level (hypothesis, design, or implementation).'
    open_questions:
    - Can autonomous writing agents produce genuinely novel hypotheses rather than
      recombining known patterns from training data, and how would this be verified?
    - How can verification mechanisms be designed to cover the full spectrum of scientific
      errors, including subtle logical flaws, numerical inconsistencies, and missing
      negative results?
    - What is the most cost-effective balance between full autonomy and human collaboration,
      and does this balance shift across different scientific disciplines or paper
      types?
    - Do the design principles derived from observed failure modes transfer to domains
      outside machine learning and computational science, or do they require domain-specific
      adaptation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研写作流水线
      解决的问题: 自动化从想法生成到论文写作的完整循环，减少单篇论文的人工投入。
      尚未覆盖: 生成的论文很少能通过完整会议同行评审；跨领域泛化超出模板任务尚未验证；实现漂移和幻觉引用率仍高。
    - 路线: 内部验证与自纠正机制
      解决的问题: 通过自动检查发现和纠正逻辑错误、物理不可信或无效指标，提升科学正确性。
      尚未覆盖: 验证门控可能遗漏某些静默失败（如CFD消融中漏掉16个中的2个）；尚无系统能保证在多样科学领域消除所有幻觉声明或代码错误。
    - 路线: 人机协作范式
      解决的问题: 在自主性和人类监督之间取得平衡，在高杠杆决策点进行定向干预，提升输出质量。
      尚未覆盖: 最优干预模式和粒度未确定；性能提升高度依赖专家可用性，可能无法扩展至非专家用户。
    - 路线: 失败模式分析与设计原则
      解决的问题: 分类重复失败模式（如训练数据偏见、记忆退化、薄弱的科学品味），并推导系统设计指南。
      尚未覆盖: 识别出的原则源自有限尝试和领域；其向其他科学领域或智能体架构的泛化性未经实证验证。
    共识:
    - 科学写作自动化需要分阶段分解，涵盖假设形成、实验执行、结果验证和手稿生成。
    - 验证或评审步骤对于防止幻觉结果和伪造数字的传播至关重要。
    - 当前基于LLM的智能体普遍存在实现漂移、上下文退化和错误宣称成功的过度兴奋问题。
    分歧:
    - 验证策略：部分系统使用基于文本的LLM评审（AI Scientist, AI Scientist-v2），另一些采用视觉-语言物理门控（AI CFD Scientist），还有一些使用多假设因果归因（SAGE）。
    - 自主程度：从无需人工干预的完全自主（AI Scientist, SAGE）到具有结构化干预模式的协作框架（AutoResearchClaw, ReasFlow）。
    - 领域专一性：部分工作面向通用ML子领域，而其他则紧密针对计算流体动力学或应用数学进行工程化，这引发了对验证组件可移植性的质疑。
    - 失败纠正：早期系统使用单循环反思，近期工作引入结构化根因路由和多假设诊断，将纠正定向到适当层面（假设、设计或实现）。
    开放问题:
    - 自主写作智能体能否产生真正新颖的假设，而非仅仅重组训练数据中的已知模式，以及如何验证这一点？
    - 如何设计验证机制以覆盖所有科学错误类型，包括细微的逻辑缺陷、数值不一致和缺失的负面结果？
    - 完全自主与人机协作之间最具成本效益的平衡点是什么，这一平衡是否因科学学科或论文类型而异？
    - 从观察到的失败模式中推导出的设计原则，能否迁移到机器学习与计算科学之外的领域，还是需要领域特定适配？
