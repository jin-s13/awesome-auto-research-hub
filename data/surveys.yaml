  related_work_outline_zh:
  - 主流方向：构建自动化科研智能体，并配套评估与验证基础设施，以判断其生成的研究主张是否可靠、可复现。
  - 研究共性：多数工作将科研发现看作从假设、实验到分析、论文撰写的闭环流程，并通过任务、评分指标或有效性门控进行评估。
  - 关键差异：不同工作在评测目标（任务完成、证据成熟度、同行评审）、领域通用性与领域专用验证、交互模式（自主、基准测试或人在回路）上存在明显不同。
  - 趋势演进：在2024至2026年的可见证据中，焦点从通用自主科研框架转向基于证据的盲式基准、领域专用验证门控和可复现多智能体基础设施。
