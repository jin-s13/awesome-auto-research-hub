  literature_review:
    line_of_work_matrix:
    - line: Agentic multi-stage survey generation workflows
      what_it_solves: Produce long-form scholarly surveys by decomposing work into
        retrieval, planning, drafting, review, and refinement agents.
      what_remains_open: Improvement is mostly shown with LLM or rubric judges; limited
        evidence that these scores correspond to researcher utility or transfer across
        domains.
    - line: Iterative outline and taxonomy organization
      what_it_solves: Build hierarchical outlines and paper-to-category structures
        so reviews are coherent and navigable.
      what_remains_open: Generated taxonomies still show high sibling overlap, MECE
        violations, structural imbalance, and low semantic alignment with expert taxonomies.
    - line: Evidence-constrained retrieval and citation grounding
      what_it_solves: Ground claims in retrieved full-text evidence and reduce citation
        hallucination or misattribution.
      what_remains_open: Best evaluated retrieval only recalls 20.92% of expert-cited
        papers; code-repository and full-text signals vary across domains.
    - line: Evaluation and benchmarking for survey generation
      what_it_solves: Make survey-generation claims comparable through benchmarks,
        metrics, baselines, expert taxonomies, and human preference.
      what_remains_open: Topic diversity is limited; automatic scores and human or
        expert preferences are not yet strongly linked; many papers omit limitations.
    - line: Governed and reproducible end-to-end research systems
      what_it_solves: Orchestrate evidence generation and manuscript drafting inside
        privacy, governance, and reproducibility constraints.
      what_remains_open: Validation remains mainly a single biomedical case study
        with weak external replication signals across datasets and settings.
    consensus:
    - Automated survey generation is approached as a decomposed multi-agent or multi-stage
      workflow rather than a single prompt response.
    - Iterative refinement with explicit review, rubric, or evaluator feedback is
      a shared mechanism for improving drafts.
    - Retrieval and citation fidelity are treated as first-class reliability concerns
      across systems.
    - Evaluation includes structural coherence, content coverage, and citation or
      organization alignment, although exact metrics vary.
    disagreements:
