  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery workflows
      what_it_solves: Turns research ideas into code, experiments, visualization,
        paper drafting, and automated review loops.
      what_remains_open: Reliability and validity gates, control and falsifiability
        evidence, stability across runs, and generalization beyond template or workshop
        settings.
    - line: Evaluation environments and benchmark tasks for discovery agents
      what_it_solves: Provides comparable tasks for complete discovery cycles or domain-specific
        decisions such as annotation and inference.
      what_remains_open: Proxy metrics may not match real scientific utility; domain
        diversity, hidden-target versus discovery framing, and human baseline coverage
        remain limited.
    - line: Evidence-grounded epistemic assessment
      what_it_solves: Scores claims on controls, robustness, falsifiability, cross-dataset
        generalization, auditability, and novelty.
      what_remains_open: Evidence currently comes from one frozen base model, agents
        score close together, and LLM-judge reliability is not independently established.
    - line: Domain-specific verification and safety gates
      what_it_solves: Catches silent failures in specialized workflows through validity
        checks such as physical field inspection.
      what_remains_open: Sparse failure-injection evidence still shows missed failures,
        and transfer to other domains or experimental settings is unproven.
    - line: Reproducible multi-agent research infrastructure
      what_it_solves: Creates customizable roles, real-time monitoring, code execution,
        artifact inspection, rollback, and experiment feedback loops.
      what_remains_open: Validation is limited to few internal case studies; standardized
        external validation across platforms, hardware, datasets, and users is missing.
    consensus:
    - LLM-based agents can execute and document experimental analyses competently,
      but current systems plateau or fall short on scientific judgment such as controls,
      robustness, falsifiability, and cross-dataset generalization.
    - Automated evaluation needs explicit evidence dimensions rather than only judging
      generated manuscripts or task completion.
    - Open code, benchmark tasks, and verification gates are treated as necessary
      for surfacing challenges that generic autonomous research frameworks miss.
    - Current systems show research-support potential, but trustworthy fully autonomous
      scientific discovery remains far from demonstrated.
    disagreements:
    - 'Evaluation target differs: some focus on generated research artifacts, others
      on complete simulated discovery tasks, evidence maturity, physical validity,
      or interactive multi-agent quality.'
    - 'Verification mechanism differs: some use domain-specific visual or physical
      gates, others use general methodological criteria, automated LLM judges, or
      human expert judges.'
    - 'Generalization evidence differs: some results depend on a single frozen base
      model or a few internal case studies, while others provide broader domain tasks
      and human baselines.'
    - 'Interaction mode differs: some systems are fully automated end-to-end workflows,
      while others emphasize human monitoring, rollback, and customizable research
      teams.'
    open_questions:
    - Can automated judges and verification gates reliably detect silent failures
      and unsupported claims outside planted ablations and across scientific domains?
    - Do task completion, paper acceptance, or evidence-maturity scores transfer to
      real scientific discovery value and decision utility?
    - How stable are agent rankings across different base models, domain datasets,
      and evaluation protocols given the current limited generalization evidence?
    - Which minimal controls, robustness checks, and falsifiability criteria should
      be standardized for governing autonomous research workflows?
