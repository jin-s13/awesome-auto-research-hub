  - 主流方向：构建端到端的自主研究智能体，整合构思、实验执行、验证和论文生成，并日益强调特定领域的可靠性。
  - 研究共性：以大型语言模型作为核心推理引擎，协调科学工作流的多个阶段，包括文献综合、代码生成和结果分析。
  - 关键差异：系统在领域专一性（通用机器学习 vs. 应用数学 vs. 计算流体动力学 vs. 生物学）、验证机制（基于视觉的物理检查、逻辑证明审计、结构化辩论）和人类参与程度（完全自主
