  related_work_outline:
  - 'Mainstream direction: Autonomous AI scientist systems that integrate hypothesis
    generation, experiment execution, and result verification into end-to-end pipelines,
    with a growing emphasis on multi-agent architectures and self-improvement loops.'
  - 'Shared research pattern: Modular decomposition of the research process into ideation,
    implementation, validation, and reporting stages, with LLMs as the core reasoning
    engine and an increasing focus on failure handling and evaluation benchmarks.'
  - 'Key differences: Domain specificity versus domain-agnostic frameworks; simple
    reflection-based failure recovery versus structured multi-hypothesis causal attribution;
    the role and granularity of human-in-the-loop collaboration; and verification
    mechanisms ranging from vision-based physics checks to machine-checked formal
    proofs.'
  - 'Trend evolution: Within the 2025–2026 frontier, systems are rapidly moving from
    single-agent static pipelines toward multi-agent self-evolving frameworks, from
    ad-hoc validation to standardized benchmarks, and from informal error correction
    to structured failure attribution and formal verification.'
  - 'Open questions: How to design benchmarks that capture genuine scientific discovery
    utility; whether formal verification can bridge the gap between internal consistency
    and real-world truth; how self-improvement generalizes across domains without
    error accumulation; and what optimal human-AI interaction modes exist for different
    research stages.'
  related_work_outline_zh:
  - 主流方向：构建自主AI科学家系统，将假设生成、实验执行和结果验证整合为端到端流水线，并日益强调多智能体架构和自我改进循环。
  - 研究共性：将研究过程模块化分解为构思、实现、验证和报告阶段，以LLM为核心推理引擎，同时越来越重视失败处理和评估基准。
  - 关键差异：领域专用与领域无关框架；基于简单反思的失败恢复与结构化多假设因果归因；人机协作的角色和粒度；以及从基于视觉的物理检查到机器检查的形式化证明等不同验证机制。
  - 趋势演进：在2025-2026年前沿中，系统正从单智能体静态流水线快速转向多智能体自我演化框架，从临时验证转向标准化基准，从非正式纠错转向结构化失败归因和形式化验证。
  - 开放问题：如何设计能捕捉真实科学发现效用的基准；形式化验证能否弥合内部一致性与真实世界真理之间的鸿沟；自我改进如何跨领域泛化而不积累错误；以及不同研究阶段存在何种最优人机交互模式。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous research pipelines and multi-agent architectures
      what_it_solves: Integrating hypothesis generation, experiment design, code execution,
        and reporting into a coherent, runnable system that can be deployed with minimal
        human intervention.
      what_remains_open: Generalization across diverse scientific domains without
        manual reconfiguration, and prevention of cascading errors during long-running
        autonomous cycles.
    - line: Failure attribution and self-improvement
      what_it_solves: Enabling systems to recover from failed experiments by diagnosing
        root causes through reflection, multi-hypothesis analysis, or evolutionary
        mechanisms, then adjusting hypotheses or methods accordingly.
      what_remains_open: The correctness of internal causal attribution is not independently
        verified; self-improvement may plateau or amplify subtle errors without external
        feedback.
    - line: Evaluation benchmarks for scientific discovery
      what_it_solves: Providing standardized tasks and metrics to compare the performance
        of different AI scientist systems on hypothesis generation, experiment completion,
        and artifact quality.
      what_remains_open: Current benchmarks cover limited domains (e.g., omics, AI
        itself), and proxy metrics like completion rate or artifact quality may not
        align with real-world scientific impact.
    - line: Formal verification and correctness guarantees
      what_it_solves: Ensuring the validity of generated results through machine-checked
        proofs, physics-aware vision gates, or other verification mechanisms that
        detect hallucinations and silent failures.
      what_remains_open: Verification only guarantees correctness under formal assumptions,
        not that the formalization faithfully represents the intended scientific claim;
        verification gates themselves can miss failure modes.
    consensus:
    - All systems decompose the research process into modular stages (ideation, execution,
      validation, reporting) and use LLMs as the primary reasoning component.
    - Failure detection and handling is recognized as a critical bottleneck; even
      highly autonomous systems implement some form of error recovery or verification
      gate.
    - There is growing agreement that human-in-the-loop intervention, whether at key
      decision points or for final artifact review, remains essential for reliable
      scientific output.
    - Standardized benchmarks are emerging as a necessary evaluation tool, replacing
      ad-hoc case studies, though their scope and realism are still limited.
    disagreements:
    - 'Domain scope: some systems are tightly coupled to a specific scientific domain
      (e.g., computational fluid dynamics, causal inference) with built-in physics
      or formal verification, while others aim for domain-agnostic frameworks that
      can be instantiated with minimal code.'
    - 'Failure recovery strategy: simple reflection-based approaches re-prompt the
      same agent, whereas structured methods perform multi-hypothesis causal attribution
      to route corrections to the hypothesis, design, or implementation level.'
    - 'Human-AI interaction mode: designs range from fully autonomous runs with no
      human intervention to fine-grained oversight with seven intervention modes,
      and there is no consensus on the optimal granularity or leverage points.'
    - 'Verification mechanism: vision-language physics gates, machine-checked Lean
      proofs, and benchmark-based automatic scoring represent fundamentally different
      approaches to ensuring correctness, and their relative strengths and weaknesses
      are not yet empirically compared.'
    open_questions:
    - How can we design benchmarks that capture the long-term utility and novelty
      of scientific discoveries, rather than just short-term task completion metrics?
    - To what extent does formal verification of internally generated proofs translate
      to external scientific validity when the formalization itself may be flawed?
    - Can self-improvement loops sustain progress over many cycles without external
      validation, or do they inevitably suffer from error accumulation and model collapse?
    - What is the optimal allocation of human cognitive effort in AI scientist workflows,
      and how should it adapt to the complexity and risk of individual research steps?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主研究流水线与多智能体架构
      解决的问题: 将假设生成、实验设计、代码执行和报告整合为一致、可运行的系统，并能在最少人工干预下部署。
      尚未覆盖: 跨多种科学领域的泛化能力，以及长期自主运行中错误累积的防止。
    - 路线: 失败归因与自我改进
      解决的问题: 通过反思、多假设分析或演化机制诊断失败实验的根本原因，使系统能恢复并调整假设或方法。
      尚未覆盖: 内部因果归因的正确性未经独立验证；自我改进可能在没有外部反馈的情况下停滞或放大细微错误。
    - 路线: 科学发现评估基准
      解决的问题: 提供标准化任务和度量，比较不同AI科学家系统在假设生成、实验完成和工件质量上的表现。
      尚未覆盖: 现有基准覆盖领域有限（如组学、AI本身），完成率或工件质量等代理指标可能与真实科学影响力不一致。
    - 路线: 形式化验证与正确性保证
      解决的问题: 通过机器检查的证明、物理感知视觉门控或其他验证机制，确保生成结果的有效性，检测幻觉和静默失败。
      尚未覆盖: 验证仅在形式化假设下保证正确性，无法保证形式化忠实反映预期科学主张；验证门控本身可能遗漏失败模式。
    共识:
    - 所有系统都将研究过程分解为模块化阶段（构思、执行、验证、报告），并以LLM作为主要推理组件。
    - 失败检测与处理被公认为关键瓶颈；即使高度自主的系统也实现了某种形式的错误恢复或验证门控。
    - 人们越来越认同，在关键决策点或最终工件审查中引入人机协作，对于可靠的科学输出仍是必要的。
    - 标准化基准正作为必要的评估工具而出现，取代了临时案例研究，但其范围和真实性仍然有限。
    分歧:
