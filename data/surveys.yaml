  related_work_outline:
  - 'Mainstream direction: Autonomous multi-agent research agents that generate hypotheses,
    execute experiments, and report results in closed loops; most systems add verification,
    self-correction, or human-in-the-loop control to improve reliability.'
  - 'Shared research pattern: Systems separate ideation from evidence by requiring
    executed metrics, validity checks, or verifiable reporting; failure analysis feeds
    later iterations rather than ending at a single reflection.'
  - 'Key differences: Where verification authority lives, including domain-specific
    visual or physics gates, deterministic source-control authorities, human checkpoints,
    or learned failure attribution; evaluation targets range from domain discoveries
    to general benchmarks and internal case studies.'
  - 'Trend evolution: Within 2025-2026 the area is moving from surveys and benchmarks
    toward integrated autonomous research agents with self-correction, domain-specific
    validity gates, and optional human collaboration.'
  - 'Open questions: Verification gaps still allow silent failures; benchmark gains
    may not transfer to real discovery; optimal human intervention, cross-domain reuse,
    reproducibility, and ethical reliability remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以自主多智能体研究智能体为主，形成提出假设、执行实验、报告结果的闭环；多数系统加入验证、自我纠正或人机协作以提高可靠性。
  - 研究共性：系统通常将构思与证据分离，要求执行指标、有效性检查或可验证报告；失败分析会进入后续迭代，而不是停留在一次反思。
  - 关键差异：验证权威所在位置不同，包括领域视觉或物理门控、确定性程序权威、人类检查点或失败归因；评测目标也分为领域发现、通用基准和内部案例。
  - 趋势演进：2025-2026年内，领域正从综述和基准测试走向集成式自主研究智能体，强调自我纠正、领域有效性门控和可选人类协作。
  - 开放问题：验证缺口仍会漏掉静默失败；基准收益能否迁移到真实发现；最优人类介入、跨领域复用、可复现性和伦理可靠性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Domain-constrained autonomous discovery systems
      what_it_solves: Generates and tests hypotheses inside a specific domain while
        using domain-specific validity checks to reject unsupported results.
      what_remains_open: Verification still misses some silent failures, and evidence
        is limited to narrow domains or few cases, so external validity is uncertain.
    - line: General multi-agent research pipelines with human collaboration
      what_it_solves: Decomposes research into debate, execution, verifiable reporting,
        and human intervention to improve benchmark success over fully autonomous
        baselines.
      what_remains_open: Evaluation is often based on internal or limited benchmarks,
        and the optimal human intervention mode is not yet established across settings.
    - line: Self-correcting and evolving agent frameworks
      what_it_solves: Attributes experiment failures to hypotheses, design, or implementation
        and accumulates knowledge across rounds to raise success rates and artifact
        quality.
      what_remains_open: Fully autonomous scientific writing remains unsolved, and
        benchmark gains have not been shown to transfer to real scientific problems.
    - line: Evaluation and benchmark design for AI scientists
      what_it_solves: Creates tasks with real datasets and human baselines to measure
        AI scientists on annotation and discovery ability.
      what_remains_open: Current systems still fall short of fully autonomous discovery,
        and benchmark coverage is too narrow to establish real decision utility.
    - line: Surveys and taxonomies of agentic scientific discovery
      what_it_solves: Organizes fragmented systems into capabilities, domains, metrics,
        frameworks, and challenges for scientific discovery.
      what_remains_open: The proposed categories lack direct empirical validation,
        while literature automation, reliability, and ethical issues remain unresolved.
    consensus:
    - Scientific discovery pipelines generally separate ideation from evidence by
      requiring executed metrics, validity checks, or verifiable reporting before
      claims are accepted.
    - Fully autonomous discovery is treated as not yet reliable; most systems add
      domain gates, deterministic constraints, self-correction, or human collaboration.
    - Failures are used as evidence for iterative refinement rather than discarded
      or handled by a single reflection.
    disagreements:
    - 'Verification authority is located in different components: domain-specific
      visual or physics gates, deterministic program authorities, human checkpoints,
      or learned failure-attribution loops.'
    - Evaluation targets vary among domain-specific discovery tasks, general research
      benchmarks, and internal AI case studies.
    - Human involvement ranges from full autonomy to targeted high-leverage intervention
      to customizable oversight modes.
    - System scope differs between domain-constrained discovery agents and domain-agnostic
      evolving-agent frameworks.
    open_questions:
    - What verification mechanisms are sufficient to catch silent failures across
      domains without missing cases such as the failure gate that missed 2 of 16 planted
      failures?
    - Are benchmark improvements on platforms such as ARC-Bench or MLE-Bench Lite
      predictive of real scientific discovery utility?
    - What is the optimal timing and granularity of human collaboration in autonomous
      research loops, and does targeted intervention generalize beyond current case
      studies?
    - Can domain-specific validation or constraints transfer to other domains without
      rebuilding the verification layer?
    - How should reproducibility be assessed when code, data, and artifacts are incomplete
      or evaluations are limited to internal case studies?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域受限的自主发现系统
      解决的问题: 在特定领域生成并验证假设，用领域特定检查拒绝缺乏支持的结果。
      尚未覆盖: 验证仍会漏掉部分静默失败，证据集中在狭窄领域或少量案例，外部效度不确定。
    - 路线: 通用多智能体研究流水线与人类协作
      解决的问题: 将研究分解为辩论、执行、可验证报告和人类干预，以在基准上超越全自主基线。
      尚未覆盖: 评测多基于内部或有限基准，不同环境下最优人类介入模式尚未确立。
    - 路线: 自我纠正与演化式智能体框架
      解决的问题: 将实验失败归因到假设、设计或实现，并跨轮次积累知识，以提高成功率和工件质量。
      尚未覆盖: 完全自主科学写作仍未解决，基准收益能否迁移到真实科学问题尚未证明。
    - 路线: AI科学家评测与基准设计
      解决的问题: 用真实数据集和人类基线创建任务，测量AI科学家在注释和发现方面的能力。
      尚未覆盖: 当前系统仍达不到完全自主发现，基准覆盖过窄，难以建立真实决策效用。
    - 路线: 智能体科学发现的综述与分类
      解决的问题: 将碎片化系统按能力、领域、指标、框架和挑战组织起来，形成科学发现的概念边界。
      尚未覆盖: 这些分类缺乏直接实证验证，文献自动化、系统可靠性和伦理问题仍未解决。
    共识:
    - 科学发现流水线普遍将构思与证据分离，在接受结论前要求执行指标、有效性检查或可验证报告。
    - 全自主发现被认为尚不可靠，多数系统加入领域门控、确定性约束、自我纠正或人类协作。
    - 失败被用作迭代优化的证据，而不是被丢弃或仅通过一次反思处理。
    分歧:
    - 验证权威位于不同组件：领域视觉或物理门控、确定性程序权威、人类检查点或学习式失败归因回路。
    - 评测目标不同：领域特定发现任务、通用研究基准和内部AI案例研究。
    - 人类介入程度不同：从全自主到高杠杆点介入，再到可定制监督模式。
    - 系统范围不同：领域受限发现智能体与领域无关的演化式智能体框架。
    开放问题:
    - 什么样的验证机制足以跨领域捕获静默失败，同时不会漏掉类似16个植入失败中被漏掉2个的情况？
    - ARC-Bench或MLE-Bench Lite等基准上的提升能否预测真实科学发现效用？
    - 自主研究循环中人类协作的最优时机和粒度是什么，精准介入能否泛化到当前案例之外？
