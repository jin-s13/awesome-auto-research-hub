  related_work_outline:
  - 'Mainstream direction: End-to-end LLM-based research agents that integrate ideation,
    experiment or code execution, analysis, and manuscript generation, with increasing
    emphasis on domain-specific verification and evidence quality.'
  - 'Shared research pattern: Multi-step agent pipelines are evaluated through task
    completion, LLM-based review, or physical/theoretical validity, while human roles
    shift toward high-level supervision or review.'
  - 'Key differences: General-purpose discovery systems and physics/mathematics-specific
    systems differ mainly in verification mechanisms, evaluation targets, and supervision
    modes rather than in disciplinary tags.'
  - 'Trend evolution: The 2024-2026 evidence shows a shift from general autonomous
    research frameworks and virtual benchmarks toward specialized agents with validity
    gates, tree search, knowledge retrieval, and evidence-maturity scoring.'
  - 'Open questions: Whether autonomous agents can produce defensible novel science
    remains unresolved; current evidence points to gaps in controls, robustness, falsifiability,
