  related_work_outline_zh:
  - 主流方向：端到端自主研究系统，从假设、实验和结果生成论文稿，并通过验证和自我纠正让写作内容可核查、可评审。
  - 研究共性：多智能体LLM工作流把构思、执行、分析、写作串联起来，并加入验证回路或结果约束，以减少错误或虚构结论。
