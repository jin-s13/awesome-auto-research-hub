    引入智能体树搜索，再到2026年领域感知智能体和证据锚定基准更强调可审计性和可证伪性。
  - 开放问题：当前系统在对照、稳健性检查、可证伪测试以及跨模型、跨领域泛化方面仍不足；自动故障检测覆盖不完整，自动评审尚不能完全替代专家验证。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automates ideation, code implementation, experiment execution,
        visualization, and manuscript drafting as one runnable loop.
      what_remains_open: Consistent acceptance beyond narrow demonstrations and removal
        of hidden human-authored code or domain scaffolding still lack direct evidence.
    - line: Domain-aware verification and validity gating
      what_it_solves: Catches logically incoherent results or physically invalid simulation
        outputs before they become finalized claims.
      what_remains_open: Detection coverage is imperfect, and transfer of a gate built
        for one domain or artifact type remains unproven.
    - line: Iterative hypothesis-experiment search and planning
      what_it_solves: Expands an initial research direction into alternative experiments,
        branches, and revisions rather than committing to a single generated idea.
      what_remains_open: Branch selection can still produce inconsistent outcomes,
        with only some generated papers reaching acceptance thresholds.
    - line: Benchmarking and evidence-based evaluation
      what_it_solves: Makes autonomous discovery capability measurable through simulated
        tasks, blind studies, and evidence-maturity scoring rubrics.
      what_remains_open: Current agents plateau on evidence readiness and lack discriminative
        scientific behaviors such as controls, robustness checks, and cross-dataset
        generalization.
    - line: Knowledge-based multi-agent human-AI collaboration
      what_it_solves: Supports reasoning-heavy discovery by coupling expert oversight
        with agent execution of derivations, retrieval, verification, and writing.
      what_remains_open: Reported success depends heavily on LLM-based rubric evaluation,
        with limited external validation across disciplines or research groups.
    consensus:
    - Systems now integrate idea generation, code execution, analysis, and manuscript
      preparation into the same autonomous or semi-autonomous workflow.
    - Automated validation stages are treated as necessary because generated code
      and plausible text alone do not establish scientific soundness.
    - Current agents are competent at executing and documenting analyses, but evidence
      shows they still fall short of producing trustworthy, well-controlled scientific
      conclusions.
    - LLM-based review or evidence-maturity rubrics are becoming common evaluation
      substitutes, though their relationship to expert judgment remains incompletely
      established.
    disagreements:
    - One line constrains discovery to specific physical or mathematical validity
      conditions, while another targets open-ended research and removes domain-specific
      prior checking.
    - 'Automated verification operates on different artifacts: logical derivation
      steps, rendered physical flow fields, or maturity of causal evidence in written
      outputs.'
    - Evaluation objectives differ between peer-review acceptance scores, task completion
      in simulated discovery environments, and blind evidence-soundness assessment.
    - Interaction modes vary from fully autonomous generation to principal-investigator
      and graduate-student collaboration, changing how much expert judgment remains
      inside the loop.
    open_questions:
    - How can autonomous agents move from competent analysis execution to including
      controls, robustness tests, falsifiability checks, and generalization across
      datasets?
    - What is the reliable detection coverage for silent experimental failures, and
      how should systems handle cases that automated gates miss?
    - Are fixed LLM judges and rubric scores sufficient to measure scientific credibility,
      or do they overstate maturity outside real peer review?
    - Can workflows validated on one scientific domain or one frozen base model transfer
      to other fields, datasets, hardware settings, and model families?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研流水线
      解决的问题: 将想法生成、代码实现、实验执行、可视化和论文起草整合为一条可运行的闭环。
      尚未覆盖: 在狭窄演示之外稳定通过同行评审，以及去除隐藏人工代码模板或领域脚手架仍缺乏直接证据。
    - 路线: 领域感知验证与有效性门控
      解决的问题: 在结果变成最终主张之前，捕获逻辑不连贯的结果或物理上无效的仿真输出。
      尚未覆盖: 检测覆盖度仍不完善，且针对某一领域或工件类型构建的门控能否迁移仍未验证。
    - 路线: 迭代表述-实验搜索与规划
      解决的问题: 从初始研究方向扩展到多个备选实验和分支，而不是只生成并执行单一想法。
      尚未覆盖: 分支选择仍可能带来不稳定结果，只有部分生成论文达到接受阈值。
    - 路线: 基准与证据导向评测
      解决的问题: 通过模拟任务、盲研究和证据成熟度评分量规，使自主发现能力可测量。
      尚未覆盖: 当前智能体在证据成熟度上出现平台期，缺乏对照、稳健性检查和跨数据集泛化等判别性科学行为。
    - 路线: 基于知识的多智能体人机协作
      解决的问题: 以专家监督配合智能体执行推导、检索、验证和写作，服务于重推理的发现场景。
      尚未覆盖: 报告的成功高度依赖 LLM 量规评价，缺少跨学科或跨研究组的外部验证。
    共识:
    - 系统普遍将想法生成、代码执行、分析和论文准备整合进同一条自主或半自主工作流。
    - 自动验证环节被视为必要组成部分，因为仅靠生成代码和通顺文本无法确立科学可靠性。
    - 当前智能体能够胜任分析执行与文档记录，但证据显示其仍难以提出具备充分对照和稳健性的可信科学结论。
    - 基于 LLM 的评审或证据成熟度量规正在成为常见评测替代，但其与专家判断之间的对应关系仍未完全建立。
    分歧:
    - 一类路线以特定物理或数学有效性条件约束发现过程，另一类面向开放式研究并减少领域特定的先验检查。
    - 自动验证针对的工件不同：逻辑推导步骤、渲染的物理流场，或书面产出中因果证据的成熟度。
    - 评测目标不同：同行评审接受分数、模拟发现环境中的任务完成度，或盲任务中的证据完整性评估。
    - 交互模式从全自主生成到负责人与研究生式协作不等，影响专家判断在闭环中的介入程度。
    开放问题:
    - 自主智能体如何从合格的分析执行进一步包含对照、稳健性测试、可证伪检查以及跨数据集泛化？
    - 对静默实验失败的自动检测覆盖度如何保证，系统又应如何处理门控遗漏的情况？
    - 固定 LLM 裁判和量规分数是否足以衡量科学可信度，还是会在真实同行评审之外高估成果成熟度？
    - 在单一科学领域或单一冻结基座模型上验证的工作流，能否迁移到其他领域、数据集、硬件设置和模型族？
