    研究路线矩阵:
    - 路线: 端到端自主科研写作系统
      解决的问题: 自动化完整的科学流程——假设生成、代码执行、结果可视化和手稿起草——减少常规研究和论文写作中的人力投入。
      尚未覆盖: 跨领域的可靠性、持续的事实准确性，以及在无需大量人工干预的情况下，产出符合严格人类同行评审标准的手稿。
    - 路线: 生成论文的评估与质量评测
      解决的问题: 提供指标、自动评审器和基准（如基于LLM的评分标准、盲评分数、工作坊接收阈值），衡量AI生成的科学写作的质量和完整性。
      尚未覆盖: 自动指标与真实科学贡献之间的对齐；评估方法在开发时所用特定机器学习子领域或策划基准之外的可推广性。
    - 路线: 失败分析与自我纠正机制
      解决的问题: 识别和分类失败模式（如实现漂移、幻觉数字、记忆退化），并设计自我纠正策略，如多假设归因或内部验证循环，以提高研究稳健性。
      尚未覆盖: 这些机制是否能在开放式科学探索中预防所有关键故障类型；如何处理涉及交织逻辑和实验错误的复杂多步失败。
    - 路线: 人机协作模式
      解决的问题: 探索不同干预粒度（从完全自主到逐步监督），在高杠杆决策点利用人类专长，同时保持自动化效率。
      尚未覆盖: 平衡认知负荷、可扩展性和写作质量的最佳交互设计；哪种协作模式对哪种科学写作任务最有利的实证验证。
    共识:
    - 大型语言模型在与代码执行环境和自动评审循环结合时，可以生成连贯的研究论文。
    - 自动化验证——无论是通过逻辑检查、物理模拟还是事实锚定——对于减少生成手稿中虚构或伪造的结果至关重要。
    - 当前系统在长跨度任务中仍经常失败，需要人类干预或迭代自我纠正才能产出可辩护的科学成果。
    - 工作坊级别的接收正成为一个有意义的里程碑，但可以提交会议的完全自主论文生成仍是一个未解决的挑战。
    分歧:
    - 适当的自主程度：部分工作主张完全自主的流水线（AI Scientist路线），而另一些工作证明在关键决策点进行精准的人机协作优于完全自主和详尽的逐步监督（AutoResearchClaw）。
    - 验证的本质：方法各异，从内部逻辑一致性审计（ReasFlow）和基于物理的视觉门控（AI CFD Scientist），到将主张约束为实测值的事实锚定报告（SAGE）。
    - 失败处理的作用：一些系统使用单阶段反思循环，而SAGE提出多假设因果归因，将纠正确定性路由到正确流水线阶段，暗示对失败复杂性的假设不同。
    - 领域特异性：通用机器学习框架（AI Scientist）假设广泛适用性，而领域专用系统（ReasFlow用于应用数学，AI CFD Scientist用于流体动力学）认为深度验证需要领域感知的门控和知识检索。
    开放问题:
    - 在开放式科学任务中，哪些验证方法可以保证AI生成的论文不包含伪造的实验数据或幻觉引用？
    - 如何构建评测基准，衡量AI撰写论文的真实科学贡献，而非仅仅表面写作质量和包含指标的输出？
    - 当底层模型缺乏领域智能或科学品味时，自我纠正的上限是什么？如何在不成为瓶颈的情况下整合人类反馈？
    - 从失败分析（如Why LLMs Aren't Scientists Yet）中得出的设计原则能否被系统地转化为架构约束，以防止最常见的失败模式？
