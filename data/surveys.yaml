  related_work_outline:
  - 'Mainstream direction: The evidenced work clusters around autonomous scientific
    research agents that treat literature synthesis and review automation as one stage
    in a longer discovery-to-paper pipeline, with verifying evidence and producing
    reviewable claims as the central test.'
  - 'Shared research pattern: Multi-agent pipelines retrieve or synthesize knowledge,
    execute analysis, internally verify logic, and generate text; evaluation relies
    on blind tasks, human baselines, LLM judges, or benchmark suites rather than raw
    popularity or citation signals.'
  - 'Key differences: Evaluation targets differ from closed multiple-choice annotation
    to open-ended blind discovery and generated-paper review; interaction modes differ
    from human-as-PI supervision to self-evolving autonomy; evidence standards differ
    across rubric dimensions, evidence maturity, and aggregate benchmark scores.'
  - 'Trend evolution: 2025 evidence introduces surveys and domain benchmarks, while
    2026 evidence shifts toward end-to-end autonomous systems, self-evolution, and
    auditing of evidence quality, suggesting a frontier move from component literature-review
    automation to trustworthy discovery workflows.'
  - 'Open questions: Whether benchmark gains transfer beyond single frozen base models,
    whether automated judges track real scientific utility, whether agents can reliably
    add controls, robustness, falsifiability, and cross-dataset generalization, and
    whether literature search and citation analysis are effective outside full research
    pipelines remain unresolved.'
  related_work_outline_zh:
  - 主流方向：可见证据集中在自主科学智能体，把文献综合和综述自动化作为发现到论文流程中的一环，核心检验是证据验证和可评审主张。
  - 研究共性：多智能体流水线检索或综合知识、执行分析、内部验证逻辑并生成文本；评估依赖盲任务、人类基线、LLM评审器或基准套件，而非原始热度或引用信号。
  - 关键差异：评测目标从封闭式选择题注释、开放式盲发现到生成论文评审不等；交互模式从人类作为PI监督到自演化自主不同；证据标准在评分维度、证据成熟度和综合基准分数上不同。
  - 趋势演进：2025年证据以综述和领域基准为主，2026年转向端到端自主系统、自我演化和证据质量审计，显示前沿正从单一文献综述自动化走向可信发现工作流。
  - 开放问题：基准增益能否超越单一冻结基座模型，自动评审是否对应真实科研效用，智能体能否可靠加入对照、稳健性、可证伪性和跨数据集泛化，以及文献搜索与引文分析在完整研究流程之外是否有效仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and literature synthesis systems (e.g.,
        ReasFlow, EvoMaster)
      what_it_solves: Automates multi-stage scientific workflows covering literature
        synthesis, derivation or experiment execution, verification, and paper generation.
      what_remains_open: Long-horizon reliability, verification against fundamental
        errors, and whether generated papers meet human scientific standards without
        implementation drift or overexcited success claims.
    - line: Evidence-grounded evaluation and benchmarking for discovery agents (e.g.,
        TruthInsightBench, BAISBench)
      what_it_solves: Creates comparable tasks, blind data, human baselines, and automated
        judges to measure evidence maturity and discovery capability rather than reproduction.
      what_remains_open: Generalizability beyond one frozen base model, domain coverage,
        and whether rubric or judge scores reflect real scientific utility and trustworthy
        claims.
    - line: Survey and failure-analysis frameworks for agentic scientific workflows
        (e.g., Agentic AI for Scientific Discovery, Why LLMs Aren't Scientists Yet)
      what_it_solves: Organizes fragmented agent capabilities and failure modes across
        literature review, hypothesis generation, analysis, and experimentation into
        reusable challenges and design principles.
      what_remains_open: Empirical validation that proposed categories predict model
        behavior, and direct evidence that design principles reduce failure modes
        across domains and long-horizon tasks.
    - line: Reproducible infrastructure and self-evolving agent scaffolding (e.g.,
        EvoMaster, SciMaster ecosystem)
      what_it_solves: Turns isolated scientific agent ideas into runnable, domain-agnostic
        frameworks with self-critique and knowledge accumulation.
      what_remains_open: Standardized external validation across hardware, datasets,
        tasks, and user settings; current benchmark gains lack multi-base-model and
        independent reproducibility evidence.
    consensus:
    - Current systems can execute and document analyses competently but do not yet
      achieve fully autonomous trustworthy scientific discovery.
    - Verification, knowledge retrieval, and human review remain central because generated
      outputs can contain logical errors, missing evidence, or unwarranted success
      claims.
    - Open-ended discovery evaluation must go beyond reproducing hidden target studies
      and should score evidence maturity, controls, robustness, falsifiability, and
      cross-dataset generalization.
    - Human baselines or human-as-PI collaboration are used to calibrate agent performance,
      but graduate-level comparison alone is not sufficient to establish autonomous
      scientific judgment.
    disagreements:
    - 'Evaluation targets conflict: closed multiple-choice and annotation tasks test
      domain knowledge, while blind open-ended tasks test what claim the data support,
      and generated-paper review rubrics test full workflow quality.'
    - 'Supervision and interaction modes differ: some systems position humans as principal
      investigators supervising agent execution, while others emphasize self-evolving
      autonomy and domain-agnostic deployment.'
    - 'Evidence standards differ across benchmark suites: one uses LLM-judged evidence
      maturity across six dimensions, another uses expert-derived multiple-choice
      questions and human baselines, and another reports broad state-of-the-art benchmark
      scores.'
    - Deployment settings differ from applied mathematics and omics biology to ML
      research and general science, so failure modes and task assumptions may not
      transfer.
    open_questions:
    - Do reported state-of-the-art gains and evidence-maturity scores transfer beyond
      a single frozen base model or narrow benchmark setting?
    - How well do LLM reviewers, rubric scores, and multiple-choice discovery questions
      predict real scientific utility, human peer review, and downstream research
      impact?
    - Can autonomous literature and discovery systems reliably produce controls, robustness
      checks, falsifiability tests, and cross-dataset generalization needed for trustworthy
      claims?
    - Which mechanisms reduce long-horizon failure modes such as training-data default
      bias, implementation drift, memory degradation, overexcitement, and weak scientific
      taste?
    - The packet does not isolate literature search and citation analysis performance
      from full research pipelines, so subcomponent utility outside end-to-end systems
      remains a verification gap.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究与文献综合系统（例如 ReasFlow、EvoMaster）
      解决的问题: 自动完成多阶段科研流程，包括文献综合、推导或实验执行、验证和论文生成。
      尚未覆盖: 长跨度可靠性、对基本错误的验证，以及生成论文能否在无实现漂移或过度成功宣称的情况下达到人类科学标准。
    - 路线: 面向发现智能体的证据锚定评测与基准（例如 TruthInsightBench、BAISBench）
      解决的问题: 通过盲数据、人类基线、自动裁判衡量证据成熟度和发现能力，而非复现隐藏目标研究。
      尚未覆盖: 超越单一冻结基座模型的泛化、领域覆盖，以及量规或裁判分数是否对应真实科研效用和可信主张。
    - 路线: 面向智能体科学工作流的综述与失败分析框架（例如 Agentic AI for Scientific Discovery、Why LLMs Aren't
        Scientists Yet）
      解决的问题: 把文献综述、假设生成、分析与实验中分散的能力和失败模式组织为可复用的挑战与设计原则。
      尚未覆盖: 所提分类能否预测模型行为仍缺少直接实证验证；设计原则能否跨领域和长跨度任务降低失败模式证据不足。
    - 路线: 可复现基础设施与自演化智能体脚手架（例如 EvoMaster、SciMaster 生态）
      解决的问题: 把孤立的科学智能体想法转化为可运行、领域无关的框架，并加入自我批判和知识积累。
      尚未覆盖: 跨硬件、数据集、任务和用户设置的标准化外部验证；当前基准增益缺乏多基座模型和独立复现证据。
    共识:
    - 当前系统能够较熟练地执行和记录分析，但尚未实现完全自主且可信的科学发现。
    - 验证、知识检索和人工审查仍是核心，因为生成结果可能包含逻辑错误、证据缺失或无根据的成功宣称。
    - 开放式发现评测不能只停留在复现隐藏目标研究，而应衡量证据成熟度、对照、稳健性、可证伪性和跨数据集泛化。
    - 使用人类基线或人类作为PI协作来校准智能体表现，但仅靠研究生水平比较不足以证明自主科学判断。
    分歧:
    - 评测目标不同：封闭式选择题和注释任务考察领域知识，盲开放式任务考察数据支持什么主张，生成论文评审量规考察完整流程质量。
    - 监督与交互模式不同：有些系统把人类定位为首席研究员监督智能体执行，另一些则强调自演化自主和领域无关部署。
    - 证据标准不同：有的采用LLM裁判按六个维度评估证据成熟度，有的采用专家导出的选择题和人类基线，有的报告宽泛的基准套件最高分。
    - 部署场景从应用数学、组学生物学到机器学习研究和通用科学不等，失败模式和任务假设可能无法直接迁移。
    开放问题:
    - 所报告的最高基准分数和证据成熟度分数能否超越单一冻结基座模型或狭窄基准设置而迁移？
    - LLM评审器、量规分数和多项选择发现题在多大程度上能够预测真实科研效用、人类同行评审和后续研究影响？
    - 自主文献与发现系统能否可靠地生成可信主张所需的对照、稳健性检查、可证伪性测试和跨数据集泛化？
    - 哪些机制能够减少训练数据默认偏见、实现漂移、记忆退化、过度兴奋和薄弱科学品味等长跨度失败模式？
    - 现有证据未把文献搜索和引文分析性能从完整研究流程中分离出来，因此它们在端到端系统之外的子能力仍属验证缺口。
