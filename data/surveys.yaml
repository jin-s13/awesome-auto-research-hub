  related_work_outline:
  - 'Mainstream direction: autonomous multi-agent research systems that close the
    hypothesis-experiment-verification-reporting loop, with domain-specific or execution-grounded
    validity checks and optional human collaboration.'
  - 'Shared research pattern: LLM-generated hypotheses or code are grounded by executed
    baselines, diagnostics, verification gates, and reported metrics, then evaluated
    on benchmark or case-study outcomes.'
  - 'Key differences: verification mechanisms, human-interaction granularity, evaluation
    targets, and whether gains represent research insight or engineering execution.'
  - 'Trend evolution: within the 2025-2026 frontier, work is moving from surveys and
    benchmark definitions toward integrated autonomous systems with self-correction
    and domain-specific scientist agents for CFD, forecasting, and omics.'
  - 'Open questions: silent-failure detection, benchmark-to-discovery validity, optimal
    human oversight, external reproducibility, and novelty beyond local engineering
    tweaks.'
  related_work_outline_zh:
  - 主流方向：构建自主多智能体研究系统，打通假设生成、实验、验证、报告闭环，加入领域特定或执行验证，并可选人机协作。
  - 研究共性：用执行基线、诊断、验证门和可验证指标约束LLM生成的假设与代码，再以基准或案例研究评估。
  - 关键差异：验证机制、人类介入粒度、评测对象，以及增益是研究洞察还是工程执行各不相同。
  - 趋势演进：2025-2026前沿从综述与基准定义转向具有自纠正和领域专用科学智能体的集成系统，涵盖CFD、预测和组学。
  - 开放问题：静默失败检测、基准到真实发现的效度、最优人类监督、外部复现，以及超越局部工程技巧的新颖性。
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific autonomous discovery and verification agents
      what_it_solves: Integrates literature-grounded ideation, executed experiments,
        domain-specific verification, code modification, and reporting in one workflow.
      what_remains_open: Verification gates still miss some silent failures, and evidence
        is limited to narrow domains such as CFD or forecasting cases.
    - line: Self-correcting failure-attribution loops
      what_it_solves: Uses multi-hypothesis diagnosis of experiment failures to route
        corrections to the hypothesis, experimental design, or implementation and
        to ground reported metrics.
      what_remains_open: Gains are concentrated in code development and execution;
        fully autonomous scientific writing and novelty remain difficult.
    - line: Human-AI collaborative research team platforms
      what_it_solves: Instantiate multi-agent roles with verifiable reporting and
        targeted human interventions at high-leverage decision points.
      what_remains_open: Evaluation is based on few internal case studies and expert
        or AI judging; optimal intervention granularity and external generalization
        remain unproven.
    - line: AI scientist benchmarks and testbeds
      what_it_solves: Provide real-data tasks, published-model improvement settings,
        or multiple-choice discovery questions to compare agents against baselines
        and human performance.
      what_remains_open: Current improvements may reflect ML-engineering tricks rather
        than research insight, and proxy metrics may not align with real discovery
        utility.
    - line: Taxonomic surveys of agentic scientific discovery
      what_it_solves: Organize agentic systems by domain, capability, metrics, frameworks,
        and datasets, and identify reliability, literature-automation, and ethics
        challenges.
      what_remains_open: The proposed categories are not yet empirically validated
        as predictors of system behavior, and the identified challenges remain unresolved.
    consensus:
    - Execution grounding and result verification, such as physics/vision gates, canonical
      evaluation, or verifiable reporting, are treated as necessary to reduce silent
      failures and hallucinated numbers.
    - Human baselines or targeted human-in-the-loop collaboration help calibrate systems;
      high-leverage intervention can outperform full autonomy or exhaustive oversight
      in limited evidence.
    - Current AI scientist systems are promising but not fully autonomous discoverers;
      improvements often arise from execution and engineering rather than research-level
      domain insight, and autonomous writing remains difficult.
    - Evaluation is shifting from single-model outputs to benchmarks, judged artifacts,
      failure cases, and human or expert baselines that make claims more comparable.
    disagreements:
    - 'Autonomy-control split differs: some systems separate LLM cognition from deterministic
      program authority, while others use multi-agent debate with self-healing or
      a central verification gate.'
    - 'Verification strategy differs: domain-specific physics/vision inspection, verifiable
      numeric reporting, canonical deterministic evaluation, and multi-hypothesis
      failure attribution target different failure modes and are not unified.'
    - 'Evaluation targets differ: biological discovery questions, scientific ML best-model
      improvement, research artifact quality, or domain-specific CFD/forecasting performance,
      so reported gains are not directly comparable.'
    - 'Human-interaction mode differs: fully autonomous loops, multiple intervention
      modes, and interactive monitoring dashboards imply different assumptions about
      when human judgment is most valuable.'
    open_questions:
    - How can general validity checks catch silent failures that domain-specific verification
      gates still miss?
    - To what extent do benchmark improvements and judged artifacts reflect genuine
      research insight rather than local engineering tricks or presentation quality?
    - What is the optimal granularity and timing of human intervention across task
      risk, domain, and evaluation setting?
    - How can autonomous research claims be externally validated across datasets,
      hardware, and user settings given the current reliance on few case studies and
      internal benchmarks?
    - What evidence would show that these systems produce novel, generalizable scientific
      contributions beyond code execution and incremental model tuning?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域专用自主发现与验证智能体
      解决的问题: 在CFD、预测等领域整合文献构思、实验执行、领域验证、代码修改和报告。
      尚未覆盖: 验证门仍会漏掉部分静默失败，证据集中在少数领域或案例。
    - 路线: 自我纠正与失败归因研究回路
      解决的问题: 通过多假设诊断实验失败，将纠正路由到假设、实验设计或实现，并约束报告指标。
      尚未覆盖: 提升集中在代码开发与执行；完全自主科学写作和新颖性仍不足。
    - 路线: 人机协作研究团队平台
      解决的问题: 实例化多智能体角色，提供可验证报告和高杠杆人类干预。
      尚未覆盖: 评估依赖少量内部案例和专家或AI评审；最优干预粒度与外部泛化未经证明。
    - 路线: AI科学家基准与测试台
      解决的问题: 通过真实数据任务、已发表模型改进或选择题，对比智能体与基线及人类表现。
      尚未覆盖: 目前提升可能来自ML工程技巧而非研究洞察，代理指标未必对应真实发现效用。
    - 路线: 科学发现智能体的概念综述
      解决的问题: 按领域、能力、指标、框架和数据集组织智能体系统，识别可靠性、文献自动化和伦理挑战。
      尚未覆盖: 分类能否预测系统行为缺乏实证；所提挑战仍未解决。
    共识:
    - 执行接地和结果验证，如物理/视觉门控、规范评估或可验证报告，被视为减少静默失败和幻觉数字的必要手段。
    - 人类基线或高杠杆人机协作有助于校准；有限证据表明精准干预可能优于完全自主或逐步监督。
    - 当前AI科学家系统有潜力但尚未完全自主发现，提升常来自执行与工程而非研究洞察，自主写作仍困难。
    - 评测正从单模型输出转向基准、评审工件、失败案例和人类或专家基线，使主张更可比。
    分歧:
    - 自主与控制的划分不同：有的将LLM认知与确定性程序权威分离，有的采用多智能体辩论加自愈，或中央验证门。
    - 验证策略不同：领域特定物理/视觉检查、可验证数值报告、确定性规范评估、多假设失败归因各自针对不同失败模式且未统一。
