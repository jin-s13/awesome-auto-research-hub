  related_work_outline_zh:
  - 主流方向：自主研究系统正在把假设生成与执行、证据跟踪和验证结合，而不是把假设提出当作孤立步骤。
  - 研究共性：采用树、共享世界模型或任务诊断等结构化状态，将上一轮结果转化为下一轮假设与报告。
  - 关键差异：控制方式从 LLM 辩论和进化搜索，到确定性权威或审计式认知树不等；评估领域与人机协作角色也不同。
  - 趋势演进：当前证据集中在 2025–2026 年，方向从综述式分类转向带可验证报告和更难基准的集成式自主研究流程。
  - 开放问题：弱方向早期拒绝、来源保存、向基准外场景迁移，以及收益来自假设生成还是外围脚手架，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Turning open-ended or task-specific research objectives into
        loops of hypothesis generation, implementation, execution, and reporting.
      what_remains_open: Reliability and verifiability beyond short benchmark runs,
        and attribution of success to hypothesis generation versus search or execution
        scaffolding.
    - line: Structured epistemic state and audited search
      what_it_solves: Maintaining hypotheses, evidence, beliefs, and revisions so
        exploration is guided by unresolved conflicts and accumulated results.
      what_remains_open: Empirical coverage across diverse domains and whether epistemic
        gain predicts real discovery utility.
    - line: Iterative task-specific architecture or algorithm evolution
      what_it_solves: Using executed diagnostics and ablation results as evidence
        for the next architecture hypothesis, with deterministic promotion and evaluation
        gates.
      what_remains_open: Generalization beyond selected forecasting, optimization,
        or driving benchmarks, and separation of gains from task-specific baselines.
    - line: Benchmarks and difficulty measurement
      what_it_solves: Providing comparable tasks and evaluation harnesses for scientific
        research capabilities, including harder successor benchmarks.
      what_remains_open: Breadth across scientific fields and alignment between benchmark
        accuracy and genuine hypothesis-generation quality.
    - line: Conceptual frameworks and autonomy taxonomies
      what_it_solves: Organizing AI research automation into workflow conditions,
        evaluation dimensions, autonomy levels, and failure boundaries.
      what_remains_open: Direct empirical validation that proposed categories predict
        system behavior or discovery reliability beyond survey synthesis.
    consensus:
    - Research systems in this topic converge on iterative hypothesis generation with
      executed validation and evidence-aware revision rather than standalone proposal
      generation.
    - Explicit structured state—epistemic trees, research trees, or shared world models—is
      used to preserve prior findings and guide later search.
    - 'Evaluation is treated as part of the system: benchmarks, baselines, and report
      checks are used to make autonomous discovery claims comparable.'
    - Autonomy is not absolute; several designs introduce human oversight, deterministic
      authority, or verifiable reporting to control unreliable LLM behavior.
    disagreements:
    - 'Supervision and control differ: some systems rely on LLM-agent debate or evolutionary
      search, while others separate cognition from deterministic program authority
      or audit epistemic state.'
    - 'Evaluation domains differ: broad biological research tasks, combinatorial optimization
      and cooperative driving, time-series architecture evolution, and open-ended
      scientific report synthesis are not interchangeable targets.'
    - 'Interaction with humans differs: targeted human collaboration at high-leverage
      points, mostly autonomous loops with structured reporting, and separated authority
      decisions reflect different design choices.'
    - 'Success metrics differ: benchmark accuracy and report statement accuracy are
      used, but real-world discovery utility and long-run reliability remain inconsistently
      measured.'
    open_questions:
    - How should hypothesis-generation systems reject weak directions early while
      preserving provenance and evidence across open-ended scientific workflows?
    - Does improvement on current benchmarks transfer to settings with delayed, embodied,
      heterogeneous, or institutionally accountable experiments?
    - What is the attribution of gains to hypothesis generation itself versus execution
      scaffolding, search budget, or task-specific baselines?
    - How far do reported scaling and accuracy results hold beyond 20 cycles or beyond
      the particular benchmark suites used?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流水线
      解决的问题: 把开放式或任务特定研究目标转化为假设生成、实现、执行和报告的闭环。
      尚未覆盖: 短基准运行之外的可靠性与可验证性，以及成功在多大程度上来自假设生成而非搜索或执行脚手架。
    - 路线: 结构化认知状态与审计式搜索
      解决的问题: 维护假设、证据、信念和修正，利用未解决冲突和累积结果引导探索。
      尚未覆盖: 跨领域实证覆盖不足，认知增益能否预测真实发现效用仍不清楚。
    - 路线: 迭代式任务特定架构或算法演化
      解决的问题: 用已执行的诊断和消融结果作为下一轮架构假设的证据，并以确定性晋升和评估门控。
      尚未覆盖: 在选定预测、优化或驾驶基准之外泛化不足，且难以分离任务特定基线的贡献。
    - 路线: 基准与难度测量
      解决的问题: 为科学研究能力提供可比较的任务和评测工具，包括更难的后续基准。
      尚未覆盖: 科学领域覆盖广度不足，基准准确率与真实假设生成质量之间的一致性仍待验证。
    - 路线: 概念框架与自主性分类
      解决的问题: 把 AI 研究自动化组织为工作流条件、评测维度、自主性层级和失败边界。
      尚未覆盖: 所提分类能否预测系统行为或发现可靠性仍缺少直接实证验证。
    共识:
    - 该主题下的系统收敛于迭代式假设生成，并加入可执行验证与基于证据的修正，而非单次提案生成。
    - 显式结构化状态被用于保存先前发现并引导后续搜索，形式包括认知树、研究树或共享世界模型。
    - 评估被纳入系统闭环，基准、基线和报告核验用于让自主发现声明可比较。
    - 自主性并非绝对，多个设计通过人工监督、确定性权威或可验证报告控制 LLM 的不可靠行为。
    分歧:
    - 监督与控制方式不同：一些依赖 LLM 多智能体辩论或进化搜索，另一些将认知与确定性程序权威分离或审计认知状态。
    - 评估领域不同：广度生物学任务、组合优化与协作驾驶、时间序列架构演化、开放式科学报告合成等目标不一。
    - 人机交互模式不同：存在高杠杆点的人工协作、全自动循环及结构化报告等不同选择。
    - 成功指标不一致：基准准确率、报告陈述准确率等被使用，但真实发现效用和长期可靠性仍未统一衡量。
    开放问题:
    - 假设生成系统如何在开放科学工作流中早期拒绝弱方向，同时保存来源和证据？
    - 当前基准上的改进能否迁移到延迟、具身、异质或需要机构问责的实验场景？
    - 性能提升有多少来自假设生成本身，而不是执行脚手架、搜索预算或任务特定基线？
    - 报告准确率和发现随周期扩大的结论在超过 20 周期或换用其他基准后是否仍成立？
