    - 失败恢复策略：基于简单反思的方法只是重新提示同一智能体，而结构化方法执行多假设因果归因，将修正路由到假设、设计或实现层面。
    - 人机交互模式：设计范围从完全自主运行到具有七种干预模式的细粒度监督，对于最优粒度和高杠杆点尚无共识。
