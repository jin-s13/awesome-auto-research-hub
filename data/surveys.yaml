  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Turning idea generation, code execution, experiment running,
        and paper writing into a single automated workflow; The AI Scientist and AI
        Scientist-v2 are representative examples.
      what_remains_open: 'Success is inconsistent: only a fraction of submissions
        pass peer review, and acceptance is demonstrated mainly at workshop level
        rather than full conference or broad-domain reliability.'
    - line: Task-suite and environment design
      what_it_solves: Making discovery capability comparable through structured tasks,
        baselines, and metrics such as task completion, task-relevant actions, and
        explanatory knowledge; DiscoveryWorld and BAISBench illustrate this line.
      what_remains_open: Scientific field coverage remains limited, and agreement
        between task metrics and real discovery value or downstream decision utility
        is not established.
    - line: Verification and self-correction
      what_it_solves: Reducing silent failures and hallucinated results through physics-aware
        visual gates, grounded reporting, or multi-hypothesis failure attribution;
        SAGE and AI CFD Scientist are representative.
      what_remains_open: Verification gates still miss some planted failures, and
        self-correction gains do not yet guarantee fully autonomous or conference-ready
        scientific writing.
    - line: Multi-agent and interactive research platforms
      what_it_solves: Coordinating customizable roles, real-time monitoring, artifact
        inspection, rollback or resume control, and local code integration; Claw AI
        Lab is an example.
      what_remains_open: Evaluation relies on small internal case studies, so standardized
        external validation across hardware, datasets, and user settings is still
        missing.
    - line: Failure analysis and design principles
      what_it_solves: Turning repeated autonomous research attempts into documented
        failure modes and design principles for more reliable AI research systems.
      what_remains_open: Whether the identified failure categories are predictive
        enough to guide system design across domains lacks direct empirical validation.
    consensus:
    - Autonomous research systems are evaluated not only on idea quality but also
      on whether they produce runnable experiments, metrics-bearing outputs, and valid
      artifacts.
    - Current AI scientist systems remain unreliable enough that explicit verification,
      review, or failure-attribution stages are becoming common.
    - Evaluation evidence is shifting toward structured tasks, human or expert baselines,
      and blind or automated judging rather than isolated demonstrations.
    - Reproducibility and external validity are documented unevenly; open-source artifacts
      are common in visible examples but cross-setting validation remains limited.
    disagreements:
    - 'What counts as verification differs: some systems inspect rendered flow fields
      for physical validity, while others simulate manuscript review or attribute
      failed experiment trajectories to root causes.'
    - 'Evaluation targets differ: full paper acceptance or blind review scores versus
      task completion and explanatory knowledge versus domain-specific cell annotation
      and discovery questions.'
    - 'Interaction and oversight differ: fully autonomous loops, self-correcting loops,
      task-suite environments, and interactive multi-agent dashboards imply different
      human roles and levels of trust.'
    - 'Domain scope differs: some systems specialize in computational fluid dynamics
      or omics, while others target general machine learning topics, making generalization
      claims hard to compare.'
    open_questions:
    - How can verification mechanisms be made broad enough to detect silent failures
      beyond the specific physics or visual cases used in current ablations?
    - Do task completion, automated review scores, and artifact quality metrics align
      with real scientific contribution or downstream research utility?
    - Which reported failure modes and self-correction gains transfer to other domains,
