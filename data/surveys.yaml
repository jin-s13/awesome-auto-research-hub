  related_work_outline:
  - 'Mainstream direction: building LLM-driven autonomous research agents that generate
    hypotheses, execute experiments, verify outcomes, and iteratively improve solutions,
    with increasing domain-specific verification.'
  - 'Shared research pattern: a recurring hypothesis/ideation — execution/experiment
    — validation/reporting loop, with self-correction or human collaboration inserted
    at decision points and emphasis on verifiable evidence.'
  - 'Key differences: domain focus and validation mechanisms vary; some use physics-aware
    visual gates, some use deterministic program authorities, and others use structured
    debate, human oversight, or causal failure attribution.'
  - 'Trend evolution: 2025 evidence is mostly surveys and benchmarks, while 2026 work
    pushes toward open-ended discovery, self-correction, and more reliable human-in-the-loop
    research pipelines.'
  - 'Open questions: whether gains reflect research insight or engineering tricks,
    whether validity gates generalize, how to measure real scientific utility, and
    how much missing artifact evidence hides failure modes.'
  related_work_outline_zh:
  - 主流方向：构建由大模型驱动的自主研究智能体，完成假设生成、实验执行、结果验证和迭代改进，并逐步加入领域特定验证机制。
  - 研究共性：普遍采用“假设/构思—执行/实验—验证/报告”闭环，并在关键决策点引入自纠正或人机协作，强调可验证证据。
  - 关键差异：领域重点与验证方式不同，有的使用物理感知视觉门控，有的采用确定性程序权威，有的依赖结构化辩论、人类监督或因果失败归因。
  - 趋势演进：2025 年证据以综述与基准为主，2026 年工作趋向开放式发现、自纠正和更可靠的人机协作，整体仍处于 2025—2026 前沿窗口。
  - 开放问题：性能提升有多少来自研究洞察而非工程技巧；自动验证门控能否跨领域泛化；如何衡量真实科研效用；以及缺失工件证据是否隐藏失效模式。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Integrate hypothesis generation, experiment execution, result
        verification, and reporting into a single loop that can propose and test research
        directions without manual start.
      what_remains_open: Open-ended novelty remains miscalibrated, and reported improvements
        often come from implementation or engineering changes rather than domain-level
        research insight.
    - line: Human-AI collaborative research platforms
      what_it_solves: Provide customizable roles, dashboards, intervention modes,
        and verifiable reporting to keep autonomous research inspectable and steerable.
      what_remains_open: Optimal human intervention granularity is not established;
        evaluations often rely on narrow internal case studies or expert preference
        judgments.
    - line: Domain-specific AI scientists with validity gates
      what_it_solves: Embed domain checks such as vision-based physics verification
        or omics-derived cell annotation into discovery claims so they are backed
        by executed evidence.
      what_remains_open: Gates still miss silent failures, and task-specific designs
        do not yet show cross-domain transfer or full reliability.
    - line: Self-correction and causal failure attribution
      what_it_solves: Diagnose experiment failures through structured evidence-grounded
        hypotheses and route interventions to hypothesis, experimental design, or
        implementation levels.
      what_remains_open: Fully autonomous scientific writing and conference-ready
        outputs remain unsolved; attribution completeness across broader domains is
        unverified.
    - line: Evaluation and evidence design for AI research agents
      what_it_solves: Produce comparable tasks, datasets, human baselines, and in-the-wild
        trajectories to measure AI scientists' discovery ability.
      what_remains_open: Coverage is limited, and proxy metrics have not been linked
        to real scientific impact, reproducibility, or downstream research utility.
    - line: Conceptual surveys and challenge taxonomies
      what_it_solves: Organize agentic scientific discovery systems by domain, capability,
        metrics, implementation frameworks, and challenges.
      what_remains_open: The proposed categories lack direct empirical validation
        showing they predict system behavior, reliability, or outcome quality.
    consensus:
    - Most systems decompose scientific discovery into hypothesis generation, experiment
      execution, and result verification, with LLM agents responsible for open-ended
      reasoning and code implementation.
    - There is shared emphasis on executable evidence over generated text, leading
      to mechanisms such as validity gates, deterministic authorities, verifiable
      reporting, and self-correction loops.
    - Current agents are positioned as accelerators or supports for scientific research
      rather than fully reliable autonomous discoverers, especially outside narrow
      domains or case studies.
    disagreements:
    - 'They differ in human oversight: some use high-leverage collaboration, others
      allow autonomous execution with monitoring, and others enable step-by-step review
      or dashboard-based intervention.'
    - 'They differ in evaluation target: domain-specific discovery, general scientific
      ML benchmark improvement, or AI research case studies judged for novelty and
      presentation.'
    - 'They differ in reliability mechanisms: structured debate and causal failure
      attribution versus deterministic source-control authorities versus domain-aware
      visual or data validity gates.'
    - 'They differ in how hypotheses are formed: literature-grounded ideation, debate-based
      hypothesis generation, evidence-grounded directions from diagnostics, or open-ended
      search against reference comparators.'
    open_questions:
    - How much of reported improvement comes from research insight versus ML-engineering
      tricks or task-specific implementation changes?
    - Can automated validity gates reliably detect silent failures across wider domains,
      given evidence that one physics-verification gate missed some planted failures?
    - Do current benchmarks and expert-judgment case studies correlate with real scientific
      utility, reproducibility, and downstream decision impact?
    - What human intervention granularity best balances reliability, cost, autonomy,
      and scalability in scientific research pipelines?
    - Several top papers lack visible limitation or artifact details; how much do
      missing baselines, code, and datasets hide failure modes or unreported constraints?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究智能体
      解决的问题: 把假设生成、实验执行、结果验证和报告生成整合为可运行的发现循环，无需手动启动即可提出并测试研究方向。
      尚未覆盖: 开放式发现中的新颖度校准仍不充分，报告的性能提升常来自实现或工程改进，而非领域级研究洞察。
    - 路线: 人机协作式多智能体研究平台
      解决的问题: 提供可定制角色、仪表板、干预模式和可验证报告，使自主研究可检查、可引导。
      尚未覆盖: 最优人类干预粒度尚无通用标准；评估常依赖较窄的内部案例或专家偏好判断。
    - 路线: 领域特定 AI 科学家与验证门控
      解决的问题: 将物理视觉验证或组学细胞注释等领域检查嵌入发现主张，使结论由可执行证据支撑。
      尚未覆盖: 验证门控仍会漏检静默失败，任务特定设计尚未证明跨领域迁移能力与完整可靠性。
    - 路线: 自纠正与因果失败归因
      解决的问题: 基于证据对实验失败进行结构化诊断，并将干预路由到假设、实验设计或实现层面，提升成功率与工件质量。
      尚未覆盖: 完全自主的科研写作与会议级成果仍未解决；更广领域中的归因完备性缺少验证。
    - 路线: 评测与证据设计
      解决的问题: 通过可比较的任务、数据集、人类基线和真实轨迹来测量 AI 科学家的发现能力。
      尚未覆盖: 任务覆盖有限，代理指标尚未与真实科研影响、可复现性或下游研究效用建立联系。
