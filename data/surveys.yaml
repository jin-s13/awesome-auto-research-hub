  literature_review:
    line_of_work_matrix:
    - line: Autonomous experiment pipelines with closed-loop research
      what_it_solves: Connecting hypothesis generation, experiment execution, verification,
        and reporting into a cohesive automated workflow, turning a research idea
        into a measurable artifact.
      what_remains_open: Ensuring reliability and generalizability of experimental
        results across diverse conditions, and gracefully handling out-of-distribution
        failures without human intervention.
    - line: Benchmarking and evidence design for AI scientists
      what_it_solves: Making claims about autonomous research comparable through standardized
        tasks, metrics, and human baselines, as in BAISBench and ARC-Bench.
      what_remains_open: Alignment between proxy benchmark scores and real scientific
        discovery value, and coverage of long-tail or interdisciplinary science tasks.
    - line: Self-improving and failure recovery mechanisms
      what_it_solves: Increasing robustness by diagnosing experiment failures, attributing
        root causes (e.g., multi-hypothesis attribution in SAGE), and evolving knowledge
        across runs (e.g., EvoMaster).
      what_remains_open: Preventing self-improvement loops from introducing new errors
        or drifting away from scientifically sound hypotheses; guaranteeing that formal
        proofs reflect intended real-world claims.
    - line: Human–AI collaboration and interactive oversight
      what_it_solves: Mitigating risks of fully autonomous research by inserting human
        judgment at high-leverage decision points, with modes ranging from full autonomy
        to step-by-step supervision.
      what_remains_open: Optimizing the timing and granularity of human intervention
        to minimize cognitive load while maximizing outcome quality, and scaling to
        long-duration studies.
    - line: Domain-specific foundational tools and formal verification
      what_it_solves: Embedding disciplinary knowledge (physics-aware gates, Lean
        proof libraries) so that general AI scientists can produce valid, domain-consistent
        results.
      what_remains_open: Generalizing these domain-specific components to new fields
        without re-engineering, and verifying that formalizations faithfully capture
        the scientific semantics.
    consensus:
    - All systems rely on an LLM backbone integrated with external tools, code execution,
      and simulation environments rather than on pure language reasoning.
    - 'Iterative closed-loop experimentation is a core paradigm: hypotheses are proposed,
      tested, and refined based on quantitative feedback.'
    - Explicit verification steps (vision-language gates, statement audits, grounded
      reporting) are necessary to suppress hallucinations and fabricated results.
    - Evaluation remains a bottleneck; there is shared recognition that current benchmarks
      are narrow and human baselines are needed for calibration.
    - Human involvement is still required, either for oversight, final judgement,
      or to handle edge cases that automated pipelines cannot resolve.
    disagreements:
    - 'Autonomy level: some systems pursue full autonomy with minimal human interaction
      (AI CFD Scientist, SAGE), while others argue that targeted human collaboration
      at high-leverage points yields better results (AutoResearchClaw, Claw AI Lab).'
    - 'Self-correction strategy: one camp uses causal multi-hypothesis failure attribution
      to isolate and fix errors (SAGE), another uses continuous self-evolution and
      knowledge accumulation (EvoMaster), and a third uses formal machine-checked
      proofs (CausalForge).'
    - 'Evaluation methodology: quantitative benchmarking on curated datasets (BAISBench,
      ARC-Bench, MLE-Bench Lite) is contrasted with qualitative case-study evaluation
      by expert judges (Claw AI Lab, AI CFD Scientist).'
    - 'Generality vs. domain specialization: EvoMaster and AutoResearchClaw aim for
      domain-agnostic frameworks, while AI CFD Scientist and CausalForge embed domain-specific
      validators and libraries, leading to a trade-off between breadth and depth of
      validation.'
    open_questions:
    - Do current benchmarks (BAISBench, ARC-Bench) measure true scientific discovery
      capability, or do they primarily assess experiment execution and code generation
      skills?
    - How can we bridge the semantic gap between formal verification (machine-checked
      proofs) and the intended scientific meaning, as highlighted by CausalForge's
      statement audit?
    - What metrics can reliably quantify scientific novelty, and how can we prevent
      AI scientists from being trapped in incremental, low-impact exploration?
    - In long-running autonomous systems, how can we ensure stability and safety,
      and prevent cumulative errors or knowledge drift?
    - How can domain-specific verification components (e.g., physics-aware gates)
      be effectively generalized across scientific disciplines without requiring from-scratch
      re-engineering for each new field?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 闭环自主实验流水线
      解决的问题: 将假设生成、实验执行、验证与报告连接成统一的自动化工作流，将研究想法转化为可测量的产物。
      尚未覆盖: 在多样化条件下保证实验结果的可靠性和泛化性，并在无人类干预时优雅处理分布外失败。
    - 路线: AI科学家的基准与证据设计
      解决的问题: 通过标准化任务、指标和人类基线（如BAISBench、ARC-Bench）使关于自主研究的声明具有可比性。
      尚未覆盖: 代理基准分数与真实科学发现价值之间的一致性，以及长尾或跨学科科学任务的覆盖范围。
    - 路线: 自我改进与失败恢复机制
      解决的问题: 通过诊断实验失败、归因根本原因（如SAGE的多假设归因）并跨运行演化知识（如EvoMaster）来提高鲁棒性。
      尚未覆盖: 防止自我改进循环引入新错误或偏离科学上合理的假设；保证形式化证明反映预期的现实世界主张。
    - 路线: 人机协作与交互式监督
      解决的问题: 通过在高杠杆决策点插入人类判断来降低完全自主研究的风险，模式从全自主到逐步监督不等。
      尚未覆盖: 优化人类干预的时机和粒度以最小化认知负担并最大化结果质量，并扩展到长期研究。
    - 路线: 领域特定基础工具与形式化验证
      解决的问题: 嵌入学科知识（物理感知门控、Lean证明库），使通用AI科学家能够产生有效且领域一致的结果。
      尚未覆盖: 将这些领域特定组件泛化至新领域而不需重新工程化，并验证形式化是否忠实捕获科学语义。
    共识:
    - 所有系统都依赖LLM作为核心，但必须与外部工具、代码执行和仿真环境集成，而非仅靠纯语言推理。
    - 迭代闭环实验是核心范式：假设被提出、测试，并根据定量反馈进行优化。
    - 显式验证步骤（视觉-语言门控、陈述审计、基于事实的报告）对于抑制幻觉和伪造结果是必要的。
    - 评测仍是瓶颈，普遍认识到当前基准覆盖面窄，且需要人类基线进行校准。
    - 人类参与仍然不可或缺，无论是用于监督、最终判断还是处理自动化流水线无法解决的边缘情况。
    分歧:
