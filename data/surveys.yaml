    - line: Failure-aware memory and process improvement
      what_it_solves: Converts failed attempts into structured negative knowledge
        that downstream agents can adopt or reject, improving retry success and cross-task
        transfer while reducing token use.
      what_remains_open: Evidence is limited to ScienceAgentBench and nonlinear PDE
        tasks; broader failure modes, memory noise, and long-horizon scientific workflows
        are not covered.
    - line: Interactive multi-agent research infrastructure
      what_it_solves: Turns isolated model ideas into runnable research stacks with
        customizable roles, real-time monitoring, code harnesses, artifact inspection,
        and rollback/resume control.
      what_remains_open: Evaluation relies on five internal AI case studies and expert
        preference, leaving external standardization across hardware, datasets, and
        user settings unproven.
