  related_work_outline:
  - 'Mainstream direction: Autonomous LLM-based and multi-agent research pipelines
    that generate hypotheses or research directions, then close the loop through code
    execution, verification, and self-correction, with increasing emphasis on human-AI
    collaboration and benchmark comparability.'
  - 'Shared research pattern: Modular separation of ideation, execution, verification,
    and reporting; iterative use of experiment feedback, structured debate, failure
    attribution, and grounded reporting to convert failures into evidence.'
  - 'Key differences: Verification and authority mechanisms range from physics-aware
    visual gates to deterministic source-edit boundaries to multi-hypothesis causal
    diagnosis; interaction modes range from full autonomy to targeted human oversight;
    evaluation targets range from domain-specific discovery to domain-agnostic benchmark
    suites.'
  - 'Trend evolution: Within the 2025-2026 frontier, work moves from domain-specific
    autonomous scientists and early benchmarks toward reusable self-evolving frameworks,
    human-collaborative platforms, and reliability mechanisms such as verifiable reporting
    and failure attribution.'
  - 'Open questions: Alignment between agent benchmarks and real discovery utility;
    coverage of verification gates across out-of-distribution failures; optimal granularity
    of human intervention; cross-domain generalization of discovered methods; robust
    verification of novelty, citations, and reported numbers.'
  related_work_outline_zh:
  - 主流方向：自主LLM与多智能体研究管线，生成假设或研究方向，并通过代码执行、验证和自我纠正形成闭环，同时逐步重视Human-AI协作与基准可比性。
  - 研究共性：将构思、执行、验证和报告模块化；利用实验反馈、结构化辩论、失败归因和基于事实的报告把失败转化为证据。
  - 关键差异：验证与权威机制包括物理感知视觉门控、确定性源码编辑边界和多假设因果诊断；交互模式从完全自主到精准人工监督；评测目标从领域专用发现到领域无关基准。
  - 趋势演进：在2025–2026前沿内，工作从领域专用自主科学家和早期基准，转向可复用自演化框架、人机协作平台以及可验证报告和失败归因等可靠性机制。
  - 开放问题：代理指标与真实发现效用是否一致；验证门控对分布外失败的覆盖；人工干预的最优粒度；已发现方法的跨领域泛化；新颖性、引用与报告数字的可靠验证。
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific autonomous discovery loops
      what_it_solves: Generates and tests hypotheses inside constrained scientific
        settings by coupling literature-grounded ideation with domain-specific execution
        and verification, such as physics-aware flow-field inspection or single-cell
        data annotation and discovery questions.
      what_remains_open: Cross-domain transfer and out-of-distribution verification
        remain unresolved; one physics-aware gate missed silent failures in a planted-failure
        ablation and evaluation evidence is limited to selected domains.
    - line: Execution-grounded self-correction and failure attribution
      what_it_solves: Uses executed experiments, mechanism ablations, and multi-hypothesis
        failure diagnosis to route corrections to the hypothesis, experimental design,
        or implementation level, and constrains reports to measured values.
      what_remains_open: Fully autonomous scientific writing remains difficult, and
        failure-attribution coverage is only shown on specific benchmark trajectories
        rather than broad external validation.
    - line: Multi-agent orchestration and human-AI collaboration
      what_it_solves: Structures research workflows through role-specialized agents,
        structured debate, self-healing executors, dashboards, and human intervention
        points, enabling targeted oversight and artifact inspection.
      what_remains_open: Optimal human intervention granularity is not settled; several
        evaluations rely on internal case studies or expert judgment, so reproducibility
        and maturity are only partially demonstrated.
    - line: Benchmark and evidence design for AI scientists
      what_it_solves: Creates comparable experiment-stage tasks, expert-labeled datasets,
        baseline comparisons, human performance references, and metrics to measure
        autonomous research systems rather than isolated model quality.
      what_remains_open: Proxy benchmarks may not align with real scientific discovery
        utility, and current human baselines or task coverage are restricted to a
        small number of domains and question types.
    - line: Domain-agnostic self-evolving frameworks
      what_it_solves: Provides reusable agent scaffolding that accumulates knowledge
        across cycles, refines hypotheses, and can be instantiated for different disciplines
        with reduced implementation overhead.
      what_remains_open: Evidence is concentrated in benchmark scores and internal
        ecosystems; external validation across hardware, datasets, user settings,
        and citation-grounded reliability is missing or unverified.
    consensus:
    - Hypothesis generation alone is insufficient; systems converge on closing the
      loop with executed experiments, verification gates, and measured reporting before
      claims are accepted.
    - Human-AI collaboration remains relevant even in autonomous pipelines, with evidence
      suggesting targeted high-leverage intervention can outperform full autonomy
      or exhaustive oversight.
    - Evaluation requires experiment-stage benchmarks with baselines and metrics rather
      than static scientific question answering, and current systems still fall short
      of fully autonomous discovery.
    - Failures should be converted into evidence through diagnostic feedback, self-healing
      execution, or failure attribution instead of discarding unsuccessful runs.
    disagreements:
    - 'Intervention mode differs: some systems favor full autonomy with deterministic
      authority, while others rely on targeted human collaboration or interactive
      dashboards for oversight.'
    - 'Verification strategy differs: physics-aware visual gates, deterministic source-edit
      boundaries, multi-hypothesis causal attribution, and verifiable reporting constraints
      each make different reliability assumptions.'
    - 'Evaluation target differs: closed-domain discovery tasks such as CFD, single-cell
      omics, and time-series forecasting contrast with domain-agnostic agent benchmarks
      and internal case studies judged by experts.'
    - 'Generalization claim differs: domain-specific systems provide task-level evidence
      of discovered corrections, whereas evolving frameworks emphasize cross-discipline
      benchmark gains but lack broad external validation.'
    - 'Reproducibility differs: some systems provide code or open-source workflow
      signals, while others are surveys, internal platforms, or lack visible artifacts
      beyond benchmark results.'
    open_questions:
    - What evidence would show that ARC-Bench, BAISBench, and similar experiment-stage
      metrics predict real scientific discovery utility rather than benchmark proficiency?
    - How should verification gates be designed to cover distribution-shifted or silent
      failures, given that a vision-language physics gate missed planted failures?
    - What is the optimal placement and granularity of human intervention for improving
      research quality without creating excessive oversight bottlenecks?
    - How can domain-specific discoveries be tested for cross-domain generalization
      instead of being validated only in narrow CFD, omics, or forecasting cases?
    - How can autonomous research systems robustly verify novelty, citation existence,
      and numeric claims while avoiding hallucinated reports?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域专用自主发现闭环
      解决的问题: 在受约束的科学环境中生成并检验假设，将文献构思与领域执行和验证结合，如物理感知流场检查或单细胞数据注释与发现问答。
      尚未覆盖: 跨领域迁移与分布外验证未解决；一个物理感知门控在植入失败消融中遗漏了静默失败，评估证据仅覆盖少数领域。
    - 路线: 执行驱动的自纠正与失败归因
      解决的问题: 利用已执行实验、机制消融和多假设失败归因将纠正路由到假设、实验设计或实现层面，并把报告限制在测量值范围内。
      尚未覆盖: 完全自主的科学写作仍然困难，失败归因的覆盖只在特定基准轨迹上展示，缺乏广泛外部验证。
    - 路线: 多智能体编排与Human-AI协作
      解决的问题: 通过角色化智能体、结构化辩论、自愈执行器、仪表板和人工干预点组织研究工作流，支持精准监督和工件检查。
      尚未覆盖: 最优人工干预粒度尚未确定；多项评估依赖内部案例或专家判断，可复现性与平台成熟度只得到部分证明。
    - 路线: AI科学家基准与证据设计
      解决的问题: 建立可比的实验阶段任务、专家标注数据集、基线对比、人类表现参考和指标，以衡量自主研究系统而非孤立模型质量。
      尚未覆盖: 代理基准可能无法对应真实科学发现效用，当前人类基线和任务覆盖仅限于少量领域和题型。
    - 路线: 领域无关的自演化框架
      解决的问题: 提供可复用智能体脚手架，跨周期积累知识、优化假设，并以较低实现开销实例化到不同学科。
      尚未覆盖: 证据集中在基准分数和内部生态；跨硬件、数据集、用户设置以及引用可靠性的外部验证尚缺失或未证实。
    共识:
    - 仅生成假设不够；系统趋向于在执行实验、验证门控和基于测量的报告之后才接受研究主张。
    - 即使在自主管线中，Human-AI协作仍然重要，证据表明在高杠杆决策点进行精准人工干预可优于完全自主或逐步监督。
    - 评测需要实验阶段基准、基线和指标，而不是只做静态科学问答；当前系统仍未实现完全自主发现。
    - 失败应通过诊断反馈、自愈执行或失败归因转化为证据，而不是直接丢弃不成功的运行。
    分歧:
    - 干预模式不同：部分系统偏好完全自主或确定性权威，另一些依赖精准人工协作或交互式仪表板监督。
    - 验证策略不同：物理感知视觉门控、确定性源码编辑边界、多假设因果归因和可验证报告约束分别依赖不同的可靠性假设。
    - 评测目标不同：CFD、单细胞组学和时序预测等封闭领域任务，与领域无关智能体基准及专家评审内部案例形成对比。
