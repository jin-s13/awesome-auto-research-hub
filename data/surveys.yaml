    - line: Domain-aware discovery with verification gates
      what_it_solves: Grounds autonomous research in formal reasoning or physical
        simulation and catches some silent failures via logical checks or vision-language
        inspection of rendered fields.
      what_remains_open: Verification gates still miss failure cases, and evidence
        for transfer beyond the specific domain is limited.
    - line: Discovery benchmarks and virtual environments
      what_it_solves: Measures whether agents can complete discovery cycles through
        blind tasks, task-completion metrics, and evidence-maturity rubrics rather
        than only reproducing known studies.
      what_remains_open: Reported results are often constrained by a single frozen
        base model, and current agents still lack controls, robustness, and falsifiability.
    - line: Iterative search and reviewer feedback loops
      what_it_solves: Expands hypothesis/experiment exploration and improves manuscript
