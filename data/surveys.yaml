  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主实验与论文生成
      解决的问题: 从提示或最小指令自动完成想法提出、实现、执行、分析、可视化和论文初稿，减少研究流程中的人力。
      尚未覆盖: 可靠性不稳定：AI Scientist-v2 三篇仅一篇通过同行评审，ReasFlow 证据限于 LLM 打分的生成论文；新颖性校准和跨域泛化仍是验证缺口。
    - 路线: 多智能体编排、验证与记忆
      解决的问题: 通过内部验证循环、审稿反馈、知识检索或共享负知识库捕获错误并复用失败尝试，改进下一轮实验。
      尚未覆盖: 迁移证据有限：负知识在 PDE 任务间可迁移，但更广泛的跨域失败覆盖与记忆可扩展性尚未建立。
    - 路线: 科学发现智能体的评测环境与基准
      解决的问题: 用任务完成、相关动作、可解释知识或科学 ML 基准提升等指标，跨主题和难度比较智能体能力。
      尚未覆盖: 代理指标未必预测真实科学价值；当前智能体提升多来自工程技巧，DISCOVERYWORLD 与 Agent4Sci 只覆盖部分领域。
    - 路线: 交互式研究平台与代码工具
      解决的问题: 将本地代码库、数据集、检查点、监控与回滚控制连接起来，使人类能以可运行方式监督实验并检查工件。
      尚未覆盖: 评估限于少量内部 AI 研究案例；跨硬件、数据集、用户设置的外部验证和标准化工件缺失。
    共识:
    - LLM 智能体已能自动化科学发现的部分环节：提出想法、运行代码、分析结果和撰写论文。
    - 验证、审稿或失败记忆等反馈循环可以改善智能体输出，并可能降低令牌或人力成本。
    - 自动化评测能近似人类判断，并能暴露旧智能体环境未捕捉的挑战。
    - 当前自主研究系统仍受领域或范围限制，可靠性参差，尚未实现完全科学自主。
    分歧:
    - 人机控制不同：部分系统保留人类首席研究员或仪表板回滚，部分追求全自动端到端运行。
    - 评测目标不同：同行评审式接受、虚拟环境任务完成或科学 ML 基准提升，导向不同的成功主张。
    - 反馈信号不同：内部逻辑验证、AI 审稿或 VLM 反馈、共享负知识记忆或插件技能是替代闭环方式。
    - 领域设定不同：代码/机器学习实验、虚拟科学发现和应用数学推导对实验与证据的理解不同。
    开放问题:
    - 基准或案例中的性能提升是否来自研究级洞察，还是多为机器学习工程与优化技巧？
    - 在内部基准、工作坊投稿和窄域 PDE 任务之外，可靠性、新颖性和资源使用能否保持？
    - 哪些评测指标或环境最能预测真实实验或理论贡献？
    - 如何标准化代码、数据、工件与外部验证，以跨领域和硬件核验声明？
