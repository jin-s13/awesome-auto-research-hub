  - 趋势演进：在 2024-2026 的前沿窗口内，从早期全自动发现框架和虚拟环境，向智能体树搜索、交互式平台和失败感知记忆发展，同时基准测试暴露与人类水平的差距。
  - 开放问题：狭窄案例之外的可靠性、LLM 评审器作为决策证据的有效性、失败记忆的迁移性，以及跨任务、领域和基础设施的标准化外部验证仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous experimentation and manuscript generation systems
      what_it_solves: Covers the full research loop from idea/hypothesis generation
        through code/experiment execution to analysis and paper writing, reducing
        human intervention.
      what_remains_open: Demonstrations remain narrow and inconsistent; peer-review
        acceptance is limited to workshop-level or single-domain case studies, so
        general reliability across scientific domains is unproven.
    - line: Benchmark environments and planning evaluations for scientific discovery
        agents
      what_it_solves: Provides tasks, baselines, and automatic metrics to compare
        agent capabilities in hypothesis formation, experiment action selection, and
        ablation planning.
      what_remains_open: Strong agents still struggle on many tasks, while automated
        metrics and LLM judges are not yet shown to align with real scientific utility;
        task coverage and external validation are limited.
    - line: Failure-aware memory, verification, and iterative experiment planning
      what_it_solves: Uses failed attempts, logical verification, or tree search to
        improve subsequent experiments and avoid repeated errors in retries or new
        tasks.
      what_remains_open: Evidence of transfer mostly comes from narrow PDE or internal
        AI case studies; the separate contribution of memory/planning versus base
        model capability is not isolated.
    - line: Interactive human-monitored research platforms and reproducible code harnesses
      what_it_solves: Wraps multi-agent research workflows in dashboards with role
        customization, artifact inspection, rollback/resume, and local code/data integration.
      what_remains_open: Reported reproducibility signals vary; evaluations use few
        internal case studies and lack standardized external validation across hardware,
        datasets, and user settings.
    consensus:
    - There is a shared shift toward LLM-based agents that operate across multiple
      stages of experimentation, not only isolated prediction or analysis steps.
    - Simulated reviewers, LLM judges, and task completion metrics are commonly used
      as evaluation evidence for generated research or experimental actions.
    - Current systems still fall short of consistent human-level reliability on complete
      discovery tasks and ablation planning.
    - Verification loops, failure memory, and interactive monitoring are treated as
      necessary mechanisms for reducing repeated errors and increasing trust.
    - Most evidence remains constrained to narrow domains, internal case studies,
      or proxy metrics; code and artifact availability is uneven.
    disagreements:
    - 'Evaluation target differs: some work targets full manuscript production and
      peer-review-style acceptance, while other work targets task completion in virtual
      environments or ablation identification recall.'
    - 'Interaction mode differs: some systems run fully autonomously, while others
      adopt human-in-the-loop roles such as principal investigator or dashboard monitoring
      with rollback/resume.'
    - 'Planning and memory mechanism differs: one line uses agentic tree search over
      experiment paths, another records negative knowledge from failures, and another
      relies on internal logical verification before human inspection.'
    - 'Domain and deployment setting differs: contributions are evaluated in applied
      mathematics, machine learning subfields, diverse virtual scientific topics,
      or nonlinear PDE tasks, which can change failure modes and evidence strength.'
    - 'Evaluation evidence differs: some use automatic task metrics, some use LLM-based
      expert judges, and some use peer-review outcomes, making comparability difficult.'
    open_questions:
    - Can LLM-based reviewers or automatic task metrics substitute for human peer
      review and for evidence about downstream scientific value outside curated task
      suites?
    - Do failure-aware memory and verification loops transfer beyond the narrow PDE
      or AI case studies where they have been tested?
    - What level and form of human oversight is needed to keep autonomous experiment
      agents reliable in high-stakes or theory-heavy settings?
    - How should external validation be standardized across domains, compute environments,
      datasets, and user workflows when reproducibility signals are incomplete?
    - Why do current agents remain below human-level on ablation planning and many
      discovery tasks, and which component failures explain that gap?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主实验与论文生成系统
      解决的问题: 覆盖从想法/假设生成、代码与实验执行、分析到论文撰写的完整研究循环，减少人工干预。
      尚未覆盖: 演示范围窄且表现不稳定；同行评审接收仅在工作坊级别或单一领域案例中得到验证，跨科学领域的通用可靠性尚未证明。
    - 路线: 面向科学发现智能体的基准环境与规划评测
      解决的问题: 提供任务、基线和自动指标，比较智能体在假设形成、实验动作选择和消融规划方面的能力。
      尚未覆盖: 强智能体在许多任务上仍然表现困难，自动指标和 LLM 评审器尚未证明与真实科学效用一致；任务覆盖和外部验证有限。
    - 路线: 失败感知记忆、验证与迭代实验规划
      解决的问题: 利用失败尝试、逻辑验证或树搜索改进后续实验，避免重试或新任务中重复错误。
      尚未覆盖: 迁移证据主要来自狭窄的 PDE 或内部 AI 案例；记忆/规划相对于基础模型能力的独立贡献尚未隔离。
    - 路线: 交互式人工监控研究平台与可复现代码工具
      解决的问题: 将多智能体研究工作流封装到仪表板中，支持角色定制、工件检查、回滚/恢复和本地代码/数据集成。
      尚未覆盖: 可复现信号不一；评估仅使用少量内部案例，缺乏跨硬件、数据集和用户设置的标准化外部验证。
    共识:
    - 研究共同转向基于 LLM 的智能体，覆盖实验的多个阶段，而不仅是孤立的预测或分析步骤。
    - 模拟审稿人、LLM 评审器和任务完成指标常被用作评估生成研究或实验动作的证据。
    - 当前系统在完整发现任务和消融规划上仍未达到稳定的人类水平可靠性。
    - 验证循环、失败记忆和交互监控被视为减少重复错误和增强可信度的必要机制。
    - 多数证据仍局限于狭窄领域、内部案例或代理指标；代码和工件可得性不均衡。
    分歧:
    - 评测目标不同：有些工作面向完整论文生成和同行评审式接收，有些面向虚拟环境中的任务完成或消融识别召回率。
    - 交互模式不同：有些系统完全自主运行，有些采用首席研究员式人机协作或带仪表板监控和回滚/恢复。
    - 规划与记忆机制不同：一条路线对实验路径做智能体树搜索，另一条记录失败负知识，还有路线依赖人工检查前的内部逻辑验证。
    - 领域与部署场景不同：评估涉及应用数学、机器学习子领域、多样化虚拟科学主题或非线性 PDE 任务，失败模式和证据强度可能因此不同。
    - 评测证据不同：有的采用自动任务指标，有的采用 LLM 专家评审，有的采用同行评审结果，导致可比性不足。
    开放问题:
    - LLM 评审器或自动任务指标能否替代人类同行评审，并证明其在策展任务之外的科研价值？
    - 失败感知记忆和验证循环能否迁移到已测试的狭窄 PDE 或 AI 案例之外？
    - 在理论密集或高风险环境中，需要多少以及何种形式的人类监督才能保证自主实验智能体可靠？
    - 当可复现信号不完整时，如何跨领域、计算环境、数据集和用户工作流进行标准化的外部验证？
    - 为什么当前智能体在消融规划和许多发现任务上仍低于人类水平，哪些组件失效导致这一差距？
