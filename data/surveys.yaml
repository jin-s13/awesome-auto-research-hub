    研究路线矩阵:
    - 路线: 端到端自主科研与论文生成
      解决的问题: 将高层研究提示转化为代码、实验、可视化和完整手稿，减少人工干预。
      尚未覆盖: 成功不稳定：三篇研讨会论文中仅一篇通过同行评审，多数证据来自LLM评审或基准分数，尚未达到完整会议级验证。
    - 路线: 领域化验证与有效性门控
      解决的问题: 在结果被接受或写入前检查逻辑或物理有效性，减少静默失败和伪造发现。
      尚未覆盖: 门控仍有漏检，例如物理感知门控错过16个植入静默失败中的2个；测试领域之外的泛化尚未证明。
    - 路线: 人机协作与干预设计
      解决的问题: 把人工监督安排到高杠杆决策点，而不是逐步人工监督。
      尚未覆盖: 证据主要来自单一实验阶段基准；最优干预粒度和跨任务迁移尚未确立。
    - 路线: 失败归因与自我纠正
      解决的问题: 诊断实验失败原因并把纠正路由到假设、实验设计或实现，提升带指标输出和工件质量。
      尚未覆盖: 增益集中在代码开发与执行环节；完全自主科学写作和可投会议论文仍是整个领域难题。
    - 路线: 自动评审与生成论文评估
      解决的问题: 通过LLM评分、模拟评审、盲评和研讨会同行评审提供可重复的打分。
      尚未覆盖: 代理评审指标尚未与长期科学有效性、可复现性或真实科学效用挂钩。
    - 路线: 面向理论或领域写作的知识整合
      解决的问题: 检索陈述性和程序性知识以支持推理、证明和领域手稿内容。
      尚未覆盖: 仅在应用数学和计算流体力学等场景得到展示，跨学科迁移和隐性知识覆盖仍不确定。
    共识:
    - 多项系统显示LLM智能体能生成完整研究手稿，但成功率不稳定，且常依赖LLM评分或研讨会级评审。
    - 验证与报告约束被视为减少伪造数字、幻觉引用和静默无效结果的必要手段。
    - 自主系统共享一些重复失败模式：实现漂移、记忆或上下文退化、领域智能不足、过度兴奋和科学品味薄弱。
    - 在高杠杆决策点进行精准人工协作可优于完全自主和逐步监督，说明干预设计很重要。
    - 这些证据反映当前前沿而非成熟领域验证：评测依赖基准、模拟评审或研讨会接收。
    分歧:
    - 完全自主流程与人机协作流程不同：一些系统把人工降到首席研究员式角色，另一些主张在高杠杆点加入人工检查。
    - 验证策略不同：领域特定物理或逻辑门控与通用多智能体辩论、反思或VLM审稿反馈不一致。
    - 评测目标不同：壁面Cf RMSE等任务指标、ARC-Bench分数、LLM评分、盲评或研讨会同行评审各异。
    - 部署场景不同：应用数学、计算流体力学和通用机器学习对知识约束要求不同。
    - 报告纪律不同：一些系统把输出约束到实测值，另一些依赖模拟审稿人判断生成主张。
    开放问题:
    - 当前验证门控能否迁移到真实科学错误，特别是模糊、跨学科或未被植入静默失败覆盖的问题？
    - 报告成功中多少来自写作和报告质量，多少来自实际科学发现质量，未来评测能否区分两者？
    - 如何将人类协作从少量主题基准扩展到高风险或长周期研究？
    - LLM评分、研讨会同行评审和盲评是不是长期科学可复现性和影响力的有效代理指标？
    - 需要多深的领域知识检索和外部验证，才能降低跨领域重复出现的失败模式？
