  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Close the loop from hypothesis or research direction to experiment
        execution, result verification, and report generation, enabling systems to
        propose and test directions with reduced manual intervention.
      what_remains_open: Cross-domain reliability and failure-mode coverage are still
        not established; available evidence often shows improvement but not full autonomy
        or conference-ready scientific writing.
    - line: Failure-driven hypothesis generation and self-correction
      what_it_solves: Generate multiple evidence-grounded explanations for failed
        experiments and route corrections to hypothesis, experimental design, or implementation,
        improving metric-bearing outputs and artifact quality.
      what_remains_open: Whether attributed root causes reflect scientific insight
        or mainly local code and experiment fixes remains uncertain; novelty calibration
        is a reported weak point.
    - line: Domain-specific AI scientists with verification gates
      what_it_solves: Use domain constraints and validation mechanisms, such as physics-aware
        visual inspection or biological discovery tasks, to make autonomous ideation
        executable and catch silent failures.
      what_remains_open: Verification gates can still miss planted failures, and evidence
        for transferring domain-specific validation to other domains is missing.
    - line: Benchmarks and evaluation infrastructure for research agents
      what_it_solves: Provide tasks, baselines, human comparisons, and metrics for
        comparing autonomous research systems on hypothesis-driven discovery.
      what_remains_open: Proxy scores may reward engineering sweeps or artifact quality
        rather than novel, defensible research ideas, and domain coverage remains
        limited.
    - line: Human-AI collaboration and oversight
      what_it_solves: Enable human judgment to intervene at high-leverage points through
        multiple interaction modes or monitoring dashboards, balancing autonomy with
        oversight.
      what_remains_open: Optimal intervention granularity and generalizability beyond
        small internal case studies remain unresolved.
    consensus:
    - 'Autonomous research systems converge on a closed-loop pattern: generate a hypothesis
      or research direction, execute it, verify results, and use feedback to revise.'
    - Verification and grounded reporting are treated as necessary to reduce fabricated
      numbers, hallucinated citations, and invalid domain claims.
    - Human baselines and benchmark evidence show current systems are still below
      fully autonomous scientific discovery but can serve as accelerators for domain
      research.
    - Improvements often depend on search or engineering capability rather than demonstrably
      novel scientific insight, making evidence-grounded ideation a central bottleneck.
    disagreements:
    - 'Systems differ in verification depth: some use domain-specific validity gates
      such as visual physics inspection or biological data tasks, while others rely
      on code-level checks or expert preference judgments.'
    - 'Supervision models conflict: targeted human collaboration at high-leverage
      decision points is one claimed optimum, while other systems emphasize full autonomy
      or dashboard-based oversight.'
    - 'Evaluation targets diverge: benchmark success, artifact or paper quality, expert
      preference, and domain task improvement are used inconsistently, weakening comparability.'
    - 'There is disagreement about the source of gains: some evidence attributes improvements
      to ML-engineering tricks, while other work reports task-specific architecture
      or physical model improvements.'
    open_questions:
    - How can systems distinguish novel hypotheses from local parameter or architecture
      sweeps, and which metrics would reliably capture that distinction?
    - How well do domain-specific verification gates generalize to new datasets, domains,
      or failure modes outside their original setting?
    - What is the minimal and most effective human collaboration granularity for hypothesis
      generation and scientific decision-making?
    - Do current autonomous research benchmarks, expert judgments, or artifact-quality
      scores predict real-world scientific discovery utility?
    - Can failure attribution mechanisms produce reusable scientific knowledge, or
      do they mainly repair implementation and experiment-design errors?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流水线
      解决的问题: 把研究假设/方向到实验执行、结果验证和报告生成的闭环连接起来，使系统能在较少人工干预下提出并测试方向。
      尚未覆盖: 跨领域可靠性和失败模式覆盖仍未建立；现有证据通常展示改进，但未完全实现自主或可提交会议的科学写作。
    - 路线: 失败驱动的假设生成与自我纠正
      解决的问题: 为失败实验生成多个基于证据的解释，并把纠正路由到假设、实验设计或实现，从而提高含指标输出和工件质量。
      尚未覆盖: 归因出的根因是否反映科学洞察，还是主要修复局部代码和实验问题仍不确定；新颖性校准被报告为弱项。
    - 路线: 带验证门控的领域特定AI科学家
      解决的问题: 利用领域约束和验证机制（如物理感知视觉检查或生物发现任务）使自主构思可执行，并捕获静默失败。
      尚未覆盖: 验证门控仍可能漏掉植入失败，领域特定验证跨领域迁移的证据缺失。
    - 路线: 研究智能体的基准与评测基础设施
      解决的问题: 提供任务、基线、人类对比和指标，以比较自主研究系统在假设驱动发现上的表现。
      尚未覆盖: 代理分数可能奖励工程扫描或工件质量，而非新颖、可辩护的研究想法；领域覆盖仍有限。
    - 路线: 人机协作与监督
      解决的问题: 通过多种干预模式或监控仪表板让人类在高杠杆点介入，平衡自主性与监督。
      尚未覆盖: 最优干预粒度和超出小规模内部案例研究的泛化性仍未解决。
    共识:
    - 自主研究系统汇聚到闭环模式：生成假设或研究方向、执行、验证结果，并利用反馈修订。
    - 验证和基于事实的报告被视为必要机制，以减少伪造数字、幻觉引用和无效领域声明。
    - 人类基线和基准证据表明，当前系统尚未达到完全自主科学发现，但可作为领域研究的加速器。
    - 提升常依赖搜索或工程能力，而非可证明的新颖科学洞察，因此基于证据的构思是核心瓶颈。
    分歧:
    - 系统在验证深度上不同：部分使用领域特定有效性门控，如视觉物理检查或生物数据任务，其他则依赖代码级检查或专家偏好判断。
    - 监督模式存在冲突：在高杠杆决策点进行精准人机协作被认为是一种最优方式，而另一些系统强调全自主或仪表板式监督。
    - 评测目标不一致：基准成功、工件或论文质量、专家偏好和领域任务改进被混用，削弱可比性。
    - 对收益来源存在分歧：有证据将改进归因于ML工程技巧，其他工作则报告任务特定架构或物理模型改进。
