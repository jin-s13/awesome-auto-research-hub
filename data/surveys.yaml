  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery loops
      what_it_solves: Automating the full research cycle from hypothesis generation
        and code execution to experiment analysis and paper writing.
      what_remains_open: Success is inconsistent under peer review; one of several
        submissions passed, and claims have not been validated beyond workshop-level
        ML tasks.
    - line: Domain-aware verification-augmented discovery agents
      what_it_solves: Grounding discovery in domain constraints through knowledge
        retrieval, proof verification, or physics-aware visual checks before accepting
        results.
      what_remains_open: Verification gates still miss silent failures and are demonstrated
        on narrow domain cases; generated claims need broader external domain validation.
    - line: Discovery benchmarks and evidence-maturity evaluation
      what_it_solves: Creating tasks and rubrics that assess open-ended discovery
        rather than reproduction, including task completion, relevant actions, explanatory
        knowledge, and evidentiary maturity.
      what_remains_open: Current agents plateau with no statistically reliable separation
        on one frozen base model; proxy metrics and LLM judges have not been linked
        to real scientific utility or cross-model generalization.
    - line: Automated manuscript generation and review
      what_it_solves: Producing full papers and simulated reviews at low cost, reducing
        human writing and preliminary review burden.
      what_remains_open: Automated reviewers achieve near-human scoring in limited
        venues, but conference-level validity, limitation reporting, and artifact
        reuse remain unverified.
    consensus:
    - Research agents commonly structure discovery as an iterative loop over ideas,
      experiments, results, and manuscript writing.
    - Automated evaluation is treated as necessary for scaling comparison, using LLM
      reviewers, fixed rubrics, or benchmark task metrics.
    - Verification or validity gating is recognized as important for producing defensible
      claims, especially outside template ML tasks.
    - Human researchers remain present as principal investigators, reviewers, or external
      validators rather than being fully removed.
    disagreements:
    - 'Scope of discovery: some work targets general machine-learning research, while
      others constrain the system to applied mathematics or computational fluid dynamics.'
    - 'Evaluation target: some optimize workshop peer-review acceptance, others optimize
      benchmark task completion, and others score evidence maturity along dimensions
      such as controls and falsifiability.'
    - 'Verification mode: logical proof auditing, physics-aware visual inspection,
      and generic automated LLM review encode different notions of validity.'
    - 'Autonomy and human involvement: systems differ in whether they remove human-coded
      templates, retain a principal-investigator-graduate-student collaboration mode,
      or depend on external domain interpretation.'
    open_questions:
    - What evidence can connect LLM-judge scores, benchmark completion, or peer-review
      acceptance to reusable and novel scientific value?
    - How well do verification gates detect silent failures and logical mistakes across
      diverse scientific domains and settings?
    - Can discovery agents produce stable performance across different base models,
      datasets, and hardware, rather than plateauing on a single frozen model?
    - Which evaluation designs can distinguish agent contributions from improvements
      inherited from the underlying model or simulator?
