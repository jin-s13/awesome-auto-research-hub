  related_work_outline:
  - 'Mainstream direction: autonomous LLM-based agents that propose hypotheses, design
    or run experiments, verify outputs, and report findings as AI-scientist pipelines.'
  - 'Shared research pattern: research is decomposed into ideation, execution, verification
    or failure attribution, reporting, and selective human collaboration loops.'
  - 'Key differences: verification mechanisms range from vision-based physics checks
    and formal proof to constrained reporting or structured failure diagnosis; deployment
    spans domain-specific and domain-agnostic platforms.'
  - 'Trend evolution: 2025 evidence emphasizes surveys, domain benchmarks, and early
    systems; 2026 work pushes self-correction, self-evolution, formal grounding, and
    reusable infrastructure within the current frontier.'
  - 'Open questions: verification reliability, formal-to-empirical claim alignment,
    benchmark-to-discovery transfer, optimal human oversight, and external reproducibility
    remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以LLM智能体自动提出假设、执行实验、验证并报告结果，形成AI科学家流水线。
  - 研究共性：把研究拆为构思、执行、验证或失败归因、报告与选择性人机协作闭环。
  - 关键差异：验证机制从视觉物理检查、形式证明到可验证报告或结构化失败诊断不等，部署也分为领域专用与领域无关平台。
  - 趋势演进：2025年证据以综述、领域基准和早期系统为主，2026年更强调自纠正、自演化、形式化基础与可复现基础设施。
  - 开放问题：验证可靠性、形式与经验主张对齐、基准到真实发现的迁移、人机监督粒度及外部复现性仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Domain-grounded hypothesis search and verification agents
      what_it_solves: Turns proposed hypotheses into executable experiments or formal
        statements with domain-specific validity checks such as physical flow inspection
        or machine-checked proof.
      what_remains_open: Verification gates still miss silent failures or leave a
        gap between formal artifacts and intended scientific claims beyond the tested
        distribution.
    - line: Multi-agent self-correcting research pipelines
      what_it_solves: Uses structured debate, multi-hypothesis failure attribution,
        and constrained reporting to revise ideas or implementation faults and to
        suppress fabricated claims.
      what_remains_open: Evidence is concentrated in internal benchmarks and case
        studies; transfer to broader research settings and fully autonomous writing
        remain unresolved.
    - line: Benchmark and human-baseline evaluation for AI scientists
      what_it_solves: Provides tasks, baselines, expert human comparisons, and metrics
        for comparing hypothesis generation and experiment-stage scientific ability
        across systems.
      what_remains_open: Coverage is limited to specific domains or topics, and proxy
        scores may not track real novelty, discovery utility, or robustness.
    - line: Reusable autonomous research infrastructure
      what_it_solves: Packages role customization, code harnesses, artifact inspection,
        rollback, and self-evolution into runnable platforms for repeatable agent
        workflows.
      what_remains_open: Standardized external validation across hardware, datasets,
        and user settings is missing; platform evaluations may be narrow or internal.
    - line: Taxonomy and survey synthesis for agentic discovery
      what_it_solves: Organizes fragmented AI-scientist systems by scientific domain
        and capability, and catalogs metrics, frameworks, datasets, and challenges.
      what_remains_open: The proposed categories and challenge lists need direct empirical
        validation that they predict system reliability or task fit.
    consensus:
    - Autonomous idea generation is treated as an interactive loop spanning ideation,
      execution, verification, and reporting rather than a single completion step.
    - Claims require verification or constrained reporting because unfiltered generation
      can produce fabricated numbers, invalid physical findings, or ungrounded hypotheses.
    - Current systems are positioned as partial research support rather than fully
      autonomous scientific discovery.
    - Human collaboration at selective high-leverage checkpoints is treated as useful
      or necessary, not simply full autonomy or exhaustive oversight.
    disagreements:
    - 'Verification grounding differs: vision-based physical checks, machine-checked
      formal proofs, constrained verifiable reporting, or structured multi-hypothesis
      failure attribution.'
    - 'Supervision and interaction mode differ: fully autonomous loops, human-in-the-loop
      checkpoints, or interactive dashboard monitoring with rollback and artifact
      inspection.'
    - 'Evaluation target differs: domain-specific tasks such as computational fluid
      dynamics or single-cell omics, multi-topic benchmark suites, or expert-judged
      case studies.'
    - 'System architecture differs: domain-specific pipelines, multi-agent debate
      frameworks, self-evolving foundational platforms, or reusable interactive laboratories.'
    open_questions:
    - How reliably can verification gates detect silent failures outside the narrow
      failure sets used in ablations?
    - Can machine-checked proof or statement audits fully close the gap between a
      verified artifact and the intended scientific hypothesis?
    - Do benchmark gains such as ARC-Bench or Humanity's Last Exam translate into
      durable real-world discovery outcomes or novel ideas?
    - What is the optimal granularity and timing of human intervention in autonomous
      hypothesis and experimentation loops?
    - How much of reported improvement comes from self-correction and verification
      rather than the underlying model or task-specific scaffolding?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域约束下的假设搜索与验证智能体
      解决的问题: 把提出的假设转化为可执行实验或形式化陈述，并用物理检查或机器验证抑制无效想法。
      尚未覆盖: 验证门控仍会漏掉静默失败，形式化产物与真实科学主张之间存在未完全弥合的差距。
    - 路线: 多智能体自纠错研究流水线
      解决的问题: 通过结构化辩论、多假设失败归因和受限报告，修正假设或实现错误，并抑制伪造结果。
      尚未覆盖: 证据多来自内部基准和案例研究，向更广泛研究场景的迁移及全自主论文写作仍未解决。
    - 路线: 面向AI科学家的基准与人类基线评测
      解决的问题: 提供任务、基线、专家人类比较和指标，用于比较各系统在假设生成和实验阶段的能力。
      尚未覆盖: 任务覆盖局限于特定领域或主题，代理分数未必反映真实新颖性、发现效用或鲁棒性。
    - 路线: 可复用的自主研究基础设施
      解决的问题: 将角色定制、代码工具、工件检查、回滚和自演化封装为可重复运行的智能体研究平台。
      尚未覆盖: 缺少跨硬件、数据集和用户设置的标准化外部验证，平台评测可能偏内部或较窄。
    - 路线: 面向智能体科学发现的综述与分类合成
      解决的问题: 按科学领域和能力整理分散的AI科学家系统，并汇总指标、框架、数据集与挑战。
      尚未覆盖: 所提分类和挑战清单尚需直接实证验证，以证明其能预测系统可靠性或任务适配性。
    共识:
    - 自主假设生成被视为跨越构思、执行、验证和报告的交互闭环，而非单步生成。
    - 科学主张需要通过验证或受限报告加以约束，因为未过滤生成可能产生伪造数字、无效物理结论或无根据假设。
    - 当前系统被定位为部分研究支持工具，而非完全自主的科学发现者。
    - 在关键决策点进行选择性人机协作被认为有效或必要，而非完全自主或逐步穷尽监督。
    分歧:
    - 验证基础不同：基于视觉的物理检查、机器可验证明、受约束的可验证报告或结构化多假设失败归因。
    - 监督与交互模式不同：全自主回路、人机协作检查点、或带仪表板监控、回滚与工件检查的交互式平台。
    - 评测目标不同：计算流体动力学或单细胞组学等特定领域任务、多主题基准集、或专家评审的案例研究。
    - 系统架构不同：领域专用流水线、多智能体辩论框架、自演化基础平台、或可复用的交互式实验室。
    开放问题:
    - 验证门控在消融研究使用的有限失败集合之外，能否可靠检测静默失败？
    - 机器验证的证明或陈述审计能否完全弥合已验证产物与预期科学假设之间的差距？
    - ARC-Bench 或 Humanity's Last Exam 等基准提升能否转化为持久的真实发现结果或新颖想法？
    - 自主假设生成与实验回路中，人类干预的最佳粒度和时机是什么？
    - 报告中的改进有多少来自自纠错与验证，而非底层模型或任务特定脚手架？
