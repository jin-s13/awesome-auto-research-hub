  related_work_outline:
  - 'Mainstream direction: Agentic autonomous research pipelines that generate hypotheses,
    execute experiments, verify results, and report findings, increasingly specialized
    to domains such as fluid dynamics, biology, and causal inference.'
  - 'Shared research pattern: Discovery is decomposed into hypothesis proposal, execution,
    verification, and reporting; multi-agent loops, memory, self-correction, or verification
    gates are used to filter invalid results.'
  - 'Key differences: Verification ranges from domain-specific simulation or formal
    proof to general benchmark evaluation; human oversight ranges from full autonomy
    to targeted or interactive collaboration; evaluation targets include real data,
    benchmarks, case studies, and expert judgment.'
  - 'Trend evolution: Evidence is concentrated in 2025-2026, so the trend is within
    the current frontier: moving from surveys, benchmarks, and baseline AI-scientist
    systems toward self-correcting, self-evolving, formally grounded, and human-collaborative
    closed-loop systems.'
  - 'Open questions: Generalization beyond narrow test domains; reliability of verification
    gates; whether self-evolution improves genuine discovery or proxy metrics; formalization
    gaps; missing external validation and reproducibility evidence.'
  related_work_outline_zh:
  - 主流方向：构建生成假设、执行实验、验证结果并报告的智能体科研流水线；越来越面向流体力学、生物学、因果推断等领域。
  - 研究共性：将发现过程分解为假设提出、执行、验证和报告；用多智能体循环、记忆、自纠正或验证门控过滤无效结果。
  - 关键差异：验证方式从领域仿真、形式证明到通用基准评测不等；人类监督从完全自主到靶向或交互式介入；评测对象覆盖真实数据、基准、案例研究和专家判断。
  - 趋势演进：证据集中在2025–2026年，属当前前沿；从综述、基准和基线AI科学家系统走向自纠正、自演化、形式化和人机协作的闭环系统。
  - 开放问题：窄测试域外泛化、验证门控可靠性、自演化是否提升真实发现而非代理指标、形式化对齐缺口、外部验证与可复现证据缺失。
  literature_review:
    line_of_work_matrix:
    - line: Domain-grounded experimental discovery agents
      what_it_solves: Generate and test hypotheses inside a domain constraint, using
        simulated or experimental feedback to refine proposed physical models or experimental
        directions.
      what_remains_open: Whether discovered corrections transfer beyond the tested
        flow, scenario, or dataset; silent failure detection remains incomplete.
    - line: Human-in-the-loop multi-agent research platforms
      what_it_solves: Coordinate idea generation, execution, and verifiable reporting
        while allowing human intervention at high-leverage decision points.
      what_remains_open: Optimal intervention granularity and generalizability beyond
        small expert-judged case studies are not established.
    - line: Self-correcting and self-evolving agent frameworks
      what_it_solves: Attributed failed executions to causes and accumulate cross-run
        knowledge to improve later research cycles.
      what_remains_open: Whether accumulated knowledge improves genuine scientific
        discovery or primarily optimizes benchmark and artifact scores.
    - line: Formally grounded theoretical discovery
      what_it_solves: Generate and verify theoretical hypotheses with machine-checked
        proofs and audit alignment between formal statements and informal scientific
        claims.
      what_remains_open: The formalization gap may remain; no quantitative empirical
        results were reported in the available evidence.
    - line: Evaluation and human-baseline benchmarking for AI scientists
      what_it_solves: Compare AI scientists on real or curated tasks using metrics
        and human expert baselines to reveal autonomy limits.
      what_remains_open: Coverage across scientific domains and alignment between
        proxy metrics and real discovery utility are unresolved.
    consensus:
    - 'Idea generation is treated as part of a broader loop: proposed hypotheses must
      be executed and verified before being accepted as scientific claims.'
    - Verification, audit, or grounded reporting reduces fabricated numbers and silent
      failures, though residual misses remain.
    - Human collaboration helps most when targeted at high-leverage decision points
      rather than exhaustive step-by-step supervision.
    - Current systems remain far from fully autonomous scientific discovery and are
      validated on limited case studies or benchmarks.
    - Domain constraints provide useful validity signals but do not yet guarantee
      out-of-distribution scientific reliability.
    disagreements:
    - 'Verification mechanism differs: physics-aware visual gates, formal proof assistants,
      executable grounded reporting, or human expert judgment.'
    - 'Evaluation target differs: domain-specific real datasets with human baselines,
      general multi-topic benchmarks, internal AI case studies, or proof and artifact
      inspection.'
    - 'Autonomy stance differs: fully autonomous, targeted human-in-the-loop, interactive
      human-monitored rollback, and formal human-reviewed proof pipelines.'
    - 'Generalization strategy differs: domain-specific pipelines, domain-agnostic
      self-evolving foundational frameworks, and formal theory libraries.'
    - 'Reported success metrics differ: quantitative domain error reduction, relative
      benchmark gains, blind or expert preference scores, and proof correctness are
      not directly comparable.'
    open_questions:
    - Can hypothesis-generation systems produce valid scientific claims beyond the
      narrow datasets, simulators, or case studies shown?
    - What evaluation design and expert baselines are sufficient to connect AI scientist
      scores with real discovery utility?
    - How well do self-correcting loops improve genuine discovery versus optimizing
      benchmark artifact metrics?
    - Can formal verification or statement auditing close the gap between machine-checked
      artifacts and intended scientific claims?
    - Which missing reproducibility details, external validations, or failure cases
      should be required before comparing these systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域约束的实验发现智能体
      解决的问题: 在领域约束中用仿真或实验反馈生成并测试假设，以改进物理模型或实验方向。
      尚未覆盖: 发现的修正能否迁移到测试流场、场景或数据集之外仍不确定；静默失败检测尚不完整。
    - 路线: 人机协作的多智能体科研平台
      解决的问题: 在高杠杆决策点引入人类介入，协调想法生成、执行和可验证报告。
      尚未覆盖: 最优介入粒度尚未确定；在小型专家评审案例之外的普适性缺乏证据。
    - 路线: 自纠正与自演化智能体框架
      解决的问题: 将失败执行归因到具体原因，并跨运行积累知识以改进后续研究循环。
      尚未覆盖: 积累的是否为真实科学发现能力，还是主要优化基准和工件评分，尚未区分。
    - 路线: 形式化基础的理论发现
      解决的问题: 用机器验证证明生成并验证理论假设，并审计形式陈述与非形式科学主张的一致性。
      尚未覆盖: 形式化与预期科学主张之间可能存在差距；现有证据中未见定量实验结果。
    - 路线: 面向AI科学家的评测与人类基线基准
      解决的问题: 用真实或策展任务、指标和人类专家基线比较AI科学家，揭示自主性局限。
      尚未覆盖: 领域覆盖不足；代理指标与真实发现效用之间的对齐尚未解决。
    共识:
    - 想法生成被嵌入更大闭环：假设只有经过执行和验证后才会被接受为科学主张。
    - 验证、审计或基于事实的报告能减少虚构数字和静默失败，但仍有残留遗漏。
    - 在高杠杆决策点进行精准人机协作优于完全自主或逐步过度监督。
    - 当前系统距离完全自主科学发现仍很远，仅在有限案例或基准上得到验证。
    - 领域约束提供有效性信号，但尚不能保证分布外的科学可靠性。
    分歧:
    - 验证机制不同：物理感知视觉门控、形式证明助手、可执行事实报告或人类专家判断。
    - 评测目标不同：带人类基线的真实领域数据、多主题通用基准、内部AI案例研究或证明与工件检查。
    - 自主程度不同：完全自主、靶向人机协作、交互式人工监控回滚、形式证明人工审查。
    - 泛化策略不同：领域专用流水线、领域无关自演化基础框架、形式化理论库。
    - 报告的成功指标不同：领域误差降低、相对基准提升、盲评或专家偏好、证明正确性；这些指标不可直接比较。
    开放问题:
    - 假设生成系统能否在所示数据集、仿真器或案例研究之外的窄域上产生有效科学主张？
    - 何种评测设计和专家基线才能将AI科学家分数与真实发现效用连接起来？
    - 自纠正循环在多大程度上提升真实发现，而不仅是优化基准工件指标？
    - 形式验证或陈述审计能否弥合机器验证产物与预期科学主张之间的差距？
    - 在比较这些系统前，还应要求哪些可复现细节、外部验证或失败案例？
