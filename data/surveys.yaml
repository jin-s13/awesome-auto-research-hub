  related_work_outline_zh:
  - 主流方向：端到端基于大语言模型的研究智能体，整合构思、代码或实验执行、分析、验证与论文生成，并日益强调自动评审和证据质量。
  - 研究共性：把科学发现拆分为多个阶段，用大语言模型评审或基准评分评估输出，并加入验证门控以拦截无效或缺乏支持的主张。
  - 关键差异：通用机器学习发现智能体与领域专属物理/数学系统；内部有效性门控与外部基准裁判；全自主运行与人类作为项目负责人的人机协作。
  - 趋势演进：2024年出现广泛的全自动框架与虚拟发现任务；2025年加入智能体树搜索和研讨会同行接收；2026年转向领域专属验证和证据锚定基准，整体仍处当前前沿。
  - 开放问题：系统能否生成可信的对照、稳健性、可证伪性和跨域泛化；基于大语言模型的评审或评分在多大程度上预测科学价值；领域验证门控能否超出狭窄演示扩展。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Compressing literature synthesis, ideation, code or experiment
        execution, analysis, visualization, and manuscript writing into one runnable
        loop.
      what_remains_open: Inconsistent quality and limited validation; only one of
        three workshop submissions passed peer review, and some baselines cannot produce
        defensible claims without stronger gates.
    - line: Domain-specific discovery agents with verification gates
      what_it_solves: Adding logical, knowledge-retrieval, or physics-aware checks
        before accepting results or writing papers, reducing silent failures in mathematics
        or computational fluid dynamics.
      what_remains_open: Verification still missed 2 of 16 planted silent failures
        and was demonstrated only on narrow CFD or applied-math tasks.
    - line: Discovery benchmark environments
      what_it_solves: Providing repeatable multi-topic tasks that require hypothesis
        formation, experiment design, result analysis, and conclusion formation.
      what_remains_open: Strong baselines from prior environments struggle on most
        discovery tasks, and task-completion or action metrics may not align with
        real scientific utility.
    - line: Evidence-grounded blind evaluation
      what_it_solves: Comparing agents on blind tasks derived from peer-reviewed studies
        using frozen data and rubric-based evidence-maturity scoring.
      what_remains_open: Current evidence uses a single frozen base model; four coding
        agents plateau closely, and controls, robustness, falsifiability, and cross-base-model
        generalization remain unverified.
    consensus:
    - Autonomous LLM-based agents can execute a full scientific workflow from ideation
      to manuscript writing without human code templates in several recent demonstrations.
    - Automated assessment, whether via LLM reviewers, peer-review thresholds, benchmark
      completion, or evidence-maturity rubrics, is central to scaling evaluation of
      generated disclosures.
    - Verification and validity gating improve defensibility, but current systems
      still miss failures and often lack controls, robustness, falsifiability, and
      cross-dataset generalization.
    - Strong performance in earlier environments does not transfer automatically to
      novel discovery tasks, so discovery-specific evaluation is required.
    disagreements:
    - General-purpose machine-learning discovery agents pursue open-ended idea generation,
      while domain-specific systems constrain research to physics or applied mathematics
      with domain-gated execution.
    - 'Evaluation targets differ: virtual discovery task completion, blind evidence
      maturity against peer-reviewed studies, LLM-reviewer thresholds, and workshop
      peer acceptance are used as alternative standards.'
    - 'Claim validation differs: some systems use internal self-audit or vision-language
      physics gates, while others rely on external fixed LLM judges or benchmark-defined
      rubrics.'
    - 'Interaction and deployment differ: human-as-Principal-Investigator and agent-as-graduate-student
      collaboration versus fully autonomous or benchmark-embedded agent runs.'
    open_questions:
    - How can autonomous agents produce the controls, robustness checks, falsifiability
      tests, and cross-dataset generalization needed for trustworthy scientific claims?
    - To what extent do LLM-reviewer scores, workshop acceptance, benchmark completion,
      or evidence-maturity rubrics predict real scientific value beyond narrow demonstrations?
    - Can domain-specific verification gates generalize across tasks, domains, and
      failure modes when current examples still miss planted silent failures?
    - How stable are agent evaluations across base models, domains, and infrastructure
      when current evidence relies on single frozen models or narrow task sets?
