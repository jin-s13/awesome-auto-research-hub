  related_work_outline:
  - 'Mainstream direction: Build closed-loop scientific discovery agents and evaluate
    them through virtual discovery tasks, constrained coding benchmarks, or evidence-grounded
    blind studies, with growing emphasis on verifiable reasoning, safety, memory,
    and turn-level training.'
  - 'Shared research pattern: Agents are expected to form hypotheses, design and execute
    experiments, analyze evidence, and produce auditable conclusions; evaluation relies
    on environment feedback, verifier or evidence checks, and automated LLM judges,
    while human-domain validation remains partial.'
  - 'Key differences: Works target different settings such as virtual discovery tasks,
    single-GPU ML coding, materials-science code libraries, and wet-lab robotics;
    they also differ in feedback type, including task completion, process rewards,
    safety gates, and episodic memory.'
  - 'Trend evolution: From 2024 DiscoveryWorld-style task suites, the field is moving
    toward 2025-2026 process-verifiable RL, safety-reasoning loops, auditable question
    formation, and open-ended evidence-maturity benchmarks.'
  - 'Open questions: LLM judge reliability, verifier leakage, domain generalization,
    safety validation, and whether agents can produce controls, robustness, falsifiability,
    and cross-dataset generalization rather than merely executing workflows.'
  related_work_outline_zh:
  - 主流方向：构建闭环科学发现智能体，通过虚拟发现任务、受限编码基准或基于证据的盲测进行评估；可验证推理、安全、记忆与回合级训练成为新重点。
  - 研究共性：智能体需形成假设、设计并执行实验、分析证据并输出可审计结论；评估依赖环境反馈、验证器/证据检查与自动LLM评审，人类领域验证仍较有限。
  - 关键差异：研究关注不同场景，包括虚拟发现任务、单GPU机器学习编码、材料科学代码库和湿实验机器人；反馈形式也不同，包括任务完成、过程奖励、安全门和片段记忆。
  - 趋势演进：从2024年DISCOVERYWORLD式任务集，转向2025至2026年的过程可验证RL、安全推理循环、可审计问题形成和开放式证据成熟度基准。
  - 开放问题：LLM评审可靠性、验证器泄漏、跨域泛化、安全验证，以及智能体能否产出对照、稳健性、可证伪性和跨数据集泛化，而不只是执行流程。
  literature_review:
    line_of_work_matrix:
    - line: Virtual discovery environments and evidence-grounded benchmarks
      what_it_solves: Creates closed-loop tasks with hidden or withheld conclusions
        so agents must form hypotheses, run experiments, and produce supportable claims.
      what_remains_open: Whether proxy metrics such as task completion or LLM-judge
        evidence maturity predict real scientific utility and transfer across base
        models.
    - line: Auditable question and hypothesis formation
      what_it_solves: Turns vague research goals into structured, falsifiable questions
        with assumptions, mechanisms, tests, and failure update rules.
      what_remains_open: Evidence is preliminary and judged mainly by LLMs; human-domain
        validation and downstream discovery quality remain unproven.
    - line: Scientific coding agents and code library infrastructure
      what_it_solves: Produces vetted domain-specific code examples or end-to-end
        ML implementations under resource constraints, improving experiment executability.
      what_remains_open: Coverage is often single-domain or limited to seven ML tasks;
        generalization and alignment between LLM-as-judge and expert assessment are
        weak or unexplored.
    - line: Process-verifiable training environments and turn-level RL
      what_it_solves: Uses hidden evidence graphs, verifiers, and trajectory synthesis
        to provide dense reward or credit for multi-turn scientific reasoning.
      what_remains_open: Reported gains are limited to hypothesis-driven data-analysis
        benchmarks; hidden verifier leakage and broader scientific validity are not
        yet established.
    - line: Safety, memory, and grounded wet-lab control
      what_it_solves: Embeds safety checks or episodic experience into agent loops
        for tool-chain and physical lab execution.
      what_remains_open: Baselines or limitations are often unspecified, and safety/completion
        gains need external validation across labs, hardware, and task settings.
    consensus:
    - 'Scientific discovery is treated as a multi-step loop: question formation, experiment
      design, execution, analysis, and conclusion.'
    - Verifiability and auditability are central, using structured certificates, evidence
      graphs, trajectory checks, or output-based scoring rubrics.
    - Automated evaluation is necessary for scale, but several papers acknowledge
      LLM judges need calibration with domain experts.
    - Current agents can execute workflows and document analyses, yet they still lack
      controls, robustness, falsifiability, and scientific judgment.
    - Safety should be integrated into the core reasoning and tool-calling loop rather
      than treated as a separate filter.
    disagreements:
    - 'Evaluation target differs: closed-loop discovery task completion, end-to-end
      ML model coding on a single GPU, open-ended blind data interpretation, or wet-lab
      robotic tasks.'
    - 'Interaction mode differs: process-verifiable RL training, training-free memory
      evolution, code-library augmentation, and trajectory-aware safety checks attribute
      improvement to different mechanisms.'
    - 'Metric emphasis differs: task completion and relevant actions, evidence-maturity
      LLM scores, downstream accuracy and completeness, and success-rate or safety-gate
      reductions.'
    - 'Deployment setting differs: simulated text environments, materials science
      repositories, frozen scientific datasets, and physical robotic wet-lab tasks.'
    - Reliance on LLM judges ranges from primary evidence to a secondary proxy compared
      with domain experts, creating different evidence standards.
    open_questions:
    - Do LLM judges agree with human experts well enough to validate novel discoveries
      across fields?
    - Can process verifiers and hidden evidence graphs scale without leaking target
      conclusions or overfitting to curated tasks?
    - 'Which evaluation target best captures scientific discovery: task completion,
      code implementation, evidence maturity, or physical experiment safety?'
    - How can agents be pushed beyond competent analysis toward controls, robustness,
      falsifiability, and cross-dataset generalization?
    - Are safety and memory mechanisms transferable across base models, domains, laboratory
      hardware, and tool-chain deployments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 虚拟发现环境与基于证据的基准
      解决的问题: 构造闭环任务并隐藏结论，要求智能体形成假设、开展实验并产出可支持的科学主张。
      尚未覆盖: 任务完成率或LLM证据成熟度等代理指标能否预测真实科学效用并跨基座模型迁移，仍不清楚。
    - 路线: 可审计的问题与假设形成
      解决的问题: 把模糊研究目标转化为包含假设、机制、测试与失败更新规则的可证伪问题。
      尚未覆盖: 评估主要依赖LLM评审，缺少人类领域专家验证，下游发现质量尚未证明。
    - 路线: 科学编码智能体与代码库基础设施
      解决的问题: 提供经筛选的领域代码示例或资源受限下的端到端ML实现，改善实验可执行性。
      尚未覆盖: 覆盖常限于单一领域或七项ML任务，且跨领域泛化以及LLM评审与专家判断的一致性仍较弱。
    - 路线: 过程可验证训练环境与回合级RL
      解决的问题: 用隐藏证据图、验证器和轨迹合成提供密集奖励或回合级信用，训练多轮科学推理。
      尚未覆盖: 目前仅在假设驱动的数据分析基准上报告优势，验证器泄漏和更广泛科学有效性尚未建立。
    - 路线: 安全、记忆与具身湿实验控制
      解决的问题: 将安全校验或片段记忆嵌入智能体循环，约束工具链和物理实验操作。
      尚未覆盖: 基线或局限常未说明，安全与完成率提升需跨实验室、硬件和任务设置的外部验证。
    共识:
    - 科学发现被建模为多步闭环：问题形成、实验设计、执行、分析和结论输出。
    - 可验证性与可审计性成为核心，采用结构化证书、证据图、轨迹检查或基于产出的评分。
    - 自动化评估是规模化的必要手段，但多篇论文承认LLM评审器需要与领域专家校准。
    - 当前智能体能执行和记录分析流程，但普遍缺乏对照、稳健性、可证伪性和科学判断。
    - 安全应嵌入核心推理与工具调用循环，而不是作为独立的事后过滤层。
    分歧:
    - 评测目标不同：闭环发现任务完成、单GPU端到端ML编码、开放式盲数据解释，或湿实验机器人任务。
    - 交互模式不同：过程可验证RL训练、免训练记忆演化、代码库增强和轨迹感知安全检查分别把提升归因于不同机制。
    - 指标重点不同：任务完成与相关动作、LLM证据成熟度评分、下游准确性与完整性、成功率与安全门拦截下降。
    - 部署场景不同：模拟文本环境、材料科学GitHub仓库、冻结科学数据集和物理湿实验室机器人任务。
    - 对LLM评审器的依赖程度不同，从主要证据到与领域专家对照的辅助代理指标，证据标准不一致。
    开放问题:
    - LLM评审与人类专家的一致性能否足以验证跨领域的新发现？
    - 过程验证器和隐藏证据图能否在不泄漏目标结论或过拟合 curated 任务的情况下扩展？
    - 任务完成、代码实现、证据成熟度或物理实验安全，哪个评测目标最能捕捉科学发现？
    - 如何推动智能体从能胜任分析走向具备对照、稳健性、可证伪性和跨数据集泛化能力？
    - 安全与记忆机制能否跨基座模型、领域、实验室硬件和工具链部署迁移？
