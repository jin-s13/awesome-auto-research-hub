  related_work_outline:
  - 'Mainstream direction: Agentic LLM systems are being built to automate scientific
    and literature workflows, with multi-agent verification, knowledge retrieval,
    literature synthesis, paper generation, and open-ended discovery evaluation as
    central components.'
  - 'Shared research pattern: Systems decompose research into stages such as evidence
    gathering, hypothesis formation, analysis, and manuscript production, then score
    outputs through LLM rubrics, blind benchmark tasks, or human-authored questions.'
  - 'Key differences: Contributions split among end-to-end generation frameworks,
    evidence-grounded evaluation suites, domain-specific AI scientist tests, self-evolving
    cross-domain scaffolds, and failure-mode case studies; supervision and evaluation
    targets differ substantially.'
  - 'Trend evolution: The available top evidence is concentrated in 2025–2026, so
    the trend is within the current frontier; work is shifting from paper generation
    toward scalable self-evolution and more rigorous blind evaluation of evidentiary
    maturity.'
  - 'Open questions: Reliability of literature review automation, validity of LLM-judge
    proxies, generalization across base models and domains, absence of controls and
    falsifiability, and missing direct citation-analysis benchmarks remain open.'
  related_work_outline_zh:
  - 主流方向：构建智能体式LLM系统以自动化科学和文献工作流，核心包括多智能体验证、知识检索、文献综合、论文生成和开放式发现评测。
  - 研究共性：系统将研究拆分为证据获取、假设形成、分析、论文撰写等阶段，并通过LLM评分标准、盲式基准任务或人工设计问题进行评分。
  - 关键差异：工作分为端到端生成框架、证据锚定评测套件、领域特定AI科学家测试、自演化跨领域框架和失败模式案例；监督方式与评测目标差异明显。
  - 趋势演进：已有高排序证据集中在2025–2026年，因此趋势属于当前前沿；重点正从论文生成转向可扩展自演化和更严格的证据成熟度盲评。
  - 开放问题：文献综述自动化可靠性、LLM评委代理指标有效性、跨基座模型与领域的泛化、对照与可证伪性缺失，以及直接引用分析基准缺失仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Verified literature-to-manuscript synthesis agents
      what_it_solves: Automates literature synthesis, knowledge retrieval, verification,
        and full research paper generation from a minimal prompt.
      what_remains_open: Whether internal verification and retrieval improve actual
        literature claims rather than only curated LLM rubric scores, and whether
        generated papers are independently reproducible.
    - line: Blind evidence-grounded discovery evaluation
      what_it_solves: Evaluates open-ended agents by withholding source conclusions
        and scoring evidentiary maturity across dimensions such as controls, robustness,
        falsifiability, and novelty.
      what_remains_open: Reported results rely on one frozen base model, and the automated
        judge plus proxy dimensions may not capture real scientific validity.
    - line: Domain-specific AI scientist benchmarks
      what_it_solves: Tests AI scientists on real curated data and multiple-choice
        questions derived from published studies, with a human expert baseline.
      what_remains_open: Cell annotation and multiple-choice tasks may not reflect
        complete literature-driven biological discovery; broader dataset and task
        validation is missing.
    - line: Survey and failure-mode analysis of autonomous research
      what_it_solves: Organizes agentic science capabilities, implementation frameworks,
        metrics, challenges, and recurring failure modes into design guidance.
      what_remains_open: Survey-level evidence does not yet directly predict task
        success, and literature review automation is explicitly identified as an unsolved
        challenge.
    - line: Self-evolving cross-domain agent frameworks
      what_it_solves: Provides reusable scaffolds for hypothesis refinement, self-critique,
        and knowledge accumulation across scientific domains.
      what_remains_open: Broad benchmark gains do not isolate literature intelligence
        from general coding and reasoning ability; literature-specific evidence and
        limitation details are insufficient.
    consensus:
    - Research treats scientific progress as a workflow that can be decomposed into
      literature or evidence grounding, hypothesis formation, experimentation or analysis,
      and paper production.
    - Evaluation increasingly relies on automated LLM or rubric scoring, blind tasks,
      curated benchmark datasets, and human or multiple-choice baselines.
    - Current systems are framed as assisting scientists rather than fully replacing
      them, with capability described as promising but not yet trustworthy for autonomous
      claims.
    - Evidence quality, missing controls, reliability, and domain judgment are widely
      recognized as central obstacles.
    disagreements:
    - Some contributions emphasize end-to-end paper generation, while others emphasize
      reusable evaluation suites or failure-mode analysis over direct system output.
    - 'Evaluation targets differ: blind evidence maturity from frozen data, domain-specific
      multiple-choice questions from published studies, and broad generalist benchmarks
      are used as alternative success measures.'
    - 'Supervision and interaction differ: human expert as principal investigator,
      largely autonomous execution, or indirect monitoring through benchmarks and
      review.'
    - 'Evidence standards differ: curated LLM review rubrics, multi-dimensional LLM
      judging, or human bioinformatician baselines are treated as the reference signal.'
    open_questions:
    - Can literature synthesis and paper generation systems be evaluated on independent
      reproducibility rather than LLM reviewer preference?
    - Do current evidence-maturity rubrics correspond to real scientific discovery
      when agents plateau and lack controls, robustness, and falsifiability?
    - How should performance generalize across base models, domains, datasets, and
      deployment settings given the current evidence is narrow?
    - Which design changes would reduce failure modes such as memory degradation,
      implementation drift, and premature success claims in long-horizon literature
      workflows?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 验证式文献到稿件合成智能体
      解决的问题: 从少量提示出发，自动完成文献综合、知识检索、验证和论文生成。
      尚未覆盖: 内部验证与知识检索是否真正提升文献证据质量，尚缺乏独立可复现性。
    - 路线: 盲式证据锚定的发现评测
      解决的问题: 隐藏源结论，依据对照、稳健性、可证伪性、新颖性等维度评估开放式科学发现智能体。
      尚未覆盖: 结果仅基于一个冻结基座模型，自动化评委和代理维度能否代表真实科学有效性仍不明确。
    - 路线: 领域特定AI科学家基准
      解决的问题: 在真实单细胞转录组数据和源自已发表研究的选择题上，结合人类基线评估AI科学家。
      尚未覆盖: 细胞注释和选择题未必反映完整文献驱动发现能力，缺少更广泛验证。
    - 路线: 自主研究的综述与失败模式分析
      解决的问题: 梳理智能体科学能力、框架、指标、挑战和反复出现的失败模式，形成设计原则。
      尚未覆盖: 综述级证据不能直接预测任务成功率，文献综述自动化仍被明确列为未解决问题。
    - 路线: 跨领域自演化智能体框架
      解决的问题: 提供可复用的假设优化、自我批判和知识积累基础设施，以支撑多领域智能体科学。
      尚未覆盖: 通用基准提升无法分离文献智能与通用编码/推理能力，文献专项证据和局限性说明不足。
    共识:
    - 当前研究把科学工作流分解为文献或证据获取、假设形成、实验或分析、论文产出等阶段。
    - 评测逐渐依赖自动化LLM或评分标准、盲式任务、精选基准数据以及人类或多选题基线。
    - 研究普遍将现有系统定位为辅助工具，认为其能提供支持但尚不足以进行可信的自主主张。
    - 多个证据一致指出证据质量、缺失对照、可靠性和领域判断是核心障碍。
    分歧:
    - 有的工作侧重端到端论文生成，有的侧重可复用评测套件，有的侧重失败模式案例分析。
    - 评测目标不同：冻结数据的盲式证据成熟度、领域特定选择题、以及跨领域通用基准被用作不同成功标准。
    - 交互和监督方式不同：人类专家担任首席研究员、基本自主执行、或仅通过基准和评审间接监控。
    - 证据标准不同：LLM评审评分标准、多维LLM评判器、或人类生物信息学家基线分别被作为参考信号。
    开放问题:
    - 文献综合和论文生成系统是否能用独立可复现性而非LLM评审偏好来检验？
    - 当前证据成熟度评分是否能对应真实科学发现，而智能体仍缺对照、稳健性和可证伪性？
    - 在当前证据较窄的情况下，如何改善跨基座模型、领域、数据和部署场景的泛化？
    - 哪些设计能减少长程文献工作流中的记忆退化、实现漂移和过早宣称成功等失败模式？
