  related_work_outline:
  - 'Mainstream direction: Building end-to-end autonomous scientific discovery systems
    that generate, execute, and write up research, increasingly targeting peer-review
    acceptance.'
  - 'Shared research pattern: Multi-agent architectures with verification loops, self-correction,
    and failure memory to improve output reliability and scientific honesty.'
  - 'Key differences: Failure handling strategy (multi-hypothesis attribution vs.
    negative knowledge memory vs. design principles), human interaction depth (fully
    autonomous vs. selective human-in-the-loop), domain specificity (general ML vs.
    physics/math), and evaluation benchmarks (automated reviewer vs. workshop acceptance).'
  - 'Trend evolution: From initial fully automated frameworks toward domain-specialized
    systems, stronger failure robustness, and carefully calibrated human-AI collaboration,
    moving from proof-of-concept to real workshop-level publication.'
  - 'Open questions: How to achieve genuine scientific insight beyond template following,
    how to generalize failure-correction across scientific domains, how to design
    scalable human-AI collaboration modes, and how to establish unified benchmarks
    for scientific quality and creativity.'
  related_work_outline_zh:
  - 主流方向：构建端到端自主科学发现系统，自动进行研究、写作并提交同行评审，逐步朝向真实会议接收。
  - 研究共性：多智能体架构，集成验证循环、自我纠正和失败记忆，以提升输出可靠性和科学诚实性。
  - 关键差异：失败处理策略（多假设归因 vs. 负知识记忆 vs. 设计原则），人机交互深度（完全自主 vs. 选择性人机协作），领域专精性（通用ML vs.
    物理/数学），评测基准（自动评审 vs. 工作坊接收）。
  - 趋势演进：从最初的全自动框架向领域特化、更强失败鲁棒性和精确人机协作演进，从概念验证向真实工作坊级论文发展。
  - 开放问题：如何实现超越模板跟随的真正科学洞察力，如何跨领域泛化失败纠正，如何设计可扩展的人机协作模式，以及如何建立统一的科学质量与创造力基准。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automating the full scientific discovery cycle from ideation,
        coding, and experimentation to paper writing and simulated review.
      what_remains_open: Generated papers often lack genuine scientific insight and
        rely on automated reviewers rather than rigorous human peer review; generalizability
        across domains and consistent quality remain unverified.
    - line: Human-in-the-loop collaborative research
      what_it_solves: Injecting human judgment at high-leverage decision points to
        improve the quality and trustworthiness of AI-generated research, outperforming
        both fully autonomous and exhaustive oversight approaches.
      what_remains_open: Optimal human intervention frequency and orchestration are
        undetermined; scalability and cost of human involvement, and the risk of introducing
        human bias, are not systematically studied.
    - line: Failure diagnosis and self-correction
      what_it_solves: Increasing the robustness of AI research agents by analyzing
        failure causes and automatically routing corrective interventions to the appropriate
        stage (hypothesis, design, or implementation).
      what_remains_open: Generalizability of causal attribution methods across diverse
        failure modes; how to transfer failure knowledge to new tasks without overfitting
        to specific error patterns.
    - line: Verifiable reporting and grounded metrics
      what_it_solves: Preventing hallucinated numbers, fabricated citations, and unsupported
        claims in AI-generated papers by constraining outputs to measured values and
        enforced evidence linking.
      what_remains_open: Automatic verification of qualitative claims, theoretical
        derivations, and figure semantics remains unsolved; the approach may enforce
        a rigid reporting template that limits expressive scientific communication.
    - line: Failure mode analysis and design principles
      what_it_solves: Cataloging recurring failure patterns (e.g., implementation
        drift, memory degradation, weak scientific taste) to derive actionable design
        principles for building more robust AI scientist systems.
      what_remains_open: The derived principles are based on small-scale case studies
        and may not generalize; turning them into algorithmic improvements and quantifying
        ‘scientific taste’ remain open challenges.
    consensus:
    - Current LLM-based autonomous research systems suffer from significant failure
      rates and require additional verification and correction mechanisms beyond naive
      generation.
    - Relying solely on end-to-end LLM output leads to hallucinations and inaccurate
      claims; grounding outputs in measured values and verifiable evidence is necessary
      for scientific integrity.
    - Structured reflection, whether through failure memory or multi-hypothesis attribution,
      consistently improves retry success rates and artifact quality.
    - Human collaboration at key decision points outperforms both full autonomy and
      exhaustive step-by-step oversight, suggesting a middle ground for practical
      deployment.
    disagreements:
    - 'Failure handling granularity: some systems use explicit multi-hypothesis causal
      attribution, others use a blackboard of negative knowledge records, and yet
      others extract design principles from post-hoc case studies, reflecting different
      assumptions about what failure information is actionable.'
    - 'Human involvement degree: systems range from zero human interaction (fully
      autonomous) to seven distinct intervention modes, with no consensus on the optimal
      balance between human cost and output quality.'
    - 'Domain generality vs. specificity: proposals like ReasFlow and AI CFD Scientist
      are tuned to physics/math domains with dedicated verification gates, while AI
      Scientist and AutoResearchClaw aim for broad ML applicability, leading to trade-offs
      in depth versus breadth.'
    - 'Evaluation standards: performance is measured by automated reviewer scores,
      LLM-based rubric scoring, blind human evaluation, or real workshop acceptance,
      making cross-system comparison difficult and masking true scientific merit.'
    open_questions:
    - How can autonomous systems move beyond executing template experiments to generating
      genuinely novel scientific hypotheses and insights?
    - Can failure-correction mechanisms calibrated on ML subfields transfer to high-stakes
      or theory-heavy sciences without extensive re-engineering?
    - What is the most efficient human-AI collaboration protocol that maximizes scientific
      quality while keeping human effort scalable and bias-free?
    - How can the community construct a unified, multi-disciplinary benchmark that
      assesses both the reliability and the creative discovery capability of AI scientist
      systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流水线
      解决的问题: 自动化从构思、编码、实验到论文写作和模拟评审的完整科学发现循环。
      尚未覆盖: 生成的论文往往缺乏真正的科学洞察力，依赖自动评审而非严格的人类同行评审；跨领域泛化能力和输出质量的一致性未经证实。
    - 路线: 人机协作的自主研究
      解决的问题: 在关键决策点注入人类判断，提高AI生成研究的质量和可信度，胜过完全自主和详尽监督两种极端。
      尚未覆盖: 最优的人类干预频率与编排方式未定；人类参与的可扩展性、成本以及引入偏见的风险尚未系统研究。
    - 路线: 失败诊断与自我纠正
      解决的问题: 通过分析失败原因并自动将纠正干预路由到适当阶段（假设、设计或实现），提高AI研究代理的鲁棒性。
      尚未覆盖: 因果归因方法在多样失败模式上的泛化能力；如何将失败知识迁移到新任务而不对特定错误模式过拟合。
    - 路线: 可验证报告与事实指标
      解决的问题: 通过将输出约束为实测值并强制证据链接，防止AI生成论文中出现幻觉数字、虚构引用和不实主张。
      尚未覆盖: 定性主张、理论推导和图表语义的自动验证仍悬而未决；该方法可能强制使用僵硬的报告模板，限制表达性科学交流。
    - 路线: 失败模式分析与设计原则
      解决的问题: 归纳反复出现的失败模式（如实现漂移、记忆退化、薄弱的科学品味），提炼可操作的设计原则以构建更稳健的AI科学家系统。
      尚未覆盖: 所得原则基于小规模案例研究，普适性存疑；将其转化为算法改进以及量化“科学品味”仍是开放挑战。
    共识:
    - 当前基于LLM的自主研究系统存在显著的失败率，需要超出朴素生成的额外验证和纠正机制。
    - 仅依赖端到端LLM输出会导致幻觉和不准确的主张；为维护科学诚信，将输出建立在实测值和可验证证据之上是必要的。
    - 结构化反思，无论是通过失败记忆还是多假设归因，均能持续提高重试成功率和工件质量。
    - 在关键决策点进行的人类协作优于完全自主和详尽的逐步监督，暗示了实际部署的中间地带。
    分歧:
    - 失败处理粒度：一些系统使用显式多假设因果归因，另一些使用负知识记录黑板，还有的从事后案例研究中提取设计原则，这反映了对何种失败信息具有可操作性的不同假设。
    - 人类介入程度：系统从零人类交互（完全自主）到七种干预模式不等，对于人类成本与输出质量之间的最优平衡缺乏共识。
    - 领域通用性与专精性：ReasFlow和AI CFD Scientist等方案针对物理/数学领域进行调优，配备专用验证门控，而AI Scientist和AutoResearchClaw追求广泛ML适用性，导致深度与广度的权衡。
    - 评测标准：性能通过自动评审分数、基于LLM的评分量规、盲评或真实工作坊接收来衡量，使得跨系统比较困难，并掩盖了真正的科学价值。
    开放问题:
    - 自主系统如何超越执行模板化实验，产生真正新颖的科学假设和洞察？
    - 在ML子领域校准的失败纠正机制能否无需大量重新工程即迁移到高风险或理论密集的科学领域？
    - 在最大化科学质量的同时保持人类投入可扩展且无偏见，最有效的人机协作协议是什么？
    - 社区如何构建一个统一的多学科基准，以同时评估AI科学家系统的可靠性和创造性发现能力？
