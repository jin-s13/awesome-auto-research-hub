      尚未覆盖: 证据为初步且依赖裁判；对真实发现结果的下游影响未被展示。
    - 路线: 受限端到端编码评测
      解决的问题: 在单GPU、无互联网和时间预算约束下测试自主模型设计、实现与训练。
      尚未覆盖: 仅七个ML任务，约束设置可能不代表真实科研软件工作流或更大规模项目。
    - 路线: 经筛选的科学代码基础设施
      解决的问题: 提炼可用的领域代码示例，以提升智能体生成实验的准确性、完整性与科学合理性。
      尚未覆盖: 仅在一个领域评测；LLM裁判与专家仅中等一致，缺少外部验证。
    - 路线: 安全、具身与经验式执行
      解决的问题: 将轨迹感知安全、累积风险状态或片段经验整合进物理和虚拟执行管线。
      尚未覆盖: 跨任务、领域与故障模式的泛化尚未证明；安全机制对发现质量的影响未被单独区分。
    共识:
    - 智能体仍远未达到可信的自主科学发现；强基线在现有基准上表现出困难或表现平台化。
    - 评测越来越围绕开放式科学目标、证据成熟度、安全性和可复现性，而非简单答案匹配。
    - 智能体能够执行并记录分析或代码，但普遍缺乏对照、稳健性、可证伪性和跨领域泛化能力。
    - 自动LLM裁判被广泛使用，但其作为领域专家代理的可靠性仍未解决。
