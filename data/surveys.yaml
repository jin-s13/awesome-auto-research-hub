  related_work_outline:
  - 'Mainstream direction: Agentic multi-agent LLM pipelines are used to automate
    literature synthesis, review drafting, and research discovery; systems combine
    retrieval, planning, drafting, verification, and rubric-guided or benchmark-based
    evaluation, with human oversight as a recurring safeguard.'
  - 'Shared research pattern: Decompose scholarly workflow into specialized agent
    roles; iterate via reviewer agents, verification loops, backtracking, or self-evolution;
    evaluate with LLM rubrics, benchmark tasks, and occasional human baselines; report
    quality improvements but treat full autonomy as unsolved.'
  - 'Key differences: Task scope ranges from survey generation to broader autonomous
    scientific or algorithm discovery; evaluation targets include domain-specific
    human baselines, LLM reviewer rubrics, multi-agent review, and benchmark suites;
    interaction modes range from human PI-agent collaboration to self-evolving or
    tree-structured control.'
  - 'Trend evolution: The top evidence concentrates in 2025-2026. 2025 work emphasizes
    survey generation, broad surveys, and domain benchmarks; 2026 work shifts toward
    self-evolving frameworks, structured research trees, and failure-mode analysis,
    indicating a current-frontier push from capability toward reliability.'
  - 'Open questions: Whether LLM rubric scores predict real scholarly utility or gap
    discovery; how to preserve citation provenance and factual correctness; how to
    prevent memory and execution drift; whether domain discovery benchmarks transfer
    to literature search and citation analysis; and reproducibility gaps from missing
    limitation or artifact evidence.'
  related_work_outline_zh:
  - 主流方向：构建多智能体 LLM 流水线，实现文献综合、综述/论文生成与迭代验证；评测采用 LLM 评审指标和领域基准。
  - 研究共性：将学术流程拆分为专门智能体，引入评审、验证或反思循环，依赖 LLM 审查与人类对比基线。
  - 关键差异：任务范围从综述生成到更广泛科学发现；评测目标包括领域人类基线、LLM 评分准则、多智能体评审和基准套件；交互模式涉及 PI-agent 协作、自演化和树状回溯。
  - 趋势演进：2025 年以综述生成、广泛调查和领域基准为主；2026 年转向自演化框架、结构化研究树和失败模式分析，体现当前前沿从能力展示走向可靠性。
  - 开放问题：LLM 评分能否预测真实学术价值或差距发现；如何保持引文溯源和事实正确性；如何防止记忆与执行漂移；领域发现基准能否迁移到文献检索与引文分析；缺失局限性或工件证据带来的可复现性缺口。
  literature_review:
    line_of_work_matrix:
    - line: Agentic survey and scholarly paper generation
      what_it_solves: Automates literature synthesis and survey or manuscript drafting
        through modular scholarly roles and iterative rubric-guided review.
      what_remains_open: External human peer-review validation, citation provenance,
        and factual accuracy are not established by available LLM-judge quality scores.
    - line: Multi-agent scientific discovery workflow orchestration
      what_it_solves: Coordinates literature synthesis, hypothesis or algorithm generation,
        verification, and paper generation within an end-to-end research pipeline.
      what_remains_open: Evidence rarely isolates the contribution of workflow design
        from base model strength or domain priors; long-horizon execution drift and
        memory degradation remain.
    - line: Empirical benchmarks and human baseline evaluation
      what_it_solves: Creates comparable tasks and human performance references for
        AI scientists on real datasets and discovery questions.
      what_remains_open: Coverage focuses on domain discovery questions; literature
        search, citation analysis, and research gap discovery are only indirectly
        measured.
    - line: Failure-mode analysis and reliability engineering
      what_it_solves: Documents recurring autonomous research failures and proposes
        design principles for more robust AI-scientist pipelines.
      what_remains_open: The design principles lack direct cross-domain validation,
        and system reliability and ethical assurance are still described as unresolved.
    - line: Self-evolving and tree-structured research process optimization
      what_it_solves: Controls research trajectories through branching, backtracking,
        reflection, and cross-cycle knowledge accumulation to improve search quality.
      what_remains_open: Evidence is benchmark-specific, limitation details are missing,
        and external validation in literature intelligence settings is absent.
    consensus:
    - Multi-agent LLM systems are treated as a plausible foundation for automating
      literature synthesis, scholarly drafting, and research workflows.
    - Iterative reviewer, verification, or reflection loops are commonly used to improve
      generated output quality.
    - LLM-based rubric scoring, benchmark comparison, and human baselines are recurring
      evaluation mechanisms.
    - Full autonomy is not yet supported; evidence consistently treats literature
      review automation, system reliability, and logical correctness as open problems.
    disagreements:
    - 'Task scope differs: some systems generate survey manuscripts, while others
      pursue broader autonomous discovery or algorithm search.'
    - 'Evaluation targets differ: domain-specific human baselines, curated LLM review
      rubrics, and multi-agent review or benchmark suites are not interchangeable.'
    - 'Interaction modes differ: human PI-agent collaboration, self-evolving loops,
      and structured tree backtracking allocate control and oversight differently.'
    - Domain settings differ between applied mathematics, biological single-cell data,
      and general scientific agent benchmarks, changing what counts as valid evidence.
    open_questions:
    - Do rubric-aligned LLM quality scores predict actual scholarly usefulness, citation
      reliability, or research gap discovery?
    - How can literature intelligence systems maintain citation provenance and factual
      correctness across long survey manuscripts?
    - What mechanisms prevent memory degradation, implementation drift, and premature
      success declarations in long-horizon autonomous research?
    - How well do biological discovery or optimization benchmarks transfer to literature
      search, citation analysis, survey synthesis, and gap discovery?
    - 'Verification gap: several high-ranking entries lack limitation statements or
      external code/dataset links, so reproducibility constraints cannot be assessed.'
  literature_review_zh:
    研究路线矩阵:
    - 路线: 智能体综述与学术论文生成
      解决的问题: 通过模块化角色和迭代评分准则评审，自动化文献综合与综述或论文草稿生成。
      尚未覆盖: 外部人工同行评审验证、引文溯源与事实准确性尚未由现有 LLM 评判得分确立。
    - 路线: 多智能体科学发现工作流编排
      解决的问题: 在端到端研究流水线中协调文献综合、假设或算法生成、验证与论文生成。
      尚未覆盖: 证据很少分离工作流设计、基础模型能力或领域先验的贡献；长程执行漂移与记忆退化仍未解决。
    - 路线: 经验基准与人类基线评测
      解决的问题: 在真实数据集和发现问题上为 AI 科学家提供可比较任务和人类性能参照。
      尚未覆盖: 覆盖集中于领域发现问答；文献检索、引文分析与研究差距发现仅有间接测量。
    - 路线: 失败模式分析与可靠性工程
      解决的问题: 记录自主研究中反复出现的失败模式，并提出稳健 AI 科学家流水线的设计原则。
      尚未覆盖: 设计原则尚未在多个领域直接验证，系统可靠性与伦理保障仍被描述为未解决。
    - 路线: 自演化与树状结构化研究过程优化
      解决的问题: 通过分支、回溯、反思和跨周期知识积累控制研究轨迹，以提升搜索质量。
      尚未覆盖: 证据集中于特定基准；缺乏局限性细节，文献智能场景下的外部验证缺失。
    共识:
    - 多智能体 LLM 系统被视为自动化文献综合、学术草稿与研究流程的可行基础。
    - 迭代式评审、验证或反思循环被广泛用于提升生成质量。
    - LLM 评分准则、基准对比和人类基线是反复出现的评测机制。
    - 完全自主尚未成立；证据普遍将文献综述自动化、系统可靠性与逻辑正确性视为开放问题。
    分歧:
    - 任务范围不同：一些系统生成综述手稿，另一些进行更广泛的自主发现或算法搜索。
    - 评测目标不同：领域人类基线、人工设计的 LLM 评审准则和多智能体评审或基准套件不可互换。
    - 交互模式不同：人类 PI 与智能体协作、自演化循环和结构化树回溯对控制与监督的分配不同。
    - 领域设置不同：应用数学、生物学单细胞数据和通用科学智能体基准之间，有效证据标准不一致。
    开放问题:
    - LLM 评分准则对齐得分能否预测真实学术价值、引文可靠性或研究差距发现？
    - 文献智能系统如何在长综述手稿中保持引文溯源和事实正确性？
    - 哪些机制能防止长程自主研究中的记忆退化、实现漂移和过早宣布成功？
    - 生物学发现或优化基准在多大程度上能迁移到文献检索、引文分析、综述综合和差距发现？
    - 验证缺口：若干高排名条目缺少局限性说明或外部代码/数据集链接，因此可复现性边界无法评估。
