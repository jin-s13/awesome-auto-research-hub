  related_work_outline:
  - 'Mainstream direction: autonomous multi-agent research pipelines that combine
    literature search, data analysis, hypothesis formation, experiment or code execution,
    and report synthesis to produce scientific findings; 2026 systems increasingly
    add verification, self-healing, or targeted human oversight.'
  - 'Shared research pattern: decompose discovery into iterative loops over hypotheses,
    experiments, and evidence; use LLM agents with tool-calling, code interpreters,
    and structured memory or research trees; evaluate on synthetic or real biology
    tasks and wet-lab validation.'
  - 'Key differences: autonomy allocation ranges from fully autonomous operation to
    human-in-the-loop interventions at high-leverage points; search structure varies
    between tree-based evolutionary exploration and long-horizon parallel iteration;
    evaluation targets span general research benchmarks, biology lab task suites,
    equation discovery datasets, and laboratory validation.'
  - 'Trend evolution: within 2025-2026 the frontier moves from survey-oriented taxonomies
    and single-domain AI scientist demonstrations toward harder realistic benchmarks,
    traceable multi-agent systems, self-correction, and explicit attention to reproducibility
    and verification gaps.'
  - 'Open questions: whether reported gains reflect general hypothesis-generation
    ability or task-specific pipelines; how to reduce inaccurate statements and weak-direction
    persistence; how to validate systems across domains and longer cycles; and how
    to align proxy metrics with real scientific utility.'
