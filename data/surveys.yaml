    characteristics, and prior failures; separate creative LLM cognition from deterministic
    evaluation or authority; add targeted human oversight.'
  - 'Key differences: Domain-specific discovery agents versus general research pipelines;
    reliability via verification gates, failure attribution, or human intervention;
    evaluation ranges from domain metrics to benchmark success and expert preference.'
  - 'Trend evolution: Within the available 2025-2026 frontier, work is moving from
    broad surveys/platforms toward domain-grounded agents, standardized benchmarks,
    and stricter validity/reproducibility mechanisms; 2023 evidence is not present
    in top papers.'
  - 'Open questions: Research-level novelty versus engineering tricks, reliable silent-failure
    detection, benchmark-to-real utility transfer, optimal human intervention, and
    generalization of domain-specific systems.'
