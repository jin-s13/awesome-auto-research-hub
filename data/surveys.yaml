    - 有价值发现随周期线性增长是否能在超出测试周期数和开放科学领域中继续成立？
    - 哪些评测指标能预测真实世界科学效用，尤其在具身、延迟、异质和伦理约束场景？
    - 哪种结构化探索或人类干预模式能跨领域泛化，又有何种证据能证明这种迁移？
    - 长周期自主研究系统能否在早期拒绝弱方向并保持证据来源，而无需人类清理？
