  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery workflows
      what_it_solves: Combines hypothesis generation, code execution, experiment management,
        and manuscript writing into a single iterative agent loop.
      what_remains_open: Peer-review success is inconsistent; validation remains simulated
        or workshop-level, and failure modes beyond execution are not systematically
        measured.
    - line: Benchmark and task design for discovery agents
      what_it_solves: Provides standardized tasks and metrics to compare whether agents
        can form hypotheses, run experiments, analyze data, and reach supported conclusions.
      what_remains_open: Coverage across domains and base models is limited, and proxy
        metrics such as task completion have not been tied to real scientific utility.
    - line: Domain-specific verification and reliability gates
      what_it_solves: Detects invalid or physically implausible proposals by inspecting
        rendered outputs before results are accepted, reducing silent failures in
        CFD experiments.
      what_remains_open: The gate still misses some planted failures, and its effectiveness
        depends on domain-specific visual checks that may not transfer.
    - line: Automated review and evidence-maturity assessment
      what_it_solves: Produces scalable, deterministic scoring of generated claims
        along dimensions such as controls, robustness, falsifiability, novelty, and
        auditability.
      what_remains_open: Evaluations rely on fixed LLM judges and single frozen base
        models; alignment with human peer review and cross-model generalization are
        not established.
    - line: Interactive multi-agent research platforms
      what_it_solves: Orchestrates configurable research roles, live monitoring, artifact
        inspection, and local code execution for multi-agent scientific workflows.
      what_remains_open: Evidence comes from a small set of internal AI case studies
        with expert preference judgments, so external validation and maturity are
        unclear.
    consensus:
    - Autonomous agents can execute and document experiments, but execution competence
      alone does not demonstrate scientific judgment or trustworthy claims.
    - Rigorous evaluation increasingly distinguishes task completion from evidentiary
      maturity, including controls, robustness, falsifiability, and cross-dataset
      generalization.
    - Reliability mechanisms such as validity gates, evidence-based judges, or human
      baselines are needed to catch unsupported or physically invalid outputs.
    - Current agents plateau or fail on tasks requiring original scientific discovery,
      showing a gap between producing artifacts and producing defensible results.
    - Benchmarks and platforms make verification gaps explicit, especially around
      automated judging, domain transfer, and external reproducibility.
    disagreements:
    - 'Evaluation target differs: some work measures open-ended machine learning or
      virtual discovery, others target CFD physics or single-cell omics discovery.'
    - 'Verification mechanism differs: one route uses vision-language inspection of
      rendered flow fields, another uses fixed LLM evidence-maturity scoring, and
      another uses human bioinformatician baselines.'
    - 'Interaction mode differs: single end-to-end agents compete with interactive
      multi-agent research teams and benchmark harnesses that expose blind tasks.'
    - 'Supervision differs: simulated or automatic reviewers, task-completion metrics,
      and peer-review acceptance thresholds each encode different standards of success.'
    - 'Deployment setting differs: OpenFOAM-based CFD experiments, text-based virtual
      environments, and local codebases with dashboards impose different reliability
      and reproducibility requirements.'
    open_questions:
    - How well do automated LLM judges align with human peer review when evaluating
      open-ended scientific claims across domains?
    - Can domain-specific reliability gates be generalized without losing their ability
      to detect silent failures?
    - What evaluation metrics beyond task completion and paper acceptance predict
      genuinely novel, reproducible scientific results?
    - Are current multi-agent research platforms robust outside small internal case
      studies and expert preference judgments?
    - Why do coding agents plateau in evidence maturity and miss controls, robustness,
      and falsifiability even when they can execute analyses?
    - What oversight or governance controls should accompany autonomous research agents,
      given that the packet emphasizes evaluation and verification but contains little
      direct safety evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现工作流
      解决的问题: 将假设生成、代码执行、实验管理和论文撰写整合到单一迭代式智能体循环中。
      尚未覆盖: 同行评审成功率不稳定；验证仍停留在模拟或工作坊层面，执行之外的失败模式未被系统测量。
    - 路线: 发现智能体的基准与任务设计
      解决的问题: 提供标准化任务和指标，比较智能体能否提出假设、运行实验、分析数据并得出有支撑的结论。
      尚未覆盖: 跨领域与跨基座覆盖有限；任务完成等代理指标与真实科研效用之间的关系尚不明确。
    - 路线: 领域特定验证与可靠性门控
      解决的问题: 在接受结果前检查渲染输出，识别无效或物理上不可信的方案，减少CFD实验中的静默失败。
      尚未覆盖: 门控仍会漏掉部分植入失败，其有效性依赖领域特定视觉检查，未必可迁移。
    - 路线: 自动评审与证据成熟度评估
      解决的问题: 沿对照、稳健性、可证伪性、新颖性和可审计性等维度，对生成声明进行可扩展、确定性的自动评分。
      尚未覆盖: 依赖固定LLM评委和单一冻结基座模型；与人类同行评审的一致性及跨基座泛化未建立。
    - 路线: 交互式多智能体研究平台
      解决的问题: 编排可配置研究角色、实时监控、工件检查与本地代码执行，支撑多智能体科研流程。
      尚未覆盖: 证据来自少量内部AI案例和专家偏好判断，外部验证与成熟度仍不清晰。
    共识:
    - 自主智能体能够执行并记录实验，但执行能力本身不能证明科学判断或可信声明。
    - 严格评测越来越区分任务完成与证据成熟度，包括对照、稳健性、可证伪性和跨数据集泛化。
    - 需要有效性门控、基于证据的评委或人类基线等可靠性机制，以捕获无支撑或物理无效的输出。
    - 当前智能体在需要原创科学发现的任务上出现平台期或失败，说明生成工件与生成可辩护结果之间存在差距。
    - 基准和平台使自动评审、领域迁移与外部可复现性等方面的验证缺口更加明确。
    分歧:
    - 评测目标不同：有的测量开放机器学习或虚拟发现，有的针对CFD物理或单细胞组学发现。
    - 验证机制不同：一条路线检查渲染流场的视觉-语言结果，另一条使用固定LLM证据成熟度评分，还有一条使用人类生信基线。
    - 交互模式不同：单端到端智能体与交互式多智能体研究团队、暴露盲任务的基准工具并存。
    - 监督信号不同：模拟或自动评审、任务完成指标、同行评审接受阈值分别编码不同的成功标准。
    - 部署场景不同：基于OpenFOAM的CFD实验、基于文本的虚拟环境和带仪表板的本地代码库对可靠性与复现性要求不同。
    开放问题:
    - 自动LLM评委在跨领域评估开放式科学声明时，与人类同行评审的一致性有多高？
    - 领域特定可靠性门控能否在不失去静默失败检测能力的情况下实现泛化？
    - 除了任务完成和论文接受之外，哪些评估指标能预测真正新颖且可复现的科学结果？
    - 当前多智能体研究平台能否在少量内部案例和专家偏好判断之外保持稳健？
    - 为何编码智能体在执行分析时表现出证据成熟度平台期，并普遍缺少对照、稳健性和可证伪性？
    - 当自主智能体可以写论文、跑实验和修改源代码时，需要哪些监督与治理机制？本证据包中的直接安全证据仍然有限。
