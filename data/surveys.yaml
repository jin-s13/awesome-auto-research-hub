  related_work_outline_zh:
  - 主流方向：构建具有验证机制的自主科研智能体与基准，重点评测证据成熟度、可靠性和治理能力。
  - 研究共性：都围绕自动化科研闭环，在盲任务或受控条件下评估假设生成、实验执行和主张形成。
  - 关键差异：验证位置、评估目标、领域范围和自主边界不同。
  - 趋势演进：从通用论文生成和虚拟任务集，转向证据锚定评测、领域化验证和受约束智能体架构。
  - 开放问题：自动评委与专家判断一致性、静默失败检测、跨基座和跨领域泛化仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous discovery agents with embedded verification
      what_it_solves: closing the hypothesis-to-paper loop while rejecting some invalid
        results through physics-aware or reviewer-like gates
      what_remains_open: gates still miss silent failures and validation is often
        limited to one domain or workshop-level publication
    - line: Evidence-grounded evaluation benchmarks
      what_it_solves: scoring research agents on blinded tasks and evidentiary maturity
        rather than reproduction of hidden target studies
      what_remains_open: reported results use a single frozen base model; cross-model
        generality and judge-expert agreement are not established
    - line: Constructed virtual discovery environments
      what_it_solves: offering many controllable discovery tasks with automatic metrics
        for task completion, relevant actions, and explanatory knowledge
      what_remains_open: strong agents still struggle, and transfer from simulated
        tasks to real research workflows remains unclear
    - line: Reliability-by-design agent architectures
      what_it_solves: constraining autonomous research through deterministic program
        authorities for source edits, canonical evaluation, and promotion decisions
      what_remains_open: external validation across environments, datasets, and user
        settings is missing and limitations are not systematically documented
    consensus:
    - Automated research agents remain insufficient for fully autonomous trustworthy
      discovery; several evaluations find weak controls, robustness, falsifiability,
      or high task failure.
    - Evaluation is shifting from generated outputs alone toward blinded tasks, evidence
      maturity, and failure-case analysis.
    - Embedded verification or deterministic authority improves reliability but still
      cannot fully catch silent or invalid claims.
    - Human baselines or automated reviewers are commonly used to anchor ability.
    disagreements:
    - 'Evaluation targets differ: task completion and action interpretability, paper
      acceptance, evidence maturity, or implementation success.'
    - 'Verification location differs: some systems embed physics-aware or reviewer-like
      gates inside the agent, while others rely on an external benchmark judge.'
    - 'Domain scope differs: general machine learning workflows, computational fluid
      dynamics, omics data, and forecasting architectures.'
    - 'Autonomy boundary differs: some systems pursue open-ended LLM-driven generation,
      while others separate cognition from deterministic authority.'
    open_questions:
    - How closely do LLM-based judges align with expert human judgment across base
      models and scientific domains?
    - Which controls, robustness checks, and falsifiability requirements are necessary
      before research-agent claims become trustworthy?
    - Can verification gates be improved to detect silent failures outside the distribution
      used for ablation?
    - Do results in virtual or domain-specific benchmarks transfer to real-world scientific
      discovery workflows?
    - Are reported gains attributable to the agent design, underlying base model,
      or task-specific infrastructure; several papers lack limitation details for
      verification.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 内置验证的自主发现智能体
      解决的问题: 把假设生成、实验执行和写作闭环起来，通过物理感知或评审式门控筛除部分不可靠结果
      尚未覆盖: 门控仍会漏掉静默失败，验证多限于单领域或工作坊级发表场景
    - 路线: 证据锚定评测基准
      解决的问题: 用盲任务和自动化评委对证据成熟度评分，而非只评测复现或最终答案
      尚未覆盖: 报告结果仅基于单个冻结基座模型，跨模型泛化和评委-专家一致性尚未建立
    - 路线: 虚拟发现环境
      解决的问题: 提供大量可控发现任务，用自动指标衡量任务完成度、相关动作和解释性知识
      尚未覆盖: 强基线仍普遍挣扎，模拟任务向真实研究流程的迁移不明确
    - 路线: 可靠优先的智能体架构
      解决的问题: 通过确定性程序权威限制源码编辑、标准评估和晋升决策，约束无边界自主研究
      尚未覆盖: 缺少跨环境、数据集和用户设置的外部验证，局限性也未系统记录
    共识:
    - 当前自动化科研智能体尚不足以支撑完全自主的可信发现，常缺少对照、稳健性或可证伪性。
    - 评测正从只看生成结果转向盲任务、证据成熟度和失败案例分析。
    - 内置验证或确定性权威能提高可靠性，但仍无法完全捕捉静默或无效主张。
    - 常以人类基线或自动评审器作为能力锚点。
    分歧:
    - 评估目标不同：任务完成与动作可解释性、论文接受、证据成熟度或实现成功率。
    - 验证位置不同：部分系统在智能体内部嵌入物理感知或评审式门控，部分依赖外部基准评判器。
    - 领域范围不同：通用机器学习、计算流体动力学、组学数据和时间序列预测架构。
    - 自主边界不同：从开放式 LLM 驱动生成到认知与确定性权威分离的受约束执行。
    开放问题:
    - LLM 评审器与专家人类判断在不同基座模型和科学领域中的一致性如何？
    - 科研智能体的可信主张需要哪些最低限度的对照、稳健性和可证伪性检查？
