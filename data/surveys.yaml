  - 主流方向：构建端到端LLM或多智能体系统，自动完成科研构想、执行、验证、可视化、论文起草与评审。
  - 研究共性：形成从实验执行到写作与评审的闭环，并在结果进入论文前引入验证机制。
  - 关键差异：通用科研流水线与领域专用验证门控；完全自主与人机协作；LLM评分表、同行评审与基准指标；单次反思与多假设纠正。
  - 趋势演进：在2024-2026前沿内，从通用自动科研写作框架走向树搜索、领域验证、失败归因和精准人机协作。
