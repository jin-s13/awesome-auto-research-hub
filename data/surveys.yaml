  related_work_outline:
  - 'Mainstream direction: LLM-powered agentic research pipelines that propose hypotheses,
    execute experiments, and verify findings dominate the available top-ranked evidence.'
  - 'Shared research pattern: systems chain literature-grounded ideation, executable
    experiment loops, verification gates, and reporting constraints into a single
    workflow.'
  - 'Key differences: verification substrate, human-in-the-loop mode, domain-specific
    versus domain-agnostic design, and evaluation target split the current lines of
    work.'
  - 'Trend evolution: the evidence moves from 2025 surveys and benchmarks toward 2026
    self-evolving, formally grounded, and domain-specialized systems, still within
    the current frontier.'
  - 'Open questions: verification gate reliability, benchmark-to-real-discovery transfer,
    formalization gaps, and optimal human oversight remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以LLM为驱动的智能体科研流水线在当前高相关证据中占主导，自动提出假设、执行实验并验证发现。
  - 研究共性：系统将基于文献的构思、可执行实验循环、验证门控和报告约束串联成统一工作流。
  - 关键差异：验证载体、人在回路模式、领域专用与领域通用设计，以及评测目标区分了当前研究路线。
  - 趋势演进：证据从2025年的综述与基准向2026年的自演化、形式化基础和领域专用系统演进，仍处于当前前沿内。
  - 开放问题：验证门控可靠性、基准到真实发现的迁移、形式化鸿沟和最优人类监督仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous hypothesis-to-experiment pipelines with domain-specific verification
        gates
      what_it_solves: turns proposed research ideas into executed experiments and
        uses validity checks before claims are accepted
      what_remains_open: verification gates still miss silent failures and rely on
        domain-specific visual, formal, or reporting assumptions
    - line: Multi-agent collaborative research orchestration with structured debate
        and self-healing execution
      what_it_solves: coordinates ideation, experiments, result analysis, and reporting
        while recovering from execution failures and human or automated feedback
      what_remains_open: evaluation is often limited to internal case studies or benchmark
        comparisons, and optimal human intervention design is not established
    - line: Benchmarks and evaluation for AI scientists on real scientific data tasks
      what_it_solves: makes hypothesis and discovery claims comparable through task
        datasets, baselines, metrics, and human performance references
      what_remains_open: coverage across disciplines is limited, and proxy task success
        may not transfer to real discovery utility
    - line: Self-evolving and foundational agent frameworks for scalable agentic science
      what_it_solves: reuses a general evolving agent scaffold across disciplines
        to improve benchmark performance and accumulate knowledge across cycles
      what_remains_open: limited evidence that domain-agnostic self-evolution preserves
        scientific validity outside benchmark settings
    - line: Formally grounded theory-generation systems with machine-checked proof
        assistants
      what_it_solves: automates theoretical hypothesis generation and proof construction
        with formal correctness guarantees
      what_remains_open: formal proof correctness does not ensure faithful capture
        of the intended scientific claim, and human inspection is still required
    consensus:
    - Autonomous hypothesis generation must be paired with execution and some verification
      mechanism to produce defensible scientific outputs.
    - LLM-driven agents are used as research orchestrators rather than only idea generators,
      spanning literature-grounded ideation, code execution, experiment analysis,
      and reporting.
    - Fully autonomous pipelines can fabricate numbers, hallucinate citations, or
      miss silent failures, so validity gates or human oversight are treated as necessary.
    - Evaluation is increasingly benchmark-oriented, using success rate, artifact
      quality, metric improvement, or expert preference as proxies for discovery capability.
    disagreements:
    - 'Verification substrate differs: physics-aware visual field inspection, machine-checked
      formal proofs, executable reporting constraints, and benchmark-based expert
      judgement.'
    - 'Interaction mode differs: targeted human intervention at high-leverage decision
      points, human review of final formal artifacts, or extended autonomous runs.'
    - 'Scope differs: domain-specific systems for computational fluid dynamics, omics,
      or causal inference coexist with domain-agnostic frameworks intended for many
      disciplines.'
    - 'Evaluation target differs: quantitative improvement on a physical benchmark,
      benchmark success rate and blind score, machine-checked proof artifacts, or
      expert preference in case studies.'
    open_questions:
    - How reliably do verification gates detect silent experimental failures, given
      evidence that a visual gate missed 2 of 16 planted failures?
    - Does formal proof correctness guarantee that a generated theorem faithfully
      captures the intended scientific claim, and can statement audits fully close
      that gap?
    - Can AI scientist benchmarks such as ARC-Bench and BAISBench generalize to diverse
      real-world discovery tasks beyond their construction datasets?
    - What is the optimal human-AI collaboration mode when both full autonomy and
      step-by-step oversight underperform targeted intervention?
    - Do current quality scores and benchmark gains reflect real scientific novelty
      and downstream decision utility, or only proxy task performance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主假设到实验流水线与领域专用验证门控
      解决的问题: 将研究想法转化为可执行实验，并在接受结论前进行有效性检查
      尚未覆盖: 验证门控仍会遗漏静默失败，且依赖领域专用的视觉、形式化或报告假设
    - 路线: 多智能体协作研究编排与结构化辩论、自愈执行
      解决的问题: 协调构思、实验、结果分析与报告，并从执行失败或人类及自动反馈中恢复
      尚未覆盖: 评估多为内部案例或基准对比，最优人类干预设计尚不明确
    - 路线: 真实科学数据上的AI科学家基准与评测
      解决的问题: 通过任务数据集、基线、指标和人类表现参照，使假设和发现主张可比较
      尚未覆盖: 学科覆盖有限，代理任务成功能否转化为真实发现效用仍不确定
    - 路线: 面向可扩展智能体科学的自演化基础框架
      解决的问题: 以通用演化智能体骨架跨学科复用，提升基准表现并跨周期积累知识
      尚未覆盖: 缺少证据表明领域无关自演化在基准之外仍能保持科学有效性
    - 路线: 基于机器验证证明助手的形式化理论生成系统
      解决的问题: 自动化理论假设生成与证明构建，提供形式化正确性保证
      尚未覆盖: 形式证明正确不保证忠实捕获预期科学主张，仍需人工审查
    共识:
    - 自主假设生成必须与执行及某种验证机制结合，才能产生可辩护的科学输出。
    - LLM驱动智能体被用作研究编排者，而不只是想法生成器，覆盖文献构思、代码执行、实验分析和报告。
    - 完全自主流水线可能伪造数字、幻觉引用或错过静默失败，因此需要有效性门控或人类参与。
    - 评测越来越以基准为导向，用成功率、工件质量、指标提升或专家偏好作为发现能力的代理。
    分歧:
    - 验证载体不同：物理感知的流场视觉检查、机器验证的形式证明、可执行报告约束和基于基准的专家判断。
    - 交互模式不同：在高杠杆点进行精准人类干预、由人类审查最终形式化产物，或较长时间的自主运行。
    - 范围不同：面向计算流体动力学、组学或因果推断的领域专用系统，与面向多学科的领域通用框架并存。
    - 评测目标不同：物理基准上的定量改进、基准成功率和盲评分、机器验证证明产物，或案例研究中的专家偏好。
    开放问题:
    - 验证门控检测静默实验失败的可靠性如何；证据显示一个视觉门控遗漏了16个植入失败中的2个。
    - 形式证明正确是否保证生成定理忠实捕获预期科学主张；陈述审计能否完全弥合这一差距。
    - ARC-Bench、BAISBench等AI科学家基准能否泛化到其构建数据集之外的多样真实发现任务。
    - 当完全自主与逐步监督均不如精准干预时，假设驱动研究的最优人机协作模式是什么。
    - 当前质量分数和基准增益是否反映真实科学新颖性和下游决策效用，或仅反映代理任务表现。
