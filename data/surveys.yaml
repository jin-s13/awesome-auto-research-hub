  related_work_outline:
  - 'Mainstream direction: Building autonomous research pipelines that integrate self-correction,
    multi-agent collaboration, and domain-specific verification to automatically generate
    and validate scientific hypotheses.'
  - 'Shared research pattern: Systems follow a ''hypothesis generation – experiment
    execution – failure analysis – self-improvement'' loop, incorporating verification
    gates (physical, formal, or factual) to ensure output reliability.'
  - 'Key differences: Depth of domain-specific integration versus generality of framework,
    type of verification mechanism (visual simulation, formal proof, factual reporting),
    and granularity of human-AI interaction.'
  - 'Trend evolution: 2025 brought benchmarks and surveys identifying challenges;
    2026 saw a surge of systems with self-evolution, failure attribution, and formal
    verification, moving toward more reliable and scalable autonomous research.'
  - 'Open questions: Can generated hypotheses truly extend beyond known knowledge
    frontiers? Do current benchmarks adequately measure scientific discovery quality?
    How to balance domain depth and cross-domain generality?'
  related_work_outline_zh:
  - 主流方向：构建集成自我纠正、多智能体协作和领域特定验证的自主研究流水线，以自动生成和验证科学假设。
  - 研究共性：系统通常遵循“假设生成-实验执行-失败分析-自我改进”循环，并集成验证门控（物理、形式化或事实约束）来保证输出可靠性。
  - 关键差异：领域专用深度与通用框架的侧重、验证机制的类型（视觉仿真、形式化证明、事实报告）、以及人机交互的粒度。
  - 趋势演进：2025年以基准和综述为主，识别挑战；2026年涌现出大量集成自我演化、失败归因和形式化验证的系统，整体向更可靠和可扩展的自主研究推进。
  - 开放问题：生成的假设能否真正超越已知知识前沿？当前基准是否充分衡量科学发现的质量？如何在领域深度和跨领域通用性之间取得平衡？
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific autonomous discovery systems
      what_it_solves: Automatically generating and validating novel hypotheses or
        models within a specific scientific domain (e.g., computational fluid dynamics,
        single-cell biology) by tightly coupling ideation with domain-specific simulators
        or data.
      what_remains_open: Reliability of verification gates (e.g., visual gate missed
        2 of 16 silent failures in AI CFD Scientist), limited cross-domain generalization,
        and the system's ability to produce discoveries beyond incremental improvements.
    - line: General-purpose multi-agent research pipelines
      what_it_solves: Providing a reusable, self-improving workflow for hypothesis
        generation, experiment execution, failure recovery, and reporting across diverse
        research topics, often through structured debate, self-healing execution,
        and human-in-the-loop collaboration.
      what_remains_open: Evaluated mostly on proxy benchmarks rather than real-world
        scientific breakthroughs; fully autonomous paper writing and deep innovation
        remain unsolved; potential for accumulated errors from self-improvement loops.
    - line: Formally-verified theoretical hypothesis generation
      what_it_solves: Automating the proposal and machine-checked proof of theorems
        in theoretical fields (e.g., causal inference) using formal proof assistants,
        ensuring logical correctness of generated artifacts.
      what_remains_open: The semantic gap between formalized theorems and intended
        scientific claims; reliance on human inspection of final artifacts; limited
        applicability to non-formalizable domains; lack of quantitative comparison
        with other approaches.
    - line: Evaluation and benchmarking
      what_it_solves: Providing standardized tasks, datasets, and human baselines
        (e.g., BAISBench with single-cell data and multiple-choice questions) to measure
        the hypothesis generation and discovery capabilities of AI scientists.
      what_remains_open: Coverage of the full scientific discovery pipeline (creativity,
        experimental design); alignment between proxy metrics and real scientific
        impact; generalizability to other domains.
    consensus:
    - Autonomous research systems widely adopt an iterative loop of hypothesis generation,
      experiment execution, verification, and improvement.
    - Verification mechanisms (physical simulation, factual constraints, formal proof)
      are considered essential to prevent hallucinated or incorrect outputs.
    - Human-AI collaboration at high-leverage decision points improves system performance
      over fully autonomous or exhaustive step-by-step oversight.
    - Current systems show progress on proxy tasks but remain far from achieving genuine
      scientific breakthroughs or fully autonomous paper writing.
    disagreements:
    - 'Domain generality vs. domain-specific depth: some frameworks are designed to
      be domain-agnostic, while others tightly couple with domain simulators and data.'
    - 'Verification type: visual-language physics gates, Lean formal proofs, and factual
      reporting constraints represent different definitions of correctness and reliability.'
    - 'Human-AI interaction granularity: approaches range from full autonomy to targeted
      high-leverage interventions or step-by-step human inspection.'
    - 'Evaluation methodology: metrics include domain-specific error (e.g., RMSE),
      general research process benchmarks (ARC-Bench, MLE-Bench), and qualitative
      expert judgment, with no unified standard.'
    open_questions:
    - Can current autonomous research systems produce hypotheses that genuinely transcend
      the training data distribution and represent novel scientific insights?
    - To what extent do existing verification mechanisms guarantee the truth and generalizability
      of scientific claims, especially when verification itself has gaps?
    - How can we design benchmarks that comprehensively assess the quality of scientific
      discovery, including novelty, importance, and reproducibility, beyond proxy
      task completion?
    - When transferring a system across domains, how can we maintain both reliability
      and the depth of domain-specific reasoning required for meaningful discovery?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域专用自主发现系统
      解决的问题: 在特定科学领域（如计算流体力学、单细胞生物学）中，通过将构思与领域专用仿真器或数据紧密耦合，自动生成并验证新假设或模型。
      尚未覆盖: 验证门控的可靠性（如AI CFD Scientist的视觉门控遗漏了16个静默失败中的2个），跨领域泛化能力有限，系统能否产生超越增量改进的发现。
    - 路线: 通用多智能体研究流水线
      解决的问题: 提供可复用、自我改进的工作流，用于跨多种研究主题的假设生成、实验执行、失败恢复和报告，常通过结构化辩论、自愈执行和人机协作实现。
      尚未覆盖: 主要在代理基准上评估，而非真实世界的科学突破；完全自主的论文写作和深层创新仍未解决；自我改进循环可能导致错误累积。
    - 路线: 形式化验证驱动的理论假设生成
      解决的问题: 在理论领域（如因果推断）使用形式化证明助手自动提出定理并进行机器验证证明，确保生成产物的逻辑正确性。
      尚未覆盖: 形式化定理与预期科学主张之间的语义鸿沟；依赖人工审查最终产物；难以应用于非形式化领域；缺乏与其他方法的定量比较。
    - 路线: 评估与基准设计
      解决的问题: 提供标准化任务、数据集和人类基线（如BAISBench的单细胞数据和选择题），以衡量AI科学家的假设生成和发现能力。
      尚未覆盖: 对科学发现全流程（创意、实验设计）的覆盖不足；代理指标与真实科学影响力之间的一致性；对其他领域的普适性。
    共识:
    - 自主研究系统普遍采用“假设生成-实验执行-验证-改进”的迭代循环。
    - 验证机制（物理仿真、事实约束、形式化证明）被认为是防止幻觉和错误输出的关键。
    - 在关键决策点进行人机协作能提升系统性能，优于完全自主或逐步全程监督。
    - 当前系统在代理任务上表现出进展，但距离真正的科学突破和完全自主写作仍有显著差距。
    分歧:
    - 领域通用性与领域专用深度：部分框架追求领域无关，而其他系统则与领域仿真器和数据深度耦合。
    - 验证类型：视觉-语言物理门控、Lean形式化证明和事实报告约束代表了对正确性和可靠性的不同定义。
    - 人机交互粒度：从完全自主、仅在高杠杆点干预到逐步人工审查，各种模式并存。
