    研究路线矩阵:
    - 路线: 端到端自主研究流水线
      解决的问题: 自动化完整的科学循环——基于文献的构思、假设生成、代码级实验和论文撰写——减少研究构思与执行中的人工工作量。
      尚未覆盖: 系统在完全自主的高质量论文写作上仍面临困难；所生成假设的新颖性通常局限于增量改进；在分布外科学任务上的泛化能力未经证实。
    - 路线: 多智能体协作与结构化决策
      解决的问题: 通过引入智能体间的辩论、树形分支和角色分工，模仿团队科学推理，提升研究计划和结果的质量。
      尚未覆盖: 多智能体协调的额外复杂性并未被一致证明优于带强自我批评的单智能体循环；智能体角色的最优粒度仍是一个开放的设计问题。
    - 路线: 自我纠错与失败归因
      解决的问题: 检测并诊断实验失败（如代码错误、无效结果、幻觉数字），并将纠正措施路由到适当阶段，提高自主研究的可靠性。
      尚未覆盖: 当前的失败检测并非穷尽（例如，在物理仿真中漏检静默失败），且可能无法泛化到验证器训练分布之外的新失败模式。
    - 路线: 基准测试与评估设计
      解决的问题: 提供标准化任务（细胞注释、基于已发表研究的选择题、实验阶段基准）和比较基线（人类专家、先前的AI科学家）以衡量进展。
      尚未覆盖: 现有基准在领域覆盖范围上较窄，且代理指标（如盲评人类偏好分数）尚未对照长期科学影响力或真实世界发现效用进行验证。
    - 路线: 领域无关与自我演化框架
      解决的问题: 通过可复用的智能体架构，快速为任意学科构建AI科学家，这些架构在实验周期中积累知识并优化假设，从而扩大适用性。
      尚未覆盖: 领域无关性声明仅在有限的基准集上得到测试；跨不同科学领域进行真正知识迁移而不会带来灾难性遗忘或负迁移的能力尚无证据。
    共识:
    - 作为智能体的大语言模型是自主研究系统中假设生成、实验规划和代码合成的默认骨干。
    - 某种形式的验证或自我批评（如物理感知门控、报告事实约束、多假设失败分析）对于防止伪造结果和静默失败是必要的。
    - 结构化工作流——无论是通过多智能体辩论、树搜索还是进化循环——提供了比平面单次生成更可检查、更可控的研究轨迹。
    - 人类评估（专家评审或生物信息学家基线）仍然是衡量输出质量的主要方式，尽管标准化基准已开始出现。
    - 当前系统在代码级实验和参数调优上比在生成范式转换的科学假设上更有效。
    分歧:
    - 最优人类参与度：一些系统主张全自主，仅在高风险决策时进行精准的人工干预（AutoResearchClaw），而其他系统则提供仪表板用于持续监控和回滚（Claw
      AI Lab），或从一开始就依赖人类定义的任务（BAISBench）。
    - 错误处理粒度：检查视觉输出的视觉-语言验证门控（AI CFD Scientist）与追踪错误到假设、设计或实现层面的因果多假设失败归因（SAGE）相比，后者在失败时进行转向和优化的自愈执行器（AutoResearchClaw）。
    - 通用性与深度：领域无关框架（EvoMaster）声称具有跨学科的广泛适用性，而专用系统（AI CFD Scientist，BAISBench）则融入了领域特定验证，从而在其细分领域内产生更可辩护的主张。
    - 评估目标：一些工作报告量化基准分数（EvoMaster，AutoResearchClaw），另一些则强调定性专家判断（Claw AI Lab），还有一个提供了研究生水平的人类表现基线（BAISBench），这使得跨系统比较变得困难。
    开放问题:
    - 什么构成真正新颖的科学贡献，以及我们如何对AI科学家在增量指标改进之外的生成新颖性进行基准测试？
    - 如何使失败检测和纠正机制对先前未见过的错误类型具有鲁棒性，尤其是在安全关键的科学领域？
    - 结构化多智能体辩论和树搜索在多大程度上能泛化到所报告实验中使用的特定LLM骨干和提示配置之外？
    - 跨周期积累知识的自我演化机制是否会导致对问题类别或数据集的过拟合，以及如何在开放式发现环境中检测到这一点？
    - 鉴于许多高排名论文缺乏完整的工件发布，AI科学家系统的最低可复现性要求（代码、数据、环境）是什么？
