  related_work_outline_zh:
  - 主流方向：端到端自主研究代理，整合想法生成、实验执行、验证与论文写作；写作被视为结果声明后的产物，而非孤立文本生成。
  - 研究共性：多数系统将LLM组织为多阶段或多代理流程，包含代码执行、自动评审和写作前的某种结果核查。
  - 关键差异：自主程度、人机协作方式、验证信号、领域依据、搜索结构及评测目标不同。
  - 趋势演进：从2024年通用自主发现框架演进到2025-2026年领域特定和自我纠正代理，验证、失败归因和选择性人类监督更强；证据集中在当前前沿。
  - 开放问题：LLM评审与人类同行评审的一致性、小样本之外的可靠性、最优人类干预及验证泛化性仍不确定。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous manuscript generation
      what_it_solves: Produces full research artifacts from idea to paper by coupling
        writing with code execution, experiments, and visualization.
      what_remains_open: Consistency across topics and beyond a few successful runs;
        conference-ready quality remains rare in the available evidence.
    - line: Verification and grounded claim reporting
      what_it_solves: Reduces fabricated numbers, hallucinated citations, and silent
        experimental failures before they enter manuscript prose.
      what_remains_open: Generalization beyond visual or domain-specific checks is
        unclear; reported gate performance still includes missed failures.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Embeds human judgment at high-leverage decision points instead
        of requiring full autonomy or exhaustive step-by-step oversight.
      what_remains_open: Optimal intervention granularity and generalizable cost-quality
        trade-offs are only sparsely evaluated.
    - line: Automated review and rubric-based evaluation
      what_it_solves: Provides fast manuscript assessment and quality scoring for
        iterative research-writing loops without relying solely on human reviewers.
      what_remains_open: Alignment with human peer review and robustness against LLM-judge
        bias or overclaiming remain uncertain.
    - line: Domain-embedded scientific writing assistants
      what_it_solves: Grounds manuscript generation in domain tools, retrieval, theory,
        or simulation so claims are more closely tied to field-specific evidence.
      what_remains_open: Transfer across domains and dependence on external solvers,
        knowledge retrieval, or simulators are not systematically characterized.
    - line: Failure-mode analysis and design principles
      what_it_solves: Converts broken autonomous-research runs into reusable diagnostics
        and design guidance for more robust systems.
      what_remains_open: Findings come from small case counts and have not been shown
        to predict success in different agent stacks or domains.
    consensus:
    - Generated manuscripts are embedded in a full research-execution loop rather
      than drafted from static prompts.
    - Some verification or review step is necessary before results enter prose; otherwise
      fabricated numbers and silent failures can pass through.
    - Human expertise still improves quality, but can be deployed selectively rather
      than at every step.
    - Automated reviewers and LLM rubrics enable low-cost iterative evaluation, but
      peer-review or workshop acceptance remains difficult and inconsistent.
    disagreements:
    - Autonomy philosophy ranges from fully automated research agents to principal
      investigator and graduate-student human-agent collaboration.
    - 'Verification signals differ: domain-specific visual physics inspection, internal
      logical auditing, measured-value grounding, or source-grounded citation reporting.'
    - 'Evaluation targets differ: workshop or peer acceptance, task-benchmark blind
      scores, domain-specific physical error, or LLM rubric scores.'
    - Control structure varies from linear multi-agent pipelines and debate to progressive
      tree search with self-healing execution.
    - Domain scope ranges from general machine learning to applied mathematics and
      computational fluid dynamics, changing available grounding and failure observability.
    open_questions:
    - Are LLM-based reviewers and rubrics aligned enough with human peer review to
      certify novel claims, given only near-human scoring and limited acceptance evidence?
    - Can verification gates generalize beyond visually or physically inspectable
      outputs, and what is their missed-failure rate in other domains?
    - Which human intervention mode most improves research quality, and does the reported
      high-leverage collaboration result transfer beyond the evaluated benchmark setting?
    - Why do end-to-end runs remain inconsistent, with only some attempts passing
      peer review or completing the pipeline, and which failure modes predict success?
    - Do missing code, datasets, or artifacts for several systems conceal reproducibility
      gaps that affect the reported writing and research quality?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主论文生成
      解决的问题: 从想法到论文生成完整研究工件，将写作与代码执行、实验和可视化耦合。
      尚未覆盖: 跨主题一致性以及少量成功案例之外的可靠性仍不确定；会议就绪质量在现有证据中仍稀缺。
    - 路线: 验证与依托证据的结果报告
      解决的问题: 减少伪造数字、幻觉引用和实验静默失败在进入手稿前未被发现的问题。
      尚未覆盖: 在视觉或领域特定检查之外的可泛化性不明确；已有门控表现仍存在漏检。
    - 路线: 人机协作与干预设计
      解决的问题: 在高杠杆决策节点嵌入人类判断，而非完全自主或逐步监督。
      尚未覆盖: 最优干预粒度和可泛化的成本-质量权衡仅有少量评估。
    - 路线: 自动评审与基于评分标准的评测
      解决的问题: 为迭代研究与写作循环提供快速稿件评估和质量评分。
      尚未覆盖: 与人类同行评审的一致性，以及对LLM评审偏差或过度主张的稳健性仍不明确。
    - 路线: 领域嵌入式科学写作助手
      解决的问题: 将论文生成与领域工具、检索、理论或仿真结合，使论点更贴近领域证据。
      尚未覆盖: 跨领域迁移和对外部求解器、知识检索或仿真器的依赖未被系统刻画。
    - 路线: 失败模式分析与设计原则
      解决的问题: 将失败的自主研究运行转化为可复用诊断和更稳健系统的设计指导。
      尚未覆盖: 结论来自少量案例，尚未证明能预测不同代理栈或领域中的成功。
    共识:
    - 生成论文通常嵌入完整研究执行循环，而不是从静态提示孤立起草。
    - 结果进入正文前通常需要某种验证或评审步骤，否则伪造数字和静默失败可能混入。
    - 人类专家仍能提高质量，但可选择性地部署而非逐步监督。
    - 自动评审和LLM评分适合低成本迭代，但工作坊或同行接收仍困难且不一致。
    分歧:
    - 自主理念从全自动研究代理到首席研究员与研究生式人机协作不等。
    - 验证信号不同：领域视觉物理检查、内部逻辑审计、实测值约束或来源约束引用报告。
    - 评测目标不同：工作坊或同行接收、任务基准盲评、领域特定物理误差或LLM评分。
    - 控制结构从线性多代理流水线和辩论到渐进式树搜索与自愈执行不等。
    - 领域范围覆盖通用机器学习、应用数学与计算流体动力学，可用证据和失败可观测性不同。
    开放问题:
    - LLM评审和评分是否与人类同行评审足够一致，目前仅有近似人类评分和有限接收证据。
    - 验证机制能否泛化到视觉或物理可检查输出之外的领域，其漏检率如何？
    - 哪种人类干预模式最能改善研究质量，已有高杠杆协作结果能否迁移到新的任务设置？
    - 为何端到端运行仍不一致，例如部分手稿通过评审或部分运行完成流水线，哪些失败模式能预测成功？
    - 若干系统缺少代码、数据集或工件，是否隐藏了影响所报告写作和研究质量的可复现性缺口？
