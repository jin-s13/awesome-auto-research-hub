  related_work_outline_zh:
  - 主流方向：从单次文献检索/综述生成转向由 LLM 编排的智能体和多智能体工作流，强调证据获取、引用质量与可读性。
  - 研究共性：将文献综述拆解为规划、检索、证据提取、写作、编辑和审阅，并以 Citation F1、专家一致性、写作质量等指标评测。
