  - 'Mainstream direction: Long-horizon autonomous research agents are evaluated by
    final downstream task improvement, resource efficiency, and held-out or sealed
    generalization rather than single benchmark accuracy alone.'
  - 'Shared research pattern: Works externalize durable research state, experience,
    or operational knowledge into harnesses, libraries, or skills, then evaluate under
    explicit budgets and high-fidelity or sealed feedback.'
  - 'Key differences: Evaluation targets and feedback signals vary from code/ML benchmark
    suites, materials endpoints, and molecular optimizer force calls to evaluator-design
    tasks; state representations include harness-owned state, experience libraries,
    and repository-derived skills.'
  - 'Trend evolution: The 2024-2026 evidence is current-frontier and moves from one-off
    benchmark scores toward resource-aware long-horizon search, held-out transfer,
    and recursive evaluation alignment; reproducibility evidence remains weak.'
  - 'Open questions: Whether development gains predict sealed/hold-out outcomes, how
    much benefit comes from orchestration versus backbones/task priors, and how to
    compare resource metrics and close missing code or limitation evidence.'
