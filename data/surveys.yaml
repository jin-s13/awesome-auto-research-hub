  literature_review:
    line_of_work_matrix:
    - line: Automated discovery-environment benchmarking
      what_it_solves: Making autonomous discovery agents comparable through standardized
        tasks, completion metrics, and explanatory-knowledge checks.
      what_remains_open: Simulated environments may not capture real-world evidence
        constraints; the relation between task scores and real discovery utility is
        not established.
    - line: Blind evidence-grounded evaluation
      what_it_solves: Testing whether agents can derive claims from frozen real data
        without hidden target conclusions, by scoring evidential maturity across auditability,
        novelty, controls, robustness, falsifiability, and generalization.
      what_remains_open: Current evidence comes from a single frozen base model and
        limited domains; LLM-judge validity and metric-to-decision alignment remain
        verification gaps.
    - line: Reliability-gated autonomous research infrastructure
      what_it_solves: Embedding verification gates or deterministic authority to catch
        silent failures, control source-edit boundaries, and promote only evaluated
        results.
      what_remains_open: Gates still miss failure modes; validation is limited to
        few domains or cases and lacks cross-hardware, cross-user, and external standardized
        validation.
    - line: End-to-end autonomous paper generation and review
      what_it_solves: Integrating idea generation, code execution, experimentation,
        writing, and simulated peer review into low-cost research cycles.
      what_remains_open: Peer review success is inconsistent and workshop-level; acceptance
        does not yet equate to scientific reliability or reproducible value.
    consensus:
    - Current systems commonly combine hypothesis generation, code or experiment execution,
      and artifact writing, while evaluation increasingly targets evidence quality
      and reliability rather than only final performance.
    - In both simulated and real-data benchmarks, agents remain limited in controls,
      robustness, falsifiability, and cross-domain generalization.
    - Explicit verification or authority mechanisms are treated as necessary to prevent
      silent failures and invalid modifications in autonomous research.
    - Evaluation is shifting toward blind or hidden-target settings to avoid rewarding
      reproduction of known conclusions and to measure claim-evidence alignment.
    disagreements:
    - 'Evaluation target differs: simulated task completion and explanatory actions
      versus evidence maturity on real frozen tasks versus domain-specific predictive
      improvement or peer-review acceptance.'
    - 'Reliability mechanism differs: post-hoc artifact or visual verification versus
      pre-execution source-edit authority separation versus automated review feedback
      loops.'
    - 'Grounding source differs: physics-aware checks, peer-reviewed study-derived
      questions, dataset diagnostics, or simulated review scores.'
    - 'Success criteria differ: implementation success and cost, statistically reliable
      separation among agents, gate detection rate, workshop acceptance, or accuracy
      relative to human baselines.'
    open_questions:
    - Are automated LLM judges or simulated reviewers valid proxies for human scientific
      evaluation across domains?
    - Can reliability gates be strengthened to catch remaining silent failures and
      missing controls, robustness, falsifiability, and generalization in agent-generated
      claims?
    - How do current findings generalize beyond one frozen base model, narrow domains,
      and small case sets?
    - Which evaluation criteria best predict real decision utility rather than proxy
      task scores or formal peer-review acceptance?
    - How should autonomous research systems promote studies when current agents show
      no statistically reliable separation on evidence maturity?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动化发现环境基准
      解决的问题: 通过标准化任务、完成度指标和解释性知识检查，使自主发现智能体可比较。
      尚未覆盖: 模拟环境可能无法捕捉真实证据约束，任务分数与真实发现效用之间的关系尚未确立。
    - 路线: 盲测证据锚定评估
      解决的问题: 在冻结真实数据上测试智能体能否从数据得出主张，并沿可审计性、新颖性、对照、稳健性、可证伪性和泛化进行评分。
      尚未覆盖: 现有证据来自单一冻结基座模型和有限领域；LLM 裁判有效性及指标到决策效用的对应仍是验证缺口。
    - 路线: 可靠性门控自主研究基础设施
      解决的问题: 嵌入验证门控或确定性权威，捕获静默失败、控制源码修改边界，并仅晋升经评估的结果。
      尚未覆盖: 门控仍会漏检失败；验证限于少数案例或领域，缺乏跨硬件、跨用户和外部标准化验证。
    - 路线: 端到端自动论文生成与评审
      解决的问题: 整合想法生成、代码执行、实验、写作和模拟同行评审，形成低成本研究闭环。
      尚未覆盖: 同行评审成功不一致且仅工作坊级；接受不等同于科学可靠性或可复现价值。
    共识:
    - 当前系统普遍组合假设生成、代码或实验执行和论文写作，但评测逐步转向证据质量与可靠性，而非只看最终性能。
    - 在模拟和真实数据基准中，智能体在对照、稳健性、可证伪性和跨领域泛化方面仍然不足。
    - 显式验证或权威机制被视为防止自主研究中静默失败和无效修改的必需组件。
    - 评测正共同转向盲测或隐藏目标，以避免奖励已知结论复现，并度量主张与证据的对齐。
    分歧:
    - 评测目标不一致：模拟任务完成和解释性动作、真实冻结任务的证据成熟度、领域预测改进或同行评审接受。
    - 可靠性机制不一致：事后工件或视觉验证、执行前源码修改权威分离，以及自动评审反馈循环。
