      尚未覆盖: 自动化代理指标尚未与独立复现、真实发现效用或跨多个冻结基座模型的性能建立关联。
    - 路线: 带可靠性门控的自主研究系统
      解决的问题: 在开放式LLM假设生成和编码周围加入执行边界、确定性晋升决策或物理/视觉验证，以减少静默失败并提高实现成功率。
      尚未覆盖: 验证门控仍具有领域和任务特异性，且可能漏掉植入失败；公开证据仅限工作坊或三个案例评估，泛化性不明确。
    - 路线: 生成研究产物的自动评审与评估
      解决的问题: 使用LLM或VLM评审器对生成的论文、图表或证据工件打分，为自动化研究提供可扩展反馈和接近接受阈值的判断。
      尚未覆盖: 评审器对齐、奖励利用和跨模型一致性尚未建立；可见证据中缺少人类治理或安全判断。
    - 路线: 领域特定的AI科学家部署与评估
      解决的问题: 将自主研究循环适配至计算流体、时间序列预测或单细胞组学等领域，报告任务特定性能和基线对比。
      尚未覆盖: 性能提升有多少来自研究智能体系统，而不是任务特定基线、诊断或领域结构，尚未分离；跨领域可靠性仍未知。
    共识:
    - 近期工作一致认为，自主研究智能体能够熟练执行、记录并部分验证分析，但其生成的主张仍缺乏对照、稳健性、可证伪性和跨数据集泛化。
    - 评测正从任务完成度转向证据成熟度、可审计性和可复现性，冻结数据、确定性评分和代码执行成为共享基础设施。
    - 可靠性正在被视为系统级属性：开放式LLM行为需要外部验证、确定性边界或自动评审，而不能仅信任生成输出。
    分歧:
    - 评测设置不同：虚拟发现环境对任务完成度和发现知识评分，而盲测基准仅给出中立目标和冻结数据，并由固定LLM裁判对证据成熟度评分。
    - 验证策略不同：一些系统在研究中嵌入领域特定物理感知视觉检查或确定性权威，另一些系统在论文生成后依赖模拟AI评审。
    - 监督目标不同：一条路线评估完整发现循环，另一条路线评估更窄的架构演化或注释加问答任务，因此报告的成果无法直接比较。
    开放问题:
    - 证据成熟度评分是否能预测AI生成发现能否通过独立复现、人类同行评审或真实部署？
    - 当主要结果仅来自一个冻结基座模型或有限领域案例且缺乏外部验证时，现有基准能否得出稳健的智能体排名？
    - 若领域特定可靠性门控仍会漏掉植入的静默失败，什么验证覆盖率才算充分？
    - 在这些自主系统的治理中，除基准性能和产物质量外，显式安全、监督或升级策略在哪里得到评估？
