  related_work_outline:
  - 'Mainstream direction: Building end-to-end autonomous research pipelines that
    integrate hypothesis generation, experiment execution, self-correction, and report
    writing around LLM-based multi-agent architectures.'
  - 'Shared research pattern: All systems rely on a central LLM reasoning core, decompose
    the research cycle into modular agent roles or stages, and incorporate some form
    of verification or error handling to mitigate hallucination and silent failures.'
  - 'Key differences: Verification strategies range from vision-based physics checks
    and formal Lean proofs to verifiable report generation; interaction modes span
    fully autonomous operation to multi-level human-in-the-loop collaboration; some
    systems are domain-specific (CFD, causal inference) while others claim domain-agnostic
    generality.'
  - 'Trend evolution: The frontier moved from component-level automation (e.g., literature
    mining) to complete research cycles, then to self-improving loops with failure
    attribution and knowledge accumulation, and most recently toward formally grounded
    and continuously evolving frameworks.'
  - 'Open questions: Can verification gates guarantee scientifically meaningful results
    beyond formal correctness? How can we evaluate true discovery rather than task
    completion? What mechanisms enable safe, aligned, and long-horizon autonomous
    research without degradation?'
  related_work_outline_zh:
  - 主流方向：构建以LLM为核心的多智能体端到端自主研究流程，覆盖假设生成、实验执行、自我纠正和报告撰写。
  - 研究共性：系统均依赖LLM推理核心，将研究周期分解为模块化智能体角色或阶段，并引入某种验证或错误处理机制以抑制幻觉和静默失败。
  - 关键差异：验证策略从基于视觉的物理检查、形式化Lean证明到可验证报告生成；交互模式从完全自主到多级人机协作；有的系统专注于特定领域（CFD、因果推断），有的则声称领域无关。
  - 趋势演进：前沿从组件级自动化（如文献挖掘）发展到完整研究循环，再演进到具备失败归因和知识积累的自我改进循环，最近走向形式化基础和持续演化框架。
  - 开放问题：验证门控能否保证超越形式正确性的科学意义？如何评估真正的发现而非任务完成？何种机制能使长期自主研究安全、对齐且不退化？
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automates the full research cycle from hypothesis proposal and
        experiment design to execution, self-correction, and write-up, reducing human
        effort per experiment.
      what_remains_open: Reliability on open-ended, high-stakes problems; the ability
        to produce defensible scientific claims with minimal human oversight; coverage
        of silent failures that escape the pipeline's verification gates.
    - line: Domain-specific and formally grounded systems
      what_it_solves: Provides deep integration of domain knowledge or formal verification
        (e.g., physics simulations, Lean proofs) to ensure local correctness and physical
        or logical validity of generated hypotheses.
      what_remains_open: Bridging the gap between formal/machine-verified correctness
        and scientific meaning; generalizing the approach beyond the tightly scoped
        domain without losing verification strength.
    - line: Self-improvement and knowledge accumulation mechanisms
      what_it_solves: Enables systems to recover from experimental failures, attribute
        root causes, and carry forward knowledge across runs, reducing repeated mistakes
        and improving idea quality over time.
      what_remains_open: Long-term stability of self-improvement loops; avoiding catastrophic
        forgetting or degeneration; open-ended exploration without getting trapped
        in local optima.
    - line: Evaluation benchmarks and human baselines for AI scientists
      what_it_solves: Creates standardized tasks and human performance references
        to measure the capability of AI research agents in hypothesis generation,
        annotation, and discovery tasks.
      what_remains_open: Whether current proxy tasks and metrics correlate with genuine
        scientific discovery or long-term research impact; coverage of diverse scientific
        disciplines and real-world lab constraints.
    consensus:
    - Large language models serve as the core reasoning engine for proposing hypotheses
      and designing experiments.
    - Multi-agent or multi-stage architectures are used to decompose the research
      workflow into manageable sub-tasks with specialized roles.
    - Verification and error handling are essential; all systems implement some form
      of checking (execution feedback, visual inspection, formal proof, or output
      constraints) to combat hallucination and silent failures.
    - Full autonomy is not yet attainable; human oversight, either at key decision
      points or through final artifact review, remains necessary for quality and safety.
    - Code execution environments and reproducible artifacts are critical for validating
      proposed ideas and enabling self-correction loops.
    disagreements:
    - 'Verification strategy: systems differ in whether they rely on vision-language
      physics checks, machine-checked formal proofs, or generated verifiable reports,
      leading to different failure modes and domain suitability.'
    - 'Human-AI interaction mode: approaches range from fully autonomous operation
      with no human intervention to fine-grained, multi-mode human-in-the-loop collaboration
      where humans inject knowledge at selected decision points.'
    - 'Domain scope: some systems are tightly coupled to a single scientific discipline
      (e.g., computational fluid dynamics, causal inference) with tailored domain
      knowledge, while others claim to be domain-agnostic and evaluated across multiple
      fields.'
    - 'Self-improvement mechanism: methods include multi-hypothesis failure attribution,
      continuous self-evolution with knowledge accumulation, and cross-run memory,
      each with different assumptions about how failures map to corrections.'
    open_questions:
    - How can verification mechanisms be designed to catch silent failures that are
      not visible to execution logs or simple validity checks, such as physically
      plausible but incorrect results?
    - What evaluation protocols can distinguish between a system that merely completes
      experimental tasks and one that produces genuinely novel, meaningful scientific
      hypotheses?
    - Can self-improvement loops maintain research quality over many cycles, or do
      they drift toward degenerate, easily verifiable but low-impact ideas?
    - How can domain-specific knowledge and formal safety constraints be integrated
      into domain-agnostic frameworks without sacrificing the flexibility that makes
      them general?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究流程
      解决的问题: 自动化从假设提出、实验设计到执行、自我纠正和撰写的完整研究循环，减少每次实验所需的人力。
      尚未覆盖: 在开放高风险问题上的可靠性；在最少人工监督下产生可辩护科学主张的能力；对流程验证门控遗漏的静默失败的覆盖。
    - 路线: 领域特定与形式化基础系统
      解决的问题: 深度整合领域知识或形式化验证（如物理仿真、Lean证明），确保生成假设的局部正确性以及物理或逻辑有效性。
      尚未覆盖: 弥合形式化/机器验证正确性与科学意义之间的差距；在不过度丢失验证强度的情况下，将方法泛化到严格范围之外的领域。
    - 路线: 自我改进与知识积累机制
      解决的问题: 使系统能从实验失败中恢复，归因根因，并在多次运行间传递知识，减少重复错误，逐步提升想法质量。
      尚未覆盖: 自我改进循环的长期稳定性；避免灾难性遗忘或退化；在开放式探索中避免陷入局部最优。
    - 路线: AI科学家的评估基准与人类基线
      解决的问题: 建立标准化任务和人类表现参考，以衡量AI研究智能体在假设生成、注释和发现任务中的能力。
      尚未覆盖: 当前代理任务和指标是否与真实的科学发现或长期研究影响力相关；对多样科学学科和真实实验室约束的覆盖。
    共识:
    - 大语言模型作为提出假设和设计实验的核心推理引擎。
    - 采用多智能体或多阶段架构，将研究工作流分解为具有专门角色的可管理子任务。
    - 验证和错误处理必不可少；所有系统都实施某种形式的检查（执行反馈、视觉检查、形式证明或输出约束）以对抗幻觉和静默失败。
    - 完全自主尚未实现；在关键决策点或最终产物审查中，人类监督对质量和安全仍必不可少。
    - 代码执行环境和可复现工件对于验证提出的想法和实现自我纠正循环至关重要。
    分歧:
