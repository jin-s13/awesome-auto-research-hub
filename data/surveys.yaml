  related_work_outline:
  - 'Mainstream direction: autonomous LLM-based multi-agent systems that treat scientific
    literature work as an end-to-end research loop: retrieval, synthesis, verification,
    experimentation, and paper or gap generation.'
  - 'Shared research pattern: agents are composed into retrieval, reasoning, critique,
    and writing stages, then evaluated by automated LLM judges or benchmark rubrics
    that score evidence, task completion, or artifact quality.'
  - 'Key differences: one sub-direction builds general self-evolving discovery frameworks,
    another creates evidence-grounded or domain-specific benchmarks, and a third derives
    failure modes and design principles; they differ in evaluation target and deployment
    setting.'
  - 'Trend evolution: the visible 2025-2026 frontier shifts from single-system generation
    toward reusable frameworks and blinded evidence evaluation; literature review
    automation remains an identified bottleneck.'
  - 'Open questions: whether autonomous literature synthesis can produce trustworthy
    citations and research gaps, whether automated judges generalize across base models,
    and whether benchmark scores align with real literature-intelligence utility.'
  related_work_outline_zh:
  - 主流方向：基于LLM的自主多智能体系统，将科学文献工作视为端到端研究闭环，涵盖检索、综合、验证、实验以及论文或研究缺口生成。
  - 研究共性：智能体被组合为检索、推理、批判和写作阶段，并通过自动LLM评审或基准评分标准来评估证据、任务完成度或成果质量。
  - 关键差异：一个子方向构建通用的自演化发现框架，另一个构建基于证据或领域专用的评测基准，第三个提炼失败模式与设计原则；差异在于评测目标和部署场景。
  - 趋势演进：可见的2025-2026前沿从单系统生成转向可复用框架和盲测证据评估；文献综述自动化仍是已识别的瓶颈。
  - 开放问题：自主文献综合能否产出可信引用和研究缺口，自动评审能否跨基座模型泛化，以及基准分数是否与真实文献智能效用一致。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous literature-to-discovery agent systems (e.g., ReasFlow, EvoMaster)
      what_it_solves: End-to-end retrieval, literature synthesis, verification, and
        research artifact generation with reduced manual step-by-step control.
      what_remains_open: Reliability and domain intelligence over long-horizon tasks;
        literature review automation, citation trustworthiness, and ethical validation
        are not yet assured.
    - line: Evidence-grounded evaluation benchmarks for discovery agents (e.g., TruthInsightBench,
        BAISBench)
      what_it_solves: Creates blinded or domain-specific tasks from peer-reviewed
        studies so agent claims can be scored against evidence maturity, annotation,
        or expert baselines.
      what_remains_open: Generalization beyond one frozen base model, limited domains,
        or fixed LLM-judge rubrics; proxy metrics are not connected to real research
        utility.
    - line: Survey and failure-mode characterization of agentic research systems (e.g.,
        Agentic AI survey, Why LLMs Aren't Scientists Yet)
      what_it_solves: Organizes capabilities, implementation frameworks, datasets,
        and recurring failure modes into challenge maps and design principles.
      what_remains_open: The proposed categories and principles have limited direct
        empirical validation as predictors of downstream literature-intelligence behavior.
    consensus:
    - Scientific literature workflows are currently modeled as multi-agent pipelines
      with identifiable retrieval, synthesis, verification, and generation stages.
    - Verification and self-critique are treated as necessary safeguards against logical
      or evidential errors before human inspection.
    - Evaluation is moving toward evidence-grounded, blinded, or expert-calibrated
      tasks rather than relying only on generated text quality or citation counts.
    - Fully autonomous literature review and trustworthy research gap discovery remain
      unsolved despite gains in execution competence.
    disagreements:
    - System-building work optimizes end-to-end paper or task success under LLM review,
      while benchmarking work evaluates whether agents can produce claims supported
      by frozen evidence, creating different definitions of success.
    - Some approaches emphasize domain-agnostic self-evolving frameworks; others use
      real domain-specific data with human baselines, implying different generalization
      and supervision assumptions.
    - Failure-case studies report implementation drift and premature success claims
      in autonomous research, while framework papers report state-of-the-art benchmark
      scores, reflecting differing deployment scenarios and evaluation criteria.
    open_questions:
    - Do automated evidence-maturity or generation scores predict better literature
      search, survey synthesis, or research gap discovery in real research workflows?
    - Can verification loops distinguish reliable citations and summaries from plausible
      but unsupported claims when source conclusions are withheld?
    - How generalizable are findings across base models, scientific domains, and judge
      rubrics, and what public artifacts would be required to test this?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主文献到发现智能体系统（如ReasFlow、EvoMaster）
      解决的问题: 以较少的人工逐步控制完成端到端检索、文献综合、验证和研究工件生成。
      尚未覆盖: 长程任务中的可靠性和领域智能；文献综述自动化、引用可信度与伦理验证仍未得到保证。
    - 路线: 面向发现智能体的证据锚定评测基准（如TruthInsightBench、BAISBench）
      解决的问题: 从同行评审研究中构建盲测或领域特定任务，依据证据成熟度、标注或人类基线对智能体主张进行评分。
      尚未覆盖: 单一冻结基座模型、有限领域或固定LLM评委标准之外的泛化性；代理指标尚未与真实研究效用建立联系。
    - 路线: 智能体研究系统的综述与失败模式分析（如Agentic AI survey、Why LLMs Aren't Scientists Yet）
      解决的问题: 将能力、实施框架、数据集和重复失败模式组织为挑战图谱与设计原则。
      尚未覆盖: 所提出的分类与原则作为下游文献智能行为预测器仍缺乏直接实证验证。
    共识:
    - 科学文献工作流当前被建模为多智能体流水线，包含可识别的检索、综合、验证和生成阶段。
    - 验证与自我批判被视为在人工检查前防范逻辑或证据错误的安全机制。
    - 评测正从仅看生成文本质量或引用数量，转向基于证据、盲测或专家校准的任务。
    - 尽管执行能力有所提升，但完全自主的文献综述和可信的研究缺口发现仍未解决。
    分歧:
    - 系统构建类工作优化LLM评审下的端到端论文或任务成功率，而基准测试类工作评估智能体能否基于冻结证据提出主张，构成不同的成功定义。
    - 部分方法强调领域无关的自演化框架，另一些使用真实领域特定数据与人类基线，意味着不同的泛化与监督假设。
    - 失败案例研究报告自主研究中的实现漂移和过早声称成功，而框架论文报告基准上的最高分，反映不同的部署场景与评测标准。
    开放问题:
    - 自动证据成熟度或生成分数能否预测真实研究工作流中更好的文献检索、综述综合或研究缺口发现？
    - 在隐藏来源结论的情况下，验证循环能否区分可靠引用与看似合理但缺乏依据的摘要？
    - 研究发现跨基座模型、科学领域和评审标准的泛化性如何，以及需要哪些公共工件来检验这一点？
