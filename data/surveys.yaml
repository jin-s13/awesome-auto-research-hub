  literature_review:
    line_of_work_matrix:
    - line: End-to-end automated discovery agents
      what_it_solves: Transforms idea generation, code writing, experiment execution,
        visualization, and manuscript writing into an LLM-driven loop that produces
        complete research outputs.
      what_remains_open: Output consistency is unproven; only one of three submitted
        manuscripts passed peer review in the available evidence, and some works lack
        explicit limitation details.
    - line: Domain-specific verification-gated discovery
      what_it_solves: Adds physics-aware or expert-informed validity checks to autonomous
        workflows so invalid intermediate results are detected before acceptance or
        writing.
      what_remains_open: Verification gates can still miss silent failures and have
        only been demonstrated in narrow domain or case-study settings.
    - line: Virtual and domain benchmark environments
      what_it_solves: Provides tasks, datasets, metrics, and human baselines for comparing
        discovery agents on full discovery cycles rather than isolated model outputs.
      what_remains_open: Task coverage may not represent diverse scientific discovery,
        and automatic metrics may not align with real decision utility.
    - line: Evidence-grounded evaluation rubrics
      what_it_solves: Scores whether agent-generated claims are supported by evidence
        along dimensions such as controls, robustness, falsifiability, and auditability.
      what_remains_open: Evaluated agents plateau with missing discriminative acts;
        validation depends on one frozen base model and a fixed LLM judge, leaving
        generalizability unresolved.
    - line: Interactive multi-agent research infrastructure
      what_it_solves: Provides customizable roles, real-time monitoring, artifact
        inspection, rollback/resume, and code harnesses for human oversight of automated
        research teams.
      what_remains_open: Evaluation is limited to few internal case studies and preference
        judgments, so external validity and governance maturity remain unclear.
    consensus:
    - Automated research systems should separate generation from verification because
      a second review or validity layer can catch failures that execution alone misses.
    - Benchmarks are shifting from static task success toward evidence quality, including
      task completion, source-grounded reasoning, auditability, and human baselines.
    - Current systems can execute and document analyses, but they are not yet reliable
      autonomous discoverers and lack controls, robustness, falsifiability, and stable
      peer-review performance.
    - Code, data, and open artifacts are treated as important infrastructure for comparing
      agents, but reproducibility signals do not replace judgment about claim quality.
    disagreements:
    - 'Verification mechanism differs: domain-specific physics or vision gates, LLM
      rubric judges, peer review, and expert preference comparisons each define validity
      differently.'
    - 'Evaluation target differs: complete paper acceptance, task completion in a
      virtual or domain environment, claim-level evidentiary maturity, or expert-rated
      novelty and completeness.'
    - 'Supervision signal differs: some evaluations use human baselines and hidden
      conclusions from published studies, while others rely on AI expert judges or
      simulated review.'
    - 'Deployment setting differs: some systems pursue fully autonomous end-to-end
      operation, while others emphasize human-in-the-loop monitoring, rollback, and
      role management.'
    open_questions:
    - Can automatic metrics and LLM judges detect missing controls, robustness, falsifiability,
      and cross-dataset generalization as reliably as domain experts?
    - How well do verification gates tested in computational fluid dynamics or single-cell
      transcriptomics transfer to other scientific domains?
    - What review standard is sufficient for AI-generated research when only one of
      several submissions passed peer review and limitations were sometimes absent?
    - Do interactive monitoring and rollback interfaces improve governance outcomes,
      or are they only supported by narrow case-study preferences?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现智能体
      解决的问题: 将想法生成、代码编写、实验执行、可视化和论文写作组织为LLM驱动的完整研究循环。
      尚未覆盖: 输出一致性不足；现有证据中多份提交仅一份通过同行评审，部分工作缺少明确局限性说明。
    - 路线: 领域验证门控发现
      解决的问题: 在自主工作流中加入物理感知或专家知识检查，以便在结果被接受前检测静默失败。
      尚未覆盖: 验证门控本身会漏检静默失败，且仅在较窄领域或案例场景中得到展示。
    - 路线: 虚拟与领域基准环境
      解决的问题: 通过任务、数据集、指标和人类基线，比较智能体在完整发现循环上的表现。
      尚未覆盖: 任务覆盖未必代表多样化科学发现，自动指标未必对应真实决策效用。
    - 路线: 证据成熟度评估
      解决的问题: 围绕对照、稳健性、可证伪性和可审计性等维度，评估智能体生成声明是否有证据支撑。
      尚未覆盖: 受评智能体普遍缺乏判别性行为；验证依赖单一冻结基座模型和固定LLM评审，泛化性未知。
    - 路线: 交互式多智能体科研基础设施
      解决的问题: 提供可定制角色、实时监控、工件检查、回滚/恢复和代码工具，以支持人类监督。
      尚未覆盖: 评估限于少数内部案例和偏好判断，外部效度与治理成熟度尚未确立。
    共识:
    - 自动化科研系统需要将生成与验证分离；第二层评审或有效性检查能捕获仅靠执行流程无法发现的失败。
    - 评测正从静态任务成功转向证据质量，关注任务完成、证据审计、人类基线和可复现工件。
    - 当前系统能执行并记录分析，但尚不构成可靠自主发现能力；对照、稳健性、可证伪性和同行评审稳定性仍不足。
    - 代码、数据和开放工件被视为比较智能体的基础条件，但可复现性不能替代对声明质量的判断。
    分歧:
