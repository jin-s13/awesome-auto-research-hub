    - 'Interaction and memory differ: end-to-end tree search, human-in-the-loop dashboard
      control, and shared failure memory emphasize different control points and feedback
      mechanisms.'
    - 'Performance evidence differs: some systems report near-human review scores
      or a passing workshop paper, while another reports below-human recall on experiment
      planning.'
    open_questions:
