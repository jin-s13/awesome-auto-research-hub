  related_work_outline:
  - 'Mainstream direction: Using LLM-based agents to automate parts of the literature
    review pipeline, from retrieval and evidence extraction to structured review generation
    and peer review simulation.'
  - 'Shared research pattern: Decomposing the literature review workflow into sub-tasks
