      simulations.'
    - 'Intervention point differs: some systems add validity gates before accepting
      results, others add post-hoc evidence rubrics, while others rely on interactive
      monitoring and rollback.'
    - 'Success criteria differ: automated reviewer acceptance thresholds, peer-review
      acceptance, metric improvement on a domain benchmark, or expert preference across
