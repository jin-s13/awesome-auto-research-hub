    - 路线: 交互式多智能体研究平台
      解决的问题: 提供可定制角色、实时监控、代码执行工具、工件检查和回滚/恢复控制，支持有引导的研究流程。
      尚未覆盖: 当前证据仅来自少量内部案例研究，外部效度、成熟度和可扩展性未得到解决。
    - 路线: 失败模式分析与设计原则
      解决的问题: 记录实现漂移、上下文衰减、过早兴奋和科学品味不足等重复失败，以归纳更稳健的系统设计原则。
      尚未覆盖: 失败分类基于少量端到端尝试，需在更多领域和更长研究周期中验证。
