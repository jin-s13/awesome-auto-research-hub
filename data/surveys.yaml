  related_work_outline:
  - 'Mainstream direction: Multi-agent LLM systems that automate literature review,
    survey generation, and knowledge retrieval as part of broader scientific discovery
    pipelines, with increasing emphasis on structured iteration and rubric-guided
    evaluation.'
  - 'Shared research pattern: Decompose scholarly workflows into distinct agent roles,
    embed verification loops, and measure quality via LLM-based or human-aligned rubrics;
    all works treat evaluation as a core unsolved challenge.'
  - 'Key differences: Some systems generate full papers end-to-end for a single domain,
    while others evaluate literature-derived knowledge with benchmarks or analyze
    failure modes; design choices diverge in iterative refinement (evolutionary search
    vs. rubric feedback) and domain specificity.'
  - 'Trend evolution: From 2025 to 2026, the field moved from domain-specific proof-of-concept
    systems (mathematics, biology) toward general frameworks, benchmark construction,
    and systematic failure analysis, signaling a shift from capability demonstration
    to robustness and evaluation.'
  - 'Open questions: How to ensure factual accuracy and avoid overexcitement during
    long-horizon literature synthesis; whether rubric-based LLM evaluation aligns
    with human expert judgment; and how to inject domain intelligence and scientific
    taste into automated review systems.'
  related_work_outline_zh:
  - 主流方向：多智能体LLM系统自动化文献综述、综述生成和知识检索，作为更广泛科学发现管线的一部分，强调结构化迭代和基于评分准则的评估。
  - 研究共性：将学术工作流分解为不同智能体角色，嵌入验证循环，通过LLM或人类对齐的评分准则衡量质量；所有工作都将评估视为核心未解挑战。
  - 关键差异：部分系统端到端生成特定领域论文，另一些则通过基准评估文献衍生知识或分析失败模式；设计选择在迭代优化（进化搜索 vs 评分准则反馈）和领域专一性上不同。
  - 趋势演进：从2025到2026年，领域从特定领域的原理验证系统（数学、生物学）转向通用框架、基准构建和系统失败分析，标志着从能力展示到稳健性与评估的转变。
  - 开放问题：如何确保长跨度文献合成中的事实准确性并避免过度兴奋；基于评分准则的LLM评估是否与人类专家判断一致；如何将领域智能和科学品味注入自动化综述系统。
  literature_review:
    line_of_work_matrix:
    - line: Automated survey generation via role-specialized agents and rubric-guided
        refinement
      what_it_solves: Produces comprehensive, formatted scholarly survey papers by
        mirroring human roles (topic expansion, citation curation, drafting, peer
        review) and iteratively improving against a behaviorally anchored rubric.
      what_remains_open: Generalizability beyond the evaluated domains is unverified;
        rubric-based LLM evaluation may not fully capture factual accuracy or deep
        insight, and the system lacks mechanisms for injecting domain experts' tacit
        knowledge.
    - line: Literature synthesis and knowledge retrieval as an integrated step in
        principled scientific discovery
      what_it_solves: Embeds automated literature review, knowledge retrieval, and
        internal logical verification within a multi-agent system that generates complete
        research papers for theory-driven domains, reducing human intervention.
      what_remains_open: Validation is limited to applied mathematics; the knowledge
        retrieval coverage and verification loop's adequacy for out-of-distribution
        reasoning remain untested, and the system's reliance on LLM-based review may
        obscure subtle errors.
    - line: Benchmarking literature-derived scientific knowledge in AI scientists
      what_it_solves: Provides a controlled evaluation of AI agents' ability to answer
        multiple-choice questions derived from published single-cell studies, establishing
        a human graduate-student baseline for comparison.
      what_remains_open: The biological domain and question format restrict generality;
        closed-form questions cannot assess the open-ended synthesis and critical
        analysis required in real literature reviews, and human baseline size is small.
    - line: Failure mode analysis and design principles for autonomous research workflows
      what_it_solves: Documents recurring failure patterns (bias toward defaults,
        memory degradation, weak scientific taste) in end-to-end LLM-driven research
        attempts, and proposes design principles for more robust systems.
      what_remains_open: The analysis is based on only four attempts in ML, with no
        quantitative evaluation of the proposed design principles; the identified
        failures lack a systematic mitigation strategy, and the role of literature
        search in these failures is not isolated.
    consensus:
    - LLM-based multi-agent or modular architectures are the dominant paradigm for
      automating scholarly tasks.
    - Structured iteration (tree-based branching, rubric loops, or evolutionary cycles)
      is essential to improve output quality.
    - Evaluation of automated literature products remains a major unsolved challenge,
      with current practice relying on LLM judges or narrow benchmarks.
    - Integrating literature synthesis with broader scientific discovery amplifies
      impact but introduces reliability and domain-specificity risks.
    disagreements:
    - End-to-end paper generation (ReasFlow, ARISE) versus task-specific literature
      evaluation (BAISBench) or failure analysis (Why LLMs Aren't Scientists), reflecting
      different granularities of automation.
    - 'Iterative refinement mechanisms differ: rubric-guided re-drafting by multiple
      reviewer agents versus evolutionary search with backtracking in a research tree.'
    - 'Domain specificity varies: some systems are designed for a single discipline
      (applied mathematics, single-cell biology), others claim domain-agnosticism
      but are evaluated on broad benchmarks.'
    - 'Human alignment: ARISE uses a behaviorally anchored rubric, BAISBench uses
      human performance on multiple-choice questions, while ReasFlow relies on LLM-based
      review rubrics without explicit human comparison.'
    open_questions:
    - How can automated literature systems maintain factual accuracy and avoid 'overexcitement'
      (declaring success despite failures) during long-horizon synthesis?
    - Do rubric-based LLM evaluations correlate with real-world scholarly utility,
      or are they susceptible to reward hacking?
    - Can current systems transfer knowledge retrieval and synthesis capabilities
      across disparate scientific domains without domain-specific prompt engineering?
    - What mechanisms can effectively inject 'scientific taste' and deep domain intelligence
      into agentic workflows to prevent trivial or biased contributions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 通过角色专业化智能体和评分准则引导的自动化综述生成
      解决的问题: 通过模拟人类角色（主题扩展、引文管理、撰写、同行评审）并根据行为锚定评分准则迭代改进，生成全面、格式规范的学术综述论文。
      尚未覆盖: 在评估领域之外的泛化能力未经验证；基于评分准则的LLM评估可能无法完全捕捉事实准确性和深度见解，且系统缺乏注入领域专家隐性知识的机制。
    - 路线: 作为原则性科学发现集成步骤的文献综合与知识检索
      解决的问题: 将自动化文献综述、知识检索和内部逻辑验证嵌入多智能体系统中，为理论驱动领域生成完整研究论文，减少人工干预。
      尚未覆盖: 验证仅限于应用数学；知识检索的覆盖范围和验证循环在分布外推理中的充分性尚未测试，且系统依赖LLM评审可能掩盖细微错误。
    - 路线: 对AI科学家文献衍生科学知识的基准测试
      解决的问题: 通过从已发表单细胞研究衍生的选择题评估AI智能体能力，并建立人类研究生基线对比。
      尚未覆盖: 生物学领域和问题格式限制了通用性；封闭式问题无法评估真实文献综述所需的开放式综合与批判分析，且人类基线规模较小。
    - 路线: 自主研究工作流的失败模式分析与设计原则
      解决的问题: 记录端到端LLM驱动研究尝试中反复出现的失败模式（对默认值偏见、记忆退化、科学品味薄弱），并提出更稳健系统的设计原则。
      尚未覆盖: 分析仅基于四次ML尝试，未对提出的设计原则进行定量评估；识别的失败缺乏系统性缓解策略，且文献搜索在这些失败中的角色未被隔离。
    共识:
    - 基于LLM的多智能体或模块化架构是自动化学术任务的主流范式。
    - 结构化迭代（树形分支、评分准则循环或进化周期）对提升输出质量至关重要。
    - 自动化文献产品的评估仍是主要未解决挑战，目前实践依赖LLM评判或狭域基准。
    - 将文献综合与更广泛的科学发现集成可放大影响，但也引入可靠性和领域专一性风险。
    分歧:
    - 端到端论文生成（ReasFlow、ARISE）与面向任务的文献评估（BAISBench）或失败分析（Why LLMs Aren't Scientists）反映自动化粒度的不同。
    - 迭代优化机制不同：多评审智能体通过评分准则引导重新起草，与在研究中树中采用进化搜索加回溯。
    - 领域特异性各异：部分系统为单一学科设计（应用数学、单细胞生物学），其他声称领域无关但在广泛基准上评估。
    - 人类对齐方式：ARISE使用行为锚定评分准则，BAISBench使用人类在选择题上的表现，而ReasFlow依赖基于LLM的评审准则，无明确人类对比。
    开放问题:
    - 自动化文献系统如何在长跨度合成中保持事实准确性并避免“过度兴奋”（尽管失败仍宣称成功）？
    - 基于评分准则的LLM评估是否与真实学术效用相关，还是容易受到奖励黑客攻击？
    - 当前系统能否在不依赖领域特定提示工程的情况下，跨不同科学领域迁移知识检索和合成能力？
    - 何种机制能有效将“科学品味”和深层领域智能注入智能体工作流，以防止琐碎或偏见的贡献？
