  related_work_outline_zh:
  - 主流方向：构建端到端自主科研系统，从想法生成、实验或代码执行、结果分析到论文撰写，近期工作加入内部验证或审稿反馈以过滤不可靠结论。
  - 研究共性：多条工作共享假设—执行—分析—写作循环；评估越来越区分系统能否运行与结论是否可辩护、是否有证据支撑。
  - 关键差异：系统分为面向开放 ML 的通用发现、面向应用数学或 CFD 等领域并加入专门验证的智能体，以及只做评测的环境或基准；监督模式与有效性门控也不同。
  - 趋势演进：在提供的代表性论文证据中，工作集中在 2024–2026 年，从通用自动化科研与发现环境，转向领域专用、带验证门控的智能体和更严格的证据成熟度评测。
  - 开放问题：验证门控仍会漏检静默失败；自动评审与人类判断的校准有限；当前智能体在对照、稳健性、可证伪性和跨领域泛化方面仍不足。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Integrates ideation, experiment or code execution, analysis,
        visualization, and manuscript writing into one autonomous loop.
      what_remains_open: Consistency remains low, domain-specific validity checks
        are often absent, and success is shown mostly through narrow demonstrations
        or simulated review rather than broad external validation.
    - line: Domain-specific verification-gated discovery agents
      what_it_solves: Reduces invalid claims in applied mathematics and CFD by adding
        logical verification, knowledge retrieval, or physics-aware visual/execution
        gates.
      what_remains_open: The verification gate still missed some planted silent failures,
        and evaluation relied on curated rubrics or narrow physical cases without
        robust human-expert comparison.
    - line: Discovery environments and evidence-maturity benchmarks
      what_it_solves: Provides standardized tasks, blind datasets, and automatic judges
        for evaluating full discovery cycles and whether claims are supported by evidence.
      what_remains_open: Results are limited by the evidence base, such as a single
        frozen base model, limited task coverage, and uncertain alignment between
        proxy metrics and real research utility.
    - line: Automated review and quality filtering
      what_it_solves: Scales assessment of generated manuscripts or scientific claims
        through LLM-based reviewers, rubrics, or internal verification loops.
      what_remains_open: Near-human reviewer evidence is limited, peer-review success
        is inconsistent and workshop-level, and cross-domain calibration or bias control
        is not established.
    consensus:
    - Systems share a full-cycle pipeline from hypothesis or idea generation through
      experiment or code execution to analysis and manuscript generation.
    - Verification or review gates are treated as necessary to separate defensible
      scientific claims from superficially plausible outputs.
    - 'Evaluations converge on a common gap: agents can generate papers or analyses,
      but they often lack controls, robustness, falsifiability, and cross-dataset
      generalization.'
    - Peer review or human judgment remains the reference standard even when automated
      reviewers or LLM-based rubrics are used as proxies.
    disagreements:
    - 'Evaluation targets differ: some assess manuscript acceptance quality, others
      assess task completion in simulated discovery worlds, and others assess evidentiary
      maturity of claims from blind datasets.'
    - 'Domain-specific validity evidence differs: some systems use physics-aware visual
      or logical verification, while generic systems rely on automated LLM review
      without equivalent physical or computational gates.'
    - 'Autonomy framing differs: some systems are fully automated, while others treat
      the human as principal investigator and the agent as an executing assistant.'
    - 'Reported capability levels conflict: one line emphasizes workshop-level peer
      acceptance, while another shows coding agents plateauing below trustworthy discovery.'
    open_questions:
    - Verification gates still miss silent failures in domain-specific settings, so
      what additional checks would reduce false positives without discarding valid
      discoveries?
    - Automated LLM reviewers and rubrics are used for acceptance and evidence-maturity
      decisions, but how well do they calibrate to human peer review across disciplines?
    - Current agents execute and document analyses but lack controls, robustness,
      falsifiability, and generalization; which architectural or supervision changes
      can produce these behaviors?
    - Where source entries omit limitations or human-expert comparisons, which failure
      modes and external validity claims remain unverified?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科研智能体
      解决的问题: 把想法生成、实验或代码执行、分析、可视化和论文撰写整合到一个自主循环中。
      尚未覆盖: 一致性仍较低，领域专用有效性检查常缺失，成功主要来自窄演示或模拟评审，而非广泛外部验证。
    - 路线: 领域专用带验证门控的发现智能体
      解决的问题: 在应用数学和 CFD 中通过逻辑验证、知识检索或物理感知视觉/执行门控，减少不可靠结论。
      尚未覆盖: 验证门控仍漏检了部分植入的静默失败；评测依赖人工设计的评分规则或窄物理案例，缺乏稳健的人类专家对照。
    - 路线: 发现环境与证据成熟度基准
      解决的问题: 提供标准化任务、盲数据和自动裁判，评估完整发现循环以及结论是否得到证据支持。
      尚未覆盖: 证据基础有限，如单一冻结基座模型、任务覆盖不足，且代理指标与现实科研效用之间的关系还不清楚。
    - 路线: 自动评审与质量过滤
      解决的问题: 通过基于 LLM 的评审、评分规则或内部验证循环，规模化评估生成论文或科学主张。
      尚未覆盖: 接近人类评审的证据有限，同行评审成功不稳定且停留在工作坊级，跨领域校准和偏差控制尚未建立。
    共识:
    - 多条工作共享从假设或想法生成，到实验或代码执行，再到分析和论文撰写的完整循环。
    - 验证或评审门控被普遍视为区分可辩护科学主张与表面合理输出的必要环节。
    - 评测共同揭示：智能体能够生成论文或分析，但往往缺少对照、稳健性、可证伪性和跨数据集泛化。
    - 同行评审或人类判断仍被作为参照标准，即便自动评审或基于 LLM 的评分规则被用作代理。
    分歧:
