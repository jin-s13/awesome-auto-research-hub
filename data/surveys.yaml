  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: Combines idea generation, code or derivation execution, result
        visualization, and full paper writing into a single agentic pipeline.
      what_remains_open: Sustained reliability across domains and venues; current
        systems are often inconsistent or workshop-level rather than full-conference
        ready.
    - line: Verification and self-correction for scientific claims
      what_it_solves: Adds logical audits, physics-aware gates, or multi-hypothesis
        failure attribution to detect invalid results and hallucinated reporting before
        writing.
      what_remains_open: Verification gaps persist, such as missed silent failures;
        no standardized evidence threshold defines when generated claims are trustworthy.
    - line: Human-AI collaboration and intervention design
      what_it_solves: Structures expert oversight as principal investigator, targeted
        high-leverage checkpoints, or flexible intervention modes rather than full
        manual control.
      what_remains_open: Optimal timing and granularity of human involvement are not
        established across different research tasks and domain expertise levels.
    - line: Evaluation and failure analysis of autonomous research writing
      what_it_solves: Provides task-level evidence, blind scores, peer-review outcomes,
        and failure taxonomies to compare agentic writing systems and expose recurring
        breakdowns.
      what_remains_open: Proxy metrics and small topic sets may not align with real
        publication quality, open-ended discovery, or cross-domain evidence validity.
