  related_work_outline_zh:
  - 主流方向：构建自动化研究智能体的评估基准与可靠性机制，涵盖虚拟发现任务、领域科学任务、证据成熟度评分和带验证门控的闭环系统。
  - 研究共性：多数工作将智能体发现系统与评估框架、任务集、基线和自动LLM裁判或程序化检查配对，以评估有效性、可复现性或科学可靠性。
  - 关键差异：评估目标不同：通用机器学习发现、虚拟科学发现、计算流体动力学、单细胞组学、预测架构演化；可靠性机制不同：视觉-语言物理验证、模拟评审、证据成熟度裁判、确定性认知-权限分离。
  - 趋势演进：从2024年通用端到端自主发现框架走向2025-2026年专门基准与可靠性系统；评估重点从任务完成和同行评审代理指标转向证据成熟度、盲数据到主张的评估和领域专用有效性门控。
  - 开放问题：自动裁判和代理指标是否与真实科研效用一致；跨领域和跨基座模型泛化；如何在不约束开放式发现的前提下捕捉静默失败。
  literature_review:
    line_of_work_matrix:
    - line: General autonomous discovery pipelines (e.g., The AI Scientist, The AI
        Scientist-v2)
      what_it_solves: End-to-end idea generation, coding, experimentation, paper writing,
        and automated review, reducing per-paper cost and human effort.
      what_remains_open: 'Reliability stability is incomplete: only one of three AI
        Scientist-v2 submissions passed peer review and only workshop-level validation
        is demonstrated; The AI Scientist lacks explicit limitations and uses automated
        review as outcome evidence.'
    - line: Virtual discovery evaluation environments (e.g., DISCOVERYWORLD)
      what_it_solves: Benchmarks complete discovery cycles with many tasks and metrics
        for task completion, task-relevant actions, and explanatory knowledge.
      what_remains_open: Whether success on virtual tasks predicts real scientific
        discovery is not established; the limitations field is absent from the visible
        evidence, and automatic metrics are not linked to decision utility.
    - line: Evidence-grounded evaluation benchmarks (e.g., TruthInsightBench)
      what_it_solves: Blind tasks derived from peer-reviewed studies with a fixed
        LLM judge scoring evidence maturity across multiple dimensions, enabling deterministic
        comparison without instance-level human scoring.
      what_remains_open: Results are based on one frozen base model; four coding agents
        plateau and lack controls, robustness, falsifiability, and cross-dataset generalization,
        so cross-base-model and cross-domain generalization remain open.
    - line: Domain-specific research agents with verification gates (e.g., AI CFD
        Scientist, EvoCast)
      what_it_solves: Embeds physics-aware visual verification or deterministic authority
        checks into autonomous discovery loops to reduce silent failures or unauthorized
        edits while improving task-specific metrics.
      what_remains_open: AI CFD Scientist's vision-language gate missed 2 of 16 planted
        silent failures; EvoCast reports no explicit limitations and is demonstrated
        on three real-world forecasting cases, leaving broader external validation
        open.
    - line: Domain-specific AI scientist benchmarks with human baselines (e.g., BAISBench)
      what_it_solves: Evaluates AI scientists on real single-cell transcriptomic datasets
        for cell annotation and discovery choices, with graduate-level human comparison.
      what_remains_open: Current AI scientists still fall short of fully autonomous
        biological discovery; the benchmark uses annotation and multiple-choice evidence,
        so open-ended biological reasoning and broader discovery behavior are not
        covered.
    consensus:
    - Automated research agents need external evaluation because self-generated papers
      or task completion alone are insufficient to establish validity.
    - The field is converging on structured task suites or benchmarks with predefined
      metrics, baselines, and automated LLM judges or programmatic checks for scalable
      evaluation.
    - Reproducibility signals such as open-source code, datasets, and artifacts are
      increasingly treated as part of the contribution.
    - Current agents can execute and document analyses competently but still lack
      trustworthy scientific judgment, controls, robustness, and falsifiability.
    - Governance in this evidence appears as technical control mechanisms such as
      verification gates, simulated review, and deterministic authority separation
      rather than institutional policy.
    disagreements:
    - 'Evaluation target differs: synthetic virtual discovery tasks, real domain data,
      peer-review acceptance, and blind data-to-claim evidence maturity.'
    - 'Reliability mechanism differs: physics-aware visual verification, simulated
      review feedback, evidence-maturity judging, and deterministic cognition-authority
      separation.'
    - 'Supervision signal differs: task completion and explanatory knowledge, peer-review
      outcomes, and evidence-grounded maturity dimensions.'
    - 'Deployment setting differs: general machine learning research, computational
      fluid dynamics, single-cell omics, and time-series forecasting architecture
      evolution.'
    open_questions:
    - Do automated LLM judges and task-completion metrics align with real scientific
      decision utility and reproducibility?
    - Can reliability gates catch all silent failures without suppressing novel but
      unusual results, given the observed CFD gate false-negative case?
    - How well do evidence-maturity scores generalize across frozen base models and
      to domains beyond the blind peer-reviewed tasks?
    - Can domain-specific benchmarks move beyond annotation and multiple-choice evidence
      to open-ended discovery while preserving comparability and human baselines?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 通用自主发现流程（如 The AI Scientist、The AI Scientist-v2）
      解决的问题: 端到端完成想法生成、编码、实验、论文写作和自动评审，降低单篇论文成本并减少人工介入。
      尚未覆盖: 可靠性不稳定：AI Scientist-v2 三篇提交中仅一篇通过同行评审，且仅在研讨会级别验证；The AI Scientist 缺少明确局限性，并用自动评审作为结果证据。
    - 路线: 虚拟发现评估环境（如 DISCOVERYWORLD）
      解决的问题: 以大量任务和任务完成、任务相关动作、解释性知识三类指标评估完整发现循环。
      尚未覆盖: 虚拟任务成功能否预测真实科学发现尚未建立；可见证据中缺少局限性字段，自动指标也未与决策效用关联。
    - 路线: 证据锚定评估基准（如 TruthInsightBench）
      解决的问题: 使用来自同行评审研究的盲任务，以固定LLM裁判从多个维度评估证据成熟度，支持无需逐实例人工评分的确定性比较。
      尚未覆盖: 结果仅基于一个冻结基座模型；四个编码智能体得分平台化，缺乏对照、稳健性、可证伪性和跨数据集泛化，因此跨基座模型与跨领域泛化仍未解决。
    - 路线: 带验证门控的领域专用研究智能体（如 AI CFD Scientist、EvoCast）
      解决的问题: 在自主发现循环中嵌入物理感知视觉验证或确定性权限检查，减少静默失败或越权编辑，并改善任务指标。
      尚未覆盖: AI CFD Scientist 的视觉-语言门控漏检了16个植入静默失败中的2个；EvoCast 未报告明确局限性，且仅在三个实际预测案例中展示。
    - 路线: 带人类基线的领域专用AI科学家基准（如 BAISBench）
      解决的问题: 在真实单细胞转录组数据上评估AI科学家的细胞注释和发现决策，并提供研究生水平的人类基线。
      尚未覆盖: 当前AI科学家尚未实现完全自主的生物学发现；基准采用注释和选择题证据，开放式生物推理和更广泛发现行为未被覆盖。
    共识:
    - 自动化科研智能体需要外部评估，仅靠自动生成论文或任务完成不足以证明有效性。
    - 研究正在趋向结构化任务集或基准，配合预设指标、基线、自动LLM裁判或程序化检查来扩展评估规模。
    - 开源代码、数据集和工件等可复现信号越来越多被视为贡献的一部分。
    - 当前智能体在分析和执行上表现尚可，但仍缺乏建立可信主张所需的科学判断、对照、稳健性和可证伪性。
    - 治理在此证据中表现为验证门控、模拟评审和确定性权限分离等技术控制机制，而非机构制度。
    分歧:
    - 评估目标不同：合成虚拟发现任务、真实领域数据、同行评审接受、盲数据到主张的证据成熟度。
    - 可靠性机制不同：物理感知视觉验证、模拟评审反馈、证据成熟度裁判、确定性认知-权限分离。
    - 监督信号不同：任务完成与解释性知识、同行评审结果、证据成熟度维度。
    - 部署场景不同：通用机器学习研究、计算流体动力学、单细胞组学、时间序列预测架构演化。
    开放问题:
    - 自动LLM裁判和任务完成指标是否与真实科研决策效用及可复现性一致？
    - 在已观察到CFD门控漏检的情况下，可靠性门控能否在不过度抑制新颖结果的同时捕捉所有静默失败？
    - 证据成熟度评分在固定基座模型之外是否具有跨基座模型和跨领域泛化性？
    - 领域专用基准能否从注释和选择题证据扩展到开放式发现，同时保持可比较性和人类基线？
