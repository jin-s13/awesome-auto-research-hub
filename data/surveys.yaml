      尚未覆盖: 在足够不同的科学领域间迁移、记忆整理质量，以及提升多少来自记忆层而非任务先验仍缺少充分证据。
    - 路线: 交互式多智能体科研基础设施与代码工具
      解决的问题: 将单个研究模型转化为可定制团队，提供监控、回滚和本地代码库、数据集、checkpoint的可执行连接。
      尚未覆盖: 平台成熟度和外部验证有限，现有评估集中在少量内部案例，跨硬件和用户设置的标准验证缺失。
    共识:
    - 多数工作围绕迭代实验循环展开：提出假设或想法、执行实验、分析结果、修改后继续，并以论文、任务完成或benchmark提升作为证据。
