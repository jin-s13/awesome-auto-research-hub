  related_work_outline_zh:
  - 主流方向：构建端到端自主科学论文生成系统，自动完成从想法生成、实验执行、验证到论文起草的全流程。
  - 研究共性：采用多智能体流水线分解科学工作流，使用大语言模型生成内容，并集成验证、评审等反馈循环以提升输出质量。
  - 关键差异：人类参与程度从完全自主到多模式人机协作不等；验证机制包括内部逻辑审计、物理感知视觉门控和多假设故障归因；系统在应用数学、计算流体力学、通用机器学习等不同领域得到验证。
  - 趋势演进：从2024年全自动框架（如The AI Scientist）演进到2025-2026年引入树搜索、自纠正故障归因、可验证报告和领域特定验证的系统，评估方式从模拟评审转向实际工作坊同行评审。
  - 开放问题：如何在长周期任务中维持上下文一致性与科学品味，如何可靠检测静默失败与幻觉，以及如何建立标准化基准以评估生成论文的科学贡献。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous scientific writing systems
      what_it_solves: Automates the full research paper generation pipeline, including
        literature synthesis, method design, experiment execution, and manuscript
        drafting, to reduce human cost.
      what_remains_open: Acceptance rates at top venues remain inconsistent; systems
        often rely on predefined templates; cross-domain generalization still lacks
        the domain intelligence and scientific taste required for rigorous contributions.
    - line: Verification and error-correction mechanisms
      what_it_solves: Reduces factual errors and hallucinations in generated content
        through internal logical audits, physics-consistency checks, or multi-hypothesis
        failure attribution, thereby increasing paper credibility.
      what_remains_open: Silent failures (e.g., missed by physics vision gates) still
        occur; detection of deep logical flaws in scientific arguments and experimental
        design weaknesses is limited.
    - line: Human-AI collaboration and interaction design
      what_it_solves: Embeds human expert intervention at high-leverage decision points
        (e.g., hypothesis selection, result interpretation) to compensate for the
        brittleness of full autonomy.
      what_remains_open: Optimal intervention timing and mode remain unclear; the
        trade-off between minimizing human effort and maximizing system success rate
        is still unresolved.
    consensus:
    - All systems adopt a multi-agent architecture that decomposes scientific discovery
      into manageable sub-tasks such as literature retrieval, code generation, experiment
      execution, and writing.
    - They rely on large language models as the core generation engine and use some
      form of feedback loop (e.g., reviewer, verification) to iteratively improve
      outputs.
    - There is broad recognition that full autonomy is limited, addressed either by
      introducing verification gates or by incorporating human collaboration.
    disagreements:
    - 'The extent of human involvement differs: the AI Scientist series pursues full
      autonomy, while AutoResearchClaw and ReasFlow emphasize human-AI collaboration,
      modeling the human as a principal investigator.'
    - 'Verification philosophies diverge: ReasFlow uses internal logical consistency
      checks, AI CFD Scientist employs domain-specific physics-aware vision gates,
      and SAGE applies causal multi-hypothesis failure attribution.'
    - 'Evaluation methods vary: some works score papers with an internal automated
      reviewer, whereas AI Scientist-v2 and AutoResearchClaw have had papers accepted
      through real external peer review.'
    open_questions:
    - How can current systems avoid context and memory degradation during long-horizon
      scientific writing to maintain logical coherence across sections?
    - How can we quantitatively evaluate the originality and scientific contribution
      of a generated paper, beyond formatting correctness and experimental reproducibility?
    - In resource-constrained domains, how can effective domain-specific validators
      be built to prevent plausibly written but physically incorrect conclusions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主科学写作系统
      解决的问题: 自动化研究论文生成的完整流程，包括文献综合、方法设计、实验执行和手稿起草，以降低人工成本。
      尚未覆盖: 在顶级会议的接受率仍不稳定，系统常依赖预定义模板；跨领域泛化时仍缺乏严谨贡献所需的领域智能和科学品味。
    - 路线: 验证与纠错机制
      解决的问题: 通过内部逻辑审计、物理一致性检查或多假设故障归因来减少生成内容中的事实错误和幻觉，提高论文可信度。
      尚未覆盖: 静默失败（如物理视觉门控遗漏的故障）仍会发生；对科学论证深层逻辑错误和实验设计缺陷的检测能力有限。
    - 路线: 人机协作与交互设计
      解决的问题: 在高杠杆决策点（如假设选择、结果解释）嵌入人类专家干预，弥补完全自主的脆弱性。
      尚未覆盖: 最优干预时机和模式尚不明确，如何在减少人类工作量的同时最大化系统成功率仍需探索。
    共识:
    - 所有系统均采用多智能体架构，将科学发现分解为文献检索、代码生成、实验执行和写作等可管理的子任务。
    - 均依赖大型语言模型作为核心生成引擎，并利用某种反馈循环（如评审、验证）来迭代改进输出。
    - 普遍认识到完全自主的局限性，通过引入验证门控或人机协作来应对。
    分歧:
    - 人类参与程度不同：AI Scientist系列追求完全自主，而AutoResearchClaw和ReasFlow强调人机协作，将人类建模为首席研究员。
    - 验证哲学不同：ReasFlow采用内部逻辑一致性检查，AI CFD Scientist使用领域特定的物理感知视觉门控，SAGE则应用因果多假设故障归因。
    - 评估方式不同：部分工作使用内部自动评审器评分，而AI Scientist-v2和AutoResearchClaw的部分论文已通过真实外部同行评审。
    开放问题:
    - 当前系统在长周期科学写作中如何避免上下文记忆退化，确保论文各部分逻辑一致？
    - 如何量化评估生成论文的原创性和科学贡献，而不仅仅是格式正确性与实验可重复性？
    - 在资源受限的领域，如何构建有效的领域特定验证器，以防止生成看似合理但物理上错误的结论？
