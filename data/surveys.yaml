  related_work_outline_zh:
  - 主流方向：构建自动化的研究智能体闭环，覆盖构思、执行和写作，并逐步转向基于证据的评估、领域特定验证和对自主发现主张的治理。
  - 研究共性：系统生成假设、运行代码或实验、产出主张或论文，然后通过基准、自动评委或验证门控判断哪些输出可信。
  - 关键差异：评估目标不同，如虚拟任务完成、领域指标提升、评审接受或证据成熟度；验证方式从 LLM 评委、视觉-语言物理门控到确定性编辑权威不等。
  - 趋势演进：从 2024 年通用端到端自主框架，到 2025-2026 年受控基准、领域验证器和证据质量评分，前沿正从“能否生成”转向“能否信任”。
  - 开放问题：自动评委和验证门控是否与真实科学效用一致，领域门控是否跨域泛化，以及智能体能否产出有对照、稳健、可证伪的主张，而不仅是胜任执行。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research agents
      what_it_solves: Automates research ideation, code implementation, experiment
        execution, and manuscript writing, reducing per-paper generation cost and
        enabling open-ended exploration.
      what_remains_open: Autonomy is inconsistent across runs and domains; acceptance
        or validity is demonstrated in narrow settings, and domain-specific reliability
        is not yet established.
    - line: Benchmark environments for discovery
      what_it_solves: Provides controlled tasks and metrics for comparing discovery
        agents across hidden objectives, frozen data, or real domain datasets.
      what_remains_open: Automatic task-completion and evidence metrics may not align
        with real scientific utility; coverage is limited to specific domains, base
        models, and evaluation criteria.
    - line: Verification and authority mechanisms
      what_it_solves: Catches invalid outputs and constrains agent edits through physics-aware
        inspection, vision-language gates, or deterministic program authority.
      what_remains_open: Known gates still miss planted silent failures, and evidence
        is mostly single-domain, leaving cross-domain and cross-simulation transfer
        unverified.
    - line: Automated review and evidence-quality scoring
      what_it_solves: Scales evaluation of agent-generated papers and evidentiary
        support using simulated reviewers or rubric-based LLM judges.
      what_remains_open: Alignment with human judgment is only partially validated,
        and evidence-maturity scores may capture auditability more than genuine discovery.
    consensus:
    - Automated execution and paper generation are necessary but insufficient without
      validity checks.
    - Current agents are competent at executing and documenting analyses but weak
      in scientific judgment such as controls, robustness, and falsifiability.
    - Evaluation is moving toward multi-dimension evidence quality rather than single
      task success.
    - Domain-specific validation can catch silent failures that code execution alone
      misses.
    disagreements:
    - One line evaluates discovery by completing hidden tasks in simulated environments,
      another by scoring evidence maturity against frozen data, and another by domain-specific
      metric improvement.
    - Verification authority is placed in different signals such as simulated expert
      review, vision-language inspection of rendered outputs, or deterministic programmatic
      constraints.
    - Claims about AI-generated research quality conflict because some results report
      near-human review or workshop-level acceptance while evidence-grounded benchmarks
      report plateaued scores without reliable agent separation.
    - Domain emphasis differs from general machine learning discovery to specialized
      CFD, omics, and time-series forecasting workflows.
    open_questions:
    - Can automatic judges and verifiers transfer beyond the domains and base models
      for which they were validated?
    - What evaluation design would demonstrate that an agent performs genuine discovery
      rather than competent reproduction or parameter search?
    - How should domain-specific validity gates be combined with general scientific
      criteria such as controls, robustness, and falsifiability?
    - Which missing code, dataset, baseline, or limitation details are verification
      gaps rather than evidence that a system lacks those properties?
