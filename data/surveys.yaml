  related_work_outline:
  - 'Mainstream direction: Building autonomous research agent systems that automate
    the full scientific discovery loop—from hypothesis generation and experiment execution
    to result verification—using LLM-powered multi-agent architectures.'
  - 'Shared research pattern: All systems decompose the research workflow into modular
    agents, incorporate a verification or reflection mechanism, and report performance
    against baselines or human benchmarks.'
  - 'Key differences: Supervision mode (fully autonomous vs. human-in-the-loop at
    leverage points), validation strategy (physics-based visual gates, formal proof
    in Lean, verifiable report constraints), and domain scope (specialized CFD or
    causal inference vs. domain-agnostic platforms).'
  - 'Trend evolution: From 2023 to 2026, the field moved from single-domain AI scientists
    to domain-agnostic self-evolving frameworks, with increasing emphasis on structured
    failure attribution, formal verification, and multi-agent debate.'
  - 'Open questions: How to validate the novelty and scientific significance of generated
    hypotheses; bridging the gap between formal verification of proofs and the intended
    scientific semantics; and the lack of long-term, reproducible benchmarks that
    capture real-world discovery utility.'
  related_work_outline_zh:
  - 主流方向：构建以LLM为核心的多智能体自主研究系统，全面自动化从假设生成、实验执行到结果验证的科学发现闭环。
  - 研究共性：将研究流程分解为模块化智能体，引入验证或反思机制，并通过与基线或人类基准的对比来报告性能。
  - 关键差异：在监督模式（全自主 vs 在高杠杆点引入人机协作）、验证手段（物理视觉门控、Lean形式化证明、可验证报告约束）和领域范围（专用CFD/因果推断
    vs 通用平台）上存在显著分歧。
  - 趋势演进：2023-2026年间，系统从单一领域专用AI科学家迅速演进为领域无关的通用自演化框架，并日益强调结构化失败归因、形式化验证和多智能体辩论。
  - 开放问题：如何验证生成假设的新颖性和科学意义；如何弥合形式化证明与科学语义之间的鸿沟；缺乏能捕捉真实发现效用的长期、可复现基准。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous research systems and reproducible infrastructure
      what_it_solves: Turning LLM-powered agents into runnable research pipelines
        that automate hypothesis generation, experiment execution, and result reporting,
        thereby accelerating scientific discovery cycles.
      what_remains_open: Generalization across domains outside the training distribution;
        bridging the gap between formal verification and scientific semantics; fully
        autonomous paper writing and conference-ready manuscript generation remain
        unsolved.
    - line: Benchmarking and evidence design
      what_it_solves: Making AI scientist claims comparable and reliable through standardized
        tasks, human baselines, and measurable metrics, enabling systematic evaluation
        of discovery capabilities.
      what_remains_open: Limited task coverage in existing benchmarks; alignment between
        proxy metrics and real-world discovery utility is unclear; long-term validation
        of novelty and research quality is missing.
    - line: Conceptual taxonomy and theory
      what_it_solves: Organizing fragmented AI scientist systems into a coherent framework
        of capabilities, challenges, and evaluation dimensions, providing a structured
        overview for the field.
      what_remains_open: The proposed taxonomies lack direct empirical validation
        that they predict system behavior; persistent challenges like literature review
        automation remain unresolved.
    consensus:
    - All systems rely on large language models as the core reasoning engine, orchestrating
      multiple agents or modules to perform research tasks.
    - Verification or reflection mechanisms are recognized as essential to prevent
      fabricated results and hallucinated citations, though their implementations
      vary.
    - Current systems consistently outperform earlier baselines (e.g., AI Scientist
      v2) but still fall short of fully autonomous scientific discovery, with human
      oversight remaining valuable at critical decision points.
    disagreements:
    - 'Supervision setting: some systems pursue full autonomy while others incorporate
      targeted human-in-the-loop collaboration at high-leverage stages, leading to
      different trade-offs between efficiency and reliability.'
    - 'Validation strategy: physics-aware visual gates, formal proof verification
      in Lean, and verifiable reporting constraints represent fundamentally different
      approaches to ensuring result correctness.'
    - 'Domain specialization: designs range from domain-specific pipelines (CFD, causal
      inference) with built-in domain knowledge to domain-agnostic foundational frameworks
      that claim applicability across arbitrary disciplines with minimal adaptation.'
    open_questions:
    - How can we formally assess the novelty and scientific significance of hypotheses
      generated by AI scientists, beyond task-specific performance improvements?
    - What methods can bridge the gap between machine-checked formal proofs and the
      intended scientific meaning, ensuring that formalization faithfully captures
      the original claim?
    - What constitutes a long-term, reproducible benchmark for AI scientist evaluation
      that covers diverse scientific domains and aligns with real-world discovery
      impact?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主研究系统与可复现基础设施
      解决的问题: 将LLM驱动的智能体编织成可运行的研究流水线，自动化假设生成、实验执行和结果报告，以加速科学发现循环。
      尚未覆盖: 在训练分布外的领域泛化能力；形式化验证与科学语义之间的鸿沟；完全自主的论文写作和会议级论文生成仍属难题。
    - 路线: 基准测试与证据设计
      解决的问题: 通过标准化任务、人类基线和可测量指标，使AI科学家的主张具备可比性与可靠性，系统性评估发现能力。
      尚未覆盖: 现有基准任务覆盖范围有限；代理指标与真实发现效用之间的对齐未明；缺乏对新颖性和研究质量的长期验证。
    - 路线: 概念分类与理论
      解决的问题: 将碎片化的AI科学家系统组织为能力、挑战与评估维度的统一框架，为该领域提供结构化概览。
      尚未覆盖: 提出的分类缺少能预测系统行为的直接实证验证；文献综述自动化等核心挑战依然未解决。
    共识:
    - 所有系统均以大型语言模型为核心推理引擎，通过编排多个智能体或模块来执行研究任务。
    - 验证或反思机制被普遍视为防止伪造结果和幻觉引用的关键，但具体实现方式各异。
    - 当前系统普遍优于早期基线（如AI Scientist v2），但仍未达到完全自主的科学发现，在关键决策点引入人类监督仍具价值。
    分歧:
    - 监督方式：部分系统追求全自主，另一些在高杠杆阶段引入精准的人机协作，导致效率与可靠性之间的权衡取向不同。
