  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research workflow systems
      what_it_solves: Couples ideation, code execution, experiment management, analysis,
        and manuscript generation into a single agent loop for open-ended discovery.
      what_remains_open: Evidence of external validity is incomplete; many claims
        depend on automated reviewers or limited task venues, and consistency beyond
        workshop-level or single-pipeline outputs is not established.
    - line: Domain-specific discovery agents with verification gates
      what_it_solves: Adds field-specific validity checks, such as logical proof audits
        or physics-aware flow inspection, before accepting results or writing conclusions.
      what_remains_open: Gate coverage is domain-bound and imperfect; demonstrated
        failures still escape, and transfer to other scientific domains or problem
        types is not shown.
    - line: Evaluation and evidence design for discovery agents
      what_it_solves: Provides tasks and evidence-grounded metrics for comparing whether
        agents complete discovery cycles, produce explanatory knowledge, and form
        defensible claims.
      what_remains_open: Automated judges and completion metrics are proxy signals;
        task coverage, base-model generalization, and alignment with real scientific
        utility remain unresolved.
    - line: Iterative search, self-improvement, and manuscript generation
      what_it_solves: Improves hypothesis selection and report quality through tree
        search, feedback loops, knowledge retrieval, and reduced human code-template
        reliance.
      what_remains_open: Pass rates are inconsistent, improvement is not clearly separated
        from backbone-model or task-specific priors, and evidence is concentrated
        at workshop-level or LLM-rubric evaluation.
    consensus:
    - Autonomous discovery is framed as a loop covering ideation, experimentation,
      analysis, and writing, with agents judged on generated artifacts.
    - Automated validation and evaluation are viewed as necessary safeguards, but
      current systems still under-specify controls, robustness, falsifiability, and
      generalization.
    - Domain- or task-specific validity checks can catch some failures that general
      execution pipelines miss.
    - Competent analysis execution and documentation are more mature than trustworthy
      scientific judgment.
    disagreements:
    - 'One axis of difference is deployment domain: some systems target broad machine-learning
      research, while others embed mathematical proof or computational fluid dynamics
      constraints.'
    - 'Verification mechanisms differ by content: simulated reviewer scoring, generated-paper
      acceptance, physics-aware vision gates, logical proof audits, and blind evidence
      maturity rubrics.'
    - 'Interaction mode differs: human principal investigator and agent collaborator
      versus fully autonomous search and submission with minimal human intervention.'
    - 'Success criteria differ: acceptance thresholds and perceived paper quality
      versus task completion or numerical error reduction versus evidence maturity
      of a data-supported claim.'
    open_questions:
    - Can verification gates be expanded to detect silent failures that still escape
      domain-specific review?
    - Do automated reviewer or LLM-judge scores align with human peer review and with
      actual discovery value beyond surface paper quality?
    - Are current systems generalizable across scientific domains, base models, and
      task distributions, or are they tightly coupled to templates and environment-specific
      priors?
    - How much of the reported progress comes from the agent architecture, search
      strategy, or validation gate rather than the backbone model and task design?
    - What evidence would show that agents move from executing analyses and writing
      plausible papers to producing controlled, falsifiable, robust scientific claims?
