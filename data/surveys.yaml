  literature_review:
    line_of_work_matrix:
    - line: Systems and reproducible infrastructure
      what_it_solves: Turning large language models into end-to-end research pipelines
        that automate ideation, coding, experimentation, and manuscript writing, while
        enabling reproducibility through open-source code and artifacts. Some instantiations
        embed domain-specific verification (e.g., logic auditing in ReasFlow, physics-aware
        vision gate in AI CFD Scientist) to catch silent errors.
      what_remains_open: Inconsistent performance across runs (only one of three papers
        passed peer review in AI Scientist-v2), high cost scaling beyond simple ML
        tasks, and lack of robust safety checks for autonomous code execution. Verification
        gates still miss a fraction of failures (e.g., 2 of 16 in AI CFD Scientist).
    - line: Evaluation and evidence design
      what_it_solves: Providing standardized benchmarks and tasks (DISCOVERYWORLD,
        BAISBench) to measure AI scientist capabilities, including human performance
        baselines, so that progress can be rigorously compared across different system
        architectures.
      what_remains_open: Benchmarks cover limited domains and task types (text-based
        simulation, cell-type annotation); correlation between benchmark scores and
        real-world scientific discovery utility is unknown; full-paper generation
        evaluation is not yet standardized, and current benchmarks do not capture
        the complete research pipeline.
    consensus:
    - All systems leverage large language models as the core reasoning engine for
      scientific workflows.
    - All incorporate some form of automated quality control, whether through simulated
      review, logic verification, or physical plausibility checks.
    - All evaluate against human baselines or peer review standards to establish credibility.
    - All generate full research papers or research outputs as the final deliverable.
    disagreements:
    - 'Supervision strategy: some systems pursue full autonomy without human intervention,
      while others integrate human-in-the-loop collaboration at key decision points,
      with ablation studies showing targeted human input can outperform both full
      autonomy and exhaustive oversight.'
    - 'Verification mechanisms: domain-specific verification such as logic auditing
      or physics-aware visual gates contrasts with generic LLM-based simulated review,
      leading to different error detection coverage and failure modes.'
    - 'Evaluation target: systems are judged by peer-review acceptance, LLM-based
      scoring rubrics, or benchmark task completion, which may reward different aspects
      of scientific quality.'
    - 'Domain coverage: general-purpose agents aim for broad ML domains, while specialized
      agents target applied mathematics, CFD, and biology, embedding domain knowledge
      that generic agents lack.'
    open_questions:
    - How can verification gates be made robust enough to detect all silent failures,
      given that current physics and logic gates still miss some errors?
    - What is the optimal point of human intervention to maximize research quality
      while minimizing human effort, as suggested by targeted collaboration outperforming
      full oversight?
    - Can AI scientist systems generate truly novel hypotheses beyond interpolating
      existing knowledge, given that current benchmarks test known tasks and incremental
      improvements?
    - How do LLM-based automated review scores correlate with actual human expert
      judgments and downstream scientific impact, especially across diverse scientific
      domains?
