  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research pipelines
      what_it_solves: Automates ideation, experiment execution, analysis, and manuscript
        writing; representative systems include The AI Scientist and The AI Scientist-v2.
      what_remains_open: Peer-review success is inconsistent and mostly workshop-level;
        some systems rely on automated reviewers, and limitation details are not always
        reported.
    - line: Domain-specific discovery agents with verification gates
      what_it_solves: Adds mathematical proof checking or physics-aware vision-language
        gates to catch invalid deductions and silent solver failures in applied mathematics
        and CFD; representative systems include ReasFlow and AI CFD Scientist.
      what_remains_open: Verification gates still miss some planted failures; validation
        is narrow to specific domains, and some limitations are not reported.
    - line: Scientific discovery benchmark and evaluation environments
      what_it_solves: Creates virtual task suites or blind peer-reviewed-study tasks
        that measure complete discovery loops and evidence maturity; representative
        systems include DISCOVERYWORLD and TruthInsightBench.
      what_remains_open: Current agents plateau in scientific judgment; evidence is
        based on limited base models, and proxy scores are not yet tied to real discovery
        utility.
    - line: Reproducible system infrastructure
      what_it_solves: Turns agentic discovery workflows into runnable stacks, open-source
        artifacts, and repeatable evaluation pipelines across code, data, and task
        scoring.
      what_remains_open: Cross-hardware, cross-domain, and cross-user external validation
        remains limited; open-source coverage is uneven.
    consensus:
    - Most systems decompose scientific discovery into ideation, code or experiment
      execution, analysis, and paper generation.
    - Automated evaluation or verification is treated as essential for scaling review
      and reducing human intervention.
    - There is broad evidence that current automated agents have a gap in scientific
      judgment, especially around controls, robustness, and falsifiability.
    - Open artifacts and reproducible workflows are an emerging shared expectation,
      though coverage is uneven.
    disagreements:
    - General-purpose systems emphasize cost and fully automated iteration, while
      domain-specific systems require mathematical or physical consistency before
      accepting results.
    - 'Evaluation targets differ: LLM-based review rubrics, peer review, virtual task
      completion, and evidence-maturity scoring are not equivalent.'
    - Human involvement differs from principal investigator-student collaboration
      to fully autonomous operation, changing how much intervention and correction
      is allowed.
    - 'Success claims differ in kind: per-paper cost, benchmark score, physical error
      reduction, and peer-review acceptance are not directly comparable.'
    open_questions:
    - Can automated rubric or benchmark scores be trusted as evidence of real scientific
      novelty when evaluated agents plateau and lack controls, robustness, and falsifiability?
    - Can verification gates close the remaining silent-failure detection gap without
      being limited to narrow physics or mathematical domains?
    - Are peer-review outcomes stable enough for fully autonomous systems when only
      one of three workshop submissions passed?
    - What evidence standard should be required before claiming autonomous discovery
      across different base models, datasets, and human supervision settings?
