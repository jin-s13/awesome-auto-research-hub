  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research-agent systems
      what_it_solves: Automates hypothesis formation, code implementation, experiment
        execution, visualization, and manuscript or report generation into a repeatable
        pipeline.
      what_remains_open: Consistency of peer-level quality; claims lack systematic
        validity gates and may pass workshop review while remaining domain-limited
        or incompletely assessed.
    - line: Discovery benchmark environments
      what_it_solves: Creates task suites and blind datasets to measure open-ended
        scientific discovery through task completion, action quality, or evidence
        maturity.
      what_remains_open: Tasks and automatic metrics may not align with real scientific
        utility; coverage is limited across domains, datasets, and frozen base models.
    - line: Reliability and authority-control mechanisms
      what_it_solves: Detects silent execution or simulation failures and constrains
        agent-side changes through verification gates or deterministic authority separation.
      what_remains_open: Verification gates are imperfect, with observed missed failures;
        no standard exists for acceptable false-negative rate or external validation
        across hardware and settings.
    - line: Human-calibrated and peer-review evaluation
      what_it_solves: Anchors AI-generated claims to human expert baselines, simulated
        review, or actual peer-review outcomes.
      what_remains_open: Human baselines are small and narrow; peer review is noisy
        and only indirectly measures scientific soundness or reproducibility.
    consensus:
    - 'Closed-loop scientific work is the shared frame: generated claims should be
      traceable to executed analysis, code, or experiments.'
    - Current autonomous systems are treated as partial assistants or weak discovery
      agents, not yet reliable for fully unattended science.
    - Evaluation is shifting from raw task success toward evidence quality such as
      controls, robustness, falsifiability, and auditability.
    - Code, artifacts, and task datasets are treated as core reproducibility infrastructure
      rather than optional additions.
    disagreements:
    - 'Evaluation target differs: synthetic task completion, blind tasks from peer-reviewed
      studies, real transcriptomic data, or actual workshop peer-review acceptance.'
    - 'Reliability mechanism differs: physics-aware visual verification in simulation,
      deterministic authority separation in forecasting architecture evolution, and
      simulated LLM review in general machine learning.'
    - 'Supervision signal differs: fixed LLM judge, graduate-level human baselines,
      or external peer-review outcomes.'
    - Deployment setting differs across general ML experiments, CFD simulation, single-cell
      transcriptomics, and time-series forecasting, changing what counts as failure
      and evidence.
    open_questions:
    - Do automated LLM judges measure evidence-level scientific validity, or do they
      reward style, novelty, and textual auditability?
    - How do current findings generalize beyond a single frozen base model and the
      narrow set of scientific domains evaluated?
    - What false-negative rate is acceptable for verification gates that must catch
      silent failures in autonomous research?
    - Can deterministic authority boundaries govern agent behavior without suppressing
      legitimate but novel research directions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究智能体系统
      解决的问题: 在无需人工模板的情况下完成从假设、代码、实验到论文或报告的闭环，输出可运行与可检查的研究工件。
      尚未覆盖: 同行评审接受不稳定，主张缺乏系统性有效性门控，且尚未在特定任务之外展示稳健科学判断。
    - 路线: 发现基准环境
      解决的问题: 通过任务套件和盲数据集，以任务完成度、动作质量或证据成熟度衡量开放式科学发现。
      尚未覆盖: 任务与自动指标可能不等于真实科学效用；领域、数据集和冻结基座模型的覆盖有限。
    - 路线: 可靠性与权限控制机制
      解决的问题: 通过验证门控或确定性权限分离捕获静默执行或仿真失败，并限制智能体端修改。
      尚未覆盖: 验证门控仍有漏检；可接受的漏检率、跨硬件和设置的标准化外部验证仍未确立。
    - 路线: 人类校准与同行评审评估
      解决的问题: 用人类专家基线、模拟评审或真实同行评审结果锚定 AI 生成论文与主张的质量。
      尚未覆盖: 人类基线规模小且领域有限；同行评审噪音较大，难以作为可复现的科学性指标。
    共识:
    - 对科学工作的闭环视角趋同：生成主张应能追溯到已执行的分析、代码或实验。
    - 当前系统仍被视为部分助手或弱发现智能体，无法可靠地完全无人值守。
    - 评测重点从原始任务成功率转向证据质量：对照、稳健性、可证伪性和可审计性。
    - 代码、工件、任务数据等可复现信号被作为基础设施而不再是可选项。
    分歧:
    - 评测目标不同：合成虚拟环境中的任务完成、来自同行评审研究的盲任务、真实组学数据或真实工作坊评审接受。
    - 可靠性机制不同：CFD 中的视觉-语言物理门控、预测架构演化中的确定性权限分离、通用 ML 中的模拟评审反馈。
    - 监督信号不同：固定 LLM 裁判、研究生人类基线、同行评审结果。
    - 部署场景不同：通用 ML 微实验、CFD 仿真、单细胞转录组、时间序列预测，影响失败与证据定义。
    开放问题:
    - 自动化 LLM 评委是否测量证据级别的科学有效性，还是更偏向风格、新颖性与文本可审计性？
    - 现有结论在单个冻结基座模型和少数科学领域之外如何泛化？
    - 自主研究中用于捕获静默失败的验证门控，其漏检率应低到何种程度才可接受？
    - 确定性权限边界能否在不压制合法但新颖的研究路径的情况下治理智能体？
