  related_work_outline_zh:
  - 主流方向：当前前沿集中于构建沙盒化、证据锚定的评测环境和自动化评审器，同时补充安全、可审计与受限资源下的科研编码任务。
  - 研究共性：将科学发现建模为多步智能体循环——问题形成、实验或分析、解释与报告——并用代理指标或LLM评审比较编码智能体。
  - 关键差异：任务载体包括模拟发现、盲测同行研究数据、单卡ML编码、湿实验室机器人；目标包括任务完成、证据成熟度、问题可审计性和安全执行；接地机制包括代码库、情景记忆和轨迹级风险检查。
  - 趋势演进：可见的2024–2026前沿从完整虚拟发现循环转向证据锚定评测、可审计推理工件以及安全/经验接地的执行，2026年集中关注效度缺口与可信发现主张。
  - 开放问题：代理基准和LLM评审是否与人类领域专家及真实发现效用一致；安全与可审计约束如何影响发现质量；跨领域、跨基座模型和实验室设置的可迁移性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Discovery benchmarks and blind evaluation
      what_it_solves: Creates comparable tasks and evidence-grounded metrics for assessing
        whether agents can complete discovery cycles or infer claims from frozen data.
      what_remains_open: Domain and task coverage are limited; LLM judges or scripted
        proxies have not been shown to align with human domain experts across base
        models.
    - line: Resource-constrained ML research evaluation
      what_it_solves: Tests whether coding agents can design, implement, and train
        models from scratch under fixed compute, time, and no-internet constraints.
      what_remains_open: Only seven tasks are covered, and controlled exceptions plus
        restricted internet use may not reflect typical research workflows.
    - line: Auditable research question formation
      what_it_solves: Makes scientific problem formation explicit through structured
        artifacts recording assumptions, falsifiable hypotheses, tests, and failure-update
        rules.
      what_remains_open: Evaluation relies on LLM judges in preliminary settings;
        human domain-expert validation and evidence of downstream discovery impact
        are missing.
    - line: Grounded execution infrastructure
      what_it_solves: Provides agents with vetted code libraries or reusable execution
        experience so generated experiments are more accurate, complete, and executable.
      what_remains_open: Generalization is demonstrated mainly within one domain;
        LLM-as-judge agreement is only moderate, and external reproducibility is unverified.
    - line: Safety-aware agent control
      what_it_solves: Integrates cumulative risk tracking and trajectory-level checks
        into discovery loops, reducing composite tool-chain escapes and wet-lab safety
        incidents.
      what_remains_open: Baseline comparisons and limitation evidence are incomplete;
        safety and output-quality tradeoffs are not validated across broad domains
        or physical labs.
    consensus:
    - Scientific discovery agents are evaluated as multi-step loops that include question
      formation, experiment design or analysis, and claim generation.
    - Current agents can execute and document analyses competently, but their claims
      often lack controls, robustness, falsifiability, and cross-dataset generalization.
    - Automated evaluation is common, but LLM-based judges show only moderate agreement
      with domain experts and are not yet reliable proxies.
    - Grounding mechanisms such as vetted code libraries, episodic memory, or structured
      certificates are treated as ways to improve reliability, reproducibility, or
      safety.
    - Safety is emerging as a first-class requirement across simulated and wet-lab
      discovery settings.
    disagreements:
    - 'They optimize different outcomes: full task completion in simulated discovery,
      evidence maturity on blind tasks, end-to-end ML training quality under resource
      limits, and safe wet-lab task execution.'
    - 'Evaluation targets differ: one line uses synthetic virtual discovery tasks,
      another uses frozen peer-reviewed study data with hidden conclusions, and another
      uses constrained ML training scripts.'
    - 'Grounding strategies differ: auditability through research-question certificates,
      experience reuse through episodic memory, repository-distilled code libraries,
      and trajectory-level cumulative risk checks.'
    - Some approaches preserve safety without training, while others internalize safety
      reasoning into every agent stage, implying different assumptions about whether
      safety should be internal or external to reasoning.
    - 'Evidence quality is uneven: some papers report baselines and limitations, while
      others omit explicit baselines or rely on narrow LLM-judge evaluations.'
    open_questions:
    - Do proxy metrics from virtual or blind tasks predict real-world scientific discovery
      value or laboratory success?
    - Can LLM judges replace domain-expert evaluation when current agreement is only
      moderate?
    - Do safety and auditability constraints improve trustworthy science without suppressing
      novel but initially implausible hypotheses?
    - How do results transfer across scientific domains, base models, hardware budgets,
      and wet-lab settings?
    - Which grounding mechanism—distilled code, episodic experience, structured certificates,
      or trajectory-aware safety—is most decisive for discovery quality?
