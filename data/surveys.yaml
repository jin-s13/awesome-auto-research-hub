  related_work_outline_zh:
  - 主流方向：构建端到端自主研究智能体，以LLM驱动完整科学发现循环——假设生成、实验设计与执行、结果分析及论文撰写——并通过同行评审逐步验证其有效性。
  - 研究共性：所有系统均将发现流程分解为模块化步骤（想法生成、编码、执行、评估），依赖LLM推理与代码生成；评估通过自动评审或精心设计的基准任务完成。
