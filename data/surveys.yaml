    claims.'
  - 'Shared research pattern: Systems decompose discovery into question or hypothesis
    formation, experiment/code execution, analysis, and reporting. They use constrained
    tasks, frozen data, certificates, episodic memory, or safety loops to make agent
    behavior more observable and comparable.'
  - 'Key differences: Works differ in evaluation target—task completion, evidence
    maturity, constrained model design, or wet-lab safety—and in supervision signal—automatic
    LLM judges, expert review, execution metrics. Interaction modes range from simulated
    text and coding to repository-derived code libraries, robotics, and pipeline-stage
    safety monitors.'
  - 'Trend evolution: Available top evidence concentrates in 2024–2026: early virtual
    discovery environments are followed by evidence-grounded blind benchmarks, auditable
    question certificates, safety-aware trajectory reasoning, vetted code libraries,
    and resource-constrained coding evaluations. The span is too narrow for long-term
    trend claims.'
  - 'Open questions: Proxy metrics may not match expert utility. Agents lack controls,
    robustness, falsifiability, and cross-dataset generalization. Domain and base-model
    generalization is unproven. Safety and infrastructure evidence needs validation
    beyond limited tasks, budgets, and settings.'
  related_work_outline_zh:
  - 主流方向：科学发现智能体正被构建为多阶段LLM/编码系统，并通过专门基准、安全层和可审计机制进行评估；重点从单纯执行实验转向形成有证据、可检查且安全的研究主张。
  - 研究共性：系统普遍将发现分解为问题或假设形成、实验/代码执行、分析和报告；通过受限任务、冻结数据、证书、片段记忆或安全回路使智能体行为更可观察和可比较。
  - 关键差异：评测目标（任务完成、证据成熟度、受限模型设计、湿实验室安全）、监督信号（LLM评委、专家评审、执行指标）和交互模式（模拟文本、编码、代码库、机器人、流水线监控）各不相同。
  - 趋势演进：现有重点证据集中在2024–2026年：早期虚拟发现环境之后，出现证据锚定盲测、可审计问题证书、安全感知轨迹推理、经筛选代码库和资源受限编码评测；时间跨度较窄，只能说明当前前沿内的趋势。
  - 开放问题：代理指标未必匹配专家效用；智能体缺乏对照、稳健性、可证伪性和跨数据集泛化；领域与基座模型泛化尚未证明；安全与基础设施证据需要在有限任务、预算和设置之外验证。
  literature_review:
    line_of_work_matrix:
    - line: Scientific discovery benchmarking and evidence-grounded evaluation
      what_it_solves: Creates tasks and metrics for comparing agents on complete discovery
        cycles or open-ended evidence-based claims, using simulated environments,
        blind peer-reviewed tasks, constrained ML tasks, and automatic judges.
      what_remains_open: Proxy metrics and LLM judges may not align with expert utility;
        task and domain coverage is limited; generalization across base models and
        beyond single benchmark settings is unproven.
    - line: Auditable question formation and safety-aware reasoning
      what_it_solves: Structures research questions, hypotheses, assumptions, and
        pipeline-stage risk states into explicit artifacts or reasoning loops so agent
        decisions can be checked and unsafe tool chains can be caught.
      what_remains_open: Reliance on LLM judges or reported task sets rather than
        human experts; limited evidence that artifact completeness or safety checks
        generalize across domains, tool chains, and deployment settings.
    - line: Scientific coding and experimental infrastructure
      what_it_solves: Provides agents with runnable code libraries or constrained
        end-to-end ML coding tasks, aiming to improve experiment quality, implementation
        ability, and resource/time management.
      what_remains_open: Evaluation is narrow in domain or task count; generated code
        soundness and resource constraints do not yet cover real-world scientific
        complexity or external hardware validation.
    - line: Experience-driven and embodied lab agents
      what_it_solves: Uses episodic memory, online perception, planning, safety validation,
        and trajectory distillation for closed-loop wet-lab or embodied task execution
        without training.
      what_remains_open: Results are limited to specific robotic and text tasks; limitations
        and external replications are not fully reported; long-term safety, scalability,
        and cross-hardware reliability remain open.
    consensus:
    - Current systems model scientific discovery as a sequential workflow rather than
      an isolated answer, and evaluate the workflow through task completion, evidence
      maturity, safety, or execution success.
    - Automated evaluation is seen as necessary for scaling, but its reliability depends
      on alignment with domain-expert judgment.
    - Across evaluated systems, agents execute and document work competently but still
      lack the discriminating scientific behaviors needed for trustworthy claims.
    - Auditability and safety are increasingly treated as first-class components rather
      than post-hoc checks.
    disagreements:
    - 'Evaluation targets differ: some test completion of simulated discovery tasks,
      others judge whether a claim is supported by frozen peer-review data, and others
      test end-to-end ML training under resource constraints.'
    - 'Supervision differs: some use automatic LLM-judge rubrics, while others use
      task-completion metrics, expert review, execution success, or safety-gate intercepts.'
    - 'Interaction modes differ: simulated text-only or visually overlaid science
      environments, repository-derived code libraries, robotics/wet-lab action loops,
      and code-only model design tasks constrain agents in different ways.'
    - Deployment domains and constraints differ across materials science, wet-lab
      robotics, ML coding, and multi-domain text tasks, leaving transferability unclear.
    open_questions:
    - Can automatic LLM-judge and proxy metrics be shown to track domain-expert and
      real scientific decision utility across broader domains and base models?
    - What mechanisms would make agents reliably produce controls, robustness checks,
      falsifiable hypotheses, and cross-dataset generalization rather than only competent
      analysis?
    - How well do safety reasoning and experience-evolution methods transfer beyond
      robotic solution preparation and text tasks to broader tool chains and hardware
      settings?
    - What task coverage and constraints are sufficient to represent open-ended scientific
      discovery without overfitting to limited simulated or frozen-data tasks?
