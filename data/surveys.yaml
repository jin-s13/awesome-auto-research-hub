    研究路线矩阵:
    - 路线: 端到端自主研究系统设计
      解决的问题: 将孤立的模型想法转化为可运行的流水线，覆盖构思、代码实现、实验执行和论文撰写，实现全自动或几乎无需监督的论文产出。
      尚未覆盖: 在非机器学习科学领域的跨领域泛化，对生成代码或结论中静默错误的鲁棒性，以及在真实研究环境下的标准化外部验证。
    - 路线: 科学发现智能体的评估与基准设计
      解决的问题: 提供任务、指标和环境，使 AI 科学家的表现具有可比性，揭示智能体是否真正进行新颖推理而非仅记忆模式。
      尚未覆盖: 覆盖多样科学学科；代理指标（任务完成率、自动评审分数）与实际科学贡献之间的一致性；复杂发现任务的人类基线校准。
    - 路线: 人机协作与自主性校准
      解决的问题: 组织不同的交互模式（首席研究员–研究生、按需干预、完全自主），并识别人类输入最能提升研究质量的决策点。
      尚未覆盖: 所提出的协作分类法能否预测下游研究成功仍缺乏实证证据；跨任务和领域的最优分工尚未量化。
    共识:
    - 所有系统都将科学发现周期分解为一系列阶段——假设生成、实验设计、执行、分析和写作——并以大语言模型作为核心推理和规划组件。
    - 研究者普遍认为原始大语言模型输出不足以产生可信的研究；每个现代系统都包含某种形式的验证，无论是通过自动评审、逻辑一致性检查还是基于物理的验证。
    - 评估正从未经验证的生成论文转向客观基准和真实同行评审，表明衡量进展的标准正在成熟。
