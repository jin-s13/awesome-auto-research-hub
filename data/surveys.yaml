  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous discovery pipelines
      what_it_solves: Generate ideas, run experiments, analyze results, and produce
        manuscripts as a full research loop, reducing human labor and per-paper cost.
      what_remains_open: Acceptance rates are inconsistent and validation is often
        workshop-level or LLM-judged; external human validity is not fully demonstrated.
    - line: Domain-specific AI scientist systems with validity gates
      what_it_solves: Adapt autonomous discovery to applied mathematics and computational
        fluid dynamics by adding logic verification or physics-aware visual checks.
      what_remains_open: Verification gates can miss planted silent failures; evidence
        is limited to specific solvers or domains and a small number of generated
        papers.
    - line: Virtual discovery environments and task suites
      what_it_solves: Provide controllable open-ended tasks for complete discovery
        cycles and measure task completion, relevant actions, and explanatory knowledge.
      what_remains_open: Strong baselines still struggle, with limited evidence on
        generalization to unseen tasks or real-world discovery utility.
    - line: Evidence-grounded evaluation benchmarks
      what_it_solves: Hide source conclusions and score evidentiary maturity from
        data claims using fixed LLM judges and blinded peer-reviewed tasks.
      what_remains_open: Results are based on one frozen base model; agents plateau
        and lack controls, robustness, falsifiability, and cross-dataset generalization.
    - line: Automated review and iterative revision loops
      what_it_solves: Use simulated reviewer or vision-language feedback to score
        generated papers and refine figures or manuscripts.
      what_remains_open: Automated review only partially aligns with human judgment;
        pass rates remain low and unstable across submissions.
    consensus:
    - Autonomous scientific discovery needs idea generation coupled with executable
      experiment and analysis loops, not text generation alone.
    - Automated evaluation is necessary for scaling assessment, using LLM judges,
      task completion metrics, or blinded evidence tasks.
    - Current systems are stronger at producing plausible, well-documented analyses
      than at establishing trustworthy claims such as controls, robustness, and falsifiability.
    - Generic coding agents lack science-specific failure detection, motivating domain-specific
      verification gates.
    disagreements:
    - 'Evaluation target differs: generated-manuscript scores, evidence maturity from
      data claims, or task completion in a virtual discovery environment.'
    - 'Domain scope differs: open-ended ML discovery versus constrained formal mathematics
      or computational fluid dynamics with injected logic or physics checks.'
    - 'Verification mechanism differs: internal logical coherence review, vision-language
      inspection of rendered flow fields, or benchmark-based evidence grading.'
    - 'Supervision and interaction mode differs: some systems are framed as human-Principal-Investigator
      and AI-graduate-student collaboration, while others pursue fully automated discovery.'
    open_questions:
    - Do evidence-grounded benchmark scores transfer across different base models
      and scientific domains?
    - Which verification gates catch silent failures outside pre-planted or domain-specific
      failure modes?
    - Can automated reviewers or LLM judges align with human scientific utility and
      reproducibility assessment?
    - How do these systems perform in external, uncurated discovery tasks beyond workshop-level
      or benchmark settings?
