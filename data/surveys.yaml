  related_work_outline_zh:
  - 主流方向：构建能够通过标准化基准、自动评审和故障分析进行评估的自主AI研究系统，重心从宣称性能转向审计可靠性。
  - 研究共性：所有工作都试图自动化科学过程的某些阶段，并内置评估机制，但在评估对象（论文、发现、任务完成）和评估方式（人工评审、物理验证、指标驱动）上存在差异。
  - 关键差异：部分系统致力于大规模端到端论文生成，另一些专注于特定领域的物理验证或基于环境的基准测试，还有一条路线通过因果归因诊断和纠正故障模式。
  - 趋势演进：从2024年的概念验证框架，逐步发展到2025-2026年可复现评估基础设施、明确的失败分类和自校正方法，表明重点正从生成能力转向可靠性。
  - 开放问题：评估代理指标与真实科学效用之间的一致性尚未验证；失败分析的泛化性超出案例研究仍未知；自主研究中幻觉和错误归因的治理尚未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research systems
      what_it_solves: Automating the full scientific workflow from idea generation
        and experiment execution to manuscript writing, with embedded evaluation via
        automated reviewers, physics verification gates, or human expert judgment.
      what_remains_open: Reliance on proxy metrics risks optimizing for surface plausibility
        rather than genuine discovery; external validation across diverse domains
        and hardware remains absent; the systems often lack mechanisms to detect and
        correct their own silent failures.
    - line: Benchmarks and evaluation environments for AI scientists
      what_it_solves: Providing standardized tasks, metrics, and human baselines to
        compare the capabilities of different AI research agents, covering multiple
        scientific domains and difficulty levels.
      what_remains_open: Whether the constructed tasks capture the full complexity
        of real-world scientific discovery is uncertain; the gap between task completion
        scores and long-term scientific impact is not measured; performance on these
        benchmarks may not transfer to open-ended research.
    - line: Reliability diagnosis and self-correction
      what_it_solves: Identifying recurring failure modes in autonomous research pipelines
        and proposing design principles or structured failure attribution methods
        to improve output trustworthiness and experimental robustness.
      what_remains_open: Analyses are based on a small number of case studies, limiting
        generalizability; self-correction mechanisms may introduce new biases or overfitting
        to the diagnostic process; the boundary between recoverable failures and irrecoverable
        scientific errors is not defined.
    consensus:
    - Autonomous research systems must be evaluated beyond simple task completion,
      incorporating checks for scientific validity, reproducibility, and robustness
      against silent errors.
    - Evaluation infrastructure is moving from ad-hoc internal judgments to standardized
      benchmarks and automated or human-anchored scoring rubrics.
    - Failure analysis is recognized as a necessary complement to system building,
      but current analyses remain preliminary and lack broad coverage.
    disagreements:
    - 'Evaluation modality differs: simulated AI review, domain-specific physics verification,
      human expert panels, and task-based metrics each emphasize different aspects
      of scientific quality.'
    - System architecture varies from single-agent pipelines to multi-agent teams,
      and from fully autonomous operation to human-in-the-loop monitoring, reflecting
      different assumptions about where human oversight is critical.
    - The target of evaluation ranges from the generated paper's acceptability to
      the correctness of the underlying discovery process, leading to inconsistent
      definition of what constitutes a successful AI scientist.
    open_questions:
    - How can we design evaluation metrics that align with long-term scientific contribution
      rather than short-term proxy scores, and validate this alignment empirically?
    - Under what conditions do the failure modes identified in small-scale studies
      generalize to broader domains, and how can we build self-correction that does
      not introduce new, harder-to-detect errors?
    - What governance mechanisms are needed to ensure that autonomous research outputs
      are trustworthy, given that current systems can generate plausible but incorrect
      claims that bypass automated checks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究系统
      解决的问题: 将科学发现的全流程自动化，从想法生成、实验执行到论文撰写，并通过自动审稿人、物理验证门控或人类专家判断进行内置评估。
      尚未覆盖: 依赖代理指标可能导致表面优化而非真实发现；跨领域和跨硬件的外部验证仍缺失；系统通常缺乏检测和纠正自身静默失败的能力。
    - 路线: 面向AI科学家的基准测试与评估环境
      解决的问题: 提供标准化任务、指标和人类基线，以比较不同AI研究智能体的能力，覆盖多个科学领域和难度级别。
      尚未覆盖: 构建的任务是否捕捉了真实世界科学发现的全部复杂性尚不确定；任务完成分数与长期科学影响之间的差距未被测量；这些基准上的表现可能无法迁移到开放式研究中。
    - 路线: 可靠性诊断与自我纠正
      解决的问题: 识别自主研究流程中反复出现的故障模式，并提出设计原则或结构化失败归因方法，以提高输出的可信度和实验鲁棒性。
      尚未覆盖: 分析基于少量案例，泛化性有限；自我纠正机制可能引入新的偏差或对诊断过程的过拟合；可恢复失败与不可恢复科学错误之间的边界尚未定义。
    共识:
    - 评估自主研究系统不能仅依赖任务完成度，必须纳入对科学有效性、可复现性和静默错误鲁棒性的检查。
    - 评估基础设施正从临时内部判断转向标准化基准和自动化或锚定于人类的评分规则。
    - 失败分析被公认为系统构建的必要补充，但当前分析仍处于初步阶段，覆盖范围有限。
    分歧:
    - 评估模态不同：模拟AI评审、领域特定物理验证、人类专家小组和基于任务的指标各自强调科学质量的不同侧面。
    - 系统架构从单智能体管道到多智能体团队，从完全自主操作到人机协同监控，反映了对人类监督应置于何处假设的不同。
    - 评估目标从生成论文的可接受性到基础发现过程的正确性，导致对何为成功AI科学家的定义不一致。
    开放问题:
    - 如何设计评估指标使其与长期科学贡献而非短期代理分数对齐，并对该对齐进行实证验证？
    - 小规模研究中识别的失败模式在何种条件下可泛化到更广泛的领域，如何构建不会引入新的、更难检测错误的自我纠正机制？
    - 鉴于当前系统能生成看似合理但通过自动检查的错误主张，需要何种治理机制来确保自主研究输出的可信度？
