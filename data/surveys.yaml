  related_work_outline_zh:
  - 主流方向：基于LLM的自主研究写作流水线，从想法生成、实验执行到论文撰写和评审，并逐步延伸到应用数学、计算流体动力学等专门领域。
  - 研究共性：多数系统将科研写作分解为构思、实现、实验、验证和手稿生成等阶段，并引入有效性门控、失败处理、事实约束或人机监督来提高可辩护性。
  - 关键差异：自主程度、验证类型、评测目标、领域范围与自校正深度不同；有的追求端到端全自动，有的强调高杠杆人类干预。
  - 趋势演进：证据显示从2024年较通用的自动科研框架，到2025年首个AI生成工作坊论文通过同行评审，再到2025-2026年域感知验证、自校正与人机协作。
  - 开放问题：验证门控能否跨领域泛化、LLM评分与真实同行评审是否一致、哪些人类介入点效果最好、长时程可靠性如何，以及自动科研写作的可复现标准。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research and manuscript generation
      what_it_solves: Going from a prompt or topic to a complete paper by automating
        research idea selection, implementation, experiment execution, visualization,
        writing, and sometimes simulated review.
      what_remains_open: Consistency and quality beyond constrained domains or workshop
        settings; many end-to-end attempts still fail during implementation or evaluation.
    - line: Verification and evidence-grounded reporting
      what_it_solves: Reducing hallucinated results, citations, or invalid claims
        by checking logical coherence, physical validity, and whether reported values
        match measured outputs before human inspection.
      what_remains_open: Generalizing domain-specific verification to new tasks and
        catching all silent failures; current gates still miss some injected errors.
    - line: Failure attribution and self-correction
      what_it_solves: Diagnosing why an experiment or paper draft failed and routing
        the correction to the right level such as hypothesis, experimental design,
        or implementation.
      what_remains_open: Long-horizon memory degradation, premature success claims,
        and whether attribution mechanisms transfer to unfamiliar research domains.
    - line: Human-AI collaboration and oversight
      what_it_solves: Placing human expertise at high-leverage decision points to
        balance the speed of autonomous agents with expert judgment and reduce costly
        cascading errors.
      what_remains_open: Which intervention points generalize across tasks, and whether
        collaboration improves final scientific quality rather than only pipeline
        success metrics.
    - line: Evaluation and benchmarking of AI research writing
      what_it_solves: Making generated research comparable through automated review
        rubrics, acceptance thresholds, benchmark success rates, artifact quality
        scores, and domain-specific metrics.
      what_remains_open: The gap between proxy review rubrics and real peer-review
        decision utility, plus limited diversity of tasks and domains in existing
        benchmarks.
    consensus:
    - LLM-based agents can cover major research-writing stages such as ideation, implementation,
      experimentation, drafting, and review, but they generally require additional
      verification and failure handling to produce defensible output.
    - Evidence-grounded verification improves trust by auditing logic, physical validity,
      citation support, or measured numbers, thereby reducing hallucinated content
      in generated manuscripts.
    - Fully autonomous research writing remains inconsistent; peer-review acceptance
      or end-to-end success is reported as a minority outcome or within limited settings.
    - LLM-based review scores and benchmark metrics are common but should be treated
      as proxy evidence for scientific quality, separate from reproducibility, robustness,
      and human evaluation.
    disagreements:
    - 'Interaction mode differs: some systems aim for fully automated manuscript generation
      with simulated review, while others insert structured human collaboration or
      targeted expert intervention at high-leverage points.'
    - 'Evaluation targets differ: one line optimizes complete manuscript quality,
      another targets task-specific domain improvements, and another focuses on process
      success rates or artifact quality.'
    - 'Verification mechanisms differ: internal logical/proof audits, vision-language
      physics gates, grounded citation/value reporting, multi-hypothesis failure attribution,
      and structured debate are used in different systems.'
    - 'Domain scope differs: some pipelines target general machine-learning writing,
      while others focus on applied mathematics or computational fluid dynamics discovery-to-writing
      workflows.'
    - 'Self-correction depth differs: single reflection, structured debate, multi-hypothesis
      failure attribution, and cross-run learning provide different levels of diagnostic
      and corrective capacity.'
    open_questions:
    - Can current verification gates maintain scientific validity outside the domains
      and task distributions used for demonstration?
    - Which evaluation signals align with human peer review and real research utility,
      rather than only LLM rubric thresholds or benchmark scores?
    - Which human intervention points improve correctness without reintroducing excessive
      manual effort or idiosyncratic reviewer bias?
    - How can long-horizon research-writing systems avoid memory degradation, implementation
      drift, and premature claims of success after clear failures?
    - What standard artifacts, datasets, and external validation conditions are needed
      to reproduce autonomous research-writing pipelines across environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主研究写作流水线
      解决的问题: 从提示或主题自动生成完整论文，包括研究想法、实现、实验、可视化、文字撰写和可能的模拟评审。
      尚未覆盖: 在受限领域或工作坊之外的稳定性和质量；许多端到端尝试仍在实现或评测阶段失败。
    - 路线: 验证与证据约束写作
      解决的问题: 通过检查逻辑一致性、物理有效性，以及报告数值是否来自实际测量，减少幻觉结果、引用或无效结论。
      尚未覆盖: 验证机制跨领域推广并捕获所有静默失败；当前门控仍会遗漏部分植入错误。
    - 路线: 失败归因与自校正
      解决的问题: 诊断实验或论文草稿失败的原因，并将修正定位到假设、实验设计或实现等正确层面。
      尚未覆盖: 长时程记忆退化、过早宣称成功，以及归因机制能否迁移到陌生研究领域。
    - 路线: 人机协作与专家监督
      解决的问题: 在高杠杆决策点引入人类判断，平衡自主智能体的效率与专家知识，降低级联错误风险。
      尚未覆盖: 哪些介入点能跨任务泛化，以及人机协作是否提升最终论文科学质量而不仅是流程成功率。
    - 路线: AI研究写作评测与基准
      解决的问题: 通过自动评审评分、接受阈值、基准成功率、工件质量分和领域指标，比较生成研究的质量。
      尚未覆盖: 代理评审分数与真实同行评审决策效用之间存在差距，现有任务和领域覆盖仍有限。
    共识:
    - 基于LLM的智能体可以覆盖研究写作的主要阶段，但通常需要额外的验证和失败处理才能产生可辩护输出。
    - 证据约束验证通过审计逻辑、物理有效性、引用支持或测量数字，有助于减少生成手稿中的幻觉内容。
    - 完全自主的研究写作仍不稳定；通过同行评审或端到端成功完成的情况往往是少数，或仅限于较受控场景。
    - LLM评审分数和基准指标应被视为科学质量的代理证据，需要与可复现性、鲁棒性和人类评估分开看待。
    分歧:
    - 交互模式不同：一些系统追求全自动手稿生成与模拟评审，另一些在高杠杆决策点引入结构化人类协作或目标干预。
    - 评测目标不同：有的优化完整论文质量，有的关注领域任务改进，有的聚焦流程成功率或工件质量。
    - 验证机制不同：分别采用逻辑证明审计、视觉-语言物理门控、引用/数值约束、多假设失败归因或结构化辩论。
    - 领域范围不同：部分流水线面向通用机器学习写作，部分面向应用数学或计算流体动力学的发现到写作流程。
    - 自校正深度不同：单次反思、结构化辩论、多假设失败归因和跨运行学习提供了不同级别的诊断和纠正能力。
    开放问题:
    - 当前验证门控能否在展示域之外和不同任务分布下保持科学有效性？
    - 哪些评测信号与人类同行评审和实际研究效用一致，而不仅与LLM评分阈值或基准分数一致？
    - 哪些人类介入点能提高正确性，而不会引入过多人工成本或主观评审偏差？
    - 长时程研究写作系统如何避免记忆退化、实现漂移和面对明显失败时的过早成功宣称？
    - 需要什么标准工件、数据集和外部验证条件，才能使自动研究写作流水线跨硬件和环境可复现？
