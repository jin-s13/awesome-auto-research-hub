  literature_review:
    line_of_work_matrix:
    - line: Literature search and evidence grounding
      what_it_solves: Transforms natural language queries into cited evidence by planning
        subqueries, executing live literature database searches, and extracting passages
        for downstream agents.
      what_remains_open: Whether citation F1 and expert-agreement gains transfer beyond
        life-sciences/biomedical retrieval and whether the knowledge layer's code
        and data can be externally reused.
    - line: Multi-agent and iterative review generation
      what_it_solves: Automates literature review drafting by decomposing the task
        into outlining, writing, editing, reviewing, or iterative refinement to improve
        readability and citation quality.
      what_remains_open: Evaluation relies partly on proprietary ScienceDirect data
        and similarity to human reviews; limitations are not reported, so boundary
        conditions remain unverified.
    - line: Evaluation and certification for review agents
      what_it_solves: Creates controllable evaluation conditions and benchmarks to
        test whether biomedical literature-review agent comparisons are admissible
        rather than misleading.
      what_remains_open: The packet lacks detailed benchmark construction, metrics,
        and key results, leaving coverage and real-world decision utility unverified.
    - line: Hierarchical literature organization support
      what_it_solves: Supports literature review by organizing scientific studies
        into LLM-assisted hierarchical structures for downstream synthesis.
      what_remains_open: No methodology or results are available in the packet; reproducibility
        signals are limited, so effectiveness cannot be assessed.
    - line: Integrated AI scientist framing
      what_it_solves: Frames literature and broader scientific work as components
        of an integrated agent that proposes hypotheses, runs experiments, and revises
        beliefs.
      what_remains_open: Component integration remains the central unsolved problem;
        no quantitative evaluation is provided in the survey evidence.
    consensus:
    - LLM-based orchestration is central for decomposing literature tasks into retrieval,
      extraction, organization, writing, or evaluation steps.
    - Citation quality and source grounding are common evaluation objectives across
      retrieval and generation settings.
    - Multi-step pipelines or specialized roles improve structured literature outputs
      over single-step generation.
    - Integration of components and external validity remain unresolved rather than
      solved.
    disagreements:
    - 'Systems optimize different targets: evidence retrieval and citation precision
      versus full review readability and writing quality versus adversarial fairness
      of leaderboard comparisons.'
    - 'Evaluation settings differ: task-specific benchmarks such as ScholarQABench
      and LitQA2, human-review similarity, expert agreement, and controlled leaderboard
      certification are not interchangeable.'
    - 'Interaction mode differs: some systems expose knowledge layers for downstream
      agents, while others directly generate reviews or certify evaluation methods.'
    - 'Scope differs: narrow literature tasks are treated in isolation by some work,
      while broader AI scientist framing treats literature as one component of scientific
      discovery.'
    open_questions:
    - How can retrieval, synthesis, and verification be unified in one agent without
      losing citation provenance or introducing unsupported claims?
    - 'Which evaluation signals best predict real literature review utility: citation
      F1, expert agreement, similarity to human reviews, or leaderboard admissibility?'
    - Do reported gains replicate beyond curated life-sciences/biomedical benchmarks
      and proprietary ScienceDirect data?
    - What assumptions about query distribution and domain-specific terminology limit
      deployment of current knowledge layers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 文献检索与证据溯源
      解决的问题: 通过规划子查询、执行实时文献库搜索和抽取片段，将自然语言查询转化为带引用的证据。
      尚未覆盖: 引用F1和专家一致性提升能否在生命科学/生物医学之外的领域复现，知识层的代码与数据能否外部复用仍未证实。
    - 路线: 多智能体与迭代综述生成
      解决的问题: 将文献综述撰写分解为大纲、写作、编辑、审阅或迭代细化，提高可读性与引用质量。
      尚未覆盖: 部分评估依赖专有ScienceDirect数据和与人类综述的相似度，且未报告局限性，边界条件尚未验证。
    - 路线: 综述智能体的评测与认证
      解决的问题: 建立可控评测条件与基准，判断生物医学文献综述智能体的排行榜比较是否可采纳。
      尚未覆盖: 证据包缺少基准构建、指标和关键结果细节，覆盖范围与真实决策效用无法确认。
    - 路线: 层级化文献组织支持
      解决的问题: 以LLM辅助的层级结构组织科学研究，为文献综述提供支撑。
      尚未覆盖: 证据包中没有方法或结果信息，可复现信号有限，效果无法评估。
    - 路线: 整合型AI科学家框架
      解决的问题: 将文献工作与更广泛科学流程置于一个提出假设、执行实验并修正信念的整合智能体中。
      尚未覆盖: 组件集成仍是核心未解决问题；综述证据中没有定量评估。
    共识:
    - LLM编排是多个系统的核心，用于把文献任务分解为检索、抽取、组织、写作或评测步骤。
    - 引用质量与来源证据是多条路线共同强调的评估目标。
    - 多步管线或专门角色能改善结构化文献输出，优于单步生成。
    - 组件集成和外部有效性仍然悬而未决。
    分歧:
    - 不同系统优化不同目标：证据检索与引用精确性、完整综述可读性与写作质量、排行榜比较的公平认证。
    - 评估设置不同：ScholarQABench、LitQA2、人类综述相似度、专家一致性和可控排行榜认证之间不可互换。
    - 交互模式不同：一些系统为下游智能体提供知识层，另一些直接生成综述或认证评测方法。
    - 范围不同：部分工作仅处理狭义文献任务，而广义AI科学家框架将文献视为科学发现的一个组件。
    开放问题:
    - 如何在一个智能体中统一检索、综合与验证，同时不丢失引用来源或引入无依据论断？
    - 哪种评估信号最能预测真实文献综述效用：引用F1、专家一致性、与人类综述的相似度，还是排行榜可采纳性？
    - 报告的性能提升能否在精选生命科学/生物医学基准和专有ScienceDirect数据之外复现？
    - 当前知识层对查询分布和领域术语的假设会在哪些部署场景中限制其效果？
