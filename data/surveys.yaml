    - line: Interactive multi-agent research infrastructure
      what_it_solves: supporting human-monitored team orchestration, code and dataset
        integration, rollback, and artifact inspection
      what_remains_open: small internal case-study evaluations; maturity and generalization
        beyond AI workflow settings are unproven
    consensus:
    - LLM agents can generate plausible experimental artifacts and manage multi-step
      research workflows.
    - Automated review or LLM-based judging has become a common evaluation shortcut,
      but its validity still depends on alignment with human judgment.
    - Explicit verification, tree search, or failure-aware memory improves over naive
      single-pass research agents.
    - Current systems remain below human reliability on open-ended scientific discovery
      and experimental planning.
    disagreements:
    - 'Evaluation target differs: some systems optimize full-paper acceptance, while
