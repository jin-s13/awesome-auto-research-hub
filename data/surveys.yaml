      解决的问题: 把人类监督配置在高杠杆决策点，而不是全手动或全自主。
      尚未覆盖: 不同学科和任务长度下的最优干预模式尚未建立。
    - 路线: 自动评审与评测
      解决的问题: 提供可扩展的LLM/VLM评分，包括评估准则、接受阈值和盲评比较。
      尚未覆盖: 与人类同行评审的一致性以及对严谨理论、实证和领域特定工作的覆盖仍不完整。
    - 路线: 失败分析与设计原则
      解决的问题: 把失败的自主运行转化为可复现失败模式、归因机制和系统设计指导。
      尚未覆盖: 这些设计分类是否能预测下游成功并提升工件质量仍缺乏直接实证验证。
    共识:
    - 端到端流水线现在将实验执行与手稿起草和评审耦合，已不再是孤立文本生成。
    - 验证和实证报告被视为可信生成论文的必要机制，而非可选附加项。
    - 自动LLM/VLM评审或评分准则被用作可扩展评测代理，并经常与人类接受阈值或盲评分数比较。
    - 选择性人类监督能提升稳健性，完全自主在不同运行中的表现仍不一致。
    - 开源代码或工件等可复现信号存在但不均衡，尤其是在专有或领域特定设置中。
    分歧:
    - 监督层级不同：完全自主、结构化人机干预以及PI-研究生式协作。
    - 验证锚点不同：逻辑/定理审计、视觉-语言物理门控、数值与引用实证报告、因果失败归因针对不同失败模式。
    - 评测目标不同：接受阈值、评分准则、基准成功率、工件质量与盲评分数难以直接比较。
    - 领域范围不同：通用机器学习系统与应用数学、计算流体动力学系统在是否嵌入领域知识/验证上存在差异。
    - 能力报告不同：有的报告工作坊级同行评审接收，有的只报告评分或基准提升，会议级泛化尚未解决。
    开放问题:
    - LLM/VLM评审与人类同行评审在狭义工作坊或评分准则之外的领域一致性如何？
    - 哪些验证机制能捕捉当前门控漏掉的静默失败，例如一项研究中16个植入失败中的2个？
