    研究路线矩阵:
    - 路线: 留出迁移与闭环发现评测
      解决的问题: 检验智能体选择的建模、特征、表示或训练数据变化能否在未见评估数据上成立，以及能否更节约地分配高保真查询。
      尚未覆盖: 收益是否在测试的Matbench端点或合成设置之外持续，以及oracle查询成本、鲁棒性和所选干预的可靠性如何扩展。
    - 路线: 操作经验与技能复用
      解决的问题: 将过去实验轨迹或GitHub仓库转化为可复用技能和经验，使研究智能体无需重复昂贵实验即可做出更好决策。
      尚未覆盖: 跨领域迁移与明确失效模式证据有限；可用文本中工件覆盖、指标可比性和局限说明记录不全。
    - 路线: 长程状态管理与递归规划
      解决的问题: 通过让持久研究状态位于智能体消息之外，并增量扩展或压缩任务计划，避免上下文膨胀、重复工作和停滞。
      尚未覆盖: 多类架构的方法自身局限性说明稀疏，除选定开源骨干或基准族之外的泛化性仍验证不足。
    - 路线: 深度研究的强化学习与信用分配
      解决的问题: 利用过程级或拓扑奖励改进证据收集、计划扩展、答案审计和长程研究行为，而非仅依赖最终答案。
      尚未覆盖: 训练数据质量和稳定性在报告基准之外仍不清晰；RL相对架构或基座模型的独立贡献未完全建立。
    - 路线: 预测信用与解释基准评测
      解决的问题: 通过前瞻预测和预注册检查，测量科学解释或上下文记录是否比描述或匹配来源背景带来决策价值。
      尚未覆盖: 自然解释的信用在测试分辨率下仍不确定；代理指标和来源粒度可能与真实实验效用不一致。
    共识:
    - 自主研究智能体的主张越来越多地通过留出任务或多套件基准来检验，而不是仅靠演示。
    - 高效闭环搜索取决于高保真反馈的时机；仅改善全局代理拟合未必降低决策相关遗憾。
    - 将持久研究状态与对话上下文分离，并复用经过验证的知识或技能，能改善长程研究效率。
    - 被评估系统通常优于同基座或同预算基线，但收益高度依赖所选基准族和指标。
    - 证据包中的可复现证据不完整：许多记录缺少OpenAlex标识符，代码、数据集或局限信号常缺失，应视为验证缺口而非不存在。
    分歧:
    - 评估领域不同：材料发现使用Matbench端点；ML工程使用MLE-bench、PaperBench、FrontierCS、PassNet等；深度研究使用BrowseComp-Plus、GAIA和xbench-DeepSearch。
    - 知识来源不同：有的将仓库知识提炼为技能，有的将实验轨迹积累为经验库，还有的在智能体循环内维护压缩证据状态。
    - 监督方式不同：部分智能体通过强化学习训练规划或审计，另一些系统在现有证据中表现为编排式或技能型LLM智能体，未说明RL训练。
    - 智能体组织不同：设计包括递归自改进循环、DAG编排、无状态角色工作器，以及带代理或留出反馈的闭环发现。
    - 主要评测目标不同：解释的预测信用、基准Pass@1或准确率、留出性质误差、oracle查询成本在不同工作中权重不同。
    开放问题:
    - 在十个Matbench端点上观察到的留出迁移收益，能否扩展到更广泛的科学与工程领域？
    - 在保持最大风险或准确性表现的同时，能多大程度降低oracle查询成本，并跨工作流和智能体基座维持？
    - 需要何种评估粒度或来源分辨率，才能确证自然科学解释的预测信用？
    - 技能库和经验库在未见研究领域、新工具栈和不同基座模型上的迁移性如何？
    - 哪些基准代理指标最能对应真实研究效用？缺失代码、数据、基线和局限说明应如何报告以支持复现？
