  related_work_outline:
  - 'Mainstream direction: Autonomous and semi-autonomous agentic workflows are being
    applied to literature synthesis, paper reading, manuscript drafting, and claim
    verification, often with retrieval, internal verification, and LLM-based evaluation.'
  - 'Shared research pattern: Systems decompose scientific/literature work into stages
    such as retrieval, synthesis, reasoning, verification, and generation, then score
    outputs with LLM judges or human baselines.'
  - 'Key differences: Evaluation targets range from generated manuscript quality and
    blind evidence maturity to domain discovery questions and failure-mode analysis;
    supervision varies from human-as-PI collaboration to automated judges.'
  - 'Trend evolution: Within the 2025-2026 frontier, work is moving from standalone
    agent demonstrations toward standardized evaluation suites, self-evolving frameworks,
    and explicit failure analyses.'
  - 'Open questions: Whether LLM judges align with human peer review, whether results
    generalize across base models and domains, and where improvements come from retrieval,
    verification, or underlying model capabilities.'
  related_work_outline_zh:
  - 主流方向：自主或半自主智能体工作流被用于文献综合、论文阅读、研究手稿撰写与主张验证，常结合检索、内部验证和LLM评测。
  - 研究共性：系统把科学/文献工作分解为检索、综合、推理、验证、生成等阶段，并用LLM评委或人类基线对输出打分。
  - 关键差异：评测目标从生成手稿质量、盲测证据成熟度到领域发现问答和失败模式分析不等；监督方式从人类PI协作到自动评委各异。
  - 趋势演进：在2025-2026前沿内，工作从单体智能体演示转向标准化评测套件、自演化框架和显式失败分析。
  - 开放问题：LLM评委是否与人类同行评审一致，结果能否跨基座模型和领域泛化，以及检索、验证或底层模型能力各贡献多少提升。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous literature-to-manuscript synthesis with retrieval and verification
      what_it_solves: Generating full research drafts that integrate literature synthesis,
        reasoning, theorem or experiment writing, and verification while reducing
        expert intervention.
      what_remains_open: Evaluation relies on a curated LLM-based review rubric; open
        code, dataset, and external human peer review are not evidenced, and domain
        scope is narrow.
    - line: Evidence-grounded evaluation for open-ended claim generation
      what_it_solves: Measures whether agents can derive defensible claims from blinded
        data and prior studies using automated evidentiary-maturity scoring.
      what_remains_open: Only one frozen base model is used; LLM-judge alignment with
        human judgment and transfer across domains are unverified, and agents lack
        controls, robustness, and falsifiability.
    - line: Domain-specific AI-scientist evaluation with human baselines
      what_it_solves: Compares AI scientists with graduate-level humans on real omics
        data for annotation and multiple-choice discovery from published studies.
      what_remains_open: Tasks focus on multiple-choice or annotation rather than
        full literature search and gap discovery; fully autonomous biological discovery
        remains out of reach.
    - line: Survey synthesis and taxonomy of agentic scientific discovery
      what_it_solves: Organizes systems, frameworks, datasets, metrics, and challenges
        such as literature review automation across chemistry, biology, and materials
        science.
      what_remains_open: Survey reproducibility is low; categories are descriptive
        and lack direct empirical validation that they predict system reliability
        or discovery quality.
    - line: Failure analysis and design-principle extraction for autonomous research
        agents
      what_it_solves: Documents recurring failure modes in end-to-end ML research
        attempts and derives design principles for more robust AI-scientist systems.
      what_remains_open: Evidence is a small case series with only one successful
        pipeline, so failure-mode coverage and generalizability beyond ML research
        are not established.
    consensus:
    - Multiple-agent or multi-stage LLM systems are framed as scientific collaborators
      that search, synthesize, verify, and draft, rather than isolated retrieval or
      summarization tools.
    - Evaluation increasingly uses LLM-based scoring and human baselines, but all
      evidence reports a gap between current agents and trustworthy scientific or
      literature judgment.
    - Verification, retrieval, and self-correction are repeatedly identified as necessary
      stages for reducing errors and improving evidence quality.
    - Literature review automation remains explicitly unresolved, with systems either
      performing it as a narrow stage or evaluating only downstream claim quality.
    disagreements:
    - 'Evaluation target differs: some systems are judged on generated manuscript
      quality, others on evidentiary maturity of claims, and others on domain-specific
      multiple-choice discovery tasks.'
    - 'Supervision and human role differ: one setup uses a human principal investigator
      collaborating with an agent, while others use automated LLM judges, human/multi-AI
      review, or graduate-level human baselines.'
    - 'Interaction mode differs: end-to-end manuscript generation contrasts with task-focused
      claim validation and failure-case analysis.'
    - 'Representation of scientific contribution differs: some systems treat literature
      synthesis as an integrated stage in a broader discovery loop, while others isolate
      it as a survey or taxonomy objective.'
    - 'Deployment setting differs: theory-driven applied mathematics, data-driven
      single-cell biology, and ML research pipelines stress different evidence types
      and review standards.'
    open_questions:
    - Do LLM-based review rubrics and automated judges align with human peer-review
      decisions for literature synthesis and research gap discovery?
    - How do current agentic literature workflows generalize across base models, languages,
      and scientific domains when reported results rest on single frozen models or
      narrow datasets?
    - What is the separate contribution of retrieval, verification, self-evolution,
      and controller quality to improved literature understanding versus final manuscript
      scores?
    - Which metrics capture citation correctness, source grounding, and evidence auditability
      without rewarding fluent but unsupported summaries?
    - Can evaluation move beyond multiple-choice or blinded downstream tasks to directly
      test literature search recall, survey completeness, and gap discovery?
    - Public code, dataset, and reviewer links are inconsistently reported; which
      systems can be independently replicated remains a verification gap.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带检索与验证的自动文献到稿件生成
      解决的问题: 整合文献综合、推理、定理或实验写作与验证，降低专家干预，产出研究初稿。
      尚未覆盖: 评测依赖人工设计的LLM评审标准；代码、数据集和外部人工同行评审证据不足，领域范围较窄。
    - 路线: 面向开放主张生成的证据基础评测
      解决的问题: 通过盲任务和自动证据成熟度评分，衡量智能体能否从冻结数据与已有研究中得出可支持结论。
      尚未覆盖: 仅使用单一冻结基座模型；LLM评委与人类判断一致性未验证；智能体缺乏对照、稳健性和可证伪性。
    - 路线: 带人类基线的领域科学智能体评测
      解决的问题: 在真实组学数据上，将AI科学家与研究生水平人类进行细胞注释和基于已发表研究的发现能力比较。
      尚未覆盖: 任务偏选择题或注释，未直接覆盖全文文献检索和差距发现；全自主生物学发现仍未实现。
    - 路线: 智能体科学发现的综述与分类
      解决的问题: 整理跨化学、生物学、材料科学的系统、框架、数据集、指标和文献综述自动化等挑战。
      尚未覆盖: 可复现性证据较少；分类为描述性，缺乏对系统可靠性或发现质量预测能力的实证验证。
    - 路线: 自主研究智能体的失败分析与设计原则
      解决的问题: 记录端到端机器学习研究尝试中的重复失败模式，并提炼更稳健AI科学系统的设计原则。
      尚未覆盖: 案例样本量小且仅有一次成功，失败模式覆盖和跨领域泛化未建立。
    共识:
    - 多智能体或多阶段LLM系统被构建为科学协作体，承担检索、综合、验证和起草，而非孤立检索或摘要工具。
    - 评测越来越多采用LLM评分和人类基线，但所有证据都显示当前智能体仍缺乏可信科学或文献判断力。
    - 验证、检索和自我纠正被反复视为减少错误、改善证据质量的关键阶段。
    - 文献综述自动化仍被明确列为未解决问题，现有系统或将其作为狭窄环节，或只评测下游主张质量。
    分歧:
    - 评测目标不同：有的系统按生成稿件质量评分，有的按主张证据成熟度评分，有的按领域选择题发现任务评分。
    - 监督和人类角色不同：一种设置采用人类首席研究员与智能体协作，另一些采用自动LLM评委、人类/多AI评审或研究生级人类基线。
    - 交互模式不同：端到端稿件生成与任务聚焦的主张验证、失败案例分析形成对比。
    - 科学贡献表示不同：有的把文献综合作为更广泛发现循环中的集成阶段，有的将其作为综述/分类对象单列。
    - 部署场景不同：理论驱动的应用数学、数据驱动的单细胞生物学和机器学习研究流水线强调不同证据类型与评审标准。
    开放问题:
    - LLM评审标准和自动评委是否与人类同行评审在文献综合与研究差距发现上保持一致？
    - 当前结果依赖单一冻结模型或狭窄数据集时，智能体文献工作流如何跨基座模型、语言和科学领域泛化？
    - 检索、验证、自演化和控制器质量分别对文献理解与最终稿件分数贡献多少？
    - 哪些指标能衡量引用正确性、来源基础和证据可审计性，而不奖励流利但无依据的摘要？
    - 评测能否超越选择题或盲测下游任务，直接检验文献检索召回、综述完整性和差距发现？
    - 公开代码、数据集和评审链接报告不一致，哪些系统可被独立复现仍是验证缺口。
