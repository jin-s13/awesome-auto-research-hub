  related_work_outline:
  - 'Mainstream direction: The field is coalescing around autonomous research agents
    that generate hypotheses, run experiments, and produce claims, with a parallel
    push toward benchmarked evaluation and automated reliability checks.'
  - 'Shared research pattern: Most systems pair LLM-driven open-ended search with
    executable code or simulation, then score outputs through tasks, rubrics, review,
    or domain metrics rather than only reporting model-level outputs.'
  - 'Key differences: Work divides by evaluation target—synthetic discovery tasks,
    blind real-data scientific claims, peer-reviewable manuscripts, or task-specific
    architecture search—and by reliability mechanism, such as physics-aware gates,
    simulated review, or deterministic authority separation.'
  - 'Trend evolution: The visible 2024–2026 frontier moves from general open-ended
    discovery frameworks and synthetic benchmarks toward domain-specific, evidence-grounded
    evaluation with judges, verification gates, and human baselines.'
  - 'Open questions: Whether automated judges align with actual scientific utility,
    how verification gates generalize, and whether agents can reliably perform controls,
    robustness checks, and falsification remain unresolved.'
  related_work_outline_zh:
  - 主流方向：研究集中在自主科研智能体与配套基准/自动评审，用于生成假设、执行实验并产出科学主张。
  - 研究共性：多数工作将LLM驱动的开放式搜索与可执行代码/仿真结合，并通过任务、评分量表、评审或领域指标衡量结果。
  - 关键差异：评测对象不同，如合成发现任务、真实数据盲任务、可评审论文或任务特定架构搜索；可靠性机制也不同，如物理感知门控、模拟评审或确定性权威分离。
  - 趋势演进：可见的2024–2026前沿由通用开放发现框架和合成基准，转向领域特定、基于证据的评测，结合自动裁判、验证门控和人类基线。
  - 开放问题：自动裁判是否与真实科学效用一致、验证门控如何跨域泛化、智能体能否稳定完成对照、稳健性与可证伪检验仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: Evaluation and evidence design
      what_it_solves: Makes autonomous discovery claims comparable via task suites,
        expert or LLM rubrics, human baselines, and blind data splits that separate
        discovery from reproduction.
      what_remains_open: Judge or rubric validity across domains, metric alignment
        with real scientific utility, and stability across base models are not established.
    - line: Scientific discovery task construction
      what_it_solves: Creates controlled and diverse tasks for complete discovery
        cycles, including hypothesis formation, experimentation, analysis, and conclusion.
      what_remains_open: Synthetic tasks may not capture real-data evidence standards,
        while real-data benchmarks are still limited to one frozen base model or one
        domain.
    - line: Autonomous research systems and reproducible infrastructure
      what_it_solves: Converts isolated agent ideas into runnable workflows that implement
        hypotheses, execute code or simulation, and store scores, code, or papers.
      what_remains_open: Standardized external validation across domains, hardware,
        datasets, and user settings is limited; visible systems still show inconsistent
        success or narrow deployment.
    - line: Verification, control, and governance mechanisms
      what_it_solves: Reduces silent failures and over-claiming through physics-aware
        gates, simulated review, rubric judges, or deterministic authority separation
        over edits and promotion.
      what_remains_open: No single mechanism catches all failures; gates miss planted
        failures, peer-review success is partial, and authority separation is shown
        only in narrow forecasting cases.
    consensus:
    - Autonomous research agents can now execute analysis, code, and writing workflows
      with useful productivity, but their scientific judgment remains incomplete.
    - Evaluation has shifted from model-level metrics toward task completion, evidence
      maturity, human baselines, or peer-review acceptance, making claims more comparable.
    - Verification gates, automated judges, and authority separation are treated as
      necessary because unverified generated claims can be indefensible.
    - Current systems show competence in execution and documentation but consistently
      lack discriminating scientific behaviors such as controls, robustness, and falsifiability.
    disagreements:
    - 'Evaluation target differs: synthetic virtual discovery cycles versus blind
      real-data claims versus peer-reviewable manuscripts versus task-specific architecture
      search.'
    - 'Reliability mechanism differs: physics-aware visual verification versus simulated
      or VLM review versus deterministic authority separation versus rubric-based
      LLM judging.'
    - 'Supervision signal differs: domain-specific physical error or benchmark performance
      versus human expert baseline comparison versus acceptance thresholds versus
      evidence-maturity score.'
    - 'Deployment scope differs: general ML exploration versus specific physical,
      omics, or forecasting settings, which changes what counts as sufficient evidence.'
    open_questions:
    - How well do automated rubric judges or reviewers track long-term scientific
      value and real decision utility across domains?
    - Can verification gates and authority separation be validated externally rather
      than only on the single task or frozen base model shown?
    - What interventions would move agents from competent execution to robust controls,
      falsifiability, and cross-dataset generalization?
    - How should evaluation handle the gap between workshop-level acceptance, benchmark
      plateau, and full conference or publication-level reliability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 评测与证据设计
      解决的问题: 通过任务集、专家或LLM评分量表、人类基线和盲数据切分，让自主科研主张具备可比性，并将发现与复现区分开。
      尚未覆盖: 评分器或量表在跨领域时的效度、指标与真实科学效用的一致性、以及跨基座模型的稳定性尚未建立。
    - 路线: 科学发现任务构建
      解决的问题: 构建受控且多样化的完整发现循环任务，包括提出假设、实验、分析和结论。
      尚未覆盖: 合成任务可能无法反映真实数据证据标准；真实数据基准仍受单一冻结基座模型或单一领域限制。
    - 路线: 自主科研系统与可复现基础设施
      解决的问题: 将单点智能体想法转化为可运行流程，能实现假设、执行代码或仿真，并保存分数、代码或论文。
      尚未覆盖: 跨领域、硬件、数据集和用户设置的标准化外部验证有限；可见系统成功不稳定或部署场景较窄。
    - 路线: 验证、控制与治理机制
      解决的问题: 通过物理感知门控、模拟评审、评分量规或对编辑和晋升的确定性权威分离，减少静默失败和过度主张。
      尚未覆盖: 没有单一机制能捕获所有失败；门控会漏检，同行评审仅部分通过，权威分离只在较窄的预测场景展示。
    共识:
    - 自主科研智能体已能执行分析、代码和写作流程并体现一定效率，但科学判断仍不完整。
    - 评测正从模型级指标转向任务完成、证据成熟度、人类基线或同行评审接受度，使主张更具可比性。
    - 验证门控、自动裁判和权威分离被普遍视为必要，因为未经核验的生成式主张可能不可辩护。
    - 当前系统在执行和文档记录上较稳定，但普遍缺乏对照、稳健性、可证伪性等判别性科学行为。
    分歧:
    - 评测目标不同：合成虚拟发现循环、真实数据盲任务、可评审论文或任务特定架构搜索。
    - 可靠性机制不同：物理感知视觉验证、模拟或VLM评审、确定性权威分离、基于评分量规的LLM裁判。
    - 监督信号不同：领域物理误差或基准性能、人类专家基线比较、接受阈值、证据成熟度分数。
    - 部署范围不同：通用机器学习探索或具体物理、组学、预测场景，导致对充分证据的标准不同。
    开放问题:
    - 自动评分量表或评审器能否跨领域跟踪长期科学价值和真实决策效用？
    - 验证门控与权威分离能否在单一任务或冻结基座模型之外得到外部验证？
    - 哪些干预能让智能体从熟练执行走向稳健对照、可证伪性和跨数据集泛化？
    - 如何衡量工作坊级接受、基准平台期与完整会议或出版级可靠性之间的差距？
