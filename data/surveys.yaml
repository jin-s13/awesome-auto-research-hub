  literature_review:
    line_of_work_matrix:
    - line: Retrieval and evidence grounding for literature agents
      what_it_solves: Converts natural-language queries into cited evidence from live
        literature databases and supports downstream synthesis, claim verification,
        and open-domain QA.
      what_remains_open: Cross-domain coverage and agreement between retrieval metrics
        and real review trustworthiness remain underevidenced.
    - line: Multi-agent and iterative review generation
      what_it_solves: Automates review writing by decomposing outlining, subsection
        writing, editing, and reviewing into specialized agents or iterative passes.
      what_remains_open: Visible evidence is limited to specific review datasets;
        retrieval quality in uncontrolled settings and scalability need further validation.
    - line: Hierarchical organization and survey structuring
      what_it_solves: Organizes scientific studies into hierarchical structures to
        reduce cognitive load before full review generation.
      what_remains_open: No evaluation evidence is visible in the packet, so the effect
        on final review quality is a verification gap.
    - line: Evaluation and certification of review agents
      what_it_solves: Defines benchmark conditions under which biomedical literature-review
        agent comparisons are admissible and controllable.
      what_remains_open: What a leaderboard can certify beyond narrow biomedical settings
        and whether compositional controllability transfers to other domains remains
        open.
    - line: Integrated AI scientist framing
      what_it_solves: Places literature work within broader autonomous scientific
        discovery, from hypothesis and experiment to revised belief.
      what_remains_open: Integration across components remains the central unsolved
        problem, with no quantitative review-specific results visible in the packet.
    consensus:
    - Grounding in literature databases improves citation-level metrics compared with
      less anchored retrieval.
    - Decomposing literature review into retrieval, planning, writing, and reviewing
      steps is a common surrogate for the human review workflow.
    - Evaluation relies on citation quality, writing quality, expert agreement, or
      similarity to human reviews, but no single shared metric has emerged.
    disagreements:
    - 'System bottleneck differs: some focus on live evidence retrieval, others on
      multi-agent generation quality, and others on benchmark admissibility.'
    - 'Interaction mode differs: single-LLM orchestration over a database, separate
      specialized agents, or iterative generation passes.'
    - 'Evaluation target differs: citation F1 and expert agreement for claim verification,
      writing and citation quality for generated reviews, and controllability for
      leaderboard comparisons.'
    - 'Deployment setting differs: open-domain or life-science literature, biomedical
      review benchmarks, and broader scientific discovery narratives.'
    open_questions:
    - Which metrics predict whether a generated literature review is actually useful
      to a researcher?
    - Can iterative or hierarchical review workflows scale outside narrow life-science
      and biomedical corpora?
    - How should leaderboard comparisons be adjusted when retrieval, model, and evaluation
      conditions are not compositionally controlled?
    - What evidence is needed to close the integration gap between retrieval, generation,
      and verification in reproducible systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 文献检索与证据锚定
