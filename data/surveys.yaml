  related_work_outline_zh:
  - 主流方向：自主多智能体AI研究流水线，通过文献搜索、数据分析和实验执行的迭代循环生成、检验并优化假设，并在高杠杆决策点引入人工监督。
  - 研究共性：将科学发现组织为“假设形成—代码或实验执行—结果解释—记忆/状态更新”的闭环；多个系统加入可追溯推理、结果验证或树状搜索以提高长周期研究的可检查性。
  - 关键差异：控制结构包括结构化辩论、研究树、共享世界状态和代码解释器工具；监督方式从完全自主到精准人机协作和实验室在环；评测对象涵盖ARC-Bench、LABBench2、方程发现任务和真实实验验证。
  - 趋势演进：证据集中在2025–2026年，趋势处于当前前沿内：从综述式梳理和单循环系统，转向多智能体、长周期、共享状态、人工协作以及更难基准（如LABBench2）。
  - 开放问题：系统能否拒绝弱假设，代理基准与实际发现效用是否一致，最低人工监督量是多少，以及准确率、可追溯性和规模能否超出已测周期与狭窄领域，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous hypothesis generation and iterative refinement
      what_it_solves: Produces candidate hypotheses and updates them using literature,
        data analysis, and experimental feedback in a closed loop.
      what_remains_open: Weak-direction rejection, provenance preservation, and reliability
        across unseen topics beyond tested benchmark settings.
    - line: Structured state and knowledge sharing
      what_it_solves: Enables literature and data-analysis agents to coordinate coherent
        long-horizon research through shared world state or structured research trees.
      what_remains_open: Whether shared state remains accurate and traceable beyond
        tested cycles, and whether statement-level errors are bounded.
    - line: Human-in-the-loop and domain-conditioned autonomy
      what_it_solves: Combines autonomous execution with targeted human intervention
        to improve reliability in structured, executable research settings.
      what_remains_open: Which intervention modes transfer across embodied, delayed,
        heterogeneous, ethical, or institutionally accountable contexts.
    - line: Benchmark and evidence design
      what_it_solves: Makes agentic research capabilities comparable through task
        suites, baselines, difficulty changes, and public evaluation harnesses.
      what_remains_open: Coverage across diverse scientific domains and alignment
        between proxy accuracy and real-world research utility.
    - line: Structured search and optimization within research workflows
      what_it_solves: Organizes hypothesis exploration through branching, backtracking,
        evolutionary starting points, or code-level equation optimization.
      what_remains_open: How much gain comes from search structure versus underlying
        models, executors, or task-specific tools is not isolated.
    consensus:
    - Autonomous discovery systems converge on iterative hypothesis generation, execution,
      interpretation, and refinement rather than single-step proposal.
    - Coordinating literature search and data analysis through shared state or structured
      workflows is treated as important for long-horizon research.
    - Targeted human collaboration can outperform both full autonomy and exhaustive
      step-by-step oversight.
    - Traceable reporting, verification, and public benchmarks are used to reduce
      hallucinated citations or fabricated results and to compare systems.
    - 'Autonomy is domain-conditioned: systems are more credible in structured, executable,
      and rapidly verifiable settings.'
    disagreements:
    - 'Control structure differs: structured debate, tree-based branching/backtracking,
      shared world state, and code-interpreter tool use distribute hypothesis generation
      and execution differently.'
    - 'Supervision differs: some systems run fully autonomously, others insert human
      intervention at high-leverage decision points, and others use lab-in-the-loop
      experimental validation.'
    - 'Evaluation differs: broad research benchmarks, biology task suites, equation
      discovery datasets, and real-world biological validation provide different notions
      of success.'
    - 'Verification differs: some emphasize statement-level traceability and verifiable
      reporting, while others emphasize benchmark gains or experimental mechanism
      evidence.'
    - 'Attribution of improvement is unresolved: gains may come from search structures,
      shared state, human feedback, code execution, or task-specific tools, but evidence
      does not consistently isolate the source.'
    open_questions:
    - How can systems reject weak or false hypotheses outside benchmark topics and
      avoid persisting in low-value research directions?
    - Do proxy benchmarks such as ARC-Bench and LABBench2 track real-world scientific
      discovery utility and downstream experimental success?
    - What is the minimum human oversight needed to preserve reliability, provenance,
      and accountability without sacrificing autonomous long-horizon discovery?
    - How do accuracy, traceability, and valuable-finding scaling behave beyond the
      tested cycles and narrow domain settings?
    - Can structured state, search, and verification mechanisms generalize to embodied,
      delayed, heterogeneous, ethical, or institutionally constrained research contexts?
    - Given uneven code and artifact availability across the packet, how much of the
      reported performance can be independently reproduced?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自主假设生成与迭代优化
      解决的问题: 利用文献、数据分析和实验反馈闭环生成并更新候选假设。
      尚未覆盖: 弱方向拒绝、来源保持，以及超出已测基准的未见主题可靠性。
    - 路线: 结构化状态与知识共享
      解决的问题: 通过共享世界状态或研究树，让文献搜索与数据分析智能体协调长周期研究。
      尚未覆盖: 共享状态在已测周期之外是否保持准确和可追溯，陈述级错误是否有界。
    - 路线: 人在回路与领域条件化自主
      解决的问题: 将自主执行与精准人工干预结合，提升结构化、可执行研究环境中的可靠性。
      尚未覆盖: 哪些干预模式可迁移到具身、延迟、异构、伦理或机构问责场景。
    - 路线: 基准与证据设计
      解决的问题: 通过任务套件、基线、难度变化和公开评测工具，使智能体研究能力可比。
      尚未覆盖: 多样科学领域覆盖，以及代理指标与实际研究效用之间的一致性。
    - 路线: 研究工作流中的结构化搜索与优化
      解决的问题: 通过分支、回溯、进化起点或代码级方程优化组织假设探索。
      尚未覆盖: 性能提升有多少来自搜索结构，而非底层模型、执行器或任务特定工具尚未隔离。
    共识:
    - 自主发现系统正在汇聚到“假设生成—执行—解释—优化”的迭代闭环，而不是单步提出假设。
    - 通过共享状态或结构化工作流协调文献搜索与数据分析，被视为长周期研究的重要机制。
    - 精准的人机协作可以优于完全自主或逐步监督。
    - 可追溯报告、结果验证和公开基准被用来降低虚假引用或伪造结果，并实现系统比较。
    - 自主性是领域条件化的：在结构化、可执行、可快速验证的场景中更可信。
    分歧:
    - 控制结构不同：结构化辩论、树状分支与回溯、共享世界状态、代码解释器工具在假设生成和执行中的分配不同。
    - 监督方式不同：有的完全自主，有的在高杠杆决策点引入人工，有的采用实验室在环实验验证。
    - 评测目标不同：通用研究基准、生物学任务套件、方程发现数据集和真实生物验证提供不同的成功定义。
    - 验证侧重不同：一些系统强调陈述级可追溯和可验证报告，另一些强调基准提升或实验机制证据。
    - 提升来源尚未隔离：增益可能来自搜索结构、共享状态、人工反馈、代码执行或任务特定工具，证据未能一致拆分。
    开放问题:
    - 系统如何在基准主题之外拒绝弱假设或错误假设，并避免持续投入低价值研究方向？
    - ARC-Bench、LABBench2等代理基准是否与真实科学发现效用和下游实验成功一致？
    - 在保持可靠性、来源和问责的同时，最少需要多少人工监督？
    - 准确率、可追溯性和有价值发现的规模在超出已测周期和狭窄领域后如何变化？
    - 结构化状态、搜索和验证机制能否泛化到具身、延迟、异构、伦理或机构约束的研究场景？
    - 考虑到证据包中代码和工件可用性不均，报告的性能有多少能被独立复现？
