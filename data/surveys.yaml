  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主手稿生成
      解决的问题: 将原始研究目标转化为假设、实验、结果和完整论文，减少人工干预。
      尚未覆盖: 生成的论文能否在研讨会或特定领域之外稳定被录用仍不确定；不同投稿结果不一致。
    - 路线: 验证与有效性门控
      解决的问题: 在结论进入手稿前发现逻辑、物理、数值或引用错误。
      尚未覆盖: 领域专用检查仍会漏掉植入的静默失败，且未必能跨领域迁移。
    - 路线: 人机协作研究流程
      解决的问题: 把人工干预放在高杠杆决策点而非逐步监督，从而提高基准表现。
      尚未覆盖: 哪些干预点可泛化以及专家负担仍不明确。
    - 路线: 自纠正失败归因
      解决的问题: 将实验失败归因到假设、设计或实现层，并路由到正确干预层级。
      尚未覆盖: 会议就绪写作和长程科学推理仍未解决。
    - 路线: 评测与审稿基础设施
      解决的问题: 通过自动评审、同行评审和基准比较生成论文与工件。
      尚未覆盖: 代理指标、盲评分与人工录用之间的一致性仍不完整。
    - 路线: 失败模式分类与设计原则
      解决的问题: 整理重复失败模式以指导更稳健的自主研究系统设计。
      尚未覆盖: 这些分类能否预测不同领域的系统行为仍缺乏直接验证。
    共识:
    - 自主研究系统正在收敛为模块化阶段：构思、实现、执行、分析、验证和论文起草。
    - 仅靠原始LLM生成不够；需要有效性门控、验证循环或事实约束报告来防止虚假数字和无效结论。
    - 自动评审或LLM评分可接近人类判断，但仍需外部同行评审或领域检查来强化有效性。
    - 较新系统把失败当作信息，加入自纠正或高杠杆人机协作，而不是完全自主循环。
    分歧:
    - 交互模式不同：全自动端到端生成与定向人机协作。
    - 验证对象不同：逻辑一致性与LLM评审、领域物理或视觉门控、可验证数值报告。
    - 评测证据不同：LLM评分、研讨会同行录用、基准成功率、盲审分数或失败案例分析。
    - 领域范围不同：通用机器学习流水线与应用数学、计算流体动力学或特定基准主题集。
    开放问题:
    - 自动审稿评分能否跨领域预测人类会议或研讨会录用，尤其当AI生成投稿出现不一的同行评审结果时？
    - 领域特定有效性门控如何泛化而不继承漏检率，例如十六个植入静默失败中漏掉了两个？
    - 归因引导的自纠正是否改善长程科学写作，还是主要集中在代码与实验执行输出？
    - 在减少专家负担的同时，维持研究质量所需的最少人工干预是什么？
