  related_work_outline:
  - 'Mainstream direction: Autonomous multi-agent research pipelines that propose
    hypotheses, execute experiments, and verify/report findings in a loop. Example
    systems such as AI CFD Scientist and AutoResearchClaw emphasize verification gates,
    self-correction, and human-in-the-loop control rather than isolated idea generation.'
  - 'Shared research pattern: LLM-based agents decompose research into ideation, execution,
    verification, and writing stages; several add reporting constraints or formal
    checks to reduce hallucinated numbers and silent failures.'
  - 'Key differences: Verification mechanism ranges from physics-aware visual inspection
    to formal proof audits and grounded reporting; domain scope spans specialized
    CFD/omics/causal inference and domain-agnostic frameworks; human involvement varies
    from dashboard oversight to targeted intervention modes.'
  - 'Trend evolution: 2025 work establishes surveys and benchmarks for AI scientists,
    while 2026 shifts toward self-evolving, formally grounded, and interactive research
    teams. The evidence window is too short to show longer-term evolution.'
  - 'Open questions: Are current verification gates reliable across domains? Do benchmark
    gains or expert-preference wins transfer to real scientific discovery? Where should
    humans intervene? Can formal checks guarantee faithful scientific claims?'
  related_work_outline_zh:
  - 主流方向：构建自主多智能体研究流水线，在循环中提出假设、执行实验并验证或报告结果。AI CFD Scientist、AutoResearchClaw 等示例强调验证门控、自我纠正和人机闭环控制，而非孤立的想法生成。
  - 研究共性：基于 LLM 的智能体把研究分解为构思、执行、验证和写作阶段；若干系统加入报告约束或形式化检查，以减少幻觉数字和静默失败。
  - 关键差异：验证机制从物理感知视觉检查到形式化证明审计和基于实测值的报告不等；领域范围覆盖专用 CFD/组学/因果推断与领域无关框架；人员参与从仪表板监督到精准干预模式差异明显。
  - 趋势演进：2025 年工作建立 AI 科学家的综述与基准，2026 年转向自演化、形式化基础和交互式研究团队。证据时间跨度过短，只能说明当前前沿内部趋势。
  - 开放问题：当前验证门控在不同领域是否足够可靠？基准分数或专家偏好增益能否转化为真实科学发现？人类应在哪些决策点介入？形式化检查能否保证科学主张忠实？
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific autonomous discovery with verification gates
      what_it_solves: 'Executing closed-loop hypothesis search in a scientific simulator
        and using domain-specific verification to reject invalid results before they
        enter conclusions; example: computational fluid dynamics correction search.'
      what_remains_open: The verification gate still misses some planted silent failures
        in the ablation, and the approach is coupled to one simulation environment.
    - line: Multi-agent collaborative research with human oversight
      what_it_solves: Coordinating ideation, execution, reporting, and recovery across
        agents; adding human interventions at high-leverage decision points improves
        robustness over full autonomy and step-by-step oversight.
      what_remains_open: Evaluated on a limited topic benchmark and five internal
        AI case studies, leaving generalization and maturity unclear.
    - line: Self-correcting and self-evolving experimentation
      what_it_solves: Attributing experiment failures to hypothesis, design, or implementation
        causes; accumulating knowledge and refining hypotheses across cycles to improve
        success rates and artifact quality.
      what_remains_open: Conference-ready scientific writing and fully autonomous
        paper generation remain unsolved; quantitative gains are concentrated in code
        development and execution.
    - line: Formal proof-grounded theoretical ideation
      what_it_solves: Generating and machine-checking formal results for theoretical
        domains such as causal inference, with statement audits to align formal theorems
        with informal claims.
      what_remains_open: Machine-checked proofs only guarantee correctness under formal
        assumptions; final artifacts still require human inspection and lack reported
        quantitative metrics.
    - line: Benchmarks and surveys of AI scientists
      what_it_solves: Establishing task suites, human baselines, metric definitions,
        and taxonomy for comparing AI scientists across scientific discovery tasks.
      what_remains_open: Current systems fall short of fully autonomous discovery
        on real omics data; surveys identify unresolved literature automation, reliability,
        and ethical concerns.
    consensus:
    - Multiple systems split scientific work into hypothesis generation, execution,
      verification, and reporting rather than generating ideas in isolation.
    - Verification and reporting constraints are treated as necessary to suppress
      silent failures, fabricated numbers, and hallucinated citations.
    - Targeted human collaboration at decisive points can outperform both fully autonomous
      operation and exhaustive oversight.
    - Evaluation is moving toward task success, artifact quality, and expert preference
      rather than idea novelty alone.
    disagreements:
    - 'Verification differs by representation: physics-aware visual inspection of
      rendered fields, formal machine-checked proofs, statement audits, grounded reporting
      from measured values, or multi-hypothesis failure attribution.'
    - 'Deployment setting differs: some systems are tied to a specific simulator or
      scientific domain, while others aim to be domain-agnostic foundational frameworks.'
    - 'Supervision mode differs: dashboard-monitored interactive teams, seven-mode
      human-in-the-loop control, targeted human intervention, or largely autonomous
      formal pipelines.'
    - 'Evaluation target differs: benchmark score improvement, expert-preference judgments
      on case studies, artifact inspection from autonomous runs, or survey-derived
      challenge coverage.'
    open_questions:
    - Can current verification and proof audits detect enough silent failures or formalization
      gaps to make autonomous conclusions trustworthy?
    - Do improvements on benchmark scores, expert preference, or artifact quality
      transfer to real scientific utility?
    - What is the minimum human oversight needed when current case studies are small
      and domain-specific?
    - How can domain-specific verification gates be generalized without losing validity?
    - Can autonomous systems produce defensible scientific writing and conference-ready
      papers beyond improved code execution metrics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域专用自主发现与验证门控
      解决的问题: 在科学仿真器中执行闭环假设搜索，并用领域特定验证在无效结果进入结论前进行过滤；例如计算流体动力学修正搜索。
      尚未覆盖: 验证门控仍会漏掉部分植入的静默失败，且方法高度耦合于单一仿真环境。
    - 路线: 多智能体协作研究与人类监督
      解决的问题: 协调多个智能体完成构思、执行、报告和恢复；在高杠杆决策点加入人类干预，效果好于完全自主和逐步监督。
      尚未覆盖: 仅在一个主题基准和五个内部 AI 案例上评估，泛化性与成熟度仍不明确。
    - 路线: 自我纠正与自我演化实验
      解决的问题: 将实验失败归因到假设、设计或实现层面；在多个周期中积累知识并优化假设，从而提高成功率和工件质量。
      尚未覆盖: 可提交会议的科研写作和完全自主论文生成仍未解决；量化提升集中在代码开发与执行。
    - 路线: 形式化证明驱动理论构思
      解决的问题: 在因果推断等理论领域生成结果并用证明助手进行机器检查，通过陈述审计对齐形式定理与非形式主张。
      尚未覆盖: 机器证明仅在形式假设下保证正确性；最终产物仍需人工审查，且缺少报告的定量指标。
    - 路线: AI 科学家的基准与综述
      解决的问题: 建立任务套件、人类基线、指标定义和分类体系，用于跨任务比较 AI 科学家。
      尚未覆盖: 当前系统在真实组学数据上尚未达到完全自主发现；综述指出文献自动化、可靠性和伦理问题仍未解决。
    共识:
    - 多个系统把科学工作拆分为假设生成、执行、验证和报告，而不是孤立地生成想法。
    - 验证和报告约束被视为抑制静默失败、伪造数字和幻觉引文的必要机制。
    - 在高杠杆决策点进行精准人类协作，可优于完全自主和逐步监督。
