        missed 2 of 16 silent failures); transfer to other domains is untested; these
        systems require expert-crafted verification which may not be available for
        new problems.
    - line: Evaluation benchmarks and environments
      what_it_solves: Providing standardized tasks and metrics (e.g., DISCOVERYWORLD's
        120 tasks, BAISBench's cell annotation and multiple-choice questions) to compare
        AI scientist capabilities and expose weaknesses against human baselines.
      what_remains_open: Benchmarks may not capture the full complexity of real-world
        discovery; human baselines are limited (e.g., six graduate students for BAISBench);
        no single benchmark covers both experimental and theoretical science.
    - line: Human-AI collaboration and verification mechanisms
      what_it_solves: Improving output quality by inserting human judgment at high-leverage
        decision points or using structured debate, self-healing execution, and verifiable
        reporting to prevent fabricated results.
      what_remains_open: Optimal collaboration mode is task-dependent; ablation studies
        show targeted intervention outperforms full autonomy but may not scale to
        all domains; verification against hallucinated citations and numbers is still
        evolving.
    consensus:
    - All systems adopt LLM-based multi-agent or pipeline architectures to automate
      parts of the scientific workflow from ideation to writing.
    - 'Verification is universally recognized as critical, but its implementation
      varies widely: simulated review, internal logic audit, physics-based visual
      checks, or benchmark evaluations.'
    - Current AI scientists show promise but cannot yet match the reliability and
      depth of a fully autonomous human researcher; they are best positioned as augmenting
      tools.
    disagreements:
    - 'Generic vs. domain-specific: The AI Scientist and AI Scientist-v2 strive for
      domain-agnostic autonomy, while ReasFlow and AI CFD Scientist argue that domain-specific
      verification gates are necessary for producing defensible claims.'
    - 'Evaluation method: Some systems rely on automated reviewer scores, others use
      task benchmarks (DISCOVERYWORLD, BAISBench), and AI Scientist-v2 uses real peer
      review as the ultimate test—leading to different standards of success.'
    - 'Role of human input: AutoResearchClaw demonstrates that targeted human collaboration
      outperforms full autonomy, whereas The AI Scientist and ReasFlow emphasize minimizing
      human intervention, revealing a tension between autonomy and reliability.'
    open_questions:
    - How can verification gates be made robust enough to handle the diversity of
      silent failures, given that even domain-specific gates miss some errors?
    - To what extent can frameworks trained on one scientific domain (e.g., CFD, applied
      math) generalize to others without re-engineering the verification logic?
    - Are current benchmark tasks and automated reviewer scores aligned with the long-term
      epistemic value of scientific discoveries, and how should we validate that alignment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端自主发现框架
      解决的问题: 自动化完整研究周期——构思、代码编写、实验执行、可视化和论文撰写——以最少的人工输入生成完整手稿。
      尚未覆盖: 可靠性不稳定（如AI Scientist-v2仅1/3通过同行评审）；验证依赖模拟评审或内部检查，其失效模式未充分表征；目前仅达到工作坊级别接受。
    - 路线: 领域特定的AI科学家
      解决的问题: 嵌入领域知识（如数学中的逻辑验证、CFD中的物理感知视觉-语言门控），以捕捉通用框架遗漏的错误，并在理论驱动或仿真密集型领域生成可辩护的结果。
      尚未覆盖: 领域验证门控仍有缺陷（AI CFD Scientist遗漏了16个静默失败中的2个）；向其他领域的迁移未经测试；这些系统需要专家构建的验证，新问题可能无法获得。
    - 路线: 评估基准与环境
      解决的问题: 提供标准化任务和指标（如DISCOVERYWORLD的120个任务、BAISBench的细胞注释和选择题），以比较AI科学家能力并暴露相对于人类基线的弱点。
      尚未覆盖: 基准可能无法捕捉真实世界发现的全部复杂性；人类基线有限（如BAISBench仅六名研究生）；尚无单一基准同时覆盖实验和理论科学。
    - 路线: 人机协作与验证机制
      解决的问题: 通过在高杠杆决策点插入人类判断，或使用结构化辩论、自愈执行和可验证报告来防止伪造结果，从而提高输出质量。
      尚未覆盖: 最佳协作模式取决于任务；消融研究表明精准干预优于完全自主，但可能无法扩展到所有领域；针对幻觉引用和数字的验证仍处于发展之中。
    共识:
    - 所有系统均采用基于LLM的多智能体或流水线架构，自动化从构思到写作的部分科学工作流程。
    - 验证被普遍认为是关键，但实现方式差异很大：模拟评审、内部逻辑审计、基于物理的视觉检查或基准评估。
    - 当前的AI科学家展现出潜力，但仍无法匹敌完全自主的人类研究者的可靠性和深度；它们最适合作为增强工具。
    分歧:
    - 通用 vs. 领域特定：The AI Scientist和AI Scientist-v2追求领域无关的自主性，而ReasFlow和AI CFD Scientist主张领域特定的验证门控对于产生可辩护的主张是必要的。
    - 评估方法：一些系统依赖自动评审分数，另一些使用任务基准（DISCOVERYWORLD、BAISBench），而AI Scientist-v2将真实同行评审作为最终检验，导致不同的成功标准。
    - 人类输入的角色：AutoResearchClaw表明精准的人机协作优于完全自主，而The AI Scientist和ReasFlow强调最小化人工干预，揭示了自主性与可靠性之间的张力。
    开放问题:
    - 即使领域特定的门控也会遗漏一些错误，如何使验证门控足够健壮以应对静默失败的多样性？
    - 在一个科学领域（如CFD、应用数学）上训练的框架，在多大程度上可以泛化到其他领域而不需要重新设计验证逻辑？
    - 当前的基准任务和自动评审分数是否与科学发现的长期认知价值对齐，以及我们应如何验证这种对齐？
