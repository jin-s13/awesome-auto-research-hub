  related_work_outline_zh:
  - 主流方向：证据集中于自主研究智能体的长程基准任务和效率指标，如 token、oracle 查询、力调用次数，重点在状态管理、高保真反馈解耦和可复用经验。
  - 研究共性：论文先指出闭环研究中失败或低效，再引入控制上下文、反馈或先验知识的机制，并在受控环境、基准套件或留出设置上评估最终任务质量和资源成本。
  - 关键差异：研究状态的表示、反馈来源与调度、领域特异性以及评测目标不同，包括最终基准分数、留出泛化和预测信用等。
  - 趋势演进：可见的高优先级证据集中在 2026 年，属于当前前沿内的趋势；演进方向从单次智能体运行转向无状态或递归自改进框架、经验与技能复用以及稀疏高保真留出评估。
  - 开放问题：多篇论文缺少代码、数据集、指标、基线和局限性细节；代理指标与真实科学决策效用是否一致，以及跨领域外部验证仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Long-horizon research-agent architecture and context/state management
      what_it_solves: Prevents history replay, duplicated work, and loss of progress
        by keeping durable research state outside agent dialogue or compressing it
        into a reusable improvement state; supports parallel workers and targeted
        follow-up.
      what_remains_open: Whether preserved or compressed state is sufficient for decisions
        outside training distribution and across task domains beyond tested software,
        reasoning, and deep research suites.
    - line: Closed-loop discovery and high-fidelity feedback scheduling
      what_it_solves: Separates expensive oracle/experiment feedback from search length,
        using surrogate repair, experience reuse, or held-out gating to allocate evaluations
        and reduce costly queries, experiments, or force calls.
      what_remains_open: How much improvement comes from the feedback strategy rather
        than the search policy or task-specific prior; evaluations often use narrow
        domains and small endpoint sets.
    - line: Repository and trajectory knowledge distillation for reusable skills
      what_it_solves: Turns prior GitHub or experimental trajectory knowledge into
        compact verified skills or experience libraries that can be retrieved and
        reused by research agents.
      what_remains_open: Coverage across domains and whether distilled skills transfer
        when downstream stack, task, or execution environment shifts.
    - line: Held-out transfer and generalization validation for autonomous discoveries
      what_it_solves: Checks whether agent-selected modeling or optimizer changes
        survive unseen data, molecules, or potentials rather than overfitting development
        folds.
      what_remains_open: Robustness beyond limited endpoints; several papers do not
        state limitations, and external validation across datasets, hardware, and
        user settings is absent.
    - line: Protocols and metrics for scientific explanation and benchmark comparability
      what_it_solves: Makes research-agent claims comparable through tasks, baselines,
        metrics, failure cases, and paired forecast checks that measure predictive
        credit of explanations.
      what_remains_open: Proxy metrics may not align with real decision utility; some
        preregistered tests are inconclusive, and standardized external replication
        is still missing.
    consensus:
    - Research agents are judged by both final task quality and resource efficiency,
      including token budgets, oracle queries, or force calls.
    - Closing the loop with better state, feedback, or reusable prior evidence improves
      long-horizon research efficiency and reduces duplicated or stalled exploration.
    - Held-out evaluation and multi-suite benchmark comparison are treated as stronger
      evidence than development-fold results alone.
    - Reusable artifacts, whether skills, experience libraries, or selected code,
      are valuable only if they remain effective outside the search feedback loop.
    disagreements:
    - 'Research state is represented differently: some keep state in a harness with
      stateless agents, while others compress history into a learned context-update
      state or an experience library.'
    - 'Feedback policy differs: some use cheap surrogates interleaved with sparse
      high-fidelity labels, while others freeze selected changes and evaluate once
      on held-out data or unseen potentials.'
    - 'Evaluation target differs: some optimize final benchmark scores across research
      suites, while others test held-out generalization or predictive credit of scientific
      explanations.'
    - 'Deployment domain differs: molecular relaxation, materials endpoints, ML engineering,
      and deep search/reasoning all appear, but the assumptions and metrics do not
      transfer cleanly across them.'
    open_questions:
    - Do final score, MAE, force-call, and oracle-query proxies align with real scientific
      decision utility in research-agent settings?
    - Can stateless or compressed context retain sufficient evidence for decisions
      outside the training distribution of current benchmark suites?
    - How much of the reported improvement is attributable to the agent architecture
      or feedback policy rather than task priors, subset selection, or benchmark-specific
      tuning?
    - What external validation across datasets, hardware, and user settings is needed
      to establish reproducibility for autonomous research agents?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 长程研究智能体架构与上下文/状态管理
      解决的问题: 通过把持久研究状态保存在智能体对话之外，或压缩为可复用的改进状态，防止历史重放、重复工作和进展丢失，并支持并行 worker 与针对性后续研究。
      尚未覆盖: 保存或压缩的状态在训练分布之外，以及软件、推理和深度研究套件以外的任务域中是否足够支撑决策。
    - 路线: 闭环发现与高保真反馈调度
      解决的问题: 将昂贵的 oracle/实验反馈与搜索长度解耦，用代理修复、经验复用或留出门控来分配评估，减少高代价查询、实验或力调用。
      尚未覆盖: 性能提升有多少来自反馈策略而非搜索策略或任务先验；评估常限于窄领域和小规模端点集合。
    - 路线: 仓库与轨迹知识蒸馏为可复用技能
      解决的问题: 把先前的 GitHub 仓库或实验轨迹知识转化为紧凑、经过验证的技能或经验库，供研究智能体检索和复用。
      尚未覆盖: 跨领域覆盖范围，以及下游技术栈、任务或执行环境变化后蒸馏技能的迁移效果。
    - 路线: 自主发现的留出迁移与泛化验证
      解决的问题: 检验智能体选择的建模或优化器变化是否能在未见材料、分子或势能上存续，而不是过度拟合开发折。
      尚未覆盖: 有限端点之外的鲁棒性；多篇论文未说明局限性，且缺少跨数据集、硬件和用户设置的外部验证。
    - 路线: 科学解释与基准可比性的协议和度量
      解决的问题: 通过任务、基线、指标、失败案例和成对预测检查，使研究智能体的主张可比，并度量解释的预测信用。
      尚未覆盖: 代理指标可能不与真实决策效用一致；部分预注册测试尚无定论，标准化外部复现仍然缺失。
    共识:
    - 研究智能体同时用最终任务质量和资源效率衡量，包括 token 预算、oracle 查询或力调用次数。
    - 通过更好的状态、反馈或可复用先验证据闭合回路，可以提升长程研究效率并减少重复或停滞探索。
    - 留出评估和多套基准比较被视为比仅看开发折结果更强的证据。
    - 可复用工件如技能、经验库或选定代码，只有在搜索反馈循环之外仍然有效时才有价值。
    分歧:
    - 研究状态表示不同：有的在 harness 中保持状态并使用无状态智能体，有的把历史压缩为学习到的上下文更新状态或经验库。
    - 反馈策略不同：有的用廉价代理与稀疏高保真标签交错，有的冻结选定变更后在留出数据或未见势能上评估一次。
    - 评测目标不同：有的优化多个研究套件上的最终基准分数，有的检验留出泛化或科学解释的预测信用。
    - 部署领域不同：分子弛豫、材料端点、ML 工程和深度搜索/推理均有出现，但假设和指标难以跨领域直接迁移。
    开放问题:
    - 最终分数、MAE、力调用和 oracle 查询等代理指标是否与研究智能体场景中的真实科学决策效用一致？
    - 无状态或压缩上下文能否为当前基准套件训练分布之外的决策保留足够证据？
    - 报告中的改进有多少来自智能体架构或反馈策略，而多少来自任务先验、子集选择或基准特定调优？
    - 需要怎样的跨数据集、跨硬件和跨用户设置的外部验证，才能确立自主研究智能体的可复现性？
