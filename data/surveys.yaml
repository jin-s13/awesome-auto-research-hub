      novelty or auditability, but they do not yet produce consistently trustworthy
      claims.
    - Evaluation is moving toward task completion and evidence maturity rather than
      only final output quality.
    - Explicit verification or authority constraints are needed to catch invalid or
      unsupported results.
    - Current systems remain weak on controlled, robust, falsifiable, and generalizable
      scientific work.
    disagreements:
