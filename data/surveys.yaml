  related_work_outline:
  - 'Mainstream direction: Building LLM-based multi-agent systems that automate literature
    review, survey generation, and end-to-end scientific discovery through iterative
    refinement, internal verification, and evolutionary self-improvement.'
  - 'Shared research pattern: Systems decompose scientific workflows into modular
    agent roles (retrieval, synthesis, critique, writing) and apply structured evaluation—either
    rubric-guided or benchmark-based—to iteratively improve outputs.'
  - 'Key differences: Some systems target domain-specific tasks (e.g., applied mathematics,
    single-cell omics) while others pursue domain-agnostic frameworks; evaluation
    ranges from LLM-as-judge rubrics to human-expert-annotated benchmarks; design
    philosophies split between self-evolving agents and structured tree-based planning
    with backtracking.'
  - 'Trend evolution: Within 2025–2026, the field moved from broad surveys and early
    benchmarks (BAISBench, Agentic AI survey) to concrete multi-agent systems with
    self-evolution (EvoMaster, OR-Agent) and dedicated survey engines (ARISE), accompanied
    by a growing meta-analysis of failure modes.'
  - 'Open questions: How to guarantee factual accuracy, logical coherence, and originality
    in generated surveys; how to design cross-domain evaluation standards that correlate
    with real scientific utility; how to mitigate recurring failure modes such as
    memory degradation and implementation drift in long-horizon tasks.'
  related_work_outline_zh:
  - 主流方向：构建基于大语言模型的多智能体系统，通过迭代优化、内部验证和演化式自改进，自动化文献综述、综述生成及端到端科学发现。
  - 研究共性：系统将科学工作流分解为模块化智能体角色（检索、综合、审校、写作），并采用结构化评估（评分准则或基准）迭代提升输出质量。
  - 关键差异：部分系统针对特定领域（如应用数学、单细胞组学），另一些追求领域无关性；评估方式从LLM-as-judge评分准则到人类专家标注的基准不等；设计理念分为自我演化与结构化树状规划回溯两类。
  - 趋势演进：2025至2026年间，从广泛的综述和早期基准（BAISBench、Agentic AI survey）过渡到具备自我演化能力的多智能体系统（EvoMaster、OR-Agent）和专用综述引擎（ARISE），同时伴随着对失败模式的元分析。
  - 开放问题：如何保证生成综述的事实准确性、逻辑连贯性和原创性；如何设计跨领域评估标准，使其与真实科学效用相关；如何缓解长任务中记忆退化、实现漂移等反复出现的失败模式。
  literature_review:
    line_of_work_matrix:
    - line: Automated survey and paper generation
      what_it_solves: Automatically synthesizing literature into structured surveys
        or research drafts, as in ARISE's rubric-guided iterative refinement and ReasFlow's
        integrated paper generation pipeline.
      what_remains_open: Factual hallucination, long-form coherence, and depth of
        critical analysis remain unverified; evaluations rely on LLM-based rubrics
        whose alignment with human expert judgment is not extensively validated.
    - line: General-purpose agentic frameworks for scientific discovery
      what_it_solves: Building domain-agnostic, self-evolving or structured-planning
        agents that can carry out scientific discovery cycles, exemplified by EvoMaster's
        continuous self-evolution and OR-Agent's tree-based backtracking.
      what_remains_open: The extent to which performance gains stem from the framework
        versus the underlying LLM capabilities is unclear; real-world scientific impact
        beyond benchmark scores is not demonstrated.
    - line: Evaluation and benchmarking of AI scientists
      what_it_solves: Providing realistic tasks (e.g., cell annotation, multiple-choice
        questions from literature) and human baselines to measure AI scientist capabilities,
        as shown by BAISBench.
      what_remains_open: Current benchmarks are domain-specific and lack coverage
        for literature synthesis; the relationship between proxy metrics (e.g., accuracy
        on MCQs) and genuine scientific contribution is unexplored.
    - line: Failure analysis and design principles
      what_it_solves: Cataloging recurring failure modes (bias, drift, memory degradation,
        weak scientific taste) and extracting design guidelines for more robust autonomous
        research systems, as in 'Why LLMs Aren't Scientists Yet'.
      what_remains_open: The proposed design principles have not been systematically
        tested across diverse systems; it is unknown whether the six failure modes
        generalize to other domains or agent architectures.
    consensus:
    - Multi-agent decomposition of the scientific workflow (literature search, synthesis,
      verification, writing) is the dominant paradigm for automating literature intelligence.
    - Iterative refinement with feedback—either from rubric-based reviewer agents
      or from environmental benchmarks—improves output quality across systems.
    - Current AI systems cannot yet achieve fully autonomous, trustworthy literature
      synthesis; human oversight or collaboration remains necessary.
    disagreements:
    - 'Evaluation methodology: some systems rely on LLM-based rubrics and automated
      scores, while others use human-expert-designed tasks with ground-truth answers,
      leading to different claims about system competence.'
    - 'Domain specificity: systems like ReasFlow and BAISBench target narrow domains
      (mathematics, omics), whereas EvoMaster and OR-Agent aim for domain-agnostic
      operation, which creates tension between depth and breadth.'
    - 'Agent design philosophy: EvoMaster emphasizes continuous self-evolution with
      minimal human intervention, while OR-Agent employs structured tree-based planning
      with backtracking, reflecting different views on how to control exploration
      in scientific reasoning.'
    open_questions:
    - How can we verify the factual accuracy and logical soundness of automatically
      generated surveys without relying solely on LLM-based evaluation?
    - What cross-domain benchmarks and metrics would reliably predict the real-world
      utility of an AI scientist in literature tasks?
    - Can the recurring failure modes (memory degradation, implementation drift, overconfidence)
      be systematically mitigated through architectural changes, or are they inherent
      to current LLM-based agents?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动化综述与论文生成
      解决的问题: 从文献中自动合成结构化综述或研究草稿，如ARISE的评分准则引导迭代优化和ReasFlow的集成式论文生成流水线。
      尚未覆盖: 事实幻觉、长篇连贯性和批判性分析的深度尚未得到充分验证；评估依赖基于LLM的评分准则，其与人类专家判断的一致性未广泛验证。
    - 路线: 通用科学发现智能体框架
      解决的问题: 构建领域无关、可自我演化或结构化规划的智能体，执行科学发现循环，代表为EvoMaster的持续自演化与OR-Agent的树状回溯规划。
      尚未覆盖: 性能提升在多大程度上归因于框架设计而非底层LLM能力尚不明确；尚未展示超越基准分数的真实世界科学影响。
    - 路线: AI科学家的评估与基准
      解决的问题: 提供现实任务（如细胞注释、文献选择题）和人类基线，以衡量AI科学家能力，如BAISBench所示。
      尚未覆盖: 现有基准仅覆盖特定领域，缺乏对文献综合能力的评估；代理指标（如选择题准确率）与真实科学贡献之间的关系尚未探索。
    - 路线: 失败分析与设计原则
      解决的问题: 梳理反复出现的失败模式（偏见、漂移、记忆退化、科学品味薄弱），并提炼出更稳健的自主研究系统的设计指南，如'Why LLMs Aren't
        Scientists Yet'所述。
      尚未覆盖: 所提出的设计原则尚未在多样化系统上得到系统检验；六个失败模式是否普遍适用于其他领域或智能体架构尚不可知。
    共识:
    - 将科学工作流（文献检索、综合、验证、写作）分解为多个智能体是自动化文献智能的主流范式。
    - 基于反馈的迭代优化——无论是来自评分准则驱动的评审智能体，还是来自环境基准——可提升系统输出质量。
    - 当前AI系统尚无法实现完全自主、可信赖的文献综合，仍需人类监督或协作。
    分歧:
    - 评估方法论：部分系统依赖基于LLM的评分准则和自动化分数，而另一些采用人类专家设计的任务及其标准答案，导致对系统能力的不同论断。
    - 领域专指性：ReasFlow和BAISBench等系统针对狭窄领域（数学、组学），而EvoMaster和OR-Agent追求领域无关性，造成了深度与广度之间的张力。
    - 智能体设计理念：EvoMaster强调在最少人工干预下持续自我演化，而OR-Agent采用结构化树状规划与回溯，反映了对科学推理中探索控制方式的不同观点。
    开放问题:
    - 如何在不完全依赖LLM评估的情况下，验证自动生成综述的事实准确性和逻辑合理性？
    - 哪些跨领域基准和指标能够可靠预测AI科学家在文献任务中的真实效用？
    - 反复出现的失败模式（记忆退化、实现漂移、过度自信）能否通过架构变更得到系统性缓解，还是当前基于LLM的智能体所固有的局限？
