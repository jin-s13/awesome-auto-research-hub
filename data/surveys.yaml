    - 路线: 端到端自主研究智能体
      解决的问题: 自动化研究构思、代码实现、实验执行和论文写作，降低单篇生成成本并支持开放式探索。
      尚未覆盖: 跨任务和跨领域的自主性不稳定；接受或有效性的证明场景较窄，领域可靠性尚未建立。
    - 路线: 面向发现的基准环境
      解决的问题: 通过隐藏目标、冻结数据或真实领域数据，为科学发现智能体提供受控任务和指标。
      尚未覆盖: 自动任务完成和证据指标可能无法反映真实科学效用；覆盖范围受限于特定领域、基座模型和评估标准。
    - 路线: 验证与权威机制
      解决的问题: 通过物理感知检查、视觉-语言门控或确定性程序权威，捕获无效输出并约束智能体编辑。
      尚未覆盖: 已知门控仍会漏检植入的静默失败，且证据多为单一领域，跨领域和跨仿真迁移未经验证。
    - 路线: 自动评审与证据质量评分
      解决的问题: 使用模拟评审或基于量规的 LLM 评委，规模化评估智能体论文和证据支持。
      尚未覆盖: 与人类判断的一致性仅得到部分验证；证据成熟度分数可能更多反映可审计性而非真正发现。
    共识:
    - 自动化执行和论文生成若没有有效性检查，仍然不够。
    - 当前智能体能胜任分析和文档记录，但在对照、稳健性、可证伪性等科学判断方面较弱。
    - 评估正从单一任务成功转向多维度证据质量。
    - 领域特定验证能发现仅靠代码执行无法发现的静默失败。
    分歧:
    - 一种路线通过模拟环境中完成隐藏任务评估发现，另一种按冻结数据对证据成熟度评分，还有一种按领域指标改进评估。
    - 验证权威放在不同信号上，如模拟专家评审、对渲染输出的视觉-语言检查，或确定性程序约束。
    - 关于 AI 生成研究质量的主张存在冲突：一些结果报告接近人类评审或工作坊级接受，而基于证据的基准显示分数停留在平台期且智能体之间无可区分差异。
    - 领域重点不同，从通用机器学习发现到专门的 CFD、组学和时序预测流程不等。
    开放问题:
    - 自动评委和验证器能否迁移到它们被验证之外的领域和基座模型？
    - 怎样的评估设计能证明智能体进行的是真正发现，而不是胜任复现或参数搜索？
    - 领域特定验证门控应如何与对照、稳健性和可证伪性等一般科学标准结合？
    - 哪些缺失的代码、数据集、基线和局限性细节属于验证缺口，而不能证明系统不具备这些属性？
