  related_work_outline:
  - 'Mainstream direction: End-to-end autonomous research agents that integrate ideation,
    experimentation, analysis, and manuscript generation, increasingly with verification
    or review gates.'
  - 'Shared research pattern: Systems generate claims from frozen data or domain simulators,
    execute computational experiments, and evaluate outputs through automated rubrics,
    review gates, or benchmark tasks; evaluation emphasizes evidence quality over
    reproduction.'
  - 'Key differences: Domain-general machine-learning workflows versus domain-specific
    verification; evaluation by simulated reviewer, virtual environment, blind benchmark,
    or human peer review; collaboration modes range from human PI-agent to fully autonomous
    tree search.'
  - 'Trend evolution: From 2024 broad full-pipeline frameworks and discovery environments,
    through 2025 agentic search and first workshop peer-review acceptance, to 2026
    domain-specific validity gates and evidence-grounded benchmarks showing current
    agents plateau on scientific judgment.'
  - 'Open questions: Whether generated claims qualify as real discovery; how to close
    silent-failure and robustness gaps; whether automated judges align with human
    trust; and how far single-domain or single-base-model results generalize.'
  related_work_outline_zh:
  - 主流方向：构建端到端自主科研智能体，集构思、实验、分析与论文生成为一体，并越来越多地加入验证或评审门控。
  - 研究共性：系统在冻结数据或领域仿真器上生成主张，执行计算实验，并通过自动评分、评审门控或基准任务评估证据质量而非单纯复现。
  - 关键差异：通用机器学习流程与领域特定验证并存；评估方式涵盖模拟评审、虚拟环境、盲测基准和人类同行评审；交互模式从人类PI-智能体到全自主树搜索不同。
  - 趋势演进：从2024年广覆盖端到端框架与发现环境，到2025年智能体树搜索及首篇同行评审工作坊论文，再到2026年领域特定验证和证据锚定基准显示当前智能体科学判断停滞。
  - 开放问题：生成主张是否算真正发现；如何弥合静默失败与稳健性缺口；自动评审是否与人类信任一致；单一领域或单一基座模型结果能否泛化。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end autonomous research-agent pipelines
      what_it_solves: Integrating ideation, experiment execution, visualization, analysis,
        and manuscript generation into a single loop
      what_remains_open: Peer-review success is inconsistent and verification depth
        remains insufficient for trustworthy discovery
    - line: Domain-specific scientific discovery agents with validity gates
      what_it_solves: Catching silent failures in applied mathematics and computational
        fluid dynamics via logic checks, knowledge retrieval, and physics-aware visual
        verification
      what_remains_open: Gates still miss some silent failures and evidence is limited
        to specific scientific domains
    - line: Discovery benchmark environments
      what_it_solves: Standardizing complete discovery cycles and measuring task completion,
        task-relevant actions, and explanatory knowledge across many tasks
      what_remains_open: Virtual-environment success may not transfer to real scientific
        utility and strong baseline agents still struggle
    - line: Evidence-grounded evaluation and automated review
      what_it_solves: Providing scalable rubric-based assessment of generated papers
        or claims without per-instance human scoring
      what_remains_open: Current agents plateau and lack controls, robustness, falsifiability,
        and cross-dataset generalization
    - line: Reproducible open-source agent infrastructure
      what_it_solves: Turning isolated agent ideas into runnable code, artifacts,
        and reusable scientific workflows
      what_remains_open: External validation across hardware, domains, datasets, and
        base models is not established
    consensus:
    - Autonomous discovery systems share a pipeline spanning hypothesis or idea formation,
      experiment execution, analysis, and manuscript drafting.
    - Verification or review gates are becoming central to detect invalid claims and
      silent failures.
    - Systems can execute and document analyses competently, but evidence quality
      and trustworthy scientific judgment are not yet closed.
    disagreements:
    - Some systems target broad machine-learning domains, while others embed domain-specific
      physical, mathematical, or knowledge-based verification.
    - 'Evaluation targets differ: simulated reviewer scores, virtual-task completion,
      blind peer-reviewed evidence maturity, or human workshop peer review.'
    - 'Interaction modes differ: human expert as principal investigator with agent
      as graduate student versus fully autonomous agentic tree search.'
    - 'Success criteria differ: generated-paper acceptance thresholds, physical-simulation
      error reduction, or evidence-maturity rubric scores.'
    open_questions:
    - Can evidence-maturity rubrics predict whether a generated claim is valid outside
      frozen benchmark data?
    - How can domain-specific verification gates be extended across domains without
      missing silent failures?
    - Does peer-review acceptance of AI-generated workshop papers reflect trustworthy
      scientific discovery or only formatting and basic competence?
    - How sensitive are agent rankings to base model choice, task design, and judge
      rubric selection?
  literature_review_zh:
    研究路线矩阵:
